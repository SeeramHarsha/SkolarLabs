<html lang="en">
<head>

<title>Grade 10 · Chapter 4 — Carbon and its Compounds | Botclub Labs</title>

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 4: CARBON AND ITS COMPOUNDS
   (NCERT Science, jesc104) — Activities 4.1 – 4.12.
   Every scene runs a continuous animation loop: controls only set targets.
   Flames, soot, colours, gases, foam and oil drops follow real
   stoichiometry, rate laws and physical data, compressed in time where
   needed so that each change can be watched.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

   alkanes −161.5 / −88.6 / −42.1 / −0.5, acids 100.8 / 118.1 / 141.2 /

/* =====================================================================
   4.3 BURNING CARBON COMPOUNDS ON A SPATULA — IS THERE SOOT?
   Naphthalene C₁₀H₈ (C:H 1.25, aromatic), camphor C₁₀H₁₆O (C:H 0.63,
   bicyclic) and ethanol C₂H₅OH (C:H 0.33).
   Burning rates on a spatula (real): naphthalene 3.3 mg/s, camphor
   4 mg/s, ethanol 8 mg/s; heats of combustion 40 / 39 / 27 kJ/g →
   Q ≈ 130 / 155 / 215 W. Flame height (Heskestad) L = 0.235 Q^0.4 − 1.02 D
   (Q in kW, D = 1.5 cm) → ≈ 9 / 10 / 11 cm.
   Soot yield (fraction of the fuel leaving as carbon): naphthalene 8 %,
   camphor 3 %, ethanol ≈ 0. A cold plate held IN the flame quenches it
   and catches ~80 % of the soot; above the tip, the catch falls off
   over ≈ 3 cm. Every fuel first fogs a cold plate with water (its H).
   Time runs 4× faster than real.
   ===================================================================== */
const A3_F={
  naph:{n:'Naphthalene',f:'C₁₀H₈',m:200,rate:3.3,dh:40,soot:0.08,lum:1.0,ch:'10 : 8',eq:'C₁₀H₈ + 12 O₂ → 10 CO₂ + 4 H₂O', col:'#ffffff', solid:true},
  camph:{n:'Camphor',f:'C₁₀H₁₆O',m:200,rate:4.0,dh:39,soot:0.03,lum:0.75,ch:'10 : 16',eq:'2 C₁₀H₁₆O + 27 O₂ → 20 CO₂ + 16 H₂O', col:'#f6f6f6', solid:true},
  eth:{n:'Alcohol (ethanol)',f:'C₂H₅OH',m:400,rate:8.0,dh:27,soot:0.0,lum:0.0,ch:'2 : 6',eq:'C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O', col:'rgba(47,143,224,0.25)', solid:false}};
function buildA3(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const SX=360, SY=440, PXCM=14, SPEED=4;
  let fk='naph', t=0; const S={left:0, lit:0, burning:false, match:sprP(640,470), matchLit:0, phase:'idle', T:0, plateOn:false, plateH:10, py:sprP(640,120), plateT:25, soot:0, fog:0, sootP:[], smoke:[], deposit:[]};
  const load=()=>{ S.left=A3_F[fk].m; S.lit=0; S.burning=false; S.phase='idle'; S.sootP=[]; };
  load();
  side.innerHTML=`
    <div class="control-group"><label>Carbon compound on the spatula</label><div class="chip-wrap">${Object.keys(A3_F).map(k=>`<button class="chip-btn${k==='naph'?' active':''}" data-f="${k}">${A3_F[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="light">🔥 Light it</button><button class="toggle-btn" id="rl">↺ Reload</button></div></div>
    <div class="control-group"><label>Metal plate height above the spatula <span class="val" id="hv">10 cm</span></label><input type="range" id="ph" min="3" max="20" step="0.5" value="10">
      <div class="toggle-group"><button class="toggle-btn navy" id="plate">⬇ Hold plate over the flame</button><button class="toggle-btn" id="wipe">Wipe plate</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Flame',COL.yellow)}${card('r2','Smoke',COL.ink)}${card('r3','Soot on plate',COL.red)}${card('r4','C : H atoms',COL.red)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-f]',b=>{ fk=b.dataset.f; load(); fb.className='fb hidden'; });
  $('#light').onclick=()=>{ if(S.burning||S.left<1||S.phase!=='idle') return; S.phase='match'; S.T=0; };
  $('#rl').onclick=()=>{ load(); };
  $('#ph').oninput=e=>{ S.plateH=+e.target.value; setv($,'hv',fmt(S.plateH,1)+' cm'); };
  $('#plate').onclick=()=>{ S.plateOn=!S.plateOn; setBtn($('#plate'),S.plateOn?'⬆ Lift the plate away':'⬇ Hold plate over the flame','navy'); };
  $('#wipe').onclick=()=>{ S.soot=0; S.fog=0; S.deposit=[]; };
  animLoop(dt=>{
    t+=dt; const F=A3_F[fk];
    /* match: comes in lit, touches the fuel for 1.2 s, leaves */
    S.T+=dt; let mx=640, my=470;
    if(S.phase==='match'){ S.matchLit=approach(S.matchLit,1,6,dt); mx=SX+30; my=SY-8; if(S.T>1.4){ S.burning=true; S.phase='leave'; S.T=0; } }
    else if(S.phase==='leave'){ if(S.T>0.9){ S.phase='idle'; S.matchLit=0; } }
    else S.matchLit=approach(S.matchLit,0,3,dt);
    sprPStep(S.match,mx,my,dt,40,10);
    /* burning */
    let mdot=0; if(S.burning){ mdot=F.rate*(S.left>12?1:S.left/12); S.left=Math.max(0,S.left-mdot*dt*SPEED); if(S.left<=0.05) S.burning=false; }
    S.lit=approach(S.lit,S.burning?1:0,S.burning?4:2.5,dt);
    const Q=mdot*F.dh/1000, Lcm=Math.max(0,(0.235*Math.pow(Math.max(Q,1e-4),0.4)-0.0153)*100)*S.lit, Lpx=Lcm*PXCM;
    /* plate: tongs bring it to the chosen height; it warms in the flame */
    const plY=SY-S.plateH*PXCM; sprPStep(S.py,S.plateOn?SX:650,S.plateOn?plY:110,dt,35,10);
    const inPlume=S.plateOn&&Math.abs(S.py.x.x-SX)<40;
    const hGap=S.plateH-Lcm, cap=inPlume&&S.burning?(hGap<0?0.8:0.8*Math.exp(-hGap/3)):0;
    S.plateT=approach(S.plateT,inPlume&&S.burning?25+Q*1400*Math.exp(-Math.max(0,hGap)/6):25,0.25,dt);
    if(inPlume&&S.burning) S.fog=S.plateT<60?Math.min(1,S.fog+dt*0.9):Math.max(0,S.fog-dt*0.6); else S.fog=Math.max(0,S.fog-dt*0.3);
    const sootRate=mdot*F.soot*S.lit; // mg/s (real)
    S.soot+=sootRate*cap*dt*SPEED;
    if(sootRate>0&&Math.random()<sootRate*6*dt*SPEED) sootAdd(S.sootP,SX,SY-Lpx*0.85,90+Lpx*0.3);
    if(sootRate>0&&Math.random()<sootRate*3*dt*SPEED) smokeAdd(S.smoke,SX+(Math.random()-0.5)*10,SY-Lpx,'#3a3a3a');
    const ceil=inPlume?()=>S.py.y.x+6:undefined;
    sootStep(S.sootP,dt,inPlume?S.py.y.x+6:undefined,SX-90,SX+90,p=>{ if(S.deposit.length<220) S.deposit.push({x:p.x-S.py.x.x,r:p.r*1.4}); });
    smokeStep(S.smoke,dt,3.2,ceil);
    const lumE=F.lum*S.lit;
    setMany($,{r1:S.lit<0.05?'—':F.lum>0.5?'yellow, sooty':F.lum>0.1?'yellow':'pale blue', r2:S.lit<0.05?'—':F.soot>0.05?'thick black':F.soot>0?'some black':'none', r3:fmt(S.soot,2)+' mg', r4:F.ch});
    if(S.soot>0.4) fbSet(fb,'warn',`Black soot (carbon) on the plate: ${F.n.toLowerCase()} is rich in carbon and does not burn completely.`);
    else if(!F.soot&&S.burning&&inPlume&&S.T>2) fbSet(fb,'ok','Clean blue flame and no soot — ethanol burns completely. The mist on the cold plate is water.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,520);
    // ruler (cm above the spatula)
    line(ctx,90,SY,90,SY-20*PXCM,COL.mid,1.6); for(let c=0;c<=20;c++){ const y=SY-c*PXCM; line(ctx,90,y,c%5?96:102,y,COL.mid,1.2); if(c%5===0) textAt(ctx,c+' cm',84,y+4,{align:'right',size:11,weight:600,color:COL.muted}); }
    // stand holding the spatula
    line(ctx,160,520,160,SY-40,COL.ink,5); rect(ctx,120,512,90,8,COL.ink,'#fff',2);
    line(ctx,160,SY-2,SX-20,SY-2,COL.ink,3); circ(ctx,160,SY-2,6,COL.ink,'#fff',2);
    spatula(ctx,SX+14,SY,Math.PI,0,null);
    const lf=clamp(S.left/F.m,0,1); if(lf>0.01){ ctx.save(); ctx.beginPath(); ctx.ellipse(SX,SY-3,14*Math.sqrt(lf)+2,6*Math.sqrt(lf)+1,0,Math.PI,0); ctx.fillStyle=F.solid?(S.burning?'#fff7e0':F.col):F.col; ctx.fill(); ctx.strokeStyle=F.solid?COL.red:COL.blue; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
    // flame
    const pyy=S.py.y.x+5, cut=inPlume&&SY-5-Lpx<pyy;
    if(S.lit>0.02){ ctx.save(); if(cut){ ctx.beginPath(); ctx.rect(0,pyy,SW,SH); ctx.clip(); } flameLum(ctx,SX,SY-5,18+Lpx*0.18,Lpx,t,lumE,0); ctx.restore();
      if(cut){ const ex=(pyy-(SY-5-Lpx)), sp=Math.min(110,ex*0.9); ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=mixCol('#3f7fe0',COL.yellow,lumE); ctx.fillStyle=lumE>0.05?rgba(COL.yellow,0.3):'rgba(63,127,224,0.12)'; ctx.beginPath(); ctx.moveTo(SX-sp-10,pyy); ctx.quadraticCurveTo(SX-sp*0.5,pyy+10+Math.sin(t*17)*2,SX-12,pyy+26); ctx.lineTo(SX+12,pyy+26); ctx.quadraticCurveTo(SX+sp*0.5,pyy+10+Math.sin(t*19)*2,SX+sp+10,pyy); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); } }
    sootDraw(ctx,S.sootP); smokeDraw(ctx,S.smoke,3.2);
    // match
    splinter(ctx,S.match.x.x,S.match.y.x,-0.35,S.matchLit,t);
    // plate held in tongs
    const px=S.py.x.x, py=S.py.y.x; tongsDraw(ctx,px+120,py-2,0,0.2,150);
    rect(ctx,px-120,py-6,240,10,COL.ink,'#dfe4ea',2.4);
    if(S.fog>0.02){ ctx.save(); ctx.globalAlpha=S.fog*0.8; for(let k=0;k<22;k++) circ(ctx,px-100+k*9.5,py+7+(k%3),1.8,COL.blue,'rgba(47,143,224,0.35)',1); ctx.restore(); }
    if(S.deposit.length){ ctx.save(); ctx.fillStyle='#1b1b1b'; const a=clamp(S.soot/1.2,0.15,1); ctx.globalAlpha=a; S.deposit.forEach(d=>{ ctx.beginPath(); ctx.ellipse(px+d.x,py+5,d.r*2,d.r,0,0,Math.PI*2); ctx.fill(); }); ctx.restore(); }
    textAt(ctx,'metal plate '+fmt(S.plateT,0)+' °C',px,py-14,{align:'center',size:11.5,weight:700,color:COL.muted});
    // labels
    textAt(ctx,F.n+'  '+F.f,SX,SY+44,{align:'center',size:15,weight:800,color:COL.red});
    textAt(ctx,fmt(S.left,0)+' mg left',SX,SY+62,{align:'center',size:12,weight:600,color:COL.muted});
    if(S.lit>0.2) leader(ctx,SX+12,SY-Lpx*0.6,SX+120,SY-Lpx*0.6-30,'flame '+fmt(Lcm,1)+' cm',F.lum>0.3?COL.yellow:COL.blue);
    if(S.burning) eqStrip(ctx,[{t:F.eq}].concat(F.soot?[{t:'   (+ C, soot)',col:COL.red}]:[]),470,40,clamp(S.T,0,1),13);
    timeTagPx(ctx,SW-10,'4× speed');
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.4 BUNSEN BURNER — AIR HOLE, YELLOW SOOTY FLAME vs BLUE FLAME
   Turning the collar opens the air hole; the gas jet entrains primary
   air λp (fraction of the air needed for complete burning, 0 → 0.8).
   Equivalence ratio of the premix φ = 1/λp.
   • Soot glows yellow while λp < ≈0.3 (luminosity fades over 0.18–0.42).
   • The blue inner cone is a premixed flame whose height = gas speed ÷
     burning speed: S_L(φ) = 0.38·exp(−2.2(φ − 1.06)²) m/s (methane
     peak 0.38 m/s near φ ≈ 1.06).
   • Outer (diffusion) flame height ∝ gas flow and shrinks as more of the
     air comes in through the hole.
   • Temperature: luminous ≈ 1000 °C, blue up to ≈ 1550 °C.
   A cold vessel held in a luminous flame gets a black carbon deposit —
   "if the bottoms of vessels are blackened, the air holes are blocked".
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BX=330, BASE=520, TOPB=BASE-200;
  let t=0, gas=0.7, air=0; const S={a:spr(0), lit:0, on:true, pan:false, panY:sprP(BX,TOPB-420), soot:0, dep:[], sp:[], sm:[], flick:0, Tf:25};
  side.innerHTML=`
    <div class="control-group"><label>Air hole (turn the collar) <span class="val" id="av">closed</span></label><input type="range" id="air" min="0" max="1" step="0.01" value="0"></div>
    <div class="control-group"><label>Gas tap <span class="val" id="gv">70 %</span></label><input type="range" id="gas" min="0.2" max="1" step="0.01" value="0.7"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn navy" id="pan">⬇ Hold a cooking vessel over it</button><button class="toggle-btn" id="clean">Clean vessel</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Flame',COL.yellow)}${card('r2','Primary air',COL.blue)}${card('r3','Flame temperature',COL.red)}${card('r4','Soot on vessel',COL.red)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#air').oninput=e=>{ air=+e.target.value; setv($,'av',air<0.03?'closed':air>0.97?'fully open':Math.round(air*100)+' % open'); };
  $('#gas').oninput=e=>{ gas=+e.target.value; setv($,'gv',Math.round(gas*100)+' %'); };
  $('#pan').onclick=()=>{ S.pan=!S.pan; setBtn($('#pan'),S.pan?'⬆ Take the vessel away':'⬇ Hold a cooking vessel over it','navy'); };
  $('#clean').onclick=()=>{ S.soot=0; S.dep=[]; };
  animLoop(dt=>{
    t+=dt; springTo(S.a,air,40,9,dt); const a=clamp(S.a.x,0,1);
    const lp=0.8*a, phi=1/Math.max(0.02,lp), SL=0.38*Math.exp(-2.2*Math.pow(phi-1.06,2));
    const lum=1-smooth01(0.18,0.42,lp), cone=smooth01(0.28,0.5,lp);
    const Ho=gas*(150+120*lum)*(1-0.2*a), Hc=Math.min(Ho*0.8,18*gas/Math.max(SL,0.01)), Wf=34+10*gas;
    S.Tf=approach(S.Tf,1000+550*smooth01(0.2,0.7,lp),2,dt);
    /* vessel: pan bottom 150 px above the barrel; soot when the luminous flame touches it */
    const panBot=TOPB-150; sprPStep(S.panY,BX,S.pan?panBot:TOPB-420,dt,30,10);
    const touch=S.pan&&Math.abs(S.panY.y.x-panBot)<25&&Ho>140;
    if(touch&&lum>0.1){ S.soot+=lum*gas*0.25*dt; if(S.dep.length<260&&Math.random()<lum*gas*14*dt) S.dep.push({x:(Math.random()-0.5)*(60+Ho*0.25),r:2+Math.random()*4}); }
    if(lum>0.35&&Math.random()<lum*gas*18*dt&&!touch) smokeAdd(S.sm,BX+(Math.random()-0.5)*10,TOPB-Ho*0.95,'#555');
    smokeStep(S.sm,dt,2.4);
    setMany($,{r1:lum>0.6?'yellow, sooty':lum>0.15?'yellow-tipped':cone>0.6?'blue (inner cone)':'pale blue', r2:Math.round(lp*100)+' % of needed air', r3:'≈ '+Math.round(S.Tf/10)*10+' °C', r4:S.soot<0.02?'none':S.soot<0.3?'light':'black'});
    if(touch&&lum>0.5) fbSet(fb,'warn','Air hole closed: not enough oxygen — unburnt carbon glows yellow and blackens the vessel.');
    else if(lp>0.5) fbSet(fb,'ok','Air hole open: gas and air are premixed, burning is complete — clean, hot blue flame.');
    else fb.className='fb hidden';
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BASE);
    // gas inlet + rubber tube from the tap
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(BX+40,BASE-26); ctx.bezierCurveTo(BX+140,BASE-26,BX+160,BASE-4,BX+300,BASE-8); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=9; ctx.stroke();
    ctx.setLineDash([6,12]); ctx.lineDashOffset=t*(30+gas*90); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    rect(ctx,BX+300,BASE-40,34,40,COL.ink,'#fff',2.4); textAt(ctx,'gas',BX+317,BASE-48,{align:'center',size:12,weight:700,color:COL.yellow});
    // base
    ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.8; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(BX-70,BASE); ctx.lineTo(BX-52,BASE-22); ctx.lineTo(BX+52,BASE-22); ctx.lineTo(BX+70,BASE); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    rect(ctx,BX+18,BASE-32,26,12,COL.ink,'#fff',2.2);
    // barrel
    rect(ctx,BX-16,TOPB,32,BASE-22-TOPB,COL.ink,'#fff',2.8);
    // jet inside (seen through the hole) + gas / air streams up the barrel
    ctx.save(); ctx.beginPath(); ctx.rect(BX-14,TOPB,28,BASE-24-TOPB); ctx.clip();
    for(let k=0;k<7;k++){ const yy=BASE-40-((t*(80+gas*160)+k*34)%(BASE-60-TOPB)); line(ctx,BX-4+Math.sin(k)*3,yy,BX-4+Math.sin(k)*3,yy-10,COL.yellow,2.2);
      if(a>0.05){ const y2=BASE-60-((t*(80+gas*160)*1.1+k*34+17)%(BASE-80-TOPB)); ctx.globalAlpha=clamp(a*1.3,0,1); line(ctx,BX+6-Math.sin(k)*3,y2,BX+6-Math.sin(k)*3,y2-10,COL.blue,2.2); ctx.globalAlpha=1; } }
    ctx.restore();
    // collar with the air hole (the hole slides open as the collar turns)
    const cy=BASE-72; rect(ctx,BX-21,cy-18,42,36,COL.ink,'#eef2f7',2.6); const hw=4+24*a;
    ctx.save(); rrect(ctx,BX-hw/2,cy-9,hw,18,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    for(let k=0;k<5;k++){ const ly=cy-16+k*8; line(ctx,BX+21,ly+((t*a*20)%8),BX+24,ly+((t*a*20)%8),COL.mid,1); }
    textAt(ctx,'air hole',BX-120,cy+4,{align:'right',size:12,weight:700,color:COL.blue});
    // air being drawn in
    if(a>0.03){ for(let k=0;k<3;k++){ const ph=((t*(0.6+a*1.2)+k/3)%1); const x0=BX-110+ph*85, y0=cy+(k-1)*16*(1-ph); ctx.save(); ctx.globalAlpha=clamp(a*1.5,0,1)*Math.sin(Math.PI*ph);
      vec(ctx,x0-22,y0,x0,y0,COL.blue,2.4); ctx.restore(); } }
    // flame
    S.lit=1; const fy=TOPB-1, pyB=S.panY.y.x, cut=S.pan&&fy-Ho*1.1<pyB; ctx.save(); if(cut){ ctx.beginPath(); ctx.rect(0,pyB,SW,SH); ctx.clip(); }
    if(lum>0.05) glow(ctx,BX,fy-Ho*0.55,Ho*0.8,COL.yellow,0.3*lum);
    const fl=(0.10*lum+0.03)*Math.sin(t*(11-5*a))+0.04*Math.sin(t*17.3), sw=Math.sin(t*(3.3+6*a))*Wf*0.35*lum;
    const H1=Ho*(1+fl);
    ctx.save(); ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(BX-Wf/2,fy); ctx.bezierCurveTo(BX-Wf*0.95,fy-H1*0.45,BX-Wf*0.25+sw,fy-H1*0.8,BX+sw,fy-H1); ctx.bezierCurveTo(BX+Wf*0.25+sw,fy-H1*0.8,BX+Wf*0.95,fy-H1*0.45,BX+Wf/2,fy); ctx.closePath();
    ctx.fillStyle=lum>0.05?rgba(COL.yellow,0.18+0.35*lum):'rgba(110,90,220,0.08)'; ctx.fill(); ctx.strokeStyle=mixCol('#7a6ad8',COL.yellow,lum); ctx.lineWidth=2.8; ctx.stroke(); ctx.restore();
    if(lum>0.3){ ctx.save(); ctx.globalAlpha=lum*0.9; ctx.beginPath(); ctx.moveTo(BX-Wf*0.25,fy-H1*0.25); ctx.quadraticCurveTo(BX+sw*0.6,fy-H1*0.95,BX+Wf*0.25,fy-H1*0.25); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }

      ctx.beginPath(); ctx.moveTo(BX-sp,pyB+1); ctx.quadraticCurveTo(BX-sp*0.5,pyB+12+Math.sin(t*13)*3,BX-18,pyB+34); ctx.lineTo(BX+18,pyB+34); ctx.quadraticCurveTo(BX+sp*0.5,pyB+12+Math.sin(t*15)*3,BX+sp,pyB+1); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }

    ctx.restore();

}

/* =====================================================================
   4.5 OXIDATION OF ETHANOL BY ALKALINE KMnO₄
   5 % KMnO₄ = 0.316 M; one drop (0.05 mL) = 0.0158 mmol MnO₄⁻.
   4 MnO₄⁻ + 3 C₂H₅OH → 4 MnO₂ + 3 CH₃COO⁻ + OH⁻ + 4 H₂O
   3 mL of 1 % ethanol = 0.514 mmol → 0.685 mmol MnO₄⁻ = 43 drops.
   (3 mL of absolute ethanol = 51 mmol would need ≈ 4300 drops — so the
   end point is only reachable with a little ethanol.)
   Each drop lands as a purple cloud that spreads (diffusion) and fades:
   d[MnO₄⁻]/dt = −k(T)·[EtOH]/([EtOH]+0.015 M)·[MnO₄⁻], k from Arrhenius (Ea 50 kJ/mol):
   warm bath 60 °C → fades in ≈ 4 s; cold 25 °C → ≈ 8× slower.
   Visible purple ≥ 0.01 mM. Once the ethanol is used up nothing is
   left to reduce MnO₄⁻, so the purple colour stays.
   ===================================================================== */
function buildA5(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=300, BTOP=240, BBOT=420, TW=46, TH=225, TBOT=405, DROP=0.0158, MNO4='#7b2d9e';
  const ETH={d1:{n:'1 % ethanol',E:0.514},d2:{n:'2 % ethanol',E:1.03},abs:{n:'absolute ethanol',E:51.4}};
  let t=0, ek='d1'; const S={};
  const reset=()=>Object.assign(S,{E:ETH[ek].E, E0:ETH[ek].E, bulk:0, clouds:[], mno2:0, drops:0, V:3, auto:false, acc:0, sq:spr(0), falling:[], hist:[], flecks:[]});
  let heat=true, Tb=60; reset();
  side.innerHTML=`
    <div class="control-group"><label>In the test tube (3 mL)</label><div class="chip-wrap">${Object.keys(ETH).map(k=>`<button class="chip-btn${k==='d1'?' active':''}" data-e="${k}">${ETH[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><label>5 % alkaline KMnO₄</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="d1">+ 1 drop</button><button class="toggle-btn" id="d5">+ 5 drops</button><button class="toggle-btn" id="auto">▶ Drop by drop</button></div></div>
    <div class="control-group"><label>Water bath <span class="val" id="tv">60 °C</span></label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="warm">Warm (60 °C)</button><button class="toggle-btn" id="cold">Cold (25 °C)</button><button class="toggle-btn" id="rs">↺ Fresh tube</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Drops added',COL.yellow)}${card('r2','Ethanol left',COL.red)}${card('r3','Purple colour',COL.ink)}${card('r4','Drops needed',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-e]',b=>{ ek=b.dataset.e; reset(); fb.className='fb hidden'; setBtn($('#auto'),'▶ Drop by drop',''); });
  const queue=n=>{ S.acc+=n; };
  $('#d1').onclick=()=>queue(1); $('#d5').onclick=()=>queue(5);
  $('#auto').onclick=()=>{ S.auto=!S.auto; setBtn($('#auto'),S.auto?'⏸ Stop':'▶ Drop by drop',S.auto?'active':''); };
  toggleWire([$('#warm'),$('#cold')],b=>{ heat=b.id==='warm'; });
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; setBtn($('#auto'),'▶ Drop by drop',''); };
  let nextDrop=0;
  animLoop(dt=>{
    t+=dt; Tb=approach(Tb,heat?60:25,0.5,dt); setv($,'tv',fmt(Tb,0)+' °C');
    const kT=Math.exp(-50000/8.314*(1/(Tb+273)-1/333)); // Arrhenius factor, 1 at 60 °C
    /* dropper: one drop every 0.45 s from the queue (or auto) */
    nextDrop-=dt; if(S.auto&&S.acc<1) S.acc=1;
    if(S.acc>=1&&nextDrop<=0){ S.acc-=1; nextDrop=S.auto?1.0:0.45; S.sq.v+=9; S.falling.push({x:CX,y:BTOP-95,vy:0,r:4}); }
    springTo(S.sq,0,120,10,dt);
    const P=tubeAt(TW,TH,CX,TBOT,0), liqA=S.V*TW*18, lr=fillLow(P,liqA);
    for(let i=S.falling.length-1;i>=0;i--){ const d=S.falling[i]; if(dropStep(d,dt,lr.L)){ S.falling.splice(i,1); S.drops++; S.V+=0.05; S.clouds.push({x:CX+(Math.random()-0.5)*8,y:lr.L+6,r:5,m:DROP,vy:18}); drip(); } }
    /* reaction: pseudo-first order in MnO₄⁻, rate ∝ [EtOH] (mol/L) */
    const cE=S.E/S.V, kk=kT*(cE/(cE+0.015))/0.3; // saturates in ethanol; 1 % (0.171 M) at 60 °C → τ ≈ 0.33 s
    let used=0;
    S.clouds.forEach(c=>{ const d=Math.min(c.m,c.m*kk*dt); c.m-=d; used+=d; c.r+=dt*(26/Math.sqrt(1+c.r/10)); c.y=Math.min(TBOT-10,c.y+c.vy*dt); c.vy*=Math.exp(-0.8*dt); });
    for(let i=S.clouds.length-1;i>=0;i--){ const c=S.clouds[i]; if(c.r>TW*0.9){ S.bulk+=c.m; S.clouds.splice(i,1); } }
    const db=Math.min(S.bulk,S.bulk*kk*dt); S.bulk-=db; used+=db;
    used=Math.min(used,S.E*4/3); S.E=Math.max(0,S.E-used*0.75); S.mno2+=used;
    for(let n=0;n<Math.round(used*800);n++) S.flecks.push({x:CX+(Math.random()-0.5)*(TW-12),y:lr.L+10+Math.random()*(TBOT-lr.L-20),vy:4+Math.random()*6});
    S.flecks.forEach(f=>{ f.y=Math.min(TBOT-6-Math.random()*2,f.y+f.vy*dt); }); if(S.flecks.length>400) S.flecks.splice(0,S.flecks.length-400);
    const mM=S.bulk/S.V*1000; // mmol/mL → mM
    const alpha=v=>clamp(Math.log10(Math.max(v,1e-6)/0.01)/3,0,1)*0.85;
    const need=Math.ceil(S.E0*4/3/DROP);
    if(S.auto&&S.E/S.E0<0.01&&S.drops>need+6){ S.auto=false; setBtn($('#auto'),'▶ Drop by drop',''); }
    setMany($,{r1:String(S.drops), r2:fmt(S.E/S.E0*100,S.E/S.E0<0.1?1:0)+' %', r3:alpha(mM)>0.12?'stays':S.clouds.length?'disappears':'—', r4:need>999?'≈ '+Math.round(need/100)*100:String(need)});
    if(S.hist.length===0||t-S.hist[S.hist.length-1].t>0.25) S.hist.push({t,e:S.E/S.E0,p:alpha(mM)}); if(S.hist.length>240) S.hist.shift();
    if(S.E/S.E0<0.02&&alpha(mM)>0.2) fbSet(fb,'ok','All the ethanol is oxidised to ethanoic acid — nothing is left to use up KMnO₄, so its purple colour now stays.');
    else if(S.drops>0&&alpha(mM)<0.1&&!S.clouds.length) fbSet(fb,'warn','The purple colour disappears: KMnO₄ gives oxygen to ethanol and is used up.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,520);
    // tripod + gauze + spirit lamp under the water bath
    ctx.save(); ctx.beginPath(); ctx.rect(0,432,SW,200); ctx.clip(); spiritLamp(ctx,CX,520,t,heat); ctx.restore(); if(heat) for(let k=-1;k<=1;k+=2) heatWave(ctx,CX+k*14,432,40,-Math.PI/2+k*1.3,COL.red,t,0.5,2);
    tripod(ctx,CX,428,520,170); gauze(ctx,CX,426,210);
    // water bath
    const wb=waterBath(ctx,CX,BTOP,BBOT+2,190,Tb,t);
    // tube liquid: ethanol (clear), purple bulk, brown MnO₂ haze, clouds
    polyFill(ctx,lr.poly,'rgba(129,149,171,0.08)');
    polyClipFill(ctx,lr.poly,()=>{
      const haze=clamp(S.mno2/0.4,0,1); if(haze>0.01){ ctx.fillStyle=rgba('#8d5a2b',0.35*haze); ctx.fillRect(CX-TW,lr.L,TW*2,TBOT-lr.L+30); }
      const ab=alpha(mM); if(ab>0.005){ ctx.fillStyle=rgba(MNO4,ab); ctx.fillRect(CX-TW,lr.L,TW*2,TBOT-lr.L+30); }
      S.clouds.forEach(c=>{ const vol=4.19*Math.pow(c.r/30,3), a=alpha(c.m/vol*1000); // 30 px ≈ 1 cm
        const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r); g.addColorStop(0,rgba(MNO4,a)); g.addColorStop(0.6,rgba(MNO4,a*0.6)); g.addColorStop(1,rgba(MNO4,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill(); });
      ctx.fillStyle='#6b4423'; S.flecks.forEach(f=>ctx.fillRect(f.x-1,f.y-1,2,2)); });
    const sl=surfLine(lr.poly,lr.L); if(sl) line(ctx,sl[0],lr.L,sl[1],lr.L,COL.red,1.8);
    glassDraw(ctx,P,2.6);
    // thermometer in the bath
    labThermo(ctx,CX+62,BTOP-60,BBOT-40,Tb,0,100,{step:10});
    // dropper + reagent label
    S.falling.forEach(d=>dropDraw(ctx,d,MNO4));
    dropperDraw(ctx,CX,BTOP-100,clamp(S.sq.x*0.12,0,1),0.7,rgba(MNO4,0.8));
    textAt(ctx,'alkaline KMnO₄',CX+22,BTOP-160,{size:13,weight:800,color:COL.yellow});
    leader(ctx,CX-TW/2+6,TBOT-30,CX-150,BTOP-40,ETH[ek].n+', 3 mL',COL.red);
    // graph: ethanol left and purple colour vs time
    const gx=500, gy=250, gw=270, gh=180; rect(ctx,gx,gy,gw,gh,COL.ink,'#fff',1.6);
    textAt(ctx,'ethanol left',gx,gy-24,{size:12,weight:700,color:COL.red}); textAt(ctx,'purple colour in tube',gx,gy-8,{size:12,weight:700,color:MNO4});
    if(S.hist.length>1){ const t0=S.hist[0].t, t1=Math.max(t0+10,S.hist[S.hist.length-1].t); const X=v=>gx+(v-t0)/(t1-t0)*gw;
      [['e',COL.red],['p',MNO4]].forEach(([key,col])=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath(); S.hist.forEach((q,i)=>{ const x=X(q.t), y=gy+gh-q[key]*gh*0.95; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore(); }); }
    textAt(ctx,'time →',gx+gw,gy+gh+16,{align:'right',size:11,weight:600,color:COL.muted});
    if(S.drops>0) eqStrip(ctx,[{t:'CH₃CH₂OH',col:COL.red},{t:'  —(alk. KMnO₄, heat)→  '},{t:'CH₃COOH',col:COL.green}],560,52,1,13);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.6 SODIUM + ETHANOL (teacher's demonstration)
   2Na + 2CH₃CH₂OH → 2CH₃CH₂O⁻Na⁺ + H₂
   "Two grains of rice" of sodium ≈ 40 mg = 1.74 mmol → 0.87 mmol H₂
   = 21 mL at room temperature (24.5 mL/mmol).
   Na (0.97 g/cm³) is denser than ethanol (0.79) → it SINKS and fizzes
   steadily; it shrinks at a constant surface speed (shrinking sphere,
   r₀ = 2.1 mm, ≈ 3 min real → shown 12× faster).
   Water comparison (0.01 g piece): Na floats (1.00), the heat melts it
   into a ball that darts about on its H₂ jets and is gone in ≈ 6 s.
   Gas test: H₂ collects in an inverted tube (20 mL); a burning splinter
   gives a pop once H₂ is above its 4 % flammability limit.
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TX=250, TB=500, TW=96, TH=240, PXMM=3.6;
  const LQ={eth:{n:'Ethanol (absolute)',rho:0.79,m:40,k:0.0118,speed:12,col:'rgba(129,149,171,0.10)'},wat:{n:'Water (tiny piece, to compare)',rho:1.0,m:10,k:0.22,speed:1,col:'rgba(47,143,224,0.14)'}};
  let lk='eth', t=0; const S={};
  const reset=()=>Object.assign(S,{phase:'ready', m:LQ[lk].m, r:0, na:{x:TX+150,y:130,vx:0,vy:0}, tong:sprP(TX+100,150), bub:[], lensBub:[], h2:0, f:0, cap:false, capP:sprP(TX+180,120), spl:sprP(640,500), splLit:0, test:0, flash:0, T:25, heatMsg:''});
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Liquid in the tube</label><div class="chip-wrap">${Object.keys(LQ).map(k=>`<button class="chip-btn${k==='eth'?' active':''}" data-l="${k}">${LQ[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="drop">▶ Drop in the sodium</button><button class="toggle-btn" id="rs">↺ Fresh tube</button></div></div>
    <div class="control-group"><label>Test the gas</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn navy" id="cap">⬇ Hold a tube over the mouth</button><button class="toggle-btn" id="test">🔥 Burning splinter</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Sodium left',COL.ink)}${card('r2','Hydrogen given off',COL.green)}${card('r3','H₂ in the test tube',COL.green)}${card('r4','Splinter test',COL.yellow)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-l]',b=>{ lk=b.dataset.l; reset(); fb.className='fb hidden'; setv($,'r4','—'); });
  $('#drop').onclick=()=>{ if(S.phase==='ready'){ S.phase='carry'; S.T=0; } };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; setv($,'r4','—'); };
  $('#cap').onclick=()=>{ S.cap=!S.cap; setBtn($('#cap'),S.cap?'⬆ Lift the tube off':'⬇ Hold a tube over the mouth','navy'); };
  $('#test').onclick=()=>{ if(S.test) return; S.cap=false; setBtn($('#cap'),'⬇ Hold a tube over the mouth','navy'); S.test=0.01; S.splLit=1; };
  let fizzT=0;
  animLoop(dt=>{
    t+=dt; const L=LQ[lk], sp=L.speed;
    const P=tubeAt(TW,TH,TX,TB,0), lr=fillLow(P,TW*150), surf=lr.L;
    S.T+=dt;
    /* tongs carry the piece over the mouth and let go */
    if(S.phase==='carry'){ sprPStep(S.tong,TX+10,TB-TH-50,dt,40,11); S.na.x=S.tong.x.x-10; S.na.y=S.tong.y.x+12; if(S.T>1.2){ S.phase='fall'; S.na.vy=0; } }
    else sprPStep(S.tong,TX+100,150,dt,30,10);
    if(S.phase==='ready'){ S.na.x=S.tong.x.x-10; S.na.y=S.tong.y.x+12; }
    const r0=Math.cbrt(L.m/0.97*3/(4*Math.PI)); // mm
    S.r=r0*Math.cbrt(S.m/L.m);
    if(S.phase==='fall'||S.phase==='react'){
      const inLiq=S.na.y>surf, rpx=Math.max(1.5,S.r*PXMM);
      if(!inLiq){ S.na.vy+=1400*dt; }
      else if(L.rho<0.97){ // sinks slowly (drag)
        S.na.vy+=((0.97-L.rho)/0.97*900-S.na.vy*6)*dt; }
      else { // floats: bobs on the surface, darts on its gas jets
        S.na.vy+=((surf-rpx*0.4-S.na.y)*120-S.na.vy*10)*dt; S.na.vx+=((Math.random()-0.5)*2600-S.na.vx*2.5)*dt; }
      S.na.x+=S.na.vx*dt; S.na.y+=S.na.vy*dt; const xl=TX-TW/2+rpx+3, xr=TX+TW/2-rpx-3; if(S.na.x<xl){ S.na.x=xl; S.na.vx=Math.abs(S.na.vx); } if(S.na.x>xr){ S.na.x=xr; S.na.vx=-Math.abs(S.na.vx); }
      if(S.na.y>TB-rpx-2){ S.na.y=TB-rpx-2; S.na.vy=0; }
      if(inLiq&&S.m>0){ S.phase='react';
        const dr=L.k*dt*sp, rn=Math.max(0,S.r-dr), mn=L.m*Math.pow(rn/r0,3), dm=S.m-mn; S.m=rn<0.05?0:mn;
        const nH2=dm/23/2; S.h2+=nH2; // mmol
        const q=nH2*24.5/dt; // mL/s (screen time)
        if(Math.random()<clamp(q*1.2,0,6)*dt*10) S.bub.push({x:S.na.x+(Math.random()-0.5)*rpx*1.6,y:S.na.y-rpx*0.6,vy:-20,vx:0,r:1.4+Math.random()*1.8,ph:Math.random()*6});
        if(S.f<1) S.f+=(S.cap?0.85:0)*q*dt/20*(1-S.f);
        fizzT-=dt; if(fizzT<=0){ fizzTick(); fizzT=lk==='wat'?0.05:0.18; }
        if(S.m<=0){ S.phase='done'; } } }
    if(!S.cap) S.f=Math.max(0,S.f-dt*0.02);
    bubbleStep(S.bub,dt,()=>surf);
    /* the collecting tube and the splinter test */
    sprPStep(S.capP,S.cap?TX:TX+180,S.cap?TB-TH-198:120,dt,40,11);
    if(S.test){ S.test+=dt; const tx=S.capP.x.x, mouthY=S.capP.y.x+190; sprPStep(S.spl,S.test<2.4?tx+20:640,S.test<2.4?mouthY+6:500,dt,35,10);
      if(S.test>1.3&&S.test<1.35){ if(S.f>0.04){ popSound(); S.flash=clamp(S.f*2,0.4,1); setv($,'r4','POP! — hydrogen'); fbSet(fb,'ok','The gas burns with a pop — it is hydrogen. The other product, sodium ethoxide, stays dissolved.'); S.f=0; }
        else { setv($,'r4','no pop'); fbSet(fb,'warn','No pop — not enough gas collected yet. Hold the tube over the mouth for longer.'); } S.test=1.36; }
      if(S.test>3.2){ S.test=0; S.splLit=0; } }
    S.flash=Math.max(0,S.flash-dt*2.5);
    setMany($,{r1:fmt(S.m,1)+' mg', r2:fmt(S.h2*24.5,1)+' mL', r3:Math.round(S.f*100)+' %'});
    if(S.phase==='react'&&!fb.className.includes('ok')&&S.T>3) fbSet(fb,'warn',lk==='eth'?'Sodium sinks in ethanol and gives a steady stream of bubbles.':'In water sodium floats, melts into a ball and rushes about — far more violent.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,TB+20); rackDraw(ctx,TX-90,TX+90,TB-120,TB+20);
    polyFill(ctx,lr.poly,L.col); const sl=surfLine(lr.poly,surf); if(sl) line(ctx,sl[0],surf,sl[1],surf,lk==='eth'?COL.mid:COL.blue,2);

      for(let i=0;i<nd;i++){ const x=cx+(R()-0.5)*50, y=cy-0+R()*185-10+Math.sin(t*3+i)*4; circ(ctx,x,y+ -0,2.4,COL.green,'#fff',1.3); } ctx.restore();

        bubbleStep(S.lensBub,dt,()=>150); bubbleDraw(ctx,S.lensBub,COL.green); textAt(ctx,'H₂',690,200,{size:18,weight:800,color:COL.green}); },{label:'sodium, magnified'}); }
