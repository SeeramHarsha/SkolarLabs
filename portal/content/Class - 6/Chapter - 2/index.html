<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 · Chapter 2 — Diversity in the Living World | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn:disabled{opacity:.55; cursor:not-allowed;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.qa-input{width:100%; margin-top:7px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:var(--fs-sm); color:var(--text-1); background:var(--surface-1);}
.qa-input:focus{outline:none; border-color:var(--accent); background:#fff;}
.nav-item .n-num{line-height:1.15; text-align:center;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">🌿</div>
    <div>
      <div class="chip">Grade 6 · Ch 2</div>
      <h1>Diversity in the Living World</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you do</span>
      <span><i style="background:var(--f-green)"></i>Living plant parts</span>
      <span><i style="background:var(--f-red)"></i>Net veins · taproot · dicot · moving part</span>
      <span><i style="background:var(--f-blue)"></i>Parallel veins · fibrous · monocot · water</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">2.1</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>

/* =========================================================================
   GRADE 6 — CHAPTER 2: DIVERSITY IN THE LIVING WORLD
   Activities 2.1–2.10. Every scene runs on a continuous animation loop:
   sliders and buttons only set a TARGET; plants sway, stems bend,
   roots pull free, seeds swell, cards fly, animals walk, fly, swim,
   hop and crawl toward it using real models (cantilever bending,
   imbibition, gait cycles, projectile hops, snow sliding on a slope,
   pressure under a hoof …), with real time compressed.
   Colour rule: yellow = what you do · green = living plant parts ·
   red = net veins / taproot / dicot / the moving body part ·
   blue = parallel veins / fibrous roots / monocot / water.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', navy:'#1a3a5c'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. SHARED HELPERS — virtual stage, Q→A banner, stick figures,
       cat, cups, particles (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
/* every scene draws on an 800 × 470 virtual stage, fitted into the canvas */
const VW=800, VH=520, BANNER=46;
function stage(ctx,w,h){
  const s=Math.min(w/VW,(h-BANNER-6)/VH), ox=(w-VW*s)/2, oy=BANNER+Math.max(0,(h-BANNER-VH*s)/2);
  ctx.translate(ox,oy); ctx.scale(s,s); return s;
}
/* stick figure — feet on (x,y), height s. angles from straight-down, + = toward +x */
function stick(ctx,x,y,s,o){
  o=o||{}; const c=o.col||COL.ink, W=o.lw||Math.max(2,s*0.02);
  const th=0.25*s, sh=0.25*s, ua=0.17*s, fa=0.16*s;
  const LL=o.legL||[-0.12,-0.02], LR=o.legR||[0.12,0.02];
  const drop=Math.max(Math.cos(LL[0])*th+Math.cos(LL[1])*sh, Math.cos(LR[0])*th+Math.cos(LR[1])*sh);
  const hip=[x+(o.dx||0), y-drop];
  const lean=o.lean||0;

/* =====================================================================
   2.2  LET US APPRECIATE — the class biodiversity board
   Each student closes their eyes for 30 s (shown 5× faster), then draws
   one plant and one animal. A student's choice is drawn from a list of
   40 plants and 60 animals that children commonly know, weighted by how
   familiar each is (Zipf: weight ∝ 1/rank) — so mango and cow come up
   again and again, but rarer kinds keep appearing. A repeated kind gets
   a tally mark, a new kind gets a new chalk drawing. The curve "different
   kinds vs drawings" keeps rising with every extra class: the board can
   never hold all the kinds there are.
   ===================================================================== */
function buildA2(){ return buildScene(wrap=>{
  const PLANTS=['mango','neem','tulsi','rose','hibiscus','banana','coconut','grass','sunflower','marigold','tomato','lotus','cactus','wheat','fern','deodar',
    'Peepal','Banyan','Jasmine','Bamboo','Rice','Money plant','Aloe vera','Pine','Tamarind','Guava','Papaya','Jamun','Ashoka','Bougainvillea','Lemon','Chilli','Brinjal','Potato','Onion','Lily','Orchid','Sugarcane','Mustard','Cotton'];
  const ANIMALS=['cow','dog','cat','crow','pigeon','lion','elephant','monkey','fish','butterfly','peacock','camel','goat','frog','snake','ant','sparrow','deer','housefly','snail','earthworm','whale','yak',
    'Tiger','Parrot','Rabbit','Horse','Squirrel','Hen','Duck','Owl','Bee','Spider','Lizard','Tortoise','Crab','Shark','Dolphin','Bear','Fox','Rat','Mosquito','Kingfisher','Eagle','Giraffe','Zebra','Kangaroo','Penguin','Octopus','Starfish','Bat','Buffalo','Donkey','Sheep','Pig','Crocodile','Ladybird','Dragonfly','Cockroach','Mynah'];
  const zipf=n=>{ const w=[]; let s=0; for(let i=0;i<n;i++){ s+=1/(i+1); w.push(s); } return ()=>{ const r=Math.random()*s; return w.findIndex(x=>x>=r); }; };
  const pickP=zipf(PLANTS.length), pickA=zipf(ANIMALS.length);
  const S={q:'Do you think there may be many more varieties than those drawn on the board?'};
  let N=30, phase='idle', clock=0, classes=0, queue=[], cur=null, rate=3;
  const board={P:[],A:[]}; let drawings=0; const curve=[[0,0]];
  const chalk={x:spr(400),y:spr(150)}; let students=[];
  function newClass(){ students=[]; for(let i=0;i<N;i++) students.push({p:pickP(),a:pickA(),up:spr(0)}); classes++; phase='think'; clock=30; queue=[]; }
  S.html=`
    ${slider('nR','Students in the class',10,40,1,30)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="thB">😌 Close eyes · 30 s</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="mrB">➕ Another class</button><button class="toggle-btn" id="rsB">🧽 Clean board</button></div></div>
    ${slider('rtR','Drawing speed',1,8,1,3)}`;
  S.cards=card('cN','Drawings on board')+card('cK','Different kinds',COL.yellow)+card('cP','Different plants',COL.green)+card('cA','Different animals');

/* =====================================================================
   2.3  LET US GROUP — picture cards on a table
   Choosing a basis sends every card flying to its group on a spring
   (k = 70, light damping → overshoot and settle) and the card tilts in
   the direction it moves. "Shuffle" flicks the cards across the table:
   each then slides with real kinetic friction, a = μg (μ = 0.35, a card
   is 7 cm wide → 1 m = 1000 px), so it decelerates uniformly and stops
   after v²/2μg, bouncing off the table edge. A second basis splits each
   group again.
   ===================================================================== */
function buildA3(){ return buildScene(wrap=>{
  const CARDS=[
    {k:'mango',lv:'land'},{k:'rose',lv:'land'},{k:'tomato',lv:'land'},{k:'grass',lv:'land'},{k:'fern',lv:'land'},{k:'deodar',lv:'land'},{k:'lotus',lv:'water'},{k:'cactus',lv:'land'},
    {k:'cow'},{k:'crow'},{k:'fish'},{k:'frog'},{k:'ant'},{k:'snake'},{k:'butterfly'},{k:'lion'}];
  const BASES=[
    {n:'Plant or animal',f:o=>o.k==='plant'?'Plants':'Animals'},
    {n:'Flowers',f:o=>o.k!=='plant'?null:o.flw?'With flowers':'No flowers'},
    {n:'Stem',f:o=>o.k!=='plant'?null:o.stem==='hard'?'Hard stem':'Soft stem'},
    {n:'What it eats',f:o=>o.k!=='animal'?null:{P:'Eats plants',A:'Eats animals',B:'Eats both'}[o.eat]},
    {n:'Where it lives',f:(o,c)=>{ const l=c.lv||o.live; return {land:'Land',water:'Water',tree:'Trees',both:'Water and land'}[l]; }},
    {n:'How it moves',f:o=>o.k==='plant'?'Stays in one place':{walk:'Walks',fly:'Flies',swim:'Swims',crawl:'Crawls',hop:'Hops'}[o.mv]},
  ];
  const S={q:'Why might different groups of students make different groups from the same cards?'};
  const MU=0.35, PXM=1000, A_FR=MU*9.8*PXM;          // friction deceleration in px/s²
  let b1=-1, b2=-1, tried=new Set(), mode='table';
  const cards=CARDS.map((c,i)=>({...c,o:ORG[c.k],x:spr(78+(i%8)*92),y:spr(170+Math.floor(i/8)*150),r:spr(0),sc:spr(1),vx:0,vy:0,slide:false,tx:0,ty:0,ts:1,rr:(Math.random()-0.5)*0.12}));
  let bins=[];
  S.html=`
    <div class="control-group"><label>Group by</label>${chipList('b1C',BASES.map(b=>b.n),-1)}</div>
    <div class="control-group"><label>Then split each group by</label>${chipList('b2C',['—'].concat(BASES.map(b=>b.n)),0)}</div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="shB">🔀 Shuffle the cards</button></div></div>`;
  S.cards=card('cB','Basis',COL.yellow)+card('cG','Groups')+card('cT','Bases tried')+card('cS','Card speed');
  S.wire=$=>{
    S.c1=wireChips(wrap,'b1C',i=>{ b1=i; tried.add(i); mode='group'; layout(); });
    S.c2=wireChips(wrap,'b2C',i=>{ b2=i-1; if(b2>=0) tried.add(b2); if(mode==='group') layout(); });
    $('#shB').onclick=()=>{ mode='table'; b1=-1; setActive(S.c1,-1);
      cards.forEach(c=>{ const a=Math.random()*Math.PI*2, v=(0.9+Math.random()*1.4)*PXM; c.vx=Math.cos(a)*v; c.vy=Math.sin(a)*v*0.6; c.slide=true; c.spin=(Math.random()-0.5)*8; c.ts=1; }); };
  };
  function layout(){
    const B=BASES[b1], groups={};
    cards.forEach(c=>{ const g1=B.f(c.o,c)||'Feature does not apply', g2=b2>=0&&b2!==b1?(BASES[b2].f(c.o,c)||'—'):''; (groups[g1]=groups[g1]||{})[g2]=((groups[g1]||{})[g2]||[]).concat([c]); });
    const keys=Object.keys(groups).sort((a,b)=>(a==='Feature does not apply')-(b==='Feature does not apply'));
    const total=cards.length, W=780, x0=10; bins=[]; let x=x0;
    keys.forEach(k=>{ const subs=Object.keys(groups[k]); const n=subs.reduce((s,q)=>s+groups[k][q].length,0); const w=Math.max(110,(W-8*(keys.length-1))*n/total);
      bins.push({x,w,label:k,na:k==='Feature does not apply',subs:subs.map(q=>({label:q,cards:groups[k][q]}))}); x+=w+8; });
    const sx=(W-8*(bins.length-1))/(bins.reduce((s,b)=>s+b.w,0)); x=x0; bins.forEach(b=>{ b.w*=sx; b.x=x; x+=b.w+8; });
    bins.forEach(b=>{ const top=56, H=440, subH=H/b.subs.length; b.subs.forEach((sb,j)=>{ sb.y=top+j*subH; sb.h=subH-6;
      const n=sb.cards.length, cols=Math.max(1,Math.floor(b.w/62)), rows=Math.ceil(n/cols);
      const s=clamp(Math.min((b.w-8)/cols/78,(sb.h-(sb.label?24:6))/rows/92),0.42,0.85);
      sb.cards.forEach((c,i)=>{ const cc=i%cols, rr=Math.floor(i/cols); c.tx=b.x+b.w/2+(cc-(Math.min(cols,n)-1)/2)*78*s; c.ty=sb.y+(sb.label?26:8)+rr*92*s+46*s; c.ts=s; c.slide=false; }); }); });
  }
  function drawCard(ctx,c,t){
    ctx.save(); ctx.translate(c.x.x,c.y.x); ctx.rotate(c.r.x); ctx.scale(c.sc.x,c.sc.x);
    ctx.save(); ctx.shadowColor='rgba(15,38,64,0.18)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3; rrect(ctx,-37,-44,74,88,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    rrect(ctx,-37,-44,74,88,8); ctx.lineWidth=2; ctx.strokeStyle=c.o.k==='plant'?COL.green:COL.ink; ctx.stroke();
    const big=c.o.k==='plant'?56:{cow:40,lion:40,crow:44,fish:40,frog:40,ant:30,snake:26,butterfly:46}[c.k];
    ctx.save(); rrect(ctx,-36,-43,72,86,7); ctx.clip();
    drawOrg(ctx,c.k,c.k==='snake'?-6:0,c.k==='lotus'?18:26,c.k==='snake'?22:big,t,{sw:0,mode:c.k==='fish'?'swim':'stand',ph:t*0.8,dir:1});

    ctx.restore();
  }
  let maxV=0;
  S.tick=(dt,ctx,t,$)=>{
    /* ---- table + bins ---- */
    ctx.save(); rrect(ctx,4,4,792,508,14); ctx.fillStyle='#f8f4ec'; ctx.fill(); ctx.strokeStyle='#d6c7a8'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    if(mode==='group'){ bins.forEach(b=>{ ctx.save(); rrect(ctx,b.x,14,b.w,488,10); ctx.fillStyle=b.na?'rgba(129,149,171,0.08)':'rgba(217,160,23,0.07)'; ctx.fill();
        ctx.setLineDash([7,5]); ctx.strokeStyle=b.na?COL.mid:COL.yellow; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
        const fs=fitFont(ctx,b.label,b.w-14,14,700); textAt(ctx,b.label,b.x+b.w/2,40,{align:'center',size:fs,weight:700,color:b.na?COL.mid:'#8a6410'});
        b.subs.forEach((sb,j)=>{ if(!sb.label) return; if(j) line(ctx,b.x+10,sb.y-3,b.x+b.w-10,sb.y-3,'#e7d6ad',1.5,[4,4]);
          const f2=fitFont(ctx,sb.label,b.w-14,11.5,600); textAt(ctx,sb.label,b.x+b.w/2,sb.y+16,{align:'center',size:f2,weight:600,color:COL.muted}); }); }); }
    /* ---- card physics ---- */
    maxV=0;
    cards.forEach(c=>{
      if(c.slide){ const v=Math.hypot(c.vx,c.vy); if(v>0){ const nv=Math.max(0,v-A_FR*dt); c.vx*=nv/v; c.vy*=nv/v; }
        c.x.x+=c.vx*dt; c.y.x+=c.vy*dt; c.r.x+=c.spin*dt; c.spin*=Math.max(0,1-3*dt);
        if(c.x.x<44||c.x.x>756){ c.x.x=clamp(c.x.x,44,756); c.vx*=-0.4; } if(c.y.x<52||c.y.x>464){ c.y.x=clamp(c.y.x,52,464); c.vy*=-0.4; }
        c.x.v=c.vx; c.y.v=c.vy; maxV=Math.max(maxV,Math.hypot(c.vx,c.vy)); springTo(c.sc,1,60,9,dt); }
      else if(mode==='group'){ springTo(c.x,c.tx,70,8,dt); springTo(c.y,c.ty,70,8,dt); springTo(c.sc,c.ts,70,9,dt); springTo(c.r,c.rr*0.4+clamp(c.x.v*0.0012,-0.5,0.5),90,10,dt); maxV=Math.max(maxV,Math.hypot(c.x.v,c.y.v)); }

/* =====================================================================
   2.4  LET US GROUP — herbs, shrubs and trees (Table 2.3)
   Plants are drawn to scale next to a 1.4 m student. The student's hand
   pushes the stem at hand height a with force F. The stem is a
   cantilever: slope dy/dz = F(2az − z²)/(2EI) below the hand, constant
   F a²/(2EI) above it; the shape is integrated along the stem so it
   keeps its length. EI = E·πd⁴/64 (green stem E ≈ 0.5 GPa, wood 5–10 GPa).
   The displayed force follows the slider through a spring at the stem's
   own natural frequency f = 0.56·√(EI/(mL⁴)), so a released stem swings
   back and settles. Bending stress σ = F·a·(d/2)/I is kept below the
   breaking stress ("take care the stems do not break").
   Climbers and creepers: a stem can hold itself up only to the
   Greenhill height L = 1.986·(EI/q)^⅓ (q = weight per metre) — a money
   plant manages ≈ 0.4 m, so without its support stick it flops over.
   Check: tomato 1.4 cm stem pushed with 2 N at 0.48 m bends ≈ 8 cm;
   a 40 cm mango trunk bends less than 0.01 mm.
   ===================================================================== */
function buildA4(){ return buildScene(wrap=>{
  const PL=[
    {k:'tomato',n:'Tomato',type:'herb',H:0.6,d:1.4,E:0.5e9,sb:8e6,col:'Green',br:0.08,grp:'Herb'},
    {k:'marigold',n:'Marigold',type:'herb',H:0.5,d:1.0,E:0.5e9,sb:8e6,col:'Green',br:0.1,grp:'Herb'},
    {k:'rose',n:'Rose',type:'shrub',H:1.2,d:2.0,E:5e9,sb:60e6,col:'Brown',br:0.03,grp:'Shrub',stems:5},
    {k:'hibiscus',n:'Hibiscus',type:'shrub',H:2.2,d:3.0,E:5e9,sb:60e6,col:'Brown',br:0.12,grp:'Shrub',stems:4},
    {k:'mango',n:'Mango',type:'tree',H:9,d:40,E:10e9,sb:60e6,col:'Brown',br:2.2,grp:'Tree'},
    {k:'neem',n:'Neem',type:'tree',H:12,d:45,E:10e9,sb:60e6,col:'Brown',br:3,grp:'Tree'},
    {k:'money',n:'Money plant',type:'climber',H:2.0,d:0.8,E:0.05e9,sb:4e6,col:'Green',br:0.3,grp:'Climber'},
    {k:'pumpkin',n:'Pumpkin',type:'creeper',H:3.0,d:1.2,E:0.05e9,sb:4e6,col:'Green',br:0.2,grp:'Creeper'},
  ];
  PL.forEach(p=>{ const d=p.d/100, A=Math.PI*d*d/4; p.I=Math.PI*Math.pow(d,4)/64; p.EI=p.E*p.I;
    p.q=(p.type==='tree'?700*1.5:1000*3)*9.8*A; p.Lc=1.986*Math.cbrt(p.EI/p.q);
    p.a=p.type==='tree'?1.0:Math.min(1.0,0.8*p.H); p.m=p.q/9.8;
    p.f=0.56*Math.sqrt(p.EI/(p.m*Math.pow(Math.min(p.H,3),4)));
    p.Fsafe=0.8*p.sb*p.I/(p.a*d/2); });
  const S={q:'How can you group plants as herbs, shrubs and trees?'};
  const GY=470, BX=440; let pi=0, F=0, Fe={x:0,v:0}, ppm=spr(250), sup=spr(1), support=true, rec={}, tested=0, warnT=0, maxBend=0;
  S.html=`

/* =====================================================================
   2.5  LET US COMPARE — veins in leaves (venation)
   The cut stalk of the leaf stands in water. Add ink: it rises through
   the stalk and spreads along the veins. Every vein is a polyline with
   a dye arrival time = distance along the vein network ÷ front speed,
   so the ink branches out from the midrib into the net (reticulate) or
   runs side by side from base to tip (parallel). Net cross-veins fill
   from both ends and meet in the middle. Real dye moves a few cm per
   minute in a leaf — shown about 60× faster. Hold the leaf up to the
   light to see the veins; the lens magnifies up to 6×.
   ===================================================================== */
function buildA5(){ return buildScene(wrap=>{
  const LEAVES=[
    {k:'hib',n:'Hibiscus',t:'R',L:330,W:118,shape:'ovate',teeth:1},
    {k:'pee',n:'Peepal',t:'R',L:360,W:122,shape:'heart'},
    {k:'man',n:'Mango',t:'R',L:380,W:70,shape:'lance'},
    {k:'ban',n:'Banana',t:'P',L:420,W:110,shape:'oblong',pin:1},
    {k:'gra',n:'Grass',t:'P',L:430,W:22,shape:'strap'},
    {k:'mai',n:'Maize',t:'P',L:430,W:48,shape:'strap2'},
  ];
  const S={q:'What differences do you see in the veins of different leaves?'};
  const BX=150, CY=240, V=140;            // leaf base (px) and dye front speed (px/s)
  let li=0, ink=false, inkT=0, light=false, zoom=2.5, done={}, choice=-1, fly=null;
  const rot={x:0,v:0}, tray={R:[],P:[]};
  function halfW(lf,u){ const W=lf.W;
    switch(lf.shape){
      case 'ovate': return W*Math.pow(Math.sin(Math.PI*Math.pow(u,0.75)),1.1)*(lf.teeth?1+0.04*Math.abs(Math.sin(u*70)):1);
      case 'heart': return W*Math.sin(Math.PI*Math.pow(u,0.55))*Math.pow(1-u,0.35)*(u<0.06?u/0.06*0.6+0.4:1);
      case 'lance': return W*Math.pow(Math.sin(Math.PI*u),0.85)*(1-0.25*u);
      case 'oblong': return W*Math.pow(clamp(Math.min(u*7,(1-u)*5),0,1),0.5);
      case 'strap': return W*Math.pow(1-u,0.7)*clamp(u*12+0.4,0,1);
      default: return W*Math.pow(Math.sin(Math.PI*clamp(u*1.4,0,1)*0.5+Math.PI*0.5*(u>0.7?1:0)),1)*Math.pow(1-u,0.5)*clamp(u*10+0.3,0,1);
    } }
  /* build veins: [{pts:[[x,y]...], cum:[...], t0, t1 (arrival at each end), w, kind}] */
  function polyLen(pts){ const c=[0]; for(let i=1;i<pts.length;i++) c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return c; }

  function buildVeins(lf){
    const R=rng(lf.n.length*97+lf.L), V0=[]; const L=lf.L;
    const mid=[]; for(let i=0;i<=40;i++){ const u=i/40; mid.push([u*L,Math.sin(u*Math.PI)*6]); }
    const midAt=u=>[u*L,Math.sin(u*Math.PI)*6];
    if(lf.t==='R'){

      const n=lf.shape==='lance'?11:8, secs={1:[],'-1':[]};
      for(let i=0;i<n;i++){ for(const sd of [1,-1]){ const u0=0.06+i/(n)*0.82+(sd>0?0:0.03); const p0=midAt(u0);

/* =====================================================================

    const cols=['desert','mount','ocean','forest'].map(k=>Object.keys(rec[k]||{}).map(q=>ORG[q].n));
    const n=Math.max(...cols.map(c=>c.length)); const rows=[]; for(let i=0;i<n;i++) rows.push(cols.map(c=>c[i]||''));

  S.fb=()=>oi<0?['warn','Pick a plant or animal to put here.']:S.done<4?['warn','Find one that lives well in each region — '+S.done+' / 4.']:['ok','✓ Biodiversity changes from region to region.'];

/* =====================================================================
   2.10 B  CACTUS IN THE DESERT, DEODAR IN THE SNOW
   Desert (1 day = 2 s): each plant keeps a water store (100 % = full).
   Water lost per day ∝ surface that loses water: a leafy plant ≈ 12 %
   a day, a cactus (thick fleshy stem, spines instead of leaves, waxy
   skin) ≈ 0.6 % a day. Below 40 % the leaves droop. A rain shower
   refills the stores — the cactus soaks up the most and its stem
   visibly swells (pleats open).
   Snow (1 s = ½ h): snow builds up on each branch at the snowfall rate.
   A layer slides when gravity along the branch beats friction and the
   snow's own stickiness: ρ g d (sin θ − μ cos θ) > c, with μ = 0.3,
   ρ = 150 kg/m³, c = 40 Pa — so on a 35° deodar branch it slides off
   at ≈ 8 cm, on a 25° branch only at ≈ 18 cm, and below 17° never.
   Sliding snow accelerates at g(sin θ − μ cos θ), leaves the tip as a
   projectile, and the unloaded branch springs back and swings.
   Flat branches only bend under the load and snap at ≈ 35 cm.
   ===================================================================== */
function buildA10b(){ return buildScene(wrap=>{
  const S={q:'How do cactus and deodar survive where they live?'};
  const GY=440, MU=0.3, RHO=150, C=40, G=9.8;
  let run=true, day=0, Wc=1, Wl=1, rain=0, rainP=[], fat={x:1,v:0}, droop={x:0,v:0}, minL=1, minC=1, dryDays=0;
  let rate=4, slope=35, hrs=0, shed=0, broken=0, chunks=[], flakes=[], pile=0, falling=[];
  const tiers=[0,1,2,3,4,5].map(i=>({y:GY-30-i*36,L:96-i*13,d:0,b:{x:0,v:0}}));
  const flat=[0,1,2,3].map(i=>({y:GY-100-i*40,L:72-i*7,d:0,b:{x:0,v:0},broke:false,side:i%2?1:-1}));
  S.html=`
    <div class="control-group"><label>Desert</label><div class="toggle-group"><button class="toggle-btn play" id="pB">⏸ Pause days</button><button class="toggle-btn" id="rB">🌧️ Rain shower</button></div></div>
    ${slider('sR','Snowfall',0,10,0.5,4)}
    ${slider('aR','Slope of deodar branches',5,50,1,35)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="xB">↺ Start again</button></div></div>`;
  S.cards=card('cC','Cactus water',COL.green)+card('cL','Leafy plant water',COL.green)+card('cD','Snow on deodar',COL.blue)+card('cF','Flat branches broken',COL.red);
  S.wire=$=>{
    $('#pB').onclick=()=>run=!run;
    $('#rB').onclick=()=>{ rain=1.2; };
    const sr=$('#sR'); sr.oninput=()=>rate=+sr.value;
    const ar=$('#aR'); ar.oninput=()=>slope=+ar.value;
    $('#xB').onclick=()=>{ day=0; Wc=1; Wl=1; minL=1; minC=1; dryDays=0; hrs=0; shed=0; broken=0; chunks=[]; falling=[]; pile=0; tiers.forEach(q=>{q.d=0;q.b.x=q.b.v=0;}); flat.forEach(q=>{q.d=0;q.broke=false;q.b.x=q.b.v=0;}); };
  };
  /* sliding threshold depth (cm) for slope θ */
  const dCrit=th=>{ const s=Math.sin(th)-MU*Math.cos(th); return s<=0?Infinity:C/(RHO*G*s)*100; };
  S.tick=(dt,ctx,t,$)=>{
    /* ================= desert half ================= */
    if(run){ day+=dt/2; dryDays+=dt/2; Wc=Math.max(0,Wc-0.006*dt/2); Wl=Math.max(0,Wl-0.12*Wl*dt/2-0.01*dt/2); }
    if(rain>0){ rain-=dt; dryDays=0; Wc=Math.min(1.15,Wc+0.6*dt); Wl=Math.min(1,Wl+0.5*dt); for(let i=0;i<5;i++) rainP.push({x:20+Math.random()*360,y:40,vy:420}); }

    minL=Math.min(minL,Wl); minC=Math.min(minC,Wc);
    springTo(fat,0.72+0.3*Wc,40,5,dt); springTo(droop,clamp((0.4-Wl)/0.4,0,1),20,5,dt);
    const dayF=0.5+0.5*Math.sin(day*Math.PI*2-Math.PI/2);
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,396,520); ctx.clip();
    sky(ctx,GY,mixCol('#1d3557','#fdf0d2',dayF),mixCol('#2c4a6e','#fff8e6',dayF));
    if(rain>0){ cloud(ctx,120,70,40,'#9aaabb'); cloud(ctx,260,60,46,'#9aaabb'); }
    else if(dayF>0.15) sunIcon(ctx,320,lerp(260,60,dayF),22,t); else circ(ctx,320,80,14,'#c2d1e5','#f6f9fc',2);
    ctx.fillStyle='#f6e3b4'; ctx.fillRect(0,GY,400,90); line(ctx,0,GY,400,GY,'#d9a017',2.4);
    rainP.forEach(p=>line(ctx,p.x,p.y,p.x-2,p.y+12,COL.blue,1.4));
    drawOrg(ctx,'cactus',110,GY,200,t,{fat:fat.x});
    /* water store gauges */
    [[110,Wc,'cactus'],[290,Wl,'leafy plant']].forEach(([x,w,n])=>{ meterV(ctx,n==='cactus'?190:350,GY-130,14,90,Math.min(1,w),COL.blue,Math.round(Math.min(1,w)*100)+'%'); });
    /* leafy plant: broad leaves droop as it dries */
    { const x=290, top=GY-150, k=droop.x, brown=clamp((0.15-Wl)/0.15,0,1);
      ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,GY); ctx.quadraticCurveTo(x+k*12,GY-80,x+k*30,top+k*40); ctx.stroke(); ctx.restore();
      for(let i=0;i<5;i++){ const u=0.3+i*0.15, sd=i%2?1:-1; const px=x+k*30*u*u, py=lerp(GY,top+k*40,u); const ang=(sd>0?-0.5:Math.PI+0.5)+sd*k*1.3;
        oLeaf(ctx,{k:1,f:c=>c},px,py,40-i*3,14,ang,mixCol('#1f9d55','#8a5a2b',brown),mixCol('#e3f3e8','#f4e8d8',brown),1.8,true); } }
    textAt(ctx,'Day '+Math.floor(day)+' · '+(rain>0?'raining':Math.floor(dryDays)+' days without rain'),200,30,{align:'center',size:13,weight:700,color:dayF>0.4?COL.ink:'#fff'});
    ctx.restore();
    line(ctx,400,0,400,520,'#c2d1e5',2);
    /* ================= snow half ================= */
    const dth=dt*0.5; hrs+=dth;
    const th=slope*Math.PI/180;
    ctx.save(); ctx.beginPath(); ctx.rect(404,0,400,520); ctx.clip();
    sky(ctx,GY,'#c9d6e6','#eef3f9');
    if(Math.random()<dt*rate*8) flakes.push({x:404+Math.random()*400,y:-10,v:50+Math.random()*30});
    flakes.forEach(f=>{ f.y+=f.v*dt; f.x+=Math.sin(t*2+f.y*0.04)*14*dt; }); for(let i=flakes.length-1;i>=0;i--) if(flakes[i].y>GY-pile) flakes.splice(i,1);
    pile=Math.min(60,pile+rate*dth*0.05);
    ctx.fillStyle='#fff'; ctx.fillRect(404,GY-pile,400,100+pile); line(ctx,404,GY-pile,804,GY-pile,COL.blue,1.6);
    /* deodar tiers */
    const DX=520;
    tiers.forEach((q,i)=>{ q.d+=rate*dth*(0.6+0.4*Math.cos(th)); const thEff=th+q.b.x;   // bending steepens the branch
      if(q.d>=dCrit(thEff)&&q.d>0.5){ chunks.push({x:0,v:0,d:q.d,i,th:thEff,air:false,px:0,py:0,vx:0,vy:0}); q.d=0; shed++; q.b.v-=1.2; }
      const loadT=q.d*0.006; q.b.v+=(-60*(q.b.x-loadT)-3*q.b.v)*dt; q.b.x+=q.b.v*dt; });
    /* trunk */
    ctx.save(); ctx.beginPath(); ctx.moveTo(DX-6,GY); ctx.lineTo(DX-2,GY-250); ctx.lineTo(DX+2,GY-250); ctx.lineTo(DX+6,GY); ctx.closePath(); ctx.fillStyle='#f4e8d8'; ctx.fill(); ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    tiers.forEach(q=>{ const a=th+q.b.x; for(const sd of [-1,1]){ const ex=DX+sd*Math.cos(a)*q.L, ey=q.y+Math.sin(a)*q.L;
        line(ctx,DX,q.y,ex,ey,COL.green,3); for(let k=1;k<8;k++){ const u=k/8, px=lerp(DX,ex,u), py=lerp(q.y,ey,u); line(ctx,px,py,px+sd*4,py+7,COL.green,1.4); line(ctx,px,py,px-sd*2,py+8,COL.green,1.2); }
        if(q.d>0.2){ const dp=Math.min(14,q.d*0.9); ctx.save(); ctx.beginPath(); ctx.moveTo(DX,q.y); ctx.lineTo(ex,ey); const nx=Math.sin(a)*sd, ny=-Math.cos(a); ctx.lineTo(ex+nx*dp*0.6,ey+ny*dp*0.6); ctx.lineTo(DX+nx*dp,q.y+ny*dp); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); } } });
    line(ctx,DX-3,GY-250,DX,GY-268,COL.green,3);
    /* sliding chunks: a = g(sinθ − μcosθ) along the branch, then a projectile */
    chunks.forEach(c=>{ const q=tiers[c.i]; const aAl=Math.max(0,G*(Math.sin(c.th)-MU*Math.cos(c.th)))*60;
      for(const sd of [-1,1]){ if(!c.air){ c.v+=aAl*dt*0.5; c.x+=c.v*dt*0.5; }
        let px,py; if(!c.air&&c.x<q.L){ px=DX+sd*Math.cos(c.th)*c.x; py=q.y+Math.sin(c.th)*c.x-5; }
        else { if(!c.air){ c.air=true; c.t=0; } c.t+=dt*0.5; const vx=Math.cos(c.th)*c.v, vy=Math.sin(c.th)*c.v; px=DX+sd*(Math.cos(c.th)*q.L+vx*c.t); py=q.y+Math.sin(c.th)*q.L-5+vy*c.t+0.5*G*60*c.t*c.t; c.done=py>GY-pile; }
        ctx.save(); ctx.beginPath(); ctx.ellipse(px,py,Math.min(12,4+c.d*0.5),Math.min(6,2+c.d*0.25),c.air?c.t*3:c.th*sd,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore(); } });
    for(let i=chunks.length-1;i>=0;i--) if(chunks[i].done) chunks.splice(i,1);
    textAt(ctx,'deodar',DX,GY+38,{align:'center',size:12,weight:700,color:COL.green});

    $('#pB').textContent=run?'⏸ Pause days':'▶ Run days';

  };
  S.found=()=>S.ok&&S.ok.desert&&S.ok.snow?'Cactus stores water in its fleshy stem · the deodar’s sloping branches let snow slide off':'';
  S.fb=()=>{ if(!S.ok) return null; if(!S.ok.desert) return ['warn','Let the days pass without rain — which plant dries out?'];
    if(!S.ok.snow) return ['warn','Watch the snow on both trees — or lower the deodar’s slope.']; return ['ok','✓ Try a 10° slope on the deodar: the snow stays on.']; };
  return S;
}); }


/* =====================================================================
   2.10 C  TWO CAMELS — hot desert of Rajasthan, cold desert of Ladakh
   Both camels walk with a pace gait (both legs on one side move
   together), so 2 feet carry the weight at a time.
   Sand: pressure p = m·g / (2 × foot area); soft sand gives way in
   proportion, sinking z = p / k (k ≈ 1.2 MPa per metre).
     Rajasthan camel 500 kg on wide 0.040 m² feet → p ≈ 61 kPa, z ≈ 5 cm
     Ladakh camel    600 kg on smaller 0.030 m² feet → p ≈ 98 kPa, z ≈ 8 cm
   Every centimetre sunk costs speed (v = v₀(1 − z/12 cm)).
   Rocky slope (walking across it): a camel stays upright while the
   line straight down from its centre of mass falls between its feet:
   it tips at tan θ = b / h (b = half the width between feet, 0.3 m;
   h = height of the centre of mass: 1.5 m on long legs, 1.15 m on
   short legs) → 11° vs 15°. Near that angle it sways and slows; past
   it, it slips.
   Humps store fat. In Ladakh food runs out in late winter, so the two
   humps shrink from about January; the Rajasthan hump shrinks far less.
   ===================================================================== */
function buildA10c(){ return buildScene(wrap=>{
  const CM=[{k:'camel',n:'Rajasthan camel',m:500,A:0.040,h:1.5,H:2.1,fat0:35,shrink:0.06,T:'45 °C day'},
            {k:'bactrian',n:'Ladakh camel',m:600,A:0.030,h:1.15,H:1.8,fat0:40,shrink:0.65,T:'−20 °C winter'}];
  const MONTHS=['Oct','Nov','Dec','Jan','Feb','Mar','Apr'];
  const S={q:'What advantages do the differences between these two camels give them?'};
  const K=1.2e6, B=0.3, V0=1.4;
  let ter=0, slope=8, mon=0, tried={sand:0,rock:0,mon:0};
  const st=CM.map(()=>({ph:0,dist:0,sway:{x:0,v:0},slip:0,hump:{x:1,v:0}}));
  S.html=`
    <div class="control-group"><label>Ground</label>${chipList('gC',['🏜️ Soft sand','⛰️ Rocky mountain slope'],0)}</div>
    ${slider('sR','Steepness of the slope',0,20,1,8)}
    ${slider('mR','Month',0,6,1,0)}`;
  S.cards=card('cP','Pressure under feet')+card('cZ','Sinks into sand',COL.yellow)+card('cS','Stays steady up to',COL.green)+card('cH','Fat in humps',COL.red);
  S.wire=$=>{
    wireChips(wrap,'gC',i=>{ ter=i; tried[i?'rock':'sand']=1; });
    const sr=$('#sR'); sr.oninput=()=>{ slope=+sr.value; tried.rock=1; };
    const mr=$('#mR'); mr.oninput=()=>{ mon=+mr.value; if(mon>=4) tried.mon=1; };
    tried.sand=1;
  };
  const fatFrac=(c,m)=>1-c.shrink*smooth01(2,6,m);
  S.tick=(dt,ctx,t,$)=>{
    const out=[];
    CM.forEach((c,i)=>{
      const s=st[i], top=i*258, GY=top+200, ppm=150/c.H, X=230;
      const p=c.m*9.8/(2*c.A), z=p/K;                       // Pa, m
      const thTip=Math.atan(B/c.h)*180/Math.PI, margin=thTip-slope;
      let v=V0; if(ter===0) v=V0*clamp(1-z/0.12,0.1,1); else v=V0*clamp(margin/8,0.15,1);
      const f=v/(1.1*c.H/2.1); s.ph+=f*dt; s.dist+=v*dt;
      const swayT=ter===1?clamp(1-margin/8,0,1.4)*Math.sin(s.ph*Math.PI*2)*0.08:0;
      springTo(s.sway,swayT,40,5,dt);
      if(ter===1&&margin<0){ s.slip+=dt; } else s.slip=Math.max(0,s.slip-dt*2);
      springTo(s.hump,fatFrac(c,mon),20,5,dt);
      /* ---- lane backdrop ---- */
      ctx.save(); ctx.beginPath(); ctx.rect(0,top,800,250); ctx.clip();
      const hot=i===0; sky(ctx,GY+top*0,hot?'#fdf0d2':'#e9f1f8',hot?'#fff8e6':'#f6f9fc');
      ctx.fillStyle=hot?'#fdf3dd':'#eef3f9'; ctx.fillRect(0,top,800,250);
      if(!hot&&mon>=1&&mon<=5){ const rr=rng(i+3); for(let k=0;k<30;k++){ const x=(rr()*800+t*20)%800, y=top+((rr()*250+t*30)%250); circ(ctx,x,y,1.6,'#9aaabb','#fff',1); } }
      textAt(ctx,c.n,14,top+22,{size:14,weight:700,color:hot?'#8a6410':COL.blue}); textAt(ctx,c.T,14,top+40,{size:11,weight:600,color:COL.muted});
      const off=s.dist*ppm;
      if(ter===0){ /* sand with footprints */
        ctx.fillStyle='#f6e3b4'; ctx.fillRect(0,GY,800,60); line(ctx,0,GY,800,GY,'#d9a017',2.2);
        const zpx=z*ppm, stp=1.1*c.H/2.1*ppm*0.5;
        for(let x=X-40-((off%stp)+stp)%stp;x>-20;x-=stp){ ctx.save(); ctx.beginPath(); ctx.ellipse(x,GY,9,Math.max(1.5,zpx),0,0,Math.PI); ctx.fillStyle='#e9cf8f'; ctx.fill(); ctx.strokeStyle='#b3860f'; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore(); }
        drawOrg(ctx,c.k,X,GY+zpx,c.H*ppm*0.85,t,{mode:'walk',ph:s.ph,gait:'pace',hump:s.hump.x,hl:false});
        /* lens: one foot in the sand, ×5 */
        lens(ctx,640,top+120,82,()=>{ const L=640, T=top+120; ctx.fillStyle='#fff8e6'; ctx.fillRect(L-90,T-90,180,180);
          const zz=z*100*6; ctx.fillStyle='#f6e3b4'; ctx.fillRect(L-90,T+10,180,90); line(ctx,L-90,T+10,L+90,T+10,'#d9a017',2);
          const fw=Math.sqrt(c.A)*100*3*1.4; ctx.save(); rrect(ctx,L-fw/2,T+10-30+zz,fw,30,10); ctx.fillStyle='#fbf1df'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
          line(ctx,L-8,T-90,L-8,T+10-30+zz,COL.ink,6); line(ctx,L+8,T-90,L+8,T+10-30+zz,COL.ink,6);
          vec(ctx,L,T-70,L,T-38,COL.red,2.6);
          dimArrow(ctx,L-fw/2-12,T+10,T+10+zz,COL.yellow); textAt(ctx,fmt(z*100,1)+' cm',L-fw/2-18,T+16+zz/2,{align:'right',size:13,weight:700,color:'#8a6410'}); },COL.ink,'one foot in the sand · magnified');
        out.push({p,z,thTip});
      } else { /* rocky slope seen from the side + from behind */
        ctx.save(); ctx.translate(X,GY); ctx.rotate(-slope*Math.PI/180);
        ctx.fillStyle='#e7e1d6'; ctx.fillRect(-400,0,1000,120); line(ctx,-400,0,600,0,COL.ink,2.2);
        const rr=rng(9+i); for(let k=0;k<26;k++){ const bx=rr()*1100-450; const x=((bx-off)%1100+1100)%1100-450; ctx.save(); ctx.beginPath(); ctx.ellipse(x,-3,6+rr()*10,4+rr()*5,0,Math.PI,0); ctx.fillStyle='#d6cfc2'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }
        ctx.rotate(s.sway.x*0.6); drawOrg(ctx,c.k,-(s.slip>0?Math.sin(s.slip*6)*6:0),0,c.H*ppm*0.85,t,{mode:'walk',ph:s.ph,gait:'pace',hump:s.hump.x});
        ctx.restore();
        /* from behind: centre of mass over the feet */
        const L=640, T=top+150, th=slope*Math.PI/180, hp=c.h*70, bp=B*70;
        ctx.save(); ctx.beginPath(); ctx.arc(L,T-20,95,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
        ctx.translate(L,T); ctx.rotate(-th);
        ctx.fillStyle='#e7e1d6'; ctx.fillRect(-120,0,240,80); line(ctx,-120,0,120,0,COL.ink,2);
        const tilt=s.sway.x*0.6; ctx.rotate(tilt);
        line(ctx,-bp,0,-bp*0.8,-hp*0.75,COL.ink,4); line(ctx,bp,0,bp*0.8,-hp*0.75,COL.ink,4);
        ctx.beginPath(); ctx.ellipse(0,-hp,bp*1.9,hp*0.3,0,0,7); ctx.fillStyle='#fbf1df'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
        ctx.restore();
        /* plumb line from the centre of mass (body turned by a = −θ + sway about the feet) */
        const ang=-th+tilt, comX=L+hp*Math.sin(ang), comY=T-hp*Math.cos(ang);
        const fL=[L-bp*Math.cos(th),T+bp*Math.sin(th)], fR=[L+bp*Math.cos(th),T-bp*Math.sin(th)];
        const inside=comX>=fL[0]&&comX<=fR[0];
        line(ctx,comX,comY,comX,T+30,inside?COL.green:COL.red,2,[5,4]); circ(ctx,comX,comY,5,COL.red,COL.red,1);
        circ(ctx,fL[0],fL[1],4,COL.ink,COL.yellow,1.4); circ(ctx,fR[0],fR[1],4,COL.ink,COL.yellow,1.4);
        circ(ctx,L,T-20,95,COL.ink,null,2.6); textAt(ctx,'seen from behind',L,T-120,{align:'center',size:12,weight:700,color:COL.ink});
        out.push({p,z,thTip});
      }
      /* hump fat label */
      textAt(ctx,Math.round(c.fat0*s.hump.x)+' kg fat in hump'+(c.k==='bactrian'?'s':''),X,top+40,{align:'center',size:12,weight:700,color:COL.red});
      ctx.restore();
      if(i===0) line(ctx,0,252,800,252,'#c2d1e5',2);
    });
    textAt(ctx,MONTHS[mon],790,24,{align:'right',size:15,weight:700,color:COL.ink});
    /* readouts */
    setv($,'sRV',slope+'°'); setv($,'mRV',MONTHS[mon]);
    setv($,'cP',out.map(o=>Math.round(o.p/1000)+' kPa').join(' · ')); setv($,'cZ',out.map(o=>fmt(o.z*100,1)+' cm').join(' · '));
    setv($,'cS',out.map(o=>Math.round(o.thTip)+'°').join(' · ')); setv($,'cH',CM.map((c,i)=>Math.round(c.fat0*st[i].hump.x)+' kg').join(' · '));
    $('#sR').disabled=ter!==1;
  };
  S.found=()=>tried.sand&&tried.rock&&tried.mon?'Long legs, wide feet: the Rajasthan camel sinks less in sand · short legs keep the Ladakh camel steady on slopes; its humps carry it through winter':'';
  S.fb=()=>!tried.rock?['warn','Now walk them across a rocky slope.']:!tried.mon?['warn','Move the months on to late winter — watch the humps.']:['ok','✓ Each camel suits its own desert.'];
  return S;
}); }

function buildNav(){
  const nav = document.getElementById('sideNav');

    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
