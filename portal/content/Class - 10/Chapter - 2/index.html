<html lang="en">
<head>

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 2: ACIDS, BASES AND SALTS
   (NCERT Science, jesc102) — Activities 2.1 – 2.15.
   Every scene runs a continuous animation loop: controls only set targets.
   Every colour comes from a real pH (charge balance over strong ions and
   weak acids); gases, heat and currents follow real stoichiometry, rate
   laws and energy balances, compressed in time where needed.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

function rackDraw(ctx,x0,x1,y,foot){ ctx.save(); rect(ctx,x0,y,x1-x0,12,COL.ink,'#fff',2.4); line(ctx,x0+10,y+12,x0+10,foot,COL.ink,3); line(ctx,x1-10,y+12,x1-10,foot,COL.ink,3); line(ctx,x0,foot,x1,foot,COL.ink,3); ctx.restore(); }
/* reagent bottle with a label */
function bottleDraw(ctx,x,base,w,h,label,col,liq){ ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(x-w/2,base); ctx.lineTo(x-w/2,base-h+14); ctx.quadraticCurveTo(x-w/2,base-h,x-w*0.22,base-h); ctx.lineTo(x-w*0.22,base-h-12); ctx.lineTo(x+w*0.22,base-h-12); ctx.lineTo(x+w*0.22,base-h); ctx.quadraticCurveTo(x+w/2,base-h,x+w/2,base-h+14); ctx.lineTo(x+w/2,base); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(liq){ ctx.fillStyle=liq; ctx.fillRect(x-w/2+3,base-h*0.55,w-6,h*0.55-3); }
  rect(ctx,x-w*0.22-2,base-h-24,w*0.44+4,12,COL.ink,'#fff',2); rrect(ctx,x-w/2+5,base-h*0.72,w-10,h*0.3,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=1.8; ctx.stroke();
  const s=fitFont(ctx,label,w-14,13,800); textAt(ctx,label,x,base-h*0.72+h*0.15+s*0.35,{align:'center',size:s,weight:800,color:col||COL.ink}); ctx.restore(); }
/* simple straight test tube with liquid: returns {poly,L} of the liquid; mlPx = px² per mL */
function tubeWith(ctx,x,by,W,H,ml,mlPx,fill,edge,ang){ const P=tubeAt(W,H,x,by,ang||0); const r=fillLow(P,ml*mlPx);
  if(r.poly&&r.poly.length>2){ polyFill(ctx,r.poly,fill); const s=surfLine(r.poly,r.L); if(s&&edge) line(ctx,s[0],r.L,s[1],r.L,edge,2); } return {P,r}; }

/* =====================================================================
   2.1 INDICATORS ON A WATCH-GLASS  (Table 2.1)
   Nine lab solutions at bench strength (0.1 M; H₂SO₄ 0.05 M, Ca(OH)₂
   0.02 M, Mg(OH)₂ saturated). pH from the charge-balance engine.
   Red litmus is acid-primed (turns blue above ≈ pH 8.3), blue litmus is
   base-primed (turns red below ≈ pH 5); phenolphthalein pink above 8.2;
   methyl orange red below 3.1, yellow above 4.4.
   A drop spreads on the glass (radius eases to its size), then the
   indicator is applied: paper wicks the drop (Washburn front ∝ √t),
   a liquid indicator drop spreads by diffusion (front ∝ √(4Dt)).
   ===================================================================== */
const A1_SOL=[
  {k:'HCl',f:'HCl',c:0.1}, {k:'H2SO4',f:'H₂SO₄',c:0.05}, {k:'HNO3',f:'HNO₃',c:0.1}, {k:'CH3COOH',f:'CH₃COOH',c:0.1},
  {k:'NaOH',f:'NaOH',c:0.1}, {k:'CaOH2',f:'Ca(OH)₂',c:0.02}, {k:'KOH',f:'KOH',c:0.1}, {k:'MgOH2',f:'Mg(OH)₂',c:0.05}, {k:'NH4OH',f:'NH₄OH',c:0.1}];
const A1_IND=[{k:'rl',f:'Red litmus',paper:true,base:LIT_R,col:redLitmus},{k:'bl',f:'Blue litmus',paper:true,base:LIT_B,col:blueLitmus},
  {k:'ph',f:'Phenolphthalein',paper:false,col:phenCol},{k:'mo',f:'Methyl orange',paper:false,col:moCol}];
function buildA1(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const GX=235, GY=380, GR=175; // watch glass (seen from above at an angle)
  let si=0, ii=0, t=0;
  const res=A1_SOL.map(()=>A1_IND.map(()=>null));
  const S={};
  function reset(){ Object.assign(S,{ph:0, T:0, drop:null, spot:spr(0), paper:sprP(GX+120,-80), pw:0, ind:null, iR:0, iT:0, col:null, sq:[spr(0),spr(0)], auto:false, queue:[]}); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Sample solution</label><div class="chip-wrap" id="sl">${A1_SOL.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><label>Indicator</label><div class="chip-wrap" id="il">${A1_IND.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-i="${i}">${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Test</button><button class="toggle-btn" id="all">▶▶ All four</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="rs">↺ Clean the glass</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Colour seen',COL.ink)}${card('r2','So it is',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-s]',b=>{ si=+b.dataset.s; reset(); });
  chipsWire(side,'[data-i]',b=>{ ii=+b.dataset.i; });
  $('#rs').onclick=()=>{ reset(); };
  const busy=()=>S.phase&&S.phase!=='done';
  function start(ind){ ii=ind; side.querySelectorAll('[data-i]').forEach((b,k)=>b.classList.toggle('active',k===ii));
    const keep=S.spot.x>1&&!S.ind&&!S.col; if(!keep){ S.spot=spr(0); } S.ind=A1_IND[ii]; S.iR=0; S.iT=0; S.pw=0; S.col=null; S.phase=keep?'ind':'sample'; S.T=0; if(!keep) S.drop=null; }
  $('#go').onclick=()=>{ if(busy()) return; start(ii); };
  $('#all').onclick=()=>{ if(busy()) return; S.queue=[1,2,3]; start(0); };
  const LC={x:640,y:120};
  animLoop(dt=>{
    t+=dt; S.T+=dt; const sol=A1_SOL[si], pH=phOf(sol.k,sol.c);
    springTo(S.sq[0],0,300,18,dt); springTo(S.sq[1],0,300,18,dt);
    /* sequence: sample drop → spot spreads → indicator (paper dips / drop spreads) → record */
    if(S.phase==='sample'){ if(!S.drop&&S.T>0.4){ S.drop={x:GX,y:GY-190,vy:0,r:6}; S.sq[0].v+=16; }
      if(S.drop&&dropStep(S.drop,dt,GY)){ S.drop=null; drip(); S.phase='spread'; S.T=0; S.spot.v+=260; } }
    if(S.phase==='spread'&&S.T>0.9){ S.phase='ind'; S.T=0; }
    if(S.phase==='ind'){ const I=S.ind;
      if(I.paper){ sprPStep(S.paper,GX+60,GY-140,dt,50,11); if(S.T>1.1){ S.phase='wick'; S.T=0; } }
      else { if(!S.drop&&S.T>0.5){ S.drop={x:GX+44,y:GY-190,vy:0,r:5}; S.sq[1].v+=16; } if(S.drop&&dropStep(S.drop,dt,GY)){ S.drop=null; drip(); S.phase='wick'; S.T=0; } } }
    if(S.phase==='wick'){ const I=S.ind;
      if(I.paper){ S.pw=Math.min(0.55,0.2*Math.sqrt(S.T*6)); sprPStep(S.paper,GX+60,GY-140,dt,50,11); }
      else S.iR=Math.min(1,Math.sqrt(4*0.08*S.T));
      S.col=I.col(pH);
      if(S.T>2.4){ res[si][ii]=S.col; S.phase='done'; S.T=0;
        if(S.queue.length){ const n=S.queue.shift(); S.phase='next'; S.nextI=n; } } }
    if(S.phase==='next'&&S.T>1.0){ S.spot=spr(0); S.phase=null; start(S.nextI); }
    if(!S.ind||!S.ind.paper||S.phase==='done'||S.phase==='next') sprPStep(S.paper,GX+120,-90,dt,40,10);
    /* readouts */
    const I=A1_IND[ii], cc=res[si][ii];
    if(cc){ const name=I.k==='rl'?(pH>8.3?'turns blue':'stays red'):I.k==='bl'?(pH<5.4?'turns red':'stays blue'):I.k==='ph'?(phenA(pH)>0.3?'pink':'colourless'):(pH<3.1?'red':pH<4.4?'orange':'yellow');
      setv($,'r1',name); setv($,'r2',natureOf(pH)); setc($,'r2',natureCol(pH)); }
    else { setv($,'r1','—'); setv($,'r2','—'); }
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    // watch glass seen from above-front: an ellipse with a shallow bowl
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(GX,GY,GR,GR*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(GX,GY+10,GR*0.72,GR*0.24,0,0.1,Math.PI-0.1); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    line(ctx,GX-GR-30,GY+80,GX+GR+30,GY+80,COL.ink,2.6);
    // the sample spot, then indicator colour spreading
    const sr=Math.max(0,S.spot.x);
    if(S.phase==='spread'||S.phase==='ind'||S.phase==='wick'||S.phase==='done'||S.phase==='next'||sr>1){ springTo(S.spot,70,60,9,dt);
      spotDraw(ctx,GX,GY,sr,'rgba(170,205,240,0.75)',1,0.36);
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); ctx.ellipse(GX,GY,Math.max(1,sr*0.92),Math.max(1,sr*0.33),0,0,Math.PI*2); ctx.stroke(); ctx.restore();
      if(S.ind&&!S.ind.paper&&S.col&&(S.phase==='wick'||S.phase==='done'||S.phase==='next')){ const ir=sr*S.iR; const c=S.ind.k==='ph'&&phenA(pH)<0.05?'rgba(255,255,255,0.0)':S.col;
        if(S.ind.k==='ph'&&phenA(pH)<0.05) spotDraw(ctx,GX+30,GY,ir*0.95,'rgba(255,255,255,0.8)',1,0.36); else spotDraw(ctx,GX+30,GY,ir*0.95,c,0.9,0.36); } }
    // droppers: sample (left) and liquid indicator (right)
    dropperDraw(ctx,GX,GY-196,clamp(S.sq[0].x/6,0,1),0.6,'rgba(170,205,240,0.8)'); textAt(ctx,sol.f,GX-22,GY-300,{align:'right',size:15,weight:800,color:COL.yellow});
    if(S.ind&&!S.ind.paper){ const ic=S.ind.k==='ph'?'rgba(235,235,240,0.9)':'#e89a2a'; dropperDraw(ctx,GX+44,GY-196,clamp(S.sq[1].x/6,0,1),0.6,ic); textAt(ctx,S.ind.f,GX+74,GY-300,{size:14,weight:800,color:COL.yellow}); }
    if(S.drop) dropDraw(ctx,S.drop,S.phase==='sample'?'rgba(170,205,240,0.95)':(S.ind&&S.ind.k==='mo'?'#e89a2a':'rgba(240,240,245,0.95)'));
    // litmus paper held by tongs, dipping its tip into the spot
    if(S.ind&&S.ind.paper){ const px=S.paper.x.x, py=S.paper.y.x; tongsDraw(ctx,px,py-4,-Math.PI/2+0.3,0.2,150);
      stripDraw(ctx,px,py,26,150,0.3,S.ind.base,S.pw,S.col||S.ind.base); }
    // lens: ions in the drop and the dye molecules taking / losing H⁺
    if(sr>20){ lens(ctx,LC.x,LC.y,86,GX+30,GY-4,'',()=>{ const nH=clamp(Math.round((7-pH)*1.6),0,10), nO=clamp(Math.round((pH-7)*1.6),0,10), r=rng(11);
        for(let k=0;k<22;k++) waterMol(ctx,LC.x-80+r()*160,LC.y-80+r()*160,5,r()*6+t*0.3,0.35);
        for(let k=0;k<nH;k++){ const a=k*2.4+t*0.7, R=25+(k*17)%55; ionDraw(ctx,LC.x+Math.cos(a)*R,LC.y+Math.sin(a*1.3)*R*0.8,9,1,{sym:'H'}); }
        for(let k=0;k<nO;k++){ const a=k*2.4+t*0.6+1, R=25+(k*19)%55; ionDraw(ctx,LC.x+Math.cos(a)*R,LC.y+Math.sin(a*1.2)*R*0.8,10,-1,{sym:'OH'}); }
        if(S.col&&(S.phase==='wick'||S.phase==='done'||S.phase==='next')) for(let k=0;k<3;k++){ const x=LC.x-40+k*40, y=LC.y+46*Math.sin(k*2+t*0.5)*0.4; ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.4+k);
          ctx.beginPath(); for(let j=0;j<6;j++){ const a=j/6*Math.PI*2; j?ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11):ctx.moveTo(11,0); } ctx.closePath(); ctx.fillStyle=S.col; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore(); } });
      tag(ctx,pH<6.5?'H⁺ ions':pH>7.5?'OH⁻ ions':'water',LC.x,LC.y+104,natureCol(pH),{size:12}); }
    // Table 2.1 on the bench card
    const TX=500, TY=274, cw=66, rh=27;
    ctx.save(); rrect(ctx,TX-8,TY-34,300,rh*9+44,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    ['Red L','Blue L','Phen.','M.O.'].forEach((c,j)=>textAt(ctx,c,TX+62+j*cw*0.9+cw*0.45,TY-12,{align:'center',size:11,weight:700,color:COL.muted}));
    A1_SOL.forEach((s,i)=>{ const y=TY+i*rh; if(i===si){ ctx.save(); ctx.fillStyle='rgba(217,160,23,0.14)'; ctx.fillRect(TX-6,y-2,296,rh-2); ctx.restore(); }
      textAt(ctx,s.f,TX,y+17,{size:12,weight:700,color:COL.ink});
      A1_IND.forEach((I,j)=>{ const x=TX+62+j*cw*0.9+8, c=res[i][j]; rrect(ctx,x,y+3,cw*0.9-16,rh-8,5); ctx.save(); ctx.fillStyle=c||'#f4f7fb'; ctx.fill(); ctx.strokeStyle=c?COL.ink:'#dbe4f0'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); }); });
    if(res[si].every(Boolean)) textAt(ctx,natureOf(pH),TX+146,TY+9*rh+6,{align:'center',size:13,weight:800,color:natureCol(pH)});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.2 OLFACTORY INDICATORS — onion, vanilla, clove
   Two samples: A gets dilute HCl, B gets dilute NaOH (1 M drops).
   Vanilla (vanillin, pKa 7.4) and clove oil (eugenol, pKa 10.2) are
   phenols: only the neutral molecule is volatile, so the smell you get
   ∝ store × 1/(1 + 10^(pH − pKa)). In NaOH they become ions → no smell.
   Onion odour (sulfur compounds) is destroyed by OH⁻:
   dO/dt = −0.8·[OH⁻]/0.05 M · O (a few seconds at pH 12.7), acid leaves it.
   Rinsing sets the strip back near pH 7 and washes out ≈ 25 % of the smell.
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=486, SX=[150,330];
  const IND={onion:{f:'Onion cloth',pKa:null}, vanilla:{f:'Vanilla',pKa:7.4}, clove:{f:'Clove oil',pKa:10.2}};
  let ind='onion', t=0;
  const S={};
  function reset(){ Object.assign(S,{smp:[0,1].map(i=>({O:1, m:mixNew(4), drops:0, wet:spr(0), per:0, sq:spr(0), drop:null})), wisp:[], face:sprP(620,380), sniff:-1, sT:0, rinse:0, rinseT:0, spray:[], lensI:0}); S.smp.forEach(s=>mixAdd(s.m,'water',0)); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Indicator</label><div class="toggle-group"><button class="toggle-btn active" data-k="onion">Onion cloth</button><button class="toggle-btn" data-k="vanilla">Vanilla</button><button class="toggle-btn" data-k="clove">Clove oil</button></div></div>
    <div class="control-group"><label>Add a few drops</label><div class="toggle-group"><button class="toggle-btn" id="dA">💧 HCl on A</button><button class="toggle-btn" id="dB">💧 NaOH on B</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="rn">🚿 Rinse with water</button><button class="toggle-btn" id="rs">↺ Fresh</button></div></div>
    <div class="control-group"><label>Smell</label><div class="toggle-group"><button class="toggle-btn play" id="nA">👃 Sniff A</button><button class="toggle-btn play" id="nB">👃 Sniff B</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Smell of A',COL.red)}${card('r2','Smell of B',COL.blue)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-k]',b=>{ ind=b.dataset.k; reset(); fb.className='fb hidden'; $('#rn').disabled=ind!=='onion'; });
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  const addDrops=i=>{ const s=S.smp[i]; if(s.drop||s.drops>=6) return; s.pend=3; };
  $('#dA').onclick=()=>addDrops(0); $('#dB').onclick=()=>addDrops(1);
  $('#rn').onclick=()=>{ if(ind!=='onion'||S.rinseT>0) return; S.rinseT=2.2; };
  $('#nA').onclick=()=>{ S.sniff=0; S.sT=0; S.lensI=0; }; $('#nB').onclick=()=>{ S.sniff=1; S.sT=0; S.lensI=1; };
  const smellOf=s=>{ const pH=mixPH(s.m), I=IND[ind]; return I.pKa?s.O/(1+Math.pow(10,pH-I.pKa)):s.O; };
  const word=v=>v>0.6?'strong':v>0.2?'faint':'none';
  animLoop(dt=>{
    t+=dt; const I=IND[ind];
    S.smp.forEach((s,i)=>{ springTo(s.sq,0,300,18,dt); springTo(s.wet,Math.min(1,s.drops/3),30,8,dt);
      if(s.pend>0&&!s.drop){ s.drop={x:SX[i],y:150,vy:0,r:5}; s.sq.v+=16; s.pend--; }
      if(s.drop){ const top=ind==='onion'?260:BENCH-146; if(dropStep(s.drop,dt,top)){ s.drop=null; drip(); s.drops++; mixAdd(s.m,i?'NaOH':'HCl',1*0.05); s.m.V+=0.05; } }
      const pH=mixPH(s.m); if(ind==='onion'){ const OH=Math.pow(10,pH-14); s.O*=Math.exp(-0.8*OH/0.05*dt); }
      s.per=approach(s.per,smellOf(s),3,dt);
      if(Math.random()<s.per*14*dt){ const y0=ind==='onion'?220+Math.random()*120:BENCH-240; wispAdd(S.wisp,SX[i]+(Math.random()-0.5)*30,y0,(Math.random()-0.5)*20,-30,COL.green); S.wisp[S.wisp.length-1].src=i; } });
    /* rinse: wash-bottle squirt arcs onto both strips */
    if(S.rinseT>0){ S.rinseT-=dt; for(let k=0;k<2;k++) S.spray.push({x:520,y:230,vx:-(230+Math.random()*40)-(k?0:0),vy:-60+Math.random()*30,tgt:k});
      if(S.rinseT<=0){ S.smp.forEach(s=>{ s.m=mixNew(4); s.O*=0.75; s.drops=0; }); fbSet(fb,'ok','Rinsed: the acid or base is washed away.'); } }
    S.spray.forEach(p=>{ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); S.spray=S.spray.filter(p=>p.y<BENCH&&p.x>40);
    /* the face leans in to sniff; wisps get pulled into the nose */
    let nose=null;
    if(S.sniff>=0){ S.sT+=dt; const tx=SX[S.sniff]+100, ty=ind==='onion'?291:BENCH-207; sprPStep(S.face,tx,ty,dt,40,11); if(S.sT>3.4) S.sniff=-1; }
    else sprPStep(S.face,620,380,dt,30,10);
    const fs=1.6, fx=S.face.x.x, fy=S.face.y.x; nose={x:fx-22*fs, y:fy-18*fs};
    const inhale=S.sniff>=0&&S.sT>0.9;
    wispStep(S.wisp,dt,inhale?nose.x:undefined,inhale?nose.y:undefined);
    if(inhale){ S.wisp=S.wisp.filter(w=>Math.hypot(w.x-nose.x,w.y-nose.y)>14); }
    if(S.sniff>=0&&S.sT>1.6&&S.sT<1.7){ const v=S.smp[S.sniff].per; const who=S.sniff?'B (NaOH)':'A (HCl)';
      fbSet(fb,v>0.2?'warn':'ok',v>0.2?`${who}: the ${I.f.toLowerCase()} smell is still there.`:`${who}: no smell — the base killed the odour.`); }
    setv($,'r1',word(S.smp[0].per)); setv($,'r2',word(S.smp[1].per));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    S.smp.forEach((s,i)=>{ const x=SX[i];
      if(ind==='onion'){ // cloth strip hanging from a clip on a stand
        line(ctx,x-60,BENCH,x-60,190,COL.ink,3.4); line(ctx,x-60,196,x,196,COL.ink,3); rect(ctx,x-12,188,24,16,COL.ink,'#fff',2);
        ctx.save(); ctx.beginPath(); for(let k=0;k<=20;k++){ const y=204+k*9, xx=x-22+Math.sin(k*0.7+t*1.2)*2.5; k?ctx.lineTo(xx,y):ctx.moveTo(xx,y); } for(let k=20;k>=0;k--){ const y=204+k*9, xx=x+22+Math.sin(k*0.7+t*1.2+0.5)*2.5; ctx.lineTo(xx,y); } ctx.closePath();
        ctx.fillStyle='#fbfaf4'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.clip();

/* =====================================================================
   2.5 CARBONATE / HYDROGENCARBONATE + HCl → CO₂ → LIME WATER
   A: 0.5 g Na₂CO₃ = 4.72 mmol; B: 0.5 g NaHCO₃ = 5.95 mmol.
   2 mL of 3 M HCl = 6 mmol H⁺ per portion, running in through a thistle
   funnel. H⁺ first turns CO₃²⁻ into HCO₃⁻ (instant, no gas); only then
   HCO₃⁻ + H⁺ → CO₂ + H₂O at r = 0.12·h·b/(b + 1) mmol/s.
   So B fizzes hard at once; A gives only 1.3 mmol CO₂ until more acid.
   Headspace + tube (25 mL) of air is pushed out first: x' = q(1 − x)/25.
   Lime water: 20 mL saturated Ca(OH)₂ = 0.40 mmol; 15 % of the CO₂
   bubbled is absorbed. First 0.40 mmol → CaCO₃ (milky); the next
   0.40 mmol → Ca(HCO₃)₂ (clears again: "excess CO₂").
   ===================================================================== */
function buildA5(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=500, TW=58, TH=210, LW=58, LH=220, MLR=2600/2, MLL=1000/2; // px² per mL
  const U=[{x:110,lx:285,lab:'A',f:'Na₂CO₃',co3:4.72,hco3:0},{x:470,lx:645,lab:'B',f:'NaHCO₃',co3:0,hco3:5.95}];
  let t=0; const S={};
  function reset(){ S.u=U.map(u=>({c:u.co3, b:u.hco3, h:0, acidIn:0, funnel:0, V:0, co2:0, x:0, abs:0, bub:[], acc:0, lb:[], lacc:0, milk:0, grains:[], foam:0})); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Dilute HCl (2 mL each time)</label><div class="toggle-group"><button class="toggle-btn play" id="both">▶ Into A and B</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="a">+ A only</button><button class="toggle-btn" id="b">+ B only</button><button class="toggle-btn" id="rs">↺ Fresh</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','CO₂ from A',COL.green)}${card('r2','CO₂ from B',COL.green)}${card('r3','Lime water A',COL.ink)}${card('r4','Lime water B',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const add=i=>{ const s=S.u[i]; if(s.funnel>0.2||s.acidIn>=8) return; s.funnel=2; };
  $('#both').onclick=()=>{ add(0); add(1); }; $('#a').onclick=()=>add(0); $('#b').onclick=()=>add(1);
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  const milkWord=s=>s.abs<0.02?'clear':s.abs<0.4?'milky':s.abs<0.75?'clearing':'clear again';
  animLoop(dt=>{
    t+=dt;
    S.u.forEach((s,i)=>{ const u=U[i];
      /* acid drains from the funnel (≈ 1.3 s per 2 mL) */
      if(s.funnel>0){ const q=Math.min(s.funnel,1.5*dt); s.funnel-=q; s.V+=q; s.h+=q*3; s.acidIn+=q; }
      const x0=Math.min(s.h,s.c); s.c-=x0; s.b+=x0; s.h-=x0;
      const r=0.12*s.h*s.b/(s.b+1), dn=Math.min(r*dt,s.h,s.b); s.h-=dn; s.b-=dn; s.co2+=dn;
      const q=dn*24.5; s.x+=q*(1-s.x)/25; s.foam=approach(s.foam,clamp(r*1.2,0,1),4,dt);
      s.acc+=clamp(r*60,0,80)*dt; while(s.acc>1){ s.acc-=1; s.bub.push({x:u.x+(Math.random()-0.5)*TW*0.6,y:BENCH-14,vy:-20,vx:0,r:1.6+Math.random()*1.5,ph:Math.random()*6}); }
      if(r>0.05&&Math.random()<r*dt*6) fizzTick();
      /* gas leaves through the lime water */
      s.abs+=0.15*dn*s.x; s.lacc+=q*6; while(s.lacc>1){ s.lacc-=1; s.lb.push({x:u.lx+(Math.random()-0.5)*6,y:BENCH-40,vy:-30,vx:0,r:2.4+Math.random()*1.6,ph:Math.random()*6}); }
      const caco3=s.abs<0.4?s.abs:Math.max(0,0.8-s.abs); s.milk=approach(s.milk,caco3/0.4,2.5,dt);
      const want=Math.round(s.milk*260); while(s.grains.length<want) s.grains.push({x:(Math.random()-0.5)*LW*0.8,y:30+Math.random()*120,ph:Math.random()*6}); if(s.grains.length>want) s.grains.length=want; });
    setMany($,{r1:fmt(S.u[0].co2*24.5,0)+' mL', r2:fmt(S.u[1].co2*24.5,0)+' mL', r3:milkWord(S.u[0]), r4:milkWord(S.u[1])});
    if(S.u[0].acidIn>1.9&&S.u[0].c<=0&&S.u[0].co2<1.5&&S.u[1].co2>3&&fb.className.includes('hidden')) fbSet(fb,'warn','A fizzes less: the first acid only turns CO₃²⁻ into HCO₃⁻. Add more to A.');
    if(S.u.some(s=>s.abs>0.6)) fbSet(fb,'ok','Excess CO₂: the white CaCO₃ turns into soluble Ca(HCO₃)₂.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    S.u.forEach((s,i)=>{ const u=U[i];
      // navy card behind the lime water so the milkiness shows
      ctx.save(); rrect(ctx,u.lx-60,BENCH-250,120,230,10); ctx.fillStyle='#1d3557'; ctx.fill(); ctx.restore();
      rackDraw(ctx,u.x-60,u.lx+60,BENCH-80,BENCH);
      // reaction tube: powder + liquid
      const P=tubeAt(TW,TH,u.x,BENCH-6,0);
      const liqA=Math.max(0,s.V)*MLR, pw=(s.c+s.b)/(u.co3+u.hco3); const pr=fillLow(P,380*clamp(pw,0,1)+1);
      if(s.V>0.01){ const r=fillLow(P,liqA+380*clamp(pw,0,1)*0.4); polyFill(ctx,r.poly,'rgba(217,67,43,0.10)'); const sl=surfLine(r.poly,r.L); if(sl) line(ctx,sl[0],r.L,sl[1],r.L,COL.red,1.8);
        if(s.foam>0.05){ ctx.save(); ctx.globalAlpha=s.foam; for(let k=0;k<9;k++) circ(ctx,u.x-TW/2+6+k*5.6,r.L-3-Math.abs(Math.sin(t*9+k))*4*s.foam,3+s.foam*2,COL.green,'#fff',1.3); ctx.restore(); } }
      if(pw>0.01) polyFill(ctx,pr.poly,'#f4f6f9'), (()=>{ const sl=surfLine(pr.poly,pr.L); if(sl){ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.beginPath(); for(let k=0;k<=10;k++){ const xx=lerp(sl[0],sl[1],k/10), yy=pr.L+Math.sin(k*1.7)*1.5; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore(); } })();
      bubbleStep(s.bub,dt,()=>BENCH-14-s.V*MLR/TW-10); bubbleDraw(ctx,s.bub,COL.green);
      glassDraw(ctx,P,2.6);
      // cork + thistle funnel + delivery tube
      const top=BENCH-6-TH; rect(ctx,u.x-TW/2-4,top-10,TW+8,26,COL.ink,'#fff',2.4);
      const fx=u.x-12; line(ctx,fx,top+10,fx,top-110,COL.ink,6); line(ctx,fx,top+10,fx,top-110,'#fff',2.4);
      ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(fx-3,top-110); ctx.quadraticCurveTo(fx-26,top-120,fx-26,top-150); ctx.arc(fx,top-150,26,Math.PI,0); ctx.quadraticCurveTo(fx+26,top-120,fx+3,top-110); ctx.fill(); ctx.stroke(); ctx.restore();
      if(s.funnel>0.02){ const lv=top-150+26-s.funnel*14; ctx.save(); ctx.beginPath(); ctx.arc(fx,top-150,24,0,Math.PI*2); ctx.clip(); ctx.fillStyle='rgba(217,67,43,0.25)'; ctx.fillRect(fx-26,lv,52,60); ctx.restore(); line(ctx,fx,top-110,fx,top+10+ (BENCH-top)*0.4,'rgba(217,67,43,0.6)',2.4); }
      textAt(ctx,'HCl',fx,top-186,{align:'center',size:13,weight:800,color:COL.yellow});
      const dx=u.x+12, ty=150; ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(dx,top+10); ctx.lineTo(dx,ty); ctx.lineTo(u.lx,ty); ctx.lineTo(u.lx,BENCH-40); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke();
      if(s.co2>0&&s.foam>0.03){ ctx.setLineDash([5,20]); ctx.lineDashOffset=-t*80; ctx.strokeStyle=COL.green; ctx.lineWidth=2.6; ctx.stroke(); } ctx.restore();
      // lime-water tube
      const L=tubeAt(LW,LH,u.lx,BENCH-6,0), lr=fillLow(L,20*MLL);
      polyFill(ctx,lr.poly,'rgba(120,170,230,0.28)'); ctx.save(); ctx.globalAlpha=0.9*s.milk; polyFill(ctx,lr.poly,'#ffffff'); ctx.restore();
      polyClipFill(ctx,lr.poly,()=>{ ctx.fillStyle='#ffffff'; s.grains.forEach(g=>{ const yy=BENCH-6-g.y+Math.sin(t*1.2+g.ph)*3; ctx.fillRect(u.lx+g.x+Math.sin(t+g.ph)*2-1.2,yy-1.2,2.4,2.4); }); });
      bubbleStep(s.lb,dt,()=>lr.L); bubbleDraw(ctx,s.lb,COL.green);
      ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineJoin='round'; ctx.beginPath(); L.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); glassDraw(ctx,L,2.6); line(ctx,u.lx-LW/2+3,lr.L,u.lx+LW/2-3,lr.L,COL.blue,1.8);
      textAt(ctx,'lime water',u.lx,BENCH-262,{align:'center',size:12,weight:700,color:COL.blue});
      textAt(ctx,u.lab,u.x,BENCH+30,{align:'center',size:20,weight:800,color:COL.ink}); textAt(ctx,u.f,u.x,BENCH+50,{align:'center',size:13,weight:700,color:COL.muted});
      // equation strip for this side
      if(s.co2>0.2) eqStrip(ctx,i?[{t:'NaHCO₃ + HCl → NaCl + H₂O + '},{t:'CO₂↑',col:COL.green}]:[{t:'Na₂CO₃ + 2HCl → 2NaCl + H₂O + '},{t:'CO₂↑',col:COL.green}],i?590:210,30,clamp(s.co2,0,1),12);
    });
    if(S.u.some(s=>s.abs>0.05)) eqStrip(ctx,[{t:'Ca(OH)₂ + CO₂ → '},{t:'CaCO₃↓',col:COL.ink},{t:' + H₂O'}],400,70,1,12);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.6 NaOH + PHENOLPHTHALEIN, THEN HCl DROP BY DROP
   Tube: 2 mL of 0.1 M NaOH = 0.20 mmol OH⁻ + 2 drops phenolphthalein.
   Droppers: 0.5 M HCl and 0.5 M NaOH, 0.05 mL per drop = 0.025 mmol
   → exactly 8 HCl drops neutralise the tube.
   The liquid is 40 thin layers, each holding its own excess OH⁻ (or H⁺).
   A drop plunges into the top third; layers then mix by diffusion
   (D 0.6 layer²/s still, 400 layer²/s while you swirl). Each layer's
   pH → phenolphthalein pink above 8.2, colourless below: you see the
   colourless streak first, then the whole tube decide.
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=510, BX=250, TW=88, TH=320, ML=6000, N=40, DROP=0.025;
  let t=0; const S={};
  function reset(){ Object.assign(S,{V:2.1, L:new Array(N).fill(0.20/N), nA:0, nB:0, drop:null, who:0, sq:[spr(0),spr(0)], swirl:0, ang:spr(0), pts:[[0,phMean(0.20,2.1)]], cool:0, ions:[]}); }
  function phMean(ex,V){ const e=ex/V; return Math.abs(e)<1e-7?7:e>0?14+Math.log10(e):-Math.log10(-e); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Add one drop</label><div class="toggle-group"><button class="toggle-btn play" id="hA">💧 Dilute HCl</button><button class="toggle-btn" id="hB">💧 Dilute NaOH</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="sw">↻ Swirl</button><button class="toggle-btn" id="rs">↺ Fresh tube</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','HCl drops',COL.red)}${card('r2','NaOH drops',COL.blue)}${card('r3','pH (mixed)',COL.green)}${card('r4','Colour',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const drop=i=>{ if(S.drop||S.cool>0) return; S.who=i; S.sq[i].v+=16; S.cool=0.5; S.drop={x:BX+(i?22:-22),y:BENCH-TH-28,vy:0,r:4.5}; };
  $('#hA').onclick=()=>drop(0); $('#hB').onclick=()=>drop(1);
  $('#sw').onclick=()=>{ S.swirl=2.4; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  const layerPH=e=>phMean(e*N,S.V); // e = mmol in a layer of volume V/N
  animLoop(dt=>{
    t+=dt; S.cool-=dt; S.sq.forEach(q=>springTo(q,0,300,18,dt));
    const piv={x:BX,y:BENCH-TH+40}, a=S.ang.x;
    const PW=rotPts(tubeLocal(TW,TH).map(([x,y])=>[x,y+TH-46]),piv.x,piv.y,a);
    const liq=fillLow(PW,S.V*ML);
    if(S.drop&&dropStep(S.drop,dt,liq.L)){ const sgn=S.who?1:-1; S.V+=0.05; if(S.who) S.nB++; else S.nA++; drip();
      const w=[]; let sw=0; for(let k=0;k<N;k++){ const d=(N-1-k)/(N*0.3); const v=Math.exp(-d*d*2.2); w.push(v); sw+=v; } w.forEach((v,k)=>S.L[k]+=sgn*DROP*v/sw);
      S.drop=null; const tot=S.L.reduce((a,b)=>a+b,0); S.pts.push([S.nA-S.nB,phMean(tot,S.V)]); }
    /* mixing: diffusion between layers (explicit, sub-stepped) */
    const D=S.swirl>0?400:0.6, sub=Math.ceil(D*dt/0.2)+1; for(let s=0;s<sub;s++){ const L=S.L.slice(); for(let k=0;k<N;k++){ const a=k>0?L[k-1]:L[k], b=k<N-1?L[k+1]:L[k]; S.L[k]+=D*(dt/sub)*(a+b-2*L[k]); } }
    if(S.swirl>0){ S.swirl-=dt; springTo(S.ang,Math.sin(t*9)*0.14,120,6,dt); } else springTo(S.ang,0,60,9,dt);
    const tot=S.L.reduce((a,b)=>a+b,0), pHm=phMean(tot,S.V);
    setMany($,{r1:String(S.nA), r2:String(S.nB), r3:fmt(pHm,1), r4:phenA(pHm)>0.25?'pink':'colourless'}); setc($,'r4',phenA(pHm)>0.25?'#c2186b':COL.muted);
    if(Math.abs(tot)<DROP*0.6&&S.nA>0) fbSet(fb,'ok','Neutral: NaOH + HCl → NaCl + H₂O. The pink has gone.');
    else if(tot<0&&S.nB>0&&S.nA>0) fbSet(fb,'warn','Acid in excess — add NaOH drops to bring the pink back.');
    else if(tot>0&&S.nA>8&&S.nB>0) fbSet(fb,'ok','Pink again: excess OH⁻ is back.');

    const nOH=clamp(Math.round(tot/0.025),0,8), nH=clamp(Math.round(-tot/0.025),0,8);
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH+24);
    line(ctx,90,BENCH+24,90,BENCH-TH+10,COL.ink,4); line(ctx,90,BENCH-TH+40,BX-TW/2-4,BENCH-TH+40,COL.ink,3.4);
    polyClipFill(ctx,liq.poly,()=>{ const top=liq.L, bot=BENCH-6+10, H=bot-top; for(let k=0;k<N;k++){ const y0=bot-(k+1)*H/N, pH=layerPH(S.L[k]);
        ctx.fillStyle=phenA(pH)>0.01?rgba('#e0287d',0.12+0.62*phenA(pH)):'rgba(235,240,248,0.5)'; ctx.fillRect(BX-TW,y0,TW*2,H/N+1); } });
    const sl=surfLine(liq.poly,liq.L); if(sl) line(ctx,sl[0],liq.L,sl[1],liq.L,COL.ink,1.6);
    glassDraw(ctx,PW,3);
    ctx.save(); ctx.translate(piv.x,piv.y); ctx.rotate(a); rect(ctx,-TW/2-10,-10,TW+20,20,COL.ink,'#fff',2.4); ctx.restore();
    // droppers
    [0,1].forEach(i=>{ const x=BX+(i?22:-22), y=BENCH-TH-34; dropperDraw(ctx,x,y,clamp(S.sq[i].x/6,0,1),0.6,i?'rgba(47,143,224,0.25)':'rgba(217,67,43,0.22)');
      textAt(ctx,i?'NaOH':'HCl',x+(i?26:-26),y-104,{align:i?'left':'right',size:14,weight:800,color:i?COL.blue:COL.red}); });
    if(S.drop) dropDraw(ctx,S.drop,'rgba(225,235,248,0.95)');
    // lens: H⁺ + OH⁻ → H₂O
    const LX=630, LY=118; lens(ctx,LX,LY,88,BX+20,liq.L+30,'',()=>{ const r=rng(5);
      for(let k=0;k<16;k++) waterMol(ctx,LX-80+r()*160,LY-80+r()*160,5,r()*6+t*0.2,0.35);
      for(let k=0;k<nOH;k++){ const an=k*0.8+t*0.5; ionDraw(ctx,LX+Math.cos(an)*(30+k*6),LY+Math.sin(an*1.3)*(26+k*5),11,-1,{sym:'OH'}); }
      for(let k=0;k<nH;k++){ const an=k*0.9+t*0.6+2; ionDraw(ctx,LX+Math.cos(an)*(32+k*6),LY+Math.sin(an*1.2)*(28+k*5),9,1,{sym:'H'}); }
      for(let k=0;k<3;k++){ const x=LX-50+k*50, y=LY+46; ionDraw(ctx,x-12,y,8,1,{sym:'Na'}); ionDraw(ctx,x+12,y,8,-1,{sym:'Cl'}); } });
    tag(ctx,nOH?'OH⁻ in excess':nH?'H⁺ in excess':'H⁺ + OH⁻ → H₂O',LX,LY+104,nOH?COL.blue:nH?COL.red:COL.green,{size:12});
    // pH vs net HCl drops (well mixed)
    const GX=480, GY=292, GW=290, GH=190; ctx.save(); rrect(ctx,GX-10,GY-26,GW+20,GH+62,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    const gx=d=>GX+30+clamp(d,-2,14)/14*(GW-40), gy=p=>GY+GH-8-clamp(p,0,14)/14*(GH-16);
    line(ctx,GX+30,GY,GX+30,GY+GH,COL.ink,1.6); line(ctx,GX+30,gy(7),GX+GW,gy(7),COL.green,1.2,[5,5]); line(ctx,GX+30,GY+GH-8,GX+GW,GY+GH-8,COL.ink,1.6);
    ctx.save(); ctx.fillStyle=rgba('#e0287d',0.10); ctx.fillRect(GX+31,gy(14),GW-31,gy(8.2)-gy(14)); ctx.restore();
    [0,7,14].forEach(p=>textAt(ctx,String(p),GX+24,gy(p)+4,{align:'right',size:10.5,weight:700,color:COL.muted}));
    textAt(ctx,'pH',GX+38,GY-8,{size:12,weight:800,color:COL.green}); textAt(ctx,'net HCl drops →',GX+GW,GY+GH+22,{align:'right',size:11,weight:700,color:COL.red}); textAt(ctx,'8',gx(8),GY+GH+8,{align:'center',size:10,weight:700,color:COL.muted});
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.2; ctx.beginPath(); S.pts.forEach((p,k)=>k?ctx.lineTo(gx(p[0]),gy(p[1])):ctx.moveTo(gx(p[0]),gy(p[1]))); ctx.stroke(); ctx.restore();
    S.pts.forEach(p=>circ(ctx,gx(p[0]),gy(p[1]),3.4,COL.green,'#fff',1.8)); const lp=S.pts[S.pts.length-1]; circ(ctx,gx(lp[0]),gy(pHm),6,COL.ink,phenCol(pHm),2);
    if(S.nA>0) eqStrip(ctx,[{t:'NaOH',col:COL.blue},{t:' + '},{t:'HCl',col:COL.red},{t:' → NaCl + '},{t:'H₂O',col:COL.green}],610,256,clamp(S.nA/2,0,1),14);
    ctx.restore();

}

/* =====================================================================
   2.7 COPPER OXIDE + DILUTE HCl
   0.40 g black CuO = 5.0 mmol in 60 grains. 2 M HCl poured slowly
   (a thin stream while you hold the cylinder tipped).
   CuO + 2HCl → CuCl₂ + H₂O: each grain dissolves at
   dn/dt = −0.0017 mmol/s·(n/n₀)^(2/3)·[H⁺]·(4 if stirred) — surface-
   limited, so stirring (fresh acid at the surface) speeds it ×4.
   5 mL of acid (10 mmol H⁺) dissolves all of it. Colour = Cu²⁺ with
   Cl⁻: blue-green, depth ∝ [Cu²⁺] (full at 0.5 M).
   ===================================================================== */
function buildA7(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=270, TOP=210, BOT=480, BW=250, ML=5625; // beaker px² per mL
  let t=0, pour=false, stir=false; const S={};
  const P=pourerNew(CX+BW/2+70,TOP+60,34,130,10);
  function reset(){ const r=rng(21); Object.assign(S,{V:0, H:0, cu:0, rodA:0, rodS:spr(0), g:Array.from({length:60},()=>({n:5/60, phi:r()*6.283, rho:r()*BW*0.42, y:0, vy:0, s:0.8+r()*0.6}))});
    P.ml=10; P.p.x.x=P.rest.x; P.p.y.x=P.rest.y; P.a.x=0; P.T={x:P.rest.x,y:P.rest.y,a:0}; pour=false; stir=false; setBtn($('#po'),'▶ Pour acid slowly','play'); setBtn($('#st'),'🥄 Stir',''); }
  side.innerHTML=`
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="po">▶ Pour acid slowly</button><button class="toggle-btn" id="st">🥄 Stir</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="rs">↺ Start again</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Acid added',COL.red)}${card('r2','CuO left',COL.ink)}${card('r3','Cu²⁺ in solution',COL.green)}${card('r4','Solution',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#po').onclick=()=>{ pour=!pour; setBtn($('#po'),pour?'■ Stop pouring':'▶ Pour acid slowly',pour?'active':'play'); };
  $('#st').onclick=()=>{ stir=!stir; setBtn($('#st'),stir?'■ Stop stirring':'🥄 Stir',stir?'active':''); };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  reset();
  const lvlOf=V=>BOT-V*ML/BW;
  animLoop(dt=>{
    t+=dt;
    /* pouring: carry the cylinder to the rim and keep it tipped just past the spill point */
    if(pour&&P.ml>0.02){ P.T.x=CX+BW/2-12; P.T.y=TOP-26; P.T.a=Math.max(-2.3,Math.min(P.T.a,-0.9)-dt*0.12); }
    else { P.T.a=0; P.T.x=P.rest.x; P.T.y=P.rest.y; if(pour&&P.ml<=0.02){ pour=false; setBtn($('#po'),'Cylinder empty',''); } }
    const Q=pourerStep(P,dt); S.V+=Q; S.H+=Q*2;
    /* dissolving */
    const Hc=S.V>0.05?S.H/S.V:0; springTo(S.rodS,stir?1:0,20,7,dt);
    S.g.forEach(g=>{ if(g.n<=1e-5) return; const r=0.0017*Math.pow(g.n/(5/60),2/3)*Hc*(1+3*S.rodS.x)*(S.V>0.2?1:0); const d=Math.min(g.n,r*dt,S.H/2); g.n-=d; S.H-=2*d; S.cu+=d;
      // swirl: stirred grains lift and circle, then settle
      if(S.rodS.x>0.2&&S.V>0.5){ g.phi+=dt*(2.2+g.s)*S.rodS.x; g.vy+=((Math.random()-0.3)*260*S.rodS.x-g.y*1.2)*dt; }
      g.vy-=(80+60*g.s)*dt; g.vy*=Math.exp(-3*dt); g.y=clamp(g.y+g.vy*dt,0,Math.max(0,(BOT-lvlOf(S.V))-14)); if(g.y<=0&&g.vy<0) g.vy=0; });
    if(Q>0.001&&Math.random()<dt*20) drip();
    const left=S.g.reduce((s,g)=>s+g.n,0), c=S.V>0.05?S.cu/S.V:0;
    setMany($,{r1:fmt(S.V,1)+' mL', r2:fmt(left*0.0795,2)+' g', r3:fmt(c,2)+' M', r4:c<0.02?'colourless':c<0.15?'pale blue-green':'blue-green'}); setc($,'r4',c<0.02?COL.muted:'#16877a');
    if(left<0.002) fbSet(fb,'ok','All the black CuO has dissolved — the solution is copper(II) chloride.');
    else if(S.V>1&&!stir&&S.rodS.x<0.1&&S.cu>0.05&&fb.className.includes('hidden')) fbSet(fb,'warn','Stir — fresh acid reaches the grains faster.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BOT+2);
    const lv=lvlOf(S.V);
    if(S.V>0.02){ ctx.save(); ctx.fillStyle=c>0.005?tint([['#1c9a8c',clamp(c/0.5,0,1)*0.8],['#2f8fe0',0.05]]):'rgba(217,67,43,0.07)'; ctx.fillRect(CX-BW/2+2,lv,BW-4,BOT-lv-2); ctx.restore(); line(ctx,CX-BW/2+2,lv,CX+BW/2-2,lv,c>0.02?'#16877a':COL.red,2);
      if(S.rodS.x>0.2){ ctx.save(); ctx.strokeStyle=rgba('#16877a',0.35); ctx.lineWidth=1.4; for(let k=0;k<3;k++){ ctx.beginPath(); ctx.ellipse(CX,lerp(lv,BOT,(k+1)/4),BW*0.38-k*14,6,0,t*3+k,t*3+k+2.2); ctx.stroke(); } ctx.restore(); } }
    // CuO grains (back half first, rod, then front half)
    const drawG=front=>S.g.forEach(g=>{ if(g.n<=1e-5) return; const sn=Math.sin(g.phi); if((sn>0)!==front) return; const k=Math.cbrt(g.n/(5/60));
      const x=CX+Math.cos(g.phi)*g.rho, y=BOT-8-g.y+sn*10; ctx.save(); ctx.fillStyle='#1b1b1b'; ctx.beginPath(); ctx.ellipse(x,y,4.2*k*g.s,3.2*k*g.s,g.phi,0,Math.PI*2); ctx.fill(); ctx.restore(); });
    drawG(false);
    const ra=t*3.4*S.rodS.x+S.rodA; const rx=CX+Math.cos(ra)*BW*0.26*S.rodS.x, rz=Math.sin(ra);
    if(S.rodS.x>0.02) glassRod(ctx,rx,BOT-24+rz*6,CX+BW*0.18+Math.cos(ra)*30*S.rodS.x,TOP-80); else glassRod(ctx,CX+BW*0.3,BOT-22,CX+BW*0.62,TOP-70);
    drawG(true);
    beakerDraw(ctx,CX,TOP,BOT,BW,{grad:{n:5,lab:i=>(i*2)+' mL'}});
    if(S.rodS.x>0.02&&rz>0) glassRod(ctx,rx,BOT-24+rz*6,lerp(rx,CX+BW*0.18+Math.cos(ra)*30*S.rodS.x,0.3),lerp(BOT-24,TOP-80,0.3));
    pourerDraw(ctx,P,lv,'rgba(217,67,43,0.14)',COL.red); textAt(ctx,'HCl',P.rest.x+17,P.rest.y+156,{align:'center',size:13,weight:800,color:COL.yellow,alpha:P.a.x>-0.2?1:0});
    textAt(ctx,'CuO',CX-BW/2-12,BOT-10,{align:'right',size:14,weight:800,color:COL.ink});
    // lens at a grain: H⁺ pull O out as water; Cu²⁺ drifts away into solution
    const g0=S.g.find(g=>g.n>1e-4)||S.g[0], LX=620, LY=150;
    lens(ctx,LX,LY,92,CX+Math.cos(g0.phi)*g0.rho,BOT-8-g0.y,'',()=>{ const rate=clamp(Hc*(1+3*S.rodS.x),0,4), ph=(t*0.35*Math.max(0.15,rate))%1;
      const cols=5; for(let i=0;i<cols;i++) for(let j=0;j<2;j++){ const x=LX-60+i*30, y=LY+50+j*26; atomDraw(ctx,x,y,11,(i+j)%2?'O':'Cu',(i+j)%2?COL.ink:'#16877a'); }
      if(S.V>0.2&&left>0.002&&Hc>0.01){ const e=ease(clamp(ph/0.5,0,1));
        atomDraw(ctx,lerp(LX-70,LX-8,e),lerp(LY-60,LY+30,e),8,'H⁺',COL.red); atomDraw(ctx,lerp(LX+50,LX+8,e),lerp(LY-70,LY+30,e),8,'H⁺',COL.red);
        if(ph>0.5){ const u=(ph-0.5)*2; atomDraw(ctx,LX,LY+24-u*70,11,'H₂O',COL.green,1-u*0.6); atomDraw(ctx,LX+30+u*40,LY+50-u*110,12,'Cu²⁺','#16877a',1-u*0.3); } }
      for(let k=0;k<Math.min(6,Math.round(c*14));k++){ const an=k*1.1+t*0.4; atomDraw(ctx,LX+Math.cos(an)*60,LY-40+Math.sin(an*1.3)*28,9,'Cu²⁺','#16877a',0.8); } });
    if(S.cu>0.2) eqStrip(ctx,[{t:'CuO + '},{t:'2HCl',col:COL.red},{t:' → '},{t:'CuCl₂',col:'#16877a'},{t:' + H₂O'}],620,290,clamp(S.cu,0,1),15);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.8 DO ACID SOLUTIONS CONDUCT?  (nails in a cork, 6 V, bulb, switch)
   Conductivity κ = Σ λᵢcᵢ (S·cm²/mol: H⁺ 350, OH⁻ 198, Cl⁻ 76, ½SO₄²⁻ 80,
   Na⁺ 50, ½Ca²⁺ 60), cut to 80 % for ion crowding at 1 M.
   Two nails ≈ cell constant 0.8 cm⁻¹ → R = 0.8/κ.
   The nails need ≈ 1.8 V to push charge across (electrolysis):
   I = (6 − 1.8)/(R + R_bulb(T)); torch bulb 3.5 V 0.3 A, tungsten
   heat balance (kit) — 1 M HCl ≈ 0.3 A (bright), lime water ≈ 45 mA
   (filament stays dark), glucose/alcohol ≈ µA (nothing).
   Gas at the nails ∝ I (Faraday).
   ===================================================================== */
function buildA8(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const SOL=[{k:'HCl',f:'HCl',c:1,kap:0.8*1*(350+76)/1000,ions:[['H',1],['Cl',-1]],col:'rgba(217,67,43,0.10)'},
    {k:'H2SO4',f:'H₂SO₄',c:0.5,kap:0.8*(0.5*(2*350+160)-0.5*0.3*350)/1000,ions:[['H',1],['SO₄',-2]],col:'rgba(217,67,43,0.12)'},
    {k:'glucose',f:'Glucose',c:0.5,kap:5e-6,ions:[],mol:'glu',col:'rgba(220,225,235,0.3)'},
    {k:'alcohol',f:'Alcohol',c:1,kap:3e-6,ions:[],mol:'alc',col:'rgba(220,225,235,0.3)'},
    {k:'NaOH',f:'NaOH',c:1,kap:0.8*1*(50+198)/1000,ions:[['Na',1],['OH',-1]],col:'rgba(47,143,224,0.12)'},
    {k:'CaOH2',f:'Ca(OH)₂',c:0.02,kap:0.02*(120+2*198)/1000,ions:[['Ca',2],['OH',-1]],col:'rgba(47,143,224,0.08)'},
    {k:'water',f:'Distilled water',c:0,kap:1e-6,ions:[],col:'rgba(47,143,224,0.06)'}];
  const E=6, EB=1.8, CELLK=0.8;
  let si=0, sw=false, t=0; const S={lamp:lampNew(), I:0, fill:spr(1), swap:null, bub:[[],[]], acc:[0,0], ions:[]};
  const BX=250, BT=250, BB=470, BW=230, NX=[BX-44,BX+44];
  function ionsFor(s){ S.ions=[]; const r=rng(9); s.ions.forEach(([k,q])=>{ const n=k==='SO₄'?3:k==='OH'&&s.k==='CaOH2'?2:(s.c<0.1?2:6); for(let i=0;i<n;i++) S.ions.push({k,q,x:r()*140-70,y:r()*100-50,vx:0,vy:0}); });
    if(s.mol) for(let i=0;i<6;i++) S.ions.push({k:s.mol,q:0,x:r()*140-70,y:r()*100-50,vx:0,vy:0,rot:r()*6}); }
  ionsFor(SOL[0]);
  side.innerHTML=`
    <div class="control-group"><label>Solution in the beaker</label><div class="chip-wrap">${SOL.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="sw">⏻ Switch on</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Current',COL.green)}${card('r2','Bulb',COL.yellow)}${card('r3','Solution resistance',COL.ink)}${card('r4','Carriers',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-s]',b=>{ const n=+b.dataset.s; if(n===si&&!S.swap) return; S.swap={to:n,ph:0}; });
  $('#sw').onclick=()=>{ sw=!sw; setBtn($('#sw'),sw?'⏻ Switch off':'⏻ Switch on',sw?'active':'play'); tink(sw?1400:900,0.05,0.08); };
  animLoop(dt=>{
    t+=dt;
    /* swapping the solution: level drains, new liquid fills */
    if(S.swap){ if(S.swap.ph===0){ springTo(S.fill,0,40,12,dt); if(S.fill.x<0.03){ si=S.swap.to; ionsFor(SOL[si]); S.swap.ph=1; S.bub=[[],[]]; } } else { springTo(S.fill,1,40,12,dt); if(Math.abs(S.fill.x-1)<0.02){ S.swap=null; } } }
    else springTo(S.fill,1,40,12,dt);
    const s=SOL[si], wet=clamp(S.fill.x,0,1);
    const Rsol=wet>0.3?CELLK/s.kap/wet:1e9;
    const I=lampStep(S.lamp,sw?E-EB:0,Rsol,dt); S.I=I;
    /* electrolysis gas at the nails (H₂ at the − nail, O₂ or Cl₂ at the + nail) */
    [0,1].forEach(i=>{ S.acc[i]+=I*(i?40:20)*dt*6; while(S.acc[i]>1){ S.acc[i]-=1; S.bub[i].push({x:NX[i]+(Math.random()-0.5)*8,y:BB-30-Math.random()*80,vy:-30,vx:0,r:1.4+Math.random(),ph:Math.random()*6}); } });
    const br=lampBr(S.lamp);
    setMany($,{r1:I>0.01?fmt(I*1000,0)+' mA':fmt(I*1e6,0)+' µA', r2:br>0.5?'bright':br>0.08?'dim':'no glow', r3:Rsol>1e5?fmt(Rsol/1000,0)+' kΩ':fmt(Rsol,1)+' Ω', r4:s.ions.length?'ions':'no ions'});
    if(sw&&!S.swap){ if(br>0.3) fbSet(fb,'ok',s.k.startsWith('H')?'The bulb glows: H⁺(aq) and anions carry the current.':'The bulb glows: the alkali’s ions carry the current.');
      else if(s.ions.length) fbSet(fb,'warn','Few ions (lime water is only 0.02 M): a small current, not enough to light the bulb.');
      else fbSet(fb,'bad','No glow: '+s.f.toLowerCase()+' has no ions to carry charge.'); }
    /* ions drift in the field: + ions to the (−) nail on the right, − ions to the (+) nail */
    const Efield=sw?clamp(I*8,0,3):0;
    S.ions.forEach(p=>{ p.vx+=((Math.random()-0.5)*220+(p.q>0?1:p.q<0?-1:0)*Efield*80)*dt; p.vy+=(Math.random()-0.5)*220*dt; p.vx*=Math.exp(-2*dt); p.vy*=Math.exp(-2*dt); p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.x<-80){ p.x=80; } if(p.x>80){ p.x=-80; } if(p.y<-60){ p.y=-60; p.vy=Math.abs(p.vy); } if(p.y>60){ p.y=60; p.vy=-Math.abs(p.vy); } });
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BB+2);
    const lv=lerp(BB-4,BT+50,wet);
    if(wet>0.02){ ctx.save(); ctx.fillStyle=s.col; ctx.fillRect(BX-BW/2+2,lv,BW-4,BB-lv-2); ctx.restore(); line(ctx,BX-BW/2+2,lv,BX+BW/2-2,lv,COL.blue,2); }
    [0,1].forEach(i=>{ bubbleStep(S.bub[i],dt,()=>lv); bubbleDraw(ctx,S.bub[i],COL.green); });
    // cork across the beaker with two nails
    rect(ctx,BX-80,BT-4,160,26,COL.ink,'#fff',2.4); NX.forEach(x=>nailDraw(ctx,x,BT-16,BB-26));
    textAt(ctx,'+',NX[0]-20,BT+60,{align:'center',size:22,weight:800,color:COL.red}); textAt(ctx,'−',NX[1]+20,BT+60,{align:'center',size:22,weight:800,color:COL.blue});
    beakerDraw(ctx,BX,BT,BB,BW);
    textAt(ctx,s.f,BX,BB+28,{align:'center',size:15,weight:800,color:COL.yellow});
    // circuit: + nail ← battery (+) … battery (−) → switch → bulb → − nail
    const bat={x:520,y:60}, bulb={x:560,y:360}, swp={x:420,y:250};
    wireRun(ctx,[[NX[0],BT-16],[NX[0],60],[bat.x-58,60]],COL.red,I,-t);
    wireRun(ctx,[[bat.x+58,60],[690,60],[690,250],[swp.x+22,swp.y]],COL.blue,I,t);
    wireRun(ctx,[[swp.x-22,swp.y],[swp.x-22,swp.y],[380,swp.y],[380,bulb.y+14],[bulb.x-6,bulb.y+14],[bulb.x-6,bulb.y]],COL.ink,I,t);
    wireRun(ctx,[[bulb.x+6,bulb.y],[bulb.x+6,bulb.y+30],[NX[1]+60,bulb.y+30],[NX[1]+60,BT-40],[NX[1],BT-40],[NX[1],BT-16]],COL.ink,I,t);
    batteryDraw(ctx,bat.x,bat.y,E); switchDraw(ctx,swp.x,swp.y,sw); bulbDraw(ctx,bulb.x,bulb.y,br,t);
    // ammeter dial
    const ax=700, ay=420; circ(ctx,ax,ay,52,COL.ink,'#fff',2.6); for(let k=0;k<=6;k++){ const an=Math.PI*(1.15+k*0.7/6); line(ctx,ax+Math.cos(an)*40,ay+Math.sin(an)*40,ax+Math.cos(an)*48,ay+Math.sin(an)*48,COL.ink,1.4); }
    const na=Math.PI*(1.15+clamp(I/0.4,0,1)*0.7); line(ctx,ax,ay,ax+Math.cos(na)*44,ay+Math.sin(na)*44,COL.green,3); circ(ctx,ax,ay,4,COL.ink,COL.ink,1); textAt(ctx,'A',ax,ay+26,{align:'center',size:14,weight:800,color:COL.green});
    // lens: ions moving between the nails
    const LX=78, LY=150; lens(ctx,LX,LY,70,BX,BB-80,'',()=>{ line(ctx,LX-70,LY,LX-58,LY,COL.red,6); line(ctx,LX+58,LY,LX+70,LY,COL.blue,6);
      S.ions.forEach(p=>{ const x=LX+p.x*0.8, y=LY+p.y*0.8; if(p.q===0){ if(p.k==='glu') sugarMol(ctx,x,y,7,p.rot); else { circ(ctx,x,y,7,COL.ink,'#fff',1.8); circ(ctx,x+10,y,5,COL.ink,'#fff',1.8); } }
        else ionDraw(ctx,x,y,p.k.length>1?10:8,p.q,{sym:p.k}); });
      if(!S.ions.length){ for(let k=0;k<10;k++) waterMol(ctx,LX-60+(k*37)%120,LY-50+(k*53)%100,6,k+t*0.3,0.5); } });
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.9 DRY HCl GAS vs WET LITMUS
   1 g NaCl = 17 mmol; conc. H₂SO₄: NaCl + H₂SO₄ → NaHSO₄ + HCl↑,
   r = 0.06/s × NaCl left (a steady stream for ~30 s).
   Moisture carried by the gas: 2 % through a CaCl₂ guard tube,
   15 % on a normal day, 60 % on a humid day (no guard tube).
   Paper water m: m' = 0.4·flux·(h_gas − m) (dry paper slowly takes up
   water from wet gas). Acid only acts where water is: dose' = flux·m;
   red = smooth(0.05 → 0.4 of dose). Wet paper m = 1 turns red at once.
   HCl + H₂O → H₃O⁺ + Cl⁻ — no water, no H⁺, no colour change.
   ===================================================================== */
function buildA9(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=500, TX=170, TB=450, TW=64, TH=250, NOZ={x:650,y:238};
  let wet=false, guard=true, humid=false, t=0; const S={};
  function reset(){ Object.assign(S,{nacl:17, acid:0, funnel:0, n:0, flux:0, m:wet?1:0.02, dose:0, bub:[], fume:[], pap:sprP(NOZ.x+4,600)}); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Blue litmus paper</label><div class="toggle-group"><button class="toggle-btn active" data-p="dry">Dry</button><button class="toggle-btn" data-p="wet">Wet</button></div></div>
    <div class="control-group"><label>Set-up</label><div class="toggle-group"><button class="toggle-btn active" id="gd">CaCl₂ guard tube: on</button><button class="toggle-btn" id="hm">Humid day: no</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="ad">▶ Add conc. H₂SO₄</button><button class="toggle-btn" id="rs">↺ Fresh</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','HCl gas out',COL.green)}${card('r2','Paper colour',COL.blue)}${card('r3','Water on paper',COL.blue)}${card('r4','H⁺ on paper',COL.red)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');

    setMany($,{r1:fmt(S.n*24.5,0)+' mL', r2:red>0.7?'red':red>0.1?'turning red':'blue', r3:fmt(S.m*100,0)+' %', r4:red>0.1?'yes':'none'}); setc($,'r2',mixCol(COL.blue,COL.red,red));

    /* ---------------- draw ---------------- */

    benchTop(ctx,BENCH);
    line(ctx,60,BENCH,60,120,COL.ink,4); rect(ctx,40,BENCH-10,120,10,COL.ink,'#fff',2); line(ctx,60,TB-TH+60,TX-TW/2-4,TB-TH+60,COL.ink,3.4); rect(ctx,TX-TW/2-10,TB-TH+50,TW+20,20,COL.ink,'#fff',2.4);
    const P=tubeAt(TW,TH,TX,TB,0);
    // NaCl heap + acid
    const heap=fillLow(P,3000*(S.nacl/17)+80); polyFill(ctx,heap.poly,'#f4f6f9'); polyClipFill(ctx,heap.poly,()=>{ for(let k=0;k<50;k++){ const x=TX-26+(k*37)%52, y=TB-4-((k*23)%30); rect(ctx,x,y,3.4,3.4,COL.mid,null,1); } });
    if(S.acid>0.01){ const lr=fillLow(P,3000*(S.nacl/17)+80+S.acid*1800); ctx.save(); ctx.globalAlpha=0.5; polyFill(ctx,clipBelow(lr.poly,lr.L),'rgba(217,160,23,0.25)'); ctx.restore(); line(ctx,TX-TW/2+3,lr.L,TX+TW/2-3,lr.L,COL.yellow,1.8); }
    bubbleStep(S.bub,dt,()=>TB-60); bubbleDraw(ctx,S.bub,COL.green);

    const top=TB-TH; rect(ctx,TX-TW/2-4,top-12,TW+8,28,COL.ink,'#fff',2.4);
    const fx=TX-14; line(ctx,fx,top+12,fx,top-90,COL.ink,6); line(ctx,fx,top+12,fx,top-90,'#fff',2.4);
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(fx-3,top-90); ctx.quadraticCurveTo(fx-24,top-98,fx-24,top-124); ctx.arc(fx,top-124,24,Math.PI,0); ctx.quadraticCurveTo(fx+24,top-98,fx+3,top-90); ctx.fill(); ctx.stroke(); ctx.restore();
    if(S.funnel>0.02){ ctx.save(); ctx.beginPath(); ctx.arc(fx,top-124,22,0,Math.PI*2); ctx.clip(); ctx.fillStyle='rgba(217,160,23,0.3)'; ctx.fillRect(fx-24,top-124+22-S.funnel*30,48,60); ctx.restore(); line(ctx,fx,top-90,fx,TB-20,'rgba(217,160,23,0.7)',2.2); }
    textAt(ctx,'conc. H₂SO₄',fx,top-156,{align:'center',size:13,weight:800,color:COL.yellow});
    const dx=TX+14, path=[[dx,top+12],[dx,120],[NOZ.x,120],[NOZ.x,NOZ.y]];
    ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=9; ctx.beginPath(); path.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.stroke();
    if(S.flux>0.03){ ctx.setLineDash([5,18]); ctx.lineDashOffset=-t*90; ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.stroke(); } ctx.restore();
    if(guard){ const gx=440; ctx.save(); rrect(ctx,gx-70,98,140,44,20); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.clip();
      for(let k=0;k<26;k++){ const x=gx-62+(k*29)%124, y=106+(k*13)%30; circ(ctx,x,y,4.5,COL.mid,'#eef1f5',1.4); } ctx.restore();
      textAt(ctx,'CaCl₂ guard tube',gx,88,{align:'center',size:12,weight:700,color:COL.blue}); }
    if(!guard&&humid) for(let k=0;k<5;k++){ const x=300+((t*60+k*70)%330); circ(ctx,x,120,2,COL.blue,'rgba(47,143,224,0.5)',1); }

      const nh=S.flux>0.02||S.dose>0.02?6:0; for(let k=0;k<nh;k++){ const ph=(t*0.5+k/6)%1, x=LX-60+k*24, y=LY-70+ph*95;

    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.10 MIXING ACID OR BASE WITH WATER — EXOTHERMIC
   10 mL water + beaker ≈ 52 J/K, loses 0.03 W/K to the room.
   Conc. H₂SO₄ drop: 0.05 mL × 18.4 M = 0.92 mmol, heat of dilution
   ≈ 74 kJ/mol → 68 J (+1.3 °C per drop). The dense drop sinks as an oily
   streak and gives its heat to the water over ≈ 1.5 s.
   NaOH pellet 0.10 g = 2.5 mmol × 44.5 kJ/mol = 111 J (+2.1 °C);
   it dissolves at dm/dt = −k·m^(2/3), ×3 when swirled (≈ 25 s still).
   Water INTO acid: the light drop floats on 3 mL of acid and all 70 J
   go into ≈ 0.1 g at the surface (0.3 J/K) → boils at once and spits
   hot acid out of the beaker (ballistic droplets).
   ===================================================================== */
function buildA10(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=280, TOP=250, BOT=470, BW=190;
  let mode='acid', t=0; const S={};
  function reset(){ Object.assign(S,{T:25, V:10, nAcid:0, nNa:0, pend:0, drop:null, streaks:[], pellets:[], swirl:0, ang:spr(0), touch:spr(0), touching:S.touching||false, sq:spr(0), splat:[], steam:[], cracks:0, flash:0, drops:0, cool:0}); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Add to 10 mL of water</label><div class="toggle-group"><button class="toggle-btn active" data-m="acid">Conc. H₂SO₄</button><button class="toggle-btn" data-m="naoh">NaOH pellets</button></div>
      <div class="toggle-group"><button class="toggle-btn" data-m="wrong">⚠ Water into acid</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="add">💧 Add a drop</button><button class="toggle-btn" id="sw">↻ Swirl</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="tc">✋ Touch the base</button><button class="toggle-btn" id="rs">↺ Fresh</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Temperature',COL.red)}${card('r2','Rise',COL.red)}${card('r3','Added',COL.yellow)}${card('r4','Process',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const label=()=>setBtn($('#add'),mode==='naoh'?'⚪ Add a pellet':mode==='wrong'?'💧 Add a drop of water':'💧 Add a drop','play');
  chipsWire(side,'[data-m]',b=>{ mode=b.dataset.m; reset(); label(); fb.className='fb hidden'; if(mode==='wrong') S.V=3; });
  $('#add').onclick=()=>{ if(S.cool>0) return; S.cool=0.45;
    if(mode==='naoh'){ S.pellets.push({m:0.1,x:CX-50+Math.random()*100,y:TOP-40,vy:0,rest:false,ang:Math.random()*3}); S.nNa++; }
    else if(!S.drop){ S.drop={x:CX,y:TOP-70,vy:0,r:5}; S.sq.v+=16; } };
  $('#sw').onclick=()=>{ S.swirl=2; };
  $('#tc').onclick=()=>{ S.touching=!S.touching; setBtn($('#tc'),S.touching?'✋ Hand on the base':'✋ Touch the base',S.touching?'active':''); };
  $('#rs').onclick=()=>{ reset(); if(mode==='wrong') S.V=3; fb.className='fb hidden'; };
  const CAP=()=>mode==='wrong'?17.7:52;
  animLoop(dt=>{
    t+=dt; S.cool-=dt; springTo(S.sq,0,300,18,dt);
    const lv=BOT-8-S.V*(mode==='wrong'?26:13);
    let Pin=0;
    if(S.drop&&dropStep(S.drop,dt,lv)){ const x=S.drop.x; S.drop=null; S.drops++;
      if(mode==='acid'){ S.nAcid++; S.V+=0.05; S.streaks.push({x,y:lv,t:0,q:68}); drip(); }
      else { // water onto conc. acid: local boiling → spitting
        S.V+=0.05; S.T+=70*0.35/CAP(); S.flash=1; crackle(); noiseBurst(0.25,0.4,1800,0.7);
        for(let k=0;k<26;k++){ const a=-Math.PI/2+(Math.random()-0.5)*2.2, v=260+Math.random()*320; S.splat.push({x,y:lv-2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0}); }
        for(let k=0;k<10;k++) smokeAdd(S.steam,x+(Math.random()-0.5)*30,lv-6,'#9fb3c8');
        if(S.drops>=5&&S.cracks<3){ S.cracks++; tink(3200,0.08,0.2); }
        fbSet(fb,'bad','It boils and spits hot acid! Always add acid to water, slowly, stirring.'); } }
    // heat from sinking acid streaks
    S.streaks.forEach(s=>{ s.t+=dt; const f=Math.min(1,dt/1.5)*s.q; s.q-=f; Pin+=f/dt; }); S.streaks=S.streaks.filter(s=>s.t<3.2);
    // NaOH pellets: fall, rest, dissolve (heat 1110 J/g)
    const sw=S.swirl>0?1:0;
    S.pellets.forEach(p=>{ if(!p.rest){ p.vy+=900*dt; p.y+=p.vy*dt; if(p.y>lv) p.vy*=Math.exp(-8*dt); if(p.y>=BOT-12){ p.y=BOT-12; p.rest=true; } }
      if(p.y>lv){ const dm=Math.min(p.m,0.0035*Math.pow(p.m/0.1,2/3)*(1+2*sw)*dt*(p.m>0?1:0)); p.m-=dm; Pin+=dm*1110/dt; } if(sw) p.x=CX+(p.x-CX)*Math.cos(dt*3)+Math.sin(t*9)*0.4; });
    S.pellets=S.pellets.filter(p=>p.m>0.0015);
    S.T+=(Pin-0.03*(S.T-25))*dt/CAP();
    if(S.swirl>0){ S.swirl-=dt; springTo(S.ang,Math.sin(t*8)*0.08,120,6,dt); } else springTo(S.ang,0,60,9,dt);
    springTo(S.touch,S.touching?1:0,60,11,dt);
    S.splat.forEach(p=>{ p.t+=dt; p.vy+=1400*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); S.splat=S.splat.filter(p=>p.y<BOT+40&&p.t<2);
    smokeStep(S.steam,dt,2); S.flash=Math.max(0,S.flash-dt*2.5);
    const dT=S.T-25;
    setMany($,{r1:fmt(S.T,1)+' °C', r2:'+'+fmt(dT,1)+' °C', r3:mode==='naoh'?S.nNa+' pellet'+(S.nNa===1?'':'s'):S.drops+' drop'+(S.drops===1?'':'s'), r4:dT>0.3?'exothermic':'—'});
    if(mode!=='wrong'&&dT>3&&fb.className.includes('hidden')) fbSet(fb,'ok','The beaker warms up: dissolving gives out heat (exothermic).');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BOT+2);
    ctx.save(); ctx.translate(CX,BOT); ctx.rotate(S.ang.x); ctx.translate(-CX,-BOT);
    const liqCol=mode==='wrong'?'rgba(217,160,23,0.20)':'rgba(47,143,224,0.12)';
    ctx.save(); ctx.fillStyle=liqCol; ctx.fillRect(CX-BW/2+2,lv,BW-4,BOT-lv-2); ctx.restore(); line(ctx,CX-BW/2+2,lv,CX+BW/2-2,lv,mode==='wrong'?COL.yellow:COL.blue,2);
    // dense oily streaks of acid sinking and curling out
    S.streaks.forEach(s=>{ const u=clamp(s.t/1.6,0,1), a=1-clamp((s.t-1.6)/1.6,0,1); ctx.save(); ctx.globalAlpha=0.8*a; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2;
      for(let k=-1;k<=1;k++){ ctx.beginPath(); for(let j=0;j<=16;j++){ const v=j/16*u, y=lerp(s.y,BOT-10,v), x=s.x+k*8*v+Math.sin(v*12+s.t*5+k)*6*v; j?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); } ctx.restore();
      if(s.q>1) heatWave(ctx,s.x,BOT-30,Math.max(0,BOT-30-lv-10),-Math.PI/2,COL.red,t*1.5,clamp(s.q/40,0,0.8),3); });
    S.pellets.forEach(p=>{ const k=Math.cbrt(p.m/0.1); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ang); ctx.beginPath(); ctx.ellipse(0,0,9*k,5*k,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
      if(p.rest&&p.y>lv){ heatWave(ctx,p.x,p.y-10,Math.max(0,p.y-lv-20),-Math.PI/2,COL.red,t*2+p.x,0.5*k,3); } });
    beakerDraw(ctx,CX,TOP,BOT,BW);
    for(let c=0;c<S.cracks;c++){ const x0=CX+BW/2-30*c-10, y0=BOT-40-c*30; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0-12,y0+10); ctx.lineTo(x0-6,y0+22); ctx.lineTo(x0-18,y0+34); ctx.stroke(); ctx.restore(); }
    ctx.restore();
    // thermometer in the liquid
    labThermo(ctx,CX+BW/2-26,TOP-110,BOT-38,S.T,20,mode==='wrong'?100:60,{step:mode==='wrong'?20:10});
    // dropper (acid or water) / pellet jar
    if(mode!=='naoh'){ dropperDraw(ctx,CX,TOP-76,clamp(S.sq.x/6,0,1),0.6,mode==='wrong'?'rgba(47,143,224,0.25)':'rgba(217,160,23,0.35)'); textAt(ctx,mode==='wrong'?'water':'conc. H₂SO₄',CX-24,TOP-180,{align:'right',size:14,weight:800,color:COL.yellow}); }
    if(S.drop) dropDraw(ctx,S.drop,mode==='wrong'?'rgba(210,230,250,0.95)':'rgba(236,200,110,0.95)');
    // spitting droplets + steam + flash
    ctx.save(); ctx.fillStyle=COL.red; S.splat.forEach(p=>{ ctx.globalAlpha=1-p.t/2; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,Math.PI*2); ctx.fill(); }); ctx.restore();
    smokeDraw(ctx,S.steam,2); if(S.flash>0.02){ glow(ctx,CX,lv,90,COL.red,S.flash); textAt(ctx,'SPIT!',CX,lv-70,{align:'center',size:24,weight:800,color:COL.red,alpha:S.flash}); }
    // reagent bottle with the corrosive warning (Fig. 2.5)
    const bx=600, by=BOT; bottleDraw(ctx,bx,by,90,150,mode==='naoh'?'NaOH':'H₂SO₄',mode==='naoh'?COL.blue:COL.red);
    ctx.save(); ctx.translate(bx,by-230); ctx.rotate(Math.PI/4); rect(ctx,-26,-26,52,52,COL.ink,'#fff',2.6); ctx.restore();
    ctx.save(); ctx.translate(bx,by-230); line(ctx,-14,-10,-6,6,COL.ink,2.2); line(ctx,6,-10,14,6,COL.ink,2.2); circ(ctx,-4,12,2,COL.ink,COL.ink,1); circ(ctx,12,12,2,COL.ink,COL.ink,1); line(ctx,-16,20,16,20,COL.ink,3); ctx.restore();
    textAt(ctx,'CORROSIVE',bx,by-180,{align:'center',size:11,weight:800,color:COL.red});

      for(let k=0;k<n;k++){ const cx=LX-45+(k%2)*90, cy=LY-30+Math.floor(k/2)*60; const q=mode==='naoh'?(k%2?-1:1):(k%2?-1:1), sym=mode==='naoh'?(k%2?'OH':'Na'):(k%2?'HSO₄':'H₃O');

    ctx.restore();
  });
