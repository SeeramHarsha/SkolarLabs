<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">

<script>
/* =========================================================================
   GRADE 9 — CHAPTER 7: WORK, ENERGY, AND SIMPLE MACHINES
   (NCERT Exploration, iesc107) — Activities 7.1–7.5.
   Every activity runs a continuous animation loop: buttons and sliders only
   set targets. Balls fall under g and dig into sand (Uehara law), the
   pendulum swings by RK4 with real air drag and support friction, carts are
   pulled through a spring balance at steady speed, and rulers and beams tip
   about their fulcrum by real torques until they settle.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}

/* =====================================================================
   7.1 LET US INVESTIGATE — an iron ball dropped into loose sand.
   Raising it to h stores U = mgh. It falls freely (y″ = −g), so at the
   sand v = √(2gh) and K = mgh. The sand stops it; the ball's bottom ends
   at depth d given by the Uehara (2003) law for loose sand:
     d = (0.14/μ)·√(ρb/ρg)·D^⅔·(h + d)^⅓,  μ = 0.7, ρg = 1600 kg/m³
   and the crater diameter Dc = 0.90·(ρb/(ρg μ²))^¼·D^¾·(h + d)^¼.
   1 kg ball (D 6.2 cm): 1 m → 7.1 cm deep, 2 m → 8.9 cm. Inside the sand
   the ball decelerates with v² = v₀² + 2gz − (v₀² + 2gd)(z/d)², shown in
   1/15 slow motion; the dug-out sand is thrown up and piled on the rim.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Height to raise the ball <span class="val" id="hV"></span></label><input type="range" id="hR" min="0.25" max="2" step="0.05" value="1"></div>
    <div class="control-group"><label>Heavy ball (iron)</label><div class="chip-wrap" id="ms">
      <button class="chip-btn" data-m="0.5">0.5 kg</button><button class="chip-btn active" data-m="1">1 kg</button><button class="chip-btn" data-m="2">2 kg</button></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="go">▼ Drop</button><button class="toggle-btn" id="lift">⤒ Lift out</button><button class="toggle-btn small" id="rst" title="Smooth the sand">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','U = mgh',COL.blue)}${card('r2','Speed',COL.green)}${card('r3','Depth',COL.red)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const RB=7870, RG=1600, MU=0.7, BOX=[0,0.9], SPOTS=[0.15,0.45,0.75], N=360, DX=(BOX[1]-BOX[0])/N;
  const Dof=m=>Math.cbrt(6*m/(Math.PI*RB));

  function craterW(m,h,d){ const D=Dof(m); return 0.90*Math.pow(RB/(RG*MU*MU),0.25)*Math.pow(D,0.75)*Math.pow(h+d,0.25); }
  let auto=false, m=1, spot=0, st='hold', y=0.031, vy=0, hHold=spr(0.03), open=0, hx=SPOTS[0], t=0, ts=1, tsT=1, spin=0;
  let sand=new Float32Array(N+1), base=null, fin=null, dig=null, eje=[], rows=[], craters=[], meas=null, wSand=0, lastE=0;
  const cam={x0:spr(-0.35),x1:spr(1.0),y0:spr(-0.32),y1:spr(1.4)};
  const dots=[]; { const r=rng(7); for(let i=0;i<900;i++) dots.push([r(),r()]); }
  function D(){ return Dof(m); }
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function surfAt(x){ const i=clamp((x-BOX[0])/DX,0,N-1e-6), k=Math.floor(i), f=i-k; return sand[k]*(1-f)+sand[Math.min(N,k+1)]*f; }
  function paint(){ $('#lg').innerHTML=rows.length?logTable(['Height','Ball','U = mgh','Depth'],rows.map(r=>[fmt(r.h,2)+' m',r.m+' kg',fmt(r.U,1)+' J',{v:fmt(r.d*100,1)+' cm',c:r.best?'r-ok':''}])):''; }
  function resetSand(){ craters=[]; meas=null; spot=0; st='hold'; hx=SPOTS[0]; y=surfAt(hx)+D()/2+0.002; vy=0; hHold=spr(y); open=0; setFb('hidden',''); }
  $('#rst').onclick=()=>{ st='smooth'; setFb('hidden',''); };
  chipsWire(wrap,'#ms .chip-btn',b=>{ if(st!=='hold') return; m=+b.dataset.m; });
  $('#go').onclick=()=>{ if(st==='ready'){ st='hold'; auto=true; return; } if(st!=='hold') return; if(Math.abs(hHold.x-(surfAt(hx)+hT()+D()/2))>0.01){ auto=true; return; }
    drop(); };
  function drop(){ st='fall'; auto=false; vy=0; wSand=0; setFb('hidden',''); }
  $('#hR').addEventListener('input',()=>{ if(st==='ready') st='hold'; });
  $('#lift').onclick=()=>{ if(st!=='buried') return; st='grab'; };
  const hT=()=>+$('#hR').value;   // bottom of ball above the flat sand
  function startDig(){
    const D0=D(), h=dig.h, d=depthOf(m,h), Rc=craterW(m,h,d)/2, x0=hx; dig.d=d; dig.v0=Math.sqrt(2*G7*h); dig.z=0; dig.v=dig.v0;
    base=Float32Array.from(sand); fin=Float32Array.from(sand);
    // bowl + ball imprint, then put the dug area onto a rim (area conserved)
    // volumes use the real round crater: dV = 2πr·z·dr
    let dug=0; const bowlD=Math.max(0.35*d,d-0.45*D0);
    for(let i=0;i<=N;i++){ const x=BOX[0]+i*DX, r=Math.abs(x-x0); let z=0;
      if(r<Rc) z=-bowlD*(1-(r/Rc)*(r/Rc));
      if(r<D0/2){ const zb=-d+D0/2-Math.sqrt(D0*D0/4-r*r); z=Math.min(z,zb); }

    t+=dt0; ts=approach(ts,tsT,6,dt0); const dt=dt0*ts;

      y=approach(y,Math.max(Hs,0.3)+R,3,dt0); hx=approach(hx,SPOTS[0],3,dt0); open=approach(open,0,6,dt0);

    if(st==='hold'){ const tgt=surfAt(hx)+Hs+R; springTo(hHold,tgt,30,11,dt0); y=hHold.x; vy=hHold.v; open=approach(open,0,8,dt0);

    setv($,'r3',craters.length?fmt(craters[craters.length-1].d*100,1)+' cm':'—');

    const top=close?0.26:wide2?0.24:Math.max(y+R+0.28,0.55), bx0=close?hx-0.34:wide2?-0.06:-0.38, bx1=close?hx+0.34:wide2?0.96:1.02, by0=close?-0.2:wide2?-0.27:-0.3;
    springTo(cam.x0,bx0,26,10,dt0); springTo(cam.x1,bx1,26,10,dt0); springTo(cam.y0,by0,26,10,dt0); springTo(cam.y1,top,26,10,dt0);
    const L=w*0.2, cw=cam.x1.x-cam.x0.x, ch=cam.y1.x-cam.y0.x, S=Math.min((w-L-20)/cw,(h-40)/ch);

/* =====================================================================
   7.2 LET US EXPERIMENT — a simple pendulum released from the pencil line.
   RK4 on θ″ = −(g/L)·sinθ − (½ρC_dA/m)·L·θ′|θ′| − c·θ′
   (air drag on a brass bob, ρ 8500 kg/m³, C_d 0.47; support friction
   c = 0.01 s⁻¹). 100 g, L = 1 m, 30°: the bob comes back to 98.8 % of h
   after the first swing, 97.5 % after the second — "almost" the line —
   and ~78 % after 20 swings. With "No losses" U + K stays exactly mgh.
   A paper card taped to the bob multiplies the drag area ~25×.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>String length <span class="val" id="lV"></span></label><input type="range" id="lR" min="0.5" max="1.5" step="0.05" value="1"></div>
    <div class="control-group"><label>Height of the line above the bob <span class="val" id="hV"></span></label><input type="range" id="hR" min="0.04" max="0.4" step="0.01" value="0.15"></div>
    <div class="control-group"><label>Bob</label><div class="chip-wrap" id="ms"><button class="chip-btn" data-m="0.05">50 g</button><button class="chip-btn active" data-m="0.1">100 g</button><button class="chip-btn" data-m="0.2">200 g</button></div></div>
    <div class="control-group"><label>Losses</label><div class="chip-wrap" id="ls"><button class="chip-btn" data-l="0">None (ideal)</button><button class="chip-btn active" data-l="1">Real air + support</button><button class="chip-btn" data-l="2">Card on bob</button></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="go">▶ Take to P &amp; release</button><button class="toggle-btn small" id="sl">¼×</button><button class="toggle-btn small" id="rst">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Height now',COL.blue)}${card('r2','Speed',COL.green)}${card('r3','Last turn reached',COL.red)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb'), go=$('#go');
  let m=0.1, loss=1, st='rest', th=0, w=0, t=0, tSw=0, slow=false, ext=[], lastSign=0, lineDraw=0, lost=0, trU=[], trK=[];
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  const Lr=()=>+$('#lR').value, Hr=()=>Math.min(+$('#hR').value, Lr()*0.5);
  const th0=()=>Math.acos(1-Hr()/Lr());
  function coefs(){ const r=Math.cbrt(3*m/(4*Math.PI*8500)); const A=Math.PI*r*r*(loss===2?25:1); return {k:loss?0.5*1.2*(loss===2?1.1:0.47)*A/m:0, c:loss?0.01:0, r}; }
  function reset(){ st='rest'; th=0; w=0; ext=[]; lost=0; trU=[]; trK=[]; tSw=0; lineDraw=0; setBtn(go,'▶ Take to P & release','toggle-btn play'); setFb('hidden',''); paint(); }
  chipsWire(wrap,'#ms .chip-btn',b=>{ m=+b.dataset.m; reset(); });
  chipsWire(wrap,'#ls .chip-btn',b=>{ loss=+b.dataset.l; reset(); });
  $('#lR').oninput=reset; $('#hR').oninput=()=>{ if(st!=='swing') { lineDraw=0; } };
  $('#rst').onclick=reset;
  $('#sl').onclick=()=>{ slow=!slow; $('#sl').classList.toggle('active',slow); };
  go.onclick=()=>{ if(st==='swing'||st==='pull'){ st='catch'; setBtn(go,'▶ Take to P & release','toggle-btn play'); return; }
    ext=[]; lost=0; trU=[]; trK=[]; tSw=0; st='pull'; setBtn(go,'■ Catch the bob','toggle-btn'); setFb('hidden',''); };
  function paint(){ $('#lg').innerHTML=ext.length?logTable(['Turn','Side','Height','of line'],ext.slice(0,6).map((e,i)=>[ext.length-i,e.s>0?'R':'P',fmt(e.h*100,1)+' cm',{v:fmt(e.h/e.h0*100,1)+' %',c:e.h/e.h0>0.97?'r-ok':'r-warn'}])):''; }
  animLoop(dt0=>{
    t+=dt0; const L=Lr(), H=Hr(), T0=th0(), C=coefs(), g=G7;
    setv($,'lV',fmt(L*100,0)+' cm'); setv($,'hV',fmt(H*100,0)+' cm');
    lineDraw=approach(lineDraw,1,2.5,dt0);
    const dt=dt0*(slow?0.25:1);
    if(st==='pull'){ th=approach(th,-T0,3.2,dt); w=0; if(Math.abs(th+T0)<0.002){ th=-T0; st='swing'; lastSign=0; } }
    else if(st==='catch'){ th=approach(th,0,3,dt); w=0; if(Math.abs(th)<0.003){ th=0; st='rest'; } }
    else if(st==='swing'){ const f=(a,b)=>-(g/L)*Math.sin(a)-C.k*L*b*Math.abs(b)-C.c*b, n=20, hh=dt/n;
      for(let i=0;i<n;i++){ const E0=0.5*m*L*L*w*w+m*g*L*(1-Math.cos(th));
        const k1a=w,k1b=f(th,w),k2a=w+k1b*hh/2,k2b=f(th+k1a*hh/2,k2a),k3a=w+k2b*hh/2,k3b=f(th+k2a*hh/2,k3a),k4a=w+k3b*hh,k4b=f(th+k3a*hh,k4a);
        const nw=w+hh/6*(k1b+2*k2b+2*k3b+k4b); th+=hh/6*(k1a+2*k2a+2*k3a+k4a);
        if(tSw>0.1&&Math.sign(nw)!==Math.sign(w)&&w!==0){ const hh2=L*(1-Math.cos(th)); ext.unshift({h:hh2,h0:H,s:Math.sign(th),th,t:tSw}); if(ext.length>40) ext.pop(); paint();
          const r=hh2/H; if(ext.length===1) setFb(r>0.999?'ok':'warn',r>0.999?'It reached the line exactly — no energy was lost.':r<0.93?`At R it reached only <b>${fmt(r*100,1)} %</b> of the line — the card's air drag took a big share.`:`At R it rose to <b>${fmt(r*100,1)} %</b> of the line — almost, but not quite.`);
          if(ext.length===12&&loss) setFb('warn',`After 12 turns it reaches only <b>${fmt(r*100,0)} %</b> of h — air and the support keep taking a little energy.`); }
        w=nw; tSw+=hh; const E1=0.5*m*L*L*w*w+m*g*L*(1-Math.cos(th)); lost+=Math.max(0,E0-E1); }
      if(!trU.length||tSw-trU[trU.length-1][0]>0.03){ traceAdd(trU,tSw,m*g*L*(1-Math.cos(th)),900); traceAdd(trK,tSw,0.5*m*L*L*w*w,900); } }

    const X=a=>px+a*S, Y=a=>py+a*S;   // world: x right, y down from pivot
    // wall paper behind the bob

    const yl=Y(L-H); ctx.save(); ctx.beginPath(); ctx.rect(px-pw/2,yl-3,pw*lineDraw,6); ctx.clip(); line(ctx,px-pw/2+6,yl,px+pw/2-6,yl,COL.blue,2); ctx.restore();
    textAt(ctx,'pencil line',px+pw/2-8,yl-6,{align:'right',size:11,weight:700,color:COL.blue});
    // pencil ticks where each turn stopped
    ext.slice(0,16).forEach((e,i)=>{ const ex=X(L*Math.sin(e.th)), ey=Y(L*Math.cos(e.th)); line(ctx,ex-9,ey,ex+9,ey,COL.red,i===0?2.2:1.2); });
    // support
    line(ctx,px-70,py,px+70,py,COL.ink,3.5); for(let x=px-66;x<px+70;x+=12) line(ctx,x,py,x+8,py-8,COL.mid,1.2);
    rect(ctx,px-7,py,14,8,COL.ink,'#fff',1.8);
    // Q (lowest) point marker and P / R letters
    const qy=Y(L); line(ctx,px,qy+C.r*S+6,px,qy+C.r*S+16,COL.mid,1.4); textAt(ctx,'Q',px,qy+C.r*S+30,{align:'center',size:13,weight:800,color:COL.green});
    textAt(ctx,'P',X(-L*Math.sin(T0)),yl+22,{align:'center',size:13,weight:800,color:COL.ink}); textAt(ctx,'R',X(L*Math.sin(T0)),yl+22,{align:'center',size:13,weight:800,color:COL.ink});
    // height dimension to the line
    dimArrow(ctx,px+pw/2-24,Y(L),yl,COL.blue); textAt(ctx,'h',px+pw/2-18,(Y(L)+yl)/2+4,{size:13,weight:800,color:COL.blue});
    // string + bob (+ card)
    const bx=X(L*Math.sin(th)), by=Y(L*Math.cos(th)), br=Math.max(9,C.r*S);
    line(ctx,px,py+4,bx,by,COL.ink,1.6);
    if(loss===2){ ctx.save(); ctx.translate(bx,by); ctx.rotate(th); rect(ctx,-2,-br*3,4,br*6,COL.muted,'#fff',1.6); ctx.restore(); }
    circ(ctx,bx,by,br,COL.ink,'#fff',2.4); circ(ctx,bx,by,br*0.35,COL.ink,COL.ink,1);
    if(v>0.05) fArrow(ctx,bx,by,Math.cos(th)*w*L*40,-Math.sin(th)*w*L*40,COL.green,fmt(v,2)+' m/s',{w:3});
    if(st==='pull'||st==='rest') { handDown(ctx,bx,by-br*0.2,0,Math.max(0.45,br/16)); }
    // lens on the last turning point
    if(ext.length&&(st==='swing'||st==='catch')){ const e=ext[0], ex=X(L*Math.sin(e.th)), ey=Y(L*Math.cos(e.th)), Z=Math.round(clamp(38/Math.max(0.5,Math.abs(ey-yl)),2,12));
      const cxL=e.s>0?W-70:LC+70, cyL=pT>130?74:Hc-gH-70;
      lensView(ctx,cxL,cyL,56,ex,ey,()=>{ const gap=(ey-yl)*Z; line(ctx,cxL-56,cyL-18,cxL+56,cyL-18,COL.blue,2.4); line(ctx,cxL-56,cyL-18+gap,cxL+56,cyL-18+gap,COL.red,2.4);
        if(Math.abs(gap)>4){ dimArrow(ctx,cxL+26,cyL-18,cyL-18+gap,COL.red); } textAt(ctx,'line',cxL-50,cyL-24,{size:10,weight:700,color:COL.blue}); textAt(ctx,'bob centre',cxL-50,cyL-18+gap+14,{size:10,weight:700,color:COL.red}); },{label:'turn '+(e.s>0?'R':'P')+' ×'+Z+' · '+fmt(Math.abs(e.h0-e.h)*1000,1)+' mm short',col:COL.red}); }
    // energy bars on the left
    const E=m*g*H; energyBars(ctx,12,64,Math.min(24,(LC-40)/3),Math.min(200,Hc*0.42),[{v:U*1000,col:COL.blue,lbl:'U'},{v:K*1000,col:COL.green,lbl:'K'},{v:lost*1000,col:COL.red,lbl:'lost'}],Math.max(E,1e-4)*1020,'Energy (mJ)');
    textAt(ctx,'U + K = '+fmt((U+K)*1000,1)+' mJ',12,64+Math.min(200,Hc*0.42)+48,{size:11,weight:700,color:COL.ink});
    // U and K against time
    if(trU.length>1){ const tEnd=Math.max(6,tSw), t0=Math.max(0,tEnd-8); const G=graphFrame(ctx,LC+30,Hc-gH,W-24,Hc-22,[t0,t0+8],[0,E*1000*1.05],{xs:2,xt:'t (s)',yt:'energy (mJ)'});
      const tr=a=>a.filter(p=>p[0]>=t0).map(p=>[p[0],p[1]*1000]); traceDraw(ctx,G,tr(trU),COL.blue,2.2); traceDraw(ctx,G,tr(trK),COL.green,2.2);
      const tot=trU.map((p,i)=>[p[0],(p[1]+trK[i][1])*1000]).filter(p=>p[0]>=t0); traceDraw(ctx,G,tot,COL.ink,1.4,[4,3]); }
    if(slow) tag(ctx,'slow motion ¼×',W-60,22,COL.mid,{size:11,weight:700});
  });
  return wrap;
}

/* =====================================================================
   7.3 LET US EXPERIMENT — lift a toy cart straight up, then pull it up a
   plank, through a spring balance (k = 60 N/m, damping 6 N·s/m).
   Along the path s: m·s″ = k·e + c·(v_hand − v) − mg·sinθ − μ·mg·cosθ.
   Your hand moves at a steady 0.15 m/s, so once the spring has stretched
   the cart moves at that speed and the balance reads the steady
   F′ = mg·sinθ (+ μ·mg·cosθ with real wheels); sinθ = h/L.
   1 kg, h = 0.5 m: straight up 9.8 N · 0.5 m = 4.9 J; L = 1 m: 4.9 N ·
   1 m = 4.9 J; L = 1.5 m: 3.27 N · 1.5 m = 4.9 J. MA = L/h.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>How you raise the cart</label><div class="chip-wrap" id="md"><button class="chip-btn" data-v="1">Lift straight up</button><button class="chip-btn active" data-v="0">Pull up the plank</button></div></div>
    <div class="control-group"><label>Length of plank used, L <span class="val" id="lV"></span></label><input type="range" id="lR" min="0.6" max="1.5" step="0.05" value="1"></div>
    <div class="control-group"><label>Cart</label><div class="chip-wrap" id="ms"><button class="chip-btn" data-m="0.5">0.5 kg</button><button class="chip-btn active" data-m="1">1 kg</button></div></div>
    <div class="control-group"><label>Wheels</label><div class="chip-wrap" id="fr"><button class="chip-btn active" data-f="0">Ideal (no friction)</button><button class="chip-btn" data-f="0.03">Real (a little friction)</button></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="go">▶ Pull slowly</button><button class="toggle-btn small" id="rst">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Balance reads',COL.yellow)}${card('r2','Distance pulled',COL.green)}${card('r3','Height gained',COL.blue)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb'), go=$('#go');
  const H=0.5, k=60, c=6, VH=0.15, CL=0.26, FULL=10;
  let vert=false, m=1, mu=0, st='idle', s=0, v=0, e=0, vh=0, Wy=0, t=0, wa=0, rd=0, steady=[], rows=[], ang=0, tr=[];
  const lenS=spr(1);
  function setFb(cl,h){ fb.className='fb '+cl; fb.innerHTML=h; }
  const Lr=()=>+$('#lR').value;
  function path(){ return vert?H:lenS.x; }
  function reset(){ st='idle'; s=0; v=0; e=0; vh=0; Wy=0; steady=[]; tr=[]; setBtn(go,'▶ Pull slowly','toggle-btn play'); setFb('hidden',''); }
  chipsWire(wrap,'#md .chip-btn',b=>{ vert=b.dataset.v==='1'; reset(); });
  chipsWire(wrap,'#ms .chip-btn',b=>{ m=+b.dataset.m; reset(); });
  chipsWire(wrap,'#fr .chip-btn',b=>{ mu=+b.dataset.f; reset(); });
  $('#lR').oninput=()=>{ if(!vert) reset(); };
  $('#rst').onclick=reset;
  go.onclick=()=>{ if(st==='pull'){ st='hold'; setBtn(go,'▶ Keep pulling','toggle-btn play'); return; } if(st==='top') reset(); st='pull'; setBtn(go,'■ Stop','toggle-btn'); };
  function paint(){ $('#lg').innerHTML=rows.length?logTable(['Path','F′','distance','F′ × d','mgh'],rows.map(r=>[r.p,fmt(r.F,2)+' N',fmt(r.d,2)+' m',{v:fmt(r.F*r.d,2)+' J',c:'r-ok'},fmt(r.U,2)+' J'])):''; }
  animLoop(dt=>{
    t+=dt; const L=Lr(); setv($,'lV',fmt(L,2)+' m · MA = '+fmt(L/H,2));
    springTo(lenS,L,40,12,dt); const th=vert?Math.PI/2:Math.asin(H/lenS.x);
    const sn=Math.sin(th), cs=Math.cos(th), P=path();
    const vt=st==='pull'?VH:0; vh=approach(vh,vt,4,dt);
    const n=10, hh=dt/n;
    for(let i=0;i<n;i++){ const F=k*e+c*(vh-v); let a=(F-m*G7*sn-(Math.abs(v)>1e-4||F>m*G7*sn?mu*m*G7*cs:0))/m;
      if(s<=0&&a<0&&v<=0){ a=0; v=0; }
      v+=a*hh; s+=v*hh; if(s<0){ s=0; v=Math.max(0,v); }
      if(st==='top'){ v=0; s=P; }
      e+=(vh-v)*hh; if(st==='top') e=approach(e,0,3,hh); if(e<0) e=0;
      if(s>0&&vh>0) Wy+=k*e*vh*hh; }
    rd=k*e; if(st==='pull'&&s>0.12*P&&s<0.9*P&&Math.abs(v-VH)<0.03) steady.push(rd);
    if(st==='pull'&&s>=P){ s=P; st='top'; setBtn(go,'↺ Again','toggle-btn play');
      const F=steady.length?steady.reduce((a,b)=>a+b,0)/steady.length:rd;
      rows.unshift({p:vert?'straight up':'plank L = '+fmt(lenS.x,2)+' m',F,d:P,U:m*G7*H}); if(rows.length>6) rows.pop(); paint();
      setFb('ok',vert?`Straight up it took <b>${fmt(F,2)} N</b> (the cart's weight) over just <b>${fmt(H,2)} m</b>.`:`Along the plank only <b>${fmt(F,2)} N</b>, but over <b>${fmt(P,2)} m</b>: F′ × L ≈ mgh = ${fmt(m*G7*H,2)} J.`); }
    wa-=v*dt/0.022;
    if(st==='pull'&&(!tr.length||s-tr[tr.length-1][0]>0.01)) traceAdd(tr,s,rd,400);
    setv($,'r1',fmt(rd,2)+' N'); setv($,'r2',fmt(s,2)+' m'); setv($,'r3',fmt(s*sn,2)+' m');

    // ---- draw ----
    const {ctx,w:W,h:Hc}=fitCanvas(canvas); ctx.clearRect(0,0,W,Hc);
    const RC=Math.min(190,W*0.28), aw=W-RC-10;
    const S=Math.min(aw/2.15,(Hc-40)/1.45), ox=10+aw-0.55*S, oy=Hc-34;
    const X=x=>ox+x*S, Y=y=>oy-y*S;
    floorLine(ctx,X(-1.6),X(0.55),Y(0));
    stoolDraw(ctx,X(0),X(0.45),Y(H),Y(0));
    textAt(ctx,'h = '+fmt(H,2)+' m',X(0.47),Y(H/2),{size:12,weight:800,color:COL.blue});
    dimArrow(ctx,X(0.5)+4,Y(H),Y(0),COL.blue);
    // plank (always shown when pulling on it; faded when lifting)
    const Lp=lenS.x, th2=Math.asin(H/Lp), xb=-Math.sqrt(Math.max(0,Lp*Lp-H*H)), tp=0.02, ux=Math.cos(th2), uy=Math.sin(th2), nx=-uy, ny=ux;
    const PT=(q,o)=>[X(xb+ux*q+nx*o),Y(uy*q+ny*o)];
    ctx.save(); ctx.globalAlpha=vert?0.22:1; ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.lineJoin='round';
    const pl=Lp+CL+0.05; ctx.beginPath(); [PT(0,0),PT(pl,0),PT(pl,tp),PT(0,tp)].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    if(!vert){ const pm=PT(Lp/2,0); textAt(ctx,'L = '+fmt(Lp,2)+' m',pm[0]+8,pm[1]+20,{align:'left',size:12,weight:800,color:COL.green});
      const e0=PT(0,tp),e1=PT(Lp,tp); line(ctx,e1[0],e1[1],e1[0]+nx*S*0.06,e1[1]-ny*S*0.06,COL.green,1.2);
      ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(X(xb),Y(0),42,-th2,0); ctx.stroke(); ctx.restore(); textAt(ctx,fmt(th2/D2R,0)+'°',X(xb)+48,Y(0)-6,{size:11.5,weight:700,color:COL.muted}); }
    // cart: rear wheel at distance s along the plank top (or lifted straight up)
    const bl=CL*S, bh=Math.max(18,0.085*S);
    let cx,cy,rot;
    if(vert){ cx=X(-0.3)-bl/2; cy=Y(s); rot=0; }
    else { const q=PT(s,tp); cx=q[0]; cy=q[1]; rot=-th2; }
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); const cp=cartDraw(ctx,bl,bh,wa,m+' kg'); ctx.restore();
    // balance: hooked on the cart's front (plank) or on its top (vertical)
    let hx,hy,brot;
    if(vert){ hx=cx+bl/2; hy=cy+cp.top-4; brot=-Math.PI/2; }
    else { const q=cp.hookF; hx=cx+Math.cos(rot)*q[0]-Math.sin(rot)*q[1]; hy=cy+Math.sin(rot)*q[0]+Math.cos(rot)*q[1]; brot=rot; }
    const BL=Math.min(118,S*0.36), trv=BL*0.6, ee=clamp(rd/FULL,-0.05,1.08)*trv;
    ctx.save(); ctx.translate(hx,hy); ctx.rotate(brot);
    const ringX=BL+32+Math.max(10,ee+4);
    springBalance(ctx,ringX,-5,BL,rd,FULL,{dir:-1,travel:trv,ticks:10,major:2});
    fist(ctx,ringX+6,-5,1,0.9);
    ctx.restore();
    // forces on the cart
    const fs=Math.min(6.5,S*0.024), dx=vert?0:Math.cos(rot), dy=vert?-1:Math.sin(rot);
    const bot=[cx+Math.cos(rot)*bl/2, cy+Math.sin(rot)*bl/2], mid=[bot[0]+Math.sin(rot)*bh*1.2, bot[1]-Math.cos(rot)*bh*1.2];
    fArrow(ctx,bot[0]+(vert?-bl*0.3:0),bot[1],0,m*G7*fs,COL.red,'mg = '+fmt(m*G7,1)+' N',{w:3,align:vert?'right':'left',lx:vert?-6:6,ly:-4});
    if(rd>0.05){ const o=vert?[bl*0.62,-bh*1.4]:[-Math.sin(rot)*bh*1.5*-1*0,-bh*1.3]; fArrow(ctx,mid[0]+o[0],mid[1]+o[1],dx*rd*fs,dy*rd*fs,COL.yellow,'F′ '+fmt(rd,1)+' N',{w:3.4,align:vert?'left':'right',lx:vert?8:-10,ly:vert?10:-12}); }
    // right column: work done vs potential energy + F vs distance
    const x0=W-RC+8;
    energyBars(ctx,x0+10,64,30,Math.min(170,Hc*0.36),[{v:Wy,col:COL.yellow,lbl:'F′×d'},{v:m*G7*s*sn,col:COL.blue,lbl:'mgh'}],m*G7*H*1.15,'Work in = energy stored (J)');
    const gy=64+Math.min(170,Hc*0.36)+60;
    if(gy+110<Hc){ const G=graphFrame(ctx,x0+26,gy,W-16,Math.min(Hc-30,gy+150),[0,1.5],[0,FULL],{xs:0.5,ys:2,xt:'d (m)',yt:'F′ (N)'});
      rows.slice(0,4).forEach((r,i)=>{ line(ctx,G.X(0),G.Y(r.F),G.X(r.d),G.Y(r.F),i?rgba(COL.yellow,0.45):COL.yellow,2.2); ctx.save(); ctx.globalAlpha=i?0.08:0.16; ctx.fillStyle=COL.yellow; ctx.fillRect(G.X(0),G.Y(r.F),G.X(r.d)-G.X(0),G.Y(0)-G.Y(r.F)); ctx.restore(); });
      traceDraw(ctx,G,tr,COL.yellow,1.4,[3,3]); textAt(ctx,'area = work',G.X(0.75),G.Y(FULL*0.9),{align:'center',size:10.5,weight:700,color:COL.muted}); }
  });
  return wrap;
}

/* =====================================================================
   7.4 LET US INVESTIGATE — a 30 cm scale (20 g) rocking on a pencil
   (7 mm thick). Stapler (150 g, 6 cm long) on the end near the pencil,
   erasers (20 g each) dropped one by one on the far end.
   Rigid body about the pencil top: I·φ″ = Σ −m·g·r·cosφ  (r = arm from
   the pencil), with I = Σ m·r² + ruler. The ends stop on the table
   (sinφ = 0.7/arm) with restitution 0.2. A landing eraser gives the
   ruler an angular kick m·v·r / I. Pencil 7 cm from the stapler end:
   stapler 150 g × 4 cm = 600 g·cm vs 1 eraser 20 g × 21 cm + scale
   20 g × 8 cm = 580 g·cm → stays; 2 erasers → 1000 g·cm → it lifts.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Erasers on the far end <span class="val" id="nV"></span></label><div class="toggle-group"><button class="toggle-btn play" id="add">＋ Add eraser</button><button class="toggle-btn" id="sub">− Remove</button></div></div>
    <div class="control-group"><label>Pencil distance from the stapler end <span class="val" id="pV"></span></label><input type="range" id="pR" min="3" max="15" step="0.5" value="7"></div>
    <div class="control-group"><label>Load</label><div class="chip-wrap" id="ld"><button class="chip-btn active" data-m="150">Stapler 150 g</button><button class="chip-btn" data-m="250">Big stapler 250 g</button></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn small active" id="sl">¼×</button><button class="toggle-btn small" id="rst">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Stapler',COL.red)}${card('r2','Effort arm',COL.yellow)}${card('r3','Load arm',COL.red)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const LR=30, MR=0.020, ME=0.020, PH=0.7, EW=4.4, EH=1.4, SL=6, US=3.0, UE=27.6;   // cm, kg
  let ms=0.150, n=0, phi=0, om=0, t=0, slow=true, falling=[], leaving=[], rows=[], rest0=null, lastSide=0, tSince=0;
  const uf=spr(7);
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  const phiMax=()=>Math.asin(PH/uf.x), phiMin=()=>-Math.asin(PH/(LR-uf.x));
  phi=phiMax();
  function torques(){ const rs=(US-uf.x)/100, re=(UE-uf.x)/100, rr=(LR/2-uf.x)/100;
    return {load:ms*G7*(-rs)*Math.cos(phi), eff:n*ME*G7*re*Math.cos(phi)+MR*G7*rr*Math.cos(phi), er:n*ME*G7*re, rr:MR*G7*rr, I:ms*rs*rs+n*ME*re*re+MR*((LR/100)*(LR/100)/12+rr*rr)}; }
  $('#add').onclick=()=>{ if(n+falling.length>=6) return; falling.push({y:10+ (n+falling.length)*EH,v:0}); };
  $('#sub').onclick=()=>{ if(n<=0) return; n--; leaving.push({k:n,y:0,a:1}); tSince=0; };
  $('#rst').onclick=()=>{ n=0; falling=[]; leaving=[]; tSince=0; setFb('hidden',''); };
  $('#sl').onclick=()=>{ slow=!slow; $('#sl').classList.toggle('active',slow); };
  chipsWire(wrap,'#ld .chip-btn',b=>{ ms=+b.dataset.m/1000; tSince=0; });
  function paint(){ $('#lg').innerHTML=rows.length?logTable(['Erasers','Pencil at','Effort × arm','Load × arm','Stapler'],rows.map(r=>[r.n,fmt(r.u,1)+' cm',fmt(r.e,0)+' g·cm',fmt(r.l,0)+' g·cm',{v:r.up?'lifts':'stays',c:r.up?'r-ok':'r-bad'}])):''; }
  animLoop(dt0=>{
    t+=dt0; const dt=dt0*(slow?0.25:1); tSince+=dt0;
    springTo(uf,+$('#pR').value,30,10,dt0); setv($,'pV',fmt(+$('#pR').value,1)+' cm'); setv($,'nV',n+'');
    // falling erasers: land on the stack top at the far end
    const stackTop=k=>{ const r=(UE-uf.x); return PH+r*Math.sin(phi)+0.2+k*EH; };
    falling.forEach(f=>{ f.v-=981*dt; f.y+=f.v*dt; const ty=stackTop(n); if(f.y<=ty){ f.done=true; const T=torques(), re=(UE-uf.x)/100;
        om+=ME*(f.v/100)*re*Math.cos(phi)/(T.I+ME*re*re); n++; tSince=0; thud(0.08,260); } });
    falling=falling.filter(f=>!f.done);
    leaving.forEach(l=>{ l.y+=dt0*14; l.a-=dt0*1.5; }); leaving=leaving.filter(l=>l.a>0);
    // rigid-body rotation about the pencil top, sub-stepped
    const N=20, h=dt/N;
    for(let i=0;i<N;i++){ const T=torques(); const tau=T.load-T.eff-0.004*om; om+=tau/T.I*h; phi+=om*h;
      const a0=phiMax(), a1=phiMin();
      if(phi>a0){ phi=a0; if(om>0) om=Math.abs(om)>0.3?-om*0.2:0; }
      if(phi<a1){ phi=a1; if(om<0) om=Math.abs(om)>0.3?-om*0.2:0; } }
    phi=clamp(phi,phiMin(),phiMax());
    const T=torques(), lg=ms*1000*(uf.x-US), ef=n*ME*1000*(UE-uf.x)+MR*1000*(LR/2-uf.x), up=phi<phiMax()-0.01;
    if(tSince>0.9&&Math.abs(om)<0.02&&!falling.length){ const key=n+'|'+fmt(uf.x,1)+'|'+ms; if(rest0!==key){ rest0=key; rows=rows.filter(r=>!(r.n===n&&Math.abs(r.u-uf.x)<0.05&&r.ms===ms)); rows.unshift({n,u:uf.x,e:ef,l:lg,up,ms}); if(rows.length>6) rows.pop(); paint();
        setFb(up?'ok':'warn',up?`<b>${n}</b> eraser${n>1?'s':''} (${n*20} g) lift the ${ms*1000} g stapler — effort × effort arm beats load × load arm.`:(n?`Not yet: ${fmt(ef,0)} g·cm (erasers + scale) < ${fmt(lg,0)} g·cm (stapler). Add one more.`:'Add an eraser on the far end.')); } }
    setv($,'r1',up?'lifted':'down'); setc($,'r1',up?COL.green:COL.red); setv($,'r2',fmt(UE-uf.x,1)+' cm'); setv($,'r3',fmt(uf.x-US,1)+' cm');

    // ---- draw ----
    const {ctx,w:W,h:Hc}=fitCanvas(canvas); ctx.clearRect(0,0,W,Hc);
    const S=Math.min((W-40)/34,(Hc*0.62)/16), X0=(W-30*S)/2-S*0.5, Yt=Math.min(Hc*0.5,40+15*S);
    const X=x=>X0+x*S, Y=y=>Yt-y*S;
    // table
    line(ctx,X(-2),Y(0),X(32),Y(0),COL.ink,2.6); for(let x=X(-1.5);x<X(32);x+=16) line(ctx,x,Y(0)+2,x-9,Y(0)+11,COL.mid,1.1);
    // pencil (hexagonal cross-section) rolling to its spot
    const pcx=X(uf.x), pcy=Y(PH/2); ctx.save(); ctx.translate(pcx,pcy); ctx.rotate(-uf.x/(PH/2)); ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.lineTo(Math.cos(a)*PH/2*S,Math.sin(a)*PH/2*S); } ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); circ(ctx,0,0,PH*0.12*S,COL.ink,COL.ink,1); ctx.restore();
    // ruler: frame with origin at pencil top, x along ruler
    const cs=Math.cos(phi), sn=Math.sin(phi), R=(u,v)=>[X(uf.x+(u-uf.x)*cs-v*sn),Y(PH+(u-uf.x)*sn+v*cs)];
    ctx.save(); ctx.translate(...R(0,0)); ctx.rotate(-phi); const th=0.25*S;
    ctx.fillStyle='#fff'; ctx.fillRect(0,-th,LR*S,th); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.strokeRect(0,-th,LR*S,th);
    for(let c=0;c<=30;c++){ line(ctx,c*S,-th,c*S,-th+(c%5?th*0.35:th*0.7),COL.muted,1); } ctx.restore();
    // stapler on the near end
    ctx.save(); ctx.translate(...R(0.2,0.25)); ctx.rotate(-phi); const sw=SL*S, sh=(ms>0.2?2.6:2.1)*S;
    ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle=COL.red; ctx.fillStyle='#fff';
    rrect(ctx,0,-sh*0.3,sw,sh*0.3,3); ctx.fill(); ctx.stroke();
    rrect(ctx,sw*0.04,-sh,sw*0.96,sh*0.55,sh*0.2); ctx.fill(); ctx.stroke();
    line(ctx,sw*0.1,-sh*0.3,sw*0.1,-sh*0.45,COL.red,3); circ(ctx,sw*0.1,-sh*0.38,sh*0.08,COL.red,'#fff',1.6);
    textAt(ctx,ms*1000+' g',sw*0.52,-sh*0.6,{align:'center',size:Math.max(10,S*0.75),weight:800,color:COL.red}); ctx.restore();
    // eraser stack on the far end
    const drawEraser=(u,v,a)=>{ ctx.save(); ctx.globalAlpha=a; ctx.translate(...R(u-EW/2,v)); ctx.rotate(-phi); rrect(ctx,0,-EH*S,EW*S,EH*S,3); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); line(ctx,EW*S*0.35,-EH*S,EW*S*0.35,0,rgba(COL.yellow,0.5),1.2); ctx.restore(); };
    for(let k=0;k<n;k++) drawEraser(UE,0.25+k*EH,1);
    leaving.forEach(l=>drawEraser(UE,0.25+l.k*EH+l.y,l.a));
    falling.forEach(f=>{ ctx.save(); const x=X(UE-EW/2+(uf.x-UE)*(1-Math.cos(phi))), y=Y(f.y); rrect(ctx,x,y-EH*S,EW*S,EH*S,3); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); });
    // forces: load (red) on the stapler, effort (yellow) on the erasers
    const pS=R(US,0.25+(ms>0.2?2.6:2.1)+0.3), pE=R(UE,0.25+n*EH+0.3), lS=S*(1.2+ms*G7*1.2), lE=S*(1.2+n*ME*G7*1.2);
    fArrow(ctx,pS[0],pS[1]-lS,0,lS,COL.red,'load '+fmt(ms*G7,2)+' N',{w:3,align:'left',lx:8,ly:-lS+10});
    if(n) fArrow(ctx,pE[0],pE[1]-lE,0,lE,COL.yellow,'effort '+fmt(n*ME*G7,2)+' N',{w:3,align:'right',lx:-8,ly:-lE+10});
    // arms (under the table line)
    const ya=Y(0)+26, xf=X(uf.x);
    line(ctx,xf,Y(0)+4,xf,ya+8,COL.ink,1.2,[3,3]); textAt(ctx,'fulcrum',xf,ya+24,{align:'center',size:11,weight:700,color:COL.ink});
    line(ctx,X(US),ya,xf-2,ya,COL.red,2); arrowHead(ctx,X(US),ya,Math.PI,COL.red,6); arrowHead(ctx,xf-2,ya,0,COL.red,6); textAt(ctx,'load arm',(X(US)+xf)/2,ya-6,{align:'center',size:11,weight:700,color:COL.red});
    line(ctx,xf+2,ya,X(UE),ya,COL.yellow,2); arrowHead(ctx,xf+2,ya,Math.PI,COL.yellow,6); arrowHead(ctx,X(UE),ya,0,COL.yellow,6); textAt(ctx,'effort arm',(xf+X(UE))/2,ya-6,{align:'center',size:11,weight:700,color:COL.yellow});
    // how far each end moved (d1, d2)
    const dE=(UE-uf.x)*(Math.sin(phiMax())-Math.sin(phi)), dS=(uf.x-US)*(Math.sin(phiMax())-Math.sin(phi));
    if(dE>0.05){ const xe=X(UE)-EW*S*0.5-12, ye=R(UE,0)[1]; dimArrow(ctx,xe,ye-dE*S,ye,COL.green); textAt(ctx,'d₁ '+fmt(dE,1)+' cm ↓',xe-6,ye-dE*S/2+4,{align:'right',size:11.5,weight:800,color:COL.green});
      const xs=X(SL+0.8), ys=R(US,0)[1]; dimArrow(ctx,xs,ys,ys+dS*S,COL.green); textAt(ctx,'d₂ '+fmt(dS,1)+' cm ↑',xs+6,ys-8,{size:11.5,weight:800,color:COL.green}); }
    // turning effects compared
    const by=Math.min(Hc-40,ya+64); textAt(ctx,'Turning effect about the pencil',20,by-22,{size:12,weight:800,color:COL.ink});
    torqueScale(ctx,20,by,W*0.55,ef,lg,'erasers + scale '+fmt(ef,0)+' g·cm','stapler '+fmt(lg,0)+' g·cm');
    if(slow) tag(ctx,'slow motion ¼×',W-60,22,COL.mid,{size:11,weight:700});
  });
  return wrap;
}

/* =====================================================================
   7.5 LET US EXPERIMENT — a 50 cm scale (30 g) hung by a string loop at
   its middle; the loop sits 2 cm above the scale's centre line, so the
   beam is a stable hanging balance. Paper cups (0.5 g) hang on 12 cm
   threads, identical coins 7.7 g. Beam: I·θ″ = −Σ mᵢg(xᵢcosθ + d·sinθ)
   − Mg·d·sinθ − b·θ′ ; it stops at ±25° when a cup touches the table.
   Each cup is its own pendulum driven by its hook's acceleration:
   ψ″ = −(g/ℓ)sinψ − (a_hook/ℓ)cosψ − cψ′.
   Level when n₁·L₁ = n₂·L₂ (cups add a little): L₁ 20 cm → 2 coins at
   10.3 cm, 4 at 5.2 cm, 8 at 2.6 cm.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Coins in the right pan (load) <span class="val" id="n2V"></span></label><div class="chip-wrap" id="n2c"><button class="chip-btn active" data-n="1">1</button><button class="chip-btn" data-n="2">2</button><button class="chip-btn" data-n="4">4</button><button class="chip-btn" data-n="8">8</button></div></div>
    <div class="control-group"><label>Right pan distance, L₂ <span class="val" id="l2V"></span></label><input type="range" id="l2R" min="1" max="24" step="0.1" value="20"></div>
    <div class="control-group"><label>Coins in the left pan (effort) <span class="val" id="n1V"></span></label><div class="toggle-group"><button class="toggle-btn small" id="n1m">−</button><button class="toggle-btn small" id="n1p">＋</button></div></div>
    <div class="control-group"><label>Left pan distance, L₁ <span class="val" id="l1V"></span></label><input type="range" id="l1R" min="4" max="24" step="0.5" value="20"></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Beam tilt',COL.ink)}${card('r2','n₁ × L₁',COL.yellow)}${card('r3','n₂ × L₂',COL.red)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const MB=0.030, LB=0.50, D=0.02, MC=0.0005, MK=0.0077, ELL=0.12, LIM=25*D2R, B=0.003;
  let n1=1, n2=1, th=0, om=0, t=0, still=0, rows=[], drops=[], logged='';
  const pans=[{x:spr(-0.20),psi:0,w:0,n:1,px:0,vx:0,ax:0,first:true},{x:spr(0.20),psi:0,w:0,n:1,px:0,vx:0,ax:0,first:true}];
  function setFb(c,h){ if(fb.className!=='fb '+c) fb.className='fb '+c; if(fb.innerHTML!==h) fb.innerHTML=h; }
  function setN(side,v){ const p=pans[side]; const cur=p.n+drops.filter(d=>d.side===side).length; if(v>cur){ for(let i=cur;i<v;i++) drops.push({side,y:0.16+0.02*(i-cur),v:0,delay:(i-cur)*0.12}); } else { p.n=Math.min(p.n,v); drops=drops.filter(d=>d.side!==side); } still=0; }
  chipsWire(wrap,'#n2c .chip-btn',b=>{ n2=+b.dataset.n; setN(1,n2); });
  $('#n1p').onclick=()=>{ if(n1<8){ n1++; setN(0,n1); } };
  $('#n1m').onclick=()=>{ if(n1>1){ n1--; setN(0,n1); } };
  function paint(){ $('#lg').innerHTML=rows.length?logTable(['n₁','L₁','n₂','L₂','n₁×L₁','n₂×L₂'],rows.map(r=>[r.n1,fmt(r.l1,1),r.n2,fmt(r.l2,1),r.a,{v:fmt(r.b,1),c:Math.abs(r.a-r.b)/r.a<0.08?'r-ok':'r-warn'}])):''; }
  animLoop(dt=>{
    t+=dt; const L1=+$('#l1R').value/100, L2=+$('#l2R').value/100;
    setv($,'l1V',fmt(L1*100,1)+' cm'); setv($,'l2V',fmt(L2*100,1)+' cm'); setv($,'n1V',n1+''); setv($,'n2V',n2+'');
    springTo(pans[0].x,-L1,20,9,dt); springTo(pans[1].x,L2,20,9,dt);
    // coins falling into the cups (world y relative to the cup base)
    drops.forEach(d=>{ if(d.delay>0){ d.delay-=dt; return; } d.v-=G7*dt; d.y+=d.v*dt; if(d.y<=0.004*pans[d.side].n){ d.done=true; pans[d.side].n++; thud(0.05,700); still=0; } });
    drops=drops.filter(d=>!d.done);
    const N=16, h=dt/N;
    for(let i=0;i<N&&h>1e-6;i++){ const c=Math.cos(th), s=Math.sin(th); let tau=-MB*G7*D*s, I=MB*(LB*LB/12+D*D);
      pans.forEach(p=>{ const m=MC+MK*p.n, x=p.x.x; tau+=-m*G7*(x*c+D*s); I+=m*(x*x+D*D); });
      om+=(tau-B*om)/I*h; th+=om*h;
      if(th>LIM){ th=LIM; om=om>0?-om*0.15:om; } if(th<-LIM){ th=-LIM; om=om<0?-om*0.15:om; }
      const c2=Math.cos(th), s2=Math.sin(th);
      pans.forEach(p=>{ const hx=p.x.x*c2+D*s2; if(p.first){ p.px=hx; p.vx=0; p.first=false; } const vx=(hx-p.px)/h; p.ax+=((vx-p.vx)/h-p.ax)*Math.min(1,h*40); p.vx=vx; p.px=hx;
        const a=-(G7/ELL)*Math.sin(p.psi)-(clamp(p.ax,-4,4)/ELL)*Math.cos(p.psi)-2.4*p.w; p.w+=a*h; p.psi=clamp(p.psi+p.w*h,-0.7,0.7); }); }
    const deg=th/D2R, a=pans[0].n*(-pans[0].x.x*100), b2=pans[1].n*(pans[1].x.x*100);
    setv($,'r1',Math.abs(deg)<1.5?'level':(fmt(Math.abs(deg),1)+'° '+(deg>0?'left ↓':'right ↓'))); setc($,'r1',Math.abs(deg)<1.5?COL.green:COL.red);
    setv($,'r2',fmt(a,1)+' coin·cm'); setv($,'r3',fmt(b2,1)+' coin·cm');
    if(Math.abs(deg)<1.5&&Math.abs(om)<0.03&&!drops.length&&Math.abs(pans[1].x.v)<0.002&&Math.abs(pans[0].x.v)<0.002) still+=dt; else still=0;
    if(still>0.8){ const key=[pans[0].n,fmt(L1*100,1),pans[1].n,fmt(L2*100,1)].join('|'); if(key!==logged){ logged=key;
        rows=rows.filter(r=>!(r.n1===pans[0].n&&r.n2===pans[1].n)); rows.push({n1:pans[0].n,l1:L1*100,n2:pans[1].n,l2:L2*100,a:pans[0].n*L1*100,b:pans[1].n*L2*100}); rows.sort((p,q)=>p.n2-q.n2||p.n1-q.n1); if(rows.length>8) rows.shift(); paint();
        setFb('ok',`Level! ${pans[0].n} × ${fmt(L1*100,1)} = ${fmt(pans[0].n*L1*100,1)} and ${pans[1].n} × ${fmt(L2*100,1)} = ${fmt(pans[1].n*L2*100,1)} — effort × effort arm = load × load arm.`); } }
    else if(Math.abs(deg)>=1.5&&still===0&&!drops.length&&Math.abs(om)<0.05) setFb('warn',`The ${deg<0?'right':'left'} side is heavier here — move the ${deg<0?'right pan closer to the centre':'right pan further out'}.`);

    // ---- draw ----
    const {ctx,w:W,h:Hc}=fitCanvas(canvas); ctx.clearRect(0,0,W,Hc);
    const S=Math.min((W-40)/0.62,(Hc-60)/0.5), cx=W/2, py=Math.max(30+0.1*S,(Hc-0.46*S)/2+0.1*S);   // px per metre, pivot
    // stand
    const floorY=py+0.36*S; line(ctx,cx-0.3*S,floorY,cx+0.3*S,floorY,COL.ink,2.4);
    line(ctx,cx-0.29*S,floorY,cx-0.29*S,py-0.07*S,COL.ink,3); line(ctx,cx-0.29*S,py-0.07*S,cx+0.02*S,py-0.07*S,COL.ink,3);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,py-0.07*S+6,6,Math.PI,Math.PI*2.4); ctx.stroke(); ctx.restore();
    // string loop from hook to the beam
    const c=Math.cos(th), s=Math.sin(th);
    const bp=u=>[cx+(u*c+D*s)*S, py-(u*s-D*c)*S];   // point on the beam centre line
    line(ctx,cx,py-0.07*S+10,cx,py,COL.ink,1.6);
    const m0=bp(0); ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(cx,py); ctx.lineTo(m0[0]-5,m0[1]); ctx.moveTo(cx,py); ctx.lineTo(m0[0]+5,m0[1]); ctx.stroke(); ctx.restore();
    // beam (the scale) with cm marks
    const e0=bp(-LB/2), e1=bp(LB/2), th2=0.012*S;
    ctx.save(); ctx.translate(e0[0],e0[1]); ctx.rotate(-th); ctx.fillStyle='#fff'; ctx.fillRect(0,-th2/2,LB*S,th2); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.strokeRect(0,-th2/2,LB*S,th2);
    for(let q=0;q<=50;q++) line(ctx,q/100*S,-th2/2,q/100*S,-th2/2+(q%5?3:th2*0.6),COL.muted,1);
    for(let q=0;q<=25;q+=5){ textAt(ctx,String(q),(0.25+q/100)*S,-th2/2-4,{align:'center',size:9.5,weight:700,color:COL.muted}); if(q) textAt(ctx,String(q),(0.25-q/100)*S,-th2/2-4,{align:'center',size:9.5,weight:700,color:COL.muted}); }
    ctx.restore();
    // pointer + tilt scale under the pivot
    const pl=0.1*S, pb=bp(0); line(ctx,pb[0],pb[1],pb[0]+Math.sin(th)*pl,pb[1]+Math.cos(th)*pl,COL.ink,2);
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(pb[0],pb[1],pl+4,Math.PI/2-0.35,Math.PI/2+0.35); ctx.stroke(); ctx.restore();
    line(ctx,pb[0],pb[1]+pl-2,pb[0],pb[1]+pl+10,Math.abs(deg)<1.5?COL.green:COL.mid,2.4);
    // pans
    pans.forEach((p,i)=>{ const hk=bp(p.x.x), cup=[hk[0]+Math.sin(p.psi)*ELL*S, hk[1]+Math.cos(p.psi)*ELL*S], cw=0.06*S, chh=0.055*S;
      ctx.save(); ctx.translate(cup[0],cup[1]); ctx.rotate(-p.psi);
      // threads from the rim corners to the hook
      line(ctx,-cw/2,0,0,-ELL*S,COL.ink,1.2); line(ctx,cw/2,0,0,-ELL*S,COL.ink,1.2);
      ctx.lineJoin='round'; ctx.lineWidth=2.2; ctx.strokeStyle=i?COL.red:COL.yellow; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(-cw/2,0); ctx.lineTo(-cw*0.36,chh); ctx.lineTo(cw*0.36,chh); ctx.lineTo(cw/2,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      for(let k=0;k<p.n;k++) coinFlat(ctx,0,chh-4-k*Math.min(5,chh*0.8/Math.max(1,p.n)),cw*0.3);
      ctx.restore(); circ(ctx,hk[0],hk[1],3,COL.ink,'#fff',1.6);
      textAt(ctx,(i?'load ':'effort ')+p.n+(p.n>1?' coins':' coin'),cup[0],cup[1]+chh+18,{align:'center',size:12,weight:800,color:i?COL.red:COL.yellow});
      // arm length along the beam
      const pc=bp(0), a2=bp(p.x.x);
      const bq=(u,o)=>[cx+(u*c+(D+o)*s)*S, py-(u*s-(D+o)*c)*S], q0=bq(0.004*(i?1:-1),0.035), q1=bq(p.x.x,0.035), col=i?COL.red:COL.yellow, an=Math.atan2(q1[1]-q0[1],q1[0]-q0[0]);
      line(ctx,q0[0],q0[1],q1[0],q1[1],col,2); arrowHead(ctx,q1[0],q1[1],an,col,6); arrowHead(ctx,q0[0],q0[1],an+Math.PI,col,6);
      const qm=bq(Math.abs(p.x.x)<0.09?p.x.x+Math.sign(p.x.x)*0.07:p.x.x/2,0.06); textAt(ctx,(i?'L₂ = ':'L₁ = ')+fmt(Math.abs(p.x.x)*100,1)+' cm',qm[0],qm[1]+4,{align:'center',size:11.5,weight:800,color:col}); });
    // falling coins
    drops.forEach(d=>{ if(d.delay>0) return; const p=pans[d.side], hk=bp(p.x.x); coinFlat(ctx,hk[0]+Math.sin(p.psi)*ELL*S,hk[1]+(ELL+0.05)*S-d.y*S,0.018*S); });
    // table under the cups
    textAt(ctx,Math.abs(deg)<1.5?'level':'tilted '+fmt(Math.abs(deg),1)+'°',pb[0],pb[1]+pl+28,{align:'center',size:12,weight:800,color:Math.abs(deg)<1.5?COL.green:COL.red});
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'7.1', title:'Dropping a Ball into Sand', desc:'Raise the ball higher, drop it, and compare how deep each depression is', build: buildA1 },
  { num:'7.2', title:'Pendulum and the Pencil Line', desc:'Release from P at the line — does the bob come back up to it at R?', build: buildA2 },
  { num:'7.3', title:'Pulling a Cart up a Plank', desc:'Lift straight up, then pull up a longer, gentler plank — compare the balance readings', build: buildA3 },
  { num:'7.4', title:'Scale on a Pencil: Erasers Lift a Stapler', desc:'Add erasers on the far end until the heavy stapler rises', build: buildA4 },
  { num:'7.5', title:'Coins on a Beam Balance', desc:'Add coins to the right pan and slide it inwards until the beam is level', build: buildA5 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
