<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9 · Chapter 3 — Tissues in Action | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand-badge">🦴</div>

  <div class="body-wrap">

        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>

</div>

<script>
/* =========================================================================
   GRADE 9 — CHAPTER 3: TISSUES IN ACTION (NCERT Exploration, iesc103)
   Activities 3.1–3.5. Every activity runs a continuous animation loop:
   buttons and sliders only set targets; roots grow from dividing tip cells,
   blood flows with a Poiseuille profile and clots, tendons slide, ligaments
   stop joints at their real range of motion.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

function stepperSide(names){

    <button class="toggle-btn play" id="act" style="width:100%;margin-top:9px;padding:9px;">▶</button></div>`;

function stepper(wrap,names,acts,onGo){
  const st={i:0,done:names.map(()=>false),run:false,t:0};
  const pills=[...wrap.querySelectorAll('#steps .step-pill')], act=wrap.querySelector('#act');
  function paint(){
    pills.forEach((p,i)=>{ p.classList.toggle('active',i===st.i); p.classList.toggle('done',st.done[i]); p.textContent=(st.done[i]?'✓ ':(i+1)+' ')+names[i]; });
    const last=st.i===names.length-1;
    act.disabled=st.run||(last&&st.done[st.i]);
    act.textContent= st.run? '⏳ '+acts[st.i]+'…' : st.done[st.i]? (last?'✓ Done':'Next step →') : '▶ '+acts[st.i];
    wrap.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('hidden', !el.dataset.step.split(',').includes(String(st.i))));
  }
  pills.forEach((p,i)=>p.onclick=()=>{ st.i=i; st.run=false; st.t=0; paint(); if(onGo) onGo(i,false); });
  act.onclick=()=>{
    if(st.run) return;
    if(st.done[st.i]){ if(st.i<names.length-1){ st.i++; st.t=0; paint(); if(onGo) onGo(st.i,false); } return; }
    st.run=true; st.t=0; paint(); if(onGo) onGo(st.i,true);
  };
  st.finish=()=>{ st.run=false; st.done[st.i]=true; paint(); };
  st.paint=paint; paint();
  return st;
}
function watchGlass(ctx,cx,y,W,liquid,surf,t){

function lensStep(L,vp,dt,cut){
  if(cut||vp<=0) return;
  L.forEach(b=>{ for(let i=1;i<b.length;i++){ const z=b[i]; b[i]+=vp*clamp((z-30)/180,0,1.2)*dt; }
    for(let i=0;i<b.length-1;i++){ if(b[i]<100 && b[i+1]-b[i]>18){ b.splice(i+1,0,(b[i]+b[i+1])/2); i++; } }
    while(b.length&&b[b.length-1]>260) b.pop(); });
}

function rootPath(ctx,x0,y0,len,ang,t,seed,jx){ // returns points of a gently swaying root, kept inside the jar
  const pts=[]; const n=12; let x=x0,y=y0,a=ang*0.55;

/* =====================================================================
   3.2 LET US UNDERSTAND FURTHER — BLOOD IN EVERYDAY EXPERIENCES (Table 3.3)
   Blood flows through a vessel with the Poiseuille profile v = vmax(1 − r²/R²);
   RBC : platelet : WBC drawn roughly 110 : 14 : 2 (real ≈ 600 : 30 : 1).
   • Small cut   — platelets stick at the torn wall, fibrin knits a plug.
                   Bleeding time (Harker–Slichter): BT = 30.5 − P/3850 min
                   (P = platelets per µL, floor 4 min).  Plug p = 1 − e^(−3.5 t/BT),
                   leak Q = Q0·(1 − p)².  1 min plays in 2 s.
   • Infection   — bacteria  B′ = 0.35B(1 − B/120) − 0.9·W·B/(B + 8)
                   WBCs in tissue  W′ = 0.9(WBC/7000)·B/(B + 15)(1 + W/10) − W/30
                   → 7000/µL clears in ≈ 29 h, 1000/µL cannot.  1 h = 0.4 s.
   • Exercise    — ACSM: VO₂ = 3.5 + 0.1v (walk) or 0.2v (run), v in m/min;
                   HR = 72 + (HRmax − 72)(VO₂ − 3.5)/(VO₂max − 3.5), HRmax = 208 − 0.7·age;
                   VE = 25·VO₂, VT 0.5 → 1.3 L.  On-kinetics τ = 30 s (shown 3× faster).
   • Spin        — hindered settling v = v₀(1 − φ)^4.65 (Richardson–Zaki), v₀ ∝ RCF,
                   RCF = 1.118×10⁻⁵ · r(cm) · rpm²; packs to plasma 55 % / cells 45 %.
   ===================================================================== */

function runner(ctx,x,gy,H,ph,kmh,br,red,t){
  const run=kmh>7.5, lean=kmh*0.012, bob=kmh>0?Math.abs(Math.sin(ph))*(run?8:3):0;

  const leg=H*0.25, stride=kmh===0?0:clamp(kmh*6,0,80);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  const foot=(p,near)=>{ const fx=hip[0]+stride*0.5*Math.cos(p), lift=Math.max(0,Math.sin(p))*(run?46:16), fy=gy-2-lift; const k=ik2(hip[0],hip[1],fx,fy,leg,leg,-1);
    ctx.strokeStyle=near?COL.ink:COL.mid; ctx.lineWidth=near?5:4; ctx.beginPath(); ctx.moveTo(hip[0],hip[1]); ctx.lineTo(k[0],k[1]); ctx.lineTo(fx,fy); ctx.lineTo(fx+14,fy+1); ctx.stroke(); };

    ctx.strokeStyle=near?COL.ink:COL.mid; ctx.lineWidth=near?4.5:3.5; ctx.beginPath(); ctx.moveTo(sh[0],sh[1]); ctx.lineTo(el[0],el[1]); ctx.lineTo(el[0]+Math.sin(fa)*H*0.14,el[1]+Math.cos(fa)*H*0.14); ctx.stroke(); };
  foot(ph+Math.PI,false); arm(ph,false);

  const chest=1+0.07*Math.sin(br*Math.PI*2);
  ctx.save(); ctx.translate((hip[0]+sh[0])/2,(hip[1]+sh[1])/2); ctx.rotate(lean); ctx.beginPath(); ctx.ellipse(3,-6,H*0.075*chest,H*0.17,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
  ctx.strokeStyle=rgba(COL.blue,0.6); ctx.lineWidth=1.3; for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(3,-26+k*9,H*0.06*chest,5,0,0.2,Math.PI-0.2); ctx.stroke(); } ctx.restore();
  foot(ph,true); arm(ph+Math.PI,true);

  circ(ctx,head[0],head[1],H*0.07,COL.ink,mixCol('#ffffff','#f28b78',red*0.9),2.4);
  circ(ctx,head[0]+H*0.035,head[1]-3,1.8,COL.ink,COL.ink,1);

}

/* =====================================================================
   3.3 LET US PERFORM — CONNECTIVE TISSUES (Table 3.4)
   • Bone      — press the elbow: soft tissue over bone is only 4 mm, so the
                 dent saturates  d = t(1 − e^(−F/F₀))  (t 4 mm, F₀ 4 N) and the
                 bone itself moves F/k (k ≈ 5×10⁵ N/m → < 0.1 mm).  Forearm
                 muscle: t 25 mm, F₀ 12 N — the finger sinks in.
   • Cartilage — ear flap is a torsion spring: θ″ = −ω²θ − 2ζωθ′ + finger,
                 ω 14 rad/s, ζ 0.18 → springs back and wobbles.  Without
                 cartilage (ω 1.2, ζ 1.6) it stays bent; bone snaps at 3°.
   • Tendon    — tendon excursion e = r₁θ₁ + r₂θ₂ + r₃θ₃ (moment arms 10, 7.5,
                 5 mm) ≈ 36 mm for a full curl; the muscle belly (120 mm) shortens
                 by e and bulges, height ∝ √(L₀/L) (constant volume).
   • Ligament  — lower leg: Iφ″ = τ_quad − mg·l·sinφ − cφ′ − τ_lig,
                 τ_lig = K(e^((φ−88°)/1.4°) − 1): the knee stops a few degrees
                 past straight.  Torn: only the capsule stops it (~120°).
   ===================================================================== */

    ctx.save(); ctx.fillStyle='#fbf8f1'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(lx-10,cy-36); ctx.lineTo(cx-14,cy-38); ctx.arc(cx,cy,40,-Math.PI*0.62,Math.PI*0.6,false); ctx.lineTo(lx-10,cy+34); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();

/* =====================================================================
   3.4 LET US INVESTIGATE — HOW MUCH OF YOUR WEIGHT IS BONE AND MUSCLE?
   Book values: muscle 40–50 % (males), ~30–40 % (females); bone 12–15 %.
   bone kg = W × bone %, muscle kg = W × muscle %, rest = W − both.
   The spring scale's needle is a damped spring (ω 9 rad/s, ζ 0.18), so it
   swings past the reading and settles.  Blocks are drawn to true VOLUME:
   side ∝ ∛(m/ρ) with ρ bone 1.85, muscle 1.06, rest 0.98 g/cm³ — bone is
   15 % of the mass but only ~8 % of the volume.  Blocks fly on real
   parabolas (g) and settle with a bounce.
   Classmates: age 14–15, boys 47 ± 8 kg, girls 44 ± 7 kg (seeded).
   ===================================================================== */
const MASS_RHO={bone:1.85,muscle:1.06,rest:0.98};
const CLASS_NAMES=['Aarav','Diya','Kabir','Meera','Rohan','Sana','Arjun','Isha','Vivaan','Anaya','Dev','Priya','Tara','Nikhil'];
function personFront(ctx,x,footY,H,wid,view,ph,t,step){

  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  const leg=(d,lift)=>{ const hx=x+d*16*s*W, fx=x+d*20*s*W, ly=footY-lift;
    ctx.beginPath(); ctx.moveTo(hx-d*0-14*s*W,hipY); ctx.lineTo(fx-9*s*W,ly); ctx.lineTo(fx+(d>0?16:-16)*s-4*s,ly); ctx.lineTo(fx+(d>0?16:-16)*s-4*s,ly-8*s); ctx.lineTo(fx+9*s*W,ly-8*s); ctx.lineTo(hx+14*s*W,hipY); return [hx,fx,ly]; };
  const body=()=>{ ctx.beginPath(); ctx.moveTo(x-30*s*W,sh); ctx.quadraticCurveTo(x-36*s*W,sh+50*s,x-26*s*W,hipY-20*s); ctx.lineTo(x-30*s*W,hipY+10*s); ctx.lineTo(x+30*s*W,hipY+10*s); ctx.lineTo(x+26*s*W,hipY-20*s); ctx.quadraticCurveTo(x+36*s*W,sh+50*s,x+30*s*W,sh); ctx.closePath(); };
  const arm=d=>{ ctx.beginPath(); ctx.moveTo(x+d*30*s*W,sh+2*s); ctx.quadraticCurveTo(x+d*(44*s*W+4*s),sh+60*s,x+d*(40*s*W+2*s)+sw*d*4,hipY+10*s); ctx.lineTo(x+d*(32*s*W)+sw*d*4,hipY+14*s); ctx.quadraticCurveTo(x+d*(34*s*W),sh+60*s,x+d*26*s*W,sh+24*s); };
  const L1=step?Math.max(0,sw)*14*s:0, L2=step?Math.max(0,-sw)*14*s:0;
  const fill=view==='out'?'#fffaf3':'#fff';
  [[-1,L1],[1,L2]].forEach(([d,l])=>{ leg(d,l); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); });
  body(); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
  [-1,1].forEach(d=>{ arm(d); ctx.fillStyle=fill; ctx.fill(); ctx.stroke(); });
  line(ctx,x,neck-4*s,x,sh,COL.ink,10*s); line(ctx,x,neck-4*s,x,sh,fill,6*s);
  circ(ctx,x,hy+32*s,27*s,COL.ink,fill,2.4);
  if(view==='mus'){ ctx.save(); ctx.strokeStyle=COL.red; ctx.fillStyle=rgba(COL.red,0.16); ctx.lineWidth=1.8;
      const el=(cx,cy,rx,ry,a)=>{ ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,a||0,0,Math.PI*2); ctx.fill(); ctx.stroke(); };
      [-1,1].forEach(d=>{ el(x+d*15*s*W,sh+20*s,13*s*W,14*s); el(x+d*38*s*W,sh+36*s,7*s*W,22*s,-d*0.12); el(x+d*38*s*W,sh+92*s,5.5*s*W,20*s,-d*0.05);
        el(x+d*17*s*W,hipY+40*s,11*s*W,32*s,d*0.1); el(x+d*19*s*W,kneeY+32*s,8*s*W,22*s); });
      for(let r=0;r<3;r++) [-1,1].forEach(d=>el(x+d*8*s*W,sh+50*s+r*20*s,7*s*W,8*s)); ctx.restore(); }
  if(view==='bone'){ ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.fillStyle='#fbf8f1';
      const bone=(x1,y1,x2,y2)=>{ line(ctx,x1,y1,x2,y2,COL.ink,6*s); line(ctx,x1,y1,x2,y2,'#fbf8f1',3*s); circ(ctx,x1,y1,3.4*s,COL.ink,'#fbf8f1',1.4); circ(ctx,x2,y2,3.4*s,COL.ink,'#fbf8f1',1.4); };
      circ(ctx,x,hy+30*s,22*s,COL.ink,'#fbf8f1',1.8); ctx.beginPath(); ctx.arc(x-8*s,hy+30*s,4*s,0,7); ctx.arc(x+8*s,hy+30*s,4*s,0,7); ctx.stroke();

      for(let r=0;r<6;r++){ ctx.beginPath(); ctx.ellipse(x,sh+14*s+r*9*s,(22-r*0.8)*s*W,6*s,0,0.25,Math.PI-0.25); ctx.stroke(); }

      [-1,1].forEach(d=>{ bone(x+d*30*s*W,sh+6*s,x+d*37*s*W,sh+66*s); bone(x+d*37*s*W,sh+70*s,x+d*37*s*W+sw*d*3,hipY+6*s);
        bone(x+d*14*s*W,hipY+4*s,x+d*17*s*W,kneeY-2*s); bone(x+d*17*s*W,kneeY+4*s,x+d*19*s*W,footY-12*s-(d<0?L1:L2)); }); ctx.restore(); }
  ctx.restore();
}
function scaleDraw(ctx,x,y,W,kg,press){
  ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  rrect(ctx,x-W/2,y-26+press,W,26-press,8); ctx.fill(); ctx.stroke();
  const cx=x, cy=y-2, R=W*0.2; ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  for(let k=0;k<=12;k++){ const a=Math.PI+k/12*Math.PI; line(ctx,cx+Math.cos(a)*R*0.78,cy+Math.sin(a)*R*0.78,cx+Math.cos(a)*R*0.95,cy+Math.sin(a)*R*0.95,COL.ink,1); }
  const a=Math.PI+clamp(kg/120,-0.02,1.02)*Math.PI; line(ctx,cx,cy,cx+Math.cos(a)*R*0.9,cy+Math.sin(a)*R*0.9,COL.yellow,2.6); ctx.restore();
}
function block3(ctx,x,y,s,col,fill,hatch,label,sub){ // cube resting with its bottom-front edge centred at (x,y)
  const d=s*0.35; ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.2; ctx.strokeStyle=col;
  ctx.beginPath(); ctx.moveTo(x-s/2,y-s); ctx.lineTo(x-s/2+d,y-s-d); ctx.lineTo(x+s/2+d,y-s-d); ctx.lineTo(x+s/2,y-s); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s/2,y); ctx.lineTo(x+s/2+d,y-d); ctx.lineTo(x+s/2+d,y-s-d); ctx.lineTo(x+s/2,y-s); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.rect(x-s/2,y-s,s,s); ctx.fillStyle=fill; ctx.fill(); ctx.stroke();
  if(hatch){ ctx.save(); ctx.beginPath(); ctx.rect(x-s/2,y-s,s,s); ctx.clip(); ctx.strokeStyle=rgba(COL.ink,0.3); ctx.lineWidth=1; for(let k=-s;k<s;k+=7){ ctx.beginPath(); ctx.moveTo(x-s/2+k,y); ctx.lineTo(x-s/2+k+s,y-s); ctx.stroke(); } ctx.restore(); }
  ctx.restore();
  if(label){ textAt(ctx,label,x,y+18,{align:'center',size:13,weight:700,color:col}); textAt(ctx,sub,x,y+33,{align:'center',size:11,color:COL.muted}); }
}

    const stripe=(F,o,len,col)=>{ const a=P(add3(o,M3.ap(F,[0,-len*0.25,0.04]))), b=P(add3(o,M3.ap(F,[0,-len*0.75,0.04]))); const fr=P(add3(o,M3.ap(F,[0,-len*0.5,0.05])))[2]-P(add3(o,M3.ap(F,[0,-len*0.5,0])))[2];
      ctx.save(); ctx.globalAlpha=fr>-0.01?1:0.25; line(ctx,a[0],a[1],b[0],b[1],col,3); ctx.restore(); };
    if(jk==='shoulder') stripe(Fsw,S0,0.30,COL.green);
    // trace of the moving tip
    const tipOf={shoulder:W0,elbow:W0,wrist:fing[1][3],fingers:fing[1][3],knee:A0,neck:add3(B.head,M3.ap(B.Fh,[0,-0.01,0.14])),toes:toes[2][1],skull:B.head}[jk];
    if(test) trace.push(tipOf.slice()); if(trace.length>600) trace.shift();
    if(trace.length>1){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath(); trace.forEach((v,i)=>{ const p=P(v); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); ctx.stroke(); ctx.restore(); }
    const tp=P(tipOf); circ(ctx,tp[0],tp[1],5,COL.yellow,'#fff',2.4);
    // joint marker + stop flash
    const jp=P({shoulder:S0,elbow:E0,wrist:W0,fingers:K0,knee:Kn,neck:nb,toes:ball,skull:B.head}[jk]);
    circ(ctx,jp[0],jp[1],9,COL.green,'#fff',3);
    if(stopFlash>0.05){ ctx.save(); ctx.globalAlpha=stopFlash; circ(ctx,jp[0],jp[1],18+6*Math.sin(t*20),COL.red,null,3); ctx.restore(); tag(ctx,'ligaments stop it here',jp[0],jp[1]-34,COL.red,{size:11.5,alpha:stopFlash}); }
    // joint-type inset
    jointInset(ctx,690,90,JOINTS[jk],q[jk],t);
    if(!test&&!trace.length) textAt(ctx,'Pick a movement on the right →',300,24,{align:'center',size:13,weight:600,color:COL.mid});
    ctx.restore();
  });
  return wrap;
}
/* the joint type as a line diagram that moves with the real joint angles */
function jointInset(ctx,x,y,J,Q,t){
  ctx.save(); rrect(ctx,x-96,y-76,192,176,14); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#d6dfe9'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  const f=Q.f.x, a=Q.a.x, w=Q.w.x, name={ball:'ball & socket',hinge:'hinge',pivot:'pivot',knuckle:'hinge · knuckle',ellipsoid:'ellipsoid',fixed:'fixed'}[J.type];
  textAt(ctx,name,x,y+90,{align:'center',size:12.5,weight:700,color:COL.green});
  const bone=(x1,y1,x2,y2,wd)=>{ line(ctx,x1,y1,x2,y2,COL.ink,wd+4); line(ctx,x1,y1,x2,y2,'#fbf8f1',wd); };
  ctx.save(); ctx.translate(x,y+4);
  if(J.type==='ball'){ ctx.beginPath(); ctx.arc(0,0,30,Math.PI*0.62,Math.PI*1.38,true); ctx.strokeStyle=COL.ink; ctx.lineWidth=6; ctx.stroke(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.stroke();
    const dir=[Math.sin(f)*0.9+Math.sin(a)*0.4,Math.cos(f)*Math.cos(a)]; const L=58; bone(0,0,dir[0]*L+Math.sin(a)*20,dir[1]*L,12);
    circ(ctx,0,0,22,COL.ink,'#fbf8f1',2.4); line(ctx,0,0,Math.cos(w)*16,Math.sin(w)*6,COL.green,2.4); }
  else if(J.type==='hinge'||J.type==='knuckle'){ bone(0,-66,0,-6,14); ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,Math.PI*2); ctx.fillStyle='#fbf8f1'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    const an=f*(J.name==='Knee'?1:-1)*(J.name==='Toes'?-1:1); ctx.save(); ctx.rotate(an+(J.type==='knuckle'?a*0.8:0)); bone(0,18,0,64,12); ctx.beginPath(); ctx.arc(0,0,20,0.35,Math.PI-0.35); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    line(ctx,-30,0,30,0,COL.mid,1.4,[3,3]); textAt(ctx,'axis',34,4,{size:10,color:COL.muted}); }
  else if(J.type==='pivot'){ ctx.save(); ctx.scale(1,0.45); circ(ctx,0,-40,34,COL.ink,'#fbf8f1',2.4); const r=34; for(let k=0;k<6;k++){ const an=w+k/6*Math.PI*2; if(Math.sin(an)>-0.1) line(ctx,Math.cos(an)*r*0.5,-40+Math.sin(an)*r*0.5,Math.cos(an)*r,-40+Math.sin(an)*r,COL.ink,1.6); }
    circ(ctx,Math.cos(w-Math.PI/2)*20,-40+Math.sin(w-Math.PI/2)*20,5,COL.green,COL.green,1); ctx.restore(); bone(0,-6,0,66,16); textAt(ctx,'peg',22,40,{size:10,color:COL.muted}); ctx.save(); ctx.rotate(a*0.5+0); ctx.restore(); }
  else if(J.type==='ellipsoid'){ ctx.save(); ctx.beginPath(); ctx.ellipse(0,-6,34,18,0,Math.PI*0.9,Math.PI*2.1,true); ctx.strokeStyle=COL.ink; ctx.lineWidth=5; ctx.stroke(); ctx.restore(); bone(0,-70,0,-26,14);
    ctx.save(); ctx.rotate(-f*0.7); ctx.translate(Math.sin(a)*10,0); ctx.beginPath(); ctx.ellipse(0,6,28,14,0,0,Math.PI*2); ctx.fillStyle='#fbf8f1'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); bone(0,18,0,64,12); ctx.restore(); }
  else { ctx.save(); ctx.beginPath(); ctx.arc(0,20,62,Math.PI*1.1,Math.PI*1.9); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
    ctx.beginPath(); for(let i=0;i<=14;i++){ const xx=-40+i*6, yy=-30+(i%2?6:0); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.strokeStyle=COL.green; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore(); textAt(ctx,'sutures lock the bones',0,30,{align:'center',size:10.5,color:COL.muted}); }
  ctx.restore();
}

function buildNav(){
  const nav = document.getElementById('sideNav');

  body.appendChild(a.build());
}
