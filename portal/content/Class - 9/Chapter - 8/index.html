<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* =========================================================================
   GRADE 9 — CHAPTER 8: JOURNEY INSIDE THE ATOM (NCERT Exploration, iesc108)
   The chapter has no numbered activities, so there is one simulator per
   experiment / figure section (8.2 – 8.9). Every scene runs a continuous
   animation loop: controls only set targets. Electron beams, α-particles,
   ions and orbiting electrons all move under the real forces (E, v×B,
   Coulomb, Larmor radiation) with time compressed to be watchable.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

function traceDraw(ctx,G,tr,col,lw,dash){ if(tr.length<2) return; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2.4; if(dash) ctx.setLineDash(dash); ctx.beginPath(); tr.forEach((p,i)=>{ const X=G.X(p[0]), Y=G.Y(p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); ctx.restore(); }

/* split the canvas into a scene box and a side/bottom panel box */

const G7=9.8;
/* stacked-energy column: rows [{v,col,lbl}], max = full height (J) */

  ctx.save(); textAt(ctx,title||'Energy (J)',x+(rows.length*(w+10)-10)/2,y-10,{align:'center',size:11.5,weight:800,color:COL.ink});
  rows.forEach((r,i)=>{ const X=x+i*(w+10), f=clamp(r.v/max,0,1.05);
    rrect(ctx,X,y,w,h,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke();
    ctx.save(); rrect(ctx,X,y,w,h,5); ctx.clip(); ctx.fillStyle=r.col; ctx.globalAlpha=0.85; ctx.fillRect(X,y+h*(1-f),w,h*f); ctx.restore();
    textAt(ctx,r.lbl,X+w/2,y+h+14,{align:'center',size:11,weight:800,color:r.col});
    textAt(ctx,fmt(Math.max(0,r.v),r.v<10?2:1),X+w/2,y+h+28,{align:'center',size:10.5,weight:700,color:COL.muted}); });
  ctx.restore();
}
/* vertical metre stick: base at (x,y0) going up; px per metre, to top metres */
function meterStick(ctx,x,y0,ppm,top,o){ o=o||{}; const y1=y0-top*ppm;
  ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(x-9,y1,18,y0-y1); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.strokeRect(x-9,y1,18,y0-y1);
  const st=o.step||0.1; for(let v=0;v<=top+1e-9;v+=st){ const y=y0-v*ppm, big=Math.abs(v*2-Math.round(v*2))<1e-6;
    line(ctx,x-9,y,x-9+(big?11:6),y,COL.ink,big?1.6:1); if(big) textAt(ctx,fmt(v,1)+' m',x-13,y+4,{align:'right',size:10.5,weight:700,color:COL.muted}); }
  ctx.restore();
}
/* a hand seen from the side, reaching down from the top, fingers around a
   point (x,y). open 0 = gripping, 1 = fingers spread (let go) */
function handDown(ctx,x,y,open,s){ s=s||1; ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(-15,-110); ctx.lineTo(-13,-42); ctx.lineTo(13,-42); ctx.lineTo(15,-110); ctx.fill(); ctx.stroke(); // forearm
  rrect(ctx,-18,-46,36,22,8); ctx.fill(); ctx.stroke(); // palm
  const sp=open*0.55;
  [[-14,-1],[-5,-1],[5,1],[14,1]].forEach((f,i)=>{ const a=Math.PI/2+f[1]*(0.18+sp)*(1+i%2*0.3), L=26-Math.abs(i-1.5)*3;
    const bx=f[0], by=-26, mx=bx+Math.cos(a)*L*0.55, my=by+Math.sin(a)*L*0.55, cx=mx+Math.cos(a-f[1]*(0.7-open*0.7))*L*0.5, cy=my+Math.sin(a-f[1]*(0.7-open*0.7))*L*0.5;
    ctx.lineWidth=6.5; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(mx,my); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.lineWidth=3.2; ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(mx,my); ctx.lineTo(cx,cy); ctx.stroke(); });
  ctx.restore();
}
/* shaded-line ball (iron): r in px, spin angle a */
function ballDraw(ctx,x,y,r,a,col){ circ(ctx,x,y,r,col||COL.red,'#fff',2.6);
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-1,0,Math.PI*2); ctx.clip(); ctx.strokeStyle=rgba(col||COL.red,0.35); ctx.lineWidth=1.3;
  for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(x,y,r*Math.abs(Math.cos(a+i*0.63)),r,0,0,Math.PI*2); ctx.stroke(); }
  ctx.restore(); ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.4,Math.PI*1.1,Math.PI*1.6); ctx.stroke(); ctx.restore(); }
/* toy cart in its own frame: body length bl, height bh (px), bottom-left at 0,0 going up (−y) */
function cartDraw(ctx,bl,bh,wa,load){ const r=bh*0.36;
  ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  rrect(ctx,0,-r*1.6-bh,bl,bh,6); ctx.fill(); ctx.stroke();
  line(ctx,bl*0.12,-r*1.6-bh*0.5,bl*0.88,-r*1.6-bh*0.5,COL.mid,1.2);
  if(load) textAt(ctx,load,bl/2,-r*1.6-bh*0.5-4,{align:'center',size:Math.max(10,bh*0.36),weight:800,color:COL.red});
  wheelDraw(ctx,bl*0.2,-r,r,wa); wheelDraw(ctx,bl*0.8,-r,r,wa);
  ctx.restore(); return {hookF:[bl+8,-r*1.6-bh*0.5], hookB:[-8,-r*1.6-bh*0.5], top:-r*1.6-bh};
}
function stoolDraw(ctx,x0,x1,top,floor){ ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  rrect(ctx,x0,top,x1-x0,14,4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0+14,top+14); ctx.lineTo(x0+4,floor); ctx.moveTo(x1-14,top+14); ctx.lineTo(x1-4,floor);
  ctx.moveTo(x0+10,top+(floor-top)*0.62); ctx.lineTo(x1-10,top+(floor-top)*0.62); ctx.stroke(); ctx.restore(); }
function floorLine(ctx,x0,x1,y){ line(ctx,x0,y,x1,y,COL.ink,2.4); for(let x=x0+6;x<x1;x+=16) line(ctx,x,y+2,x-9,y+11,COL.mid,1.1); }
/* a coin seen edge-on (flat ellipse) */
function coinFlat(ctx,x,y,r){ ctx.save(); ctx.lineWidth=1.5; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x,y,r,r*0.3,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=COL.yellow; ctx.beginPath(); ctx.ellipse(x,y,r*0.62,r*0.18,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
/* a torque bar pair: left (effort, yellow) vs right (load, red) */
function torqueScale(ctx,x,y,w,a,b,lblA,lblB){ const mx=Math.max(a,b,1e-9)*1.1;
  ctx.save(); line(ctx,x,y+12,x+w,y+12,COL.mid,1);
  const ha=10; rrect(ctx,x,y-ha,w*a/mx,ha,3); ctx.fillStyle=rgba(COL.yellow,0.85); ctx.fill();
  rrect(ctx,x,y+14,w*b/mx,ha,3); ctx.fillStyle=rgba(COL.red,0.85); ctx.fill();
  textAt(ctx,lblA,x+w*a/mx+6,y-1,{size:11,weight:700,color:COL.yellow}); textAt(ctx,lblB,x+w*b/mx+6,y+23,{size:11,weight:700,color:COL.red});
  ctx.restore(); }
/* soft sound for impacts */
function thud(gain,freq){ const a=sfxCtx(); if(!a) return; try{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(freq||120,a.currentTime); o.frequency.exponentialRampToValueAtTime(40,a.currentTime+0.18);
  g.gain.setValueAtTime(Math.min(0.4,gain),a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.22); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.25); }catch(e){} }

/* ---------------------------------------------------------------------
   0d. CHAPTER-8 ATOM KIT — element data, Bohr–Bury filling, line-drawn
       protons / neutrons / electrons, a nucleus whose nucleons spring
       into packed slots, electron shells whose electrons fly in and orbit
   --------------------------------------------------------------------- */
/* [symbol, name, neutrons in Table 8.4 (or the most common isotope)] */
const EL=[null,
 ['H','Hydrogen',0],['He','Helium',2],['Li','Lithium',4],['Be','Beryllium',5],['B','Boron',6],['C','Carbon',6],['N','Nitrogen',7],['O','Oxygen',8],['F','Fluorine',10],['Ne','Neon',10],
 ['Na','Sodium',12],['Mg','Magnesium',12],['Al','Aluminium',14],['Si','Silicon',14],['P','Phosphorus',16],['S','Sulfur',16],['Cl','Chlorine',18],['Ar','Argon',22],['K','Potassium',20],['Ca','Calcium',20],
 ['Sc','Scandium',24],['Ti','Titanium',26],['V','Vanadium',28],['Cr','Chromium',28],['Mn','Manganese',30],['Fe','Iron',30]];
/* neutron numbers of the stable (or very long-lived) isotopes */
const STABLE={1:[0,1],2:[1,2],3:[3,4],4:[5],5:[5,6],6:[6,7],7:[7,8],8:[8,9,10],9:[10],10:[10,11,12],11:[12],12:[12,13,14],13:[14],14:[14,15,16],15:[16],16:[16,17,18,20],17:[18,20],18:[18,20,22],19:[20,21,22],20:[20,22,23,24,26,28],21:[24],22:[24,25,26,27,28],23:[28],24:[26,28,29,30],25:[30],26:[28,30,31,32]};
const SHELL_NAMES=['K','L','M','N'];
function shellsOf(ne){ // Bohr–Bury: K 2, L 8, M ≤ 8 as outermost, then N (real 3d filling for 21–26)
  const sp={21:[2,8,9,2],22:[2,8,10,2],23:[2,8,11,2],24:[2,8,13,1],25:[2,8,13,2],26:[2,8,14,2]};
  if(sp[ne]) return sp[ne].slice();
  const s=[], cap=[2,8,8,2]; let r=ne; for(let i=0;i<4&&r>0;i++){ const k=Math.min(r,cap[i]); s.push(k); r-=k; } return s; }
function valenceOf(Z){ const s=shellsOf(Z); return s.length?s[s.length-1]:0; }
function valencyOf(Z){ const v=valenceOf(Z); if(Z===2||v===8) return 0; if(Z===1) return 1; return v<=4?v:8-v; }
function elSym(Z){ return Z>=1&&Z<EL.length?EL[Z][0]:(Z===0?'—':'?'); }
function elName(Z){ return Z>=1&&Z<EL.length?EL[Z][1]:(Z===0?'no element':'?'); }
function isStable(Z,N){ return !!(STABLE[Z]&&STABLE[Z].includes(N)); }

/* ---- particles (line drawings: + in red, − in blue, neutron plain ink) ---- */
function pDraw(ctx,x,y,r,a){ ctx.save(); if(a!==undefined) ctx.globalAlpha=a; circ(ctx,x,y,r,COL.red,'#fff',Math.max(1.3,r*0.16));
  const s=r*0.5; line(ctx,x-s,y,x+s,y,COL.red,Math.max(1.2,r*0.18)); line(ctx,x,y-s,x,y+s,COL.red,Math.max(1.2,r*0.18)); ctx.restore(); }
function nDraw(ctx,x,y,r,a){ ctx.save(); if(a!==undefined) ctx.globalAlpha=a; circ(ctx,x,y,r,COL.ink,'#eef2f8',Math.max(1.3,r*0.16)); ctx.restore(); }
function eDraw(ctx,x,y,r,a){ ctx.save(); if(a!==undefined) ctx.globalAlpha=a; circ(ctx,x,y,r,COL.blue,COL.blue,1.2);
  line(ctx,x-r*0.5,y,x+r*0.5,y,'#fff',Math.max(1.1,r*0.28)); ctx.restore(); }
function alphaDraw(ctx,x,y,r,neg){ // α = 2p + 2n (or a made-up −2 particle)
  if(neg){ eDraw(ctx,x-r*0.45,y,r*0.55); eDraw(ctx,x+r*0.45,y,r*0.55); return; }
  const q=r*0.42; nDraw(ctx,x-q,y-q,q*1.05); pDraw(ctx,x+q,y-q,q*1.05); pDraw(ctx,x-q,y+q,q*1.05); nDraw(ctx,x+q,y+q,q*1.05); }

/* ---- nucleus: nucleons spring into sunflower-packed slots ---- */
function nucTypes(Z,N){ const t=[]; let p=0,n=0; for(let i=0;i<Z+N;i++){ if(n>=N||(p<Z&&(p+0.5)/Z<=(n+0.5)/N)){ t.push('p'); p++; } else { t.push('n'); n++; } } return t; }
function nucSlot(i,r){ if(i===0) return [0,0]; const R=r*1.08*Math.sqrt(i+0.35), a=i*2.39996; return [Math.cos(a)*R,Math.sin(a)*R]; }
function nucRadius(A,r){ return A<=1?r:r*1.08*Math.sqrt(A-1+0.35)+r; }
function nucNew(){ return {parts:[], gone:[]}; }
function nucSync(nu,Z,N,src){ // src = {p:[x,y], n:[x,y]} spawn / return points (stage coords)
  ['p','n'].forEach(t=>{ const want=t==='p'?Z:N; let have=nu.parts.filter(q=>q.t===t);
    while(have.length<want){ const q={t,x:src[t][0],y:src[t][1],vx:(Math.random()-0.5)*200,vy:-260-Math.random()*120}; nu.parts.push(q); have.push(q); }
    while(have.length>want){ const q=have.pop(); nu.parts.splice(nu.parts.indexOf(q),1); q.home=src[t]; nu.gone.push(q); } }); }
function nucStep(nu,cx,cy,r,dt,jit,t){
  const Z=nu.parts.filter(q=>q.t==='p').length, N=nu.parts.length-Z, ty=nucTypes(Z,N);
  const ps=nu.parts.filter(q=>q.t==='p'), ns=nu.parts.filter(q=>q.t==='n'); let ip=0,inn=0;
  ty.forEach((tp,i)=>{ const q=tp==='p'?ps[ip++]:ns[inn++]; const s=nucSlot(i,r); q.slot=i;
    const jx=jit?jit*Math.sin(t*37+i*2.1):0, jy=jit?jit*Math.cos(t*41+i*1.7):0;
    q.vx+=((cx+s[0]+jx-q.x)*70-q.vx*11)*dt; q.vy+=((cy+s[1]+jy-q.y)*70-q.vy*11)*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; });
  nu.gone.forEach(q=>{ q.vx+=((q.home[0]-q.x)*40-q.vx*9)*dt; q.vy+=((q.home[1]-q.y)*40-q.vy*9)*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life=(q.life||0)+dt; });
  nu.gone=nu.gone.filter(q=>q.life<0.9); }
function nucDraw(ctx,nu,r){
  [...nu.parts].sort((a,b)=>(b.slot||0)-(a.slot||0)).forEach(q=>(q.t==='p'?pDraw:nDraw)(ctx,q.x,q.y,r));
  nu.gone.forEach(q=>(q.t==='p'?pDraw:nDraw)(ctx,q.x,q.y,r,1-q.life/0.9)); }
/* a static packed nucleus (no springs) */
function nucStatic(ctx,cx,cy,Z,N,r,rot){ const ty=nucTypes(Z,N), pts=ty.map((t,i)=>{ const s=nucSlot(i,r), c=Math.cos(rot||0), sn=Math.sin(rot||0); return [t,cx+s[0]*c-s[1]*sn,cy+s[0]*sn+s[1]*c,i]; });
  pts.reverse().forEach(p=>(p[0]==='p'?pDraw:nDraw)(ctx,p[1],p[2],r)); }

/* ---- electron shells: electrons fly in and then ride their ring ---- */
function shNew(){ return {els:[], gone:[], rot:0}; }
function shSync(sh,counts,src){ // counts per shell, e.g. [2,8,1]
  for(let s=0;s<4;s++){ const want=counts[s]||0; let have=sh.els.filter(e=>e.s===s);
    while(have.length<want){ const e={s,x:src[0],y:src[1],vx:(Math.random()-0.5)*160,vy:-220,born:0}; sh.els.push(e); have.push(e); }
    while(have.length>want){ const e=have.pop(); sh.els.splice(sh.els.indexOf(e),1); e.home=src; sh.gone.push(e); } } }
function shTargets(sh,cx,cy,radii,oval){ const out=new Map(); for(let s=0;s<4;s++){ const es=sh.els.filter(e=>e.s===s), n=es.length;
    es.forEach((e,i)=>{ const a=sh.rot*(1.6/(s+1))+s*0.7+i/n*Math.PI*2; out.set(e,[cx+Math.cos(a)*radii[s],cy+Math.sin(a)*radii[s]*(oval||1)]); }); } return out; }
function shStep(sh,cx,cy,radii,dt,spin,oval){ sh.rot+=dt*(spin===undefined?0.9:spin); const tg=shTargets(sh,cx,cy,radii,oval);
  sh.els.forEach(e=>{ const T=tg.get(e); e.born+=dt; const k=e.born<1.2?45:160, c=e.born<1.2?8:24;
    e.vx+=((T[0]-e.x)*k-e.vx*c)*dt; e.vy+=((T[1]-e.y)*k-e.vy*c)*dt; e.x+=e.vx*dt; e.y+=e.vy*dt; });
  sh.gone.forEach(e=>{ e.vx+=((e.home[0]-e.x)*30-e.vx*7)*dt; e.vy+=((e.home[1]-e.y)*30-e.vy*7)*dt; e.x+=e.vx*dt; e.y+=e.vy*dt; e.life=(e.life||0)+dt; });
  sh.gone=sh.gone.filter(e=>e.life<1); }
function shRings(ctx,cx,cy,radii,n,o){ o=o||{}; for(let s=0;s<n;s++){ ctx.save(); ctx.globalAlpha=o.alpha===undefined?0.7:o.alpha;
    ctx.beginPath(); ctx.ellipse(cx,cy,radii[s],radii[s]*(o.oval||1),0,0,Math.PI*2); ctx.setLineDash([5,5]); ctx.lineWidth=(o.hl&&o.hl[s])?2.4:1.3;
    ctx.strokeStyle=(o.hl&&o.hl[s])?o.hl[s]:COL.mid; ctx.stroke(); ctx.restore();
    if(o.labels) textAt(ctx,SHELL_NAMES[s],cx+radii[s]*0.707+4,cy-radii[s]*0.707*(o.oval||1)-4,{size:o.lsize||12,weight:800,color:(o.hl&&o.hl[s])||COL.mid}); } }
function shDraw(ctx,sh,r){ sh.els.forEach(e=>eDraw(ctx,e.x,e.y,r)); sh.gone.forEach(e=>eDraw(ctx,e.x,e.y,r,1-e.life)); }

/* ---- light ---- */
function specCol(nm){ // approximate visible colour of a wavelength
  let r=0,g=0,b=0;
  if(nm<380) return '#7a4fc9'; if(nm>750) return '#8b1a1a';
  if(nm<440){ r=-(nm-440)/60; b=1; } else if(nm<490){ g=(nm-440)/50; b=1; } else if(nm<510){ g=1; b=-(nm-510)/20; }
  else if(nm<580){ r=(nm-510)/70; g=1; } else if(nm<645){ r=1; g=-(nm-645)/65; } else r=1;
  const f=nm<420?0.45+0.55*(nm-380)/40:(nm>700?0.45+0.55*(750-nm)/50:1);
  return 'rgb('+[r,g,b].map(v=>Math.round(255*Math.pow(v*f,0.8)*0.92)).join(',')+')'; }
function photonDraw(ctx,x,y,ang,len,col,ph,a){ // a travelling wave packet
  ctx.save(); ctx.globalAlpha=a===undefined?1:a; ctx.translate(x,y); ctx.rotate(ang); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.beginPath();
  for(let s=-len;s<=0;s+=2){ const env=Math.sin(Math.PI*(s+len)/len), yy=Math.sin(s*0.45+ph)*7*env; if(s===-len) ctx.moveTo(s,yy); else ctx.lineTo(s,yy); }
  ctx.stroke(); arrowHead(ctx,4,0,0,col,7); ctx.restore(); }
function notation(ctx,x,y,sym,A,Z,col,size){ size=size||40; ctx.save(); ctx.textBaseline='alphabetic';
  ctx.font='800 '+size+'px Poppins, sans-serif'; const sw=ctx.measureText(sym).width;
  ctx.font='700 '+(size*0.45)+'px Poppins, sans-serif'; const aw=Math.max(ctx.measureText(A+'').width,ctx.measureText(Z+'').width);
  ctx.textAlign='right'; ctx.fillStyle=COL.green; ctx.fillText(A+'',x+aw,y-size*0.52); ctx.fillStyle=COL.red; ctx.fillText(Z+'',x+aw,y+size*0.02);
  ctx.textAlign='left'; ctx.font='800 '+size+'px Poppins, sans-serif'; ctx.fillStyle=col||COL.ink; ctx.fillText(sym,x+aw+3,y); ctx.restore(); return aw+3+sw; }
function springScale(ctx,x,top,len,reading,maxR,col,label){ // a hanging spring scale whose pointer drops with mass
  ctx.save(); const W=46; rrect(ctx,x-W/2,top,W,len+30,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();

function vcoil(ctx,x,y0,y1,n,r,col,lw){ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||1.5; ctx.beginPath(); ctx.moveTo(x,y0); for(let i=0;i<=n*2;i++){ const yy=y0+(y1-y0)*i/(n*2); ctx.lineTo(x+(i%2?r:-r)*(i===0||i===n*2?0:1),yy); } ctx.stroke(); ctx.restore(); }

/* =====================================================================
   8.2 CATHODE RAYS (Fig. 8.1) — a discharge tube is pumped down; below
   ~0.01 mmHg the glow gives way to a sharp beam. Each electron leaves the
   anode at v = √(2eV/m) and is pushed through the plates by E = Vp/d and
   the coil field B (F = −e(E + v×B)), integrated in SI units. Thomson's
   trick: balance E against B (v = E/B), switch E off, read the bend
   → e/m = v/(rB) = 1.76 × 10¹¹ C/kg — the same for every cathode and gas.
   ===================================================================== */
const QE=1.602e-19, ME_KG=9.109e-31;
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Vacuum pump <span class="val" id="pV"></span></label><div class="toggle-group"><button class="toggle-btn play" id="pump">▶ Pump air out</button><button class="toggle-btn" id="air">Let air in</button></div></div>
    <div class="control-group"><label>Accelerating voltage <span class="val" id="vV"></span></label><input type="range" id="vR" min="1" max="5" step="0.1" value="2"></div>
    <div class="control-group"><label>Plates (top plate) <span class="val" id="eV"></span></label><input type="range" id="eR" min="-500" max="500" step="5" value="0"></div>
    <div class="control-group"><label>Magnet coils <span class="val" id="bV"></span></label><input type="range" id="bR" min="-1" max="1" step="0.02" value="0"></div>
    <div class="control-group"><label>Cathode metal</label><div class="chip-wrap" id="cat"><button class="chip-btn active" data-k="Al">Aluminium</button><button class="chip-btn" data-k="Cu">Copper</button><button class="chip-btn" data-k="Fe">Iron</button></div>
      <label style="margin-top:8px">Gas left in the tube</label><div class="chip-wrap" id="gas"><button class="chip-btn active" data-k="Air">Air</button><button class="chip-btn" data-k="H₂">Hydrogen</button><button class="chip-btn" data-k="Ne">Neon</button></div>
      <button class="toggle-btn navy" id="meas">Measure e/m (Thomson)</button></div>
    <div class="control-group"><div class="result-cards">${card('r1','Electron speed',COL.blue)}${card('r2','Spot moved',COL.green)}${card('r3','e/m measured',COL.green)}${card('r4','Beam',COL.ink)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const GAS={'Air':'#b0509a','H₂':'#c45bc0','Ne':'#e8702a'};
  let p=760, pumping=false, cath='Al', gas='Air', t=0, rows=[], seq=null, lastEm=null;
  const sV=spr(2), sE=spr(0), sB=spr(0);
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  $('#pump').onclick=()=>{ pumping=true; };
  $('#air').onclick=()=>{ pumping=false; p=Math.max(p,1); seq=null; };
  chipsWire(wrap,'#cat .chip-btn',b=>{ cath=b.dataset.k; });
  chipsWire(wrap,'#gas .chip-btn',b=>{ gas=b.dataset.k; });
  $('#meas').onclick=()=>{ if(p>0.02){ setFb('warn','Pump the air out first — no sharp beam yet.'); return; } seq={st:0,t:0}; };
  // tube geometry (cm): anode hole at x=0, plates 5 cm long at 4–9 cm, gap 2 cm, screen at 24 cm
  const XP0=4, XP1=9, DG=2, XS=24, RT=3.6;
  function path(V,Vp,B){ // integrate one electron in SI, return polyline in cm + hit info
    const v0=Math.sqrt(2*QE*V/ME_KG), E=Vp/(DG/100); let x=0,y=0,vx=v0,vy=0; const pts=[[0,0]]; let hit='screen';

      const ax=inP?(-QE/ME_KG)*(vy*B):0, ay=inP?(-QE/ME_KG)*(-E - vx*B):0; // F = −e(E + v×B); E points down when top plate is +

      if(i%5===0) pts.push([x*100,y*100]);
      if(inP&&Math.abs(y*100)>=DG/2){ hit='plate'; break; }
      if(Math.abs(y*100)>=RT){ hit='glass'; break; }
      if(x*100>=XS){ hit='screen'; break; } if(x<0) { hit='glass'; break; } }
    pts.push([x*100,y*100]); return {pts,hit,v0,y:y*100}; }
  function rFromShift(ys){ // Thomson's geometry: circle of radius r in the coils, straight after
    let lo=0.05,hi=1e4; for(let k=0;k<80;k++){ const r=Math.sqrt(lo*hi), ph=Math.asin(Math.min(1,(XP1-XP0)/r)), y=r*(1-Math.cos(ph))+(XS-XP1)*Math.tan(ph); if(y>Math.abs(ys)) lo=r; else hi=r; } return Math.sqrt(lo*hi)/100; }
  let P=path(2000,0,0), key='';
  animLoop(dt=>{
    t+=dt;
    if(pumping) p=Math.max(0.001,p*Math.exp(-dt/0.55)); else p=Math.min(760,p+(760-p)*(1-Math.exp(-dt*1.5))+dt*20);
    // Thomson sequence drives the sliders
    if(seq){ seq.t+=dt; const V=+$('#vR').value*1000, v=Math.sqrt(2*QE*V/ME_KG), B=-0.5e-3;

      else if(seq.st===1){ $('#eR').value=0; if(seq.t>2.4){ const r=rFromShift(P.y), em=seq.v/(r*0.5e-3); lastEm=em; seq=null;
          rows.unshift({c:cath,g:gas,em}); if(rows.length>6) rows.pop();
          $('#lg').innerHTML=logTable(['Cathode','Gas','e/m (C/kg)'],rows.map(r=>[r.c,r.g,{v:fmt(r.em/1e11,2)+' × 10¹¹',c:'r-ok'}]));

    springTo(sV,+$('#vR').value,40,11,dt); springTo(sE,+$('#eR').value,40,11,dt); springTo(sB,+$('#bR').value,40,11,dt);

    setv($,'r3',lastEm?fmt(lastEm/1e11,2)+' × 10¹¹':'—'); setv($,'r4',p>10?'no discharge':(beamI<0.2?'glow only':(P.hit==='screen'?'on screen':'hits '+P.hit)));
    if(!seq&&!lastEm) setFb(p>10?'warn':beamI<0.5?'warn':'ok',p>10?'Too much air: the gas stops the charges. Pump it out.':beamI<0.5?'Low pressure: the whole tube glows (gas colour).':'Sharp beam from the cathode (−) — tilt it with the plates or the coils.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    const S=24, X0=190, Yc=205, X=x=>X0+x*S, Y=y=>Yc-y*S, XC=90;
    // glass tube

    ctx.moveTo(XC-40,Yc-34); ctx.lineTo(X(1.2),Yc-34); ctx.quadraticCurveTo(X(10),Y(RT+0.6),X(XS),Y(RT+0.9)); ctx.lineTo(X(XS),Y(-RT-0.9)); ctx.quadraticCurveTo(X(10),Y(-RT-0.6),X(1.2),Yc+34); ctx.lineTo(XC-40,Yc+34); ctx.arc(XC-40,Yc,34,Math.PI/2,Math.PI*1.5); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    // gas glow
    if(glowI>0.02){ ctx.save(); ctx.globalAlpha=glowI*(0.28+0.04*Math.sin(t*9)); ctx.fillStyle=GAS[gas]; ctx.beginPath(); ctx.moveTo(XC-36,Yc-30); ctx.lineTo(X(1.2),Yc-30); ctx.quadraticCurveTo(X(10),Y(RT+0.4),X(XS)-4,Y(RT+0.6)); ctx.lineTo(X(XS)-4,Y(-RT-0.6)); ctx.quadraticCurveTo(X(10),Y(-RT-0.4),X(1.2),Yc+30); ctx.lineTo(XC-36,Yc+30); ctx.closePath(); ctx.fill(); ctx.restore(); }
    // vacuum pump side-arm with a moving piston
    line(ctx,X(14),Y(RT+0.75),X(14),60,COL.ink,2.4); line(ctx,X(14)+12,Y(RT+0.8),X(14)+12,60,COL.ink,2.4);
    rrect(ctx,X(14)-22,10,56,50,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
    const pist=pumping&&p>0.002?Math.sin(t*9)*12:0; line(ctx,X(14)-14,34+pist,X(14)+26,34+pist,COL.yellow,4); line(ctx,X(14)+6,34+pist,X(14)+6,4+pist*0.2,COL.yellow,2.4);
    textAt(ctx,'vacuum pump',X(14)+42,32,{size:12,weight:700,color:COL.muted});
    // cathode (−) and anode (+) with the supply
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.blue; ctx.beginPath(); ctx.moveTo(XC,Yc-24); ctx.quadraticCurveTo(XC+10,Yc,XC,Yc+24); ctx.stroke(); ctx.restore();
    textAt(ctx,cath,XC-14,Yc+5,{align:'center',size:12,weight:800,color:COL.blue}); textAt(ctx,'−',XC-4,Yc-30,{align:'center',size:18,weight:800,color:COL.blue});
    line(ctx,X(0),Yc-30,X(0),Yc-5,COL.red,4); line(ctx,X(0),Yc+5,X(0),Yc+30,COL.red,4); textAt(ctx,'+',X(0),Yc-36,{align:'center',size:18,weight:800,color:COL.red});
    const hy=430; rrect(ctx,XC+10,hy-26,150,40,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
    textAt(ctx,'high voltage '+fmt(sV.x,1)+' kV',XC+85,hy,{align:'center',size:12,weight:700,color:COL.yellow});
    line(ctx,XC,Yc+24,XC,hy-44,COL.blue,2); line(ctx,XC,hy-44,XC+30,hy-44,COL.blue,2); line(ctx,XC+30,hy-44,XC+30,hy-26,COL.blue,2); line(ctx,X(0),Yc+30,X(0),hy-26,COL.red,2);
    // plates
    const topPos=sE.x>=0, pc=a=>Math.abs(sE.x)<3?COL.mid:(a?COL.red:COL.blue);
    line(ctx,X(XP0),Y(DG/2),X(XP1),Y(DG/2),pc(topPos),5); line(ctx,X(XP0),Y(-DG/2),X(XP1),Y(-DG/2),pc(!topPos),5);

    line(ctx,X((XP0+XP1)/2),Y(DG/2),X((XP0+XP1)/2),Y(RT+1.4),COL.mid,1.4); line(ctx,X((XP0+XP1)/2),Y(-DG/2),X((XP0+XP1)/2),Y(-RT-1.4),COL.mid,1.4);

    // fluorescent screen with a cm scale
    line(ctx,X(XS),Y(RT+0.8),X(XS),Y(-RT-0.8),COL.green,4);
    for(let c=-3;c<=3;c++){ line(ctx,X(XS)+4,Y(c),X(XS)+(c?10:14),Y(c),COL.muted,1.2); if(c%1===0) textAt(ctx,(c>0?'+':'')+c,X(XS)+16,Y(c)+4,{size:10,color:COL.muted}); }
    textAt(ctx,'screen (cm)',X(XS)+20,Y(-RT-1.1)+18,{align:'right',size:11.5,weight:700,color:COL.green});
    // the beam
    if(beamI>0.02){ ctx.save(); ctx.globalAlpha=beamI*0.35; ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.beginPath();
      ctx.moveTo(XC+6,Yc); P.pts.forEach(q=>ctx.lineTo(X(q[0]),Y(q[1]))); ctx.stroke(); ctx.restore();
      const seg=[[XC+6,Yc],...P.pts.map(q=>[X(q[0]),Y(q[1])])], L=[0]; for(let i=1;i<seg.length;i++) L.push(L[i-1]+Math.hypot(seg[i][0]-seg[i-1][0],seg[i][1]-seg[i-1][1]));

}

/* =====================================================================
   8.2.1 THOMSON'S ATOM (Pause and Ponder 1) — a clay sphere of uniform
   positive charge Q with electron beads inside. Inside a uniform sphere
   the pull on a bead grows with distance (F = kQe·r/R³), outside it is
   kQe/r²; beads repel each other (ke²/r²). The pudding is sticky
   (damping), so beads settle into rings — 2 in a line, 3 a triangle,
   5 a pentagon, 6 = 5 + 1 in the middle. Extra beads (n > Q) are pushed
   out. A charged pith ball on a thread tests the whole atom's charge.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Positive charge in the clay <span class="val" id="qV"></span></label><input type="range" id="qR" min="0" max="10" step="0.5" value="5"></div>
    <div class="control-group"><label>Electron beads <span class="val" id="nV"></span></label><div class="toggle-group"><button class="toggle-btn play" id="add">＋ Add bead</button><button class="toggle-btn" id="sub">− Remove</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="shake">Shake the atom</button></div></div>
    <div class="control-group"><label>Picture it as</label><div class="toggle-group" id="vw"><button class="toggle-btn active" data-k="0">Plum pudding</button><button class="toggle-btn" data-k="1">Watermelon</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Positive',COL.red)}${card('r2','Negative',COL.blue)}${card('r3','Net charge',COL.ink)}${card('r4','Neutral atom?',COL.green)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const CX=300, CY=255, R=150, K=5*R*R*R, BOWL=[90,455];
  let els=[], t=0, view=0, lost=[]; const qS=spr(5);
  const pith={th:0,om:0};
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function addBead(){ if(els.length>=12) return; els.push({x:BOWL[0]+(Math.random()-0.5)*20,y:BOWL[1]-10,vx:260+Math.random()*60,vy:-420-Math.random()*60}); }
  for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+0.3; els.push({x:CX+Math.cos(a)*R*0.9,y:CY+Math.sin(a)*R*0.9,vx:0,vy:0}); }
  $('#add').onclick=addBead;
  $('#sub').onclick=()=>{ if(!els.length) return; const e=els.pop(); lost.push({x:e.x,y:e.y,vx:(BOWL[0]-e.x)*1.4,vy:(BOWL[1]-e.y)*1.4-200,a:1,back:true}); };
  $('#shake').onclick=()=>{ els.forEach(e=>{ e.vx+=(Math.random()-0.5)*700; e.vy+=(Math.random()-0.5)*700; }); };
  toggleWire([...wrap.querySelectorAll('#vw .toggle-btn')],b=>{ view=+b.dataset.k; });
  function force(x,y,Q,skip){ // force per unit charge on an electron at (x,y) from the sphere and the other beads
    let dx=x-CX, dy=y-CY, r=Math.hypot(dx,dy)+1e-6, fx=0, fy=0;
    const g=r<R?K*Q*r/(R*R*R):K*Q/(r*r); fx-=g*dx/r; fy-=g*dy/r;
    els.forEach(o=>{ if(o===skip) return; const ex=x-o.x, ey=y-o.y, d2=ex*ex+ey*ey+64, d=Math.sqrt(d2); fx+=K*ex/(d2*d); fy+=K*ey/(d2*d); });
    return [fx,fy]; }
  animLoop(dt=>{
    t+=dt; springTo(qS,+$('#qR').value,30,9,dt); const Q=qS.x;
    const N=12, h=dt/N;
    for(let s=0;s<N;s++){ els.forEach(e=>{ const f=force(e.x,e.y,Q,e), inside=Math.hypot(e.x-CX,e.y-CY)<R, c=inside?3.2:0.25;
        e.vx+=(f[0]-c*e.vx)*h; e.vy+=(f[1]-c*e.vy)*h; });
      els.forEach(e=>{ e.x+=e.vx*h; e.y+=e.vy*h; }); }
    // beads pushed far out are lost
    els=els.filter(e=>{ const far=Math.hypot(e.x-CX,e.y-CY)>2.6*R||e.x<-40||e.y<-40||e.y>540; if(far) lost.push({x:e.x,y:e.y,vx:e.vx,vy:e.vy,a:1}); return !far; });
    lost.forEach(l=>{ l.x+=l.vx*dt; l.y+=l.vy*dt; l.a-=dt*(l.back?1.2:0.6); }); lost=lost.filter(l=>l.a>0);
    const n=els.length, net=Q-n;
    // pith ball (charged −) on a 250-unit thread, pivot at (640,40)
    const PX=640, PY=40, PL=250, bx=PX+Math.sin(pith.th)*PL, by=PY+Math.cos(pith.th)*PL;
    let fx=0; { const dx=bx-CX, dy=by-CY, r=Math.hypot(dx,dy); fx=-(K*2)*(Q-els.length)*dx/(r*r*r); } // seen from outside, the whole atom acts like its net charge at the centre
    pith.om+=(-(9.8/2.5)*Math.sin(pith.th)+fx*Math.cos(pith.th)/PL*0.9-1.1*pith.om)*dt; pith.th+=pith.om*dt; pith.th=clamp(pith.th,-0.9,0.9);
    setv($,'qV','+'+fmt(+$('#qR').value,1)); setv($,'nV',n+'');
    setv($,'r1','+'+fmt(Q,1)); setv($,'r2','−'+n); setv($,'r3',(Math.abs(net)<0.05?'0':(net>0?'+':'−')+fmt(Math.abs(net),1)));
    setv($,'r4',Math.abs(net)<0.05?'Yes':'No'); setc($,'r4',Math.abs(net)<0.05?COL.green:COL.red);
    if(Math.abs(net)<0.05) setFb('ok','Charges balance: the atom is neutral and the charged pith ball hangs straight.');
    else if(net>0) setFb('warn','More positive than negative: a positive ion — it pulls the pith ball (−) towards it.');
    else setFb('bad',Q<0.5?'No positive charge: nothing holds the beads — they push each other away.':'More negative than positive: a negative ion — it pushes the pith ball (−) away.');

    // ---- draw ----
    const {ctx,w,h:H}=fitCanvas(canvas); ctx.clearRect(0,0,w,H); ctx.save(); stage(ctx,w,H);
    const glowA=clamp(Q/10,0.08,1);
    if(view===0){ ctx.save(); ctx.globalAlpha=0.10+0.18*glowA; ctx.fillStyle=COL.red; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill(); ctx.restore();
      circ(ctx,CX,CY,R,COL.red,null,3);
      const r2=rng(7); for(let i=0;i<Math.round(Q*6);i++){ const a=r2()*Math.PI*2, rr=Math.sqrt(r2())*(R-14); const x=CX+Math.cos(a)*rr, y=CY+Math.sin(a)*rr; line(ctx,x-4,y,x+4,y,rgba(COL.red,0.55),1.6); line(ctx,x,y-4,x,y+4,rgba(COL.red,0.55),1.6); }
      textAt(ctx,'positive sphere',CX,CY-R-14,{align:'center',size:13,weight:800,color:COL.red}); }
    else { ctx.save(); ctx.fillStyle=rgba(COL.red,0.12+0.2*glowA); ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill(); ctx.restore();
      circ(ctx,CX,CY,R+4,COL.red,null,2); circ(ctx,CX,CY,R+13,COL.green,null,6); circ(ctx,CX,CY,R+20,COL.green,null,2);

    for(let i=0;i<5;i++) eDraw(ctx,BOWL[0]-24+i*12,BOWL[1]+2-Math.abs(i-2)*3,6);
    textAt(ctx,'bead bowl',BOWL[0],BOWL[1]+26,{align:'center',size:12,weight:700,color:COL.muted});
    // pith ball
    const bx2=PX+Math.sin(pith.th)*PL, by2=PY+Math.cos(pith.th)*PL;
    line(ctx,PX-40,PY,PX+40,PY,COL.ink,3); line(ctx,PX,PY,bx2,by2,COL.muted,1.5); eDraw(ctx,bx2,by2,12);
    line(ctx,PX,PY,PX,PY+PL+30,COL.mid,1,[4,5]);
    textAt(ctx,'charged pith ball (−)',PX,PY+PL+50,{align:'center',size:12.5,weight:700,color:COL.blue});
    const deg=pith.th*180/Math.PI; if(Math.abs(deg)>0.8){ fArrow(ctx,bx2+Math.sign(deg)*16,by2,Math.sign(deg)*40,0,net>0?COL.red:COL.blue,'',{w:3}); textAt(ctx,deg<0?'pulled in':'pushed away',bx2,by2-22,{align:'center',size:12.5,weight:800,color:net>0?COL.red:COL.blue}); }
    tag(ctx,'net '+(Math.abs(net)<0.05?'0':(net>0?'+':'−')+fmt(Math.abs(net),1)),CX,CY+R+34,Math.abs(net)<0.05?COL.green:(net>0?COL.red:COL.blue),{size:14});

}

/* =====================================================================
   8.2.2 GOLD FOIL EXPERIMENT (Fig. 8.4) — 5 MeV α-particles on gold
   (Z = 79). Rutherford's atom: a point nucleus; closest head-on approach
   d = 2·79·1.44 MeV·fm / 5 MeV = 45.5 fm. Single hard scatter:
   P(angle > θ) = n·t·π(d/2)²·cot²(θ/2), n = 5.9 × 10²⁸ atoms/m³ → for a
   0.4 µm foil about 1 α in 26 000 bounces back (> 90°). Thomson's atom:
   the charge is spread over the whole 0.29 nm atom, so each atom tilts
   an α by < 0.02° and the foil spreads the beam by only ~0.2°.
   The lens integrates real Coulomb paths (nuclei drawn thousands of times too big).
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Atom inside the foil</label><div class="toggle-group" id="md"><button class="toggle-btn active" data-k="R">Real (nucleus)</button><button class="toggle-btn" data-k="T">Thomson's pudding</button></div></div>
    <div class="control-group"><label>Gold foil thickness <span class="val" id="tV"></span></label><input type="range" id="tR" min="0.2" max="4" step="0.1" value="0.4"></div>
    <div class="control-group"><label>Particles fired</label><div class="toggle-group" id="pt"><button class="toggle-btn active" data-k="1">α (+2)</button><button class="toggle-btn" data-k="-1">Negative (−2)</button></div></div>
    <div class="control-group"><label>Firing rate</label><div class="toggle-group" id="rt"><button class="toggle-btn small active" data-k="1">×1</button><button class="toggle-btn small" data-k="100">×100</button><button class="toggle-btn small" data-k="10000">×10 000</button><button class="toggle-btn small" id="rst">↺ counts</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','α fired',COL.red)}${card('r2','Almost straight (< 3°)',COL.green)}${card('r3','Deflected',COL.yellow)}${card('r4','Bounced back',COL.red)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  let model='R', sign=1, mult=1, t=0, spawnT=0, drawn=[], flashes=[], cnt=[0,0,0,0,0], fired=0, acc=0;
  const tS=spr(0.4);
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  toggleWire([...wrap.querySelectorAll('#md .toggle-btn')],b=>{ model=b.dataset.k; reset(); lensP=[]; });
  toggleWire([...wrap.querySelectorAll('#pt .toggle-btn')],b=>{ sign=+b.dataset.k; lensP=[]; });
  const rb=[...wrap.querySelectorAll('#rt .toggle-btn[data-k]')]; rb.forEach(b=>b.onclick=()=>{ rb.forEach(x=>x.classList.remove('active')); b.classList.add('active'); mult=+b.dataset.k; });
  $('#rst').onclick=reset;
  function reset(){ cnt=[0,0,0,0,0]; fired=0; flashes=[]; }
  const D2=180/Math.PI;
  function sample(tum){ // deflection angle (rad) for one α through a foil of tum µm
    if(model==='T') return Math.abs(gauss()*0.25/D2*Math.sqrt(tum/0.4));
    const A=5.9e28*tum*1e-6*Math.PI*Math.pow(45.5e-15,2)/4, u=Math.random()+1e-12;
    const th=2*Math.atan(Math.sqrt(A/u)); return Math.min(Math.PI,Math.abs(th+gauss()*0.6/D2*Math.sqrt(tum/0.4))); }
  function bin(th){ const d=th*D2; return d<3?0:d<10?1:d<30?2:d<90?3:4; }
  // macro geometry
  const SX=70, SY=250, FX=300, RING=150;
  // lens: nuclei lattice
  const LX=615, LY=210, LR=150; let lensP=[], lensSpawn=0;
  function lensNuclei(tum){ const cols=clamp(Math.round(1+tum*1.1),2,5), out=[]; for(let c=0;c<cols;c++) for(let r=-3;r<=3;r++){ const x=LX-((cols-1)*62)/2+c*62, y=LY+r*56+(c%2?28:0); if(Math.hypot(x-LX,y-LY)<LR-18) out.push([x,y]); } return out; }
  animLoop(dt=>{
    t+=dt; springTo(tS,+$('#tR').value,40,11,dt); const tum=+$('#tR').value;
    setv($,'tV',fmt(tum,1)+' µm ('+Math.round(tum*1e-6/2.9e-10).toLocaleString()+' atoms)');
    // statistics: rate 14 α/s × multiplier
    acc+=14*mult*dt; let k=Math.floor(acc); acc-=k;
    const vis=mult===1?k:(Math.random()<14*dt?1:0); // about 14 drawn per second whatever the rate
    for(let i=0;i<k;i++){ const th=sample(tum); const b=bin(th); cnt[b]++; fired++;
      const side=Math.random()<0.5?1:-1;
      if(i<vis) drawn.push({x:SX+30,y:SY+(Math.random()-0.5)*6,th:th*side,ph:0});
      else if(th>5/D2&&flashes.length<120) flashes.push({a:th*side,life:1}); }
    drawn.forEach(p=>{ const v=330; if(p.ph===0){ p.x+=v*dt; if(p.x>=FX){ p.ph=1; p.r=0; p.y0=p.y; } } else { p.r+=v*dt; if(p.r>=RING){ p.done=true; flashes.push({a:p.th,life:1}); } } });
    drawn=drawn.filter(p=>!p.done); flashes.forEach(f=>f.life-=dt*0.7); flashes=flashes.filter(f=>f.life>0);
    // lens paths: Coulomb with closest head-on approach d = 7 units
    lensSpawn+=dt; const nuc=lensNuclei(tum);
    if(lensSpawn>0.22){ lensSpawn=0; lensP.push({x:LX-LR-4,y:LY+(Math.random()-0.5)*LR*1.7,vx:190,vy:0,tr:[],age:0}); }
    const V2=190*190, C=V2*7/2*sign;
    lensP.forEach(p=>{ const n=16, h=dt/n; for(let s=0;s<n;s++){ let ax=0, ay=0;
        nuc.forEach(q=>{ const dx=p.x-q[0], dy=p.y-q[1], r2=dx*dx+dy*dy;
          if(model==='R'){ const rr=Math.max(r2,sign>0?1:36), r=Math.sqrt(rr); ax+=C*dx/(rr*r); ay+=C*dy/(rr*r); }
          else { const Rt=30, r=Math.sqrt(r2)+1e-6; if(r<Rt){ const g=C*0.004*r/(Rt*Rt*Rt)*(1-r/Rt); ax+=g*dx/r; ay+=g*dy/r; } } });
        p.vx+=ax*h; p.vy+=ay*h; p.x+=p.vx*h; p.y+=p.vy*h; }
      p.age+=dt; p.tr.push([p.x,p.y]); if(p.tr.length>90) p.tr.shift(); });
    lensP=lensP.filter(p=>Math.hypot(p.x-LX,p.y-LY)<LR+60&&p.age<6);
    setv($,'r1',fired.toLocaleString()); setv($,'r2',fired?fmt(100*cnt[0]/fired,fired>1000?3:1)+' %':'—');
    setv($,'r3',(cnt[1]+cnt[2]+cnt[3]).toLocaleString()); setv($,'r4',cnt[4]?cnt[4]+' (1 in '+Math.round(fired/cnt[4]).toLocaleString()+')':'0');
    if(fired>2e5&&model==='T') setFb('warn','Thomson\'s pudding: every α goes almost straight — it can never bounce back.');
    else if(cnt[4]>0) setFb('ok',`<b>${cnt[4]}</b> α bounced back! Only a tiny, heavy, positive nucleus can do that. ${sign<0?'Negative particles are pulled round the nucleus instead — yet they scatter by the same angles.':''}`);
    else if(fired>0) setFb('warn','Most α go straight through: the atom is mostly empty. Raise the firing rate and wait for a rare big bounce.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    // detector ring (zinc sulphide screen) and angle marks
    circ(ctx,FX,SY,RING,COL.green,null,3); ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(FX-RING-8,SY-12,26,24); ctx.restore();
    [30,60,90,120,150].forEach(a=>[1,-1].forEach(sd=>{ const r=a/D2*sd; line(ctx,FX+Math.cos(r)*(RING-6),SY+Math.sin(r)*(RING-6),FX+Math.cos(r)*(RING+6),SY+Math.sin(r)*(RING+6),COL.green,1.5);
      if(sd>0) textAt(ctx,a+'°',FX+Math.cos(r)*(RING+22),SY+Math.sin(r)*(RING+22)+4,{align:'center',size:10.5,color:COL.muted,weight:600}); }));
    textAt(ctx,'detector screen',FX,SY-RING-12,{align:'center',size:12,weight:700,color:COL.green});
    // source in a lead box
    rrect(ctx,SX-40,SY-30,70,60,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); line(ctx,SX+30,SY-30,SX+30,SY-5,COL.ink,6); line(ctx,SX+30,SY+5,SX+30,SY+30,COL.ink,6);
    circ(ctx,SX-8,SY,9,COL.red,rgba(COL.red,0.25),2); textAt(ctx,'α source',SX-5,SY+48,{align:'center',size:12,weight:700,color:COL.red});
    line(ctx,SX+32,SY,FX,SY,rgba(COL.red,0.18),6);
    // foil (thickness drawn ∝ t)
    const fw=2+tS.x*2.5; ctx.save(); ctx.fillStyle='#f6e7b0'; ctx.fillRect(FX-fw/2,SY-60,fw,120); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.5; ctx.strokeRect(FX-fw/2,SY-60,fw,120); ctx.restore();
    textAt(ctx,'gold foil',FX,SY+80,{align:'center',size:12,weight:700,color:COL.yellow});
    // flying α
    drawn.forEach(p=>{ let x,y; if(p.ph===0){ x=p.x; y=p.y; } else { x=FX+Math.cos(p.th)*p.r; y=p.y0+Math.sin(p.th)*p.r; } alphaDraw(ctx,x,y,7,sign<0); });
    flashes.forEach(f=>{ const x=FX+Math.cos(f.a)*RING, y=SY+Math.sin(f.a)*RING; glow(ctx,x,y,16,COL.green,f.life); circ(ctx,x,y,3,COL.green,COL.green,1); });
    // histogram (log scale)
    const hx=40, hy=468, bw=46, labels=['<3°','3–10°','10–30°','30–90°','>90°'];
    textAt(ctx,'hits by angle (log scale)',hx,hy-78,{size:12,weight:800,color:COL.ink});
    cnt.forEach((c,i)=>{ const hh=c?Math.min(62,9*Math.log10(c+1)):0; ctx.save(); ctx.fillStyle=i===0?rgba(COL.green,0.75):i===4?rgba(COL.red,0.8):rgba(COL.yellow,0.75); ctx.fillRect(hx+i*(bw+6),hy-hh,bw,hh); ctx.restore();
      rect(ctx,hx+i*(bw+6),hy-hh,bw,hh,COL.ink,null,1); textAt(ctx,labels[i],hx+i*(bw+6)+bw/2,hy+14,{align:'center',size:10.5,weight:700,color:COL.muted});
      textAt(ctx,c>=1e6?fmt(c/1e6,1)+'M':c>=1e4?Math.round(c/1e3)+'k':c+'',hx+i*(bw+6)+bw/2,hy-hh-4,{align:'center',size:10.5,weight:700,color:COL.ink}); });
    // magnifier lens
    line(ctx,FX+4,SY,LX-LR*0.8,LY+LR*0.55,COL.mid,1.2,[4,4]);
    ctx.save(); ctx.beginPath(); ctx.arc(LX,LY,LR,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
    if(model==='T') nuc.forEach(q=>{ ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle=COL.red; ctx.beginPath(); ctx.arc(q[0],q[1],30,0,Math.PI*2); ctx.fill(); ctx.restore(); circ(ctx,q[0],q[1],30,rgba(COL.red,0.5),null,1.2);
      for(let e=0;e<5;e++){ const a=e*1.26+q[0]*0.1; eDraw(ctx,q[0]+Math.cos(a)*16,q[1]+Math.sin(a)*16,2.6); } });
    else nuc.forEach(q=>{ circ(ctx,q[0],q[1],27,rgba(COL.mid,0.35),null,1); ctx.save(); ctx.setLineDash([2,4]); circ(ctx,q[0],q[1],27,rgba(COL.blue,0.4),null,1); ctx.restore(); pDraw(ctx,q[0],q[1],4.5);
      const a=t*3+q[1]*0.07; eDraw(ctx,q[0]+Math.cos(a)*27,q[1]+Math.sin(a)*27,2.4); });
    lensP.forEach(p=>{ ctx.save(); ctx.strokeStyle=sign>0?COL.red:COL.blue; ctx.lineWidth=2; ctx.globalAlpha=0.55; ctx.beginPath(); p.tr.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke(); ctx.restore();
      if(sign>0) pDraw(ctx,p.x,p.y,4.5); else eDraw(ctx,p.x,p.y,4.5); });
    ctx.restore(); circ(ctx,LX,LY,LR,COL.ink,null,3);
    textAt(ctx,model==='R'?'inside the foil — nuclei drawn thousands of times too big':'inside the foil — Thomson\'s puddings',LX,LY+LR+22,{align:'center',size:11.5,weight:700,color:COL.muted});
    if(mult>1) tag(ctx,'×'+mult.toLocaleString()+' — only a few drawn',LX,LY+LR+50,COL.mid,{size:11.5});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   8.2.2 Eg — HOW EMPTY IS AN ATOM? (worked example + cricket ground)
   A continuous zoom into a sheet of paper, drawn to true scale at every
   step: view width 1 mm → 10⁻¹⁴ m (zoom eased in log-space). Atoms are
   10⁻¹⁰ m across, so a 0.1 mm sheet is 10⁻⁴ ÷ 10⁻¹⁰ = 10⁶ atoms thick.
   The nucleus (≈ 10⁻¹⁵ m) only becomes a visible dot when the atom is
   already far bigger than the screen — 10⁵ times smaller, like a pepper
   grain in the middle of a 100 m cricket ground.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Zoom — width of view <span class="val" id="zV"></span></label><input type="range" id="zR" min="-14.3" max="-2.7" step="0.05" value="-2.7" style="direction:rtl"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="dive">▶ Dive to the nucleus</button><button class="toggle-btn" id="out">Back out</button></div></div>
    <div class="control-group"><label>Paper thickness <span class="val" id="tV"></span></label><input type="range" id="tR" min="0.05" max="0.2" step="0.01" value="0.1"></div>
    <div class="control-group"><label>Compare</label><div class="toggle-group" id="cmp"><button class="toggle-btn active" data-k="0">Off</button><button class="toggle-btn" data-k="1">Cricket ground</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','You are seeing',COL.ink)}${card('r2','Atoms across the sheet',COL.green)}${card('r3','Atom ÷ nucleus',COL.red)}${card('r4','Empty space',COL.blue)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const DA=1e-10, DN=1.4e-15*2.2; // atom and carbon-nucleus diameter (m)
  let t=0, dive=0, cmp=0; const zS=spr(-2.7);
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  $('#dive').onclick=()=>{ dive=1; }; $('#out').onclick=()=>{ dive=-1; };
  toggleWire([...wrap.querySelectorAll('#cmp .toggle-btn')],b=>{ cmp=+b.dataset.k; });
  function sci(x){ const e=Math.floor(Math.log10(x)+1e-9), m=x/Math.pow(10,e); return (Math.abs(m-1)<0.05?'':fmt(m,1)+' × ')+'10'+sup(e)+' m'; }
  function sup(n){ return String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)]||(c==='-'?'⁻':c)).join(''); }
  function niceLen(W){ const L=W/4, e=Math.floor(Math.log10(L)), m=L/Math.pow(10,e); const n=m<2?1:m<5?2:5; return n*Math.pow(10,e); }
  function lenStr(L){ if(L>=1e-3) return fmt(L*1e3,0)+' mm'; if(L>=1e-6) return fmt(L*1e6,0)+' µm'; if(L>=1e-9) return fmt(L*1e9,0)+' nm'; if(L>=1e-12) return fmt(L*1e12,0)+' pm'; return fmt(L*1e15,0)+' fm'; }
  animLoop(dt=>{
    t+=dt; const zr=$('#zR');
    if(dive){ let v=+zr.value-dive*dt*1.35; if(v<=-14.3||v>=-2.7){ v=clamp(v,-14.3,-2.7); dive=0; } zr.value=v; }
    springTo(zS,+zr.value,18,8.5,dt); const lw=zS.x, W=Math.pow(10,lw), th=+$('#tR').value*1e-3;
    setv($,'zV',lenStr(W)); setv($,'tV',fmt(th*1e3,2)+' mm'); setBtn($('#dive'),dive===1?'Diving…':'▶ Dive to the nucleus',dive===1?'':'play');
    const N=Math.round(th/DA);
    const what=W>2e-4?'the paper edge':W>3e-8?'fibres of the sheet':W>4e-10?'rows of atoms':W>2e-12?'one atom — mostly empty':'the nucleus';
    setv($,'r1',what); setv($,'r2',N.toLocaleString('en-IN')); setv($,'r3','≈ 10⁵ ×'); setv($,'r4','99.9999999999 %');
    setFb(W>4e-10?'warn':'ok',W>4e-10?`0.1 mm ÷ 10⁻¹⁰ m ≈ <b>${N.toLocaleString('en-IN')}</b> atoms stacked across this sheet.`:W>2e-12?'Inside one atom: electrons whizz round, and the nucleus is still far too small to see.':'Here is the nucleus — about 10⁵ times smaller than the atom.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    const s=800/W, cx=400, cy=235, X=x=>cx+x*s, Y=y=>cy-y*s;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,800,440); ctx.clip();
    // paper sheet band

/* =====================================================================
   8.2.2 B — WHY RUTHERFORD'S ATOM SHOULD COLLAPSE (Fig. 8.6)
   A classical electron circling a proton radiates (Larmor). Its orbit
   shrinks as r³ = r₀³ − 4·r_e²·c·t (r_e = 2.82 fm), so from 0.053 nm it
   spirals into the nucleus in 1.6 × 10⁻¹¹ s, turning ever faster
   (ω ∝ r^−3/2) and pouring out light while E = −13.6 eV·(r₀/r) plunges.
   Bohr's postulate: in a stationary state nothing is radiated — the orbit
   and the energy (−13.6/n² eV) stay fixed forever.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Atom model</label><div class="toggle-group" id="md"><button class="toggle-btn active" data-k="R">Rutherford</button><button class="toggle-btn" data-k="B">Bohr</button></div></div>
    <div class="control-group"><label>Starting orbit <span class="val" id="nV"></span></label><input type="range" id="nR" min="1" max="3" step="1" value="1"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="go">▶ Release the electron</button><button class="toggle-btn small active" id="sl">¼×</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Real time',COL.ink)}${card('r2','Orbit radius',COL.blue)}${card('r3','Energy',COL.green)}${card('r4','Light given out',COL.yellow)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const A0=5.29e-11, RE=2.818e-15, C=3e8;
  let model='R', n=1, r0=A0, r=A0, tr=0, ang=0, run=false, dead=false, slow=true, t=0, waves=[], trace=[], waveT=0;
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function start(){ n=+$('#nR').value; r0=A0*n*n; r=r0; tr=0; dead=false; run=true; trace=[]; waves=[]; }
  toggleWire([...wrap.querySelectorAll('#md .toggle-btn')],b=>{ model=b.dataset.k; start(); });
  $('#go').onclick=start; $('#sl').onclick=()=>{ slow=!slow; $('#sl').classList.toggle('active',slow); };
  $('#nR').oninput=()=>{ start(); };
  start();
  animLoop(dt=>{
    t+=dt; const tc=Math.pow(r0,3)/(4*RE*RE*C), span=6*(slow?4:1); // display seconds for the whole fall
    if(run&&!dead){ const dtr=dt*tc/span; if(model==='R'){ tr+=dtr; const q=Math.pow(r0,3)-4*RE*RE*C*tr; if(q<=Math.pow(1.5e-15,3)){ r=1.5e-15; dead=true; } else r=Math.cbrt(q); } else tr+=dtr; }
    // angular speed for drawing: ω_real ∝ r^−3/2, mapped so one drawn turn at 0.053 nm takes 1.2 s
    const wDraw=(2*Math.PI/1.2)*Math.pow(A0/r,1.5)*(slow?0.5:1); ang+=Math.min(wDraw,60)*dt;
    const E=-13.6*(A0/r), lightE=model==='R'?-13.6*(A0/r0)-E:0;
    if(run) { if(!trace.length||tr-trace[trace.length-1][0]>tc/240) trace.push([tr,r]); }
    // radiated waves (Rutherford only) — brightness ∝ Larmor power ∝ r^−4
    const RS=190/(9*A0), cx=240, cy=250, rpx=Math.max(1.5,r*RS*(n===1&&model==='B'?1:1)), ex=cx+Math.cos(ang)*rpx, ey=cy-Math.sin(ang)*rpx;
    waveT+=dt; if(model==='R'&&!dead&&waveT>Math.max(0.05,0.3*Math.pow(r/r0,1.5))){ waveT=0; waves.push({x:ex,y:ey,R:4,a:Math.min(1,0.35*Math.pow(r0/r,1))}); }
    waves.forEach(q=>{ q.R+=dt*170; q.a-=dt*0.55; }); waves=waves.filter(q=>q.a>0);
    setv($,'nV',['K (n = 1)','L (n = 2)','M (n = 3)'][+$('#nR').value-1]);
    setv($,'r1',tr<1e-12?fmt(tr*1e15,0)+' fs':fmt(tr*1e12,2)+' ps'); setv($,'r2',fmt(r*1e12,r<1e-12?3:1)+' pm');
    setv($,'r3',Math.abs(E)>1e5?'−∞':fmt(E,E<-100?0:1)+' eV'); setv($,'r4',model==='R'?(lightE>1e5?'all of it':fmt(lightE,lightE>100?0:1)+' eV'):'none');
    setBtn($('#go'),run&&!dead?(model==='R'?'Spiralling…':'Orbiting…'):'▶ Release the electron',run&&!dead?'':'play');
    if(model==='B') setFb('ok','Bohr: in a stationary state the electron gives out no energy — the orbit never shrinks.');
    else if(dead) setFb('bad',`Crash! The electron hit the nucleus after only <b>${fmt(tc*1e12,1)} × 10⁻¹² s</b>. If this were true, no atom could exist.`);
    else setFb('warn','Circling = accelerating, so the charge radiates light, loses energy and spirals in.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    // allowed / starting orbits
    for(let k=1;k<=3;k++){ ctx.save(); ctx.setLineDash([4,6]); circ(ctx,cx,cy,k*k*A0*RS,model==='B'&&k===n?COL.green:rgba(COL.mid,0.6),null,model==='B'&&k===n?2.2:1.2); ctx.restore();
      textAt(ctx,SHELL_NAMES[k-1],cx+k*k*A0*RS*0.707+4,cy-k*k*A0*RS*0.707-3,{size:12,weight:800,color:COL.mid}); }
    waves.forEach(q=>{ ctx.save(); ctx.globalAlpha=Math.max(0,q.a); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.2; ctx.beginPath(); for(let i=0;i<=60;i++){ const a=i/60*Math.PI*2, rr=q.R+2.5*Math.sin(a*14+q.R*0.3); ctx.lineTo(q.x+Math.cos(a)*rr,q.y+Math.sin(a)*rr); } ctx.stroke(); ctx.restore(); });
    // spiral path already travelled
    if(model==='R'&&trace.length>1){ ctx.save(); ctx.strokeStyle=rgba(COL.blue,0.35); ctx.lineWidth=1.6; ctx.beginPath(); const tn=trace.length; const K=Math.min(tn*4,900);
      for(let i=0;i<=K;i++){ const f=i/K, rr=Math.cbrt(Math.max(0,Math.pow(r0,3)-(Math.pow(r0,3)-Math.pow(r,3))*f)), a=ang-(1-f)*Math.min(18,6+tn*0.05)*Math.PI; ctx.lineTo(cx+Math.cos(a)*rr*RS,cy-Math.sin(a)*rr*RS); } ctx.stroke(); ctx.restore(); }
    // nucleus
    if(dead){ glow(ctx,cx,cy,40,COL.yellow,0.5+0.3*Math.sin(t*10)); }
    pDraw(ctx,cx,cy,9);
    if(!dead){ eDraw(ctx,ex,ey,8); const va=ang+Math.PI/2; fArrow(ctx,ex,ey,Math.cos(va)*28,-Math.sin(va)*28,COL.green,'',{w:2.5}); fArrow(ctx,ex,ey,(cx-ex)/rpx*26,(cy-ey)/rpx*26,COL.red,'',{w:2.5}); }
    textAt(ctx,dead?'electron fell in':model==='R'?'radiating':'stationary state',cx,cy+220,{align:'center',size:13,weight:800,color:dead?COL.red:model==='R'?COL.yellow:COL.green});
    // radius-vs-time graph
    const gx0=520, gy0=70, gx1=770, gy1=280; const tMax=model==='R'?Math.pow(r0,3)/(4*RE*RE*C)*1e12:Math.max(1,tr*1e12*1.2);
    graphFrame(ctx,gx0,gy0,gx1,gy1,[0,tMax],[0,r0*1e12]);
    textAt(ctx,'orbit radius (pm)',gx0,gy0-14,{size:12,weight:800,color:COL.blue}); textAt(ctx,'time (ps)',gx1,gy1+30,{align:'right',size:12,weight:700,color:COL.muted});
    textAt(ctx,fmt(r0*1e12,0),gx0-6,gy0+4,{align:'right',size:10,color:COL.muted}); textAt(ctx,fmt(tMax,1),gx1,gy1+14,{align:'center',size:10,color:COL.muted});
    if(trace.length>1){ ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.beginPath(); trace.forEach((q,i)=>{ const x=gx0+q[0]*1e12/tMax*(gx1-gx0), y=gy1-q[1]/r0*(gy1-gy0); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore(); }
    // energy ladder
    const ey0=330, ey1=470; line(ctx,gx0,ey0,gx0,ey1,COL.ink,2); textAt(ctx,'energy',gx0,ey0-8,{size:12,weight:800,color:COL.green});
    const EY=e=>ey0+clamp(-e/(13.6*2.2),0,1)*(ey1-ey0);
    for(let k=1;k<=3;k++){ const e=-13.6/(k*k); line(ctx,gx0,EY(e),gx0+120,EY(e),rgba(COL.mid,0.7),1.2,[3,3]); textAt(ctx,fmt(e,1)+' eV',gx0+126,EY(e)+4,{size:10.5,color:COL.muted}); }
    const eY=EY(E); line(ctx,gx0+10,eY,gx0+110,eY,COL.green,4); if(E<-13.6*2.2) arrowHead(ctx,gx0+60,ey1+10,Math.PI/2,COL.red,12);
    const wA0=Math.sqrt(8.99e9*QE*QE/(ME_KG*Math.pow(A0,3))), ratio=wA0*(tc/span)/((2*Math.PI/1.2)*(slow?0.5:1));
    if(!dead) tag(ctx,'1 drawn turn ≈ '+Math.round(ratio).toLocaleString('en-IN')+' real turns',cx,22,COL.mid,{size:11.5});

/* =====================================================================
   8.2.3 BOHR'S ENERGY LEVELS (Fig. 8.7) — hydrogen, Eₙ = −13.6/n² eV.
   A photon is absorbed only if its energy equals a gap Eₘ − Eₙ (±0.05 eV):
   K→L 10.20 eV (122 nm), K→M 12.09 eV, L→M 1.89 eV (656 nm, red).
   Anything above 13.6/n² eV knocks the electron out (ionisation).
   An excited electron waits (random lifetime) and drops back, giving out
   a photon of exactly the gap energy, λ = 1240/ΔE nm — the lines pile up
   in the spectrum below. Orbits drawn not to scale (real radii ∝ n²).
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Photon energy <span class="val" id="eV"></span></label><input type="range" id="eR" min="0.5" max="15" step="0.01" value="10.2">
      <div class="chip-wrap" id="pre"><button class="chip-btn" data-e="10.2">10.2</button><button class="chip-btn" data-e="12.09">12.09</button><button class="chip-btn" data-e="1.89">1.89</button><button class="chip-btn" data-e="2.55">2.55</button><button class="chip-btn" data-e="11">11.0</button><button class="chip-btn" data-e="14">14.0</button></div>
      <button class="toggle-btn navy" id="fire">Fire photon →</button></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="heat">Heat the gas</button><button class="toggle-btn" id="clr">Clear spectrum</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Electron in',COL.blue)}${card('r2','Its energy',COL.green)}${card('r3','Photon',COL.yellow)}${card('r4','Result',COL.ink)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const E=n=>-13.6/(n*n), RAD=[0,36,80,132,188], CX=250, CY=228;
  let n=1, rS=spr(RAD[1]), ang=0, t=0, ph=[], em=[], life=0, heat=false, heatT=0, free=null, rows=[], lines={}, result='—';
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function lam(dE){ return 1240/dE; }
  function logRow(a,b,dE,kind){ rows.unshift([kind,SHELL_NAMES[a-1]+' → '+SHELL_NAMES[b-1],fmt(dE,2)+' eV',fmt(lam(dE),0)+' nm']); if(rows.length>6) rows.pop();
    $('#lg').innerHTML=logTable(['','Jump','Energy','λ'],rows); }
  chipsWire(wrap,'#pre .chip-btn',b=>{ $('#eR').value=b.dataset.e; });
  $('#fire').onclick=()=>{ ph.push({x:10,y:CY,e:+$('#eR').value,st:0,a:1}); };
  $('#heat').onclick=()=>{ heat=!heat; $('#heat').classList.toggle('active',heat); };
  $('#clr').onclick=()=>{ lines={}; };
  function jumpTo(m){ n=m; life=0.9+(-Math.log(Math.random()+1e-9))*1.2; }
  animLoop(dt=>{
    t+=dt; const Eph=+$('#eR').value; setv($,'eV',fmt(Eph,2)+' eV');
    // electron: orbit radius springs to its shell
    if(!free){ springTo(rS,RAD[n],26,7,dt); ang+=dt*2.6/Math.pow(n,1.5);
      if(n>1){ life-=dt; if(life<=0){ const m=1+Math.floor(Math.random()*(n-1)); const dE=E(n)-E(m); const a=Math.random()*Math.PI*2;
          em.push({x:CX+Math.cos(ang)*rS.x,y:CY-Math.sin(ang)*rS.x,ang:a,e:dE,a:1}); lines[Math.round(lam(dE))]=(lines[Math.round(lam(dE))]||0)+1; logRow(n,m,dE,'emit'); jumpTo(m); if(m===1) life=0; } } }
    else { free.x+=free.vx*dt; free.y+=free.vy*dt; free.t+=dt; if(free.t>2.6){ // recapture: a new electron comes in and cascades down
        free=null; n=4; rS.x=260; rS.v=0; jumpTo(4); } }
    if(heat&&!free){ heatT+=dt; if(heatT>1.1&&n===1){ heatT=0; const m=2+Math.floor(Math.random()*3); jumpTo(m); } }
    // photons from the lamp
    ph.forEach(p=>{ if(p.st===0){ p.x+=300*dt; const rr=free?0:rS.x; if(p.x>=CX-rr-4){
          if(free){ p.st=2; result='passed through'; }
          else { const ion=-E(n); let m=0; for(let k=n+1;k<=4;k++) if(Math.abs(p.e-(E(k)-E(n)))<0.05) m=k;
            if(p.e>=ion-0.005){ p.st=1; free={x:CX+Math.cos(ang)*rS.x,y:CY-Math.sin(ang)*rS.x,vx:220*Math.sqrt(p.e-ion+0.3),vy:-120,t:0}; result='ionised!'; logRow(n,n,p.e,'out');
              setFb('warn',`${fmt(p.e,2)} eV ≥ ${fmt(ion,2)} eV: the electron is knocked right out of the atom.`); }
            else if(m){ p.st=1; logRow(n,m,E(m)-E(n),'absorb'); result='absorbed'; setFb('ok',`Exactly ${fmt(E(m)-E(n),2)} eV = E(${SHELL_NAMES[m-1]}) − E(${SHELL_NAMES[n-1]}): absorbed, the electron jumps up.`); jumpTo(m); }
            else { p.st=2; result='passed through'; setFb('bad',`${fmt(p.e,2)} eV matches no gap — the atom ignores it.`); } } } }
      else if(p.st===2){ p.x+=300*dt; p.a-=dt*0.4; } else p.a-=dt*4; });
    ph=ph.filter(p=>p.a>0&&p.x<820);
    em.forEach(q=>{ q.x+=Math.cos(q.ang)*260*dt; q.y+=Math.sin(q.ang)*260*dt; q.a-=dt*0.45; }); em=em.filter(q=>q.a>0);
    setv($,'r1',free?'free (ionised)':SHELL_NAMES[n-1]+' (n = '+n+')'); setv($,'r2',free?'0 eV':fmt(E(n),2)+' eV');
    setv($,'r3',fmt(lam(Eph),0)+' nm'+(lam(Eph)<380?' UV':lam(Eph)>750?' IR':'')); setv($,'r4',result);
    if(!rows.length) setFb('warn','Pick a photon energy and fire it at the hydrogen atom.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    shRings(ctx,CX,CY,RAD.slice(1),4,{labels:true,alpha:0.8,hl:[n===1&&!free?COL.green:0,n===2&&!free?COL.green:0,n===3&&!free?COL.green:0,n===4&&!free?COL.green:0]});
    pDraw(ctx,CX,CY,9);
    if(!free) eDraw(ctx,CX+Math.cos(ang)*rS.x,CY-Math.sin(ang)*rS.x,8); else eDraw(ctx,free.x,free.y,8);

    ph.forEach(p=>photonDraw(ctx,p.x,p.y,0,46,specCol(lam(p.e)),t*30,p.a));
    em.forEach(q=>photonDraw(ctx,q.x,q.y,q.ang,40,specCol(lam(q.e)),t*30,q.a));
    // energy ladder
    const lx=560, lx1=700, EY=e=>50+(-e/13.6)*350;
    line(ctx,lx-10,EY(0)-12,lx-10,EY(-13.6)+8,COL.ink,2); arrowHead(ctx,lx-10,EY(0)-16,-Math.PI/2,COL.ink,8); textAt(ctx,'energy',lx-14,EY(0)-22,{size:12,weight:800,color:COL.ink});
    line(ctx,lx,EY(0),lx1,EY(0),COL.mid,1.4,[5,4]); textAt(ctx,'0 eV (free)',lx1+6,EY(0)+4,{size:11,weight:700,color:COL.muted});
    for(let k=1;k<=4;k++){ const y=EY(E(k)); line(ctx,lx,y,lx1,y,k===n&&!free?COL.green:COL.ink,k===n&&!free?4:2);
      textAt(ctx,SHELL_NAMES[k-1]+'  '+fmt(E(k),2)+' eV',lx1+6,y+(k===4?10:4),{size:11,weight:700,color:k===n&&!free?COL.green:COL.muted}); }
    if(!free){ const y=EY(E(n)); eDraw(ctx,lx+40+Math.sin(t*2)*6,y-8,6); }
    // photon energy compared on the ladder
    const yb=EY(free?0:E(n)), yt=EY((free?0:E(n))+Eph); line(ctx,lx+100,yb,lx+100,Math.max(20,yt),specCol(lam(Eph)),3); arrowHead(ctx,lx+100,Math.max(20,yt),-Math.PI/2,specCol(lam(Eph)),9);
    textAt(ctx,'photon',lx+104,Math.max(34,yt)+12,{size:11,weight:700,color:COL.yellow});
    // spectrum strip 90–700 nm
    const sx0=40, sx1=760, sy=458, X=l=>sx0+(l-90)/(700-90)*(sx1-sx0);
    ctx.save(); for(let l=380;l<=700;l+=4){ ctx.fillStyle=specCol(l); ctx.globalAlpha=0.16; ctx.fillRect(X(l),sy-16,X(l+4)-X(l)+0.5,26); } ctx.restore();
