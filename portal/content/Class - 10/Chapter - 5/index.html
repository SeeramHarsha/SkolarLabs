<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 · Chapter 5 — Life Processes | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand-badge">🌿</div>
    <div>
      <div class="chip">Grade 10 · Ch 5</div>

    </div>

      <span><i style="background:var(--f-red)"></i>CO₂ · blood · heat</span>
      <span><i style="background:var(--f-blue)"></i>Water · starch + iodine</span>

  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">2.1</div>

        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 5: LIFE PROCESSES
   (NCERT Science, jesc105) — Activities 5.1 – 5.8.
   Every scene runs a continuous animation loop: controls only set targets.
   Leaves, gases, enzymes, yeast, fish and blood follow real rate laws
   and physical data, compressed in time only where needed to watch.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

/* ---------------------------------------------------------------------
   0j. GRADE-10 CHAPTER-5 KIT — a variegated leaf whose every patch keeps

const IOD_BLUE='#1d2b5e', IOD_BROWN='#c98f2a', LEAF_CREAM='#f5f0d6', LEAF_GREEN='#3f9a5a';

/* world point of leaf coords: base (x,y), length L, angle ang, droop bends the midrib */
function vlPt(u,v,x,y,L,ang,droop){ const lx=u*L, ly=v*vlHalfW(u)*L*0.40+droop*L*u*u*0.55; const c=Math.cos(ang), s=Math.sin(ang); return [x+lx*c-ly*s, y+lx*s+ly*c]; }

function vlOutline(ctx,x,y,L,ang,droop){ ctx.beginPath(); for(let k=0;k<=40;k++){ const p=vlPt(k/40,1,x,y,L,ang,droop); k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }

let _vlC=null;

/* ---- LIME WATER ----
   10 mL of saturated Ca(OH)₂ (1.6 g/L) holds 0.216 mmol Ca²⁺. A CO₂ bubble rising through ≈5 cm
   gives up only ≈ 5 % of its CO₂. Milkiness ∝ suspended CaCO₃; clearly milky at ≈ 0.03 mmol.
   Excess CO₂ turns CaCO₃ into soluble Ca(HCO₃)₂, so the milkiness clears again. */
const LIME={ca:0.216, eff:0.05, seen:0.03};
function limeNew(){ return {caco3:0, hco3:0, oh:LIME.ca, abs:0, tMilky:null}; }

function limeAdd(Lm,n){ let a=n*LIME.eff; Lm.abs+=a; const take=Math.min(a,Lm.oh); Lm.oh-=take; Lm.caco3+=take; a-=take;
  if(a>0&&Lm.caco3>0){ const d=Math.min(a*0.35,Lm.caco3); Lm.caco3-=d; Lm.hco3+=d; } return n*LIME.eff; }

/* =====================================================================
   5.1 CHLOROPHYLL IS ESSENTIAL FOR PHOTOSYNTHESIS (variegated leaf)
   Every patch of the leaf carries its own chlorophyll (green core, cream
   rim and streaks) and its own starch.
   Dark room: starch is used up, S' = −S/17 h  → 3 days leave ≈ 1.5 %.
   Sunlight:  S' = 0.42 h⁻¹ · chl · (1 − S)    → 6 h give ≈ 92 % in the
   green patches, nothing where there is no chlorophyll.
   Boiling kills the cells (leaf goes limp); hot alcohol then pulls the
   chlorophyll out, k = 0.55 s⁻¹·e^{0.06(T−78)} (compressed), turning the
   alcohol green. Iodine: blue-black where starch is, brown elsewhere;
   rinsing removes the loose brown. Time is compressed (≈ 8 h per second
   in the dark room, 1 h per second in the sun, 1 min per second on the
   bench).
   ===================================================================== */
function buildA1(){

  let t=0, sunH=6, skipDark=false; const S={};
  const reset=()=>{ Object.assign(S,{p:0, run:false, pt:0, done:PH.map(()=>false), hr:0, hist:[], L:vlNew(), Tw:25, Tb:25, Ta:25, bub:[], pl:spr(230), plucked:false, sunT:0, tr:0, ov:spr(370), overlay:false, gas:[], sq:0, simMin:0});
    for(let k=0;k<S.L.chl.length;k++) S.L.starch[k]=S.L.chl[k]>0.5?0.85:0.08; S.hist.push([0,0.85,0.08]); };
  const P={x:spr(0),y:spr(0),L:spr(70),a:spr(0)};
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Steps</label><div class="step-row" id="steps" style="flex-wrap:wrap;gap:4px"></div>
      <div class="toggle-group"><button class="toggle-btn play" id="go"></button></div></div>
    <div class="control-group"><label>Hours in sunlight <span class="val" id="hv">6 h</span></label><input type="range" id="hrs" min="1" max="8" step="1" value="6"></div>
    <div class="control-group"><label>Before the sunlight</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="dk">Dark room 3 days</button><button class="toggle-btn" id="sk">Skip it</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="ovb">Lay tracing over the leaf</button><button class="toggle-btn" id="rs">↺ New plant</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Starch · green part',COL.green)}${card('r2','Starch · white part',COL.mid)}${card('r3','Chlorophyll in leaf',COL.green)}${card('r4','Clock',COL.yellow)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const pills=()=>stepPills($('#steps'),PH,S.p,S.done,()=>{});
  const label=()=>{ const b=$('#go'); if(S.p>=PH.length){ setBtn(b,'✓ All steps done','active'); return; } setBtn(b,S.run?'… '+PH[S.p]:GO[S.p],S.run?'active':'play'); };
  pills(); label();
  $('#go').onclick=()=>{ if(S.run||S.p>=PH.length) return; if(S.p===0&&skipDark){ S.done[0]=true; S.p=1; }

  $('#hrs').oninput=e=>{ sunH=+e.target.value; setv($,'hv',sunH+' h'); };
  toggleWire([$('#dk'),$('#sk')],b=>{ skipDark=b.id==='sk'; });

  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; pills(); label(); setBtn($('#ovb'),'Lay tracing over the leaf',''); };
  const snap=(x,y,L,a)=>{ P.x.x=x; P.y.x=y; P.L.x=L; P.a.x=a; [P.x,P.y,P.L,P.a].forEach(q=>q.v=0); };

    t+=dt; const L=S.L, n=L.chl.length;

      else if(S.p===2){ if(pt>1.2&&!S.plucked){ S.plucked=true; } if(pt>2.6) S.tr=clamp((pt-2.6)/5,0,1); if(pt>8) finish(); }
      else if(S.p===3){ S.simMin=pt; S.Tw=Math.min(100,25+75*smooth01(0,3.4,pt)); if(pt>4.4){ L.droop=approach(L.droop,1,1.1,dt); L.boiled=approach(L.boiled,1,1.2,dt); } if(pt>9) finish(); }
      else if(S.p===4){ S.simMin=pt; S.Tb=approach(S.Tb,95,0.45,dt); S.Ta=Math.min(78.4,approach(S.Ta,S.Tb,0.6,dt));

      else if(S.p===6){ S.simMin=pt; S.sq=pt<2.6?1:0; if(pt>0.4) L.rinse=approach(L.rinse,1,1.4,dt); if(pt>4.2) finish(); }

      r4:S.p<=1||(S.p===2&&!S.run)?('Day '+(1+Math.floor(S.hr/24))+' · '+String(Math.floor((S.hr%24+8)%24)).padStart(2,'0')+':00'):(S.p>=PH.length?'done':fmt(S.simMin,1)+' min')});

      const px=S.pl.x, base=505; benchTop(ctx,base);
      const dark=(p===0&&S.run)||(p===1&&!S.run&&S.done[0])?1:0, sunOn=(p===1&&S.run)||(p===2&&!S.run)?1:0;
      S.dk=approach(S.dk||0,dark,2.5,dt); S.sun=approach(S.sun||0,sunOn,2,dt);
      if(S.sun>0.02) sunDraw(ctx,70,70,26,t,S.sun);
      const soil=potDraw(ctx,px,base,130,80,0.4,11); let tgt=null;
      plantDraw(ctx,px,soil,280,t,{n:5,leafL:98,stemW:4,topLeaf:false,leafFn:(x,y,Ln,a,i)=>{ if(i===2){ tgt={x,y,L:Ln,a}; if(S.plucked) return; } vlDraw(ctx,L,x,y,Ln,a,{lw:1.3}); }});
      if(S.sun>0.05&&tgt){ ctx.save(); ctx.globalAlpha=S.sun; [-30,0,30].forEach((o,k)=>{ ctx.setLineDash([10,8]); ctx.lineDashOffset=-t*60; line(ctx,90,90,tgt.x+40+o,tgt.y-10+o*0.3,COL.yellow,2,[10,8]); }); ctx.restore();
        if(S.run&&p===1&&Math.random()<dt*6) S.gas.push({x:tgt.x+140,y:tgt.y-60+Math.random()*60,tx:tgt.x+30,ty:tgt.y,k:'c',t:0});
        if(S.run&&p===1&&Math.random()<dt*5) S.gas.push({x:tgt.x+30,y:tgt.y+4,tx:tgt.x+150,ty:tgt.y+70,k:'o',t:0}); }
      S.gas.forEach(g=>{ g.t+=dt; g.x+= (g.tx-g.x)*dt*1.2; g.y+=(g.ty-g.y)*dt*1.2+Math.sin(t*5+g.tx)*0.3; }); S.gas=S.gas.filter(g=>g.t<1.8);
      S.gas.forEach(g=>{ ctx.save(); ctx.globalAlpha=clamp(1.8-g.t,0,1); circ(ctx,g.x,g.y,4,g.k==='c'?COL.red:COL.green,'#fff',1.8); ctx.restore(); });
      if(S.dk>0.01){ ctx.save(); ctx.globalAlpha=S.dk; rect(ctx,px-150,110,300,base-110,COL.ink,null,2.6); ctx.fillStyle='rgba(19,42,68,0.55)'; ctx.fillRect(px-150,110,300,base-110);

      if(scene==='plant'){

        dayClock(ctx,gx+30,gy+gh+90,S.hr/24+1/3,S.p===0&&!S.run&&!skipDark?'Ready':('Day '+(1+Math.floor(S.hr/24))));
        if(tgt&&p===2) { ctx.save(); ctx.setLineDash([5,5]); circ(ctx,tgt.x+tgt.L*0.5*Math.cos(tgt.a),tgt.y+tgt.L*0.5*Math.sin(tgt.a),tgt.L*0.62,COL.yellow,null,2); ctx.restore(); }
      }
      if(scene==='trace'){
        // paper
        rect(ctx,425,160,350,280,COL.mid,'#fff',1.6); textAt(ctx,'tracing of the green areas',600,186,{align:'center',size:12,weight:700,color:COL.muted});
        if(tgt&&!S.plucked) snap(tgt.x,tgt.y,tgt.L,tgt.a);
        if(S.plucked) aim(70,300,300,0,dt,30);
        vlDraw(ctx,L,P.x.x,P.y.x,P.L.x,P.a.x,{lw:2});
        // hand
        const hp=pt<1.2?ease(pt/1.2):(pt<2.4?1:Math.max(0,1-(pt-2.4)));
        if(tgt&&hp>0.01){ const hx=lerp(820,(S.plucked?P.x.x:tgt.x)+20,hp), hy=lerp(520,(S.plucked?P.y.x:tgt.y)+20,hp); handDraw(ctx,hx+90,hy+40,Math.PI+0.5,1.2,pt>0.9&&pt<2.4?0.7:0.1); }
        vlOutline(ctx,440,300,300,0,0); ctx.save(); ctx.strokeStyle=rgba(COL.mid,0.6); ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
        const pen=vlTrace(ctx,440,300,300,0,S.tr,COL.green,2.2); if(pen&&S.tr<1) pencil(ctx,pen[0],pen[1],-0.9);
      }
    } else if(scene==='boil'){
      benchTop(ctx,520);
      ctx.save(); ctx.beginPath(); ctx.rect(0,432,SW,200); ctx.clip(); spiritLamp(ctx,BX,520,t,true); ctx.restore();
      tripod(ctx,BX,428,520,170); gauze(ctx,BX,426,210);
      const b=beakerDraw(ctx,BX,250,424,170), wl=290;
      ctx.save(); ctx.fillStyle=rgba(COL.blue,0.13); ctx.fillRect(b.x0+1.5,wl,170-3,424-wl-1.5); ctx.restore();
      if(S.Tw>96&&Math.random()<dt*40) S.bub.push({x:BX+(Math.random()-0.5)*140,y:416,vy:-30,r:2+Math.random()*2,ph:Math.random()*6});
      bubbleStep(S.bub,dt,()=>wl); bubbleDraw(ctx,S.bub,COL.blue);
      if(S.Tw>96) heatWave(ctx,BX,wl-8,40,-Math.PI/2,COL.red,t,0.6,3);
      const inY=pt>3.4?lerp(150,268,smooth01(3.4,4.4,pt)):150, outY=pt>8?lerp(268,150,smooth01(8,8.8,pt)):inY; aim(BX+18,outY,110,Math.PI/2,dt,90);
      ctx.save(); ctx.beginPath(); ctx.rect(0,wl,SW,200); ctx.clip(); ctx.globalAlpha=1; ctx.restore();
      vlDraw(ctx,L,P.x.x,P.y.x,P.L.x,P.a.x,{lw:1.6}); line(ctx,b.x0+3,wl,b.x1-3,wl,COL.blue,2);
      tongsDraw(ctx,P.x.x,P.y.x-16,-1.0,0.1,190);
      labThermo(ctx,BX-58,200,390,S.Tw,0,100,{step:10});
      lensView(ctx,LX,LY,150,P.x.x,P.y.x+50,()=>vlDraw(ctx,L,LX-125,LY,250,0,{lw:2,stalk:false}),{label:L.boiled>0.5?'limp: cells killed':'leaf'});
      textAt(ctx,'water '+fmt(S.Tw,0)+' °C',BX,228,{align:'center',size:13,weight:700,color:S.Tw>96?COL.red:COL.blue});
    } else if(scene==='alc'){
      benchTop(ctx,520);
      ctx.save(); ctx.beginPath(); ctx.rect(0,432,SW,200); ctx.clip(); spiritLamp(ctx,BX,520,t,true); ctx.restore();
      tripod(ctx,BX,428,520,170); gauze(ctx,BX,426,210);
      const wb=waterBath(ctx,BX,230,424,210,S.Tb,t);
      // alcohol beaker inside
      const ax0=BX-48, ax1=BX+48, at=300, ab=420, al=330;
      ctx.save(); ctx.fillStyle=mixColAny('#ffffff',LEAF_GREEN,(1-L.green)*0.75); ctx.globalAlpha=0.8; ctx.fillRect(ax0+1.5,al,96-3,ab-al-1.5); ctx.restore();
      beakerDraw(ctx,BX,at,ab,96); line(ctx,ax0+2,al,ax1-2,al,COL.green,1.8);

      bubbleStep(S.bub,dt,()=>al); bubbleDraw(ctx,S.bub,COL.green);
      aim(BX+16,pt<1?lerp(120,318,ease(pt)):318,80,Math.PI/2,dt,90);
      vlDraw(ctx,L,P.x.x,P.y.x,P.L.x,P.a.x,{lw:1.4});
      labThermo(ctx,BX-36,250,390,S.Ta,0,100,{step:20,labels:false,w:9,r:7});
      textAt(ctx,'alcohol '+fmt(S.Ta,0)+' °C'+(S.Ta>78?' — boiling':''),BX,212,{align:'center',size:13,weight:700,color:S.Ta>78?COL.red:COL.ink});
      leader(ctx,ax0+8,al+16,BX-160,190,'alcohol',COL.green); leader(ctx,BX-95,wb.wl+30,BX-160,232,'water bath',COL.blue);
      lensView(ctx,LX,LY,150,P.x.x,P.y.x+40,()=>vlDraw(ctx,L,LX-125,LY,250,0,{lw:2,stalk:false}),{label:L.green<0.1?'chlorophyll washed out':'leaf in alcohol'});
    } else {
      // dish of iodine (top view) on the left, the tracing on the right
      const DX=220, DY=300; const rinsePh=p>=6||(p===6&&S.run);

      S.dfade=approach(S.dfade===undefined?1:S.dfade,toCmp?0:1,3,dt);
      if(S.dfade>0.02){ ctx.save(); ctx.globalAlpha=S.dfade; circ(ctx,DX,DY,170,COL.ink,'#fff',3); circ(ctx,DX,DY,160,COL.mid,null,1.4);
        ctx.fillStyle=rgba(IOD_BROWN,0.32*(1-0.85*L.rinse)); ctx.beginPath(); ctx.arc(DX,DY,158,0,Math.PI*2); ctx.fill(); ctx.restore();
        textAt(ctx,L.rinse>0.5?'rinsed':'dilute iodine',DX,DY+190,{align:'center',size:13,weight:700,color:L.rinse>0.5?COL.blue:IOD_BROWN,alpha:S.dfade}); }
      if(p===5&&S.run&&pt<1.4){ const u=ease(pt/1.4); aim(lerp(P.x.x,DX-120,u),lerp(150,DY,u),lerp(82,240,u),lerp(Math.PI/2,0,u),dt,70); }
      else if(toCmp) aim(70,300,300,0,dt,30); else aim(DX-120,DY,240,0,dt,70);
      L.droop=approach(L.droop,toCmp||p>=5?0:L.droop,2,dt);
      vlDraw(ctx,L,P.x.x,P.y.x,P.L.x,P.a.x,{lw:2,stalk:true});
      if(p===6&&S.run&&pt<2.8) washBottle(ctx,430,240,1,t,DX,DY-20);
      // tracing
      rect(ctx,425,160,350,280,COL.mid,'#fff',1.6); textAt(ctx,'your tracing',600,186,{align:'center',size:12,weight:700,color:COL.muted});
      vlOutline(ctx,440,300,300,0,0); ctx.save(); ctx.strokeStyle=rgba(COL.mid,0.6); ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); vlTrace(ctx,440,300,300,0,1,COL.green,2.2);
      springTo(S.ov,S.overlay&&S.p>6?0:370,40,10,dt);
      if(S.p>6&&S.ov.x<368){ ctx.save(); ctx.setLineDash([7,5]); vlTrace(ctx,70+S.ov.x,300,300,0,1,COL.green,2.6); ctx.restore(); }
      if(L.iod>0.5&&S.p>6){ leader(ctx,P.x.x+150,300,P.x.x+150,470,'blue-black = starch',COL.blue); leader(ctx,P.x.x+40,300+105,P.x.x+40,500,'brown = no starch',IOD_BROWN); }
    }
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   5.2 CARBON DIOXIDE IS NEEDED FOR PHOTOSYNTHESIS (bell jars + KOH)
   Each jar holds 6 L of air → 0.245 mol, so 1 ppm CO₂ = 0.245 µmol.
   Plant (≈150 cm² of leaf): gross uptake Ag = 0.12 µmol/s · C/(C+350 ppm)
   in light, respiration Rd = 0.012 µmol/s, soil breathes 0.03 µmol/s.
   KOH in a watch-glass absorbs 0.0024 µmol/s per ppm (τ ≈ 100 s).
   No vaseline: air leaks in at 0.0015 µmol/s per ppm of difference.
   → Jar B settles near 190 ppm and keeps making starch (≈ 8 mg in 2 h);
     jar A falls to ≈ 15 ppm, below the compensation point (≈ 39 ppm),
     so its leaves make no starch at all. Starch = ∫(Ag − Rd) dt.
   2 hours are run in ≈ 24 s (×300).
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const NA=0.245, PMAX=0.12, KC=350, RD=0.012, FS=0.03, KK=0.0024, KL=0.0015, SPD=300;
  const JX=[150,405], PY=478, JW=205, JH=330;
  let t=0, koh=true, seal=true, sun=true, hrs=2;
  const S={};
  const jarNew=i=>({C:420, st:0, dots:[], out:[], o2:[], Ag:0, sink:0});
  const reset=()=>{ Object.assign(S,{run:false, ts:0, J:[jarNew(0),jarNew(1)], hist:[[0,420,420]], test:-1, tt:0, lf:[sprP(0,0),sprP(0,0)]}); S.J.forEach((J,i)=>{ for(let k=0;k<40;k++) J.dots.push(dotNew(i)); }); };
  const dotNew=i=>({x:JX[i]+(Math.random()-0.5)*(JW-30), y:PY-40-Math.random()*(JH-70), vx:(Math.random()-0.5)*30, vy:(Math.random()-0.5)*30, go:null, a:1});
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Jar A</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="k1">KOH beside the plant</button><button class="toggle-btn" id="k0">No KOH</button></div></div>
    <div class="control-group"><label>Bottom of the jars</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="v1">Sealed with vaseline</button><button class="toggle-btn" id="v0">Not sealed</button></div></div>
    <div class="control-group"><label>Time in sunlight <span class="val" id="hv">2 h</span></label><input type="range" id="hr" min="1" max="4" step="0.5" value="2">
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Keep in sunlight</button><button class="toggle-btn" id="sn">☀ Sun on</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="ts">🍃 Test a leaf from each</button><button class="toggle-btn" id="rs">↺ Reset</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','CO₂ in jar A',COL.red)}${card('r2','CO₂ in jar B',COL.red)}${card('r3','Starch made · A',COL.blue)}${card('r4','Starch made · B',COL.blue)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  toggleWire([$('#k1'),$('#k0')],b=>{ koh=b.id==='k1'; });
  toggleWire([$('#v1'),$('#v0')],b=>{ seal=b.id==='v1'; });
  $('#hr').oninput=e=>{ hrs=+e.target.value; setv($,'hv',hrs+' h'); };
  $('#go').onclick=()=>{ if(S.ts>=hrs*3600-1) { S.ts=0; S.hist=[[0,S.J[0].C,S.J[1].C]]; } S.run=!S.run; };
  $('#sn').onclick=()=>{ sun=!sun; setBtn($('#sn'),sun?'☀ Sun on':'☾ Dark',sun?'':'active'); };
  $('#ts').onclick=()=>{ S.test=0; S.tt=0; S.lf.forEach((q,i)=>{ q.x.x=JX[i]+40; q.y.x=PY-150; q.x.v=q.y.v=0; }); };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  animLoop(dt=>{
    t+=dt;
    /* ---- model, ×300 in substeps ---- */
    if(S.run){ const tot=Math.min(dt*SPD,hrs*3600-S.ts), n=10, h=tot/n;

      textAt(ctx,['boil…','alcohol…','iodine'][st],gx+gw/2,gy+gh+95,{align:'center',size:12,weight:700,color:COL.muted}); }
    ctx.restore();
  });

}

   a(T) = 2^((T−37)/10) up to 40 °C (Q₁₀ = 2), then the enzyme unfolds
   (a falls ∝ exp(−((T−40)/8)²) → ≈ 0 at 70 °C); boiled saliva: a = 0.
   Iodine: long starch chains → blue-black, dextrins → red-violet,
   maltose → nothing (iodine stays yellow-brown).
   37 °C: no blue after ≈ 4 min; 25 °C (room): ≈ 9 min; 10 °C: ≈ 26 min.

   ===================================================================== */

/* =====================================================================

   Breathed-out air ≈ 4 % CO₂ (≈ 5 % after running); room air 0.04 %.

   1.2 L over 2 s, a breath every 3 s. Pichkari: 30 mL of room air per

   ≈ 0.03 mmol, so breath turns it milky in ≈ 15 s while the pichkari needs

/* =====================================================================
   5.5 FERMENTATION — yeast + sugar, gas led into lime water
   C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂ (no oxygen needed).
   Rate r = 0.5 mmol CO₂ g⁻¹ min⁻¹ · yeast(g) · α · φ(T) · G/(G + 0.5 mmol)
     α  = waking-up of dry yeast, α' = (1 − α)/8 min
     φ  = cardinal-temperature model (min 4, best 32, max 45 °C); above
          50 °C the yeast is killed for good.
   10 mL of liquid first dissolves its own CO₂ (≈ 0.33 mmol at 25 °C)
   before any bubbles form; then the gas first pushes out the 8 mL of AIR
   above the liquid (well-mixed purge), so the first bubbles in the lime
   water hardly change it. Lime water as in 5.4 (small bubbles, 5 %).
   A pinch (0.1 g) in 10 % sugar at 30 °C → milky after ≈ 30 min;
   half a spoon (1 g) → ≈ 6 min. Clock ×30 by default.
   ===================================================================== */
function buildA5(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const FX=200, FBY=470, FW=70, FH=290, LXc=470, LBY=470, VH=8;
  const YE={none:{n:'No yeast',g:0},pinch:{n:'A pinch',g:0.1},spoon:{n:'Half a spoon',g:1}};
  const SU={water:{n:'Plain water',G:0},s5:{n:'5 % sugar',G:2.78},juice:{n:'Fruit juice (10 %)',G:5.55}};
  let t=0, yk='pinch', sk='juice', T=30, spd=30; const S={};
  const phi=T=>{ const a=4,o=32,x=45; if(T<=a||T>=x) return 0; return ((T-x)*(T-a)*(T-a))/((o-a)*((o-a)*(T-o)-(o-x)*(o+a-2*T))); };
  const reset=()=>Object.assign(S,{run:false, min:0, G:SU[sk].G, al:0, via:1, Cd:0, xh:0, made:0, Q:0, r:0, Lm:limeNew(), tMilky:null, bubF:[], bubL:[], gas:[], hist:[[0,0,0]], Tb:T, cells:null, sug:[], foam:0});
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Yeast</label><div class="chip-wrap">${Object.keys(YE).map(k=>`<button class="chip-btn${k===yk?' active':''}" data-y="${k}">${YE[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><label>In the tube (10 mL)</label><div class="chip-wrap">${Object.keys(SU).map(k=>`<button class="chip-btn${k===sk?' active':''}" data-g="${k}">${SU[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><label>Water bath <span class="val" id="tv">30 °C</span></label><input type="range" id="tp" min="5" max="60" step="1" value="30"></div>
    <div class="control-group"><label>Clock</label><div class="chip-wrap"><button class="chip-btn" data-s="10">×10</button><button class="chip-btn active" data-s="30">×30</button><button class="chip-btn" data-s="60">×60</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Start</button><button class="toggle-btn" id="rs">↺ Set up again</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Time',COL.yellow)}${card('r2','CO₂ made',COL.red)}${card('r3','Gas reaching lime water',COL.red)}${card('r4','Lime water',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-y]',b=>{ yk=b.dataset.y; reset(); fb.className='fb hidden'; });
  chipsWire(side,'[data-g]',b=>{ sk=b.dataset.g; reset(); fb.className='fb hidden'; });
  chipsWire(side,'[data-s]',b=>{ spd=+b.dataset.s; });
  $('#tp').oninput=e=>{ T=+e.target.value; setv($,'tv',T+' °C'); };
  $('#go').onclick=()=>{ S.run=!S.run; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  /* lens cells */
  const mkCells=()=>{ const R=rng(17), c=[]; const n=Math.round(clamp(YE[yk].g*40,0,14)); for(let i=0;i<n;i++) c.push({x:(R()-0.5)*190,y:(R()-0.5)*150,a:R()*6,bud:R()*0.3,ph:R()*6}); return c; };
  animLoop(dt=>{
    t+=dt; S.Tb=approach(S.Tb,T,0.8,dt);
    const Y=YE[yk].g;
    if(S.run){ const n=8, hm=dt*spd/60/n;
      for(let k=0;k<n;k++){ S.min+=hm; const Tc=S.Tb;
        if(Tc>50) S.via=Math.max(0,S.via-hm*0.8*(Tc-50));
        S.al+=(1-S.al)/8*hm*Math.max(0.15,phi(Tc)/1);
        const r=0.5*Y*S.al*S.via*phi(Tc)*S.G/(S.G+0.5); S.r=r;
        const dG=Math.min(S.G,r/2*hm); S.G-=dG; const co2=2*dG; S.made+=co2;
        const sat=0.33*Math.exp(-0.025*(Tc-25)); S.Cd+=co2; let gas=0; if(S.Cd>sat){ gas=(S.Cd-sat)*Math.min(1,hm*3); S.Cd-=gas; }
        if(S.Cd>sat*1.05) { const ex=S.Cd-sat; S.Cd-=ex; gas+=ex; }
        const Qml=gas*24.5; S.xh+=Qml/VH*(1-S.xh); S.xh=clamp(S.xh,0,1);
        limeAdd(S.Lm,gas*S.xh); S.Q=approach(S.Q,Qml/hm,2,hm*6);
      }
      const l=S.hist[S.hist.length-1]; if(S.min-l[0]>0.5) S.hist.push([S.min,S.made*24.5,limeMilk(S.Lm)]);
    } else S.Q=approach(S.Q,0,3,dt);
    const milk=limeMilk(S.Lm); if(S.tMilky===null&&milk>0.45) S.tMilky=S.min;
    setBtn($('#go'),S.run?'⏸ Pause':'▶ Start',S.run?'active':'play');
    setMany($,{r1:fmt(S.min,1)+' min', r2:fmt(S.made*24.5,1)+' mL', r3:S.Q>0.02?fmt(S.xh*100,0)+' % CO₂':'—', r4:S.tMilky!==null?'milky at '+fmt(S.tMilky,0)+' min':(milk>0.1?'turning…':'clear')});

    benchTop(ctx,FBY+12);
    // water bath

    beakerDraw(ctx,FX,wtop,FBY+10,190); line(ctx,wb0+3,wtop+30,wb1-3,wtop+30,COL.blue,1.8);

    if(S.Tb<12) for(let k=0;k<3;k++){ ctx.save(); ctx.translate(wb0+25+k*55,wtop+40); ctx.rotate(0.3*k); rect(ctx,-9,-9,18,18,COL.blue,'#eef6ff',1.8); ctx.restore(); }
    labThermo(ctx,wb1-20,wtop+50,FBY-40,S.Tb,0,60,{step:10,labels:false,w:9,r:6}); textAt(ctx,fmt(S.Tb,0)+' °C',wb1-20,wtop-10,{align:'center',size:13,weight:800,color:tempCol(S.Tb)});

    polyFill(ctx,r.poly,Y>0?'rgba(214,190,140,0.35)':'rgba(236,240,248,0.8)');
    if(Y>0){ ctx.save(); const R=rng(5); ctx.fillStyle='rgba(150,120,70,0.45)'; for(let i=0;i<70*Math.min(1,Y*3+0.3);i++){ const x=FX+(R()-0.5)*(FW-14), y=L0+8+R()*(FBY-L0-14); ctx.fillRect(x+Math.sin(t+i)*1.5,y,1.8,1.8); } ctx.restore(); }

    if(S.foam>0.03) foamDraw(ctx,FX-FW/2+2,FX+FW/2-2,L0,S.foam*22,t,3);

    // cork + delivery tube
    const ct=FBY-FH; rect(ctx,FX-FW/2+2,ct-14,FW-4,30,COL.ink,'#f3e2c0',2.4);

    pipe(ctx,path,clamp(Qv,0,1),t,COL.mid);

    S.gas.forEach(g=>{ const p=along(g.f); circ(ctx,p[0],p[1],3,g.co2?COL.red:COL.mid,g.co2?COL.red:'#fff',1.4); });
    limeTube(ctx,LXc,LBY,milk,S.bubL,t,dt,{W:64,H:250,fillH:150});
    leader(ctx,FX-14,FBY-30,FX+4,FBY+48,Y>0?YE[yk].n.toLowerCase()+' of yeast + '+SU[sk].n.toLowerCase():SU[sk].n,COL.yellow);
    textAt(ctx,'air above the liquid → pushed out first',FX+50,ct-74,{size:11.5,weight:700,color:COL.mid,alpha:S.made>0.2&&S.xh<0.5?1:0});

    if(spd>1) tag(ctx,'clock ×'+spd,330,40,COL.yellow,{size:12});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   5.6 HOW A FISH BREATHES
   Buccal–opercular pump: the mouth opens while the gill covers stay shut
   (water sucked in), then the mouth shuts and the covers open (water
   pushed over the gills and out). The two never open together.
   Dissolved O₂ (Benson–Krause fit): 14.62 − 0.3898T + 0.006969T² −
   5.897·10⁻⁵T³ mg/L (9.1 at 20 °C, 7.6 at 30 °C); without the aerator
   the tank sits at ≈ 55 % of that. Need for O₂ doubles every 10 °C.
   Breaths per minute = 70·√(need / supply) relative to 20 °C, aerated.
   Air holds ≈ 280 mg O₂ per litre — about 30× more than water — which
   is why we breathe only ≈ 15 times a minute.
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const AQ={x0:30,x1:560,y0:70,y1:455,wl:100}, FX=300, FY=270;
  let t=0, T=24, aer=true, you='rest', fast=1; const S={};
  const DO=T=>14.62-0.3898*T+0.006969*T*T-5.897e-5*T*T*T;
  const rate=()=>{ const sup=DO(T)*(aer?1:0.55), need=Math.pow(2,(T-20)/10); return clamp(70*Math.sqrt(need*DO(20)/sup),25,170); };
  const reset=()=>Object.assign(S,{ph:0, hph:0, mo:spr(0), op:spr(0), chest:spr(0), wat:[], o2:[], bub:[], trace:[], counting:false, ct:0, nF:0, nH:0, res:null, sway:0});
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Water temperature <span class="val" id="tv">24 °C</span></label><input type="range" id="tp" min="10" max="34" step="1" value="24"></div>
    <div class="control-group"><label>Aquarium pump (air bubbles)</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="a1">On</button><button class="toggle-btn" id="a0">Off</button></div></div>
    <div class="control-group"><label>You</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="y0">Sitting</button><button class="toggle-btn" id="y1">After a run</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="ct">⏱ Count for 1 minute</button></div>
      <div class="chip-wrap" style="margin-top:6px"><button class="chip-btn active" data-f="1">Real time</button><button class="chip-btn" data-f="4">Fast (×4)</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Fish: mouth opens',COL.blue)}${card('r2','Fish: gill covers open',COL.red)}${card('r3','You: breaths',COL.yellow)}${card('r4','O₂ in the water',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#tp').oninput=e=>{ T=+e.target.value; setv($,'tv',T+' °C'); };
  toggleWire([$('#a1'),$('#a0')],b=>{ aer=b.id==='a1'; });
  toggleWire([$('#y0'),$('#y1')],b=>{ you=b.id==='y1'?'run':'rest'; });
  chipsWire(side,'[data-f]',b=>{ fast=+b.dataset.f; });
  $('#ct').onclick=()=>{ S.counting=true; S.ct=0; S.nF=0; S.nOp=0; S.nH=0; S.res=null; fb.className='fb hidden'; };
  const bump=(x,a,b)=>x<a||x>b?0:Math.pow(Math.sin(Math.PI*(x-a)/(b-a)),1.5);
  /* the fish (facing left), anchored at the snout pivot; returns key points */
  function fish(ctx,x,y,mo,op,t){ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=3; const tail=Math.sin(t*2.2)*10;
    const jaw=mo*0.32; const mx=x-178, my=y+6;
    // body
    ctx.beginPath(); ctx.moveTo(mx+4,my-10); ctx.bezierCurveTo(x-120,y-95,x+40,y-92,x+128,y-22); ctx.lineTo(x+186,y-62+tail); ctx.quadraticCurveTo(x+168,y+tail*0.4,x+186,y+60+tail); ctx.lineTo(x+128,y+22);
    ctx.bezierCurveTo(x+40,y+88,x-110,y+86,mx+8,my+16); ctx.fillStyle='#fdfefe'; ctx.fill(); ctx.stroke();
    // scales hint
    ctx.save(); ctx.strokeStyle=rgba(COL.mid,0.5); ctx.lineWidth=1.2; for(let i=0;i<6;i++) for(let j=-1;j<=1;j++){ ctx.beginPath(); ctx.arc(x-10+i*24,y+j*24+(i%2)*12,10,-0.9,0.9); ctx.stroke(); } ctx.restore();
    // dorsal, pelvic, pectoral fins
    ctx.beginPath(); ctx.moveTo(x-30,y-82); ctx.quadraticCurveTo(x+10,y-130+Math.sin(t*3)*4,x+70,y-62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+10,y+78); ctx.quadraticCurveTo(x+30,y+110,x+70,y+62); ctx.stroke();
    ctx.save(); ctx.translate(x-40,y+30); ctx.rotate(0.5+Math.sin(t*4)*0.25); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(30,-6,46,10); ctx.quadraticCurveTo(26,16,0,0); ctx.stroke(); ctx.restore();
    // mouth: upper lip fixed, lower jaw rotates about the hinge
    const hx=mx+30, hy=my+4; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(mx,my-4); ctx.stroke();
    const lx=hx-Math.cos(jaw)*32, ly=hy+Math.sin(jaw)*32; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(lx,ly+4); ctx.stroke();
    if(mo>0.05){ ctx.save(); ctx.globalAlpha=0.35*mo; ctx.fillStyle=COL.blue; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(mx,my-4); ctx.lineTo(lx,ly+4); ctx.closePath(); ctx.fill(); ctx.restore(); }

    circ(ctx,x-128,y-22,11,COL.ink,'#fff',2.4); circ(ctx,x-125,y-22,5,COL.ink,COL.ink,1);
    // gills under the cover (red filaments), seen through the slit when it opens
    const gx=x-70, gy=y;
    const gills=(al)=>{ ctx.save(); ctx.globalAlpha=al; for(let a=0;a<4;a++){ const ax=gx+8+a*8; ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(ax,gy-50); ctx.quadraticCurveTo(ax+12,gy,ax,gy+50); ctx.stroke();
      for(let k=-5;k<=5;k++){ const yy=gy+k*9, xx=ax+12*(1-(k*k)/30); line(ctx,xx-1,yy,xx+6+op*5,yy+2,COL.red,1.1); } } ctx.restore(); };
    const cover=(f)=>{ ctx.moveTo(gx-12,y-58); ctx.bezierCurveTo(gx+24+f*0.4,y-56-f*0.3,gx+44+f,y-10,gx+30+f*0.8,y+56+f*0.4); };
    gills(0.12);
    if(op>0.02){ const f=op*16; ctx.save();
      /* crescent between the closed cover line and the flared one */
      ctx.beginPath(); ctx.moveTo(gx-12,y-58); ctx.bezierCurveTo(gx+24+f*0.4,y-56-f*0.3,gx+44+f,y-10,gx+30+f*0.8,y+56+f*0.4); ctx.lineTo(gx+30,y+56); ctx.bezierCurveTo(gx+44,y-10,gx+24,y-56,gx-12,y-58); ctx.closePath();
      ctx.fillStyle=rgba(COL.red,0.12*op); ctx.fill(); ctx.clip(); gills(1); ctx.restore(); }
    // operculum: front edge hinged, back edge swings out by op
    const flare=op*16; ctx.beginPath(); ctx.moveTo(gx-12,y-58); ctx.bezierCurveTo(gx+24+flare*0.4,y-56-flare*0.3,gx+44+flare,y-10,gx+30+flare*0.8,y+56+flare*0.4);
    ctx.lineWidth=3.2; ctx.strokeStyle=COL.ink; ctx.stroke();
    ctx.restore(); return {mouth:[mx+8,my], hinge:[hx,hy], gill:[gx+20,gy], exit:[gx+36+flare,y+40+flare*0.4]}; }
  /* small person, sitting; chest expands with ch 0..1 */
  function person(ctx,x,y,ch){ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.fillStyle='#fff';
    circ(ctx,x,y-120,24,COL.ink,'#fff',2.6); ctx.beginPath(); ctx.moveTo(x-10,y-96); ctx.lineTo(x-10,y-88); ctx.moveTo(x+10,y-96); ctx.lineTo(x+10,y-88); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-34-ch*5,y-84); ctx.quadraticCurveTo(x-40-ch*8,y-40,x-30,y); ctx.lineTo(x+30,y); ctx.quadraticCurveTo(x+40+ch*8,y-40,x+34+ch*5,y-84); ctx.quadraticCurveTo(x,y-92-ch*3,x-34-ch*5,y-84); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.globalAlpha=0.35+0.5*ch; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x-12,y-50,10+ch*4,20+ch*4,0,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x+12,y-50,10+ch*4,20+ch*4,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.restore(); }
  animLoop(dt=>{
    t+=dt; const f=rate(), hf=you==='run'?30:15, sdt=dt*fast;
    const prev=S.ph, prevH=S.hph; S.ph=(S.ph+sdt*f/60)%1; S.hph=(S.hph+sdt*hf/60)%1;
    const mT=bump(S.ph,0.02,0.48), oT=bump(S.ph,0.52,0.98);

    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.beginPath(); for(let x=AQ.x0;x<=AQ.x1;x+=6){ const y=AQ.wl+Math.sin(x*0.04+t*2)*2; x===AQ.x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();

    if(aer){ line(ctx,AQ.x1-40,AQ.y1-22,AQ.x1-40,AQ.y0-10,COL.mid,2.4); rect(ctx,AQ.x1-47,AQ.y1-34,14,12,COL.ink,'#fff',1.8); }

      const an=(S.counting?S.ct:60)/60*Math.PI*2; circ(ctx,pxp,90,26,COL.ink,'#fff',2.4); ctx.save(); ctx.beginPath(); ctx.moveTo(pxp,90); ctx.arc(pxp,90,23,-Math.PI/2,-Math.PI/2+an); ctx.closePath(); ctx.fillStyle=rgba(COL.yellow,0.3); ctx.fill(); ctx.restore(); line(ctx,pxp,90,pxp+Math.sin(an)*20,90-Math.cos(an)*20,COL.ink,2.2); }
    // trace: mouth vs gill cover

      textAt(ctx,lab,tx1+8,ty+16+j*20,{size:11.5,weight:800,color:col}); });
    ctx.restore();

  return wrap;

/* =====================================================================
   5.7 HAEMOGLOBIN IN PEOPLE AND ANIMALS (Sahli haemoglobinometer)
   20 µL of blood is blown into 0.1 N HCl standing at the "2" mark; Hb
   turns into brown acid haematin (takes ≈ 10 min, shown in 3 s). Water
   is added drop by drop (0.025 mL) and stirred until the colour matches
   the two brown standards; the level then reads g/dL directly
   (tube scale: 0.1 mL per g/dL).
   Colour by Beer–Lambert: each channel = 255·10^(−a·R) with
   a = (0.12, 0.45, 0.90) for brown acid haematin, R = true Hb / reading.
   Typical ranges (g/dL; vary a little between labs and breeds):
   men 13.5–17.5, women 12.0–15.5, children 6–12 y 11.5–15.5,

function buildA7(){

  reset();
  side.innerHTML=`
    <div class="control-group"><label>Whose blood?</label><div class="chip-wrap">${KEYS.map(k=>`<button class="chip-btn${k===sk?' active':''}" data-k="${k}">${SUB[k].n}</button>`).join('')}</div></div>

      if(m.length&&w.length) msg+=' Men average '+fmt(m.reduce((a,r)=>a+r.v,0)/m.length,1)+', women '+fmt(w.reduce((a,r)=>a+r.v,0)/w.length,1)+' — males make more red cells (testosterone) and women lose iron in monthly bleeding.';

    rect(ctx,TX-104,TY1-60,208,90,COL.mid,'#f4f6f9',1.4);
    [-1,1].forEach(sg=>{ const x=TX+sg*62; rrect(ctx,x-15,TY0+40,30,TY1-TY0-30,14); ctx.fillStyle=col(1); ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); textAt(ctx,'std',x,TY0+30,{align:'center',size:11,weight:700,color:COL.muted}); });
    // graduated tube with liquid

    if(S.V>0){ const base=S.conv>0.01?col(Rr):'rgba(236,240,248,0.9)'; ctx.fillStyle=base; ctx.fillRect(TX-TW/2,lv,TW,TY1+40-lv);
      if(S.top>0.02){ const th=Math.min(60,(TY1-lv)*0.5); const g=ctx.createLinearGradient(0,lv,0,lv+th); g.addColorStop(0,col(Rr*(1-0.6*S.top))); g.addColorStop(1,base); ctx.fillStyle=g; ctx.fillRect(TX-TW/2,lv,TW,th); }

    line(ctx,TX+TW/2-1,lv,TX+TW/2+16,lv,COL.red,1.6); if(S.V>0) textAt(ctx,fmt(S.V/K,1),TX+TW/2+18,lv+4,{size:12,weight:800,color:COL.red});

/* =====================================================================
   5.8 TRANSPIRATION — a plant and a stick under plastic sheets in the sun
   Saturation vapour density ρs(T) = 216.7·e_s/(T+273), e_s = 6.112·
   e^{17.67T/(T+243.5)} hPa  (30 °C → 30.3 g/m³, 35 °C → 39.6 g/m³).
   Each cover holds 8 L of air, starting at 50 % RH (34 °C inside).
   Leaf: E = gA·(ρs(T_leaf) − ρv), gA = 8·10⁻⁵ m³/s with stomata open
   (bright sun ×1, shade ×0.4, dark ×0.08 — stomata close; vaseline ×0.1).
   Uncovered soil: 3·10⁻⁵ m³/s. The plastic, cooled by the outside air,
   sits at 30 °C: vapour above ρs(30 °C) condenses on it (4·10⁻⁴ m³/s).
   → the plant's cover fogs within ≈ 1 min and collects ≈ 1.5 g of water
   in 30 min; the stick's cover stays clear. 30 min run in 30 s.
   Drops grow, merge, and run down once ≈ 2.5 mm across.
   ===================================================================== */
function buildA8(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX=[175,430], BASE=490, BW=210, BH=285, V=0.008, TIN=34, TW=30, TL=35, SPD=60;
  const rhoS=T=>216.7*6.112*Math.exp(17.67*T/(T+243.5))/(T+273.15);
  const LIGHT={sun:{n:'Bright sun',g:1},shade:{n:'Shade',g:0.4},dark:{n:'Dark',g:0.08}};
  let t=0, lk='sun', vas=false, soilCov=true; const S={};
  const bagNew=()=>({rv:0.5*rhoS(TIN), W:0, lost:0, drops:[], pool:0, E:0});
  const reset=()=>Object.assign(S,{run:false, sec:0, B:[bagNew(),bagNew()], hist:[[0,0,0]], gs:spr(LIGHT[lk].g), xy:[], vap:[]});
  reset();
  side.innerHTML=`
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Keep in sunlight (30 min)</button><button class="toggle-btn" id="rs">↺ New covers</button></div></div>
    <div class="control-group"><label>Light</label><div class="chip-wrap">${Object.keys(LIGHT).map(k=>`<button class="chip-btn${k===lk?' active':''}" data-l="${k}">${LIGHT[k].n}</button>`).join('')}</div></div>
    <div class="control-group"><label>Leaves</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="v0">As they are</button><button class="toggle-btn" id="v1">Vaseline on leaves</button></div></div>
    <div class="control-group"><label>Soil in both pots</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn active" id="s1">Covered with plastic</button><button class="toggle-btn" id="s0">Left open</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Water on plant’s cover',COL.blue)}${card('r2','Water on stick’s cover',COL.blue)}${card('r3','Air under plant’s cover',COL.blue)}${card('r4','Stomata open',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#go').onclick=()=>{ if(S.sec>=1800) { reset(); } S.run=!S.run; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  chipsWire(side,'[data-l]',b=>{ lk=b.dataset.l; });
  toggleWire([$('#v0'),$('#v1')],b=>{ vas=b.id==='v1'; });
  toggleWire([$('#s1'),$('#s0')],b=>{ soilCov=b.id==='s1'; });
  /* the cover: a dome from the pot rim; u 0..1 runs left rim → top → right rim */
  const rimY=BASE-78;
  const domePt=(i,u,wob)=>{ const cx=PX[i], a=Math.PI*(1-u); const w=BW/2*(1+0.03*Math.sin(wob)), hh=BH*(1+0.02*Math.sin(wob*1.3));
    return [cx+Math.cos(a)*w, rimY-Math.sin(a)*hh*(0.85+0.15*Math.sin(a))]; };
  const faceXY=(i,sx,v)=>[PX[i]+sx*BW/2*Math.sqrt(Math.max(0,1-v*v))*0.96, rimY-v*BH*0.97];
  const domeNorm=(i,u)=>{ const p=domePt(i,u,0), q=domePt(i,Math.min(1,u+0.01),0); const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1; return [dy/L,-dx/L]; };
  animLoop(dt=>{
    t+=dt; const g=LIGHT[lk].g*(vas?0.1:1); springTo(S.gs,g,4,3,dt);
    if(S.run){ const tot=Math.min(dt*SPD,1800-S.sec), n=8, h=tot/n;
      for(let k=0;k<n;k++) S.B.forEach((B,i)=>{ const leafE=i===0?8e-5*Math.max(0,S.gs.x)*Math.max(0,rhoS(TL)-B.rv):0, soilE=soilCov?0:3e-5*Math.max(0,rhoS(TIN-2)-B.rv);
        const cond=4e-4*Math.max(0,B.rv-rhoS(TW)); B.E=leafE; B.rv+=(leafE+soilE-cond)*h/V; B.W+=cond*h; B.lost+=(leafE+soilE)*h; });
      S.sec+=tot; if(S.sec>=1800) S.run=false;
      const l=S.hist[S.hist.length-1]; if(S.sec-l[0]>20) S.hist.push([S.sec,S.B[0].W,S.B[1].W]); }
    setBtn($('#go'),S.run?'⏸ Pause':(S.sec>=1800?'↻ Again':'▶ Keep in sunlight (30 min)'),S.run?'active':'play');
    const rh=B=>clamp(B.rv/rhoS(TIN)*100,0,100);
    setMany($,{r1:fmt(S.B[0].W,2)+' g', r2:fmt(S.B[1].W,2)+' g', r3:fmt(rh(S.B[0]),0)+' % humid', r4:fmt(clamp(S.gs.x,0,1)*100,0)+' %'});
    if(S.sec>=1800||S.sec>600){ const a=S.B[0].W, b=S.B[1].W;
      if(a>0.2&&b<0.05) fbSet(fb,'ok','Only the plant’s cover is misted with drops: the water came <b>out of the leaves</b> as vapour (through the stomata) — <b>transpiration</b>.');
      else if(b>0.05) fbSet(fb,'warn','Water on the stick’s cover too — it came from the open soil. Cover the soil so only the plant can give out water.');
      else if(a<0.2) fbSet(fb,'warn',vas?'Vaseline blocks the stomata — very little water escapes.':'Stomata are nearly shut in the dark, so the plant loses little water.'); }
    /* droplets on the inside of each cover: new water → new nuclei + growth */
    S.B.forEach((B,i)=>{ const have=B.drops.reduce((s,d)=>s+d.m,0)+B.pool, add=B.W-have; if(add>0){ let a=add;
        const want=a/0.0012*0.6, nNew=Math.min(6,Math.floor(want)+(Math.random()<want%1?1:0)); for(let k=0;k<nNew&&B.drops.length<260;k++){ B.drops.push({s:(Math.random()*2-1)*0.92,h:0.04+Math.pow(Math.random(),0.8)*0.9,m:0.0012,v:0,sl:false}); a-=0.0012; }
        if(a>0&&B.drops.length){ const per=a/B.drops.length; B.drops.forEach(d=>d.m+=per); } else if(a>0) B.pool+=a; }
      B.drops.forEach(d=>{ d.r=Math.cbrt(3*d.m/(4*Math.PI))*10; /* mm */ d.rr=Math.max(1.4,d.r*3.2); if(d.r>1.25) d.sl=true;
        if(d.sl){ d.v=Math.min(0.35,d.v+dt*0.5); d.h-=d.v*dt; } });
      /* a running drop sweeps up the drops in its path */
      const P=d=>faceXY(i,d.s,d.h);
      for(const d of B.drops){ if(!d.sl||d.dead) continue; const p=P(d); for(const e of B.drops){ if(e===d||e.dead) continue; const q=P(e); if(Math.hypot(p[0]-q[0],p[1]-q[1])<d.rr+e.rr){ d.m+=e.m; e.dead=true; } } }
      B.drops.forEach(d=>{ if(d.h<=0.01){ B.pool+=d.m; d.dead=true; } }); B.drops=B.drops.filter(d=>!d.dead); });
    /* xylem stream + vapour out of the stomata */
    const E0=S.B[0].E*(S.run?1:0);
    if(Math.random()<dt*E0*6000) S.xy.push({f:0});
    S.xy.forEach(q=>q.f+=dt*(0.25+E0*250)); S.xy=S.xy.filter(q=>q.f<1);
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BASE+2);
    const sunA=LIGHT[lk].g; if(sunA>0.3) sunDraw(ctx,305,50,24,t,sunA===1?1:0.45); else { circ(ctx,305,50,20,COL.mid,'#eef1f6',2); }
    S.B.forEach((B,i)=>{ const cx=PX[i], soil=potDraw(ctx,cx,BASE,120,80,0.5,3+i);
      // the object inside
      let leaves=[];
      if(i===0){ const pl=plantDraw(ctx,cx,soil,215,t*0.2,{n:6,leafL:62,sway:0.2,wilt:0}); leaves=pl.leaves;
        // xylem dots in the stem
        S.xy.forEach(q=>{ circ(ctx,cx+Math.sin(q.f*3)*0.5,lerp(soil,soil-200,q.f),2.2,COL.blue,COL.blue,1); });
        if(vas) leaves.forEach(L=>{ ctx.save(); ctx.globalAlpha=0.5; leaf(ctx,L.x,L.y,L.L,L.ang,COL.yellow,0,'rgba(217,160,23,0.15)'); ctx.restore(); }); }
      else { rect(ctx,cx-5,soil-215,10,215,COL.ink,'#f3e2c0',2.2); }
      // plastic on the soil
      if(soilCov){ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(cx-60,rimY+2); ctx.quadraticCurveTo(cx-20,soil-6,cx-6,soil-4); ctx.moveTo(cx+6,soil-4); ctx.quadraticCurveTo(cx+20,soil-6,cx+60,rimY+2); ctx.stroke(); ctx.restore(); line(ctx,cx-8,soil-6,cx+8,soil-6,COL.yellow,3); }
      else if(S.run&&Math.random()<dt*3){ (B.sv=B.sv||[]).push({x:cx+(Math.random()-0.5)*80,y:soil-4,t:0}); }
      (B.sv||[]).forEach(v=>{ v.t+=dt; v.y-=20*dt; }); B.sv=(B.sv||[]).filter(v=>v.t<2); (B.sv||[]).forEach(v=>{ ctx.save(); ctx.globalAlpha=1-v.t/2; circ(ctx,v.x,v.y,2,COL.blue,null,1.2); ctx.restore(); });
      // fog + drops on the cover
      const wob=t*1.1+i; const fog=clamp(B.W/0.8,0,1)*0.13+clamp((rh(B)-80)/20,0,1)*0.05;
      ctx.save(); ctx.beginPath(); for(let k=0;k<=40;k++){ const p=domePt(i,k/40,wob); k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } ctx.closePath(); ctx.fillStyle=rgba(COL.blue,0.03+fog); ctx.fill(); ctx.restore();
      B.drops.forEach(d=>{ const p=faceXY(i,d.s,d.h), rr=d.rr; ctx.save(); ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*(d.sl?1.3:1),0,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.2; ctx.stroke();
        if(d.sl){ ctx.globalAlpha=0.5; line(ctx,p[0],p[1]-rr,p[0],p[1]-rr-14,COL.blue,1); } ctx.restore(); });
      ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2.4; ctx.beginPath(); for(let k=0;k<=40;k++){ const p=domePt(i,k/40,wob); k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } ctx.stroke(); ctx.restore();
      if(B.pool>0.002){ const pw=clamp(B.pool*60,2,30); [0,1].forEach(s=>{ const p=domePt(i,s?0.985:0.015,0); ctx.save(); ctx.fillStyle=rgba(COL.blue,0.5); ctx.beginPath(); ctx.ellipse(p[0]+(s?-pw/2:pw/2),rimY-2,pw/2,3,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }); }
      line(ctx,cx-BW/2-6,rimY+4,cx+BW/2+6,rimY+4,COL.yellow,3);
      textAt(ctx,i?'stick':'plant',cx,BASE+30,{align:'center',size:15,weight:800,color:COL.ink});
    });
    // stomata lens on a plant leaf
    const LX=670, LY=160, LR=110, op=clamp(S.gs.x,0,1);
    lens(ctx,LX,LY,LR,PX[0]+40,BASE-260,'stoma on the leaf (×400)',()=>{
      ctx.save(); ctx.fillStyle='#f2faf4'; ctx.fillRect(LX-LR,LY-LR,2*LR,2*LR); ctx.restore();
      for(let k=0;k<7;k++){ ctx.save(); ctx.strokeStyle=rgba(COL.green,0.4); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(LX-LR,LY-LR+k*34); ctx.bezierCurveTo(LX-30,LY-LR+k*34+16,LX+30,LY-LR+k*34-12,LX+LR,LY-LR+k*34+6); ctx.stroke(); ctx.restore(); }
      const gap=4+op*16;
      [-1,1].forEach(sg=>{ ctx.save(); ctx.beginPath(); ctx.ellipse(LX+sg*(gap/2+15),LY,18+ (1-op)*2,52,0,0,Math.PI*2); ctx.fillStyle='#e4f4e8'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.6; ctx.stroke();
        for(let c=0;c<5;c++) circ(ctx,LX+sg*(gap/2+15)+((c%2)-0.5)*8,LY-34+c*17,3,COL.green,COL.green,1); ctx.restore(); });
      ctx.save(); ctx.beginPath(); ctx.ellipse(LX,LY,Math.max(1,gap/2),44*op+4,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
      if(S.run&&op>0.15&&Math.random()<dt*op*14) S.vap.push({x:LX+(Math.random()-0.5)*gap*0.6,y:LY+(Math.random()-0.5)*40*op,t:0,a:(Math.random()-0.5)*1.2});
      S.vap.forEach(v=>{ v.t+=dt; v.x+=Math.sin(v.a)*40*dt; v.y-=40*dt; }); S.vap=S.vap.filter(v=>v.t<2.2);
      S.vap.forEach(v=>{ ctx.save(); ctx.globalAlpha=1-v.t/2.2; circ(ctx,v.x,v.y,3,COL.blue,'#fff',1.6); ctx.restore(); });
    });
    // graph
    const gx=568, gy=330, gw=210, gh=120;
    plotTS(ctx,gx,gy,gw,gh,[{pts:S.hist.map(q=>[q[0]/60,q[1]]),col:COL.blue,label:'plant'},{pts:S.hist.map(q=>[q[0]/60,q[2]]),col:COL.blue,dash:[5,4],label:'stick'}],
      {x0:0,x1:30,y0:0,y1:Math.max(0.5,Math.ceil(Math.max(S.B[0].W,S.B[1].W)*2)/2),title:'water on the cover (g)',xt:[0,10,20,30],xl:'min'});
    textAt(ctx,mmss(S.sec)+' / 30:00',gx,gy+gh+32,{size:12,weight:800,color:COL.yellow});
    ctx.restore();
  });
  return wrap;
}

const _b=n=>(typeof window[n]==='function'?window[n]:()=>{ const d=document.createElement('div'); d.textContent='(not built yet)'; return d; });

  { num:'5.1', title:'Chlorophyll and Starch', desc:'Variegated leaf: dark room → sunlight → boil → alcohol → iodine', build: ()=>_b('buildA1')() },
  { num:'5.2', title:'CO₂ and Photosynthesis', desc:'Two plants under sealed bell jars — one with KOH', build: ()=>_b('buildA2')() },
  { num:'5.3', title:'Saliva Digests Starch', desc:'Starch + saliva vs starch alone — then iodine', build: ()=>_b('buildA3')() },

  { num:'5.6', title:'How a Fish Breathes', desc:'Mouth and gill covers — count them for one minute', build: ()=>_b('buildA6')() },

];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
