<html lang="en">
<head>

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">
  <div class="topbar">

        <p id="panelDesc"></p>

      <div class="panel-body" id="panelBody"></div>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 10: LIFE PROCESSES IN PLANTS
   Activities 10.1 – 10.8 (NCERT Curiosity, gecu110). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. Saplings
   grow from a sugar budget (photosynthesis − respiration), leaves are pixel
   grids holding real chlorophyll / starch / iodine values, oxygen bubbles
   leave a water plant at a light-response rate, red ink climbs the xylem at
   the transpiration rate, and germinating seeds breathe out CO₂ that clouds
   lime water.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }

function noiseBurst(dur,freq,q,gain){ const a=sfxCtx(); if(!a) return; try{

/* ---- 10.1 plant growth model (shared by the page) ----
   time in hours. state: W soil water (0..1 of field capacity), S sugar reserve,
   chl chlorophyll (0..1), H height (cm), leaves [{m size 0..1, age, chl, dry, fall}], T turgor, dead
*/
function potNew(sun,water){ return {sun,water,W:0.75,S:0.6,chl:1,H:5,leafPool:0,leaves:[{m:1,age:200,dry:0},{m:1,age:200,dry:0},{m:0.9,age:150,dry:0},{m:0.8,age:120,dry:0}],T:1,dryH:0,dead:false,thin:0,water24:0}; }
function sunAt(hr){ const h=hr%24; return h>6&&h<18?Math.sin(Math.PI*(h-6)/12):0; }
function potStep(p,hr,dh){
  const I=p.sun?sunAt(hr):0, day=(hr%24);
  // soil water: sun heats the soil + the plant transpires through its leaves (only while it has turgor)
  const La=p.leaves.reduce((a,l)=>a+l.m*(1-l.dry),0);
  const loss=(0.002+0.013*I)+0.0022*I*La*p.T*(p.dead?0:1);
  p.W=Math.max(0,p.W-loss*dh);
  // turgor: wilts below W 0.35, gone below 0.12
  const Tt=p.dead?0:clampN((p.W-0.12)/0.25,0,1); p.T+= (Tt-p.T)*(1-Math.exp(-dh/3));
  if(p.W<0.1){ p.dryH+=dh; if(p.dryH>30) p.dead=true; } else p.dryH=Math.max(0,p.dryH-dh*2);
  if(p.dead){ p.leaves.forEach(l=>{ l.dry=Math.min(1,l.dry+dh/30); }); return; }
  // chlorophyll: made in light, broken down in the dark (τ ≈ 4 days)
  if(I>0.05||(p.sun&&day>5&&day<19)) p.chl+= (1-p.chl)*dh/48*(p.T); else if(!p.sun) p.chl-=p.chl*dh/96;
  p.chl=clampN(p.chl,0,1);
  p.leaves.forEach(l=>{ l.chl=p.chl; if(p.T<0.35) l.dry=Math.min(1,l.dry+dh/60*(0.35-p.T)/0.35); });
  // photosynthesis − respiration
  const P=0.028*I*p.chl*La*p.T;
  const R=0.0035*(p.H/5+La*0.3);
  p.S+=(P-R)*dh;
  // growth from the reserve
  const G=p.S>0.05? 0.0065*p.S/(p.S+0.5)*p.T :0;
  p.S-=G*dh;
  const etio=p.sun?0:1; p.thin+=( (etio?1:0)-p.thin)*dh/72;
  p.H+=G*dh*(p.sun?4.6:10);
  p.leafPool+=G*dh*(p.sun?3.4:0.35);
  if(p.leafPool>1){ p.leafPool-=1; p.leaves.push({m:0.05,age:0,dry:0}); }
  p.leaves.forEach(l=>{ l.age+=dh; l.m=Math.min(1,l.m+dh/60*p.T); });
  // old leaves yellow and drop when the plant is starving in the dark
  if(p.S<0.08&&!p.sun){ p.dropT=(p.dropT||0)+dh; if(p.dropT>70&&p.leaves.length>2){ p.dropT=0; p.leaves.shift(); p.fell=(p.fell||0)+1; } }
  if(p.S<0) p.S=0;
}
function clampN(x,a,b){ return Math.max(a,Math.min(b,x)); }

function seqNew(){ return {list:[],cur:null,t:0}; }
function seqRun(q,dt){ let guard=0; while(guard++<20){ if(!q.cur){ q.cur=q.list.shift(); if(!q.cur) return; q.t=0; if(q.cur.start) q.cur.start(); }
    q.t+=dt; dt=0; const c=q.cur, u=c.d>0?Math.min(1,q.t/c.d):1; c.f(u); if(u<1) return; dt=q.t-c.d; q.cur=null; } }

/* ---- one leaf outline: petiole end at (0,0), tip at (L,0), half-width W ---- */
function leafHW(u){ u=clamp(u,0,1); return Math.pow(Math.sin(Math.PI*Math.pow(u,0.85)),0.85)*(1-0.12*u); }

/* ---- a sapling on soil point (x,y), sc px per cm; p from potNew; sway phase t ----

/* =====================================================================

      for(const b of blobs){ const d=Math.hypot((u-b.u)*1.9,(v-b.v)*0.9); if(d<b.R) c=0.04; } }
    g.chl[k]=c; g.st[k]=(o.starch===undefined?0.6:o.starch)*(c>0.5?1:0.05); if(o.zoneU!==undefined) g.zone[k]=u>o.zoneU?1:0; }
  return g; }
function lgColour(g,k){ const pig=g.chl[k]*(1-g.ext), io=ioLook(g.io[k]);
  let c=hexRgb(g.chl[k]>0.5?LEAF_G:'#e9e6c8'); const cream=hexRgb(CREAM); const f=g.chl[k]>0.5?pig:0.3*(1-g.ext);
  c=c.map((v,i)=>lerp(cream[i],v,f)); if(g.soft>0){ const o=hexRgb('#c7cfa0'); c=c.map((v,i)=>lerp(v,o[i],g.soft*0.15)); }
  const ib=hexRgb(IODINE); c=c.map((v,i)=>lerp(v,ib[i],0.72*io));

function lgRender(g){ if(!g.cv){ g.cv=document.createElement('canvas'); g.cv.width=LG_NX; g.cv.height=LG_NY; g.img=g.cv.getContext('2d').createImageData(LG_NX,LG_NY); }
  const d=g.img.data; for(let k=0;k<LG_NX*LG_NY;k++){ const o=k*4; if(!g.mask[k]){ d[o+3]=0; continue; } const c=lgColour(g,k); d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255; }
  g.cv.getContext('2d').putImageData(g.img,0,0); }
/* draw with petiole at (x,y), tip along ang; L length, W = half-width. o.fold squeezes it (rolled in a tube), o.label, o.trace dashed patch outline */
function lgDraw(ctx,g,x,y,ang,L,W,o){ o=o||{}; lgRender(g); const sq=o.fold===undefined?1:o.fold; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(1,sq);

  leafPath(ctx,L,W,0); ctx.save(); ctx.clip(); ctx.imageSmoothingEnabled=true; ctx.drawImage(g.cv,0,-W,L,2*W); ctx.restore();
  // veins
  ctx.save(); leafPath(ctx,L,W,0); ctx.clip(); ctx.globalAlpha=0.55; const vc=g.ext>0.6?'#a99d6a':'#2a6b36'; line(ctx,0,0,L*0.96,0,vc,1.6);
  for(let i=1;i<=6;i++){ const u=i/7.5; [1,-1].forEach(s=>{ ctx.strokeStyle=vc; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L*u,0); ctx.quadraticCurveTo(L*(u+0.07),s*W*leafHW(u)*0.5,L*(u+0.13),s*W*leafHW(u+0.13)*0.92); ctx.stroke(); }); }
  ctx.restore();

  if(o.trace){ ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.globalAlpha=o.trace;
    for(let j=0;j<LG_NY;j++) for(let i=0;i<LG_NX;i++){ const k=j*LG_NX+i; if(!g.mask[k]||g.chl[k]<0.5) continue; const X=(i+0.5)/LG_NX*L, Y=((j+0.5)/LG_NY*2-1)*W, cw=L/LG_NX, chh=2*W/LG_NY;
      const nb=(ii,jj)=>{ if(ii<0||jj<0||ii>=LG_NX||jj>=LG_NY) return false; const kk=jj*LG_NX+ii; return g.mask[kk]&&g.chl[kk]>=0.5; };
      ctx.beginPath(); if(!nb(i-1,j)){ ctx.moveTo(X-cw/2,Y-chh/2); ctx.lineTo(X-cw/2,Y+chh/2); } if(!nb(i+1,j)){ ctx.moveTo(X+cw/2,Y-chh/2); ctx.lineTo(X+cw/2,Y+chh/2); }
      if(!nb(i,j-1)){ ctx.moveTo(X-cw/2,Y-chh/2); ctx.lineTo(X+cw/2,Y-chh/2); } if(!nb(i,j+1)){ ctx.moveTo(X-cw/2,Y+chh/2); ctx.lineTo(X+cw/2,Y+chh/2); } ctx.stroke(); }
    ctx.restore(); }
  ctx.restore(); }
/* local (u 0..1 along, v −1..1 across) → world */
function lgPt(x,y,ang,L,W,u,v){ const lx=u*L, ly=v*W; return {x:x+Math.cos(ang)*lx-Math.sin(ang)*ly, y:y+Math.sin(ang)*lx+Math.cos(ang)*ly}; }
function lgDrop(g,u,v,amt,R){ R=R||0.09; for(let j=0;j<LG_NY;j++) for(let i=0;i<LG_NX;i++){ const k=j*LG_NX+i; if(!g.mask[k]) continue; const uu=(i+0.5)/LG_NX, vv=((j+0.5)/LG_NY)*2-1;
  const d=Math.hypot((uu-u)*1.8,(vv-v)*0.55); if(d<R) g.io[k]+=amt*(1-d/R); } }
/* iodine creeps through the wet leaf: explicit diffusion inside the mask; starch binds a little of it */
function lgDiffuse(g,dt,D){ D=D||0.9; const n=LG_NX*LG_NY, a=g.io, b=new Float32Array(n), s=Math.min(0.24,D*dt*LG_NX);
  for(let j=0;j<LG_NY;j++) for(let i=0;i<LG_NX;i++){ const k=j*LG_NX+i; if(!g.mask[k]){ continue; } let sum=0,c=0;
    const nb=[i>0?k-1:-1,i<LG_NX-1?k+1:-1,j>0?k-LG_NX:-1,j<LG_NY-1?k+LG_NX:-1]; for(const q of nb){ if(q>=0&&g.mask[q]){ sum+=a[q]; c++; } }

function lgMean(g,f,zone){ let s=0,c=0; for(let k=0;k<LG_NX*LG_NY;k++){ if(!g.mask[k]) continue; if(zone!==undefined&&g.zone[k]!==zone) continue; if(f(k)===null) continue; s+=f(k); c++; } return c?s/c:0; }

function lgBlue(g,filter){ return lgMean(g,k=>filter&&!filter(k)?null:ioLook(g.io[k])*smooth01(0.08,0.4,g.st[k])); }
function ioLook(io){ return 1-Math.exp(-Math.max(0,io)/0.12); }

function plateDraw(ctx,x,y,rx,ry){ ctx.save(); ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(60,-10); ctx.lineTo(60,8); ctx.quadraticCurveTo(20,8,-10,0); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  rrect(ctx,60,-10,56,18,5); ctx.fillStyle=rgba(COL.yellow,0.35); ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }

/* ---- lit matchstick: head at (x,y), stick back along ang; flame size f (1 = normal in air) ---- */
function matchLit(ctx,x,y,ang,f,t){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); line(ctx,0,0,90,0,'#b58a55',4); ctx.restore();
  circ(ctx,x,y,4,COL.red,COL.red,1); if(f>0.02){ ctx.save(); ctx.translate(x,y); flameOne(ctx,0,0,8+10*f,30*f,t,COL.yellow,COL.red); ctx.restore(); } }

/* =====================================================================
   10.1 LET US TEST SOME EXPLANATIONS — three pots for two weeks.
   Each pot runs potStep() (pot.js): soil water drains by evaporation +
   transpiration, turgor follows soil water, sugar = photosynthesis
   (light × chlorophyll × leaf area × turgor) − respiration, and growth
   is paid from that sugar. Chlorophyll breaks down in the dark (τ 4 d).
   Book result: A grows best, B wilts and dies, C is pale and weak.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  const potRow=(id,n,s,w)=>`<div class="var-row"><span class="vname">Pot ${n}</span><div class="toggle-group">
      <button class="toggle-btn small${s?' active':''}" id="${id}s">☀️ Sun</button><button class="toggle-btn small${w?' active':''}" id="${id}w">💧 Water</button></div></div>`;
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>What each pot gets</label>${potRow('pA','A',1,1)}${potRow('pB','B',1,0)}${potRow('pC','C',0,1)}</div>
    <div class="control-group"><label>Time speed <span class="val" id="spv">8 h/s</span></label><input type="range" id="sp" min="2" max="24" step="1" value="8">
      <div class="toggle-group"><button class="toggle-btn play" id="run">▶ Run 2 weeks</button><button class="toggle-btn" id="rst">↺ Restart</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Day',COL.ink)}${card('k2','Time',COL.yellow)}</div></div>
    <div class="control-group"><label>Table 10.1</label><div id="tbl"></div><div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const X=[150,400,650], NAMES=['A','B','C'], SC=17, RIM=366, GROUND=462;
  let pots, hr, running=false, speed=8, t=0, obsMsg='', cans, falls, lastTbl='';
  const cfg=[[1,1],[1,0],[0,1]];
  function reset(){ pots=cfg.map(c=>potNew(c[0],c[1])); hr=8; cans=pots.map(()=>({ph:-1,a:0})); falls=[]; pots.forEach((p,i)=>{ p.cover=spr(p.sun?0:1); p.day1={H:p.H,L:p.leaves.length}; p.lastL=p.leaves.length; }); running=false; }
  reset();
  ['pA','pB','pC'].forEach((id,i)=>{ $('#'+id+'s').onclick=e=>{ cfg[i][0]^=1; pots[i].sun=cfg[i][0]; e.target.classList.toggle('active',!!cfg[i][0]); };
    $('#'+id+'w').onclick=e=>{ cfg[i][1]^=1; pots[i].water=cfg[i][1]; e.target.classList.toggle('active',!!cfg[i][1]); }; });
  $('#sp').oninput=e=>{ speed=+e.target.value; $('#spv').textContent=speed+' h/s'; };
  $('#run').onclick=()=>{ if(hr>=8+24*14) reset(); running=!running; };
  $('#rst').onclick=()=>reset();

  animLoop(dt=>{ t+=dt;
    // ---- advance the model in quarter-hour steps; the watering can pours at 7 am ----
    if(running){ let adv=speed*dt; while(adv>1e-6){ const d=Math.min(0.25,adv); const before=hr%24; hr+=d; adv-=d;
        pots.forEach((p,i)=>{ if(p.water&&before<7&&hr%24>=7&&!p.dead) cans[i].ph=0; potStep(p,hr,d); }); }
      if(hr>=8+24*14){ hr=8+24*14; running=false; } }
    pots.forEach((p,i)=>{ const c=cans[i]; if(c.ph>=0){ c.ph+=dt; if(c.ph>0.5&&c.ph<1.4) p.W=Math.min(1,p.W+dt*0.9); if(c.ph>1.9) c.ph=-1; }
      c.a=approach(c.a,c.ph>=0?1:0,10,dt);
      springTo(p.cover,p.sun?0:1,40,9,dt);
      while(p.lastL>p.leaves.length){ p.lastL--; falls.push({x:X[i]+(Math.random()-0.5)*20,y:RIM-30,vx:(Math.random()-0.5)*30,vy:0,a:0,va:(Math.random()-0.5)*4,col:mixCol(LEAF_Y,LEAF_DRY,0.3),rest:false}); }
      p.lastL=p.leaves.length; });
    falls.forEach(f=>{ if(f.rest) return; f.vy+=260*dt; f.vy*=Math.exp(-3.5*dt); f.vx+=Math.sin(t*5+f.a)*40*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.a+=f.va*dt; if(f.y>GROUND-3){ f.y=GROUND-3; f.rest=true; } });

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,520]);
    const sk=skyDraw(ctx,14,12,786,300,hr,t);
    tableTop(ctx,10,790,GROUND,0);
    pots.forEach((p,i)=>{ const x=X[i];
      // sunlight reaching the plant (blocked by the dark box)
      if(sk.sx!==undefined&&sk.I>0.05&&p.cover.x<0.5){ ctx.save(); ctx.globalAlpha=0.55*sk.I*(1-p.cover.x*2); ctx.setLineDash([6,7]); ctx.lineDashOffset=-t*30; [-26,0,26].forEach(dx=>line(ctx,sk.sx,sk.sy,x+dx,RIM-p.H*SC*0.6,COL.yellow,1.8)); ctx.restore(); }
      rulerV(ctx,x+58,RIM,16,SC);
      potDraw(ctx,x,RIM,48,GROUND-RIM,p.W,{label:NAMES[i]});
      saplingDraw(ctx,x,RIM+2,p,SC,t);
      // water meter
      meterV(ctx,x-82,RIM+14,10,70,p.W,COL.blue);
      if(i===0) textAt(ctx,'soil water',x-77,RIM+100,{align:'center',size:9.5,weight:600,color:COL.blue});
      // watering can
      const c=cans[i]; if(c.a>0.02&&p.cover.x<0.5){ const tilt=c.ph<0.4?smooth01(0,0.4,c.ph)*0.55:c.ph<1.5?0.55:0.55*(1-smooth01(1.5,1.9,c.ph)); const sx=x+34, sy=RIM-128;
        wateringCan(ctx,sx,sy,tilt,c.a); if(c.ph>0.45&&c.ph<1.5) streamDraw(ctx,sx-2,sy+2,-40,RIM,t,1); }
      // dark box lowers over the pot
      const cy=-360*(1-p.cover.x); if(p.cover.x>0.01){ ctx.save(); ctx.translate(0,cy); rrect(ctx,x-110,48,220,GROUND-48,8); ctx.fillStyle='rgba(22,34,52,0.72)'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke();
        textAt(ctx,'dark box (front cut away)',x,72,{align:'center',size:11,weight:600,color:'#c9d4e2'}); ctx.restore(); }
      // leaf count tag
      const alive=p.leaves.filter(l=>l.dry<0.9).length; tag(ctx,(p.dead?'dead · ':'')+fmt(p.H,1)+' cm · '+alive+' leaves',x,GROUND+22,p.dead?COL.red:COL.green,{size:11});
    });
    falls.forEach(f=>leafSimple(ctx,f.x,f.y,f.a,16,6,rgba(f.col,0.4),f.col,{}));
    ctx.restore();

    // ---------- side ----------
    const T=hr24(hr); setv($,'k1',String(Math.min(15,T.d+1))+(hr>=8+24*14?' (2 weeks)':'')); setv($,'k2',T.str+(sunAt(hr)>0?' ☀️':' 🌙'));
    setBtn($('#run'),running?'⏸ Pause':(hr>=8+24*14?'▶ Run again':'▶ Run 2 weeks'),running?'':'play');
    const colName=p=>p.dead?'Brown · dry':(p.chl<0.55?'Yellow':'Green'); const yn=v=>v?{v:'Yes',c:'r-ok'}:{v:'No',c:'r-bad'};
    const done=hr>=8+24*14; const rows=pots.map((p,i)=>[NAMES[i],yn(p.sun),yn(p.water),fmt(p.day1.H,1)+' → '+(hr>8?fmt(p.H,1):'?'),p.day1.L+' → '+(hr>8?p.leaves.filter(l=>l.dry<0.9).length:'?'),{v:colName(p),c:p.dead?'r-bad':p.chl<0.55?'r-warn':'r-ok'}]);
    const html=logTable(['Pot','Sun','Water','Height cm','Leaves','Colour'],rows); if(html!==lastTbl){ lastTbl=html; $('#tbl').innerHTML=html; }
    let msg=''; const A=pots[0];
    if(done){ const best=pots.reduce((b,p,i)=>p.H*(p.dead?0:1)*(p.chl+0.2)>pots[b].H*(pots[b].dead?0:1)*(pots[b].chl+0.2)?i:b,0);
      msg=cfg.join()===[[1,1],[1,0],[0,1]].join()?'ok|A grew best. B died without water, C turned yellow in the dark. Plants need both sunlight and water.':'ok|Pot '+NAMES[best]+' grew best — it had '+(pots[best].sun?'sunlight':'no sun')+' and '+(pots[best].water?'water':'no water')+'.'; }
    else if(pots.some(p=>p.T<0.5&&!p.dead)) msg='warn|Wilting — the soil is too dry to keep the leaves stiff.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}

/* =====================================================================
   10.2 LET US CHECK — the starch test.
   Real heating: 150 mL water, spirit lamp ≈150 W, C = 630 J/K, loss 0.7 W/K
   → boils in ≈5 min; clock runs 60× (1 s = 1 min).
   Softening in boiling water: 5 min. Alcohol (boils at 78 °C) sits in the
   hot-water bath: it warms with τ = 0.5 min and pulls chlorophyll out at
   k = 0.38/min · e^((T−78)/12) — ≈ 95 % gone in 8 min.
   Iodine drops diffuse through the wet leaf; where there is starch the
   cells go blue-black, elsewhere they stay iodine-brown.
   ===================================================================== */
const BENCH={beak:{x0:140,x1:320,top:190,bot:330}, gauze:333, table:470, lampX:230};
function benchHeat(B,dt){ // dt in sim minutes
  const P=B.lamp>0.5?150:0, s=dt*60; B.T+= (P - 0.7*(B.T-25))*s/630; if(B.T>=100){ B.boil=clamp((P-0.7*75)/100,0,1); B.T=100; } else B.boil=0;
  B.Ta=B.inBath>0.9? B.T+(B.Ta-B.T)*Math.exp(-dt/0.5) : B.Ta+(25-B.Ta)*(1-Math.exp(-dt/3)); B.Ta=Math.min(B.Ta,78.4); }
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Steps</label>
      <div class="toggle-group"><button class="toggle-btn" id="s1">1 · 🔥 Boil the leaf (5 min)</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s2">2 · 🧪 Alcohol in a hot-water bath</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s3">3 · 🍽️ Spread leaf on a plate</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s4">4 · 💧 Add iodine drops</button></div>
      <div class="toggle-group"><button class="toggle-btn navy" id="again">↺ New leaf</button></div>
      <div class="var-row"><span class="vname">Alcohol step</span><div class="toggle-group"><button class="toggle-btn small active" id="doA">Do it</button><button class="toggle-btn small" id="skipA">Skip it</button></div></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Water',COL.red)}${card('k2','Alcohol',COL.red)}${card('k3','Clock',COL.ink)}${card('k4','Green washed out',COL.green)}</div></div>
    <div class="control-group"><div class="result-cards">${card('k5','Leaf after iodine',COL.ink)}</div><div class="fb" id="obs" style="display:none"></div>
      <div class="hint">Caution: alcohol catches fire easily — it is warmed only inside hot water, never over the flame.</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let t=0, B, g, L, seq, obsMsg='', drops, skipAlc=false, fps;
  const TUBE_RACK={x:372,top:176}, TUBE_BATH={x:236,top:150};
  function reset(){ B={T:30,Ta:25,lamp:0,flame:0,boil:0,inBath:0,min:0,clock:false,tube:{...TUBE_RACK},alcGreen:0,bubbles:[],abubs:[],rings:[]};
    g=lgNew({starch:0.65}); L={mode:'held',from:null,to:null,u:0}; seq=seqNew(); drops=[]; fps={x:120,y:120,ang:-2.3,grip:1,a:0}; B.dropper={x:748,y:118,sq:0,fill:1}; B.steps=[0,0,0,0]; }
  reset();
  // ---- slots the leaf can sit in ----
  function slot(n){ const bk=BENCH.beak, bob=Math.sin(t*9)*B.boil*3;
    if(n==='held') return {x:92,y:132,ang:-0.15,len:120,W:34,fold:1};
    if(n==='water') return {x:170,y:300+bob,ang:-0.22+Math.sin(t*4)*0.05*B.boil,len:118,W:30,fold:0.34};
    if(n==='tube') return {x:B.tube.x,y:B.tube.top+132,ang:-Math.PI/2,len:92,W:11,fold:1};
    if(n==='plate') return {x:500,y:318,ang:0,len:210,W:58,fold:1};
  }
  function leafPose(){ if(L.mode!=='moving') return slot(L.mode); const a=slot(L.from), b=slot(L.to), e=ease(L.u), lift=Math.sin(Math.PI*e)*90;
    return {x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e)-lift,ang:a.ang+angDiff(b.ang,a.ang)*e,len:lerp(a.len,b.len,e),W:lerp(a.W,b.W,e),fold:lerp(a.fold,b.fold,e)}; }
  const moveLeaf=(to,d)=>({d, start(){ L.from=L.mode==='moving'?L.to:L.mode; L.to=to; L.mode='moving'; L.u=0; }, f(u){ L.u=u; if(u>=1) L.mode=to; }});
  const lampOn=()=>act(()=>{ B.lamp=1; B.clock=true; });
  function busy(){ return seqBusy(seq); }
  $('#s1').onclick=()=>{ if(busy()||L.mode!=='held') return; seq.list.push(lampOn(), mv(fps,{a:1},0.3), moveLeaf('water',1.4), mv(fps,{a:0},0.3), act(()=>B.steps[0]=1)); };
  $('#s2').onclick=()=>{ if(busy()||L.mode!=='water') return; if(skipAlc){ return; }
    seq.list.push(moveLeaf('tube',1.4), wt(0.2), mv(B.tube,{x:TUBE_BATH.x,top:TUBE_BATH.top-40},0.9), mv(B.tube,{top:TUBE_BATH.top},0.6), act(()=>{ B.inBath=1; B.steps[1]=1; })); };
  $('#s3').onclick=()=>{ if(busy()) return; if(L.mode==='tube'){ seq.list.push(act(()=>B.inBath=0), mv(B.tube,{top:TUBE_BATH.top-60},0.6), mv(B.tube,{x:TUBE_RACK.x,top:TUBE_RACK.top-40},0.9), mv(B.tube,{top:TUBE_RACK.top},0.4), moveLeaf('plate',1.4), act(()=>B.steps[2]=1)); }
    else if(L.mode==='water'&&skipAlc){ seq.list.push(moveLeaf('plate',1.4), act(()=>B.steps[2]=1)); }
    else if(L.mode==='held'){ seq.list.push(moveLeaf('plate',1.4), act(()=>B.steps[2]=1)); } };
  const spots=[[0.3,0.25],[0.55,-0.3],[0.72,0.2],[0.45,0.0],[0.2,-0.3]];
  $('#s4').onclick=()=>{ if(busy()||L.mode!=='plate') return; const P=slot('plate');
    spots.forEach(([u,v],i)=>{ const q=lgPt(P.x,P.y,P.ang,P.len,P.W,u,v);
      seq.list.push(mv(B.dropper,{x:q.x,y:q.y-90},0.55), mv(B.dropper,{sq:1},0.25), act(()=>drops.push({x:q.x,y:q.y-86,vy:0,u,v,ty:q.y})), mv(B.dropper,{sq:0},0.2)); });
    seq.list.push(mv(B.dropper,{x:748,y:118},0.6), act(()=>B.steps[3]=1)); };
  $('#again').onclick=()=>reset();
  chipsWire(wrap,'#doA,#skipA',b=>{ skipAlc=b.id==='skipA'; });

  animLoop(dt=>{ t+=dt; seqRun(seq,dt);
    const dm=B.clock?dt:0; B.min+=dm; benchHeat(B,dm);
    B.flame=approach(B.flame,B.lamp,4,dt);
    if(L.mode==='water'){ g.soft=Math.min(1,g.soft+dm/5*smooth01(80,99,B.T)); }
    if(L.mode==='tube'&&B.inBath>0.5){ const k=0.38*Math.exp((B.Ta-78)/12)*(0.3+0.7*g.soft)*smooth01(35,70,B.Ta); const d=g.ext; g.ext=1-(1-g.ext)*Math.exp(-k*dm); B.alcGreen+=(g.ext-d); }
    // bubbles in the water (boiling) and in the alcohol (simmering)
    const bk=BENCH.beak, surf=bk.top+44;
    if(B.boil>0&&Math.random()<B.boil*dt*30) bubAdd(B.bubbles,bk.x0+14+Math.random()*(bk.x1-bk.x0-28),bk.bot-8,2+Math.random()*3,0);
    if(B.T>70&&B.boil===0&&Math.random()<dt*6*(B.T-70)/30) bubAdd(B.bubbles,bk.x0+20+Math.random()*(bk.x1-bk.x0-40),bk.bot-6,1.5,0);
    bubStep(B.bubbles,dt,surf,bk.x0,bk.x1,B.rings);
    if(B.inBath>0.5&&B.Ta>76&&Math.random()<dt*14) bubAdd(B.abubs,B.tube.x+(Math.random()-0.5)*14,B.tube.top+140,1.6+Math.random(),0);
    bubStep(B.abubs,dt,B.tube.top+56,B.tube.x-15,B.tube.x+15);
    drops.forEach(d=>{ d.vy+=900*dt; d.y+=d.vy*dt; if(d.y>=d.ty){ d.dead=true; lgDrop(g,d.u,d.v,2.2,0.2); drip(); } }); drops=drops.filter(d=>!d.dead);
    if(g.io.some(v=>v>0)) for(let k=0;k<2;k++) lgDiffuse(g,dt*0.5,0.14);

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,520]);
    tableTop(ctx,10,790,BENCH.table,0);
    // lamp + tripod + gauze + beaker
    tripod(ctx,bk.x0+90,BENCH.gauze+3,BENCH.table,150); gauze(ctx,bk.x0+90,BENCH.gauze,190);
    spiritLamp(ctx,BENCH.lampX,BENCH.table,t,false); if(B.flame>0.02) flameOne(ctx,BENCH.lampX,BENCH.table-80,20*B.flame,62*B.flame,t,COL.yellow,COL.blue);
    if(B.flame>0.3) for(let i=0;i<3;i++) heatWave(ctx,bk.x0+50+i*40,BENCH.gauze-6,26,-Math.PI/2,COL.red,t+i,0.5*B.flame,3);
    // water
    ctx.save(); ctx.beginPath(); ctx.rect(bk.x0,surf,bk.x1-bk.x0,bk.bot-surf); ctx.fillStyle=rgba(COL.blue,0.12+0.05*B.boil); ctx.fill();
    const wob=B.boil*2.5; ctx.beginPath(); for(let x=bk.x0;x<=bk.x1;x+=6) ctx.lineTo(x,surf+Math.sin(x*0.2+t*12)*wob); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    bubDraw(ctx,B.bubbles,COL.blue,B.rings);
    if(B.boil>0.1){ for(let i=0;i<4;i++){ const u=((t*0.5+i/4)%1); ctx.save(); ctx.globalAlpha=0.35*(1-u)*B.boil; circ(ctx,bk.x0+40+i*34+Math.sin(t+i)*6,surf-10-u*60,5+u*10,COL.mid,null,1.4); ctx.restore(); } }
    // leaf (behind glass edges)
    const LP=leafPose(); const onPlate=L.mode==='plate'||(L.mode==='moving'&&L.to==='plate'&&L.u>0.95);
    // plate first
    plateDraw(ctx,604,318,170,128);
    // test tube (alcohol level + green colour) — drawn after leaf when leaf is inside
    const drawTube=()=>{ const tb=B.tube; testTube(ctx,tb.x,tb.top,tb.top+150,15,{level:tb.top+56,liq:rgba(mixCol('#f7f7ff',LEAF_G,clamp(B.alcGreen,0,1)*0.9),0.75),surf:mixCol(COL.mid,LEAF_G,clamp(B.alcGreen,0,1)),
      inside:()=>{ if(L.mode==='tube') lgDraw(ctx,g,LP.x,LP.y,LP.ang,LP.len,LP.W,{fold:LP.fold}); bubDraw(ctx,B.abubs,COL.mid); }});
      textAt(ctx,'alcohol',tb.x+22,tb.top+72,{size:11,weight:600,color:COL.muted}); };
    if(L.mode!=='tube') lgDraw(ctx,g,LP.x,LP.y,LP.ang,LP.len,LP.W,{fold:LP.fold});
    beakerDraw(ctx,(bk.x0+bk.x1)/2,bk.top,bk.bot,bk.x1-bk.x0);
    labThermo(ctx,bk.x0+22,bk.top-40,bk.bot-40,B.T,20,110,{step:10,labels:false,r:7,w:10});
    tag(ctx,Math.round(B.T)+' °C',bk.x0+22,bk.top-54,COL.red,{size:11});
    // tube rack
    rect(ctx,TUBE_RACK.x-26,TUBE_RACK.top+88,52,10,COL.ink,'#fff',2); line(ctx,TUBE_RACK.x-22,TUBE_RACK.top+98,TUBE_RACK.x-22,BENCH.table,COL.ink,2.4); line(ctx,TUBE_RACK.x+22,TUBE_RACK.top+98,TUBE_RACK.x+22,BENCH.table,COL.ink,2.4);
    drawTube();
    forceps(ctx,LP.x+6,LP.y,-2.5,1,fps.a);
    // dropper + iodine bottle
    rrect(ctx,726,100,44,60,6); ctx.fillStyle=rgba(IODINE,0.25); ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); textAt(ctx,'iodine',748,176,{align:'center',size:11,weight:600,color:COL.muted});
    drops.forEach(d=>dropShape(ctx,d.x,d.y,4,IODINE,1.3));

   10.3 LET US CHECK — does starch form without sunlight / chlorophyll?
   Every cell of each leaf keeps its own starch:
     d(starch)/dt = 0.25/h · light · chlorophyll · (1 − starch/1.2) − starch/8 h

   In the dark for 36 h: 0.4·e^(−36/8) = 0.004 → iodine shows nothing.

/* =====================================================================
   10.7 LET US EXPERIMENT — water climbs the stem in the xylem.
   Transpiration of one twig: E = 1.5 mL/h · VPD(T)/VPD(25 °C) · L

  const N=30; ctx.strokeStyle=LEAF_G; ctx.lineWidth=7; ctx.beginPath(); for(let k=0;k<=N;k++){ const q=P(k/N); k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); } ctx.stroke();

      textAt(ctx,i?'lime water alone':'joined to flask',l.x,TB+36,{align:'center',size:11.5,weight:700,color:COL.muted}); });
    // cloth over the flask while it waits in the dark
    if(S.dark.x>0.01){ const y=-460*(1-S.dark.x); rrect(ctx,FX-150,40+y,300,FBOT-38,14); ctx.fillStyle='rgba(22,34,52,0.8)'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); textAt(ctx,'dark · '+Math.floor(S.hr)+' h',FX,64+y,{align:'center',size:12,weight:700,color:'#c9d4e2'}); }
    // lens: one seed breathing
    const sd=S.seeds[5]; lensView(ctx,420,110,70,sd.x,sd.y,()=>{ ctx.save(); ctx.translate(420,110); ctx.beginPath(); ctx.ellipse(0,0,34,22,0,0,Math.PI*2); ctx.fillStyle=kind==='b'?'#e3d8b6':'#cfe9c6'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
      textAt(ctx,'glucose',0,4,{align:'center',size:10.5,weight:700,color:COL.green});
      S.mols.forEach((m,i)=>{ const a=i*1.7; if(m.k===1) molDot(ctx,Math.cos(a)*(64-40*m.u),Math.sin(a)*(64-40*m.u)*0.8,a,1,1.1); else molDot(ctx,Math.cos(a+0.8)*(26+40*m.u),Math.sin(a+0.8)*(26+40*m.u)*0.8,a,2,1.1); });
      if(rr>0.05&&S.run) for(let k=0;k<5;k++){ const a=t*2+k*1.26; ctx.globalAlpha=0.5+0.5*Math.sin(t*6+k); line(ctx,Math.cos(a)*14,Math.sin(a)*9,Math.cos(a)*20,Math.sin(a)*13,COL.yellow,2); } ctx.restore(); },{label:'one seed · O₂ in, CO₂ out',col:COL.ink});
    ctx.restore();

    // ---------- side ----------
    const pc=v=>fmt(100*v/S.air,v/S.air<0.01?2:1)+' %'; const look=o=>o<0.08?'clear':o<0.35?'slightly cloudy':o<0.75?'milky':'very milky';
    setv($,'k1',Math.floor(S.hr)+' / 24'); setv($,'k2',pc(S.o2)); setv($,'k3',pc(S.co2)); setv($,'k4',Math.round(S.pushed)+' mL'); setv($,'k5',look(S.lime[0].op)); setv($,'k6',look(S.lime[1].op));
    setBtn($('#run'),S.run?'⏸ Pause':(S.hr>=24?'✓ 24 hours over':'▶ Leave 24 h in the dark'),S.run?'':'play');
    let msg=''; const op=S.lime[0].op;
    if(S.pushed>=99&&op>0.35) msg='ok|Milky! The seeds breathed out carbon dioxide. The lime water on its own stays clear.';
    else if(S.pushed>=99) msg=kind==='b'?'warn|Still clear — boiled seeds are dead and do not respire.':kind==='d'?'warn|Only a trace of CO₂ — dry seeds respire very slowly.':'warn|Barely cloudy — leave the seeds longer first.';
    else if(S.hr>=24) msg='ok|24 h over. Pour water down tube A to push the flask air into the lime water.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}

];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
