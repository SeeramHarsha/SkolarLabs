/* =====================================================================
   5.5 FLOATING RING MAGNET
   Near-field force between facing ring magnets (gap d):
        F = ± C / (d + ε)³       (+ like poles repel, − unlike poles attract)
   C is set so a 25 g magnet floats at d₀ = 2.8 cm.  Top magnet:
        m·d″ = F − m·g − c·d′     (c = small friction on the stick)
   Floating gap:  d = (C / m g)^(1/3) − ε  → coins make it float lower.
   Bounce period ≈ 2π·√(d/3g) ≈ 0.2 s, so it is shown in slow motion ×0.2.
   ===================================================================== */
function ringMagnet(ctx,cx,yb,W,T,topPole,scaleY){
  // yb = bottom face (px); topPole 'N'|'S'; scaleY for flip animation
  const s=scaleY===undefined?1:scaleY, hT=T*Math.abs(s), yTop=yb-hT, hole=W*0.24;
  const up=s>=0?topPole:(topPole==='N'?'S':'N'), dn=up==='N'?'S':'N';
  const cU=up==='N'?COL.red:COL.blue, cD=dn==='N'?COL.red:COL.blue;
  const fU=up==='N'?'#fdece7':'#e6f1fc', fD=dn==='N'?'#fdece7':'#e6f1fc';
  for(const side of [-1,1]){
    const x0=side<0?cx-W/2:cx+hole/2, ww=W/2-hole/2;
    rect(ctx,x0,yTop,ww,hT/2,cU,fU,2.2); rect(ctx,x0,yTop+hT/2,ww,hT/2,cD,fD,2.2);
  }
  if(hT>14){
    textAt(ctx,up,cx-W/2+W*0.18,yTop+hT*0.25+5,{align:'center',size:Math.min(14,hT*0.4),weight:700,color:cU});
    textAt(ctx,dn,cx-W/2+W*0.18,yTop+hT*0.75+5,{align:'center',size:Math.min(14,hT*0.4),weight:700,color:cD});
    textAt(ctx,up,cx+W/2-W*0.18,yTop+hT*0.25+5,{align:'center',size:Math.min(14,hT*0.4),weight:700,color:cU});
    textAt(ctx,dn,cx+W/2-W*0.18,yTop+hT*0.75+5,{align:'center',size:Math.min(14,hT*0.4),weight:700,color:cD});
  }
}
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Top magnet</label>
      <button class="toggle-btn play" id="push" style="width:100%;padding:9px;">👇 Push it down, let go</button>
      <button class="toggle-btn navy" id="flip">⟲ Flip the top magnet</button></div>
    <div class="control-group"><label>Coins on top <span class="val" id="cV"></span></label><input type="range" id="cR" min="0" max="6" step="1" value="0"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Poles facing</div><div class="rval" id="r0">—</div></div>
      <div class="rcard"><div class="rlabel">Gap</div><div class="rval" id="r1" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Magnetic force</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Weight</div><div class="rval" id="r3" style="color:var(--f-red)">—</div></div></div>
      <div class="fb" id="fbk"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), cR=$('#cR');
  const T=0.015, D=0.06, ST=0.13, EPS=0.004, M0=0.025, D0=0.028, C=M0*G*Math.pow(D0+EPS,3), SLOW=0.2;
  let like=true, t=0;
  const S={d:0.12, v:0, fing:null, flip:null};
  $('#push').onclick=()=>{ if(!S.fing&&!S.flip) S.fing={T:0,y:null}; };
  $('#flip').onclick=()=>{ if(!S.flip&&!S.fing) S.flip={T:0,d0:S.d}; };

  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    const n=+cR.value; $('#cV').textContent=n+' × 5 g';
    const m=M0+n*0.005, mg=m*G;
    const Fm=d=>(like?1:-1)*C/Math.pow(Math.max(d,0)+EPS,3);
    const dMax=ST-2*T-0.004;
    let hold=null, Fhand=0;
    // finger push: comes down (0–0.5 s), presses to 6 mm (0.5–1.4 s), holds, lets go at 1.9 s
    if(S.fing){ const f=S.fing; f.T+=dt0;
      const dStart=Math.min(S.d,dMax), press=lerp(dStart,0.006,smooth01(0.5,1.4,f.T));
      if(f.T<1.9){ if(f.T>0.45){ hold=Math.min(S.d,press); } }
      if(f.T>2.6) S.fing=null;
      f.y=f.T<0.5?lerp(dMax+0.05,S.d,smooth01(0,0.5,f.T)):f.T<1.9?(hold!==null?hold:S.d):S.d+(f.T-1.9)*0.18;
    }
    // flip: lift off the stick, turn over, set back on top and let go
    let flipScale=1, liftD=null;
    if(S.flip){ const f=S.flip; f.T+=dt0;
      const up=dMax+0.025;
      if(f.T<0.6) liftD=lerp(f.d0,up,smooth01(0,0.6,f.T));
      else if(f.T<1.3){ liftD=up; flipScale=Math.cos(Math.PI*smooth01(0.6,1.3,f.T)); if(f.T>0.95 && !f.sw){ f.sw=true; like=!like; } }
      else if(f.T<1.7){ liftD=lerp(up,dMax,smooth01(1.3,1.7,f.T)); flipScale=-1; }
      else { S.flip=null; S.d=dMax; S.v=0; }
      if(f.T>=0.95&&f.T<1.7) flipScale=-flipScale;
      if(liftD!==null){ S.d=liftD; S.v=0; }
    }
    if(liftD===null){
      // integrate with small sub-steps (stiff near contact)
      const nsub=8, h2=dt/nsub, c=2*0.06*m*Math.sqrt(3*G/(D0+EPS));
      for(let i=0;i<nsub;i++){
        const a=(Fm(S.d)-mg-c*S.v)/m; S.v+=a*h2; S.d+=S.v*h2;
        if(S.d<0){ S.d=0; S.v=S.v<-0.08?-S.v*0.25:0; }
        if(S.d>dMax){ S.d=dMax; S.v=Math.min(0,S.v); }
        if(hold!==null && S.d>hold){ S.d=hold; S.v=Math.min(0,S.v); }
      }
      if(hold!==null) Fhand=Math.max(0,Fm(S.d)-mg);
    }

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=h*0.8/(ST+0.03), baseY=h*0.9, cx=w*0.42, Y=ym=>baseY-ym*ppm;
    // table + stick
    rect(ctx,w*0.08,baseY,w*0.72,16,COL.ink,'#fbf6ec',2.4);
    rect(ctx,cx-4,Y(ST),8,ST*ppm,COL.ink,'#fdf6e6',2);
    const Wp=D*ppm, Tp=T*ppm;
    ringMagnet(ctx,cx,Y(0),Wp,Tp,'N',1);
    const yb=Y(T+S.d);
    ringMagnet(ctx,cx,yb,Wp,Tp,like?'S':'N',flipScale);
    // coins
    for(let i=0;i<n;i++){ ctx.save(); ctx.beginPath(); ctx.ellipse(cx+Wp*0.28,yb-Tp*Math.abs(flipScale)-3-i*4.5,Wp*0.13,3.4,0,0,Math.PI*2); ctx.fillStyle='#fff8e6'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
    // finger
    if(S.fing && S.fing.y!==null) handDown(ctx,cx-Wp*0.28,Y(T+S.fing.y+T),150);
    if(S.flip && liftD!==null) hand(ctx,cx+Wp/2+14,yb-Tp/2,-1,150,-0.1);
    // gap dimension
    const gx=cx-Wp/2-28;
    if(S.d>0.002){ line(ctx,gx,Y(T),gx,yb,COL.yellow,2); arrowHead(ctx,gx,Y(T),Math.PI/2,COL.yellow,6); arrowHead(ctx,gx,yb,-Math.PI/2,COL.yellow,6);
      textAt(ctx,fmt(S.d*100,1)+' cm',gx-8,(Y(T)+yb)/2+4,{align:'right',size:13,weight:700,color:COL.yellow}); }
    // forces on the top magnet
    const fx=cx+Wp/2+30, fy=yb-Tp/2, Fk=70/(M0*G);
    const Fnow=S.d<=0.0005&&!like? -mg : (liftD===null?Fm(S.d):0);
    const wl=mg*Fk; vec(ctx,fx,fy,fx,fy+wl,COL.red,3);
    textAt(ctx,'weight '+fmt(mg,2)+' N',fx+8,fy+wl*0.6+4,{size:12,weight:700,color:COL.red});
    if(liftD===null){ const Fshow=clamp(Fm(S.d)*Fk,-150,150); if(Math.abs(Fshow)>4){ vec(ctx,fx,fy-Tp*0.1,fx,fy-Tp*0.1-Fshow,COL.blue,3);
      textAt(ctx,(like?'push apart ':'pull together ')+fmt(Math.abs(Fm(S.d)),2)+' N',fx+8,fy-Tp*0.1-Fshow*0.6+4,{size:12,weight:700,color:COL.blue}); } }
    if(Fhand>0.01) force(ctx,cx-Wp*0.28,yb-Tp-70,0,Math.min(60,Fhand*Fk),COL.yellow,'');
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});

    $('#r0').textContent=like?'Like poles':'Unlike poles';
    $('#r1').textContent=fmt(S.d*100,1)+' cm';
    $('#r2').textContent=liftD===null?fmt(Math.abs(Fm(S.d)),2)+' N':'—';
    $('#r3').textContent=fmt(mg,2)+' N';
    const fb=$('#fbk');
    if(S.fing&&Fhand>0.01){ fb.className='fb warn'; fb.textContent='You feel it push back: '+fmt(Fhand,2)+' N'; }
    else if(like){ fb.className='fb ok'; fb.textContent='Floats — no contact needed'; }
    else { fb.className='fb bad'; fb.textContent='Pulled down — sticks to the lower magnet'; }
  });
  return wrap;
}

/* =====================================================================
   5.6 CHARGED SCALE PICKS UP PAPER
   Each rub stroke adds charge:  Q ← Q + (1 − Q)·0.22   (saturates)
   Charge slowly leaks away:     Q(t) = Q₀·e^(−t/40 s)
   A charged scale pulls an uncharged scrap (induced charge) with a
   force that grows very fast as the gap r shrinks:
        a = g·[ Q²·(3 cm / r)⁴ / s − 1 ] − k·v|v|   (s = scrap heaviness,
                                                      k = air drag on paper)
   → a scrap jumps only when that pull beats its weight. Slow motion ×0.3.
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">
      <button class="toggle-btn play" id="rub" style="width:100%;padding:9px;">✋ Rub with polythene</button>
      <button class="toggle-btn navy" id="tch">☝ Touch it with a finger</button></div>
    <div class="control-group"><label>Scale height above paper <span class="val" id="hV"></span></label><input type="range" id="hR" min="1" max="9" step="0.1" value="6"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Charge on scale</div><div class="rval" id="r1" style="color:var(--f-red)">0%</div></div>
      <div class="rcard"><div class="rlabel">Scraps lifted</div><div class="rval" id="r2" style="color:var(--f-green)">0</div></div></div>
      <div class="hint">Lower the scale slowly after rubbing.</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR');
  const SLOW=0.3, DREF=3, KD=0.1, L=30;
  let Q=0, t=0, rub=null, touch=null, Hs=6;
  const R=rng(12), bits=[];
  for(let i=0;i<12;i++) bits.push({x:-6.4+i*1.15+(R()-0.5)*0.3, y:0, vy:0, s:0.55+R()*0.9, rot:(R()-0.5)*0.6, wr:(R()-0.5)*2, sz:0.7+R()*0.5, stuck:false, pts:[[-1,-0.35],[1,-0.5+R()*0.2],[0.9,0.4],[-0.8,0.45]].map(p=>[p[0]*(0.8+R()*0.3),p[1]])});
  $('#rub').onclick=()=>{ if(!rub&&!touch) rub={T:0,k:0}; };
  $('#tch').onclick=()=>{ if(!rub&&!touch) touch={T:0}; };

  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    Hs=approach(Hs,+hR.value,6,dt0); $('#hV').textContent=fmt(+hR.value,1)+' cm';
    // rubbing: 8 strokes in 2.4 s
    let rubX=null;
    if(rub){ rub.T+=dt0; const k=Math.floor(rub.T/0.3); if(k>rub.k){ rub.k=k; Q+=(1-Q)*0.22; } rubX=0.5+Math.sin(rub.T/0.3*Math.PI)*4.5; if(rub.T>2.4) rub=null; }
    if(touch){ touch.T+=dt0; if(touch.T>0.4&&touch.T<0.7) Q*=Math.exp(-dt0*25); if(touch.T>1.2) touch=null; }
    Q*=Math.exp(-dt/40);
    // scraps
    let lifted=0;
    bits.forEach(b=>{
      const dx=Math.max(0,-7.5-b.x), gap=Math.hypot(Math.max(0.05,Hs-0.25-b.y),dx);
      const pull=Q*Q*Math.pow(DREF/gap,4)/b.s;
      if(b.stuck){ if(pull<1.05||Hs-0.25-b.y>0.4){ b.stuck=false; } else { b.y=Hs-0.25-0.02; b.vy=0; lifted++; return; } }
      let a=G*100*(Math.min(pull,400)-1)-KD*b.vy*Math.abs(b.vy);
      if(b.y<=0 && a<=0){ b.y=0; b.vy=0; b.rot=approach(b.rot,b.rot>0?0.05:-0.05,4,dt); return; }
      b.vy+=a*dt; b.y+=b.vy*dt; b.rot+=b.wr*b.vy*dt*0.08;
      if(b.y<0){ b.y=0; b.vy=0; }
      if(b.y>=Hs-0.27){ b.y=Hs-0.27; b.vy=0; b.stuck=true; }
      if(b.y>0.05) lifted++;
    });

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w*0.92/16,h*0.7/9.5), tY=h*0.86, X=x=>w*0.06+(x+8)*pc, Y=y=>tY-y*pc;
    rect(ctx,X(-8),tY,w,16,COL.ink,'#fbf6ec',2.4);
    // paper scraps
    bits.forEach(b=>{ ctx.save(); ctx.translate(X(b.x),Y(b.y)-2); ctx.rotate(b.stuck?Math.sin(t*3+b.x)*0.08:b.rot); ctx.beginPath(); ctx.lineJoin='round';
      b.pts.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p[0]*b.sz*pc*0.42,p[1]*b.sz*pc*0.2)); ctx.closePath();
      ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); });
    // plastic scale (a ruler)
    const sy=Y(Hs), sh=Math.max(10,0.45*pc);
    rect(ctx,X(-7.5),sy-sh,L*pc,sh,COL.ink,'rgba(255,255,255,0.9)',2.4);
    for(let c=0;c<=30;c++) line(ctx,X(-7.5+c),sy-sh,X(-7.5+c),sy-sh+(c%5?sh*0.3:sh*0.55),COL.mid,1);
    // + charges on the scale (red), count ∝ Q
    const nq=Math.round(Q*12);
    for(let i=0;i<nq;i++){ const x=X(-7.5+(i+0.5)*16/nq)+Math.sin(t*2+i)*1; textAt(ctx,'+',x,sy+13,{align:'center',size:14,weight:700,color:COL.red}); }
    // holding hand at the right end
    // polythene rubbing
    if(rub){ const px=X(rubX), py=sy-sh-10; ctx.save(); ctx.beginPath(); ctx.moveTo(px-50,py+8); for(let x=-50;x<=50;x+=10) ctx.lineTo(px+x,py-6+Math.sin(x*0.2+t*20)*3); ctx.lineTo(px+50,py+8); ctx.closePath();
      ctx.fillStyle='rgba(47,143,224,0.12)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      for(let i=0;i<4;i++) textAt(ctx,'−',px-30+i*20,py-12,{align:'center',size:15,weight:700,color:COL.blue});
      hand(ctx,px,py-24,1,90,-Math.PI/2-0.6); force(ctx,px-20,py-50,Math.cos(rub.T/0.3*Math.PI)*60,0,COL.yellow,''); }
    if(touch){ const u=smooth01(0,0.4,touch.T)*(1-smooth01(0.8,1.2,touch.T)); handDown(ctx,X(3),sy-sh-(1-u)*80,140); }
    // height dimension
    const gx=X(-7.5)-10; line(ctx,gx,tY,gx,sy,COL.yellow,2); arrowHead(ctx,gx,tY,Math.PI/2,COL.yellow,6); arrowHead(ctx,gx,sy,-Math.PI/2,COL.yellow,6);
    textAt(ctx,fmt(Hs,1)+' cm',gx+8,(tY+sy)/2+4,{size:13,weight:700,color:COL.yellow});
    // pull arrow on the scrap under the middle
    const b0=bits.reduce((a,b)=>Math.abs(b.x)<Math.abs(a.x)&&!b.stuck?b:a,bits.find(b=>!b.stuck)||bits[0]);
    if(Q>0.05&&!b0.stuck){ const gap=Math.max(0.05,Hs-0.25-b0.y), pull=Q*Q*Math.pow(DREF/gap,4)/b0.s; force(ctx,X(b0.x)+pc*0.9,Y(b0.y)-6,0,-clamp(pull*28,4,80),COL.blue,'pull','r'); force(ctx,X(b0.x)-pc*0.9,Y(b0.y)+2,0,28,COL.red,'weight','l'); }
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    $('#r1').textContent=Math.round(Q*100)+'%';
    $('#r2').textContent=lifted+' / '+bits.length;
  });
  return wrap;
}

/* =====================================================================
   5.7 CHARGED BALLOONS
   Each balloon is a pendulum (ℓ = 0.62 m, m = 4 g) acted on by Coulomb's law
        F = K·q₁·q₂ / r²        (like charges repel, unlike attract)
   ℓ·θ″ = (F·t̂)/m − g·sinθ − c·ℓ·θ′       t̂ = (cosθ, −sinθ)
   K is chosen so two fully rubbed balloons settle ≈ 20° apart each:
        tanθ = F / mg.  The wool gets the opposite charge (+).
   ===================================================================== */
function woolCloth(ctx,x,y,W,H,t,q){
  ctx.save(); ctx.beginPath();
  for(let i=0;i<=10;i++){ const u=i/10; ctx.lineTo(x-W/2+u*W,y-H/2+Math.sin(u*9+t*2)*3); }
  for(let i=10;i>=0;i--){ const u=i/10; ctx.lineTo(x-W/2+u*W,y+H/2+Math.sin(u*9+t*2+1)*3); }
  ctx.closePath(); ctx.fillStyle='#fdf6e6'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
  ctx.clip(); ctx.strokeStyle='#ead9b0'; ctx.lineWidth=1;
  for(let k=-H;k<W+H;k+=7){ ctx.beginPath(); ctx.moveTo(x-W/2+k,y-H/2); ctx.lineTo(x-W/2+k-H,y+H/2); ctx.stroke(); }
  ctx.restore();
  const n=Math.round(clamp(q,0,2)*5);
  for(let i=0;i<n;i++) textAt(ctx,'+',x-W/2+W*(i%5+0.5)/5,y-H/4+Math.floor(i/5)*H/2+5,{align:'center',size:14,weight:700,color:COL.red});
}
function balloon(ctx,x,y,r,q,side,t){
  ctx.save(); ctx.beginPath(); ctx.ellipse(x,y,r*0.9,r,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.ellipse(x-r*0.35,y-r*0.45,r*0.12,r*0.2,0.5,0,Math.PI*2); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x-5,y-r-8); ctx.lineTo(x+5,y-r-8); ctx.closePath(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  const n=Math.round(clamp(q,0,1)*10);
  for(let i=0;i<n;i++){ const a=(i/10)*Math.PI*2+0.3; textAt(ctx,'−',x+Math.cos(a)*r*0.62,y+Math.sin(a)*r*0.62+5,{align:'center',size:16,weight:700,color:COL.blue}); }
}
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">
      <button class="toggle-btn play" id="rub" style="width:100%;padding:9px;">🧶 Rub both with wool</button>
      <button class="toggle-btn navy" id="dis">☝ Touch to discharge</button></div>
    <div class="control-group"><label>Wool cloth distance <span class="val" id="dV"></span></label><input type="range" id="dR" min="4" max="60" step="1" value="60"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Balloons</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Gap between them</div><div class="rval" id="r2" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Balloon charge</div><div class="rval" id="r3" style="color:var(--f-blue)">0</div></div>
      <div class="rcard"><div class="rlabel">Wool charge</div><div class="rval" id="r4" style="color:var(--f-red)">0</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), dR=$('#dR');
  const r=0.14, ell=0.62, a=r+0.012, m=0.004, K=0.009, C=1.5;
  const B=[{th:0,om:0,q:0,px:-a},{th:0,om:0,q:0,px:a}];
  let t=0, rub=null, dis=null, cloth={x:a+r+0.6, y:ell}, cd=0.6;
  $('#rub').onclick=()=>{ if(!rub) rub={T:0}; };
  $('#dis').onclick=()=>{ if(!dis) dis={T:0}; };
  const pos=b=>({x:b.px+ell*Math.sin(b.th), y:ell*Math.cos(b.th)});

  animLoop((dt)=>{
    t+=dt;
    const away=+dR.value>=60; cd=approach(cd,away?1.6:+dR.value/100,away?2:5,dt); $('#dV').textContent=away?'put away':dR.value+' cm';
    const pB=pos(B[1]), pA=pos(B[0]);
    let tgt={x:B[1].px+r+0.03+cd, y:ell};
    // rubbing sequence: to A (left side) · rub · to B (right side) · rub · back
    if(rub){ rub.T+=dt; const T=rub.T;
      const atA={x:pA.x-r-0.05,y:pA.y}, atB={x:pB.x+r+0.05,y:pB.y};
      if(T<0.6) tgt=atA;
      else if(T<1.6){ tgt={x:atA.x+Math.sin(T*22)*0.015,y:atA.y+Math.sin(T*11)*0.07}; B[0].q=Math.min(1,B[0].q+dt*1.1); }
      else if(T<2.4){ tgt={x:atA.x, y:ell+r+0.18}; if(T>2.0) tgt=atB; }
      else if(T<3.4){ tgt={x:atB.x+Math.sin(T*22)*0.015,y:atB.y+Math.sin(T*11)*0.07}; B[1].q=Math.min(1,B[1].q+dt*1.1); }
      else if(T>4.2) rub=null;
    }
    if(dis){ dis.T+=dt; if(dis.T>0.3&&dis.T<0.8){ B.forEach(b=>b.q*=Math.exp(-dt*14)); } if(dis.T>1.2) dis=null; }
    const qc=B[0].q+B[1].q, qcEff=qc*(1-smooth01(0.6,1.4,cloth.x-B[1].px-r));
    // the cloth moves smoothly (held in a hand); during a rub the quick jiggle is followed directly
    const k=rub&&((rub.T>0.6&&rub.T<1.6)||(rub.T>2.4&&rub.T<3.4))?30:5;
    cloth.x=approach(cloth.x,tgt.x,k,dt); cloth.y=approach(cloth.y,tgt.y,k,dt);
    // pendulum dynamics
    const nsub=6, h2=dt/nsub;
    for(let s=0;s<nsub;s++){
      const P=B.map(pos);
      B.forEach((b,i)=>{
        let Fx=0, Fy=0;
        const o=P[1-i], dx=P[i].x-o.x, dy=P[i].y-o.y, d=Math.max(0.05,Math.hypot(dx,dy));
        const f=K*b.q*B[1-i].q/(d*d); Fx+=f*dx/d; Fy+=f*dy/d;
        const cx=P[i].x-cloth.x, cy=P[i].y-cloth.y, dc=Math.max(r*0.8,Math.hypot(cx,cy));
        const fc=-K*b.q*qcEff/(dc*dc); Fx+=fc*cx/dc; Fy+=fc*cy/dc;
        // air drag scaled so balloons move like balloons, not stones
        const al=(Fx*Math.cos(b.th)-Fy*Math.sin(b.th))/(m*ell) - (G/ell)*Math.sin(b.th) - C*b.om;
        b.om+=al*h2; b.th+=b.om*h2;
      });
      // contact: balloons can't overlap each other or the cloth
      const Q=B.map(pos), dd=Math.hypot(Q[0].x-Q[1].x,Q[0].y-Q[1].y);
      if(dd<2*r){ const ov=(2*r-dd)/2/ell; B[0].th-=ov; B[1].th+=ov; const avg=(B[0].om+B[1].om)/2; B[0].om=Math.min(B[0].om,avg); B[1].om=Math.max(B[1].om,avg); }
      B.forEach(b=>{ const p=pos(b), dx=p.x-cloth.x, dy=p.y-cloth.y, dc=Math.hypot(dx,dy), lim=r+0.035;
        if(dc<lim){ const push=(lim-dc)/ell*sgn(dx||1); b.th+=push; b.om*=0.3; } });
    }

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=Math.min(h*0.85/(ell+r+0.12),w*0.9/1.3), ox=w*0.37, oy=h*0.08, X=x=>ox+x*ppm, Y=y=>oy+y*ppm;
    // support rod
    line(ctx,X(-0.4),Y(0),X(0.4),Y(0),COL.ink,5); line(ctx,X(-0.4),Y(0),X(-0.4),Y(0)-30,COL.ink,3); line(ctx,X(0.4),Y(0),X(0.4),Y(0)-30,COL.ink,3);
    const P=B.map(pos);
    // cloth + hand
    const cw=0.16*ppm, chh=0.2*ppm;
    const cX=X(cloth.x), cY=Y(cloth.y);
    const fromRight=!rub||rub.T<0.4||rub.T>2.0;
    hand(ctx,fromRight?cX+cw/2+4:cX-cw/2-4,cY,fromRight?-1:1,200,fromRight?-0.15:Math.PI+0.15);
    woolCloth(ctx,cX,cY,cw,chh,t,qc);
    // vertical reference + angle arcs
    B.forEach((b,i)=>{ line(ctx,X(b.px),Y(0),X(b.px),Y(ell-r),'#dbe4f0',1.2,[4,4]);
      if(Math.abs(b.th)>0.02){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); const R0=ppm*0.18; ctx.arc(X(b.px),Y(0),R0,Math.PI/2-b.th*(b.th>0?1:1),Math.PI/2,b.th<0); ctx.stroke(); ctx.restore(); } });
    B.forEach((b,i)=>{ const p=P[i], tx=X(b.px)+(Math.sin(b.th)*(ell-r))*ppm, ty=Y(0)+(Math.cos(b.th)*(ell-r))*ppm;
      line(ctx,X(b.px),Y(0),tx,ty-8,COL.ink,1.6); });
    B.forEach((b,i)=>{ const p=P[i]; ctx.save(); ctx.translate(X(p.x),Y(p.y)); ctx.rotate(-b.th); balloon(ctx,0,0,r*ppm,b.q,i,t); ctx.restore(); });
    // force arrows on balloons
    B.forEach((b,i)=>{ if(b.q<0.05) return; const o=P[1-i], dx=P[i].x-o.x, dy=P[i].y-o.y, d=Math.hypot(dx,dy), f=K*b.q*B[1-i].q/(d*d);
      if(f>0.001) force(ctx,X(P[i].x)+sgn(dx)*r*ppm*0.95,Y(P[i].y)+r*ppm*0.2,sgn(dx)*clamp(f/0.04*50,6,90),0,COL.blue,'push'); });
    const cx=P[1].x-cloth.x, cy=P[1].y-cloth.y, dc=Math.hypot(cx,cy), fc=K*B[1].q*qcEff/(dc*dc);
    if(fc>0.002) force(ctx,X(P[1].x)+r*ppm*0.95,Y(P[1].y)-r*ppm*0.3,clamp(fc/0.04*50,6,90),0,COL.blue,'pull');
    if(dis){ const u=smooth01(0,0.3,dis.T)*(1-smooth01(0.8,1.2,dis.T)); B.forEach((b,i)=>{ const p=P[i]; hand(ctx,X(p.x),Y(p.y)+r*ppm+4+(1-u)*80,1,100,Math.PI/2); }); }
    // gap label
    const gap=Math.hypot(P[0].x-P[1].x,P[0].y-P[1].y)-2*r*0.9;
    const gy=Y(Math.max(P[0].y,P[1].y))+r*ppm+26;
    line(ctx,X(P[0].x)+r*ppm*0.9,gy,X(P[1].x)-r*ppm*0.9,gy,COL.yellow,2);
    textAt(ctx,fmt(Math.max(0,gap)*100,0)+' cm',(X(P[0].x)+X(P[1].x))/2,gy+18,{align:'center',size:12,weight:700,color:COL.yellow});
    const qb=(B[0].q+B[1].q)/2;
    $('#r1').textContent=fc>0.01&&B[1].th>0.05?'Pulled to wool':(qb>0.1&&B[1].th-B[0].th>0.1?'Repel':'Hang straight');
    $('#r2').textContent=fmt(Math.max(0,gap)*100,0)+' cm';
    $('#r3').textContent=qb>0.02?'− '+Math.round(qb*100)+'%':'0';
    $('#r4').textContent=qc>0.02?'+ '+Math.round(qc/2*100)+'%':'0';
  });
  return wrap;
}

/* =====================================================================
   5.8 THROW IT UP — vertical motion under gravity (g = 10 m/s²)
        y(t) = y₀ + u·t − ½·g·t²      v(t) = u − g·t
   Highest point:  h = u² / 2g     Time to top:  t = u / g
   Check: u = 10 m/s → h = 5 m, top reached in 1 s, back in the hand at 2 s.
   Real time. Flash-photo dots every 0.1 s show it slowing going up and
   speeding up coming down.
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Motion</label>
      <div class="toggle-group" id="mdB"><button class="toggle-btn active" data-m="up">Throw up</button><button class="toggle-btn" data-m="drop">Drop</button></div></div>
    <div class="control-group" id="spG"><label>Throw speed <span class="val" id="uV"></span></label><input type="range" id="uR" min="3" max="20" step="0.5" value="10"></div>
    <div class="control-group"><button class="toggle-btn play" id="go" style="width:100%;padding:9px;">▶ Throw</button>
      <div class="toggle-group" id="auB"><button class="toggle-btn active" data-a="1">Keep repeating</button><button class="toggle-btn" data-a="0">Once</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Highest point</div><div class="rval" id="r1" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Time to top</div><div class="rval" id="r2">—</div></div>
      <div class="rcard"><div class="rlabel">Speed now</div><div class="rval" id="r3" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Going</div><div class="rval" id="r4">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), uR=$('#uR');
  const HR=1.95, HOLD=1.15, DROPH=6;
  let mode='up', auto=true, t=0, Hv=6.5;
  const S={ph:'hold', T:0, y:HOLD, v:0, u:10, hand:HOLD, hv:0, strobe:[], st:0, peaks:[], maxY:0};
  function start(){ if(S.ph==='hold'){ S.ph=mode==='up'?'wind':'drop'; S.T=0; S.u=+uR.value; S.strobe=[]; S.st=0; S.maxY=0; } }
  $('#go').onclick=start;
  toggleWire(wrap.querySelectorAll('#mdB button'),b=>{ mode=b.dataset.m; S.ph='hold'; S.T=0; S.y=mode==='up'?HOLD:DROPH+1.3; S.v=0; S.strobe=[]; $('#go').textContent=mode==='up'?'▶ Throw':'▶ Let go'; $('#spG').classList.toggle('hidden',mode!=='up'); });
  toggleWire(wrap.querySelectorAll('#auB button'),b=>auto=b.dataset.a==='1');

  animLoop((dt)=>{
    t+=dt; S.T+=dt;
    const u=+uR.value; $('#uV').textContent=fmt(u,1)+' m/s';
    const base=mode==='up'?0:DROPH;       // ground level of the thrower's feet
    if(mode==='up'){
      if(S.ph==='hold'){ S.hand=approach(S.hand,HOLD,6,dt); S.y=S.hand; if(auto&&S.T>0.9) start(); }
      else if(S.ph==='wind'){ S.hand=lerp(HOLD,0.85,smooth01(0,0.25,S.T)); S.y=S.hand; if(S.T>=0.25){ S.ph='throw'; S.T=0; } }
      else if(S.ph==='throw'){ // hand speeds the ball up to u over the last 0.15 s
        S.hand=lerp(0.85,HR,Math.pow(clamp(S.T/0.15,0,1),1.6)); S.y=S.hand;
        if(S.T>=0.15){ S.ph='fly'; S.T=0; S.y=HR; S.v=S.u; S.hand=HR; }
      }
      else if(S.ph==='fly'){
        S.v-=G*dt; S.y+=S.v*dt; S.maxY=Math.max(S.maxY,S.y);
        S.hand=approach(S.hand,HR-0.1,3,dt);
        if(S.v<0 && S.y<=S.hand){ S.ph='catch'; S.T=0; S.hv=S.v; S.y=S.hand; S.peaks.unshift({h:S.maxY,u:S.u}); if(S.peaks.length>4) S.peaks.pop(); }
      }
      else if(S.ph==='catch'){ // hand gives way and stops the ball (spring-damper)
        const a=(HOLD-S.hand)*60-S.hv*9; S.hv+=a*dt; S.hand+=S.hv*dt; S.y=S.hand;
        if(S.T>0.9){ S.ph='hold'; S.T=0; }
      }
    } else {
      if(S.ph==='hold'){ S.y=DROPH+1.3; S.v=0; if(auto&&S.T>1) start(); }
      else if(S.ph==='drop'){ S.v-=G*dt; S.y+=S.v*dt; if(S.y<0.12){ S.y=0.12; S.v=-S.v*0.55; if(S.v<1){ S.v=0; S.ph='rest'; S.T=0; } } }
      else if(S.ph==='rest'){ if(S.T>1.2){ S.ph='hold'; S.T=0; S.strobe=[]; } }
    }
    const flying=S.ph==='fly'||S.ph==='drop';
    if(flying){ S.st+=dt; if(S.st>=0.1){ S.st-=0.1; S.strobe.push(S.y); } }

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const need=mode==='up'?Math.max(3.4,(HR+u*u/(2*G))*1.12):DROPH+2.6;
    Hv=approach(Hv,need,2.5,dt);
    const ppm=h*0.86/Hv, gY=h*0.93, Y=y=>gY-y*ppm, px=w*0.36;
    ground(ctx,0,w,gY);
    // height ruler
    const nice=[0.5,1,2,5,10]; let stp=nice[0]; for(const n of nice) if(n*ppm>=36){ stp=n; break; }
    line(ctx,w*0.08,Y(0),w*0.08,Y(Hv*0.98),COL.mid,1.4);
    for(let y=stp;y<=Hv*0.98;y+=stp){ line(ctx,w*0.08,Y(y),w*0.08+8,Y(y),COL.mid,1.4); textAt(ctx,y+' m',w*0.08-6,Y(y)+4,{align:'right',size:11,color:COL.mid}); }
    // drop tower
    if(mode==='drop'){ rect(ctx,px-0.9*ppm,Y(DROPH),1.1*ppm,DROPH*ppm,COL.ink,'#f6f9fc',2.4); for(let y=1;y<DROPH;y+=1) line(ctx,px-0.9*ppm,Y(y),px+0.2*ppm,Y(y),'#dbe4f0',1); }
    // thrower
    const Hp=1.65*ppm, bx=px+0.32*ppm;
    const handPt={x:bx-0.02*ppm, y:Y(base+S.hand)+0.05*ppm};
    if(mode==='up') person(ctx,{x:px-0.1*ppm,g:Y(base),H:Hp,face:1,lean:S.ph==='wind'?0.12:0,crouch:S.ph==='wind'?0.25*smooth01(0,0.25,S.T):S.ph==='throw'?0.25*(1-clamp(S.T/0.15,0,1)):0,hands:[handPt,null]});
    else person(ctx,{x:px-0.35*ppm,g:Y(base),H:Hp,face:1,lean:0.1,hands:[S.ph==='hold'?{x:bx,y:Y(S.y)+0.08*ppm}:{x:bx-0.1*ppm,y:Y(base+1.2)},null]});
    // highest-point marks of earlier throws
    S.peaks.forEach((p,i)=>{ const y=Y(p.h); line(ctx,bx-40,y,bx+40,y,COL.yellow,2-i*0.35,[5,4]); textAt(ctx,fmt(p.h,1)+' m  ('+fmt(p.u,1)+' m/s)',bx+46,y+4,{size:11,weight:600,color:COL.yellow,alpha:1-i*0.2}); });
    // flash-photo dots (offset to the right)
    S.strobe.forEach(y=>circ(ctx,bx+0.9*ppm+24,Y(y),Math.max(3,0.07*ppm),COL.mid,'#fff',1.4));
    if(S.strobe.length) textAt(ctx,'every 0.1 s',bx+0.9*ppm+24,Y(0)+16,{align:'center',size:10,color:COL.mid});
    // ball + arrows
    const br=Math.max(9,0.11*ppm), by=Y(S.y);
    circ(ctx,bx,by-br*0.3,br,COL.ink,'#fff',2.6); line(ctx,bx-br,by-br*0.3,bx+br,by-br*0.3,COL.mid,1.2);
    if(flying){
      force(ctx,bx-br-6,by,0,34,COL.red,'gravity','l');
      if(Math.abs(S.v)>0.3) force(ctx,bx+br+8,by,0,-clamp(S.v*6,-130,130),COL.green,fmt(Math.abs(S.v),1)+' m/s','r');
      else textAt(ctx,'stops for an instant',bx+br+10,by+4,{size:12,weight:700,color:COL.green});
    }
    $('#r1').textContent=mode==='up'?fmt(u*u/(2*G),2)+' m':'—';
    $('#r2').textContent=mode==='up'?fmt(u/G,2)+' s':'—';
    $('#r3').textContent=fmt(Math.abs(flying?S.v:0),1)+' m/s';
    $('#r4').textContent=flying?(S.v>0.3?'Up · slowing':S.v<-0.3?'Down · speeding':'At the top'):'In hand';
  });
  return wrap;
}

/* =====================================================================
   5.9 STRETCH A SPRING — hang, let go, it bounces and settles
        m·x″ = m·g − k·x − c·x′          (k = 40 N/m, ζ = 0.12)
   Settled stretch  x = m·g / k    → heavier object, bigger stretch.
   Check: tiffin 0.5 kg → weight 5 N → x = 5/40 = 12.5 cm.
   Let go from the unstretched length, it overshoots to ≈ 2x first.
   Period 2π√(m/k) ≈ 0.7 s → shown in slow motion ×0.5.
   ===================================================================== */
const HANG=[
  {k:'pencil', name:'Pencil box', m:0.2,  col:COL.green},
  {k:'tiffin', name:'Tiffin box', m:0.5,  col:COL.blue},
  {k:'stone',  name:'Stone',      m:0.8,  col:COL.red},
];
function drawHangObj(ctx,k,x,y,s){
  // (x,y) = hook point at the top of the object; s = px per metre
  ctx.save(); ctx.lineJoin='round';
  line(ctx,x,y,x,y+0.02*s,COL.ink,2);
  const y0=y+0.02*s;
  if(k==='pencil'){ const W=0.2*s, H=0.05*s; ctx.beginPath(); ctx.moveTo(x-W*0.25,y0+H*0.1); ctx.lineTo(x,y0); ctx.lineTo(x+W*0.25,y0+H*0.1); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.stroke();
    rect(ctx,x-W/2,y0+H*0.1,W,H,COL.ink,'#fff',2.4); line(ctx,x-W/2+6,y0+H*0.1+H*0.35,x+W/2-6,y0+H*0.1+H*0.35,COL.mid,1.2); return y0+H*1.1; }
  if(k==='tiffin'){ const W=0.12*s, H=0.14*s; line(ctx,x-W*0.3,y0+6,x+W*0.3,y0+6,COL.ink,2.4); line(ctx,x-W*0.3,y0+6,x-W*0.3,y0+H*0.2,COL.ink,2); line(ctx,x+W*0.3,y0+6,x+W*0.3,y0+H*0.2,COL.ink,2);
    for(let i=0;i<3;i++){ ctx.save(); rrect(ctx,x-W/2,y0+H*0.2+i*H*0.27,W,H*0.27,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
    return y0+H*1.01; }
  // stone in a string net
  const R=0.055*s; const pts=[[-1,0.1],[-0.8,-0.6],[-0.1,-0.95],[0.7,-0.7],[1,0],[0.75,0.7],[0,0.95],[-0.7,0.75]];
  const cy=y0+R*1.35;
  line(ctx,x,y0,x-R*0.7,cy-R*0.6,COL.mid,1.4); line(ctx,x,y0,x+R*0.7,cy-R*0.6,COL.mid,1.4);
  ctx.beginPath(); pts.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](x+p[0]*R*1.15,cy+p[1]*R)); ctx.closePath(); ctx.fillStyle='#f3f5f8'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
  line(ctx,x-R*0.4,cy-R*0.2,x+R*0.1,cy+R*0.1,COL.mid,1.2);
  ctx.restore(); return cy+R;
}
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Hang</label>
      <div class="toggle-group" id="obB"><button class="toggle-btn active" data-i="-1">Nothing</button>${HANG.map((o,i)=>`<button class="toggle-btn" data-i="${i}">${o.name}</button>`).join('')}</div>
      <button class="toggle-btn play" id="re" style="width:100%;margin-top:9px;padding:9px;">↺ Lift and let go again</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Stretch</div><div class="rval" id="r1" style="color:var(--f-yellow)">0 cm</div></div>
      <div class="rcard"><div class="rlabel">Earth's pull</div><div class="rval" id="r2" style="color:var(--f-red)">0 N</div></div></div>
      <table class="log"><thead><tr><th>Object</th><th>Stretch</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const K=40, L0=0.16, SLOW=0.5;
  let cur=-1, t=0;
  const S={x:0, v:0, swap:null};
  const seen={};
  function hangNew(i){ S.swap={T:0, from:cur, to:i, x0:S.x}; }
  toggleWire(wrap.querySelectorAll('#obB button'),b=>{ const i=+b.dataset.i; hangNew(i); });
  $('#re').onclick=()=>hangNew(cur);

  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    const m=cur>=0?HANG[cur].m:0.01;
    let handY=null;
    if(S.swap){ const sw=S.swap; sw.T+=dt0;
      // hand lifts the spring end back to its natural length, swaps the object, holds, lets go
      if(sw.T<0.6){ S.x=lerp(sw.x0,0,smooth01(0,0.6,sw.T)); S.v=0; handY=S.x; }
      else if(sw.T<1.0){ if(cur!==sw.to){ cur=sw.to; } S.x=0; S.v=0; handY=0; }
      else { S.swap=null; }
    } else {
      const c=2*0.12*Math.sqrt(K*m);
      const nsub=4, h2=dt/nsub;
      for(let i=0;i<nsub;i++){ const a=(m*G-K*S.x-c*S.v)/m; S.v+=a*h2; S.x+=S.v*h2; if(S.x<-0.05){ S.x=-0.05; S.v=0; } }
      if(cur>=0 && m*S.v*S.v+K*Math.pow(S.x-m*G/K,2)<K*0.015*0.015 && !seen[cur]){ seen[cur]=true; }
    }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=Math.min(h*0.82/(L0+0.44),w*1.5), topY=h*0.08, cx=w*0.42;
    // beam + nail
    rect(ctx,cx-w*0.25,topY-18,w*0.5,18,COL.ink,'#fbf6ec',2.4);
    line(ctx,cx,topY,cx,topY+10,COL.ink,3); circ(ctx,cx,topY+4,3,COL.ink,COL.ink,1);
    const endY=topY+14+(L0+S.x)*ppm;
    coil(ctx,cx,topY+10,endY,12,0.045*ppm,COL.blue,2.2);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(cx,endY+6,6,-Math.PI/2,Math.PI*1.2); ctx.stroke(); ctx.restore();
    let botY=endY+12;
    if(cur>=0) botY=drawHangObj(ctx,HANG[cur].k,cx,endY+12,ppm);
    if(handY!==null){ hand(ctx,cx+0.05*ppm+18,endY+18,-1,160,-0.2); }
    // ruler: 0 at the unstretched end
    const rx=cx+0.14*ppm, z=topY+14+L0*ppm;
    rect(ctx,rx,z-0.02*ppm,0.03*ppm,0.36*ppm,COL.ink,'#fff',1.8);
    for(let c=0;c<=34;c++){ const y=z+c/100*ppm; line(ctx,rx,y,rx+(c%5?0.008:0.014)*ppm,y,COL.ink,1); if(c%5===0) textAt(ctx,c+'',rx+0.032*ppm+4,y+4,{size:11,color:COL.muted}); }
    textAt(ctx,'cm',rx+0.032*ppm+4,z-0.03*ppm,{size:11,weight:700,color:COL.muted});
    // settled-stretch marks for each object tried
    HANG.forEach((o,i)=>{ if(!seen[i]) return; const y=z+o.m*G/K*ppm; line(ctx,rx-0.05*ppm,y,rx,y,o.col,3); textAt(ctx,o.name,rx-0.055*ppm,y+4,{align:'right',size:11,weight:700,color:o.col}); });
    // pointer at spring end
    line(ctx,cx+8,endY,rx,endY,COL.yellow,2,[4,3]); arrowHead(ctx,rx,endY,0,COL.yellow,6);
    // forces on the object
    if(cur>=0 && !S.swap){ const my=(endY+botY)/2+8; force(ctx,cx-0.1*ppm,my,0,m*G*9,COL.red,'weight '+fmt(m*G,0)+' N','l'); force(ctx,cx-0.1*ppm-40,endY+10,0,-K*S.x*9,COL.blue,'spring','l'); }
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    $('#r1').textContent=fmt(Math.max(0,S.x)*100,1)+' cm';
    $('#r2').textContent=cur>=0?fmt(m*G,0)+' N':'0 N';
    $('#tb').innerHTML=HANG.map((o,i)=>seen[i]?`<tr><td style="color:${o.col};font-weight:700">${o.name}</td><td>${fmt(o.m*G/K*100,1)} cm</td></tr>`:'').join('');
  });
  return wrap;
}

/* =====================================================================
   5.10 · 5.11 · 5.12 THE SPRING BALANCE
   Scale: 0 → max newton on the right, matching grams on the left
   (g = 10 N/kg, so 10 N ↔ 1000 g).
   Smallest division = (value between two big marks) ÷ (number of small
   divisions).  Textbook check (Fig. 5.13): 1 N ÷ 5 = 0.2 N.
   Balance spring: k = max / 10 cm  → m·x″ = m·g − k·x − c·x′, the pointer
   bangs against a stop just past the maximum.
   ===================================================================== */
const BAL=[
  {name:'0–10 N', max:10, major:1, div:5},
  {name:'0–5 N',  max:5,  major:1, div:10},
  {name:'0–20 N', max:20, major:2, div:4},
];
function stand(ctx,x,topY,baseY,armX){
  rect(ctx,x-60,baseY,120,12,COL.ink,'#fff',2.4);
  line(ctx,x,baseY,x,topY,COL.ink,4);
  line(ctx,x,topY,armX,topY,COL.ink,4);
  line(ctx,armX,topY,armX,topY+10,COL.ink,2.4);
}
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Spring balance</label>
      <div class="toggle-group" id="bB">${BAL.map((b,i)=>`<button class="toggle-btn${i?'':' active'}" data-i="${i}">${b.name}</button>`).join('')}</div></div>
    <div class="control-group"><label>Pull on the hook <span class="val" id="fV"></span></label><input type="range" id="fR" min="0" max="30" step="0.1" value="4"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Range</div><div class="rval" id="r1" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Maximum</div><div class="rval" id="r2">—</div></div>
      <div class="rcard wide"><div class="rlabel">Pointer shows</div><div class="rval" id="r3" style="color:var(--f-red)">—</div></div></div>
      <div class="fb hidden" id="fbk"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), fR=$('#fR');
  let bi=0, t=0;
  const P={x:0,v:0};
  toggleWire(wrap.querySelectorAll('#bB button'),b=>{ bi=+b.dataset.i; fR.max=BAL[bi].max*1.5; });
  fR.max=15;
  animLoop((dt)=>{
    t+=dt;
    const B=BAL[bi], F=Math.min(+fR.value,B.max*1.5); $('#fV').textContent=fmt(F,1)+' N';
    const over=F>B.max*1.02;
    // pointer follows the pull (spring-damper), but a stop holds it just past max
    springTo(P,Math.min(F,B.max*1.03),90,12,dt);
    if(P.x>B.max*1.03){ P.x=B.max*1.03; P.v=-P.v*0.3; }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Ls=Math.max(160,h*0.43-62), cx=w*0.42, topY=h*0.05;
    stand(ctx,w*0.14,topY-2,h*0.96,cx);
    const shake=over?Math.sin(t*50)*1.2:0;
    const r=springBalance(ctx,cx+shake,topY+6,Ls,B,P.x,{over,hiMax:true});
    // range bracket (yellow) along the newton scale
    const bx=cx+r.bw/2+16;
    line(ctx,bx,r.y0,bx,r.y1,COL.yellow,3); line(ctx,bx-6,r.y0,bx,r.y0,COL.yellow,3); line(ctx,bx-6,r.y1,bx,r.y1,COL.yellow,3);
    textAt(ctx,'range 0 – '+B.max+' N',bx+10,(r.y0+r.y1)/2+4,{size:13,weight:700,color:COL.yellow});
    circ(ctx,cx+r.bw/2-14,r.y1,12,COL.yellow,null,2.2);
    textAt(ctx,'max',bx+10,r.y1+4,{size:12,weight:700,color:COL.yellow});
    // hand pulling the hook
    const hy=r.hy+6;
    line(ctx,r.hx,r.hy-2,r.hx,hy+6,COL.ink,2);
    hand(ctx,r.hx,hy+20,1,120,Math.PI*0.62);
    force(ctx,r.hx+34,hy+10,0,clamp(F*6,0,110),COL.yellow,fmt(F,1)+' N','r');
    $('#r1').textContent='0 – '+B.max+' N';
    $('#r2').textContent=B.max+' N ('+B.max/G*1000+' g)';
    $('#r3').textContent=over?'stuck at the end':fmt(P.x,1)+' N';
    const fb=$('#fbk');
    if(over){ fb.className='fb bad'; fb.textContent='Beyond the range — the spring can be damaged'; } else fb.className='fb hidden';
  });
  return wrap;
}

function buildA11(){
  const wrap=labShell();

    <div class="control-group"><label style="margin-bottom:6px;">Spring balance</label>
      <div class="toggle-group" id="bB">${BAL.map((b,i)=>`<button class="toggle-btn${i?'':' active'}" data-i="${i}">${b.name}</button>`).join('')}</div></div>

  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let bi=0, t=0, steps=17, cnt=null, counted={};
  const P={x:3.4,v:0}, Z={x:3.4};
  toggleWire(wrap.querySelectorAll('#bB button'),b=>{ bi=+b.dataset.i; const B=BAL[bi]; steps=Math.round(clamp(P.x,0,B.max)/(B.major/B.div)); cnt=null; });

  animLoop((dt)=>{
    t+=dt;

    springTo(P,target,70,10,dt);
    Z.x=approach(Z.x,P.x,4,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Ls=Math.max(160,h*0.43-62), bx=w*0.17, topY=h*0.05;
    const r=springBalance(ctx,bx,topY,Ls,B,P.x,{});
    // magnified window on the part of the scale around the pointer
    const R=Math.min(h*0.44,w*0.3), mx=w*0.64, my=h*0.48;
    const y0p=r.y0+Ls*Z.x/B.max;
    line(ctx,bx+r.bw/2,y0p,mx-R*0.98,my,COL.mid,1,[3,4]);
    circ(ctx,bx+r.bw/2-12,y0p,14,COL.mid,null,1.4);
    const a0=Math.floor(clamp(P.x,0,B.max-1e-6)/B.major)*B.major;
    const kN=R*1.25/B.major, Yv=v=>my+(v-Z.x)*kN;
    if(cnt){ cnt.T+=dt; if(cnt.T>B.div*0.45+1.2){ counted[bi]=true; cnt=null; } }
    magnifier(ctx,mx,my,R,()=>{
      ctx.save(); rrect(ctx,mx-R*0.5,my-R*1.2,R*1.1,R*2.4,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
      // count highlight: division i lights up one by one
      if(cnt){ const k=Math.min(B.div,Math.floor(cnt.T/0.45)+1);
        for(let i=0;i<k;i++){ const ya=Yv(a0+i*lc), yb=Yv(a0+(i+1)*lc); ctx.save(); ctx.fillStyle='rgba(217,160,23,'+(i===k-1?0.35:0.15)+')'; ctx.fillRect(mx-R*0.36,ya,R*0.5,yb-ya); ctx.restore();
          textAt(ctx,String(i+1),mx-R*0.42,(ya+yb)/2+6,{align:'right',size:clamp(kN*lc*0.55,11,22),weight:700,color:COL.yellow}); } }
      for(let v=Math.floor((Z.x-B.major*1.2)/lc)*lc; v<=Z.x+B.major*1.2; v+=lc){
        if(v<-1e-6||v>B.max+1e-6) continue;
        const y=Yv(v), big=Math.abs(v/B.major-Math.round(v/B.major))<1e-6;
        line(ctx,mx-R*0.36,y,mx-R*0.36+(big?R*0.5:R*0.22),y,COL.ink,big?3.2:1.8);
        if(big) textAt(ctx,fmt(v,1)+' N',mx+R*0.2,y+7,{size:clamp(R*0.1,13,22),weight:700,color:COL.ink});
      }
      const py=Yv(P.x); line(ctx,mx-R*0.5,py,mx+R*0.12,py,COL.red,3.4); arrowHead(ctx,mx+R*0.15,py,0,COL.red,11);
    },'magnified scale');
    if(counted[bi]&&!cnt) textAt(ctx,fmt(B.major,0)+' N ÷ '+B.div+' = '+fmt(lc,2)+' N',mx,my+R+44,{align:'center',size:18,weight:700,color:COL.green});
    $('#r1').textContent=B.major+' N';
    $('#r2').textContent=cnt?String(Math.min(B.div,Math.floor(cnt.T/0.45)+1)):String(B.div);
    $('#r3').textContent=fmt(lc,2)+' N';
    $('#r4').textContent=fmt(target,1)+' N';
  });
  return wrap;
}

const OBJ12=[
  {k:'pencil', name:'Pencil box', m:0.35},
  {k:'bottle', name:'Water bottle', m:null},
  {k:'stone',  name:'Stone', m:0.62},
  {k:'tiffin', name:'Tiffin box', m:0.8},
];
const PLACES=[ {name:'Earth',g:10}, {name:'Moon',g:1.6}, {name:'Mars',g:3.8}, {name:'Venus',g:9}, {name:'Jupiter',g:25.4} ];
function waterBottle(ctx,x,y,s,fill,tilt){
  const W=0.075*s, H=0.22*s, y0=y+0.02*s;
  line(ctx,x,y,x,y0,COL.ink,2);
  const body=()=>{ ctx.beginPath(); ctx.moveTo(x-W*0.2,y0); ctx.lineTo(x+W*0.2,y0); ctx.lineTo(x+W*0.2,y0+H*0.08); ctx.quadraticCurveTo(x+W/2,y0+H*0.14,x+W/2,y0+H*0.25);
    ctx.lineTo(x+W/2,y0+H); ctx.lineTo(x-W/2,y0+H); ctx.lineTo(x-W/2,y0+H*0.25); ctx.quadraticCurveTo(x-W/2,y0+H*0.14,x-W*0.2,y0+H*0.08); ctx.closePath(); };
  ctx.save(); body(); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
  const lv=y0+H-(H*0.72)*fill; ctx.beginPath(); ctx.moveTo(x-W,lv+tilt*W); ctx.lineTo(x+W,lv-tilt*W); ctx.lineTo(x+W,y0+H+2); ctx.lineTo(x-W,y0+H+2); ctx.closePath();
  ctx.fillStyle='rgba(47,143,224,0.2)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x-W,lv+tilt*W); ctx.lineTo(x+W,lv-tilt*W); ctx.stroke(); ctx.restore();
  ctx.save(); body(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
  rect(ctx,x-W*0.22,y0-2,W*0.44,6,COL.ink,'#fff',2);
  return y0+H;
}
function buildA12(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Hang</label>
      <div class="toggle-group" id="oB">${OBJ12.map((o,i)=>`<button class="toggle-btn small${i?'':' active'}" data-i="${i}">${o.name}</button>`).join('')}</div>
      <div id="wG"><label style="margin-top:10px;">Water in bottle <span class="val" id="wV"></span></label><input type="range" id="wR" min="0" max="600" step="10" value="300"></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Where</label>
      <div class="toggle-group" id="pB">${PLACES.map((p,i)=>`<button class="toggle-btn small${i?'':' active'}" data-i="${i}">${p.name}</button>`).join('')}</div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Weight (N scale)</div><div class="rval" id="r1" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Mass</div><div class="rval" id="r2">—</div></div></div>
      <button class="toggle-btn navy" id="rec">＋ Record reading</button>
      <div class="fb hidden" id="fbk"></div>
      <table class="log"><thead><tr><th>Object</th><th>Where</th><th>Weight</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), wR=$('#wR');
  const B=BAL[0], K=B.max/0.1, SLOW=0.5;
  let oi=0, pi=0, t=0, cur=0;
  const S={x:0,v:0,a:0,swap:{T:0,x0:0}, tilt:{x:0,v:0}};
  const rows=[];
  const massOf=i=>OBJ12[i].m!==null?OBJ12[i].m:0.06+(+wR.value)/1000;
  toggleWire(wrap.querySelectorAll('#oB button'),b=>{ oi=+b.dataset.i; S.swap={T:0,x0:S.x}; });
  toggleWire(wrap.querySelectorAll('#pB button'),b=>{ pi=+b.dataset.i; });
  $('#rec').onclick=()=>{ const set=!S.swap&&Math.abs(S.v)<0.01; if(!set) return;
    const rd=Math.round(Math.min(K*S.x,B.max)/0.2)*0.2; rows.unshift([OBJ12[cur].name,PLACES[pi].name,K*S.x>B.max*1.01?'> 10 N':fmt(rd,1)+' N']); if(rows.length>7) rows.pop();
    $('#tb').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(''); };
  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    $('#wG').classList.toggle('hidden',oi!==1); $('#wV').textContent=wR.value+' g';
    const g=PLACES[pi].g;
    let holdX=null;
    if(S.swap){ const sw=S.swap; sw.T+=dt0;
      if(sw.T<0.5){ S.x=lerp(sw.x0,0,smooth01(0,0.5,sw.T)); holdX=S.x; }
      else if(sw.T<0.8){ cur=oi; S.x=0; holdX=0; }
      else S.swap=null;
      S.v=0;
    } else {
      const m=massOf(cur), c=2*0.18*Math.sqrt(K*m), xs=B.max*1.03/K;
      const nsub=4, h2=dt/nsub;
      for(let i=0;i<nsub;i++){ const a=(m*g-K*S.x-c*S.v)/m; S.a=a; S.v+=a*h2; S.x+=S.v*h2; if(S.x>xs){ S.x=xs; S.v=-S.v*0.2; } if(S.x<0){ S.x=0; S.v=0; } }
    }
    springTo(S.tilt,clamp(-S.a*0.012,-0.5,0.5),120,6,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Ls=Math.max(140,h*0.34-50), cx=w*0.45, topY=h*0.04;
    stand(ctx,w*0.16,topY-2,h*0.96,cx);
    const rN=K*S.x, over=rN>B.max*1.01;
    const r=springBalance(ctx,cx,topY+6,Ls,B,rN,{over});
    let bottom;
    const o=OBJ12[cur], s=Math.min(h*0.75,w*1.2);
    if(o.k==='bottle') bottom=waterBottle(ctx,r.hx,r.hy,s,(+wR.value)/600,S.tilt.x);
    else bottom=drawHangObj(ctx,o.k==='pencil'?'pencil':o.k==='tiffin'?'tiffin':'stone',r.hx,r.hy,s);
    if(holdX!==null) hand(ctx,r.hx+30,(r.hy+bottom)/2,-1,150,-0.3);
    // settled reading label next to the pointer
    const settled=!S.swap&&Math.abs(S.v)<0.01;
    const rd=Math.round(Math.min(rN,B.max)/0.2)*0.2;
    textAt(ctx,over?'too heavy!':settled?fmt(rd,1)+' N':'…',cx+r.bw/2+14,r.py+5,{size:15,weight:700,color:over?COL.red:COL.ink});
    if(!S.swap){ const m=massOf(cur); force(ctx,r.hx-0.12*s,(r.hy+bottom)/2,0,clamp(m*g*9,4,140),COL.red,'weight','l'); }
    textAt(ctx,PLACES[pi].name,w-12,h-14,{align:'right',size:15,weight:700,color:COL.muted});
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    const m=massOf(cur);
    $('#r1').textContent=over?'> 10 N':settled?fmt(rd,1)+' N':'…';
    $('#r2').textContent=Math.round(m*1000)+' g';
    const fb=$('#fbk');
    if(over){ fb.className='fb bad'; fb.textContent='Heavier than 10 N — take it off'; } else if(pi>0){ fb.className='fb warn'; fb.textContent='Same mass, different weight'; } else fb.className='fb hidden';
  });
  return wrap;
}

/* =====================================================================
   5.13 UPTHRUST — push a closed bottle into water, then let go
   Bottle lies on its side: cylinder r = 4 cm, length 22 cm (V ≈ 1.1 L).
   Upthrust = weight of water pushed aside:  B = ρ·g·V_sub
        V_sub = L·[ r²·acos((r−s)/r) − (r−s)·√(2rs − s²) ]   (s = depth sunk)
   (m + ½ρV_sub)·y″ = B − m·g − ½·ρ·Cd·A·y′|y′| − b·y′  (b: wave damping)
   Floats where B = m·g; sinks if even fully under, B < m·g.
   Check: empty bottle 40 g needs only 40 cm³ under water; 1.1 L fully
   under gives B ≈ 11 N — that is the push you feel. Slow motion ×0.4.
   ===================================================================== */
function buildA13(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Inside the bottle</label>
      <div class="toggle-group" id="cB"><button class="toggle-btn active" data-i="0">Air (empty)</button><button class="toggle-btn" data-i="1">Half water</button><button class="toggle-btn" data-i="2">Sand</button></div></div>
    <div class="control-group"><label>Push it down <span class="val" id="pV"></span></label><input type="range" id="pR" min="0" max="100" step="1" value="60">
      <button class="toggle-btn play" id="rel" style="width:100%;margin-top:9px;padding:9px;">✋ Let go</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Upthrust</div><div class="rval" id="r1" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Weight</div><div class="rval" id="r2" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Your push</div><div class="rval" id="r3" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Bottle</div><div class="rval" id="r4">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  const RHO=1000, r=0.04, L=0.22, V=Math.PI*r*r*L, DEPTH=0.34, AREA=0.09, SLOW=0.4, CD=0.8, WAVE=1.5;
  const MASS=[0.04, 0.04+V*RHO*0.5, 0.04+V*1600];
  let ci=0, t=0, held=true;
  // y = height of bottle centre above the (undisturbed) water surface, m
  const S={y:-0.1, v:0, handY:-0.1, waves:[]};
  toggleWire(wrap.querySelectorAll('#cB button'),b=>{ ci=+b.dataset.i; held=true; });
  pR.oninput=()=>{ held=true; };
  $('#rel').onclick=()=>{ held=false; };
  function vsub(s){ s=clamp(s,0,2*r); return L*(r*r*Math.acos((r-s)/r)-(r-s)*Math.sqrt(Math.max(0,2*r*s-s*s))); }

  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    const m=MASS[ci], W=m*G;
    const push=+pR.value/100; $('#pV').textContent=Math.round(push*100)+'%';
    const yTarget=lerp(r*0.2,-(DEPTH-r-0.01),push);
    let Fhand=0, Bf=0;
    const nsub=6, h2=dt/nsub;
    for(let i=0;i<nsub;i++){
      const lvl=vsub(r-S.y)/AREA;                     // water level rise in the bucket
      const sunk=r-(S.y-lvl), Vs=vsub(sunk);
      Bf=RHO*G*Vs;
      const madd=m+0.5*RHO*Vs;
      const drag=0.5*RHO*CD*(2*r*L)*clamp(Vs/V,0.05,1)*S.v*Math.abs(S.v)+(Vs>0?WAVE*S.v:0);   // + energy carried off by surface waves
      if(held){
        // the hand drives the bottle towards the chosen depth; the hand supplies whatever force is needed
        S.handY=approach(S.handY,yTarget,5,h2);
        const want=madd*(60*(S.handY-S.y)-14*S.v);
        Fhand=Bf-W-drag-want;                          // + pushes down, − holds it up
        const net=Bf-W-Fhand-drag;
        S.v+=net/madd*h2; S.y+=S.v*h2;
      } else {
        const net=Bf-W-drag; S.v+=net/madd*h2; S.y+=S.v*h2;
        S.handY=approach(S.handY,0.28,4,h2);
      }
      const floor=-(DEPTH-r-0.004);
      if(S.y<floor){ S.y=floor; S.v=S.v<-0.15?-S.v*0.2:0; }
    }
    // surface waves are kicked by the bottle crossing the surface
    if(Math.abs(S.y)<r*1.3 && Math.abs(S.v)>0.2 && (S.waves.length===0||t-S.waves[S.waves.length-1].t0>0.12)) S.waves.push({t0:t, A:clamp(Math.abs(S.v)*0.012,0,0.025)});
    S.waves=S.waves.filter(wv=>t-wv.t0<3);
    const lvl=vsub(r-S.y)/AREA;

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=Math.min(h*0.72/(DEPTH+0.14),w*0.62/0.6), cx=w*0.52, surfY=Math.max(h*0.3,h*0.56-0.12*Math.min(h*0.72/(DEPTH+0.14),w*0.62/0.6)), X=x=>cx+x*ppm, Y=y=>surfY-y*ppm;
    const bw0=0.3, bw1=0.26, botY=Y(-DEPTH);
    // bucket (trapezoid) + water
    const wl=Y(lvl);
    ctx.save(); ctx.beginPath(); ctx.moveTo(X(-bw0),Y(0.1)); ctx.lineTo(X(-bw1),botY); ctx.lineTo(X(bw1),botY); ctx.lineTo(X(bw0),Y(0.1)); ctx.clip();
    ctx.beginPath(); ctx.moveTo(X(-bw0-0.05),botY+2);
    for(let x=-bw0-0.05;x<=bw0+0.05;x+=0.01){ let dy=0; S.waves.forEach(wv=>{ const age=t-wv.t0, d=Math.abs(x-(0)), front=age*0.35; dy+=wv.A*Math.exp(-age*1.1)*Math.exp(-Math.pow((d-front)/0.05,2))*Math.cos((d-front)*60); }); ctx.lineTo(X(x),wl-dy*ppm); }
    ctx.lineTo(X(bw0+0.05),botY+2); ctx.closePath(); ctx.fillStyle='rgba(47,143,224,0.14)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.moveTo(X(-bw0),Y(0.1)); ctx.lineTo(X(-bw1),botY); ctx.lineTo(X(bw1),botY); ctx.lineTo(X(bw0),Y(0.1)); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(X(0),Y(0.1),(bw0)*ppm,8,0,Math.PI,0); ctx.stroke(); ctx.restore();
    ground(ctx,0,w,botY);
    // bottle (lying on its side), with sand or water inside
    const by=Y(S.y), br=r*ppm, bl=L*ppm;
    ctx.save(); ctx.beginPath(); rrect(ctx,X(-L/2),by-br,bl*0.82,2*br,br*0.35);
    ctx.moveTo(X(-L/2)+bl*0.82,by-br*0.5); ctx.lineTo(X(L/2)-bl*0.06,by-br*0.35); ctx.lineTo(X(L/2)-bl*0.06,by+br*0.35); ctx.lineTo(X(-L/2)+bl*0.82,by+br*0.5);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    rect(ctx,X(L/2)-bl*0.06,by-br*0.4,bl*0.07,br*0.8,COL.ink,'#fff',2.2);
    if(ci===1){ ctx.save(); rrect(ctx,X(-L/2)+3,by,bl*0.82-6,br-3,br*0.3); ctx.fillStyle='rgba(47,143,224,0.3)'; ctx.fill(); ctx.restore(); line(ctx,X(-L/2)+4,by,X(-L/2)+bl*0.82-4,by,COL.blue,1.6); }
    if(ci===2){ ctx.save(); rrect(ctx,X(-L/2)+3,by-br+3,bl*0.82-6,2*br-6,br*0.3); ctx.fillStyle='#e9d9b4'; ctx.fill(); ctx.restore(); const R0=rng(3); ctx.save(); ctx.fillStyle='#b99a5e'; for(let i=0;i<120;i++) ctx.fillRect(X(-L/2)+5+R0()*(bl*0.82-10),by-br+5+R0()*(2*br-10),1.8,1.8); ctx.restore(); }
    // hand on top of the bottle
    const hy=Y(S.handY)-br;
    if(held || S.handY<0.25) handDown(ctx,X(-0.02),held?by-br:hy,170);
    // forces
    const k=70/12;
    force(ctx,X(-L/2)-18,by,0,-Bf*k-(Bf>0.05?6:0),COL.blue,'upthrust '+fmt(Bf,1)+' N','l');
    force(ctx,X(L/2)+22,by,0,Math.max(16,W*k),COL.red,'weight '+fmt(W,1)+' N','r');
    if(held&&Math.abs(Fhand)>0.05) force(ctx,X(-0.08),Fhand>0?by-br-20-Fhand*k:by-br-20,0,Fhand>0?Fhand*k:Fhand*k,COL.yellow,'');
    // water level rise marker
    line(ctx,X(-bw0)-30,Y(0),X(-bw0)-6,Y(0),COL.mid,1.2,[3,3]);
    if(lvl*ppm>2){ line(ctx,X(-bw0)-18,Y(0),X(-bw0)-18,wl,COL.blue,2); textAt(ctx,'water rises '+fmt(lvl*100,1)+' cm',X(-bw0)+10,wl-10,{size:11,weight:700,color:COL.blue}); }
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    const full=RHO*G*V;
    $('#r1').textContent=fmt(Bf,1)+' N';
    $('#r2').textContent=fmt(W,1)+' N';
    $('#r3').textContent=held?(Fhand>=0?fmt(Fhand,1)+' N ↓':fmt(-Fhand,1)+' N ↑'):'0 N';
    $('#r4').textContent=!held?(full<W?'Sinks':(Math.abs(S.v)<0.02?'Floats':'Bobbing')):'Held under';
  });
  return wrap;
}

   INIT
   --------------------------------------------------------------------- */
render();
</script>
