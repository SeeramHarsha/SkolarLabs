<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metals and Non-metals — Activity Simulator | Grade 10 Chapter 3</title>
<style>
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --surface-1: #ffffff;
  --surface-2: #f7f9fb;
  --border: #e2e6ea;
  --border-strong: #c9d0d8;
  --text-primary: #1c2530;
  --text-secondary: #5b6570;
  --accent: #1a3a5c;
  --accent-dark: #0f2640;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--surface-2);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 16px;
}

.app-shell {
  max-width: 1800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 32px);
  min-height: 640px;
}

.sim-header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  padding: 16px 22px;
  border-radius: 12px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.sim-header .badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: inline-block;
}
.sim-header h1 { font-size: 19px; font-weight: 500; margin-top: 6px; }
.sim-header p { font-size: 13px; opacity: 0.75; margin-top: 2px; }
.sim-header .progress-pill {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  white-space: nowrap;
}
.sim-header .progress-pill strong { font-size: 14px; }

.activity-grid {
  display: grid;
  grid-template-columns: 250px 1fr;
  gap: 14px;
  flex: 1;
  min-height: 0;
}

.activity-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  padding-right: 4px;
  min-height: 0;
}
.activity-nav::-webkit-scrollbar { width: 6px; }
.activity-nav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding: 6px 10px 2px;
}

.nav-item {
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  border: 0.5px solid var(--border);
  background: var(--surface-1);
  transition: all 0.15s;
  text-align: left;
  width: 100%;
  display: block;
}
.nav-item:hover { background: var(--surface-2); border-color: var(--border-strong); }
.nav-item.active { background: var(--accent); border-color: var(--accent); color: white; }
.nav-item .nav-num {
  font-size: 10px;
  font-weight: 500;
  opacity: 0.6;
  display: block;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.nav-item.active .nav-num { opacity: 0.75; }
.nav-item .nav-title { font-size: 13px; font-weight: 500; line-height: 1.3; }
.nav-item .nav-sub { font-size: 11px; opacity: 0.65; margin-top: 1px; }

.sim-panel {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.sim-panel-header {
  padding: 14px 18px 12px;
  border-bottom: 0.5px solid var(--border);
  background: var(--surface-1);
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.sim-panel-header h2 { font-size: 16px; font-weight: 500; color: var(--text-primary); }
.sim-panel-header p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; max-width: 640px; }
.panel-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: #e8eef5;
  border: 0.5px solid #c9d8e6;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
}

.sim-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.sim-visual {
  flex: 1;
  position: relative;
  min-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0f4f8;
  overflow: hidden;
  padding: 10px;
}
.sim-visual canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; }

.sim-controls {
  padding: 12px 18px 14px;
  border-top: 0.5px solid var(--border);
  background: var(--surface-1);
  flex-shrink: 0;
}
.step-info {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  padding: 9px 12px;
  background: var(--surface-2);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
  line-height: 1.55;
  min-height: 20px;
}
.step-info strong { color: var(--text-primary); }
.step-info em { color: var(--accent); font-style: normal; font-weight: 500; }

.ctrl-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-step {
  padding: 8px 15px;
  border-radius: 6px;
  border: 0.5px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.1s;
  white-space: nowrap;
}
.btn-step:hover { background: var(--surface-1); }
.btn-step.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-step.primary:hover { background: var(--accent-dark); }
.btn-step:disabled { opacity: 0.4; cursor: default; }

.step-dots { display: flex; gap: 5px; align-items: center; margin-left: auto; }
.step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); transition: all 0.2s; cursor: pointer; }
.step-dot.active { background: var(--accent); width: 18px; border-radius: 4px; }

.outcome-label {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  margin-top: 5px;
}
.outcome-success { background: #e8f5e9; color: #2e7d32; border: 0.5px solid #a5d6a7; }
.outcome-info { background: #e3f2fd; color: #1565c0; border: 0.5px solid #90caf9; }
.outcome-warn { background: #fff3e0; color: #e65100; border: 0.5px solid #ffcc80; }
.outcome-danger { background: #ffebee; color: #c62828; border: 0.5px solid #ef9a9a; }

canvas { display: block; }
.hidden { display: none !important; }

/* Responsive breakpoints */
@media (max-width: 1100px) {
  .sim-visual { min-height: 300px; }
}
@media (max-width: 980px) {
  .activity-grid { grid-template-columns: 210px 1fr; }
  .sim-header h1 { font-size: 16px; }
  .sim-visual { min-height: 280px; }
}
@media (max-width: 720px) and (orientation: portrait) {
  body { padding: 8px; }
  .app-shell { height: auto; min-height: 100vh; }
  .activity-grid { grid-template-columns: 1fr; gap: 10px; }
  .activity-nav {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    max-height: none;
    gap: 6px;
    padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-section-label { display: none; }
  .nav-item { min-width: 150px; flex-shrink: 0; }
  .sim-visual {
    min-height: 0;
    width: 100%;
    aspect-ratio: 2 / 1;
    padding: 6px;
  }
  .sim-visual canvas { width: 100% !important; height: 100% !important; }
  .sim-header { flex-direction: column; align-items: flex-start; }
  .sim-header .progress-pill { align-self: flex-start; }
  .btn-step { padding: 10px 14px; font-size: 13.5px; }
  .ctrl-row { gap: 6px; }
}
@media (max-width: 480px) {
  .sim-header h1 { font-size: 15px; }
  .sim-header p { font-size: 12px; }
  .sim-panel-header h2 { font-size: 14.5px; }
  .sim-panel-header p { font-size: 12px; }
  .nav-item { min-width: 130px; padding: 8px 10px; }
  .nav-item .nav-title { font-size: 12.5px; }
  .step-info { font-size: 12px; padding: 8px 10px; }
  .btn-step { padding: 9px 12px; font-size: 13px; }
  .step-dots { margin-left: 0; width: 100%; justify-content: center; order: 3; margin-top: 6px; }
}
@media (max-width: 380px) {
  .nav-item { min-width: 112px; }
  .sim-visual { aspect-ratio: 4 / 3; }
}
</style>
</head>
<body>

<div class="app-shell">
  <div class="sim-header">
    <div>
      <div class="badge">Grade 10 · Chapter 3</div>
      <h1>Metals and Non-metals — Activity Simulator</h1>
      <p>Step-by-step virtual demonstrations of Activities 3.1–3.14 for classroom use</p>
    </div>
    <div class="progress-pill">Activity <strong id="hdrCurrent">1</strong> / <span id="hdrTotal">14</span></div>
  </div>

  <div class="activity-grid">
    <div class="activity-nav" id="actNav"></div>
    <div class="sim-panel">
      <div class="sim-panel-header">
        <div>
          <h2 id="panelTitle">Select an activity</h2>
          <p id="panelDesc">Choose an activity from the left to begin the simulation.</p>
        </div>
        <div class="panel-badge" id="panelBadge">NCERT 3.1</div>
      </div>
      <div class="sim-content">
        <div class="sim-visual" id="simVisual">
          <canvas id="simCanvas" width="920" height="460"></canvas>
        </div>
        <div class="sim-controls">
          <div class="step-info" id="stepInfo">Select an activity to begin.</div>
          <div class="ctrl-row">
            <button class="btn-step" id="btnPrev" onclick="changeStep(-1)" disabled>← Prev</button>
            <button class="btn-step primary" id="btnNext" onclick="changeStep(1)">Next →</button>
            <button class="btn-step" onclick="resetActivity()" style="margin-left:4px">↺ Reset</button>
            <div class="step-dots" id="stepDots"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ Shared canvas helpers ============ */
function drawArrow(ctx, x1, y1, x2, y2, color, label) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(angle - 0.4), y2 - 8 * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - 8 * Math.cos(angle + 0.4), y2 - 8 * Math.sin(angle + 0.4));
  ctx.closePath(); ctx.fill();
  if (label) {
    ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(label, x2 + 6, y2);
  }
}

function drawMetalPiece(ctx, x, y, w, h, color, label, strokeColor) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = strokeColor || '#555';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h / 2 + 3);
  }
}

function drawTestTube(ctx, x, y, w, h, fillColor, fillLevel, label) {
  // tube outline
  ctx.strokeStyle = '#607d8b'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y + h - w / 2);
  ctx.arc(x + w / 2, y + h - w / 2, w / 2, Math.PI, 0, false);
  ctx.lineTo(x + w, y);
  ctx.stroke();
  // liquid
  if (fillColor && fillLevel > 0) {
    const liqY = y + h - h * fillLevel;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + 1, liqY);
    ctx.lineTo(x + 1, y + h - w / 2);
    ctx.arc(x + w / 2, y + h - w / 2, w / 2 - 1, Math.PI, 0, false);
    ctx.lineTo(x + w - 1, liqY);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();
    ctx.restore();
  }
  if (label) {
    ctx.fillStyle = '#455a64'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h + 14);
  }
}

function drawBattery(ctx, x, y) {
  ctx.fillStyle = '#8d6e63'; ctx.fillRect(x, y, 46, 24);
  ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 1.2; ctx.strokeRect(x, y, 46, 24);
  ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('battery', x + 23, y + 15);
  ctx.fillStyle = '#333'; ctx.font = '11px sans-serif';
  ctx.fillText('+', x + 40, y - 4); ctx.fillText('−', x + 6, y - 4);
}

function drawBulb(ctx, x, y, glowing) {
  ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.fillStyle = glowing ? '#fff59d' : '#eceff1';
  ctx.fill();
  ctx.strokeStyle = glowing ? '#f9a825' : '#90a4ae'; ctx.lineWidth = 1.5; ctx.stroke();
  if (glowing) {
    ctx.save();
    ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fillStyle = '#fff9c4'; ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = '#795548'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 5, y + 5); ctx.lineTo(x + 5, y - 5); ctx.stroke();
  ctx.fillStyle = '#616161'; ctx.fillRect(x - 8, y + 12, 16, 6);
}

function drawThermometer(ctx, x, y, h, level, color) {
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4;
  ctx.strokeRect(x, y, 8, h);
  const fillH = h * level;
  ctx.fillStyle = color || '#e53935';
  ctx.fillRect(x + 1, y + h - fillH, 6, fillH);
  ctx.beginPath(); ctx.arc(x + 4, y + h + 5, 6, 0, Math.PI * 2); ctx.fill();
}

function drawTitleBanner(ctx, w, text) {
  ctx.fillStyle = '#1565c0'; ctx.font = '500 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(text, w / 2, 26);
}

function drawSummaryRows(ctx, w, startY, rows) {
  rows.forEach(([left, right, bg, clr], i) => {
    const y = startY + i * 34;
    ctx.fillStyle = bg; ctx.fillRect(40, y, w - 80, 28);
    ctx.strokeStyle = clr; ctx.lineWidth = 0.6; ctx.strokeRect(40, y, w - 80, 28);
    ctx.fillStyle = '#222'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(left, 50, y + 18);
    ctx.fillStyle = clr; ctx.font = '500 11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(right, w - 50, y + 18);
  });
}

function drawFlame(ctx, x, y) {
  ctx.fillStyle = '#ff9800';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - 8, y - 18, x, y - 34);
  ctx.quadraticCurveTo(x + 8, y - 18, x, y);
  ctx.fill();
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.quadraticCurveTo(x - 4, y - 14, x, y - 24);
  ctx.quadraticCurveTo(x + 4, y - 14, x, y - 2);
  ctx.fill();
}

function drawBurner(ctx, x, y) {
  drawFlame(ctx, x, y);
  ctx.fillStyle = '#90a4ae'; ctx.fillRect(x - 10, y, 20, 30);
  ctx.fillStyle = '#607d8b'; ctx.fillRect(x - 18, y + 30, 36, 8);
  ctx.fillStyle = '#455a64'; ctx.fillRect(x - 24, y + 38, 48, 6);
}

/* ============ Activity definitions ============ */
const activities = [
{
  id:1, num:"3.1", title:"Metallic Lustre", sub:"Shining surfaces",
  desc:"Observe samples of iron, copper, aluminium and magnesium before and after cleaning with sand paper.",
  steps:[
    {label:"Samples of iron, copper, aluminium and magnesium are collected. Their surfaces look <strong>dull</strong> — tarnished by exposure to air.", state:0},
    {label:"Each sample is rubbed firmly with <strong>sand paper</strong> to clean the surface.", state:1},
    {label:"After cleaning, every sample shows a <em>shining surface</em>. This shine, natural to pure metals, is called <strong>metallic lustre</strong>.", state:2, outcome:"success:Metals have metallic lustre in their pure state"},
  ],
  draw:(ctx,step)=>{
    const metals=[["Fe","#8d99ae"],["Cu","#c87f5f"],["Al","#b0bec5"],["Mg","#cfd8dc"]];
    const dull = step===0;
    metals.forEach((m,i)=>{
      const x=60+i*100, y=90;
      if(dull){
        ctx.fillStyle='#9e9e9e';
        ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#757575'; ctx.lineWidth=1; ctx.stroke();
      } else {
        const grad = ctx.createRadialGradient(x-8,y-8,4,x,y,28);
        grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.4,m[1]); grad.addColorStop(1,'#607d8b');
        ctx.fillStyle=grad;
        ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#455a64'; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.fillStyle= dull? '#616161':'#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(m[0],x,y+4);
      ctx.fillStyle='#555'; ctx.font='10px sans-serif';
      ctx.fillText(['Iron','Copper','Aluminium','Magnesium'][i], x, y+45);
    });
    if(step===1){
      ctx.fillStyle='#795548'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('▭ rubbing with sand paper...',230,170);
    }
    if(step===2){
      ctx.fillStyle='#2e7d32'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Shining surfaces revealed — metallic lustre',230,180);
    }
  }
},
{
  id:2, num:"3.2", title:"Hardness of Metals", sub:"Cutting with a knife",
  desc:"Try cutting iron, copper, aluminium, magnesium and sodium with a knife.",
  steps:[
    {label:"A knife is used to try cutting samples of iron, copper, aluminium and magnesium.", state:0},
    {label:"These metals resist the knife — only a faint scratch appears. <strong>Metals are generally hard.</strong>", state:1},
    {label:"A piece of <strong>sodium</strong> is held with tongs. <span style='color:#c62828'>CAUTION: handled carefully</span>, dried between filter paper folds, placed on a watch-glass.", state:2},
    {label:"The knife cuts through sodium <em>easily</em>, like cutting cheese — a freshly cut, shiny surface appears that quickly tarnishes. Sodium is exceptionally soft.", state:3, outcome:"info:Hardness varies from metal to metal — alkali metals are soft"},
  ],
  draw:(ctx,step)=>{
    function drawKnife(cx,cy,angle){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
      ctx.fillStyle='#8d6e63'; ctx.fillRect(-30,-5,16,10); // handle
      ctx.strokeStyle='#5d4037'; ctx.lineWidth=0.6; ctx.strokeRect(-30,-5,16,10);
      const grad = ctx.createLinearGradient(-14,-8,40,8);
      grad.addColorStop(0,'#eceff1'); grad.addColorStop(0.5,'#cfd8dc'); grad.addColorStop(1,'#90a4ae');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(42,3); ctx.lineTo(-14,7); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#607d8b'; ctx.lineWidth=0.7; ctx.stroke();
      ctx.restore();
    }
    if(step<2){
      const metals=[["Fe","#78909c","Iron"],["Cu","#c87f5f","Copper"],["Al","#b0bec5","Aluminium"],["Mg","#cfd8dc","Magnesium"]];
      metals.forEach((m,i)=>{
        const x = 44 + i*102;
        drawMetalPiece(ctx,x,86,80,42,m[1],m[0],'#37474f');
        ctx.fillStyle='#455a64'; ctx.font='9.5px sans-serif'; ctx.textAlign='center';
        ctx.fillText(m[2], x+40, 145);
        if(step===1){
          // faint scratch marks — metal resists, only a thin line shows
          ctx.strokeStyle='rgba(30,30,30,0.4)'; ctx.lineWidth=0.9;
          ctx.beginPath(); ctx.moveTo(x+18,94); ctx.lineTo(x+62,120); ctx.stroke();
          ctx.fillStyle='#2e7d32'; ctx.font='8.5px sans-serif';
          ctx.fillText('faint scratch', x+40, 158);
        }
      });
      drawKnife(415, step===1?70:48, step===1? 0.55:0.15);
      ctx.fillStyle='#37474f'; ctx.font='500 11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(step===0? 'Knife pressed firmly onto each metal sample':'Barely a scratch on any of them — metals resist cutting',230,205);
    } else if(step===2){
      // watch glass with sodium, held by tongs, filter paper fold beside it
      ctx.strokeStyle='#90a4ae'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.ellipse(230,150,58,16,0,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(230,146,58,16,0,0,Math.PI,true); ctx.stroke();
      ctx.fillStyle='#e6e2b8'; ctx.fillRect(200,120,60,28);
      ctx.strokeStyle='#9e9d24'; ctx.lineWidth=1; ctx.strokeRect(200,120,60,28);
      ctx.fillStyle='#8d8f00'; ctx.font='8.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Na', 230, 138);
      // tongs
      ctx.save(); ctx.translate(300,60); ctx.rotate(0.25);
      ctx.strokeStyle='#78909c'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(45,45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14,-6); ctx.lineTo(58,40); ctx.stroke();
      ctx.restore();
      // folded filter paper
      ctx.fillStyle='#fafaf5'; ctx.fillRect(90,120,44,34);

  ],
  draw:(ctx,step)=>{

    drawTestTube(ctx,290,50,60, 120, step===2||step===3? '#dcedc8':'#90caf9', 0.6,'Fe nail + CuSO₄');
    // wire/nail
    ctx.strokeStyle='#d17b3f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(140,55); ctx.lineTo(140,140); ctx.stroke();
    ctx.strokeStyle= (step===2||step===3)? '#b0bec5':'#78909c'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(320,55); ctx.lineTo(320,140); ctx.stroke();
    if(step===2||step===3){
      ctx.strokeStyle='#c87f5f'; ctx.lineWidth=2;
      for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(313,70+i*9); ctx.lineTo(327,70+i*9); ctx.stroke(); }
    }
    ctx.fillStyle='#555'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(step===0? 'Two test tubes set up':
                 step===1? 'Cu + FeSO₄: no visible change':
                 step===2? 'Fe + CuSO₄: copper deposits on nail':
                 'Iron displaces copper — Fe is more reactive',230,205);
  }
},
{
  id:13, num:"3.13", title:"Properties of Ionic Compounds", sub:"NaCl, KI, BaCl2",

  steps:[
    {label:"Samples of sodium chloride, potassium iodide, barium chloride are solids — hard, crystalline.", state:0},
    {label:"Heated directly on a flame using a spatula: they resist melting — <strong>high melting points</strong>.", state:1, outcome:"info:Strong electrostatic attraction between ions"},
    {label:"Dissolved in water, petrol, kerosene: soluble in <strong>water only</strong>, insoluble in petrol/kerosene.", state:2},
    {label:"A salt solution is tested in a circuit: the bulb <strong>glows</strong> — ionic compounds conduct electricity in solution (ions move freely), but not as solids.", state:3, outcome:"success:Ionic compounds conduct only when molten or in solution"},
  ],
  draw:(ctx,step)=>{

      for(let i=0;i<3;i++){ drawMetalPiece(ctx,90+i*110,90,40,40,'#fff','',i==1?'#7b1fa2':'#455a64');
        ctx.fillStyle='#333'; ctx.font='9px sans-serif'; ctx.textAlign='center';
        ctx.fillText(['NaCl','KI','BaCl2'][i],110+i*110,150); }
    } else if(step===1){

    } else if(step===2){
      drawTestTube(ctx,110,60,55,100,'#e1f5fe',0.55,'water: dissolves');
      drawTestTube(ctx,225,60,55,100,'#fff9c4',0,'petrol: insoluble');
      drawTestTube(ctx,340,60,55,100,'#f0f4c3',0,'kerosene: insoluble');
      ctx.fillStyle='#333'; ctx.font='10px sans-serif'; ctx.textAlign='center';

    } else {
      drawBattery(ctx,60,90);
      drawBulb(ctx,300,102,true);
      ctx.strokeStyle='#333'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(106,102); ctx.lineTo(180,102); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(220,102); ctx.lineTo(286,102); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300,116); ctx.lineTo(300,150); ctx.lineTo(60,150); ctx.lineTo(60,114); ctx.stroke();
      ctx.fillStyle='#90caf9'; ctx.fillRect(180,80,40,45);
      ctx.strokeStyle='#1976d2'; ctx.strokeRect(180,80,40,45);
      ctx.strokeStyle='#333'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(190,80); ctx.lineTo(190,125); ctx.stroke();

{
  id:14, num:"3.14", title:"Corrosion / Rusting", sub:"Conditions for rust",
  desc:"Set up three test tubes with iron nails under different conditions and observe after a few days.",
  steps:[
    {label:"Three test tubes with clean iron nails: <strong>A</strong> — water + open air. <strong>B</strong> — boiled distilled water + oil layer (no dissolved air). <strong>C</strong> — dry air (anhydrous CaCl₂ absorbs moisture).", state:0},
    {label:"Left for a few days...", state:1},
    {label:"<strong>Tube A:</strong> nails develop brown flaky <strong>rust</strong> — exposed to both air and water.", state:2, outcome:"danger:Rust forms only with both air + water present"},
    {label:"<strong>Tubes B and C:</strong> nails stay rust-free — B lacks dissolved air, C lacks moisture. Conclusion: <strong>both air and water are required for rusting.</strong>", state:3, outcome:"success:Prevented by painting, oiling, galvanising, alloying"},
  ],
  draw:(ctx,step)=>{
    const labels=['A: water + air','B: boiled water + oil','C: dry air (CaCl₂)'];
    const rusted = step>=2;
    for(let i=0;i<3;i++){
      const x = 80+i*130;
      drawTestTube(ctx,x,50,60,130, i===0?'#bbdefb': i===1?'#bbdefb':'#eeeeee', i<2?0.6:0.3, labels[i]);
      if(i===1 && step>=0){ ctx.fillStyle='#ffe082'; ctx.fillRect(x+2,110,56,8); }
      if(i===2){ ctx.fillStyle='#e0e0e0'; ctx.fillRect(x+2,150,56,25); ctx.fillStyle='#666'; ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText('CaCl₂',x+30,164); }
      // nail
      const nailColor = (i===0 && rusted) ? '#a1887f' : '#90a4ae';
      ctx.strokeStyle = nailColor; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x+30,65); ctx.lineTo(x+30, i===2?140:160); ctx.stroke();
      if(i===0 && rusted){
        for(let j=0;j<6;j++){ ctx.fillStyle='#8d6e63'; ctx.beginPath(); ctx.arc(x+30+ (j%2?3:-3), 75+j*13, 2.5,0,Math.PI*2); ctx.fill(); }
      }
    }
    ctx.fillStyle='#555'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(step===0? 'Three conditions set up in parallel':
                 step===1? 'Test tubes left undisturbed for a few days':
                 step===2? 'Tube A: nails rust (brown, flaky)':
                 'Only tube A rusts — air + water both needed',230,210);
  }
}
];

/* ============ App logic ============ */
const CANVAS_SCALE = 920 / 460; // canvas buffer is 2x the 460x230 space the draw() functions are authored for
let currentActivity = 0;
let currentStep = 0;

function buildNav() {
  const nav = document.getElementById('actNav');
  nav.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'nav-section-label';
  label.textContent = 'Chapter 3 Activities';
  nav.appendChild(label);
  activities.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (i === currentActivity ? ' active' : '');
    btn.innerHTML = `<span class="nav-num">Activity ${a.num}</span><span class="nav-title">${a.title}</span><span class="nav-sub">${a.sub}</span>`;
    btn.onclick = () => { currentActivity = i; currentStep = 0; render(); };
    nav.appendChild(btn);
  });
}

function buildDots() {
  const act = activities[currentActivity];
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  act.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === currentStep ? ' active' : '');
    d.onclick = () => { currentStep = i; render(); };
    dots.appendChild(d);
  });
}

function outcomeHtml(outcomeStr) {
  if (!outcomeStr) return '';
  const [type, ...rest] = outcomeStr.split(':');
  const text = rest.join(':');
  return `<div class="outcome-label outcome-${type}">${text}</div>`;
}

function render() {
  buildNav();
  buildDots();
  const act = activities[currentActivity];
  const step = act.steps[currentStep];

  document.getElementById('panelTitle').textContent = `Activity ${act.num} — ${act.title}`;
  document.getElementById('panelDesc').textContent = act.desc;
  document.getElementById('panelBadge').textContent = `NCERT ${act.num}`;
  document.getElementById('hdrCurrent').textContent = currentActivity + 1;
  document.getElementById('hdrTotal').textContent = activities.length;

  document.getElementById('stepInfo').innerHTML = step.label + outcomeHtml(step.outcome);

  document.getElementById('btnPrev').disabled = currentStep === 0;
  document.getElementById('btnNext').disabled = currentStep === act.steps.length - 1;
  document.getElementById('btnNext').textContent = currentStep === act.steps.length - 1 ? 'Done ✓' : 'Next →';

  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(CANVAS_SCALE, CANVAS_SCALE); // draw() functions are authored for a 460x230 coordinate space
  act.draw(ctx, currentStep);
  ctx.restore();
}

function changeStep(delta) {
  const act = activities[currentActivity];
  const newStep = currentStep + delta;
  if (newStep >= 0 && newStep < act.steps.length) {
    currentStep = newStep;
    render();
  }
}

function resetActivity() {
  currentStep = 0;
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') changeStep(1);
  if (e.key === 'ArrowLeft') changeStep(-1);
});

render();
</script>
