<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}

.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}

  .panel-body{overflow-y:auto;}

  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 9: THE AMAZING WORLD OF SOLUTES, SOLVENTS & SOLUTIONS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET or start an action; the drawn object is moved every frame by the
   real relation behind it — shrinking-crystal dissolution up to the
   solubility limit (NaCl 36 g/100 mL; NaHCO₃ 9.6 → 18.4 g/100 mL from
   20 → 70 °C), an energy balance for the spirit lamp, a spring-damper load
   cell, weir flow from a tilted beaker, projectile streams, parallax of the
   eye line, and water displaced by a sinking object (ρ = m/V).
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-9 HELPERS — hands, magnifier, ground, particles
   --------------------------------------------------------------------- */
const G = 10;                       // N/kg — textbook value
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function sgn(x){ return x>0?1:x<0?-1:0; }

/* labelled force arrow; skipped when tiny */
function force(ctx,x,y,dx,dy,col,label,side){
  const L=Math.hypot(dx,dy); if(L<4) return;
  vec(ctx,x,y,x+dx,y+dy,col,3);
  if(label && side==='b'){ textAt(ctx,label,x+dx/2,y+dy+18,{size:12,weight:700,color:col,align:'center'}); return; }
  if(label){ const ox=side==='l'?-8:8; textAt(ctx,label,x+dx+(Math.abs(dx)>Math.abs(dy)?0:ox),y+dy+(Math.abs(dx)>Math.abs(dy)?-9:(dy>0?14:-4)),{size:12,weight:700,color:col,align:Math.abs(dx)>Math.abs(dy)?'center':(side==='l'?'right':'left')}); }
}
function ground(ctx,x0,x1,y){
  line(ctx,x0,y,x1,y,COL.ink,2.4);
  ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.beginPath();
  for(let x=x0+8;x<x1;x+=14){ ctx.moveTo(x,y+2); ctx.lineTo(x-8,y+10); } ctx.stroke(); ctx.restore();
}
function coil(ctx,x,y1,y2,n,wd,col,lwd){
  const L=y2-y1, lead=Math.min(12,Math.abs(L)*0.1), body=L-2*lead, N=n*24;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lwd||2; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x,y1); ctx.lineTo(x,y1+lead);
  const pitch=body/n;
  for(let i=0;i<=N;i++){ const u=i/N, a=u*n*Math.PI*2;
    ctx.lineTo(x+Math.sin(a)*wd/2, y1+lead+body*u - Math.cos(a)*Math.min(pitch*0.35,wd*0.18) + Math.min(pitch*0.35,wd*0.18)); }
  ctx.lineTo(x,y2); ctx.stroke(); ctx.restore();
}
/* hand seen from the side: palm facing `dir` (±1), fingertips at (x,y) */
function hand(ctx,x,y,dir,armLen,armAng){

  const bx=x-dir*18, by=y;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  line(ctx,bx,by,bx+Math.cos(a)*armLen,by+Math.sin(a)*armLen,COL.ink,9);
  line(ctx,bx,by,bx+Math.cos(a)*armLen,by+Math.sin(a)*armLen,'#fff',5);
  ctx.beginPath(); ctx.moveTo(bx,by-10); ctx.lineTo(x-dir*2,by-9); ctx.quadraticCurveTo(x+dir*2,by-8,x+dir*1,by); ctx.quadraticCurveTo(x+dir*2,by+8,x-dir*2,by+9); ctx.lineTo(bx,by+10); ctx.closePath();
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* hand pressing downward: fingertip at (x,y) */

  ctx.beginPath(); rrect(ctx,x-12,y-22,24,22,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  line(ctx,x-5,y-8,x-5,y-1,COL.mid,1.2); line(ctx,x+3,y-8,x+3,y-1,COL.mid,1.2);

}
function magnifier(ctx,cx,cy,R,draw,label){

/* jagged surface profile (friction close-up) */
function roughProfile(seed,rough,n){ const R=rng(seed), a=[]; for(let i=0;i<n;i++) a.push((R()-0.5)*2*rough*(0.6+0.4*R())); return a; }
/* ---- polygons (world units, y up) ---- */
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[i], r=p[(i+1)%p.length]; a+=q[0]*r[1]-r[0]*q[1]; } return Math.abs(a)/2; }
/* keep the part of polygon p with y <= Y */
function clipBelow(p,Y){
  const out=[];
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length], ia=a[1]<=Y, ib=b[1]<=Y;
    if(ia) out.push(a);
    if(ia!==ib){ const u=(Y-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*u, Y]); }
  }
  return out;
}
function xform(p,ox,oy,ang){ const c=Math.cos(ang), s=Math.sin(ang); return p.map(q=>[ox+q[0]*c-q[1]*s, oy+q[0]*s+q[1]*c]); }
function polyPath(ctx,p,X,Y){ ctx.beginPath(); p.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](X(q[0]),Y(q[1]))); ctx.closePath(); }
/* water surface Y so that the part of polygon p below it has area A (bisection) */
function levelFor(p,A){
  let lo=Math.min(...p.map(q=>q[1])), hi=Math.max(...p.map(q=>q[1]));
  if(A<=0) return lo;
  for(let k=0;k<40;k++){ const m=(lo+hi)/2; if(polyArea(clipBelow(p,m))<A) lo=m; else hi=m; }
  return (lo+hi)/2;
}
/* width of polygon p along the horizontal line y=Y */
function widthAt(p,Y){ const xs=[]; for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length]; if((a[1]-Y)*(b[1]-Y)<=0 && a[1]!==b[1]) xs.push(a[0]+(b[0]-a[0])*(Y-a[1])/(b[1]-a[1])); } return xs.length<2?0:Math.max(...xs)-Math.min(...xs); }

const WFILL = 'rgba(47,143,224,0.14)', WFILL2 = 'rgba(47,143,224,0.28)';
function dot(ctx,x,y,r,stroke,fill,lw){ ctx.beginPath(); ctx.arc(x,y,Math.max(0.3,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.stroke();} }
const FARADAY = 96485, VM = 24.0;   // C/mol · L/mol of gas at room temperature
function fmtClock(s){ if(s<60) return Math.round(s)+' s'; if(s<3600) return Math.floor(s/60)+' min '+String(Math.floor(s%60)).padStart(2,'0')+' s'; return Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min'; }

/* ---- lab-ware line drawings (pixel coords) ---- */
/* test tube: open end at yOpen, round end at yEnd (either may be on top) */
function tubePath(ctx,cx,yOpen,yEnd,r){
  const s=yEnd>yOpen?1:-1, yb=yEnd-s*r;
  ctx.beginPath(); ctx.moveTo(cx-r,yOpen); ctx.lineTo(cx-r,yb); ctx.arc(cx,yb,r,Math.PI,0,s>0); ctx.lineTo(cx+r,yOpen);
}
function tube(ctx,cx,yOpen,yEnd,r,lw){
  ctx.save(); tubePath(ctx,cx,yOpen,yEnd,r); ctx.strokeStyle=COL.ink; ctx.lineWidth=lw||2.4; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
  line(ctx,cx-r-3,yOpen,cx-r,yOpen,COL.ink,lw||2.4); line(ctx,cx+r,yOpen,cx+r+3,yOpen,COL.ink,lw||2.4);
}
/* fill the part of a tube between two heights */
function tubeFill(ctx,cx,yOpen,yEnd,r,ya,yb,fill){
  ctx.save(); tubePath(ctx,cx,yOpen,yEnd,r); ctx.closePath(); ctx.clip();
  ctx.fillStyle=fill; ctx.fillRect(cx-r-2,Math.min(ya,yb),2*r+4,Math.abs(yb-ya)); ctx.restore();
}
/* teardrop flame */
function flameShape(ctx,x,y,h,wd,t,col,inner,seed){
  const sw=Math.sin(t*11+(seed||0))*wd*0.12, hh=h*(0.9+0.1*Math.sin(t*17+(seed||0)*2));
  ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=col||COL.red; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.bezierCurveTo(x-wd,y-hh*0.1,x-wd*0.55,y-hh*0.65,x+sw,y-hh); ctx.bezierCurveTo(x+wd*0.55,y-hh*0.65,x+wd,y-hh*0.1,x,y); ctx.stroke();
  ctx.strokeStyle=inner||COL.yellow; ctx.lineWidth=1.6; const h2=hh*0.5, w2=wd*0.45;
  ctx.beginPath(); ctx.moveTo(x,y-2); ctx.bezierCurveTo(x-w2,y-h2*0.15,x-w2*0.5,y-h2*0.7,x+sw*0.5,y-h2); ctx.bezierCurveTo(x+w2*0.5,y-h2*0.7,x+w2,y-h2*0.15,x,y-2); ctx.stroke();
  ctx.restore();
}
/* candle standing at (x,yBase); bright > 1 = flame flares up */
function candle(ctx,x,yBase,u,t,bright,lit){
  const W=1.1*u, H=4.2*u, b=bright||1;
  rect(ctx,x-W/2,yBase-H,W,H,COL.ink,'#fff',2.2);
  line(ctx,x,yBase-H,x,yBase-H-0.35*u,COL.ink,1.8);
  if(lit===false) return;
  flameShape(ctx,x,yBase-H-0.2*u,(1.5+1.3*(b-1))*u,(0.42+0.2*(b-1))*u,t,COL.red,COL.yellow);
  if(b>1.15){ ctx.save(); ctx.globalAlpha=clamp((b-1.15)*1.6,0,0.9); for(let k=0;k<10;k++){ const a=k/10*Math.PI*2+t*0.8, cy=yBase-H-1.0*u*b, r0=(0.9+0.5*b)*u; line(ctx,x+Math.cos(a)*r0,cy+Math.sin(a)*r0,x+Math.cos(a)*r0*1.35,cy+Math.sin(a)*r0*1.35,COL.yellow,1.6); } ctx.restore(); }
}
/* spirit lamp: base centre (x,yBase); inten 0..1 flame size */

  ctx.beginPath(); ctx.moveTo(x-2.4*u,yBase); ctx.lineTo(x+2.4*u,yBase); ctx.quadraticCurveTo(x+2.8*u,yBase-1.8*u,x+0.7*u,yBase-2.6*u); ctx.lineTo(x+0.55*u,yBase-3.2*u); ctx.lineTo(x-0.55*u,yBase-3.2*u); ctx.lineTo(x-0.7*u,yBase-2.6*u); ctx.quadraticCurveTo(x-2.8*u,yBase-1.8*u,x-2.4*u,yBase); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();

function bubble(ctx,x,y,r,alpha){ ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; dot(ctx,x,y,r,COL.green,'#fff',1.3); ctx.restore(); }

/* wavy smell lines travelling from (x0,y0) to (x1,y1) */
function smellWaves(ctx,x0,y0,x1,y1,t,col,alpha){

/* head in profile, nose tip at (x,y) facing dir (±1) */
function face(ctx,x,y,u,dir,mood){

/* round "magnified view" frame with a pointer ring on the object being viewed */
function zoomFrame(ctx,cx,cy,R,tx,ty,label,draw){
  if(tx!==null){
    const d=Math.hypot(cx-tx,cy-ty)||1, ux=(cx-tx)/d, uy=(cy-ty)/d, a=Math.asin(clamp(R/d,0,1));
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.1; ctx.setLineDash([4,4]);
    [a,-a].forEach(s=>{ const c=Math.cos(s), sn=Math.sin(s), vx=ux*c-uy*sn, vy=ux*sn+uy*c, L=Math.sqrt(Math.max(0,d*d-R*R)); ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+vx*L,ty+vy*L); ctx.stroke(); });
    ctx.restore(); circ(ctx,tx,ty,7,COL.ink,null,1.8);
  }
  magnifier(ctx,cx,cy,R,draw,label);

/* step pills: onPick(i) fires for pills that are unlocked */
function stepPills(el,names,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill" data-i="${i}">${i+1} · ${n}</button>`).join('');
  const bs=[...el.querySelectorAll('.step-pill')]; let unl=0;
  bs.forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(i<=unl) onPick(i); });
  return { set(active,unlocked,done){ unl=unlocked; bs.forEach((b,i)=>{ b.classList.toggle('active',i===active); b.classList.toggle('done',!!(done&&done[i])); b.style.opacity=i<=unlocked?1:0.45; }); } };
}
const GCM = 981;                     // g in cm/s²

/* ---- chapter-9 lab-ware (pixel coords unless noted) ---- */
/* beaker: bottom-left (x,yBot), size W×H px, pouring spout on the left */
function beaker(ctx,x,yBot,W,H,lw,spoutRight){
  const r=Math.min(8,W*0.08), s=Math.min(9,W*0.1);
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=lw||2.4; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  if(spoutRight){ ctx.moveTo(x-3,yBot-H); ctx.lineTo(x,yBot-H+3); } else { ctx.moveTo(x-s,yBot-H-s*0.6); ctx.quadraticCurveTo(x,yBot-H,x,yBot-H+s); }
  ctx.lineTo(x,yBot-r); ctx.quadraticCurveTo(x,yBot,x+r,yBot); ctx.lineTo(x+W-r,yBot); ctx.quadraticCurveTo(x+W,yBot,x+W,yBot-r);
  if(spoutRight){ ctx.lineTo(x+W,yBot-H+s); ctx.quadraticCurveTo(x+W,yBot-H,x+W+s,yBot-H-s*0.6); } else { ctx.lineTo(x+W,yBot-H+3); ctx.lineTo(x+W+3,yBot-H); }
  ctx.stroke(); ctx.restore();
}
/* measuring-cylinder specification: capacity, labelled step, divisions per step, graduated height and bore (cm) */
function cylSpec(cap){
  const T={10:[1,10,8.5,0.61],25:[1,10,10.5,0.87],50:[10,10,13,1.11],100:[10,10,17,1.37],250:[20,10,22,1.9],500:[50,10,26,2.47]}[cap];
  const s={cap,big:T[0],n:T[1],hg:T[2],r:T[3]}; s.lc=s.big/s.n; s.A=s.cap/s.hg; return s;
}
/* measuring cylinder drawn to scale. o = {cx, yBase (px), pc (px per cm), spec, vol, liquid:'water'|'col', fill, tilt(rad), noLabels}
   returns geometry helpers. Volume reads at the bottom of the meniscus (as the maker calibrates it). */
function drawCyl(ctx,o){
  const s=o.spec, pc=o.pc, R=s.r*pc, yB=o.yBase-0.9*pc, yT=yB-(s.hg+1.6)*pc, cx=o.cx;
  const yOf=v=>yB-v/s.A*pc;
  const footW=Math.max(2.4*R+1.4*pc,3.2*pc);
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  // foot
  ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(cx-footW/2,o.yBase); ctx.lineTo(cx+footW/2,o.yBase); ctx.lineTo(cx+footW/2-0.35*pc,o.yBase-0.55*pc); ctx.lineTo(cx-footW/2+0.35*pc,o.yBase-0.55*pc); ctx.closePath(); ctx.fill(); ctx.stroke();
  // liquid
  if(o.vol>0){
    const yl=yOf(o.vol), mh=Math.min(0.28*pc,0.55*R,Math.max(0,(yB-yl)*0.9)), lcap=Math.max(2,0.22*pc);
    const col=o.liquid==='col';
    ctx.beginPath(); ctx.moveTo(cx-R,yB);
    for(let i=0;i<=30;i++){ const x=-R+2*R*i/30, d=R-Math.abs(x); const z=-mh*Math.exp(-d/lcap); ctx.lineTo(cx+x,yl+z); }
    ctx.lineTo(cx+R,yB); ctx.closePath(); ctx.fillStyle=o.fill||WFILL2; ctx.fill();
    ctx.beginPath();
    for(let i=0;i<=30;i++){ const x=-R+2*R*i/30, d=R-Math.abs(x); const z=-mh*Math.exp(-d/lcap); ctx[i?'lineTo':'moveTo'](cx+x,yl+z); }
    ctx.strokeStyle=col?COL.red:COL.blue; ctx.lineWidth=1.8; ctx.stroke();
  }
  // tube
  ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(cx-R,yT); ctx.lineTo(cx-R,yB); ctx.lineTo(cx+R,yB); ctx.lineTo(cx+R,yT+0.25*pc); ctx.quadraticCurveTo(cx+R,yT,cx+R+0.35*pc,yT-0.25*pc); ctx.stroke();
  line(ctx,cx-R-3,yT,cx-R,yT,COL.ink,2.4);
  line(ctx,cx-R-0.25*pc,yB+0.05*pc,cx-R-0.25*pc,o.yBase-0.55*pc,COL.ink,2); line(ctx,cx+R+0.25*pc,yB+0.05*pc,cx+R+0.25*pc,o.yBase-0.55*pc,COL.ink,2);
  line(ctx,cx-R-0.25*pc,yB+0.05*pc,cx+R+0.25*pc,yB+0.05*pc,COL.ink,2);
  // graduations on the front, left half
  const N=Math.round(s.cap/s.lc), sp=s.lc/s.A*pc, x0=o.scaleRight?cx+R-1.5:cx-R+1.5, sd=o.scaleRight?-1:1;
  const labStep=(()=>{ let k=1; while(s.big*k/s.A*pc<15) k*= (k===1?2:(k===2?2.5:2)); return s.big*k; })();
  for(let i=1;i<=N;i++){
    const v=i*s.lc, y=yOf(v), isBig=Math.abs(v/s.big-Math.round(v/s.big))<1e-6, isHalf=!isBig&&s.n%2===0&&Math.abs(v/(s.big/2)-Math.round(v/(s.big/2)))<1e-6;
    if(!isBig&&!isHalf&&sp<2.1) continue;
    if(!isBig&&sp*(s.n/2)<3.2) continue;
    const L=isBig?R*0.95:(isHalf?R*0.6:R*0.38);
    line(ctx,x0,y,x0+sd*L,y,COL.ink,isBig?1.4:1);
    if(isBig&&!o.noLabels&&Math.abs(v/labStep-Math.round(v/labStep))<1e-6) textAt(ctx,fmt(v,1),o.scaleRight?cx+R+0.3*pc+6:x0+L+2,y+3.5,{size:Math.max(8,Math.min(11,pc*0.42)),weight:600,color:COL.muted});
  }
  if(!o.noLabels) textAt(ctx,s.cap+' mL',cx,yT+0.55*pc+4,{align:'center',size:Math.max(8,Math.min(11,pc*0.42)),weight:700,color:COL.ink});
  ctx.restore();
  return {yOf,yB,yT,R,x0,cx,sp};
}
/* liquid stream leaving (x0,y0) with horizontal speed vx (px/s), falling with g (px/s²) until y = yEnd */
function stream(ctx,x0,y0,vx,g,yEnd,wd,t,col){
  if(wd<=0.2) return null;
  const T=Math.sqrt(Math.max(0,2*(yEnd-y0)/g)); let xe=x0;
  ctx.save(); ctx.strokeStyle=col||COL.blue; ctx.lineCap='round'; ctx.globalAlpha=0.85;
  ctx.lineWidth=Math.max(1.4,wd); ctx.beginPath();
  for(let i=0;i<=24;i++){ const tt=T*i/24, x=x0+vx*tt+Math.sin(t*40+i)*0.4*(i/24), y=y0+0.5*g*tt*tt; ctx[i?'lineTo':'moveTo'](x,y); xe=x; }
  ctx.stroke(); ctx.restore();
  return xe;
}
/* teaspoon: bowl centre (x,y), tilt tau (clockwise, rad), u = px per cm; load 0..1 heaped red grains */
function spoon(ctx,x,y,tau,u,load,seed){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tau); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(-1.1*u,0); ctx.quadraticCurveTo(-1.6*u,-0.7*u,-6.5*u,-2.2*u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1.15*u,0); ctx.ellipse(0,0,1.15*u,0.55*u,0,Math.PI,0,true); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(load>0.01){ const r=rng(seed||3), n=Math.round(22*load);
    ctx.beginPath(); ctx.moveTo(-1.05*u,0); ctx.quadraticCurveTo(0,-0.9*u*load,1.05*u,0); ctx.strokeStyle=COL.red; ctx.lineWidth=1.8; ctx.stroke();
    for(let k=0;k<n;k++){ const px=(r()*2-1)*0.9*u, top=-0.8*u*load*(1-px*px/(u*u)); dot(ctx,px,top*r()+0.05*u,0.9+r()*0.6,null,COL.red); } }
  ctx.restore();
}
function spoonTip(x,y,tau,u){ return [x+Math.cos(tau)*1.15*u, y+Math.sin(tau)*1.15*u]; }

/* eye in profile looking along +dir (±1) — sight point at (x,y) */
function eyeIcon(ctx,x,y,u,dir){

/* heap of resting grains: sorted by radius, laid onto a 2-D cone with an
   angle of repose of ~30° (slope 0.58) that flattens when it reaches the
   walls. Sets g.hx (x offset) and g.hy (height) in cm. a0 = area per grain */
function heapLayout(rest,a0,Rmax){
  const n=rest.length; if(!n) return; rest.sort((a,b)=>a.r-b.r);
  let Rc=Math.sqrt(n*a0/0.58), slope=0.58; if(Rc>Rmax){ Rc=Rmax; slope=n*a0/(Rc*Rc); }

}

/* =====================================================================

   Common salt: solubility ≈ 36 g per 100 mL of water (room temperature).
   One level teaspoon ≈ 6 g, drawn as 60 grains of 0.1 g.
   Each grain dissolves at     dm/dt = −k · m^⅔ · (1 − C/Cs)

     nears saturation, so the last spoons are slow and the extra stays.

   sink at ≈ 3 cm/s. The rod spins the water up (τ ≈ 1.2 s) and it spins
   down slowly (τ ≈ 3.5 s); the surface dips as a vortex, z = ω²r²/2g,

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Water in the tumbler <span class="val" id="vV"></span></label><input type="range" id="vS" min="50" max="200" step="10" value="100"></div>
    <div class="control-group">
      <button class="toggle-btn play" id="add" style="width:100%;padding:9px;">🥄 Add one spoon of salt</button>
      <div class="toggle-group"><button class="toggle-btn" id="stir">🌀 Stir</button><button class="toggle-btn" id="rst">↺ Fresh water</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Spoons added</div><div class="rval" id="rs">0</div></div>
      <div class="rcard"><div class="rlabel">Lying at bottom</div><div class="rval" id="ru">0 g</div></div>
      <div class="rcard"><div class="rlabel">Salt dissolved</div><div class="rval" id="rd">0 g</div></div>
      <div class="rcard"><div class="rlabel">Solution</div><div class="rval" id="rk">—</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">1 spoon ≈ 6 g · dissolving clock ×4</div></div>
    <div class="control-group"><label>Table 9.1</label><table class="log"><thead><tr><th>Spoon</th><th>Observation</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');

  const R0=2.6, RT=3.4, GH=11, BASE=0.6, XC=14, BOWL=6.2;
  const Rof=y=>R0+(RT-R0)*clamp(y,0,GH)/GH;

  let stir=false, wRod=0, phi=0, ww=0, t=0, prevTip=null, load=0, released=0;
  const R=rng(11);

  function reset(){ grains=[]; D=0; spoons=0; pend=0; anim=-1; spoonsMass=[]; lev.x=0; lev.v=0; load=0; }
  $('#vS').oninput=e=>{ V=+e.target.value; hT=solveUp(Vof,V,0,GH); reset(); };
  $('#add').onclick=()=>{ pend++; };
  $('#stir').onclick=()=>{ stir=!stir; $('#stir').classList.toggle('active',stir); };
  $('#rst').onclick=()=>reset();

  // spoon keyframes (world cm, tilt rad) — rest, dip, scoop, carry, pour, back
  const RIM=BASE+GH;
  const KF=[[0,BOWL+0.9,1.3,1.2],[0.45,BOWL,1.35,-0.1],[0.8,BOWL+0.3,3.9,-0.2],[1.8,XC-1.9,RIM+1.8,0],[2.7,XC-1.9,RIM+1.6,1.75],[3.1,XC-1.9,RIM+1.9,1.6],[4.0,BOWL+0.9,1.3,1.2]];
  function pose(s){ for(let i=1;i<KF.length;i++){ if(s<=KF[i][0]){ const a=KF[i-1], b=KF[i], e=smooth01(0,1,(s-a[0])/(b[0]-a[0]));
        let x=lerp(a[1],b[1],e), y=lerp(a[2],b[2],e); if(i===3) y+=Math.sin(Math.PI*e)*3.2; return [x,y,lerp(a[3],b[3],e)]; } }
    return KF[0].slice(1); }

    ww+= (stir?(wRod*0.8-ww)/1.2:-ww/3.5)*dt;

    let sp=pose(anim<0?0:anim);
    if(anim>=0){ anim+=dt; if(anim>=KF[KF.length-1][0]) anim=-1; }
    const tipW=spoonTip(X(sp[0]),Y(sp[1]),sp[2],pc*0.9); const tip=[(tipW[0]-ox)/pc,(oy-tipW[1])/pc];
    const tv=prevTip&&dt>0?[(tip[0]-prevTip[0])/dt,(tip[1]-prevTip[1])/dt]:[0,0]; prevTip=tip;
    if(anim>=0&&load>0&&sp[2]>0.75){ const want=Math.min(NG,Math.round(NG*clamp((sp[2]-0.75)/0.85,0,1)));
      while(released<want){ released++; const m=spoonsMass[spoons-1]/NG;

      if(g.ph==='rest'&&ww>4.5&&R()<dt*ww*0.25){ g.ph='w'; g.vr=2; g.r=R()*(R0-0.4); }
      if(g.ph==='w'){ g.vr=approach(g.vr,-VS+lift,6,dt); g.ry+=g.vr*dt; if(g.ry<=0){ g.ry=0; g.ph='rest'; } if(g.ry>lvl-0.2){ g.ry=lvl-0.2; g.vr=-1; }
        g.th+=ww*0.85*dt; g.r=clamp(g.r+gauss()*Math.sqrt(ww+0.2)*1.6*Math.sqrt(dt)*0.5+0.03*ww*dt,0.05,Rof(g.ry)-0.2); }
      else { g.th+=ww*0.3*dt; if(ww>0.4) g.r=Math.max(0,g.r-0.14*ww*dt); }
      if(drive>0){ const s=Math.cbrt(g.m), ds=(kk*(g.ph==='rest'?0.6:1)/3)*drive*dt*4, s2=Math.max(0,s-ds), dm=g.m-s2*s2*s2; const room=Math.max(0,CS*V-D); const take=Math.min(dm,room); g.m-=take; D+=take; }
    }
    grains=grains.filter(g=>g.m>1e-5);

    // ---------- draw: table, bowl of salt
    line(ctx,X(0.2),Y(0),X(25.3),Y(0),COL.ink,2.4);
    { const bx=X(BOWL), by=Y(0), bw=2.6*pc, bh=1.9*pc;
      ctx.save(); ctx.beginPath(); ctx.moveTo(bx-bw,by-bh); ctx.quadraticCurveTo(bx-bw,by,bx,by); ctx.quadraticCurveTo(bx+bw,by,bx+bw,by-bh); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.moveTo(bx-bw*0.92,by-bh*0.75); ctx.quadraticCurveTo(bx,by-bh*1.25,bx+bw*0.92,by-bh*0.75); ctx.quadraticCurveTo(bx+bw*0.9,by-bh*0.1,bx,by-bh*0.05); ctx.quadraticCurveTo(bx-bw*0.9,by-bh*0.1,bx-bw*0.92,by-bh*0.75); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
      const r=rng(4); for(let k=0;k<40;k++){ const u=r()*2-1; dot(ctx,bx+u*bw*0.85,by-bh*(0.2+0.6*r()*(1-u*u)),1.1,null,COL.red); }
      textAt(ctx,'salt',bx,by+16,{align:'center',size:11,weight:600,color:COL.muted}); }

    // ---------- tumbler water
    const yb=BASE;
    ctx.save(); ctx.beginPath(); ctx.moveTo(X(XC-R0),Y(yb));
    for(let i=0;i<=40;i++){ const x=-Rs+2*Rs*i/40; ctx.lineTo(X(XC+x),Y(yb+surf(Math.abs(x)))); }
    ctx.lineTo(X(XC+R0),Y(yb)); ctx.closePath(); ctx.fillStyle=WFILL; ctx.fill();
    ctx.beginPath(); for(let i=0;i<=40;i++){ const x=-Rs+2*Rs*i/40; ctx[i?'lineTo':'moveTo'](X(XC+x),Y(yb+surf(Math.abs(x)))+Math.sin(i*0.7+t*4)*0.6*Math.min(1,ww/3)); } ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    // swirl arrows in the water
    if(ww>1){ ctx.save(); ctx.globalAlpha=clamp(ww/8,0,0.8); for(let k=0;k<3;k++){ const yy=Y(yb+lvl*(0.25+0.25*k)), a=(t*ww*0.35+k*2)%(Math.PI*2), rr=Rof(lvl*(0.25+0.25*k))*0.75*pc;
        ctx.beginPath(); ctx.ellipse(X(XC),yy,rr,rr*0.16,0,a,a+1.6); ctx.strokeStyle=COL.green; ctx.lineWidth=1.8; ctx.stroke(); const ea=a+1.6; arrowHead(ctx,X(XC)+Math.cos(ea)*rr,yy+Math.sin(ea)*rr*0.16,ea+Math.PI/2,COL.green,6); } ctx.restore(); }

      const sz=Math.max(0.8,0.12*pc*Math.cbrt(g.m/0.1));
      ctx.save(); ctx.translate(px,py-sz*0.5); ctx.rotate(g.n+(g.ph==='w'?t*2:0)); ctx.strokeStyle=COL.red; ctx.lineWidth=1.3; ctx.fillStyle='#fff'; ctx.fillRect(-sz/2,-sz/2,sz,sz); ctx.strokeRect(-sz/2,-sz/2,sz,sz); ctx.restore();
    }

    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(X(XC-RT),Y(RIM)); ctx.lineTo(X(XC-R0),Y(yb)); ctx.lineTo(X(XC+R0),Y(yb)); ctx.lineTo(X(XC+RT),Y(RIM)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(XC-RT-0.2),Y(RIM)); ctx.lineTo(X(XC-R0-0.25),Y(0)); ctx.lineTo(X(XC+R0+0.25),Y(0)); ctx.lineTo(X(XC+RT+0.2),Y(RIM)); ctx.stroke(); ctx.restore();

    // ---------- concentration gauge: g of salt per 100 mL of water
    { const gx=X(20.4), g0=Y(yb), g1=Y(yb+9.5), cmax=40, conc=D/V*100, fy=v=>g0+(g1-g0)*v/cmax;
      rect(ctx,gx-0.35*pc,g1,0.7*pc,g0-g1,COL.ink,'#fff',2);
      ctx.save(); ctx.fillStyle='rgba(217,67,43,0.22)'; ctx.fillRect(gx-0.35*pc+2,fy(conc),0.7*pc-4,g0-fy(conc)); ctx.restore();
      line(ctx,gx-0.35*pc+2,fy(conc),gx+0.35*pc-2,fy(conc),COL.red,2.2);
      for(let v=0;v<=40;v+=10){ line(ctx,gx+0.35*pc,fy(v),gx+0.35*pc+5,fy(v),COL.ink,1.2); textAt(ctx,String(v),gx+0.35*pc+8,fy(v)+4,{size:10,color:COL.muted}); }
      line(ctx,gx-0.35*pc-6,fy(36),gx+0.35*pc+2,fy(36),COL.red,1.6,[4,3]); textAt(ctx,'full',gx-0.35*pc-8,fy(36)+4,{align:'right',size:10,weight:700,color:COL.red});

    { const Rl=Math.min(3.1*pc,w*0.14), cx=X(21.8), cy=Y(15.2);
      zoomFrame(ctx,cx,cy,Rl,X(XC+0.8),Y(yb+lvl*0.55),'magnified',()=>{

        if(crys){ const s=Rl*0.14; for(let gx=-4;gx<=4;gx++) for(let gy=0;gy<3;gy++){ const px=cx+gx*s, py=cy+Rl*0.58+gy*s; ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=1.2; ctx.strokeRect(px-s/2,py-s/2,s,s); ctx.restore(); dot(ctx,px,py,s*0.18,null,COL.red); } }
      }); }

    $('#rs').textContent=spoons+(pend?' (+'+pend+')':'');
    $('#ru').textContent=fmt(und,1)+' g'; $('#rd').textContent=fmt(D,1)+' g';
    const sat=C>=CS*0.999&&und>0.02;
