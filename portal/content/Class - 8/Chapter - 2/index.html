    if(run && i===2) S.stain=0;
    if(i===3) S.M=mountState();
  });

  function sceneScrape(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>4) st.finish(); }
    // inner cheek surface (curve) with lining cells
    const wallX=u=>w*0.3+Math.sin(u*Math.PI)*w*0.06, wallY=u=>h*0.12+u*h*0.76;
    ctx.save(); ctx.beginPath(); ctx.moveTo(0,h*0.12); for(let u=0;u<=1.001;u+=0.02) ctx.lineTo(wallX(u),wallY(u)); ctx.lineTo(0,h*0.88); ctx.closePath();
    ctx.fillStyle='#fdf3f1'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.beginPath(); for(let u=0;u<=1.001;u+=0.02) u?ctx.lineTo(wallX(u),wallY(u)):ctx.moveTo(wallX(u),wallY(u)); ctx.stroke(); ctx.restore();
    // lips (top & bottom)
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(wallX(0),h*0.12); ctx.quadraticCurveTo(w*0.42,h*0.02,w*0.5,h*0.1); ctx.moveTo(wallX(1),h*0.88); ctx.quadraticCurveTo(w*0.42,h*0.98,w*0.5,h*0.9); ctx.stroke(); ctx.restore();
    textAt(ctx,'inside of cheek',w*0.1,h*0.5,{size:12,color:COL.muted});
    // toothpick: tip slides up and down the lining (3 strokes)
    let tipU=0.5, off=60;
    if(st.run){ const a=smooth01(0,0.6,st.t), b=1-smooth01(3.3,3.9,st.t); off=lerp(60,2,a*b); tipU=0.5+0.32*Math.sin(Math.max(0,st.t-0.6)*Math.PI*0.9); }
    else if(st.done[0]) off=90;
    const tipX=wallX(tipU)+off, tipY=wallY(tipU);
    lining.forEach((c,i)=>{
      const x=wallX(c.u)+5, y=wallY(c.u);
      if(!c.taken && st.run && off<6 && Math.abs(c.u-tipU)<0.03){ c.taken=true; c.stuck={dx:(Math.random()-0.5)*8,dy:(Math.random()-0.5)*8}; S.got++; }
      if(!c.taken){ ctx.save(); ctx.translate(x,y); ctx.beginPath(); ctx.ellipse(0,0,4,h*0.014,0,0,Math.PI*2); ctx.strokeStyle='#d7a4a0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }
    });
    // pick, drawn as a blunt stick
    ctx.save(); ctx.lineCap='round'; line(ctx,tipX,tipY,tipX+w*0.36,tipY+h*0.18,COL.ink,8); line(ctx,tipX,tipY,tipX+w*0.36,tipY+h*0.18,'#fff',4); ctx.restore();
    lining.forEach(c=>{ if(c.taken) { ctx.save(); ctx.translate(tipX+c.stuck.dx,tipY+c.stuck.dy); ctx.beginPath(); ctx.ellipse(0,0,4,6,0.6,0,Math.PI*2); ctx.strokeStyle='#c7837d'; ctx.fillStyle='#fdf3f1'; ctx.lineWidth=1.4; ctx.fill(); ctx.stroke(); ctx.restore(); } });
  }
  function sceneSmear(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>3.4) st.finish(); }
    const cx=w*0.46, cy=h*0.5, SW=Math.min(w*0.7,620), SH=SW*0.34;
    rect(ctx,cx-SW/2,cy-SH/2,SW,SH,COL.blue,'#f4f9fe',2.2);
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,SH*0.42,SH*0.34,0,0,Math.PI*2); ctx.fillStyle='rgba(47,143,224,0.1)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    let tx=cx+SH*0.9, ty=cy-SH*0.9;
    if(st.run){ const u=clamp((st.t-0.4)/2.6,0,1), r=u*SH*0.3, a=u*Math.PI*7; tx=cx+Math.cos(a)*r; ty=cy+Math.sin(a)*r*0.8;
      if(u>0 && u<1 && Math.random()<dt*30) S.smear.push({x:tx-cx+(Math.random()-0.5)*6,y:ty-cy+(Math.random()-0.5)*6,r:Math.random()*6}); }
    S.smear.forEach(c=>{ ctx.save(); ctx.translate(cx+c.x,cy+c.y); ctx.rotate(c.r); ctx.beginPath(); ctx.ellipse(0,0,4,3,0,0,Math.PI*2); ctx.strokeStyle='#c7837d'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); });
    ctx.save(); ctx.lineCap='round'; line(ctx,tx,ty,tx+w*0.22,ty-h*0.3,COL.ink,8); line(ctx,tx,ty,tx+w*0.22,ty-h*0.3,'#fff',4); ctx.restore();
    textAt(ctx,'drop of water',cx,cy+SH/2+22,{align:'center',size:12,color:COL.blue});
  }
  function sceneStain(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>4.6) st.finish(); }
    const cx=w*0.46, cy=h*0.6, SW=Math.min(w*0.7,620), SH=SW*0.34;
    rect(ctx,cx-SW/2,cy-SH/2,SW,SH,COL.blue,'#f4f9fe',2.2);
    const T=st.done[2]?9:st.run?st.t:0;
    const dy0=Math.max(h*0.24,112), tImpact=Math.sqrt(2*(cy-dy0)/1800)+0.2;
    rect(ctx,cx-6,dy0-70,12,62,COL.ink,'#fff',2);
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,dy0-78,11,14*(st.run&&T<0.3?0.7:1),0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    if(st.run && T>0.2 && T<tImpact){ const tt=T-0.2; circ(ctx,cx,dy0+0.5*1800*tt*tt,5,COL.blue,'#5d9fe0',1.6); }
    if(T>=tImpact){ const r=SH*0.12*Math.sqrt(1+(T-tImpact)/0.15); const rr=Math.min(r,SH*0.44);
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rr,rr*0.8,0,0,Math.PI*2); ctx.fillStyle='rgba(47,143,224,0.28)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
      if(st.run) S.stain+=(1-S.stain)/0.4*dt*0.5; }
    S.smear.forEach(c=>{ ctx.save(); ctx.translate(cx+c.x,cy+c.y); ctx.rotate(c.r); ctx.beginPath(); ctx.ellipse(0,0,4,3,0,0,Math.PI*2); ctx.strokeStyle='#c7837d'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
      circ(ctx,cx+c.x,cy+c.y,1.3,mixCol('#c7837d','#1d5fa0',S.stain),mixCol('#c7837d','#1d5fa0',S.stain),1); });
    if(st.run && T>tImpact){ const rx=cx+SW/2-30, ry=h*0.14, u=clamp((T-tImpact)/3,0,1);
      circ(ctx,rx,ry,18,'#e6edf5',null,4); ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(rx,ry,18,-Math.PI/2,-Math.PI/2+Math.PI*2*u); ctx.stroke(); ctx.restore();
      textAt(ctx,Math.round(u*60)+' s',rx,ry+4,{align:'center',size:10,weight:700}); }
    textAt(ctx,'methylene blue',cx+18,dy0-40,{size:12,weight:700,color:COL.blue});
  }
  function sceneLook(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>0.8) st.finish(); }
    const focus=parseFloat(foR.value), on=st.done[4]||st.run, stn=Math.max(S.stain,0.08);
    if(view==='cheek'){
      const cx=w*0.64, cy=h*0.5, R=Math.min(h*0.44,w*0.32);
      scopeStep(ctx,w,h,dt,t,S.SC,obj40,focus,on,k=>{ cheekField(ctx,cx,cy,k,stn,t,ccells); bubbleField(ctx,cx,cy,k,S.bubbles||0); },cx,cy,R);
    } else {
      const R=Math.min(h*0.36,w*0.22), cy=h*0.47, ax=w*0.27, bx=w*0.73;
      const r1=scopeStep(ctx,w,h,dt,t,S.SC,obj40,focus,on,k=>cheekField(ctx,ax,cy,k,stn,t,ccells),ax,cy,R,false);
      scopeStep(ctx,w,h,dt,t,S.SC2,obj40,focus,on,k=>onionField(ctx,bx,cy,k,0.85,true,t,ocells,R),bx,cy,R,false);
      textAt(ctx,'Cheek (animal)',ax,cy+R+26,{align:'center',size:13,weight:700,color:COL.blue});
      textAt(ctx,'Onion (plant)',bx,cy+R+26,{align:'center',size:13,weight:700,color:COL.green});
      if(r1.blur<3 && S.SC.light>0.5){
        textAt(ctx,'no cell wall · irregular',ax,cy+R+44,{align:'center',size:11.5,color:COL.muted});
        textAt(ctx,'cell wall · brick-like',bx,cy+R+44,{align:'center',size:11.5,color:COL.muted});
      }
    }
    $('#c1').innerHTML='<span style="color:var(--f-green)">Onion ✓</span> · <span style="color:var(--f-red)">Cheek ✗</span>';
    $('#c2').textContent='Irregular';
  }
  animLoop((dt)=>{
    t+=dt;
    $('#anV').textContent=anR.value+'°'; $('#foV').textContent=foR.value;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    if(st.i===0) sceneScrape(ctx,w,h,dt);
    else if(st.i===1) sceneSmear(ctx,w,h,dt);
    else if(st.i===2) sceneStain(ctx,w,h,dt);
    else if(st.i===3){ const nb=mountScene(ctx,w,h,S.M,st,dt,+anR.value,'rgba(47,143,224,0.2)',mixCol('#fdf3f1','#5d9fe0',S.stain*0.6),'#1d5fa0',t); if(st.done[3]) S.bubbles=nb; }
    else sceneLook(ctx,w,h,dt);
    $('#r1').textContent=S.got; $('#r2').textContent=Math.round(S.stain*100)+'%';
  });
  return wrap;
}

/* =====================================================================
   2.4 LIFE IN POND WATER
   A drop ≈ 3 × 2 mm. Stage moves on a spring-damper (like a real
   mechanical stage). Field: 10× ≈ 1.8 mm, 40× ≈ 0.45 mm across.
   Depth of field is ~4× smaller at 40×, so focus is touchier.
   ===================================================================== */
const POND_KIND={amoeba:{n:'Amoeba',c:COL.blue}, param:{n:'Paramecium',c:COL.yellow}, spiro:{n:'Spirogyra',c:COL.green}, chlamy:{n:'Chlamydomonas',c:COL.green}};
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Stage ↔ <span class="val" id="xV"></span></label><input type="range" id="xR" min="-1400" max="1400" value="0">
      <label style="margin-top:8px;">Stage ↕ <span class="val" id="yV"></span></label><input type="range" id="yR" min="-900" max="900" value="0"></div>
    <div class="control-group"><label style="margin-bottom:6px;">Objective</label>
      <div class="toggle-group" id="obB"><button class="toggle-btn active" data-o="10">10×</button><button class="toggle-btn" data-o="40">40×</button></div>
      <label style="margin-top:10px;">Focus knob <span class="val" id="foV"></span></label><input type="range" id="foR" min="0" max="100" value="58"></div>
    <button class="toggle-btn play" id="logB" style="flex:0 0 auto;padding:10px;">⊕ Log what's in the centre</button>
    <div id="fb"></div>
    <div class="control-group"><label style="margin-bottom:4px;">Journal <span class="val" id="cnt">0 / 4</span></label><div class="chip-wrap" id="jr"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), xR=$('#xR'), yR=$('#yR'), foR=$('#foR');
  let obj40=false, t=0;
  toggleWire(wrap.querySelectorAll('#obB button'),b=>obj40=b.dataset.o==='40');
  const RX=1500, RY=1000;
  const orgs=[];
  [[-900,-400],[800,500]].forEach(p=>orgs.push(Object.assign(newAmoeba(p[0],p[1]),{kind:'amoeba'})));
  for(let i=0;i<4;i++) orgs.push({kind:'param',x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*1400,a:Math.random()*6.28,sp:170+Math.random()*60});
  orgs.push({kind:'spiro',x:300,y:-550,a:0.35,nc:12,ph:0}); orgs.push({kind:'spiro',x:-500,y:600,a:-0.2,nc:9,ph:2});
  for(let i=0;i<7;i++) orgs.push({kind:'chlamy',x:-1000+Math.random()*500,y:200+Math.random()*400,a:Math.random()*6.28,sp:70});
  const debris=Array.from({length:70},()=>({x:(Math.random()-0.5)*2*RX,y:(Math.random()-0.5)*2*RY,r:4+Math.random()*14,a:Math.random()*6}));
  const found={}; const labelled=new Set();
  function drawJournal(){
    $('#jr').innerHTML=Object.keys(POND_KIND).map(k=>`<span class="chip-btn${found[k]?' ok':''}">${found[k]?'✓ ':''}${POND_KIND[k].n}</span>`).join('');
    $('#cnt').textContent=Object.keys(found).length+' / 4';
  }
  drawJournal();
  const stage={x:{x:0,v:0},y:{x:0,v:0}}, SC=scopeState();
  $('#logB').onclick=()=>{
    const k=Math.exp(SC.logk), R=parseFloat(canvas._h||400)*0.44;
    let best=null, bd=1e9;
    orgs.forEach(o=>{ let d;
      if(o.kind==='spiro'){ const L=o.nc*70/2, ux=Math.cos(o.a), uy=Math.sin(o.a), px=stage.x.x-o.x, py=stage.y.x-o.y, s=clamp(px*ux+py*uy,-L,L); d=Math.hypot(px-s*ux,py-s*uy); }
      else d=Math.hypot(o.x-stage.x.x,o.y-stage.y.x);
      if(d<bd){ bd=d; best=o; } });
    const fieldR=(obj40?450:1800)/2;
    const blur=Math.abs(parseFloat(foR.value)-60)*(obj40?0.22:0.09);
    if(blur>3){ $('#fb').innerHTML='<div class="fb warn">Too blurry — focus first</div>'; return; }
    if(!best || bd>fieldR*0.35){ $('#fb').innerHTML='<div class="fb warn">Nothing in the centre — move the stage</div>'; return; }
    if(best.kind==='chlamy' && !obj40){ $('#fb').innerHTML='<div class="fb warn">Too small to see clearly — try 40×</div>'; return; }
    found[best.kind]=true; labelled.add(best); drawJournal();
    $('#fb').innerHTML=`<div class="fb ok">✓ ${POND_KIND[best.kind].n}</div>`;
  };

  animLoop((dt)=>{
    t+=dt;
    const focus=parseFloat(foR.value);
    $('#xV').textContent=(xR.value/1000).toFixed(1)+' mm'; $('#yV').textContent=(yR.value/1000).toFixed(1)+' mm'; $('#foV').textContent=focus;
    springTo(stage.x,+xR.value,14,7.5,dt); springTo(stage.y,+yR.value,14,7.5,dt);
    // living things move on their own
    orgs.forEach(o=>{
      if(o.kind==='param') swim(o,dt,o.sp,1.2,RX,RY);
      else if(o.kind==='chlamy'){ swim(o,dt,o.sp,3,RX,RY); o.x+=Math.sin(t*20)*0.4; }
      else if(o.kind==='amoeba'){ o.a+=gauss()*0.15*Math.sqrt(dt); o.a2+=gauss()*0.3*Math.sqrt(dt); o.x+=Math.cos(o.a)*9*dt; o.y+=Math.sin(o.a)*9*dt; if(Math.abs(o.x)>RX-150||Math.abs(o.y)>RY-150) o.a=Math.atan2(-o.y,-o.x); }
      else if(o.kind==='spiro'){ o.x+=Math.sin(t*0.1+o.ph)*2*dt; }
    });
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.64, cy=h*0.5, R=Math.min(h*0.44,w*0.33);
    // mini-map of the drop (top-left)
    const mw=w*0.26, mh=mw*RY/RX, mx=w*0.03, my=h*0.05, ms=mw/(2*RX);
    ctx.save(); ctx.beginPath(); ctx.ellipse(mx+mw/2,my+mh/2,mw/2,mh/2,0,0,Math.PI*2); ctx.fillStyle='#f4f9fe'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
    orgs.forEach(o=>circ(ctx,mx+mw/2+o.x*ms,my+mh/2+o.y*ms,o.kind==='chlamy'?1.2:2.4,COL.mid,COL.mid,1));
    const fr=(obj40?450:1800)/2*ms;
    circ(ctx,mx+mw/2+stage.x.x*ms,my+mh/2+stage.y.x*ms,fr,COL.yellow,null,2);
    textAt(ctx,'pond-water drop',mx+mw/2,my+mh+16,{align:'center',size:11,color:COL.muted});
    const on=true;
    const r=(()=>{
      springTo(SC.nose,obj40?1:0,40,10,dt); springTo(SC.tube,(focus-50)*0.55,60,13,dt); SC.light=approach(SC.light,1,4,dt);
      const kT=R/((obj40?450:1800)/2); SC.logk=approach(SC.logk,Math.log(kT),5,dt); const k=Math.exp(SC.logk);
      drawMicroscope(ctx,w*0.16,h*0.95,h*0.56,{nose:SC.nose.x,tube:SC.tube.x,knob:focus*0.12,stage:-stage.x.x*0.008,light:1,slideCol:'rgba(31,157,85,0.4)'},t);
      const blur=Math.abs(focus-60)*(obj40?0.22:0.09)+Math.abs(SC.nose.x-(obj40?1:0))*10;
      eyepiece(ctx,cx,cy,R,blur,()=>{
        const X=x=>cx+(x-stage.x.x)*k, Y=y=>cy+(y-stage.y.x)*k;
        debris.forEach(d=>{ ctx.save(); ctx.translate(X(d.x),Y(d.y)); ctx.rotate(d.a); ctx.beginPath(); ctx.moveTo(-d.r*k,0); ctx.lineTo(0,-d.r*0.6*k); ctx.lineTo(d.r*k,d.r*0.2*k); ctx.lineTo(0,d.r*0.7*k); ctx.closePath(); ctx.strokeStyle='#c9d3de'; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); });
        orgs.forEach(o=>{
          const sx=X(o.x), sy=Y(o.y); if(sx<cx-R-900*k||sx>cx+R+900*k||sy<cy-R-900*k||sy>cy+R+900*k) return;
          if(o.kind==='param') orgParamecium(ctx,sx,sy,o.a,k,t);
          else if(o.kind==='amoeba') orgAmoeba(ctx,o,sx,sy,k,t);
          else if(o.kind==='spiro') orgSpirogyra(ctx,sx,sy,o.a,k,t,o.nc,o.ph);
          else orgChlamy(ctx,sx,sy,o.a,k,t);
        });
      });
      // names of logged organisms
      labelled.forEach(o=>{ const sx=cx+(o.x-stage.x.x)*k, sy=cy+(o.y-stage.y.x)*k; if(Math.hypot(sx-cx,sy-cy)<R*0.9){ const c=POND_KIND[o.kind]; textAt(ctx,c.n,sx,sy-Math.max(18,(o.kind==='chlamy'?16:o.kind==='spiro'?40:120)*k),{align:'center',size:12,weight:700,color:c.c}); } });
      scaleBar(ctx,cx,cy+R*0.82,k);
      line(ctx,cx-10,cy,cx+10,cy,COL.red,1.4); line(ctx,cx,cy-10,cx,cy+10,COL.red,1.4);
      return {k,blur};
    })();
    textAt(ctx,(obj40?400:100)+'×',cx+R*0.72,cy-R*0.78,{size:14,weight:700,color:COL.ink});
  });
  return wrap;
}

/* =====================================================================
   2.5 SOIL SUSPENSION
   Settling follows Stokes' law:  v = 2·Δρ·g·r² / (9·μ)
     Δρ = 1650 kg/m³, μ = 1.0×10⁻³ Pa·s, water column 10 cm
     sand  r = 100 µm → 3.6 cm/s  → settles in ~3 s
     silt  r =  12 µm → 0.52 mm/s → ~3 min
     clay  r = 1.2 µm → 5.2 µm/s  → ~5 h
   Clock after stirring runs on an accelerating scale:
     dt_sim = dt·(1 + 0.9·t_sim)  (seconds → hours in ~12 s)
   ===================================================================== */
const SOIL_CLS=[
  {n:'sand', r:100e-6, count:70,  size:3.2, col:'#8a6a3d', bed:0.0024},
  {n:'silt', r:12e-6,  count:150, size:2.0, col:'#a8895a', bed:0.0009},
  {n:'clay', r:1.2e-6, count:280, size:1.2, col:'#c7b089', bed:0.00035},
];
function stokes(r){ return 2*1650*9.81*r*r/(9*1e-3); }
function fmtDur(s){ if(s<60) return Math.round(s)+' s'; if(s<3600) return Math.round(s/60)+' min'; return fmt(s/3600,1)+' h'; }
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Soil added <span class="val" id="saV"></span></label><input type="range" id="saR" min="5" max="30" step="1" value="15"></div>
    <button class="toggle-btn play" id="stirB" style="flex:0 0 auto;padding:10px;">🥄 Stir</button>
    <button class="toggle-btn navy" id="dropB" style="margin-top:0;padding:10px;">💧 Take a drop from the top</button>
    <div id="fb"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Since stirring</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Top layer</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard wide"><div class="rlabel">In the drop</div><div class="rval" id="r3">—</div></div></div>
      <p class="hint">v = 2Δρ g r² ÷ 9μ</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), saR=$('#saR');
  const Hm=0.10, BINS=26;
  let parts=[], bed=new Array(BINS).fill(0), tSim=0, stirT=0, om=0, t=0, stirred=false;
  const floaters=Array.from({length:10},()=>({x:(Math.random()-0.5)*1.7,ph:Math.random()*6}));
  function settleAll(){ // starting state: everything on the bottom
    parts=[]; bed.fill(0);
    const amt=+saR.value/15;
    SOIL_CLS.forEach((c,ci)=>{ for(let i=0;i<Math.round(c.count*amt);i++){ const x=Math.random()*2-1, b=Math.min(BINS-1,Math.floor((x+1)/2*BINS)); bed[b]+=c.bed; parts.push({ci,x,y:Hm-bed[b]+c.bed*0.5,landed:true,phi:Math.random()*6.28,rad:Math.random()}); } });
  }
  settleAll();
  saR.oninput=()=>{ if(!stirred) settleAll(); };
  const drop={phase:0,t:0,murk:0,taken:false};
  const view={bugs:[], soil:[]};
  $('#stirB').onclick=()=>{
    settleAll(); bed.fill(0);
    parts.forEach(p=>{ p.landed=false; p.y=Math.random()*Hm*0.95; });
    stirT=2.4; om=7; tSim=0; stirred=true; drop.taken=false; $('#fb').innerHTML=''; $('#r3').textContent='—';
  };
  function topMurk(){ // suspended particles in the top 2 cm, weighted by how much light each scatters
    let s=0; parts.forEach(p=>{ if(!p.landed && p.y<0.02) s+= [2.5,1.6,1][p.ci]; });
    return clamp(s/((+saR.value/15)*110),0,1);
  }
  $('#dropB').onclick=()=>{
    if(drop.phase) return;
    if(!stirred){ $('#fb').innerHTML='<div class="fb warn">Stir the soil into the water first</div>'; return; }
    drop.phase=1; drop.t=0; drop.taken=false;
  };
  function fillView(murk){
    view.bugs=[];
    for(let i=0;i<14;i++) view.bugs.push({k:'rod',x:(Math.random()-0.5)*150,y:(Math.random()-0.5)*150,a:Math.random()*6.28,len:2+Math.random()*2.5,sp:8+Math.random()*10});
    for(let i=0;i<10;i++) view.bugs.push({k:'coc',x:(Math.random()-0.5)*150,y:(Math.random()-0.5)*150,a:0});
    for(let i=0;i<2;i++) view.bugs.push({k:'flag',x:(Math.random()-0.5)*120,y:(Math.random()-0.5)*120,a:Math.random()*6.28});
    view.bugs.push({k:'hypha',x:-20,y:25,a:0.4});
    view.soil=Array.from({length:Math.round(4+murk*90)},()=>({x:(Math.random()-0.5)*180,y:(Math.random()-0.5)*180,r:3+Math.random()*9,a:Math.random()*6,n:5+Math.floor(Math.random()*3)}));
  }
  const hypha=mouldNet(9);

  animLoop((dt)=>{
    t+=dt; $('#saV').textContent=saR.value+' g';
    // clock + physics
    if(stirT>0){ stirT-=dt; }
    else if(stirred && tSim<86400) tSim+=dt*(1+0.9*tSim);
    om*=Math.exp(-(stirT>0?0:0.9)*dt);
    const dtSim=stirT>0?0:dt*(1+0.9*tSim);
    parts.forEach(p=>{
      if(p.landed) return;
      p.phi+=om*dt*(0.6+0.4*p.rad);
      p.x=Math.cos(p.phi)*(0.15+0.8*p.rad);
      if(stirT>0){ p.y+=gauss()*0.03*Math.sqrt(dt); p.y=clamp(p.y,0.002,Hm*0.97); return; }
      p.y+=stokes(SOIL_CLS[p.ci].r)*dtSim + gauss()*om*0.002*Math.sqrt(dt);
      p.y=Math.max(0.001,p.y);
      let b=Math.min(BINS-1,Math.max(0,Math.floor((p.x+1)/2*BINS)));
      if(p.y>=Hm-bed[b]){ // grains roll off a steep heap to the lower neighbour (angle of repose)
        const inc=SOIL_CLS[p.ci].bed;
        for(let q=0;q<BINS;q++){ const l=b>0?bed[b-1]:1e9, r=b<BINS-1?bed[b+1]:1e9; if(l<bed[b]-inc&&l<=r) b--; else if(r<bed[b]-inc) b++; else break; }
        p.landed=true; bed[b]+=inc; p.x=-1+(b+Math.random())/BINS*2; p.y=Hm-bed[b]+inc*0.5; }
    });
    const murk=topMurk();

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bx0=w*0.1, bx1=w*0.46, wy=h*0.22, by=h*0.86, pm=(by-wy)/Hm, bcx=(bx0+bx1)/2, bhw=(bx1-bx0)/2;
    // water with turbidity (overall suspended load)
    let susp=0; parts.forEach(p=>{ if(!p.landed) susp++; });
    const turb=clamp(susp/Math.max(1,parts.length),0,1);
    ctx.save(); ctx.fillStyle=mixCol('#eaf4fd','#b89a6c',turb*0.85); ctx.globalAlpha=0.45+0.4*turb; ctx.fillRect(bx0,wy,bx1-bx0,by-wy); ctx.restore();
    // top-layer tint shows clarity where the dropper samples
    ctx.save(); ctx.fillStyle=mixCol('#eaf4fd','#b89a6c',murk); ctx.globalAlpha=0.5; ctx.fillRect(bx0,wy,bx1-bx0,0.02*pm); ctx.restore();
    line(ctx,bx0,wy+Math.sin(t*2)*1,bx1,wy-Math.sin(t*2)*1,COL.blue,1.8);
    // particles
    parts.forEach(p=>{ const c=SOIL_CLS[p.ci]; const px=bcx+p.x*bhw*0.95, py=wy+p.y*pm; ctx.fillStyle=c.col; ctx.beginPath(); ctx.arc(px,py,c.size,0,Math.PI*2); ctx.fill(); });
    // floating leaf bits
    floaters.forEach(f=>{ const fx=bcx+f.x*bhw*0.9+Math.sin(t*0.7+f.ph)*4, fy=wy-1+Math.sin(t*2+f.ph)*1.5; line(ctx,fx-5,fy,fx+5,fy+1,COL.green,2.2); });
    // beaker (line diagram) + graduations
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx0-6,h*0.12); ctx.lineTo(bx0,h*0.14); ctx.lineTo(bx0,by+6); ctx.quadraticCurveTo(bx0,by+14,bx0+8,by+14); ctx.lineTo(bx1-8,by+14); ctx.quadraticCurveTo(bx1,by+14,bx1,by+6); ctx.lineTo(bx1,h*0.12); ctx.stroke(); ctx.restore();
    for(let c=0;c<=10;c++){ const yy=by-c*0.01*pm; line(ctx,bx1-(c%5?8:16),yy,bx1,yy,COL.mid,1.2); }
    // layer brackets once settled
    if(stirred && stirT<=0){
      let mx=0; bed.forEach(b=>mx=Math.max(mx,b));
      let prevY=1e9;
      [['sand',0],['silt',1],['clay',2]].forEach(([n,ci],i)=>{
        const ys=parts.filter(p=>p.landed&&p.ci===ci).map(p=>p.y); if(ys.length<8) return;
        ys.sort((a,b)=>a-b); const y=Math.min(wy+ys[Math.floor(ys.length/2)]*pm,prevY-15); prevY=y;
        line(ctx,bx0-10,y,bx0-26,y,SOIL_CLS[ci].col,2); textAt(ctx,n,bx0-30,y+4,{align:'right',size:11.5,weight:700,color:SOIL_CLS[ci].col});
      });
    }
    // stirrer
    if(stirT>0){ const sxp=bcx+Math.cos(t*om)*bhw*0.5; ctx.save(); ctx.lineCap='round'; line(ctx,sxp,h*0.06,bcx+Math.cos(t*om)*bhw*0.6,by-18,COL.ink,6); line(ctx,sxp,h*0.06,bcx+Math.cos(t*om)*bhw*0.6,by-18,'#fff',2.5); ctx.restore(); }
    // clock
    const kx=bx1+w*0.06, ky=h*0.18, kr=Math.min(24,h*0.05);
    circ(ctx,kx,ky,kr,COL.ink,'#fff',2.4);
    const ha=-Math.PI/2+((tSim/3600)%12)/12*Math.PI*2, ma=-Math.PI/2+((tSim/60)%60)/60*Math.PI*2;
    line(ctx,kx,ky,kx+Math.cos(ha)*kr*0.5,ky+Math.sin(ha)*kr*0.5,COL.ink,2.6); line(ctx,kx,ky,kx+Math.cos(ma)*kr*0.8,ky+Math.sin(ma)*kr*0.8,COL.ink,1.6);
    textAt(ctx,stirred?fmtDur(tSim):'—',kx,ky+kr+17,{align:'center',size:12,weight:700,color:COL.ink});
    // dropper animation: dip → squeeze → lift → carry → drop on slide
    const sx=w*0.62, sy=h*0.9;
    rect(ctx,sx-w*0.08,sy-4,w*0.16,8,COL.blue,'#eef6fe',1.8);
    const restX=bx1+w*0.06, restY=h*0.66, overX=bcx+bhw*0.3, overY=wy-12, inY=wy+0.012*pm, slY=sy-h*0.16;
    let dx=restX, dyTip=restY, squeeze=0;
    if(drop.phase){ drop.t+=dt; const T=drop.t, e=(a,b)=>smooth01(a,b,T);
      if(T<0.7){ dx=lerp(restX,overX,e(0,0.7)); dyTip=lerp(restY,overY,e(0,0.7)); }
      else if(T<1.2){ dx=overX; dyTip=lerp(overY,inY,e(0.7,1.2)); }
      else if(T<1.8){ dx=overX; dyTip=inY; squeeze=Math.sin((T-1.2)/0.6*Math.PI); if(!drop.taken&&T>1.5){ drop.taken=true; drop.murk=murk; fillView(murk); } }
      else if(T<2.3){ dx=overX; dyTip=lerp(inY,overY,e(1.8,2.3)); }
      else if(T<3.1){ dx=lerp(overX,sx,e(2.3,3.1)); dyTip=lerp(overY,slY,e(2.3,3.1)); }
      else if(T<3.5){ dx=sx; dyTip=slY; const tt=T-3.1; squeeze=Math.sin(tt/0.4*Math.PI)*0.6; circ(ctx,sx,dyTip+6+0.5*1800*tt*tt,4,COL.blue,'rgba(47,143,224,0.3)',1.4); }
      else if(T<4.1){ dx=lerp(sx,restX,e(3.5,4.1)); dyTip=lerp(slY,restY,e(3.5,4.1)); }
      else drop.phase=0;
    }
    ctx.save(); ctx.beginPath(); ctx.ellipse(dx,dyTip-86,11*(1+squeeze*0.25),14*(1-squeeze*0.3),0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    rect(ctx,dx-5,dyTip-74,10,70,COL.ink,'#fff',2); line(ctx,dx,dyTip-4,dx,dyTip,COL.ink,2);
    if(drop.taken){ ctx.save(); ctx.fillStyle=mixCol('#eaf4fd','#b89a6c',drop.murk); ctx.fillRect(dx-3,dyTip-30,6,26); ctx.restore(); }
    // microscope view of the drop (×1000)
    const vx=w*0.76, vy=h*0.4, R=Math.min(h*0.3,w*0.2), k=R/90;
    if(drop.taken && (!drop.phase||drop.t>3.4)){
      view.bugs.forEach(b=>{ if(b.k==='rod'){ b.a+=gauss()*1.5*Math.sqrt(dt); b.x+=Math.cos(b.a)*b.sp*dt; b.y+=Math.sin(b.a)*b.sp*dt; }
        else if(b.k==='flag'){ b.a+=gauss()*2*Math.sqrt(dt); b.x+=Math.cos(b.a)*20*dt; b.y+=Math.sin(b.a)*20*dt; }
        else { b.x+=gauss()*2*Math.sqrt(dt); b.y+=gauss()*2*Math.sqrt(dt); }
        if(Math.hypot(b.x,b.y)>85){ b.a=Math.atan2(-b.y,-b.x); b.x*=0.98; b.y*=0.98; } });
      eyepiece(ctx,vx,vy,R,0,()=>{
        orgMould(ctx,hypha,vx-20*k,vy+25*k,k*0.28,1.2,t);
        view.bugs.forEach(b=>{ const X=vx+b.x*k, Y=vy+b.y*k;
          if(b.k==='rod') orgBacillus(ctx,X,Y,b.a,k,b.len,t,true);
          else if(b.k==='coc') orgCoccus(ctx,X,Y,k,0.6);
          else if(b.k==='flag') orgChlamy(ctx,X,Y,b.a,k*0.7,t,false); });
        view.soil.forEach(s=>{ ctx.save(); ctx.translate(vx+s.x*k,vy+s.y*k); ctx.rotate(s.a+t*0.02); ctx.beginPath(); for(let i=0;i<s.n;i++){ const a=i/s.n*Math.PI*2, rr=s.r*k*(0.7+0.3*Math.sin(i*2.3)); i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.closePath(); ctx.fillStyle='rgba(138,106,61,0.75)'; ctx.fill(); ctx.strokeStyle='#6d5230'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); });
      });
      scaleBar(ctx,vx,vy+R*0.8,k);
      textAt(ctx,'×1000',vx+R*0.7,vy-R*0.8,{size:13,weight:700});
      textAt(ctx,drop.murk<0.25?'bacteria · fungus · protozoa':'soil particles hide the microbes',vx,vy+R+24,{align:'center',size:12,weight:700,color:drop.murk<0.25?COL.blue:COL.red});
    } else {
      ctx.save(); ctx.setLineDash([6,6]); circ(ctx,vx,vy,R,COL.mid,null,2); ctx.restore();
      textAt(ctx,'drop under the microscope',vx,vy+4,{align:'center',size:12,color:COL.muted});
    }
    $('#r1').textContent=stirred?fmtDur(tSim):'—';
    $('#r2').textContent=!stirred?'Clear':murk<0.08?'Clear':murk<0.3?'Hazy':'Muddy';
    if(drop.taken && (!drop.phase||drop.t>3.4)) $('#r3').textContent=drop.murk<0.25?'Microbes clearly seen':'Mostly mud';
  });
  return wrap;
}

/* =====================================================================
   2.6 GROUPS OF MICROBES
   Each specimen is shown at its true scale (see the scale bar).
   Bacillus divides by binary fission every cycle; yeast buds;
   bread mould grows hyphae then sporangia.
   ===================================================================== */
const SPECS=[
  {id:'bacillus', n:'Bacillus',     g:'Bacteria', field:26},
  {id:'spirillum',n:'Spirillum',    g:'Bacteria', field:60},
  {id:'mould',    n:'Bread mould',  g:'Fungi',    field:520},
  {id:'yeast',    n:'Yeast',        g:'Fungi',    field:46},
  {id:'amoeba',   n:'Amoeba',       g:'Protozoa', field:760},
  {id:'param',    n:'Paramecium',   g:'Protozoa', field:560},
  {id:'chlamy',   n:'Chlamydomonas',g:'Algae',    field:90},
  {id:'spiro',    n:'Spirogyra',    g:'Algae',    field:420},
];
const GROUPS=[['Bacteria',COL.blue],['Fungi',COL.yellow],['Protozoa',COL.red],['Algae',COL.green]];
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Specimen</label><div class="chip-wrap" id="spC"></div></div>
    <div class="control-group"><label>It belongs to…</label>
      <div class="toggle-group" id="gB">${GROUPS.map(g=>`<button class="toggle-btn small" data-g="${g[0]}">${g[0]}</button>`).join('')}</div>
      <div id="fb"></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">True size</div><div class="rval" id="r1" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Sorted</div><div class="rval" id="r2">0 / 8</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let si=0, t=0, pop=[], gTime=0, refocus=10, logk=Math.log(5);
  const answered={};
  const net=mouldNet(4);
  function seed(){
    const s=SPECS[si], F=s.field/2; pop=[]; gTime=0; refocus=9;
    const rnd=()=> (Math.random()-0.5)*F*1.2;
    if(s.id==='bacillus') for(let i=0;i<3;i++) pop.push({x:rnd(),y:rnd(),a:Math.random()*6.28,age:Math.random()*4});
    if(s.id==='spirillum') for(let i=0;i<5;i++) pop.push({x:rnd(),y:rnd(),a:Math.random()*6.28});
    if(s.id==='yeast') for(let i=0;i<4;i++) pop.push({x:rnd()*0.6,y:rnd()*0.6,a:Math.random()*6.28,age:Math.random()*4});
    if(s.id==='amoeba') pop.push(newAmoeba(0,0));
    if(s.id==='param') for(let i=0;i<2;i++) pop.push({x:rnd(),y:rnd(),a:Math.random()*6.28});
    if(s.id==='chlamy') for(let i=0;i<6;i++) pop.push({x:rnd(),y:rnd(),a:Math.random()*6.28});
    if(s.id==='spiro') { pop.push({x:0,y:-60,a:0.25,nc:7,ph:0}); pop.push({x:-20,y:90,a:-0.15,nc:6,ph:2}); }
    $('#r1').textContent=s.field>=1000?(s.field/1000)+' mm field':s.field+' µm field';
    paintChips();
    const a=answered[s.id];
    $('#fb').innerHTML=a===undefined?'':`<div class="fb ${a?'ok':'bad'}">${a?'✓ '+s.g:'✗ It belongs to '+s.g}</div>`;
  }
  function paintChips(){
    const cw=$('#spC'); cw.innerHTML='';
    SPECS.forEach((s,i)=>{ const b=document.createElement('button'); const a=answered[s.id];
      b.className='chip-btn'+(i===si?' active':'')+(a===undefined?'':(a?' ok':' bad')); b.textContent=(a===undefined?'':(a?'✓ ':'✗ '))+s.n;
      b.onclick=()=>{ si=i; seed(); }; cw.appendChild(b); });
    $('#r2').textContent=Object.values(answered).filter(Boolean).length+' / 8';
  }
  wrap.querySelectorAll('#gB button').forEach(b=>b.onclick=()=>{
    const s=SPECS[si]; if(answered[s.id]!==undefined) return;
    answered[s.id]=b.dataset.g===s.g; seed();
  });
  seed();

  animLoop((dt)=>{
    t+=dt; gTime+=dt;
    const s=SPECS[si], F=s.field/2;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.35, cy=h*0.5, R=Math.min(h*0.44,w*0.26);
    const kT=R/F; logk=approach(logk,Math.log(kT),4,dt); const k=Math.exp(logk);
    refocus=approach(refocus,0,2.2,dt);
    // population dynamics
    if(s.id==='bacillus'){
      const T=5, next=[];
      pop.forEach(b=>{ b.age+=dt; b.a+=gauss()*0.3*Math.sqrt(dt); b.x+=Math.cos(b.a)*0.6*dt; b.y+=Math.sin(b.a)*0.6*dt;
        if(b.age>=T){ const L=2.6; next.push({x:b.x+Math.cos(b.a)*L*0.5,y:b.y+Math.sin(b.a)*L*0.5,a:b.a+gauss()*0.2,age:0},{x:b.x-Math.cos(b.a)*L*0.5,y:b.y-Math.sin(b.a)*L*0.5,a:b.a+gauss()*0.2,age:0}); }
        else next.push(b); });
      pop=next.length>24?next.slice(0,3):next;
    }
    if(s.id==='yeast'){
      const T=6, add=[];
      pop.forEach(c=>{ c.age+=dt; c.x+=gauss()*0.4*Math.sqrt(dt); c.y+=gauss()*0.4*Math.sqrt(dt);
        if(c.age>=T){ c.age=0; add.push({x:c.x+Math.cos(c.a)*6.2,y:c.y+Math.sin(c.a)*6.2,a:c.a+(Math.random()-0.5)*2,age:0}); } });
      pop=pop.concat(add); if(pop.length>18) seed();
    }
    if(s.id==='spirillum') pop.forEach(o=>swim(o,dt,9,1.2,F,F));
    if(s.id==='param') pop.forEach(o=>swim(o,dt,120,1,F*0.8,F*0.8));
    if(s.id==='chlamy') pop.forEach(o=>swim(o,dt,14,3,F*0.9,F*0.9));
    if(s.id==='amoeba') pop.forEach(o=>{ o.a+=gauss()*0.2*Math.sqrt(dt); o.a2+=gauss()*0.3*Math.sqrt(dt); o.x+=Math.cos(o.a)*10*dt; o.y+=Math.sin(o.a)*10*dt; if(Math.hypot(o.x,o.y)>F*0.35) o.a=Math.atan2(-o.y,-o.x); });
    const g=((gTime/14)%1)*1.35;

    eyepiece(ctx,cx,cy,R,refocus,()=>{
      pop.forEach(o=>{ const X=cx+o.x*k, Y=cy+o.y*k;
        if(s.id==='bacillus'){ const u=o.age/5; orgBacillus(ctx,X,Y,o.a,k,2.6+2.6*u,t,true,smooth01(0.75,1,u)); }
        else if(s.id==='spirillum') orgSpirillum(ctx,X,Y,o.a,k,t);
        else if(s.id==='yeast') orgYeast(ctx,X,Y,o.a,k,smooth01(0,1,o.age/6));
        else if(s.id==='amoeba') orgAmoeba(ctx,o,X,Y,k,t);
        else if(s.id==='param') orgParamecium(ctx,X,Y,o.a,k,t);
        else if(s.id==='chlamy') orgChlamy(ctx,X,Y,o.a,k,t);
        else if(s.id==='spiro') orgSpirogyra(ctx,X,Y,o.a,k,t,o.nc,o.ph);
      });
      if(s.id==='mould') orgMould(ctx,net,cx,cy,k,g,t);
    });
    scaleBar(ctx,cx,cy+R*0.82,k);
    textAt(ctx,s.n,cx,h*0.05+4,{align:'center',size:16,weight:700,color:COL.ink});

    // feature call-outs once answered correctly
    const a=answered[s.id];
    if(a && refocus<2){
      const tx=cx+R+12, o=pop[0];
      if(s.g==='Bacteria'){ if(o){ tag(ctx,cx+o.x*k,cy+o.y*k,tx,cy-R*0.4,'no nucleus',COL.blue); tag(ctx,cx+(o.x-Math.cos(o.a)*3)*k,cy+(o.y-Math.sin(o.a)*3)*k,tx,cy+R*0.1,s.id==='bacillus'?'splits in two':'corkscrew swim',COL.yellow);} }
      else if(s.g==='Fungi'){ if(s.id==='mould'){ const sp=net.find(q=>q.d===4); if(sp) tag(ctx,cx+sp.x2*k,cy+sp.y2*k,tx,cy-R*0.4,'spores',COL.yellow); tag(ctx,cx+net[0].x2*k,cy+net[0].y2*k,tx,cy+R*0.1,'hyphae',COL.ink); }
        else if(o){ tag(ctx,cx+(o.x+Math.cos(o.a)*4)*k,cy+(o.y+Math.sin(o.a)*4)*k,tx,cy-R*0.4,'bud',COL.yellow); tag(ctx,cx+(o.x-Math.cos(o.a)*1)*k,cy+(o.y-Math.sin(o.a)*1)*k,tx,cy+R*0.1,'nucleus',COL.blue); } }
      else if(s.g==='Protozoa' && o){ tag(ctx,cx+(o.x+Math.cos(o.a)*(s.id==='amoeba'?140:110))*k,cy+(o.y+Math.sin(o.a)*(s.id==='amoeba'?120:0))*k,tx,cy-R*0.4,s.id==='amoeba'?'false foot':'cilia',COL.yellow); tag(ctx,cx+o.x*k,cy+o.y*k,tx,cy+R*0.1,'nucleus',COL.blue); }
      else if(s.g==='Algae' && o){ tag(ctx,cx+o.x*k,cy+(o.y+(s.id==='spiro'?14:0))*k,tx,cy-R*0.4,'chloroplast',COL.green); textAt(ctx,'makes its own food',tx+6,cy-R*0.4+18,{size:11,color:COL.muted}); }
    }
    // sorting trays
    const trX=w*0.79, trW=w*0.195, trH=h*0.2;
    GROUPS.forEach(([gname,col],i)=>{
      const y=h*0.07+i*(trH+h*0.025);
      ctx.save(); rrect(ctx,trX,y,trW,trH,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
      textAt(ctx,gname,trX+12,y+20,{size:13,weight:700,color:col});
      SPECS.filter(q=>answered[q.id]&&q.g===gname).forEach((q,j)=>textAt(ctx,'• '+q.n,trX+10,y+40+j*17,{size:11,weight:600,color:COL.ink}));
    });
  });
  return wrap;
}

/* =====================================================================
   2.7 THE COMPOST PIT
   First-order decay of waste:  dM/dt = −k·M
     k = 0.45/week × f(moisture) × f(air) × f(temp) × f(soil microbes)
     f(moisture) = e^(−((m − 0.55)/0.22)²)   f(air) = o/(o + 0.2)
     f(temp) = e^(−((T − 50)/25)²)
   Microbial heat:  dT/dt = 80·k·(M/M₀) − 1.2·(T − 28)   (°C/week)
   Air used up:     do/dt = −1.4·k·(M/M₀) + 0.12·(1 − o);  turning → o = 1
   Check: good care gives k ≈ 0.37/week → 90% gone in ≈ 6 weeks.
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Add to the pit</label>
      <div class="toggle-group"><button class="toggle-btn small" id="aW">🥬 Peels</button><button class="toggle-btn small" id="aS">🟫 Soil</button><button class="toggle-btn small" id="aP">🛍 Plastic</button></div>
      <div class="toggle-group"><button class="toggle-btn small" id="aH">💧 Water</button><button class="toggle-btn small" id="aT">🔄 Turn heap</button></div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="run" style="padding:10px;">▶ Run weeks</button><button class="toggle-btn" id="rst" style="padding:10px;">↺ Reset</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Week</div><div class="rval" id="r1">0</div></div>
      <div class="rcard"><div class="rlabel">Heap temp</div><div class="rval" id="r2" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Waste left</div><div class="rval" id="r3" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Moisture · Air</div><div class="rval" id="r4">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let S, t=0;
  function reset(){ S={layers:[], M:0, M0:0, m:0.2, o:1, T:28, week:0, run:false, drops:[], turn:0, bugs:[], worms:[], plastic:[], pour:0, lastK:0}; $('#run').textContent='▶ Run weeks'; }
  reset();
  const WASTE=['peel','leaf','scrap','peel','leaf','scrap'];
  $('#aW').onclick=()=>{ if(S.layers.length>=5) return; S.layers.push({kind:'waste',h:{x:0,v:0},items:WASTE.map((k,i)=>({k,x:0.1+i*0.15+(Math.random()-0.5)*0.06,y:-3-Math.random(),vy:0,rot:Math.random()*6,s:0.8+Math.random()*0.4,land:0.3+Math.random()*0.5}))}); S.M+=1; S.M0+=1; };
  $('#aS').onclick=()=>{ if(S.layers.length>=5) return; S.layers.push({kind:'soil',h:{x:0,v:0},dots:Array.from({length:40},()=>[Math.random(),Math.random()])}); };
  $('#aP').onclick=()=>{ if(S.plastic.length<2) S.plastic.push({x:0.3+Math.random()*0.4,y:-2,vy:0,land:0.5}); };
  $('#aH').onclick=()=>{ S.m=Math.min(1,S.m+0.22); S.pour=1.4; };
  $('#aT').onclick=()=>{ S.o=1; S.turn=1.6; };
  $('#run').onclick=()=>{ S.run=!S.run; $('#run').textContent=S.run?'❚❚ Pause':'▶ Run weeks'; };
  $('#rst').onclick=reset;

  animLoop((dt)=>{
    t+=dt;
    const soil=S.layers.some(l=>l.kind==='soil');
    // model
    const fM=Math.exp(-Math.pow((S.m-0.55)/0.22,2)), fO=S.o/(S.o+0.2), fT=Math.exp(-Math.pow((S.T-50)/25,2)), fS=soil?1:0.25;
    const k=S.M0>0?0.45*fM*fO*fT*fS:0; S.lastK=k;
    if(S.run && S.week<10){
      const dw=dt*0.4; S.week+=dw;
      const frac=S.M0>0?S.M/S.M0:0;
      S.M+=-k*S.M*dw;
      S.T+=(80*k*frac-1.2*(S.T-28))*dw;
      S.o=clamp(S.o+(-1.4*k*frac+0.12*(1-S.o))*dw,0,1);
      S.m=clamp(S.m-0.08*(1+(S.T-28)/30)*dw,0,1);
      if(S.week>=10){ S.run=false; $('#run').textContent='▶ Run weeks'; }
    }
    const frac=S.M0>0?S.M/S.M0:1, done=1-frac;

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const gy=h*0.34, px0=w*0.1, px1=w*0.66, bx0=w*0.16, bx1=w*0.6, by=h*0.9;
    const xAt=(u,y)=>{ const f=(y-gy)/(by-gy); return lerp(lerp(px0,bx0,f),lerp(px1,bx1,f),u); };
    // ground + pit
    line(ctx,0,gy,px0,gy,COL.ink,2.6); line(ctx,px1,gy,w,gy,COL.ink,2.6);
    for(let x=6;x<w;x+=18){ if(x>px0-4&&x<px1+4) continue; line(ctx,x,gy,x-8,gy+8,COL.mid,1); }
    // layers stack from the bottom
    const LH=(by-gy)*0.17;
    let yb=by;
    const humH=done*LH*1.6*Math.max(1,S.M0*0.5);
    if(humH>1){ ctx.save(); ctx.beginPath(); ctx.moveTo(xAt(0,by),by); ctx.lineTo(xAt(1,by),by); ctx.lineTo(xAt(1,by-humH),by-humH); ctx.lineTo(xAt(0,by-humH),by-humH); ctx.closePath(); ctx.fillStyle='#4a3522'; ctx.globalAlpha=0.85; ctx.fill(); ctx.restore(); yb-=humH; }
    const turnJ=S.turn>0?Math.sin(t*20)*4*S.turn:0;
    S.layers.forEach((L,li)=>{
      const target=L.kind==='waste'?LH*(0.25+0.75*frac):LH*0.7;
      springTo(L.h,target,60,12,dt);
      const H=Math.max(0,L.h.x), yt=yb-H;
      if(L.kind==='soil'){
        ctx.save(); ctx.beginPath(); ctx.moveTo(xAt(0,yb),yb); ctx.lineTo(xAt(1,yb),yb); ctx.lineTo(xAt(1,yt),yt); ctx.lineTo(xAt(0,yt),yt); ctx.closePath(); ctx.fillStyle='#e9dcc6'; ctx.fill(); ctx.strokeStyle='#8a6a3d'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
        L.dots.forEach(d=>{ const yy=lerp(yb,yt,d[1]); circ(ctx,xAt(d[0],yy)+turnJ,yy,1.3,'#8a6a3d','#8a6a3d',1); });
      } else {
        L.items.forEach(it=>{
          const yl=lerp(yb,yt,it.land);
          if(it.y<1){ it.vy+=2.6*dt; it.y+=it.vy*dt; if(it.y>=1){ it.y=1; } }
          const yy=it.y<1? lerp(h*0.02,yl,clamp(it.y+1,0,1)) : yl;
          const x=xAt(it.x,yy)+turnJ*(it.x-0.5)*2, sz=LH*0.9*it.s*(0.25+0.75*frac);
          const col=mixCol(it.k==='leaf'?'#1f9d55':it.k==='peel'?'#d9a017':'#d9432b','#4a3522',done*1.1);
          ctx.save(); ctx.translate(x,yy); ctx.rotate(it.rot+(S.turn>0?Math.sin(t*9+it.x*9)*0.3:0)); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath();
          if(it.k==='leaf'){ ctx.ellipse(0,0,sz*0.7,sz*0.32,0,0,Math.PI*2); ctx.moveTo(-sz*0.7,0); ctx.lineTo(sz*0.7,0); }
          else if(it.k==='peel'){ ctx.moveTo(-sz*0.7,0); ctx.quadraticCurveTo(0,-sz*0.8,sz*0.7,0); ctx.quadraticCurveTo(0,-sz*0.35,-sz*0.7,0); }
          else { ctx.arc(0,0,sz*0.35,0.3,Math.PI*1.7); }
          ctx.stroke(); ctx.restore();
        });
      }
      yb=yt;
    });
    // plastic never decomposes
    S.plastic.forEach(p=>{ if(p.y<1){ p.vy+=2.6*dt; p.y+=p.vy*dt; if(p.y>1) p.y=1; }
      const yy=p.y<1? lerp(h*0.02,lerp(by,yb,p.land),clamp(p.y+1,0,1)) : lerp(by,yb,p.land);
      const x=xAt(p.x,yy); ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(x-18,yy-10); ctx.lineTo(x-12,yy+10); ctx.lineTo(x+14,yy+9); ctx.lineTo(x+18,yy-10); ctx.moveTo(x-10,yy-10); ctx.quadraticCurveTo(x-6,yy-20,x-2,yy-10); ctx.moveTo(x+4,yy-10); ctx.quadraticCurveTo(x+8,yy-20,x+12,yy-10); ctx.stroke(); ctx.restore();
      if(S.week>3) textAt(ctx,'unchanged',x,yy+24,{align:'center',size:10.5,weight:700,color:COL.blue}); });
    // pit walls
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px0,gy); ctx.lineTo(bx0,by); ctx.lineTo(bx1,by); ctx.lineTo(px1,gy); ctx.stroke(); ctx.restore();
    // microbes: population ∝ activity
    const nb=S.M0>0? Math.round(6+220*k*frac*(soil?1:0.3)) : 0;
    while(S.bugs.length<nb) S.bugs.push({u:Math.random(),v:Math.random(),a:Math.random()*6});
    if(S.bugs.length>nb) S.bugs.length=nb;
    S.bugs.forEach(b=>{ b.u=clamp(b.u+gauss()*0.02*Math.sqrt(dt),0.02,0.98); b.v=clamp(b.v+gauss()*0.03*Math.sqrt(dt),0,1); b.a+=gauss()*2*Math.sqrt(dt);
      const yy=lerp(by-2,yb+2,b.v), x=xAt(b.u,yy); line(ctx,x-Math.cos(b.a)*2.5,yy-Math.sin(b.a)*2.5,x+Math.cos(b.a)*2.5,yy+Math.sin(b.a)*2.5,COL.ink,1.6); });
    // earthworms arrive once the heap cools a little
    if(soil && S.week>1.5 && S.T<48 && S.worms.length<3 && Math.random()<dt*0.3) S.worms.push({u:Math.random()*0.8+0.1,v:Math.random()*0.6,ph:Math.random()*6,d:Math.random()<0.5?-1:1});
    S.worms.forEach(q=>{ q.u=clamp(q.u+q.d*0.01*dt,0.05,0.95); if(q.u<=0.05||q.u>=0.95) q.d*=-1;
      const yy=lerp(by-6,yb+6,q.v), x=xAt(q.u,yy); ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath();
      for(let i=0;i<=12;i++){ const xx=x-q.d*i*3, y2=yy+Math.sin(i*0.8-t*5+q.ph)*3; i?ctx.lineTo(xx,y2):ctx.moveTo(xx,y2); } ctx.stroke(); ctx.restore(); });
    // heat rising (red) when hot
    const heat=clamp((S.T-32)/28,0,1);
    for(let i=0;i<5 && heat>0;i++){ const ph=(t*0.5+i*0.2)%1, x=lerp(px0+40,px1-40,i/4); ctx.save(); ctx.globalAlpha=heat*(1-ph); ctx.strokeStyle=COL.red; ctx.lineWidth=1.8; ctx.beginPath();
      for(let q=0;q<=12;q++){ const yy=Math.min(yb,gy)-4-ph*h*0.18-q*3, xx=x+Math.sin(q*0.8+t*4+i)*4; q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore(); }
    // watering can + droplets (free fall)
    if(S.pour>0){ S.pour-=dt; const cx=w*0.36, cy=h*0.1; ctx.save(); ctx.translate(cx,cy); ctx.rotate(0.5); rrect(ctx,-30,-18,50,36,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.stroke(); line(ctx,20,-4,52,-24,COL.blue,4); ctx.restore();
      if(Math.random()<dt*50) S.drops.push({x:cx+36+Math.random()*30,y:cy-6,vy:0,vx:30+Math.random()*50}); }
    S.drops=S.drops.filter(d=>{ d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; if(d.y>Math.min(yb,gy+20)) return false; line(ctx,d.x,d.y,d.x-d.vx*0.01,d.y-6,COL.blue,1.8); return true; });
    // spade when turning
    if(S.turn>0){ S.turn-=dt; const a=Math.sin(t*9)*0.5, sx=w*0.38, sy=(yb+gy)/2; ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); line(ctx,0,-h*0.25,0,0,COL.ink,5); ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(14,0); ctx.lineTo(8,26); ctx.lineTo(-8,26); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
    // thermometer pushed into the heap
    const tx=w*0.76; thermo(ctx,tx,h*0.18,h*0.62,(S.T-10)/60,COL.ink,COL.red);
    textAt(ctx,Math.round(S.T)+' °C',tx,h*0.62+34,{align:'center',size:14,weight:700,color:COL.red});
    // moisture & air gauges (yellow = what you control)
    [['moisture',S.m,COL.blue],['air',S.o,COL.green]].forEach(([n,v,c],i)=>{ const gx=w*0.86+i*w*0.06, gt=h*0.18, gb=h*0.62;
      rect(ctx,gx-7,gt,14,gb-gt,COL.ink,'#fff',2); ctx.save(); ctx.fillStyle=c; ctx.globalAlpha=0.6; ctx.fillRect(gx-5,gb-(gb-gt)*v,10,(gb-gt)*v); ctx.restore();
      if(n==='moisture'){ line(ctx,gx-11,gb-(gb-gt)*0.55,gx+11,gb-(gb-gt)*0.55,COL.yellow,2); }
      textAt(ctx,n,gx,gb+18,{align:'center',size:10.5,weight:600,color:c}); });
    if(S.M0===0) textAt(ctx,'Add peels, soil and water',(px0+px1)/2,h*0.62,{align:'center',size:13,weight:600,color:COL.muted});
    else if(frac<0.15) textAt(ctx,'Manure ready!',(px0+px1)/2,h*0.25,{align:'center',size:16,weight:700,color:COL.green});
    $('#r1').textContent=fmt(S.week,1); $('#r2').textContent=Math.round(S.T)+' °C';
    $('#r3').textContent=S.M0?Math.round(frac*100)+'%':'—'; $('#r4').textContent=Math.round(S.m*100)+'% · '+Math.round(S.o*100)+'%';
  });
  return wrap;
}

/* =====================================================================
   2.8 YEAST MAKES GAS
   Fermentation:  C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂
   Sugar use (Michaelis–Menten): dS/dt = −3·r(T)·S/(2 + S)  g/h
   r(T): Q10 ≈ 2.5 up to 37 °C, falls after, yeast killed ≥ 55 °C
   Gas volume V = nRT/P → balloon radius r = ∛(3V/4π)
   Check: 10 g sugar → 0.111 mol CO₂ → 2.8 L at 30 °C → ~17 cm balloon.
   4 hours compressed into 8 s.
   ===================================================================== */
function yeastRate(T){ if(T<=37) return Math.pow(2.5,(T-37)/10); if(T>=55) return 0; return 1-Math.pow((T-37)/18,2); }
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Sugar in each bottle <span class="val" id="suV"></span></label><input type="range" id="suR" min="0" max="20" step="1" value="10">
      <label style="margin-top:8px;">Water temperature <span class="val" id="teV"></span></label><input type="range" id="teR" min="5" max="70" step="1" value="35"></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;">▶ Wait 4 hours</button><button class="toggle-btn" id="lw" style="padding:10px;">Lime-water test</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Balloon A</div><div class="rval" id="r1" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Balloon B</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">CO₂ made</div><div class="rval" id="r3">—</div></div>
      <div class="rcard"><div class="rlabel">Lime water</div><div class="rval" id="r4">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), suR=$('#suR'), teR=$('#teR');
  let t=0, hrs=0, run=false, S0=10, SA=10, lime={t:-1,milk:0,mol:0};
  const bal=[{x:0.5,v:0},{x:0.5,v:0}], bub=[[],[]];
  const yeast=[{x:0,y:0,a:0,age:0}];
  function reset(){ S0=+suR.value; SA=S0; hrs=0; lime={t:-1,milk:0,mol:0}; yeast.length=1; yeast[0].age=0; }
  suR.oninput=()=>{ if(!run) reset(); };
  $('#go').onclick=()=>{ reset(); run=true; };
  $('#lw').onclick=()=>{ if(lime.t<0) lime.t=0; };
  animLoop((dt)=>{
    t+=dt; const T=+teR.value; $('#suV').textContent=suR.value+' g'; $('#teV').textContent=T+' °C';
    const r=yeastRate(T);
    let rate=0;
    if(run){ const dh=dt*0.5; hrs+=dh; rate=3*r*SA/(2+SA); SA=Math.max(0,SA-rate*dh); if(hrs>=4){ hrs=4; run=false; } }
    const mol=(S0-SA)/180*2, VL=mol*0.08206*(T+273)+0.05;
    const rcm=Math.cbrt(3*VL*1000/(4*Math.PI));
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pxcm=Math.min(h*0.021,w*0.018), floorY=h*0.88;
    // warm-water trough; colour tracks temperature
    const tw=w*0.52, tx0=w*0.17;
    ctx.save(); ctx.fillStyle=mixCol('#dcecfb','#fbe3de',clamp((T-5)/60,0,1)); ctx.globalAlpha=0.6; ctx.fillRect(tx0,floorY-h*0.14,tw,h*0.14); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(tx0,floorY-h*0.2); ctx.lineTo(tx0,floorY); ctx.lineTo(tx0+tw,floorY); ctx.lineTo(tx0+tw,floorY-h*0.2); ctx.stroke(); ctx.restore();
    if(T>40) for(let i=0;i<4;i++){ const ph=(t*0.6+i*0.25)%1, x=tx0+tw*(0.15+i*0.23); ctx.save(); ctx.globalAlpha=(1-ph)*clamp((T-40)/25,0,1); ctx.strokeStyle=COL.red; ctx.lineWidth=1.5; ctx.beginPath(); for(let q=0;q<=8;q++){ const yy=floorY-h*0.15-ph*30-q*3, xx=x+Math.sin(q+t*4)*3; q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); ctx.restore(); }
    thermo(ctx,tx0+tw+26,floorY-h*0.3,floorY-h*0.04,T/70,COL.yellow,COL.red);
    textAt(ctx,T+' °C',tx0+tw+26,floorY+20,{align:'center',size:12.5,weight:700,color:COL.yellow});
    // two bottles
    [0,1].forEach(i=>{
      const bx=tx0+tw*(0.28+0.46*i), bw=7*pxcm, bh=13*pxcm, by=floorY-4, top=by-bh, nk=2.2*pxcm;
      const myRate=i===0?rate:0;
      const target=i===0?rcm:Math.cbrt(3*0.05*1000/(4*Math.PI));
      springTo(bal[i],target,18,3.2,dt);
      // liquid
      const ly=top+bh*0.4;
      ctx.save(); ctx.fillStyle=i===0?'rgba(217,160,23,0.18)':'rgba(47,143,224,0.1)'; ctx.fillRect(bx-bw/2+2,ly,bw-4,by-ly-2); ctx.restore();
      if(i===0 && (run||myRate>0) && Math.random()<dt*myRate*25) bub[i].push({x:bx+(Math.random()-0.5)*bw*0.8,y:by-6,r:1.5+Math.random()*2.5});
      bub[i]=bub[i].filter(b=>{ b.y-=dt*(40+b.r*12); b.x+=Math.sin(b.y*0.2)*0.3; if(b.y<ly) return false; circ(ctx,b.x,b.y,b.r,COL.blue,null,1.2); return true; });
      if(i===0 && hrs>0.3 && S0>0 && r>0) for(let q=0;q<9;q++) circ(ctx,bx-bw/2+6+q*(bw-12)/8,ly-2+Math.sin(t*3+q)*1,2.5+Math.sin(q*1.3)*1,COL.mid,'#fff',1);
      // bottle outline
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.beginPath();
      ctx.moveTo(bx-nk/2,top-2.5*pxcm); ctx.lineTo(bx-nk/2,top); ctx.quadraticCurveTo(bx-bw/2,top+0.4*pxcm,bx-bw/2,top+2*pxcm); ctx.lineTo(bx-bw/2,by); ctx.lineTo(bx+bw/2,by); ctx.lineTo(bx+bw/2,top+2*pxcm); ctx.quadraticCurveTo(bx+bw/2,top+0.4*pxcm,bx+nk/2,top); ctx.lineTo(bx+nk/2,top-2.5*pxcm); ctx.stroke(); ctx.restore();
      // balloon on the neck: radius from gas law, spring-damped with wobble
      const R=Math.max(0.6*pxcm,bal[i].x*pxcm), cyB=top-2.5*pxcm-R*0.95, wob=1+Math.sin(t*5)*0.012*R/pxcm*(myRate>0?1:0);
      ctx.save(); ctx.beginPath(); ctx.moveTo(bx-nk/2,top-2.5*pxcm); ctx.quadraticCurveTo(bx-nk*0.6,cyB+R*0.6,bx-R*0.95*wob,cyB); ctx.bezierCurveTo(bx-R*wob,cyB-R*1.3,bx+R*wob,cyB-R*1.3,bx+R*0.95*wob,cyB); ctx.quadraticCurveTo(bx+nk*0.6,cyB+R*0.6,bx+nk/2,top-2.5*pxcm);
      ctx.fillStyle='rgba(47,143,224,0.08)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
      line(ctx,bx-nk/2-2,top-2*pxcm,bx+nk/2+2,top-2*pxcm,COL.ink,3);
      dimArrow(ctx,bx+R+14,cyB-R*1.05,cyB+R*0.55,COL.blue);
      textAt(ctx,fmt(2*bal[i].x,1)+' cm',bx+R+20,cyB-R*0.2,{size:12,weight:700,color:COL.blue});
      textAt(ctx,i===0?'A · sugar + yeast':'B · sugar only',bx,by+22,{align:'center',size:12.5,weight:700,color:COL.ink});
      textAt(ctx,suR.value+' g sugar',bx,by+37,{align:'center',size:11,weight:600,color:COL.green});
    });
    // magnified yeast in bottle A — budding speed follows r(T)
    const mR=Math.min(h*0.12,w*0.08), mx=Math.max(mR+10,w*0.09), my=h*0.36, k=mR/14;
    if(run) yeast.forEach(c=>{ c.age+=dt*r*0.9*(SA>0.2?1:0.1); });
    const add=[]; yeast.forEach(c=>{ if(c.age>=1){ c.age=0; if(yeast.length+add.length<16){ const a=c.a+(Math.random()-0.5)*1.6; add.push({x:c.x+Math.cos(c.a)*6.2,y:c.y+Math.sin(c.a)*6.2,a,age:0}); } } });
    yeast.push(...add);
    eyepiece(ctx,mx,my,mR,0,()=>yeast.forEach(c=>orgYeast(ctx,mx+c.x*k+Math.sin(t+c.x)*1.5,my+c.y*k,c.a,k,c.age)));
    textAt(ctx,'yeast in A',mx,my-mR-10,{align:'center',size:11,weight:700,color:COL.muted});
    // clock
    const kx=w*0.84, ky=h*0.12, kr=Math.min(24,h*0.05);
    circ(ctx,kx,ky,kr,COL.ink,'#fff',2.4); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(kx,ky,kr+5,-Math.PI/2,-Math.PI/2+Math.PI*2*hrs/4); ctx.stroke(); ctx.restore();
    const ha=-Math.PI/2+hrs/12*Math.PI*2*3; line(ctx,kx,ky,kx+Math.cos(ha)*kr*0.7,ky+Math.sin(ha)*kr*0.7,COL.ink,2.2);
    textAt(ctx,fmt(hrs,1)+' h',kx,ky+kr+20,{align:'center',size:12,weight:700});
    // lime-water test tube: gas from balloon A bubbles through; milkiness ∝ CO₂
    const lx=w*0.84, ltop=h*0.38, lbot=h*0.8;
    if(lime.t>=0){ lime.t+=dt; lime.mol=mol; if(lime.t<3 && mol>0.002 && Math.random()<dt*20) bub[2]=(bub[2]||[]).concat([{x:lx+(Math.random()-0.5)*8,y:lbot-12,r:2+Math.random()*2}]); lime.milk=approach(lime.milk,1-Math.exp(-mol/0.02),1.2,dt); }
    ctx.save(); ctx.fillStyle=mixCol('#f2f8fd','#d5dbe1',lime.milk); ctx.fillRect(lx-13,ltop+(lbot-ltop)*0.35,26,(lbot-ltop)*0.65); ctx.restore();
    (bub[2]||[]).forEach(b=>{ b.y-=dt*60; }); bub[2]=(bub[2]||[]).filter(b=>{ if(b.y<ltop+(lbot-ltop)*0.35) return false; circ(ctx,b.x,b.y,b.r,COL.blue,null,1.2); return true; });
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(lx-14,ltop); ctx.lineTo(lx-14,lbot-14); ctx.arc(lx,lbot-14,14,Math.PI,0,true); ctx.lineTo(lx+14,ltop); ctx.stroke(); ctx.restore();
    if(lime.t>=0){ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(tx0+tw*0.28,h*0.12); ctx.quadraticCurveTo(lx-40,h*0.02,lx,ltop-10); ctx.lineTo(lx,lbot-14); ctx.stroke(); ctx.restore(); }
    textAt(ctx,'lime water',lx,lbot+18,{align:'center',size:11.5,weight:700,color:COL.muted});
    $('#r1').textContent=fmt(2*rcm,1)+' cm'; $('#r2').textContent=fmt(2*Math.cbrt(3*0.05*1000/(4*Math.PI)),1)+' cm';
    $('#r3').textContent=fmt(VL-0.05,2)+' L'; $('#r4').textContent=lime.t<0?'—':lime.milk>0.3?'Milky':'Clear';
    $('#go').textContent=run?'⏳ '+fmt(hrs,1)+' h':'▶ Wait 4 hours';
  });
  return wrap;
}

/* =====================================================================
   2.9 SETTING CURD
   Lactobacillus growth (logistic):  dN/dt = μ(T)·N·(1 − N/K),  K = 2×10⁹ /mL
   μ(T): Ratkowsky/Rosso cardinal model, Tmin 10 °C, Topt 40 °C,
         Tmax 48 °C, μopt = 0.69 /h (doubling ≈ 1 h). Killed above 55 °C.
   Lactic acid lowers pH: pH = 6.6 − 2.2·log(N/N₀)/log(10⁹/N₀)
   Casein sets into curd when pH < 4.6.
   Check: 1 spoon starter → N₀ ≈ 3×10⁷ /mL → sets in ≈ 5 h at 37 °C, ≈ 7 h at 30 °C.
   8 hours compressed into 10 s.
   ===================================================================== */
function muLacto(T){ const Tn=10,To=40,Tx=48; if(T<=Tn||T>=Tx) return 0;
  return 0.69*((T-Tx)*(T-Tn)*(T-Tn))/((To-Tn)*((To-Tn)*(T-To)-(To-Tx)*(To+Tn-2*T))); }
function curdPH(N){ return 6.6-2.2*clamp(Math.log10(N/3e7)/Math.log10(1e9/3e7),0,1); }
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Warm bowl temperature <span class="val" id="taV"></span></label><input type="range" id="taR" min="5" max="60" step="1" value="37">
      <div class="hint">Cold bowl stays in the fridge at 5 °C</div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="stB" style="padding:10px;">🥄 Add starter curd</button><button class="toggle-btn play" id="go" style="padding:10px;">▶ Keep 8 hours</button></div>
    <button class="toggle-btn navy" id="tilt" style="margin-top:0;padding:10px;">↻ Tilt the bowls</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">pH warm</div><div class="rval" id="r1" style="color:var(--f-blue)">6.6</div></div>
      <div class="rcard"><div class="rlabel">pH cold</div><div class="rval" id="r2" style="color:var(--f-blue)">6.6</div></div>
      <div class="rcard"><div class="rlabel">Warm bowl</div><div class="rval" id="r3">Milk</div></div>
      <div class="rcard"><div class="rlabel">Cold bowl</div><div class="rval" id="r4">Milk</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), taR=$('#taR');
  let t=0, hrs=0, run=false, starter=false, spoon=-1, tiltOn=false;
  const B=[{lnN:Math.log(1e3),tilt:{x:0,v:0},phi:{x:0,v:0},cas:null,bugs:[]},{lnN:Math.log(1e3),tilt:{x:0,v:0},phi:{x:0,v:0},cas:null,bugs:[]}];
  B.forEach(b=>b.cas=Array.from({length:36},()=>({x:(Math.random()-0.5)*1.8,y:(Math.random()-0.5)*1.8,cx:0,cy:0})));
  B.forEach(b=>b.cas.forEach((c,i)=>{ const g=Math.floor(i/6); c.cx=Math.cos(g*1.05)*0.5+(Math.random()-0.5)*0.35; c.cy=Math.sin(g*1.05)*0.5+(Math.random()-0.5)*0.35; }));
  let drops=[];
  $('#stB').onclick=()=>{ if(starter||spoon>=0) return; spoon=0; };
  $('#go').onclick=()=>{ hrs=0; B.forEach(b=>b.lnN=Math.log(starter?3e7:1e3)); run=true; };
  $('#tilt').onclick=()=>{ tiltOn=!tiltOn; $('#tilt').textContent=tiltOn?'↺ Set bowls down':'↻ Tilt the bowls'; };
  animLoop((dt)=>{
    t+=dt; const TA=+taR.value, temps=[TA,5];
    $('#taV').textContent=TA+' °C';
    if(run){ const dh=dt*0.8; hrs+=dh; B.forEach((b,i)=>{ const T=temps[i], N=Math.exp(b.lnN);
      b.lnN+= (T>55? -2 : muLacto(T)*(1-N/2e9))*dh; }); if(hrs>=8){ hrs=8; run=false; } }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const floorY=h*0.86, bw=Math.min(w*0.26,260), bd=bw*0.42;
    const pos=[w*0.26,w*0.7];
    // settings: warm spot (A) and fridge (B)
    const heat=clamp((TA-25)/30,0,1);
    line(ctx,pos[0]-bw*0.75,floorY,pos[0]+bw*0.75,floorY,COL.ink,3);
    for(let i=0;i<3&&TA>28;i++){ const ph=(t*0.5+i*0.33)%1; ctx.save(); ctx.globalAlpha=(1-ph)*heat; ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.beginPath(); for(let q=0;q<=9;q++){ const yy=floorY-bd-20-ph*50-q*3, xx=pos[0]-bw*0.3+i*bw*0.3+Math.sin(q+t*4)*3; q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); ctx.restore(); }
    const fw=bw*1.45, fh=h*0.62; rect(ctx,pos[1]-fw/2,floorY-fh,fw,fh,COL.blue,'#f4f9fe',2.4);
    line(ctx,pos[1]+fw/2-12,floorY-fh*0.8,pos[1]+fw/2-12,floorY-fh*0.55,COL.blue,4);
    for(let s=0;s<6;s++){ const fx=pos[1]-fw/2+14+((s*0.37+t*0.02)%1)*(fw-28), fy=floorY-fh+14+((s*0.61+t*0.05)%1)*fh*0.3; for(let q=0;q<3;q++){ const a=q*Math.PI/3+t*0.4; line(ctx,fx-Math.cos(a)*4,fy-Math.sin(a)*4,fx+Math.cos(a)*4,fy+Math.sin(a)*4,COL.blue,1); } }
    B.forEach((b,i)=>{
      const N=Math.exp(b.lnN), pH=curdPH(N), gel=1-smooth01(4.6,5.0,pH);
      springTo(b.tilt,tiltOn?0.5:0,30,8,dt);
      springTo(b.phi,-b.tilt.x*(1-gel),26,1.6+gel*20,dt);        // liquid sloshes level; set curd moves with the bowl
      const cx=pos[i], rimY=floorY-bd-6;
      ctx.save(); ctx.translate(cx,floorY-6); ctx.rotate(-b.tilt.x); ctx.translate(-cx,-(floorY-6));
      // bowl interior path
      const bowl=()=>{ ctx.beginPath(); ctx.moveTo(cx-bw/2,rimY); ctx.quadraticCurveTo(cx-bw*0.48,floorY-6,cx-bw*0.2,floorY-6); ctx.lineTo(cx+bw*0.2,floorY-6); ctx.quadraticCurveTo(cx+bw*0.48,floorY-6,cx+bw/2,rimY); };
      ctx.save(); bowl(); ctx.closePath(); ctx.clip();
      const lvl=rimY+bd*0.22, sl=Math.tan(b.phi.x);
      ctx.beginPath(); ctx.moveTo(cx-bw,lvl+sl*bw); ctx.lineTo(cx+bw,lvl-sl*bw); ctx.lineTo(cx+bw,floorY+20); ctx.lineTo(cx-bw,floorY+20); ctx.closePath();
      ctx.fillStyle=mixCol('#fdfdf8','#f3e9c9',gel); ctx.fill();
      if(gel>0.3){ ctx.globalAlpha=gel; const Rr=rng(40+i); ctx.strokeStyle='#d8caa0'; ctx.lineWidth=1; ctx.beginPath(); for(let q=0;q<14;q++){ const x=cx+(Rr()-0.5)*bw*0.8, y=lvl+8+Rr()*bd*0.6; ctx.moveTo(x,y); ctx.lineTo(x+10,y+(Rr()-0.5)*6); } ctx.stroke(); ctx.globalAlpha=1; }
      ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.beginPath(); const xl=cx-bw*0.47, xr=cx+bw*0.47; ctx.moveTo(xl,lvl+sl*(cx-xl)); ctx.lineTo(xr,lvl-sl*(xr-cx)); ctx.stroke(); ctx.restore();
      ctx.save(); bowl(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
      line(ctx,cx-bw*0.53,rimY,cx+bw*0.53,rimY,COL.ink,3);
      ctx.restore();
      // magnifier: Lactobacillus multiply, casein clumps as acid builds
      const mx=cx, my=floorY-bd-h*0.2, mR=Math.min(h*0.12,bw*0.36), k=mR/9;
      const want=Math.round(clamp((Math.log10(N)-3)/6,0,1)*40);
      while(b.bugs.length<want) b.bugs.push({x:(Math.random()-0.5)*14,y:(Math.random()-0.5)*14,a:Math.random()*6.28});
      if(b.bugs.length>want) b.bugs.length=want;
      b.bugs.forEach(q=>{ q.x+=gauss()*0.6*Math.sqrt(dt); q.y+=gauss()*0.6*Math.sqrt(dt); q.a+=gauss()*0.5*Math.sqrt(dt); if(Math.hypot(q.x,q.y)>8.5){ q.x*=0.95; q.y*=0.95; } });
      eyepiece(ctx,mx,my,mR,0,()=>{
        b.cas.forEach(c=>{ const X=mx+lerp(c.x,c.cx,gel)*mR*0.9+Math.sin(t+c.x*9)*1.2*(1-gel), Y=my+lerp(c.y,c.cy,gel)*mR*0.9; circ(ctx,X,Y,Math.max(1.5,k*0.45),COL.mid,'#fff',1.2); });
        if(gel>0.2){ ctx.save(); ctx.globalAlpha=gel; ctx.strokeStyle=COL.mid; ctx.lineWidth=1; ctx.beginPath(); for(let q=0;q<b.cas.length-1;q++){ if(Math.floor(q/6)!==Math.floor((q+1)/6)) continue; const c=b.cas[q], d=b.cas[q+1]; ctx.moveTo(mx+c.cx*mR*0.9,my+c.cy*mR*0.9); ctx.lineTo(mx+d.cx*mR*0.9,my+d.cy*mR*0.9); } ctx.stroke(); ctx.restore(); }
        b.bugs.forEach(q=>orgBacillus(ctx,mx+q.x*k,my+q.y*k,q.a,k,2.4,t,false));
      });
      textAt(ctx,'10^'+fmt(Math.log10(N),1)+' bacteria /mL',mx,my-mR-10,{align:'center',size:11,weight:700,color:COL.blue});
      thermo(ctx,cx+bw*0.62,floorY-bd-40,floorY-30,temps[i]/60,COL.ink,COL.red);
      textAt(ctx,temps[i]+' °C',cx+bw*0.62,floorY-bd-50,{align:'center',size:12,weight:700,color:i?COL.blue:COL.yellow});
      textAt(ctx,gel>0.5?'Curd':'Milk',cx,floorY+22,{align:'center',size:13,weight:700,color:gel>0.5?COL.green:COL.ink});
      $('#r'+(i+1)).textContent=fmt(pH,1); $('#r'+(i+3)).textContent=gel>0.5?'Curd ✓':pH<6.2?'Thickening':'Milk';
    });
    // spoon of starter flies into each bowl on a real arc (projectile)
    if(spoon>=0){ spoon+=dt; const leg=spoon<1.1?0:1, u=clamp((spoon-leg*1.1)/1.1,0,1);
      const x0=w*0.48, y0=h*0.08, x1=pos[leg], y1=floorY-bd*0.8, vx=(x1-x0);
      const X=x0+vx*u, Y=y0-h*0.5*u+(y1-y0+h*0.5)*u*u;
      ctx.save(); ctx.translate(X,Y); ctx.rotate(-0.6+u*1.2); line(ctx,0,0,-40,-24,COL.ink,4); ctx.beginPath(); ctx.ellipse(6,3,11,6,0.5,0,Math.PI*2); ctx.fillStyle='#f3e9c9'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
      if(u>=0.98 && !drops.some(d=>d.leg===leg)) for(let q=0;q<10;q++) drops.push({leg,x:x1,y:y1,vx:(Math.random()-0.5)*160,vy:-100-Math.random()*140});
      if(spoon>2.2){ spoon=-1; starter=true; $('#stB').textContent='✓ Starter added'; $('#stB').classList.add('active'); }
    }
    drops=drops.filter(d=>{ d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; if(d.vy>0&&d.y>floorY-bd*0.8) return false; circ(ctx,d.x,d.y,2.2,COL.mid,'#fff',1.2); return true; });
    // clock
    const kx=w*0.48, ky=h*0.1, kr=Math.min(24,h*0.05);
    circ(ctx,kx,ky,kr,COL.ink,'#fff',2.4); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(kx,ky,kr+5,-Math.PI/2,-Math.PI/2+Math.PI*2*hrs/8); ctx.stroke(); ctx.restore();
    const ha=-Math.PI/2+hrs/12*Math.PI*2; line(ctx,kx,ky,kx+Math.cos(ha)*kr*0.7,ky+Math.sin(ha)*kr*0.7,COL.ink,2.2);
    textAt(ctx,fmt(hrs,1)+' h',kx+kr+10,ky+5,{size:13,weight:700});
    $('#go').textContent=run?'⏳ '+fmt(hrs,1)+' h':'▶ Keep 8 hours';
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
