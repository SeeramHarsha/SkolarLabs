<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 7: PARTICULATE NATURE OF MATTER
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET or start an action; the drawn object is moved every frame by the
   real relation behind it — falling and bouncing chalk, exponential
   grinding, Fick diffusion (D from Stokes–Einstein), weir flow out of a
   tilted glass, Boyle's law in a sealed syringe, water's bulk modulus,
   apparent molar volumes of dissolved sugar/salt, latent heat at the
   melting point, and Brownian kicks from moving air particles.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-7 HELPERS — hands, magnifier, ground, particles
   --------------------------------------------------------------------- */
const G = 10;                       // N/kg — textbook value
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function sgn(x){ return x>0?1:x<0?-1:0; }

/* labelled force arrow; skipped when tiny */
function force(ctx,x,y,dx,dy,col,label,side){
  const L=Math.hypot(dx,dy); if(L<4) return;
  vec(ctx,x,y,x+dx,y+dy,col,3);
  if(label && side==='b'){ textAt(ctx,label,x+dx/2,y+dy+18,{size:12,weight:700,color:col,align:'center'}); return; }
  if(label){ const ox=side==='l'?-8:8; textAt(ctx,label,x+dx+(Math.abs(dx)>Math.abs(dy)?0:ox),y+dy+(Math.abs(dx)>Math.abs(dy)?-9:(dy>0?14:-4)),{size:12,weight:700,color:col,align:Math.abs(dx)>Math.abs(dy)?'center':(side==='l'?'right':'left')}); }
}
function ground(ctx,x0,x1,y){
  line(ctx,x0,y,x1,y,COL.ink,2.4);
  ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.beginPath();
  for(let x=x0+8;x<x1;x+=14){ ctx.moveTo(x,y+2); ctx.lineTo(x-8,y+10); } ctx.stroke(); ctx.restore();
}
function coil(ctx,x,y1,y2,n,wd,col,lwd){
  const L=y2-y1, lead=Math.min(12,Math.abs(L)*0.1), body=L-2*lead, N=n*24;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lwd||2; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x,y1); ctx.lineTo(x,y1+lead);
  const pitch=body/n;
  for(let i=0;i<=N;i++){ const u=i/N, a=u*n*Math.PI*2;
    ctx.lineTo(x+Math.sin(a)*wd/2, y1+lead+body*u - Math.cos(a)*Math.min(pitch*0.35,wd*0.18) + Math.min(pitch*0.35,wd*0.18)); }
  ctx.lineTo(x,y2); ctx.stroke(); ctx.restore();
}
/* hand seen from the side: palm facing `dir` (±1), fingertips at (x,y) */
function hand(ctx,x,y,dir,armLen,armAng){
  const a=armAng===undefined?(dir>0?Math.PI:0):armAng;
  const bx=x-dir*18, by=y;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';

    if(cur){
      cur.T+=dt; hands.o=approach(hands.o,1,8,dt);
      if(cur.st==='lift'){ cur.x=springTo(cur.sx,BX,60,14,dt); cur.y=springTo(cur.sy,BY,60,14,dt); cur.a=springTo(cur.sa,0,60,14,dt); if(cur.T>0.8){ cur.x=BX; cur.y=BY; cur.a=0; cur.st='bend'; } }

    zoomL=approach(zoomL,+mR.value,4,dt);
    const mag=Math.pow(10,zoomL);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    ground(ctx,X(-17),X(17),Y(0));
    // mortar

    ctx.beginPath(); ctx.moveTo(X(MX-6.3),Y(rim)); ctx.ellipse(X(MX),Y(rim),6.3*pc,5.8*pc,0,Math.PI,0,true); ctx.closePath(); ctx.fill(); ctx.stroke();
    rect(ctx,X(MX-3),Y(0.95),6*pc,0.95*pc,COL.ink,'#fff',2.2);
    ctx.beginPath(); ctx.ellipse(X(MX),Y(rim),5.4*pc,5.0*pc,0,Math.PI,0,true); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke();
    line(ctx,X(MX-6.3),Y(rim),X(MX-5.4),Y(rim),COL.ink,2.4); line(ctx,X(MX+5.4),Y(rim),X(MX+6.3),Y(rim),COL.ink,2.4);
    ctx.restore();
    // pestle head position
    const hx=MX+Math.cos(phi)*2.6*amp+(1-amp)*1.8, hy=bot(hx-MX)+0.95+Math.abs(Math.sin(phi))*0.25*amp;
    // contents of the mortar
    if(mChunks>0){
      const N=Math.round(clamp(mChunks*Math.pow(1/dG,1.4),1,260)), heap=1.9*Math.cbrt(mChunks/8);
      if(dG<0.3){ ctx.save(); ctx.globalAlpha=smooth01(0.3,0.06,dG); ctx.beginPath(); for(let k=0;k<=24;k++){ const xo=-3.8+7.6*k/24, yy=bot(xo)+heap*Math.max(0,1-(xo/3.8)**2); ctx[k?'lineTo':'moveTo'](X(MX+xo),Y(yy)); } ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore(); }
      for(let i=0;i<N;i++){ const b=BITS[i]; let xo=b.u*3.6; const yy=bot(xo)+b.v*heap*Math.max(0.1,1-b.u*b.u)+dG*0.5;
        if(Math.abs(MX+xo-hx)<1.6) xo+=Math.sin(t*40+b.ph)*0.12*amp;
        const px=X(MX+xo), py=Y(yy), sz=Math.max(1.1,dG*pc);
        if(dG>0.15){ const r=rng(i*31+5); ctx.beginPath(); for(let k=0;k<7;k++){ const a=k/7*Math.PI*2+b.ph, rr=sz*0.5*(0.7+0.5*r()); ctx[k?'lineTo':'moveTo'](px+Math.cos(a)*rr,py+Math.sin(a)*rr); } ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke(); }
        else { ctx.fillStyle=COL.mid; ctx.fillRect(px-sz/2,py-sz/2,sz,sz); }
      }
    }
    // pestle
    { const tx=hx+4.2, ty=hy+9.5; ctx.save(); ctx.lineCap='round';
      line(ctx,X(hx),Y(hy),X(tx),Y(ty),COL.ink,1.25*pc+4); line(ctx,X(hx),Y(hy),X(tx),Y(ty),'#fff',1.25*pc);
      ctx.restore(); circ(ctx,X(hx),Y(hy),0.85*pc,COL.ink,'#fff',2.2);
      if(amp>0.3){ ctx.save(); ctx.globalAlpha=amp; const dir=-Math.sin(phi); vec(ctx,X(tx),Y(ty+1.2),X(tx+dir*2.2),Y(ty+1.2),COL.yellow,2.4); ctx.restore(); } }
    // pieces on the table / in the air
    pieces.forEach(p=>{ if(p===cur) return; const c=Math.cos(p.a)*p.len/2, s=Math.sin(p.a)*p.len/2; chalkBar(ctx,X(p.x-c),Y(p.y-s),X(p.x+c),Y(p.y+s),RAD*pc); });
    toM.forEach(m=>{ const u=clamp(m.u,0,1), e=u*u*(3-2*u), x=lerp(m.x0,MX+(Math.random()-0.5)*0.1,e), y=lerp(m.y0,2.5,e)+9*4*e*(1-e), a=u*4, c=Math.cos(a)*m.p.len/2, s=Math.sin(a)*m.p.len/2; chalkBar(ctx,X(x-c),Y(y-s),X(x+c),Y(y+s),RAD*pc); });
    // the piece being bent + the two hands
    let HL=null, HR=null;
    if(cur){ const L2=cur.len/2, c=Math.cos(bend)*L2, s=Math.sin(bend)*L2, ca=Math.cos(cur.a)*L2, sa=Math.sin(cur.a)*L2;
      if(cur.st==='bend'){ chalkBar(ctx,X(cur.x-c),Y(cur.y-s),X(cur.x),Y(cur.y),RAD*pc); chalkBar(ctx,X(cur.x),Y(cur.y),X(cur.x+c),Y(cur.y-s),RAD*pc);
        if(bend>0.05) line(ctx,X(cur.x),Y(cur.y)-RAD*pc,X(cur.x)+2,Y(cur.y)-RAD*pc*0.2,COL.ink,1.4);
        const q=RAD*pc; vec(ctx,X(cur.x-c*0.8),Y(cur.y-s*0.8)-q-26,X(cur.x-c*0.8),Y(cur.y-s*0.8)-q-3,COL.yellow,2.6); vec(ctx,X(cur.x+c*0.8),Y(cur.y-s*0.8)-q-26,X(cur.x+c*0.8),Y(cur.y-s*0.8)-q-3,COL.yellow,2.6); vec(ctx,X(cur.x),Y(cur.y)+q+26,X(cur.x),Y(cur.y)+q+3,COL.yellow,2.6);
        HL=[X(cur.x-c),Y(cur.y-s)]; HR=[X(cur.x+c),Y(cur.y-s)]; }
      else { chalkBar(ctx,X(cur.x-ca),Y(cur.y-sa),X(cur.x+ca),Y(cur.y+sa),RAD*pc); HL=[X(cur.x-ca),Y(cur.y-sa)]; HR=[X(cur.x+ca),Y(cur.y+sa)]; }
      hands.lx=HL; hands.rx=HR; }
    if(hands&&hands.lx){ const o=hands.open, al=cur?hands.o:1-o, dx=o*40, dy=-o*18;

      ctx.restore(); }
    dust.forEach(d=>{ ctx.save(); ctx.globalAlpha=clamp(d.life,0,1); ctx.fillStyle=COL.mid; ctx.fillRect(X(d.x)-1.2,Y(d.y)-1.2,2.4,2.4); ctx.restore(); });
    // scale bar
    line(ctx,X(-16),Y(-1.6),X(-14),Y(-1.6),COL.ink,2); textAt(ctx,'2 cm',X(-13.6),Y(-1.6)+4,{size:11,color:COL.muted});
    // lens
    const R=Math.min(w*0.2,h*0.3), cx=w-R-16, cy=R+16;
    let tx, ty, g;
    if(mChunks>0||toM.length){ tx=X(MX); ty=Y(bot(0)+0.8); g=mChunks>0?dG:1; }
    else { const big=pieces.slice().sort((a,b)=>b.len-a.len)[0]||cur; const p=cur||big; tx=X(p.x); ty=Y(p.y); g=p.len; }
    const eX=Math.floor(zoomL+1e-9), mant=Math.round(mag/Math.pow(10,eX));
    const magTxt=mag<1000?'×'+Math.round(mag):'×'+(mant>1?mant+'·':'')+'10'+sup(eX);
    let what='';
    zoomFrame(ctx,cx,cy,R,tx,ty,magTxt+(mag<=30?' · magnifying glass':mag<=1500?' · microscope':' · beyond any ordinary microscope'),()=>{ what=drawZoom(ctx,cx,cy,R,g,mag,pc,mChunks>0); });

    $('#mV').textContent=magTxt;
    if(mChunks>0){ const n=mChunks*Math.pow(1/dG,3); $('#r1').textContent=n<1000?Math.round(n).toString():'≈ 10'+sup(Math.round(Math.log10(n))); $('#r2').textContent=fmtLen(dG); }
    else { const ls=pieces.concat(cur?[cur]:[]).map(p=>p.len); $('#r1').textContent=String(tot); const mn=Math.min(...ls), mx=Math.max(...ls); $('#r2').textContent=ls.length?(mn===mx?fmtLen(mn):fmtLen(mn)+' – '+fmtLen(mx)):'—'; }
    $('#r3').textContent=what;
    const brk=$('#brk'), grd=$('#grd');
    brk.disabled=!breakable().length||mChunks>0||toM.length>0;
    grd.disabled=mChunks===0&&!toM.length&&(breakable().length>0||!!cur||queue.length>0);
    grd.textContent=(mChunks>0||toM.length)?(grinding?'⏸ Stop grinding':'⚙ Grind'):'⚙ Put in mortar & grind';
    const fb=$('#fb');
    if(zoomL>7.2){ fb.className='fb ok'; fb.textContent='The smallest units that cannot be broken further: constituent particles.'; }
    else if(mChunks>0){ fb.className='fb ok'; fb.textContent='Finer and finer — every speck is still chalk.'; }
    else if(tot===1&&pieces[0]&&pieces[0].len===8){ fb.className='fb warn'; fb.textContent='Break the stick of chalk.'; }
    else if(breakable().length||cur){ fb.className='fb ok'; fb.textContent='Each piece is still chalk — only smaller.'; }
    else { fb.className='fb warn'; fb.textContent='Too small to break by hand — grind them.'; }
  });
  return wrap;
}

/* =====================================================================
   7.2 SUGAR IN WATER — TASTE THE TOP LAYER
   The water is 40 layers of 0.25 cm. Sugar spreads between layers by
   Fick's law, ∂c/∂t = D·∂²c/∂z², with
       D = 5.2×10⁻¹⁰ m²/s (sucrose in still water)  →  crossing 10 cm
           takes ~L²/D ≈ 200 days, so unstirred the top stays plain;
       stirring adds an eddy mixing of ~2×10⁻³ m²/s → mixed in seconds.
   Crystals dissolve at  dm/dt = −r·(m/m₀)^(2/3)·(1 − c/cₛ),
   cₛ = 2000 g/L, r = 0.006 g/s unstirred, 0.4 g/s stirred (≈1 min).
   Crystals sink at their Stokes speed (~8 cm/s). Chemistry clock ×10.
   You can just taste sugar at about 4 g/L.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><button class="toggle-btn play" id="add" style="width:100%;padding:9px;">🥄 Add 2 teaspoons of sugar</button>
      <div class="toggle-group"><button class="toggle-btn" id="stir">🥢 Stir</button><button class="toggle-btn" id="taste">👅 Taste the top layer</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Sugar grains left</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Time passed</div><div class="rval" id="r2">0 s</div></div>
      <div class="rcard wide"><div class="rlabel">Last taste of the top layer</div><div class="rval" id="r3">—</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Time runs ×10 faster than real.</div>
      <button class="toggle-btn navy" id="rs">↺ Fresh glass of water</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const N=40, H=10, RIN=3.5, DZ=H/N, AREA=Math.PI*RIN*RIN, CELLV=AREA*DZ/1000, D0=5.2e-6, KST=20, CS=2000, TC=10, TASTE=4;
  let c, m, m0, crystals, colH, spoon, stirring, swirl, theta, tasteA, lastTaste, clock, t;
  const S=psNew();
  function reset(){ c=new Float64Array(N); m=0; m0=0; crystals=[]; colH=new Float64Array(14); spoon=null; stirring=false; swirl=0; theta=0; tasteA=null; lastTaste=null; clock=0; t=0;
    S.ps.length=0; const r=rng(9); for(let i=0;i<76;i++) psAdd(S,{x:(r()-0.5)*1.4,y:(r()-0.5)*1.4,r:0.075,temp:0.35,damp:3,col:COL.blue,fill:'#eaf4fd',kind:'w'}); $('#stir').classList.remove('active'); }
  reset();
  $('#add').onclick=()=>{ if(spoon) return; spoon={T:0,rel:0}; };
  $('#stir').onclick=()=>{ stirring=!stirring; $('#stir').classList.toggle('active',stirring); };
  $('#taste').onclick=()=>{ if(!tasteA) tasteA={T:0,done:false}; };
  $('#rs').onclick=reset;

  animLoop((dt)=>{
    t+=dt;
    swirl=approach(swirl,stirring?1:0,stirring?2:0.6,dt); theta+=7*dt*(stirring?1:0.2*swirl);
    // chemistry (real seconds)
    const dtr=dt*TC; clock+=dtr;
    if(m>1e-6){
      const lo=Math.max(1,Math.round(N*0.4*swirl)), cb=c.slice(0,lo+1).reduce((a,b)=>a+b,0)/(lo+1);

    });

    // magnified top layer: sugar particles follow the top-layer concentration

    if(have.length<want){ { const a=Math.random()*6.28, rr=Math.sqrt(Math.random())*0.8; psAdd(S,{x:Math.cos(a)*rr,y:Math.sin(a)*rr,r:0.1,temp:0.35,damp:3,col:COL.ink,fill:'#fff',kind:'s',lw:2}); } }

    // dissolved sugar: grey dots, density ∝ concentration, jiggling
    { const r=rng(21); ctx.save(); ctx.fillStyle=COL.muted;
      for(let i=0;i<N;i++){ const n=Math.min(14,Math.round(c[i]/5)); for(let k=0;k<n;k++){ const px=-RIN+0.2+r()*(2*RIN-0.4), pz=i*DZ+r()*DZ, ph=r()*6.28; if(pz>surf(px)-0.1) continue; ctx.fillRect(gx(px)+Math.sin(t*5+ph)*1.5-1,Y(pz)+Math.cos(t*4+ph)*1.5-1,2,2); } } ctx.restore(); }
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); for(let k=0;k<=30;k++){ const x=-RIN+2*RIN*k/30; ctx[k?'lineTo':'moveTo'](gx(x),Y(surf(x))); } ctx.stroke(); ctx.restore();
    // crystals
    const fac=m0>0?Math.cbrt(Math.max(0,m)/m0):1;
    crystals.forEach(k=>{ let x=k.x, y=k.y, s=k.s;
      if(k.st==='bed'){ s*=fac; if(s<0.08) return; const L=smooth01(0.1,0.7,swirl); k.th+=(2+k.lift*2)*swirl*dt*(1+0.3*Math.sin(t));
        x=lerp(k.bx,Math.cos(k.th)*k.r,L); y=lerp(k.by,0.4+k.lift*5.5*swirl,L); }
      const p=Math.max(2,s*0.22*pc); ctx.save(); ctx.translate(gx(x),Y(y)); ctx.rotate(k.th); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.3; ctx.fillRect(-p/2,-p/2,p,p); ctx.strokeRect(-p/2,-p/2,p,p); ctx.restore(); });
    // glass tumbler
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(gx(-RIN-0.25),Y(12.5)); ctx.lineTo(gx(-RIN-0.1),Y(-0.6)); ctx.lineTo(gx(RIN+0.1),Y(-0.6)); ctx.lineTo(gx(RIN+0.25),Y(12.5)); ctx.stroke(); ctx.restore();
    line(ctx,gx(-RIN),Y(0),gx(RIN),Y(0),COL.mid,1.2);
    // stirring rod
    if(stirring||swirl>0.05){ const tipx=Math.cos(theta)*2.1*Math.max(swirl,0.3), tipy=1.2; ctx.save(); ctx.lineCap='round'; line(ctx,gx(tipx),Y(tipy),gx(tipx*0.4+1.8),Y(15.5),COL.ink,6); line(ctx,gx(tipx),Y(tipy),gx(tipx*0.4+1.8),Y(15.5),'#fff',2.6); ctx.restore();
      if(swirl>0.2){ ctx.save(); ctx.globalAlpha=swirl; ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(gx(0),Y(4),2.4*pc,0.5*pc,0,0.2,Math.PI-0.2); ctx.stroke(); arrowHead(ctx,gx(-2.3),Y(4)-0.2*pc,Math.PI*0.9,COL.green,7); ctx.restore(); } }
    // adding spoon
    if(spoon){ const T=spoon.T, inU=smooth01(0,0.6,T)-smooth01(1.8,2.4,T), tip=smooth01(0.6,1.1,T)-smooth01(1.5,1.8,T);
      const sx=gx(lerp(9,1.2,inU)), sy=Y(14.8); ctx.save(); ctx.globalAlpha=clamp(inU*1.5,0,1); ctx.translate(sx,sy); ctx.rotate(-tip*1.1);
      ctx.beginPath(); ctx.ellipse(0,0,1.1*pc,0.5*pc,0,0,Math.PI); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); line(ctx,-1.1*pc,0,1.1*pc,0,COL.ink,2);
      line(ctx,1.05*pc,-1,5*pc,-0.9*pc,COL.ink,3);
      if(spoon.rel<40){ const n=Math.round((40-spoon.rel)/5); for(let k=0;k<n;k++) ctx.strokeRect(-0.7*pc+k*0.2*pc,-0.25*pc,4,4); }
      ctx.restore(); }
    // tasting spoon
    if(tasteA){ const T=tasteA.T, d=smooth01(0,0.6,T)-smooth01(0.9,1.5,T), sx=gx(-1.5), sy=Y(lerp(15,H-0.2,d));
      ctx.save(); ctx.beginPath(); ctx.ellipse(sx,sy,0.9*pc,0.4*pc,0,0,Math.PI); ctx.fillStyle=tasteA.done?'rgba(47,143,224,0.3)':'#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); line(ctx,sx-0.9*pc,sy,sx+0.9*pc,sy,COL.yellow,2); line(ctx,sx-0.85*pc,sy-1,sx-4.5*pc,sy-1.2*pc,COL.yellow,3); ctx.restore(); }
    textAt(ctx,'top layer',gx(RIN)+8,Y(H-0.3)+4,{size:11,color:COL.muted});
    textAt(ctx,'bottom',gx(RIN)+8,Y(0.3)+4,{size:11,color:COL.muted});
    // concentration profile
    { const x0=X(-0.6), x1=X(6.2), cmax=Math.max(...c), top=cmax>40?Math.pow(10,Math.ceil(Math.log10(cmax))):40, XC=v=>x0+(x1-x0)*clamp(v/top,0,1);
      line(ctx,x0,Y(0),x0,Y(H),COL.ink,1.6); line(ctx,x0,Y(0),x1,Y(0),COL.ink,1.6);
      ctx.save(); ctx.fillStyle='rgba(76,97,120,0.10)'; ctx.beginPath(); ctx.moveTo(x0,Y(0)); for(let i=0;i<N;i++) ctx.lineTo(XC(c[i]),Y((i+0.5)*DZ)); ctx.lineTo(x0,Y(H)); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.beginPath(); for(let i=0;i<N;i++) ctx[i?'lineTo':'moveTo'](XC(c[i]),Y((i+0.5)*DZ)); ctx.stroke(); ctx.restore();
      line(ctx,XC(TASTE),Y(0),XC(TASTE),Y(H),COL.mid,1.1,[4,4]);
      textAt(ctx,'sugar in each layer',x0,Y(H)-18,{size:11,weight:600,color:COL.muted});
      textAt(ctx,'0',x0,Y(0)+14,{size:10,color:COL.muted,align:'center'}); textAt(ctx,top+' g/L',x1,Y(0)+14,{size:10,color:COL.muted,align:'center'});
      textAt(ctx,'just sweet',XC(TASTE)+3,Y(H)-4,{size:10,color:COL.muted}); }
    // magnified top layer
    const R=Math.min(w*0.19,h*0.25), cx=w-R-16, cy=R+16;
    zoomFrame(ctx,cx,cy,R,gx(-0.5),Y(H-0.4),'top layer, magnified (imagined)',()=>{ psDraw(ctx,S,cx,cy,R); });

    const nLeft=m0>0?m/m0:0;
    $('#r1').textContent=m0>0?(nLeft>0.005?fmt(m,1)+' g':'none'):'—';
    $('#r2').textContent=clock<120?Math.round(clock)+' s':fmt(clock/60,1)+' min';
    $('#r3').textContent=lastTaste===null?'—':(lastTaste>=TASTE?'Sweet · ':'Not sweet · ')+fmt(lastTaste,1)+' g/L';
    $('#r3').style.color=lastTaste===null?'':(lastTaste>=TASTE?'var(--f-green)':'var(--f-red)');
    const fb=$('#fb');
    if(m0===0){ fb.className='fb warn'; fb.textContent='Add sugar — do not stir yet.'; }
    else if(c[N-1]<TASTE&&!stirring){ fb.className='fb warn'; fb.textContent='Sugar sits at the bottom. The top is still plain.'; }
    else if(nLeft>0.01){ fb.className='fb ok'; fb.textContent='Stirring spreads the sugar particles through the water.'; }
    else { fb.className='fb ok'; fb.textContent='No grains left — yet every layer is sweet: sugar broke into invisible particles.'; }
  });
  return wrap;
}

/* =====================================================================
   7.3 HAMMER & HEAT A SOLID
   Hammer: the head is swung about the wrist with angular acceleration
   90 rad/s² (≈4 m/s at impact, shown ×0.3 slow motion), rebounds with a
   material-dependent restitution, and the object rings on a
   spring-damper. Metals and wood dent; rock salt cleaves into smaller
   blocks that fly, bounce and skid (μg). Every block is still salt.
   Heat (Table 7.1 — ice 0 °C, urea 133 °C, iron 1538 °C), 20 g samples:
       dH/dt = P − hA(T − 25) − εσA(T⁴ − T₀⁴)
       H < m·c_s·ΔT → heating;  next m·L → melting at constant T;
       then heating the liquid.
   L: ice 334, urea 243, iron 247 J/g. c: 2.1/1.55/0.68 (solid). Iron
   loses ~400 W by radiation near 1538 °C, so a weak heater never melts it.
   Particles vibrate with amplitude ∝ √T (reaching ~0.2 of the spacing at
   the melting point); melted particles lose their fixed places.
   Heating clock ×4.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  const OBJ={nail:{n:'Iron nail',top:1.1,e:0.45,dent:0.04,kind:'metal'},salt:{n:'Rock salt',top:3.4,e:0.12,dent:0,kind:'salt'},stone:{n:'Stone',top:3.2,e:0.5,dent:0,kind:'stone'},
    wood:{n:'Wooden block',top:3,e:0.2,dent:0.16,kind:'wood'},key:{n:'Key',top:2.6,e:0.45,dent:0.03,kind:'metal'},al:{n:'Aluminium',top:1.3,e:0.3,dent:0.12,kind:'metal'}};
  const MAT={ice:{n:'Ice',m:20,cs:2.1,L:334,cl:4.18,Tm:0,T0:-20,A:4.7e-3,eps:0.95,Tmax:60,Tlo:-25},
    urea:{n:'Urea',m:20,cs:1.55,L:243,cl:2.1,Tm:133,T0:25,A:3.66e-3,eps:0.9,Tmax:180,Tlo:0},
    iron:{n:'Iron',m:20,cs:0.68,L:247,cl:0.82,Tm:1538,T0:25,A:1.13e-3,eps:0.6,Tmax:1650,Tlo:0}};
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group" id="mdB" style="margin-top:0"><button class="toggle-btn active" data-m="h">🔨 Hammer it</button><button class="toggle-btn" data-m="q">🔥 Heat it</button></div></div>
    <div class="side-sub" id="subH">
      <div class="control-group"><label>Solid object</label><div class="chip-wrap" id="obB">${Object.keys(OBJ).map((k,i)=>`<button class="chip-btn${i?'':' active'}" data-o="${k}">${OBJ[k].n}</button>`).join('')}</div>
        <button class="toggle-btn play" id="hit" style="width:100%;padding:9px;margin-top:9px;">🔨 Strike</button></div>
      <div class="control-group"><div class="result-cards">
        <div class="rcard"><div class="rlabel">Hits</div><div class="rval" id="h1">0</div></div>
        <div class="rcard"><div class="rlabel">Hammer speed</div><div class="rval" id="h2" style="color:var(--f-yellow)">—</div></div>
        <div class="rcard wide"><div class="rlabel">Shape</div><div class="rval" id="h3">Definite</div></div></div>
        <div class="fb" id="fbH"></div>
        <button class="toggle-btn navy" id="rsH">↺ Fresh object</button></div></div>
    <div class="side-sub hidden" id="subQ">
      <div class="control-group"><label>Solid (Table 7.1)</label><div class="chip-wrap" id="mtB">${Object.keys(MAT).map((k,i)=>`<button class="chip-btn${i?'':' active'}" data-k="${k}">${MAT[k].n} · ${MAT[k].Tm} °C</button>`).join('')}</div></div>
      <div class="control-group"><label>Heater power <span class="val" id="pV"></span></label><input type="range" id="pR" min="50" max="1500" step="10" value="250">
        <button class="toggle-btn play" id="heat" style="width:100%;padding:9px;margin-top:9px;">🔥 Heat on</button></div>
      <div class="control-group"><div class="result-cards">
        <div class="rcard"><div class="rlabel">Temperature</div><div class="rval" id="q1" style="color:var(--f-yellow)">—</div></div>
        <div class="rcard"><div class="rlabel">Melted</div><div class="rval" id="q2">0 %</div></div>
        <div class="rcard wide"><div class="rlabel">Heat lost to the room</div><div class="rval" id="q3">—</div></div></div>
        <div class="fb" id="fbQ"></div><div class="hint">Heating shown ×4 faster · sample drawn ×1.6.</div>
        <button class="toggle-btn navy" id="rsQ">↺ Fresh sample</button></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  let mode='h', ok='nail', mk='ice', t=0;
  // ---- hammer state
  const SM=0.3, LH=13, TH_UP=1.15, TH_REST=0.45;
  let hm, obj, frags, chips, hits, vHit;
  // ---- heat state
  let Hq, on, hist, tq;
  const L=psNew();
  function lattice(kind){
    L.ps.length=0;
    const a=0.25, sites=kind==='salt'?(()=>{ const o=[]; for(let y=0.62;y>-0.5;y-=a) for(let x=-0.75;x<=0.76;x+=a) if(Math.hypot(x,y)<0.9) o.push([x,y]); return o; })():hexSites(a,-0.8,0.8,-0.45,0.66);
    const r=rng(4);
    sites.forEach(([x,y],i)=>{ const jx=(kind==='stone'||kind==='wood')?(r()-0.5)*0.06:0, jy=(kind==='stone'||kind==='wood')?(r()-0.5)*0.06:0;
      const alt=kind==='salt'&&((Math.round((x+0.75)/a)+Math.round((0.62-y)/a))%2===1);
      psAdd(L,{x:x+jx,y:y+jy,hx:x+jx,hy:y+jy,k:60,r:alt?0.075:0.1,temp:0.02,damp:4,col:COL.ink,fill:'#fff',lw:1.8}); });
  }
  function resetH(){ hm={th:TH_REST,w:0,ph:'rest',T:0,sp:{x:TH_REST,v:0}}; obj={sh:{x:0,v:0},dent:0}; frags=ok==='salt'?[{x:-4,y:0,w:6,h:3.4,a:0,vx:0,vy:0,va:0,st:'rest'}]:[]; chips=[]; hits=0; vHit=0; lattice(OBJ[ok].kind); }
  function resetQ(){ Hq=0; on=false; hist=[]; tq=0; lattice(mk==='urea'?'salt':'metal'); }
  resetH();
  toggleWire([...wrap.querySelectorAll('#mdB .toggle-btn')],b=>{ mode=b.dataset.m; $('#subH').classList.toggle('hidden',mode!=='h'); $('#subQ').classList.toggle('hidden',mode!=='q'); if(mode==='h') resetH(); else resetQ(); });
  wrap.querySelectorAll('#obB .chip-btn').forEach(b=>b.onclick=()=>{ wrap.querySelectorAll('#obB .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); ok=b.dataset.o; resetH(); });
  wrap.querySelectorAll('#mtB .chip-btn').forEach(b=>b.onclick=()=>{ wrap.querySelectorAll('#mtB .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); mk=b.dataset.k; resetQ(); });
  $('#hit').onclick=()=>{ if(hm.ph==='rest'){ hm.ph='raise'; hm.T=0; hm.sp={x:hm.th,v:0}; } };
  $('#rsH').onclick=resetH; $('#rsQ').onclick=resetQ;
  $('#heat').onclick=()=>{ on=!on; };
  const OX=-4, PX=OX+LH;
  const qState=H=>{ const s=MAT[mk], H1=s.m*s.cs*(s.Tm-s.T0), H2=H1+s.m*s.L; if(H<H1) return [s.T0+H/(s.m*s.cs),0]; if(H<H2) return [s.Tm,(H-H1)/(s.m*s.L)]; return [s.Tm+(H-H2)/(s.m*s.cl),1]; };
  const topAt=x=>{ if(ok!=='salt') return OBJ[ok].top-obj.dent; let tp=0; frags.forEach(f=>{ if(f.st==='rest'&&Math.abs(x-f.x)<f.w/2+0.6) tp=Math.max(tp,f.h); }); return tp; };
  const PY=OBJ.nail.top+2.2;

  function strike(){
    const o=OBJ[ok], v=Math.abs(hm.w)*0.3; vHit=v; hits++;   // head speed (m/s) for a 30 cm hammer
    obj.sh.v-=v*14;
    if(o.dent) obj.dent=Math.min(o.kind==='wood'?0.7:0.5,obj.dent+o.dent);
    // particles below the hammer are pushed together, then spring back
    L.ps.forEach(p=>{ if(p.hy<-0.1) p.vy+=0.15*v*Math.max(0,1-Math.abs(p.hx)*0.8); });
    if(o.kind==='metal') L.ps.forEach(p=>{ if(p.hy<-0.3){ p.hx+=0.025*Math.sign(p.hx||1); } });
    if(ok==='salt'){
      let best=null; frags.forEach(f=>{ if(f.st==='rest'&&Math.abs(f.x-OX)<f.w/2+0.6&&(!best||f.h>best.h)) best=f; });
      if(best&&best.w>0.9){ frags.splice(frags.indexOf(best),1); const n=best.w>3?3:2, ww=best.w/n;
        for(let i=0;i<n;i++){ const s=i-(n-1)/2; frags.push({x:best.x+s*ww,y:0,w:ww*0.96,h:Math.min(best.h,ww*(0.8+0.3*Math.random())),a:0,vx:s*(25+Math.random()*25)+gauss()*6,vy:25+Math.random()*35,va:(Math.random()-0.5)*8,st:'fly'}); }
        const cx=L.ps.reduce((m,p)=>m+p.hx,0)/L.ps.length+ (Math.random()-0.5)*0.2; L.ps.forEach(p=>{ if(p.hx>cx) p.hx+=0.13; else p.hx-=0.13; }); }
    }
    if(ok==='stone') for(let k=0;k<3;k++) chips.push({x:OX+gauss()*0.8,y:OBJ.stone.top,vx:gauss()*30,vy:20+Math.random()*30,life:2});
  }

  animLoop((dt)=>{
    t+=dt;
    if(mode==='h'){
      const dts=dt*SM, thC=Math.asin(clamp((topAt(OX)+2-PY)/LH,-1,1));
      if(hm.ph==='raise'){ hm.T+=dt; hm.th=springTo(hm.sp,TH_UP,50,12,dt); hm.w=0; if(hm.T>0.55) hm.ph='swing'; }
      else if(hm.ph==='swing'){ hm.w-=90*dts; hm.th+=hm.w*dts; if(hm.th<=thC){ hm.th=thC; strike(); hm.w=OBJ[ok].e*Math.abs(hm.w); hm.ph='reb'; hm.T=0; } }
      else if(hm.ph==='reb'){ hm.T+=dt; hm.w-=30*dts; hm.th+=hm.w*dts; if(hm.th<thC){ hm.th=thC; hm.w=0; } if(hm.T>0.5){ hm.ph='back'; hm.sp={x:hm.th,v:0}; hm.T=0; } }
      else if(hm.ph==='back'){ hm.T+=dt; hm.th=springTo(hm.sp,TH_REST,30,10,dt); if(hm.T>0.8) hm.ph='rest'; }
      else { hm.th=approach(hm.th,TH_REST,4,dt); }
      const o=OBJ[ok]; springTo(obj.sh,0,o.kind==='metal'?900:500,o.kind==='metal'?4:18,dt);
      frags.forEach(f=>{ if(f.st!=='fly') return; const d=dt*0.45; f.vy-=GC*d; f.x+=f.vx*d; f.y+=f.vy*d; f.a+=f.va*d;
        if(f.y<=0){ f.y=0; if(f.vy<0) f.vy=-0.25*f.vy; f.va*=0.5; f.vx*=0.7; if(Math.abs(f.vy)<14){ f.vy=0; f.a=approach(f.a,Math.round(f.a/(Math.PI/2))*Math.PI/2,20,dt); const dv=0.5*GC*d; f.vx=Math.abs(f.vx)<=dv?0:f.vx-Math.sign(f.vx)*dv; if(f.vx===0){ f.a=Math.round(f.a/(Math.PI/2))*Math.PI/2; f.st='rest'; } } }
        f.x=clamp(f.x,-12.5,8.5); });
      chips.forEach(c=>{ const d=dt*0.45; c.vy-=GC*d; c.x+=c.vx*d; c.y+=c.vy*d; if(c.y<0){ c.y=0; c.vx=0; c.vy=0; c.life-=dt; } }); chips=chips.filter(c=>c.life>0);
      L.ps.forEach(p=>{ p.temp=0.02; });
      psStep(L,dt);
    } else {
      const s=MAT[mk], P=+pR.value; $('#pV').textContent=P+' W';
      let [T,f]=qState(Hq);
      const loss=10*s.A*(T-25)+s.eps*5.67e-8*s.A*((T+273)**4-298**4);
      const dtr=dt*4; if(on||Math.abs(loss)>0) Hq=Math.max(0,Hq+((on?P:0)-loss)*dtr); tq+=dtr;
      [T,f]=qState(Hq); if(T>=s.Tmax){ on=false; }
      if(!hist.length||tq-hist[hist.length-1][0]>0.25) hist.push([tq,T]); if(hist.length>900) hist.shift();
      // particles: vibration grows with T; melted ones leave their sites
      const tempS=60*Math.pow(0.2*0.25,2)*(T+273)/(s.Tm+273);
      const nMelt=Math.round(f*L.ps.length), order=L.ps.slice().sort((a,b)=>a.hy-b.hy);
      order.forEach((p,i)=>{ const melt=i<nMelt; p.k=melt?0:60; p.gy=melt?5:0; p.temp=melt?Math.max(tempS,0.06):tempS; p.damp=melt?3:4; p.trail=melt?0.15:0; });
      psStep(L,dt);
      $('#q1').textContent=Math.round(T)+' °C'; $('#q2').textContent=Math.round(f*100)+' %';
      $('#q3').textContent=Math.round(Math.max(0,loss))+' W';
      $('#heat').textContent=on?'⏸ Heat off':'🔥 Heat on';
      const fb=$('#fbQ');
      if(f>0&&f<1){ fb.className='fb ok'; fb.textContent='Melting: heat goes into freeing particles, so T stays at '+s.Tm+' °C.'; }
      else if(f>=1){ fb.className='fb ok'; fb.textContent='All liquid — particles have left their fixed places.'; }
      else if(on&&(on?P:0)<=loss*1.02&&T>s.T0+50){ fb.className='fb bad'; fb.textContent='Heat lost = heat supplied. It will never reach '+s.Tm+' °C — raise the power.'; }
      else if(on){ fb.className='fb warn'; fb.textContent='Particles vibrate harder as it heats.'; }
      else { fb.className='fb warn'; fb.textContent='Switch the heater on.'; }
    }

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const R=Math.min(w*0.2,h*0.27), cx=w-R-16, cy=R+16;
    if(mode==='h'){
      const pc=Math.min(w/33,h/22), X=x=>w*0.42+x*pc, Y=y=>h*0.78-y*pc, o=OBJ[ok], sh=obj.sh.x*0.012;
      // board / anvil
      rect(ctx,X(-13),Y(0),22*pc,1.6*pc,COL.ink,'#fff',2.2); for(let k=0;k<4;k++) line(ctx,X(-12+k*5),Y(-0.5),X(-14.5+k*5),Y(-0.9),'#dbe4f0',1.2);
      ground(ctx,X(-15),X(16),Y(-1.6));
      // object
      ctx.save(); ctx.translate(X(OX),Y(0)); ctx.scale(1,1+sh); ctx.translate(-X(OX),-Y(0));
      const x0=X(OX), y0=Y(0), u=pc; ctx.lineJoin='round'; ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
      if(ok==='nail'){ ctx.beginPath(); ctx.moveTo(x0-5*u,y0); ctx.lineTo(x0+4*u,y0); ctx.lineTo(x0+5.4*u,y0-0.25*u); ctx.lineTo(x0+4*u,y0-0.5*u); ctx.lineTo(x0-5*u,y0-0.5*u); ctx.closePath(); ctx.fill(); ctx.stroke(); rect(ctx,x0-5.5*u,y0-1.1*u,0.5*u,1.1*u,COL.ink,'#fff',2.2); }
      else if(ok==='stone'){ ctx.beginPath(); ctx.moveTo(x0-3.2*u,y0); ctx.bezierCurveTo(x0-3.8*u,y0-2.2*u,x0-1.2*u,y0-3.4*u,x0+0.6*u,y0-3.2*u); ctx.bezierCurveTo(x0+3*u,y0-3*u,x0+3.8*u,y0-1.2*u,x0+3.1*u,y0); ctx.closePath(); ctx.fill(); ctx.stroke(); line(ctx,x0-1.5*u,y0-1*u,x0-0.5*u,y0-1.6*u,COL.mid,1.1); line(ctx,x0+1*u,y0-2*u,x0+2*u,y0-1.5*u,COL.mid,1.1); }
      else if(ok==='wood'){ rect(ctx,x0-4*u,y0-3*u,8*u,3*u,COL.ink,'#fff',2.2); for(let k=1;k<4;k++){ ctx.beginPath(); ctx.moveTo(x0-4*u,y0-k*0.75*u); ctx.bezierCurveTo(x0-1*u,y0-k*0.75*u-3,x0+1*u,y0-k*0.75*u+3,x0+4*u,y0-k*0.75*u); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.stroke(); } }
      else if(ok==='key'){ ctx.beginPath(); ctx.arc(x0-3.2*u,y0-1.3*u,1.3*u,0,Math.PI*2); ctx.fill(); ctx.stroke(); circ(ctx,x0-3.2*u,y0-1.3*u,0.45*u,COL.ink,'#fff',2);
        ctx.beginPath(); ctx.moveTo(x0-1.9*u,y0-1.6*u); ctx.lineTo(x0+4*u,y0-1.6*u); ctx.lineTo(x0+4*u,y0-0.4*u); for(let k=0;k<4;k++){ ctx.lineTo(x0+(3.4-k*1.1)*u,y0-0.4*u); ctx.lineTo(x0+(3.1-k*1.1)*u,y0); ctx.lineTo(x0+(2.8-k*1.1)*u,y0-0.4*u); } ctx.lineTo(x0-1.9*u,y0-1.0*u); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else if(ok==='al'){ rect(ctx,x0-3.5*u,y0-1.3*u,7*u,1.3*u,COL.ink,'#fff',2.2); line(ctx,x0-3*u,y0-0.9*u,x0+2*u,y0-0.9*u,'#dbe4f0',1.2); }
      if(obj.dent>0.005){ const tp=Y(o.top), dw=1.4*u, dd=obj.dent*u; ctx.save(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x0-dw,tp-1); ctx.quadraticCurveTo(x0,tp+dd*2,x0+dw,tp-1); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(x0-dw,tp); ctx.quadraticCurveTo(x0,tp+dd*2,x0+dw,tp); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
      ctx.restore();

      if(hm.ph==='swing'&&Math.abs(hm.w)>2){ const L=Math.min(60,Math.abs(hm.w)*4), sx=X(hx)-3.2*pc, sy=Y(hy); vec(ctx,sx,sy,sx-Math.sin(th)*L,sy+Math.cos(th)*L,COL.yellow,3); }

      $('#h3').textContent=ok==='salt'?(frags.length>1?'Broke into '+frags.length+' pieces — each has a fixed shape':'Definite'):(obj.dent>0.01?'Definite (small dent)':'Definite — unchanged');

/* =====================================================================
   7.4 POUR A LIQUID
   Each container is a shaped outline of fixed depth (4 cm), so volume =
   area × 4 cm. As the hand tilts the full container, the water surface
   stays level: it is found by bisection so that the part of the tilted
   outline below it holds exactly the water left. Whatever rises above the
   lip spills over it like a weir:
        Q = C_d·(2/3)·√(2g)·b·h^(3/2)  ≈ 71·h^(3/2) mL/s   (b = 4 cm)
   and falls as a projectile into the next container. Volume is conserved:
   200 mL in, 200 mL out — unless the walls are wet, in which case about
   3.5 mL clings to the walls of the container just emptied.
   Finger test: the water surface obeys the shallow-water wave equation,
        η_tt = c²·η_xx − γ·η_t,   c = √(g·d) = √(981 × 2.6) ≈ 50 cm/s,
   driven by the moving finger; wood does not let the finger in at all.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group" id="mdB" style="margin-top:0"><button class="toggle-btn active" data-m="p">🫗 Pour</button><button class="toggle-btn" data-m="f">☝ Finger test</button></div></div>
    <div class="side-sub" id="subP">
      <div class="control-group"><label style="margin-bottom:4px;">Pour the water</label>
        <div class="toggle-group"><button class="toggle-btn" id="pAB">A → B</button><button class="toggle-btn" id="pBC">B → C</button><button class="toggle-btn" id="pCA">C → A</button></div>
        <label style="margin-top:10px;">Containers</label>
        <div class="toggle-group" id="clB"><button class="toggle-btn active" data-c="1">Clean &amp; dry</button><button class="toggle-btn" data-c="0">Wet walls</button></div></div>
      <div class="control-group"><div class="result-cards three">
        <div class="rcard"><div class="rlabel">A</div><div class="rval" id="vA" style="color:var(--f-blue)">—</div></div>
        <div class="rcard"><div class="rlabel">B</div><div class="rval" id="vB" style="color:var(--f-blue)">—</div></div>
        <div class="rcard"><div class="rlabel">C</div><div class="rval" id="vC" style="color:var(--f-blue)">—</div></div></div>
        <div class="fb" id="fbP"></div>
        <button class="toggle-btn navy" id="rsP">↺ 200 mL back in A</button></div></div>
    <div class="side-sub hidden" id="subF">
      <div class="control-group"><label style="margin-bottom:4px;">Push the finger into</label>
        <div class="toggle-group" id="fmB"><button class="toggle-btn active" data-f="w">💧 Water</button><button class="toggle-btn" data-f="s">🪵 Wooden block</button></div>
        <button class="toggle-btn play" id="fgo" style="width:100%;padding:9px;margin-top:9px;">☝ Move the finger</button></div>
      <div class="control-group"><div class="fb" id="fbF"></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const DEPTH=4, CD_Q=0.6*(2/3)*Math.sqrt(2*GC)*DEPTH, FILM=3.5;
  const C=[
    {n:'A',x:-12.8,poly:[[-3.2,0],[3.2,0],[3.2,13],[-3.2,13]],open:2},
    {n:'B',x:-1,poly:[[-5,0],[5,0],[1.5,9],[1.5,14],[-1.5,14],[-1.5,9]],open:3},
    {n:'C',x:11.3,poly:[[-5,0],[5,0],[8,6],[-8,6]],open:2}];
  C.forEach(c=>{ c.mark=levelFor(c.poly,200/DEPTH); c.top=Math.max(...c.poly.map(q=>q[1])); c.lipX=Math.max(...c.poly.filter(q=>q[1]===c.top).map(q=>q[0])); });
  let clean=true, pour=null, t=0, mode='p';
  function resetP(){ C.forEach((c,i)=>{ c.V=i===0?200:0; c.film=0; c.sl={x:0,v:0}; c.px=c.x; c.py=0; c.th=0; }); pour=null; }
  resetP();
  toggleWire([...wrap.querySelectorAll('#clB .toggle-btn')],b=>{ clean=b.dataset.c==='1'; });
  toggleWire([...wrap.querySelectorAll('#mdB .toggle-btn')],b=>{ mode=b.dataset.m; $('#subP').classList.toggle('hidden',mode!=='p'); $('#subF').classList.toggle('hidden',mode!=='f'); });
  const startPour=(i,j)=>{ if(pour||C[i].V<1) return; const s=C[i], d=C[j];
    if(d.film>0){ d.V+=d.film; d.film=0; }
    pour={s,d,dir:Math.sign(d.x-s.x),ph:'lift',T:0,tilt:0,Q:0,hold:0}; };
  $('#pAB').onclick=()=>startPour(0,1); $('#pBC').onclick=()=>startPour(1,2); $('#pCA').onclick=()=>startPour(2,0);
  $('#rsP').onclick=resetP;

  $('#fgo').onclick=()=>{ fOn=!fOn; };
  const F=psNew();
  function buildLens(){ F.ps.length=0;
    if(fm==='w'){ const r=rng(2); for(let i=0;i<50;i++) psAdd(F,{x:(r()-0.5)*1.5,y:0.2+r()*0.7,r:0.085,temp:0.2,damp:3,gy:7,col:COL.blue,fill:'#eaf4fd'}); }
    else hexSites(0.2,-0.9,0.9,-0.05,0.95).forEach(([x,y])=>psAdd(F,{x,y,hx:x,hy:y,k:80,r:0.085,temp:0.01,damp:4,col:COL.ink,fill:'#fff'}));
    F.finger=psAdd(F,{x:0,y:-1.5,r:0.28,pin:true,col:COL.ink,fill:'#fff',lw:2.2}); }
  buildLens();

  animLoop((dt)=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

        const home={px:s.x,py:0,th:0};

            stream={x:lip[0],y:lip[1],u:p.dir*Math.min(12,Math.sqrt(GC*hh)),Q}; }
          else p.Q=approach(p.Q,0,10,dt); }
      }
      C.forEach(c=>springTo(c.sl,0,70,2.5,dt));

      const pc=Math.min(w/38,h/24), X=x=>w*0.5+(x-1.5)*pc, Y=y=>h*0.9-y*pc;
      ground(ctx,X(-17),X(20),Y(0));
      C.forEach(c=>{
        const wp=xform(c.poly,c.px,c.py,c.th), A=c.V/DEPTH;
        let yl=null;
        if(A>0.01){ const pouring=pour&&pour.s===c&&pour.ph!=='lift'; let lipY=Infinity;
          if(pouring){ lipY=xform([[pour.dir*c.lipX,c.top]],c.px,c.py,c.th)[0][1]; }
          yl=Math.min(levelFor(wp,A),lipY);
          const wet=clipBelow(wp,yl); if(wet.length>2){ ctx.save(); polyPath(ctx,wet,X,Y); ctx.fillStyle=WFILL2; ctx.fill(); ctx.restore();
            const xs=wet.filter(q=>Math.abs(q[1]-yl)<1e-6).map(q=>q[0]); if(xs.length>=2){ const a=Math.min(...xs), b=Math.max(...xs), amp=clamp(c.sl.x,-0.25,0.25);
              ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); for(let k=0;k<=20;k++){ const x=lerp(a,b,k/20); ctx[k?'lineTo':'moveTo'](X(x),Y(yl+amp*Math.sin(k/20*Math.PI*3+t*9))); } ctx.stroke(); ctx.restore(); } } }
        if(c.film>0){ const r=rng(c.n.charCodeAt(0)); for(let k=0;k<14;k++){ const i=Math.floor(r()*c.poly.length), a=c.poly[i], b=c.poly[(i+1)%c.poly.length]; if(i===c.open) continue; const u=r(), q=xform([[lerp(a[0],b[0],u)*0.96,lerp(a[1],b[1],u)*0.97+0.1]],c.px,c.py,c.th)[0]; dot(ctx,X(q[0]),Y(q[1]),2.2,COL.blue,'#eaf4fd',1.2); } }
        // outline (skip the open top edge)
        ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); const n=wp.length;

          if(Math.abs(c.th)<0.05) textAt(ctx,'200 mL',X(c.x),Y(e[1][1])-5,{size:10,weight:600,color:COL.yellow,align:'center'}); }
        if(Math.abs(c.th)<0.05&&c.py<0.05) textAt(ctx,c.n,X(c.x),Y(0)+20,{align:'center',size:14,weight:700,color:COL.ink});
      });

      if(stream&&stream.Q>0.5){ const d=pour.d, lvl=d.V>0.01?levelFor(d.poly,d.V/DEPTH):0, yEnd=lvl, pts=[];
        for(let k=0;k<=60;k++){ const tt=k*0.006, x=stream.x+stream.u*tt, y=Math.max(yEnd,stream.y-0.5*GC*tt*tt); pts.push([x,y]); if(y<=yEnd) break; }

        ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=WFILL2; ctx.lineWidth=lw+2; ctx.beginPath(); pts.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](X(q[0]),Y(q[1]))); ctx.stroke();
        ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.setLineDash([7,6]); ctx.lineDashOffset=-t*220; ctx.stroke(); ctx.restore(); }
      ['A','B','C'].forEach((n,i)=>{ const c=C[i]; $('#v'+n).textContent=Math.round(c.V+c.film)+' mL'; });
      $('#pAB').disabled=!!pour||C[0].V<1; $('#pBC').disabled=!!pour||C[1].V<1; $('#pCA').disabled=!!pour||C[2].V<1;
      const fb=$('#fbP'), tot=C.reduce((a,c)=>a+c.V,0), full=C.find(c=>c.V>150);
      if(pour){ fb.className='fb ok'; fb.textContent='The water takes the shape of whatever holds it.'; }
