    // ---- readouts ----
    setv($,'k1',st.breaths[0]?'bubbles only · clear':'clear');
    const nB=st.bins[1].reduce((a,c)=>a+c,0)/NB;
    setv($,'k2',st.sed[1]>0.2&&turb(nB)<0.35?'clear + white layer':turb(nB)>0.6?'milky':turb(nB)>0.15?'cloudy':'clear');
    setv($,'k3',String(st.breaths[1])); setv($,'k4',Math.round(st.clock)+' min');
    const made=st.made>0.02; setv($,'k5',made?'Yes — CaCO₃':'—'); setv($,'k6',made?'Chemical':'—'); setc($,'k6',made?COL.red:COL.muted);
  });
  return wrap;
}


/* =====================================================================
   5.4 VINEGAR + BAKING SODA — which gas?
   A teaspoon (5 mL) of vinegar (5 % acetic acid, 0.83 M) holds 4.2 mmol
   of acid; lemon juice ≈ 4.5 mmol of acid H; water none. A pinch of
   baking soda (NaHCO₃, 84 mg/mmol): 0.3 g = 3.6 mmol.
     NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂
   Rate r = k·S·A/(A + 1)  (S soda, A acid, k = 0.8 /s) — it fizzes hard
   at first and dies away as either runs out. 1 mmol CO₂ = 24.5 mL.
   The gas first pushes out the air already in the tube: the CO₂ share of
   the gas leaving is x, with dx/dt = r(1 − x)/n_air (n_air ≈ 0.4 mmol),
   so the first bubbles in the lime water are plain air. About 5 % of the
   CO₂ in each bubble dissolves: Ca(OH)₂ + CO₂ → CaCO₃ (white) + H₂O.
   With water there is no acid: the soda just dissolves — no gas at all.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Liquid in the test tube</label>
      <div class="toggle-group" id="liq"><button class="toggle-btn active" data-k="vin">Vinegar</button><button class="toggle-btn" data-k="lem">Lemon juice</button><button class="toggle-btn" data-k="wat">Water</button></div></div>
    <div class="control-group"><label>Baking soda <span class="val" id="pv">0.3 g</span></label><input type="range" id="pinch" min="0.1" max="0.5" step="0.05" value="0.3">
      <button class="toggle-btn navy" id="add">Add a pinch of baking soda</button>
      <div class="toggle-group"><button class="toggle-btn small" id="rs">↺ Fresh tubes</button><button class="toggle-btn small active" id="snd">🔊 Sound</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Bubbles')}${card('k2','Gas made')}${card('k3','Lime water')}${card('k4','The gas is')}</div>
      <div class="result-cards" style="margin-top:6px">${card('k5','Type of change')}${card('k6','Soda left')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const T1={x:280,top:170,bot:420,r:26}, T2={x:560,top:200,bot:420,r:26}, L1=352, L2=318;
  const ACIDS={vin:{A:4.2,col:'#f3f8fd',name:'vinegar'},lem:{A:4.5,col:'#fcf5d6',name:'lemon juice'},wat:{A:0,col:'#e4f0fb',name:'water'}};
  let liq='vin', t=0, s;
  const fresh=()=>{ s={A:ACIDS[liq].A,S:0,sol:0,made:0,x:0,n_air:0.4,ca:0.2,ppt:0,foam:0,bub1:[],bub2:[],r1:[],r2:[],gr:[],spat:spr(0),cork:spr(0),adding:0,flow:flowNew(),rate:0,added:false}; };
  fresh();
  toggleWire([...$('#liq').querySelectorAll('.toggle-btn')],b=>{ liq=b.dataset.k; fresh(); });
  $('#pinch').oninput=()=>{ $('#pv').textContent=fmt(+$('#pinch').value,2)+' g'; };
  $('#add').onclick=()=>{ sfxCtx(); if(s.adding<=0&&!s.added){ s.adding=2.4; s.added=true; } };
  $('#rs').onclick=fresh;
  $('#snd').onclick=()=>{ SFX.on=!SFX.on; $('#snd').classList.toggle('active',SFX.on); $('#snd').textContent=SFX.on?'🔊 Sound':'🔈 Muted'; };
  const del=pathNew(pts(bezPts(P(T1.x,T1.top-24),P(T1.x,90),P(T2.x,70),P(T2.x,T2.top-10),30),[P(T2.x,T2.bot-18)]));
  const turb=n=>1-Math.exp(-n/0.03);

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[130,40,700,470]);
    // ---- adding the pinch: cork lifts, spatula tips, grains fall, cork goes back ----
    if(s.adding>0){ s.adding-=dt; const u=2.4-s.adding; springTo(s.cork,u<1.7?1:0,40,9,dt); springTo(s.spat,u>0.3&&u<1.8?1:0,30,8,dt);
      if(u>0.8&&u<1.4){ const g=+$('#pinch').value; for(let k=0;k<3;k++) s.gr.push({x:T1.x+(Math.random()-0.5)*10,y:T1.top-8,vy:40+Math.random()*60,m:g*1000/84/60,r:1.4+Math.random()*1.4}); } }
    else { springTo(s.cork,0,40,9,dt); springTo(s.spat,0,30,8,dt); }
    s.gr.forEach(p=>{ if(p.y<L1-2){ p.vy+=900*dt; p.y+=p.vy*dt; if(p.y>=L1-2){ p.y=L1-2; s.S+=p.m; p.inL=true; p.vy=30; } } else { p.y=Math.min(T1.bot-p.r-2,p.y+p.vy*dt); p.r-=dt*(liq==='wat'?0.25:0.9); } });
    s.gr=s.gr.filter(p=>p.r>0.2);
    // ---- chemistry ----
    const r=s.A>0?0.8*s.S*s.A/(s.A+1):0;          // mmol CO₂ per s
    if(liq==='wat'){ const d=Math.min(s.S,dt*0.6*s.S+dt*0.02); s.S-=d; s.sol+=d; }
    else { s.S=Math.max(0,s.S-r*dt); s.A=Math.max(0,s.A-r*dt); s.made+=r*dt; }
    s.rate=approach(s.rate,r,6,dt); sndFizz(s.rate*25,dt);
    s.x+=s.rate*(1-s.x)/s.n_air*dt;                 // CO₂ share of the gas leaving the tube
    const absorbed=s.rate*s.x*0.05*dt, m=Math.min(absorbed,s.ca); s.ca-=m; s.ppt+=m;
    s.foam=approach(s.foam,clamp(s.rate*14,0,70),3,dt);
    if(Math.random()<dt*s.rate*60) bubAdd(s.bub1,T1.x+(Math.random()-0.5)*30,T1.bot-8-Math.random()*20,1.5+Math.random()*2.5,(Math.random()-0.5)*60);
    if(s.cork.x<0.1 && Math.random()<dt*s.rate*20) bubAdd(s.bub2,T2.x+(Math.random()-0.5)*4,T2.bot-18,2.5+Math.random()*2,(Math.random()-0.5)*50);
    flowStep(s.flow,s.cork.x<0.1?clamp(s.rate*90,0,160):0,dt);
    bubStep(s.bub1,dt,x=>L1-s.foam,y=>T1.x-T1.r,y=>T1.x+T1.r,s.r1);
    bubStep(s.bub2,dt,x=>L2,y=>T2.x-T2.r,y=>T2.x+T2.r,s.r2);

    // ---- draw ----
    table5(ctx,440);
    standDraw(ctx,T1.x,T1.top+40,440); standDraw(ctx,T2.x,T2.top+40,440);
    testTube(ctx,T1.x,T1.top,T1.bot,T1.r,{level:L1,liq:ACIDS[liq].col,wob:s.rate>0.2?Math.sin(t*25)*1.5:0,inside:()=>{
      s.gr.forEach(p=>{ if(p.inL) circ(ctx,p.x,p.y,p.r,COL.mid,'#fff',1); });
      bubDraw(ctx,s.bub1,COL.green,s.r1);
      if(s.foam>1){ const R=rng(3); for(let k=0;k<50;k++){ const fx=T1.x-T1.r+R()*T1.r*2, fy=L1-R()*s.foam; circ(ctx,fx,fy+Math.sin(t*9+k)*1,1.5+R()*3,COL.green,'#fff',1.1); } } }});
    testTube(ctx,T2.x,T2.top,T2.bot,T2.r,{level:L2,liq:mixCol('#dcebfa','#f6f6f2',turb(s.ppt)),inside:()=>{
      const a=turb(s.ppt); if(a>0.02){ const R=rng(9); ctx.fillStyle=`rgba(129,149,171,${0.7*a})`; for(let k=0;k<Math.round(60*a);k++) ctx.fillRect(T2.x-T2.r+R()*T2.r*2,L2+R()*(T2.bot-L2),1.6,1.6); }
      bubDraw(ctx,s.bub2,COL.green,s.r2); }});
    // falling grains above the liquid
    s.gr.forEach(p=>{ if(!p.inL) circ(ctx,p.x,p.y,p.r,COL.mid,'#fff',1); });
    // cork + flexible delivery tube (lifts with the cork)
    const cy=T1.top-4-s.cork.x*70; stopper(ctx,T1.x,cy,T1.r);
    const dp=pts(bezPts(P(T1.x,cy-14),P(T1.x,90-s.cork.x*40),P(T2.x,70),P(T2.x,T2.top-10),30),[P(T2.x,T2.bot-18)]); const Pa=pathNew(dp);
    ctx.save(); strokePts(ctx,dp,COL.ink,9); strokePts(ctx,dp,'#fff',5); ctx.restore();
    flowDraw(ctx,Pa,s.flow,{col:COL.green,full:60,gap:22,size:4,lw:2});
    // spatula with its heap of soda
    if(s.spat.x>0.01){ const sx=T1.x+20+(1-s.spat.x)*160, sy=T1.top-40, tilt=clamp((2.4-s.adding-0.8)*1.4,0,0.7)*s.spat.x;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(tilt); ctx.lineWidth=2.4; ctx.strokeStyle=COL.yellow; ctx.fillStyle='#fff'; rrect(ctx,-6,-4,150,8,4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-16,0,18,7,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); if(2.4-s.adding<1.0){ ctx.fillStyle='#fff'; ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(-16,-3,9,Math.PI,0); ctx.fill(); ctx.stroke(); } ctx.restore(); }
    textAt(ctx,ACIDS[liq].name,T1.x-T1.r-8,L1+30,{align:'right',size:12.5,weight:600,color:COL.blue});
    textAt(ctx,'lime water',T2.x+T2.r+8,L2+30,{size:12.5,weight:600,color:COL.blue});
    if(s.rate>0.3) tag(ctx,'fizz! bubbles of gas',T1.x+130,L1+30,COL.green,{size:12});
    if(turb(s.ppt)>0.6) tag(ctx,'milky → carbon dioxide',T2.x-130,L2-40,COL.red,{size:12});
    if(liq==='wat'&&s.sol>0.5&&s.S<0.05) tag(ctx,'soda dissolved · no gas',T1.x+130,L1+30,COL.blue,{size:12});
    ctx.restore();
    // ---- readouts ----
    setv($,'k1',s.rate>0.3?'fizzing!':s.rate>0.02?'a few':s.added?'none':'—'); setc($,'k1',s.rate>0.02?COL.green:COL.muted);
    setv($,'k2',fmt(s.made*24.5,0)+' mL');
    const a=turb(s.ppt); setv($,'k3',a>0.6?'milky':a>0.15?'cloudy':'clear'); setc($,'k3',a>0.6?COL.red:COL.blue);
    setv($,'k4',a>0.6?'carbon dioxide':s.made>0.1?'?':'—'); setc($,'k4',COL.green);
    const ch=liq==='wat'?(s.sol>0.3?'Physical (dissolves)':'—'):(s.made>0.2?'Chemical':'—'); setv($,'k5',ch); setc($,'k5',liq==='wat'?COL.blue:COL.red);
    setv($,'k6',s.added?fmt(s.S*84/1000,2)+' g':'—');
  });
  return wrap;
}


/* =====================================================================
   5.5 TWO CANDLES — ONE UNDER A GLASS TUMBLER
   A small candle burns ≈ 0.05 g of wax a minute and uses ≈ 2.5 mL of
   oxygen a second. Air is 20.9 % oxygen; a wax flame cannot live below
   about 16 %. Under a tumbler of volume V:
     dO₂/dt = −q·f/V,  dCO₂/dt = +0.7·q·f/V,  f = ((O₂ − 16)/4.9)^0.6
   so the flame shrinks as the oxygen runs down; below f ≈ 0.3 (O₂ ≈ 16.6 %)
   it can no longer keep itself hot and goes out abruptly — ~8 s for
   300 mL, twice as long for 600 mL. The open candle always has fresh air.
   The trapped air warms (up to ~ +45 °C); when the flame dies it cools
   and shrinks, pulling the lime water a little way up into the tumbler.
   CO₂ inside dissolves into the lime water under the rim → milky.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><button class="toggle-btn navy" id="light">Light both candles</button>
      <button class="toggle-btn navy" id="cover" style="background:#fff;color:var(--navy-2)">Cover candle B with the tumbler</button></div>
    <div class="control-group"><label>Tumbler size</label><div class="toggle-group" id="size"><button class="toggle-btn" data-v="150">150 mL</button><button class="toggle-btn active" data-v="300">300 mL</button><button class="toggle-btn" data-v="600">600 mL</button></div>
      <label style="margin-top:9px">Lime water in the dishes</label><div class="toggle-group" id="lime"><button class="toggle-btn active" data-v="1">Yes</button><button class="toggle-btn" data-v="0">No</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Candle A (open)')}${card('k2','Candle B (covered)')}${card('k3','Oxygen inside',COL.green)}${card('k4','Carbon dioxide inside',COL.green)}${card('k5','B burned for')}${card('k6','Lime water under glass')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const DY=430, AX=250, BX=560, CH=112, CW=30;
  const SZ={150:{h:176,r:58},300:{h:232,r:74},600:{h:292,r:94}};
  let V=300, lime=true, t=0;
  const S={litA:false,litB:false,fA:spr(0),fB:spr(0),cov:false,drop:spr(-1),O2:20.9,CO2:0.04,Tg:25,Tpk:25,burn:0,out:false,milk:0,rise:0,smA:[],smB:[],lit:0};
  const reset=()=>{ Object.assign(S,{O2:20.9,CO2:0.04,Tg:25,Tpk:25,burn:0,out:false,rise:0}); };
  $('#light').onclick=()=>{ S.lit=1.2; };
  $('#cover').onclick=()=>{ S.cov=!S.cov; if(S.cov){ S.burn=0; S.Tpk=25; } else { S.out=false; } $('#cover').textContent=S.cov?'Lift the tumbler':'Cover candle B with the tumbler'; [...$('#size').children].forEach(b=>b.disabled=S.cov); };
  toggleWire([...$('#size').children],b=>{ if(!S.cov){ V=+b.dataset.v; reset(); } });
  toggleWire([...$('#lime').children],b=>{ lime=b.dataset.v==='1'; S.milk=0; });
  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[110,70,720,470]);
    const sz=SZ[V];
    // match sweeps across and lights both wicks
    if(S.lit>0){ S.lit-=dt; if(S.lit<0.8) S.litA=true; if(S.lit<0.4&&!(S.cov&&S.drop.x>0.9&&S.O2<16.5)) { S.litB=true; S.out=false; } }
    // tumbler goes down / up (spring)
    springTo(S.drop,S.cov?1:-1,26,9,dt);
    const sealed=S.cov&&S.drop.x>0.97;
    if(!sealed){ S.O2=approach(S.O2,20.9,S.drop.x>0.5?1.5:6,dt); S.CO2=approach(S.CO2,0.04,S.drop.x>0.5?1.5:6,dt); S.Tg=approach(S.Tg,25,2,dt); S.rise=approach(S.rise,0,2,dt); if(!S.cov) S.Tpk=25; }
    const fB=S.litB?Math.pow(clamp((S.O2-16)/4.9,0,1),0.6):0;
    if(sealed&&S.litB){ const q=2.5; S.O2-=q*fB/V*100*dt; S.CO2+=0.7*q*fB/V*100*dt; S.burn+=dt; if(fB<0.3){ S.litB=false; S.out=true; for(let k=0;k<14;k++) smokeAdd(S.smB,BX+(Math.random()-0.5)*6,DY-CH-22); } }
    // trapped air: warmed by the flame, cools to the room; cooling shrinks it → lime water rises
    if(sealed){ S.Tg+=(12*fB-(S.Tg-25)*0.25)*dt; S.Tpk=Math.max(S.Tpk,S.Tg); const shrink=(S.Tpk-S.Tg)/(273+S.Tpk)+ (20.9-S.O2)/100*0.3; S.rise=approach(S.rise,clamp(shrink*90,0,26),1.2,dt);
      if(lime) S.milk=clamp(S.milk+dt*Math.max(0,S.CO2-0.5)*0.045,0,1); }
    springTo(S.fA,S.litA?1:0,30,7,dt); springTo(S.fB,fB*(S.litB?1:0),30,7,dt);
    const ceil=x=>DY-10-sz.h+10;
    smokeStep(S.smA,dt,2.2); smokeStep(S.smB,dt,6,sealed?ceil:undefined);

    // ---- draw ----
    table5(ctx,DY+8);
    [AX,BX].forEach((x,i)=>petri(ctx,x,DY,220,lime,0));
    if(lime&&S.milk>0.02){ const R=rng(4); ctx.save(); ctx.globalAlpha=clamp(S.milk*1.4,0,1); ctx.fillStyle='#f7f7f3'; ctx.fillRect(BX-sz.r+2,DY-9,2*sz.r-4,7); ctx.fillStyle=COL.mid; for(let k=0;k<40;k++) ctx.fillRect(BX-sz.r+3+R()*(2*sz.r-6),DY-8+R()*5,1.6,1.6); ctx.restore(); }
    candleDraw(ctx,AX,DY-3,CW,CH,{lit:S.litA,f:S.fA.x,t,pool:0.6,fh:62,fw:20});
    const cb=candleDraw(ctx,BX,DY-3,CW,CH,{lit:S.litB||S.fB.x>0.03,f:S.fB.x,t:t+1.3,pool:0.6,fh:62,fw:20,glow:S.out?clamp(1-S.burn*0,0,1):0});
    smokeDraw(ctx,S.smA,2.2); ctx.save(); if(sealed){ ctx.beginPath(); ctx.moveTo(BX-sz.r,DY-8); ctx.lineTo(BX-sz.r*0.8,DY-8-sz.h); ctx.lineTo(BX+sz.r*0.8,DY-8-sz.h); ctx.lineTo(BX+sz.r,DY-8); ctx.closePath(); ctx.clip(); } smokeDraw(ctx,S.smB,6); ctx.restore();
    // inverted tumbler over B: rim sits in the dish liquid
    const yb=DY-8-(1-(S.drop.x+1)/2)*360;           // rim y
    if(S.drop.x>-0.99){ ctx.save(); ctx.translate(0,yb); ctx.scale(1,-1); ctx.translate(0,-yb);
      tumbler(ctx,BX,yb,yb+sz.h,sz.r,sz.r*0.8,{}); ctx.restore();
      if(sealed&&S.rise>0.3){ ctx.save(); ctx.fillStyle=lime?mixCol('#e4f0fb','#fbfbfb',S.milk):'#e4f0fb'; ctx.fillRect(BX-sz.r+3,DY-9-S.rise,2*sz.r-6,S.rise); line(ctx,BX-sz.r+3,DY-9-S.rise,BX+sz.r-3,DY-9-S.rise,COL.blue,1.6); ctx.restore(); }
      // oxygen gauge on the glass
      if(S.drop.x>0.5){ const gx=BX+sz.r+34; meterV(ctx,gx,DY-sz.h+10,16,sz.h-60,(S.O2-15)/6,COL.green,''); textAt(ctx,'O₂',gx+8,DY-sz.h,{align:'center',size:12,weight:700,color:COL.green});
        const y16=DY-sz.h+10+(sz.h-60)*(1-(16-15)/6); line(ctx,gx-6,y16,gx+22,y16,COL.red,1.6,[4,3]); textAt(ctx,'16 %',gx+26,y16+4,{size:10.5,weight:600,color:COL.red}); textAt(ctx,fmt(S.O2,1)+' %',gx+8,DY-36,{align:'center',size:12,weight:700,color:COL.green}); } }
    // the match
    if(S.lit>0){ const u=1-S.lit/1.2, mx=lerp(170,640,u); matchDraw(ctx,mx-60,DY-CH-60,0.25,60,true,t); }
    textAt(ctx,'A',AX,DY+34,{align:'center',size:20,weight:700}); textAt(ctx,'B',BX,DY+34,{align:'center',size:20,weight:700});
    if(S.out) tag(ctx,'too little oxygen → flame goes out',BX,DY-sz.h-26,COL.red,{size:12});
    if(S.litA) tag(ctx,'fresh air all the time',AX,DY-CH-120,COL.green,{size:12});
    if(S.milk>0.35) leader(ctx,BX-sz.r+14,DY-6,BX-sz.r-60,DY+26,'lime water turns milky',COL.red);
    ctx.restore();
    // ---- readouts ----
    setv($,'k1',S.litA?'burning':'—'); setc($,'k1',S.litA?COL.yellow:COL.muted);
    setv($,'k2',S.litB?(sealed?'burning (smaller)':'burning'):S.out?'went out':'—'); setc($,'k2',S.out?COL.red:COL.yellow);
    setv($,'k3',sealed||S.out?fmt(S.O2,1)+' %':'20.9 %'); setv($,'k4',sealed||S.out?fmt(S.CO2,1)+' %':'0.04 %');
    setv($,'k5',S.burn>0?fmt(S.burn,1)+' s':'—');
    setv($,'k6',!lime?'—':S.milk>0.35?'milky':S.milk>0.1?'cloudy':'clear'); setc($,'k6',S.milk>0.35?COL.red:COL.blue);
  });
  return wrap;
}


/* =====================================================================
   5.6 MATCH OR MAGNIFIER — ignition temperature (real time, no speed-up)
   The paper is 70 rings, 1 mm wide, around the hot spot. Each ring:
     C·dT/dt = α·I(r) + flames − 2h(T−T₀) − 2εσ(T⁴−T₀⁴) + conduction
   C = 112 J/m²K (80 g/m² paper), h = 10 W/m²K, ε = 0.9.
   Lens: 5 cm across, f = 10 cm, noon sun 1000 W/m² → 1.96 W. The spot
   radius is √(s_sun² + s_blur² + s_defocus²), s_sun = f·0.00465,
   s_blur = 2 mm, s_defocus = (D/2)·|d − f|/f.
   White paper absorbs only 6 %; as it scorches (rate ∝ e^(−13600/T))
   it darkens and absorbs up to 90 % — so it smokes, browns, and then
   reaches 233 °C, the ignition temperature of paper, and catches fire.
   Best focus: smoke ≈ 3 s, flame ≈ 4 s; 1 cm off focus ≈ 27 s;
   2 cm off: it only gets warm. A match flame (~40 kW/m² on the paper)
   is already hotter than 233 °C: fire in under a second.
   A burning ring heats the rings next to it, so the flame front creeps
   outward at ≈ 2.5 mm/s, leaving ash.
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Heat the paper with</label>
      <div class="toggle-group" id="src"><button class="toggle-btn active" data-k="match">Lighted match</button><button class="toggle-btn" data-k="lens">Sun + magnifier</button></div></div>
    <div class="control-group hidden" id="lg"><label>Lens above paper <span class="val" id="dv">13 cm</span></label><input type="range" id="d" min="4" max="16" step="0.5" value="13"></div>
    <div class="control-group"><button class="toggle-btn navy" id="go">Bring the lighted match</button>
      <div class="toggle-group"><button class="toggle-btn small" id="rs">↺ New paper</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Hot spot',COL.red)}${card('k2','Ignition temp.',COL.green)}${card('k3','Paper')}${card('k4','Time')}</div>
      <div class="result-cards" style="margin-top:6px">${card('k5','Burnt area')}${card('k6','Fire needs')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const N=70, dr=1e-3, T0=25, Cp=112, kth=5e-6, sig=5.67e-8, TIGN=233, QN=22000, AW=0.06, SB=2e-3, F=0.10, D=0.05, PL=1.96;
  let src='match', dLens=0.13, t=0, P;
  const fresh=()=>{ P={T:new Float64Array(N).fill(T0),c:new Float64Array(N),fuel:new Float64Array(N).fill(1),burn:new Uint8Array(N),on:false,tm:0,ign:null,mt:spr(0),lens:spr(0),sm:[],smk:0}; };
  fresh();
  const rin=i=>i*dr, rout=i=>(i+1)*dr, area=i=>Math.PI*(rout(i)**2-rin(i)**2);
  const spot=()=>{ const ss=F*0.00465, sd=(D/2)*Math.abs(dLens-F)/F; return Math.sqrt(ss*ss+SB*SB+sd*sd); };
  const setSrc=k=>{ src=k; $('#lg').classList.toggle('hidden',k!=='lens'); $('#go').textContent=k==='lens'?'Hold the magnifier in the sun':'Bring the lighted match'; fresh(); };
  toggleWire([...$('#src').children],b=>setSrc(b.dataset.k));
  $('#d').oninput=()=>{ dLens=+$('#d').value/100; $('#dv').textContent=fmt(+$('#d').value,1)+' cm'; };
  $('#go').onclick=()=>{ P.on=!P.on; $('#go').textContent=P.on?(src==='lens'?'Take the magnifier away':'Take the match away'):(src==='lens'?'Hold the magnifier in the sun':'Bring the lighted match'); };
  $('#rs').onclick=()=>{ const s=src; fresh(); setSrc(s); };
  const heat=(r)=>{ // incoming flux before absorption (lens) or direct (match), W/m²
    if(src==='lens'){ if(P.lens.x<0.9) return 0; const s=spot(); return PL/(Math.PI*s*s)*Math.exp(-r*r/(s*s)); }
    return P.mt.x>0.95?40000*Math.exp(-r*r/25e-6):0; };
  const stepPaper=dt=>{ const n=Math.ceil(dt/0.004), h=dt/n; const T=P.T;
    for(let s=0;s<n;s++){ const dT=new Float64Array(N);
      for(let i=0;i<N;i++){ const r=(i+0.5)*dr, A=area(i); let q=0; const hs=heat(r);
        if(P.burn[i]!==2) q+=src==='lens'?(AW+(0.9-AW)*P.c[i])*hs:hs;
        if(P.burn[i]===1) q+=30000;
        for(let j=Math.max(0,i-2);j<=Math.min(N-1,i+2);j++) if(j!==i&&P.burn[j]===1) q+=QN;
        const Tk=T[i]+273, loss=2*10*(T[i]-T0)+2*0.9*sig*(Tk**4-(T0+273)**4); let W=(q-loss)*A;
        if(i>0) W+=2*Math.PI*rin(i)*kth/dr*(T[i-1]-T[i]); if(i<N-1) W+=2*Math.PI*rout(i)*kth/dr*(T[i+1]-T[i]);
        dT[i]=W/(Cp*A)*h; }
      let sk=0; for(let i=0;i<N;i++){ T[i]=Math.min(900,T[i]+dT[i]); const Tk=T[i]+273; if(!P.burn[i]){ const dc=h*1.5e12*Math.exp(-13600/Tk); P.c[i]=Math.min(1,P.c[i]+dc); sk+=dc*area(i)*1e6; }
        if(!P.burn[i]&&T[i]>=TIGN){ P.burn[i]=1; if(P.ign===null) P.ign=P.tm; } if(P.burn[i]===1){ P.fuel[i]-=h/1.2; if(P.fuel[i]<=0){ P.fuel[i]=0; P.burn[i]=2; } } }
      P.smk=sk/h; } };

  // oblique view of the paper: 12 cm square, 3000 px/m, foreshortened 0.38
  const PX=400, PY=392, S=3000, FS=0.38;
  const paperPath=(ctx)=>{ const hw=0.06*S; ctx.beginPath(); ctx.moveTo(PX-hw-hw*0.25,PY+hw*FS); ctx.lineTo(PX+hw-hw*0.25,PY+hw*FS); ctx.lineTo(PX+hw+hw*0.25,PY-hw*FS); ctx.lineTo(PX-hw+hw*0.25,PY-hw*FS); ctx.closePath(); };
  const ringCol=i=>{ if(P.burn[i]===2) return '#aab2bc'; if(P.burn[i]===1) return mixCol('#3a2a20','#1a1a1a',1-P.fuel[i]); const c=P.c[i]; return c<0.5?mixCol('#ffffff','#c08a52',c*2):mixCol('#c08a52','#2a2420',(c-0.5)*2); };

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[120,-10,720,480]);
    springTo(P.mt,src==='match'&&P.on&&P.ign===null?1:0,18,7,dt); springTo(P.lens,src==='lens'&&P.on?1:0,18,7,dt);
    if(P.on||P.burn.some(b=>b===1)||P.T[0]>T0+1) P.tm+=dt;
    stepPaper(dt);
    if(Math.random()<dt*clamp(P.smk*0.4,0,30)) smokeAdd(P.sm,PX+(Math.random()-0.5)*20,PY-6);
    P.burn.forEach((b,i)=>{ if(b===1&&Math.random()<dt*4) { const a=Math.random()*Math.PI*2; smokeAdd(P.sm,PX+Math.cos(a)*rout(i)*S,PY+Math.sin(a)*rout(i)*S*FS-30); } });
    smokeStep(P.sm,dt,3);

    table5(ctx,440);
    // tile under the paper
    ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(PX-260,PY+96); ctx.lineTo(PX+200,PY+96); ctx.lineTo(PX+260,PY-80); ctx.lineTo(PX-200,PY-80); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    // paper with its scorched / burning / ash rings
    ctx.save(); paperPath(ctx); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
    for(let i=N-1;i>=0;i--){ if(P.c[i]<0.01&&!P.burn[i]) continue; ctx.beginPath(); ctx.ellipse(PX,PY,rout(i)*S,rout(i)*S*FS,0,0,Math.PI*2); ctx.fillStyle=ringCol(i); ctx.fill(); }
    for(let i=0;i<N;i++) if(P.burn[i]===2&&i%3===0){ ctx.beginPath(); ctx.ellipse(PX,PY,rout(i)*S,rout(i)*S*FS,0,0,Math.PI*2); ctx.strokeStyle='rgba(19,42,68,0.25)'; ctx.lineWidth=1; ctx.stroke(); }
    ctx.restore(); ctx.save(); paperPath(ctx); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    // flames standing on the burning rings
    for(let i=0;i<N;i++) if(P.burn[i]===1){ const n=Math.max(3,Math.round(rout(i)*S/14)); for(let k=0;k<n;k++){ const a=k/n*Math.PI*2+i*0.7, x=PX+Math.cos(a)*rout(i)*S, y=PY+Math.sin(a)*rout(i)*S*FS;
      if(x<PX-0.06*S-20||x>PX+0.06*S+20) continue; flameOne(ctx,x,y,12,(18+26*P.fuel[i])*(0.8+0.2*Math.sin(t*7+k)),t+k+i,COL.red,COL.yellow); } }
    smokeDraw(ctx,P.sm,3);
    // ---- the heat sources ----
    if(src==='match'){ const u=P.mt.x, tipX=PX+10+(1-u)*190, tipY=PY-6-(1-u)*170; matchDraw(ctx,tipX+0.737*94,tipY-0.675*94,2.4,90,true,t);
 }
    else { const lensY=PY-dLens*1500, ly=lerp(40,lensY,P.lens.x), R=60, fy=ly+F*1500;
      sunDraw(ctx,PX,-10,26,t);
      if(P.lens.x>0.02){ ctx.save(); ctx.globalAlpha=P.lens.x; for(let k=-2;k<=2;k++){ const x0=PX+k*R/2.2; line(ctx,x0,106,x0,ly,COL.yellow,1.8); const ex=PX+(x0-PX)*(1-(PY-ly)/(fy-ly)); line(ctx,x0,ly,ex,PY,COL.yellow,1.8); } ctx.restore();
        lensSide(ctx,PX,ly,R);
        if(P.lens.x>0.9){ const s=spot()*S; glow(ctx,PX,PY,Math.max(8,s*2.2),COL.yellow,0.85); ctx.save(); ctx.beginPath(); ctx.ellipse(PX,PY,Math.max(2,s),Math.max(1,s*FS),0,0,Math.PI*2); ctx.fillStyle='#fff8c8'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
        textAt(ctx,'focus',PX+R+14,fy+4,{size:11,weight:600,color:COL.muted,alpha:fy<PY+60?1:0}); if(fy<PY+60) circ(ctx,PX,fy,3,COL.yellow,COL.yellow,1); } }
    // thermometer of the hot spot, with the ignition temperature
    const Tmax=P.T.reduce((a,v)=>Math.max(a,v),0); thermoScale(ctx,680,120,360,Tmax,0,500,[0,100,200,300,400,500],TIGN); textAt(ctx,'233 °C',632,360-(240)*(TIGN/500)+4,{align:'right',size:11,weight:700,color:COL.green});
    // fire triangle
    const ok=[true,true,P.burn.some(b=>b>0)||P.T[0]>=TIGN], tx=200, ty=70;
    const V3=[[tx,ty-40],[tx-46,ty+36],[tx+46,ty+36]]; const lbl=['fuel','oxygen','heat'];
    for(let k=0;k<3;k++){ const a=V3[k], b=V3[(k+1)%3]; line(ctx,a[0],a[1],b[0],b[1],ok[k]?[COL.blue,COL.green,COL.red][k]:'#d5dde8',4); }
    textAt(ctx,'fuel',tx-38,ty-6,{align:'right',size:11,weight:700,color:ok[0]?COL.blue:COL.mid}); textAt(ctx,'heat',tx+38,ty-6,{size:11,weight:700,color:ok[2]?COL.red:COL.mid}); textAt(ctx,'oxygen',tx,ty+52,{align:'center',size:11,weight:700,color:ok[1]?COL.green:COL.mid});
    if(ok[2]) flameOne(ctx,tx,ty+22,14,26,t,COL.red,COL.yellow);
    ctx.restore();
    // ---- readouts ----
    setv($,'k1',Math.round(P.T.reduce((a,v)=>Math.max(a,v),0))+' °C'); setv($,'k2',TIGN+' °C');
    const nb=P.burn.filter(b=>b===1).length, na=P.burn.filter(b=>b===2).length;
    setv($,'k3',nb?'burning':na?'ash':P.c[0]>0.3?'browning':P.smk>0.2?'smoking':'white'); setc($,'k3',nb?COL.red:P.c[0]>0.05?COL.yellow:COL.muted);
    setv($,'k4',fmt(P.tm,1)+' s'+(P.ign!==null?' · fire at '+fmt(P.ign,1)+' s':''));
    let ba=0; for(let i=0;i<N;i++) if(P.burn[i]) ba+=area(i); setv($,'k5',fmt(ba*1e4,1)+' cm²');
    setv($,'k6',ok[2]?'fuel ✓ oxygen ✓ heat ✓':'fuel ✓ oxygen ✓ heat ✗'); setc($,'k6',ok[2]?COL.red:COL.muted);
  });
  return wrap;
}


/* =====================================================================
   5.7 A BURNING CANDLE — physical and chemical changes together
   Heat from the flame melts a pool of wax (pool → 0.9·flame, τ ≈ 6 s,
   shown ×20). Liquid wax climbs the wick (capillary rise), evaporates
   at the hot tip, and only the VAPOUR burns: wax + oxygen → carbon
   dioxide + water (+ heat, light). Melting, rising, evaporating and the
   hardening of drips are physical; the burning of the vapour is chemical.
   A draught tilts the flame; the rim on that side melts, liquid wax
   spills over and runs down, slowing as it cools (v ∝ 1 − solid) until
   it freezes in place.
   Blow it out: the hot wick keeps boiling off wax for a few seconds
   (τ ≈ 1.5 s) — the white "smoke" is wax vapour turning back into tiny
   solid drops. A match held in that trail lights the vapour and the
   flame runs DOWN the trail to the wick (Faraday's trick).
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><button class="toggle-btn navy" id="lit">Light the candle</button></div>
    <div class="control-group"><label>Draught <span class="val" id="dv">0</span></label><input type="range" id="dr" min="0" max="1" step="0.05" value="0"></div>
    <div class="control-group"><button class="toggle-btn" id="relight" disabled>Match into the smoke trail</button></div>
    <div class="control-group"><div class="result-cards">${card('k1','Wax melts',COL.blue)}${card('k2','Rises up wick',COL.blue)}${card('k3','Evaporates',COL.blue)}${card('k4','Vapour burns',COL.red)}${card('k5','Drips harden',COL.blue)}${card('k6','Wax used')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=400, BASE=460, CW=132;
  const S={lit:false,f:spr(0),pool:0,solid:0,h:250,drips:[],up:[],vap:[],prod:[],sm:[],wickT:0,draught:0,lean:spr(0),used:0,match:spr(0),mt:0,jump:null,rim:0};
  $('#lit').onclick=()=>{ if(S.lit){ S.lit=false; } else { S.lit=true; S.jump=null; } $('#lit').textContent=S.lit?'Blow it out':'Light the candle'; };
  $('#dr').oninput=()=>{ S.draught=+$('#dr').value; $('#dv').textContent=fmt(S.draught,2); };
  $('#relight').onclick=()=>{ if(!S.lit&&S.mt<=0){ S.mt=3; } };
  let t=0;
  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[150,-10,650,480]);
    // ---- physics ----
    springTo(S.f,S.lit?1:0,S.lit?10:40,S.lit?4:12,dt);
    const f=Math.max(0,S.f.x);
    springTo(S.lean,S.lit?S.draught*0.55+Math.sin(t*2.3)*0.04*S.draught:0,20,5,dt);
    S.pool=approach(S.pool,S.lit?0.9*f:S.pool,1/6,dt);
    S.solid=S.lit?Math.max(0,S.solid-dt*2):Math.min(1,S.solid+dt/4);
    S.wickT=S.lit?approach(S.wickT,1,3,dt):S.wickT*Math.exp(-dt/1.5);
    if(S.lit){ S.used+=dt*20*0.12/60*f; S.h=Math.max(150,S.h-dt*0.25*f); }
    // spill: tilted flame melts the rim on the downwind side
    if(S.lit&&S.draught>0.35&&S.pool>0.6){ S.rim+=dt*S.draught*0.4; if(S.rim>1){ S.rim=0; if(S.drips.length<9) S.drips.push({side:1,len:4,wid:5+Math.random()*4,solid:0,off:Math.random()}); } }
    S.drips.forEach(d=>{ d.solid=Math.min(1,d.solid+dt/3); d.len=Math.min(S.h*0.8,d.len+dt*60*(1-d.solid)); });
    // liquid wax climbing the wick, vapour leaving the tip, burning to products
    const top=BASE-S.h, dip=S.pool*CW*0.16, tip={x:CX+S.lean.x*14,y:top+dip*1.2-34};
    if(S.lit&&f>0.5&&S.solid<0.5){ if(Math.random()<dt*14) S.up.push({u:0}); if(Math.random()<dt*24) S.vap.push({x:tip.x+(Math.random()-0.5)*6,y:tip.y,vx:(Math.random()-0.5)*20,vy:-30-Math.random()*20,t:0}); }
    S.up.forEach(p=>p.u+=dt*1.2); S.up=S.up.filter(p=>p.u<1);
    const fh=120*f, fw=36;
    S.vap.forEach(v=>{ v.t+=dt; v.x+=v.vx*dt+S.lean.x*40*dt; v.y+=v.vy*dt; const edge=Math.abs(v.x-tip.x)>fw*0.3*(1-(tip.y-v.y)/fh)||v.y<tip.y-fh*0.45;
      if(edge&&!v.burnt){ v.burnt=true; v.bt=0; } if(v.burnt){ v.bt+=dt; if(v.bt>0.15&&!v.done){ v.done=true; S.prod.push({x:v.x,y:v.y,vy:-80,vx:(Math.random()-0.5)*20+S.lean.x*60,t:0,k:Math.random()<0.5}); } } });
    S.vap=S.vap.filter(v=>!v.done&&v.t<2);
    S.prod.forEach(p=>{ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); S.prod=S.prod.filter(p=>p.t<1.6);
    // after blowing out: wax vapour from the hot wick condenses into a white trail
    if(!S.lit&&S.wickT>0.08&&Math.random()<dt*30*S.wickT) smokeAdd(S.sm,tip.x,tip.y-4,COL.mid);
    smokeStep(S.sm,dt,2.4);
    // match into the trail: if the trail is still there, flame runs down it
    if(S.mt>0){ S.mt-=dt; springTo(S.match,1,20,7,dt); const my=tip.y-110;
      if(S.match.x>0.9&&!S.jump&&!S.lit){ const trail=S.sm.some(s=>Math.abs(s.x-(tip.x))<30&&s.y<tip.y-40&&s.y>tip.y-160&&s.t<1.4); if(trail&&S.wickT>0.1) S.jump={y:my}; }
      if(S.mt<=0){ S.mt=0; } } else springTo(S.match,0,20,7,dt);
    if(S.jump){ S.jump.y+=300*dt; if(S.jump.y>=tip.y-8){ S.jump=null; S.lit=true; $('#lit').textContent='Blow it out'; S.mt=Math.min(S.mt,0.6); } }
    $('#relight').disabled=S.lit;

    // ---- draw ----
    table5(ctx,BASE+2);
    const c=candleDraw(ctx,CX,BASE,CW,S.h,{pool:Math.max(S.pool,0.05),solid:S.solid>0.6,lit:false,f:0,t,lean:S.lean.x,wickH:34,drips:S.drips.map(d=>({side:d.side,len:d.len,wid:d.wid,solid:d.solid})),glow:S.wickT>0.2&&!S.lit?1:0});
    // liquid wax climbing inside the wick
    S.up.forEach(p=>{ const y0=top+dip*1.2, x=lerp(CX,tip.x,p.u), y=lerp(y0,tip.y+4,p.u); circ(ctx,x,y,2,COL.blue,COL.blue,1); });
    // the flame (outer yellow, dark inner zone with wax vapour)
    if(f>0.02){ ctx.save(); ctx.translate(tip.x,tip.y+6); ctx.rotate(S.lean.x*0.6); glow(ctx,0,-fh*0.45,fh*0.9,COL.yellow,0.35*f); flameOne(ctx,0,0,fw*Math.sqrt(f),fh,t,COL.yellow,COL.blue); ctx.restore(); }
    S.vap.forEach(v=>{ const col=v.burnt?COL.red:COL.blue; circ(ctx,v.x,v.y,v.burnt?2.6:1.8,col,v.burnt?COL.red:'#fff',1.2); });
    S.prod.forEach(p=>{ ctx.save(); ctx.globalAlpha=1-p.t/1.6; circ(ctx,p.x,p.y,2.4,COL.green,'#fff',1.4); ctx.restore(); });
    smokeDraw(ctx,S.sm,2.4);
    if(S.jump){ flameOne(ctx,tip.x,S.jump.y+20,18,34,t,COL.red,COL.yellow); glow(ctx,tip.x,S.jump.y,40,COL.yellow,0.6); }
    if(S.match.x>0.02){ const mx=lerp(640,tip.x+14,S.match.x), my=tip.y-110; matchDraw(ctx,mx+0.9*94,my-0.44*94,2.69,90,true,t); }
    // short labels for each change
    const L=(on,x1,y1,x2,y2,txt,col)=>{ if(on) leader(ctx,x1,y1,x2,y2,txt,col); };
    const P1=S.pool>0.2&&S.solid<0.5;
    L(P1,CX-CW*0.3,top+dip,CX-CW/2-40,top+40,'wax melts',COL.blue);
    L(S.up.length>0,CX+2,top+dip-14,CX+CW/2+36,top-10,'liquid wax rises up the wick',COL.blue);
    L(S.vap.some(v=>!v.burnt),tip.x-4,tip.y-18,CX-CW/2-40,tip.y-40,'wax vapour',COL.blue);
    L(S.vap.some(v=>v.burnt),tip.x+10,tip.y-fh*0.4,CX+CW/2+36,tip.y-fh*0.5,'vapour burns',COL.red);
    L(S.prod.length>5,tip.x+6,tip.y-fh-10,CX+CW/2+36,tip.y-fh-30,'carbon dioxide + water',COL.green);
    L(S.drips.some(d=>d.solid>0.6),CX+CW/2+6,top+60,CX+CW/2+50,top+100,'drip hardens',COL.blue);
    L(!S.lit&&S.sm.length>6,tip.x-6,tip.y-50,CX-CW/2-40,tip.y-80,'white trail = wax vapour',COL.muted);
    ctx.restore();
    if(S.lit) timeTagPx(ctx,w,'time ×20');
    // ---- readouts ----
    const yes=(id,on,col)=>{ setv($,id,on?'yes':'—'); setc($,id,on?col:COL.muted); };
    yes('k1',P1,COL.blue); yes('k2',S.up.length>0,COL.blue); yes('k3',S.vap.length>0||(!S.lit&&S.wickT>0.1),COL.blue); yes('k4',S.vap.some(v=>v.burnt),COL.red); yes('k5',S.drips.some(d=>d.solid>0.6)||(!S.lit&&S.solid>0.6&&S.pool>0.2),COL.blue);
    setv($,'k6',fmt(S.used,2)+' g');
  });
  return wrap;
}

   Make the change, then really try to undo it: refreeze the water, cool
   the steam on a cold lid, press the dough back, rain on the shirt …
   or push the carrot pieces together and lift — they stay apart.
   ===================================================================== */
function buildA8(){ return buildChangeLab(8); }

const activities = [
  { num:'5.1', title:'Changes Around Us', desc:'Table 5.1 · what changes?', build: buildA1 },
  { num:'5.2', title:'Fold · Pop · Crush', desc:'Paper, balloon, chalk', build: buildA2 },

  });
}

  stopAllLoops();
