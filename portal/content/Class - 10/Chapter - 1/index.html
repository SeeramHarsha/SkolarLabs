<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 · Chapter 1 — Chemical Reactions and Equations | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand-badge">⚗️</div>

      <span><i style="background:var(--f-blue)"></i>Water · solution · reduced</span>

  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">

        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>

</div>

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 1: CHEMICAL REACTIONS AND EQUATIONS
   (NCERT Science, jesc101) — Activities 1.1 – 1.11.
   Every scene runs a continuous animation loop: controls only set targets.
   Ribbons burn, gases bubble, precipitates settle and colours change by
   real stoichiometry, energy balances and rate laws, compressed in time.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

    <div class="control-group"><label>Burn</label><div class="toggle-group">

      <div class="toggle-group"><button class="toggle-btn active" id="glB">🕶 Eye protection on</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Tip °C',COL.red)}${card('r2','Mg burnt',COL.ink)}${card('r3','MgO in glass',COL.green)}</div>
      <div class="hint" id="coat"></div><div class="fb hidden" id="fb"></div></div>`;

  $('#lampB').onclick=()=>{ lampOn=!lampOn; setBtn($('#lampB'),lampOn?'🔥 Lamp is lit':'🔥 Light the lamp',lampOn?'active':''); if(lampOn) tink(300,0.05,0.2); };

    if(S.lit||S.done){ const LX=180, LY=150; lens(ctx,LX,LY,72,undefined,undefined,'',()=>{ const ph=(t*0.45)%1, a=ease(clamp(ph/0.4,0,1)), b=ease(clamp((ph-0.4)/0.3,0,1));
        const oy=lerp(LY-50,LY-18,a); const ox1=lerp(LX-11,LX-30,b), ox2=lerp(LX+11,LX+30,b), oyy=lerp(oy,LY+2,b);
        if(b<0.05) bondDraw(ctx,LX-11,oy,LX+11,oy,COL.green);
        const made=ph>0.72; if(made){ bondDraw(ctx,LX-30,LY+2,LX-30,LY+34,COL.green); bondDraw(ctx,LX+30,LY+2,LX+30,LY+34,COL.green); }
        atomDraw(ctx,LX-30,LY+34,15,'Mg',COL.red); atomDraw(ctx,LX+30,LY+34,15,'Mg',COL.red);
        atomDraw(ctx,ox1,oyy,11,'O',COL.green); atomDraw(ctx,ox2,oyy,11,'O',COL.green); });

    ctx.restore();

}

/* =====================================================================
   1.2 LEAD NITRATE + POTASSIUM IODIDE
   Tube: 4 mL of 0.05 M Pb(NO₃)₂ = 0.20 mmol Pb²⁺.
   Dropper: 1.0 M KI, 0.05 mL per drop = 0.05 mmol I⁻.
   Pb²⁺ + 2I⁻ → PbI₂↓ (Ksp 9.8×10⁻⁹ — every drop precipitates at once)
   → 0.025 mmol = 11.5 mg PbI₂ per drop until Pb²⁺ runs out (8 drops,
   92 mg). Yellow grains sink with the dense drop, then settle at a
   Stokes speed (≈ 2 mm/s here, compressed ×20); swirling lifts them.
   In the magnifier 1 Pb²⁺ ion = 0.05 mmol (1 I⁻ per drop), so the counts
   are exact: 4 Pb²⁺ take 8 drops.
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TW=72, TH=330, BX=300, BY=486, ML=tubeArea(TW,150)/4; // px² per mL
  const S={drops:0, I:0, pb:0.20, ppt:0, V:4, g:[], sed:0, sq:spr(0), fill:0.8, drop:null, auto:false, cool:0, swirl:0, ang:spr(0), cloud:[], ions:null, t:0, tint:0};
  side.innerHTML=`
    <div class="control-group"><label>Potassium iodide</label><div class="toggle-group">
      <button class="toggle-btn play" id="one">💧 Add one drop</button><button class="toggle-btn" id="many">💧💧 Keep adding</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="sw">↻ Swirl the tube</button><button class="toggle-btn" id="rs">↺ Fresh tube</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','KI drops',COL.yellow)}${card('r2','PbI₂ formed',COL.green)}${card('r3','Pb²⁺ left',COL.red)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  function ionsInit(){ const r=rng(7); S.ions=[]; for(let i=0;i<4;i++){ S.ions.push({k:'Pb',x:600+r()*150,y:60+r()*150,vx:0,vy:0}); S.ions.push({k:'N',x:600+r()*150,y:60+r()*150,vx:0,vy:0},{k:'N',x:600+r()*150,y:60+r()*150,vx:0,vy:0}); } }
  function reset(){ Object.assign(S,{drops:0,I:0,pb:0.20,ppt:0,V:4,g:[],sed:0,drop:null,auto:false,cool:0,swirl:0,cloud:[],tint:0,units:0,extra:0}); ionsInit(); setBtn($('#many'),'💧💧 Keep adding',''); fb.className='fb hidden'; }
  reset();
  const squeeze=()=>{ if(!S.drop&&S.cool<=0){ S.sq.v+=14; S.cool=0.55; S.drop={x:BX+2,y:BY-TH-40,vy:0,r:4.5}; } };
  $('#one').onclick=squeeze;
  $('#many').onclick=()=>{ S.auto=!S.auto; setBtn($('#many'),S.auto?'■ Stop adding':'💧💧 Keep adding',S.auto?'active':''); };
  $('#sw').onclick=()=>{ S.swirl=1.6; };
  $('#rs').onclick=reset;
  const hOf=()=>{ let lo=0,hi=TH; const A=S.V*ML; for(let k=0;k<30;k++){ const m=(lo+hi)/2; if(tubeArea(TW,m)>A) hi=m; else lo=m; } return lo; };
  const wallX=y=>{ const r=TW/2-3; if(y<r) return Math.sqrt(Math.max(0,r*r-(r-y)**2)); return r; }; // local half-width at height y above bottom
  animLoop(dt=>{
    S.t+=dt; const t=S.t;
    S.cool-=dt; if(S.auto&&S.cool<=0&&!S.drop) squeeze();
    springTo(S.sq,0,300,18,dt);
    const lvl=hOf();
    if(S.drop){ if(dropStep(S.drop,dt,BY-lvl)){ // drop reaches the liquid
        S.drops++; S.V+=0.05; drip(); const add=0.05; S.I+=add; const n=Math.min(S.pb,add/2); S.pb-=n; S.ppt+=n*461;
        const k=Math.round(n/0.025*70); for(let i=0;i<k;i++){ S.g.push({x:(Math.random()-0.5)*14,y:lvl-2-Math.random()*6,vx:(Math.random()-0.5)*50,vy:-(60+Math.random()*90),r:1.5,col:'#e0b21a',rest:false}); }
        S.cloud.push({y:lvl,a:n>0?1:0,r:6});
        // magnifier: two K⁺ and two I⁻ arrive
        if(n>1e-9||S.extra++<2){ const p=S.ions.find(q=>q.k==='Pb'&&q.slot===undefined&&S.ions.filter(z=>z.to===q).length<2); const sd=p&&S.ions.some(z=>z.to===p)?1:-1; S.ions.push({k:'K',x:640+Math.random()*80,y:80,vx:0,vy:30},{k:'I',x:650+Math.random()*60,y:80,vx:0,vy:40,to:p,side:sd}); }
        if(n<=1e-9) fbSet(fb,'warn','No new yellow — all the Pb²⁺ is used up.'); else fb.className='fb hidden';
        S.drop=null; } }
    /* swirl: the tube rocks about the clamp */
    if(S.swirl>0){ S.swirl-=dt; springTo(S.ang,Math.sin(t*9)*0.16,120,6,dt); } else springTo(S.ang,0,60,9,dt);
    const stir=S.swirl>0?1:0;
    if(stir&&S.sed>0.5){ const k=Math.min(40,Math.round(S.sed)); for(let i=0;i<k;i++) S.g.push({x:(Math.random()-0.5)*TW*0.7,y:6+S.sed*0.035+Math.random()*10,vx:0,vy:120+Math.random()*260,r:1.5,col:'#e0b21a',rest:false}); S.sed-=k; }
    // settle: vset positive = downward in local "height" space → use −y (height decreases)
    for(const g of S.g){ const tv=-(22+g.r*6); g.vy+=(tv-g.vy)*Math.min(1,2.5*dt)+(stir?(Math.random()-0.5)*1400*dt:0); g.vx+=((Math.random()-0.5)*30+(stir?(Math.random()-0.5)*1400:0))*dt; g.vx*=Math.exp(-2.5*dt);
      g.x+=g.vx*dt; g.y=Math.min(lvl-3,g.y+g.vy*dt); const hw=wallX(Math.max(0,g.y)); if(g.x<-hw){ g.x=-hw; g.vx=Math.abs(g.vx); } if(g.x>hw){ g.x=hw; g.vx=-Math.abs(g.vx); }
      const floor=3+S.sed*0.035; if(g.y<=floor){ g.rest=true; } }
    const before=S.g.length; S.g=S.g.filter(g=>!g.rest); S.sed+=before-S.g.length;
    S.cloud.forEach(c=>{ c.y-=40*dt; c.r+=26*dt; c.a-=0.45*dt; }); S.cloud=S.cloud.filter(c=>c.a>0);
    S.tint=approach(S.tint,Math.min(1,S.g.length/500),4,dt);
    /* magnifier ions — 1 Pb²⁺ = 0.05 mmol; a Pb²⁺ with its two I⁻ locks into the yellow solid */
    const LC={x:680,y:135}, LR=66;
    S.ions.forEach(i=>{
      if(i.slot!==undefined){ const sx=LC.x+(i.slot%2?26:-26), sy=LC.y+34-Math.floor(i.slot/2)*22, off=i.k==='Pb'?0:i.side*14; i.x=approach(i.x,sx+off,4,dt); i.y=approach(i.y,sy,4,dt); return; }
      if(i.to){ const dx=i.to.x+i.side*14-i.x, dy=i.to.y-i.y, d=Math.hypot(dx,dy)||1; i.vx+=dx/d*340*dt; i.vy+=dy/d*340*dt; if(d<8) i.arrived=true; }
      else { i.vx+=(Math.random()-0.5)*260*dt; i.vy+=(Math.random()-0.5)*260*dt; }
      i.vx*=Math.exp(-1.6*dt); i.vy*=Math.exp(-1.6*dt); i.x+=i.vx*dt; i.y+=i.vy*dt;
      const dx=i.x-LC.x, dy=i.y-LC.y, d=Math.hypot(dx,dy); if(d>LR-8){ i.x=LC.x+dx/d*(LR-8); i.y=LC.y+dy/d*(LR-8); i.vx*=-0.5; i.vy*=-0.5; } });
    S.ions.filter(p=>p.k==='Pb'&&p.slot===undefined).forEach(p=>{ const Is=S.ions.filter(q=>q.to===p); if(Is.length===2&&Is.every(q=>q.arrived)){ const k=S.units++; p.slot=k; Is.forEach(q=>q.slot=k); } });
    /* readouts */
    setMany($,{r1:String(S.drops), r2:fmt(S.ppt,1)+' mg', r3:fmt(S.pb/0.20*100,0)+' %'});
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BY+30);
    // stand: rod + clamp at the top of the tube
    line(ctx,120,BY+30,120,90,COL.ink,4); line(ctx,120,120,BX-TW/2-4,120,COL.ink,3.4);
    const piv={x:BX,y:BY-TH+30}, a=S.ang.x;
    const PW=rotPts(tubeLocal(TW,TH).map(([x,y])=>[x,y+TH-30]),piv.x,piv.y,a);
    const liq=fillLow(PW,S.V*ML);
    polyFill(ctx,liq.poly,S.tint>0.02?tint([['#f2cd2e',0.1+0.5*S.tint]]):'rgba(47,143,224,0.1)');
    // grains, cloud, sediment in tube-local frame
    ctx.save(); ctx.beginPath(); liq.poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.clip();
    ctx.translate(piv.x,piv.y); ctx.rotate(a); ctx.translate(0,TH-30); // now origin = bottom of tube, up = −y
    S.cloud.forEach(c=>{ if(c.a<=0) return; ctx.globalAlpha=c.a*0.7; ctx.fillStyle='#f2c318'; ctx.beginPath(); ctx.ellipse(0,-c.y,c.r*1.4,c.r,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });
    ctx.fillStyle='#d9a017'; S.g.forEach(g=>ctx.fillRect(g.x-1.4,-g.y-1.4,2.8,2.8));
    const sh=S.sed*0.035; if(sh>0.3){ ctx.fillStyle='#f7d44a'; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-TW/2,-Math.max(sh,1)); ctx.lineTo(TW/2,-Math.max(sh,1)); ctx.lineTo(TW/2,0); ctx.lineTo(-TW/2,0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.restore();
    if(liq.poly.length){ const s=surfLine(liq.poly,liq.L); if(s) line(ctx,s[0],liq.L,s[1],liq.L,COL.blue,2); }
    glassDraw(ctx,PW,3);
    ctx.save(); ctx.translate(piv.x,piv.y); ctx.rotate(a); rect(ctx,-TW/2-10,-10,TW+20,20,COL.ink,'#fff',2.4); ctx.restore();
    // dropper
    const dy=BY-TH-44; dropperDraw(ctx,BX+2,dy,clamp(S.sq.x/6,0,1),0.6,'rgba(47,143,224,0.18)');
    if(S.drop) dropDraw(ctx,S.drop,'rgba(210,230,250,0.9)');
    textAt(ctx,'KI',BX+30,dy-120,{size:15,weight:800,color:COL.yellow});
    textAt(ctx,'Pb(NO₃)₂',BX-TW/2-16,BY-90,{align:'right',size:14,weight:700,color:COL.blue});
    if(S.ppt>0&&S.swirl<=0&&Math.abs(a)<0.02) leader(ctx,BX+TW/2-8,BY-4-sh,BX+TW/2+50,BY-50,'PbI₂ ↓',COL.yellow,1);
    // magnifier with ions
    lens(ctx,680,135,78,BX+20,BY-lvl+40,'',()=>{
      for(let k=0;k<S.units;k++){ const sx=LC.x+(k%2?26:-26), sy=LC.y+34-Math.floor(k/2)*22; ctx.save(); rrect(ctx,sx-24,sy-10,48,20,9); ctx.fillStyle='rgba(247,212,74,0.55)'; ctx.fill(); ctx.restore(); }
      S.ions.forEach(i=>{ if(i.k==='Pb') ionDraw(ctx,i.x,i.y,10,2,{sym:'Pb'}); else if(i.k==='K') ionDraw(ctx,i.x,i.y,7,1,{sym:'K'}); else if(i.k==='I') ionDraw(ctx,i.x,i.y,8,-1,{sym:'I'}); else ionDraw(ctx,i.x,i.y,6,-1,{sym:'N'}); }); });
    textAt(ctx,'N = NO₃⁻',680,240,{align:'center',size:11,weight:600,color:COL.mid});
    if(S.drops>0) eqStrip(ctx,[{t:'Pb(NO₃)₂ + 2KI → '},{t:'PbI₂↓',col:'#b8860b'},{t:' + 2KNO₃'}],600,300,clamp(S.drops/2,0,1),14);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   1.3 ZINC + DILUTE ACID
   1.00 g zinc granules (15.3 mmol, 8 granules), 20 mL acid.
   Rate r = k·A·[H⁺]·e^(E/R·(1/298 − 1/T)), A ∝ Σ m^(2/3),
   k set so 1 M H⁺ gives 0.40 mmol H₂/min at the start (≈10 mL/min).
   Zn + 2H⁺ → Zn²⁺ + H₂, ΔH = −153.9 kJ/mol; flask + acid 184 J/K,
   loses 0.05 W/K → 1 M: ≈ +5 °C in 20 min ("the flask feels warm").
   Headspace (80 mL of air) is purged: x' = q(1 − x)/80 → the first soap
   bubbles hold mostly air and sink; H₂-rich ones float (film 2.8 mg,
   bubble 14 mL: lift = ρair·V − ρgas·V − film). Pop only if x > 4 %.
   Time runs ×40 (20 min ≈ 30 s). 24.5 mL per mmol of gas at 25 °C.
   ===================================================================== */
function buildA3(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=486, FX=240, FH=250, FB=105, KF=580, TR={x:600,rim:420,w:95}, TUBE_END={x:600,y:448};
  const SPEED=40;
  let acid='H2SO4', conc=1, t=0;
  const S={}; const seq=seqNew();
  const P=pourerNew(425,332,34,130,25);
  function reset(){ const r=rng(3); Object.assign(S,{poured:0, run:false, time:0, n:0, T:25, x:0, cork:spr(-160), corked:false, bub:[], soap:null, soapV:0, bubbles:[], flash:null, cand:sprP(690,300), candMode:'rest', candT:0, touch:spr(0), touching:false,
      zn:Array.from({length:8},(_,i)=>({x:FX-60+i*17+r()*6, m:0.125, seed:i*13+2, ang:r()*6}))});
    P.ml=20; P.p.x.x=P.rest.x; P.p.y.x=P.rest.y; P.a.x=0; P.T={x:P.rest.x,y:P.rest.y,a:0}; seq.q=[]; seq.cur=null; }
  side.innerHTML=`
    <div class="control-group"><label>Dilute acid</label><div class="toggle-group"><button class="toggle-btn active" data-a="H2SO4">H₂SO₄</button><button class="toggle-btn" data-a="HCl">HCl</button></div></div>
    <div class="control-group"><label>Strength <span class="val" id="cv">1.0 M</span></label><input type="range" id="conc" min="0.5" max="2" step="0.25" value="1"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="pour">▶ Pour acid on zinc</button><button class="toggle-btn" id="rs">↺ Start again</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="cand">🕯 Bring a burning candle</button><button class="toggle-btn" id="touch">✋ Touch the flask</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r0','Time (×40)',COL.ink)}${card('r1','H₂ given off',COL.green)}${card('r2','Flask',COL.red)}${card('r3','Zinc left',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-a]',b=>{ acid=b.dataset.a; reset(); });
  $('#conc').oninput=e=>{ conc=+e.target.value; $('#cv').textContent=conc.toFixed(2).replace(/0$/,'')+' M'; reset(); };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  $('#pour').onclick=()=>{ if(S.poured>0||seqBusy(seq)) return; pourQuick(seq,P,FX+FB*0.3+6,BENCH-FH-4,()=>{ S.corked=true; }); };
  $('#cand').onclick=()=>{ if(S.candMode==='rest') S.candMode='seek'; };
  $('#touch').onclick=()=>{ S.touching=!S.touching; setBtn($('#touch'),S.touching?'✋ Hand on the flask':'✋ Touch the flask',S.touching?'active':''); };
  reset();

  const Hplus=()=>conc*(acid==='H2SO4'?1.2:1);
  const hOfA=A=>{ const PW=rotPts(flaskLocal(FH,FB),FX,BENCH,0); return fillLow(PW,A); };
  animLoop(dt=>{
    t+=dt; seqStep(seq,dt); const Q=pourerStep(P,dt); S.poured+=Q;
    const vol=S.poured; const liq=hOfA(vol*KF); const lvl=liq.L;
    /* chemistry */
    const acidIn=S.poured>0.5, h0=20*Hplus(); // mmol H⁺ in 20 mL
    let rate=0;
    if(acidIn){ const Hleft=Math.max(0,h0*(S.poured/20)-2*S.n), cH=Hleft/Math.max(1,S.poured), A=S.zn.reduce((s,g)=>s+Math.pow(g.m/0.125,2/3),0)/8;
      rate=0.40/60*A*cH*Math.exp(4800*(1/298-1/(S.T+273))); // mmol per real second
      const dn=rate*dt*SPEED; S.n+=dn; S.time+=dt*SPEED;
      const tot=S.zn.reduce((s,g)=>s+Math.pow(g.m,2/3),0)||1; S.zn.forEach(g=>{ g.m=Math.max(0,g.m-dn*0.0654*Math.pow(g.m,2/3)/tot); });
      S.T+=(dn*153.9-0.05*(S.T-25)*dt*SPEED)/184;
      // headspace purge and gas out of the delivery tube
      const q=dn*24.5; if(S.corked){ S.x+=q*(1-S.x)/80; S.soapV+=q; }
      // bubbles on zinc
      const nb=clamp(rate*60*SPEED*0.6,0,60)*dt; S.bubAcc=(S.bubAcc||0)+nb; while(S.bubAcc>1){ S.bubAcc-=1; const g=S.zn[Math.floor(Math.random()*8)]; if(g.m>0.002) S.bub.push({x:g.x+(Math.random()-0.5)*10,y:BENCH-10,vy:-20,vx:0,r:1.5,ph:Math.random()*6}); }
      if(Math.random()<rate*SPEED*dt*30) fizzTick(); }
    bubbleStep(S.bub,dt,()=>lvl);
    /* soap bubble at the tube end: grows, detaches at 14 mL */
    if(!S.soap&&S.soapV>0) S.soap={V:0,x0:TUBE_END.x};
    if(S.soap){ const take=Math.min(S.soapV,Math.max(0,14-S.soap.V)); S.soap.V+=take; S.soapV-=take;
      if(S.soap.V>=13.999){ const x=S.x; const lift=14*1.184-14*(x*0.0824+(1-x)*1.184)-2.8; // mg
        S.bubbles.push({x:TUBE_END.x+(Math.random()<0.5?-1:1)*(28+Math.random()*30),y:TR.rim-22,vx:(Math.random()-0.5)*16,vy:-30,r:22,x2:x,lift,t:0}); S.soap=null; tink(1200,0.02,0.08); } }
    S.bubbles.forEach(b=>{ b.t+=dt; const vt=-b.lift*9; b.vy+=(vt-b.vy)*Math.min(1,1.5*dt); b.vx+=Math.sin(b.t*1.3+b.x)*6*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.y>TR.rim-20&&b.lift<0){ b.y=TR.rim-20; b.vy=0; b.sit=(b.sit||0)+dt; if(b.sit>2.5) b.gone=true; } if(b.y<-30) b.gone=true; });
    /* candle: seeks the highest-lift free bubble */
    const pick=S.bubbles.filter(b=>!b.gone).sort((a,b)=>a.y-b.y)[0];
    if(S.candMode==='seek'){ if(pick){ sprPStep(S.cand,pick.x+4,pick.y+46,dt,50,11); const d=Math.hypot(S.cand.x.x-pick.x-4,S.cand.y.x-pick.y-46);
        if(d<14){ pick.gone=true; if(pick.x2>0.04){ S.flash={x:pick.x,y:pick.y,a:1,s:clamp(pick.x2*1.5,0.3,1)}; popSound(); fbSet(fb,'ok','Pop! The gas burns — it is hydrogen.'); } else { fbSet(fb,'warn','No pop: that bubble held air pushed out of the flask.'); noiseBurst(0.05,0.08,1500,1); } S.candMode='back'; S.candT=1.2; } }
      else sprPStep(S.cand,TR.x+130,TR.rim-120,dt,40,10); }
    else if(S.candMode==='back'){ S.candT-=dt; sprPStep(S.cand,690,300,dt,30,10); if(S.candT<=0) S.candMode='rest'; }
    else sprPStep(S.cand,690,300,dt,30,10);
    if(S.flash){ S.flash.a-=dt*2.2; if(S.flash.a<=0) S.flash=null; }
    S.bubbles=S.bubbles.filter(b=>!b.gone);
    springTo(S.cork,S.corked?0:-160,90,14,dt); springTo(S.touch,S.touching?1:0,60,11,dt);
    /* readouts */
    const znLeft=S.zn.reduce((s,g)=>s+g.m,0);
    setMany($,{r0:mmss(S.time), r1:fmt(S.n*24.5,0)+' mL', r2:fmt(S.T,1)+' °C', r3:fmt(znLeft,2)+' g'});
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    const PW=rotPts(flaskLocal(FH,FB),FX,BENCH,0);
    if(liq.poly.length){ polyFill(ctx,liq.poly,S.n>0?tint([['#2f8fe0',0.08]]):'rgba(47,143,224,0.12)'); const s=surfLine(liq.poly,liq.L); if(s) line(ctx,s[0],liq.L,s[1],liq.L,COL.blue,2); }
    // zinc granules
    S.zn.forEach(g=>{ const k=Math.cbrt(g.m/0.125); if(k<0.05) return; ctx.save(); ctx.translate(g.x,BENCH-9*k-2); ctx.rotate(g.ang); ctx.beginPath();
      for(let i=0;i<7;i++){ const a=i/7*Math.PI*2, r=(9+3*Math.sin(i*2.3+g.seed))*k; i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*0.8):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r*0.8); } ctx.closePath();
      ctx.fillStyle='#e9edf2'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); });
    bubbleDraw(ctx,S.bub,COL.green);
    glassDraw(ctx,PW,3);
    // heat waves off the flask when warm
    const dT=S.T-25; if(dT>0.8) for(let k=0;k<3;k++) heatWave(ctx,FX-60+k*60,BENCH-FH*0.55,40,-Math.PI/2,COL.red,t+k,clamp(dT/8,0,0.9),3);
    // cork + delivery tube
    const cy=BENCH-FH+S.cork.x, nx=FB*0.3;
    rect(ctx,FX-nx-4,cy-22,2*nx+8,30,COL.ink,'#fff',2.4);
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(FX,cy+4); ctx.lineTo(FX,110+S.cork.x); ctx.lineTo(TUBE_END.x,110+S.cork.x); ctx.lineTo(TUBE_END.x,TUBE_END.y+S.cork.x); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.stroke(); ctx.restore();
    // gas travelling in the delivery tube
    if(S.corked&&rate>0){ const sp=(t*120)%40; ctx.save(); ctx.setLineDash([6,34]); ctx.lineDashOffset=-sp*(1+rate*SPEED*20); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(FX,cy); ctx.lineTo(FX,110); ctx.lineTo(TUBE_END.x,110); ctx.lineTo(TUBE_END.x,TUBE_END.y); ctx.stroke(); ctx.restore(); }
    // soap-solution trough
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.12)'; ctx.beginPath(); ctx.moveTo(TR.x-TR.w,TR.rim+12); ctx.lineTo(TR.x+TR.w,TR.rim+12); ctx.lineTo(TR.x+TR.w-8,BENCH-2); ctx.lineTo(TR.x-TR.w+8,BENCH-2); ctx.closePath(); ctx.fill(); ctx.restore();
    line(ctx,TR.x-TR.w,TR.rim+12,TR.x+TR.w,TR.rim+12,COL.blue,2);
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(TR.x-TR.w-6,TR.rim-4); ctx.lineTo(TR.x-TR.w+8,BENCH); ctx.lineTo(TR.x+TR.w-8,BENCH); ctx.lineTo(TR.x+TR.w+6,TR.rim-4); ctx.stroke(); ctx.restore();
    for(let k=0;k<6;k++) circ(ctx,TR.x-70+k*27,TR.rim+8,6+2*Math.sin(k*2+t),COL.mid,'rgba(255,255,255,0.8)',1.2);
    if(S.soap&&S.soap.V>0){ const r=6+16*Math.cbrt(S.soap.V/14); circ(ctx,TUBE_END.x,TR.rim+12-r*0.9,r,COL.green,'rgba(31,157,85,0.06)',1.8); }
    S.bubbles.forEach(b=>{ circ(ctx,b.x,b.y,b.r,b.x2>0.5?COL.green:COL.mid,'rgba(255,255,255,0.35)',2); ctx.save(); ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(b.x-6,b.y-7,7,3.6,4.6); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); });
    // pouring cylinder
    pourerDraw(ctx,P,lvl,'rgba(47,143,224,0.14)',COL.blue);
    // candle held on a stick
    const cx=S.cand.x.x, cyy=S.cand.y.x; line(ctx,cx+10,cyy+56,cx+74,cyy+96,COL.ink,4); handDraw(ctx,cx+84,cyy+102,Math.PI+0.55,0.8,0.8);
    candleDraw(ctx,cx,cyy+62,16,40,{lit:true,f:1,t,fh:32,fw:13,wickH:8});
    if(S.flash){ glow(ctx,S.flash.x,S.flash.y,110*S.flash.s,COL.yellow,S.flash.a); rayBurst(ctx,S.flash.x,S.flash.y,26,70*S.flash.s,14,COL.yellow,S.flash.a,t); textAt(ctx,'POP!',S.flash.x,S.flash.y-60,{align:'center',size:26,weight:800,color:COL.yellow,alpha:S.flash.a}); }
    // hand touching the flask
    if(S.touch.x>0.02){ const hx=lerp(-80,FX-FB-28,S.touch.x); handDraw(ctx,hx,BENCH-70,0,1,0.1); if(dT>1&&S.touch.x>0.9){ glow(ctx,hx+40,BENCH-70,40,COL.red,clamp(dT/10,0.1,0.7)); textAt(ctx,dT>12?'Hot!':'Warm',hx+30,BENCH-110,{align:'center',size:15,weight:800,color:COL.red}); } }
    // magnifier at the zinc surface
    if(S.poured>0.5){ const g=S.zn[3], LX=430, LY=190; lens(ctx,LX,LY,70,g.x,BENCH-12,'',()=>{ const ph=(t*0.8)%1;
        [-39,-13,39].forEach(dx=>atomDraw(ctx,LX+dx,LY+40,12,'Zn',COL.red));
        const e=ease(clamp(ph/0.6,0,1)), leave=ph>0.6; atomDraw(ctx,LX+13,LY+40-(leave?(ph-0.6)*150:0),12,leave?'Zn²⁺':'Zn',COL.red,leave?1-(ph-0.6)*2.2:1);
        if(!leave){ atomDraw(ctx,lerp(LX-60,LX+2,e),lerp(LY-40,LY+16,e),9,'H⁺',COL.blue); atomDraw(ctx,lerp(LX+60,LX+24,e),lerp(LY-40,LY+16,e),9,'H⁺',COL.blue); }
        else { const up=(ph-0.6)*260; bondDraw(ctx,LX+4,LY+16-up,LX+22,LY+16-up,COL.green); atomDraw(ctx,LX+4,LY+16-up,9,'H',COL.green); atomDraw(ctx,LX+22,LY+16-up,9,'H',COL.green); } }); }
    if(S.n>0.3) eqStrip(ctx,[{t:'Zn + '},{t:acid==='H2SO4'?'H₂SO₄ → ZnSO₄':'2HCl → ZnCl₂'},{t:' + H₂↑',col:COL.green}],400,40,clamp(S.n,0,1),15);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   1.4 QUICK LIME + WATER
   10 g CaO = 178 mmol; CaO + H₂O → Ca(OH)₂, ΔH = −65.2 kJ/mol
   (11.6 kJ in all; needs 3.2 g of water).
   Slaking rate ξ' = k·(1 − ξ)·min(1, w/0.3 g),
   k = 0.006 s⁻¹·exp(6000·(1/298 − 1/T)) — slow start, then runaway.
   Heat balance: C = 4.18·w + 0.9·m_solid + 60 J/K, loss 0.08 W/K;
   at 100 °C extra heat boils water off (2257 J/g → steam).
   Few mL of water → dry, crumbling powder hot enough to boil it away;
   lots of water → milky lime water that only gets to ≈ 85 °C.
   Time runs ×2.
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=486, BX=290, BW=190, BH=210, SPEED=2, KB=(BW-6)*6.2; // px² per mL in the beaker
  let want=10, t=0;
  const P=pourerNew(560,BENCH-150,40,150,32); const seq=seqNew();
  const S={};
  function reset(){ const r=rng(11); Object.assign(S,{poured:0, xi:0, w:0, T:25, time:0, steam:[], boiled:0, hiss:0, touch:spr(0), touching:false, recoil:0, crumbs:[],
      lumps:Array.from({length:7},(_,i)=>({x:BX-66+i*22+r()*6, y:BENCH-16-(i%2)*14, s:14+r()*6, seed:i*7+1, a:r()*6, split:false}))});
    P.ml=want; P.p.x.x=P.rest.x; P.p.y.x=P.rest.y; P.a.x=0; P.T={x:P.rest.x,y:P.rest.y,a:0}; seq.q=[]; seq.cur=null; }
  side.innerHTML=`
    <div class="control-group"><label>Water to add <span class="val" id="wv">10 mL</span></label><input type="range" id="wat" min="3" max="30" step="1" value="10"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="pour">▶ Add water slowly</button><button class="toggle-btn" id="rs">↺ Fresh quick lime</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="touch">✋ Touch the beaker</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r0','Time (×2)',COL.ink)}${card('r1','Temperature',COL.red)}${card('r2','CaO reacted',COL.green)}${card('r3','Water boiled off',COL.blue)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#wat').oninput=e=>{ want=+e.target.value; $('#wv').textContent=want+' mL'; reset(); fb.className='fb hidden'; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  $('#pour').onclick=()=>{ if(S.poured>0||seqBusy(seq)) return; pourQuick(seq,P,BX+BW/2+6,BENCH-BH-6,null); };
  $('#touch').onclick=()=>{ S.touching=!S.touching; setBtn($('#touch'),S.touching?'✋ Touching…':'✋ Touch the beaker',S.touching?'active':''); S.recoil=0; };
  reset();
  animLoop(dt=>{
    t+=dt; seqStep(seq,dt); const q=pourerStep(P,dt); S.poured+=q; S.w+=q; // 1 mL = 1 g
    /* chemistry + energy, sub-stepped for stiffness */
    let rate=0;
    if(S.w>0.01||S.xi>0){ const n=8, h=dt*SPEED/n; for(let i=0;i<n;i++){
        const k=0.006*Math.exp(6000*(1/298-1/(S.T+273))), avail=Math.min(1,S.w/0.3), dxi=k*(1-S.xi)*avail*h;
        const dmol=dxi*178; // mmol
        S.xi=Math.min(1,S.xi+dxi); S.w=Math.max(0,S.w-dmol*0.018);
        const C=4.18*S.w+0.9*(10+S.xi*3.2)+60; let E=dmol*65.2-0.08*(S.T-25)*h;
        let dT=E/C; if(S.T+dT>100&&S.w>0){ const ex=(S.T+dT-100)*C, boil=Math.min(S.w,ex/2257); S.w-=boil; S.boiled+=boil; dT=100-S.T+(ex-boil*2257)/C; }
        S.T+=dT; rate+=dmol/h/n; }
      S.time+=dt*SPEED; }
    S.hiss=approach(S.hiss,clamp(rate/4,0,1),6,dt); if(Math.random()<S.hiss*dt*30) noiseBurst(0.06,0.06*S.hiss,4200,0.6);
    /* lumps: swell, crack and crumble with the reacted fraction */
    S.lumps.forEach((L,i)=>{ const my=clamp(S.xi*1.35-i*0.04,0,1); L.r=my; if(my>0.55&&!L.split){ L.split=true; crackle(); for(let k=0;k<22;k++) S.crumbs.push({x:L.x+(Math.random()-0.5)*L.s,y:L.y-Math.random()*L.s,vx:(Math.random()-0.5)*60,vy:-Math.random()*80,rest:false,r:1.5+Math.random()*1.5}); } });
    S.crumbs.forEach(c=>{ if(c.rest) return; c.vy+=500*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=Math.exp(-3*dt); const floor=BENCH-4-pileH(c.x); if(c.y>floor){ c.y=floor; c.rest=true; } });
    /* steam */
    const lvlY=BENCH-Math.min(BH-10,(S.w+S.xi*6)*KB/(BW-6));
    const steamRate=(S.T>55?(S.T-55)/45:0)*4+(S.boiled>0?rate*0.8:0);
    if(Math.random()<steamRate*dt*3) plumeAdd(S.steam,BX+(Math.random()-0.5)*BW*0.6,lvlY-6,(Math.random()-0.5)*14,-90-Math.random()*50,4,'#b9c8d8',2.2);
    plumeStep(S.steam,dt,30);
    /* hand */
    const hot=S.T>48; if(S.touching&&hot&&S.touch.x>0.85&&S.recoil<=0){ S.recoil=1.6; tink(900,0.05,0.1); fbSet(fb,'bad','Too hot to hold — lots of heat is given out.'); }
    if(S.recoil>0) S.recoil-=dt;
    springTo(S.touch,S.touching&&S.recoil<=0?1:(S.recoil>0?0.25:0),S.recoil>0?160:60,S.recoil>0?9:11,dt);
    if(S.touching&&!hot&&S.touch.x>0.9) fbSet(fb,S.T>32?'warn':'ok',S.T>32?'The beaker is getting warm.':'Cool to touch.');
    setMany($,{r0:mmss(S.time), r1:fmt(S.T,0)+' °C', r2:fmt(S.xi*100,0)+' %', r3:fmt(S.boiled,1)+' g'});
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    const x0=BX-BW/2, x1=BX+BW/2;
    // liquid / slurry
    if(S.w>0.05){ const milky=clamp(S.xi*1.6,0,1)*clamp(S.w/6,0.2,1); ctx.save(); ctx.fillStyle=tint([['#2f8fe0',0.12*(1-milky)],['#dfe6ee',0.8*milky]]); ctx.fillRect(x0+3,lvlY,BW-6,BENCH-lvlY-3); ctx.restore(); line(ctx,x0+3,lvlY,x1-3,lvlY,COL.blue,2);
      if(S.T>=99.5&&rate>0.05) for(let k=0;k<6;k++){ const bx=x0+14+((k*37+t*90)%(BW-28)); circ(ctx,bx,lvlY+4+((t*60+k*9)%20),3+k%2,COL.blue,null,1.2); } }
    // powder pile of slaked lime
    ctx.save(); ctx.beginPath(); ctx.moveTo(x0+3,BENCH-3); for(let x=x0+3;x<=x1-3;x+=4) ctx.lineTo(x,BENCH-3-pileH(x)); ctx.lineTo(x1-3,BENCH-3); ctx.closePath(); ctx.fillStyle='#f6f8fa'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
    S.crumbs.forEach(c=>{ if(!c.rest) circ(ctx,c.x,c.y,c.r,COL.green,'#fff',1); });
    // lumps
    S.lumps.forEach(L=>{ const r=L.r||0; if(r>0.95) return; const sc=L.s*(1+0.5*r)*(L.split?1-(r-0.55)/0.4:1); if(sc<1) return; ctx.save(); ctx.translate(L.x,L.y-r*6); ctx.rotate(L.a); ctx.beginPath();
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2, rr=sc*(0.8+0.25*Math.sin(i*2.1+L.seed)); i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr*0.8):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr*0.8); } ctx.closePath();
      ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
      if(r>0.15){ ctx.strokeStyle=COL.red; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-sc*0.6,-sc*0.1); ctx.lineTo(0,sc*0.15*r); ctx.lineTo(sc*0.5,-sc*0.3); if(r>0.35){ ctx.moveTo(0,sc*0.15); ctx.lineTo(sc*0.1,sc*0.7); } ctx.stroke(); }
      ctx.restore(); });
    beakerDraw(ctx,BX,BENCH-BH,BENCH,BW,{grad:{n:5}});
    // thermometer in the beaker
    labThermo(ctx,x0+26,BENCH-BH-70,BENCH-40,S.T,0,110,{step:10,fs:9});
    plumeDraw(ctx,S.steam,0.3);
    for(let k=0;k<3;k++) heatWave(ctx,x0-20-k*14,BENCH-60-k*40,40,Math.PI,COL.red,t+k,clamp((S.T-30)/40,0,0.9),3);
    pourerDraw(ctx,P,lvlY,'rgba(47,143,224,0.14)',COL.blue);
    // hand
    if(S.touch.x>0.02){ const hx=lerp(-60,x0-66,S.touch.x); handDraw(ctx,hx,BENCH-80,0,1.1,0.1); if(S.T>32&&S.touch.x>0.2){ glow(ctx,hx+44,BENCH-80,50,COL.red,clamp((S.T-30)/50,0.1,0.8)); if(S.recoil>0) textAt(ctx,'Ouch — hot!',Math.max(90,hx+40),BENCH-130,{align:'center',size:17,weight:800,color:COL.red}); } }
    // magnifier
    if(S.xi>0.01){ lens(ctx,640,120,76,BX-20,BENCH-30,'',()=>{ const ph=(t*0.7)%1, e=ease(clamp(ph*1.6,0,1));
        atomDraw(ctx,610,150,15,'Ca',COL.ink); atomDraw(ctx,640,150,12,'O',COL.ink); bondDraw(ctx,625,150,628,150,COL.ink);
        const wx=lerp(700,655,e), wy=lerp(70,125,e); atomDraw(ctx,wx,wy,11,'O',COL.blue); atomDraw(ctx,wx-15,wy-12,8,'H',COL.blue); atomDraw(ctx,wx+15,wy-12,8,'H',COL.blue);
        if(ph>0.62){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(632,138,58,34,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); textAt(ctx,'Ca(OH)₂',640,190,{align:'center',size:13,weight:800,color:COL.green}); } });
      eqStrip(ctx,[{t:'CaO + H₂O → '},{t:'Ca(OH)₂',col:COL.green},{t:' + Heat',col:COL.red}],600,250,clamp(S.xi*5,0,1),14); }
    ctx.restore();
  });
  function pileH(x){ const n=S.crumbs.length; if(!n) return 0; const x0=BX-BW/2+3, x1=BX+BW/2-3; const hmax=Math.min(40,S.xi*28+2); const u=(x-x0)/(x1-x0); return hmax*Math.pow(Math.sin(Math.PI*clamp(u,0,1)),0.5)*clamp(n/150,0,1); }
  return wrap;
}

/* =====================================================================
   1.5 HEATING FERROUS SULPHATE  ·  1.6 HEATING LEAD NITRATE
   (one heating rig, two samples). Time runs ×20.
   Heated end of the tube + 2 g sample: C = 8 J/K; flame delivers
   35 W × flame setting; loss 0.04 W/K (80 % flame alone → ≈ 725 °C;
   water is gone by ≈ 3 min, brown by ≈ 8 min — as in class).
   Each step runs at k·(1 − x)·σ((T − Tc)/w) and absorbs its heat, so the
   temperature stalls while it happens (a real heating-curve plateau).
   FeSO₄·7H₂O  2 g = 7.19 mmol
     water off  Tc 110 °C, w 15, k 0.03 s⁻¹, 58 kJ per mol H₂O (0.906 g)
     2FeSO₄ → Fe₂O₃ + SO₂ + SO₃   Tc 520 °C, w 20, k 0.02 s⁻¹, +300 kJ/mol
     → 0.574 g of Fe₂O₃ left; 88 mL SO₂ + 88 mL SO₃
   Pb(NO₃)₂  2 g = 6.04 mmol; crackles (decrepitates) from ≈ 250 °C
     2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂   Tc 450 °C, w 20, k 0.02 s⁻¹, +299 kJ/mol
     → 1.348 g PbO (orange-brown hot, yellow cold), 296 mL NO₂, 74 mL O₂
     NO₂ (1.9 g/L) is heavier than air: the brown fumes spill and sink.
   ===================================================================== */
function buildHeat(kind){
  const FE=kind==='fe';
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=500, BUR={x:250}, TW=58, TH=290, ANG=0.9, SPEED=20;
  let power=0.8, on=false, t=0;
  const S={};
  function reset(){ Object.assign(S,{T:25, x1:0, x2:0, time:0, fum:[], drops:[], jump:[], c:0, waft:spr(0), wafting:false, splint:spr(0), splintOn:false, relit:0, smell:0, bob:0}); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Flame <span class="val" id="pv">80 %</span></label><input type="range" id="pw" min="0.3" max="1" step="0.05" value="0.8">
      <div class="toggle-group"><button class="toggle-btn play" id="on">🔥 Start heating</button><button class="toggle-btn" id="rs">↺ Fresh sample</button></div></div>
    <div class="control-group"><label>Test the gas</label><div class="toggle-group">${FE?'<button class="toggle-btn" id="waft">👃 Waft the smell</button>':'<button class="toggle-btn" id="spl">🪵 Glowing splint</button>'}</div></div>
    <div class="control-group"><div class="result-cards">${card('r0','Time (×20)',COL.ink)}${card('r1','Sample',COL.red)}${card('r2','Solid left',COL.ink)}${card('r3',FE?'Water given off':'NO₂ given off',FE?COL.blue:COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#pw').oninput=e=>{ power=+e.target.value; $('#pv').textContent=Math.round(power*100)+' %'; };
  $('#on').onclick=()=>{ on=!on; setBtn($('#on'),on?'■ Stop heating':'🔥 Start heating',on?'active':'play'); };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  if(FE) $('#waft').onclick=()=>{ S.wafting=!S.wafting; setBtn($('#waft'),S.wafting?'👃 Wafting…':'👃 Waft the smell',S.wafting?'active':''); };
  else $('#spl').onclick=()=>{ S.splintOn=!S.splintOn; S.relit=0; setBtn($('#spl'),S.splintOn?'🪵 Splint at the mouth':'🪵 Glowing splint',S.splintOn?'active':''); };
  const sig=z=>1/(1+Math.exp(-z));
  animLoop(dt=>{
    t+=dt;
    /* heating with reaction heat sinks (sub-stepped) */
    let r1=0,r2=0; const n=10, hs=dt*SPEED/n;
    for(let i=0;i<n;i++){ const P=(on?35*power:0)-0.04*(S.T-25);
      let a=0,b=0,E=0;
      if(FE){ a=0.03*(1-S.x1)*sig((S.T-110)/15); b=0.02*(1-S.x2)*sig((S.T-520)/20)*(S.x1>0.9?1:0.2); E=a*50.4*58+b*3.6*300; } // J/s
      else { b=0.02*(1-S.x2)*sig((S.T-450)/20); E=b*3.02*598; }

/* =====================================================================
   1.8 SILVER CHLORIDE IN SUNLIGHT
   The powder surface is a 90 × 46 grid. Each cell darkens by
   D' = k·I·(1 − D): k = 0.0015 s⁻¹ for AgCl, 0.003 s⁻¹ for AgBr in full
   sun (AgCl turns clearly grey in ≈ 10 min). Only the top layer sees
   light: stirring mixes it with fresh white powder from below
   (D → 0.35·D, smeared). A paper cut-out stops the light — lift it and
   its white shadow is left on the grey (the idea behind black-and-white
   photography). 2AgCl → 2Ag + Cl₂. Time runs ×60.
   ===================================================================== */
function buildA8(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const NX=90, NY=46, DX=360, DY=410, RW=210, RH=62, SUN={x:110,y:90}, SPEED=60;
  let I=1, salt='AgCl', maskOn=false, t=0;
  const off=document.createElement('canvas'); off.width=NX; off.height=NY; const octx=off.getContext('2d'); const img=octx.createImageData(NX,NY);
  const S={D:new Float32Array(NX*NY), time:0, mask:spr(0), stir:0, rod:spr(0), cl:[], rays:0, cloud:spr(0)};
  side.innerHTML=`
    <div class="control-group"><label>Salt</label><div class="toggle-group"><button class="toggle-btn active" data-s="AgCl">Silver chloride</button><button class="toggle-btn" data-s="AgBr">Silver bromide</button></div></div>
    <div class="control-group"><label>Sunlight <span class="val" id="iv">100 %</span></label><input type="range" id="is" min="0" max="1" step="0.05" value="1"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="mk">🔑 Lay a paper key on it</button><button class="toggle-btn" id="st">🥢 Stir the powder</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="rs">↺ Fresh powder</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r0','Time (×60)',COL.ink)}${card('r1','Sunlight',COL.yellow)}${card('r2','Greyness',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-s]',b=>{ salt=b.dataset.s; reset(); });
  $('#is').oninput=e=>{ I=+e.target.value; $('#iv').textContent=Math.round(I*100)+' %'; };
  $('#mk').onclick=()=>{ maskOn=!maskOn; setBtn($('#mk'),maskOn?'🔑 Lift the paper key':'🔑 Lay a paper key on it',maskOn?'active':''); if(!maskOn&&S.time>60) fbSet(fb,'ok','White where the paper was — no light, no change.'); };
  $('#st').onclick=()=>{ if(S.stir<=0){ S.stir=1.6; } };
  $('#rs').onclick=reset;
  function reset(){ S.D.fill(0); S.time=0; fb.className='fb hidden'; }
  const inKey=(u,v)=>{ // u,v in −1..1 over the powder surface
    const hx=-0.42, r=Math.hypot((u-hx)/0.9,v); if(r<0.36&&r>0.14) return true;
    if(u>-0.1&&u<0.62&&Math.abs(v)<0.12) return true; if(u>0.36&&u<0.46&&v>0&&v<0.36) return true; if(u>0.52&&u<0.62&&v>0&&v<0.3) return true; return false; };
  animLoop(dt=>{
    t+=dt; springTo(S.cloud,1-I,20,8,dt); springTo(S.mask,maskOn?1:0,40,10,dt); S.time+=dt*SPEED;
    const k=(salt==='AgCl'?0.0015:0.003)*I*dt*SPEED; let sum=0;
    for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const u=(i+0.5)/NX*2-1, v=(j+0.5)/NY*2-1; if(u*u+v*v>1) continue; const id=j*NX+i;
      const shade=S.mask.x>0.95&&inKey(u,v)?0:1; S.D[id]+=k*shade*(1-S.D[id]); sum+=S.D[id]; }
    const mean=sum/(NX*NY*Math.PI/4);
    // stirring: a rod sweeps round; the grey top layer is mixed with white powder from below
    if(S.stir>0){ S.stir-=dt; if(Math.floor(S.stir*6)!==Math.floor((S.stir+dt)*6)){ const c=new Float32Array(S.D); for(let j=1;j<NY-1;j++) for(let i=1;i<NX-1;i++){ const id=j*NX+i; S.D[id]=0.88*(0.6*c[id]+0.1*(c[id-1]+c[id+1]+c[id-NX]+c[id+NX])); } stirTick(); } }
    springTo(S.rod,S.stir>0?1:0,50,10,dt);
    if(I>0.05&&mean<0.98&&Math.random()<I*dt*4*(1-mean)) plumeAdd(S.cl,DX+(Math.random()-0.5)*RW*1.4,DY-10,(Math.random()-0.5)*10,-30,4,'#9ccf6a',2.5);
    plumeStep(S.cl,dt,10);
    setMany($,{r0:mmss(S.time), r1:Math.round(I*100)+' %', r2:fmt(mean*100,0)+' %'});
    /* ---- paint the surface grid ---- */
    const c0=salt==='AgCl'?[252,252,252]:[246,238,196], c1=salt==='AgCl'?[104,96,116]:[96,92,80];
    for(let id=0;id<NX*NY;id++){ const d=S.D[id]; img.data[id*4]=lerp(c0[0],c1[0],d); img.data[id*4+1]=lerp(c0[1],c1[1],d); img.data[id*4+2]=lerp(c0[2],c1[2],d); img.data[id*4+3]=255; }
    octx.putImageData(img,0,0);
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,500);

    sunDraw(ctx,SUN.x,SUN.y,34,t,1);
    if(S.cloud.x>0.03){ ctx.save(); ctx.globalAlpha=clamp(S.cloud.x*1.2,0,1); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.mid; ctx.lineWidth=2.4; ctx.beginPath(); const cx=SUN.x+lerp(140,10,S.cloud.x), cy=SUN.y+10;
      [[0,0,34],[34,-12,30],[64,4,26],[-30,6,24]].forEach(([a,b,r])=>{ ctx.moveTo(cx+a+r,cy+b); ctx.arc(cx+a,cy+b,r,0,Math.PI*2); }); ctx.fill(); ctx.stroke(); ctx.restore(); }
    for(let k=0;k<7;k++){ const tx=DX-RW*0.8+k*RW*0.27, ty=DY-8; const sx=SUN.x+30+k*8, sy=SUN.y+26;
      ctx.save(); ctx.globalAlpha=clamp(I,0,1); ctx.lineDashOffset=-t*60; line(ctx,sx,sy,tx,ty,COL.yellow,2.2,[12,10]); ctx.restore(); }
    // dish + powder surface
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(DX,DY,RW+34,RH+14,0,0,Math.PI); ctx.lineTo(DX-RW-34,DY); ctx.fill();
    ctx.beginPath(); ctx.moveTo(DX-RW-34,DY); ctx.quadraticCurveTo(DX-RW,DY+RH+60,DX,DY+RH+64); ctx.quadraticCurveTo(DX+RW,DY+RH+60,DX+RW+34,DY); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.ellipse(DX,DY,RW,RH,0,0,Math.PI*2); ctx.clip(); ctx.imageSmoothingEnabled=true; ctx.drawImage(off,DX-RW,DY-RH,RW*2,RH*2); ctx.restore();
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.ellipse(DX,DY,RW+34,RH+14,0,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.ellipse(DX,DY,RW,RH,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    // paper key: drops onto the powder / lifts off
    if(S.mask.x>0.01){ const lift=(1-S.mask.x)*160; ctx.save(); ctx.globalAlpha=clamp(S.mask.x*1.5,0,1); ctx.translate(DX,DY-lift); ctx.scale(RW,RH);
        ctx.beginPath(); ctx.ellipse(-0.42,0,0.36*0.9,0.36,0,0,Math.PI*2); ctx.ellipse(-0.42,0,0.14*0.9,0.14,0,0,Math.PI*2,true); ctx.rect(-0.1,-0.12,0.72,0.24); ctx.rect(0.36,0,0.1,0.36); ctx.rect(0.52,0,0.1,0.3);
        ctx.restore(); ctx.save(); ctx.globalAlpha=clamp(S.mask.x*1.5,0,1); ctx.fillStyle='#fffef6'; ctx.fill('evenodd'); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
    // stirring rod
    if(S.rod.x>0.02){ const a=t*6, rx=DX+Math.cos(a)*RW*0.55, ry=DY+Math.sin(a)*RH*0.55; glassRod(ctx,rx,ry,rx+60,ry-200*S.rod.x); }
    plumeDraw(ctx,S.cl,0.5);
    // magnifier on a few grains
    lens(ctx,660,150,82,DX+60,DY,'',()=>{ const r=rng(9); for(let g=0;g<6;g++){ const gx=610+(g%3)*50, gy=120+Math.floor(g/3)*60, s=18;
        ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.fillStyle=salt==='AgCl'?'#fff':'#f7f1d0'; ctx.beginPath(); ctx.rect(gx-s,gy-s,2*s,2*s); ctx.fill(); ctx.stroke(); ctx.restore();
        const nd=Math.round(mean*26); for(let k=0;k<nd;k++){ circ(ctx,gx-s+4+r()*(2*s-8),gy-s+4+r()*(2*s-8),2.1,COL.ink,COL.ink,1); } }
      if(I>0.05&&mean<0.98){ for(let k=0;k<3;k++){ const u=(t*0.4+k/3)%1; atomDraw(ctx,630+k*30,200-u*120,8,'Cl',COL.green,1-u); atomDraw(ctx,646+k*30,200-u*120,8,'Cl',COL.green,1-u); } } });
    textAt(ctx,'Ag',660,258,{align:'center',size:12,weight:700,color:COL.ink,alpha:clamp(mean*6,0,1)});
    eqStrip(ctx,[{t:salt==='AgCl'?'2AgCl':'2AgBr'},{t:' → '},{t:'2Ag',col:COL.ink},{t:' + '},{t:salt==='AgCl'?'Cl₂':'Br₂',col:COL.green}],440,40,clamp(mean*5,0,1),15);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   1.9 IRON NAILS IN COPPER SULPHATE
   Tubes A and B: 10 mL of 0.1 M CuSO₄ (1.0 mmol Cu²⁺).
   Two nails (Ø 3 mm, 4.5 cm wetted) → A = 8.5 cm²; mass transfer
   kₘ = 5×10⁻⁴ cm/s → c' = −(kₘA/V)·c → after 20 min 60 % of the Cu²⁺
   is left: the blue clearly fades and 25 mg of copper coats the nails.
   Fe + CuSO₄ → FeSO₄ (pale green) + Cu. Zinc works faster (×1.3,
   ZnSO₄ colourless); copper in copper sulphate does nothing.
   Blue seen = 1 − e^(−c/0.08 M). Time runs ×60.
   ===================================================================== */
function buildA9(){

  let metal='Fe', t=0;

  reset();
  side.innerHTML=`
    <div class="control-group"><label>Metal dipped in tube B</label><div class="toggle-group"><button class="toggle-btn active" data-m="Fe">Iron nails</button><button class="toggle-btn" data-m="Zn">Zinc</button><button class="toggle-btn" data-m="Cu">Copper</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="dip">⬇ Dip into tube B</button><button class="toggle-btn" id="rs">↺ Start again</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r0','Time (×60)',COL.ink)}${card('r1','Cu²⁺ left in B',COL.blue)}${card('r2','Cu on metal',COL.red)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-m]',b=>{ metal=b.dataset.m; reset(); setBtn($('#dip'),'⬇ Dip into tube B','play'); fb.className='fb hidden'; });
  $('#dip').onclick=()=>{ if(!S.inB&&!S.out){ S.inB=true; setBtn($('#dip'),'⬆ Take them out','active'); } else if(S.inB){ S.inB=false; S.out=true; setBtn($('#dip'),'Compare ✓','');

    else if(S.out){ springTo(S.x,640,30,9,dt); springTo(S.y,S.x.x>600?300:-120,30,9,dt); }
    else { springTo(S.x,TB,40,10,dt); springTo(S.y,-60,40,10,dt); }

    if(wetted&&M.k>0){ const k=5e-4*8.5/10*M.k*clamp((S.y.x-190)/30,0,1); const dc=S.c*k*dt*SPEED; S.c-=dc; if(Math.random()<dt*2) fizzTick(); }
    const dep=(0.1-S.c)*10*63.5; // mg of copper
    const cov=1-Math.exp(-dep/4);
    setMany($,{r0:mmss(S.time), r1:fmt(S.c/0.1*100,0)+' %', r2:fmt(dep,1)+' mg'});
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    // stand
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,110,300,370,16,4); ctx.fill(); ctx.stroke(); line(ctx,124,316,124,BENCH,COL.ink,3); line(ctx,466,316,466,BENCH,COL.ink,3); ctx.restore();
    const blue=c=>1-Math.exp(-c/0.08);
    [[TA,0.1,'A'],[TB,S.c,'B']].forEach(([x,c,lab],i)=>{ const PW=tubeAt(TW,TH,x,TBOT,0), liq=fillLow(PW,tubeArea(TW,LIQ));

      glassDraw(ctx,PW,3); textAt(ctx,lab,x,TBOT+34,{align:'center',size:20,weight:800,color:COL.ink}); });
    // flakes of copper that drop off
    if(wetted&&metal!=='Cu'&&dep>3&&Math.random()<dt*0.8) S.flakes.push({x:S.x.x+(Math.random()-0.5)*20,y:S.y.x+120,vy:0});
    S.flakes.forEach(f=>{ f.vy=approach(f.vy,26,3,dt); f.y=Math.min(TBOT-6,f.y+f.vy*dt); }); ctx.save(); ctx.fillStyle=M.coat; S.flakes.forEach(f=>ctx.fillRect(f.x-2,f.y-1,4,2)); ctx.restore();

    const hx=S.x.x, hy=S.y.x; line(ctx,hx,hy-200,hx,hy,COL.ink,1.4); handDraw(ctx,hx-8,hy-202,-Math.PI/2,0.8,0.8);

    const wetFrac=0.8;

    textAt(ctx,'kept aside',575,BENCH+22,{align:'center',size:12,weight:600,color:COL.muted});
    // magnifier at the metal surface
    if(S.inB&&S.y.x>150){ lens(ctx,650,150,84,hx+10,hy+110,'',()=>{ const ph=(t*0.55)%1, e=ease(clamp(ph*1.5,0,1)); const sym=metal==='Zn'?'Zn':metal==='Cu'?'Cu':'Fe';
        for(let k=0;k<5;k++) atomDraw(ctx,606,94+k*28,13,sym,metal==='Cu'?'#b45309':COL.ink);
        if(metal!=='Cu'&&wetted){ const out=ph>0.66; atomDraw(ctx,606+(out?(ph-0.66)*230:0),150,13,out?sym+'²⁺':sym,COL.red,out?1-(ph-0.66)*2.4:1);

          for(let q=0;q<2;q++){ const u=clamp((ph-0.3)*3-q*0.3,0,1); if(u>0&&u<1) circ(ctx,lerp(612,628,u),150-8+q*16,2.6,COL.yellow,COL.yellow,1); } }

/* =====================================================================

   Tube A: 3 mL of 0.1 M Na₂SO₄ (0.30 mmol SO₄²⁻); tube B: 3 mL of 0.1 M

function buildA10(){

  let solA='Na2SO4', t=0;

  const seq=seqNew();

/* =====================================================================
   1.11 HEATING COPPER POWDER (and passing hydrogen over it)
   1 g Cu powder = 15.7 mmol, drawn as ≈ 260 grains. Only grains at the
   surface touch the air. Dish + gauze: C = 25 J/K, burner 60 W × flame,
   loss 0.12 W/K (→ ≈ 500 °C). Each exposed grain oxidises
   o' = 90·e^(−7000/T)·(1 − o)/(0.02 + o) s⁻¹ (film slows itself, the
   parabolic law), so the top goes black while the inside stays brown.
   Stirring brings fresh copper up. Mass: 2Cu + O₂ → 2CuO, +25.2 % per
   grain oxidised. With H₂ in a hard-glass tube above ≈ 250 °C:
   o' = −5·e^(−4500/T)·o·h(x), h falls along the bed as H₂ is used up;
   CuO + H₂ → Cu + H₂O — water condenses at the cool end. Time ×20.
   ===================================================================== */
function buildA11(){

      const half=y>DISH.rim?bowlHalfW(DISH.w,DISH.d,DISH.rim,y)-GR-2:(DISH.w-10)*Math.sqrt(Math.max(0,1-((DISH.rim-y)/28)**2));
      for(let x=DISH.x-half+(row%2)*sp/2; x<=DISH.x+half; x+=sp) P.push([x,y]); } return P; }
  function bedSlots(){ const P=[]; const sp=GR*1.9; for(let r=0;r<7;r++){ const y=292-r*sp*0.87; for(let x=236+(r%2)*sp/2;x<=464;x+=sp) P.push([x,y]); } return P; }

      Object.assign(S,{T:25, time:0, g:idx.map((k,i)=>({slot:k, x:spr(HS[k][0]), y:spr(HS[k][1]), o:0, bed:i, hs:i, ph:r()*6})), stir:0, drops:[], water:0, flow:0, flame:0});
      S.hSlots=idx.map(k=>HS[k]); mode='air'; h2=false; syncBtns(); }

      <div class="toggle-group"><button class="toggle-btn play" id="on">🔥 Start heating</button><button class="toggle-btn" id="st">🥄 Stir</button></div>

      if(mode==='air'){ atomDraw(ctx,lx-22,ly+22,15,'Cu',on&&S.T>200?COL.red:'#b45309'); atomDraw(ctx,lx+22,ly+22,15,'Cu',on&&S.T>200?COL.red:'#b45309');
        if(on&&S.T>200){ atomDraw(ctx,lx-22,lerp(ly-50,ly-8,e),11,'O',COL.green); atomDraw(ctx,lx+22,lerp(ly-50,ly-8,e),11,'O',COL.green); if(ph<0.4) bondDraw(ctx,lx-11,ly-50,lx+11,ly-50,COL.green); } }
      else { atomDraw(ctx,lx-10,ly+20,15,'Cu',S.flow>0.05&&S.T>250?COL.blue:'#1c1c1c'); const go=S.flow>0.05&&S.T>250;
        atomDraw(ctx,lx+18,ly+go*(-e*50)+20,11,'O',COL.red); if(go){ atomDraw(ctx,lerp(lx+60,lx+4,e),lerp(ly-50,ly+go*(-e*50)+12,e),8,'H',COL.red); atomDraw(ctx,lerp(lx+70,lx+32,e),lerp(ly-40,ly+go*(-e*50)+12,e),8,'H',COL.red); } } });
    if(mode==='air') textAt(ctx,'Cu oxidised',lx,ly+R+22,{align:'center',size:12,weight:700,color:COL.red,alpha:on&&S.T>200?1:0});
    else { textAt(ctx,'CuO reduced',lx-40,ly+R+22,{align:'center',size:12,weight:700,color:COL.blue,alpha:S.flow>0.05&&S.T>250?1:0}); textAt(ctx,'H₂ oxidised',lx+44,ly+R+22,{align:'center',size:12,weight:700,color:COL.red,alpha:S.flow>0.05&&S.T>250?1:0}); }
    if(mode==='air') eqStrip(ctx,[{t:'2Cu + O₂ → '},{t:'2CuO',col:COL.red}],330,60,clamp(ox*10,0,1),16);
    else eqStrip(ctx,[{t:'CuO',col:COL.blue},{t:' + '},{t:'H₂',col:COL.red},{t:' → Cu + '},{t:'H₂O',col:COL.blue}],300,90,clamp(S.drops.length/3,0,1),16);
    ctx.restore();
  });
  return wrap;
}

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
const activities = [
  { num:'1.1', title:'Burning Magnesium', desc:'Clean the ribbon, hold it in the flame, catch the ash', build: buildA1 },
  { num:'1.2', title:'Lead Nitrate + KI', desc:'Drop potassium iodide into lead nitrate solution', build: buildA2 },
  { num:'1.3', title:'Zinc + Dilute Acid', desc:'Acid on zinc granules — bubbles, warmth, a pop', build: buildA3 },
  { num:'1.4', title:'Quick Lime + Water', desc:'Add water to calcium oxide and touch the beaker', build: buildA4 },
  { num:'1.5', title:'Heating Ferrous Sulphate', desc:'Heat green crystals in a dry boiling tube', build: ()=>buildHeat('fe') },
  { num:'1.6', title:'Heating Lead Nitrate', desc:'Heat lead nitrate powder — watch the fumes', build: ()=>buildHeat('pb') },
  { num:'1.7', title:'Electrolysis of Water', desc:'Pass current through water — collect both gases', build: buildA7 },
  { num:'1.8', title:'Silver Chloride in Sunlight', desc:'Leave white silver chloride in the Sun', build: buildA8 },
  { num:'1.9', title:'Iron Nails in CuSO₄', desc:'Dip iron nails in copper sulphate for 20 minutes', build: buildA9 },
  { num:'1.10', title:'Sodium Sulphate + BaCl₂', desc:'Mix two clear solutions', build: buildA10 },
  { num:'1.11', title:'Heating Copper Powder', desc:'Heat copper in air, then pass hydrogen over it', build: buildA11 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
