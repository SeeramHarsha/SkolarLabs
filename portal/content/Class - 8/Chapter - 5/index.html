<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 · Chapter 5 — Exploring Forces | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">🧲</div>
    <div>
      <div class="chip">Grade 8 · Ch 5</div>
      <h1>Exploring Forces</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>Your force · what you change</span>
      <span><i style="background:var(--f-red)"></i>Weight · + charge</span>
      <span><i style="background:var(--f-blue)"></i>Friction · upthrust · − charge</span>
      <span><i style="background:var(--f-green)"></i>Motion</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">5.1</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 5: EXPLORING FORCES
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET or an initial condition; the drawn object is moved by the real
   equation of motion (friction deceleration, spring-damper, projectile,
   Coulomb / magnetic / buoyant force) every frame — never an instant jump.
   g is taken as 10 N/kg, as in the textbook (1 kg ↔ 10 N).
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-5 HELPERS — people, boxes, springs, balances (line diagrams)
   --------------------------------------------------------------------- */
const G = 10;                       // N/kg — textbook value
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function sgn(x){ return x>0?1:x<0?-1:0; }

/* labelled force arrow; skipped when tiny */
function force(ctx,x,y,dx,dy,col,label,side){
  const L=Math.hypot(dx,dy); if(L<4) return;
  vec(ctx,x,y,x+dx,y+dy,col,3);
  if(label && side==='b'){ textAt(ctx,label,x+dx/2,y+dy+18,{size:12,weight:700,color:col,align:'center'}); return; }
  if(label){ const ox=side==='l'?-8:8; textAt(ctx,label,x+dx+(Math.abs(dx)>Math.abs(dy)?0:ox),y+dy+(Math.abs(dx)>Math.abs(dy)?-9:(dy>0?14:-4)),{size:12,weight:700,color:col,align:Math.abs(dx)>Math.abs(dy)?'center':(side==='l'?'right':'left')}); }
}
function ground(ctx,x0,x1,y){
  line(ctx,x0,y,x1,y,COL.ink,2.4);
  ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.beginPath();
  for(let x=x0+8;x<x1;x+=14){ ctx.moveTo(x,y+2); ctx.lineTo(x-8,y+10); } ctx.stroke(); ctx.restore();
}
/* two-bone inverse kinematics → joint + reachable end */
function ik2(sx,sy,tx,ty,l1,l2,bend){
  const dx=tx-sx, dy=ty-sy, d0=Math.max(1e-6,Math.hypot(dx,dy)), d=Math.min(d0,l1+l2-0.01);
  const ux=dx/d0, uy=dy/d0, a=(l1*l1-l2*l2+d*d)/(2*d), hh=Math.sqrt(Math.max(0,l1*l1-a*a));
  return {jx:sx+ux*a-uy*hh*bend, jy:sy+uy*a+ux*hh*bend, ex:sx+ux*d, ey:sy+uy*d};
}
/* Stick figure.
   P = {x: hip x, g: ground y, H: height px, face: ±1, lean: rad (+ forward), crouch 0..1,
        phase: walk phase, stride 0..1, hands:[{x,y},{x,y}] | null, feet:[x,x] | null, jit} */
function person(ctx,P){
  const H=P.H, f=P.face||1, lwd=clamp(H*0.024,1.8,4.2);
  const th=0.25*H, sh=0.24*H, tor=0.29*H, hr=0.068*H, ua=0.165*H, fa=0.16*H;
  const ph=P.phase||0, st=P.stride||0, cr=P.crouch||0, jit=P.jit||0;
  const bob=st*Math.abs(Math.sin(ph))*0.018*H;
  const hx=P.x+jit, hy=P.hipY!==undefined?P.hipY:P.g-(th+sh)*(1-0.42*cr)-bob+(st>0?0.01*H*st:0);
  const lean=P.lean||0;
  const shx=hx+f*Math.sin(lean)*tor, shy=hy-Math.cos(lean)*tor;
  const nx=shx+f*Math.sin(lean)*(hr+0.03*H), ny=shy-Math.cos(lean)*(hr+0.03*H);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  const limb=(ax,ay,bx,by,cx,cy,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=lwd; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx,cy); ctx.stroke(); };
  // legs (far leg drawn lighter)
  for(let i=1;i>=0;i--){
    const p=ph+i*Math.PI;
    let fx, fy=P.g;
    if(P.feetXY){ fx=P.feetXY[i][0]; fy=P.feetXY[i][1]; }
    else if(P.feet){ fx=P.feet[i]; }
    else { fx=hx+f*st*0.17*H*Math.sin(p)+(st?0:(i?-1:1)*0.05*H); fy=P.g-Math.max(0,Math.cos(p))*0.07*H*st; }
    const k=ik2(hx,hy,fx,fy,th,sh,-f);
    limb(hx,hy,k.jx,k.jy,k.ex,k.ey,i?COL.mid:COL.ink);
    line(ctx,k.ex,k.ey,k.ex+f*0.06*H,k.ey,i?COL.mid:COL.ink,lwd);
  }
  // torso + head
  line(ctx,hx,hy,shx,shy,COL.ink,lwd*1.15);
  circ(ctx,nx,ny,hr,COL.ink,'#fff',lwd);
  circ(ctx,nx+f*hr*0.45,ny-hr*0.1,Math.max(1,lwd*0.45),COL.ink,COL.ink,1);
  // arms
  for(let i=1;i>=0;i--){
    let tx,ty;
    if(P.hands&&P.hands[i]){ tx=P.hands[i].x; ty=P.hands[i].y; }
    else { const sw=Math.sin(ph+(i?0:Math.PI))*st; tx=shx-f*sw*0.14*H+f*0.02*H; ty=shy+(ua+fa)*0.95; }
    const k=ik2(shx,shy,tx,ty,ua,fa,f);
    limb(shx,shy,k.jx,k.jy,k.ex,k.ey,i?COL.mid:COL.ink);
    circ(ctx,k.ex,k.ey,lwd*0.9,i?COL.mid:COL.ink,'#fff',lwd*0.6);
  }
  ctx.restore();
  return {hx,hy,shx,shy,headX:nx,headY:ny};
}
/* hip x that lets a figure of height H (lean, crouch) reach a hand point in front of it */
function hipForReach(handX,handY,g,H,f,lean,crouch){
  const hy=g-0.49*H*(1-0.42*(crouch||0)), shy=hy-Math.cos(lean)*0.29*H, reach=0.325*H*0.93;
  const dy=handY-shy, dx=Math.sqrt(Math.max(0,reach*reach-dy*dy));
  return handX-f*(dx+Math.sin(lean)*0.29*H);
}
/* cardboard box — (x,y) = bottom-left corner */
function cardBox(ctx,x,y,w,h,alpha){
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  rect(ctx,x,y-h,w,h,COL.ink,'#fff',2.4);
  line(ctx,x,y-h+h*0.16,x+w,y-h+h*0.16,COL.mid,1.3);
  line(ctx,x+w*0.5,y-h,x+w*0.5,y-h+h*0.16,COL.mid,1.3);
  ctx.save(); rrect(ctx,x+w*0.36,y-h+h*0.32,w*0.28,h*0.1,h*0.05); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore();
  ctx.restore();
}
/* vertical coil spring from y1 (top) to y2 (bottom) */
function coil(ctx,x,y1,y2,n,wd,col,lwd){
  const L=y2-y1, lead=Math.min(12,Math.abs(L)*0.1), body=L-2*lead, N=n*24;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lwd||2; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x,y1); ctx.lineTo(x,y1+lead);
  const pitch=body/n;
  for(let i=0;i<=N;i++){ const u=i/N, a=u*n*Math.PI*2;
    ctx.lineTo(x+Math.sin(a)*wd/2, y1+lead+body*u - Math.cos(a)*Math.min(pitch*0.35,wd*0.18) + Math.min(pitch*0.35,wd*0.18)); }
  ctx.lineTo(x,y2); ctx.stroke(); ctx.restore();
}
/* hand seen from the side: palm facing `dir` (±1), fingertips at (x,y) */
function hand(ctx,x,y,dir,armLen,armAng){
  const a=armAng===undefined?(dir>0?Math.PI:0):armAng;
  const bx=x-dir*18, by=y;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  line(ctx,bx,by,bx+Math.cos(a)*armLen,by+Math.sin(a)*armLen,COL.ink,9);
  line(ctx,bx,by,bx+Math.cos(a)*armLen,by+Math.sin(a)*armLen,'#fff',5);
  ctx.beginPath(); ctx.moveTo(bx,by-10); ctx.lineTo(x-dir*2,by-9); ctx.quadraticCurveTo(x+dir*2,by-8,x+dir*1,by); ctx.quadraticCurveTo(x+dir*2,by+8,x-dir*2,by+9); ctx.lineTo(bx,by+10); ctx.closePath();
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* hand pressing downward: fingertip at (x,y) */
function handDown(ctx,x,y,armLen){
  ctx.save(); ctx.lineCap='round';
  line(ctx,x,y-16,x+armLen*0.25,y-16-armLen,COL.ink,10); line(ctx,x,y-16,x+armLen*0.25,y-16-armLen,'#fff',6);
  ctx.beginPath(); rrect(ctx,x-12,y-22,24,22,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  line(ctx,x-5,y-8,x-5,y-1,COL.mid,1.2); line(ctx,x+3,y-8,x+3,y-1,COL.mid,1.2);
  ctx.restore();
}
function magnifier(ctx,cx,cy,R,draw,label){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.clip(); draw(); ctx.restore();
  circ(ctx,cx,cy,R,COL.ink,null,3);
  if(label) textAt(ctx,label,cx,cy+R+16,{align:'center',size:11,weight:600,color:COL.muted});
}
/* jagged surface profile (friction close-up) */
function roughProfile(seed,rough,n){ const R=rng(seed), a=[]; for(let i=0;i<n;i++) a.push((R()-0.5)*2*rough*(0.6+0.4*R())); return a; }

/* ---------- spring balance (line diagram) ----------
   cfg = {max, major, div}  · reading in N (drawn pointer) · returns hook tip point
   Scale length Ls px covers 0 → max. Mass scale (g) on the left uses g = 10 N/kg. */
function springBalance(ctx,cx,topY,Ls,cfg,reading,opts){
  opts=opts||{};
  const bw=Math.max(58,Ls*0.2), y0=topY+44, y1=y0+Ls, bh=Ls+86;
  // ring + body
  circ(ctx,cx,topY+6,9,COL.ink,'#fff',2.4);
  ctx.save(); rrect(ctx,cx-bw/2,topY+16,bw,bh,12); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
  // slot
  ctx.save(); rrect(ctx,cx-7,y0-18,14,Ls+40,6); ctx.fillStyle='#f3f6fa'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
  const shown=clamp(reading,0,cfg.max*1.04), py=y0+Ls*shown/cfg.max;
  coil(ctx,cx,y0-16,py-4,9,11,opts.over?COL.red:COL.blue,1.8);
  // scales
  const nMaj=Math.round(cfg.max/cfg.major);
  for(let i=0;i<=nMaj;i++){
    const y=y0+Ls*i/nMaj;
    line(ctx,cx+9,y,cx+bw/2-8,y,COL.ink,1.8);
    textAt(ctx,fmt(i*cfg.major,1),cx+bw/2-7,y-3,{align:'right',size:clamp(Ls/30,9,12),weight:700,color:opts.hiMax&&i===nMaj?COL.yellow:COL.ink});
    line(ctx,cx-bw/2+8,y,cx-9,y,COL.muted,1.5);
    textAt(ctx,String(Math.round(i*cfg.major/G*1000)),cx-bw/2+7,y-3,{size:clamp(Ls/34,8,11),weight:600,color:COL.muted});
    if(i<nMaj) for(let j=1;j<cfg.div;j++){ const yy=y+Ls/nMaj*j/cfg.div; line(ctx,cx+9,yy,cx+(j===cfg.div/2?19:15),yy,COL.ink,1.1); line(ctx,cx-9,yy,cx-15,yy,COL.mid,1); }
  }
  textAt(ctx,'N',cx+bw/2-8,y1+20,{align:'right',size:11,weight:700,color:COL.ink});
  textAt(ctx,'g',cx-bw/2+8,y1+20,{size:11,weight:700,color:COL.muted});
  // pointer
  line(ctx,cx-bw/2+6,py,cx+bw/2-6,py,COL.red,2.4); arrowHead(ctx,cx+bw/2-4,py,0,COL.red,7);
  // rod + hook
  const hy=topY+16+bh+34+(py-y0);
  line(ctx,cx,py,cx,hy-10,COL.ink,2.6);
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(cx,hy-10); ctx.lineTo(cx,hy); ctx.arc(cx+7,hy,7,Math.PI,Math.PI*0.1,true); ctx.stroke(); ctx.restore();
  return {hx:cx+7, hy:hy+7, py, y0, y1, bw, bottom:topY+16+bh};
}

  { num:'5.1',  title:'Move the Box', desc:'Push · pull · lift · carry', build: buildA1 },
  { num:'5.2',  title:'What a Force Does', desc:'Start · stop · turn · squash', build: buildA2 },
  { num:'5.3',  title:'Why It Stops', desc:'Push the box and let go', build: buildA3 },
  { num:'5.4',  title:'Different Surfaces', desc:'Same push, five surfaces', build: buildA4 },
  { num:'5.5',  title:'Floating Ring Magnet', desc:'Like poles · unlike poles', build: buildA5 },
  { num:'5.6',  title:'Charged Scale', desc:'Rub it · bring it near paper', build: buildA6 },
  { num:'5.7',  title:'Charged Balloons', desc:'Rub both · bring the cloth near', build: buildA7 },
  { num:'5.8',  title:'Throw It Up', desc:'Throw harder · watch it return', build: buildA8 },
  { num:'5.9',  title:'Stretch a Spring', desc:'Hang different objects', build: buildA9 },
  { num:'5.10', title:'Range of a Balance', desc:'How much can it measure?', build: buildA10 },
  { num:'5.11', title:'Smallest Division', desc:'Count the small marks', build: buildA11 },
  { num:'5.12', title:'Measure Weight', desc:'Hang · read · record', build: buildA12 },
  { num:'5.13', title:'Upthrust', desc:'Push a bottle into water · let go', build: buildA13 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){

  buildNav();

  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* =====================================================================
   5.1 MOVE THE BOX — push, pull, lift (pull up), carry
   Horizontal:  box starts only if F > μs·m·g  (μs = 0.5), then
                m·a = F·(1 − v/vmax) − μk·m·g   (μk = 0.4, vmax = 2.2 m/s —
                muscles push less hard the faster you move)
   Vertical:    box rises only if F > m·g;  a = (F − m·g)/m, with the
                lifter easing off near waist height (spring-damper hold).
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Way to move it</label>
      <div class="toggle-group" id="mdB"><button class="toggle-btn active" data-m="push">Push</button><button class="toggle-btn" data-m="pull">Pull</button><button class="toggle-btn" data-m="lift">Lift</button><button class="toggle-btn" data-m="carry">Carry</button></div></div>
    <div class="control-group"><label>Your force <span class="val" id="fV"></span></label><input type="range" id="fR" min="0" max="400" step="5" value="120"></div>
    <div class="control-group"><label style="margin-bottom:6px;">What's inside</label>
      <div class="toggle-group" id="msB"><button class="toggle-btn" data-k="5">Empty · 5 kg</button><button class="toggle-btn active" data-k="15">Books · 15 kg</button><button class="toggle-btn" data-k="30">Full · 30 kg</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Force on box</div><div class="rval" id="r1" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel" id="r2l">Friction</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Box speed</div><div class="rval" id="r3" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Box</div><div class="rval" id="r4">—</div></div></div>
      <div class="fb warn hidden" id="fbk"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), fR=$('#fR');
  let mode='push', m=15, t=0;
  const MUS=0.5, MUK=0.4, VMAX=2.2, BW=0.85, BH=0.8, HOLD=0.5;
  const S={bx:1.3, v:0, y:0, vy:0, phase:0, fade:1, fading:false, cyc:'lift', ct:0, px:0};
  function reset(){ S.bx=mode==='pull'?0.9:1.3; S.v=0; S.y=0; S.vy=0; S.cyc='lift'; S.ct=0; }
  toggleWire(wrap.querySelectorAll('#mdB button'),b=>{ mode=b.dataset.m; S.fading=true; });
  toggleWire(wrap.querySelectorAll('#msB button'),b=>{ m=+b.dataset.k; });

  animLoop((dt)=>{
    t+=dt;
    const F=parseFloat(fR.value); $('#fV').textContent=F+' N';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=Math.min(w/4.8,h*0.62/1.75), gY=h*0.78, x0=w*0.03, Wm=(w*0.94)/ppm;
    const X=xm=>x0+xm*ppm, Hp=1.65*ppm;
    const mg=m*G;
    let Fapp=0, fric=0, moving=false, strain=false, lifted=false;

    // fade-out → reset → fade-in (keeps the scene looping)
    if(S.fading){ S.fade=approach(S.fade,0,9,dt); if(S.fade<0.03){ reset(); S.fading=false; } }
    else S.fade=approach(S.fade,1,6,dt);

    if(mode==='push'||mode==='pull'){
      S.y=0;
      if(Math.abs(S.v)<1e-3 && F<=MUS*mg){ S.v=0; fric=F; Fapp=F; strain=F>0; }
      else { Fapp=F*Math.max(0,1-S.v/VMAX); fric=MUK*mg; S.v+=(Fapp-fric)/m*dt; if(S.v<0) S.v=0; moving=S.v>0.01; }
      S.bx+=S.v*dt; S.phase+=S.v*dt/0.36*(mode==='pull'?-1:1);
      const endX=mode==='push'?S.bx+BW+0.2:S.bx+BW+1.9;
      if(endX>Wm && !S.fading) S.fading=true;
    } else {
      // vertical: lifter PD-controls towards waist height but can never exceed F
      S.ct+=dt;
      const tgt=(S.cyc==='lift'||S.cyc==='hold'||S.cyc==='walk')?HOLD:0;
      const want=m*(G+40*(tgt-S.y)-11*S.vy);
      Fapp=clamp(want,0,F);
      if(S.y<=0 && Fapp<=mg){ S.y=0; S.vy=0; strain=S.cyc==='lift'&&F>0; if(S.cyc==='lower'&&S.ct>0.6){ S.cyc='rest'; S.ct=0; } }
      else { S.vy+=(Fapp-mg)/m*dt; S.y+=S.vy*dt; if(S.y<0){ S.y=0; S.vy=0; } }
      lifted=S.y>0.02;
      if(S.cyc==='lift' && Math.abs(S.y-HOLD)<0.03 && Math.abs(S.vy)<0.15){ S.cyc=mode==='carry'?'walk':'hold'; S.ct=0; }
      else if(S.cyc==='hold' && S.ct>1.2){ S.cyc='lower'; S.ct=0; }
      else if(S.cyc==='rest' && S.ct>0.9){ S.cyc='lift'; S.ct=0; }
      if(S.cyc==='walk'){ const vt=1.4*Math.sqrt(Math.max(0,1-mg/F)); S.v=approach(S.v,vt,3,dt); S.bx+=S.v*dt; S.phase+=S.v*dt/0.36; moving=S.v>0.02; if(S.bx+BW+0.3>Wm && !S.fading) S.fading=true; }
      else S.v=approach(S.v,0,8,dt);
    }

    ground(ctx,0,w,gY);
    // distance ticks on the floor
    for(let xm=0;xm<Wm;xm+=0.5){ line(ctx,X(xm),gY+28,X(xm),gY+(xm%1<0.01?38:34),COL.mid,1); if(xm%1<0.01) textAt(ctx,xm+' m',X(xm),gY+50,{align:'center',size:10,color:COL.mid}); }

    ctx.save(); ctx.globalAlpha=S.fade;
    const bxp=X(S.bx), bw=BW*ppm, bh=BH*ppm, by=gY-S.y*ppm;
    const jit=strain?Math.sin(t*47)*1.6:0;
    const walkSt=moving?clamp(S.v/1.2,0.35,1):0;
    if(mode==='push'){
      const lean=0.95+(strain?0.1:0), f=1, cr=0.32;
      const hy=by-bh*0.7;
      const hipX=hipForReach(bxp,hy,gY,Hp,f,lean,cr)+jit;
      person(ctx,{x:hipX,g:gY,H:Hp,face:f,lean,crouch:cr,phase:S.phase,stride:walkSt,
        feet:moving?null:[hipX-0.3*Hp,hipX+0.1*Hp],hands:[{x:bxp+jit,y:hy},{x:bxp+jit,y:hy+0.04*Hp}]});
      cardBox(ctx,bxp+jit,by,bw,bh);
      force(ctx,bxp+4,by-bh-14,Fapp/400*140,0,COL.yellow,'push');
      force(ctx,bxp+bw*0.5,gY-5,-fric/400*140,0,COL.blue,'friction','b');
    } else if(mode==='pull'){
      const lean=-0.34-(strain?0.1:0), f=-1, ropeL=1.0*ppm;
      const hy=by-bh*0.5, handX=bxp+bw+ropeL+jit;
      const hipX=handX+0.3*Hp-Math.sin(lean)*0.29*Hp*0.2;
      // rope (taut) from handle to hands
      line(ctx,bxp+bw,hy,handX,hy-0.02*Hp,COL.ink,2.2);
      person(ctx,{x:hipX,g:gY,H:Hp,face:f,lean,phase:S.phase,stride:walkSt,
        feet:moving?null:[hipX+0.3*Hp,hipX-0.1*Hp],hands:[{x:handX,y:hy-0.02*Hp},{x:handX+0.05*Hp,y:hy-0.03*Hp}]});
      cardBox(ctx,bxp+jit,by,bw,bh);
      circ(ctx,bxp+bw,hy,3,COL.ink,'#fff',2);
      force(ctx,bxp+bw+4,hy+14,Fapp/400*140,0,COL.yellow,'pull');
      force(ctx,bxp+bw*0.5,gY-5,-fric/400*140,0,COL.blue,'friction','b');
    } else {
      const reach=clamp(1-S.y/HOLD,0,1);
      const hipX=bxp-0.2*Hp+jit;
      const crouch=0.1+0.75*reach, lean=0.18+0.5*reach;
      person(ctx,{x:hipX,g:gY,H:Hp,face:1,lean,crouch,phase:S.phase,stride:walkSt,
        feet:moving?null:[hipX-0.1*Hp,hipX+0.08*Hp],hands:[{x:bxp+bw*0.18+jit,y:by-bh*0.75},{x:bxp+bw*0.1+jit,y:by-bh*0.85}]});
      cardBox(ctx,bxp+jit,by,bw,bh);
      force(ctx,bxp+bw*0.72,by-bh*0.5,0,-Fapp/400*140,COL.yellow,'lift','r');
      force(ctx,bxp+bw*0.72,by,0,mg/400*140,COL.red,'weight','r');
      if(S.y>0.01) line(ctx,bxp+bw*0.3,gY,bxp+bw*0.3,by,COL.yellow,1.5,[4,4]);
    }
    if(S.v>0.03) force(ctx,bxp+bw*0.5-S.v/2.2*55,by-bh-48,S.v/2.2*110,0,COL.green,'motion');
    ctx.restore();

    const isV=mode==='lift'||mode==='carry';
    $('#r1').textContent=Math.round(Fapp)+' N';
    $('#r2l').textContent=isV?'Weight':'Friction'; $('#r2').style.color=isV?'var(--f-red)':'var(--f-blue)';
    $('#r2').textContent=Math.round(isV?mg:fric)+' N';
    $('#r3').textContent=fmt(S.v,2)+' m/s';
    $('#r4').textContent=isV?(lifted?'Lifted':'On floor'):(moving?'Moving':'At rest');
    const fb=$('#fbk');
    const need=isV?mg:MUS*mg;
    if(F<=need){ fb.classList.remove('hidden'); fb.textContent='Needs more than '+Math.round(need)+' N'; } else fb.classList.add('hidden');
  });
  return wrap;
}

/* =====================================================================
   5.2 WHAT A FORCE DOES
   Kick (start):     v = F·Δt / m      (Δt = 0.012 s, football m = 0.45 kg),
                     then rolls with a = −0.6 m/s² (grass).
   Hold (stop):      a = −F / M        (bicycle + rider M = 60 kg, v₀ = 4 m/s)
                     stopping distance s = v₀² / 2a.

function drawBicycle(ctx,x,gy,s,wheelAng,crank){
  // x = rear-wheel centre; s = px per metre
  const r=0.33*s, wb=1.05*s, rx=x, fx=x+wb, cy=gy-r;
  for(const wx of [rx,fx]){ circ(ctx,wx,cy,r,COL.ink,null,2.6); circ(ctx,wx,cy,3,COL.ink,COL.ink,1);
    for(let i=0;i<6;i++){ const a=wheelAng+i*Math.PI/3; line(ctx,wx,cy,wx+Math.cos(a)*r*0.95,cy+Math.sin(a)*r*0.95,COL.mid,1); } }
  const bb={x:rx+0.42*s,y:cy+0.04*s}, seat={x:rx+0.3*s,y:cy-0.55*s}, head={x:fx-0.2*s,y:cy-0.62*s};
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(rx,cy); ctx.lineTo(bb.x,bb.y); ctx.lineTo(seat.x,seat.y); ctx.lineTo(rx,cy);
  ctx.moveTo(bb.x,bb.y); ctx.lineTo(head.x,head.y); ctx.lineTo(seat.x,seat.y);
  ctx.moveTo(head.x,head.y); ctx.lineTo(fx,cy); ctx.moveTo(head.x,head.y); ctx.lineTo(head.x-0.04*s,head.y-0.14*s); ctx.lineTo(head.x+0.1*s,head.y-0.16*s);
  ctx.moveTo(seat.x-0.12*s,seat.y-0.04*s); ctx.lineTo(seat.x+0.1*s,seat.y-0.04*s); ctx.stroke(); ctx.restore();
  const cl=0.17*s, p1={x:bb.x+Math.cos(crank)*cl,y:bb.y+Math.sin(crank)*cl}, p2={x:bb.x-Math.cos(crank)*cl,y:bb.y-Math.sin(crank)*cl};
  line(ctx,p1.x,p1.y,p2.x,p2.y,COL.ink,2.4); circ(ctx,bb.x,bb.y,0.07*s,COL.ink,'#fff',2);

}
function football(ctx,x,y,r,ang){

/* =====================================================================
   5.3 WHY IT STOPS · 5.4 DIFFERENT SURFACES — sliding friction
   After the hand lets go:  a = −μ·g   →   v(t) = v₀ − μg·t
   Stopping distance  s = v₀² / (2μg),  stopping time  t = v₀ / (μg).
   Check: v₀ = 1.5 m/s on a wooden table (μ = 0.3) → s = 2.25/6 = 0.375 m,
   t = 0.5 s. Shown in slow motion (×0.35) so the slide is watchable.
   ===================================================================== */
const SURF=[
  {k:'glass', name:'Glass', mu:0.12, col:COL.blue},
  {k:'tile',  name:'Tile',  mu:0.2,  col:COL.muted},
  {k:'wood',  name:'Wood',  mu:0.3,  col:COL.yellow},
  {k:'cloth', name:'Cloth', mu:0.45, col:COL.green},
  {k:'sand',  name:'Sand',  mu:0.7,  col:COL.red},
];
/* one slider box: hand pushes over PUSHD metres, lets go, friction stops it */
const PUSHD=0.05;
function slideNew(x){ return {x, v:0, ph:'idle', dir:1, t:0, x0:x, xr:x, hand:0, dist:null}; }
function slideStart(b,dir){ if(b.ph==='push'||b.ph==='slide'||b.ph==='reach') return false; b.ph='reach'; b.dir=dir; b.t=0; b.x0=b.x; b.dist=null; b.v=0; return true; }
function slideStep(b,mu,v0,dt){
  const aF=mu*G;
  if(b.ph==='reach'){ b.t+=dt; b.hand=smooth01(0,0.25,b.t); if(b.t>=0.25){ b.ph='push'; } }
  else if(b.ph==='push'){ // hand accelerates the box uniformly to v0 over PUSHD
    const a=v0*v0/(2*PUSHD); b.v+=a*dt; b.x+=b.dir*b.v*dt;
    if(Math.abs(b.x-b.x0)>=PUSHD || b.v>=v0){ b.v=v0; b.ph='slide'; b.xr=b.x; }
  } else if(b.ph==='slide'){
    b.v-=aF*dt; if(b.v<=0){ b.v=0; b.ph='stop'; b.dist=Math.abs(b.x-b.xr); } else b.x+=b.dir*b.v*dt;
    b.hand=Math.max(0,b.hand-dt*4);
  } else if(b.ph==='stop'){ b.hand=Math.max(0,b.hand-dt*4); }
  return b;
}
/* close-up of the two touching surfaces; offset in px slides the top one */
function frictionCloseup(ctx,cx,cy,R,rough,off,moving,t){
  const n=64, bot=roughProfile(9,rough,n), top=roughProfile(23,rough,n), step=(2*R)/(n/2);
  const ride=moving?rough*0.35*(0.5+0.5*Math.sin(off*0.35)):0;
  ctx.save();
  // lower surface
  ctx.beginPath(); ctx.moveTo(cx-R-10,cy+R+10);
  for(let i=0;i<n;i++){ const x=cx-R-10+i*step; ctx.lineTo(x,cy+6+bot[i]); }
  ctx.lineTo(cx+R+10,cy+R+10); ctx.closePath(); ctx.fillStyle='#f1f4f8'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
  // upper surface (the box), slid by `off`
  const o=((off%(n*step))+n*step)%(n*step);
  ctx.beginPath(); ctx.moveTo(cx-R-10,cy-R-10);
  for(let i=0;i<n*2;i++){ const x=cx-R-10-n*step+i*step+o; ctx.lineTo(x,cy-6-ride-top[i%n]*0.9); }
  ctx.lineTo(cx+R+10,cy-R-10); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
  ctx.restore();
}

  $('#pL').onclick=()=>{ if(slideStart(b,-1)){ logged=false; lastV=+vR.value; } };
  $('#pR').onclick=()=>{ if(slideStart(b,1)){ logged=false; lastV=+vR.value; } };
  $('#rs').onclick=()=>{ b=slideNew(L/2); };

  animLoop((dt0)=>{
    t+=dt0; const dt=dt0*SLOW;
    const v0=+vR.value; $('#vV').textContent=fmt(v0,2)+' m/s';
    slideStep(b,MU,b.ph==='idle'||b.ph==='stop'?v0:lastV,dt);
    if(b.x<0.15||b.x>L-0.15){ b.x=clamp(b.x,0.15,L-0.15); if(b.ph==='slide'){ b.v=0; b.ph='stop'; b.dist=Math.abs(b.x-b.xr); } }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ppm=w*0.9/L, X=xm=>w*0.05+xm*ppm, tY=h*0.6;
    // table
    rect(ctx,X(0),tY,L*ppm,14,COL.ink,'#fbf6ec',2.4);
    for(let i=0;i<9;i++) line(ctx,X(0)+10,tY+3+i*1.2,X(L)-10,tY+3+i*1.2+Math.sin(i)*2,'#ecdcbc',0.8);
    line(ctx,X(0.08),tY+14,X(0.08),h*0.97,COL.ink,5); line(ctx,X(L-0.08),tY+14,X(L-0.08),h*0.97,COL.ink,5);
    ground(ctx,0,w,h*0.97);
    // ruler on the table edge (cm from centre)
    for(let c=-70;c<=70;c+=10){ const x=X(L/2+c/100); line(ctx,x,tY+14,x,tY+(c%50===0?30:22),COL.mid,1.2); if(c%20===0) textAt(ctx,c+' cm',x,tY+42,{align:'center',size:10,color:COL.mid}); }
    // lunch box
    const bw=0.24*ppm, bh=0.09*ppm, bx=X(b.x)-bw/2;
    ctx.save(); rrect(ctx,bx,tY-bh,bw,bh,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    line(ctx,bx+4,tY-bh+bh*0.3,bx+bw-4,tY-bh+bh*0.3,COL.mid,1.4);
    rect(ctx,bx+bw*0.42,tY-bh-5,bw*0.16,5,COL.ink,'#fff',1.6);
    // hand
    if(b.hand>0.01){
      const face=b.dir>0?bx:bx+bw, off=(1-b.hand)*90;
      hand(ctx,face-b.dir*(off+2),tY-bh*0.5,b.dir,160,b.dir>0?Math.PI+0.15:-0.15);
    }
    // stop marker + release marker
    if(b.ph==='slide'||b.ph==='stop'){
      line(ctx,X(b.xr),tY-bh-30,X(b.xr),tY,COL.mid,1.2,[4,4]);
      const d=Math.abs(b.x-b.xr);
      line(ctx,X(b.xr),tY-bh-22,X(b.x),tY-bh-22,COL.yellow,2);
      if(d>0.02) arrowHead(ctx,X(b.x),tY-bh-22,b.dir>0?0:Math.PI,COL.yellow,6);
      textAt(ctx,fmt(d*100,1)+' cm',(X(b.xr)+X(b.x))/2,tY-bh-30,{align:'center',size:12,weight:700,color:COL.yellow});
    }
    const moving=b.ph==='push'||b.ph==='slide';
    if(moving){
      const fl=MU*M*G*65; force(ctx,X(b.x),tY-3,-b.dir*fl,0,COL.blue,'');
      textAt(ctx,'friction',X(b.x)-b.dir*(fl+6),tY-4,{align:b.dir>0?'right':'left',size:12,weight:700,color:COL.blue});
      if(b.v>0.02) force(ctx,X(b.x)-b.dir*bw*0.3,tY-bh-54,b.dir*b.v*55,0,COL.green,'motion');
    }
    if(b.ph==='push') force(ctx,b.dir>0?bx-4:bx+bw+4,tY-bh*0.5-16,b.dir*50,0,COL.yellow,'push');
    // close-up
    const R=Math.min(h*0.19,w*0.14), cx=w*0.5, cy=h*0.23;
    magnifier(ctx,cx,cy,R,()=>{ frictionCloseup(ctx,cx,cy,R,9,b.x*ppm*3,moving,t);
      if(moving) force(ctx,cx,cy+2,-b.dir*R*0.55,0,COL.blue,''); },'surfaces up close');
    line(ctx,cx,cy+R,X(b.x),tY-4,COL.mid,1,[3,4]);
    if(b.ph==='stop'&&!logged){ logged=true; rows.unshift([b.dir>0?'▶':'◀',fmt(lastV,2)+' m/s',fmt(b.dist*100,1)+' cm']); if(rows.length>6) rows.pop();
      $('#lg tbody').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(''); }
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    const vv=b.ph==='idle'||b.ph==='stop'?v0:lastV;
    $('#r1').textContent=fmt(b.v,2)+' m/s';
    $('#r2').textContent=fmt(MU*M*G,2)+' N';
    $('#r3').textContent=b.dist!=null?fmt(b.dist*100,1)+' cm':'—';
    $('#r4').textContent=fmt(vv/(MU*G),2)+' s';
  });
  return wrap;
}

function surfaceStrip(ctx,k,x0,x1,y,hh,R){
  const W=x1-x0;
  if(k==='glass'){ rect(ctx,x0,y,W,hh,COL.blue,'#eef6fe',2); for(let x=x0+30;x<x1;x+=90){ line(ctx,x,y+hh-3,x+14,y+3,'#b9d8f5',1.4); line(ctx,x+8,y+hh-3,x+18,y+3,'#b9d8f5',1); } }
  else if(k==='tile'){ rect(ctx,x0,y,W,hh,COL.ink,'#fff',2); for(let x=x0+60;x<x1;x+=60) line(ctx,x,y,x,y+hh,COL.mid,1.4); }
  else if(k==='wood'){ rect(ctx,x0,y,W,hh,COL.ink,'#fdf6e6',2); for(let j=1;j<3;j++){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1; ctx.beginPath(); for(let x=x0;x<=x1;x+=6) ctx.lineTo(x,y+hh*j/3+Math.sin(x*0.03+j*2)*1.8); ctx.stroke(); ctx.restore(); } }
  else if(k==='cloth'){ rect(ctx,x0,y,W,hh,COL.green,'#f1faf4',2); ctx.save(); ctx.strokeStyle='#9fd3b3'; ctx.lineWidth=1; ctx.beginPath(); for(let x=x0+3;x<x1;x+=6){ ctx.moveTo(x,y+2); ctx.lineTo(x+3,y+hh-2); ctx.moveTo(x+3,y+2); ctx.lineTo(x,y+hh-2); } ctx.stroke(); ctx.restore(); }
  else { rect(ctx,x0,y,W,hh,COL.ink,'#fbf3e3',2); const r=rng(4); ctx.save(); ctx.fillStyle='#b99a5e'; for(let i=0;i<W*0.5;i++){ ctx.fillRect(x0+r()*W,y+2+r()*(hh-4),1.6,1.6); } ctx.restore();
    ctx.save(); ctx.fillStyle='#b99a5e'; for(let x=x0;x<x1;x+=5) ctx.fillRect(x,y-1.5-(Math.sin(x*0.7)>0.3?1.5:0),2,2); ctx.restore(); }
}

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    SURF.forEach((s,i)=>{
      const b=boxes[i], y=top+lh*i+lh*0.62, sh=Math.max(8,lh*0.16);
      surfaceStrip(ctx,s.k,lx0-0.04*ppm,lx1,y,sh);
      textAt(ctx,s.name,lx0-0.06*ppm,y+sh/2+4,{align:'right',size:12,weight:700,color:i===zi?COL.ink:COL.muted});
      const bw=0.13*ppm, bh=Math.min(lh*0.4,bw*0.5), bx=X(b.x)-bw/2;
      ctx.save(); rrect(ctx,bx,y-bh,bw,bh,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
      line(ctx,bx+3,y-bh*0.7,bx+bw-3,y-bh*0.7,COL.mid,1.2);
      if(b.ph==='slide') force(ctx,X(b.x),y-2,-s.mu*M*G*28,0,COL.blue,'');
      if(b.ph==='slide' && b.v>0.02) force(ctx,X(b.x)+bw*0.6,y-bh*0.55,b.v*30,0,COL.green,'');
      if(b.dist!=null||b.ph==='slide'){ const d=b.x-b.xr; line(ctx,X(b.xr),y+sh+5,X(b.x),y+sh+5,s.col,2.4); line(ctx,X(b.x),y+sh+1,X(b.x),y+sh+9,s.col,2.4);
        textAt(ctx,fmt(d*100,0)+' cm',X(b.x)+6,y+sh+10,{size:12,weight:700,color:s.col}); }
    });
    if(hb>0.01){ const bt=top+lh*0.3, bb=top+lh*(SURF.length-1)+lh*0.62;
      rect(ctx,bar-7,bt,7,bb-bt,COL.ink,'#fff',2); hand(ctx,bar-7,(bt+bb)/2,1,120,Math.PI);
      if(boxes[0].ph==='push') force(ctx,bar-20,bt-4,40,0,COL.yellow,'same push'); }

    magnifier(ctx,cx,cy,R,()=>{ frictionCloseup(ctx,cx,cy,R,[2,4,7,11,16][zi],bz.x*ppm*3,mv,t); if(mv) force(ctx,cx,cy+2,-R*0.25-SURF[zi].mu*R*0.6,0,COL.blue,''); },SURF[zi].name+' up close');
    textAt(ctx,'slow motion ×'+SLOW,w-10,18,{align:'right',size:11,color:COL.mid});
    $('#tb').innerHTML=SURF.map((s,i)=>`<tr><td style="color:${s.col};font-weight:700">${s.name}</td><td>${boxes[i].dist!=null?fmt(boxes[i].dist*100,1)+' cm':'—'}</td><td>${fmt(s.mu*M*G,2)} N</td></tr>`).join('');
  });
