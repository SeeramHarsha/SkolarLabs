/* =====================================================================
   8.3 – 8.6 BUILD AN ATOM: ATOMIC NUMBER Z AND MASS NUMBER A
   Protons (+1, 1.007 u), neutrons (0, 1.009 u), electrons (−1, 0.00055 u)
   fly from their trays and spring into place. Z = protons decides the
   element; A = protons + neutrons; the spring scale shows why helium
   (2 p) weighs 4 u and why electrons hardly count. Nuclei that are not
   among the stable isotopes quiver; too few neutrons → the protons'
   repulsion wins (arrows).
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  const row=(k,lab,col)=>`<div class="var-row"><span class="vname" style="color:${col}">${lab}</span><div class="toggle-group"><button class="toggle-btn" data-k="${k}" data-d="-1">−</button><span class="val" id="${k}V" style="min-width:26px;text-align:center;font-weight:800;color:${col}"></span><button class="toggle-btn" data-k="${k}" data-d="1">＋</button></div></div>`;
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Particles</label>${row('p','Protons',COL.red)}${row('n','Neutrons',COL.ink)}${row('e','Electrons',COL.blue)}</div>
    <div class="control-group"><label>Start from</label><div class="chip-wrap" id="pre">
      <button class="chip-btn" data-z="1" data-n="0" data-e="1">H</button><button class="chip-btn" data-z="2" data-n="0" data-e="2">He puzzle</button><button class="chip-btn" data-z="3" data-n="4" data-e="3">Li (Fig 8.10)</button><button class="chip-btn" data-z="6" data-n="6" data-e="6">¹²C</button><button class="chip-btn" data-z="11" data-n="12" data-e="11">²³Na</button><button class="chip-btn" data-z="20" data-n="21" data-e="20">Q11: A 41</button><button class="chip-btn" data-z="26" data-n="30" data-e="26">Q10: Z 26</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Element (from Z)',COL.red)}${card('r2','Mass number A',COL.green)}${card('r3','Charge',COL.ink)}${card('r4','Nucleus',COL.green)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const CX=285, CY=225, SRC={p:[80,462],n:[180,462]}, ESRC=[380,462];

    if(k==='p') Z=clamp(Z+d,0,26); if(k==='n') N=clamp(N+d,0,32); if(k==='e') ne=clamp(ne+d,0,26); });
  chipsWire(wrap,'#pre .chip-btn',b=>{ Z=+b.dataset.z; N=+b.dataset.n; ne=+b.dataset.e; });
  animLoop(dt=>{
    t+=dt; const A=Z+N, r=A>30?6.2:A>12?7.6:9;

    const stable=Z>0&&isStable(Z,N), tooFewN=Z>=2&&N<Z*0.75, jit=Z===0||stable?0:(tooFewN?2.6:1.3);
    nucStep(nu,CX,CY,r,dt,jit,t);
    const nR=nucRadius(A,r), radii=[0,1,2,3].map(i=>nR+26+i*34); shStep(sh,CX,CY,radii,dt,0.8);
    const mass=Z*1.007+N*1.009+ne*0.00055; springTo(mS,mass,35,6,dt);
    const q=Z-ne;
    setv($,'pV',Z+''); setv($,'nV',N+''); setv($,'eV',ne+'');
    setv($,'r1',Z?elName(Z)+' ('+elSym(Z)+')':'—'); setv($,'r2',A+''); setv($,'r3',q===0?'neutral':(q>0?'+'+q+' (ion)':q+' (ion)')); setc($,'r3',q===0?COL.green:q>0?COL.red:COL.blue);
    setv($,'r4',Z===0?'—':stable?'stable':'unstable'); setc($,'r4',stable?COL.green:COL.red);
    if(Z===2&&N===0) setFb('warn','2 protons alone would weigh ≈ 2 u — but real helium weighs 4 u. Something neutral is missing: add 2 neutrons.');

        fArrow(ctx,a.x,a.y,-dx/L*20,-dy/L*20,COL.red,'',{w:2}); fArrow(ctx,b.x,b.y,dx/L*20,dy/L*20,COL.red,'',{w:2}); } }

}

/* =====================================================================
   8.7 FILLING THE SHELLS (Bohr–Bury rules, Table 8.4, Fig. 8.11)
   Each step adds one proton (and the right neutrons for the Table 8.4
   isotope) and one electron. The electron flies in and drops into the
   innermost shell that still has room: K holds 2n² = 2, L 8, M 18 — but
   an outermost shell holds at most 8, so for K (19) and Ca (20) the next
   electrons start the N shell. Full shells light up green.
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Atomic number Z <span class="val" id="zV"></span></label><input type="range" id="zR" min="1" max="20" step="1" value="1">
      <div class="toggle-group"><button class="toggle-btn" id="dn">− Remove</button><button class="toggle-btn play" id="up">＋ Next element</button></div>
      <button class="toggle-btn navy" id="auto">▶ Build up H → Ca</button></div>
    <div class="control-group"><div class="result-cards">${card('r1','Element',COL.ink)}${card('r2','p · n · e',COL.red)}${card('r3','K · L · M · N',COL.blue)}${card('r4','Valence electrons',COL.green)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const CX=260, CY=240, SRC=[260,-30];
  let auto=false, autoT=0, t=0, flash=[0,0,0,0]; const nu=nucNew(), sh=shNew(); let prevS=[0,0,0,0];
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  const zr=$('#zR');
  $('#up').onclick=()=>{ zr.value=Math.min(20,+zr.value+1); };
  $('#dn').onclick=()=>{ zr.value=Math.max(1,+zr.value-1); };
  $('#auto').onclick=()=>{ auto=!auto; if(auto&&+zr.value>=20) zr.value=1; autoT=0; };

    t+=dt; if(auto){ autoT+=dt; if(autoT>1.5){ autoT=0; if(+zr.value<20) zr.value=+zr.value+1; else auto=false; } }
    setBtn($('#auto'),auto?'❚❚ Pause':'▶ Build up H → Ca','navy');
    const Z=+zr.value, N=EL[Z][2], s=shellsOf(Z);
    nucSync(nu,Z,N,{p:[CX-60,-30],n:[CX+60,-30]}); shSync(sh,s,SRC);
    const r=Z+N>24?6:7.5, nR=nucRadius(Z+N,r), radii=[nR+28,nR+72,nR+118,nR+160];
    nucStep(nu,CX,CY,r,dt,0,t); shStep(sh,CX,CY,radii,dt,0.7);
    for(let i=0;i<4;i++){ const full=(s[i]||0)>=(i<3?(i===0?2:8):8); if(full&&(prevS[i]||0)<(s[i]||0)) flash[i]=1; flash[i]=Math.max(0,flash[i]-dt*0.8); } prevS=s.slice();
    setv($,'zV',Z+''); setv($,'r1',EL[Z][1]+' ('+EL[Z][0]+')'); setv($,'r2',Z+' · '+N+' · '+Z);
    setv($,'r3',[0,1,2,3].map(i=>s[i]===undefined?'–':s[i]).join(' · ')); setv($,'r4',valenceOf(Z)+'');
    const last=s.length-1;
    setFb(valenceOf(Z)===8||Z===2?'ok':'warn',Z===2||valenceOf(Z)===8?`${EL[Z][1]}: outer shell full — ${Z===2?'2 in K':'an octet'}.`
      :(Z===19||Z===20)?`M could take 18, but an outermost shell holds at most 8 — so electron ${Z===19?19:'19–20'} starts the N shell.`
      :`New electron goes to ${SHELL_NAMES[last]} (holds up to ${last===0?2:8}${last===2?' as outermost':''}).`);

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    for(let i=0;i<s.length;i++){ const full=i===0?s[0]>=2:s[i]>=8;
      ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,radii[i],0,Math.PI*2); ctx.lineWidth=full?3+flash[i]*6:1.4; ctx.strokeStyle=full?rgba(COL.green,0.6+0.4*flash[i]):COL.mid; if(!full) ctx.setLineDash([5,5]); ctx.stroke(); ctx.restore();
      textAt(ctx,SHELL_NAMES[i]+' '+s[i],CX+radii[i]*0.72+4,CY-radii[i]*0.72-2,{size:12.5,weight:800,color:full?COL.green:COL.muted}); }
    nucDraw(ctx,nu,r); shDraw(ctx,sh,6);
    textAt(ctx,EL[Z][0],CX,CY+radii[s.length-1]+30,{align:'center',size:22,weight:800,color:COL.ink});
    // bar graph of electrons per shell (The Journey Beyond)
    const gx=560, gy=70, gh=150, bw=40; textAt(ctx,'electrons per shell',gx,gy-18,{size:12,weight:800,color:COL.ink});
    line(ctx,gx-6,gy+gh,gx+4*(bw+12),gy+gh,COL.ink,2);
    [0,1,2,3].forEach(i=>{ const v=s[i]||0, capI=[2,8,18,32][i], hh=v/18*gh, x=gx+i*(bw+12);
      ctx.save(); ctx.setLineDash([3,3]); rect(ctx,x,gy+gh-Math.min(capI,18)/18*gh,bw,Math.min(capI,18)/18*gh,COL.mid,null,1); ctx.restore();
      ctx.save(); ctx.fillStyle=rgba(COL.blue,0.75); ctx.fillRect(x,gy+gh-hh,bw,hh); ctx.restore();
      textAt(ctx,SHELL_NAMES[i],x+bw/2,gy+gh+16,{align:'center',size:12,weight:800,color:COL.ink}); textAt(ctx,v+'',x+bw/2,gy+gh-hh-5,{align:'center',size:12,weight:800,color:COL.blue});
      textAt(ctx,'2n²='+capI,x+bw/2,gy+gh+30,{align:'center',size:9.5,weight:600,color:COL.muted}); });
    // mini Table 8.4 around the current element
    const tx=548, ty=300; textAt(ctx,'Table 8.4',tx,ty-10,{size:12,weight:800,color:COL.ink});
    const hd=['','Z','p','n','e','K','L','M','N']; hd.forEach((c,i)=>textAt(ctx,c,tx+18+i*26,ty+8,{align:'center',size:10,weight:700,color:COL.muted}));
    for(let k=-3;k<=2;k++){ const z=Z+k; if(z<1||z>20) continue; const ss=shellsOf(z), y=ty+28+(k+3)*22, cur=k===0;
      if(cur){ ctx.save(); ctx.fillStyle=rgba(COL.yellow,0.18); ctx.fillRect(tx,y-15,236,21); ctx.restore(); }
      [EL[z][0],z,z,EL[z][2],z,ss[0]||'–',ss[1]||'–',ss[2]||'–',ss[3]||'–'].forEach((c,i)=>textAt(ctx,c+'',tx+18+i*26,y,{align:'center',size:11,weight:cur?800:500,color:cur?COL.ink:COL.muted})); }
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   8.8 VALENCY — COMBINING CAPACITY. Only the valence shell is drawn;
   the inner shells sit in the core with the symbol. Partners (H or Cl,
   combining capacity 1) fly in one by one. A metal (1–3 valence
   electrons) hands one electron over to each partner → ions. A non-metal
   (4–7) shares one pair per partner. Once the octet (H: 2) is complete,
   the next partner is simply bounced away — the number that stay is the
   valency: Na 1, Mg 2, Al 3, C 4, N 3, O 2, F 1, Ne 0.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  const cz=[11,12,13,6,7,8,9,10];
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Central atom</label><div class="chip-wrap" id="cz">${cz.map((z,i)=>`<button class="chip-btn${z===8?' active':''}" data-z="${z}">${EL[z][0]}</button>`).join('')}</div></div>
    <div class="control-group"><label>Partner atoms</label><div class="toggle-group" id="pz"><button class="toggle-btn active" data-z="1">Hydrogen</button><button class="toggle-btn" data-z="17">Chlorine</button></div>
      <button class="toggle-btn navy" id="bring">Bring in a partner →</button><div class="toggle-group"><button class="toggle-btn" id="rst">↺ Start again</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Valence electrons',COL.blue)}${card('r2','Tends to',COL.yellow)}${card('r3','Partners held',COL.green)}${card('r4','Formula',COL.ink)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const CX=400, CY=240, cam=spr(1.9), SEAT=[0,Math.PI,-Math.PI/2,Math.PI/2];
  let Zc=8, Zp=1, t=0, atoms=[], els=[], leaving=[];
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  const metal=z=>valenceOf(z)<=3&&z!==1&&z!==2;
  function ringR(z){ return z===1?22:(z<=10?40:44); }
  function reset(){ atoms=[{z:Zc,x:CX,y:CY,vx:0,vy:0,seat:-1,q:0}]; els=[]; leaving=[];
    const v=valenceOf(Zc); for(let i=0;i<v;i++) els.push({own:0,bond:-1,x:CX,y:CY,vx:0,vy:0}); }
  reset();
  chipsWire(wrap,'#cz .chip-btn',b=>{ Zc=+b.dataset.z; reset(); });
  toggleWire([...wrap.querySelectorAll('#pz .toggle-btn')],b=>{ Zp=+b.dataset.z; reset(); });
  $('#rst').onclick=reset;
  const held=()=>atoms.filter((a,i)=>i>0&&a.bonded).length;
  $('#bring').onclick=()=>{ const k=atoms.length-1; if(atoms.some((a,i)=>i>0&&!a.bonded)) return;
    const seat=k<4?k:0, a=SEAT[seat], ion=metal(Zc), d=ringR(Zc)+ringR(Zp)+(ion?46:-12);
    const sx=CX+Math.cos(a)*420, sy=CY+Math.sin(a)*300; const at={z:Zp,x:sx,y:sy,vx:0,vy:0,seat,q:0,tx:CX+Math.cos(a)*d,ty:CY+Math.sin(a)*d,d,bonded:false,full:k>=valencyOf(Zc)||k>=4};
    atoms.push(at); const v=valenceOf(Zp), idx=atoms.length-1; for(let i=0;i<v;i++) els.push({own:idx,bond:-1,x:sx,y:sy,vx:0,vy:0}); };
  function bond(i){ const a=atoms[i]; a.bonded=true;
    if(metal(Zc)){ const e=els.find(q=>q.own===0&&q.bond===-1); if(e){ e.own=i; e.jump=1; a.q=-1; atoms[0].q++; } thud(0.05,420); }
    else { const e1=els.find(q=>q.own===0&&q.bond===-1), e2=els.find(q=>q.own===i&&q.bond===-1); if(e1) e1.bond=i; if(e2) e2.bond=i; thud(0.05,520); } }
  function counts(i){ const own=els.filter(q=>q.own===i&&q.bond===-1).length;
    const shared=i===0?els.filter(q=>q.bond>0).length:els.filter(q=>q.bond===i).length; return own+shared; }
  animLoop(dt=>{
    t+=dt;
    // partners move with a spring; ones that find no room bounce off
    atoms.forEach((a,i)=>{ if(i===0) return;
      if(a.full&&!a.bounced&&Math.hypot(a.x-a.tx,a.y-a.ty)<a.d*0.28){ a.bounced=true; const ang=SEAT[a.seat]; a.vx=Math.cos(ang)*520; a.vy=Math.sin(ang)*520; a.tx=CX+Math.cos(ang)*700; a.ty=CY+Math.sin(ang)*500; thud(0.07,160);
        setFb('bad',`No room: ${EL[Zc][0]} already has ${Zc===10?'a full octet':'a complete octet'} — the extra ${EL[Zp][1].toLowerCase()} is pushed away.`); }
      const k=a.bounced?4:22, c=a.bounced?1:8; a.vx+=((a.tx-a.x)*k-a.vx*c)*dt; a.vy+=((a.ty-a.y)*k-a.vy*c)*dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
      if(!a.full&&!a.bonded&&Math.hypot(a.x-a.tx,a.y-a.ty)<3&&Math.hypot(a.vx,a.vy)<40) bond(i); });
    atoms=atoms.filter((a,i)=>{ if(i>0&&a.bounced&&(a.x<-80||a.x>900||a.y<-80||a.y>600)){ els=els.filter(q=>q.own!==i); return false; } return true; });
    // electron targets: lone electrons in 4 seats × 2; shared pairs between the two atoms
    atoms.forEach((a,i)=>{ const R=ringR(a.z), mine=els.filter(q=>q.own===i&&q.bond===-1), base=i===0?0:SEAT[a.seat]+Math.PI;
      const bondSeats=new Set(i===0?atoms.filter((b,j)=>j>0&&b.bonded).map(b=>b.seat):(a.bonded?[0]:[]));
      const order=a.z===1?[0,0]:(i===0?[3,2,1,0,3,2,1,0]:[1,2,3,0,1,2,3,0]); let slot=0, used={};
      mine.forEach(q=>{ let s; do{ s=order[slot++%order.length]; } while(bondSeats.has(s)&&slot<16&&!(i>0&&metal(Zc)));
        used[s]=(used[s]||0)+1; const ang=(i===0?SEAT[s]:base+[0,Math.PI/2,Math.PI,-Math.PI/2][s])+(a.z===1?0:(used[s]===1?-0.2:0.2));
        q.tx=a.x+Math.cos(ang)*R; q.ty=a.y+Math.sin(ang)*R; }); });
    els.forEach(q=>{ if(q.bond>0){ const a=atoms[0], b=atoms[q.bond]; if(!b) return; const mx=(a.x+ringR(Zc)*Math.cos(SEAT[b.seat])+b.x-ringR(Zp)*Math.cos(SEAT[b.seat]))/2, my=(a.y+ringR(Zc)*Math.sin(SEAT[b.seat])+b.y-ringR(Zp)*Math.sin(SEAT[b.seat]))/2;
        const px=-Math.sin(SEAT[b.seat]), py=Math.cos(SEAT[b.seat]), o=q.own===0?5.5:-5.5; q.tx=mx+px*o; q.ty=my+py*o; }
      const k=q.jump?30:120, c=q.jump?7:20; q.vx+=((q.tx-q.x)*k-q.vx*c)*dt; q.vy+=((q.ty-q.y)*k-q.vy*c)*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; if(q.jump&&Math.hypot(q.tx-q.x,q.ty-q.y)<2) q.jump=0; });
    const v=valenceOf(Zc), vy=valencyOf(Zc), H=held();
    setv($,'r1',v+''); setv($,'r2',Zc===10?'stay alone':metal(Zc)?'lose '+vy:(v===4?'share 4':'gain / share '+vy)); setv($,'r3',H+'');
    const ps=EL[Zp][0], cs=EL[Zc][0], sub=n=>n>1?'₀₁₂₃₄'[n]:'', form=H===0?'—':(Zc===8||Zc===9?ps+sub(H)+cs:cs+ps+sub(H)); setv($,'r4',form);
    if(H===vy&&vy>0&&!atoms.some(a=>a.bounced)) setFb('ok',`${cs} holds exactly <b>${vy}</b> ${EL[Zp][1].toLowerCase()} atom${vy>1?'s':''} → <b>${form}</b>. Valency of ${EL[Zc][1].toLowerCase()} = ${vy}.`);
    else if(!atoms.some(a=>a.bounced)&&H<vy) setFb('warn',`${cs}: ${v} valence electron${v>1?'s':''}. Bring in partners until the octets are complete.`);
    else if(Zc===10&&atoms.length===1) setFb('warn','Neon already has 8 in its outer shell. Try to give it a partner.');

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    let ext=ringR(Zc)+20; atoms.forEach((a,i)=>{ if(i>0&&!a.bounced){ ext=Math.max(ext,(metal(Zc)?ringR(Zc)+ringR(Zp)+46:ringR(Zc)+ringR(Zp)-12)+ringR(Zp)+14); } });
    springTo(cam,Math.min(2.4,215/ext),20,9,dt); ctx.save(); ctx.translate(CX,CY); ctx.scale(cam.x,cam.x); ctx.translate(-CX,-CY);
    atoms.forEach((a,i)=>{ const R=ringR(a.z), n=counts(i), full=a.z===1?n===2:n===8, ion=metal(Zc), empty=i===0&&ion&&els.filter(q=>q.own===0).length===0&&v>0;
      if(full||empty) glow(ctx,a.x,a.y,R+18,COL.green,0.25);
      if(!empty){ ctx.save(); ctx.beginPath(); ctx.arc(a.x,a.y,R,0,Math.PI*2); ctx.lineWidth=full?3:1.6; ctx.strokeStyle=full?COL.green:COL.mid; if(!full) ctx.setLineDash([5,4]); ctx.stroke(); ctx.restore(); }
      const core=a.z===1?7:(a.z<=10?16:19); circ(ctx,a.x,a.y,core,empty?COL.green:COL.red,'#fff',empty?3:2);
      textAt(ctx,EL[a.z][0],a.x,a.y+5,{align:'center',size:a.z===1?10:14,weight:800,color:COL.ink});
      if(a.q) textAt(ctx,(a.q>0?(a.q>1?a.q:'')+'+':(a.q<-1?-a.q:'')+'−'),a.x+R*0.8,a.y-R*0.8,{align:'center',size:16,weight:800,color:a.q>0?COL.red:COL.blue});
      if(i===0){ const s=shellsOf(a.z); textAt(ctx,'core '+s.slice(0,-1).join(', ')||'',a.x,a.y+core+14,{align:'center',size:9.5,weight:600,color:COL.muted}); } });
    els.forEach(q=>eDraw(ctx,q.x,q.y,5.5)); ctx.restore();
    textAt(ctx,metal(Zc)?'electron given → ions':'electron pairs shared',CX,485,{align:'center',size:12.5,weight:700,color:COL.muted});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   8.9.1 ISOTOPES AND AVERAGE ATOMIC MASS — a mass spectrometer.
   Every ion gets the same kick qV, so it moves at v = √(2qV/m) and the
   magnet bends it on a circle r = mv/(qB) = √(2mV/q)/B: heavier isotopes
   swing wider and land further along the detector. Counting the hits
   gives the abundances; the weighted average Σ(m·%)/100 → 35.5 u for
   chlorine (75 % ³⁵Cl, 25 % ³⁷Cl), 80.0 u for bromine (49.7 / 50.3 %).
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  const SETS={H:{z:1,iso:[[1,99.985],[2,0.015],[3,1e-6]]},C:{z:6,iso:[[12,98.9],[13,1.1],[14,1e-10]]},Cl:{z:17,iso:[[35,75],[37,25]]},Br:{z:35,iso:[[79,49.7],[81,50.3]]}};
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Element</label><div class="chip-wrap" id="el"><button class="chip-btn" data-k="H">Hydrogen</button><button class="chip-btn" data-k="C">Carbon</button><button class="chip-btn active" data-k="Cl">Chlorine</button><button class="chip-btn" data-k="Br">Bromine</button></div></div>
    <div class="control-group" id="abG"><label>³⁵Cl in the sample <span class="val" id="aV"></span></label><input type="range" id="aR" min="0" max="100" step="1" value="75"></div>
    <div class="control-group"><label>Ion rate</label><div class="toggle-group" id="rt"><button class="toggle-btn small active" data-k="1">×1</button><button class="toggle-btn small" data-k="50">×50</button><button class="toggle-btn small" id="rst">↺ counts</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Ions counted',COL.red)}${card('r2','Measured %',COL.green)}${card('r3','Simple average',COL.muted)}${card('r4','Weighted average',COL.green)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  let key='Cl', mult=1, t=0, acc=0, ions=[], hits=[], cnt={}, total=0;
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function iso(){ const s=SETS[key]; if(key!=='Cl') return s.iso; const p=+$('#aR').value; return [[35,p],[37,100-p]]; }
  function reset(){ cnt={}; total=0; hits=[]; ions=[]; }
  chipsWire(wrap,'#el .chip-btn',b=>{ key=b.dataset.k; $('#abG').classList.toggle('hidden',key!=='Cl'); reset(); });
  const rb=[...wrap.querySelectorAll('#rt .toggle-btn[data-k]')]; rb.forEach(b=>b.onclick=()=>{ rb.forEach(x=>x.classList.remove('active')); b.classList.add('active'); mult=+b.dataset.k; });
  $('#rst').onclick=reset; $('#aR').oninput=reset;
  const X0=100, YD=300; // entry slit, detector line
  function rOf(m){ const I=iso(), mMax=Math.max(...I.map(q=>q[0])); return 255*Math.sqrt(m/mMax); }
  function pick(){ const I=iso(), tot=I.reduce((a,q)=>a+q[1],0); let u=Math.random()*tot; for(const q of I){ u-=q[1]; if(u<=0) return q[0]; } return I[0][0]; }
  animLoop(dt=>{
    t+=dt; setv($,'aV',$('#aR').value+' %');
    acc+=12*mult*dt; let k=Math.floor(acc); acc-=k;
    for(let i=0;i<k;i++){ const m=pick(); cnt[m]=(cnt[m]||0)+1; total++; if(i<(mult===1?k:1)) ions.push({m,s:-170,a:1}); }
    const I=iso(), mMin=Math.min(...I.map(q=>q[0]));
    ions.forEach(p=>{ const v=330*Math.sqrt(mMin/p.m); p.s+=v*dt; const r=rOf(p.m); if(p.s>=Math.PI*r){ p.done=true; hits.push({x:X0+2*r,a:1}); } });
    ions=ions.filter(p=>!p.done); hits.forEach(q=>q.a-=dt*1.2); hits=hits.filter(q=>q.a>0);
    const sa=I.reduce((a,q)=>a+q[0],0)/I.length, wa=total?Object.keys(cnt).reduce((a,m)=>a+m*cnt[m],0)/total:NaN, true_=I.reduce((a,q)=>a+q[0]*q[1],0)/I.reduce((a,q)=>a+q[1],0);
    setv($,'r1',total.toLocaleString()); setv($,'r2',total?I.slice(0,2).map(q=>q[0]+': '+fmt(100*(cnt[q[0]]||0)/total,1)).join(' · '):'—');
    setv($,'r3',fmt(sa,1)+' u'); setv($,'r4',total?fmt(wa,2)+' u':'—');
    if(total<50) setFb('warn','Ions of the same element, different masses, swing on different circles.');
    else setFb('ok',`Weighted average → <b>${fmt(wa,2)} u</b> (true ${fmt(true_,2)} u). The simple average ${fmt(sa,1)} u ignores how common each isotope is.`);

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    // magnet region (field out of the page)
    ctx.save(); ctx.fillStyle=rgba(COL.yellow,0.05); ctx.fillRect(X0-30,20,560,YD-20); ctx.restore(); rect(ctx,X0-30,20,560,YD-20,rgba(COL.yellow,0.6),null,1.4);
    for(let x=X0-10;x<X0+520;x+=48) for(let y=44;y<YD-10;y+=48){ circ(ctx,x,y,4,rgba(COL.yellow,0.7),null,1.1); circ(ctx,x,y,1,COL.yellow,COL.yellow,1); }
    textAt(ctx,'magnet (field out of page)',X0-24,36,{size:11.5,weight:700,color:COL.yellow});
    // flight paths
    I.forEach(q=>{ const r=rOf(q[0]); ctx.save(); ctx.globalAlpha=0.35; ctx.setLineDash([4,5]); ctx.strokeStyle=COL.red; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(X0+r,YD,r,Math.PI,0); ctx.stroke(); ctx.restore(); });
    // source and accelerating plates
    rrect(ctx,X0-30,440,60,46,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); textAt(ctx,'ion source',X0,500,{align:'center',size:11.5,weight:700,color:COL.ink});
    line(ctx,X0-30,420,X0-6,420,COL.red,4); line(ctx,X0+6,420,X0+30,420,COL.red,4); line(ctx,X0-30,YD+14,X0-6,YD+14,COL.blue,4); line(ctx,X0+6,YD+14,X0+30,YD+14,COL.blue,4);
    textAt(ctx,'+',X0+38,425,{size:15,weight:800,color:COL.red}); textAt(ctx,'−',X0+38,YD+19,{size:15,weight:800,color:COL.blue});
    // detector strip
    line(ctx,X0+40,YD,X0+540,YD,COL.green,5); textAt(ctx,'detector',X0+44,YD-8,{align:'left',size:11.5,weight:700,color:COL.green});
    hits.forEach(q=>{ glow(ctx,q.x,YD,16,COL.green,q.a); });
    // flying ions
    ions.forEach(p=>{ let x,y; if(p.s<0){ x=X0; y=YD+(-p.s)*(150/170); } else { const r=rOf(p.m), a=Math.PI-p.s/r; x=X0+r+Math.cos(a)*r; y=YD-Math.sin(a)*r; }
      const rr=4+0.6*(p.m-mMin); pDraw(ctx,x,y,rr); });
    // histogram of hits by mass
    const hx0=180, hx1=520, hy0=345, hy1=468, lo=mMin-1.5, hi=Math.max(...I.map(q=>q[0]))+1.5, HX=m=>hx0+(m-lo)/(hi-lo)*(hx1-hx0);
    line(ctx,hx0,hy1,hx1,hy1,COL.ink,2); textAt(ctx,'hits (mass in u)',hx0,hy0-6,{size:11.5,weight:800,color:COL.ink});
    const mx=Math.max(1,...Object.values(cnt));
    I.forEach(q=>{ const c=cnt[q[0]]||0, hh=c/mx*(hy1-hy0-14); ctx.save(); ctx.fillStyle=rgba(COL.green,0.75); ctx.fillRect(HX(q[0])-9,hy1-hh,18,hh); ctx.restore();
      textAt(ctx,q[0]+'',HX(q[0]),hy1+14,{align:'center',size:11,weight:800,color:COL.ink}); if(c) textAt(ctx,c.toLocaleString(),HX(q[0]),hy1-hh-4,{align:'center',size:10,weight:700,color:COL.green}); });
    if(total){ line(ctx,HX(wa),hy0+4,HX(wa),hy1,COL.green,2,[4,3]); textAt(ctx,'avg '+fmt(wa,2),HX(wa)+4,hy0+14,{size:10.5,weight:800,color:COL.green}); line(ctx,HX(sa),hy0+20,HX(sa),hy1,COL.mid,1.4,[2,3]); }
    // isotopes' nuclei — same protons, different neutrons
    const Z=SETS[key].z; let yy=60; textAt(ctx,'nuclei',720,40,{align:'center',size:12,weight:800,color:COL.ink});
    I.slice(0,3).forEach(q=>{ const N=q[0]-Z, rn=Z>20?2.4:Z>6?3.4:6; nucStatic(ctx,720,yy+30,Z,N,rn,t*0.2);
      textAt(ctx,({H:'H',C:'C',Cl:'Cl',Br:'Br'})[key]+'-'+q[0],720,yy+72,{align:'center',size:11,weight:800,color:COL.ink});
      textAt(ctx,Z+' p · '+N+' n · '+Z+' e',720,yy+86,{align:'center',size:10,weight:600,color:COL.muted}); yy+=90; });
    // one million atoms, split by what was measured
    if(total&&key!=='H'){ const bx=560, by=340, bw=220, bh=26; textAt(ctx,'in 10 lakh atoms',bx,by-6,{size:11.5,weight:800,color:COL.ink});
      let x=bx; I.forEach((q,i)=>{ const f=(cnt[q[0]]||0)/total, ww=bw*f; ctx.save(); ctx.fillStyle=i?rgba(COL.red,0.35):rgba(COL.red,0.12); ctx.fillRect(x,by,ww,bh); ctx.restore(); rect(ctx,x,by,ww,bh,COL.red,null,1.2);
        if(ww>40) textAt(ctx,(f*10).toFixed(1)+' L',x+ww/2,by+17,{align:'center',size:10.5,weight:800,color:COL.red}); x+=ww; }); }
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   8.9.2 ISOBARS vs ISOTOPES — each atom's nucleus drops onto its own
   spring scale (spring-damper settle → reading = A in u), and its
   electrons orbit below. Same Z (protons) → same electrons → isotopes,
   same chemistry. Same A but different Z → isobars: ⁴⁰Ar, ⁴⁰K, ⁴⁰Ca
   weigh the same yet have 8, 1 and 2 valence electrons.
   Includes the end-of-chapter X, Y, Z question.
   ===================================================================== */
function buildA11(){
  const wrap=labShell();
  const SETS={ iso40:[[18,22],[19,21],[20,20]], cl:[[17,18],[17,20]], q3:[[18,19],[17,18],[17,20]], c:[[6,6],[6,8]] };
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Compare</label><div class="chip-wrap" id="st"><button class="chip-btn active" data-k="iso40">Ar-40 · K-40 · Ca-40</button><button class="chip-btn" data-k="cl">Cl-35 · Cl-37</button><button class="chip-btn" data-k="c">C-12 · C-14</button><button class="chip-btn" data-k="q3">X · Y · Z (Q3)</button></div></div>
    <div class="control-group"><label>Change the middle atom: protons <span class="val" id="zV"></span></label><input type="range" id="zR" min="1" max="20" step="1" value="19">
      <label style="margin-top:6px">neutrons <span class="val" id="nV"></span></label><input type="range" id="nR" min="0" max="24" step="1" value="21"></div>
    <div class="control-group"><button class="toggle-btn navy" id="drop" style="margin-top:0">Weigh again ↓</button></div>
    <div class="control-group"><div class="result-cards">${card('r1','Same protons?',COL.red)}${card('r2','Same mass number?',COL.green)}${card('r3','Relation',COL.ink)}${card('r4','Chemistry',COL.blue)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  let set='iso40', atoms=[], t=0;
  function setFb(c,h){ fb.className='fb '+c; fb.innerHTML=h; }
  function load(k){ set=k; const L=SETS[k]; atoms=L.map((a,i)=>({Z:a[0],N:a[1],sc:{x:-i*6,v:0},sh:shNew()}));
    const mid=atoms[Math.min(1,atoms.length-1)]; $('#zR').value=mid.Z; $('#nR').value=mid.N; }
  load('iso40');
  chipsWire(wrap,'#st .chip-btn',b=>load(b.dataset.k));
  const edit=()=>{ const m=atoms[Math.min(1,atoms.length-1)]; m.Z=+$('#zR').value; m.N=+$('#nR').value; m.sc.v+=40; };
  $('#zR').oninput=edit; $('#nR').oninput=edit;
  $('#drop').onclick=()=>atoms.forEach((a,i)=>{ a.sc.x=-i*6; a.sc.v=0; thud(0.06,300); });
  const pairs=()=>{ const out=[]; for(let i=0;i<atoms.length;i++) for(let j=i+1;j<atoms.length;j++) out.push([i,j]); return out; };
  function rel(a,b){ if(a.Z===b.Z&&a.N===b.N) return 'same atom'; if(a.Z===b.Z) return 'isotopes'; if(a.Z+a.N===b.Z+b.N) return 'isobars'; return 'neither'; }
  animLoop(dt=>{
    t+=dt; const n=atoms.length, gap=800/(n+1);
    setv($,'zV',$('#zR').value+' ('+elSym(+$('#zR').value)+')'); setv($,'nV',$('#nR').value);
    atoms.forEach((a,i)=>{ const A=a.Z+a.N; springTo(a.sc,A,28,2.2,dt);
      shSync(a.sh,shellsOf(a.Z),[gap*(i+1),330]); shStep(a.sh,gap*(i+1),392,[20,40,60,80],dt,0.9,0.55); });
    const ps=pairs().map(p=>[p,rel(atoms[p[0]],atoms[p[1]])]);
    const sameZ=atoms.every(a=>a.Z===atoms[0].Z), sameA=atoms.every(a=>a.Z+a.N===atoms[0].Z+atoms[0].N);
    setv($,'r1',sameZ?'Yes':'No'); setc($,'r1',sameZ?COL.green:COL.red); setv($,'r2',sameA?'Yes':'No'); setc($,'r2',sameA?COL.green:COL.red);
    setv($,'r3',ps.length===1?ps[0][1]:(sameA&&!sameZ?'isobars':sameZ?'isotopes':'mixed')); setv($,'r4',sameZ?'same':'different');
    setFb(sameZ||sameA?'ok':'warn',ps.map(q=>`${lab(atoms[q[0][0]])} & ${lab(atoms[q[0][1]])}: <b>${q[1]}</b>`).join(' · '));

    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    line(ctx,30,22,770,22,COL.ink,4);
    atoms.forEach((a,i)=>{ const x=gap*(i+1), A=a.Z+a.N;
      const hook=springScale(ctx,x+60,40,140,a.sc.x,60,COL.green,'');
      line(ctx,x+60,22,x+60,40,COL.ink,2);
      // nucleus hanging from (or falling to) the hook
      const nr=3.6, R=nucRadius(A,nr), ny=hook+8+R+0.5*(a.sc.x-A); line(ctx,x+60,hook-4,x+60,ny-R,COL.muted,1.5);
      nucStatic(ctx,x+60,ny,a.Z,a.N,nr,t*0.3); textAt(ctx,fmt(Math.max(0,a.sc.x),1)+' u',x+60+R+8,ny+5,{size:13,weight:800,color:COL.green});
      notation(ctx,x-58,120,elSym(a.Z),A,a.Z,COL.ink,34);
      textAt(ctx,a.Z+' p · '+a.N+' n',x-58,146,{size:11,weight:700,color:COL.muted});
      // electrons and valence
      shRings(ctx,x,392,[20,40,60,80],shellsOf(a.Z).length,{alpha:0.6,oval:0.55});
      circ(ctx,x,392,6,COL.red,'#fff',1.6); shDraw(ctx,a.sh,4.2);
      const s=shellsOf(a.Z); textAt(ctx,s.join(', ')+' → '+s[s.length-1]+' valence',x,470,{align:'center',size:11.5,weight:800,color:COL.blue}); });
    ps.forEach(([p,r],k)=>{ if(atoms.length>2&&Math.abs(p[0]-p[1])>1) return; const x1=gap*(p[0]+1)+60, x2=gap*(p[1]+1)-20, y=318;
      if(atoms.length===2||Math.abs(p[0]-p[1])===1){ const c=r==='isotopes'?COL.red:r==='isobars'?COL.green:COL.mid; line(ctx,x1+10,y,x2-10,y,c,2,[5,4]); tag(ctx,r,(x1+x2)/2,y,c,{size:12}); } });
    ctx.restore();
  });
  function lab(a){ return elSym(a.Z)+'-'+(a.Z+a.N); }
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'8.2', title:'Cathode Rays', desc:'Pump the tube out, then bend the beam with plates and a magnet', build: buildA1 },
  { num:'8.2.1', title:"Thomson's Atom", desc:'Positive clay with electron beads — is your atom neutral?', build: buildA2 },
  { num:'8.2.2', title:'Gold Foil Experiment', desc:'Fire α-particles at gold — how many bounce back?', build: buildA3 },
  { num:'8.2.2 Eg', title:'How Empty Is an Atom?', desc:'Zoom from a paper sheet down to one nucleus', build: buildA4 },
  { num:'8.2.2 B', title:"Why Rutherford's Atom Should Collapse", desc:'A circling charge radiates and spirals in — unless Bohr is right', build: buildA5 },
  { num:'8.2.3', title:"Bohr's Energy Levels", desc:'Only photons that match a gap are absorbed', build: buildA6 },
  { num:'8.3–8.6', title:'Atomic Number and Mass Number', desc:'Add protons, neutrons and electrons — watch Z, A and the mass', build: buildA7 },
  { num:'8.7', title:'Filling the Shells', desc:'Add one electron at a time: K 2, L 8, M 8', build: buildA8 },
  { num:'8.8', title:'Valency', desc:'Bring in H or Cl atoms until the octets are full', build: buildA9 },
  { num:'8.9.1', title:'Isotopes and Average Atomic Mass', desc:'Sort ions by mass and find the weighted average', build: buildA10 },
  { num:'8.9.2', title:'Isobars and Isotopes', desc:'Weigh the nuclei and compare their electrons', build: buildA11 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
