<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn:disabled{opacity:.55; cursor:not-allowed;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.log td.g{color:var(--f-green);font-weight:700;} .log td.b{color:var(--f-blue);font-weight:700;} .log td.rd{color:var(--f-red);font-weight:700;}
.qa-input{width:100%; margin-top:7px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:var(--fs-sm); color:var(--text-1); background:var(--surface-1);}
.qa-input:focus{outline:none; border-color:var(--accent); background:#fff;}
.nav-item .n-num{line-height:1.15; text-align:center;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}

}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<div class="app">
  <div class="topbar">

<script>

/* =========================================================================
   GRADE 6 — CHAPTER 9: METHODS OF SEPARATION IN EVERYDAY LIFE
   Activities 9.1–9.6. Every scene runs on a continuous animation loop:
   sliders and buttons only set a TARGET; hands, trays, dishes and funnels
   move on springs and real forces. Skins, husk and grains fall through
   moving air with quadratic drag (terminal speeds: peanut ≈ 13 m/s,
   wheat ≈ 8 m/s, husk ≈ 1 m/s, peanut skin ≈ 0.4 m/s); salt water dries
   and boils by m·c·ΔT and 2260 J/g, with salt appearing once the water
   left is below 36 g salt per 100 g; mud settles by Stokes' law and is
   held back by a filter according to the size of its pores, while the
   growing layer of mud slows the flow. Minutes and hours are compressed
   into seconds by a clock.
   Colour rule: yellow = what you do · air · flame, blue = water · liquids
   · vapour, green = the part we keep, red = the part removed · heat.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', navy:'#1a3a5c'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. SHARED HELPERS — virtual stage, Q→A banner, stick figures,
       cat, cups, particles (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
/* every scene draws on an 800 × 470 virtual stage, fitted into the canvas */
const VW=800, VH=520, BANNER=46;
function stage(ctx,w,h){
  const s=Math.min(w/VW,(h-BANNER-6)/VH), ox=(w-VW*s)/2, oy=BANNER+Math.max(0,(h-BANNER-VH*s)/2);
  ctx.translate(ox,oy); ctx.scale(s,s); return s;
}
/* stick figure — feet on (x,y), height s. angles from straight-down, + = toward +x */
function stick(ctx,x,y,s,o){
  o=o||{}; const c=o.col||COL.ink, W=o.lw||Math.max(2,s*0.02);

  const drop=Math.max(Math.cos(LL[0])*th+Math.cos(LL[1])*sh, Math.cos(LR[0])*th+Math.cos(LR[1])*sh);
  const hip=[x+(o.dx||0), y-drop];
  const lean=o.lean||0;
  const neck=[hip[0]+Math.sin(lean)*0.34*s, hip[1]-Math.cos(lean)*0.34*s];
  const hd=[neck[0]+Math.sin(lean+(o.nod||0))*0.11*s, neck[1]-Math.cos(lean+(o.nod||0))*0.11*s];
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=c; ctx.lineWidth=W;

    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(k[0],k[1]); ctx.lineTo(e[0],e[1]); ctx.stroke(); return e; };
  const fL=limb(hip,LL,th,sh), fR=limb(hip,LR,th,sh);
  ctx.beginPath(); ctx.moveTo(hip[0],hip[1]); ctx.lineTo(neck[0],neck[1]); ctx.stroke();
  const sho=[lerp(hip[0],neck[0],0.92),lerp(hip[1],neck[1],0.92)];
  const hL=limb(sho,o.armL||[-0.25,-0.1],ua,fa), hR=limb(sho,o.armR||[0.25,0.1],ua,fa);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(hd[0],hd[1],0.075*s,0,Math.PI*2); ctx.fill(); ctx.stroke();

function stepParts(P,dt,g,floorY,bounce){
  for(const p of P){ p.vy+=(p.g===undefined?g:p.g)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(floorY!==undefined && p.y>floorY){ if(bounce){ p.y=floorY; p.vy*=-bounce; p.vx*=0.7; } else p.life=0; } }
  for(let i=P.length-1;i>=0;i--) if(P[i].life<=0) P.splice(i,1);
}
function splash(P,x,y,n,col,sp){ for(let i=0;i<n;i++){ const a=-Math.PI*(0.15+0.7*Math.random()); const v=(sp||120)*(0.5+Math.random()); P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.4,r:1.5+Math.random()*2,c:col}); } }

/* line-drawn cup/mug; (cx,by) = bottom centre */
function mug(ctx,cx,by,wTop,wBot,hgt,level,fill,t){
  ctx.save(); ctx.lineJoin='round';

    ctx.beginPath(); ctx.moveTo(cx-wBot/2+3,by-3); ctx.lineTo(cx-wl/2+3,ly); ctx.lineTo(cx+wl/2-3,ly); ctx.lineTo(cx+wBot/2-3,by-3); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();

function steam(ctx,cx,y,wid,inten,t){

/* thermometer with a scale, value in °C; (x,top,bot) */

function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }

function logTable(id,heads){ return `<table class="log"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="${id}"></tbody></table>`; }

function foundBanner(ctx,w,q,ans,pop,t){

function buildScene(factory){

  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.beginPath(); ctx.rect(0,BANNER,w,h-BANNER); ctx.clip(); stage(ctx,w,h); S.tick(dt,ctx,t,$); ctx.restore();

function rgba(h,a){ const c=h[0]==='#'?hexRgb(h):h.match(/[\d.]+/g).map(Number); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function glow(ctx,x,y,r,col,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba(col,a)); g.addColorStop(1,rgba(col,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
const T_RAMP=[[-10,'#2f8fe0'],[15,'#5aa6e6'],[28,'#8195ab'],[45,'#d9a017'],[100,'#d9432b']];
function tempCol(T){ return rampCol(T_RAMP,T); }
function tag(ctx,txt,x,y,col,o){ o=o||{}; const s=o.size||12; ctx.save(); ctx.font='700 '+s+'px Poppins, sans-serif'; const w=ctx.measureText(txt).width+12;
  rrect(ctx,x-w/2,y-s*0.95,w,s*1.5,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  textAt(ctx,txt,x,y+s*0.12,{align:'center',size:s,weight:700,color:col}); ctx.restore(); }
function fmtT(T,d){ d=d===undefined?1:d; if(Math.abs(T)<0.5*Math.pow(10,-d)) T=0; return (T<0?'−':'')+Math.abs(T).toFixed(d===undefined?1:d)+' °C'; }

/* Vertical liquid-in-glass thermometer. (x, top) = top of the tube, bot = top of
   the bulb. Scale lo…hi sits between bot−pad and top+pad. Returns yOf(T).
   o: lo, hi, minor, major, w, bulbL, bulbR, pad, fs, labels, liq, ticks(false),
   chamber (expansion bulge at top), crack 0..1, hl:[v0,v1] highlight band */
function thermoV(ctx,x,top,bot,T,o){
  o=o||{}; const lo=o.lo===undefined?-10:o.lo, hi=o.hi===undefined?110:o.hi, minor=o.minor||1, major=o.major||10;
  const w=o.w||16, bL=o.bulbL||30, bR=o.bulbR||7, pad=o.pad===undefined?14:o.pad, liq=o.liq||COL.red;
  const ppd=(bot-top-2*pad)/(hi-lo), yOf=v=>bot-pad-(v-lo)*ppd;
  ctx.save(); ctx.lineJoin='round';
  /* glass */
  ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=o.lw||2;
  rrect(ctx,x-w/2,top,w,bot-top+3,w/2); ctx.fill(); ctx.stroke();
  if(o.hl){ ctx.fillStyle=rgba(COL.yellow,0.18); const a=yOf(o.hl[1]), b=yOf(o.hl[0]); ctx.fillRect(x-w/2-2,a,w+4+(o.labels===false?0:34),b-a); }
  /* liquid column: below lo it retreats into the bulb, above hi it fills the tube */
  const yc=clamp(yOf(T),top+5,bot+bL*0.6);
  ctx.fillStyle=liq; ctx.fillRect(x-1.9*(o.cw||1),yc,3.8*(o.cw||1),bot+4-yc);
  if(o.chamber && yc<=top+6){ ctx.beginPath(); ctx.arc(x,top+5,w*0.3,0,7); ctx.fill(); }
  /* bulb */
  rrect(ctx,x-bR,bot,2*bR,bL,bR); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke();
  rrect(ctx,x-bR+2.6,bot+2.6,2*bR-5.2,bL-5.2,bR-2.6); ctx.fillStyle=liq; ctx.fill();
  /* scale */
  if(o.ticks!==false){
    const n=Math.round((hi-lo)/minor), dense=ppd*minor<2.4;
    ctx.strokeStyle=COL.ink; ctx.lineWidth=o.tw||1.1;
    for(let i=0;i<=n;i++){ const v=lo+i*minor, y=yOf(v);
      if(o.clip && (y<o.clip[0]-20||y>o.clip[1]+20)) continue;
      const big=Math.abs(v/major-Math.round(v/major))<1e-6, mid=!big&&Math.abs(v/(major/2)-Math.round(v/(major/2)))<1e-6;
      if(dense&&!big&&!mid) continue;
      const L=big?(o.bigL||12):mid?(o.midL||8):(o.minL||5);
      ctx.beginPath(); ctx.moveTo(x+w/2-3,y); ctx.lineTo(x+w/2+L-3,y); ctx.stroke();
      if(big&&o.labels!==false) textAt(ctx,(v<-1e-9?'−':'')+fmt(Math.abs(v),2),x+w/2+L+2,y+(o.fs||11)*0.36,{size:o.fs||11,weight:600,color:COL.muted}); }
    if(o.unit!==false) textAt(ctx,'°C',x+w/2+4,top+pad*0.5,{size:(o.fs||11),weight:700,color:COL.muted});
  }
  if(o.crack>0){ ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.globalAlpha=clamp(o.crack,0,1);
    ctx.beginPath(); ctx.moveTo(x-w/2,top+22); ctx.lineTo(x-2,top+30); ctx.lineTo(x+3,top+24); ctx.lineTo(x+w/2,top+34); ctx.moveTo(x-2,top+30); ctx.lineTo(x-4,top+42); ctx.stroke(); }
  ctx.restore();
  return {yOf,ppd,yc,bulb:[x,bot+bL/2]};
}

/* Digital clinical thermometer: tip at (x,y), body runs along angle ang
   (0 = to the right). s = length in px. txt = display text. */
function digiThermo(ctx,x,y,ang,s,txt,o){
  o=o||{}; const k=s/220;

  ctx.lineWidth=2.4/k*0.9; ctx.strokeStyle=COL.ink;

  /* body */
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(44,-7); ctx.lineTo(96,-16); ctx.lineTo(206,-20); ctx.quadraticCurveTo(222,-20,222,0); ctx.quadraticCurveTo(222,20,206,20); ctx.lineTo(96,16); ctx.lineTo(44,7); ctx.closePath(); ctx.fill(); ctx.stroke();
  /* display window */
  const lit=o.lit===undefined?1:o.lit;
  ctx.fillStyle=o.flash?'#d8f5e3':'#eef6ee'; rrect(ctx,104,-12,72,24,4); ctx.fill(); ctx.stroke();
  /* button */
  ctx.fillStyle=o.press?COL.yellow:'#fff'; ctx.beginPath(); ctx.arc(196,0,7*(o.press?0.85:1),0,7); ctx.fill(); ctx.stroke();
  ctx.restore();

  if(txt && lit>0.05){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(k,k); ctx.translate(140,0);
    if(Math.cos(ang)<0) ctx.rotate(Math.PI);

  if(o.flash){ ctx.save(); const c=[x+Math.cos(ang)*140*k,y+Math.sin(ang)*140*k]; ctx.globalAlpha=0.6*o.flash; circ(ctx,c[0],c[1],50*k+24*(1-o.flash),COL.green,null,2); ctx.restore(); }
}

/* Straight-walled beaker (cx, top, bot, w). Returns the inner box. */

/* side-view head facing right; (x,y) = head centre, s = head height.

function headPath(ctx,x,y,s,m,cont){ const P=(a,b)=>[x+a*s,y+b*s], jaw=m*0.07;

/* An arm hanging from the shoulder (sx,sy) to the wrist (wx,wy), elbow bends
   outward (side = ±1), hand continues along the forearm. s = hand length. */
function armTo(ctx,sx,sy,wx,wy,L1,L2,side,s,o){ o=o||{};
  const dx=wx-sx, dy=wy-sy, d=clamp(Math.hypot(dx,dy),Math.abs(L1-L2)+1,L1+L2-0.5), a=Math.atan2(dy,dx);
  const c=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)), ea=a+side*c;
  const ex=sx+Math.cos(ea)*L1, ey=sy+Math.sin(ea)*L1, fa=Math.atan2(wy-ey,wx-ex);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=COL.ink; ctx.lineWidth=s*0.46; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.lineTo(wx,wy); ctx.stroke();
  ctx.strokeStyle=o.skin||'#fff'; ctx.lineWidth=s*0.46-4.6; ctx.stroke();
  if(o.sleeve){ ctx.strokeStyle=COL.ink; ctx.lineWidth=s*0.6; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(lerp(sx,ex,0.7),lerp(sy,ey,0.7)); ctx.stroke(); ctx.strokeStyle=o.sleeve; ctx.lineWidth=s*0.6-4.6; ctx.stroke(); }
  ctx.restore();
  handDown(ctx,wx,wy,fa-Math.PI/2,s,o); return {ex,ey,fa};
}
/* hand: wrist at (x,y), pointing along +y rotated by ang; s = length */
function handDown(ctx,x,y,ang,s,o){ o=o||{}; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); const k=s/100; ctx.scale(k,k);
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.fillStyle=o.skin||'#fff'; ctx.lineWidth=2.4/k;
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(-23,46); ctx.quadraticCurveTo(-22,98,-8,100); ctx.lineTo(10,100); ctx.quadraticCurveTo(24,98,23,46); ctx.lineTo(20,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth=1.6/k; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*9,62); ctx.lineTo(i*9,96); ctx.stroke(); }
  ctx.lineWidth=2.4/k; ctx.beginPath(); ctx.moveTo(o.thumb||-23,22); ctx.quadraticCurveTo(-38*(o.flip||1),40,-30*(o.flip||1),62); ctx.stroke();
  ctx.restore(); }

/* hop: projectile arc from (x,y) to target over time T (g in px/s²) */
function hopNew(x,y){ return {x,y,x0:x,y0:y,x1:x,y1:y,t:1,T:1,vy0:0,g:2400,sq:spr(0)}; }
function hopTo(h,x1,y1,delay){ h.x0=h.x;h.y0=h.y;h.x1=x1;h.y1=y1; const d=Math.hypot(x1-h.x,y1-h.y); h.T=0.42+d/1400; h.t=-(delay||0); h.vy0=(y1-h.y-0.5*h.g*h.T*h.T)/h.T; }
function hopStep(h,dt){
  if(h.t<h.T){ h.t+=dt; const t=clamp(h.t,0,h.T); h.x=lerp(h.x0,h.x1,t/h.T); h.y=h.y0+h.vy0*t+0.5*h.g*t*t; if(h.t>=h.T){ h.x=h.x1; h.y=h.y1; h.sq.v-=4.5; } }
  springTo(h.sq,0,260,9,dt); return h.t>=0&&h.t<h.T;
}
/* a 2-D point that follows a queue of waypoints on springs (lift → carry → lower) */
function mover(x,y){ return {x:spr(x),y:spr(y),q:[]}; }
function moverGo(m,pts){ m.q=pts.slice(); }
function moverStep(m,dt,k,c){ k=k||70; c=c||15; const tg=m.q[0]; if(!tg) return true;
  springTo(m.x,tg[0],k,c,dt); springTo(m.y,tg[1],k,c,dt);
  if(Math.hypot(m.x.x-tg[0],m.y.x-tg[1])<(m.q.length>1?10:0.6)&&(m.q.length>1||Math.hypot(m.x.v,m.y.v)<6)) m.q.shift();
  return !m.q.length; }

  ctx.save(); ctx.translate(x,y); ctx.scale((flip?-1:1)*s/40,s/40); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2*40/s; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-34,0); ctx.quadraticCurveTo(-12,-24,8,0); ctx.quadraticCurveTo(-12,24,-34,0); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-2,0,6,10,0,0,7); ctx.fillStyle=COL.ink; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-36,-14); ctx.quadraticCurveTo(-14,-34,8,-12); ctx.stroke();
  ctx.restore(); }
/* clock face showing elapsed simulated time */
function clockDraw(ctx,x,y,r,sec,lab){ circ(ctx,x,y,r,COL.ink,'#fff',2.2);
  const m=sec/60; line(ctx,x,y,x+Math.sin(m/60*6.283)*r*0.5,y-Math.cos(m/60*6.283)*r*0.5,COL.ink,2.6); line(ctx,x,y,x+Math.sin(m*6.283)*r*0.8,y-Math.cos(m*6.283)*r*0.8,COL.ink,1.6);
  for(let i=0;i<12;i++){ const a=i/12*6.283; line(ctx,x+Math.sin(a)*r*0.82,y-Math.cos(a)*r*0.82,x+Math.sin(a)*r*0.95,y-Math.cos(a)*r*0.95,COL.mid,1.2); }
  if(lab) textAt(ctx,lab,x,y+r+15,{align:'center',size:12,weight:700,color:COL.muted}); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'; }
/* sounds */
let _sfx=null; function sfxCtx(){ try{ if(!_sfx&&typeof AudioContext!=='undefined') _sfx=new AudioContext(); }catch(e){} return _sfx; }
function beep(freq,dur,gain){ const a=sfxCtx(); if(!a) return; try{ const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=freq||2800; g.gain.value=gain||0.03; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.12)); }catch(e){} }

       surface, condensing droplets, balance, ice cubes, vapour dots

/* magnifying lens: small ring at (sx,sy) on the object, big view at (cx,cy) */
function lensView(ctx,cx,cy,R,sx,sy,draw){
  const d=Math.hypot(cx-sx,cy-sy)||1, a=Math.atan2(cy-sy,cx-sx), s=Math.asin(clamp((R-8)/d,-1,1));
  ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
  [1,-1].forEach(k=>{ const b=a+k*(Math.PI/2+s); ctx.beginPath(); ctx.moveTo(sx+Math.cos(b)*14,sy+Math.sin(b)*14); ctx.lineTo(cx+Math.cos(b)*R,cy+Math.sin(b)*R); ctx.stroke(); });
  ctx.restore(); circ(ctx,sx,sy,14,COL.yellow,null,2.4);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip(); draw(); ctx.restore();
  circ(ctx,cx,cy,R,COL.ink,null,3.2); circ(ctx,cx,cy,R+4,COL.mid,null,1);
}
function hmin(sec){ sec=Math.max(0,sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60); return h?h+' h '+String(m).padStart(2,'0')+' min':m+' min '+String(Math.floor(sec%60)).padStart(2,'0')+' s'; }
function clock12(sec){ const m=Math.floor(sec/60)%1440, h=Math.floor(m/60), mm=m%60; return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+(h<12?' am':' pm'); }

/* ---- moist air ------------------------------------------------------ */
function esat(T){ return 0.61094*Math.exp(17.625*T/(T+243.04)); }              // kPa (Magnus)
function rhoV(T,RH){ return 2167*esat(T)*(RH===undefined?1:RH)/(T+273.15); }    // g of vapour per m³
function dewPt(T,RH){ const g=Math.log(Math.max(1e-4,RH))+17.625*T/(T+243.04); return 243.04*g/(17.625-g); }
function hConv(wind){ return 5+6*(wind||0); }                                     // W/m²K, still air → fan
/* temperature of a wet surface: heat in (air + sun) = heat carried off by evaporation */
function surfT(Ta,RH,h,qSun){ let lo=Ta-40, hi=Ta+60; const k=2450*h/1206, ra=rhoV(Ta,RH);
  for(let i=0;i<46;i++){ const m=(lo+hi)/2, f=h*(Ta-m)+(qSun||0)-k*(rhoV(m,1)-ra); if(f>0) lo=m; else hi=m; } return (lo+hi)/2; }
/* same, but the dish also takes heat from what it stands on (hs, W/m²K) */
function surfT2(Ta,RH,h,hs,qSun,Tsup){ let lo=Ta-40, hi=Ta+60; const k=2450*h/1206, ra=rhoV(Ta,RH), Tg=Tsup===undefined?Ta:Tsup;
  for(let i=0;i<46;i++){ const m=(lo+hi)/2, f=h*(Ta-m)+hs*(Tg-m)+(qSun||0)-k*(rhoV(m,1)-ra); if(f>0) lo=m; else hi=m; } return (lo+hi)/2; }
/* evaporation (+) or condensation (−) flux, g per m² per second */
function vapFlux(Ts,Ta,RH,h){ return (h/1206)*(rhoV(Ts,1)-rhoV(Ta,RH)); }

/* ---- polygons ------------------------------------------------------- */
function polyArea(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; }
function clipBelow(P,L){ const out=[]; for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length], ia=a[1]>=L, ib=b[1]>=L;
    if(ia) out.push(a); if(ia!==ib){ const t=(L-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*t,L]); } } return out; }
function xform(P,x,y,ang){ const c=Math.cos(ang), s=Math.sin(ang); return P.map(p=>[x+p[0]*c-p[1]*s, y+p[0]*s+p[1]*c]); }
function levelFor(P,A){ let lo=Infinity, hi=-Infinity; P.forEach(p=>{ lo=Math.min(lo,p[1]); hi=Math.max(hi,p[1]); });
  if(A<=0) return hi; let a=lo, b=hi; for(let i=0;i<40;i++){ const m=(a+b)/2; if(polyArea(clipBelow(P,m))>A) a=m; else b=m; } return (a+b)/2; }
function pathPoly(ctx,P){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }

/* ---- vessels: an axisymmetric (or square) profile r(y), y = height above the floor ---
   pts = interior outline in local coords (origin = inside floor centre, up = −y).
   V(h) in mL using px→cm scale ppc (px per cm). */
function vesselMake(prof,H,ppc,o){ o=o||{}; const n=48, R=[], Vc=[0], Ac=[0];
  for(let i=0;i<=n;i++){ const y=H*i/n; R.push([prof(y/H),y]); }
  for(let i=1;i<=n;i++){ const r=(R[i][0]+R[i-1][0])/2, dy=H/n; const r2=o.square?4*r*r:Math.PI*r*r; Vc.push(Vc[i-1]+r2*dy/(ppc*ppc*ppc)); Ac.push(Ac[i-1]+2*r*dy); }
  const pts=[]; for(let i=0;i<=n;i++) pts.push([R[i][0],-R[i][1]]); for(let i=n;i>=0;i--) pts.push([-R[i][0],-R[i][1]]);
  return {prof,H,ppc,R,Vc,Ac,pts,n,cap:Vc[n],wall:o.wall||3,name:o.name||'',square:!!o.square,lip:o.lip||0}; }
function vesselH(v,V){ if(V<=0) return 0; for(let i=1;i<=v.n;i++) if(v.Vc[i]>=V){ const f=(V-v.Vc[i-1])/(v.Vc[i]-v.Vc[i-1]); return v.H*(i-1+f)/v.n; } return v.H; }
function vesselA(v,h){ const f=clamp(h/v.H,0,1)*v.n, i=Math.floor(f); if(i>=v.n) return v.Ac[v.n]; return lerp(v.Ac[i],v.Ac[i+1],f-i); }
/* place the vessel: floor centre at (x,y), tilted by ang. Returns world interior, level, lip */
function vesselState(v,x,y,ang,V){ const W=xform(v.pts,x,y,ang), A=vesselA(v,vesselH(v,V)), L=levelFor(W,A);
  const rl=xform([[-v.R[v.n][0],-v.H],[v.R[v.n][0],-v.H]],x,y,ang), lip=rl[0][1]>rl[1][1]?rl[0]:rl[1];
  return {W,L,lip,rim:rl,water:A>0.5?clipBelow(W,L):[]}; }
function vesselDraw(ctx,v,x,y,ang,o){ o=o||{}; const st=o.st;
  if(st&&st.water.length>2){ ctx.save(); pathPoly(ctx,st.water); ctx.fillStyle=rgba(o.col||COL.blue,o.alpha||0.2); ctx.fill();
    /* the free surface: always horizontal */
    const xs=st.water.filter(p=>Math.abs(p[1]-st.L)<0.6).map(p=>p[0]); if(xs.length>1){ const a=Math.min(...xs), b=Math.max(...xs);
      ctx.strokeStyle=o.col||COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); for(let X=a;X<=b;X+=4) { const yy=st.L+Math.sin(X*0.08+(o.t||0)*5)*(o.wave||0); X===a?ctx.moveTo(X,yy):ctx.lineTo(X,yy); } ctx.lineTo(b,st.L); ctx.stroke(); }
    ctx.restore(); }
  /* walls: outer U and inner U, both rotated with the vessel */
  const n=v.n, wl=v.wall;
  const outer=xform(v.R.map(([r,yy])=>[-r-wl,-yy]).reverse().concat([[-v.R[0][0]-wl,wl],[v.R[0][0]+wl,wl]]).concat(v.R.map(([r,yy])=>[r+wl,-yy])),x,y,ang);
  const inner=xform(v.R.map(([r,yy])=>[-r,-yy]).reverse().concat(v.R.map(([r,yy])=>[r,-yy])),x,y,ang);
  ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=o.ink||COL.ink; ctx.lineWidth=o.lw||2.4;
  ctx.beginPath(); outer.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  ctx.lineWidth=(o.lw||2.4)*0.55; ctx.globalAlpha=0.7; ctx.beginPath(); inner.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.globalAlpha=1;
  /* rim caps */
  [[-1],[1]].forEach(([sg])=>{ const q=xform([[sg*v.R[n][0],-v.H],[sg*(v.R[n][0]+wl),-v.H]],x,y,ang); ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); ctx.lineTo(q[1][0],q[1][1]); ctx.lineWidth=o.lw||2.4; ctx.stroke(); });
  /* rim ellipse (only when upright-ish) */
  if(Math.abs(ang)<0.5&&!v.square){ const c=xform([[0,-v.H]],x,y,ang)[0]; ctx.lineWidth=(o.lw||2.4)*0.8; ctx.beginPath(); ctx.ellipse(c[0],c[1],v.R[n][0]+wl/2,Math.max(2,(v.R[n][0])*0.12)*Math.cos(ang),ang,0,7); ctx.stroke(); }
  ctx.restore(); }
/* standard vessel profiles (fractions of height → radius in px) */
const VES={
  glass:(ppc)=>vesselMake(f=>lerp(30,37,f),118,ppc,{name:'glass tumbler'}),
  tall:(ppc)=>vesselMake(f=>20,170,ppc,{name:'tall narrow bottle'}),
  bowl:(ppc)=>vesselMake(f=>14+66*Math.sqrt(Math.sin(f*Math.PI/2)),62,ppc,{name:'wide bowl'}),
  box:(ppc)=>vesselMake(f=>44,74,ppc,{name:'square box',square:true}),
  flask:(ppc)=>vesselMake(f=>f<0.62?lerp(56,18,f/0.62):18,140,ppc,{name:'conical flask'}),
  cup:(ppc)=>vesselMake(f=>lerp(26,34,f),70,ppc,{name:'cup'}),
};

/* liquid stream blobs (pouring): g in px/s² */
function streamStep(B,dt,g,hit){ for(const b of B){ b.vy+=g*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.age+=dt; if(hit(b)) b.dead=1; if(b.y>900) b.dead=1; }
  for(let i=B.length-1;i>=0;i--) if(B[i].dead) B.splice(i,1); }
function streamDraw(ctx,B,col){ ctx.save(); ctx.fillStyle=rgba(col||COL.blue,0.55); ctx.strokeStyle=col||COL.blue; ctx.lineWidth=1;
  for(const b of B){ const r=clamp(1.2+Math.sqrt(b.vol)*1.1,1.2,5); ctx.beginPath(); ctx.ellipse(b.x,b.y,r*0.8,r*(1+Math.min(1.4,Math.abs(b.vy)/600)),Math.atan2(b.vy,b.vx)-Math.PI/2,0,7); ctx.fill(); } ctx.restore(); }

/* ---- condensing droplets on a surface rect {x0,x1,y0,y1} --------------------
   g = film growth in px of water thickness per second (− = drying).
   drop volume ~ hemisphere (2/3)πr³; share of the flux ∝ r; drops merge on
   contact; past rS they slide down, sweeping others, and leave a trail. */
function dropsNew(R,o){ o=o||{}; return {R,D:[],T:[],nuc:0,rS:o.rS||4.2,max:o.max||420,drained:0,film:0,seed:rng(o.seed||7),nucRate:o.nucRate||400,r0:o.r0||0.35,vmax:o.vmax||110,acc:o.acc||420,dry:o.dry||6}; }
function dropsStep(F,dt,g){
  const R=F.R, D=F.D, area=(R.x1-R.x0)*(R.y1-R.y0), rnd=F.seed;
  if(g>0){ F.nuc+=dt*F.nucRate; while(F.nuc>1&&D.length<F.max){ F.nuc-=1; const x=R.x0+rnd()*(R.x1-R.x0), y=R.y0+rnd()*(R.y1-R.y0); if(!D.some(d=>Math.abs(d.x-x)<d.r+F.r0&&Math.abs(d.y-y)<d.r+F.r0)) D.push({x,y,r:F.r0,v:0,sl:0}); } if(D.length>=F.max) F.nuc=0;
    let sr=0; D.forEach(d=>sr+=d.r); const dv=g*dt*area; if(sr>0) D.forEach(d=>{ if(d.y<R.y0) return; const V=(2/3)*Math.PI*d.r**3+dv*d.r/sr; d.r=Math.cbrt(V/(2/3/1)/Math.PI); }); }
  else if(g<0){ D.forEach(d=>{ d.r+=g*dt*F.dry/Math.max(F.r0*2,d.r); }); for(let i=D.length-1;i>=0;i--) if(D[i].r<0.25) D.splice(i,1); }
  /* sliding (stick–slip): speed grows with how far past the pinning size */
  for(const d of D){ if(d.r>F.rS){ d.v=Math.min(F.vmax,d.v+dt*F.acc*(d.r/F.rS-1)+dt*F.acc*0.07); d.sl=1; } else { d.v=Math.max(0,d.v-dt*F.acc*0.7); }
    if(d.v>0){ d.y+=d.v*dt; F.T.push({x:d.x,y:d.y,w:d.r*0.9,a:1}); } }
  /* coalescence */
  D.sort((a,b)=>a.y-b.y);
  for(let i=0;i<D.length;i++){ const a=D[i]; if(a.dead) continue;
    for(let j=i+1;j<D.length;j++){ const b=D[j]; if(b.y-a.y>a.r+b.r+6) break; if(b.dead) continue;
      if(Math.hypot(a.x-b.x,a.y-b.y)<(a.r+b.r)*0.92){ const va=a.r**3, vb=b.r**3, big=va>=vb?a:b, sm=big===a?b:a;
        big.x=(a.x*va+b.x*vb)/(va+vb); if(!big.sl) big.y=(a.y*va+b.y*vb)/(va+vb); big.r=Math.cbrt(va+vb); big.v=Math.max(a.v,b.v); sm.dead=1; } } }
  for(let i=D.length-1;i>=0;i--){ const d=D[i]; if(d.y>R.y1+d.r*0.5){ F.drained+=(2/3)*Math.PI*d.r**3; d.dead=1; } if(d.dead) D.splice(i,1); }
  for(const s of F.T) s.a-=dt*(F.fade||0.18); F.T=F.T.filter(s=>s.a>0); if(F.T.length>1600) F.T.splice(0,F.T.length-1600);
  let v=0; D.forEach(d=>v+=(2/3)*Math.PI*d.r**3); F.film=v;
}
function dropsDraw(ctx,F,o){ o=o||{}; const tx=o.tx||(x=>x), ty=o.ty||(y=>y), k=o.k||1;
  ctx.save();
  for(const s of F.T){ ctx.globalAlpha=s.a*0.25; ctx.fillStyle=COL.blue; ctx.fillRect(tx(s.x,s.y)-s.w*k*0.5,ty(s.y)-1,s.w*k,2.4); }
  for(const d of F.D){ const r=d.r*k, x=tx(d.x,d.y), y=ty(d.y);
    if(r<1){ ctx.globalAlpha=0.3+0.5*r; ctx.fillStyle='#8fbbe8'; ctx.fillRect(x-0.7,y-0.7,1.4,1.4); continue; }
    ctx.globalAlpha=1; ctx.beginPath(); ctx.ellipse(x,y,r,r*(d.sl?1.15:1),0,0,7); ctx.fillStyle=rgba(COL.blue,0.22); ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=Math.min(1.4,0.4+r*0.2); ctx.stroke();
    if(r>1.6){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-r*0.35,y-r*0.38,r*0.22,0,7); ctx.fill(); } }
  ctx.restore(); }

/* ---- objects ----------------------------------------------------------- */
/* ice cube in light oblique view; (x,y) = centre of the front face, s = side, a = tilt, m = melt 0..1 (rounding) */
function iceCube(ctx,x,y,s,a,m,o){ o=o||{}; if(s<1.5) return; const d=s*0.32, r=s*(0.08+0.3*clamp(m||0,0,1));
  ctx.save(); ctx.translate(x,y); ctx.rotate(a||0); ctx.lineJoin='round';
  ctx.fillStyle='#eef6ff'; ctx.strokeStyle=o.col||COL.blue; ctx.lineWidth=o.lw||1.8;
  ctx.beginPath(); ctx.moveTo(-s/2,-s/2); ctx.lineTo(-s/2+d,-s/2-d); ctx.lineTo(s/2+d,-s/2-d); ctx.lineTo(s/2+d,s/2-d); ctx.lineTo(s/2,s/2); ctx.closePath(); ctx.fill(); ctx.stroke();
  rrect(ctx,-s/2,-s/2,s,s,r); ctx.fillStyle='#f6fbff'; ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#a9cdf0'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-s*0.3,-s*0.26); ctx.lineTo(-s*0.05,-s*0.32); ctx.moveTo(-s*0.32,-s*0.1); ctx.lineTo(-s*0.22,-s*0.3); ctx.stroke();
  if(o.drip){ ctx.fillStyle=rgba(COL.blue,0.5); ctx.beginPath(); ctx.ellipse(s*0.3,s/2+2,1.8,2.6,0,0,7); ctx.fill(); }
  ctx.restore(); }
/* digital balance: pan top at y, centre x; reading string */

  ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x-w/2-14,y+56); ctx.lineTo(x-w/2+4,y+16); ctx.lineTo(x+w/2-4,y+16); ctx.lineTo(x+w/2+14,y+56); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.restore(); }
/* green vapour dot */
function vdot(ctx,x,y,a,r){ ctx.globalAlpha=clamp(a,0,1); ctx.beginPath(); ctx.arc(x,y,r||2.2,0,7); ctx.fill(); }
/* wavy vapour rising (green), invisible in real life */
function vapourWisp(ctx,x,y,len,t,a,ph){ if(a<=0.02) return; ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.setLineDash([2,4]); ctx.globalAlpha=clamp(a,0,1);
  const p=((t*0.5+(ph||0))%1); ctx.beginPath(); for(let k=0;k<=10;k++){ const yy=y-k*len/10-p*len*0.3, xx=x+Math.sin(k*0.7+t*2+(ph||0)*6)*5; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore(); }
/* steel plate seen from the side (thin dish) */

  ctx.beginPath(); ctx.moveTo(x-w/2,y-9); ctx.quadraticCurveTo(x-w/2+14,y,x-w/2+28,y); ctx.lineTo(x+w/2-28,y); ctx.quadraticCurveTo(x+w/2-14,y,x+w/2,y-9); ctx.lineTo(x+w/2-5,y-11); ctx.quadraticCurveTo(x+w/2-16,y-4,x+w/2-30,y-4); ctx.lineTo(x-w/2+30,y-4); ctx.quadraticCurveTo(x-w/2+16,y-4,x-w/2+5,y-11); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
/* bottle cap side view: (x, y = bottom) width w, height h */

  ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x-w/2,y-h); ctx.lineTo(x-w/2,y); ctx.lineTo(x+w/2,y); ctx.lineTo(x+w/2,y-h); ctx.stroke();
  ctx.lineWidth=1; for(let xx=x-w/2+4;xx<x+w/2-2;xx+=4) line(ctx,xx,y-h+3,xx,y-3,'rgba(19,42,68,0.14)',1);
  ctx.restore(); }

/* ---------------------------------------------------------------------
   0f. CHAPTER-9 KIT — falling through moving air, heaps, grains, husk,
       peanuts, soop, palms, dropper, spoon, crystals, spirit lamp
   --------------------------------------------------------------------- */
const G9=9.81;
/* one particle through moving air, quadratic drag, SI units, y DOWN.
   p = {vx,vy,k}; k = ρ·Cd·A/(2m) in 1/m, so terminal speed = √(g/k).
   Linearly implicit, so it is stable even for a feather-light skin. */
function dragVel(p,dt,ux,uy){ const rx=p.vx-ux, ry=p.vy-uy, c=p.k*Math.hypot(rx,ry)*dt;
  p.vx=(p.vx+c*ux)/(1+c); p.vy=(p.vy+c*uy+G9*dt)/(1+c); }
function vTerm(k){ return Math.sqrt(G9/k); }

/* heaps on the ground: stacked histograms, one layer per kind */
function heapNew(x0,x1,dx){ const n=Math.ceil((x1-x0)/dx); return {x0,dx,n,L:{},order:[]}; }
function heapAdd(H,key,x,h){ if(!H.L[key]){ H.L[key]=new Float32Array(H.n); H.order.push(key); }
  const f=(x-H.x0)/H.dx, i=Math.floor(f); const w=[0.25,0.5,0.25];
  for(let k=-1;k<=1;k++){ const j=i+k; if(j>=0&&j<H.n) H.L[key][j]+=h*w[k+1]; } }
function heapTop(H,x){ const i=Math.floor((x-H.x0)/H.dx); if(i<0||i>=H.n) return 0; let s=0; H.order.forEach(k=>s+=H.L[k][i]); return s; }
/* let the pile slump to its angle of repose (max step per bin) */
function heapRelax(H,maxStep){ const tot=new Float32Array(H.n); H.order.forEach(k=>{ const a=H.L[k]; for(let i=0;i<H.n;i++) tot[i]+=a[i]; });
  for(let i=0;i<H.n-1;i++){ const d=tot[i]-tot[i+1]; if(Math.abs(d)>maxStep){ const mv=(Math.abs(d)-maxStep)*0.25*Math.sign(d), from=d>0?i:i+1, to=d>0?i+1:i;
      const T=tot[from]; if(T<=0) continue; H.order.forEach(k=>{ const a=H.L[k], q=Math.abs(mv)*a[from]/T; a[from]-=q; a[to]+=q; }); tot[from]-=Math.abs(mv); tot[to]+=Math.abs(mv); } } }
function heapDraw(ctx,H,gy,cols){ const base=new Float32Array(H.n);
  H.order.forEach(key=>{ const a=H.L[key], c=cols[key]||COL.ink; ctx.save(); ctx.beginPath(); ctx.moveTo(H.x0,gy);
    for(let i=0;i<H.n;i++){ const x=H.x0+(i+0.5)*H.dx; ctx.lineTo(x,gy-base[i]-a[i]); }
    ctx.lineTo(H.x0+H.n*H.dx,gy); for(let i=H.n-1;i>=0;i--){ const x=H.x0+(i+0.5)*H.dx; ctx.lineTo(x,gy-base[i]); } ctx.closePath();
    ctx.fillStyle=rgba(c,0.22); ctx.fill();
    ctx.beginPath(); let on=false; for(let i=0;i<H.n;i++){ const x=H.x0+(i+0.5)*H.dx, y=gy-base[i]-a[i]; if(a[i]>0.3){ on?ctx.lineTo(x,y):ctx.moveTo(x,y); on=true; } else on=false; }
    ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    for(let i=0;i<H.n;i++) base[i]+=a[i]; }); }
function heapSum(H,key,x0,x1){ const a=H.L[key]; if(!a) return 0; let s=0; for(let i=0;i<H.n;i++){ const x=H.x0+(i+0.5)*H.dx; if(x>=x0&&x<=x1) s+=a[i]; } return s; }

/* ---- small things --------------------------------------------------- */

/* soop (bamboo winnowing tray), side view: back edge at (x,y), tilt ang (+ = front lip down) */

  ctx.beginPath(); ctx.moveTo(-270,132); ctx.lineTo(-104,12); ctx.quadraticCurveTo(-60,3,-20,6); ctx.quadraticCurveTo(30,9,60,5); ctx.quadraticCurveTo(102,-2,122,-28);

  ctx.lineWidth=1.3/s; ctx.strokeStyle='rgba(19,42,68,0.4)'; ctx.beginPath(); ctx.moveTo(66,12); ctx.quadraticCurveTo(104,4,130,-24); ctx.moveTo(70,20); ctx.quadraticCurveTo(112,12,138,-10); ctx.moveTo(-20,30); ctx.quadraticCurveTo(10,34,40,30); ctx.stroke();
  ctx.lineWidth=2.4/s; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-74,10); ctx.quadraticCurveTo(-46,-16,-14,-20); ctx.quadraticCurveTo(2,-20,-2,-10); ctx.quadraticCurveTo(-24,-4,-40,8); ctx.fill(); ctx.stroke();

/* =====================================================================
   9.1 A  LET US EXPLORE — rub roasted peanuts between the palms, then blow
   Each peanut carries 4 skin flakes. Every rubbing stroke loosens a flake
   with probability 0.16 (roasted) or 0.006 (raw). Blowing: a jet from the
   lips, u = u₀·e^(−a/0.30 m)·e^(−(r/w)²), w = 1.2 cm + 0.2·a, so at the
   palm (a ≈ 0.25 m) the air is ≈ 0.43·u₀. A loose flake lifts when the
   local air beats its grip (0.8–3 m/s, some are tucked under peanuts),
   then flies with quadratic drag: skin k = 60 /m (falls at 0.4 m/s),
   peanut k = 0.055 /m (13 m/s) — a peanut would need ≈ 9 m/s of air at
   the palm to roll, which a person cannot blow. Flight is shown at ×0.4.
   ===================================================================== */
function buildA1(){ return buildScene(wrap=>{
  const S={q:'Rub roasted peanuts between your palms, then blow. Which gets blown away: the peanuts or the skins?'};
  const PX=1100, PALM={x:520,y:350}, SC=1.3, TABLE=474, MOUTH={x:247,y:282}, BOWL={x:405,y:TABLE};
  const AIM=[PALM.x-MOUTH.x,PALM.y-14-MOUTH.y], AL=Math.hypot(...AIM), D=[AIM[0]/AL,AIM[1]/AL];
  let raw=false, u0=5, pred=-1, nuts=[], flakes=[], strokes=0, rubT=0, rubPh=0, lastSg=1, open=spr(0), openT=0, blowT=0, tip=spr(0), tipT=0, tipped=false, blownAny=false;
  const rnd=rng(9);
  const reset=()=>{ nuts=[]; flakes=[]; strokes=0; rubT=0; blowT=0; openT=0; open.x=open.v=0; tip.x=tip.v=0; tipT=0; tipped=false; blownAny=false;
    for(let i=0;i<10;i++){ const layer=i>=6?1:0, dx=layer?-40+(i-6)*26:-62+i*24; nuts.push({dx,layer,a:(rnd()-0.5)*0.8,skin:[1,1,1,1],jx:0,jy:0,h:null,inBowl:false}); } };
  reset();
  /* air speed (m/s) at a stage point */
  const air=(x,y)=>{ if(blowT<=0) return [0,0]; const px=x-MOUTH.x, py=y-MOUTH.y, al=px*D[0]+py*D[1]; if(al<=0) return [0,0];
    const ac=-px*D[1]+py*D[0], a=al/PX, w=(0.012+0.2*a)*PX, ramp=clamp(Math.min(2.5-blowT,blowT)/0.25,0,1);
    const u=u0*Math.exp(-a/0.30)*Math.exp(-(ac/w)*(ac/w))*ramp; return [u*D[0],u*D[1]]; };
  const palmY=(dx,ang)=>PALM.y+SC*palmSurf(dx/SC)+dx*Math.sin(ang);
  S.html=`
    <div class="control-group"><label>Predict: which gets blown away?</label>${chipList('pr',['Peanuts','Skins','Both'],-1)}</div>
    <div class="control-group"><label>Peanuts</label>${chipList('kd',['Roasted','Raw'],0)}
      <button class="toggle-btn navy" id="rub">🤲 Rub between the palms ×10</button></div>
    ${slider('bl','Blow strength at your lips',1,10,0.5,5)}
    <div class="control-group">
      <button class="toggle-btn navy" id="blow" style="margin-top:0">💨 Blow across the palm</button>
      <button class="toggle-btn" id="tipb" style="width:100%;margin-top:6px">🥣 Tip the palm into the bowl</button>
      <button class="toggle-btn" id="rs" style="width:100%;margin-top:6px">Start again</button></div>`;
  S.cards=card('c1','Rubbing strokes')+card('c2','Skins loosened',COL.red)+card('c3','Skins still on palm',COL.red)+card('c4','Air at the palm',COL.yellow);
  S.wire=$=>{
    wireChips(wrap,'pr',i=>pred=i);
    wireChips(wrap,'kd',i=>{ raw=!!i; reset(); });
    $('#bl').oninput=e=>{ u0=+e.target.value; };
    $('#rub').onclick=()=>{ if(tipped) reset(); openT=0; rubT=10/4.4; };
    $('#blow').onclick=()=>{ if(tipped) return; rubT=0; openT=1; blowT=-1; };
    $('#tipb').onclick=()=>{ if(tipped||rubT>0) return; openT=1; tipT=1; };
    $('#rs').onclick=reset;
  };
  S.tick=(dt,ctx,t,$)=>{
    setv($,'blV',fmt(u0,1)+' m/s');
    /* rubbing: top palm slides ±16 px at 2.2 strokes per second each way */
    let slide=0;
    if(rubT>0&&open.x<0.08){ rubT-=dt; rubPh+=dt*2.2*Math.PI*2; slide=16*Math.sin(rubPh); const sg=Math.sign(Math.cos(rubPh))||1;
      if(sg!==lastSg){ lastSg=sg; strokes++; const p=raw?0.006:0.16;
        nuts.forEach(n=>n.skin.forEach((v,k)=>{ if(v&&rnd()<p){ n.skin[k]=0; flakes.push({st:0,dx:n.dx+(rnd()-0.5)*24,lay:n.layer+0.5+rnd()*0.8,a:rnd()*6,va:0,x:0,y:0,vx:0,vy:0,k:60,thr:0.8+2.2*rnd()*rnd()+ (rnd()<0.2?1.2:0)}); } })); } }
    else if(rubT>0) rubT=Math.max(0,rubT-dt*0.1);
    if(blowT<0&&open.x>0.93) blowT=2.5;
    springTo(open,openT,40,10,dt);
    if(blowT>0){ blowT-=dt*0.6; if(blowT<=0) blowT=0; }
    springTo(tip,tipT,30,8,dt);
    const ang=-0.42*tip.x;
    /* tip: when the palm is steep enough, peanuts and resting skins hop into the bowl */
    if(tipT===1&&tip.x>0.7&&!tipped){ tipped=true; nuts.forEach((n,i)=>{ n.h=hopNew(n.x,n.y); n.h.g=1600; hopTo(n.h,BOWL.x-40+(i%5)*20,BOWL.y-14-Math.floor(i/5)*11,i*0.05); n.inBowl=true; });
      flakes.forEach((f,i)=>{ if(f.st===0){ f.h=hopNew(f.x,f.y); f.h.g=1600; hopTo(f.h,BOWL.x-30+rnd()*60,BOWL.y-26,0.1+i*0.02); f.st=4; } }); }
    if(tipped&&tip.x>0.9) tipT=0;
    /* peanut positions */
    const topX=PALM.x+18+slide+open.x*420, topY=PALM.y-46-open.x*120;
    nuts.forEach((n,i)=>{ if(n.h){ hopStep(n.h,dt); n.x=n.h.x; n.y=n.h.y; return; }
      const jig=rubT>0?Math.sin(t*17+i*2.3)*1.4:0, [ax]=air(PALM.x+n.dx,PALM.y);
      n.a+=(slide?Math.cos(rubPh)*0.08*(n.layer?1:0.5):0)+ax*ax*0.0006*Math.sin(t*30+i);
      n.x=PALM.x+n.dx+slide*(0.3+0.4*n.layer); n.y=palmY(n.dx,ang)-11-n.layer*16*(1-0.25*(1-open.x))+jig; });
    /* skin flakes */
    flakes.forEach(f=>{
      if(f.st===0){ f.x=PALM.x+f.dx+slide*0.5; f.y=palmY(f.dx,ang)-5-f.lay*15; const [ux,uy]=air(f.x,f.y);
        if(Math.hypot(ux,uy)>f.thr){ f.st=1; f.vy=-0.25; f.vx=0.3*ux; f.va=(rnd()-0.5)*30; blownAny=true; } }
      else if(f.st===1){ const h=dt*0.4/3; for(let k=0;k<3;k++){ const [ux,uy]=air(f.x,f.y); dragVel(f,h,ux,uy); f.vx+=gauss()*1.6*h; f.vy+=gauss()*1.6*h; f.x+=f.vx*h*PX; f.y+=f.vy*h*PX; }
        f.a+=f.va*dt*0.4; if(f.y>=TABLE-2){ f.y=TABLE-2; f.st=2; } if(f.x>830||f.y<-60) f.st=3; }
      else if(f.st===4){ hopStep(f.h,dt); f.x=f.h.x; f.y=f.h.y; } });
    /* ---- draw ---- */
    tableTop(ctx,330,790,TABLE,0);
    /* bowl */
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(BOWL.x-62,BOWL.y-40); ctx.quadraticCurveTo(BOWL.x-58,BOWL.y,BOWL.x,BOWL.y); ctx.quadraticCurveTo(BOWL.x+58,BOWL.y,BOWL.x+62,BOWL.y-40); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(BOWL.x,BOWL.y-40,62,7,0,0,7); ctx.stroke(); ctx.restore();
    /* the blower */
    const blowing=blowT>0;
    headSide(ctx,190,250,150,{mouth:blowing?0.25:0,kid:1});
    if(blowing){ circ(ctx,MOUTH.x+3,MOUTH.y,4,COL.ink,'#fff',2); }
    /* air streamlines */
    if(blowing){ const A=clamp(Math.min(2.5-blowT,blowT)/0.25,0,1)*clamp(u0/6,0.35,1);
      ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.setLineDash([10,9]); ctx.lineDashOffset=-t*u0*70; ctx.globalAlpha=A;
      for(let j=-2;j<=2;j++){ ctx.beginPath(); for(let s=8;s<=430;s+=12){ const a=s/PX, w=(0.012+0.2*a)*PX*0.55*j, x=MOUTH.x+D[0]*s-D[1]*w, y=MOUTH.y+D[1]*s+D[0]*w+Math.sin(s*0.05-t*12+j)*2; s===8?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
      ctx.restore(); }
    /* bottom palm, contents, top palm */
    palmDraw(ctx,PALM.x,PALM.y,ang,1,SC);
    flakes.forEach(f=>{ if(f.st===0||f.st===4) flakeDraw(ctx,f.x,f.y,f.a,6); });
    nuts.forEach(n=>peanutDraw(ctx,n.x,n.y,n.a,12,n.skin));
    if(open.x<0.98) palmDraw(ctx,topX,topY,0,-1,SC,-1);
    flakes.forEach(f=>{ if(f.st===1||f.st===2) flakeDraw(ctx,f.x,f.y,f.a,6); });
    if(rubT>0&&open.x<0.1){ vec(ctx,PALM.x-25,PALM.y-150,PALM.x+25,PALM.y-150,COL.yellow,2.4); vec(ctx,PALM.x+25,PALM.y-138,PALM.x-25,PALM.y-138,COL.yellow,2.4); textAt(ctx,'rub',PALM.x,PALM.y-160,{align:'center',size:12,weight:700,color:COL.yellow}); }
    if(blowing){ tag(ctx,'slow motion ×0.4',700,40,COL.mid,{size:11}); }
    /* tallies */
    const tot=nuts.length*4, loose=flakes.length, onPalm=flakes.filter(f=>f.st===0).length, gone=flakes.filter(f=>f.st===1||f.st===2||f.st===3).length;
    const lt=flakes.filter(f=>f.st===2||f.st===3).length; if(lt) tag(ctx,lt+' skins blown away →',690,TABLE+28,COL.red,{size:11});
    const [ux,uy]=air(PALM.x,PALM.y-8);
    setv($,'c1',String(strokes)); setv($,'c2',loose+' of '+tot); setv($,'c3',String(onPalm)); setv($,'c4',fmt(Math.hypot(ux,uy),1)+' m/s');

    if(pred<0) return ['warn','Make a prediction first.'];

  return S;
}); }

/* =====================================================================
   9.1 B  WINNOWING (Fig. 9.4) — a farmer on a raised platform tips the
   soop so the threshed mixture falls through the wind.
   Every piece falls with quadratic drag through a log-law wind
   u(h) = U·ln(h/0.05 m)/ln(2 m/0.05 m). Terminal speeds: wheat 8.1 m/s,
   paddy 7 m/s, chana dal 9 m/s; husk 0.7–1.4 m/s; puffed rice ≈ 2 m/s.
   Drift ≈ U × fall time, so grain lands ≈ 0.3 m downwind and husk
   metres away. In a closed room U = 0 and both land in one pile; a table
   fan (4 m/s jet at 1.5–2.7 m) does the job of the wind.
   Scale 80 px = 1 m.
   ===================================================================== */
function buildA1b(){ return buildScene(wrap=>{
  const S={q:'Do the grains and the husk fall at the same place? Which one does the wind blow away?'};
  const PX=80, GY=480, X0=40, X=m=>X0+m*PX, Y=h=>GY-h*PX;
  const MIX=[
    {name:'Wheat + husk',g:'wheat',gv:8.1,l:'husk',lv:[0.7,1.4],lf:0.28,gl:'wheat grains',ll:'husk'},
    {name:'Rice + husk',g:'rice',gv:7,l:'husk',lv:[0.8,1.5],lf:0.3,gl:'paddy grains',ll:'husk'},
    {name:'Chana dal + puffed rice',g:'dal',gv:9,l:'puff',lv:[1.7,2.3],lf:0.25,gl:'chana dal',ll:'puffed rice'}];
  let mi=0, room=0, U=2.5, fan=false, plat=0.9, run=false, poured=0, P=[], H=null, land={g:[],l:[]}, pred=-1, done=false, flick=0;
  const N=330, rnd=rng(4);
  const reset=()=>{ P=[]; H=heapNew(X0,800,6); land={g:[],l:[]}; poured=0; run=false; done=false; };
  reset();
  const windAt=(x,h,t)=>{ let u=0; if(room===0&&h>0.05) u=U*Math.log(h/0.05)/Math.log(40)*(1+0.12*Math.sin(t*0.9)+0.06*Math.sin(t*2.7));
