<style>

  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{

}
.topbar .brand-badge{

  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}

  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}

}

  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}

.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}

.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 8: NATURE OF MATTER — ELEMENTS, COMPOUNDS, MIXTURES
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET or start an action; the drawn object is moved every frame by the
   real relation behind it — heat of CaO + H₂O, Ca(OH)₂ solubility and
   Stokes settling, CO₂ uptake by lime water, Stokes settling of dust,
   Ohm's + Faraday's laws for electrolysis, Arrhenius charring of sugar,
   a self-spreading Fe + S reaction front and the pull of a magnet.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-8 HELPERS — hands, magnifier, ground, particles
   --------------------------------------------------------------------- */
const G = 10;                       // N/kg — textbook value
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function sgn(x){ return x>0?1:x<0?-1:0; }

/* labelled force arrow; skipped when tiny */
function force(ctx,x,y,dx,dy,col,label,side){
  const L=Math.hypot(dx,dy); if(L<4) return;
  vec(ctx,x,y,x+dx,y+dy,col,3);
  if(label && side==='b'){ textAt(ctx,label,x+dx/2,y+dy+18,{size:12,weight:700,color:col,align:'center'}); return; }
  if(label){ const ox=side==='l'?-8:8; textAt(ctx,label,x+dx+(Math.abs(dx)>Math.abs(dy)?0:ox),y+dy+(Math.abs(dx)>Math.abs(dy)?-9:(dy>0?14:-4)),{size:12,weight:700,color:col,align:Math.abs(dx)>Math.abs(dy)?'center':(side==='l'?'right':'left')}); }
}
function ground(ctx,x0,x1,y){
  line(ctx,x0,y,x1,y,COL.ink,2.4);
  ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.beginPath();
  for(let x=x0+8;x<x1;x+=14){ ctx.moveTo(x,y+2); ctx.lineTo(x-8,y+10); } ctx.stroke(); ctx.restore();
}
function coil(ctx,x,y1,y2,n,wd,col,lwd){
  const L=y2-y1, lead=Math.min(12,Math.abs(L)*0.1), body=L-2*lead, N=n*24;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lwd||2; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x,y1); ctx.lineTo(x,y1+lead);
  const pitch=body/n;
  for(let i=0;i<=N;i++){ const u=i/N, a=u*n*Math.PI*2;
    ctx.lineTo(x+Math.sin(a)*wd/2, y1+lead+body*u - Math.cos(a)*Math.min(pitch*0.35,wd*0.18) + Math.min(pitch*0.35,wd*0.18)); }
  ctx.lineTo(x,y2); ctx.stroke(); ctx.restore();
}
/* hand seen from the side: palm facing `dir` (±1), fingertips at (x,y) */
function hand(ctx,x,y,dir,armLen,armAng){
  const a=armAng===undefined?(dir>0?Math.PI:0):armAng;

  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* hand pressing downward: fingertip at (x,y) */
function handDown(ctx,x,y,armLen){

  line(ctx,x,y-16,x+armLen*0.25,y-16-armLen,COL.ink,10); line(ctx,x,y-16,x+armLen*0.25,y-16-armLen,'#fff',6);
  ctx.beginPath(); rrect(ctx,x-12,y-22,24,22,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();

}
function magnifier(ctx,cx,cy,R,draw,label){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.clip(); draw(); ctx.restore();
  circ(ctx,cx,cy,R,COL.ink,null,3);

}
/* jagged surface profile (friction close-up) */
function roughProfile(seed,rough,n){ const R=rng(seed), a=[]; for(let i=0;i<n;i++) a.push((R()-0.5)*2*rough*(0.6+0.4*R())); return a; }
/* ---- polygons (world units, y up) ---- */
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[i], r=p[(i+1)%p.length]; a+=q[0]*r[1]-r[0]*q[1]; } return Math.abs(a)/2; }
/* keep the part of polygon p with y <= Y */
function clipBelow(p,Y){
  const out=[];
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length], ia=a[1]<=Y, ib=b[1]<=Y;
    if(ia) out.push(a);
    if(ia!==ib){ const u=(Y-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*u, Y]); }
  }
  return out;
}
function xform(p,ox,oy,ang){ const c=Math.cos(ang), s=Math.sin(ang); return p.map(q=>[ox+q[0]*c-q[1]*s, oy+q[0]*s+q[1]*c]); }
function polyPath(ctx,p,X,Y){ ctx.beginPath(); p.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](X(q[0]),Y(q[1]))); ctx.closePath(); }
/* water surface Y so that the part of polygon p below it has area A (bisection) */
function levelFor(p,A){
  let lo=Math.min(...p.map(q=>q[1])), hi=Math.max(...p.map(q=>q[1]));
  if(A<=0) return lo;
  for(let k=0;k<40;k++){ const m=(lo+hi)/2; if(polyArea(clipBelow(p,m))<A) lo=m; else hi=m; }
  return (lo+hi)/2;
}
/* width of polygon p along the horizontal line y=Y */
function widthAt(p,Y){ const xs=[]; for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length]; if((a[1]-Y)*(b[1]-Y)<=0 && a[1]!==b[1]) xs.push(a[0]+(b[0]-a[0])*(Y-a[1])/(b[1]-a[1])); } return xs.length<2?0:Math.max(...xs)-Math.min(...xs); }

const WFILL = 'rgba(47,143,224,0.14)', WFILL2 = 'rgba(47,143,224,0.28)';
function dot(ctx,x,y,r,stroke,fill,lw){ ctx.beginPath(); ctx.arc(x,y,Math.max(0.3,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.4; ctx.stroke();} }
const FARADAY = 96485, VM = 24.0;   // C/mol · L/mol of gas at room temperature
function fmtClock(s){ if(s<60) return Math.round(s)+' s'; if(s<3600) return Math.floor(s/60)+' min '+String(Math.floor(s%60)).padStart(2,'0')+' s'; return Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min'; }

/* ---- lab-ware line drawings (pixel coords) ---- */
/* test tube: open end at yOpen, round end at yEnd (either may be on top) */
function tubePath(ctx,cx,yOpen,yEnd,r){
  const s=yEnd>yOpen?1:-1, yb=yEnd-s*r;
  ctx.beginPath(); ctx.moveTo(cx-r,yOpen); ctx.lineTo(cx-r,yb); ctx.arc(cx,yb,r,Math.PI,0,s>0); ctx.lineTo(cx+r,yOpen);
}
function tube(ctx,cx,yOpen,yEnd,r,lw){
  ctx.save(); tubePath(ctx,cx,yOpen,yEnd,r); ctx.strokeStyle=COL.ink; ctx.lineWidth=lw||2.4; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
  line(ctx,cx-r-3,yOpen,cx-r,yOpen,COL.ink,lw||2.4); line(ctx,cx+r,yOpen,cx+r+3,yOpen,COL.ink,lw||2.4);
}
/* fill the part of a tube between two heights */
function tubeFill(ctx,cx,yOpen,yEnd,r,ya,yb,fill){
  ctx.save(); tubePath(ctx,cx,yOpen,yEnd,r); ctx.closePath(); ctx.clip();
  ctx.fillStyle=fill; ctx.fillRect(cx-r-2,Math.min(ya,yb),2*r+4,Math.abs(yb-ya)); ctx.restore();
}
/* teardrop flame */
function flameShape(ctx,x,y,h,wd,t,col,inner,seed){
  const sw=Math.sin(t*11+(seed||0))*wd*0.12, hh=h*(0.9+0.1*Math.sin(t*17+(seed||0)*2));
  ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=col||COL.red; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.bezierCurveTo(x-wd,y-hh*0.1,x-wd*0.55,y-hh*0.65,x+sw,y-hh); ctx.bezierCurveTo(x+wd*0.55,y-hh*0.65,x+wd,y-hh*0.1,x,y); ctx.stroke();
  ctx.strokeStyle=inner||COL.yellow; ctx.lineWidth=1.6; const h2=hh*0.5, w2=wd*0.45;
  ctx.beginPath(); ctx.moveTo(x,y-2); ctx.bezierCurveTo(x-w2,y-h2*0.15,x-w2*0.5,y-h2*0.7,x+sw*0.5,y-h2); ctx.bezierCurveTo(x+w2*0.5,y-h2*0.7,x+w2,y-h2*0.15,x,y-2); ctx.stroke();
  ctx.restore();
}
/* candle standing at (x,yBase); bright > 1 = flame flares up */
function candle(ctx,x,yBase,u,t,bright,lit){
  const W=1.1*u, H=4.2*u, b=bright||1;
  rect(ctx,x-W/2,yBase-H,W,H,COL.ink,'#fff',2.2);
  line(ctx,x,yBase-H,x,yBase-H-0.35*u,COL.ink,1.8);
  if(lit===false) return;
  flameShape(ctx,x,yBase-H-0.2*u,(1.5+1.3*(b-1))*u,(0.42+0.2*(b-1))*u,t,COL.red,COL.yellow);
  if(b>1.15){ ctx.save(); ctx.globalAlpha=clamp((b-1.15)*1.6,0,0.9); for(let k=0;k<10;k++){ const a=k/10*Math.PI*2+t*0.8, cy=yBase-H-1.0*u*b, r0=(0.9+0.5*b)*u; line(ctx,x+Math.cos(a)*r0,cy+Math.sin(a)*r0,x+Math.cos(a)*r0*1.35,cy+Math.sin(a)*r0*1.35,COL.yellow,1.6); } ctx.restore(); }
}
/* spirit lamp: base centre (x,yBase); inten 0..1 flame size */
function spiritLamp(ctx,x,yBase,u,inten,t){
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x-2.4*u,yBase); ctx.lineTo(x+2.4*u,yBase); ctx.quadraticCurveTo(x+2.8*u,yBase-1.8*u,x+0.7*u,yBase-2.6*u); ctx.lineTo(x+0.55*u,yBase-3.2*u); ctx.lineTo(x-0.55*u,yBase-3.2*u); ctx.lineTo(x-0.7*u,yBase-2.6*u); ctx.quadraticCurveTo(x-2.8*u,yBase-1.8*u,x-2.4*u,yBase); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.fillStyle=WFILL; ctx.fillRect(x-2.2*u,yBase-1.1*u,4.4*u,1.0*u); ctx.restore();
  line(ctx,x,yBase-3.2*u,x,yBase-3.7*u,COL.ink,2.4);
  if(inten>0.02) for(let k=0;k<3;k++) flameShape(ctx,x+(k-1)*0.25*u*inten,yBase-3.7*u,(1.2+3.8*inten)*u*(k===1?1:0.72),(0.5+0.6*inten)*u*(k===1?1:0.6),t,COL.red,COL.yellow,k*1.7);
}
function bubble(ctx,x,y,r,alpha){ ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; dot(ctx,x,y,r,COL.green,'#fff',1.3); ctx.restore(); }
/* "pop": expanding rings + word */
function popBurst(ctx,x,y,u,age,word){
  if(age<0||age>1.2) return; const a=1-age/1.2;
  ctx.save(); ctx.globalAlpha=a;
  for(let k=0;k<3;k++){ const r=(0.6+age*4+k*0.7)*u; circ(ctx,x,y,r,k%2?COL.yellow:COL.red,null,2.4-k*0.5); }
  for(let k=0;k<10;k++){ const an=k/10*Math.PI*2, r1=(1+age*3)*u, r2=r1+1.2*u; line(ctx,x+Math.cos(an)*r1,y+Math.sin(an)*r1,x+Math.cos(an)*r2,y+Math.sin(an)*r2,COL.red,2); }
  ctx.restore();
  if(word) textAt(ctx,word,x,y-(2.2+age*3)*u,{align:'center',size:18+age*6,weight:700,color:COL.red,alpha:a});
}
/* wavy smell lines travelling from (x0,y0) to (x1,y1) */
function smellWaves(ctx,x0,y0,x1,y1,t,col,alpha){
  const L=Math.hypot(x1-x0,y1-y0)||1, ux=(x1-x0)/L, uy=(y1-y0)/L;
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.strokeStyle=col; ctx.lineWidth=1.8;
  for(let k=-1;k<=1;k++){ ctx.beginPath(); for(let q=0;q<=40;q++){ const s=q/40*L, wv=Math.sin(s*0.12-t*6+k)*5; const px=x0+ux*s-uy*(wv+k*9), py=y0+uy*s+ux*(wv+k*9); ctx[q?'lineTo':'moveTo'](px,py); } ctx.stroke(); }
  ctx.restore();
}
/* head in profile, nose tip at (x,y) facing dir (±1) */
function face(ctx,x,y,u,dir,mood){
  const cx=x-dir*1.7*u;
  circ(ctx,cx,y,1.6*u,COL.ink,'#fff',2.2);
  ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx+dir*1.45*u,y-0.6*u); ctx.lineTo(x,y+0.2*u); ctx.lineTo(cx+dir*1.5*u,y+0.35*u); ctx.fill(); ctx.stroke(); ctx.restore();
  dot(ctx,cx+dir*0.7*u,y-0.5*u,1.8,null,COL.ink);
  const my=y+0.85*u; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.beginPath();
  if(mood==='bad'){ ctx.moveTo(cx+dir*0.3*u,my+0.15*u); ctx.quadraticCurveTo(cx+dir*0.8*u,my-0.35*u,cx+dir*1.25*u,my+0.15*u); }
  else { ctx.moveTo(cx+dir*0.4*u,my); ctx.lineTo(cx+dir*1.15*u,my); }
  ctx.stroke(); ctx.restore();
}
/* round "magnified view" frame with a pointer ring on the object being viewed */
function zoomFrame(ctx,cx,cy,R,tx,ty,label,draw){
  if(tx!==null){
    const d=Math.hypot(cx-tx,cy-ty)||1, ux=(cx-tx)/d, uy=(cy-ty)/d, a=Math.asin(clamp(R/d,0,1));
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.1; ctx.setLineDash([4,4]);
    [a,-a].forEach(s=>{ const c=Math.cos(s), sn=Math.sin(s), vx=ux*c-uy*sn, vy=ux*sn+uy*c, L=Math.sqrt(Math.max(0,d*d-R*R)); ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+vx*L,ty+vy*L); ctx.stroke(); });
    ctx.restore(); circ(ctx,tx,ty,7,COL.ink,null,1.8);
  }
  magnifier(ctx,cx,cy,R,draw,label);
}

/* step pills: onPick(i) fires for pills that are unlocked */
function stepPills(el,names,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill" data-i="${i}">${i+1} · ${n}</button>`).join('');

}

/* =====================================================================
   8.1 LIME WATER AND THE AIR
   ① Quicklime in 100 mL water:  CaO + H₂O → Ca(OH)₂,  ΔH = −65.2 kJ/mol
        ΔT = (m/56.1)·65 200 / (100 × 4.18)   → 5 g warms the water by 14 °C
      The water cools back to the room (τ ≈ 15 min).
   ② Ca(OH)₂ dissolves only up to its solubility, which FALLS as the water
      warms (1.89 g/L at 0 °C, 1.73 at 20 °C, 0.71 at 100 °C), so almost
      all of it stays as a white powder that sinks at the Stokes speed
        v = (ρp − ρw)·g·d² / 18μ   (d = 20 µm → 0.27 mm/s; d = 5 µm → 0.02 mm/s)
      — the fine grains never settle, hence the filter.
   ③ Poured over a weir lip into a filter cone (V ∝ h³); the filtrate
      drips out at a rate proportional to the head.
   ④ In the open dish CO₂ from the air dissolves at the surface
      (liquid-side controlled, ≈ 0.15 mmol per hour over 78 cm²) and
        Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O
      Unstirred, the CaCO₃ forms a skin that blocks the surface; stirring
      breaks it and spreads it through. Light through the dish ∝ e^(−3.5·c)
      with c = g/L of CaCO₃ — milky after 2–3 hours. Breath (4 % CO₂, ×100
      the air) blown as bubbles turns it milky in seconds.
   Clock ×10 in the glass, ×900 in the dish (×1 while blowing).
   ===================================================================== */

      const R=Math.min(w*0.17,h*0.24), lx=w-R-14, ly=R+14, sp=S.blow>0?3:1;
      S.co2.forEach(m=>{ m.vx+=gauss()*1.5*sp*Math.sqrt(dt); m.vy+=gauss()*1.5*sp*Math.sqrt(dt)+0.6*sp*dt; m.vx*=0.98; m.vy*=0.98; m.x+=m.vx*dt; m.y+=m.vy*dt;
        if(Math.abs(m.x)>0.85) m.vx*=-1, m.x=clamp(m.x,-0.85,0.85); if(m.y<-0.9){ m.y=-0.9; m.vy=Math.abs(m.vy); }
        if(m.y>0){ if(Math.random()<(S.blow>0?0.9:(S.stirDish?0.5:0.5*(1-0.85*skin)))){ S.spk.push({x:m.x,y:0.02,vy:S.stirDish||S.blow>0?0.3+Math.random()*0.4:0}); if(S.spk.length>70) S.spk.shift(); m.x=(Math.random()-0.5)*1.6; m.y=-0.9; m.vy=0.2; } else { m.y=0; m.vy=-Math.abs(m.vy); } } });
      S.spk.forEach(s=>{ s.y=Math.min(0.9,s.y+s.vy*dt); s.x+=gauss()*0.05*Math.sqrt(dt)*(s.vy>0?3:0); if(S.stirAnim>0&&s.vy===0) s.vy=0.4; });
      zoomFrame(ctx,lx,ly,R,X(DX),Y(DOFF+hd),'CO₂ from the air + lime water → CaCO₃',()=>{
        ctx.fillStyle=WFILL; ctx.fillRect(lx-R,ly,2*R,R); line(ctx,lx-R,ly,lx+R,ly,COL.blue,2);
        S.co2.forEach(m=>{ const px=lx+m.x*R, py=ly+m.y*R; line(ctx,px-7,py,px+7,py,COL.red,1.4); dot(ctx,px,py,3.2,COL.red,'#fff',1.6); dot(ctx,px-7,py,2.6,COL.red,'#fff',1.4); dot(ctx,px+7,py,2.6,COL.red,'#fff',1.4); });
        S.spk.forEach(s=>dot(ctx,lx+s.x*R,ly+s.y*R+3,3.2,COL.ink,'#fff',1.4));
        textAt(ctx,'CO₂',lx-R*0.6,ly-R*0.55,{size:12,weight:700,color:COL.red}); textAt(ctx,'CaCO₃',lx+R*0.35,ly+R*0.6,{size:12,weight:700,color:COL.ink}); });
    }
    if(inDish&&trans<0.6) textAt(ctx,'Calcium hydroxide + Carbon dioxide → Calcium carbonate + Water',w/2,h-12,{align:'center',size:12,weight:600,color:COL.red});

    // ---------- readouts
    $('#rT').textContent=fmt(S.T,1)+' °C';
    $('#rD').textContent=S.step<3?(S.V>1?fmt(S.dis/S.V*1000,2)+' g/L':'—'):fmt(S.cL,2)+' g/L';
    $('#rL').textContent=S.Vd>1?Math.round(trans*100)+' %':'—'; $('#rL').style.color=S.Vd>1&&trans<0.5?'var(--f-red)':'';
    $('#rC').textContent=inDish?fmtClock(S.dclk):fmtClock(S.clk);
    $('#hint').textContent=inDish?(S.blow>0?'Clock ×1 while blowing.':'Clock ×900 — an hour every 4 s.'):'Clock ×10.';
    $('#add').disabled=S.added; $('#stir').textContent=S.stir?'⏸ Stop stirring':'🥢 Stir'; $("#stir").disabled=!S.added||S.step>1;
    $('#filt').disabled=S.step!==2||!!S.pour; $('#leave').textContent=S.leave?'⏸ Pause':'⏱ Leave it open to the air'; $('#leave').disabled=S.step<3||S.dclk>=6*3600||S.nOH<=1e-4;
    $('#blow').disabled=S.step<3||S.blow>0||S.nOH<=1e-4;
    const fb=$('#fb');
    if(S.step===0){ fb.className='fb warn'; fb.textContent=S.added?'It hisses and heats up — CaO reacting with water.':'Add the quicklime slowly.'; }
    else if(S.step===1){ const sat=S.dis/(solub(S.T)*S.V/1000); fb.className='fb '+(S.stir?'ok':'warn'); fb.textContent=S.stir?'Dissolving… only '+fmt(solub(S.T),2)+' g/L can dissolve; the rest stays as white powder.':(S.T>TROOM+3?'Hot and cloudy. Stir to make the solution.':'Stir to make the solution.'); if(sat>0.9&&S.stir) fb.textContent='Saturated. The white powder left over will not dissolve.'; }
    else if(S.step===2){ fb.className='fb warn'; fb.textContent=S.pour||S.Vf>0.3?'The paper holds back the powder; clear lime water drips through.':'Filter out the undissolved powder.'; }
    else if(S.nOH<=1e-4){ fb.className='fb ok'; fb.textContent='All the lime has turned to calcium carbonate.'; }
    else if(trans<0.5){ fb.className='fb ok'; fb.textContent='Milky! CO₂ from '+(S.blow>0||S.cB>0.3&&S.dclk<600?'your breath':'the air')+' made white calcium carbonate.'; }
    else if(S.blow>0){ fb.className='fb warn'; fb.textContent='Breath has about 100× more CO₂ than air…'; }
    else if(skin>0.3&&!S.stirDish){ fb.className='fb warn'; fb.textContent='Unstirred: a white skin forms on top and blocks the air.'; }
    else if(S.leave){ fb.className='fb warn'; fb.textContent='Colourless lime water, open to the air…'; }
    else { fb.className='fb warn'; fb.textContent='Colourless lime water. Leave it in the open.'; }
  });
  return wrap;
}

/* =====================================================================
   8.2 DUST ON A BLACK SHEET
   Dust grains (ρ = 2000 kg/m³) fall through air at the Stokes speed
        v = ρ·g·d² / (18·μ),   μ = 1.8×10⁻⁵ Pa·s
        d =  5 µm → 0.15 cm/s   10 µm → 0.61 cm/s
        d = 20 µm → 2.4 cm/s    40 µm → 9.7 cm/s
   while air currents (≈ 5 cm/s indoors, stronger through an open
   window) keep pushing them around — so they stay suspended for minutes
   to hours. What lands on the sheet each second is  n·v  per m² for
   every size. With 100 µg/m³ of coarse dust this is ≈ 8 mg/m² per hour
   (≈ 6 g/m² a month — a typical city dust-fall), about 90 grains per cm²
   per hour big enough to see with a magnifying glass (≥ 10 µm).
   A shut window lets in only ~30 % of the coarse dust.
   The motes in the room move in real time; the sheet's clock runs ×1800.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Dust in the air <span class="val" id="pmV"></span></label><input type="range" id="pmS" min="20" max="300" step="10" value="100">
      <label style="margin-top:10px;">Window</label>
      <div class="toggle-group" id="winB"><button class="toggle-btn active" data-w="1">Open</button><button class="toggle-btn" data-w="0">Shut</button></div></div>
    <div class="control-group">
      <button class="toggle-btn play" id="go" style="width:100%;padding:9px;">⏱ Leave the sheet for a few hours</button>
      <div class="toggle-group"><button class="toggle-btn" id="lensB">🔍 Magnifying glass</button><button class="toggle-btn" id="wipe">🧽 Wipe clean</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Time left out</div><div class="rval" id="rt">0 h</div></div>
      <div class="rcard"><div class="rlabel">Grains per cm²</div><div class="rval" id="rn">0</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Sheet clock ×1800 · motes in the room move in real time.</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const MU=1.8e-5, RHO=2000, g=9.81;
  const SIZES=[{d:5,f:0.30},{d:10,f:0.30},{d:20,f:0.25},{d:40,f:0.15}].map(s=>{ const D=s.d*1e-6; s.v=RHO*g*D*D/(18*MU); s.m=RHO*Math.PI/6*D*D*D*1e9; return s; });   // v m/s, m µg
  const RW=3.2, RH=2.4, WIN={y0:1.0,y1:1.95}, TABLE={x0:0.25,x1:1.35,y:0.78}, SHEET={x0:0.38,x1:1.18};
  const sunA=Math.atan2(-(WIN.y1-0.1),1.9);          // beam direction (down-right)
  let PM=100, open=true, run=false, clock=0, dep=[0,0,0,0], lens=false, t=0, lensA={x:0,v:0};
  const motes=[]; const R0=rng(5);
  function spawn(m,top){ m.x=top?R0()*RW:0.05+R0()*0.3; m.y=top?0.3+R0()*(RH-0.4):WIN.y0+R0()*(WIN.y1-WIN.y0); m.ux=0; m.uy=0; }
  for(let i=0;i<320;i++){ const r=R0(), k=r<0.5?0:r<0.8?1:r<0.95?2:3; const m={k,ph:R0()*6}; spawn(m,true); motes.push(m); }
  const specks=[]; const RS=rng(9);
  $('#pmS').oninput=e=>{ PM=+e.target.value; };
  toggleWire([...wrap.querySelectorAll('#winB .toggle-btn')],b=>{ open=b.dataset.w==='1'; });
  $('#go').onclick=()=>{ run=!run; if(clock>=8*3600){ clock=0; dep=[0,0,0,0]; specks.length=0; } };
  $('#lensB').onclick=()=>{ lens=!lens; $('#lensB').classList.toggle('active',lens); };
  $('#wipe').onclick=()=>{ dep=[0,0,0,0]; specks.length=0; clock=0; };
  const beamDist=(x,y)=>{ // signed distance from the beam's centre line, and half-width there
    const x0=0, y0=(WIN.y0+WIN.y1)/2, ux=Math.cos(sunA), uy=Math.sin(sunA); const s=(x-x0)*ux+(y-y0)*uy; return {s, d:Math.abs(-(x-x0)*uy+(y-y0)*ux)}; };

  animLoop((dt)=>{
    t+=dt;
    const inside=open?1:0.3, conc=PM*inside;
    // deposition on the sheet: n·v per size class
    if(run&&clock<8*3600){ const dr=dt*1800; clock+=dr;
      SIZES.forEach((s,i)=>{ const n=conc*s.f/s.m; dep[i]+=n*s.v*dr*1e-4; });
      const vis=dep[1]+dep[2]+dep[3]; while(specks.length<Math.min(900,vis*1.2)){ const r=RS(), k=r<0.7?1:r<0.94?2:3; specks.push({u:RS(),v:RS(),k}); } }
    if(clock>=8*3600) run=false;
    // motes: Stokes settling + turbulent air + a draught through the window
    const nShow=Math.round(clamp(40+conc*0.9,20,320)), turb=open?0.09:0.04;
    for(let i=0;i<nShow;i++){ const m=motes[i], s=SIZES[m.k];
      const draft=open?0.12*Math.exp(-Math.pow((m.y-1.45)/0.5,2))*Math.exp(-m.x/1.6):0;
      m.ux+=(gauss()*turb*2.2-m.ux*1.2)*dt*3; m.uy+=(gauss()*turb*2.2-m.uy*1.2)*dt*3;
      m.x+=(m.ux+draft)*dt; m.y+=(m.uy-s.v)*dt;
      if(m.x<0.02){ m.x=0.02; m.ux=Math.abs(m.ux); } if(m.x>RW-0.02){ m.x=RW-0.02; m.ux=-Math.abs(m.ux); } if(m.y>RH-0.02){ m.y=RH-0.02; m.uy=-Math.abs(m.uy); }
      const onT=m.x>TABLE.x0&&m.x<TABLE.x1&&m.y<TABLE.y&&m.y>TABLE.y-0.1;
      if(m.y<0.01||onT) spawn(m,!open||R0()<0.5); }
    lensA.x=approach(lensA.x,lens?1:0,6,dt);

    // ---------- draw
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/(RW+0.9),h/(RH+0.5)), ox=(w-(RW+0.6)*pc)/2+0.6*pc, X=x=>ox+x*pc, Y=y=>h-0.3*pc-y*pc;
    // outside: sun and a tree
    const sx=X(-0.45), sy=Y(2.25); circ(ctx,sx,sy,0.12*pc,COL.yellow,null,2.2); for(let k=0;k<8;k++){ const a=k/8*Math.PI*2+t*0.2; line(ctx,sx+Math.cos(a)*0.16*pc,sy+Math.sin(a)*0.16*pc,sx+Math.cos(a)*0.22*pc,sy+Math.sin(a)*0.22*pc,COL.yellow,2); }
    { const tx=X(-0.35), ty=Y(0); line(ctx,tx,ty,tx,Y(0.9),COL.ink,2.4); for(let k=0;k<3;k++){ const sw=Math.sin(t*1.3+k)*(open?3:1); circ(ctx,tx+(k-1)*0.12*pc+sw,Y(1.05+(k%2)*0.12),0.16*pc,COL.green,null,2); } }
    // beam
    { const y0=Y(WIN.y0+0.03), y1=Y(WIN.y1-0.03), L=4.5*pc, ux=Math.cos(sunA), uy=-Math.sin(sunA);
      ctx.save(); ctx.beginPath(); ctx.rect(X(-0.1),Y(RH),(RW+0.1)*pc,RH*pc); ctx.clip();
      ctx.beginPath(); ctx.moveTo(X(0),y1); ctx.lineTo(X(0)+ux*L,y1+uy*L); ctx.lineTo(X(0)+ux*L,y0+uy*L); ctx.lineTo(X(0),y0); ctx.closePath();
      ctx.fillStyle='rgba(217,160,23,0.10)'; ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(X(0),Y(RH),RW*pc,RH*pc); ctx.clip();
      line(ctx,X(0),y1,X(0)+ux*L,y1+uy*L,COL.yellow,1.4,[6,5]); line(ctx,X(0),y0,X(0)+ux*L,y0+uy*L,COL.yellow,1.4,[6,5]); ctx.restore(); }
    // room outline with window
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(X(0),Y(WIN.y0)); ctx.lineTo(X(0),Y(0)); ctx.lineTo(X(RW),Y(0)); ctx.lineTo(X(RW),Y(RH)); ctx.lineTo(X(0),Y(RH)); ctx.lineTo(X(0),Y(WIN.y1)); ctx.stroke(); ctx.restore();
    rect(ctx,X(-0.06),Y(WIN.y1),0.06*pc,(WIN.y1-WIN.y0)*pc,COL.ink,null,1.6);
    if(open){ line(ctx,X(0),Y(WIN.y1),X(0.28),Y(WIN.y1-0.1),COL.ink,2); line(ctx,X(0.28),Y(WIN.y1-0.1),X(0.28),Y(WIN.y0+0.1),COL.ink,2); line(ctx,X(0.28),Y(WIN.y0+0.1),X(0),Y(WIN.y0),COL.ink,2);
      for(let k=0;k<3;k++){ const yy=Y(1.2+k*0.22), ph=(t*0.5+k*0.3)%1; ctx.save(); ctx.globalAlpha=Math.sin(ph*Math.PI)*0.8; line(ctx,X(-0.2+ph*0.9),yy,X(0.05+ph*0.9),yy,COL.green,1.6); arrowHead(ctx,X(0.05+ph*0.9),yy,0,COL.green,6); ctx.restore(); } }
    else { line(ctx,X(0),Y(WIN.y1),X(0),Y(WIN.y0),COL.ink,2.2); line(ctx,X(0)-3,Y((WIN.y0+WIN.y1)/2),X(0)+3,Y((WIN.y0+WIN.y1)/2),COL.ink,2); }
    // table with the black sheet (oblique)
    line(ctx,X(TABLE.x0),Y(TABLE.y),X(TABLE.x1),Y(TABLE.y),COL.ink,3); line(ctx,X(TABLE.x0+0.06),Y(TABLE.y),X(TABLE.x0+0.06),Y(0),COL.ink,2.4); line(ctx,X(TABLE.x1-0.06),Y(TABLE.y),X(TABLE.x1-0.06),Y(0),COL.ink,2.4);
    const sk=0.16*pc, sa=[X(SHEET.x0),Y(TABLE.y)], sb=[X(SHEET.x1),Y(TABLE.y)];
    const sheetPt=(u,v)=>[lerp(sa[0],sb[0],u)+v*sk*0.9, sa[1]-v*sk];
    ctx.save(); ctx.beginPath(); ctx.moveTo(...sheetPt(0,0)); ctx.lineTo(...sheetPt(1,0)); ctx.lineTo(...sheetPt(1,1)); ctx.lineTo(...sheetPt(0,1)); ctx.closePath(); ctx.fillStyle=COL.ink; ctx.fill(); ctx.restore();
    specks.forEach((s,i)=>{ if(s.k<3&&i%3) return; const p=sheetPt(s.u,s.v); dot(ctx,p[0],p[1],s.k===3?1.3:0.8,null,'#e8edf3'); });
    textAt(ctx,'black sheet',X((SHEET.x0+SHEET.x1)/2),Y(TABLE.y)+16,{align:'center',size:11,weight:600,color:COL.muted});
    // motes — glinting in the beam, faint elsewhere
    for(let i=0;i<nShow;i++){ const m=motes[i], b=beamDist(m.x,m.y), half=(WIN.y1-WIN.y0)/2*Math.cos(sunA)*1.0, inB=b.s>0&&b.d<half, r=0.8+m.k*0.7;
      if(inB){ const tw=0.6+0.4*Math.sin(t*6+m.ph*5); dot(ctx,X(m.x),Y(m.y),r+0.6,COL.yellow,'#fff',1.3); ctx.save(); ctx.globalAlpha=tw*0.8; line(ctx,X(m.x)-r-3,Y(m.y),X(m.x)+r+3,Y(m.y),COL.yellow,1); line(ctx,X(m.x),Y(m.y)-r-3,X(m.x),Y(m.y)+r+3,COL.yellow,1); ctx.restore(); }
      else dot(ctx,X(m.x),Y(m.y),r*0.8,null,'rgba(129,149,171,0.45)'); }
    // lens on the sheet: 5 mm × 5 mm patch, ×10
    if(lensA.x>0.02){ const R=Math.min(w*0.2,h*0.27)*lensA.x, cx=w-Math.min(w*0.2,h*0.27)-14, cy=Math.min(w*0.2,h*0.27)+14, tp=sheetPt(0.5,0.5);
      const vis=dep[1]+dep[2]+dep[3], n=Math.min(400,Math.round(vis*0.25));
      zoomFrame(ctx,cx,cy,R,tp[0],tp[1],lensA.x>0.9?'5 mm × 5 mm of the sheet':'',()=>{ ctx.fillStyle=COL.ink; ctx.fillRect(cx-R,cy-R,2*R,2*R); const r=rng(21);
        for(let k=0;k<n;k++){ const q=r(), kk=q<0.7?1:q<0.94?2:3, px=cx+(r()*2-1)*R, py=cy+(r()*2-1)*R, rad=(0.8+kk*1.3)*R/110;
          ctx.beginPath(); for(let j=0;j<6;j++){ const a=j/6*Math.PI*2, rq=rad*(0.7+0.3*Math.sin(k+j*1.7)); ctx[j?'lineTo':'moveTo'](px+Math.cos(a)*rq,py+Math.sin(a)*rq); } ctx.closePath(); ctx.fillStyle=kk===3?'#f4f6f9':'#c9d2dd'; ctx.fill(); } }); }

    // ---------- readouts
    const vis=dep[1]+dep[2]+dep[3];
    $('#pmV').textContent=PM+' µg/m³ · '+(PM<60?'clean':PM<120?'moderate':PM<200?'poor':'very poor');
    $('#rt').textContent=fmt(clock/3600,1)+' h'; $('#rn').textContent=Math.round(vis);
    $('#go').textContent=run?'⏸ Pause':(clock>=8*3600?'↺ Again from 0 h':'⏱ Leave the sheet for a few hours');
    const fb=$('#fb');
    if(!run&&clock===0){ fb.className='fb warn'; fb.textContent='Clean black sheet. Shining specks drift in the sunbeam.'; }
    else if(vis<30){ fb.className='fb warn'; fb.textContent='Still looks clean…'; }
    else if(!lens){ fb.className='fb ok'; fb.textContent='Tiny particles have settled. Look closer with the magnifying glass.'; }
    else { fb.className='fb ok'; fb.textContent='Dust was floating in the air — it is not part of air itself.'; }
  });
  return wrap;
}

/* =====================================================================
   8.3 PASSING ELECTRICITY THROUGH WATER
   A 9 V battery stands in the water; the water between its two
   terminals completes the circuit:
        I = (9 V − 2.0 V) / (R_battery + K/σ),   K ≈ 60 m⁻¹ (terminal geometry)
   2.0 V is used up splitting water (1.23 V + overpotential).
   Conductivity σ: distilled water 0.0005 S/m, tap water 0.03 S/m, and
   each drop of dilute sulfuric acid in 250 mL adds ≈ 0.017 S/m.
   Faraday's law — every 2 electrons make one H₂ at the − terminal;
   every 4 make one O₂ at the + terminal:
        V(H₂) = I·t/(2F)·24 L/mol,   V(O₂) = I·t/(4F)·24 L/mol   → 2 : 1
   e.g. 10 drops, 20 mA for 15 min → 2.2 mL H₂ and 1.1 mL O₂.
   Tests: hydrogen burns with a pop; oxygen makes the flame flare.
   Clock ×60.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Water</label>
      <div class="toggle-group" id="wB"><button class="toggle-btn active" data-w="0.03">Tap</button><button class="toggle-btn" data-w="0.0005">Distilled</button></div>
      <label style="margin-top:10px;">Dilute sulfuric acid <span class="val" id="aV">0 drops</span></label><input type="range" id="aS" min="0" max="10" step="1" value="0"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="bat">🔋 Put the battery in</button><button class="toggle-btn" id="tub">🧪 Place the tubes</button></div></div>
    <div class="control-group"><label style="margin-bottom:4px;">Test the gas with a burning candle</label>
      <div class="toggle-group"><button class="toggle-btn" id="t0">Tube on −</button><button class="toggle-btn" id="t1">Tube on +</button></div>
      <table class="log" id="log"><tr><th>Tube</th><th>Gas</th><th>Candle</th></tr></table></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Current</div><div class="rval" id="rI">0 mA</div></div>
      <div class="rcard"><div class="rlabel">Clock</div><div class="rval" id="rC">0 s</div></div>
      <div class="rcard"><div class="rlabel">Gas on −</div><div class="rval" id="rH" style="color:var(--f-green)">0 mL</div></div>
      <div class="rcard"><div class="rlabel">Gas on +</div><div class="rval" id="rO" style="color:var(--f-green)">0 mL</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Clock ×60.</div>
      <button class="toggle-btn navy" id="rs">↺ Start again</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const EB=9, ED=2.0, RB=2, KC=60, DROP=0.017, TC=60;
  const BK={x0:-5,x1:5,top:10,wl:7.4}, BAT={w:2.65,h:4.85}, TX=[-0.635,0.635], TR=0.5, TRI=0.45, TL=9.5, TOPEN=BAT.h+0.55, TCAP=Math.PI*TRI*TRI*(TL-0.6);
  let S;
  function reset(){ S={s0:+$('#wB .active').dataset.w,drops:0,shown:0,falling:[],bat:false,by:{x:12,v:0},tubes:false,ty:[{x:9,v:0},{x:9,v:0}],V:[0,0],clk:0,bub:[],t:0,test:null,cand:{x:13.2,y:0},bright:1,pop:-9,log:[],acc:[0,0],mol:null};
    $('#aS').value=0; }
  reset();
  // lens molecules (unit disk; electrodes at the bottom)
  function initMol(){ const r=rng(4), M=[]; for(let i=0;i<22;i++) M.push({k:'w',x:(r()-0.5)*1.4,y:-0.6+r()*1.1,vx:0,vy:0,a:r()*6}); S.mol=M; }
  initMol();

/* =====================================================================
   8.4 HEATING SUGAR
   5 g sugar + the bottom of the boiling tube:  C = 14.7 J/K,
        C·dT/dt = P·flame − h·(T − 25 °C),   P = 30 W, h = 0.10 W/K
   At 186 °C sugar melts (46 kJ/mol → 670 J for 5 g) — the temperature
   holds until it is all liquid. Then it breaks down:
        C₁₂H₂₂O₁₁ → 12 C + 11 H₂O
   at an Arrhenius rate  k = k₀·e^(−Ea/R·(1/T − 1/523 K)),  Ea = 150 kJ/mol,
   half-life 60 s at 250 °C. By mass: 42 % carbon stays, 58 % leaves as
   water vapour, which condenses on the cool upper part of the tube.
   Gentle flame (≤ 60 %) only melts and browns it; a strong flame chars it.
   Clock ×15.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Spirit lamp flame <span class="val" id="fV">0 %</span></label><input type="range" id="fS" min="0" max="100" step="5" value="0"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="scoop">🥄 Scoop out the black mass</button></div>
      <button class="toggle-btn play" id="burn" style="width:100%;padding:8px;margin-top:6px;">🔥 Does it burn like coal?</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Temperature</div><div class="rval" id="rT" style="color:var(--f-yellow)">25 °C</div></div>
      <div class="rcard"><div class="rlabel">Sugar left</div><div class="rval" id="rS">5.00 g</div></div>
      <div class="rcard"><div class="rlabel">Water given off</div><div class="rval" id="rW" style="color:var(--f-blue)">0 g</div></div>
      <div class="rcard"><div class="rlabel">Carbon left</div><div class="rval" id="rC">0 g</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Clock ×15.</div>
      <button class="toggle-btn navy" id="rs">↺ Fresh sugar</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const M0=5, CAP=14.7, HL=0.10, PW=30, TM=186, LM=46000*M0/342.3, EA=150000, K0=Math.LN2/60, FC=144/342.3, FW=1-FC, TC=15;
  const ANG=35*Math.PI/180, TR=1.25, TL=15, B={x:0,y:9.4}, ux=Math.cos(ANG), uy=Math.sin(ANG);
  let S;

    $('#fS').value=0; const r=rng(8); for(let i=0;i<10;i++) S.mol.push({k:'s',x:(r()-0.5)*1.4,y:0.1+r()*0.6,a:r()*6,vx:0,vy:0}); }
  reset();
  $('#fS').oninput=e=>{ S.f=+e.target.value/100; };
  $('#scoop').onclick=()=>{ if(S.x>0.8&&S.f===0&&!S.scoop&&!S.onGlass) S.scoop={T:0}; };
  $('#burn').onclick=()=>{ if(S.onGlass) S.burn=true; };
  $('#rs').onclick=reset;
  // tube-local (a along the axis from the bottom, b across) → world
  const W=(a,b)=>[B.x+ux*a-uy*b, B.y+uy*a+ux*b];

  animLoop((dt)=>{
    S.t+=dt; const t=S.t, dtr=dt*TC;
    // ---- energy balance with melting plateau
    const inTube=!S.onGlass&&!S.scoop;
    const mS=M0*(1-S.x);
    if(inTube){ const q=PW*S.f-HL*(S.T-25);
      if(S.T>=TM&&S.melt<1&&q>0){ S.melt=Math.min(1,S.melt+q*dtr/LM); } else S.T+=q*dtr/CAP;
      if(S.T>120){ const k=K0*Math.exp(-EA/8.314*(1/(S.T+273)-1/523)); const dx=(1-S.x)*(1-Math.exp(-k*dtr*(S.melt>0?1:0.3))); S.x+=dx;
        const dw=M0*FW*dx; S.wat+=dw; S.cond+=dw*0.55; if(Math.random()<dw*400&&S.steam.length<7) S.steam.push({a:TL,life:0,ph:Math.random()*6});
        // lens: sugar molecules break into carbon + water
        if(Math.random()<dx*60){ const s=S.mol.find(m=>m.k==='s'); if(s){ s.k='c'; for(let j=0;j<2;j++) S.mol.push({k:'w',x:s.x+(Math.random()-0.5)*0.2,y:s.y,a:Math.random()*6,vx:(Math.random()-0.5)*0.3,vy:-0.5-Math.random()*0.4}); } } } }

/* =====================================================================

   5.6 g Fe (0.1 mol) + 3.2 g S (0.1 mol) → exactly 8.8 g FeS.

        ∂T/∂t = D·∂²T/∂x² + burner − h·(T − 25) + ΔT_r·∂r/∂t
        ∂r/∂t = k(T)·(1 − r),  k = k₀·e^(−8900 K / T), capped at 15 s⁻¹

   once one spot ignites (~300 °C) the red glow spreads through the dish
   on its own, even with the burner off.
   Magnet: the pull on a filing grows as 1/gap⁵ — nothing, nothing, then
   they leap. A filing lifts when F > mg (slow motion). FeS is not pulled.
   Acid: Fe + 2HCl → FeCl₂ + H₂ (no smell, burns with a pop);

    $('#zV').textContent=fmt(S.zT,1)+' cm above';
    $('#mix').disabled=S.mixT>=0; $('#half').disabled=!S.mixed||S.fly>=0; $('#grind').disabled=!(rAvg>0.97&&Tmax<80&&S.grind<0);
    const A=S.acid[S.smp]; $('#hcl').disabled=A.pour>=0; $('#waft').disabled=A.on<0||S.waft>=0; $('#spl').disabled=A.on<0||S.spl>=0;
    $('#hint').textContent=S.view===2&&S.mode==='mag'?'Filings shown in slow motion.':'';
    const fb=$('#fb');
    if(S.view===0){ fb.className='fb '+(S.mixed?'ok':'warn'); fb.textContent=S.mixed?'Non-uniform: black iron and yellow sulfur are still seen apart.':'Iron filings and sulfur powder, side by side.'; }
    else if(S.view===1){
      if(!S.inDish){ fb.className='fb warn'; fb.textContent=S.fly>=0?'Half goes to the china dish…':'Keep half as Sample A; heat the other half.'; }
      else if(rAvg<0.02){ fb.className='fb warn'; fb.textContent=S.f===0?'Light the burner.':(Tmax>115?'Sulfur melts… keep heating.':'Heating…'); }
      else if(rAvg<0.97){ fb.className='fb ok'; fb.textContent='It glows red and the glow spreads by itself — heat is given out!'; }
      else if(Tmax>=80){ fb.className='fb warn'; fb.textContent=S.f>0?'A black mass. Turn the burner off and let it cool.':'A black mass. Cooling…'; }
      else { fb.className='fb ok'; fb.textContent=S.grind>=0?'Grinding the black mass…':'Cool. Grind it to get Sample B.'; } }
    else if(S.mode==='look'){ fb.className='fb ok'; fb.textContent='A: two kinds of grains. B: the same black grains throughout.'; }
    else if(S.mode==='mag'){ const st=S.gr.filter(g=>g.stuck).length; fb.className='fb '+(S.smp==='A'&&st?'ok':'warn');
      fb.textContent=S.smp==='A'?(st?st+' iron filings on the magnet — yellow sulfur stays behind.':'Lower the magnet over Sample A.'):(S.mz.x<0.6?'Nothing moves — iron sulfide is not magnetic.':'Lower the magnet over Sample B.'); }
    else { const g=gasOf(S.smp)>0.05; fb.className='fb '+(A.on<0?'warn':'ok');
      fb.textContent=A.on<0?'Add dilute hydrochloric acid to Sample '+S.smp+'.':(!g?'The fizzing has stopped.':(S.smp==='A'?'Fizzing: hydrogen. The yellow sulfur does not react.':'Fizzing: hydrogen sulfide.')); }
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
