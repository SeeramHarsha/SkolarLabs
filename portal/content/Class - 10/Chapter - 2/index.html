}

/* =====================================================================
   2.11 pH OF COMMON SOLUTIONS  (Table 2.2, universal-indicator paper)
   Typical pH: saliva 7.4 before a meal, 5.8 after (mouth bacteria turn
   sugar into acid), lemon 2.2, colourless fizzy drink 3.2 (CO₂ +
   citric/phosphoric acid), carrot 6.3, coffee 5.0, tomato 4.2, tap 7.3,
   1 M NaOH 14.0, 1 M HCl 0.0.
   The strip dips in, liquid climbs by capillarity (Washburn: front ∝ √t),
   the dye takes the colour of the pH, then the strip is carried to the
   chart and settles against the matching colour.
   [H⁺] = 10^(−pH) mol/L — one pH step is ten times the H⁺.
   ===================================================================== */
/* ---- shared dip-and-compare rig for pH / litmus strips ---- */
function dipNew(x,y){ return {p:sprP(x,y), home:{x,y}, phase:'rest', T:0, wet:0, col:null, base:'#f1ead2', pH:7}; }
function dipStart(D,pH,colFn,base){ D.phase='down'; D.T=0; D.wet=0; D.pH=pH; D.col=colFn(pH); D.base=base||'#f1ead2'; }
/* liq = {x, y (surface)}; cmp(pH) → {x,y} where the strip should settle; L = strip length */
function dipStep(D,dt,liq,cmp,L){ D.T+=dt; let tx=D.home.x, ty=D.home.y;
  if(D.phase==='down'){ tx=liq.x; ty=liq.y-L+30; if(D.T>1.1){ D.phase='wick'; D.T=0; } }
  else if(D.phase==='wick'){ tx=liq.x; ty=liq.y-L+30; D.wet=Math.min(0.62,0.16*Math.sqrt(D.T*8)); if(D.T>1.8){ D.phase='up'; D.T=0; } }
  else if(D.phase==='up'){ tx=liq.x; ty=liq.y-L-70; if(D.T>0.8){ D.phase=cmp?'cmp':'done'; D.T=0; } }
  else if(D.phase==='cmp'||D.phase==='done'){ if(cmp){ const c=cmp(D.pH); tx=c.x; ty=c.y; } else { tx=liq.x; ty=liq.y-L-70; } if(D.phase==='cmp'&&D.T>1.4){ D.phase='done'; } }
  sprPStep(D.p,tx,ty,dt,D.phase==='cmp'?30:45,D.phase==='cmp'?9:11); }
function dipDraw(ctx,D,L,W){ const x=D.p.x.x, y=D.p.y.x; tongsDraw(ctx,x,y+4,-Math.PI/2-0.08,0.15,120); stripDraw(ctx,x,y,W||22,L,0,D.base,D.wet,D.col||D.base); }
const A11_SAM=[
  {f:'Saliva (before meal)',s:'Saliva',pH:7.4,col:'rgba(232,236,242,0.7)'}, {f:'Saliva (after meal)',s:'Saliva+',pH:5.8,col:'rgba(232,236,242,0.7)'},
  {f:'Lemon juice',s:'Lemon',pH:2.2,col:'rgba(240,226,120,0.55)'}, {f:'Colourless aerated drink',s:'Soda',pH:3.2,col:'rgba(225,240,250,0.5)',fizz:true},
  {f:'Carrot juice',s:'Carrot',pH:6.3,col:'rgba(240,140,40,0.6)'}, {f:'Coffee',s:'Coffee',pH:5.0,col:'rgba(110,70,40,0.75)'},
  {f:'Tomato juice',s:'Tomato',pH:4.2,col:'rgba(214,60,40,0.6)'}, {f:'Tap water',s:'Tap',pH:7.3,col:'rgba(47,143,224,0.12)'},
  {f:'1M NaOH',s:'NaOH',pH:14.0,col:'rgba(47,143,224,0.10)'}, {f:'1M HCl',s:'HCl',pH:0.0,col:'rgba(217,67,43,0.08)'}];
function buildA11(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=230, TOP=80, BOT=262, BW=170, CH={x:40,y:452,w:720,h:34}, L=130;
  let si=0, t=0; const done={}; const D=dipNew(CX+150,40); const S={fill:spr(1), next:null, bub:[]};
  side.innerHTML=`
    <div class="control-group"><label>Solution</label><div class="chip-wrap">${A11_SAM.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${i+1}. ${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Dip pH paper</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','pH',COL.green)}${card('r2','Nature',COL.ink)}${card('r3','[H⁺] mol/L',COL.red)}${card('r4','vs pure water',COL.ink)}</div><div id="log"></div></div>`;
  const log=$('#log');
  const refresh=()=>{ const rows=A11_SAM.map((s,i)=>done[i]?[i+1,s.s,{v:fmt(s.pH,1)},{v:natureOf(s.pH),c:s.pH<6.5?'r-bad':s.pH>7.5?'':'r-ok'}]:null).filter(Boolean); log.innerHTML=rows.length?logTable(['#','Solution','pH','Nature'],rows):''; };
  chipsWire(side,'[data-s]',b=>{ const n=+b.dataset.s; if(n===si) return; S.next=n; D.phase='rest'; D.wet=0; });
  $('#go').onclick=()=>{ if(D.phase!=='rest'&&D.phase!=='done') return; D.wet=0; dipStart(D,A11_SAM[si].pH,uniCol); };
  const cmp=pH=>({x:CH.x+(pH+0.5)*CH.w/15, y:CH.y-L-8});
  animLoop(dt=>{
    t+=dt;
    if(S.next!==null){ springTo(S.fill,0,40,12,dt); if(S.fill.x<0.03){ si=S.next; S.next=null; S.bub=[]; } } else springTo(S.fill,1,40,12,dt);
    const s=A11_SAM[si], lv=lerp(BOT-6,TOP+60,clamp(S.fill.x,0,1));
    dipStep(D,dt,{x:CX+20,y:lv},cmp,L);
    if(D.phase==='done'&&!done[si]&&D.pH===s.pH){ done[si]=true; refresh(); }
    if(s.fizz&&Math.random()<dt*14) S.bub.push({x:CX-60+Math.random()*120,y:BOT-10,vy:-20,vx:0,r:1.5+Math.random()*1.5,ph:Math.random()*6});
    bubbleStep(S.bub,dt,()=>lv);
    const shown=D.phase==='done'||D.phase==='cmp';
    setMany($,{r1:shown?fmt(D.pH,1):'—', r2:shown?natureOf(D.pH):'—', r3:shown?(D.pH<=0?'1':'10⁻'+fmt(D.pH,1)):'—', r4:shown?(Math.abs(D.pH-7)<0.4?'same':(D.pH<7?fmt(Math.pow(10,7-D.pH),0)+'× more H⁺':fmt(Math.pow(10,D.pH-7),0)+'× less H⁺')):'—'});
    if(shown) setc($,'r2',natureCol(D.pH));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    line(ctx,20,BOT+2,500,BOT+2,COL.ink,2.6); for(let x=34;x<500;x+=22) line(ctx,x,BOT+4,x-10,BOT+14,COL.mid,1);
    if(S.fill.x>0.01){ ctx.save(); ctx.fillStyle=s.col; ctx.fillRect(CX-BW/2+2,lv,BW-4,BOT-lv-2); ctx.restore(); line(ctx,CX-BW/2+2,lv,CX+BW/2-2,lv,COL.blue,2); }
    bubbleDraw(ctx,S.bub,COL.green);
    beakerDraw(ctx,CX,TOP,BOT,BW);
    textAt(ctx,s.f,CX,TOP-18,{align:'center',size:15,weight:800,color:COL.yellow});
    // the [H⁺] ladder: each rung = ×10
    const LX=440, LT=84, LB=250; line(ctx,LX,LT,LX,LB,COL.ink,2); for(let p=0;p<=14;p+=2){ const y=lerp(LT,LB,p/14); line(ctx,LX-6,y,LX+6,y,COL.ink,1.4); textAt(ctx,p?'10⁻'+p:'1',LX+10,y+4,{size:10.5,weight:600,color:COL.muted}); }
    textAt(ctx,'[H⁺]',LX,LT-12,{align:'center',size:12,weight:800,color:COL.red});
    if(shown){ const y=lerp(LT,LB,clamp(D.pH,0,14)/14); circ(ctx,LX,y,7,COL.red,uniCol(D.pH),2.2); }
    // chart with every tested sample marked
    const marks=A11_SAM.map((q,i)=>done[i]?{pH:q.pH,col:natureCol(q.pH),label:q.s,dy:(i%3)*14,a:i===si?1:0.55}:null).filter(Boolean);
    phChart(ctx,CH.x,CH.y,CH.w,CH.h,marks);
    dipDraw(ctx,D,L);
    if(D.phase==='done'){ const c=cmp(D.pH); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.4; ctx.setLineDash([4,4]); ctx.strokeRect(c.x-CH.w/30,CH.y-3,CH.w/15,CH.h+6); ctx.restore(); }
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.12 pH OF SOIL
   2 g soil + 5 mL water, shake, filter, test the filtrate.
   Shaking lifts the fines (suspended fraction φ → 1); at rest they
   settle with τ ≈ 5 s (silt) while clay keeps it cloudy (φ ≥ 0.15).
   Pouring: the tipped tube overflows its lip into a filter funnel;
   filtrate drains at q = 0.6·V_funnel mL/s (Darcy: flow ∝ head) and
   drips into the tube below; the paper keeps the soil.
   Soil pH (1 : 2.5 water): garden loam 6.8, pine forest 5.0, tea estate
   4.6, limestone 8.0, alkaline "usar" 9.2. Crop ranges (preferred pH):
   tea 4.5–5.5, potato 4.8–6.5, rice 5.0–6.5, wheat 6.0–7.5, mustard
   6.0–7.5, cotton 6.0–8.0, barley 6.5–8.5.
   ===================================================================== */
function buildA12(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const SOILS=[{f:'Garden loam',pH:6.8,c:'#7a5a3a'},{f:'Pine forest',pH:5.0,c:'#4f3a28'},{f:'Tea estate',pH:4.6,c:'#8a3e24'},{f:'Limestone area',pH:8.0,c:'#b09a78'},{f:'Alkaline (usar)',pH:9.2,c:'#c9bea6'}];
  const CROPS=[['Tea',4.5,5.5],['Potato',4.8,6.5],['Rice',5.0,6.5],['Wheat',6.0,7.5],['Mustard',6.0,7.5],['Cotton',6.0,8.0],['Barley',6.5,8.5]];
  const T1={W:60,H:230}, MLA=900, FX=380, FT=196, T2={x:380,b:490,W:52,H:190};
  const STEPS=['Soil + water','Shake','Filter','pH paper'];
  let so=0, t=0; const S={}; const seq=seqNew(); const D=dipNew(470,60);
  function reset(){ Object.assign(S,{step:0, soil:0, A:0, phi:0, rock:spr(0), shake:0, m:sprP(150,176), ang:spr(0), Vf:0, V2:0, paperSoil:0, drops:[], spoon:sprP(30,440), spA:spr(-0.25), spT:{x:30,y:440,a:-0.25}, spoonLoad:0, pourW:0, fLift:spr(0)}); seq.q=[]; seq.cur=null; D.phase='rest'; D.wet=0; D.p.x.x=D.home.x; D.p.y.x=D.home.y; }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Soil sample</label><div class="chip-wrap">${SOILS.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><div class="step-row" id="steps"></div><div class="toggle-group"><button class="toggle-btn play" id="nx">▶ Soil + water</button><button class="toggle-btn" id="rs">↺ Start again</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Filtrate',COL.blue)}${card('r2','Soil pH',COL.green)}${card('r3','Nature',COL.ink)}${card('r4','Grows well',COL.green)}</div></div>`;
  const pills=()=>stepPills($('#steps'),STEPS,Math.min(S.step,3),STEPS.map((_,i)=>i<S.step),()=>{});
  const nxLabel=()=>{ setBtn($('#nx'),S.step<4?'▶ '+STEPS[S.step]:'✓ Done',S.step<4?'play':''); pills(); };
  chipsWire(side,'[data-s]',b=>{ so=+b.dataset.s; reset(); nxLabel(); });
  $('#rs').onclick=()=>{ reset(); nxLabel(); };
  $('#nx').onclick=()=>{ if(seqBusy(seq)||S.step>=4||(D.phase!=='rest'&&D.phase!=='done')) return; const st=S.step;
    if(st===0){ seqAdd(seq,0.6,null,null,()=>{ S.spT={x:62,y:458,a:-0.25}; S.spoonLoad=1; });
      seqAdd(seq,1.1,null,null,()=>{ S.spT={x:142,y:158,a:Math.PI-0.4}; });
      seqAdd(seq,0.7,u=>{ S.spT.a=Math.PI-0.4-1.0*u; },()=>{ S.soil=1; S.spoonLoad=0; });
      seqAdd(seq,0.8,null,null,()=>{ S.spT={x:30,y:440,a:-0.25}; });
      seqAdd(seq,1.6,u=>{ S.A=5*MLA*u; S.pourW=u<0.97?1:0; },()=>{ S.pourW=0; }); seqAdd(seq,0.2,null,()=>{ S.step=1; nxLabel(); }); }
    if(st===1){ S.shake=2.4; seqAdd(seq,2.6,null,()=>{ S.step=2; nxLabel(); }); }
    if(st===2){ seqAdd(seq,1.2,u=>{ S.m.tx=lerp(150,FX-30,u); S.m.ty=lerp(176,120,u); S.ang.t=1.2*u; });
      seqAdd(seq,99,(e,u,dt)=>{ S.ang.t=Math.min(2.25,S.ang.t+dt*0.35); if(S.A<60&&S.ang.t>2.2) seq.cur.dur=0; });
      seqAdd(seq,1.4,u=>{ S.m.tx=lerp(FX-30,150,u); S.m.ty=lerp(120,176,u); S.ang.t=2.25*(1-u); });
      seqAdd(seq,99,(e,u,dt)=>{ if(S.Vf<0.15) seq.cur.dur=0; }); seqAdd(seq,0.2,null,()=>{ S.step=3; nxLabel(); }); }
    if(st===3){ const r=tubeAt(T2.W,T2.H,T2.x,T2.b,0); D.wet=0; dipStart(D,SOILS[so].pH,uniCol); S.step=4; nxLabel(); } };
  S.m.tx=150; S.m.ty=176; S.ang.t=0;
  nxLabel();
  animLoop(dt=>{
    t+=dt; seqStep(seq,dt);
    if(S.m.tx===undefined){ S.m.tx=150; S.m.ty=176; S.ang.t=0; }
    sprPStep(S.m,S.m.tx,S.m.ty,dt,60,13); sprPStep(S.spoon,S.spT.x,S.spT.y,dt,50,12); springTo(S.spA,S.spT.a,50,12,dt); springTo(S.fLift,S.step>=4?1:0,30,9,dt); springTo(S.ang,S.ang.t||0,50,12,dt);
    // shaking: the tube rocks hard and the soil lifts into suspension
    if(S.shake>0){ S.shake-=dt; springTo(S.rock,Math.sin(t*22)*0.35,300,8,dt); S.phi=approach(S.phi,1,4,dt); } else { springTo(S.rock,0,80,10,dt); S.phi=approach(S.phi,0.15,1/5,dt); }
    const a=S.ang.x+S.rock.x;
    const P=rotPts(tubeLocal(T1.W,T1.H).map(([x,y])=>[x,y+T1.H]),S.m.x.x,S.m.y.x,a);
    let r=fillLow(P,Math.max(1,S.A)); let Q=0;
    if(S.A>r.cap+1){ Q=(S.A-r.cap)*(1-Math.exp(-3*dt)); Q=Math.min(Q,1.8*MLA*dt); S.A-=Q; S.Vf+=Q/MLA; S.paperSoil+=Q/MLA*S.phi*0.2; r=fillLow(P,S.A); }
    const drain=S.Vf*0.6*dt; S.Vf-=drain; S.V2+=drain; S.dAcc=(S.dAcc||0)+drain*20; while(S.dAcc>1){ S.dAcc-=1; S.drops.push({x:T2.x,y:FT+128,vy:60,r:3}); }
    const P2=tubeAt(T2.W,T2.H,T2.x,T2.b,0), r2=fillLow(P2,Math.max(1,S.V2*MLA*0.7));
    S.drops.forEach(d=>{ d.hit=dropStep(d,dt,r2.L); }); if(S.drops.some(d=>d.hit)) drip(); S.drops=S.drops.filter(d=>!d.hit);
    dipStep(D,dt,{x:T2.x,y:r2.L},null,120);
    const shown=D.phase==='done', s=SOILS[so];
    const good=CROPS.filter(c=>s.pH>=c[1]&&s.pH<=c[2]).map(c=>c[0]);
    setMany($,{r1:fmt(S.V2,1)+' mL', r2:shown?fmt(s.pH,1):'—', r3:shown?natureOf(s.pH):'—', r4:shown?(good.slice(0,3).join(', ')||'few crops'):'—'}); if(shown) setc($,'r3',natureCol(s.pH));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,500);
    rackDraw(ctx,100,200,340,500);
    // soil heap on a watch glass + spoon
    dishDraw(ctx,70,470,46,14); ctx.save(); ctx.fillStyle=s.c; ctx.beginPath(); ctx.ellipse(70,466,30*(1-S.soil*0.7),9*(1-S.soil*0.6),0,Math.PI,0); ctx.fill(); ctx.restore();
    // tube 1 with soil + water
    const muddy=rgba(s.c,0.12+0.6*S.phi);
    if(S.A>2){ polyFill(ctx,r.poly,muddy); const sl=surfLine(r.poly,r.L); if(sl) line(ctx,sl[0],r.L,sl[1],r.L,COL.blue,1.8); }
    if(S.soil>0){ ctx.save(); ctx.translate(S.m.x.x,S.m.y.x); ctx.rotate(a); ctx.translate(0,T1.H); ctx.beginPath(); ctx.moveTo(-T1.W/2+3,-T1.W/2+2-18*(1-S.phi*0.7)); ctx.lineTo(T1.W/2-3,-T1.W/2+2-18*(1-S.phi*0.7)); ctx.arc(0,-T1.W/2,T1.W/2-3,0,Math.PI); ctx.closePath(); ctx.fillStyle=s.c; ctx.fill(); ctx.restore(); }
    if(S.phi>0.2&&S.A>2) polyClipFill(ctx,r.poly,()=>{ ctx.fillStyle=s.c; for(let k=0;k<60;k++){ const px=S.m.x.x+Math.sin(k*7.3+t*3)*T1.W*0.4, py=r.L+10+((k*37+t*40*S.phi)%(T1.H*0.9)); ctx.fillRect(px,py,2.2,2.2); } });
    glassDraw(ctx,P,2.6);
    if(Q>0.2){ const lip=P[0][1]>P[P.length-1][1]?P[0]:P[P.length-1]; stream(ctx,lip[0],lip[1],30,FT+30,rgba(s.c,0.6),3); }
    // filter funnel on the collecting tube (lifted away before the pH test)
    ctx.save(); ctx.globalAlpha=clamp(1-S.fLift.x,0,1); ctx.translate(0,-160*S.fLift.x);
    ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.8; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(FX-70,FT); ctx.lineTo(FX-8,FT+90); ctx.lineTo(FX-8,FT+128); ctx.moveTo(FX+70,FT); ctx.lineTo(FX+8,FT+90); ctx.lineTo(FX+8,FT+128); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.setLineDash([5,3]); ctx.beginPath(); ctx.moveTo(FX-62,FT+4); ctx.lineTo(FX,FT+86); ctx.lineTo(FX+62,FT+4); ctx.stroke(); ctx.restore();
    if(S.Vf>0.02){ const hgt=70*Math.sqrt(Math.min(1,S.Vf/5)); ctx.save(); ctx.beginPath(); ctx.moveTo(FX-60,FT+2); ctx.lineTo(FX,FT+86); ctx.lineTo(FX+60,FT+2); ctx.closePath(); ctx.clip(); ctx.fillStyle=rgba(s.c,0.35); ctx.fillRect(FX-70,FT+86-hgt,140,hgt); ctx.restore(); }
    if(S.paperSoil>0.01){ ctx.save(); ctx.fillStyle=s.c; ctx.globalAlpha*=clamp(S.paperSoil*4,0,0.9); ctx.beginPath(); ctx.moveTo(FX-18,FT+62); ctx.lineTo(FX,FT+86); ctx.lineTo(FX+18,FT+62); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.restore();
    if(S.V2>0.01){ polyFill(ctx,r2.poly,'rgba(236,222,170,0.45)'); const sl=surfLine(r2.poly,r2.L); if(sl) line(ctx,sl[0],r2.L,sl[1],r2.L,COL.blue,1.8); }
    S.drops.forEach(d=>dropDraw(ctx,d,'rgba(236,222,170,0.9)'));
    glassDraw(ctx,P2,2.6); textAt(ctx,'filtrate',T2.x+T2.W/2+10,T2.b-30,{size:12,weight:700,color:COL.blue});
    spatula(ctx,S.spoon.x.x,S.spoon.y.x,S.spA.x,S.spoonLoad,s.c);
    if(S.pourW) { line(ctx,150,40,150,r.L,'rgba(47,143,224,0.55)',4); textAt(ctx,'water',160,60,{size:12,weight:700,color:COL.blue}); }
    textAt(ctx,s.f,150,540,{align:'center',size:14,weight:800,color:COL.yellow});
    dipDraw(ctx,D,120,20);
    // pH chart + crop preferences
    const CX0=540, CW=240, cy=150; phChart(ctx,CX0,cy,CW,24,shown?[{pH:s.pH,col:natureCol(s.pH),label:'soil'}]:[],{labels:true});
    const pxOf=p=>CX0+(p+0.5)*CW/15;
    CROPS.forEach((c,i)=>{ const y=250+i*36, ok=shown&&s.pH>=c[1]&&s.pH<=c[2]; textAt(ctx,c[0],CX0-8,y+5,{align:'right',size:12.5,weight:700,color:ok?COL.green:COL.muted});
      line(ctx,pxOf(0),y,pxOf(14),y,'#e4ebf3',1.2); ctx.save(); ctx.lineCap='round'; line(ctx,pxOf(c[1]),y,pxOf(c[2]),y,ok?COL.green:COL.mid,ok?9:6); ctx.restore(); });
    if(shown){ const x=pxOf(s.pH); line(ctx,x,236,x,250+CROPS.length*36-20,natureCol(s.pH),2,[5,4]); }
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.13 FAMILY OF SALTS
   Acid HₙA → n H⁺ + Aⁿ⁻ ; base M(OH)ₘ → Mᵐ⁺ + m OH⁻.
   Every H⁺ meets an OH⁻ and leaves as water; the ions that are left
   lock together in the only ratio that makes the charge zero:
   (x cations)·m = n → formula MₓA. Cation tiles carry m pegs, the anion
   carries n sockets, so the fit itself is the charge balance.
   Families: same cation (row) or same anion (column) of the grid.
   ===================================================================== */
function buildA13(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CAT={Na:{f:'Na⁺',q:1,base:'NaOH'},K:{f:'K⁺',q:1,base:'KOH'},Ca:{f:'Ca²⁺',q:2,base:'Ca(OH)₂'},Mg:{f:'Mg²⁺',q:2,base:'Mg(OH)₂'},Cu:{f:'Cu²⁺',q:2,base:'Cu(OH)₂'},NH4:{f:'NH₄⁺',q:1,base:'NH₄OH'}};
  const AN={SO4:{f:'SO₄²⁻',z:2,acid:'H₂SO₄'},Cl:{f:'Cl⁻',z:1,acid:'HCl'},NO3:{f:'NO₃⁻',z:1,acid:'HNO₃'},CO3:{f:'CO₃²⁻',z:2,acid:'H₂CO₃'}};
  const SALTS=[['Potassium sulphate','K','SO4','K₂SO₄'],['Sodium sulphate','Na','SO4','Na₂SO₄'],['Calcium sulphate','Ca','SO4','CaSO₄'],['Magnesium sulphate','Mg','SO4','MgSO₄'],['Copper sulphate','Cu','SO4','CuSO₄'],
    ['Sodium chloride','Na','Cl','NaCl'],['Sodium nitrate','Na','NO3','NaNO₃'],['Sodium carbonate','Na','CO3','Na₂CO₃'],['Ammonium chloride','NH4','Cl','NH₄Cl']];
  const ROWS=['Na','K','Ca','Mg','Cu','NH4'], COLS=['SO4','Cl','NO3','CO3'];
  const AB={x:90,y:150}, BB={x:390,y:150}, CEN={x:240,y:380}, W0=36;
  let si=0, t=0, by='cat', auto=false; const built={};
  const S={};
  function start(i){ si=i; const s=SALTS[i], c=CAT[s[1]], a=AN[s[2]], nC=a.z/c.q;
    S.T=0; S.done=false; S.tiles=[]; S.hs=[]; S.water=[];
    S.tiles.push({kind:'an',p:sprP(AB.x,AB.y-40),n:a.z,label:a.f});
    for(let k=0;k<nC;k++) S.tiles.push({kind:'cat',k,p:sprP(BB.x,BB.y-40),n:c.q,label:c.f});
    for(let k=0;k<a.z;k++){ S.hs.push({kind:'H',k,p:sprP(AB.x,AB.y-40)}); S.hs.push({kind:'OH',k,p:sprP(BB.x,BB.y-40)}); }
    S.nC=nC; S.z=a.z; }
  side.innerHTML=`
    <div class="control-group"><label>Salt</label><div class="chip-wrap">${SALTS.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${s[0]}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="all">▶ Build all nine</button></div>
      <label style="margin-top:8px">Family by</label><div class="toggle-group"><button class="toggle-btn active" data-b="cat">Positive ion</button><button class="toggle-btn" data-b="an">Negative ion</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Formula',COL.ink)}${card('r2','Charge',COL.green)}${card('r3','From acid',COL.red)}${card('r4','From base',COL.blue)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  chipsWire(side,'[data-s]',b=>{ auto=false; start(+b.dataset.s); });
  chipsWire(side,'[data-b]',b=>{ by=b.dataset.b; });
  $('#all').onclick=()=>{ auto=true; start(0); side.querySelectorAll('[data-s]').forEach((b,k)=>b.classList.toggle('active',k===0)); };
  start(0);
  function tile(ctx,x,y,kind,n,label){ const w=kind==='an'?n*W0*1.25+26:n*W0*1.25-6, h=38, col=kind==='an'?COL.blue:COL.red; ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.6; ctx.strokeStyle=col; ctx.fillStyle='#fff';
    const x0=x-w/2, y0=y-h/2; ctx.beginPath();
    if(kind==='an'){ ctx.moveTo(x0,y0); for(let k=0;k<n;k++){ const cx=x+(k-(n-1)/2)*W0*1.25; ctx.lineTo(cx-7,y0); ctx.lineTo(cx-7,y0+10); ctx.lineTo(cx+7,y0+10); ctx.lineTo(cx+7,y0); } ctx.lineTo(x0+w,y0); ctx.lineTo(x0+w,y0+h); ctx.lineTo(x0,y0+h); ctx.closePath(); }
    else { ctx.moveTo(x0,y0); ctx.lineTo(x0+w,y0); ctx.lineTo(x0+w,y0+h); for(let k=n-1;k>=0;k--){ const cx=x+(k-(n-1)/2)*W0*1.25; ctx.lineTo(cx+6,y0+h); ctx.lineTo(cx+6,y0+h+9); ctx.lineTo(cx-6,y0+h+9); ctx.lineTo(cx-6,y0+h); } ctx.lineTo(x0,y0+h); ctx.closePath(); }
    ctx.fill(); ctx.stroke(); const fs=fitFont(ctx,label,w-8,17,800); textAt(ctx,label,x,y+(kind==='an'?9:4)+fs*0.2,{align:'center',size:fs,weight:800,color:col}); ctx.restore(); }
  animLoop(dt=>{
    t+=dt; S.T+=dt; const T=S.T, s=SALTS[si], c=CAT[s[1]], a=AN[s[2]];
    /* targets from the timeline: split below the bottles → water forms → ions lock */
    const split=T>0.3, meet=T>1.8, lock=T>2.6;
    S.hs.forEach(p=>{ const isH=p.kind==='H', b=isH?AB:BB; let tx=b.x, ty=b.y-40;
      if(split){ tx=b.x+(isH?-1:1)*(30+p.k*34)*0.6+(isH?30:-30); ty=b.y+70+p.k*30; }
      if(meet){ tx=CEN.x+(isH?-16:16); ty=200+p.k*44; }
      if(T>2.5){ p.gone=true; } sprPStep(p.p,tx,ty,dt,55,11); });
    if(T>2.5&&!S.water.length) for(let k=0;k<S.z;k++) S.water.push({x:CEN.x,y:200+k*44,vy:-20,t:0});
    S.water.forEach(w=>{ w.t+=dt; w.y+=w.vy*dt; w.vy-=10*dt; });
    const nC=S.nC;
    S.tiles.forEach(p=>{ const b=p.kind==='an'?AB:BB; let tx=b.x, ty=b.y-40;
      if(split){ tx=b.x+(p.kind==='an'?0:(p.k-(nC-1)/2)*70); ty=b.y+(p.kind==='an'?120:110); }
      if(lock){ if(p.kind==='an'){ tx=CEN.x; ty=CEN.y; } else { const q=p.n, first=p.k*q, cx=CEN.x+((first+(q-1)/2)-(S.z-1)/2)*W0*1.25; tx=cx; ty=CEN.y-38-4; } }
      sprPStep(p.p,tx,ty,dt,lock?70:50,lock?12:10); });
    if(T>3.6&&!S.done){ S.done=true; built[si]=true; tink(1600,0.05,0.1);
      if(auto){ S.next=0.9; } }
    if(S.next!==undefined&&S.done&&auto){ S.next-=dt; if(S.next<=0){ S.next=undefined; const n=SALTS.findIndex((_,i)=>!built[i]); if(n>=0){ start(n); side.querySelectorAll('[data-s]').forEach((b,k)=>b.classList.toggle('active',k===n)); } else auto=false; } }
    const lab=(nC>1?'('+c.f.replace('⁺','')+')×'+nC:c.f.replace(/[⁺²]/g,''));
    setMany($,{r1:S.done?s[3]:'…', r2:S.done?`${nC>1?nC+'×':''}(+${c.q}) + (−${a.z}) = 0`:'…', r3:a.acid, r4:c.base});
    /* families: groups with 2 or more of the built salts */
    const fam=(by==='cat'?ROWS:COLS).map(k=>({k,n:SALTS.filter((q,i)=>built[i]&&q[by==='cat'?1:2]===k).length})).filter(f=>f.n>=2);
    const allFam=['cat','an'].reduce((s,b)=>s+(b==='cat'?ROWS:COLS).filter(k=>SALTS.filter((q,i)=>built[i]&&q[b==='cat'?1:2]===k).length>=2).length,0);
    if(Object.keys(built).length===9) fbSet(fb,'ok',`Families with 2 or more salts: ${allFam} — sodium, sulphate, chloride.`);
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    bottleDraw(ctx,AB.x,AB.y,80,120,a.acid,COL.red,'rgba(217,67,43,0.1)'); bottleDraw(ctx,BB.x,BB.y,80,120,c.base,COL.blue,'rgba(47,143,224,0.1)');
    textAt(ctx,'acid',AB.x,AB.y+22,{align:'center',size:12,weight:700,color:COL.red}); textAt(ctx,'base',BB.x,BB.y+22,{align:'center',size:12,weight:700,color:COL.blue});
    if(split&&!lock){ vec(ctx,AB.x+44,AB.y+20,AB.x+80,AB.y+60,COL.mid,1.6); vec(ctx,BB.x-44,BB.y+20,BB.x-80,BB.y+60,COL.mid,1.6); }
    S.hs.forEach(p=>{ if(p.gone||!split) return; ionDraw(ctx,p.p.x.x,p.p.y.x,p.kind==='H'?11:13,p.kind==='H'?1:-1,{sym:p.kind}); });
    S.water.forEach(w=>{ const a=clamp(1-(w.t-1.4)/1.2,0,1); if(a<=0) return; ctx.save(); ctx.globalAlpha=a; waterMol(ctx,w.x,w.y,9,0,1); ctx.restore(); textAt(ctx,'H₂O',w.x+22,w.y+5,{size:13,weight:800,color:COL.green,alpha:a}); });
    S.tiles.forEach(p=>{ if(!split&&T<0.2) return; tile(ctx,p.p.x.x,p.p.y.x,p.kind,p.n,p.label); });
    if(S.done){ textAt(ctx,s[3],CEN.x,CEN.y+72,{align:'center',size:34,weight:800,color:COL.ink}); textAt(ctx,s[0],CEN.x,CEN.y+100,{align:'center',size:14,weight:700,color:COL.muted}); mark(ctx,CEN.x+110,CEN.y-20,true,1); }
    // family grid: rows = positive ion, columns = negative ion
    const GX=530, GY=150, CW=62, RH=52;
    COLS.forEach((k,j)=>textAt(ctx,AN[k].f,GX+j*CW+CW/2,GY-12,{align:'center',size:13,weight:800,color:COL.blue}));
    ROWS.forEach((k,i)=>textAt(ctx,CAT[k].f,GX-8,GY+i*RH+RH/2+5,{align:'right',size:13,weight:800,color:COL.red}));
    fam.forEach(f=>{ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.setLineDash([]); ctx.fillStyle=rgba(COL.green,0.08);
      if(by==='cat'){ const i=ROWS.indexOf(f.k); rrect(ctx,GX-3,GY+i*RH+2,COLS.length*CW+6,RH-4,12); } else { const j=COLS.indexOf(f.k); rrect(ctx,GX+j*CW+2,GY-3,CW-4,ROWS.length*RH+6,12); } ctx.fill(); ctx.stroke(); ctx.restore(); });
    ROWS.forEach((rk,i)=>COLS.forEach((ck,j)=>{ const x=GX+j*CW, y=GY+i*RH, k=SALTS.findIndex(q=>q[1]===rk&&q[2]===ck);
      rrect(ctx,x+6,y+8,CW-12,RH-16,7); ctx.save(); ctx.fillStyle=k>=0&&built[k]?'#fff':'#f4f7fb'; ctx.fill(); ctx.strokeStyle=k===si?COL.yellow:'#dbe4f0'; ctx.lineWidth=k===si?2.6:1.2; ctx.stroke(); ctx.restore();
      if(k>=0&&built[k]){ const fs=fitFont(ctx,SALTS[k][3],CW-16,13,800); textAt(ctx,SALTS[k][3],x+CW/2,y+RH/2+5,{align:'center',size:fs,weight:800,color:COL.ink}); }
      else if(k>=0) textAt(ctx,'?',x+CW/2,y+RH/2+5,{align:'center',size:13,weight:800,color:COL.mid}); }));
    textAt(ctx,fam.length?fam.map(f=>(by==='cat'?CAT:AN)[f.k].f).join(', ')+' famil'+(fam.length>1?'ies':'y'):'build more salts',GX+CW*2,GY+ROWS.length*RH+26,{align:'center',size:13,weight:700,color:COL.green});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.14 pH OF SALTS  (Table 2.4)
   0.1 M solutions in distilled water; pH from the charge-balance engine:
   NaCl 7.0, KNO₃ 7.0 (strong + strong), AlCl₃ 2.9, CuSO₄ 4.7, ZnSO₄ 5.7
   (the hydrated metal ion gives up H⁺: weak base + strong acid),
   CH₃COONa 8.9, NaHCO₃ 8.3, Na₂CO₃ 11.6 (the anion takes H⁺ from water
   and leaves OH⁻: strong base + weak acid).
   Crystals dissolve at dm/dt ∝ −m^(2/3) (swirled). Red and blue litmus
   dip together, then universal paper is matched on the chart.
   ===================================================================== */
function buildA14(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const SALT=[{k:'NaCl',f:'NaCl',n:'Sodium chloride',a:['HCl',1],b:['NaOH',1]},{k:'KNO3',f:'KNO₃',n:'Potassium nitrate',a:['HNO₃',1],b:['KOH',1]},
    {k:'AlCl3',f:'AlCl₃',n:'Aluminium chloride',a:['HCl',1],b:['Al(OH)₃',0]},{k:'ZnSO4',f:'ZnSO₄',n:'Zinc sulphate',a:['H₂SO₄',1],b:['Zn(OH)₂',0]},
    {k:'CuSO4',f:'CuSO₄',n:'Copper sulphate',a:['H₂SO₄',1],b:['Cu(OH)₂',0],col:'rgba(47,143,224,0.35)'},{k:'CH3COONa',f:'CH₃COONa',n:'Sodium acetate',a:['CH₃COOH',0],b:['NaOH',1]},
    {k:'Na2CO3',f:'Na₂CO₃',n:'Sodium carbonate',a:['H₂CO₃',0],b:['NaOH',1]},{k:'NaHCO3',f:'NaHCO₃',n:'Sodium hydrogencarbonate',a:['H₂CO₃',0],b:['NaOH',1]}];
  const CX=240, TOP=200, BOT=410, BW=220, CH={x:40,y:470,w:720,h:30}, L=120;
  let si=0, t=0; const done={}; const seq=seqNew();
  const R=[dipNew(395,14),dipNew(430,14),dipNew(475,14)];
  const S={};
  function reset(){ Object.assign(S,{cr:[], dis:0, swirl:0, spoon:sprP(40,150), spA:spr(0), spT:{x:40,y:150,a:0}, load:0, stage:0}); R.forEach(D=>{ D.phase='rest'; D.wet=0; D.col=null; D.p.x.x=D.home.x; D.p.y.x=D.home.y; }); seq.q=[]; seq.cur=null; }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Salt</label><div class="chip-wrap">${SALT.map((s,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${i}">${s.f}</button>`).join('')}</div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Dissolve and test</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Dissolves?',COL.blue)}${card('r2','Litmus',COL.ink)}${card('r3','pH',COL.green)}${card('r4','Nature',COL.ink)}</div><div id="log"></div></div>`;
  const log=$('#log');
  const refresh=()=>{ const rows=SALT.map((s,i)=>done[i]?[s.f,{v:fmt(phOf(s.k,0.1),1),c:phOf(s.k,0.1)<6.5?'r-bad':phOf(s.k,0.1)>7.5?'':'r-ok'},s.a[0]+(s.a[1]?' (S)':' (W)'),s.b[0]+(s.b[1]?' (S)':' (W)')]:null).filter(Boolean); log.innerHTML=rows.length?logTable(['Salt','pH','Acid','Base'],rows)+'<p class="hint">S = strong, W = weak</p>':''; };
  chipsWire(side,'[data-s]',b=>{ si=+b.dataset.s; reset(); });
  $('#go').onclick=()=>{ if(seqBusy(seq)||S.stage>0) return; const pH=phOf(SALT[si].k,0.1);
    seqAdd(seq,1.0,null,null,()=>{ S.spT={x:CX-60,y:TOP-40,a:0.2}; S.load=1; });
    seqAdd(seq,0.6,u=>{ S.spT.a=0.2+0.9*u; },()=>{ S.load=0; for(let k=0;k<14;k++) S.cr.push({x:CX-60+Math.random()*30,y:TOP-30,vy:0,m:1,rest:false,ang:Math.random()*3}); });
    seqAdd(seq,0.8,null,null,()=>{ S.spT={x:40,y:150,a:0}; S.swirl=3; });
    seqAdd(seq,99,(e,u,dt)=>{ if(S.dis>0.99) seq.cur.dur=0; },()=>{ S.stage=1; });
    seqAdd(seq,0.2,null,()=>{ dipStart(R[0],pH,redLitmus,LIT_R); dipStart(R[1],pH,blueLitmus,LIT_B); });
    seqAdd(seq,99,(e,u,dt)=>{ if(R[0].phase==='done') seq.cur.dur=0; },()=>{ S.stage=2; dipStart(R[2],pH,uniCol); });
    seqAdd(seq,99,(e,u,dt)=>{ if(R[2].phase==='done') seq.cur.dur=0; },()=>{ S.stage=3; done[si]=true; refresh(); }); };
  animLoop(dt=>{
    t+=dt; seqStep(seq,dt); const s=SALT[si], pH=phOf(s.k,0.1);
    sprPStep(S.spoon,S.spT.x,S.spT.y,dt,50,12); springTo(S.spA,S.spT.a,50,12,dt);
    const lv=TOP+70; S.swirl=Math.max(0,S.swirl-dt*0.4);
    S.cr.forEach(c=>{ if(!c.rest){ c.vy+=900*dt; if(c.y>lv) c.vy*=Math.exp(-6*dt); c.y+=c.vy*dt; if(c.y>=BOT-10){ c.y=BOT-10; c.rest=true; } }
      if(c.y>lv) c.m=Math.max(0,c.m-0.45*Math.pow(c.m,2/3)*(1+2*(S.swirl>0?1:0))*dt); if(S.swirl>0) c.x=CX+(c.x-CX)*Math.cos(dt*2)+Math.sin(t*6+c.ang)*0.6; });
    if(S.cr.length){ S.dis=1-S.cr.reduce((a,c)=>a+c.m,0)/S.cr.length; }
    // litmus pair shares one dip, side by side
    dipStep(R[0],dt,{x:CX-36,y:lv},null,L); dipStep(R[1],dt,{x:CX,y:lv},null,L);
    dipStep(R[2],dt,{x:CX+36,y:lv},p=>({x:CH.x+(p+0.5)*CH.w/15,y:CH.y-L-8}),L);
    const lit=S.stage>=2?(pH<5.4?'blue → red':pH>8.3?'red → blue':'no change'):'—';
    setMany($,{r1:S.stage>=1?'yes, soluble':'—', r2:lit, r3:S.stage>=3?fmt(pH,1):'—', r4:S.stage>=3?natureOf(pH):'—'}); if(S.stage>=3) setc($,'r4',natureCol(pH));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    line(ctx,20,BOT+2,480,BOT+2,COL.ink,2.6);
    const solCol=s.col?rgba(COL.blue,0.06+0.3*S.dis):'rgba(47,143,224,0.08)';
    ctx.save(); ctx.fillStyle=solCol; ctx.fillRect(CX-BW/2+2,lv,BW-4,BOT-lv-2); ctx.restore(); line(ctx,CX-BW/2+2,lv,CX+BW/2-2,lv,COL.blue,2);
    if(S.swirl>0.05){ ctx.save(); ctx.strokeStyle=rgba(COL.blue,0.35*S.swirl/3); ctx.lineWidth=1.4; for(let k=0;k<3;k++){ ctx.beginPath(); ctx.ellipse(CX,lv+40+k*40,BW*0.38-k*12,7,0,t*3+k,t*3+k+2.4); ctx.stroke(); } ctx.restore(); }
    S.cr.forEach(c=>{ if(c.m<=0.01) return; crystal(ctx,c.x,c.y,10*Math.cbrt(c.m),c.ang,s.col?COL.blue:COL.ink,s.k==='NaCl'||s.k==='KNO3'?'cube':'rhomb'); });
    beakerDraw(ctx,CX,TOP,BOT,BW);
    textAt(ctx,s.n,CX,TOP-30,{align:'center',size:14,weight:800,color:COL.yellow}); textAt(ctx,'in distilled water',CX,TOP-12,{align:'center',size:11.5,weight:600,color:COL.muted});
    spatula(ctx,S.spoon.x.x,S.spoon.y.x,S.spA.x,S.load,'#fff');
    // parents: which side is strong wins
    if(S.stage>=3){ const X=445, y=150; tag(ctx,s.a[0]+(s.a[1]?' strong':' weak'),X,y,COL.red,{size:12,alpha:s.a[1]?1:0.55}); textAt(ctx,'+',X,y+27,{align:'center',size:16,weight:800,color:COL.ink}); tag(ctx,s.b[0]+(s.b[1]?' strong':' weak'),X,y+46,COL.blue,{size:12,alpha:s.b[1]?1:0.55});
      vec(ctx,X,y+62,X,y+88,COL.mid,1.6); tag(ctx,natureOf(pH),X,y+104,natureCol(pH),{size:13}); }
    phChart(ctx,CH.x,CH.y,CH.w,CH.h,SALT.map((q,i)=>done[i]?{pH:phOf(q.k,0.1),col:natureCol(phOf(q.k,0.1)),label:q.f,dy:(i%3)*13,a:i===si?1:0.5}:null).filter(Boolean),{labels:false});
    // lens: what the ions do to water
    const LX=650, LY=196; if(S.stage>=1) lens(ctx,LX,LY,92,CX+50,lv+50,'',()=>{ const ph=(t*0.5)%1;
      for(let k=0;k<10;k++) waterMol(ctx,LX-70+(k*43)%140,LY-60+(k*31)%120,5,k+t*0.3,0.35);
      if(pH<6.5){ const m=s.k==='AlCl3'?'Al':s.k==='ZnSO4'?'Zn':'Cu', q=s.k==='AlCl3'?3:2; ionDraw(ctx,LX-20,LY,16,q,{sym:m}); for(let j=0;j<6;j++){ const a=j/6*Math.PI*2; waterMol(ctx,LX-20+Math.cos(a)*30,LY+Math.sin(a)*30,5,a+Math.PI,0.8); }
        ionDraw(ctx,LX+20+ph*50,LY-20-ph*40,9,1,{sym:'H'}); }
      else if(pH>7.5){ const an=s.k==='CH3COONa'?'Ac':s.k==='Na2CO3'?'CO₃':'HCO₃'; ionDraw(ctx,LX-20,LY,16,s.k==='Na2CO3'?-2:-1,{sym:an}); waterMol(ctx,LX+20-ph*20,LY-10,7,0.5,0.9); ionDraw(ctx,LX+30+ph*40,LY+20+ph*30,10,-1,{sym:'OH'}); }
      else { ionDraw(ctx,LX-30,LY,12,1,{sym:s.k==='NaCl'?'Na':'K'}); ionDraw(ctx,LX+30,LY,12,-1,{sym:s.k==='NaCl'?'Cl':'NO₃'}); } });
    if(S.stage>=1) tag(ctx,pH<6.5?'metal ion releases H⁺':pH>7.5?'anion leaves OH⁻':'ions leave water neutral',LX,LY+108,natureCol(pH),{size:12});
    R.forEach((D,i)=>{ if(D.phase==='rest'&&i<2&&S.stage<1) return; dipDraw(ctx,D,L,20); });
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   2.15 WATER OF CRYSTALLISATION — CuSO₄·5H₂O
   0.50 g blue crystals = 2.0 mmol (10 mmol of water inside).
   Powder + tube ≈ 15 J/K; burner puts 40 W into it, loses 0.12 W/K.
   Water leaves in three steps (real thermal analysis):
     5 → 3 H₂O above ≈ 95 °C, 3 → 1 above ≈ 115 °C, 1 → 0 above ≈ 220 °C,
   dn/dt = −0.035/s·smooth(T), each unit of n soaks up 2 mmol × 57 kJ/mol
   = 114 J — so the temperature stalls on each step.
   Vapour condenses where the glass is below 100 °C (near the mouth).
   A drop of water on white CuSO₄: +1.4 in n, 160 J released → it hisses
   (+11 °C per drop) and turns blue again. Time ×30.
   ===================================================================== */
function buildA15(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BX=250, BY=352, TW=58, TH=320, ANG=1.1, SPEED=30;
  let heat=false, t=0; const S={};
  const ax=[Math.sin(ANG),-Math.cos(ANG)], nx=[Math.cos(ANG),Math.sin(ANG)]; // tube axis (bottom → mouth), normal
  const at=(s,o)=>[BX+ax[0]*s+nx[0]*(o||0), BY+ax[1]*s+nx[1]*(o||0)];
  function reset(){ const r=rng(15); Object.assign(S,{T:25, n:5, water:0, cond:[], vap:[], drop:null, sq:spr(0), hiss:0, steam:[], wet:[], cr:Array.from({length:34},(_,i)=>({s:6+r()*54, o:(r()-0.5)*(TW-18), a:r()*3, L:7+r()*5}))}); }
  reset();
  side.innerHTML=`
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="ht">🔥 Heat the crystals</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="wd">💧 Add a drop of water</button><button class="toggle-btn" id="rs">↺ Fresh crystals</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Powder',COL.red)}${card('r2','H₂O per CuSO₄',COL.blue)}${card('r3','Colour',COL.ink)}${card('r4','Water driven off',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#ht').onclick=()=>{ heat=!heat; setBtn($('#ht'),heat?'■ Stop heating':'🔥 Heat the crystals',heat?'active':'play'); };
  $('#wd').onclick=()=>{ if(S.drop) return; if(heat||S.T>50){ fbSet(fb,'warn','Stop heating and let it cool below 50 °C first.'); return; } S.drop={u:0}; S.sq.v+=16; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  const colOf=n=>rampCol([[0,'#eef0ec'],[1,'#c9d9ea'],[3,'#7fb0e3'],[5,'#1f6fd1']],n);
  animLoop(dt=>{
    t+=dt; const h=dt*SPEED; springTo(S.sq,0,300,18,dt);
    /* dehydration steps */
    const steps=[[5,3,95],[3,1,115],[1,0,220]]; let dn=0;
    steps.forEach(([hi,lo,Tc])=>{ if(S.n>lo+1e-6&&S.n<=hi+1e-6){ const r=0.035*smooth01(Tc-5,Tc+25,S.T)*h; const d=Math.min(r,S.n-lo); dn+=d; } });
    S.n-=dn; S.water+=dn*2*18/1000; // grams
    const Pin=heat?40:0; S.T+=(Pin*h-0.12*(S.T-25)*h-dn*114)/15;
    if(dn>0&&Math.random()<dn*260) S.vap.push({s:50,o:(Math.random()-0.5)*20,v:60+Math.random()*40,t:0,cs:TH*(0.6+Math.random()*0.32)});
    S.vap.forEach(v=>{ v.t+=dt; v.s+=v.v*dt; v.o+=(Math.random()-0.5)*20*dt; });
    S.vap=S.vap.filter(v=>{ if(v.s>v.cs){ // condense on the cool glass near the mouth
        const near=S.cond.find(c=>Math.abs(c.s-v.s)<9&&Math.sign(c.o)===Math.sign(v.o)); if(near) near.r=Math.min(7,near.r+0.6); else S.cond.push({s:v.s,o:(v.o>0?1:-1)*(TW/2-5),r:2}); return false; } return true; });
    S.cond.forEach(c=>{ if(c.r>5.5) c.s-=6*dt; if(c.s<TH*0.45&&S.T>100){ c.gone=true; S.hiss=0.4; } }); S.cond=S.cond.filter(c=>!c.gone);
    /* a drop of water slides down the inside wall to the powder */
    if(S.drop){ S.drop.u+=dt*0.9; if(S.drop.u>=1){ S.drop=null; const add=Math.min(1.4,5-S.n); S.n+=add; S.T+=add*114/15; S.wet.push({s:30,o:(Math.random()-0.5)*20,r:0}); S.hiss=S.T>90?1:0.3; if(S.T>90) noiseBurst(0.4,0.15,3000,0.6); drip();
        for(let k=0;k<6;k++) smokeAdd(S.steam,...at(40,0),'#9fb3c8');
        fbSet(fb,S.n>4.9?'ok':'warn',S.n>4.9?'Blue again — and it got warm: the water joined the crystal.':'Turning blue where the water lands… add more.'); } }
    S.wet.forEach(w=>w.r=approach(w.r,40,2,dt)); S.hiss=Math.max(0,S.hiss-dt); smokeStep(S.steam,dt,2);
    if(S.n<0.05&&fb.className.includes('hidden')) fbSet(fb,'ok','White anhydrous CuSO₄ — the blue came from the water in the crystal.');
    setMany($,{r1:fmt(S.T,0)+' °C', r2:fmt(S.n,1), r3:S.n>4?'blue':S.n>2?'pale blue':S.n>0.5?'bluish white':'white', r4:fmt(S.water,2)+' g'}); setc($,'r3',S.n>2?'#1f6fd1':COL.muted);
    /* ---------------- draw ---------------- */
    const {ctx,w,h:H}=fitCanvas(canvas); ctx.clearRect(0,0,w,H); ctx.save(); stg(ctx,w,H);
    benchTop(ctx,510);
    burnerDraw(ctx,BX-20,510,t,heat?0.8:0);
    // clamp stand + holder near the mouth
    line(ctx,600,510,600,130,COL.ink,4); rect(ctx,570,500,80,10,COL.ink,'#fff',2);
    const hold=at(TH*0.78); line(ctx,600,hold[1],hold[0],hold[1],COL.ink,3.4); circ(ctx,hold[0],hold[1],10,COL.ink,'#fff',2.4);
    const P=tubeAt(TW,TH,BX,BY,ANG);
    // powder heap: the crystals sit in the bottom of the tube
    const pc=colOf(S.n);
    polyClipFill(ctx,P,()=>{ S.cr.forEach(c=>{ const p=at(c.s,c.o); crystal(ctx,p[0],p[1],c.L*(0.75+0.05*S.n),c.a+ANG,mixCol(COL.mid,'#1f6fd1',S.n/5),'rhomb',1); });
      S.wet.forEach(wv=>{ const p=at(wv.s,wv.o); spotDraw(ctx,p[0],p[1],wv.r,rgba('#1f6fd1',0.35),1,0.8); });
      // glowing hot glass at the bottom
      if(S.T>120){ const p=at(10,0); glow(ctx,p[0],p[1],60,COL.red,clamp((S.T-120)/200,0,0.6)); } });
    // vapour and condensed droplets
    S.vap.forEach(v=>{ const p=at(v.s,v.o); circ(ctx,p[0],p[1],2.2+v.t*2,COL.blue,null,1.2); });
    S.cond.forEach(c=>{ const p=at(c.s,c.o); circ(ctx,p[0],p[1],c.r,COL.blue,'rgba(47,143,224,0.35)',1.4); });
    glassDraw(ctx,P,3);
    if(S.T>60&&heat) for(let k=0;k<2;k++){ const p=at(20+k*30,-TW/2-6); heatWave(ctx,p[0],p[1],36,-Math.PI/2-0.4,COL.red,t+k,clamp((S.T-60)/150,0,0.8),3); }
    smokeDraw(ctx,S.steam,2); if(S.hiss>0.05) textAt(ctx,'tsss…',...at(40,-50),{align:'center',size:16,weight:800,color:COL.red,alpha:S.hiss});
    // dropper at the mouth; the drop runs down the wall
    const m=at(TH+26,0); dropperDraw(ctx,m[0],m[1]-6,clamp(S.sq.x/6,0,1),0.6,'rgba(47,143,224,0.25)'); textAt(ctx,'water',m[0]+18,m[1]-120,{size:13,weight:800,color:COL.yellow});
    if(S.drop){ const p=at(lerp(TH-10,40,ease(S.drop.u)),TW/2-8); circ(ctx,p[0],p[1],5,COL.blue,'rgba(47,143,224,0.6)',1.6); }
    // thermometer-style temperature scale beside the burner
    labThermo(ctx,70,150,420,S.T,0,300,{step:50});
    textAt(ctx,S.n<0.05?'CuSO₄ (anhydrous)':'CuSO₄·'+(S.n>4.95?'5':fmt(S.n,1))+'H₂O',BX+40,BY+70,{size:16,weight:800,color:pc==='#eef0ec'?COL.ink:'#1f6fd1'});
    // lens: one Cu²⁺ with its water molecules — they leave as it heats
    const LX=200, LY=104; lens(ctx,LX,LY,76,...at(30,0),'',()=>{ ionDraw(ctx,LX-10,LY,16,2,{sym:'Cu'}); sulfateDraw(ctx,LX+44,LY+34,12,t*0.2,1);
      const k=Math.round(S.n); for(let j=0;j<5;j++){ const a=j/5*Math.PI*2+0.3, on=j<k; const r=on?34:34+((t*40+j*20)%60); ctx.save(); ctx.globalAlpha=on?1:clamp(1-(r-34)/60,0,1)*(S.T>90?1:0); waterMol(ctx,LX-10+Math.cos(a)*r,LY+Math.sin(a)*r,6,a+Math.PI/2,1); ctx.restore(); }
      textAt(ctx,k+' H₂O',LX,LY+66,{align:'center',size:13,weight:800,color:COL.blue}); });
    if(S.n<4.9) eqStrip(ctx,[{t:'CuSO₄·5H₂O',col:'#1f6fd1'},{t:' ⇌ CuSO₄ + '},{t:'5H₂O',col:COL.blue}],450,470,clamp(5-S.n,0,1),14);
    ctx.restore();
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'2.1', title:'Indicators on a Watch-glass', desc:'Test nine acids and bases with four indicators', build: buildA1 },
  { num:'2.2', title:'Olfactory Indicators', desc:'Onion, vanilla and clove — does the smell survive?', build: buildA2 },
  { num:'2.3', title:'Acids + Zinc', desc:'Zinc in dilute acids — bubbles, soap and a pop', build: ()=>buildZn('acid') },
  { num:'2.4', title:'Zinc + Warm NaOH', desc:'A base can give hydrogen too — warm it', build: ()=>buildZn('base') },
  { num:'2.5', title:'Carbonates + HCl', desc:'Na₂CO₃ and NaHCO₃ with acid — the gas in lime water', build: buildA5 },
  { num:'2.6', title:'Neutralisation', desc:'NaOH with phenolphthalein, HCl drop by drop', build: buildA6 },
  { num:'2.7', title:'Copper Oxide + HCl', desc:'Add acid slowly while stirring', build: buildA7 },
  { num:'2.8', title:'Do Acids Conduct?', desc:'Nails, a 6 V battery and a bulb', build: buildA8 },
  { num:'2.9', title:'Dry HCl Gas', desc:'Dry and wet blue litmus in HCl gas', build: buildA9 },
  { num:'2.10', title:'Acid or Base + Water', desc:'Touch the beaker — and why acid goes into water', build: buildA10 },
  { num:'2.11', title:'pH of Everyday Solutions', desc:'Table 2.2 with universal-indicator paper', build: buildA11 },
  { num:'2.12', title:'pH of Soil', desc:'Shake, filter, test the filtrate', build: buildA12 },
  { num:'2.13', title:'Family of Salts', desc:'Build nine salts from their ions', build: buildA13 },
  { num:'2.14', title:'pH of Salts', desc:'Table 2.4 — acidic, basic or neutral?', build: buildA14 },
  { num:'2.15', title:'Water of Crystallisation', desc:'Heat blue copper sulphate, then add water', build: buildA15 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
