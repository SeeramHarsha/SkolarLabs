<head>

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 9: LIFE PROCESSES IN ANIMALS
   Activities 9.1 – 9.3 (NCERT Curiosity, gecu109). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. Saliva
   cuts starch chains at random bonds while the jaw chews, iodine drops sink
   and spread before they mix, a bottle lung model obeys Boyle's law with
   real balloon stretch and tube resistance, and CO₂ bubbled through lime
   water builds chalky CaCO₃ at the rate the gas actually carries it.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

    if(b.co2) { for(let k=0;k<b.co2;k++){ const a=b.ph*0.3+k*2.4; circ(ctx,b.x+Math.cos(a)*b.r*0.45,b.y+Math.sin(a)*b.r*0.45,1.7,COL.red,COL.red,1); } } }

  ctx.restore();
}

/* ---- test tube, round bottom: (x, top) rim centre, bot = outside bottom, r = radius.
        o.level = liquid surface y, o.liq = fill, o.inside(ly) draws inside the liquid, o.rot = tilt about the rim ---- */
function tubePath(ctx,x,top,bot,r){ ctx.beginPath(); ctx.moveTo(x-r,top); ctx.lineTo(x-r,bot-r); ctx.arc(x,bot-r,r,Math.PI,0,true); ctx.lineTo(x+r,top); }
function testTube(ctx,x,top,bot,r,o){
  o=o||{}; ctx.save(); if(o.rot){ ctx.translate(x,o.pivot||top); ctx.rotate(o.rot); ctx.translate(-x,-(o.pivot||top)); }
  ctx.save(); tubePath(ctx,x,top,bot,r); ctx.closePath(); ctx.clip();
  if(o.solid) o.solid();
  if(o.level!==undefined && o.level<bot){ const wob=o.wob||0; ctx.beginPath(); ctx.moveTo(x-r-2,o.level+wob); ctx.quadraticCurveTo(x,o.level+3,x+r+2,o.level-wob); ctx.lineTo(x+r+2,bot+2); ctx.lineTo(x-r-2,bot+2); ctx.closePath();
    ctx.fillStyle=o.liq||'#e4f0fb'; ctx.fill(); if(o.inside) o.inside(o.level);
    ctx.strokeStyle=o.surf||COL.blue; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x-r,o.level+wob); ctx.quadraticCurveTo(x,o.level+3,x+r,o.level-wob); ctx.stroke(); }
  if(o.over) o.over();
  ctx.restore();
  tubePath(ctx,x,top,bot,r); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x,top,r+3,3.5,0,0,Math.PI*2); ctx.lineWidth=1.8; ctx.stroke();
  line(ctx,x-r+6,top+16,x-r+6,bot-r-8,'rgba(129,149,171,0.35)',2);
  if(o.label) textAt(ctx,o.label,x,top-16,{align:'center',size:20,weight:800,color:COL.ink});
  ctx.restore();
}
function tubeStand(ctx,x0,x1,railY,baseY){
  ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  rrect(ctx,x0,railY,x1-x0,14,4); ctx.fill(); ctx.stroke();
  rrect(ctx,x0-12,baseY,x1-x0+24,16,5); ctx.fill(); ctx.stroke();
  line(ctx,x0+10,railY+14,x0+10,baseY,COL.ink,3); line(ctx,x1-10,railY+14,x1-10,baseY,COL.ink,3); ctx.restore();
}

/* ---- dropper with rubber bulb (yellow = what you squeeze); tip at (x,tip) ---- */
function dropper(ctx,x,tip,liq,fill,squeeze){
  ctx.save(); ctx.translate(x,tip); ctx.lineJoin='round'; const L=120, w=7;
  const glass=()=>{ ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(-w,-24); ctx.lineTo(-w,-L); ctx.lineTo(w,-L); ctx.lineTo(w,-24); ctx.lineTo(2,0); ctx.closePath(); };
  if(fill>0){ ctx.save(); glass(); ctx.clip(); const top=-lerp(4,L-8,clamp(fill,0,1)); ctx.fillStyle=liq; ctx.globalAlpha=0.9; ctx.fillRect(-w,top,2*w,-top+2); ctx.restore(); }
  glass(); ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
  const bw=12*(1-0.45*squeeze), bh=40+8*squeeze;
  ctx.beginPath(); ctx.moveTo(-w-2,-L); ctx.bezierCurveTo(-bw-6,-L-bh*0.4,-bw,-L-bh,0,-L-bh); ctx.bezierCurveTo(bw,-L-bh,bw+6,-L-bh*0.4,w+2,-L); ctx.closePath();
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.8; ctx.stroke();
  ctx.restore();
}
function dropShape(ctx,x,y,r,col,stretch){
  const s=stretch||1; ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.moveTo(0,-r*1.6*s); ctx.bezierCurveTo(r*0.6,-r*0.9*s,r,-r*0.3,r,r*0.15); ctx.arc(0,r*0.15,r,0,Math.PI); ctx.bezierCurveTo(-r,-r*0.3,-r*0.6,-r*0.9*s,0,-r*1.6*s);
  ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore();
}
/* teaspoon seen from the side: bowl centre (x,y), handle toward ang, tilt tips the bowl */
function spoonDraw(ctx,x,y,ang,tilt,content){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.lineJoin='round'; ctx.lineCap='round';
  line(ctx,14,-2,120,-14,COL.ink,4); line(ctx,14,-2,120,-14,'#fff',1.4);
  ctx.save(); ctx.rotate(tilt||0);
  if(content) content();
  ctx.beginPath(); ctx.ellipse(0,0,20,9,0,0,Math.PI); ctx.lineTo(-20,0); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); line(ctx,-20,0,20,0,COL.ink,1.6);
  ctx.restore(); ctx.restore();
}

/* ---- side-view head facing right. (x,y) = jaw hinge, s = scale.
        o.jaw 0..1 open, o.pucker 0..1 (lips round a straw), o.puff 0..1 cheeks, o.inside(ctx, mouthPt) draws in the mouth.
        Returns {mouth:{x,y}} in world coords. ---- */
function headSide(ctx,x,y,s,o){
  o=o||{}; const J=(o.jaw||0)*0.34, pk=o.pucker||0, pf=o.puff||0;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.lineJoin='round'; ctx.lineCap='round';
  const ink=COL.ink, lw=2.6/Math.max(0.6,s)*0.9;
  // neck (fixed)
  ctx.lineWidth=lw; ctx.strokeStyle=ink;
  ctx.beginPath(); ctx.moveTo(-66,92); ctx.quadraticCurveTo(-60,140,-72,190); ctx.moveTo(44,104); ctx.quadraticCurveTo(38,150,50,190); ctx.stroke();
  const op=smooth01(0.04,0.3,o.jaw||0);
  ctx.save(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-66,92); ctx.quadraticCurveTo(-104,40,-96,-30); ctx.quadraticCurveTo(-84,-118,0,-128); ctx.quadraticCurveTo(76,-128,88,-60); ctx.lineTo(120,4); ctx.lineTo(104,40); ctx.lineTo(96,96); ctx.lineTo(28,100); ctx.closePath(); ctx.fill(); ctx.restore();
  // mouth cavity (behind the lips) — only seen when the jaw opens
  ctx.save(); ctx.globalAlpha=op;
  const lipU={x:104+pk*6,y:36}, jawP=(px,py)=>({x:px*Math.cos(J)-py*Math.sin(J), y:px*Math.sin(J)+py*Math.cos(J)});
  const lipL=jawP(102+pk*6,46);
  ctx.beginPath(); ctx.moveTo(40,30); ctx.lineTo(lipU.x-4,lipU.y); ctx.lineTo(lipL.x-4,lipL.y); const jb=jawP(40,56); ctx.lineTo(jb.x,jb.y); ctx.closePath();
  ctx.fillStyle='#fbe9e6'; ctx.fill();
  // tongue (moves with jaw)
  ctx.save(); ctx.rotate(J*0.8); ctx.beginPath(); ctx.moveTo(34,52); ctx.quadraticCurveTo(60,34,92,44); ctx.quadraticCurveTo(70,56,34,58); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=rgba(COL.red,0.55); ctx.lineWidth=lw*0.7; ctx.stroke(); ctx.restore();
  ctx.lineWidth=lw*0.7; ctx.strokeStyle=ink; for(let i=0;i<3;i++){ const tx=70+i*8; rrect(ctx,tx,31,6,6,2); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); }
  ctx.restore();
  if(o.inside) o.inside(ctx,{x:(lipU.x+lipL.x)/2-20,y:(lipU.y+lipL.y)/2},J);
  // skull + face (fixed part)
  ctx.lineWidth=lw; ctx.fillStyle='#fff'; ctx.strokeStyle=ink;
  ctx.beginPath(); ctx.moveTo(-66,92); ctx.quadraticCurveTo(-104,40,-96,-30); ctx.quadraticCurveTo(-84,-118,0,-128); ctx.quadraticCurveTo(76,-128,88,-60);
  ctx.quadraticCurveTo(92,-42,94,-30); ctx.lineTo(120,4); ctx.quadraticCurveTo(122,12,108,14); ctx.quadraticCurveTo(104,22,lipU.x+2,lipU.y-8);
  ctx.quadraticCurveTo(lipU.x+6+pk*4,lipU.y-4,lipU.x,lipU.y); ctx.stroke();
  // cheek (puffs out when blowing)
  ctx.lineWidth=lw*0.8; ctx.beginPath(); ctx.moveTo(70,8); ctx.quadraticCurveTo(84+pf*14,26,76+pf*8,44); ctx.stroke();
  // eye, brow, ear
  ctx.lineWidth=lw*0.9; ctx.beginPath(); ctx.moveTo(56,-48); ctx.quadraticCurveTo(68,-54,80,-48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60,-34); ctx.quadraticCurveTo(68,-40,76,-34); ctx.stroke(); circ(ctx,68,-33,2.4,ink,ink,1);
  ctx.beginPath(); ctx.ellipse(-16,-18,11,20,0.15,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.ellipse(-15,-16,5,11,0.15,-1.2,2); ctx.stroke();
  // lower jaw (rotates about the hinge at 0,0)
  ctx.save(); ctx.rotate(J); ctx.lineWidth=lw;
  ctx.save(); ctx.globalAlpha=op; for(let i=0;i<3;i++){ const tx=68+i*8; rrect(ctx,tx,40,6,6,2); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=lw*0.7; ctx.stroke(); } ctx.restore();
  ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(2,8); ctx.quadraticCurveTo(4,70,28,92); ctx.quadraticCurveTo(62,108,90,94); ctx.quadraticCurveTo(104,84,100,62);
  ctx.quadraticCurveTo(108+pk*6,58,102+pk*6,46); ctx.stroke();
  line(ctx,90,62,100,62,ink,lw*0.6);
  ctx.restore();
  // hinge marker
  circ(ctx,0,0,3.2,COL.mid,'#fff',1.4);
  ctx.restore();
  const mx=(lipU.x+lipL.x)/2+4, my=(lipU.y+lipL.y)/2;
  return {mouth:{x:x+mx*s,y:y+my*s}, lip:{x:x+lipU.x*s,y:y+lipU.y*s}};
}

/* =====================================================================
   9.1 LET US INVESTIGATE — does saliva change the starch in rice?
   Model: salivary amylase cuts starch chains at random bonds (random
   scission). A chain of 6 maltose units has 5 bonds; each is cut with
   probability p = 1 − e^(−k·t), k = 0.079 /s. Starch left (pieces of
   ≥ 2 units) S = 1 − (2p + 4p²)/6 → 30 s: 15 %, 45 s: 5 %, 60 s: 1.5 %
   — so a 30–60 s chew gives "very light blue-black" or "no change",
   exactly as the textbook reports. Iodine colour: Beer–Lambert,
   transmittance T = 10^(−3.2·S·c). Chewing runs 8× faster than real time.
   ===================================================================== */
const RICE={base:'#f1ede0', amber:'#c98a22', bb:'#1c2263'};
function starchLeft(t){ const p=1-Math.exp(-0.0789*t); return clamp(1-(2*p+4*p*p)/6,0,1); }
function iodineT(S,ci){ return Math.pow(10,-3.2*S*clamp(ci,0,1.5)); }
function iodineCol(S,ci){ const c1=mixCol(RICE.base,RICE.amber,0.62*clamp(ci,0,1)); return mixCol(RICE.bb,c1,iodineT(S,ci)); }
function iodineName(T){ return T<0.2?'blue-black':T<0.5?'dark blue':T<0.8?'light blue-black':'no change'; }
/* a tiny sequencer: each step {d, start(), f(u)}; steps run one after another */
function seqNew(){ return {list:[],cur:null,t:0}; }
function seqRun(q,dt){ let guard=0; while(guard++<20){ if(!q.cur){ q.cur=q.list.shift(); if(!q.cur) return; q.t=0; if(q.cur.start) q.cur.start(); }
    q.t+=dt; dt=0; const c=q.cur, u=c.d>0?Math.min(1,q.t/c.d):1; c.f(u); if(u<1) return; dt=q.t-c.d; q.cur=null; } }
function seqBusy(q){ return !!q.cur||q.list.length>0; }
function mv(S,to,d,extra){ let from; return {d, start(){ from={}; for(const k in to) from[k]=S[k]; }, f(u){ const e=ease(u); for(const k in to) S[k]=lerp(from[k],to[k],e); if(extra) extra(u); }}; }
function wt(d,f){ return {d, f:f||(()=>{})}; }
function act(f){ return {d:0, start:f, f(){}}; }

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Chew rice for B <span class="val" id="cv">45 s</span></label><input type="range" id="chew" min="0" max="90" step="5" value="45">
      <div class="toggle-group"><button class="toggle-btn" id="s1">1 · 🥄 Boiled rice → A</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s2">2 · 😋 Chew, then → B</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s3">3 · 💧 4 mL water in each</button></div></div>
    <div class="control-group"><label>Iodine drops <span class="val" id="dv">4</span></label><input type="range" id="drops" min="1" max="6" step="1" value="4">
      <div class="toggle-group"><button class="toggle-btn" id="s4">4 · 🧪 Add iodine</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="s5">5 · 🔄 Shake both</button></div>
      <div class="toggle-group"><button class="toggle-btn navy" id="again">↺ Repeat (try another chew time)</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Starch left in B',COL.red)}${card('k2','Sugar made',COL.green)}</div></div>
    <div class="control-group"><label>Table 9.1</label><div id="tbl"></div><div id="hist"></div><div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let chewSec=45, nDrops=4, t=0, obsMsg='', history=[];
  $('#chew').oninput=e=>{ chewSec=+e.target.value; $('#cv').textContent=chewSec+' s'; };
  $('#drops').oninput=e=>{ nDrops=+e.target.value; $('#dv').textContent=nDrops; };
  const TA=540, TB=660, TOP=120, BOT=452, R=24, RAIL=190, PX_ML=11;
  let tubes, head, spoon, syr, drp, q, done, chewT, bolus, saliva, fall, lens, bowlRice;
  function reset(){
    tubes=[TA,TB].map((x,i)=>({x,name:i?'B':'A',parts:[],V:0,Vd:0,io:0,m:0,plumes:[],S:1,rot:{x:0,v:0},shake:0,filled:false}));
    head={jaw:spr(0),jt:0}; spoon={x:215,y:462,a:0,tilt:0,load:null,hand:0};
    syr={x:765,y:420,fill:0,push:0,stream:0,hand:0}; drp={x:spr(440),tx:440,y:452,sq:0,r:0,drops:[],fill:0.7};
    q=seqNew(); done=[0,0,0,0,0]; chewT=0; bolus={on:0,S:1}; saliva=[]; fall=[]; bowlRice=1;
    lens=lensInit(); drawTable();
  }
  /* ---------- deposit particles into a tube (slots fill from the bottom) ---------- */
  function slotsFor(tb,n,kind){ const out=[], rows=[]; const rIn=R-6; let y=BOT-10, k=0;
    while(out.length<n){ const half=y>BOT-R?Math.sqrt(Math.max(0,rIn*rIn-(BOT-R-y)**2)):rIn; const cnt=Math.max(1,Math.floor(2*half/(kind==='rice'?11:9)));
      for(let i=0;i<cnt&&out.length<n;i++){ out.push({x:tb.x-half+(i+0.5)*2*half/cnt+(Math.random()-0.5)*2,y:y+(Math.random()-0.5)*2}); } y-=kind==='rice'?7:6; k++; }
    return out; }
  function pour(tb,kind){ const n=kind==='rice'?30:34, slots=slotsFor(tb,n,kind);
    for(let i=0;i<n;i++){ const s=slots[i]; fall.push({tb,kind,x:spoon.x+(Math.random()-0.5)*16,y:spoon.y-2+(Math.random()-0.5)*6,vx:(Math.random()-0.5)*40,vy:20+Math.random()*30,delay:i*0.028,sx:s.x,sy:s.y,rot:Math.random()*3,
      landed:false,sp:{x:0,v:0}}); }
    tb.filled=true; tb.S=kind==='rice'?1:starchLeft(chewT); tb.kind=kind; spoon.load=null;
  }
  /* ---------- the five steps ---------- */
  const handRest={x:215,y:462,a:0,tilt:0};
  function scoop(){ return [mv(spoon,{x:92,y:376,a:-0.5,tilt:0},0.8), mv(spoon,{x:92,y:420,a:-0.5,tilt:0.3},0.4), act(()=>{ spoon.load='rice'; bowlRice=Math.max(0.3,bowlRice-0.25); }), mv(spoon,{x:92,y:370,a:-0.4,tilt:0},0.45)]; }
  function tipInto(tb,kind){ return [mv(spoon,{x:tb.x-4,y:78,a:-0.25,tilt:0},1.0), mv(spoon,{y:104},0.35), mv(spoon,{tilt:-2.1},0.5,u=>{ if(u>0.45&&spoon.load){ pour(tb,kind); } }), wt(0.35), mv(spoon,{tilt:0,y:70},0.35), mv(spoon,handRest,0.9)]; }
  $('#s1').onclick=()=>{ if(seqBusy(q)||done[0]) return; q.list.push(...scoop(), ...tipInto(tubes[0],'rice'), act(()=>done[0]=1)); };
  $('#s2').onclick=()=>{ if(seqBusy(q)||done[1]) return; const mouth={x:236,y:176}; chewT=0;
    q.list.push(...scoop());
    if(chewSec>0){ q.list.push(act(()=>head.jt=1), mv(spoon,{x:mouth.x+18,y:mouth.y,a:-0.05,tilt:0},0.9), mv(spoon,{x:mouth.x-6},0.35),
        act(()=>{ spoon.load=null; bolus.on=1; head.jt=0; }), mv(spoon,handRest,0.7),
        wt(chewSec/8,u=>{ chewT=u*chewSec; head.chew=1; }), act(()=>{ head.chew=0; }), mv(spoon,{x:mouth.x+18,y:mouth.y,a:-0.05,tilt:0},0.8), act(()=>head.jt=1), mv(spoon,{x:mouth.x-4,y:mouth.y+4},0.4),
        act(()=>{ bolus.on=0; spoon.load='paste'; head.jt=0; }), mv(spoon,{x:mouth.x+40,y:mouth.y+20},0.35)); }
    q.list.push(...tipInto(tubes[1],chewSec>0?'paste':'rice'), act(()=>done[1]=1)); };
  $('#s3').onclick=()=>{ if(seqBusy(q)||!done[0]||!done[1]||done[2]) return;
    q.list.push(act(()=>syr.hand=1), mv(syr,{y:458},0.4), mv(syr,{fill:8},0.9), mv(syr,{y:300},0.5));
    tubes.forEach((tb,i)=>q.list.push(mv(syr,{x:tb.x,y:96},0.9), act(()=>{ syr.stream=1; }), mv(syr,{fill:4-4*i},1.1,u=>{ tb.V=4*u; }), act(()=>{ syr.stream=0; tb.V=4; }), mv(syr,{y:70},0.25)));
    q.list.push(mv(syr,{fill:0},0.01), mv(syr,{x:765,y:420},0.8), act(()=>{ syr.hand=0; done[2]=1; drawTable(); })); };
  $('#s4').onclick=()=>{ if(seqBusy(q)||!done[2]||done[3]) return; const n=nDrops;
    q.list.push(mv(drp,{y:300},0.5), mv(drp,{y:250},0.4));
    tubes.forEach(tb=>{ q.list.push(act(()=>drp.tx=tb.x), mv(drp,{y:96},0.8)); for(let k=0;k<n;k++) q.list.push(squeeze(tb)); q.list.push(wt(0.45), mv(drp,{y:60},0.3)); });
    q.list.push(act(()=>drp.tx=440), wt(0.6), mv(drp,{y:452},0.8), act(()=>{ done[3]=1; })); };
  function squeeze(tb){ return {d:0.42, f(u){ drp.sq=smooth01(0,0.3,u)*(1-smooth01(0.62,1,u)); drp.r=5*smooth01(0.08,0.45,u)*(u<0.55?1:0);
      if(u>=0.55&&!this.fired){ this.fired=1; drp.drops.push({x:drp.x.x,y:drp.y+6,vy:60,tb}); drp.fill=Math.max(0.15,drp.fill-0.02); } }}; }
  $('#s5').onclick=()=>{ if(seqBusy(q)||!done[3]) return; q.list.push(act(()=>tubes.forEach(tb=>tb.shake=1)), wt(1.8,u=>tubes.forEach(tb=>tb.shake=1-u)), act(()=>{ done[4]=1; record(); })); };
  $('#again').onclick=()=>{ if(seqBusy(q)) return; reset(); };
  function record(){ const B=tubes[1]; const T=iodineT(B.S,B.io/4); if(history.length&&history[history.length-1].done===B) return;
    history.push({done:B,chew:B.kind==='paste'?chewSec:0,S:B.S,T}); if(history.length>6) history.shift(); drawTable(); }
  function drawTable(){
    const rows=(tubes||[]).map(tb=>{ const T=iodineT(tb.S,tb.io/4*tb.m); const fin=done&&done[4]?iodineName(T):'—';
      const why=!(done&&done[4])?'—':(T<0.5?'starch present':T<0.8?'a little starch left':'starch → sugar by saliva');
      return [tb.name+': '+(tb.name==='A'?'boiled rice':(tb.kind==='rice'?'unchewed rice':'chewed rice')),done&&done[2]?'cloudy white':'—',{v:fin,c:T<0.5?'r-bad':'r-ok'},why]; });
    $('#tbl').innerHTML=logTable(['Tube','Before','After iodine','Reason'],rows);
    $('#hist').innerHTML=history.length?logTable(['Chew','Starch left','B turned'],history.map(h=>[h.chew+' s',Math.round(h.S*100)+' %',{v:iodineName(h.T),c:h.T<0.5?'r-bad':'r-ok'}])):'';
  }
  reset();

  /* ---------- magnified view: starch chains, amylase cutting bonds ---------- */
  function lensInit(){ const L={u:[],b:[],enz:[],io:[]}; const rr=rng(7);
    for(let c=0;c<6;c++){ let x=(rr()-0.5)*70, y=(rr()-0.5)*70, a=rr()*6.28;
      for(let k=0;k<6;k++){ if(k){ a+=(rr()-0.5)*1.3; x+=Math.cos(a)*14; y+=Math.sin(a)*14; const d=Math.hypot(x,y); if(d>58){ x*=58/d; y*=58/d; a+=2; } }
        L.u.push({x,y,vx:0,vy:0,a,grp:0}); if(k) L.b.push({i:c*6+k-1,j:c*6+k,u:rr(),cut:false,fl:0,claim:null}); } }

/* =====================================================================

     air trapped in the bottle obeys Boyle's law  P·V = constant,
       V = 900 + V_sheet(d) − v₁ − v₂,  V_sheet = π·r²·d/2 (r = 4.5 cm dome)

       C = 22 mL/kPa (balloon stretch), R = 0.04 kPa·s/mL (tube)
     an unsealed lid lets outside air leak into the bottle, dn/dt ∝ (P₀−P)
   Pull 3 cm → each balloon ≈ 40 mL in ≈ 0.4 s, inside pressure −1.8 kPa.
   The rubber sheet itself is a spring-damper pulled by your hand, so it
   snaps back with a small bounce when released. 15 px = 1 cm.
   ===================================================================== */

  const wrap=labShell();

    <div class="control-group"><label>Lid sealed with clay?</label><div class="toggle-group" id="seal"><button class="toggle-btn active" data-s="1">Airtight</button><button class="toggle-btn" data-s="0">Not sealed</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Each balloon',COL.blue)}${card('k2','Air inside bottle',COL.green)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','Air through the tube',COL.blue)}${card('k4','Body',COL.yellow)}</div>
      <div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const P0=101.3, V0=900, C=22, Rt=0.04, RL=0.03, PX=15;
  let tgt=0, rhythm=false, rate=15, sealed=true, t=0, rt=0, obsMsg='';

  const sheet=spr(0), handA={a:0};

  chipsWire(wrap,'#seal .toggle-btn',b=>{ sealed=b.dataset.s==='1'; });
  const sheetV=d=>Math.PI*4.5*4.5*Math.max(0,d)/2 - (d<0?Math.PI*4.5*4.5*(-d)/2:0);
  // geometry
  const BX=215, NECK=58, BODY=132, BASE=372, HW=68;
  const balloonAt=i=>({x:BX+(i?1:-1)*34, y:214});
  function vbR(v){ return Math.cbrt(3*Math.max(v,0)/(4*Math.PI))*PX; }
  // air-particle path: from above the tube → down the tube → fork → into balloon i
  function airPt(s,side,v){ const bx=balloonAt(side).x, r=vbR(v);
    const pts=[{x:BX,y:-10},{x:BX,y:30},{x:BX,y:168},{x:bx,y:198},{x:bx,y:214+Math.max(6,r*0.9)}];
    const P=pathNew(pts); return pathAt(P,s*P.len); }

  animLoop(dt=>{ t+=dt;
    if(rhythm){ rt+=dt; const d=3.5*(0.5-0.5*Math.cos(2*Math.PI*rate/60*rt)); tgt=d; $('#pull').value=d.toFixed(1); $('#pv').textContent=d.toFixed(1)+' cm'; }
    // rubber sheet: hand spring + the pressure difference pulling it in
    const N=10, h=dt/N; let fl=0;
    for(let k=0;k<N;k++){ const acc=(tgt-sheet.x)*110-sheet.v*12+(Pc-P0)*5; sheet.v+=acc*h; sheet.x+=sheet.v*h;
      const Vc=V0+sheetV(sheet.x)-vb[0]-vb[1]; Pc=n/Vc;
      for(let i=0;i<2;i++){ const q=(P0-Pc-vb[i]/C)/Rt; const nv=Math.max(0,vb[i]+q*h); fl+=(nv-vb[i])/dt; vb[i]=nv; }

    // ---------- draw ----------

    ctx.beginPath(); ctx.moveTo(BX-22,NECK); ctx.lineTo(BX-22,NECK+22); ctx.quadraticCurveTo(BX-HW,NECK+40,BX-HW,BODY); ctx.lineTo(BX-HW,BASE+4);
    ctx.moveTo(BX+HW,BASE+4); ctx.lineTo(BX+HW,BODY); ctx.quadraticCurveTo(BX+HW,NECK+40,BX+22,NECK+22); ctx.lineTo(BX+22,NECK); ctx.stroke();
    line(ctx,BX-HW+8,BODY+10,BX-HW+8,BASE-14,'rgba(129,149,171,0.35)',2.4); ctx.restore();

    rrect(ctx,BX-28,NECK-16,56,18,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();

    else { // gap around the tube: outside air leaks in (blue)

    line(ctx,BX,sy,BX,sy+14,COL.ink,2); circ(ctx,BX,sy+18,5,COL.ink,'#fff',2);

    // ---- pressure dial ----
    const gx=62, gy=252, gr=42, dp=Pc-P0;

    for(let v=-3;v<=3;v+=0.5){ const a=-Math.PI/2+v/3*2.35, big=Number.isInteger(v); line(ctx,gx+Math.cos(a)*(gr-(big?9:5)),gy+Math.sin(a)*(gr-(big?9:5)),gx+Math.cos(a)*gr,gy+Math.sin(a)*gr,COL.ink,big?1.6:1);
      if(big) textAt(ctx,v>0?"+"+v:String(v),gx+Math.cos(a)*(gr-19),gy+Math.sin(a)*(gr-19)+4,{align:'center',size:9.5,weight:600,color:COL.muted}); }

    textAt(ctx,'kPa',gx,gy+28,{align:'center',size:10,weight:600,color:COL.muted});
    textAt(ctx,'air pressure',gx,gy+gr+22,{align:'center',size:11.5,weight:700,color:COL.green}); textAt(ctx,'inside bottle',gx,gy+gr+36,{align:'center',size:11.5,weight:700,color:COL.green});
    line(ctx,gx+gr+5,gy,BX-HW,gy,rgba(COL.mid,0.8),1.4,[3,3]);
    // ---- human chest (front view) mirrors the model ----
    drawChest(ctx,610,f,fl01,flowS,t);
    // ---- model ↔ body links ----
    const links=[[92,'Y-tube = windpipe',COL.ink,BX+8,92,598,150],[232,'Balloons = lungs',COL.blue,bR.x+vbR(vb[1])+4,234,545,250],[318,'Bottle = chest',COL.ink,BX+HW,318,520,318],[410,'Sheet = diaphragm',COL.yellow,BX+HW*0.5,BASE+sheet.x*PX*0.75,548,lerp(318,346,f)+14]];
    links.forEach(([y,txt,c,x1,y1,x2,y2])=>{ line(ctx,x1,y1,392,y,rgba(c,0.55),1.2,[3,4]); line(ctx,408,y,x2,y2,rgba(c,0.55),1.2,[3,4]); tag(ctx,txt,400,y,c,{size:11.5}); });
    ctx.restore();

    // ---------- side ----------
    setBtn($('#rhy'),rhythm?'⏸ Stop breathing':'▶ Start breathing','play');
    setv($,'k1',Math.round(vb[0])+' mL'); setv($,'k2',(Math.abs(dp)<0.05?'same as outside':(dp.toFixed(1)+' kPa')));
    setv($,'k3',Math.abs(flowS)<3?'still':(flowS>0?'in ':'out ')+Math.round(Math.abs(flowS))+' mL/s'); setv($,'k4',Math.abs(flowS)<3?(f>0.4?'holding breath in':'rest'):(flowS>0?'inhaling':'exhaling'));
    let msg='';
    if(!sealed&&tgt>0.5) msg='bad|Air leaks in around the lid, so the balloons barely fill. Seal it.';
    else if(vb[0]>25) msg='ok|Sheet down → more space → air rushes into the balloons (inhalation).';
    else if(flowS<-5) msg='ok|Sheet up → less space → air is pushed out (exhalation).';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}
/* front view of a chest: ribs rise and swing out, diaphragm (yellow) flattens, lungs (blue) swell.
   f = 0 (out) … 1 (in), L = lung fill 0…1, fl = air flow (+ in) */
function drawChest(ctx,cx,f,L,fl,t){ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  const ink=COL.ink, sw=1+0.05*f;
  // head + neck
  circ(ctx,cx,48,30,ink,'#fff',2.6); line(ctx,cx-4,50,cx,58,ink,1.6); line(ctx,cx,58,cx+4,56,ink,1.4);
  circ(ctx,cx-10,40,2.2,ink,ink,1); circ(ctx,cx+10,40,2.2,ink,ink,1); line(ctx,cx-7,66,cx+7,66,ink,1.8);
  line(ctx,cx-13,77,cx-13,98,ink,2.6); line(ctx,cx+13,77,cx+13,98,ink,2.6);
  // torso outline (widens slightly)
  ctx.lineWidth=2.8; ctx.strokeStyle=ink; ctx.beginPath(); ctx.moveTo(cx-13,98); ctx.quadraticCurveTo(cx-60,104,cx-92*sw,122); ctx.quadraticCurveTo(cx-104*sw,150,cx-96*sw,210);
  ctx.quadraticCurveTo(cx-90*sw,330,cx-84,470); ctx.moveTo(cx+13,98); ctx.quadraticCurveTo(cx+60,104,cx+92*sw,122); ctx.quadraticCurveTo(cx+104*sw,150,cx+96*sw,210); ctx.quadraticCurveTo(cx+90*sw,330,cx+84,470); ctx.stroke();
  // lungs
  const dTop=lerp(318,346,f); // diaphragm dome top
  [-1,1].forEach(s=>{ const k=1+0.13*L; ctx.save(); ctx.beginPath(); ctx.moveTo(cx+s*18,176); ctx.bezierCurveTo(cx+s*18,140,cx+s*30*k,118,cx+s*44*k,120);
    ctx.bezierCurveTo(cx+s*74*k,128,cx+s*86*k,200,cx+s*84*k,dTop+14+f*4); ctx.quadraticCurveTo(cx+s*56,dTop-8,cx+s*22,dTop-8); ctx.quadraticCurveTo(cx+s*(s>0?40:26),260,cx+s*18,176); ctx.closePath();
    ctx.fillStyle=rgba(COL.blue,0.1+0.1*L); ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.stroke();
    ctx.lineWidth=1.3; ctx.strokeStyle=rgba(COL.blue,0.6); ctx.beginPath(); ctx.moveTo(cx+s*8,172); ctx.quadraticCurveTo(cx+s*34,186,cx+s*48,214); ctx.moveTo(cx+s*30,184); ctx.lineTo(cx+s*34,236); ctx.stroke(); ctx.restore(); });
  // windpipe
  ctx.save(); [[7,ink],[3.5,'#fff']].forEach(([lw,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(cx,66); ctx.lineTo(cx,160); ctx.lineTo(cx-10,172); ctx.moveTo(cx,160); ctx.lineTo(cx+10,172); ctx.stroke(); }); ctx.restore();
  // ribs: rise and swing out on inhale
  for(let k=0;k<6;k++){ const y0=150+k*28-f*7, span=(62+k*6)*(1+0.07*f); [-1,1].forEach(s=>{ ctx.beginPath(); ctx.moveTo(cx+s*8,y0); ctx.quadraticCurveTo(cx+s*span*1.05,y0-12+f*-4,cx+s*span*1.28,y0+24-f*10); ctx.strokeStyle=rgba(ink,0.55); ctx.lineWidth=2.2; ctx.stroke(); }); }
  rrect(ctx,cx-7,182-f*7,14,112,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=rgba(ink,0.6); ctx.lineWidth=1.6; ctx.stroke();
  // diaphragm (yellow dome) with the muscle pulling down
  ctx.strokeStyle=COL.yellow; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(cx-94,dTop+44); ctx.bezierCurveTo(cx-70,dTop-12,cx+70,dTop-12,cx+94,dTop+44); ctx.stroke();
  if(Math.abs(fl)>4){ const dn=fl>0; vec(ctx,cx,dTop+(dn?14:40),cx,dTop+(dn?40:14),COL.yellow,2.4); }
  // air at the nose
  if(Math.abs(fl)>4){ const into=fl>0, a=clamp(Math.abs(fl)/40,0.3,1); [-1,1].forEach(s=>{ ctx.save(); ctx.globalAlpha=a; const x=cx+s*16; if(into) vec(ctx,x+s*26,40,x+s*6,54,COL.blue,2.4); else vec(ctx,x+s*6,56,x+s*28,44,COL.blue,2.4); ctx.restore(); });
    textAt(ctx,into?'air is drawn in':'air is forced out',cx+56,26,{size:12,weight:700,color:COL.blue}); }
  if(Math.abs(fl)>4) textAt(ctx,fl>0?'ribs move up & out · diaphragm down':'ribs move down & in · diaphragm up',cx,494,{align:'center',size:12,weight:600,color:COL.muted}); if(0) textAt(ctx,'',0,0,{size:11.5,weight:600,color:COL.muted});
  ctx.restore(); }

/* =====================================================================
   9.3 LET US EXPLORE — what do we breathe out?
   Lime water (10 mL, saturated Ca(OH)₂ = 0.216 mmol). CO₂ in bubbles:
     fresh air 0.04 %, breathed-out air ≈ 4.5 %  (Fig. 9.13)
     1 mmol of gas = 24.5 mL; ~10 % of the CO₂ in a bubble dissolves.
     Ca(OH)₂ + CO₂ → CaCO₃ (chalky, milky)   milkiness = 1 − e^(−CaCO₃/0.03 mmol)
     once the Ca(OH)₂ is used up, extra CO₂ turns CaCO₃ → Ca(HCO₃)₂ (clears).
   One breath through the straw = 180 mL → B clearly milky.
   One pichkari stroke = 60 mL of room air → A stays clear (≈ 60 strokes
   before even a faint haze). A dark card behind the tubes shows the
   milkiness, as a teacher would hold one.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Test tube A · fresh air</label>
      <div class="toggle-group"><button class="toggle-btn" id="pa1">Pichkari ×1</button><button class="toggle-btn" id="pa5">×5</button></div></div>
    <div class="control-group"><label>Test tube B · breathed-out air</label>
      <div class="toggle-group"><button class="toggle-btn" id="bb1">Blow 1 breath</button><button class="toggle-btn" id="bb5">×5</button></div>
      <div class="toggle-group"><button class="toggle-btn navy" id="fresh">↺ Fresh lime water</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Air into A',COL.blue)}${card('k2','Air into B',COL.blue)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','A looks',COL.green)}${card('k4','B looks',COL.green)}</div>
      <div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TA=320, TB=480, TOP=170, BOT=452, R=24, SURF=268, ETA=0.1, CA0=0.216;
  let t=0, obsMsg='';
  let T, pk, br;
  function fresh(){ T=[TA,TB].map((x,i)=>({x,name:i?'B':'A',xco2:i?0.045:0.0004,ca:CA0,c:0,op:0,vol:0,bs:[],rings:[],specks:[],flow:0,wob:0})); }
  fresh();
  pk={p:1,queue:0,phase:'idle',ph:0,valve:0};   // p: plunger 1 = pulled out (full), 0 = pushed in
  br={queue:0,phase:'idle',ph:0,puff:spr(0),pucker:spr(0),nose:0};
  $('#pa1').onclick=()=>pk.queue+=1; $('#pa5').onclick=()=>pk.queue+=5;
  $('#bb1').onclick=()=>br.queue+=1; $('#bb5').onclick=()=>br.queue+=5;
  $('#fresh').onclick=()=>{ fresh(); pk.queue=0; br.queue=0; };
  function gasIn(tb,mL){ // CO₂ chemistry for mL of gas bubbled through
    tb.vol+=mL; let a=mL*tb.xco2/24.5*ETA; const use=Math.min(a,tb.ca); tb.ca-=use; tb.c+=use; a-=use; if(a>0) tb.c=Math.max(0,tb.c-a*0.5); }
  const mol=(seed,co2,o2)=>{ const r=rng(seed), out=[]; for(let i=0;i<100;i++){ const kind=i<co2?2:(i<co2+o2?1:0); out.push({x:(r()-0.5)*120,y:(r()-0.5)*120,a:r()*6.28,kind}); } return out; };
  const MA=mol(3,0,21), MB=mol(5,5,16);

  animLoop(dt=>{ t+=dt;
    // ---- pichkari: push 60 mL in 1.2 s, then pull back 0.8 s (valve lets room air in) ----
    const A=T[0], B=T[1];
    if(pk.phase==='idle'&&pk.queue>0){ pk.phase='push'; pk.ph=0; }
    A.flow=0;
    if(pk.phase==='push'){ pk.ph+=dt; const u=smooth01(0,1.2,pk.ph), p=1-u, dV=(pk.p-p)*60; pk.p=p; A.flow=dV/dt; gasIn(A,dV); if(pk.ph>=1.2){ pk.phase='pull'; pk.ph=0; } }
    else if(pk.phase==='pull'){ pk.ph+=dt; pk.p=smooth01(0,0.8,pk.ph); pk.valve=1; if(pk.ph>=0.8){ pk.phase='idle'; pk.queue--; pk.valve=0; } }
    else pk.valve=0;
    // ---- breath: breathe in through the nose (0.9 s), blow 180 mL through the straw (3 s) ----
    if(br.phase==='idle'&&br.queue>0){ br.phase='in'; br.ph=0; }
    B.flow=0;
    if(br.phase==='in'){ br.ph+=dt; br.nose=1; if(br.ph>=0.9){ br.phase='blow'; br.ph=0; br.nose=0; } }
    else if(br.phase==='blow'){ br.ph+=dt; const u0=smooth01(0,3,br.ph-dt), u1=smooth01(0,3,br.ph), dV=(u1-u0)*180; B.flow=dV/Math.max(dt,1e-6); gasIn(B,dV); if(br.ph>=3){ br.phase='rest'; br.ph=0; } }
    else if(br.phase==='rest'){ br.ph+=dt; if(br.ph>=0.4){ br.phase='idle'; br.queue--; } }
    springTo(br.puff,br.phase==='blow'?1:0,120,12,dt); springTo(br.pucker,br.phase==='blow'||br.phase==='rest'?1:0,90,12,dt);
    // ---- bubbles, milkiness, chalk specks ----
    for(const tb of T){ const rate=tb.flow/14; if(rate>0&&Math.random()<rate*dt*3){ const r=6+Math.random()*4; bubAdd(tb.bs,tb.x+(Math.random()-0.5)*4,BOT-22,r,(Math.random()-0.5)*30,{co2:tb.name==='B'?2:0}); if(Math.random()<0.5) sndBlub(); }
      bubStep(tb.bs,dt,SURF,tb.x-R,tb.x+R,tb.rings);
      const target=1-Math.exp(-tb.c/0.03); tb.op=approach(tb.op,target,1.4,dt);
      tb.wob=approach(tb.wob,clamp(tb.flow/40,0,1.2),4,dt);
      const want=Math.round(tb.op*140); while(tb.specks.length<want){ const b=tb.bs[tb.bs.length-1]; tb.specks.push({x:b?b.x:tb.x+(Math.random()-0.5)*30,y:b?b.y:SURF+60+Math.random()*100,vx:(Math.random()-0.5)*20,vy:-20*Math.random()}); }
      while(tb.specks.length>want) tb.specks.pop();
      tb.specks.forEach(s=>{ s.vx+=(Math.random()-0.5)*120*dt; s.vy+=((Math.random()-0.5)*120+(tb.flow>0?-10:4))*dt; s.vx*=Math.exp(-2*dt); s.vy*=Math.exp(-2*dt); s.x+=s.vx*dt; s.y+=s.vy*dt;
        s.x=clamp(s.x,tb.x-R+3,tb.x+R-3); s.y=clamp(s.y,SURF+4,BOT-6); if(s.y>BOT-R) s.x=clamp(s.x,tb.x-Math.sqrt(Math.max(0,(R-3)**2-(s.y-(BOT-R))**2)),tb.x+Math.sqrt(Math.max(0,(R-3)**2-(s.y-(BOT-R))**2))); }); }
    [MA,MB].forEach(M=>M.forEach(m=>{ m.a+=(Math.random()-0.5)*3*dt; m.x+=Math.cos(m.a)*16*dt; m.y+=Math.sin(m.a)*16*dt; const d=Math.hypot(m.x,m.y); if(d>62){ m.x*=62/d; m.y*=62/d; m.a+=Math.PI; } }));

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,520]);
    tableTop(ctx,8,792,474,0);
    // dark card behind the tubes so milkiness shows
    rrect(ctx,262,186,276,262,10); ctx.fillStyle='#34465c'; ctx.fill();
    textAt(ctx,'dark card',400,244,{align:'center',size:11,weight:600,color:'#aebccb'});
    tubeStand(ctx,262,538,206,458);
    for(const tb of T){ const liq=mixCol('#3f6f95','#f4f4f0',tb.op);
      testTube(ctx,tb.x,TOP,BOT,R,{level:SURF,liq:rgba(liq,0.45+0.5*tb.op),wob:Math.sin(t*14)*2.2*tb.wob,surf:'#9fc8ea',
        inside:()=>{ ctx.save(); tb.specks.forEach(s=>{ ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(s.x-1.2,s.y-1.2,2.4,2.4); }); ctx.restore();
          if(tb.op>0.05){ ctx.save(); ctx.globalAlpha=tb.op*0.28; for(let k=0;k<8;k++){ const yy=SURF+20+k*22+Math.sin(t*0.8+k)*6; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(tb.x+Math.sin(t*0.6+k*2)*9,yy,20,14,0,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
          bubDraw(ctx,tb.bs,'#cfe6fa',tb.rings); }});
      textAt(ctx,tb.name,tb.x,BOT+44,{align:'center',size:20,weight:800,color:COL.ink}); textAt(ctx,'lime water',tb.x,BOT+62,{align:'center',size:11,weight:600,color:COL.muted}); }
    // ---- pichkari + delivery tube into A ----
    const px=100+(1-pk.p)*126; // piston x
    const tubeA=[{x:244,y:152},{x:312,y:152},{x:TA,y:162},{x:TA,y:BOT-18}];
    pipeDraw(ctx,tubeA,A.flow>1?t:null,A.flow,0);
    ctx.save(); ctx.lineJoin='round';
    ctx.fillStyle=rgba(COL.blue,0.06); ctx.fillRect(px,134,230-px,36);
    rect(ctx,90,132,140,40,COL.ink,null,2.6); ctx.beginPath(); ctx.moveTo(230,138); ctx.lineTo(244,148); ctx.lineTo(244,156); ctx.lineTo(230,166); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
    for(let i=1;i<6;i++) line(ctx,230-i*21,132,230-i*21,140,COL.mid,1.2);
    rect(ctx,px-4,134,8,36,COL.ink,'#fff',2); line(ctx,px-4,152,px-64,152,COL.ink,3.2); rrect(ctx,px-72,130,8,44,3); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.stroke();
    // inlet valve on top
    ctx.save(); ctx.translate(214,132); ctx.rotate(-pk.valve*0.9); line(ctx,0,0,12,0,COL.ink,2.4); ctx.restore();
    if(pk.valve) { vec(ctx,222,104,218,128,COL.blue,2.2); textAt(ctx,'room air in',226,104,{size:11,weight:600,color:COL.blue}); }
    ctx.restore();
    pinchHand(ctx,px-72,152,Math.PI,1,0.6);
    textAt(ctx,'pichkari',160,196,{align:'center',size:12,weight:700,color:COL.muted});
    // ---- head blowing through a straw into B (mirrored head, facing left) ----
    const HX=688, HY=118, HS=0.85;
    ctx.save(); ctx.translate(HX,0); ctx.scale(-1,1); headSide(ctx,0,HY,HS,{jaw:0.05*br.pucker.x,pucker:br.pucker.x,puff:br.puff.x}); ctx.restore();
    const lipX=HX-(104+br.pucker.x*6+4)*HS, lipY=HY+41*HS;
    const straw=[{x:lipX+6,y:lipY},{x:TB+10,y:lipY},{x:TB,y:lipY+10},{x:TB,y:BOT-18}];
    pipeDraw(ctx,straw,B.flow>1?t:null,B.flow,1);
    if(br.nose){ vec(ctx,HX-150,HY-10,HX-(118*HS)-4,HY+4,COL.blue,2.2); textAt(ctx,'breathe in',HX-168,HY-18,{size:11.5,weight:700,color:COL.blue}); }
    // ---- lenses: what is inside one bubble ----
    lensView(ctx,128,356,84,TA,BOT-40,()=>molDraw(ctx,128,356,MA),{label:'fresh air · CO₂ 0.04 %',col:COL.blue});
    lensView(ctx,676,388,78,TB,BOT-40,()=>molDraw(ctx,676,388,MB),{label:'breathed out · CO₂ ≈ 4.5 %',col:COL.red});
    ctx.restore();

    // ---------- side ----------
    const look=o=>o<0.08?'clear':o<0.35?'slightly cloudy':o<0.75?'milky':'very milky';
    setv($,'k1',Math.round(A.vol)+' mL'); setv($,'k2',Math.round(B.vol)+' mL'); setv($,'k3',look(A.op)); setv($,'k4',look(B.op));
    let msg='';
    if(B.ca<0.01&&B.op<0.5) msg='warn|So much CO₂ that the chalky CaCO₃ dissolves again — B clears.';
    else if(B.op>0.3&&A.op<0.08) msg=A.vol>=B.vol?'ok|Even with more air, A stays clear. Breathed-out air has much more CO₂.':'ok|B turns milky, A stays clear: we breathe out more carbon dioxide.';
    else if(A.vol>0&&B.vol===0) msg='warn|A stays clear. Now blow into B.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}
/* a delivery tube / straw along pts; air dashes move while flowing (red dots = CO₂ in breath) */
function pipeDraw(ctx,pts,tt,flow,co2){ ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  [[8,COL.ink],[4.4,'#fff']].forEach(([lw,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); });
  if(tt!==null){ const P=pathNew(pts); const sp=clamp(flow*2.2,40,200); for(let s=(tt*sp)%18;s<P.len;s+=18){ const q=pathAt(P,s); circ(ctx,q.x,q.y,1.8,co2&&Math.floor((s-(tt*sp)%18)/18)%3===0?COL.red:COL.blue,co2&&Math.floor((s-(tt*sp)%18)/18)%3===0?COL.red:COL.blue,1); } }
  ctx.restore(); }
/* molecules inside one bubble: N₂ grey, O₂ blue, CO₂ red */
function molDraw(ctx,cx,cy,M){ ctx.save(); ctx.translate(cx,cy);
  circ(ctx,0,0,68,rgba(COL.blue,0.6),rgba(COL.blue,0.04),1.6);
  for(const m of M){ const c=m.kind===2?COL.red:m.kind===1?COL.blue:'#a7b4c2', dx=Math.cos(m.a)*3, dy=Math.sin(m.a)*3;
    if(m.kind===2){ circ(ctx,m.x,m.y,2.6,c,c,1); circ(ctx,m.x-dx*1.6,m.y-dy*1.6,2.3,c,'#fff',1.4); circ(ctx,m.x+dx*1.6,m.y+dy*1.6,2.3,c,'#fff',1.4); }
    else { circ(ctx,m.x-dx,m.y-dy,2.2,c,m.kind?c:'#fff',1.2); circ(ctx,m.x+dx,m.y+dy,2.2,c,m.kind?c:'#fff',1.2); } }
  ctx.restore(); }

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'9.1', title:'Saliva and Starch', desc:'Table 9.1 · boiled rice vs chewed rice + iodine', build: buildA1 },
  { num:'9.2', title:'A Model of Breathing', desc:'Bottle, Y-tube, balloons and a rubber sheet', build: buildA2 },
  { num:'9.3', title:'What Do We Breathe Out?', desc:'Lime water · fresh air vs breathed-out air', build: buildA3 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
