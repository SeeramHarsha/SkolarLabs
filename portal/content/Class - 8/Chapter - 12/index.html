  wrap.querySelectorAll('#orgs .chip-btn').forEach(b=>b.onclick=()=>{ if(placed[ORG[+b.dataset.i].id]) return; pick(+b.dataset.i); });
  wrap.querySelectorAll('.opt-btn').forEach(b=>b.onclick=()=>{ if(st.mode==='gone'||placed[ORG[sel].id]) return; const g=+b.dataset.g, o=ORG[sel];
    if(g===o.g){ $('#fb').innerHTML='<div class="fb ok">✓ '+o.n+' → '+GR[g]+'</div>'; st.mode='go'; st.gu=0; }
    else { $('#fb').innerHTML='<div class="fb bad">✗ Watch what it eats</div>'; st.shake.v+=26; st.bad=g; st.badT=0.8; } });
  function table(){ $('#tb').innerHTML=ORG.filter(o=>placed[o.id]).map(o=>`<tr><td><b>${o.n}</b></td><td style="color:${GC[o.g]};font-weight:700">${GR[o.g]}</td></tr>`).join(''); $('#nV').textContent=Object.keys(placed).length+' / 9'; }

  /* ---- props ---- */
  function carcass(ctx,x,y,s){ G(ctx,x,y,s,1,u=>{ ctx.beginPath(); ctx.moveTo(-0.5,0); ctx.quadraticCurveTo(-0.1,-0.25,0.4,-0.05); SK(ctx,COL.ink,2.2*u);
    for(let i=0;i<6;i++){ const x=-0.35+i*0.13; ctx.beginPath(); ctx.moveTo(x,-0.12+Math.abs(i-2.5)*0.02); ctx.quadraticCurveTo(x+0.06,-0.35,x+0.12,-0.02); SK(ctx,COL.ink,1.8*u); }
    ell(ctx,0.52,-0.08,0.13,0.08); SK(ctx,COL.ink,2*u,'#fff'); }); }
  function fruit(ctx,x,y,r){ circ(ctx,x,y,r,COL.green,'#f1faf4',2); line(ctx,x,y-r,x+2,y-r-5,COL.green,1.6); }
  function logDraw(ctx,x,y,s,frac){ G(ctx,x,y,s,1,u=>{ const L=0.5+0.5*frac; ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(-L,-0.22);
    for(let i=0;i<=10;i++){ const q=-L+i/10*(2*L); ctx.lineTo(q,-0.22-(frac<1?Math.sin(i*2.7)*0.02*(1-frac):0)); } ctx.lineTo(L,0); ctx.closePath(); SK(ctx,COL.ink,2.2*u,'#fff');
    ell(ctx,L,-0.11,0.05,0.11); SK(ctx,COL.ink,1.6*u,'#fff'); for(let i=0;i<4;i++){ segs(ctx,[[-L+0.1+i*0.25*L,-0.15],[-L+0.25+i*0.25*L,-0.12]]); SK(ctx,COL.mid,1.2*u); } }); }

  /* one organism, drawn at (x,y) with size s. mode 'feed' plays its meal. */
  function actor(ctx,o,x,y,s,dir,tt,feed,ft,mv,phase,mini){
    const cyc=(p)=>((ft%p)+p)%p;
    switch(o.id){
      case 'deer': { const gz=feed?0.5-0.5*Math.cos(ft*0.9):0; if(feed){ const bite=1-0.35*(0.5-0.5*Math.cos(ft*0.9)); drawGrass(ctx,x+s*0.78,y,s*0.4*bite,tt,0.3,COL.green,7); }
        drawQuad(ctx,x,y,s,dir,tt,QUAD.deer,{phase,move:mv,graze:gz,chew:feed}); break; }
      case 'hare': { const gz=feed?0.6+0.4*Math.sin(ft*2):0; if(feed){ for(let i=0;i<3;i++) drawGrass(ctx,x+s*0.5+i*s*0.1,y,s*0.28*(1-0.3*Math.max(0,Math.sin(ft*2))),tt+i,0.2,COL.green,4); }
        drawQuad(ctx,x,y,s*1.4,dir,tt,QUAD.hare,{phase,move:mv,graze:gz,chew:feed,stretch:mv}); break; }
      case 'vulture': { if(feed){ carcass(ctx,x+s*0.55,y,s*0.8); } drawBird(ctx,x,y-s*0.3,s*0.95,dir,tt,BIRD.vulture,feed||mv<0.5?{perch:true,peck:feed}:{flap:tt*5,glide:0.8}); break; }
      case 'fox': { const c=cyc(7); let fx=x, fy=y, gz=0, str=0;
        if(feed){ if(c<2){ const mx=x+s*(1.15-c*0.1); drawQuad(ctx,mx,y,s*0.45,-1,tt,QUAD.mouse,{phase:tt*20,move:1}); }
          else if(c<2.7){ const u=(c-2)/0.7; fx=x+s*1.0*u; fy=y-4*s*0.35*u*(1-u); str=Math.sin(u*Math.PI); }
          else if(c<4.5){ fx=x+s; gz=0.6+0.4*Math.sin(ft*5); }
          else { fx=x+s*(1-(c-4.5)/2.5); const fu=clamp((c-4.5)/0.6,0,1); fruit(ctx,x+s*1.15,lerp(y-s*0.9,y-s*0.06,fu*fu),s*0.06); if(c>5.3) gz=0.6+0.4*Math.sin(ft*5); if(c>5.3) fx=x+s*0.1; }
          // bush with ber fruit
          drawTree(ctx,x+s*1.35,y,s*0.8,tt,0.3,{blobs:[[0,-0.6,0.3],[-0.25,-0.45,0.22],[0.25,-0.45,0.22]],fruit:[[-0.1,-0.5],[0.15,-0.62],[0.2,-0.4]]}); }
        drawQuad(ctx,fx,fy,s,dir,tt,QUAD.fox,{phase,move:mv,graze:gz,chew:gz>0,stretch:str}); break; }
      case 'shikra': { const c=cyc(6); const px=x-s*0.9, py=y-s*1.6, sp=x+s*0.9;
        if(feed&&!mini){ line(ctx,px-s*0.8,py+s*0.25,px+s*0.3,py+s*0.2,COL.ink,4); line(ctx,px-s*0.5,py+s*0.24,px-s*0.55,y,COL.ink,6); line(ctx,px-s*0.5,py+s*0.24,px-s*0.55,y,'#fff',2); }
        let bx=px, by=py, st_={perch:true}, pr=true, face=1;
        if(feed){ if(c<2){ } else if(c<2.8){ const u=(c-2)/0.8; bx=lerp(px,sp,u); by=lerp(py,y-s*0.25,u)+4*s*0.25*u*(1-u); st_={flap:tt*3,glide:1,talons:true}; }
          else if(c<4.4){ bx=sp; by=y-s*0.25; st_={perch:true,peck:true}; pr=false; }
          else { const u=(c-4.4)/1.6; bx=lerp(sp,px,u); by=lerp(y-s*0.25,py,u)-4*s*0.3*u*(1-u); st_={flap:tt*14}; pr=false; face=-1; }
          if(pr) drawBird(ctx,sp+Math.sin(tt*2)*s*0.1,y-s*0.1,s*0.4,-1,tt,BIRD.small,{perch:true,peck:true});
          drawBird(ctx,bx,by,s*0.8,face,tt,BIRD.shikra,st_); }
        else drawBird(ctx,x,y-s*0.3,s*0.8,dir,tt,BIRD.shikra,mv>0.5?{flap:tt*10}:{perch:true});
        break; }
      case 'squirrel': { const c=cyc(6); let gz=feed?0.5+0.5*Math.sin(ft*6):0;
        if(feed){ if(c<3){ circ(ctx,x+s*0.35,y-s*0.08,s*0.06,COL.green,'#f1faf4',2); }
          else { const ix=x+s*(0.9-(clamp(c-3,0,1))*0.55); if(c<4) drawInsect(ctx,ix,y-s*0.04,s*0.16,-1,tt); } }
        drawQuad(ctx,x,y,s*1.3,dir,tt,QUAD.squirrel,{phase,move:mv,graze:gz,chew:feed}); break; }
      case 'mouse': { const c=cyc(6); let gz=feed?0.5+0.5*Math.sin(ft*7):0;
        if(feed){ const left=c<3?Math.round(8-c*2.5):0; for(let i=0;i<Math.max(0,left);i++) ell(ctx,x+s*0.45+(i%4)*s*0.07,y-s*0.03-(i>3?s*0.05:0),s*0.03,s*0.018,0.5), SK(ctx,COL.green,1.4,'#fff');
          if(c>=3&&c<4.2) drawInsect(ctx,x+s*(1.0-(c-3)*0.45),y-s*0.04,s*0.15,-1,tt); }
        drawQuad(ctx,x,y,s*1.3,dir,tt,QUAD.mouse,{phase,move:mv,graze:gz,chew:feed}); break; }
      case 'mushroom': { const c=cyc(9); const frac=feed?1-smooth01(0,7,c)*0.6:1, g=feed?0.3+0.7*smooth01(0,3,c):1;
        if(feed){ logDraw(ctx,x,y,s*1.1,frac); for(let i=0;i<5;i++){ const q=((ft*0.5+i/5)%1); dot(ctx,x+(i-2)*s*0.15,y+q*s*0.3,2.4,COL.mid); } }
        drawMushroom(ctx,x-s*0.25,y-(feed?s*0.24:0),s*0.6,tt,g); drawMushroom(ctx,x+s*0.15,y-(feed?s*0.24:0),s*0.45,tt,g*0.9); break; }
      case 'tree': { drawTree(ctx,x,y,s*1.4,tt,0.5,{});
        if(feed){ const sx=x-s*(mini?0.9:1.4), sy=y-s*(mini?1.7:1.9); if(!mini) drawSun(ctx,sx,sy,s*0.14,tt);
          for(let i=0;i<4;i++){ const u=((ft*0.5+i/4)%1); const ex=x-s*0.3+i*s*0.15, ey=y-s*1.3; line(ctx,lerp(sx,ex,u),lerp(sy,ey,u),lerp(sx,ex,Math.min(1,u+0.12)),lerp(sy,ey,Math.min(1,u+0.12)),COL.yellow,2.6); }
          for(let i=0;i<4;i++){ const u=((ft*0.35+i/4)%1); dot(ctx,x+(i%2?3:-3),lerp(y+s*0.2,y-s*0.9,u),3.2,COL.blue); }
          ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+(i-1.5)*s*0.25,y+s*0.1,x+(i-1.5)*s*0.4,y+s*0.3); ctx.stroke(); } ctx.restore();
          if(mini) break; const u1=(ft*0.4)%1, u2=(ft*0.4+0.5)%1;
          textAt(ctx,'CO₂',lerp(x+s*1.3,x+s*0.5,u1),y-s*1.4,{size:13,weight:700,color:COL.ink,alpha:Math.sin(u1*Math.PI)}); vec(ctx,lerp(x+s*1.25,x+s*0.45,u1)-20,y-s*1.35,lerp(x+s*1.25,x+s*0.45,u1)-40,y-s*1.35,COL.ink,1.4);
          textAt(ctx,'O₂',lerp(x+s*0.45,x+s*1.3,u2),y-s*0.95,{size:13,weight:700,color:COL.green,alpha:Math.sin(u2*Math.PI)}); } break; }
    }
  }

  animLoop((dt)=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sg=h*0.56, S=Math.min(w*0.26,h*0.3), zg=h*0.95, zw=w/5;
    groundLine(ctx,w*0.04,w*0.96,sg); for(let i=0;i<9;i++) drawGrass(ctx,w*(0.06+i*0.11),sg,S*0.18,t,0.3);
    // zones
    for(let i=0;i<5;i++){ const zx=i*zw; ctx.save(); rrect(ctx,zx+5,sg+36,zw-10,zg-sg-30,10); ctx.fillStyle=st.bad===i&&st.badT>0?'rgba(217,67,43,0.08)':'#fbfcfe'; ctx.fill(); ctx.strokeStyle=st.bad===i&&st.badT>0?COL.red:'#dbe4f0'; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
      line(ctx,zx+14,zg-10,zx+zw-14,zg-10,COL.ink,2); pill(ctx,GR[i],zx+zw/2,sg+52,GC[i],{size:11}); }
    if(st.badT>0) st.badT-=dt;
    const zs=Math.min(zw*0.3,(zg-sg)*0.3);
    const slot=(o)=>{ const k=order.filter(q=>q.g===o.g).indexOf(o); return [o.g*zw+zw*(0.3+ (k%2)*0.42), zg-10-(k>1?0:0)]; };
    ORG.forEach(o=>{ if(!placed[o.id]) return; const [zx,zy]=slot(o); const k=order.filter(q=>q.g===o.g).indexOf(o);
      const s=zs*(k>1?0.7:1); actor(ctx,o,zx+(k>1?(k-2.5)*zw*0.15:0),zy-(k>1?zs*0.9:0),s,1,t+k,true,t+k*1.3,0,0,true); });

    // stage organism
    const o=ORG[sel];
    if(!placed[o.id]){
      const cx=w*0.42;
      springTo(st.shake,0,160,9,dt);
      if(st.mode==='enter'){ const spd=o.id==='mushroom'||o.id==='tree'?0:0.5; if(spd){ st.x=Math.min(1,st.x+spd*dt); } else st.x=1;
        springTo(st.grow,1,40,7,dt); if(st.x>=1){ st.mode='feed'; st.ft=0; } }
      else if(st.mode==='feed') st.ft+=dt;
      const x=lerp(-S*1.2,cx,clamp(st.x,0,1))+st.shake.x*S*0.02, mv=st.mode==='enter'?1:0;
      if(st.mode==='go'){ st.gu+=dt/1.3; const u=Math.min(1,st.gu); const k=order.filter(q=>q.g===o.g).length;
        const ex=o.g*zw+zw*(0.3+(k%2)*0.42)+(k>1?(k-2.5)*zw*0.15:0), ey=zg-10-(k>1?zs*0.9:0);
        const X=lerp(cx,ex,u), Y=lerp(sg,ey,u)-4*h*0.18*u*(1-u), s=lerp(S,zs*(k>1?0.7:1),u);
        actor(ctx,o,X,Y,s,ex>=cx?1:-1,t,false,0,0.6,X/(s*0.4));
        if(u>=1){ placed[o.id]=true; order.push(o); table(); const nx=ORG.findIndex(q=>!placed[q.id]); if(nx>=0) pick(nx); else st.mode='gone'; } }
      else {
        const gsc=(o.id==='mushroom'||o.id==='tree')?Math.max(0.02,st.grow.x):1;
        const flyIn=(o.id==='vulture'||o.id==='shikra')&&st.mode==='enter';
        const yy=flyIn?sg-(1-st.x)*h*0.35:(o.id==='hare'&&mv?sg-Math.abs(Math.sin(st.x*18))*S*0.18:sg);
        actor(ctx,o,x,yy,S*gsc,1,t,st.mode==='feed',st.ft,mv,x/(S*0.35)*2);
        if(st.mode==='feed') pill(ctx,o.n,cx,sg+18,COL.ink,{size:13});
      }
    }
    else { textAt(ctx,Object.keys(placed).length===9?'All sorted ✓':'Pick an organism',w/2,sg*0.5,{align:'center',size:16,weight:700,color:COL.mid}); }
    wrap.querySelectorAll('#orgs .chip-btn').forEach(b=>{ const d=placed[ORG[+b.dataset.i].id]; b.classList.toggle('ok',!!d); b.style.opacity=d?0.55:1; });
  });
  return wrap;
}


/* =====================================================================
   12.6 LET US LINK — a grassland food chain
   Arrows point from the food to the eater ("is eaten by"), as in
   Fig. 12.8. A correct arrow draws itself while the eater lunges:
   offset(u) = 0.85·sin(πu)·(food − eater), u: 0 → 1 in 1.2 s, and the
   food shrinks and springs back (k = 60, c = 7). Energy dots then flow
   along every arrow. Complete chains (grass → … → top) are traced.
   ===================================================================== */
function buildA6(){
  const NODES=[{id:'grass',n:'Grass'},{id:'grasshopper',n:'Grasshopper'},{id:'hare',n:'Hare'},{id:'frog',n:'Frog'},{id:'snake',n:'Snake'},{id:'eagle',n:'Eagle'}];
  const VALID=['grass>grasshopper','grass>hare','grasshopper>frog','frog>snake','snake>eagle','hare>eagle','frog>eagle','hare>snake'];
  const wrap=labShell();
  const opts=NODES.map(o=>`<option value="${o.id}">${o.n}</option>`).join('');
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Draw an arrow</label>
      <div class="role-row"><span class="rdot" style="background:var(--f-green)"></span><span class="rname">Food</span><select id="fa">${opts}</select></div>
      <div class="role-row"><span class="rdot" style="background:var(--f-red)"></span><span class="rname">Eaten by</span><select id="fb2">${opts}</select></div>
      <button class="toggle-btn navy" id="add" style="padding:10px;">➕ Add arrow</button><div id="fb"></div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="tr" style="padding:10px;">▶ Trace chains</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Clear</button></div>
    <div class="control-group"><label>Food chains <span class="val" id="nV">0</span></label><div id="ch" class="hint" style="font-size:12px;color:var(--text-1);line-height:1.7"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  $('#fa').value='grass'; $('#fb2').value='grasshopper';
  let t=0, links=[{a:'grass',b:'hare',grow:1,ok:1}], lunge=null, trace=-1, traceU=0, chains=[];
  const food={}; NODES.forEach(o=>food[o.id]={x:1,v:0});
  $('#add').onclick=()=>{ const a=$('#fa').value, b=$('#fb2').value; if(a===b){ $('#fb').innerHTML='<div class="fb warn">Pick two different organisms</div>'; return; }
    if(links.some(l=>l.a===a&&l.b===b&&l.ok)){ $('#fb').innerHTML='<div class="fb warn">Already drawn</div>'; return; }
    const ok=VALID.includes(a+'>'+b); links.push({a,b,grow:0,ok:ok?1:0,bad:ok?0:1,life:0});
    $('#fb').innerHTML=ok?`<div class="fb ok">✓ ${NODES.find(n=>n.id===b).n} eats ${NODES.find(n=>n.id===a).n.toLowerCase()}</div>`:`<div class="fb bad">✗ ${NODES.find(n=>n.id===b).n} does not eat ${NODES.find(n=>n.id===a).n.toLowerCase()}</div>`;
    if(ok) lunge={a,b,u:0}; };
  $('#rs').onclick=()=>{ links=[{a:'grass',b:'hare',grow:1,ok:1}]; trace=-1; $('#fb').innerHTML=''; findChains(); };
  $('#tr').onclick=()=>{ if(!chains.length) return; trace=(trace+1)%chains.length; traceU=0; };
  function findChains(){ const ok=links.filter(l=>l.ok&&l.grow>=1); const out=[];
    const walk=(p)=>{ const nx=ok.filter(l=>l.a===p[p.length-1]); if(!nx.length){ if(p.length>2) out.push(p); return; } nx.forEach(l=>{ if(!p.includes(l.b)) walk(p.concat(l.b)); }); };
    walk(['grass']); chains=out;
    $('#nV').textContent=chains.length;
    $('#ch').innerHTML=chains.map((c,i)=>`<div style="${i===trace?'color:var(--f-red);font-weight:700':''}">${c.map(id=>NODES.find(n=>n.id===id).n).join(' → ')}</div>`).join('')||'<span style="color:var(--text-3)">Link grass to a top eater</span>'; }
  findChains();

  animLoop((dt)=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const S=Math.min(w/6,h/5), gy=h*0.9;
    // home positions
    const HOME={grass:[w*0.5,gy-S*0.25],grasshopper:[w*0.2,gy-S*0.62],hare:[w*0.78,gy],frog:[w*0.2,h*0.46],snake:[w*0.52,h*0.44],eagle:[w*0.66+Math.cos(t*0.5)*S*0.6,h*0.15+Math.sin(t*0.5)*S*0.15]};
    const P={}; for(const k in HOME) P[k]=HOME[k].slice();
    // lunge: the eater rushes most of the way to its food and back
    if(lunge){ lunge.u+=dt/1.2; const u=Math.min(1,lunge.u), f=0.85*Math.sin(Math.PI*u);
      const a=HOME[lunge.a], b=HOME[lunge.b]; P[lunge.b]=[lerp(b[0],a[0],f),lerp(b[1],a[1],f)];
      if(u>0.45&&!lunge.bit){ lunge.bit=1; food[lunge.a].x=0.35; food[lunge.a].v=0; }
      if(u>=1) lunge=null; }
    for(const k in food) springTo(food[k],1,60,7,dt);
    // landscape
    groundLine(ctx,0,w,gy); soilDots(ctx,0,w,gy+6,h,61,'#c9b89b',30);
    ctx.save(); ctx.beginPath(); ctx.moveTo(w*0.4,h*0.52); ctx.quadraticCurveTo(w*0.52,h*0.44,w*0.64,h*0.52); ctx.closePath(); ctx.restore();
    // rock for the snake, puddle for the frog
    const rx=w*0.52, ry=h*0.52; ctx.save(); ctx.beginPath(); ctx.moveTo(rx-S*0.8,ry); ctx.quadraticCurveTo(rx-S*0.7,ry-S*0.45,rx,ry-S*0.45); ctx.quadraticCurveTo(rx+S*0.8,ry-S*0.4,rx+S*0.85,ry); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    ell(ctx,w*0.2,h*0.47,S*0.6,S*0.1); SK(ctx,COL.blue,2,'#eef6fe');
    // grass (food scale shrinks when eaten)
    const gs=food.grass.x; for(let i=0;i<16;i++) drawGrass(ctx,w*(0.03+i*0.063),gy,S*0.55*(i>4&&i<11?gs:1),t,0.4,COL.green,6);
    // links
    const ctr=k=>{ const p=P[k]; return k==='grass'?[p[0],p[1]]:[p[0],p[1]-S*0.12]; };
    links.forEach((l,i)=>{ const A=ctr(l.a), B=ctr(l.b);
      if(l.ok){ l.grow=Math.min(1,l.grow+dt/0.9); if(l.grow>=1&&!l.counted){ l.counted=1; findChains(); } }
      else { l.life+=dt; l.grow=l.life<0.6?l.life/0.6*0.55:Math.max(0,0.55-(l.life-1.2)*1.2); }
      if(l.grow<=0) return;
      const Bx=lerp(A[0],B[0],l.grow), By=lerp(A[1],B[1],l.grow);
      const shake=l.ok?0:Math.sin(l.life*40)*4*clamp(1.2-l.life,0,1);
      const inTrace=trace>=0&&chains[trace]&&chains[trace].some((id,j)=>id===l.a&&chains[trace][j+1]===l.b);
      const col=l.ok?COL.red:COL.mid;
      const curve=curveArrow(ctx,A[0],A[1]+shake,Bx,By+shake,S*0.12,col,inTrace?4:2.4,l.ok?null:[6,5],S*0.35,S*0.35);
      if(l.ok&&l.grow>=1){ for(let q=0;q<3;q++){ const u=((t*0.45+q/3)%1); const p=curve(u); dot(ctx,p[0],p[1],inTrace?5:3.2,inTrace?COL.red:COL.yellow); } }
    });
    links=links.filter(l=>l.ok||l.life<2);
    // organisms
    const sc=k=>food[k].x;
    { const p=P.grasshopper, hq=(t*0.7)%1, jump=hq<0.3?Math.sin(hq/0.3*Math.PI):0; drawGrasshopper(ctx,p[0],p[1]-jump*S*0.35,S*0.7*sc('grasshopper'),1,t,{leap:jump}); }
    { const p=P.hare, hq=(t*0.5)%1, jump=hq<0.35?Math.sin(hq/0.35*Math.PI):0; drawQuad(ctx,p[0],p[1]-jump*S*0.3,S*1.1*sc('hare'),-1,t,QUAD.hare,{stretch:jump,graze:jump?0:0.4+0.4*Math.sin(t*3),chew:!jump}); }
    { const p=P.frog; drawFrog(ctx,p[0],p[1],S*0.75*sc('frog'),1,t,{}); }
    { const p=P.snake; drawSnake(ctx,p[0]+S*0.4,p[1],S*1.3*sc('snake'),1,t,{raise:0.3}); }
    { const p=P.eagle, dv=-Math.sin(t*0.5)>=0?1:-1; if(lunge&&lunge.b==='eagle') drawBird(ctx,p[0],p[1],S*1.1*sc('eagle'),dv,t,BIRD.eagle,{flap:t*9,talons:true}); else drawRaptor(ctx,p[0],p[1],S*1.2*sc('eagle'),dv,t,BIRD.eagle,{flap:t*2.2,glide:0.5}); }
    NODES.forEach(o=>{ const p=P[o.id]; const lp=o.id==='grass'?[p[0],gy+18]:[p[0],p[1]+S*0.32]; pill(ctx,o.n,lp[0],lp[1],o.id==='grass'?COL.green:COL.ink,{size:12}); });
    // chain trace: a big pulse runs from grass to the top
    if(trace>=0&&chains[trace]){ traceU+=dt*0.5; const c=chains[trace], seg=Math.floor(traceU)%(c.length-1), u=traceU%1;
      const A=ctr(c[seg]), B=ctr(c[seg+1]); circ(ctx,lerp(A[0],B[0],u),lerp(A[1],B[1],u),7,COL.red,COL.yellow,2.4);
      pill(ctx,c.map(id=>NODES.find(n=>n.id===id).n).join(' → '),w/2,22,COL.red,{size:13}); }
  });
  return wrap;
}


/* =====================================================================
   12.7 LET US DRAW — millet, mice and eagles as a pyramid of numbers
   Each level can feed only a fraction of the one below it:
     mice   M* = ⌊millet / 6⌋,   eagles E* = ⌊M* / 4⌋ (at least 1 once M* ≥ 3)
   The field relaxes toward M*, E*: extra mice are caught by a diving
   eagle (or run off), new mice run in; eagles arrive or leave.
   Count → the counted numbers sit on cards; Arrange → the cards spring
   into order, largest at the base; Pyramid → tiers grow from the cards
   with width ∝ n^0.6 (so 1 eagle is still visible).
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Millet plants <span class="val" id="mV"></span></label><input type="range" id="mR" min="12" max="48" step="1" value="24"></div>
    <div class="control-group"><div class="step-row" id="steps"><button class="step-pill active" data-s="0">1 Count</button><button class="step-pill" data-s="1">2 Arrange</button><button class="step-pill" data-s="2">3 Pyramid</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">Millet</div><div class="rval" id="r0" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Mice</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Eagles</div><div class="rval" id="r2" style="color:var(--f-red)">—</div></div></div>
      <p class="hint">Each level feeds only a few of the next</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), mR=$('#mR');
  let t=0, step=-1, countT=0, counted=null;
  const mice=[], eagles=[];
  for(let i=0;i<4;i++) mice.push({x:0,v:0,dir:1,tx:0,wait:Math.random()*2,ph:0,init:(i+0.5)/4});
  eagles.push({cx:0,x:0,y:0,ph:1,arrive:1,init:1});
  const cards=[{k:1,n:'Mice'},{k:2,n:'Eagle'},{k:0,n:'Millet'}].map(c=>Object.assign(c,{x:{x:0,v:0},y:{x:0,v:0},show:{x:0,v:0},bw:{x:0,v:0}}));
  function setStep(s){ step=s; wrap.querySelectorAll('#steps .step-pill').forEach(b=>{ const i=+b.dataset.s; b.classList.toggle('active',i===s); b.classList.toggle('done',i<s); });
    if(s===0){ countT=0; counted=null; } }
  stepPills(wrap,null,s=>{ if(s>0&&!counted) return; setStep(s); });
  mR.oninput=()=>{ if(step>0) setStep(-1); counted=null; for(let i=0;i<3;i++) $('#r'+i).textContent='—'; };

  animLoop((dt)=>{
    t+=dt; const Nm=+mR.value; $('#mV').textContent=Nm;
    const Mt=Math.floor(Nm/6), Et=Mt>=3?Math.max(1,Math.floor(Mt/4)):0;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const fw=w*0.6, gy=h*0.86, S=Math.min(fw/5,h/4.2);
    mice.forEach(m=>{ if(m.init){ m.x=m.tx=fw*(0.1+0.8*m.init); m.init=0; } }); eagles.forEach(e=>{ if(e.init){ e.cx=fw*0.5; e.x=e.cx; e.y=h*0.14; e.init=0; } });
    groundLine(ctx,0,fw,gy); soilDots(ctx,0,fw,gy+6,h,71,'#c9b89b',30);
    // millet rows (back rows higher and smaller)
    const plants=[]; const rows=3, per=Math.ceil(Nm/rows);
    for(let r=rows-1;r>=0;r--) for(let i=0;i<per;i++){ const idx=r*per+i; if(idx>=Nm) continue; const x=fw*(0.05+0.9*(i+0.5)/per)+(r%2)*fw*0.02, y=gy-r*S*0.12, s=S*(1.05-r*0.12); plants.push({x,y,s,idx}); drawMillet(ctx,x,y,s,t+idx*0.3,0.35); }
    // mice relax toward M*: arrivals run in; extras are caught or run off
    const alive=mice.filter(m=>!m.doom);
    if(alive.length<Mt && Math.random()<dt*1.5) mice.push({x:Math.random()<0.5?-20:fw+20,v:0,dir:1,tx:Math.random()*fw*0.9+fw*0.05,wait:0,ph:0});
    if(alive.length>Mt && Math.random()<dt*0.8){ const m=alive[0]; m.doom=1; const e=eagles.find(e=>!e.doom&&!e.prey); if(e){ e.prey=m; e.du=0; e.sx=e.x; e.sy=e.y; } else m.flee=1; }
    const ae=eagles.filter(e=>!e.doom);
    if(ae.length<Et && Math.random()<dt) eagles.push({cx:fw*(0.25+0.5*Math.random()),x:-40,y:h*0.1,ph:Math.random()*6,arrive:0});
    if(ae.length>Et && Math.random()<dt*0.6){ ae[0].doom=1; }
    for(let i=mice.length-1;i>=0;i--){ const m=mice[i];
      if(m.caught){ m.x=m.caught.x; m.y=m.caught.y+S*0.2; if(m.caught.gone){ mice.splice(i,1); continue; } drawQuad(ctx,m.x,m.y,S*0.45,1,t,QUAD.mouse,{}); continue; }
      if(m.flee){ m.tx=m.x<fw/2?-60:fw+60; }
      if(m.wait>0){ m.wait-=dt; }
      else { const d=m.tx-m.x; m.dir=d>=0?1:-1; const sp=S*1.4; m.x+=clamp(d,-sp*dt,sp*dt); m.ph+=Math.abs(clamp(d,-sp*dt,sp*dt))/(S*0.12);
        if(Math.abs(d)<2){ if(m.flee){ mice.splice(i,1); continue; } m.wait=0.6+Math.random()*1.8; m.tx=Math.random()*fw*0.9+fw*0.05; } }
      m.y=gy; drawQuad(ctx,m.x,gy,S*0.45,m.dir,t+i,QUAD.mouse,{phase:m.ph,move:m.wait>0?0:1,graze:m.wait>0?0.6+0.4*Math.sin(t*6+i):0,chew:m.wait>0});
    }
    // eagles circle; one dives on a parabola to take an extra mouse
    for(let i=eagles.length-1;i>=0;i--){ const e=eagles[i];
      if(e.prey){ e.du+=dt/1.4; const u=Math.min(1,e.du), px=e.prey.x, py=gy-S*0.2;
        if(u<0.5){ const q=u/0.5; e.x=lerp(e.sx,px,q); e.y=lerp(e.sy,py,q*q); if(q>=1&&!e.prey.caught) e.prey.caught=e; }
        else { const q=(u-0.5)/0.5; if(!e.prey.caught) e.prey.caught=e; e.x=lerp(px,e.cx,q); e.y=lerp(py,h*0.14,Math.sqrt(q)); }
        if(u>=1){ e.gone=1; e.prey=null; e.gone=0; const m=mice.findIndex(mm=>mm.caught===e); if(m>=0) mice.splice(m,1); }
        drawBird(ctx,e.x,e.y,S*0.9,e.x<px?1:-1,t,BIRD.eagle,{flap:t*10,talons:true}); continue; }
      if(e.doom){ e.x+=S*2*dt; e.y-=S*0.5*dt; if(e.x>w+60){ eagles.splice(i,1); continue; } }
      else { e.arrive=Math.min(1,e.arrive+dt*0.4); const tx=e.cx+Math.cos(t*0.45+e.ph)*fw*0.2, ty=h*0.14+Math.sin(t*0.45+e.ph)*h*0.04; e.x=lerp(e.x,tx,e.arrive<1?dt*2:1); e.y=lerp(e.y,ty,e.arrive<1?dt*2:1); }
      drawRaptor(ctx,e.x,e.y,S*1.1,-Math.sin(t*0.45+e.ph)>=0?1:-1,t,BIRD.eagle,{flap:t*2.2+e.ph,glide:0.5});
    }

    /* ---- counting: ring each organism in turn ---- */
    if(step===0){ countT+=dt; const order=[].concat(plants.map(p=>({k:0,x:p.x,y:p.y-p.s*0.9})),mice.filter(m=>!m.doom).map(m=>({k:1,x:m.x,y:gy-S*0.12,m})),eagles.filter(e=>!e.doom).map(e=>({k:2,x:e.x,y:e.y,e})));
      const n=Math.min(order.length,Math.floor(countT*9)); const tally=[0,0,0];
      for(let i=0;i<n;i++){ const o=order[i]; const pos=o.m?[o.m.x,gy-S*0.12]:o.e?[o.e.x,o.e.y]:[o.x,o.y]; tally[o.k]++; circ(ctx,pos[0],pos[1],o.k===0?S*0.14:S*0.22,[COL.green,COL.ink,COL.red][o.k],null,2);
        if(i===n-1) textAt(ctx,String(tally[o.k]),pos[0],pos[1]-S*0.25,{align:'center',size:14,weight:700,color:[COL.green,COL.ink,COL.red][o.k]}); }
      for(let i=0;i<3;i++) $('#r'+i).textContent=tally[i];
      if(n>=order.length && order.length){ counted=tally; }
    }
    /* ---- the pyramid panel ---- */
    const px0=w*0.64, px1=w*0.98, pw=px1-px0, base=h*0.88, th=Math.min(h*0.17,70);
    line(ctx,w*0.62,h*0.04,w*0.62,h*0.96,'#dbe4f0',1.4,[5,5]);
    if(counted){
      const order=step>=1?[0,1,2]:[1,2,0];   // counted order vs arranged (largest at base)
      const mxN=Math.max(1,counted[0]);
      cards.forEach(c=>{ const slot=order.indexOf(c.k); const n=counted[c.k];
        const cx=px0+pw/2, cy=step>=1?base-th*(slot+0.5):h*0.14+slot*th*0.9;
        springTo(c.x,cx,40,9,dt); springTo(c.y,cy,40,9,dt); springTo(c.show,1,40,8,dt);
        const tw=step>=2?Math.max(pw*0.18,pw*Math.pow(n/mxN,0.6)):pw*0.5; springTo(c.bw,tw,30,7,dt);
        const col=[COL.green,COL.ink,COL.red][c.k];
        ctx.save(); ctx.globalAlpha=clamp(c.show.x,0,1); ctx.translate(c.x.x,c.y.x);
        if(step>=2){ ctx.beginPath(); const bw=c.bw.x, tw2=slot===2?bw*0.25:Math.max(pw*0.18,pw*Math.pow(counted[order[slot+1]]/mxN,0.6)); ctx.moveTo(-bw/2,th/2); ctx.lineTo(bw/2,th/2); ctx.lineTo(tw2/2,-th/2); ctx.lineTo(-tw2/2,-th/2); ctx.closePath(); ctx.fillStyle=['#f1faf4','#f3f6fa','#fdece7'][c.k]; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke(); }
        else { rrect(ctx,-c.bw.x/2,-th*0.38,c.bw.x,th*0.76,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke(); }
        ctx.restore();
        const ix=c.x.x-(step>=2?th*1.1:c.bw.x*0.28), iy=c.y.x+th*0.3;
        if(c.k===0) drawMillet(ctx,ix,iy,th*0.62,t,0.3); else if(c.k===1) drawQuad(ctx,ix,iy,th*0.7,1,t,QUAD.mouse,{}); else drawRaptor(ctx,ix,iy-th*0.45,th*0.7,1,t,BIRD.eagle,{flap:t*3,glide:0.5});
        textAt(ctx,c.n+'  '+n,step>=2?c.x.x-th*0.35:c.x.x+c.bw.x*0.02,c.y.x+6,{size:14,weight:700,color:col});
      });
      if(step>=2) textAt(ctx,'Trophic level',px0,h*0.06,{size:12,weight:700,color:COL.mid});
      if(step>=2) ['1st','2nd','3rd'].forEach((s,i)=>textAt(ctx,s,px1,base-th*(i+0.5)+4,{align:'right',size:11,weight:700,color:COL.mid}));
    } else textAt(ctx,step===0?'Counting…':'Press 1 Count',px0+pw/2,h*0.45,{align:'center',size:15,weight:700,color:COL.mid});
  });
  return wrap;
}


/* =====================================================================
   12.8 LET US TRACE AND LINK — the grassland food web (Fig. 12.11)
   Populations follow a Lotka–Volterra web (checked numerically):
     grass      dx/dt = x(1 − 0.1x) − Σ eaten
     consumer   dx/dt = x(−0.05 − 0.15x) + 0.6·Σ eaten − Σ being eaten
     eaten on a link i→j:  (0.4 / nprey_j)·x_i·x_j
   All ten coexist; remove hawks → birds and snakes rise, frogs fall;
   remove grasshoppers → frogs, birds and snakes die out.
   Node size ∝ √(x / x₀) and springs to it; energy dots on each arrow
   flow at a rate ∝ the feeding flux.
   ===================================================================== */
function buildA8(){
  const N=[
    {id:'grass',n:'Grasses',x:0.5,y:0.9},{id:'grasshopper',n:'Grasshopper',x:0.17,y:0.72},{id:'hare',n:'Hare',x:0.55,y:0.68},{id:'mouse',n:'Mouse',x:0.84,y:0.66},
    {id:'bird',n:'Bird',x:0.1,y:0.44},{id:'frog',n:'Frog',x:0.34,y:0.52},{id:'snake',n:'Snake',x:0.3,y:0.28},{id:'fox',n:'Fox',x:0.64,y:0.4},{id:'owl',n:'Owl',x:0.88,y:0.34},{id:'hawk',n:'Hawk',x:0.56,y:0.12}];
  const TRUE=[['grass','grasshopper'],['grass','hare'],['grass','mouse'],['grasshopper','frog'],['frog','snake'],['snake','hawk'],['hare','fox'],
    ['grasshopper','bird'],['bird','hawk'],['mouse','snake'],['mouse','owl'],['mouse','fox'],['hare','hawk'],['mouse','hawk']];
  const GIVEN=7;
  const wrap=labShell();
  const opts=N.map(o=>`<option value="${o.id}">${o.n}</option>`).join('');
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:2px;">Organism</label><div class="chip-wrap" id="orgs">${N.map((o,i)=>`<button class="chip-btn" data-i="${i}">${o.n}</button>`).join('')}</div>
      <div class="result-cards" style="margin-top:8px"><div class="rcard"><div class="rlabel">It eats</div><div class="rval" id="rE">—</div></div><div class="rcard"><div class="rlabel">Eaten by</div><div class="rval" id="rB" style="color:var(--f-red)">—</div></div></div></div>
    <div class="control-group"><label style="margin-bottom:4px;">Missing arrows <span class="val" id="mV">0 / 7</span></label>
      <div class="role-row"><span class="rdot" style="background:var(--f-green)"></span><span class="rname">Food</span><select id="fa">${opts}</select></div>
      <div class="role-row"><span class="rdot" style="background:var(--f-red)"></span><span class="rname">Eaten by</span><select id="fb2">${opts}</select></div>
      <button class="toggle-btn navy" id="add" style="padding:9px;">➕ Add arrow</button><div id="fb"></div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="rm" style="padding:10px;">✂ Remove it</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Restore</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  $('#fa').value='grasshopper'; $('#fb2').value='bird';
  const idx=id=>N.findIndex(o=>o.id===id);
  let t=0, sel=-1, drawn=TRUE.slice(0,GIVEN).map(([a,b])=>({a,b,grow:1,given:1})), bad=null;
  // equilibrium populations (x₀) from the model, then the live state
  const x=N.map((o,i)=>i?1:8), removed=new Set();
  function deriv(v){ const d=v.map((q,i)=>i?q*(-0.05-0.15*q):q*(1-0.1*q)); const fl=[];
    TRUE.forEach(([a,b])=>{ const i=idx(a), j=idx(b), np=TRUE.filter(l=>l[1]===b).length, f=0.4/np*v[i]*v[j]; d[i]-=f; d[j]+=0.6*f; fl.push(f); }); return {d,fl}; }
  for(let k=0;k<60000;k++){ const {d}=deriv(x); x.forEach((q,i)=>x[i]=Math.max(0,q+d[i]*0.01)); }
  const x0=x.slice(), R=N.map(()=>({x:1,v:0})); let flux=TRUE.map(()=>0);
  function pick(i){ sel=i; wrap.querySelectorAll('#orgs .chip-btn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i)); info(); $('#rm').textContent=removed.has(N[i].id)?'↩ Put back':'✂ Remove it'; }
  function info(){ if(sel<0) return; const id=N[sel].id, ok=drawn.filter(l=>l.grow>=1);
    const e=ok.filter(l=>l.b===id).map(l=>N[idx(l.a)].n), b=ok.filter(l=>l.a===id).map(l=>N[idx(l.b)].n);
    $('#rE').textContent=e.length?e.length+' · '+e.join(', '):'— makes food'; $('#rB').textContent=b.length?b.length+' · '+b.join(', '):'none'; }
  wrap.querySelectorAll('#orgs .chip-btn').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#add').onclick=()=>{ const a=$('#fa').value, b=$('#fb2').value;
    if(drawn.some(l=>l.a===a&&l.b===b)){ $('#fb').innerHTML='<div class="fb warn">Already there</div>'; return; }
    if(TRUE.some(l=>l[0]===a&&l[1]===b)){ drawn.push({a,b,grow:0}); $('#fb').innerHTML=`<div class="fb ok">✓ ${N[idx(b)].n} eats ${N[idx(a)].n.toLowerCase()}</div>`; }
    else { bad={a,b,life:0}; $('#fb').innerHTML=`<div class="fb bad">✗ Not in this web</div>`; } };
  $('#rm').onclick=()=>{ if(sel<0) return; const id=N[sel].id; if(removed.has(id)){ removed.delete(id); x[sel]=Math.max(x[sel],0.15*x0[sel]); } else removed.add(id); pick(sel); };
  $('#rs').onclick=()=>{ removed.forEach(id=>{ const i=idx(id); x[i]=Math.max(x[i],0.15*x0[i]); }); removed.clear(); if(sel>=0) pick(sel); };
  // re-seed extinct species if their food returns (immigration trickle)
  function icon(ctx,id,cx,cy,r,tt){
    switch(id){
      case 'grass': for(let i=0;i<3;i++) drawGrass(ctx,cx+(i-1)*r*0.45,cy+r*0.55,r*0.9,tt+i,0.4,COL.green,5); break;
      case 'grasshopper': drawGrasshopper(ctx,cx,cy+r*0.35,r*1.7,1,tt); break;
      case 'hare': drawQuad(ctx,cx-r*0.15,cy+r*0.6,r*1.9,1,tt,QUAD.hare,{graze:0.4+0.3*Math.sin(tt*3),chew:1}); break;
      case 'mouse': drawQuad(ctx,cx-r*0.2,cy+r*0.35,r*2.2,1,tt,QUAD.mouse,{graze:0.5+0.5*Math.sin(tt*4),chew:1}); break;
      case 'bird': drawBird(ctx,cx,cy,r*1.7,1,tt,BIRD.small,{flap:tt*12}); break;
      case 'frog': drawFrog(ctx,cx-r*0.1,cy+r*0.45,r*1.6,1,tt,{}); break;
      case 'snake': drawSnake(ctx,cx+r*0.45,cy+r*0.1,r*1.6,1,tt,{}); break;
      case 'fox': drawQuad(ctx,cx+r*0.05,cy+r*0.6,r*1.6,1,tt,QUAD.fox,{}); break;
      case 'owl': drawBird(ctx,cx,cy+r*0.2,r*1.3,1,tt,BIRD.owl,{perch:true}); break;
      case 'hawk': drawRaptor(ctx,cx,cy+r*0.1,r*1.35,1,tt,BIRD.hawk,{flap:tt*2.5,glide:0.4}); break;
    }
  }

  animLoop((dt)=>{
    t+=dt;
    // population dynamics: 20 model-time units per second
    for(let k=0;k<20;k++){ const {d,fl}=deriv(x); flux=fl; x.forEach((q,i)=>{ x[i]=removed.has(N[i].id)?0:Math.max(0,q+d[i]*0.05); if(!removed.has(N[i].id)&&x[i]<1e-3) x[i]=1e-3; }); }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const r0=Math.min(w,h)*0.065;
    const P=N.map(o=>[o.x*w,o.y*h]);
    N.forEach((o,i)=>springTo(R[i],removed.has(o.id)?0.55:clamp(Math.sqrt(x[i]/x0[i]),0.3,2),40,8,dt));
    const rad=i=>r0*R[i].x;
    // arrows: given (solid red), added (red, growing), missing (not shown)
    drawn.forEach(l=>{ l.grow=Math.min(1,l.grow+dt/0.8); if(l.grow>=1&&!l.done){ l.done=1; info(); } const i=idx(l.a), j=idx(l.b);
      const hl=sel>=0&&(i===sel||j===sel), dim=sel>=0&&!hl, dead=removed.has(l.a)||removed.has(l.b);
      const A=P[i], B=[lerp(P[i][0],P[j][0],l.grow),lerp(P[i][1],P[j][1],l.grow)];
      ctx.save(); ctx.globalAlpha=dim?0.35:1;
      const cv=curveArrow(ctx,A[0],A[1],B[0],B[1],r0*0.3,dead?COL.mid:COL.red,hl?3.4:2.2,dead?[5,5]:null,rad(i)+3,l.grow>=1?rad(j)+4:0);
      if(l.grow>=1&&!dead){ const k=TRUE.findIndex(q=>q[0]===l.a&&q[1]===l.b), f=flux[k]||0; const n=Math.max(1,Math.min(5,Math.round(f*6+1)));
        for(let q=0;q<n;q++){ const u=((t*(0.2+f*0.8)+q/n)%1); const p=cv(u); dot(ctx,p[0],p[1],hl?4:3,COL.yellow); } }
      ctx.restore(); });
    drawn.forEach(l=>{ if(!l.given&&!l.flag){ l.flag=1; } });
    // a wrong arrow draws half-way, shakes, and retracts
    if(bad){ bad.life+=dt; const i=idx(bad.a), j=idx(bad.b), g=bad.life<0.5?bad.life/0.5*0.5:Math.max(0,0.5-(bad.life-1)*1.2), sh=Math.sin(bad.life*40)*4*clamp(1.1-bad.life,0,1);
      if(g>0) curveArrow(ctx,P[i][0],P[i][1]+sh,lerp(P[i][0],P[j][0],g),lerp(P[i][1],P[j][1],g)+sh,r0*0.3,COL.mid,2.2,[6,5],rad(i)+3,0); if(bad.life>1.6) bad=null; }
    // nodes
    N.forEach((o,i)=>{ const [cx,cy]=P[i], r=rad(i), gone=removed.has(o.id);
      ctx.save(); if(gone) ctx.globalAlpha=0.35;
      circ(ctx,cx,cy,r,i===sel?COL.yellow:(i===0?COL.green:COL.ink),'#fff',i===sel?3.6:2.2);
      ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-2,0,Math.PI*2); ctx.clip(); icon(ctx,o.id,cx,cy,r*0.75,t+i); ctx.restore();
      ctx.restore();
      if(gone){ line(ctx,cx-r*0.6,cy-r*0.6,cx+r*0.6,cy+r*0.6,COL.red,3); line(ctx,cx+r*0.6,cy-r*0.6,cx-r*0.6,cy+r*0.6,COL.red,3); }
      const ch=x[i]/x0[i]; const lab=o.n+(Math.abs(ch-1)>0.08&&!gone?(ch>1?'  ▲':'  ▼'):'');
      pill(ctx,lab,cx,cy+r+12,gone?COL.mid:(ch>1.08?COL.green:ch<0.92?COL.red:COL.ink),{size:11});
    });
    $('#mV').textContent=(drawn.length-GIVEN)+' / 7';
  });
  return wrap;
}


/* =====================================================================
   12.9 LET US READ — exporting frog legs (1970s–80s) and its cascade
   Rate model, time in years (30 years → 15 s):
     frogs      dF/dt = 0.6·F(1 − F/100) − h·F − 0.012·Q·F
     pests      dP/dt = 0.9·P(1 − P/200) − 0.008·F·P − 0.5·S·P
     spraying   S = clamp((P − 40)/80, 0, 1)   (farmers spray when pests
                                               cross a damage threshold)
     pesticide  dQ/dt = 2·S − 0.15·Q           (builds up, slowly decays)
     water quality = 100 / (1 + Q/5) %
   Check: h = 0 → F ≈ 100, P ≈ 22, no spraying.  h = 0.4 from 1975 →
   F ≈ 30, P ≈ 85, Q ≈ 5 by 1990.  Ban in 1987 → frogs recover.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Frogs exported each year <span class="val" id="hV"></span></label><input type="range" id="hR" min="0" max="60" step="1" value="40">
      <div class="hint">Export starts in 1975</div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;">▶ Run 1970 → 2000</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Reset</button></div>
    <button class="toggle-btn navy" id="ban" style="margin-top:0;padding:10px;">🚫 Ban the export now</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Frogs</div><div class="rval" id="r0" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Pests</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Pesticide in water</div><div class="rval" id="r2" style="color:var(--f-yellow)">—</div></div>
      <div class="rcard"><div class="rlabel">Water quality</div><div class="rval" id="r3" style="color:var(--f-blue)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR');
  let t=0, yr=0, run=false, banY=null, s={F:100,P:22,Q:0}, hist=[], S=0;
  const frogs=[], pests=[], carried=[];
  function reset(){ yr=0; run=false; banY=null; s={F:100,P:22,Q:0}; hist=[{y:0,F:100,P:22,Q:0,S:0}]; $('#go').textContent='▶ Run 1970 → 2000'; $('#ban').textContent='🚫 Ban the export now'; $('#ban').classList.remove('active'); }
  reset();
  $('#go').onclick=()=>{ if(yr>=30) reset(); run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Run 1970 → 2000'; };
  $('#rs').onclick=reset;
  $('#ban').onclick=()=>{ if(banY!==null) return; banY=Math.max(yr,5); $('#ban').textContent='🚫 Banned in '+Math.round(1970+banY); $('#ban').classList.add('active'); };
  const harvest=()=>{ const h=+hR.value/100; return (yr<5||(banY!==null&&yr>=banY))?0:h; };

  animLoop((dt)=>{
    t+=dt; $('#hV').textContent=hR.value+'%';
    if(run){ const dy=dt*2; for(let k=0;k<10;k++){ const h=harvest(); S=clamp((s.P-40)/80,0,1);
        const dF=0.6*s.F*(1-s.F/100)-h*s.F-0.012*s.Q*s.F, dP=0.9*s.P*(1-s.P/200)-0.008*s.F*s.P-0.5*S*s.P, dQ=2*S-0.15*s.Q;
        s.F=Math.max(0.5,s.F+dF*dy/10); s.P=Math.max(0.5,s.P+dP*dy/10); s.Q=Math.max(0,s.Q+dQ*dy/10); yr+=dy/10; }
      if(!hist.length||yr-hist[hist.length-1].y>0.1) hist.push({y:yr,F:s.F,P:s.P,Q:s.Q,S});
      if(yr>=30){ yr=30; run=false; $('#go').textContent='✓ 2000 · again'; } }
    else S=clamp((s.P-40)/80,0,1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const gh=h*0.3, gy=h*0.5, wy=gy+h*0.07, SC=Math.min(w/8,h/6);
    const WQ=100/(1+s.Q/5);
    // paddy water (tints murky as pesticide builds up)
    ctx.save(); ctx.fillStyle=mixCol('#eef6fe','#e9e4d2',1-WQ/100); ctx.fillRect(w*0.02,gy,w*0.86,wy-gy); ctx.restore();
    waterSurface(ctx,w*0.02,w*0.88,gy,1.2,t,0.05,mixCol('#2f8fe0','#8a7f5a',1-WQ/100));
    line(ctx,w*0.02,wy,w*0.88,wy,COL.ink,2.4); soilDots(ctx,w*0.02,w*0.88,wy+6,h-gh-10,91,'#c9b89b',30);
    // rice plants: pests chew them and they yellow
    const dmg=clamp((s.P-20)/150,0,1);
    const plants=[]; for(let i=0;i<11;i++){ const x=w*(0.05+i*0.075); plants.push(x);
      ctx.save(); const col=mixCol('#1f9d55','#d9a017',dmg); ctx.strokeStyle=col; ctx.lineWidth=2;
      for(let b=0;b<6;b++){ const a=-1.2+b*0.48, L=SC*(1.3-dmg*0.35)*(0.8+0.2*Math.cos(b*1.7)), sw=Math.sin(t*1.4+i+b)*0.05;
        ctx.beginPath(); ctx.moveTo(x,gy+4); ctx.quadraticCurveTo(x+Math.sin(a*0.5)*L*0.4,gy-L*0.6,x+Math.sin(a+sw)*L*0.55,gy-Math.cos(a*0.6)*L); ctx.stroke(); }
      ctx.restore(); const pc=mixCol('#1f9d55','#d9a017',dmg), px=x+SC*0.05, py=gy-SC*(1.25-dmg*0.3), sw=Math.sin(t*1.4+i)*SC*0.03;
      ctx.save(); ctx.strokeStyle=pc; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x,gy-SC*0.6); ctx.quadraticCurveTo(px,py-SC*0.1,px+SC*0.25+sw,py+SC*0.2); ctx.stroke(); ctx.restore();
      for(let q=0;q<5;q++){ const u=0.3+q*0.16; const gx=lerp(px,px+SC*0.25+sw,u), gyy=py-SC*0.05+u*u*SC*0.28; ell(ctx,gx,gyy,SC*0.03,SC*0.05,0.6); SK(ctx,pc,1.2,'#fff'); } }
    // pests (∝ P) crawl and hop on the plants
    const nP=Math.min(40,Math.round(s.P/5));
    while(pests.length<nP) pests.push({pl:Math.floor(Math.random()*11),hgt:0.3+Math.random()*0.7,ph:Math.random()*6,hop:0,x:0,y:0});
    while(pests.length>nP) pests.pop();
    pests.forEach(p=>{ if(p.hop>0){ p.hop-=dt; } else if(Math.random()<dt*0.3){ p.pl=clamp(p.pl+(Math.random()<0.5?-1:1),0,10); p.hop=0.5; }
      const tx=plants[p.pl]+Math.sin(p.ph)*SC*0.25, ty=gy-p.hgt*SC*1.1; p.x=p.x?approach(p.x,tx,5,dt):tx; p.y=p.y?approach(p.y,ty-(p.hop>0?Math.sin(p.hop/0.5*Math.PI)*SC*0.4:0),8,dt):ty;
      if(!p.eaten) drawInsect(ctx,p.x,p.y,SC*0.15,Math.sin(p.ph)>0?1:-1,t+p.ph,{fly:p.hop>0}); });
    // frogs (∝ F): sit in the water, hop, snap pests
    const nF=Math.min(12,Math.round(s.F/8));
    while(frogs.filter(f=>!f.gone).length<nF) frogs.push({x:w*(0.05+Math.random()*0.78),hx:0,ph:Math.random()*6,hop:-1,tongue:0,tx:0});
    while(frogs.filter(f=>!f.gone).length>nF){ const f=frogs.find(f=>!f.gone); f.gone=1; if(harvest()>0) carried.push({x:f.x,y:gy,u:0}); }
    for(let i=frogs.length-1;i>=0;i--) if(frogs[i].gone) frogs.splice(i,1);
    frogs.forEach(f=>{ f.ph+=dt;
      if(f.hop>=0){ f.hop+=dt/0.7; const u=Math.min(1,f.hop); const x=lerp(f.hx,f.tx,u); drawFrog(ctx,x,gy-Math.sin(u*Math.PI)*SC*0.6+2,SC*0.55,f.tx>=f.hx?1:-1,t,{leap:Math.sin(u*Math.PI)}); if(u>=1){ f.x=f.tx; f.hop=-1; } return; }
      if(Math.random()<dt*0.15){ f.hx=f.x; f.tx=clamp(f.x+(Math.random()-0.5)*SC*2.5,w*0.04,w*0.85); f.hop=0; }
      let tg=0, ta=-0.7; const near=pests.find(p=>Math.abs(p.x-f.x)<SC*0.9&&!p.eaten);
      if(near && Math.sin(f.ph*2.3)>0.9){ tg=Math.hypot(near.x-f.x-SC*0.25,near.y-gy+SC*0.14)/(SC*0.55); ta=Math.atan2(near.y-gy+SC*0.14,Math.abs(near.x-f.x)-SC*0.25); }
      drawFrog(ctx,f.x,gy+2,SC*0.55,near&&near.x<f.x?-1:1,t+f.ph,{tongue:tg,tAng:ta}); });
    // frogs carried off to the export basket on an arc
    const bx=w*0.94, by=gy-SC*0.2;
    ctx.save(); ctx.beginPath(); ctx.moveTo(bx-SC*0.45,by-SC*0.3); ctx.lineTo(bx-SC*0.35,by+SC*0.3); ctx.lineTo(bx+SC*0.35,by+SC*0.3); ctx.lineTo(bx+SC*0.45,by-SC*0.3); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    for(let i=0;i<4;i++) line(ctx,bx-SC*0.4+i*SC*0.02,by-SC*0.15+i*SC*0.12,bx+SC*0.4-i*SC*0.02,by-SC*0.15+i*SC*0.12,COL.mid,1);
    pill(ctx,'Export',bx,by+SC*0.55,COL.red,{size:11});
    if(banY!==null){ line(ctx,bx-SC*0.5,by-SC*0.4,bx+SC*0.5,by+SC*0.4,COL.red,4); line(ctx,bx+SC*0.5,by-SC*0.4,bx-SC*0.5,by+SC*0.4,COL.red,4); }
    for(let i=carried.length-1;i>=0;i--){ const c=carried[i]; c.u+=dt/1.1; const u=Math.min(1,c.u); const X=lerp(c.x,bx,u), Y=lerp(c.y,by-SC*0.2,u)-4*SC*1.6*u*(1-u);
      drawFrog(ctx,X,Y,SC*0.45,1,t,{leap:0.8}); if(u>=1) carried.splice(i,1); }
    // farmer sprays when pests cross the threshold (mist ∝ S)
    if(S>0.02){ const fx=w*(0.1+0.7*(0.5+0.5*Math.sin(t*0.15))), fdir=Math.cos(t*0.15)>=0?1:-1;
      drawPerson(ctx,fx,wy-2,SC*1.3,fdir,t,{phase:t*5,move:1,tank:1,arm:0.3});
      const nz=[fx+fdir*SC*0.62,wy-SC*1.1];
      for(let q=0;q<Math.round(18*S);q++){ const u=((t*0.9+q/18)%1); const mx=nz[0]+fdir*u*SC*0.9+Math.sin(q*3.1+t)*SC*0.15*u, my=nz[1]+u*SC*0.7+Math.cos(q*2.3)*SC*0.2*u;
        ctx.save(); ctx.globalAlpha=(1-u)*0.8; dot(ctx,mx,my,2+u*3,COL.yellow); ctx.restore(); } }
    textAt(ctx,String(Math.floor(1970+yr)),w*0.02,h*0.07,{size:22,weight:700,color:COL.ink});
    if(harvest()>0) textAt(ctx,'exporting frog legs',w*0.02,h*0.07+20,{size:12,weight:700,color:COL.red});

    /* ---- graph strip: 1970–2000 ---- */
    const gx0=w*0.07, gx1=w*0.97, gyb=h-18, gyt=h-gh+10;
    line(ctx,gx0,gyb,gx1,gyb,COL.ink,1.6); line(ctx,gx0,gyt,gx0,gyb,COL.ink,1.6);
    for(let y=0;y<=30;y+=5){ const X=lerp(gx0,gx1,y/30); line(ctx,X,gyb,X,gyb+4,COL.ink,1.2); textAt(ctx,String(1970+y),X,gyb+15,{align:'center',size:10,color:COL.mid}); }
    if(banY!==null){ const X=lerp(gx0,gx1,banY/30); line(ctx,X,gyt,X,gyb,COL.red,1.4,[4,4]); textAt(ctx,'ban',X+4,gyt+10,{size:10,weight:700,color:COL.red}); }
    const X=y=>lerp(gx0,gx1,y/30), Y=v=>lerp(gyb,gyt,v);
    [['F',100,COL.red,'Frogs'],['P',200,COL.ink,'Pests'],['Q',15,COL.yellow,'Pesticide'],['W',100,COL.blue,'Water']].forEach(([k,mx,col,lab],j)=>{
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath();
      hist.forEach((p,i)=>{ const v=k==='W'?100/(1+p.Q/5):p[k]; const xx=X(p.y), yy=Y(clamp(v/mx,0,1)); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }); ctx.stroke(); ctx.restore();
      textAt(ctx,lab,gx0+8+j*80,gyt-4,{size:11,weight:700,color:col}); });
    $('#r0').textContent=Math.round(s.F); $('#r1').textContent=Math.round(s.P); $('#r2').textContent=fmt(s.Q,1); $('#r3').textContent=Math.round(WQ)+'%';
  });
  return wrap;
}


/* =====================================================================
   12.10 LET US SURVEY — what farming choices do to soil over 10 years
   Yearly rate model (tuned numerically; values 0 … ~1.2):
     humus      dH = (0.10·org + 0.04·E + 0.03·M)(1 − H/1.2) − 0.09·H·k_syn·k_mono
     microbes   dM = 1.2·M·(k·H + 0.2 − M) − 0.15·p·M
     earthworms dE = 0.9·E·(1.1·H − E) − 0.35·p·E
     predators  dB = B(1 − B) − 1.3·p·B               (ladybird beetles)
     pests      dP = 1.2·P(1 − P)·k_mono − 1.0·B·P − 1.5·p(1 − R)·P
     resistance dR = 0.25·p·k_mono·(1 − R)
     yield      Y = min(1, nutrients)·(1 − 0.7·P)   (synthetic 0.95; organic 0.45 + 0.6·H)
   Check: synthetic + 80 % spray + one crop → yield 0.80 → 0.37, pests
   0.3 → 0.87, earthworms 0.6 → 0.13.  Organic, no spray, rotation →
   yield 0.61 → 0.9, humus and earthworms rise.
   Each year: fertiliser falls in (0–15 %), spraying (40–60 %), a
   monsoon storm (75–95 %) washes loose topsoil away ∝ (1 − H).
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Fertiliser</label>
      <div class="toggle-group" id="fzB"><button class="toggle-btn active" data-v="1">Synthetic</button><button class="toggle-btn" data-v="0">Compost · Kunapa jala</button></div></div>
    <div class="control-group"><label>Pesticide spraying <span class="val" id="pV"></span></label><input type="range" id="pR" min="0" max="100" step="5" value="80"></div>
    <div class="control-group"><label style="margin-bottom:6px;">Crops</label>
      <div class="toggle-group" id="crB"><button class="toggle-btn active" data-v="1">Same crop</button><button class="toggle-btn" data-v="0">Rotate crops</button></div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;">▶ Farm 10 years</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Reset</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Crop yield</div><div class="rval" id="r0" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Humus</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Earthworms</div><div class="rval" id="r2">—</div></div>
      <div class="rcard"><div class="rlabel">Pests</div><div class="rval" id="r3" style="color:var(--f-red)">—</div></div></div></div>
    <div class="control-group"><table class="log"><thead><tr><th>Year</th><th>Yield</th><th>Humus</th><th>Pests</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  let syn=1, mono=1, t=0, yr=0, run=false, s, s0, rows=[], eroded=0, lastYear=-1;
  const Y={x:0.75,v:0};
  function yieldOf(st){ const nut=syn?0.95:0.45+0.6*st.H; return Math.min(1,nut)*(1-0.7*st.P)*(mono?1:0.97); }
  function reset(){ s={H:0.6,M:0.6,E:0.6,B:0.6,P:0.3,R:0}; s0=Object.assign({},s); yr=0; run=false; rows=[]; eroded=0; lastYear=-1; $('#tb').innerHTML=''; $('#go').textContent='▶ Farm 10 years'; }
  reset();
  toggleWire(wrap.querySelectorAll('#fzB button'),b=>{ syn=+b.dataset.v; reset(); });
  toggleWire(wrap.querySelectorAll('#crB button'),b=>{ mono=+b.dataset.v; reset(); });
  pR.oninput=()=>{ if(yr===0) reset(); };
  $('#go').onclick=()=>{ if(yr>=10) reset(); run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Farm 10 years'; };
  $('#rs').onclick=reset;
  const R0=rng(1010), grains=Array.from({length:230},()=>({x:R0(),y:R0(),r:0.5+R0()*0.8,c:Math.floor(R0()*26)}));
  const clusters=Array.from({length:26},()=>({x:0.04+R0()*0.92,y:0.05+R0()*0.55}));
  const worms=Array.from({length:6},(_,i)=>({x:0.1+i*0.15,y:0.3+R0()*0.4,a:R0()*6,trail:[]}));
  const drops=[], pellets=[], washed=[];
  const pestA=[], beetles=[];

  animLoop((dt)=>{
    t+=dt; const p=+pR.value/100; $('#pV').textContent=pR.value+'%';
    const yearF=yr%1;
    if(run){ const dy=dt/1.5; for(let k=0;k<10;k++){ const h=dy/10, org=syn?0:1, eff=p*(1-s.R);
        const dH=(0.10*org+0.04*s.E+0.03*s.M)*(1-s.H/1.2)-0.09*s.H*(syn?1.4:1)*(mono?1.2:1);
        const dM=1.2*s.M*((syn?0.7:1)*s.H+0.2-s.M)-0.15*p*s.M, dE=0.9*s.E*(1.1*s.H-s.E)-0.35*p*s.E;
        const dB=s.B*(1-s.B)-1.3*p*s.B, dP=1.2*s.P*(1-s.P)*(mono?1.3:0.8)-1.0*s.B*s.P-1.5*eff*s.P, dR=0.25*p*(mono?1.2:0.8)*(1-s.R);
        s.H=clamp(s.H+dH*h,0.02,1.2); s.M=clamp(s.M+dM*h,0.01,1.2); s.E=clamp(s.E+dE*h,0.01,1.3); s.B=clamp(s.B+dB*h,0.01,1); s.P=clamp(s.P+dP*h,0.01,1); s.R=clamp(s.R+dR*h,0,1); yr+=h; }
      eroded+=dy*(1-s.H/1.2)*(mono?1.2:0.8)*0.5;
      if(Math.floor(yr)!==lastYear){ lastYear=Math.floor(yr); rows.push([lastYear,Math.round(yieldOf(s)*100),Math.round(s.H*100),Math.round(s.P*100)]);
        $('#tb').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td class="r-ok">${r[1]}%</td><td>${r[2]}</td><td class="r-bad">${r[3]}</td></tr>`).join(''); }
      if(yr>=10){ yr=10; run=false; $('#go').textContent='✓ 10 years · again'; } }
    const YL=yieldOf(s); springTo(Y,YL,20,7,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const gy=h*0.44+eroded*h*0.05, SC=Math.min(w/7,h/5), sb=h*0.97;
    /* ---- soil cross-section: grains clump into crumbs when humus is high ---- */
    ctx.save(); ctx.fillStyle=mixCol('#f4efe4','#e6dac1',clamp(s.H/1.2,0,1)); ctx.fillRect(0,gy,w,sb-gy); ctx.restore();
    line(ctx,0,sb,w,sb,COL.ink,2);
    const agg=smooth01(0.25,0.9,s.H);
    clusters.forEach(c=>{ if(agg<0.15) return; ctx.save(); ctx.globalAlpha=agg*0.5; ell(ctx,c.x*w,gy+c.y*(sb-gy),SC*0.28,SC*0.18); ctx.fillStyle='#d7c7a6'; ctx.fill(); ctx.restore(); });
    grains.forEach(g=>{ const c=clusters[g.c]; const lx=g.x*w, ly=gy+g.y*(sb-gy)*0.95+4, cx=c.x*w+(g.x-0.5)*SC*0.5, cy=gy+c.y*(sb-gy)+(g.y-0.5)*SC*0.3;
      circ(ctx,lerp(lx,cx,agg),lerp(ly,cy,agg),g.r*SC*0.05,'#9c8a6a',g.r>1?'#fff':'#efe7d6',1.2); });
    // microbes (∝ M) jiggle
    const nM=Math.round(s.M*40); const RM=rng(7);
    for(let i=0;i<nM;i++){ const mx=RM()*w, my=gy+RM()*(sb-gy); dot(ctx,mx+Math.sin(t*3+i)*2,my+Math.cos(t*2.6+i*1.3)*2,1.8,COL.green); }
    // earthworms (∝ E) burrow, leaving tunnels
    const nE=Math.min(6,Math.round(s.E*5));
    worms.forEach((q,i)=>{ if(i>=nE) return; q.a+=gauss()*1.2*Math.sqrt(dt); q.x+=Math.cos(q.a)*0.02*dt; q.y+=Math.sin(q.a)*0.03*dt;
      if(q.x<0.03||q.x>0.97) q.a=Math.PI-q.a; if(q.y<0.08||q.y>0.9) q.a=-q.a; q.x=clamp(q.x,0.03,0.97); q.y=clamp(q.y,0.08,0.9);
      q.trail.push([q.x,q.y]); if(q.trail.length>90) q.trail.shift();
      ctx.save(); ctx.strokeStyle='rgba(129,149,171,0.45)'; ctx.lineWidth=SC*0.07; ctx.lineCap='round'; ctx.beginPath(); q.trail.forEach((p,j)=>{ const X=p[0]*w, Yy=gy+p[1]*(sb-gy); j?ctx.lineTo(X,Yy):ctx.moveTo(X,Yy); }); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.translate(q.x*w,gy+q.y*(sb-gy)); ctx.rotate(q.a); drawWorm(ctx,0,0,SC*0.6,1,t+i); ctx.restore(); });
    /* ---- crops: height ∝ yield; roots deeper in crumbly soil ---- */
    const nPl=8, crop=mono?0:(Math.floor(yr)%2);
    for(let i=0;i<nPl;i++){ const x=w*(0.08+i*0.12), sz=SC*(0.7+1.0*clamp(Y.x,0,1));
      ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.4; for(let r=0;r<4;r++){ ctx.beginPath(); ctx.moveTo(x,gy); ctx.quadraticCurveTo(x+(r-1.5)*SC*0.2,gy+SC*0.3,x+(r-1.5)*SC*0.3,gy+SC*(0.3+0.5*agg)); ctx.stroke(); } ctx.restore();
      if(crop===0) drawMillet(ctx,x,gy,sz,t+i,0.3,{grain:clamp(Y.x,0.2,1)});
      else { G(ctx,x,gy,sz,1,u=>{ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-0.55); SK(ctx,COL.green,2*u); for(let k=0;k<7;k++){ const a=-Math.PI/2+(k-3)*0.45, rr=0.3+0.1*Math.cos(k); ell(ctx,Math.cos(a)*rr*0.8,-0.5+Math.sin(a)*rr*0.6+0.25,0.1,0.06,a); SK(ctx,COL.green,1.6*u,'#f1faf4'); }
        for(let k=0;k<3;k++){ ell(ctx,-0.18+k*0.18,-0.3,0.03,0.09,0.3); SK(ctx,COL.green,1.4*u,'#fff'); } }); }
    }
    groundLine(ctx,0,w,gy);
    // pests (∝ P) on the crop, ladybird beetles (∝ B) hunt them
    const nP=Math.round(s.P*28), nB=Math.round(s.B*6);
    while(pestA.length<nP) pestA.push({i:Math.floor(Math.random()*nPl),hh:0.3+Math.random()*0.6,ph:Math.random()*6});
    while(pestA.length>nP) pestA.pop();
    pestA.forEach(q=>{ const x=w*(0.08+q.i*0.12)+Math.sin(t*0.8+q.ph)*SC*0.2, y=gy-q.hh*SC*(0.7+1.0*clamp(Y.x,0,1)); drawInsect(ctx,x,y,SC*0.12,Math.cos(t*0.8+q.ph)>0?1:-1,t+q.ph); });
    while(beetles.length<nB) beetles.push({x:Math.random(),ph:Math.random()*6,dir:1});
    while(beetles.length>nB) beetles.pop();
    beetles.forEach(b=>{ b.x+=Math.sin(t*0.3+b.ph)*0.03*dt; b.x=clamp(b.x,0.02,0.98); drawBeetle(ctx,b.x*w,gy-2,SC*0.28,Math.cos(t*0.3+b.ph)>0?1:-1,t+b.ph); });
    /* ---- the year's events ---- */
    if(run||yr>0&&yr<10){
      if(yearF<0.15 && Math.random()<dt*25) pellets.push({x:w*(0.05+Math.random()*0.9),y:-10,vy:0,vx:(Math.random()-0.5)*40,syn});
      if(yearF>0.4&&yearF<0.6&&p>0){ for(let q=0;q<Math.round(30*p);q++){ const u=((t*0.6+q/30)%1), mx=w*(q/30)+u*w*0.08, my=gy-SC*1.4+u*SC*0.9; ctx.save(); ctx.globalAlpha=(1-u)*0.7; dot(ctx,mx,my,2+3*u,COL.yellow); ctx.restore(); } }
      if(yearF>0.75&&yearF<0.95){ for(let q=0;q<5;q++) drops.push({x:Math.random()*w,y:0,vy:500+Math.random()*200});
        if(Math.random()<dt*20*(1-s.H/1.2)*(mono?1.2:0.8)) washed.push({x:Math.random()*w*0.8,y:gy+2,vx:60+Math.random()*80}); }
    }
    for(let i=pellets.length-1;i>=0;i--){ const q=pellets[i]; q.vy+=600*dt; q.y+=q.vy*dt; q.x+=q.vx*dt; if(q.y>gy){ pellets.splice(i,1); continue; }
      if(q.syn) circ(ctx,q.x,q.y,3,COL.ink,'#fff',1.4); else { ell(ctx,q.x,q.y,5,3.5,q.x); SK(ctx,COL.ink,1.2,'#8d7a55'); } }
    for(let i=drops.length-1;i>=0;i--){ const q=drops[i]; q.y+=q.vy*dt; if(q.y>gy){ drops.splice(i,1); continue; } line(ctx,q.x,q.y,q.x-2,q.y-9,COL.blue,1.4); }
    for(let i=washed.length-1;i>=0;i--){ const q=washed[i]; q.x+=q.vx*dt; q.y=gy+2+Math.sin(q.x*0.1)*1.5; if(q.x>w+10){ washed.splice(i,1); continue; } dot(ctx,q.x,q.y-2,2.4,'#9c8a6a'); }
    if(yearF>0.75&&yearF<0.95&&(run)){ vec(ctx,w*0.7,gy-12,w*0.95,gy-12,COL.blue,2.4); textAt(ctx,'run-off',w*0.82,gy-18,{align:'center',size:11,weight:700,color:COL.blue}); }
    // year banner
    textAt(ctx,'Year '+Math.floor(yr),16,28,{size:18,weight:700,color:COL.ink});
    const ev=(!run&&yr===0)||yr>=10?'':yearF<0.15?(syn?'adding synthetic fertiliser':'adding compost · Kunapa jala'):yearF>0.4&&yearF<0.6&&p>0?'spraying pesticide':yearF>0.75&&yearF<0.95?'monsoon rain':'';
    if(ev) textAt(ctx,ev,16,48,{size:12,weight:700,color:COL.mid});
    const arrow=(v,v0)=>v>v0*1.05?' ▲':v<v0*0.95?' ▼':'';
    $('#r0').textContent=Math.round(YL*100)+'%'+arrow(YL,yieldOf(s0)); $('#r1').textContent=Math.round(s.H*100)+arrow(s.H,s0.H);
    $('#r2').textContent=Math.round(s.E*100)+arrow(s.E,s0.E); $('#r3').textContent=Math.round(s.P*100)+arrow(s.P,s0.P);
  });
  return wrap;
}

   1. ACTIVITIES + ROUTER

const activities = [
  { num:'12.1', title:'Two Habitats', desc:'Survey a habitat · sort living and non-living', build: buildA1 },
  { num:'12.2', title:'Count in a Quadrat', desc:'Throw a 1 m × 1 m frame · count what is inside', build: buildA2 },
  { num:'12.3', title:'Pond A vs Pond B', desc:'Fish → dragonflies → bees → seeds', build: buildA3 },
  { num:'12.4', title:'Spot the Interactions', desc:'Sort each interaction into Criterion 1, 2 or 3', build: buildA4 },
  { num:'12.5', title:'Who Eats What?', desc:'Watch each organism feed · classify it', build: buildA5 },
  { num:'12.6', title:'Link a Food Chain', desc:'Grassland · draw who eats whom', build: buildA6 },
  { num:'12.7', title:'Pyramid of Numbers', desc:'Count millet, mice, eagles · stack them', build: buildA7 },
  { num:'12.8', title:'Trace a Food Web', desc:'Add the missing arrows · remove a species', build: buildA8 },
  { num:'12.9', title:'Frogs, Pests & Pesticides', desc:'Export frog legs · watch the fields', build: buildA9 },
  { num:'12.10', title:'Farm Survey', desc:'Farming choices · 10 years of soil', build: buildA10 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
