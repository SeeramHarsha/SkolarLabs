/* =====================================================================
   11.9 LET US EXPLORE — a candle flame through a pinhole
   Side view, 8 px = 1 cm. Light from each point of the flame goes in a
   straight line through the hole, so a point at height y above the hole
   lands at −y·v/u on the screen: the image is upside down and v/u times
   the flame's size. A hole of diameter a turns each point into a small
   disc of diameter a·(u + v)/u (blur), and the image brightness goes as
   (a / v)². Screen picture = the live flame shape (it flickers and sways
   with a noise + spring model; "blow" gives it a push) drawn rotated by
   180°, scaled by v/u, blurred by that disc and dimmed by (a/v)².
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Candle → cardboard (u) <span class="val" id="uv">15 cm</span></label><input type="range" id="u" min="8" max="40" step="1" value="15">
      <label style="margin-top:6px">Cardboard → screen (v) <span class="val" id="vv">20 cm</span></label><input type="range" id="v" min="5" max="40" step="1" value="20">
      <label style="margin-top:6px">Size of the hole <span class="val" id="av">2 mm</span></label><input type="range" id="a" min="1" max="14" step="0.5" value="2"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="blow">💨 Blow gently on the flame</button></div>
      <div class="toggle-group"><button class="toggle-btn active" id="dim">Dimly lit room</button></div>
      <div class="hint">⚠ Use a lighted candle only with an adult.</div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Image height',COL.red)}${card('k2','Upright or inverted?',COL.red)}${card('k3','Blur (each point →)',COL.green)}${card('k4','Brightness',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const K=8, HX=400, TY=462, AXIS=318, FLAME=3.4;                 // flame height in cm
  let t=0, u=15, v=20, a=2, dim=true, U={x:15,v:0}, V={x:20,v:0}, sway={x:0,v:0}, gust=0;
  const pin=(id,lab,f,unit)=>{ $('#'+id).oninput=e=>{ f(+e.target.value); $('#'+lab).textContent=e.target.value+unit; }; };
  pin('u','uv',x=>u=x,' cm'); pin('v','vv',x=>v=x,' cm'); pin('a','av',x=>a=x,' mm');
  $('#blow').onclick=()=>{ gust=1.2; }; $('#dim').onclick=()=>{ dim=!dim; $('#dim').classList.toggle('active',dim); $('#dim').textContent=dim?'Dimly lit room':'Bright room'; };
  const face=document.createElement('canvas'); face.width=220; face.height=220; const fctx=face.getContext('2d');
  // a flame outline in cm, base at (0,0), pointing up (y up), leaning by `ln`
  function flamePath(c,s,ln,tt){ const H=FLAME*(1+0.07*Math.sin(tt*17)+0.04*Math.sin(tt*29+1)), W=1.05; c.beginPath();
    c.moveTo(-W/2*s,0); c.bezierCurveTo(-W*0.62*s,-H*0.45*s,(ln*H*0.5-W*0.1)*s,-H*0.78*s,ln*H*s,-H*s); c.bezierCurveTo((ln*H*0.5+W*0.1)*s,-H*0.78*s,W*0.62*s,-H*0.45*s,W/2*s,0); c.quadraticCurveTo(0,W*0.3*s,-W/2*s,0); c.closePath(); }

  animLoop(dt=>{ t+=dt;
    U.v+=((u-U.x)*20-U.v*6.5)*dt; U.x+=U.v*dt; V.v+=((v-V.x)*20-V.v*6.5)*dt; V.x+=V.v*dt;
    gust=Math.max(0,gust-dt*0.9); const noise=Math.sin(t*2.3)*0.05+Math.sin(t*5.1+1)*0.03;
    sway.v+=((noise+gust*0.45-sway.x)*30-sway.v*3.2)*dt; sway.x+=sway.v*dt;
    const uu=U.x, vv=V.x, m=vv/uu, blur=a/10*(uu+vv)/uu, B=clamp(Math.pow(a/vv,2)*70,0,1.4), amb=dim?0.06:0.5;
    const cx=HX-uu*K, sx=HX+vv*K, candleH=(TY-AXIS)-FLAME*K*0.45-10;          // flame's middle on the hole's axis

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle=dim?'#e6e9ef':'#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[20,6,790,506]);
    tableTop(ctx,30,780,TY,0);
    // candle; its flame (lean follows the sway)
    const cd=candleDraw(ctx,cx,TY,26,candleH,{lit:false,t,wickH:10});
    const fb={x:cd.tip.x,y:cd.tip.y+4};
    ctx.save(); ctx.translate(fb.x,fb.y); glow(ctx,sway.x*14,-FLAME*K*0.5,FLAME*K*1.6,COL.yellow,0.35);
    flamePath(ctx,K,sway.x,t); ctx.fillStyle=rgba(COL.yellow,0.25); ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    const fTip={x:fb.x+sway.x*FLAME*K,y:fb.y-FLAME*K}, hole={x:HX,y:AXIS};
    // rays: tip and base, each through the two edges of the hole
    const ah=Math.max(1.2,a/10*K/2);
    const through=(P,dy,col,al)=>{ const Hy=hole.y+dy, k=(sx-P.x)/(HX-P.x), y=P.y+(Hy-P.y)*k; rayPath(ctx,[P,{x:HX,y:Hy},{x:sx,y}],col,t,al,1.4,{at:0.5,dashes:[8,7]}); return y; };
    const yt1=through(fTip,-ah,COL.yellow,0.8), yt2=through(fTip,ah,COL.yellow,0.8), yb1=through(fb,-ah,COL.yellow,0.5), yb2=through(fb,ah,COL.yellow,0.5);
    fillPoly(ctx,[fTip,{x:HX,y:AXIS-ah},{x:sx,y:yt1},{x:sx,y:yt2},{x:HX,y:AXIS+ah}],rgba(COL.yellow,0.1));
    // cardboard with the hole
    rect(ctx,HX-3,AXIS-130,6,130-ah,COL.ink,'#d9c09a',2); rect(ctx,HX-3,AXIS+ah,6,TY-AXIS-ah-24,COL.ink,'#d9c09a',2); line(ctx,HX,TY-24,HX,TY,COL.ink,3); line(ctx,HX-20,TY,HX+20,TY,COL.ink,3.2);
    textAt(ctx,'cardboard',HX,AXIS-140,{align:'center',size:12,weight:700,color:COL.ink});
    // screen + the inverted image on its edge
    screenSide(ctx,sx,AXIS-130,TY-14,{label:'Screen',leg:14});
    const yi0=(yb1+yb2)/2, yi1=(yt1+yt2)/2; line(ctx,sx-2,yi0,sx-2,yi1,COL.red,4); arrowHead(ctx,sx-2,yi1,Math.PI/2*Math.sign(yi1-yi0||1),COL.red,8);
    dimH(ctx,cx,HX-4,TY+26,Math.round(uu)+' cm',COL.green); dimH(ctx,HX+4,sx,TY+26,Math.round(vv)+' cm',COL.green);
    // ---------- what the screen shows (face on) ----------
    const P=220, pxcm=P/16;                                    // panel shows 16 cm × 16 cm
    fctx.setTransform(1,0,0,1,0,0); fctx.filter='none'; fctx.globalAlpha=1; fctx.fillStyle=mixCol('#141c28','#c9cfd8',amb); fctx.fillRect(0,0,P,P);
    fctx.save(); fctx.translate(P/2,P/2); fctx.scale(-1,-1);                           // rotated through 180°
    const bpx=blur*pxcm; fctx.filter=bpx>1?'blur('+(bpx*0.28).toFixed(1)+'px)':'none';
    fctx.translate(0,FLAME*0.5*m*pxcm);                                       // flame's middle sits on the axis
    fctx.globalAlpha=Math.sqrt(clamp(B,0,1))*(1-amb*0.8); flamePath(fctx,m*pxcm,sway.x,t); const g=fctx.createLinearGradient(0,0,0,-FLAME*m*pxcm); g.addColorStop(0,'#ffe7a0'); g.addColorStop(1,'#ffb347');
    fctx.fillStyle=g; fctx.fill(); fctx.globalAlpha=Math.sqrt(clamp(B,0,1))*0.6*(1-amb*0.8); fctx.lineWidth=Math.max(1,m*pxcm*0.08); fctx.strokeStyle='#ff8c3a'; fctx.stroke();
    fctx.restore(); fctx.filter='none';
    const px0=30, py0=22; panelFrame(ctx,px0,py0,P,P,'On the screen',COL.green,true); ctx.save(); rrect(ctx,px0+3,py0+3,P-6,P-6,8); ctx.clip(); ctx.drawImage(face,px0,py0); ctx.restore();
    line(ctx,px0+P/2,py0+P-10,px0+P/2,py0+P-4,'#9fb0c6',1); textAt(ctx,'image of the flame',px0+P/2,py0+P+18,{align:'center',size:11.5,weight:700,color:COL.red});
    ctx.restore();

    // ---------- side ----------
    setv($,'k1',fmt(FLAME*m,1)+' cm'); setv($,'k2','upside down'); setv($,'k3',fmt(blur*10,1)+' mm disc'); setv($,'k4',Math.round(clamp(B,0,1)*100)+' %');
    const o=$('#obs'), msg=a>8?['warn','A big hole: bright but only a blur — each flame point spreads into a '+fmt(blur*10,0)+' mm disc.']:!dim?['warn','In a bright room the faint image is washed out. Dim the room.']:gust>0.2?['ok','The flame leans one way — its image leans the other way and stays upside down.']:['ok','Light from the top of the flame goes down through the hole; light from the bottom goes up — so the image is inverted.'];
    if(o.textContent!==msg[1]){ o.textContent=msg[1]; o.className='fb '+msg[0]; }
  });
  return wrap;
}

/* =====================================================================
   11.10 LET US CONSTRUCT — a sliding pinhole camera
   Outdoors, a friend (1.5 m tall, 6 m away), a tree (7 m, 20 m away) and
   a building (15 m, 50 m away); the camera's pinhole is 1.3 m above the
   ground. A point seen at angle θ from the pinhole lands at −v·θ on the
   tracing paper (v = pinhole-to-paper distance), so the picture is
   turned through 180° and grows with v. The side view keeps every
   object's true angular size, so rays drawn through the pinhole are real.
   Blur on the paper = √[(a(1 + v/u))² + (2.44 λ v / a)²] (hole shadow +
   diffraction, λ = 550 nm); brightness ∝ (a / v)². Without the dark
   cloth, daylight on the tracing paper washes the faint picture out.
   The tree sways, clouds drift and a bird flies — their images move the
   opposite way. The inner box slides on a spring.
   ===================================================================== */
function buildA10(){
  const OBJ={friend:{n:'Friend',d:6,h:1.5,x:-0.3,col:COL.red},tree:{n:'Tree',d:20,h:7,x:2.4,col:COL.green},house:{n:'Building',d:50,h:15,x:-7.5,col:COL.yellow}};
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Slide the inner box (v) <span class="val" id="vv">8 cm</span></label><input type="range" id="v" min="5" max="24" step="0.5" value="8">
      <label style="margin-top:6px">Pinhole size <span class="val" id="av">1 mm</span></label><input type="range" id="a" min="0.3" max="6" step="0.1" value="1"></div>
    <div class="control-group"><label>Trace rays from</label><div class="toggle-group" id="obj">${Object.keys(OBJ).map((k,i)=>`<button class="toggle-btn small${i===1?' active':''}" data-k="${k}">${OBJ[k].n}</button>`).join('')}</div>
      <div class="toggle-group"><button class="toggle-btn active" id="cloth">🧥 Dark cloth over head</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Image height',COL.red)}${card('k2','Fits on the paper?',COL.green)}${card('k3','Way up',COL.red)}${card('k4','Brightness',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX=432, AY=368, KC=5, PAPER=5.5, CAMH=1.3, LP={friend:100,tree:190,house:272};
  let t=0, v=8, a=1, sel='tree', cloth=true, V={x:8,v:0}, bird=-0.7;
  $('#v').oninput=e=>{ v=+e.target.value; $('#vv').textContent=v+' cm'; };
  $('#a').oninput=e=>{ a=+e.target.value; $('#av').textContent=fmt(a,1)+' mm'; };
  chipsWire(wrap,'#obj .toggle-btn',b=>sel=b.dataset.k);
  $('#cloth').onclick=()=>{ cloth=!cloth; $('#cloth').classList.toggle('active',cloth); };
  const P=224, pxcm=P/PAPER, face=document.createElement('canvas'); face.width=P; face.height=P; const fctx=face.getContext('2d');
  // the whole outdoor scene in ANGLE space (radians; x right, y up → canvas y = −θy)
  function scene(c,px,tt){ const lw=1.6/px;
    c.fillStyle='#bfe0f7'; c.fillRect(-2,-2,4,2); c.fillStyle='#cfe3b4'; c.fillRect(-2,0,4,2);
    // clouds + bird
    [[-0.35,0.3],[0.2,0.38],[0.55,0.26]].forEach((q,i)=>{ const x=q[0]+((tt*0.006+i*0.3)%1.4)-0.5; c.fillStyle='#fff'; c.beginPath(); c.ellipse(x,-q[1],0.07,0.025,0,0,Math.PI*2); c.ellipse(x+0.05,-q[1]-0.015,0.05,0.022,0,0,Math.PI*2); c.fill(); });
    c.strokeStyle='#223'; c.lineWidth=lw*1.3; const fl=Math.sin(tt*9)*0.012; c.beginPath(); c.moveTo(bird-0.025,-0.19+fl); c.quadraticCurveTo(bird-0.012,-0.2,bird,-0.19); c.quadraticCurveTo(bird+0.012,-0.2,bird+0.025,-0.19+fl); c.stroke();
    // building (50 m)
    { const o=OBJ.house, b=-CAMH/o.d, x0=(o.x-10)/o.d, x1=(o.x+10)/o.d, top=b+o.h/o.d; c.fillStyle='#f3dc8a'; c.fillRect(x0,-top,x1-x0,top-b); c.strokeStyle='#8a6a10'; c.lineWidth=lw; c.strokeRect(x0,-top,x1-x0,top-b);
      c.fillStyle='#6d8fb3'; for(let r=0;r<4;r++) for(let k=0;k<5;k++) c.fillRect(x0+(k+0.5)*(x1-x0)/5-0.012,-top+(r+0.5)*(top-b)/4.5-0.012,0.024,0.026); }
    // tree (20 m) — its crown sways
    { const o=OBJ.tree, b=-CAMH/o.d, x=o.x/o.d, s=1/o.d, sw=Math.sin(tt*1.3)*0.012+Math.sin(tt*3.1)*0.004; c.fillStyle='#8a5a36'; c.fillRect(x-0.25*s,-(b+3.2*s),0.5*s,3.2*s);
      c.fillStyle='#3e9b4f'; c.strokeStyle='#1f5e2c'; c.lineWidth=lw; [[0,4.9,2.3],[-1.2,4.2,1.6],[1.2,4.3,1.6],[0,6.1,1.5]].forEach(q=>{ c.beginPath(); c.arc(x+q[0]*s+sw*q[1]/6,-(b+q[1]*s),q[2]*s,0,Math.PI*2); c.fill(); c.stroke(); });
      c.fillStyle=COL.red; [[0.6,4.4],[-0.7,5.3],[0.2,6.0]].forEach(q=>{ c.beginPath(); c.arc(x+q[0]*s+sw*q[1]/6,-(b+q[1]*s),0.18*s,0,Math.PI*2); c.fill(); }); }
    // friend (6 m) in a red shirt, waving
    { const o=OBJ.friend, b=-CAMH/o.d, x=o.x/o.d, s=1/o.d; c.lineCap='round'; c.strokeStyle='#223'; c.lineWidth=0.09*s;
      c.beginPath(); c.moveTo(x-0.1*s,-b); c.lineTo(x,-(b+0.75*s)); c.lineTo(x+0.1*s,-b); c.stroke();
      c.fillStyle=COL.red; c.fillRect(x-0.18*s,-(b+1.28*s),0.36*s,0.55*s); c.fillStyle='#f1c9a5'; c.beginPath(); c.arc(x,-(b+1.4*s),0.11*s,0,Math.PI*2); c.fill();
      const wv=Math.sin(tt*6)*0.5; c.strokeStyle=COL.red; c.lineWidth=0.08*s; c.beginPath(); c.moveTo(x+0.17*s,-(b+1.2*s)); c.lineTo(x+(0.17+0.4*Math.sin(1.2+wv))*s,-(b+(1.2+0.4*Math.cos(1.2+wv))*s)); c.stroke(); }
  }
  function sideObj(ctx,k,tt){ const o=OBJ[k], L=LP[k], s=L/o.d, x=PX-L, base=AY+CAMH*s, top=base-o.h*s;
    if(k==='house'){ rect(ctx,x-6*s,top,12*s,o.h*s,COL.ink,'#fdf3cf',2); for(let r=0;r<4;r++) line(ctx,x-5*s,top+(r+0.6)*o.h*s/4.5,x+5*s,top+(r+0.6)*o.h*s/4.5,COL.mid,1); }
    if(k==='tree'){ const sw=Math.sin(tt*1.3)*4; line(ctx,x,base,x,base-3.2*s,'#8a5a36',4); circ(ctx,x+sw,base-4.9*s,2.2*s,COL.green,'#e3f3e6',2.4); circ(ctx,x-1.1*s+sw*0.8,base-4.2*s,1.5*s,COL.green,'#e3f3e6',2); circ(ctx,x+1.1*s+sw*0.8,base-4.3*s,1.5*s,COL.green,'#e3f3e6',2); }
    if(k==='friend'){ ctx.save(); teen(ctx,x,base,o.h*s,{sex:'b',m:0.3,pose:{sR:2.4+Math.sin(tt*6)*0.4,eR:0.3},mood:0.8}); ctx.restore(); }
    textAt(ctx,o.n+' · '+o.d+' m',x,base+16,{align:'center',size:10.5,weight:700,color:o.col});
    return {x,top,base}; }

  animLoop(dt=>{ t+=dt; bird+=dt*0.05; if(bird>0.8) bird=-0.8;
    V.v+=((v-V.x)*18-V.v*6)*dt; V.x+=V.v*dt; const vv=V.x;
    const acm=a/10, u=OBJ[sel].d*100, lam=5.5e-5, blur=Math.hypot(acm*(1+vv/u),2.44*lam*vv/acm), B=clamp(Math.pow(a/vv,2)*80,0,1.5), amb=cloth?0.04:0.55;
    const O=OBJ[sel], imgH=O.h/O.d*vv;

    // ---------- tracing paper (face on) ----------
    fctx.setTransform(1,0,0,1,0,0); fctx.filter='none'; fctx.globalAlpha=1; fctx.fillStyle='#0e141d'; fctx.fillRect(0,0,P,P);
    fctx.save(); fctx.filter=blur*pxcm>1?'blur('+(blur*pxcm*0.28).toFixed(1)+'px)':'none'; fctx.globalAlpha=1-Math.exp(-2.2*B);
    fctx.translate(P/2,P/2); fctx.scale(-vv*pxcm,-vv*pxcm); scene(fctx,vv*pxcm,t); fctx.restore(); fctx.filter='none';
    fctx.fillStyle=`rgba(236,232,220,${amb})`; fctx.fillRect(0,0,P,P);

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,500]);
    ctx.save(); ctx.translate(402,352); ctx.scale(1.25,1.25); ctx.translate(-PX,-AY);          // side view, enlarged about the pinhole
    // sky + ground in angle space for the side view
    ctx.fillStyle='#eef6fd'; ctx.fillRect(PX-LP.house-20,AY-110,LP.house+20,110);
    // ground: bases of objects at every distance lie at angle −1.3/d → a curve rising to the horizon
    ctx.save(); ctx.beginPath(); const gpts=[[PX-8,AY+40],[PX-LP.friend,AY+CAMH*LP.friend/6],[PX-LP.tree,AY+CAMH*LP.tree/20],[PX-LP.house,AY+CAMH*LP.house/50],[PX-LP.house-16,AY+7]];
    ctx.moveTo(gpts[0][0],gpts[0][1]); gpts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1])); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    line(ctx,PX-LP.house-16,AY,PX,AY,COL.mid,1,[3,5]); textAt(ctx,'horizon',PX-LP.house-12,AY-4,{size:10,weight:600,color:COL.mid});
    const S={}; ['house','tree','friend'].forEach(k=>S[k]=sideObj(ctx,k,t));
    sunDraw(ctx,PX-LP.tree-40,AY-92,11,t,0.9);
    // the camera (cut open): outer box with pinhole, inner box with tracing paper
    const scrX=PX+vv*KC, oL=130, iL=110;
    rect(ctx,PX,AY-40,oL,80,COL.ink,'#f7f1e6',2.6); rect(ctx,scrX,AY-33,iL,66,COL.ink,'#fbf8f1',2.2);
    line(ctx,scrX,AY-33,scrX,AY+33,COL.green,4); textAt(ctx,'tracing paper',scrX,AY+52,{align:'center',size:10.5,weight:700,color:COL.green});
    ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(PX-3,AY-2,6,4); ctx.restore(); textAt(ctx,'pinhole',PX,AY-48,{align:'center',size:10.5,weight:700,color:COL.ink});
    if(!cloth) textAt(ctx,'open side',scrX+iL-4,AY-40,{align:'right',size:10,weight:600,color:COL.muted});
    // rays from the chosen object's top and base, through the pinhole, onto the paper
    const o=S[sel], topY=o.top, baseY=o.base, ox=o.x;
    [[topY,COL.yellow],[baseY,COL.yellow]].forEach(([y,c])=>{ const k=(scrX-PX)/(PX-ox), yi=AY+(AY-y)*k; rayPath(ctx,[{x:ox,y},{x:PX,y:AY},{x:scrX,y:yi}],c,t,0.8,1.5,{dashes:[8,7],at:0.45}); });
    const yiT=AY+(AY-topY)*(scrX-PX)/(PX-ox), yiB=AY+(AY-baseY)*(scrX-PX)/(PX-ox); line(ctx,scrX+3,yiB,scrX+3,yiT,COL.red,4); arrowHead(ctx,scrX+3,yiT,Math.PI/2,COL.red,8);
    // you, looking in at the open side, under a dark cloth
    const ex=scrX+iL+24; eyeSide(ctx,ex,AY-6,Math.PI,1.4,COL.ink); circ(ctx,ex+26,AY-2,34,COL.ink,null,2.2);
    if(cloth){ fillPoly(ctx,[{x:scrX+iL-40,y:AY-40},{x:ex+10,y:AY-60},{x:ex+60,y:AY-40},{x:ex+74,y:AY+40},{x:ex+20,y:AY+64},{x:scrX+iL-40,y:AY+40}],'rgba(22,30,44,0.78)',COL.ink,2); textAt(ctx,'dark cloth',ex+30,AY+84,{align:'center',size:10.5,weight:700,color:COL.ink}); }
    ctx.restore();
    // ---------- the picture on the tracing paper ----------
    const fx=566, fy=12; panelFrame(ctx,fx-4,fy,P+8,P+8,'On the tracing paper',COL.green,true); ctx.save(); rrect(ctx,fx,fy+4,P,P,6); ctx.clip(); ctx.drawImage(face,fx,fy+4); ctx.restore();
    textAt(ctx,'5.5 cm × 5.5 cm window',fx+P/2,fy+P+28,{align:'center',size:10.5,weight:600,color:COL.muted});
    ctx.restore();

    // ---------- side ----------
    const fits=imgH<=PAPER*0.95; setv($,'k1',O.n+' '+fmt(imgH,1)+' cm'); setv($,'k2',fits?'Yes':'Too big — slide in'); setc($,'k2',fits?COL.green:COL.red);
    setv($,'k3','upside down'); setv($,'k4',Math.round(clamp(B,0,1)*100)+' %');
    const m=!cloth?['warn','Without the cloth, daylight falls on the tracing paper and the faint picture is washed out.']:a>3.5?['warn','A big pinhole: brighter, but every point spreads into a '+fmt(blur*10,1)+' mm blur.']:a<0.5?['warn','A very tiny hole: sharp-ish but very dim (and light starts to spread out).']:!fits?['warn','The '+O.n.toLowerCase()+'’s image is taller than the paper — slide the inner box forward.']:['ok','Full colour, but upside down and left–right swapped. Watch the bird fly the “wrong” way.'];
    const ob=$('#obs'); if(ob.textContent!==m[1]){ ob.textContent=m[1]; ob.className='fb '+m[0]; }
  });
  return wrap;
}

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();

  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
