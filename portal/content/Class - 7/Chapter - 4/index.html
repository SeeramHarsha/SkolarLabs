<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 4: THE WORLD OF METALS AND NON-METALS
   Activities 4.1 – 4.8 (NCERT Curiosity, gecu104). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. The
   hammer swings under a real torque and rebounds; metal flattens by
   plastic work (volume kept), sulfur and coal shatter into pieces that
   fly on real arcs; dropped objects ring for as long as their damping
   allows; heat creeps up a spoon by the fin equation; rust grows only
   where water and oxygen meet; oxides are tested with pH-true litmus.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. CHAPTER-3 HELPERS — virtual stage, circuit engine (cells, a
       filament that really heats and cools, an LED with a real knee
       voltage), current that flows along the actual wires, and the
       line-drawn components: cell, lamp, LED, switch, holders, wires
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}

/* =====================================================================

   25 % conducted into the thick support wires. The real time constant
   (≈ 0.05 s) is stretched to 0.25 s so the warm-up and the after-glow
   are watchable: it turns dull red → orange → yellow-white, and fades

  for(let i=0;i<n;i++){ const R=lampR(L); I=L.broken?0:Math.abs(E)/(r+R); const P=I*I*R;
    L.T+=(P-L.k*(L.T**4-300**4)-L.g*(L.T-300))/L.C*h; L.T=Math.max(300,L.T); }

/* =====================================================================
   CHEMISTRY ENGINE
   A mixture = { V (mL), sb (mmol strong cation: Na⁺, ½Ca²⁺ …),
                 sa (mmol strong anion: Cl⁻ …), sys:{ acid-key: mmol } }.
   Every weak acid system is stored in its fully protonated form; salts
   like NaHCO₃ = H₂CO₃ + Na⁺. pH is found from the charge balance
     [H⁺] + sb/V = [OH⁻] + sa/V + Σ C·(mean negative charge of the acid)
   by bisection — exact for any mix, so indicators never need a fake
   “if acid then red” rule: colour follows the real pH.
   ===================================================================== */
const ACID = {
  cit:[3.13,4.76,6.40],  // citric (lemon, amla, tomato)
  asc:[4.10,11.6],       // ascorbic — vitamin C (amla)
  tar:[2.98,4.34],       // tartaric (tamarind)
  ace:[4.76],            // acetic (vinegar)
  lac:[3.86],            // lactic (curd)
  oxa:[1.25,4.14],       // oxalic (tomato)
  car:[6.35,10.33],      // carbonic (baking soda, washing soda, tap water)
  fat:[8.5],             // fatty acid of soap (in micelles)
  ext:[4.5],             // plant acids in the rose extract

function mixNew(){ return {V:0, sb:0, sa:0, sys:{}}; }

/* =====================================================================

   The hammer is a rigid arm pivoting at the wrist: θ̈ = α(F) + g-term, so
   it speeds up all the way down. At contact its energy E = ½Iω² goes
   into the piece:
   • metals flow plastically — plastic work W = Y·A·ln(h₀/h), so each blow
     thins it by h₁ = h·e^(−E/(Y·A)); the area in view is kept, so the
     piece spreads. Soft Al flattens fastest, then Cu, then the iron nail.
     The hammer bounces back only a little (e ≈ 0.2) — the energy stayed.
   • sulfur and coal are brittle — above their fracture energy the lump
     splits into slices that fly on real projectile arcs and bounce.
   • wood is springy — it dents, springs back, and the hammer rebounds.
   A torch sweeps across: only lustrous (metal) surfaces throw a glint.

      ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,-34,-10,52,20,4); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(18,-10); ctx.lineTo(30,-15); ctx.lineTo(30,15); ctx.lineTo(18,10); ctx.closePath(); ctx.fill(); ctx.stroke(); line(ctx,30,-15,30,15,COL.yellow,3); ctx.restore(); }

        rrect(ctx,x0-2,AT-Math.max(hh+8,hd*1.9),12,Math.max(hh+8,hd*1.9),2); ctx.fill(); ctx.stroke(); }
      else { rrect(ctx,x0,y0,ww,hh,Math.min(8,hh/2)); ctx.fill(); ctx.stroke(); }

/* =====================================================================
   4.2 DROP AND LISTEN — sonority
   Free fall from the height you set (1 m = 300 px, g = 9.8 m/s², real
   time), bounce with the object's restitution e. Each impact excites the
   object's vibration A(t) = A₀·e^(−t/τ): metal has tiny internal damping
   (τ ≈ 1 s → it RINGS), coal and wood have huge damping (τ ≈ 0.03 s →
   a dull thud). The same A(t) drives what you see (shaking, sound rings
   spreading out, the microphone trace) and what you hear: metal = a few
   inharmonic partials decaying slowly; coal/wood = a short filtered knock.
   ===================================================================== */
const OBJ42=[
  {k:'spoon', n:'Metal spoon', metal:true,  e:0.38, tau:1.3,  f:[1480,2710,4260], L:74},
  {k:'coin',  n:'Coin',        metal:true,  e:0.42, tau:0.9,  f:[3950,6420,9120], L:26},
  {k:'plate', n:'Steel plate', metal:true,  e:0.30, tau:1.8,  f:[620,1330,2260],  L:90},
  {k:'coal',  n:'Coal',        metal:false, e:0.12, tau:0.025,f:[260],            L:32},
  {k:'wood',  n:'Wood block',  metal:false, e:0.30, tau:0.04, f:[190],            L:52},
];
let AC42=null;
function audio42(){ try{ if(!AC42) AC42=new (window.AudioContext||window.webkitAudioContext)(); if(AC42.state==='suspended') AC42.resume(); }catch(e){ AC42=null; } return AC42; }
function sound42(o,amp){
  const ac=AC42; if(!ac||amp<0.02) return; const t0=ac.currentTime+0.005, out=ac.createGain(); out.gain.value=0.5*Math.min(1,amp); out.connect(ac.destination);
  if(o.metal){ o.f.forEach((f,i)=>{ const os=ac.createOscillator(), g=ac.createGain(); os.type='sine'; os.frequency.value=f; const tau=o.tau/(1+i*0.8), a=[1,0.5,0.3][i]||0.2;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(a*0.4,t0+0.003); g.gain.setTargetAtTime(0,t0+0.003,tau); os.connect(g); g.connect(out); os.start(t0); os.stop(t0+tau*6+0.1); }); }
  else { const n=Math.floor(ac.sampleRate*0.25), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/ac.sampleRate/o.tau);
    const src=ac.createBufferSource(); src.buffer=buf; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=o.k==='coal'?900:600;
    const os=ac.createOscillator(), g=ac.createGain(); os.frequency.value=o.f[0]; g.gain.setValueAtTime(0.7,t0); g.gain.setTargetAtTime(0,t0,o.tau*1.3); os.connect(g); g.connect(out); os.start(t0); os.stop(t0+0.3);
    src.connect(lp); lp.connect(out); src.start(t0); }
}
function drawObj42(ctx,o,x,y,tilt,vib,t){ // (x,y) = centre of the resting object's bottom contact
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt); ctx.scale(1.4,1.4); ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle=o.metal?COL.blue:COL.ink; ctx.fillStyle='#fff';
  const s=Math.sin(t*2*Math.PI*14)*vib;
  switch(o.k){
    case 'spoon': { ctx.beginPath(); ctx.ellipse(46,-10,28,10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(20,-12); ctx.quadraticCurveTo(-20,-12-s*6,-82,-8-s*14); ctx.lineTo(-82,-1-s*14); ctx.quadraticCurveTo(-20,-4-s*6,20,-7); ctx.closePath(); ctx.fill(); ctx.stroke(); break; }
    case 'coin': { ctx.beginPath(); ctx.ellipse(0,-6+s*2,26,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(0,-6+s*2,19,4,0,0,Math.PI*2); ctx.lineWidth=1.2; ctx.stroke(); break; }

/* =====================================================================
   4.3 TWO SPOONS IN HOT WATER — conduction of heat
   Each spoon is a 15 cm fin cut into 31 slices. Every slice obeys
     ρc·A·∂T/∂t = k·A·∂²T/∂x² − h·P·(T − T_around)
   with h = 300 W/m²K where it sits in water (T_around = water) and
   h = 10 W/m²K in air (25 °C). Water cools by Newton's law (τ = 20 min).
   Real material data: steel k 16, aluminium 205, copper 385, wood 0.15
   W/m·K. Real time is compressed 60× (1 s on screen = 1 minute), so
   “a few minutes” takes a few seconds. After ~8 min the top of a steel
   spoon is ≈ 31 °C, aluminium ≈ 55 °C, copper ≈ 60 °C — wood stays 25 °C.
   ===================================================================== */
const SPOON43={
  steel:{n:'Steel', k:16,  rc:3.9e6,  A:3.6e-5, P:0.030},
  al:   {n:'Aluminium', k:205, rc:2.43e6, A:3.6e-5, P:0.030},
  cu:   {n:'Copper', k:385, rc:3.45e6, A:3.6e-5, P:0.030},
  wood: {n:'Wood', k:0.15, rc:0.85e6, A:5e-5, P:0.033},

const HEAT_RAMP=[[25,'#cfe3f7'],[32,'#f5e2a0'],[42,'#f2b12a'],[55,'#ef7d1f'],[75,'#d9432b']];
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Metal spoon made of</label><div class="toggle-group" id="met"><button class="toggle-btn active" data-k="steel">Steel</button><button class="toggle-btn" data-k="al">Aluminium</button><button class="toggle-btn" data-k="cu">Copper</button></div></div>
    <div class="control-group"><label>Hot water <span class="val" id="twv">80 °C</span></label><input type="range" id="TW" min="50" max="90" step="5" value="80">
      <div class="toggle-group"><button class="toggle-btn play" id="dip">⬇ Dip both spoons</button><button class="toggle-btn" id="touch">✋ Touch top ends</button></div>
      <div class="toggle-group"><button class="toggle-btn active" id="therm">Heat colours on</button><button class="toggle-btn" id="reset">↺ Fresh start</button></div>
      <div class="hint">1 second here = 1 minute in real life</div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Time in water')}${card('k2','Water')}${card('k3','Top of metal spoon',COL.blue)}${card('k4','Top of wooden spoon')}</div></div>
    <div class="control-group"><div class="result-cards">${card('k5','Which gets hotter?')}${card('k6','Metal is a…')}</div></div>`;

  const mk=(key,bx,side)=>({key,bx,side,T:new Array(N).fill(25),flux:0,dots:[]});
  let sp=[mk('steel',336,-1), mk('wood',384,1)];
  const lift=spr(-190), fL={x:spr(-160),v:0}, fR={x:spr(-160)};
  const reset=()=>{ sp=[mk(metal,336,-1),mk('wood',384,1)]; Tw=Tw0; time=0; dipped=false; hist=[]; touching=false; $('#dip').textContent='⬇ Dip both spoons'; $('#touch').classList.remove('active'); };

      const P0=nodePos(s,0,lift.x), P1=nodePos(s,N-1,lift.x), ux=(P1.x-P0.x)/Math.hypot(P1.x-P0.x,P1.y-P0.y), uy=(P1.y-P0.y)/Math.hypot(P1.x-P0.x,P1.y-P0.y), nx=-uy, ny=ux;
      const hw=i=>isM?(i<7?0:5.5):(i<7?0:8);
      // segments coloured by temperature

        ctx.beginPath(); ctx.moveTo(a.x+nx*wd,a.y+ny*wd); ctx.lineTo(b.x+nx*wd,b.y+ny*wd); ctx.lineTo(b.x-nx*wd,b.y-ny*wd); ctx.lineTo(a.x-nx*wd,a.y-ny*wd); ctx.closePath();

    const tops=[];

    steam(ctx,TCX,TTOP-6,RT*1.2,clamp((Tw-40)/40,0,1),t);

/* =====================================================================
   4.4 THE TESTER — conduction of electricity
   The tester of Chapter 3: one cell, a lamp, two free probe ends. Each

/* =====================================================================
   4.5 THREE BOTTLES, THREE NAILS — what makes iron rust?
   The nail is cut into 24 slices; each slice rusts at
     dc/dt = k · [O₂ reaching it] · [water on it] · (1 − c)
   A: silica gel pulls the trapped air's humidity from 60 % down to ~5 %
      (τ ≈ 6 h). Below ~60 % RH no water film forms on iron → no rust.
   B: boiled water holds almost no O₂ and the oil layer lets almost none
      back in (O₂ ≈ 2 % of saturation) → no visible rust.
   C: open to air, partly in water — O₂ keeps dissolving, and the zone
      at the waterline (water AND air together) rusts fastest.
   1 day passes every 1.5 s. The air/water molecules you see are the
   same story in motion: vapour caught by the gel in A, oxygen bouncing
   off the oil in B, oxygen dissolving and reaching the nail in C.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();

    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="play">▶ Let the days pass</button><button class="toggle-btn" id="reset">↺ Day 0</button></div>

    <div class="control-group"><label>Nail in bottle C</label><div class="toggle-group" id="cv"><button class="toggle-btn small active" data-v="bare">Bare</button><button class="toggle-btn small" data-v="paint">Painted</button><button class="toggle-btn small" data-v="grease">Greased</button><button class="toggle-btn small" data-v="salt">Salt water</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('kd','Day')}${card('ka','A rust')}${card('kb','B rust')}</div><div class="result-cards" style="margin-top:6px">${card('kc','C rust',COL.red)}${card('kw','Rust needs')}</div></div>
    <div class="control-group"><label>Table 4.3</label><table class="log"><thead><tr><th></th><th>Water</th><th>Air</th><th>Observation</th></tr></thead><tbody id="lg">
      <tr><td><b>A</b></td><td>No</td><td>Yes</td><td id="oa">—</td></tr><tr><td><b>B</b></td><td>Yes</td><td>No</td><td id="ob">—</td></tr><tr><td><b>C</b></td><td>Yes</td><td>Yes</td><td id="oc">—</td></tr></tbody></table></div>`;

      const mean=cov[b].reduce((a,v)=>a+v,0)/NS; if(day>0.2) tag(ctx,mean>0.08?'rust!':'no rust',cx+HW-8,TOPB+20,mean>0.08?COL.red:COL.green,{size:12,align:'right'});
    });

     little: saturated solution has [OH⁻] = 2·(Ksp/4)^⅓ → pH ≈ 10.4.

/* =====================================================================
   4.7 BURNING SULFUR (demonstration)
   1 Heat — the sulfur in the deflagrating spoon warms toward the flame
     (τ = 1.2 s); it melts at 115 °C (yellow → dark orange liquid) and
     catches fire at ~250 °C with its real, pale BLUE flame.
   2 Into the gas jar, lid on — S + O₂ → SO₂. One O₂ molecule becomes one
     SO₂ molecule (watch the dots change colour, their number stays the
     same). The burn rate falls with the oxygen left, dx/dt = −k(x − 0.10);
     the flame dies near 13 % O₂. 500 mL jar → ≈ 1.5 mmol SO₂. Time is
     compressed 30× (≈ 3–4 minutes of burning, as in the book).
   3 Water, lid, shake — the jar rocks as a damped pendulum; SO₂ molecules
     that meet the water dissolve: SO₂ + H₂O → H₂SO₃ (sulfurous acid).
   4 Litmus — pH comes from the dissolved SO₂ in 20 mL of water through
     the charge balance (pKa 1.86, 7.2): ≈ pH 1.6 → blue turns red.
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="step-row" id="steps"></div>
      <button class="toggle-btn navy" id="act">Heat the sulfur</button>
      <button class="toggle-btn navy hidden" id="act2" style="background:#fff;color:var(--navy-2)">Dip red litmus</button>
      <div class="hint" id="hint"></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Sulfur')}${card('k2','Oxygen in jar')}${card('k3','SO₂ made',COL.red)}${card('k4','Time in jar')}</div></div>
    <div class="control-group"><div class="result-cards">${card('k5','Blue litmus')}${card('k6','Red litmus')}${card('k8','Solution pH')}${card('k7','Sulfur dioxide is',COL.red)}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');

    if(water>0){ ctx.fillStyle=mixCol('#e4f0fb','#f6d7d0',clamp(so2N0?dissolvedN/so2N0:0,0,1)); ctx.beginPath(); ctx.moveTo(JX-JW,surf+tilt.x*14); ctx.lineTo(JX+JW,surf-tilt.x*14); ctx.lineTo(JX+JW,JB); ctx.lineTo(JX-JW,JB); ctx.closePath(); ctx.fill(); line(ctx,JX-JW,surf+tilt.x*14,JX+JW,surf-tilt.x*14,COL.blue,1.8); }
    dots.forEach(d=>{ if(d.type==='n2') circ(ctx,d.x,d.y,2,COL.mid,COL.mid,1);
      else if(d.type==='o2'){ circ(ctx,d.x-2.2,d.y,2.5,COL.ink,'#fff',1.3); circ(ctx,d.x+2.2,d.y,2.5,COL.ink,'#fff',1.3); }

/* =====================================================================
   4.8 SULFUR IN WATER
   160 real-sized sulfur grains (radius 10–80 µm, density 2.07 g/cm³).
   • Poured in, they fall and heap up at the bottom.
   • When water arrives, water does not wet sulfur: the finest grains are
     carried up and float on the surface film.
   • Everything else sinks at its Stokes speed  v = 2Δρ·g·r²/(9μ)
     (≈ 6 mm/s for r = 50 µm, ≈ 1 mm/s for 20 µm; shown 5× faster).
   • Stirring spins the water (Ω decays with τ ≈ 3 s), wets some floaters
     and lifts grains, which then settle again by Stokes' law.
   Nothing dissolves (grain count never changes), no gas, no heat, and
   litmus does not change: sulfur does not react with water.
   Compare: magnesium oxide in water turns into Mg(OH)₂, part of it
   dissolves and red litmus turns blue (pH ≈ 10.4).
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="b1">1 · Add sulfur powder</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="b2">2 · Add water</button><button class="toggle-btn" id="b3">3 · Stir</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="b4">4 · Dip litmus strips</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="cmp">Compare: MgO in water</button><button class="toggle-btn" id="rs">↺ Empty</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Sulfur grains')}${card('k2','Dissolves?')}${card('k3','Bubbles / heat')}${card('k4','Litmus')}</div>
      <div class="result-cards" style="margin-top:6px">${card('k5','Sulfur + water',COL.red)}${card('k6','MgO + water',COL.blue)}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TOP=170, BOT=440, RT=100, RB=80, WSURF=250, NG=160, PXM=1900, TS=5;
  let cmp=false, t=0;
  const mkT=(cx,kind)=>({cx,kind,grains:[],waterH:0,waterT:0,omega:0,pour:null,stir:0,strips:[{c:LIT_RED_P,x:cx-28,dip:spr(0),wet:0,conv:0},{c:LIT_BLUE_P,x:cx+28,dip:spr(0),wet:0,conv:0}],dipOn:false,dis:0,added:false});
  let T=[mkT(270,'s'),mkT(590,'mgo')];
  const reset=()=>{ T=[mkT(cmp?270:400,'s'),mkT(590,'mgo')]; };
  reset();
  const tubs=()=>cmp?T:[T[0]];
  $('#cmp').onclick=()=>{ cmp=!cmp; $('#cmp').classList.toggle('active',cmp); reset(); };
  $('#rs').onclick=reset;
  $('#b1').onclick=()=>tubs().forEach(tb=>{ if(tb.added) return; tb.added=true; const r=rng(tb.cx);
    for(let i=0;i<NG;i++){ const um=10+70*Math.pow(r(),1.6); tb.grains.push({x:tb.cx-10+(r()-0.5)*14,y:TOP-60-i*1.2,vx:(r()-0.5)*40,vy:0,um,state:'fall',ph:r()*6.28,rad:r(),gone:false}); } });
  $('#b2').onclick=()=>tubs().forEach(tb=>{ if(tb.waterT) return; tb.waterT=1; tb.pour=2.2; });
  $('#b3').onclick=()=>tubs().forEach(tb=>{ if(tb.waterH<0.5) return; tb.stir=3; });
  $('#b4').onclick=()=>tubs().forEach(tb=>{ if(tb.waterH<0.5) return; tb.dipOn=!tb.dipOn; });
  const pH=k=>k==='s'?7.0:mixPH({V:1,sb:MGOH_SAT,sa:0,sys:{}});

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    ctx.save(); ctx.translate(400,320); ctx.scale(1.12,1.12); ctx.translate(-430,-330);   // camera
    tableTop(ctx,-50,900,BOT,0);
    tubs().forEach(tb=>{ const cx=tb.cx;
      tb.waterH=approach(tb.waterH,tb.waterT,tb.pour>0?0.9:3,dt); if(tb.pour>0) tb.pour-=dt;
      const surf=BOT-(BOT-WSURF)*tb.waterH, wet=tb.waterH>0.02;
      if(tb.stir>0){ tb.stir-=dt; tb.omega=approach(tb.omega,9,6,dt); } else tb.omega*=Math.exp(-dt/3);
      if(tb.kind==='mgo' && wet) tb.dis=Math.min(1,tb.dis+dt*(0.03+0.25*clamp(tb.omega/9,0,1)));
      // ---- grains ----
      const floorY=x=>BOT-4, [l0,r0]=[cx-RB+6,cx+RB-6];
      tb.grains.forEach((g,i)=>{ if(g.gone) return; const rad=g.um*1e-6;
        if(tb.kind==='mgo' && g.rad<tb.dis*0.55){ g.gone=true; return; }        // part of the MgO dissolves
        const inW=wet&&g.y>surf-2;

        else if(g.state==='float'){ g.y=surf-1.2; g.ph+=tb.omega*dt*(0.6+g.rad); g.x=cx+Math.cos(g.ph)*(RT*0.8)*(0.3+0.7*g.rad);
          if(tb.omega>3 && Math.random()<dt*0.5) g.state='sink'; }
        else { // sink or rest in water
          if(g.state==='rest' && wet && tb.kind==='s' && g.um<22 && tb.pour>0 && Math.random()<dt*2.5){ g.state='rise'; }
          if(g.state==='rise'){ g.y-=90*dt; if(g.y<=surf){ g.state='float'; g.ph=Math.acos(clamp((g.x-cx)/(RT*0.8),-1,1)); } return; }
          if(inW){ const v=2*1070*9.8*rad*rad/(9e-3)*PXM*TS;       // Stokes, px/s
            if(tb.omega>1.5){ g.ph+=tb.omega*dt*(0.5+g.rad*0.8); const R=(RB-12)*(0.2+0.8*g.rad); g.x=lerp(g.x,cx+Math.cos(g.ph)*R,clamp(tb.omega/5,0,1)); if(g.state==='rest'&&Math.random()<dt*tb.omega*0.12){ g.state='sink'; g.y-=20+Math.random()*80*(tb.omega/9); } }
            if(g.state==='sink'){ g.y+=v*dt; const fy=floorY()-heap(g); if(g.y>=fy){ g.y=fy; g.state='rest'; } } }
          else if(g.state==='sink'){ g.vy+=1500*dt; g.y+=g.vy*dt; if(g.y>=floorY()-heap(g)){ g.y=floorY()-heap(g); g.state='rest'; } } }
        g.x=clamp(g.x,l0,r0); });
      function heap(g){ const d=(g.x-(cx-10))/70; return Math.max(0,30*(1-d*d))*(tb.kind==='mgo'?1-tb.dis*0.55:1)*(0.6+0.4*g.rad); }
      // ---- strips ----
      tb.strips.forEach(s=>{ springTo(s.dip,tb.dipOn?1:0,40,9,dt); if(s.dip.x>0.9&&wet){ s.wet=Math.min(0.6,s.wet+dt*0.3/Math.max(0.15,s.wet)); s.conv=Math.min(1,s.conv+dt*1.1); } });
      // ---- draw ----
      const liq=tb.kind==='mgo'?mixCol('#e4f0fb','#f3f5f7',tb.dis):'#e4f0fb';
      const wob=tb.omega>0.5?Math.sin(t*6)*tb.omega*0.4:0;
      tumbler(ctx,cx,TOP,BOT,RT,RB,{level:wet?surf-(tb.omega*0.6):undefined,liq,wob,inside:()=>{
        tb.grains.forEach(g=>{ if(g.gone) return; const r=1.6+g.um/16; ctx.fillStyle=tb.kind==='s'?'#f2dc4a':'#ffffff'; ctx.strokeStyle=tb.kind==='s'?'#a8891a':COL.muted; ctx.lineWidth=0.9; ctx.beginPath(); ctx.arc(g.x,g.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
        if(tb.omega>1) for(let k=0;k<3;k++){ const yy=surf+30+k*50; ctx.save(); ctx.globalAlpha=clamp(tb.omega/9,0,1)*0.5; ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(cx,yy,RB*0.7,8,0,(t*tb.omega*0.3+k)%6.28,(t*tb.omega*0.3+k)%6.28+2.2); ctx.stroke(); ctx.restore(); }
      }});
      // pouring stream from a beaker
      if(tb.pour>0){ const bx=cx+RT+30, by=TOP-70; ctx.save(); ctx.translate(bx,by); ctx.rotate(-1.0); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-30,-50); ctx.lineTo(-30,40); ctx.lineTo(30,40); ctx.lineTo(30,-50); ctx.lineTo(36,-56); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=5; ctx.globalAlpha=0.7; ctx.beginPath(); ctx.moveTo(bx-44,by-26); ctx.quadraticCurveTo(cx+40,by-10,cx+30,surf); ctx.stroke(); ctx.restore(); }
      if(tb.stir>0||tb.omega>1.5){ const rx=cx+Math.cos(t*tb.omega*0.7)*RB*0.5; rod(ctx,rx,BOT-20,rx+40,TOP-70); }
      // plain water has no acid or alkali to shift the paper's own dye
      if(tb.dipOn||tb.strips.some(s=>s.dip.x>0.02)) tb.strips.forEach(s=>{ const y0=TOP-110+s.dip.x*(surf-TOP+110-40); line(ctx,s.x,TOP-150,s.x,y0,COL.mid,1.2); litmusStrip(ctx,s.x,y0,20,64,s.c,s.wet,tb.kind==='s'?s.c:mixCol(s.c,litmusCol(pH(tb.kind)),s.conv)); });
      if(tb.kind==='s' && tb.waterH>0.9) { thermoScale(ctx,cx+RB-6,surf+20,BOT-40,25,0,50,[25]); }
      textAt(ctx,tb.kind==='s'?'Sulfur + water':'Magnesium oxide + water',cx,BOT+30,{align:'center',size:13.5,weight:700,color:tb.kind==='s'?COL.red:COL.blue});
      const floaters=tb.grains.filter(g=>g.state==='float').length;
      if(tb.kind==='s'&&floaters>3) leader(ctx,cx-RT*0.55,surf-2,cx-RT-40,surf-40,'floats: not wetted',COL.red);
      if(tb.kind==='s'&&wet&&tb.pour<=0&&tb.omega<1) tag(ctx,'no reaction',cx,TOP-24,COL.green,{size:13});
    });
    ctx.restore();
    const S=T[0], cnt=S.grains.filter(g=>!g.gone).length, wetS=S.waterH>0.5;
    setv($,'k1',S.added?cnt+' → '+cnt:'—'); setv($,'k2',wetS?'No':'—'); setc($,'k2',COL.red);
    setv($,'k3',wetS?'None':'—'); setv($,'k4',S.strips[0].conv>0.5?'No change':'—'); setc($,'k4',COL.green);
    setv($,'k5',wetS?'No reaction':'—'); setv($,'k6',cmp?(T[1].strips[0].conv>0.5?'Red → blue (basic)':T[1].waterH>0.5?'Partly dissolves':'—'):'(off)');
    ctx.restore();
  });
  return wrap;
}

let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
