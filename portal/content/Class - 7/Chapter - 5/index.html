<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 5: CHANGES AROUND US: PHYSICAL AND CHEMICAL
   Activities 5.1 – 5.8 (NCERT Curiosity, gecu105). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. Ice
   melts at the rate heat flows in, water boils by an energy balance,
   kernels pop at their own temperature and fly on real arcs, paper folds
   by rotating about its creases, balloons follow the rubber's real
   pressure curve, lime water clouds by the amount of CO₂ it really takes
   up, a candle under a tumbler goes out when the oxygen falls to ~16 %,
   and paper under a lens heats, scorches and ignites by a heat balance.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. CHAPTER-3 HELPERS — virtual stage, circuit engine (cells, a
       filament that really heats and cools, an LED with a real knee
       voltage), current that flows along the actual wires, and the
       line-drawn components: cell, lamp, LED, switch, holders, wires
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }

/* =====================================================================

   25 % conducted into the thick support wires. The real time constant
   (≈ 0.05 s) is stretched to 0.25 s so the warm-up and the after-glow
   are watchable: it turns dull red → orange → yellow-white, and fades

  for(let i=0;i<n;i++){ const R=lampR(L); I=L.broken?0:Math.abs(E)/(r+R); const P=I*I*R;
    L.T+=(P-L.k*(L.T**4-300**4)-L.g*(L.T-300))/L.C*h; L.T=Math.max(300,L.T); }

/* =====================================================================
   CHEMISTRY ENGINE
   A mixture = { V (mL), sb (mmol strong cation: Na⁺, ½Ca²⁺ …),
                 sa (mmol strong anion: Cl⁻ …), sys:{ acid-key: mmol } }.
   Every weak acid system is stored in its fully protonated form; salts
   like NaHCO₃ = H₂CO₃ + Na⁺. pH is found from the charge balance
     [H⁺] + sb/V = [OH⁻] + sa/V + Σ C·(mean negative charge of the acid)
   by bisection — exact for any mix, so indicators never need a fake
   “if acid then red” rule: colour follows the real pH.
   ===================================================================== */
const ACID = {
  cit:[3.13,4.76,6.40],  // citric (lemon, amla, tomato)
  asc:[4.10,11.6],       // ascorbic — vitamin C (amla)
  tar:[2.98,4.34],       // tartaric (tamarind)
  ace:[4.76],            // acetic (vinegar)
  lac:[3.86],            // lactic (curd)
  oxa:[1.25,4.14],       // oxalic (tomato)
  car:[6.35,10.33],      // carbonic (baking soda, washing soda, tap water)
  fat:[8.5],             // fatty acid of soap (in micelles)
  ext:[4.5],             // plant acids in the rose extract

function mixNew(){ return {V:0, sb:0, sa:0, sys:{}}; }

/* =====================================================================
   PAPER-FOLDING ENGINE
   The sheet is cut into flat pieces by each crease. A fold rotates the
   pieces on one side of its crease about that line by an angle φ; seen
   from above, a point at distance d from the crease is at d·cos φ — the
   flap visibly foreshortens, stands up edge-on at φ = 90°, and lands
   mirrored at 180°. Unfolding runs the same rotations backwards, so the
   same sheet comes back — with its creases.
   defs: [{a,b, m}] crease a→b (in the frame after the previous folds),
   m = a point on the side that moves.

function affId(){ return [1,0,0,1,0,0]; }

    if(sp>=0) out.push({x:P.x,y:P.y,e:(sp===0&&sq<0)?k:P.e});
    if((sp>0&&sq<0)||(sp<0&&sq>0)){ const u=sp/(sp-sq); out.push({x:P.x+(Q.x-P.x)*u, y:P.y+(Q.y-P.y)*u, e:sp>0?k:P.e}); } }
  return out; }
function foldMake(poly,defs){
  let pcs=[{poly:poly.map(q=>({x:q.x,y:q.y,e:-1})), Ms:[affId()], mv:[], z:[0]}];
  defs.forEach((D,k)=>{
    const nx=[];

/* ---------- 1. MELTING ICE — ds/dt = −κ·T (heat flows in through the

function scIce(){

  S.back=()=>{ if(S.ph===2){ S.ph=3; S.stage=0; } };
  S.step=dt=>{
    if(S.ph===1){ S.T=S.par; let m=0; S.cubes.forEach(c=>{ const ds=K*Math.max(0,S.T)*dt; c.s=Math.max(0,c.s-ds); if(c.s>0) m++;

      if(S.stage===0){ springTo(S.tilt,-0.32,30,9,dt); if(S.tilt.x<-0.25){ const q=Math.min(pud,dt*S0**3*1.1); pud-=q; S.tray+=q; } if(pud<=1){ pud=0; S.stage=1; } }
      else if(S.stage===1){ springTo(S.tilt,0,30,9,dt); S.T=approach(S.T,-12,0.8,dt); if(S.T<-2) S.frz=Math.min(1,S.frz+dt/4); if(S.frz>=1){ S.stage=2; S.fly=0; } }
      else if(S.stage===2){ S.fly=Math.min(1,S.fly+dt/1.1); S.cubes.forEach(c=>c.s=S0); if(S.fly>=1){ S.tray=0; S.ph=4; S.T=approach(S.T,0,1,dt); } }

      for(let i=1;i<3;i++) line(ctx,TX-75+i*50,TY-30,TX-75+i*50,TY-2,COL.ink,1.8);

    ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(400,PY,252,32,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(400,PY,200,22,0,0,Math.PI*2); ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    if(pud>10){ const R=Math.min(236,Math.sqrt(pud/(Math.PI*12))), wob=Math.sin(t*3)*1.2; ctx.save(); ctx.beginPath(); ctx.ellipse(400+clamp(-S.tilt.x/0.32,0,1)*60,PY-2,R+wob,R*0.14,0,0,Math.PI*2); ctx.fillStyle='rgba(47,143,224,0.18)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore(); }
    ctx.restore();
    if(S.ph===3&&S.stage===0&&S.tilt.x<-0.25&&pud>0){ const x0=646,y0=PY-8; ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(x0+50,y0-6,TX-20,TY-24); ctx.stroke(); ctx.restore(); }

    thermoScale(ctx,86,190,350,S.T,-20,50,[-20,0,20,40]); textAt(ctx,Math.round(S.T)+' °C',86,388,{align:'center',size:13,weight:700,color:S.T<0?COL.blue:COL.red});

  S.read=()=>[['Ice left',Math.round(100*S.cubes.reduce((a,c)=>a+c.s**3,0)/(3*S0**3))+' %'],['Water on plate',pud>10?'yes':'—']];

}

/* ---------- 2. CHOPPING A CARROT — the knife falls under its own weight
   plus the push, slows while it cuts, and stops on the board; each slice
   topples over its bottom edge (θ̈ = (g/l)·sin θ) onto its round face */
function scChop(){
  const BY=392, KX=520, L=410, W=30;
  const S={cam:[90,60,730,420],ph:0,par:1.2,ox:spr(0),n:0,cyc:0,ky:{x:250,v:0},kst:0,pcs:[],lift:spr(0),tx:''};
  const rad=X=>7+24*Math.pow(1-clamp(X/L,0,1),0.8);

  S.go=()=>{ if(S.ph===0) S.ph=1; };
  S.back=()=>{ if(S.ph===2){ S.ph=3; S.bt=0; } };
  S.step=dt=>{
    const cutX=L-S.n*W;                             // carrot tip (carrot coords) still attached

      if(S.kst===0 && S.cyc>=1){ S.cyc=0; if(S.n>=nMax){ S.ph=2; } else { S.kst=1; S.feed=(S.n+1)*W; } }
      if(S.kst===1){ springTo(S.ox,S.feed,120,20,dt); if(Math.abs(S.ox.x-S.feed)<1.2){ S.kst=2; S.ky.v=250; } }
    }
    if(S.kst===2){ const ctop=BY-2*rad(L-(S.n+0.5)*W); let a=2600; if(S.ky.x>ctop) a=-S.ky.v*9; S.ky.v=Math.max(S.ky.v+a*dt,S.ky.x>ctop?120:0); S.ky.x+=S.ky.v*dt;
      if(S.ky.x>=BY){ S.ky.x=BY; S.ky.v=0; S.kst=3; const X0=L-(S.n+1)*W, X1=L-S.n*W; S.n++;
        S.pcs.push({X0,X1,r:rad((X0+X1)/2),x:KX+(X1-X0)/2,th:0,w:0,land:0,px:560+(S.pcs.length%4)*38+Math.random()*10,py:BY-(Math.floor(S.pcs.length/4))*9-Math.random()*6,hx:0}); } }
    if(S.kst===3){ S.ky.x=approach(S.ky.x,250,7,dt); if(S.ky.x<262) S.kst=0; }
    S.pcs.forEach(p=>{ if(S.ph<3){ if(p.th<Math.PI/2){ const l=Math.max(8,p.r); p.w+=(1800/l)*Math.sin(p.th+0.08)*dt; p.th+=p.w*dt; if(p.th>=Math.PI/2){ p.th=Math.PI/2; p.w=0; } } else { p.land=Math.min(1,p.land+dt*5); p.x=approach(p.x,p.px,4,dt); } }
      else { p.land=Math.max(0,p.land-dt*4); if(p.land<=0){ p.th=approach(p.th,0,6,dt); } p.x=approach(p.x,110+(p.X0+p.X1)/2+S.ox.x-0,6,dt); } });
    if(S.ph===3){ S.bt+=dt; S.ox.x=approach(S.ox.x,0,4,dt); if(S.bt>2.2) springTo(S.lift,1,40,8,dt); if(S.bt>3.6){ S.ph=5; } }
    if(S.ph===5) springTo(S.lift,1,40,8,dt);
  };
  S.draw=(ctx,t)=>{
    table5(ctx,410); ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,100,BY,620,16,5); ctx.fill(); ctx.stroke(); ctx.restore();
    const ox=110+S.ox.x-(S.n*W)+(S.n*W), X2x=X=>110+X+S.ox.x-(S.ph>=3?0:0);
    // remaining carrot: X ∈ [0, L − n·W]; the leafy top lifts in the reverse test
    const Xend=L-S.n*W, lift=S.lift.x*70;
    const drawCarrot=(X0,X1,dy,cutL,cutR)=>{ ctx.save(); ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(X2x(X0),BY-dy);
      for(let X=X0;X<=X1;X+=6) ctx.lineTo(X2x(X),BY-2*rad(X)-dy); ctx.lineTo(X2x(X1),BY-2*rad(X1)-dy);
      if(X1>=L-0.1){ ctx.quadraticCurveTo(X2x(L)+10,BY-rad(L)-dy,X2x(L),BY-dy); } else ctx.lineTo(X2x(X1),BY-dy);
      ctx.closePath(); ctx.fillStyle='#fff3e6'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
      ctx.strokeStyle='rgba(19,42,68,0.25)'; ctx.lineWidth=1.2; for(let X=X0+18;X<X1-4;X+=34){ const r=rad(X); ctx.beginPath(); ctx.moveTo(X2x(X),BY-dy-2*r+4); ctx.lineTo(X2x(X+8),BY-dy-2*r+9); ctx.stroke(); }
      if(cutR) line(ctx,X2x(X1),BY-dy,X2x(X1),BY-2*rad(X1)-dy,COL.blue,2.6);
      if(cutL) line(ctx,X2x(X0),BY-dy,X2x(X0),BY-2*rad(X0)-dy,COL.blue,2.6);

    // leaves
    ctx.save(); const lx=X2x(0), ly=BY-2*rad(0)-lift+rad(0); ctx.strokeStyle=COL.green; ctx.lineWidth=2.4; ctx.lineCap='round';
    for(let i=0;i<4;i++){ const a=Math.PI+(i-1.5)*0.3+Math.sin(t*1.5+i)*0.04; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.quadraticCurveTo(lx+Math.cos(a)*40,ly+Math.sin(a)*40-20,lx+Math.cos(a)*70,ly+Math.sin(a)*70-12); ctx.stroke(); } ctx.restore();
    drawCarrot(0,Xend,lift,false,S.n>0);
    // slices
    S.pcs.forEach(p=>{ const r=p.r, th=p.th, wv=p.X1-p.X0;
      if(p.land<1){ ctx.save(); ctx.globalAlpha=1-p.land; const pvx=S.ph>=3?p.x+wv/2:(p.th<Math.PI/2?KX+wv:p.x+wv/2); ctx.translate(pvx,BY); ctx.rotate(th); ctx.lineWidth=2.2;
        ctx.beginPath(); rrect(ctx,-wv,-2*r,wv,2*r,3); ctx.fillStyle='#fff3e6'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke(); line(ctx,-wv,0,-wv,-2*r,COL.blue,2.6); line(ctx,0,0,0,-2*r,COL.blue,2.6); ctx.restore(); }
      if(p.land>0){ ctx.save(); ctx.globalAlpha=p.land; const cx=p.x, cy=p.py-6; ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff3e6';
        ctx.beginPath(); ctx.ellipse(cx,cy+5,r,r*0.42,0,0,Math.PI); ctx.lineTo(cx-r,cy); ctx.ellipse(cx,cy,r,r*0.42,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx,cy,r,r*0.42,0,0,Math.PI*2); ctx.strokeStyle=COL.blue; ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx,cy,r*0.45,r*0.19,0,0,Math.PI*2); ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); } });
    // knife: thin blade seen almost edge-on, handle towards you
    if(S.ph<3){ const kb=S.ky.x; ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(KX-2,kb); ctx.lineTo(KX-10,kb-110); ctx.lineTo(KX+14,kb-118); ctx.lineTo(KX+8,kb-6); ctx.closePath(); ctx.fill(); ctx.stroke();
      line(ctx,KX-2,kb,KX+8,kb-6,COL.yellow,3);
      ctx.fillStyle='#fff'; rrect(ctx,KX-2,kb-176,26,62,8); ctx.fill(); ctx.stroke(); circ(ctx,KX+11,kb-150,3,COL.ink,null,1.6); circ(ctx,KX+11,kb-132,3,COL.ink,null,1.6); ctx.restore();
      if(S.kst===2) vec(ctx,KX+60,kb-150,KX+60,kb-100,COL.yellow,3); }
    if(S.ph===5){ mark(ctx,X2x(Xend)-30,BY-150,false); tag(ctx,'cut pieces stay apart',X2x(Xend)-30,BY-190,COL.blue,{size:12}); }
  };
  S.read=()=>[['Pieces',String(S.n)],['Still carrot?','yes']];
  return S;
}

/* ---------- 3. BOILING WATER — m·c·dT/dt = ηP − h(T−25);
   at 100 °C every extra joule makes steam: dm/dt = −(ηP − loss)/L */
function scBoil(){
  const BOT=372, TOPP=214, XL=292, XR=508;
  const S={cam:[180,60,740,420],ph:0,par:1200,tx:'time ×30',T:25,m:1000,bub:[],air:[],rings:[],steamI:0,lid:spr(0),drops:[],cup:0,runs:[]};
  const lev=()=>BOT-S.m/1000*112;
  S.go=()=>{ if(S.ph===0) S.ph=1; };
  S.back=()=>{ if(S.ph===2){ S.ph=3; } };
  S.step=dt=>{
    const on=S.ph===1||S.ph===2||S.ph===3, P=on?S.par*0.45:0, C=S.m/1000*4186, loss=3*(S.T-25);
    if(S.T<100||P<=loss) S.T+=30*(P-loss)/C*dt; else S.T=100;
    S.T=Math.min(100,Math.max(25,S.T));
    const ev=S.T>=99.9?Math.max(0,30*(P-loss)/2.26e3):30*0.02*Math.max(0,S.T-60)/40; S.m=Math.max(300,S.m-ev*dt); S.steamI=approach(S.steamI,clamp(ev/5,0,1.2),3,dt);
    if(S.ph===1 && S.T>=99.9 && S.m<960) S.ph=2;
    // bubbles: air on the walls first, then collapsing vapour bubbles, then a rolling boil
    if(on && S.T>40 && S.air.length<26 && Math.random()<dt*1.5) S.air.push({x:XL+8+Math.random()*(XR-XL-16),y:BOT-4-Math.random()*(BOT-lev()-10)*0.8,r:0.5});
    S.air.forEach(a=>a.r=Math.min(2.6,a.r+dt*0.6)); if(S.T>=99) S.air.forEach(a=>{ if(Math.random()<dt*0.5) a.y=-99; }); S.air=S.air.filter(a=>a.y>0);
    const sub=Math.max(0,(S.T-72)/28);
    if(on && sub>0 && Math.random()<dt*sub*S.par/60){ const sx=[310,340,368,400,430,462,490][Math.floor(Math.random()*7)]; bubAdd(S.bub,sx,BOT-4,1.8+Math.random()*2); }
    S.bub.forEach(b=>{ if(S.T<99.5) b.r-=dt*(100-S.T)*0.35; else b.r=Math.min(9,b.r+dt*5); }); S.bub=S.bub.filter(b=>b.r>0.6);
    bubStep(S.bub,dt,x=>lev(),undefined,undefined,S.rings);
    if(S.ph===3){ springTo(S.lid,1,30,9,dt);
      if(S.lid.x>0.9 && Math.random()<dt*S.steamI*14) S.drops.push({u:Math.random()*0.8,r:0.8,v:0});
      S.drops.forEach(d=>{ d.r=Math.min(4.5,d.r+dt*1.5); if(d.r>3.2){ d.v+=dt*0.5; d.u+=d.v*dt; } if(d.u>=1){ d.dead=true; S.runs.push({x:0,y:0,vy:0,t:0}); } }); S.drops=S.drops.filter(d=>!d.dead);
      S.runs.forEach(r=>{ r.vy+=900*dt; r.y+=r.vy*dt; if(r.y>70){ r.dead=true; S.cup+=4; } }); S.runs=S.runs.filter(r=>!r.dead);
      if(S.cup>=60) S.ph=4; }
  };
  S.draw=(ctx,t)=>{
    table5(ctx,410);
    const on=S.ph>=1&&S.ph<=3||S.ph===4, fl=on?S.par/2000:0;
    // burner + flames

/* ---------- 4. POPCORN — pan warms toward its setting (τ 5 s), each

  const XL=284, XR=516, BOT=378, CEIL=262;
  const S={cam:[240,150,720,420],ph:0,par:8,tx:'time ×10',T:25,ks:[],hm:new Array(60).fill(0),cool:0};

  const hAt=x=>{ const i=clamp(Math.floor((x-XL)/4),0,59); return S.hm[i]; };
  S.go=()=>{ if(S.ph===0) S.ph=1; };

    const heat=S.ph===1||S.ph===2, Teq=heat?25+S.par*25:25;

        if(!k.rest){ k.vy+=1800*dt; k.x+=k.vx*dt; k.y+=k.vy*dt; k.a+=k.vx*0.01*dt*6; const r=k.r.x;
          if(k.x<XL+r){ k.x=XL+r; k.vx=-k.vx*0.45; } if(k.x>XR-r){ k.x=XR-r; k.vx=-k.vx*0.45; }
          if(k.y<CEIL+r){ k.y=CEIL+r; k.vy=-k.vy*0.4; }
          const fl=BOT-hAt(k.x)-r*0.8; if(k.y>fl){ k.y=fl; const hl=hAt(k.x-r), hr=hAt(k.x+r), h0=hAt(k.x); k.age=(k.age||0)+dt; if(Math.abs(k.vy)<120 && k.age<3 && (h0-Math.min(hl,hr)>r*0.6) && k.x>XL+r+2 && k.x<XR-r-2){ k.vx=(hl<hr?-1:1)*140; k.vy=-60; } else if(Math.abs(k.vy)<120){ k.rest=true; k.y=Math.max(k.y,CEIL+r+30); k.vy=0; const i0=Math.floor((k.x-r-XL)/4), i1=Math.floor((k.x+r-XL)/4); for(let i=Math.max(0,i0);i<=Math.min(59,i1);i++){ const dx=(XL+i*4+2-k.x)/r; S.hm[i]=Math.max(S.hm[i],BOT-k.y+r*0.8*Math.sqrt(Math.max(0,1-dx*dx))); } } else { k.vy=-k.vy*0.45; k.vx*=0.7; } } } } });
    if(S.ph===1 && S.ks.every(k=>k.pop&&k.rest)) S.ph=2;

  };
  S.draw=(ctx,t)=>{
    table5(ctx,410);
    const heat=S.ph===1||S.ph===2, fl=heat?S.par/10:0;
    ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,320,392,160,18,5); ctx.fill(); ctx.stroke(); ctx.restore();
    if(fl>0) for(let i=0;i<8;i++) flameOne(ctx,330+i*20,390,11,8+22*fl,t+i*0.7,COL.yellow,COL.blue);
    // pan glows faintly red with temperature
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=mixCol(COL.ink,COL.red,clamp((S.T-120)/120,0,1)); ctx.beginPath(); ctx.moveTo(XL-2,CEIL+10); ctx.lineTo(XL-2,BOT+2); ctx.lineTo(XR+2,BOT+2); ctx.lineTo(XR+2,CEIL+10); ctx.stroke();
    line(ctx,XR+2,CEIL+30,XR+80,CEIL+18,COL.ink,6); ctx.restore();
    // glass lid
    ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='rgba(47,143,224,0.05)'; ctx.beginPath(); ctx.moveTo(XL-8,CEIL+10); ctx.quadraticCurveTo(400,CEIL-40,XR+8,CEIL+10); ctx.closePath(); ctx.fill(); ctx.stroke(); rrect(ctx,388,CEIL-28,24,12,4); ctx.stroke(); ctx.restore();
    S.ks.forEach(k=>{ if(!k.pop){ ctx.save(); ctx.translate(k.x+(k.jig||0),k.y); ctx.rotate(k.a); ctx.lineWidth=1.8; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff2c2'; ctx.beginPath(); ctx.moveTo(0,-6); ctx.quadraticCurveTo(6,-4,5,3); ctx.quadraticCurveTo(0,7,-5,3); ctx.quadraticCurveTo(-6,-4,0,-6); ctx.fill(); ctx.stroke(); ctx.restore(); }
      else { puffy(ctx,k.x,k.y,k.r.x,k.seed,COL.red); if(k.puff>0){ ctx.save(); ctx.globalAlpha=k.puff/0.4; circ(ctx,k.x,k.y-6,k.r.x+10*(0.4-k.puff)/0.4,COL.mid,null,1.2); ctx.restore(); } } });
    thermoScale(ctx,650,150,340,S.T,0,300,[0,100,200,300],180); textAt(ctx,Math.round(S.T)+' °C',650,380,{align:'center',size:13,weight:700,color:COL.red});
    textAt(ctx,'pops ≈ 180 °C',626,214,{align:'right',size:11.5,weight:600,color:COL.green});
    const n=S.ks.filter(k=>k.pop).length; if(n>0&&S.ph<3) tag(ctx,'popcorn: soft, white, new smell',400,CEIL-58,COL.red,{size:12});

/* ---------- 5. CUTTING PAPER — the blades close like a pair of levers;
   the cut runs to where the blades cross, then the halves fall apart */
function scCut(){
  const X0=180, X1=620, Y0=190, YM=295, Y1=400, BL=110;
  const S={cam:[100,70,700,460],ph:0,par:1.4,xc:X0,piv:X0-BL*0.5,al:0.4,ph2:0,sep:spr(0),join:0};
  S.go=()=>{ if(S.ph===0) S.ph=1; };
  S.back=()=>{ if(S.ph===2){ S.ph=3; S.bt=0; } };
  S.step=dt=>{
    if(S.ph===1){ S.ph2+=dt*S.par*2*Math.PI; const al=0.05+0.2*(1+Math.cos(S.ph2)); const closing=al<S.al; S.al=al;
      const cross=S.piv+BL*(1-al/0.45); if(closing && cross>S.xc){ S.xc=Math.min(X1,cross); }
      if(!closing) S.piv=approach(S.piv,S.xc-BL*0.25,3,dt);
      if(S.xc>=X1){ S.ph=2; } }
    if(S.ph===2) springTo(S.sep,1,30,7,dt);
    if(S.ph===3){ S.bt+=dt; springTo(S.sep,S.bt<1.6?0:S.bt<2.4?0:-0.8,30,7,dt); if(S.bt>3.2) S.ph=5; }
    if(S.ph===5) springTo(S.sep,-0.8,30,7,dt);
  };
  S.draw=(ctx,t)=>{
    ctx.save(); rrect(ctx,110,150,580,300,14); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.border||'#dbe4f0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    const s=S.sep.x, up=s>0?s*44:(s<0?-s*0:0), dn=s>0?s*44:0, lift=s<0?-s*60:0;
    const gap=x=>S.ph>=1&&x<S.xc?Math.min(5,(S.xc-x)*0.03)*(S.ph===1?1:0):0;
    // lower half then upper half
    const half=(top,dy,rot)=>{ ctx.save(); ctx.translate(400,YM); ctx.rotate(rot); ctx.translate(-400,-YM+dy); ctx.beginPath();
      if(top){ ctx.moveTo(X0,Y0); ctx.lineTo(X1,Y0); ctx.lineTo(X1,YM); for(let x=X1;x>=X0;x-=10) ctx.lineTo(x,YM-gap(x)); }
      else { ctx.moveTo(X0,Y1); ctx.lineTo(X1,Y1); ctx.lineTo(X1,YM); for(let x=X1;x>=X0;x-=10) ctx.lineTo(x,YM+gap(x)); }
      ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
      if(S.xc>X0){ ctx.beginPath(); for(let x=X0;x<=S.xc;x+=10) ctx.lineTo(x,YM+(top?-gap(x):gap(x))); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.stroke(); }
      for(let i=1;i<5;i++){ const yy=top?Y0+i*20:YM+i*20+4; line(ctx,X0+30,yy,X1-30,yy,'rgba(47,143,224,0.18)',1.2); }
      ctx.restore(); };
    half(false,dn,s>0?s*0.04:0); half(true,-up-lift,s>0?-s*0.05:0);
    if(S.ph<=1){ line(ctx,S.xc,YM,X1,YM,COL.mid,1.2,[6,5]); }
    // scissors
    if(S.ph===1||S.ph===0){ const px=S.piv, py=YM, a=S.al;
      ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
      for(const sg of [-1,1]){ ctx.save(); ctx.translate(px,py); ctx.rotate(sg*a*0.5); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(BL,sg*2); ctx.lineTo(BL*0.2,sg*10); ctx.closePath(); ctx.fill(); ctx.stroke(); line(ctx,0,0,BL,sg*2,COL.yellow,2);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-50,-sg*14); ctx.stroke(); ctx.beginPath(); ctx.ellipse(-68,-sg*20,20,13,-sg*0.3,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
      circ(ctx,px,py,4,COL.ink,'#fff',2); ctx.restore(); }
    if(S.ph===5){ mark(ctx,400,Y0-40-60,false); tag(ctx,'still two pieces',400,Y0-20-60,COL.blue,{size:12}); }
  };
  S.read=()=>[['Cut',Math.round(100*(S.xc-X0)/(X1-X0))+' %'],['Pieces',S.xc>=X1?'2':'1']];
  return S;
}

/* ---------- 6. BEETROOT EXTRACT IN WATER — each drop plunges in as a
   plume (it is denser), then spreads by diffusion ∂c/∂t = D∇²c; stirring
   adds a swirl that mixes it far faster */
function scBeet(){
  const CX=400, TOP=180, BOT=408, RT=112, RB=94, LEV=214, NX=34, NY=38;
  const x0=CX-RT, x1=CX+RT, dx=(x1-x0)/NX, dy=(BOT-LEV)/NY;
  const S={cam:[220,30,640,450],ph:0,par:4,tx:'time ×60',c:new Float32Array(NX*NY),m:new Uint8Array(NX*NY),pt:[],drops:[],sq:spr(0),n:0,stir:0,uni:0};
  for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const x=x0+(i+0.5)*dx, y=LEV+(j+0.5)*dy, [l,r]=tumblerX(CX,TOP,BOT,RT,RB,y); S.m[j*NX+i]=(x>l+3&&x<r-3&&y<BOT-3)?1:0; }
  const BEET='#a8235e';
  S.go=()=>{ if(S.ph===0){ S.ph=1; S.tq=0; } };
  S.step=dt=>{
    if(S.ph===1){ S.tq+=dt; if(S.n<3 && S.tq>0.9*S.n+0.3){ S.n++; S.sq.v=-10; S.drops.push({x:CX+ (S.n-2)*6,y:118,vy:0}); } }
    springTo(S.sq,0,60,8,dt);
    S.drops.forEach(d=>{ d.vy+=1500*dt; d.y+=d.vy*dt; if(d.y>=LEV){ d.dead=true; for(let k=0;k<70;k++){ const a=Math.random()*Math.PI*2, sp=Math.random()*55; S.pt.push({x:d.x,y:LEV+2,vx:Math.cos(a)*sp,vy:140+Math.random()*120+Math.sin(a)*sp*0.5,m:1}); } } });
    S.drops=S.drops.filter(d=>!d.dead);
    // plume parcels: drag, slow sinking, random walk; they hand their dye to the grid
    const w=S.par*0.12;
    S.pt.forEach(p=>{ p.vx*=Math.exp(-1.6*dt); p.vy=p.vy*Math.exp(-1.6*dt)+10*dt; p.x+=p.vx*dt+(Math.random()-0.5)*16*dt*10; p.y+=p.vy*dt;
      if(w>0){ const rx=p.x-CX, ry=p.y-(LEV+BOT)/2; p.x+=-ry*w*dt; p.y+=rx*w*dt; }
      const [l,r]=tumblerX(CX,TOP,BOT,RT,RB,p.y); p.x=clamp(p.x,l+4,r-4); p.y=clamp(p.y,LEV+2,BOT-4);
      const i=clamp(Math.floor((p.x-x0)/dx),0,NX-1), j=clamp(Math.floor((p.y-LEV)/dy),0,NY-1), q=Math.min(p.m,dt*0.7); p.m-=q; S.c[j*NX+i]+=q*0.25; });
    S.pt=S.pt.filter(p=>p.m>0.01);
    // diffusion (+ swirl when stirred); only between water cells
    const D=260+S.par*260, sub=Math.ceil(D*dt/(0.2*dx*dx)), h=dt/sub, c=S.c, m=S.m;
    for(let s=0;s<sub;s++){ const n=new Float32Array(c);
      for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const k=j*NX+i; if(!m[k]) continue; let lap=0;
        if(i>0&&m[k-1]) lap+=c[k-1]-c[k]; if(i<NX-1&&m[k+1]) lap+=c[k+1]-c[k]; if(j>0&&m[k-NX]) lap+=c[k-NX]-c[k]; if(j<NY-1&&m[k+NX]) lap+=c[k+NX]-c[k];
        n[k]=c[k]+D*h/(dx*dx)*lap; }
      c.set(n); }
    if(w>0){ const n=new Float32Array(c), a=-w*dt; for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const k=j*NX+i; if(!m[k]) continue; const x=(i+0.5)*dx-RT, y=(j+0.5)*dy-(BOT-LEV)/2;
        const sx=x*Math.cos(a)-y*Math.sin(a), sy=x*Math.sin(a)+y*Math.cos(a), fi=clamp((sx+RT)/dx-0.5,0,NX-1.001), fj=clamp((sy+(BOT-LEV)/2)/dy-0.5,0,NY-1.001), i0=Math.floor(fi), j0=Math.floor(fj), u=fi-i0, v=fj-j0;
        const g=(ii,jj)=>{ const kk=jj*NX+ii; return m[kk]?c[kk]:c[k]; }; n[k]=(1-u)*(1-v)*g(i0,j0)+u*(1-v)*g(i0+1,j0)+(1-u)*v*g(i0,j0+1)+u*v*g(i0+1,j0+1); } c.set(n); }
    S.stir+=dt*w*1.3;
    let sum=0,cnt=0; for(let k=0;k<c.length;k++) if(m[k]){ sum+=c[k]; cnt++; } const mean=sum/cnt; let v=0; for(let k=0;k<c.length;k++) if(m[k]) v+=(c[k]-mean)**2; S.uni=mean>0?1-Math.sqrt(v/cnt)/mean:0; S.mean=mean;
    if(S.ph===1 && S.n>=3 && S.pt.length===0 && S.uni>0.9) S.ph=2;
  };
  S.draw=(ctx,t)=>{
    table5(ctx,410);
    const mean=S.mean||0;
    if(!S.off){ S.off=document.createElement('canvas'); S.off.width=NX; S.off.height=NY; S.img=S.off.getContext('2d').createImageData(NX,NY); }
    { const c=S.c, d=S.img.data, bc=hexRgb(BEET); for(let k=0;k<NX*NY;k++){ const a=S.m[k]?clamp(c[k]*9,0,0.85):0; d[k*4]=bc[0]; d[k*4+1]=bc[1]; d[k*4+2]=bc[2]; d[k*4+3]=Math.round(a*255); } S.off.getContext('2d').putImageData(S.img,0,0); }
    tumbler(ctx,CX,TOP,BOT,RT,RB,{level:LEV,liq:'#f3f8fd',inside:()=>{ ctx.save(); ctx.imageSmoothingEnabled=true; ctx.drawImage(S.off,x0,LEV,NX*dx,NY*dy); ctx.restore();
      ctx.save(); S.pt.forEach(p=>{ ctx.globalAlpha=clamp(p.m,0,1)*0.6; ctx.fillStyle=BEET; ctx.fillRect(p.x-1.5,p.y-1.5,3,3); }); ctx.restore(); }});
    // dropper
    const sq=S.sq.x; ctx.save(); ctx.translate(CX,70); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(-3,44); ctx.lineTo(-7,24); ctx.lineTo(-7,-6); ctx.lineTo(7,-6); ctx.lineTo(7,24); ctx.lineTo(3,44); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=rgba(BEET,0.7); ctx.fillRect(-5,6,10,18); ctx.beginPath(); ctx.ellipse(0,-24,12+sq*0.3,18+sq*0.5,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    S.drops.forEach(d=>dropShape(ctx,d.x,d.y,5,BEET,1.2));
    if(S.par>0.05&&(S.ph>=1)){ const a=S.stir, rx=CX+Math.cos(a)*50; rod(ctx,rx,BOT-12,rx+Math.sin(a)*20+40,TOP-60); }
    textAt(ctx,'beetroot extract',CX+26,64,{size:12,weight:600,color:BEET});
    if(S.ph===2) tag(ctx,'pink-red all through',CX+170,150,BEET,{size:12});
  };
  S.read=()=>[['Drops added',String(S.n)],['Evenly mixed',Math.round(100*clamp(S.uni,0,1))+' %']];
  return S;
}

/* ---------- 7. BURNING WOOD — each stick loses mass at dm/dt = −k·b·air,
   its fire b grows toward the air it gets; when the sticks are thin the
   pile collapses; ash is left and smoke goes into the air */
function scWood(){
  const GY=410;
  const S={cam:[150,60,650,440],ph:0,par:1,tx:'time ×60',st:[{a:{x:300,y:GY-4},ang:-0.72},{a:{x:505,y:GY-4},ang:-2.42},{a:{x:392,y:GY-2},ang:-1.52}].map(s=>({...s,m:1,b:0,len:150,fall:spr(0)})),sm:[],sp:[],ash:0,mt:spr(0),brush:0};
  S.go=()=>{ if(S.ph===0){ S.ph=1; S.lt=0; } };
  S.back=()=>{ if(S.ph===2){ S.ph=3; S.bt=0; } };
  const tipOf=s=>{ const an=lerp(s.ang,s.ang<-1.57?-Math.PI+0.06:-0.06,s.fall.x); return {x:s.a.x+Math.cos(an)*s.len*(0.4+0.6*s.m),y:s.a.y+Math.sin(an)*s.len*(0.4+0.6*s.m),an}; };
  S.step=dt=>{
    if(S.ph===1){ S.lt+=dt; springTo(S.mt,S.lt<1.4?1:0,30,8,dt); if(S.lt>1.0&&S.lt<1.8) S.st[2].b=Math.max(S.st[2].b,0.25); }
    S.st.forEach((s,i)=>{ const nb=S.st.reduce((a,o)=>a+(o===s?0:o.b),0);
      if(s.m>0.02){ if(s.b>0||nb>0.6){ const tgt=clamp(0.9*S.par,0,1.3)*Math.min(1,s.m*4); s.b=approach(s.b,tgt,0.8+nb*0.3,dt); } s.m=Math.max(0,s.m-0.06*(s.b>0.05?Math.max(s.b,0.35):0)*S.par*dt); if(s.m<0.02) s.m=0; }
      else s.b=approach(s.b,0,0.6,dt);
      if(S.st.every(o=>o.m<0.35)) springTo(s.fall,1,12,5,dt);
      if(s.b>0.05){ const tp=tipOf(s); for(let k=0;k<1;k++) if(Math.random()<dt*4*s.b){ const u=Math.random(); smokeAdd(S.sm,lerp(s.a.x,tp.x,u),lerp(s.a.y,tp.y,u)-40*s.b); }
        if(Math.random()<dt*6*s.b){ const u=Math.random(); S.sp.push({x:lerp(s.a.x,tp.x,u),y:lerp(s.a.y,tp.y,u)-20,vx:(Math.random()-0.5)*40,vy:-120-Math.random()*120,t:0}); } } });
    S.ash=S.st.reduce((a,s)=>a+(1-s.m),0)/3;
    smokeStep(S.sm,dt,2.6); S.sp.forEach(p=>{ p.t+=dt; p.vy+=40*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); S.sp=S.sp.filter(p=>p.t<1.2);
    if(S.ph===1 && S.st.every(s=>s.m===0&&s.b<0.08)) S.ph=2;
    if(S.ph===3){ S.bt+=dt; S.brush+=dt; if(S.bt>3) S.ph=5; }
  };
  S.draw=(ctx,t)=>{
    ctx.save(); line(ctx,20,GY,780,GY,COL.ink,2.4); for(let i=0;i<30;i++) line(ctx,30+i*26,GY+4,20+i*26,GY+14,COL.mid,1.2); ctx.restore();
    // stones ring
    [[250,GY],[300,GY+2],[500,GY+2],[550,GY]].forEach(([x,y],i)=>{ ctx.save(); ctx.beginPath(); ctx.ellipse(x,y-10,24,12,0,Math.PI,0); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore(); });
    // ash heap
    if(S.ash>0.01){ const aw=40+130*S.ash, ah=6+18*S.ash; ctx.save(); ctx.beginPath(); ctx.moveTo(400-aw,GY); ctx.quadraticCurveTo(400,GY-ah*2,400+aw,GY); ctx.closePath(); ctx.fillStyle='#eef0f3'; ctx.fill(); ctx.strokeStyle=COL.muted; ctx.lineWidth=1.8; ctx.stroke();
      for(let i=0;i<14;i++){ const x=400-aw*0.8+i*aw*0.12; circ(ctx,x,GY-3-Math.abs(Math.sin(i*2.3))*ah*0.7,1.2,COL.mid,COL.mid,1); } ctx.restore(); }
    // sticks
    S.st.forEach(s=>{ if(s.m<=0.001&&s.b<0.02) return; const tp=tipOf(s), r=3+9*Math.sqrt(s.m); const ch=clamp(1-s.m+s.b*0.2,0,1);
      ctx.save(); ctx.lineCap='round'; line(ctx,s.a.x,s.a.y-r*0.5,tp.x,tp.y,COL.ink,2*r+4.4); line(ctx,s.a.x,s.a.y-r*0.5,tp.x,tp.y,mixCol('#fff7ec','#3a3f47',ch),2*r);
      if(s.b>0.05){ ctx.globalAlpha=clamp(s.b,0,1); ctx.setLineDash([8,10]); ctx.lineDashOffset=-t*20; line(ctx,s.a.x,s.a.y-r*0.5,tp.x,tp.y,COL.red,2.4,[8,10]); } ctx.restore(); });
    // flames along the sticks
    S.st.forEach((s,i)=>{ if(s.b<0.04) return; const tp=tipOf(s); for(let k=0;k<4;k++){ const u=0.12+k*0.24, x=lerp(s.a.x,tp.x,u), y=lerp(s.a.y,tp.y,u)-6; flameOne(ctx,x,y,18+14*s.b,(26+60*s.b)*(0.7+0.3*Math.sin(t*5+k+i)),t+k*0.9+i,COL.red,COL.yellow); } });
    const B=S.st.reduce((a,s)=>a+s.b,0)/3; glow(ctx,400,GY-80,170*Math.sqrt(B),COL.yellow,0.2*B);
    S.sp.forEach(p=>{ ctx.save(); ctx.globalAlpha=1-p.t/1.2; circ(ctx,p.x,p.y,1.8,COL.yellow,COL.yellow,1); ctx.restore(); });
    smokeDraw(ctx,S.sm,2.6);
    if(S.ph===1&&S.lt<1.8){ const a=S.mt.x; matchDraw(ctx,560-60*a,GY-120+80*a,2.6,56,true,t); }
    if(B>0.3){ tag(ctx,'heat + light',570,150,COL.yellow,{size:12}); tag(ctx,'smoke, gases',230,120,COL.green,{size:12}); }
    if(S.ash>0.3) tag(ctx,'ash',610,GY-40,COL.red,{size:12});
    if(S.ph>=3){ const bx=400+Math.sin(S.brush*5)*120; ctx.save(); ctx.translate(bx,GY-16); ctx.rotate(0.25); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,-30,-8,60,14,4); ctx.fill(); ctx.stroke(); line(ctx,0,-8,26,-90,COL.ink,5); for(let i=0;i<8;i++) line(ctx,-26+i*7.4,6,-28+i*7.4,16,COL.yellow,1.6); ctx.restore(); }
    if(S.ph===5){ mark(ctx,400,210,false); tag(ctx,'ash is not wood',400,250,COL.red,{size:12}); }
  };
  S.read=()=>[['Wood left',Math.round(100*S.st.reduce((a,s)=>a+s.m,0)/3)+' %'],['Ash formed',S.ash>0.02?'yes':'—']];
  return S;
}

/* ---------- 8. DRYING CLOTHES — water leaves as vapour at a rate set by
   the sun and the wind; while very wet it also drips; the shirt swings
   like a damped pendulum pushed by gusts */
function scDry(){
  const GY=440, HX=400, HY=176;
  const S={cam:[100,30,760,460],ph:0,par:6,tx:'time ×240',w:1,sw:spr(0),drops:[],pud:0,rain:[],cl:spr(0),evap:0};
  const ropeY=x=>{ const u=(x-150)/500; return 150+4*28*u*(1-u); };
  S.go=()=>{ if(S.ph===0) S.ph=1; };
  S.back=()=>{ if(S.ph===2){ S.ph=3; } };
  S.step=dt=>{
    const t=performance.now()/1000, wind=S.par, gust=wind*(0.6+0.4*Math.sin(t*1.7)+0.25*Math.sin(t*4.1));
    springTo(S.sw,gust*0.012,9,1.6,dt);
    S.evap=(S.ph===1||S.ph===2)?0.032*(1+0.12*wind)*Math.min(1,S.w/0.2):0;
    if(S.ph===1){ S.w=Math.max(0,S.w-S.evap*dt); if(S.w<=0.01){ S.w=0; S.ph=2; } }
    if(S.w>0.62 && S.ph!==3 && Math.random()<dt*(S.w-0.62)*40) S.drops.push({x:HX-80+Math.random()*160,y:HY+200,vy:0});
    S.drops.forEach(d=>{ d.vy+=900*dt; d.y+=d.vy*dt; if(d.y>=GY){ d.dead=true; S.pud=Math.min(1,S.pud+0.02); } }); S.drops=S.drops.filter(d=>!d.dead);
    if(S.ph===1) S.pud=Math.max(0,S.pud-dt*0.03);
    if(S.ph===3){ springTo(S.cl,1,20,7,dt); if(S.cl.x>0.8){ for(let i=0;i<3;i++) S.rain.push({x:220+Math.random()*360,y:90,vy:500}); S.w=Math.min(1,S.w+dt*0.35); } if(S.w>=1){ S.ph=4; } }
    else springTo(S.cl,0,20,7,dt);
    S.rain.forEach(r=>{ r.y+=r.vy*dt; if(r.y>GY) r.dead=true; }); S.rain=S.rain.filter(r=>!r.dead);
  };
  S.draw=(ctx,t)=>{
    sunDraw(ctx,700,70,26,t,1-S.cl.x*0.7);
    line(ctx,20,GY,780,GY,COL.ink,2.4);
    if(S.pud>0.01){ ctx.save(); ctx.beginPath(); ctx.ellipse(HX,GY-1,60+80*S.pud,6+5*S.pud,0,0,Math.PI*2); ctx.fillStyle='rgba(47,143,224,0.15)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
    line(ctx,150,GY,150,140,COL.ink,5); line(ctx,650,GY,650,140,COL.ink,5);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.beginPath(); for(let x=150;x<=650;x+=10) x===150?ctx.moveTo(x,ropeY(x)):ctx.lineTo(x,ropeY(x)); ctx.stroke(); ctx.restore();
    // shirt: pivots at the line, lower parts pushed more by the wind, hem flutters
    const a=S.sw.x, wind=S.par, hy=ropeY(HX), wc=mixCol('#ffffff','#b9d4f0',S.w);
    const P0=(x,y)=>{ const yy=y-hy, fl=Math.sin(t*6+x*0.05)*wind*0.18*(yy/200)**2*10; return {x:HX+(x-HX)*Math.cos(a)-yy*Math.sin(a)+fl, y:hy+(x-HX)*Math.sin(a)+yy*Math.cos(a)}; };
    const shp=[[HX-50,hy],[HX-110,hy+18],[HX-138,hy+70],[HX-104,hy+86],[HX-86,hy+62],[HX-86,hy+210],[HX,hy+214],[HX+86,hy+210],[HX+86,hy+62],[HX+104,hy+86],[HX+138,hy+70],[HX+110,hy+18],[HX+50,hy],[HX+22,hy+18],[HX,hy+22],[HX-22,hy+18]];
    ctx.save(); ctx.lineJoin='round'; ctx.beginPath(); shp.forEach((p,i)=>{ const q=P0(p[0],p[1]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }); ctx.closePath(); ctx.fillStyle=wc; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.stroke();
    ctx.restore();
    [HX-60,HX+60].forEach(x=>{ const q=P0(x,hy); ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,q.x-4,q.y-12,8,22,2); ctx.fill(); ctx.stroke(); ctx.restore(); });
    if(S.evap>0) steam(ctx,HX,hy-4,200,S.evap*28*Math.max(0.2,S.w),t);
    S.drops.forEach(d=>dropShape(ctx,d.x,d.y,3.4,'#dcebfa',1.2));
    if(S.cl.x>0.02){ const cy=lerp(-60,70,S.cl.x); ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.blue; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(330,cy,34,Math.PI,0); ctx.arc(390,cy-20,44,Math.PI,0); ctx.arc(460,cy,36,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      S.rain.forEach(r=>line(ctx,r.x,r.y,r.x-3,r.y+12,COL.blue,1.6)); }
    if(S.ph>=1&&S.w>0.02&&S.evap>0) tag(ctx,'water vapour',HX,hy-60,COL.green,{size:12});
    // wetness bar
    meterV(ctx,720,190,18,160,S.w,COL.blue,'wet');
  };
  S.read=()=>[['Wetness',Math.round(S.w*100)+' %'],['Drying',S.ph===1?'yes':'—']];
  return S;
}

/* ---------- 9. SMALL BALLS OF DOUGH — pieces are pinched off (the neck
   thins and snaps), then rolled: each roll damps the lumps away, the
   volume of dough never changes */
function scBalls(){
  const BY=410, LX=250, R0=66, SL=[430,520,610,700];
  const S={cam:[160,190,790,440],ph:0,par:null,V:1,balls:[],cur:-1,tt:0,hand:{x:spr(700),y:spr(200)}};
  const Rv=v=>R0*Math.cbrt(v);
  const R=rng(5); const lumpAmp=[0.07,0.05,0.035,0.02], lumpPh=[R()*6,R()*6,R()*6,R()*6];
  S.go=()=>{ if(S.ph===0){ S.ph=1; S.cur=0; S.tt=0; } };
  S.back=()=>{ if(S.ph===2){ S.ph=3; S.tt=0; S.cur=S.balls.length-1; } };
  S.step=dt=>{
    S.tt+=dt;
    if(S.ph===1 && S.cur<4){ const i=S.cur;
      if(!S.balls[i]){ const r=rng(40+i); S.balls[i]={v:0,x:LX,y:BY,amp:[0.12,0.09,0.06,0.04],ph:[r()*6,r()*6,r()*6,r()*6],rot:0,st:0}; }
      const b=S.balls[i], last=i===3;
      if(b.st===0){ // pinch: a bud grows out of the lump
        const u=clamp(S.tt/0.9,0,1); b.v=0.25*u; if(last){ b.v=S.V+b.v; S.V=0; b.st=1; S.tt=0; } else if(u>=1){ S.V-=0.25; b.st=1; S.tt=0; } }
      else if(b.st===1){ const u=ease(clamp(S.tt/0.8,0,1)); b.x=lerp(LX+Rv(S.V+0.001)+20,SL[i],u); if(u>=1){ b.st=2; S.tt=0; } }
      else if(b.st===2){ b.rot+=dt*9; b.amp=b.amp.map(a=>a*Math.exp(-2.4*dt)); if(S.tt>1.6){ b.st=3; S.cur++; S.tt=0; if(S.cur>=4) S.ph=2; } }
    }
    if(S.ph===3){ const i=S.cur; if(i>=0){ const b=S.balls[i]; const u=ease(clamp(S.tt/0.7,0,1)); b.x=lerp(SL[i],LX,u); if(u>=1){ S.V+=b.v; b.v=0; S.cur--; S.tt=0; } }
      else if(S.tt>0.6){ S.ph=4; } }
    // the palm follows whichever ball is being rolled
    let hx=700,hy=210; const b=S.balls[S.cur]; if(S.ph===1&&b&&b.st===2){ const r=Rv(b.v); hx=b.x+Math.cos(S.tt*9)*14; hy=BY-2*r*0.92-4+Math.sin(S.tt*9)*2; }
    springTo(S.hand.x,hx,60,12,dt); springTo(S.hand.y,hy,60,12,dt);
  };
  S.draw=(ctx,t)=>{
    table5(ctx,BY);
    const drawDough=(x,v,amp,ph,rot,col)=>{ if(v<0.004) return; const r=Rv(v); ctx.save(); blobPath(ctx,x,BY-r*0.86,r,amp,ph,rot,0.86); ctx.fillStyle='#fffaf0'; ctx.fill(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=2.4; ctx.stroke();
      ctx.beginPath(); ctx.arc(x-r*0.3,BY-r*1.15,r*0.3,Math.PI*1.1,Math.PI*1.6); ctx.strokeStyle='rgba(19,42,68,0.25)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); };
    drawDough(LX,S.V,lumpAmp,lumpPh,0);
    S.balls.forEach((b,i)=>{ if(!b||b.v<0.004) return; const r=Rv(b.v);
      if(b.st===0&&S.ph===1){ const u=clamp(S.tt/0.9,0,1), bx=LX+Rv(S.V)*0.8+r*0.7*u; b.x=bx; ctx.save(); const nk=Math.max(1.5,(1-u)*r*0.8); ctx.beginPath(); ctx.moveTo(LX+Rv(S.V)*0.6,BY-Rv(S.V)*0.9-nk); ctx.lineTo(bx,BY-r*0.9-nk*0.5); ctx.lineTo(bx,BY-r*0.9+nk*0.5); ctx.lineTo(LX+Rv(S.V)*0.6,BY-Rv(S.V)*0.9+nk); ctx.closePath(); ctx.fillStyle='#fffaf0'; ctx.fill(); ctx.restore(); }
      const hop=b.st===1?Math.sin(clamp(S.tt/0.8,0,1)*Math.PI)*40:0;
      ctx.save(); ctx.translate(0,-hop); drawDough(b.x,b.v,b.amp,b.ph,b.rot,b.st>=2||S.ph>=2?COL.blue:COL.ink); ctx.restore();
      if(b.st>=2){ const r2=Rv(b.v); line(ctx,b.x+Math.cos(b.rot)*r2*0.5,BY-r2*0.86+Math.sin(b.rot)*r2*0.4,b.x-Math.cos(b.rot)*r2*0.3,BY-r2*0.86-Math.sin(b.rot)*r2*0.25,'rgba(19,42,68,0.25)',1.4); } });
    if(S.ph===1) palmDraw(ctx,S.hand.x.x,S.hand.y.x,0.9,false);
    const n=S.balls.filter(b=>b&&b.st>=3&&b.v>0.01).length; if(S.ph===2) tag(ctx,'4 balls · same dough',565,300,COL.blue,{size:12});
    if(S.ph===4) tag(ctx,'one lump again',LX,250,COL.blue,{size:12});
  };
  S.read=()=>[['Balls',String(S.balls.filter(b=>b&&b.st>=2&&b.v>0.01).length)],['Total dough','100 %']];
  return S;
}

/* ---------- 10. ROLLING A CHAPATI — the pin rolls without slipping
   (turn = distance / radius); every pass squeezes the dough thinner and
   it spreads, keeping its volume: R = √(V / πh) */
function scRoti(){
  const CX=400, CY=372, V=Math.PI*44*44*46;
  const S={cam:[150,190,650,470],ph:0,par:3,h:46,pin:0,pv:0,dir:1,ang:0,on:spr(0),rough:0};
  const Rh=h=>Math.sqrt(V/(Math.PI*h));
  S.go=()=>{ if(S.ph===0) S.ph=1; };
  S.back=()=>{ if(S.ph===2){ S.ph=3; } };
  S.step=dt=>{
    springTo(S.on,S.ph===1?1:0,30,9,dt);
    if(S.ph===1){ const R=Rh(S.h), A=R*0.36+20; S.pin+=S.dir*dt*(120+R*0.6); if(Math.abs(S.pin)>A){ S.pin=Math.sign(S.pin)*A; S.dir*=-1; }
      S.ang+=S.dir*dt*(120+R*0.6)/16; const onD=Math.abs(S.pin)<R*0.36; if(onD) S.h=Math.max(3.4,S.h-dt*S.h*0.09*S.par*(S.h>3.5?1:0));
      if(S.h<=3.6){ S.ph=2; } }
    if(S.ph===3){ S.h=Math.min(46,S.h+dt*S.h*0.9); S.rough=Math.sin(Math.min(1,(S.h-3.4)/42)*Math.PI)*0.12; if(S.h>=45.9){ S.h=46; S.ph=4; S.rough=0; } }
  };
  S.draw=(ctx,t)=>{
    // round rolling board (chakla), seen at a slant
    ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(CX,CY+18,200,70,0,0,Math.PI); ctx.lineTo(CX-200,CY); ctx.ellipse(CX,CY,200,70,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(CX,CY,200,70,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    const h=S.h, R=Rh(h), ry=R*0.36;
    if(h>20){ // still ball-like: a squashed round lump
      ctx.save(); blobPath(ctx,CX,CY-h*0.5,R,[S.rough,S.rough*0.6],[1,2],0,(h*0.5+ry*0.5)/R); ctx.fillStyle='#fffaf0'; ctx.fill(); ctx.strokeStyle=S.ph>=1?COL.blue:COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
    else { ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.blue; ctx.fillStyle='#fffaf0'; ctx.beginPath(); ctx.ellipse(CX,CY,R,ry,0,0,Math.PI); ctx.lineTo(CX-R,CY-h); ctx.ellipse(CX,CY-h,R,ry,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); blobPath(ctx,CX,CY-h,R,[S.rough,S.rough*0.5],[1,2],0,0.36); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // rolling pin: rides on the dough, moves toward/away from you
    if(S.on.x>0.02){ const py=CY+S.pin, sitH=Math.abs(S.pin)<ry?h:0, y=py-sitH-15-(1-S.on.x)*120; ctx.save(); ctx.globalAlpha=clamp(S.on.x*1.5,0,1); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
      rrect(ctx,CX-170,y-15,340,30,15); ctx.fill(); ctx.stroke(); rrect(ctx,CX-230,y-8,62,16,8); ctx.fill(); ctx.stroke(); rrect(ctx,CX+168,y-8,62,16,8); ctx.fill(); ctx.stroke();
      ctx.save(); rrect(ctx,CX-170,y-15,340,30,15); ctx.clip(); for(let k=0;k<6;k++){ const a=S.ang+k*Math.PI/3; if(Math.cos(a)>0.05) line(ctx,CX-160,y+Math.sin(a)*14,CX+160,y+Math.sin(a)*14,COL.yellow,1.4+Math.cos(a)); } ctx.restore(); ctx.restore(); }
  };
  S.read=()=>[['Thickness',fmt(S.h*0.25,1)+' mm'],['Width',fmt(2*Rh(S.h)*0.5/10,1)+' cm']];
  return S;
}

/* =====================================================================
   5.2 LET US CREATE AND DISCUSS — paper, balloon, chalk
   A  Paper plane: five folds, each a real rotation of the paper about
      its crease (see PAPER-FOLDING ENGINE). Unfold → the same sheet,
      now with crease lines.
   B  Balloon: rubber pushes back with ΔP = P₀(1/λ − 1/λ⁷), λ = r/r₀ —

      pushes air in at q = k(P_mouth − ΔP); let go of the neck and it
      leaks out at q ∝ √ΔP until the balloon is back to its own size.
      A pin in a stretched balloon splits the rubber: the pieces fly out,
      flutter under air drag and fall. It is still rubber.

function buildA2(){

  /* ---------- A: paper plane ---------- */

    {a:{x:0,y:-150},b:{x:-110,y:-40},m:{x:-105,y:-145}},

      if(s.y.x+SR*0.62>=top){ s.y.x=top-SR*0.62; const E=clamp(s.vy/900,0.3,1.6); s.vy=0; s.fall=false; s.rest=0.5; s.hits++; C.star=1;

        if(C.stick){ C.stick=false; for(let i=0;i<7;i++){ const x=280+i*34+17; C.pcs.push({x,y:TY-17,vx:(x-s.x)*2+(R()-0.5)*80,vy:-200-R()*200,a:0,w:(R()-0.5)*10,r:16+R()*4,v:lumpPoly(i*13+5,16,7,0.8),rest:false}); } }
        else { const nw=[]; C.pcs.forEach(p=>{ if(Math.abs(p.x-s.x)<SR*1.1 && p.r>4.6){ const k=3; for(let j=0;j<k;j++){ const r=p.r/1.6; if(r<4.6){ toPowder({x:p.x+(R()-0.5)*20,r}); continue; } const an=-Math.PI*(0.1+0.8*R());
              nw.push({x:p.x,y:p.y-2,vx:Math.cos(an)*(120+R()*220)*E,vy:Math.sin(an)*(160+R()*220)*E,a:R()*6,w:(R()-0.5)*16,r,v:lumpPoly((s.hits*7+j*3+Math.floor(p.x))|0,r,6,0.8),rest:false}); } }
            else if(Math.abs(p.x-s.x)<SR*1.1){ toPowder(p); } else nw.push(p); }); C.pcs=nw; }
        if(C.pcs.length===0&&!C.stick) { done[2]=1; setPart(part); } } }
    else { if(s.rest>0) s.rest-=dt; else springTo(s.y,140,30,8,dt); }
    C.star=Math.max(0,C.star-dt*3);
    // pieces fly, bounce, and are gathered back toward the middle between blows
    fragsStep(C.pcs,dt,floorC);
    C.pcs.forEach(p=>{ if(p.rest){ const dx=400-p.x; if(Math.abs(dx)>60){ p.x+=Math.sign(dx)*40*dt; p.y=floorC(p.x)-p.r*0.6; } } });
    // powder slides down until no slope is steeper than its angle of repose (~35°)
    for(let it=0;it<4;it++) for(let i=0;i<119;i++){ const d=C.heap[i]-C.heap[i+1]; if(Math.abs(d)>2.8){ const m=(Math.abs(d)-2.8)*0.5*Math.sign(d)*0.5; C.heap[i]-=m; C.heap[i+1]+=m; } }
  };
  const drawC=(ctx)=>{
    table5(ctx,TY+8); ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,150,TY,500,8,3); ctx.fill(); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.beginPath(); ctx.moveTo(160,TY); for(let i=0;i<120;i++) ctx.lineTo(160+i*4+2,TY-C.heap[i]); ctx.lineTo(640,TY); ctx.closePath(); ctx.fillStyle='#fbfcfe'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.stroke();
    for(let i=0;i<120;i+=2) if(C.heap[i]>2) circ(ctx,160+i*4+2,TY-C.heap[i]*0.5,0.9,COL.mid,COL.mid,1); ctx.restore();
    if(C.stick){ ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.blue; ctx.fillStyle='#fff'; rrect(ctx,280,TY-34,240,34,8); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(520,TY-17,6,17,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); textAt(ctx,'chalk',400,TY-44,{align:'center',size:12,weight:700,color:COL.blue}); }
    fragsDraw(ctx,C.pcs,'#ffffff',COL.blue);
    const s=C.st; impactStar(ctx,s.x,s.y.x+SR*0.62,C.star,COL.yellow);
    ctx.save(); ctx.translate(s.x,s.y.x); polyPath(ctx,lumpPoly(99,SR,11,0.62),0,0); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(-14,-10,20,Math.PI*1.1,Math.PI*1.6); ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    if(s.fall) vec(ctx,s.x+SR+30,s.y.x-20,s.x+SR+30,s.y.x+30,COL.yellow,3);

  };

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save();
    if(part===0){ stepA(dt); camFit(ctx,w,h,[130,60,670,490]); drawA(ctx); }

      setv($,'k3',A.opened?'Yes — unfold':'—'); setc($,'k3',COL.green); setv($,'k4','No'); setc($,'k4',COL.blue); }
    if(part===1){ const l=lam(); $('#k1').previousElementSibling.textContent='Balloon width'; setv($,'k1',B.burst?'—':fmt(6*l,1)+' cm'); $('#k2').previousElementSibling.textContent='Air inside'; setv($,'k2',B.burst?'escaped':fmt(B.V/1000,2)+' L');
      setv($,'k3',B.burst?'No — torn':(l<1.03&&B.V<=V0*1.02&&B.hiss<0.05&&!B.grip?'Yes':'—')); setc($,'k3',B.burst?COL.red:COL.green); setv($,'k4','No'); setc($,'k4',COL.blue); }
    if(part===2){ $('#k1').previousElementSibling.textContent='Pieces'; setv($,'k1',C.stick?'1':String(C.pcs.length)); $('#k2').previousElementSibling.textContent='Biggest piece';
      const big=C.stick?80:C.pcs.reduce((a,p)=>Math.max(a,p.r*2*10/34),0); setv($,'k2',C.stick?'8 cm stick':(big>0?fmt(big,0)+' mm':'powder'));
      setv($,'k3',!C.stick&&C.st.hits>0?'No':'—'); setc($,'k3',COL.red); setv($,'k4','No'); setc($,'k4',COL.blue); }
  });
  return wrap;
}


/* =====================================================================
   5.3 BLOW INTO TAP WATER (A) AND LIME WATER (B)
   One breath ≈ 0.45 L of air with 4 % CO₂ ≈ 0.73 mmol CO₂. As the
   bubbles rise, ~15 % of it dissolves. In lime water (saturated
   Ca(OH)₂, 0.020 M → 50 mL holds 1.0 mmol) every mmol taken up makes
   1 mmol of insoluble calcium carbonate: Ca(OH)₂ + CO₂ → CaCO₃ + H₂O.
   Cloudiness = 1 − e^(−n/0.25 mmol), so the first breath already hazes it
   and 3–4 breaths make it milky. Tap water only bubbles.
   Leave it: the specks (≈ 5 µm) sink by Stokes' law, v = 2Δρgr²/9η
   ≈ 2 × 10⁻⁵ m/s, so they reach the bottom in ~ 25 min (shown ×150).
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Blow air out through a straw</label>
      <div class="toggle-group"><button class="toggle-btn play" id="bA">Into A</button><button class="toggle-btn play" id="bB">Into B</button></div>
      <button class="toggle-btn navy" id="wait">Leave it for some time</button>
      <div class="toggle-group"><button class="toggle-btn small" id="rs">↺ Fresh tumblers</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','A · tap water',COL.blue)}${card('k2','B · lime water',COL.blue)}${card('k3','Breaths into B')}${card('k4','Time left standing')}</div>
      <div class="result-cards" style="margin-top:6px">${card('k5','New substance?',COL.red)}${card('k6','Change')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TOP=196, BOT=430, RT=84, RB=70, LEV=BOT-(BOT-TOP)*0.3, NB=16;
  const G=[{x:320,lime:false},{x:620,lime:true}];
  let t=0, st;
  const fresh=()=>{ st={head:{x:spr(380),y:spr(90)},who:-1,queue:[],blow:0,puff:spr(0),breaths:[0,0],ca:1.0,bins:[new Float32Array(NB),new Float32Array(NB)],sed:[0,0],bub:[[],[]],rings:[[],[]],settle:0,clock:0,made:0}; };
  fresh();
  const blowInto=i=>{ sfxCtx(); if(st.settle>0) return; if(st.who<0){ st.who=i; st.blow=1.6; st.breaths[i]++; } else if(st.queue.length<4) st.queue.push(i); };
  $('#bA').onclick=()=>blowInto(0); $('#bB').onclick=()=>blowInto(1);
  $('#wait').onclick=()=>{ if(st.who<0) st.settle=24; else st.settleQ=true; };
  $('#rs').onclick=fresh;
  const turb=n=>1-Math.exp(-n/0.25);

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[70,30,730,500]);
    // ---- the person moves to a straw, then blows ----
    const tgt=st.who>=0?strawTop(st.who):{x:470,y:110};
    springTo(st.head.x,tgt.x-57,22,8,dt); springTo(st.head.y,tgt.y-10,22,8,dt);
    const there=st.who>=0&&Math.abs(st.head.x.x-(tgt.x-57))<3&&Math.abs(st.head.y.x-(tgt.y-10))<3;
    if(st.blow>0&&there){ st.blow-=dt; const i=st.who, g=G[i], bx=g.x-34;
      if(Math.random()<dt*34) bubAdd(st.bub[i],bx+(Math.random()-0.5)*6,BOT-14,2.5+Math.random()*3.5,(Math.random()-0.5)*120);
      const co2=0.73/1.6*dt, took=co2*0.15;                        // mmol CO₂ blown and dissolved this frame
      if(g.lime){ const m=Math.min(took,st.ca); st.ca-=m; st.made+=m; for(let k=0;k<NB;k++) st.bins[1][k]+=m; }
      // bubbling stirs the liquid: the cloud evens out
      [0,1].forEach(j=>{ const b=st.bins[j]; if(j!==i) return; let s=0; for(let k=0;k<NB;k++) s+=b[k]; for(let k=0;k<NB;k++) b[k]=approach(b[k],s/NB,4,dt); });
      if(st.blow<=0){ st.who=-1; if(st.queue.length){ const n=st.queue.shift(); st.who=n; st.blow=1.6; st.breaths[n]++; } else if(st.settleQ){ st.settleQ=false; st.settle=24; } } }
    springTo(st.puff,st.blow>0&&there?1:0,40,8,dt);
    // ---- settling: three sizes of speck, Stokes speeds 0.5, 1, 2 × (≈ 0.036 px/s real, ×150 shown) ----
    if(st.settle>0){ st.settle-=dt; st.clock+=dt*150/60; const b=st.bins[1], H=(BOT-LEV)/NB;
      for(let s=0;s<3;s++){ const vs=0.036*150*[0.5,1,2][s], f=clamp(vs*dt/H,0,1); for(let k=NB-1;k>=0;k--){ const move=b[k]/3*f; b[k]-=move; if(k===NB-1) st.sed[1]+=move; else b[k+1]+=move; } } }
    [0,1].forEach(i=>bubStep(st.bub[i],dt,x=>LEV,y=>tumblerX(G[i].x,TOP,BOT,RT,RB,y)[0],y=>tumblerX(G[i].x,TOP,BOT,RT,RB,y)[1],st.rings[i]));

    // ---- draw ----
    table5(ctx,BOT);
    G.forEach((g,i)=>{ const b=st.bins[i];
      tumbler(ctx,g.x,TOP,BOT,RT,RB,{level:LEV,wob:st.who===i&&st.blow>0?Math.sin(t*20)*2:0,liq:'#dcebfa',inside:()=>{
        const H=(BOT-LEV)/NB, R=rng(7+i); for(let k=0;k<NB;k++){ const a=turb(b[k]*1.0); if(a<0.01) continue; ctx.fillStyle=`rgba(246,246,242,${0.97*a})`; ctx.fillRect(g.x-RT,LEV+k*H-0.5,2*RT,H+1);
          ctx.fillStyle=`rgba(129,149,171,${0.75*a})`; const n=Math.round(a*14); for(let d=0;d<n;d++){ const px=g.x-RT+R()*2*RT, py=LEV+k*H+R()*H+Math.sin(t*2+d)*0.8; ctx.fillRect(px,py,1.6,1.6); } }
        const sh=Math.min(14,st.sed[i]/NB*30); if(sh>0.3){ ctx.fillStyle='#ffffff'; ctx.fillRect(g.x-RT,BOT-sh,2*RT,sh+2); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(g.x-RT,BOT-sh); ctx.lineTo(g.x+RT,BOT-sh); ctx.stroke();
          for(let k=0;k<22;k++) circ(ctx,g.x-RB+6+k*6.2,BOT-sh*0.5+Math.sin(k*2.1)*sh*0.25,0.9,COL.mid,COL.mid,1); }
        bubDraw(ctx,st.bub[i],COL.green,st.rings[i]); }});
      // straw: into the liquid, up, bent over toward the mouth
      const sx=g.x-34, top=strawTop(i); ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
      const sp=[[sx,BOT-12],[sx,TOP-40],[sx-8,top.y-6],[top.x,top.y]];
      ctx.beginPath(); sp.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=COL.ink; ctx.lineWidth=9; ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.stroke(); ctx.restore();
      if(st.who===i&&st.blow>0&&there){ ctx.save(); ctx.setLineDash([6,8]); ctx.lineDashOffset=-t*80; ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(top.x,top.y); ctx.lineTo(sx-8,top.y-6); ctx.lineTo(sx,TOP-40); ctx.lineTo(sx,BOT-16); ctx.stroke(); ctx.restore(); }
      textAt(ctx,i===0?'A':'B',g.x-44,BOT+32,{align:'center',size:20,weight:700,color:COL.ink});
      textAt(ctx,i===0?'tap water':'lime water',g.x-28,BOT+30,{size:13,weight:600,color:COL.blue});
      const tb=turb(b.reduce((s,c)=>s+c,0)/NB); if(tb>0.55) tag(ctx,'milky',g.x+RT-24,LEV-22,COL.red,{size:12,alpha:clamp((tb-0.55)*4,0,1)}); });
    // ---- the face (side view): cheeks swell while blowing ----
    const hx=st.head.x.x, hy=st.head.y.x, pf=st.puff.x;
    ctx.save(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(hx-40,hy-40); ctx.bezierCurveTo(hx-20,hy-78,hx+44,hy-72,hx+50,hy-26); ctx.lineTo(hx+60,hy-10); ctx.lineTo(hx+50,hy-6);
    ctx.quadraticCurveTo(hx+54+pf*6,hy+2,hx+56,hy+10); ctx.quadraticCurveTo(hx+46+pf*14,hy+28+pf*4,hx+38,hy+34); ctx.quadraticCurveTo(hx+18,hy+46,hx-6,hy+36); ctx.lineTo(hx-14,hy+62); ctx.moveTo(hx-40,hy-40); ctx.quadraticCurveTo(hx-56,hy+4,hx-30,hy+40); ctx.lineTo(hx-32,hy+62); ctx.fill(); ctx.stroke();
    circ(ctx,hx+30,hy-26,2.6,COL.ink,COL.ink,1); ctx.beginPath(); ctx.arc(hx-18,hy-4,9,-Math.PI*0.5,Math.PI*0.5); ctx.stroke();
    if(pf>0.05){ ctx.beginPath(); ctx.arc(hx+34,hy+14,10+pf*6,-0.9,1.2); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.stroke(); }
    ctx.restore();
    if(st.blow>0&&there) tag(ctx,'breathing out',hx,hy-96,COL.yellow,{size:12});

    if(mB>0.5){ ctx.save(); ctx.globalAlpha=clamp((mB-0.5)*3,0,1); textAt(ctx,'calcium hydroxide + carbon dioxide → calcium carbonate + water',400,490,{align:'center',size:13,weight:700,color:COL.red}); ctx.restore(); }
    if(st.sed[1]>0.2) leader(ctx,G[1].x+20,BOT-5,G[1].x+22,BOT-58,'white solid',COL.red);
    ctx.restore();
