<style>

  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;

}

.qa-input{width:100%; margin-top:7px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:var(--fs-sm); color:var(--text-1); background:var(--surface-1);}

.nav-item .n-num{line-height:1.15; text-align:center;}

<div class="app">

<script>

/* =========================================================================
   GRADE 6 — CHAPTER 5: MEASUREMENT OF LENGTH AND MOTION
   Activities 5.1–5.7. Every scene runs on a continuous animation loop:
   sliders and buttons only set a TARGET; objects glide there on a
   spring. Readings come from a real sight line (parallax), handspans
   walk along the table, falling things follow ½gt², a whirled eraser
   is a true conical pendulum (cos α = g/ω²L) and flies off along the
   tangent when let go, pendulums obey θ″ = −(g/L)·sin θ, the steel
   strip vibrates in its real cantilever mode (f = 0.56·√(EI/ρA)/L²).
   Colour rule: red = moving object · its path
   blue = reference point · distance · scale
   yellow = what you do · force · eye line · green = correct reading · rest position.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', navy:'#1a3a5c'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. SHARED HELPERS — virtual stage, Q→A banner, stick figures,
       cat, cups, particles (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
/* every scene draws on an 800 × 470 virtual stage, fitted into the canvas */
const VW=800, VH=520, BANNER=46;
function stage(ctx,w,h){
  const s=Math.min(w/VW,(h-BANNER-6)/VH), ox=(w-VW*s)/2, oy=BANNER+Math.max(0,(h-BANNER-VH*s)/2);
  ctx.translate(ox,oy); ctx.scale(s,s); return s;
}
/* stick figure — feet on (x,y), height s. angles from straight-down, + = toward +x */
function stick(ctx,x,y,s,o){
  o=o||{}; const c=o.col||COL.ink, W=o.lw||Math.max(2,s*0.02);
  const th=0.25*s, sh=0.25*s, ua=0.17*s, fa=0.16*s;

/* =====================================================================
   5.5  LET US INVESTIGATE — an eraser hanging on a thread
   Pull it aside and let go: θ″ = −(g/L)·sin θ − c·θ′ (RK4, real time).
   For small swings one to-and-fro takes T = 2π·√(L/g): 1.27 s for
   40 cm, 2.0 s for 1 m. A playground swing (2.2 m) takes about 3 s —
   the same law. Air drag c = 0.04 /s lets it die away slowly.

function buildA5(){ return buildScene(wrap=>{

      <div class="toggle-group" id="gP"><button class="toggle-btn" id="pu">👐 Give a push</button></div></div>`;
  S.cards=card('cO','To-and-fro count')+card('cP','One to-and-fro takes')+card('cF','T = 2π√(L/g)')+card('cA','Angle now');
  S.tail=`<div class="control-group"><label>What did you see?</label>${logTable('tL',['Thing','Length','One to-and-fro'])}</div>`;

  S.wire=$=>{
    wireChips(wrap,'mC',i=>{ mode=i; th={x:0,v:0}; reset(); ui($); });
    $('#lS').oninput=()=>{ Ls[0]=+$('#lS').value; reset(); ui($); };
    $('#aS').oninput=()=>{ amp=+$('#aS').value; if(held) th.v=0; ui($); };
    $('#go').onclick=()=>{ if(!held) return; held=false; th.v=0; osc=0; lastCross=null; per=null; tr=[]; };
    $('#hd').onclick=()=>reset();
    $('#pu').onclick=()=>{ if(held) return; const d=Math.sign(th.v)||1; th.v+=d*0.18; pushT=0.4; };
    ui($);
  };
  let tt=0;
  S.tick=(dt,ctx,t,$)=>{
    tt+=dt; const l=L(), w2=G/l, A=amp*Math.PI/180;

        const k1x=th.v, k1v=f(th.x,th.v), k2x=th.v+k1v*h/2, k2v=f(th.x+k1x*h/2,th.v+k1v*h/2), k3x=th.v+k2v*h/2, k3v=f(th.x+k2x*h/2,th.v+k2v*h/2), k4x=th.v+k3v*h, k4v=f(th.x+k3x*h,th.v+k3v*h);
        const nx=th.x+(k1x+2*k2x+2*k3x+k4x)*h/6; th.v+=(k1v+2*k2v+2*k3v+k4v)*h/6;

    pushT=Math.max(0,pushT-dt);
    const K=mode===0?380:165, PX=400, PY=mode===0?62:36, Lp=l*K;
    const bx=PX+Math.sin(th.x)*Lp, by=PY+Math.cos(th.x)*Lp;

    /* rest position + angle arc */
    line(ctx,PX,PY,PX,PY+Lp+40,COL.green,1.6,[6,5]); textAt(ctx,'rest position',PX+6,PY+Lp+52,{size:11,weight:600,color:COL.green});
    const amax=held?th.x:A; ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(PX,PY,Lp,Math.PI/2-Math.abs(amax)-0.02,Math.PI/2+Math.abs(amax)+0.02); ctx.stroke(); ctx.restore();
    if(tr.length>1){ ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=3; ctx.lineCap='round'; ctx.globalAlpha=0.55; ctx.beginPath(); tr.slice(-140).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); }
    if(mode===0){

      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(PX-210,-10); ctx.quadraticCurveTo(PX-90,30,PX-18,PY-10); ctx.stroke(); ctx.restore();
      ctx.save(); rrect(ctx,PX-22,PY-24,36,26,9); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      line(ctx,PX,PY,bx,by,COL.ink,1.6);
      ctx.save(); ctx.translate(bx,by); ctx.rotate(th.x); rrect(ctx,-17,0,34,22,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.stroke(); line(ctx,-6,0,-6,22,COL.red,1.4); ctx.restore();
      if(held){ const fx=bx+18*Math.cos(th.x), fy=by+10; ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(fx+70,fy+40); ctx.lineTo(fx+6,fy+4); ctx.moveTo(fx+70,fy+52); ctx.lineTo(fx+4,fy+18); ctx.stroke(); ctx.restore(); }

      if(pushT>0){ const d=th.v>=0?-1:1; ctx.save(); ctx.globalAlpha=clamp(pushT*3,0,1); vec(ctx,bx+d*90,by-60,bx+d*30,by-60,COL.yellow,4); ctx.restore(); }
      textAt(ctx,'2.2 m',PX-14,PY+Lp/2,{align:'right',size:12,weight:700,color:COL.blue});

/* =====================================================================
   5.6  LET US INVESTIGATE — a thin metal strip held under books
   A steel strip 2 cm wide, 0.5 mm thick: EI = E·b·t³/12 = 0.417 N·m²,
   mass per metre ρA = 0.0785 kg/m. Its free end vibrates in the first
   cantilever mode: f = (1.875²/2π)·√(EI/ρA) / L² = 1.29 / L² Hz
   (14 Hz for 30 cm, 8 Hz for 40 cm) with the exact mode shape
   φ(x) = cosh βx − cos βx − 0.734·(sinh βx − sin βx), β = 1.875/L.
   It sags under its own weight by q·L⁴/8EI. Damping ζ = 0.012.
   At real speed it is a blur — slow motion shows each up-and-down.
   ===================================================================== */
function buildA6(){ return buildScene(wrap=>{
  const S={q:'Press the free end and let go. How does the end move?'};
  const EI=0.4167, RA=0.0785, Q=RA*9.8, ZETA=0.012;
  let L=0.3, press=0.03, held=false, released=false, tR=0, amp=0, ampS={x:0,v:0}, slowI=1, simT=0, hist=[], cycles=0, prevS=0, log={};
  const SLOW=[1,0.1,0.025];
  S.html=`
    ${slider('lS','Length sticking out',0.15,0.4,0.01,0.3)}
    ${slider('pS','Press the end down by',0.5,4,0.1,3)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="pr">👇 Press</button><button class="toggle-btn play" id="go">✋ Let go</button></div></div>
    <div class="control-group"><label>Watch at</label>${chipList('vC',['Real speed','×1/10 slow','×1/40 slow'],1)}</div>`;
  S.cards=card('cF','Up-and-downs each second')+card('cT','One up-and-down takes')+card('cN','Up-and-downs seen')+card('cY','End is now');
  S.tail=`<div class="control-group"><label>Strip sticking out</label>${logTable('tL',['Length','Up-and-downs / s','Motion'])}</div>`;
  const freq=()=>1.875*1.875/(2*Math.PI)*Math.sqrt(EI/RA)/(L*L);
  function phi(x){ const b=1.875/L, z=b*x; return (Math.cosh(z)-Math.cos(z)-0.7341*(Math.sinh(z)-Math.sin(z)))/2.0; }   // φ(L) ≈ 1
  const phiL=()=>phi(L);
  const sag=x=>Q*x*x*(6*L*L-4*L*x+x*x)/(24*EI);
  S.wire=$=>{
    $('#lS').oninput=()=>{ L=+$('#lS').value; held=false; released=false; amp=0; cycles=0; hist=[]; $('#lSV').textContent=Math.round(L*100)+' cm'; };
    $('#pS').oninput=()=>{ press=+$('#pS').value/100; $('#pSV').textContent=fmt(press*100,1)+' cm'; };
    $('#pr').onclick=()=>{ held=true; released=false; };
    $('#go').onclick=()=>{ if(!held){ held=true; ampS.x=press; ampS.v=0; } held=false; released=true; tR=0; simT=0; amp=ampS.x; cycles=0; hist=[]; prevS=1; };
    wireChips(wrap,'vC',i=>{ slowI=i; });
    $('#lSV').textContent='30 cm'; $('#pSV').textContent='3 cm';
  };
  S.tick=(dt,ctx,t,$)=>{
    const f=freq(), w=2*Math.PI*f, sl=SLOW[slowI], sdt=dt*sl;
    if(held){ springTo(ampS,press,120,18,dt); }
    else if(!released) springTo(ampS,0,120,18,dt);
    let y=0; // tip displacement (m, + = down)
    if(released){ tR+=sdt; simT+=sdt; y=amp*Math.cos(w*tR)*Math.exp(-ZETA*w*tR);
      const s=Math.sign(Math.sin(w*tR)); if(prevS<0&&s>=0&&Math.exp(-ZETA*w*tR)>0.05) cycles++; prevS=s;
      for(let k=1;k<=8;k++){ const tk=tR-sdt+sdt*k/8; hist.push([simT-sdt+sdt*k/8,amp*Math.cos(w*tk)*Math.exp(-ZETA*w*tk)]); } while(hist.length&&hist[0][0]<simT-Math.max(3/f,0.4)) hist.shift(); }
    else y=ampS.x;
    /* scene: table, books, strip */
    const K=1050, EX=290, TY=250;
    ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillRect(-20,TY+4,EX+20,18); ctx.strokeRect(-20,TY+4,EX+20,18); ctx.restore();
    line(ctx,EX-30,TY+22,EX-30,500,COL.ink,5); line(ctx,30,TY+22,30,500,COL.ink,5); ground(ctx,0,800,500);
    const strip=(yt,alpha,col,w)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(EX-(0.5-L)*K,TY+2);
      for(let i=0;i<=40;i++){ const x=L*i/40; const yy=sag(x)+yt*phi(x)/phiL(); const X=EX+x*K, Y=TY+2+yy*K; ctx.lineTo(X,Y); } ctx.stroke(); ctx.restore(); };
    /* rest-position line */
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.4; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(EX,TY+2); for(let i=0;i<=40;i++){ const x=L*i/40; ctx.lineTo(EX+x*K,TY+2+sag(x)*K); } ctx.stroke(); ctx.restore();
    textAt(ctx,'rest position',EX+8,TY+20+sag(0.02)*K,{size:11,weight:600,color:COL.green});
    const blur=released&&f*sl>4;
    if(blur){ const env=amp*Math.exp(-ZETA*w*tR); for(let k=0;k<10;k++){ strip(env*Math.cos(k/10*Math.PI*2+t*7),0.13,COL.red,3); } strip(y,0.45,COL.red,3); }
    else strip(y,1,COL.red,3.4);
    /* books on the clamped end */
    [[EX-150,140,30],[EX-160,150,26],[EX-145,128,24]].reduce((yb,[x,w,h])=>{ ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; rrect(ctx,x,yb-h,w,h,3); ctx.fill(); ctx.stroke(); ctx.restore(); line(ctx,x+8,yb-h*0.5,x+w-8,yb-h*0.5,COL.mid,1); return yb-h; },TY+2);
    /* the finger that presses */
    const tipX=EX+L*K, tipY=TY+2+(sag(L)+y)*K;
    const fy=held||(!released&&ampS.x>0.001)?tipY-4:approach(S._fy||tipY-4,TY-120,4,dt); S._fy=fy;
    ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.8; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(tipX-14,fy-110); ctx.lineTo(tipX-10,fy-12); ctx.arc(tipX-2,fy-12,8,Math.PI,0,true); ctx.lineTo(tipX+8,fy-110); ctx.stroke(); ctx.restore();
    /* up–down scale beside the tip */
    const sx=tipX+44; line(ctx,sx,TY-50,sx,TY+60,COL.blue,1.4); for(let c=-4;c<=4;c++){ const yy=TY+2+sag(L)*K+c*0.01*K; line(ctx,sx,yy,sx+(c%2===0?10:5),yy,COL.blue,1.2); if(c%2===0&&c) textAt(ctx,(c>0?'↓':'↑')+Math.abs(c)+' cm',sx+14,yy+4,{size:10,weight:600,color:COL.blue}); }
    circ(ctx,sx,tipY,4,COL.red,COL.red,1);
    /* tip trace: y against time */
    const ch=miniChart(ctx,330,350,440,150,[0,Math.max(3/f,0.4)],[-0.045,0.045],[],{xl:'time →',yl:'end of the strip'});
    if(hist.length>1){ const t0=hist[0][0]; ctx.save(); ctx.beginPath(); ctx.rect(330,350,440,150); ctx.clip(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.2; ctx.beginPath();
      hist.forEach((p,i)=>{ const X=ch.px(p[0]-t0), Y=ch.py(-p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); ctx.restore(); }
    line(ctx,ch.px(0),ch.py(0),ch.px(Math.max(3/f,0.4)),ch.py(0),COL.green,1.2,[4,4]);
    if(released&&cycles>=3){ log[Math.round(L*100)]=f; }
    setv($,'cF',fmt(f,1)); setv($,'cT',fmt(1/f,3)+' s'); setv($,'cN',String(cycles)); setv($,'cY',Math.abs(y)<0.0005?'at rest position':(y>0?'below rest by ':'above rest by ')+fmt(Math.abs(y)*100,1)+' cm');
    setLog($,'tL',Object.keys(log).sort((a,b)=>a-b).map(k=>[k+' cm',{t:fmt(log[k],1),c:'g'},'up and down (oscillatory)']));
  };
  S.found=()=>Object.keys(log).length>=1?'The free end moves up and down about its rest position again and again — oscillatory motion.':'';
  S.fb=()=>Object.keys(log).length===1?['ok','Try a shorter length: the strip vibrates faster (f ∝ 1/L²).']:released&&slowI===0?['warn','Too fast to see — choose slow motion.']:null;
  return S;
}); }

/* =====================================================================
   5.7  LET US IDENTIFY — motion in a children's park (Fig. 5.18)
   Everything runs at once, in real time:
   swing — pendulum, L = 2 m, θ = 28°·sin(√(g/L)·t), one to-and-fro 2.8 s;
   see-saw — rocks ±13° every 3.2 s; merry-go-round — one turn in 5 s;
   giant wheel — one turn in 14 s, cabins stay hanging down;
   slide — 35° slope, a = g(sin θ − μ cos θ) = 3.2 m/s² (μ = 0.3);
   ball — rolled along the path, slows at 0.5 m/s² (rolling friction).
   Pick one: its path is traced in red, then say which kind it is.
   ===================================================================== */
function buildA7(){ return buildScene(wrap=>{
  const S={q:'Classify each motion: linear, circular or oscillatory?'};
  const G=9.8, GY=452;
  const OBJ=[
    {n:'Swing',k:'osc',why:'moves to and fro'},
    {n:'Slide',k:'lin',why:'slides along a straight line'},
    {n:'See-saw',k:'osc',why:'moves up and down, to and fro'},
    {n:'Merry-go-round',k:'cir',why:'goes round a circle'},
    {n:'Giant wheel',k:'cir',why:'goes round a circle'},
    {n:'Rolling ball',k:'lin',why:'rolls along a straight line'},
  ];
  const KN={lin:'Linear',cir:'Circular',osc:'Oscillatory'};
  let sel=0, trail=[], res={}, last=null;
  const sl={ph:0,t:0,s:0,v:0}, ball={x:-0.5,v:0,t:0,ph:0,ang:0};
  S.html=`
    <div class="control-group"><label>Watch</label>${chipList('oC',OBJ.map(o=>o.n),0)}</div>
    <div class="control-group"><label>Its motion is</label><div class="toggle-group"><button class="toggle-btn" id="kL">Linear</button><button class="toggle-btn" id="kC">Circular</button><button class="toggle-btn" id="kO">Oscillatory</button></div></div>`;
  S.cards=card('cR','Repeats every')+card('cK','Classified');
  S.tail=`<div class="control-group"><label>Table 5.4 · Types of motion</label>${logTable('tL',['Object','Motion','Why'])}</div>`;
  S.wire=$=>{
    wireChips(wrap,'oC',i=>{ sel=i; trail=[]; last=null; });
    const pick=k=>{ const o=OBJ[sel], ok=o.k===k; last={ok,k}; if(ok||!res[o.n]||!res[o.n].ok) res[o.n]={ok,k}; };
    $('#kL').onclick=()=>pick('lin'); $('#kC').onclick=()=>pick('cir'); $('#kO').onclick=()=>pick('osc');
  };
  S.tick=(dt,ctx,t,$)=>{
    sky(ctx,GY,'#e8f4fd','#fafdff'); soilBand(ctx,-50,850,GY,90,'#eef4e6');
    line(ctx,0,GY+44,800,GY+44,'#d8e2cc',2,[12,8]);
    const col=i=>i===sel?COL.red:COL.ink;
    let tp=null;
    /* ---- giant wheel (back) ---- */
    { const C=[640,196], R=112, a0=t*2*Math.PI/14;
      line(ctx,C[0],C[1],C[0]-70,GY,COL.ink,3); line(ctx,C[0],C[1],C[0]+70,GY,COL.ink,3);
      circ(ctx,C[0],C[1],R,col(4),null,2.4); circ(ctx,C[0],C[1],8,col(4),'#fff',2);
      for(let i=0;i<8;i++){ const a=a0+i*Math.PI/4, x=C[0]+Math.cos(a)*R, y=C[1]+Math.sin(a)*R;
        line(ctx,C[0],C[1],x,y,col(4),1.2); line(ctx,x,y,x,y+10,col(4),1.6);
        ctx.save(); rrect(ctx,x-11,y+10,22,16,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=i===0?COL.red:col(4); ctx.lineWidth=i===0?2.6:1.8; ctx.stroke(); ctx.restore();
        if(i===0&&sel===4) tp=[x,y+18]; } }
    /* ---- swing ---- */
    { const P=[150,236], L=2, K=88, w=Math.sqrt(G/L), th=0.49*Math.sin(w*t);
      line(ctx,70,236,230,236,COL.ink,4); line(ctx,70,236,52,GY,COL.ink,3.4); line(ctx,230,236,248,GY,COL.ink,3.4);
      const bx=P[0]+Math.sin(th)*L*K, by=P[1]+Math.cos(th)*L*K;
      line(ctx,P[0]-5,P[1],bx-12*Math.cos(th),by+12*Math.sin(th),col(0),1.4); line(ctx,P[0]+5,P[1],bx+12*Math.cos(th),by-12*Math.sin(th),col(0),1.4);
      line(ctx,bx-14*Math.cos(th),by+14*Math.sin(th),bx+14*Math.cos(th),by-14*Math.sin(th),col(0),4);
      const KS=62, LL=[1.45-th,0.15-th*0.4], LR=[1.3-th,0.2-th*0.4], dr=Math.max(Math.cos(LL[0])*0.25*KS+Math.cos(LL[1])*0.25*KS,Math.cos(LR[0])*0.25*KS+Math.cos(LR[1])*0.25*KS);
      stick(ctx,bx,by-2+dr,KS,{lean:-th,legL:LL,legR:LR,armL:[Math.PI-th-0.1,Math.PI-th],armR:[Math.PI-th+0.1,Math.PI-th],col:col(0),lw:2});
      if(sel===0) tp=[bx,by]; }
    /* ---- slide: climb, sit, slide down (a = g(sinθ − μcosθ)), walk back ---- */
    { const top=[300,300], bot=[442,GY-6], Ls=3.0, th=35*Math.PI/180, a=G*(Math.sin(th)-0.3*Math.cos(th));
      ctx.save(); ctx.strokeStyle=col(1); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(top[0],top[1]); ctx.quadraticCurveTo(top[0]+10,top[1],top[0]+16,top[1]+6); ctx.lineTo(bot[0]-10,bot[1]-2); ctx.quadraticCurveTo(bot[0],bot[1],bot[0]+16,bot[1]); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(top[0],top[1]-14); ctx.lineTo(top[0]+16,top[1]-8); ctx.lineTo(bot[0]-8,bot[1]-16); ctx.stroke(); ctx.restore();
      line(ctx,top[0]-6,top[1],top[0]-30,GY,COL.ink,3); line(ctx,top[0]+12,top[1],top[0]-12,GY,COL.ink,3); for(let r=1;r<7;r++){ const f=r/7; line(ctx,lerp(top[0]-6,top[0]-30,f),lerp(top[1],GY,f),lerp(top[0]+12,top[0]-12,f),lerp(top[1],GY,f),COL.ink,1.6); }
      line(ctx,bot[0]-30,bot[1]-12,bot[0]-30,GY,COL.ink,2.4);
      sl.t+=dt; let cx,cy,pose='walk';
      if(sl.ph===0){ const f=Math.min(1,sl.t/2.6); cx=lerp(top[0]-22,top[0]+4,f); cy=lerp(GY,top[1]-2,f); pose='climb'; if(f>=1){ sl.ph=1; sl.t=0; } }
      else if(sl.ph===1){ cx=top[0]+8; cy=top[1]-4; pose='sit'; if(sl.t>0.7){ sl.ph=2; sl.t=0; sl.s=0; sl.v=0; if(sel===1) trail=[]; } }
      else if(sl.ph===2){ sl.v+=a*dt; sl.s+=sl.v*dt; const f=Math.min(1,sl.s/Ls); cx=lerp(top[0]+16,bot[0]-6,f); cy=lerp(top[1]-4,bot[1]-12,f); pose='sit'; if(f>=1){ sl.ph=3; sl.t=0; } }
      else { const f=Math.min(1,sl.t/2.2); cx=lerp(bot[0]+8,top[0]-26,f); cy=GY; pose='walk'; if(f>=1){ sl.ph=0; sl.t=0; } }
      const KS=60;
      if(pose==='sit'){ const q=sl.ph===2?-0.35:0, LL=[1.5,1.3], dr=Math.cos(1.5)*0.25*KS+Math.cos(1.3)*0.25*KS; stick(ctx,cx,cy+dr*0+8,KS,{lean:q*0.4,legL:[1.45+q,1.2+q],legR:[1.4+q,1.25+q],armL:[0.5,0.3],armR:[2.6,2.4],col:col(1),lw:2,dx:0}); }
      else if(pose==='climb'){ const c=Math.sin(sl.t*8); stick(ctx,cx,cy,KS,{legL:[0.5+0.4*c,-0.2],legR:[0.5-0.4*c,-0.2],armL:[2.6+0.3*c,2.8],armR:[2.6-0.3*c,2.8],col:col(1),lw:2}); }
      else { const c=Math.sin(sl.t*9); stick(ctx,cx,cy,KS,{legL:[-0.35*c,-0.1],legR:[0.35*c,0.1],armL:[0.4*c,0.1],armR:[-0.4*c,0.1],col:col(1),lw:2,face:-1}); }
      if(sel===1&&sl.ph===2) tp=[cx,cy-10]; }
    /* ---- see-saw ---- */
    { const C=[545,GY-22], Lb=92, th=0.23*Math.sin(2*Math.PI*t/3.2);
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(C[0]-16,GY); ctx.lineTo(C[0],C[1]); ctx.lineTo(C[0]+16,GY); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      const ex=Math.cos(th)*Lb, ey=Math.sin(th)*Lb; line(ctx,C[0]-ex,C[1]-ey,C[0]+ex,C[1]+ey,col(2),4.5);
      [-1,1].forEach(sd=>{ const sx=C[0]+sd*ex*0.85, sy=C[1]+sd*ey*0.85, KS=58, LL=[-sd*0.5,-sd*0.05], LR=[-sd*0.4,0];
        const dr=Math.max(Math.cos(LL[0])*0.25*KS+Math.cos(LL[1])*0.25*KS,Math.cos(LR[0])*0.25*KS+Math.cos(LR[1])*0.25*KS);
        stick(ctx,sx,sy-3+dr,KS,{lean:-sd*0.1,legL:LL,legR:LR,armL:[-sd*1.2,-sd*1.6],armR:[-sd*1.1,-sd*1.5],col:col(2),lw:2,face:-sd}); });
      if(sel===2) tp=[C[0]+ex*0.85,C[1]+ey*0.85-4]; }
    /* ---- merry-go-round (front right) ---- */
    { const C=[712,GY+18], RR=76, sq=0.3, a0=t*2*Math.PI/5;
      ctx.save(); ctx.strokeStyle=col(3); ctx.lineWidth=2.4; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(C[0],C[1]+10,RR,RR*sq,0,0,7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(C[0],C[1],RR,RR*sq,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore();
      line(ctx,C[0],C[1],C[0],C[1]-80,col(3),3);
      [0,1,2].map(i=>{ const a=a0+i*2.094; return {i,a,x:C[0]+Math.cos(a)*RR*0.72,y:C[1]+Math.sin(a)*RR*0.72*sq,d:Math.sin(a)}; }).sort((p,q)=>p.d-q.d).forEach(s=>{
        const sg=Math.cos(s.a)>0?-1:1; stick(ctx,s.x,s.y,52+s.d*5,{col:s.i===0&&sel===3?COL.red:col(3),lw:2,armR:[2.5*sg,2.8*sg],face:sg});
        if(s.i===0&&sel===3) tp=[s.x,s.y-(52+s.d*5)*0.95]; }); }
    /* ---- ball rolled along the path ---- */
    { const K=60, y=GY+30, r=11; ball.t+=dt;
      if(ball.ph===0){ ball.x=0.4; ball.v=3.0; ball.ph=1; if(sel===5) trail=[]; }
      if(ball.ph===1){ ball.v=Math.max(0,ball.v-0.5*dt); ball.x+=ball.v*dt; ball.ang+=ball.v/(r/K)*dt; if(ball.v===0||ball.x>12.6){ ball.ph=2; ball.t=0; } }
      else if(ball.ph===2&&ball.t>1.2){ ball.ph=0; }
      const bx=ball.x*K+30; circ(ctx,bx,y-r,r,col(5),'#fff',2.4); for(let k=0;k<3;k++){ const a=ball.ang+k*2.094; line(ctx,bx,y-r,bx+Math.cos(a)*r,y-r+Math.sin(a)*r,col(5),1.4); }
      stick(ctx,24,y,58,{armR:ball.ph===1&&ball.x<1?[1.2,1.4]:[0.3,0.2],legL:[-0.2,-0.1],legR:[0.25,0.1],lw:2,col:COL.ink});
      if(sel===5&&ball.ph===1) tp=[bx,y-r]; }
    /* trail of the chosen one */
    if(tp){ trail.push(tp); if(trail.length>420) trail.shift(); }
    if(trail.length>1){ ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.globalAlpha=0.7; ctx.lineCap='round'; ctx.beginPath(); trail.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); }
    const o=OBJ[sel], rep={0:fmt(2*Math.PI*Math.sqrt(2/G),1)+' s',1:'does not repeat by itself',2:'3.2 s',3:'5 s',4:'14 s',5:'does not repeat'}[sel];
    setv($,'cR',rep); setv($,'cK',res[o.n]?KN[res[o.n].k]:'—');
    setLog($,'tL',OBJ.filter(x=>res[x.n]).map(x=>[x.n,{t:KN[res[x.n].k],c:res[x.n].ok?'g':'rd'},res[x.n].ok?x.why:'look again']));
  };
  S.found=()=>OBJ.every(x=>res[x.n]&&res[x.n].ok)?'Swing, see-saw: oscillatory · merry-go-round, giant wheel: circular · slide, ball: linear. Circular and oscillatory motions repeat — periodic.':'';
  S.fb=()=>last?(last.ok?['ok',OBJ[sel].n+': '+KN[last.k].toLowerCase()+' — it '+OBJ[sel].why+'.']:['bad','Watch the red path again.']):null;
  return S;
}); }

  { num:'5.1', tag:'B', title:'Handspan or Metre?', desc:'Five friends measure one table · Table 5.1', build:_b('buildA1b') },

let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}${a.tag?'<br>'+a.tag:''}</span><span class="n-title">${a.title}</span>`;
