<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 7: HEAT TRANSFER IN NATURE
   Activities 7.1 – 7.5 (NCERT Curiosity, gecu107). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. Heat
   creeps along a strip by the real conduction equation, hot air in a cup
   loses mass and tips a hanging balance, a dye streak rides a convection
   cell whose speed grows with the heating, soil and water warm and cool
   by energy balances, and water soaks through clay, sand and gravel by
   Darcy's law behind a Green–Ampt wetting front.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }

    ctx.moveTo(jx-jw/2+8,FLOOR-8); ctx.lineTo(jx+jw/2-8,mid); ctx.lineTo(jx-jw/2+8,jackTop+8); ctx.moveTo(jx+jw/2-8,FLOOR-8); ctx.lineTo(jx-jw/2+8,mid); ctx.lineTo(jx+jw/2-8,jackTop+8); ctx.stroke(); ctx.restore();

    candleDraw(ctx,jx,jackTop,26,56,{lit:flame.x>0.02,f:flame.x,t,fh:42,fw:16});
    // rising hot air (plume) — red wavy streams, spreading as they rise
    if(flame.x>0.05){ for(let k=-2;k<=2;k++){ const hc=cups[side>0?1:0], top=hc.cap>0.3&&hc.my<flameTip?hc.my+30:Math.max(40,flameTip-190); for(let seg=0;seg<3;seg++){ const ph=((t*0.9+seg/3+k*0.13)%1); const y0=flameTip-6-ph*(flameTip-top), spread=(flameTip-y0)*0.12;
        const x0=jx+k*spread*0.9+Math.sin(t*3+k+seg)*2; heatWave(ctx,x0,y0,26,-Math.PI/2+k*0.07,COL.red,t+k,flame.x*0.55*(1-ph),2.5); } } }
    // stick
    ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(-th.x); ctx.lineJoin='round'; rrect(ctx,-Ls*PXM-6,-4,2*Ls*PXM+12,8,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
    for(let k=-5;k<=5;k++) line(ctx,k*40,-1.5,k*40+20,1.5,rgba(COL.ink,0.25),1); ctx.restore();
    circ(ctx,P.x,P.y,4,COL.ink,'#fff',2);
    // level reference + tilt
    line(ctx,P.x-Ls*PXM-20,P.y,P.x+Ls*PXM+20,P.y,rgba(COL.mid,0.6),1.2,[5,5]);
    // cups
    cups.forEach((c,i)=>{ const hx=c.hook.x, hy=c.hook.y, ang=c.phi;
      ctx.save(); ctx.translate(hx,hy); ctx.rotate(-ang);
      line(ctx,0,0,0,THR,COL.ink,1.5);
      const top=THR, bot=THR+CUPH;
      ctx.beginPath(); ctx.moveTo(-CT,top); ctx.lineTo(CT,top); ctx.lineTo(CB,bot); ctx.lineTo(-CB,bot); ctx.closePath();
      ctx.fillStyle=rgba(tempCol(c.T-273),clamp((c.T-T0)/60,0,0.35)); ctx.fill(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(-CB,bot); ctx.lineTo(-CT,top); ctx.lineTo(CT,top); ctx.lineTo(CB,bot); ctx.stroke();
      line(ctx,-CB-3,bot,-CB+4,bot,COL.ink,3); line(ctx,CB-4,bot,CB+3,bot,COL.ink,3);
      // air particles inside: fewer and faster when hot; the extra ones leave through the mouth
      const nT=Math.round(36*T0/c.T); let inside=c.dots.filter(q=>!q.out).length;
      while(inside>nT){ const q=c.dots.find(q=>!q.out); q.out=1; q.vv=-0.9; inside--; }
      while(inside<nT&&c.dots.length<60){ c.dots.push({u:R()*1.6-0.8,v:-0.05,vu:0,vv:0.8,out:0}); inside++; }
      const spd=0.9*Math.sqrt(c.T/T0);
      c.dots.forEach(q=>{ if(q.out){ q.out+=dt; q.v+=q.vv*dt*0.8; q.u+=q.vu*dt; q.vu+=(R()-0.5)*6*dt; }
        else { q.vu+=(R()-0.5)*14*spd*dt; q.vv+=(R()-0.5)*14*spd*dt; const s=Math.hypot(q.vu,q.vv); if(s>spd){ q.vu*=spd/s; q.vv*=spd/s; }
          q.u+=q.vu*dt; q.v+=q.vv*dt; if(q.u<-0.9||q.u>0.9){ q.vu*=-1; q.u=clamp(q.u,-0.9,0.9); } if(q.v>0.94){ q.vv=-Math.abs(q.vv); q.v=0.94; } if(q.v<0.04){ q.vv=Math.abs(q.vv); q.v=0.04; } } });
      for(let k=c.dots.length-1;k>=0;k--) if(c.dots[k].out>1.4) c.dots.splice(k,1);
      if(showDots) c.dots.forEach(q=>{ const y=bot-q.v*CUPH, half=lerp(CB,CT,clamp(q.v,0,1))-5; ctx.save(); ctx.globalAlpha=q.out?clamp(1-q.out/1.4,0,1):1;
        circ(ctx,q.u*half,y,3,tempCol(c.T-273),tempCol(c.T-273),1); ctx.restore(); });
      ctx.restore();
      textAt(ctx,fmt(c.T-273,0)+' °C',c.mx+c.s*(CB+12),c.my-CUPH/2,{align:c.s>0?'left':'right',size:12.5,weight:700,color:c.T>T0+3?COL.red:COL.blue}); });
    // tilt readout arc at the pivot
    if(Math.abs(th.x)>0.01){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(P.x,P.y,70,th.x>0?-th.x:0,th.x>0?0:-th.x,false); ctx.stroke(); ctx.restore(); }
    ctx.restore();
    // ---- readouts ----
    const hot=cups[side>0?1:0];
    setv($,'k1',fmt(hot.T-273,0)+' °C'); setv($,'k2',fmt(200*(hot.T/T0-1),0)+' mL');
    setv($,'k3',fmt(1000*RHO*V*(1-T0/hot.T)*1000,0)+' mg'); setv($,'k4',fmt(Math.abs(th.x)*180/Math.PI,1)+'°'+(Math.abs(th.x)>0.02?(th.x>0?' · right up':' · left up'):''));
    setBtn($('#fire'),lit?'💨 Blow it out':'🔥 Light the candle',lit?'':'play');
    const up=Math.abs(th.x)>0.04, ob=$('#obs');
    if(up&&ob.style.display==='none'){ ob.style.display='block'; ob.className='fb ok'; }
    if(up) setv($,'obs','The '+(th.x>0?'right':'left')+' cup rises — its air is hot, expanded and lighter.');
  });
  return wrap;
}

/* =====================================================================
   7.3 LET US FIND OUT — a grain of potassium permanganate in heated water
   The water moves in a convection cell described by a stream function
       ψ(x,z) = A·sin(πz/H)·sin(2π·ξ(x))
   (ξ warps x so the hot plume above the flame is narrow and fast and the
   cool water sinks slowly and broadly along the sides). Being a stream
   function, the flow never creates or loses water. The rising speed
       U ≈ 4 mm/s · (P/15 W)^⅓ · √(β(T)/β(20 °C))
   grows with the flame and as the water warms (β, water's expansion,
   doubles between 20 and 50 °C). Dye specks are carried by the flow
   (RK2) and spread by diffusion; the grain dissolves faster when the
   water flows past it. Flow shown ×4, water temperature by m·c·dT/dt.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="drop">🥢 Drop a grain with the straw</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="fire">🔥 Light the candle</button><button class="toggle-btn" id="rst">↺ Fresh water</button></div></div>
    <div class="control-group"><label>Flame size <span class="val" id="pv">15 W</span></label><input type="range" id="pw" min="6" max="30" step="1" value="15">
      <label style="margin-top:8px">Candle position <span class="val" id="cv">centre</span></label><input type="range" id="cp" min="0" max="1" step="0.05" value="0"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="arr">Show water flow arrows</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Water temperature',COL.red)}${card('k2','Rising current',COL.green)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','Grain left')}${card('k4','Time')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const X0=250, X1=550, W=X1-X0, BOT=392, H=178, TOP=BOT-H, FLOOR=545, PXM=3530, TS=4;
  let lit=false, P=15, cpos=0, arrows=false, t=0, simT=0;
  const flame=spr(0); let U=0, Tb=25, dyed=0;
  let dye=[], grain=null, emit=0, straw={st:'idle',tip:-60,u:0};
  const R=rng(33);
  function reset(){ dye=[]; grain=null; emit=0; straw={st:'idle',tip:-60,u:0}; Tb=25; U=0; dyed=0; simT=0; }
  $('#drop').onclick=()=>{ if(straw.st==='idle'&&!grain){ straw.st='down'; } };
  $('#fire').onclick=()=>{ lit=!lit; };
  $('#rst').onclick=()=>{ lit=false; reset(); };
  $('#pw').oninput=e=>{ P=+e.target.value; $('#pv').textContent=P+' W'; };
  $('#cp').oninput=e=>{ cpos=+e.target.value; $('#cv').textContent=cpos<0.05?'centre':cpos>0.95?'near the side':'off-centre'; };
  $('#arr').onclick=e=>{ arrows=!arrows; e.target.classList.toggle('active',arrows); };
  // ---- flow field ----
  const BETA=0.6;
  let xc=W/2;                                  // where the plume rises (px from the left wall)
  function xi(x){ const e=x<xc?0.5*x/xc:0.5+0.5*(x-xc)/(W-xc); const q=2*e-1; return (q+BETA*Math.sin(Math.PI*q)/Math.PI+1)/2; }
  function psi(x,z){ return Math.sin(Math.PI*clamp(z,0,H)/H)*Math.sin(2*Math.PI*xi(clamp(x,0,W))); }
  function vel1(x,z){ const e=0.8; return [(psi(x,z+e)-psi(x,z-e))/(2*e), -(psi(x+e,z)-psi(x-e,z))/(2*e)]; }
  let norm=1, lastXc=-1;
  function vel(x,z,A){ const v=vel1(x,z); return [v[0]*A,v[1]*A]; }
  const beta=T=>(2.07+0.085*(T-20)-0.0005*(T-20)**2);
  const lensP=[]; for(let i=0;i<26;i++) lensP.push({x:(R()-0.5)*150,y:(R()-0.5)*150,ph:R()*6});
  animLoop(dt=>{ t+=dt; const sdt=dt*TS; simT+=sdt;
    springTo(flame,lit?1:0,26,9,dt); flame.x=clamp(flame.x,0,1.1);
    xc=lerp(W/2,W*0.13,cpos); if(Math.abs(xc-lastXc)>0.5){ norm=vel1(xc,H/2)[1]||1; lastXc=xc; }
    // heat balance of 250 mL water (real time) and current spin-up (τ ≈ 8 s)
    const Pin=0.9*P*flame.x; Tb+=dt*(Pin-1.2*(Tb-25))/1046*TS;
    const Ut=Pin>0.2?0.004*Math.cbrt(Pin/15)*Math.sqrt(beta(Tb)/beta(20)):0; U+=(Ut-U)*(1-Math.exp(-sdt/8));
    const A=U*PXM*TS/norm;                     // px/s on screen
    // ---- straw + grain ----
    if(straw.st==='down'){ straw.tip=Math.min(BOT-6,straw.tip+260*dt); if(straw.tip>=BOT-6){ straw.st='release'; straw.u=0; } }
    else if(straw.st==='release'){ straw.u+=dt; if(straw.u>0.5&&!grain){ grain={x:W/2,z:3,r:4.5,m:1}; tink(1400,0.05,0.15); } if(straw.u>0.9) straw.st='up'; }
    else if(straw.st==='up'){ straw.tip-=260*dt; if(straw.tip<-60){ straw.st='idle'; } }
    if(grain&&grain.m>0){ const flow=1+3*U/0.004, dm=Math.min(grain.m,0.012*flow*Math.pow(grain.m,0.66)*dt); grain.m-=dm; if(grain.m<0.002) grain.m=0;
      emit+=1500*dm; for(;emit>=1;emit--) dye.push({x:grain.x+(R()-0.5)*6,z:3+R()*5,px:null,pz:null}); }
    // ---- advect dye (RK2) + diffusion ----
    const Dv=26, sd=Math.sqrt(2*Dv*dt);
    dye.forEach(p=>{ p.px=p.x; p.pz=p.z; const a=vel(p.x,p.z,A), mx=p.x+a[0]*dt/2, mz=p.z+a[1]*dt/2, b=vel(mx,mz,A);
      p.x+=b[0]*dt+gauss()*sd*0.6; p.z+=b[1]*dt+gauss()*sd*0.6; p.x=clamp(p.x,2,W-2); p.z=clamp(p.z,2,H-2); });
    
    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[20,20,790,555]);
    tableTop(ctx,24,786,FLOOR,0);
    const Y=z=>BOT-z;
    // water: blue body, warm plume above the flame, uniform tint as the dye mixes in
    ctx.save(); ctx.beginPath(); ctx.rect(X0,TOP,W,H); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.10)'; ctx.fillRect(X0,TOP,W,H);
    const heatA=clamp(U/0.006,0,1)*0.3; if(heatA>0.01){ const g=ctx.createLinearGradient(X0+xc-40,0,X0+xc+40,0); g.addColorStop(0,'rgba(217,67,43,0)'); g.addColorStop(0.5,`rgba(217,67,43,${heatA})`); g.addColorStop(1,'rgba(217,67,43,0)'); ctx.fillStyle=g; ctx.fillRect(X0+xc-40,TOP,80,H); }
    
    ctx.lineCap='round'; ctx.strokeStyle='rgba(142,63,176,0.30)'; ctx.lineWidth=2.6; ctx.beginPath();
    dye.forEach(p=>{ const x=X0+p.x, y=Y(p.z), x0=p.px===null?x:X0+p.px, y0=p.pz===null?y:Y(p.pz); ctx.moveTo(x0,y0); ctx.lineTo(x+0.3,y+0.3); }); ctx.stroke();
    if(arrows&&U>1e-4){ for(let i=1;i<=7;i++) for(let j=1;j<=4;j++){ const x=W*i/8, z=H*j/5, v=vel(x,z,A), s=Math.hypot(v[0],v[1]), L=clamp(s/(A*norm)*26,0,28);
        if(L<3) continue; const ux=v[0]/s, uz=v[1]/s; ctx.save(); ctx.globalAlpha=0.75; vec(ctx,X0+x-ux*L/2,Y(z)+uz*L/2,X0+x+ux*L/2,Y(z)-uz*L/2,COL.green,2); ctx.restore(); } }
    ctx.restore();
    // surface ripple line
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.beginPath(); for(let x=X0;x<=X1;x+=6){ const y=TOP+Math.sin(x*0.06+t*2)*0.8*(0.3+U/0.004); x===X0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    // grain
    if(grain&&grain.m>0.01){ circ(ctx,X0+grain.x,Y(grain.z)-1,1.5+grain.r*Math.cbrt(grain.m),'#5c1e7a','#8e3fb0',1.6); }
    // beaker, gauze, tripod, candle
    beakerDraw(ctx,(X0+X1)/2,40,BOT+2,W+4,{grad:{n:9,lab:i=>(i*50)+' mL'}});
    gauze(ctx,(X0+X1)/2,BOT+6,W+40); tripod(ctx,(X0+X1)/2,BOT+9,FLOOR,W-40);
    const cx=X0+xc; candleDraw(ctx,cx,FLOOR,30,72,{lit:flame.x>0.02,f:flame.x,t,fh:48*clamp(Math.sqrt(P/15),0.6,1.4),fw:18});
    if(flame.x>0.05){ glow(ctx,cx,BOT+6,60*Math.sqrt(P/15),COL.yellow,0.3*flame.x); for(let k=-1;k<=1;k++) wavyUp(ctx,cx+k*16,BOT+2,BOT-24,COL.red,t+k,0.5*flame.x,2.5); }
    // straw
    if(straw.st!=='idle'){ const sx=X0+W/2, top=Math.min(straw.tip-230,TOP-60); ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.fillRect(sx-4,top,8,straw.tip-top); line(ctx,sx-4,top,sx-4,straw.tip,COL.ink,2.2); line(ctx,sx+4,top,sx+4,straw.tip,COL.ink,2.2); ctx.restore();
      if(straw.st==='down'||(straw.st==='release'&&straw.u<0.5)){ const gy=straw.st==='down'?straw.tip-8:lerp(straw.tip-8,BOT-4,straw.u/0.5); circ(ctx,sx,gy,4,'#5c1e7a','#8e3fb0',1.4); } }
    // thermometer dipped at the left
    labThermo(ctx,X1-44,60,BOT-26,Tb,20,100,{step:10,fs:9.5});
    // magnifying lens on the rising current: water particles themselves move
    const lz=H*0.55, lcx=680, lcy=250, LR=88;
    lensView(ctx,lcx,lcy,LR,X0+xc,Y(lz),()=>{ const v=vel(xc,lz,A), mag=1.5;
      lensP.forEach(p=>{ const hot=Math.exp(-((p.x/40)**2)); const vy=-v[1]*mag*(0.35+0.65*hot), vx=v[0]*mag;
        p.x+=vx*dt+Math.sin(t*20+p.ph)*0.6; p.y+=vy*dt+Math.cos(t*23+p.ph)*0.6;
        if(p.y<-LR) { p.y+=2*LR; p.x=(R()-0.5)*150; } if(p.y>LR){ p.y-=2*LR; } if(p.x<-LR) p.x+=2*LR; if(p.x>LR) p.x-=2*LR;
        const Tl=Tb+(U>1e-4?8*hot*clamp(U/0.004,0,1.5):0); circ(ctx,lcx+p.x,lcy+p.y,7,COL.ink,tempCol(Tl),1.4); });
      if(U>2e-4){ ctx.save(); ctx.globalAlpha=clamp(U/0.004,0,1); vec(ctx,lcx+LR-26,lcy+40,lcx+LR-26,lcy-40,COL.green,3); ctx.restore(); }
    },{label:'water particles move',col:COL.green});
    ctx.restore();
    timeTagPx(ctx,w,'flow ×'+TS);
    // ---- readouts ----
    setv($,'k1',fmt(Tb,1)+' °C'); setv($,'k2',U>1e-4?fmt(U*1000,1)+' mm/s':'still');
    setv($,'k3',grain?Math.round(grain.m*100)+' %':'no grain'); setv($,'k4',Math.floor(simT/60)+' min '+String(Math.floor(simT%60)).padStart(2,'0')+' s');
    setBtn($('#fire'),lit?'💨 Put out the candle':'🔥 Light the candle',lit?'':'play');
    $('#drop').disabled=!!grain||straw.st!=='idle';
  });
  return wrap;
}

/* =====================================================================
   7.4 LET US INVESTIGATE — soil and water in the Sun, then indoors
   Soil (5 cm, 10 layers): heat only creeps down by conduction
       ρc·∂T/∂t = k·∂²T/∂z²   (k 0.3 W/m·K, ρc 1.3 MJ/m³K)
   its top absorbs 80 % of 800 W/m² and loses heat to the air.
   Water (≈450 mL): stirred by its own convection, so it warms as one
   body; it takes in ~55 % of the sunlight, stores 4× more heat per
   degree, and evaporation carries heat away.
   Tuned in node: after 20 min soil +8.8 °C, water +3.5 °C; indoors for
   20 min soil −3.2 °C, water −1.1 °C — soil heats AND cools faster.
   Seashore view: a day on the coast, 1 h per second. Land (thin, dry)
   relaxes to the Sun in τ ≈ 2.5 h, the sea (deep, mixed) in τ ≈ 40 h:
   land 22 → 37 °C, sea ≈ 26.4 °C — sea breeze ≈ 9 am–7:30 pm, land
   breeze through the night, as in Fig. 7.7.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Where is the set-up?</label><div class="toggle-group" id="place">
      <button class="toggle-btn active" data-p="sun">☀ In sunlight</button><button class="toggle-btn" data-p="in">🏠 Indoors</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Start the clock</button><button class="toggle-btn" id="rst">↺ Reset</button></div></div>
    <div class="control-group"><label>Clock speed <span class="val" id="spv">1 min per s</span></label><input type="range" id="sp" min="20" max="120" step="10" value="60">
      <label style="margin-top:8px">View</label><div class="toggle-group" id="view"><button class="toggle-btn active" data-v="0">Bowls</button><button class="toggle-btn" data-v="1">Seashore</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Soil',COL.red)}${card('k2','Water',COL.blue)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','Clock')}${card('k4','Change so far',COL.green)}</div>
      <div id="tbl"></div><div class="fb warn" id="hint" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const NL=10, DZ=0.005, KS=0.3, RCS=1.3e6, CW=0.45*4186+0.25*460, AB=0.0154, BULB=3;
  let place='sun', run=false, speed=60, view=0, t=0, clock=0, phaseT=0, lastPhase='sun';
  let Ts, Tw, heat, cool, T0s, T0w;
  const indoor=spr(0), vw=spr(0);
  function reset(){ Ts=new Array(NL).fill(30); Tw=30; heat=[]; cool=[]; clock=0; phaseT=0; run=false; T0s=30; T0w=30; lastPhase=place; drawTable(); }
  reset();
  chipsWire(wrap,'#place .toggle-btn',b=>{ place=b.dataset.p; });
  chipsWire(wrap,'#view .toggle-btn',b=>{ view=+b.dataset.v; });
  $('#go').onclick=()=>{ run=!run; };
  $('#rst').onclick=()=>reset();
  $('#sp').oninput=e=>{ speed=+e.target.value; $('#spv').textContent=(speed/60===1?'1 min':fmt(speed/60,1)+' min')+' per s'; };
  function drawTable(){ const r=l=>l.map(q=>[q.m+' min',fmt(q.s,1)+' °C',fmt(q.w,1)+' °C']);
    let html=logTable(['In the Sun','Soil','Water'],heat.length?r(heat):[['—','—','—']]);
    if(cool.length) html+=logTable(['Indoors','Soil','Water'],r(cool)); $('#tbl').innerHTML=html; }
  function step(sdt){ const sun=place==='sun', S=sun?800:0, Ta=sun?32:30;
    const n=Math.max(1,Math.ceil(sdt/2)), h=sdt/n;
    for(let k=0;k<n;k++){ const Tn=Ts.slice();
      for(let i=0;i<NL;i++){ let q=0; if(i>0) q+=KS*(Ts[i-1]-Ts[i])/DZ; if(i<NL-1) q+=KS*(Ts[i+1]-Ts[i])/DZ; if(i===0) q+=0.8*S-18*(Ts[0]-Ta); Tn[i]=Ts[i]+h*q/(RCS*DZ); }
      Ts=Tn; const evap=S>0?18*(Tw-Ta+4):14*(Tw-Ta+2); Tw+=h*AB*(0.55*S-18*(Tw-Ta)-Math.max(0,evap))/CW; }
  }
  // seashore air parcels on a loop: sea-level → rise over the warm side → back aloft → sink
  const parcels=[]; for(let i=0;i<34;i++) parcels.push({s:i/34, j:(Math.random()-0.5)*14});

/* =====================================================================
   7.5 LET US INVESTIGATE — 200 mL of water through clay, sand, gravel
   Each bottle holds a 10 cm column (≈ 40 cm² cross-section).
   1. Wetting front (Green–Ampt):  f = K·(1 + (ψ + h)·Δθ / F)
      the dry column first soaks up Δθ·L of water before any drips out.
   2. Once wet through, outflow = Darcy  q = K·(h + L)/L, but never more
      than the cap hole allows  (Q = 0.6·a·√(2g(h + L)), 4 mm hole).
   3. Pond gone → the column drains to field capacity (Brooks–Corey).
   K: gravel 1.5 cm/s, sand 0.006 cm/s, clay 0.0001 cm/s.
   Tuned in node, after 10 min: gravel ≈175 mL (first drop in 3 s),
   sand ≈64 mL (first drop ≈4 min), clay ≈0 — fast / slow / very slow.
   ===================================================================== */

  }
  function drawJug(ctx,x,y,ang,fill){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.lineJoin='round'; ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink;
    ctx.beginPath(); ctx.moveTo(-26,-34); ctx.lineTo(18,-34); ctx.lineTo(34,-44); ctx.lineTo(26,-28); ctx.lineTo(24,30); ctx.quadraticCurveTo(24,36,18,36); ctx.lineTo(-20,36); ctx.quadraticCurveTo(-26,36,-26,30); ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
    if(fill>0.01){ ctx.save(); ctx.clip(); const lvl=36-62*fill; ctx.rotate(-ang); ctx.fillStyle=rgba(COL.blue,0.25); ctx.fillRect(-80,lvl*Math.cos(ang)-10,160,120); ctx.restore(); }
    ctx.beginPath(); ctx.moveTo(-26,-22); ctx.quadraticCurveTo(-52,-10,-26,16); ctx.stroke(); ctx.restore();
    const s=Math.sin(ang), c=Math.cos(ang); return {x:x+34*c+44*s, y:y+34*s-44*c}; }
  const lensW=[]; for(let i=0;i<40;i++) lensW.push({x:(Math.random()-0.5)*170,y:(Math.random()-0.5)*170});
  const lensG=SOILS.map((m,k)=>{ const r=rng(90+k), out=[], R0=m.lens.r, sp=R0*2.25; for(let yy=-110;yy<=110;yy+=sp*0.87) for(let xx=-110;xx<=110;xx+=sp){ const ox=(Math.round(yy/(sp*0.87))%2)*sp/2; out.push({x:xx+ox+(r()-0.5)*R0*0.4,y:yy+(r()-0.5)*R0*0.4,r:R0*(0.85+r()*0.3)}); } return out; });
  animLoop(dt=>{ t+=dt; const sdt=dt*speed;
    // ---- jug: move → tilt → pour → untilt → next bottle ----
    const JT=[0.7,0.35,1.5,0.35];
    B.forEach(b=>b.inflow=0);
    if(jug.st!=='home'){ const tx=XS[jug.i]+58, ty=TOPB-44; jug.u+=dt;
      if(jug.st==='move'){ jug.x=approach(jug.x,tx,9,dt); jug.y=approach(jug.y,ty,9,dt); if(jug.u>JT[0]){ jug.st='tilt'; jug.u=0; } }
      else if(jug.st==='tilt'){ jug.ang=-1.15*ease(jug.u/JT[1]); if(jug.u>JT[1]){ jug.st='pour'; jug.u=0; } }
      else if(jug.st==='pour'){ const b=B[jug.i]; if(b.clock===null) b.clock=0; const v=Math.min(200-b.poured,200*dt/JT[2]); b.poured+=v; b.inflow=v/Math.max(sdt,1e-6); jug.stream=1; if(b.poured>=199.999){ jug.st='untilt'; jug.u=0; } }
      else if(jug.st==='untilt'){ jug.stream=0; jug.ang=-1.15*(1-ease(jug.u/JT[3])); if(jug.u>JT[3]){ jug.u=0; if(jug.i<2){ jug.i++; jug.st='move'; } else jug.st='back'; } }
      else if(jug.st==='back'){ jug.x=approach(jug.x,720,6,dt); jug.y=approach(jug.y,40,6,dt); if(jug.u>1.2){ jug.st='home'; } } }
    B.forEach(b=>{ if(b.clock!==null&&b.clock<900) stepBottle(b,sdt); else b.q=0; });
    // ---- drops / streams ----
    B.forEach(b=>{ const perS=b.q*speed/0.05; b.stream=perS>14?1:0;
      if(!b.stream&&b.q>0){ b.acc+=perS*dt; while(b.acc>=1){ b.acc-=1; drops.push({x:XS[b.i],y:CAPB+2,vy:0,b:b.i}); } } });
    const lvlY=b=>BK1-4-clamp(b.out,0,250)*(BK1-BK0-14)/250;
    drops.forEach(d=>{ d.vy+=2000*dt; d.y+=d.vy*dt; if(d.y>=lvlY(B[d.b])) { d.dead=true; if(Math.random()<0.4) drip(); } });
    drops=drops.filter(d=>!d.dead);
    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[20,0,800,545]);
    tableTop(ctx,24,790,FLOOR,0);
    // rack holding the bottles
    { const hw=halfW(SH+26)+3; let x=40; XS.forEach(xc=>{ line(ctx,x,SH+26,xc-hw,SH+26,COL.ink,4); x=xc+hw; }); line(ctx,x,SH+26,620,SH+26,COL.ink,4); } line(ctx,50,SH+26,50,FLOOR,COL.ink,3.4); line(ctx,610,SH+26,610,FLOOR,COL.ink,3.4);
    B.forEach(b=>{ const x0=XS[b.i], m=b.m, dth=m.ts-m.ti;
      // beaker + collected water
      const bl=lvlY(b); ctx.save(); ctx.fillStyle=rgba(COL.blue,0.18); ctx.fillRect(x0-BKW/2+2,bl,BKW-4,BK1-bl); ctx.restore(); if(b.out>0.5) line(ctx,x0-BKW/2+2,bl,x0+BKW/2-2,bl,COL.blue,2);
      beakerDraw(ctx,x0,BK0,BK1,BKW,{grad:{n:4,lab:i=>(i*50)+''}});
      // column outline path (inverted bottle top)
      const colPath=()=>{ ctx.beginPath(); ctx.moveTo(x0-HW,TOPB); ctx.lineTo(x0-HW,SH); ctx.lineTo(x0-NW,NK); ctx.lineTo(x0-NW,CAP); ctx.lineTo(x0+NW,CAP); ctx.lineTo(x0+NW,NK); ctx.lineTo(x0+HW,SH); ctx.lineTo(x0+HW,TOPB); ctx.closePath(); };
      ctx.save(); colPath(); ctx.clip();
      if(m.key==='clay'){ ctx.fillStyle='rgba(19,42,68,0.07)'; ctx.fillRect(x0-HW,MAT,2*HW,CAP-MAT); }
      // wet part of the column
      const zf=b.thru?Lc:b.F/dth, Se=b.thru?clamp(b.F/(dth*Lc),0,1):1, wy=MAT+zf*PXC;
      if(zf>0.02){ ctx.fillStyle=rgba(COL.blue,0.12+0.2*Se); ctx.fillRect(x0-HW,MAT,2*HW,wy-MAT); if(!b.thru){ ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x0-HW,wy); ctx.lineTo(x0+HW,wy); ctx.stroke(); ctx.restore(); } }
      grains[b.i].forEach(q=>{ if(q.poly){ ctx.save(); polyPath(ctx,q.poly,x0+q.x,q.y); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore(); } else circ(ctx,x0+q.x,q.y,q.r,COL.ink,COL.ink,0.5); });
      // ponded water on top
      const pondPx=b.pond*PXC; if(pondPx>0.3){ const top=MAT-pondPx; ctx.fillStyle=rgba(COL.blue,0.22); ctx.fillRect(x0-HW,top,2*HW,pondPx+1);
        ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.beginPath(); for(let xx=x0-HW;xx<=x0+HW;xx+=5){ const yy=top+Math.sin(xx*0.2+t*5)*(jug.st==='pour'&&jug.i===b.i?1.8:0.6); xx===x0-HW?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); } ctx.stroke(); }
      ctx.restore();
      // bottle outline + cap with hole
      ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.8; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(x0-HW,TOPB); ctx.lineTo(x0-HW,SH); ctx.lineTo(x0-NW,NK); ctx.lineTo(x0-NW,CAP); ctx.moveTo(x0+NW,CAP); ctx.lineTo(x0+NW,NK); ctx.lineTo(x0+HW,SH); ctx.lineTo(x0+HW,TOPB); ctx.stroke();
      line(ctx,x0-HW-3,TOPB,x0-HW+5,TOPB,COL.ink,2); line(ctx,x0+HW-5,TOPB,x0+HW+3,TOPB,COL.ink,2);
      rrect(ctx,x0-NW-4,CAP,2*NW+8,CAPB-CAP,3); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); line(ctx,x0-2.5,CAP+2,x0-2.5,CAPB,COL.ink,1.2); line(ctx,x0+2.5,CAP+2,x0+2.5,CAPB,COL.ink,1.2); ctx.restore();
      // stream out of the cap
      if(b.stream){ const wv=clamp(Math.sqrt(b.q*speed)*0.55,1.6,4.5); ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=wv; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x0,CAPB); ctx.lineTo(x0+Math.sin(t*20)*0.4,bl); ctx.stroke(); ctx.restore(); circ(ctx,x0,bl,4+Math.sin(t*25)*1.5,COL.blue,null,1.4); }
      tag(ctx,m.name,x0,TOPB-16+ (jug.st!=='home'&&jug.i===b.i?-0:0),COL.ink,{size:12});
      textAt(ctx,fmt(b.out,0)+' mL',x0,BK1+0-(BK1-BK0)/2+4,{align:'center',size:12,weight:700,color:COL.blue});
      if(b.i===magI) circ(ctx,x0,MAT+5*PXC,9,COL.ink,null,2);
    });
    drops.forEach(d=>{ ctx.save(); ctx.fillStyle=rgba(COL.blue,0.5); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(d.x,d.y-5); ctx.quadraticCurveTo(d.x+3.5,d.y+1,d.x,d.y+3); ctx.quadraticCurveTo(d.x-3.5,d.y+1,d.x,d.y-5); ctx.fill(); ctx.stroke(); ctx.restore(); });
    // jug + pouring stream
    const fillLeft=jug.st==='home'?(B.every(b=>b.poured===0)?1:0):1-(B[jug.i].poured/200);
    const sp=drawJug(ctx,jug.x,jug.y,jug.ang,jug.st==='home'&&!B.every(b=>b.poured===0)?0:fillLeft);
    if(jug.st==='pour'){ const b=B[jug.i], sy=MAT-b.pond*PXC; ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sp.x,sp.y); ctx.quadraticCurveTo(sp.x-6,sp.y+20,XS[jug.i]+22,sy); ctx.stroke(); ctx.restore(); }
    // lens: pores between grains; water squeezes through them
    const mb=B[magI], lx=XS[magI], ly=MAT+5*PXC, lcx=712, lcy=250, LR=78;
    lensView(ctx,lcx,lcy,LR,lx,ly,()=>{ const G=lensG[magI], wet=mb.thru||mb.F/(mb.m.ts-mb.m.ti)>=5, flowing=wet&&(mb.q>0||mb.pond>0.01);
      if(wet){ ctx.fillStyle=rgba(COL.blue,0.16); ctx.fillRect(lcx-LR,lcy-LR,2*LR,2*LR); }
      G.forEach(q=>circ(ctx,lcx+q.x,lcy+q.y,q.r,COL.ink,'#fff',1.8));
      if(wet){ const v=mb.m.lens.v*(flowing?1:0.1);
        lensW.forEach(p=>{ p.y+=v*dt; p.x+=Math.sin(t*3+p.y*0.05)*v*0.15*dt;
          G.forEach(q=>{ const dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy); if(d<q.r+3&&d>0){ p.x=q.x+dx/d*(q.r+3); p.y=q.y+dy/d*(q.r+3); p.x+=(dx>=0?1:-1)*v*0.6*dt; } });
          if(p.y>LR){ p.y=-LR; p.x=(Math.random()-0.5)*170; }
          circ(ctx,lcx+p.x,lcy+p.y,2.6,COL.blue,COL.blue,1); }); }
    },{label:mb.m.name+': '+(mb.m.key==='gravel'?'wide gaps':mb.m.key==='sand'?'small gaps':'tiny gaps'),col:COL.ink});
    ctx.restore();
    timeTagPx(ctx,w,'×'+speed+' time');
    // ---- readouts ----
    const c=B[0].clock; setv($,'k1',c===null?'not started':Math.floor(c/60)+' min '+String(Math.floor(c%60)).padStart(2,'0')+' s');
    ['k2','k3','k4'].forEach((k,i)=>setv($,k,fmt(B[i].out,0)+' mL'));
    const obs=b=>b.at10===null?null:b.at10>=120?'fast':b.at10>=20?'slow':'very slow';
    const rows=B.map((b,i)=>{ const o=obs(b); return [b.m.name, preds[i]||'—', o===null?(b.clock===null?'—':'…'):{v:o+' · '+fmt(b.at10,0)+' mL',c:preds[i]?(preds[i]===o?'r-ok':'r-bad'):''}]; });
    const tbl=logTable(['Bottle','Predicted','After 10 min'],rows); if(tbl!==lastTbl){ lastTbl=tbl; $('#tbl').innerHTML=tbl; }
    $('#pour').disabled=!(jug.st==='home'&&B.every(b=>b.poured===0));
  });
  return wrap;
}


/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'7.1', title:'Pins on a Hot Strip', desc:'Table 7.1 · conduction along a strip', build: buildA1 },
  { num:'7.2', title:'Cups on a Stick', desc:'Table 7.3 · hot air expands and rises', build: buildA2 },
  { num:'7.3', title:'Coloured Streak in Water', desc:'Convection in a heated beaker', build: buildA3 },
  { num:'7.4', title:'Soil vs Water in the Sun', desc:'Table 7.4 · heating, cooling, sea breeze', build: buildA4 },
  { num:'7.5', title:'Water Through Clay, Sand, Gravel', desc:'Table 7.5 · seepage of water', build: buildA5 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
