<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 · Chapter 13 — Our Environment | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div class="app">
  <div class="topbar">

</div>

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 13: OUR ENVIRONMENT
   (NCERT Science, jesc113) — Activities 13.1 – 13.9.
   Every scene runs a continuous animation loop: controls only set targets.
   Ecosystems, food chains, toxins, ozone, decay and treatment follow real rate laws
   and real data, compressed in time only where needed to watch.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

/* ---- LIME WATER ----

  if(a>0&&Lm.caco3>0){ const d=Math.min(a*0.35,Lm.caco3); Lm.caco3-=d; Lm.hco3+=d; } return n*LIME.eff; }

  const L=aqLight(S.day,cfg.light), alive=S.fish.filter(f=>f.alive).length, Pl=cfg.plants?S.P:0, sn=cfg.snails?6:0;
  // feeding at 8:00 each day
  if(cfg.food && Math.floor(S.day-0.333)>S.fedDay && alive>0){ S.fedDay=Math.floor(S.day-0.333); S.food+=0.04*alive; }
  const eatF=S.food>0?Math.min(S.food,0.5*alive*dt*0.04/0.05):0; S.food-=eatF; // fish finish a feed in ~0.05 d (≈1 h)
  if(S.food>0 && S.day-S.fedDay-0.333>0.25){ S.D+=S.food; S.food=0; } // left-overs sink and rot
  const fedRate=eatF/dt/Math.max(1,alive)/0.04; // fraction of daily ration per day
  // fish grazing on plants when hungry
  const graze=alive*0.25*Math.min(1,Pl/40)*(cfg.food?0.15:1); // g fresh / day
  // oxygen
  const kr=cfg.aer?6:0.3, reae=kr*(AQ.Osat-S.O)-(S.O>AQ.Osat*1.15?4*(S.O-AQ.Osat*1.15):0); /* above ≈115 % saturation O₂ leaves as bubbles */
  const photo=(Pl*0.5*24*L + S.A*40*L)/AQ.V*cfg.light; // mg/L/day at this instant
  const plResp=(Pl*0.05*24+S.A*4)/AQ.V;
  const fishResp=alive*2*0.3*24/AQ.V*S.O/(S.O+1);
  const dk=cfg.dec?0.15:0.004, decomp=dk*S.D, decO=decomp*1200/AQ.V*S.O/(S.O+0.5);
  S.O=Math.max(0,S.O+(reae+photo-plResp-fishResp-decO)*dt);
  // waste ammonia + nutrients
  const excr=alive*0.03*(0.3+0.7*Math.min(1.5,fedRate+graze/Math.max(1,alive)/0.25*0.6)), relN=decomp*70/AQ.V;
  const nitr=cfg.dec?0.5*S.W:0.01*S.W, upP=Pl*0.004*L*S.W/(S.W+0.2)+Pl*0.004*L*S.N/(S.N+0.3), upA=S.A*0.5*L*(S.W+S.N)/(S.W+S.N+0.4);
  S.W=Math.max(0,S.W+(excr+relN-nitr-upP*S.W/(S.W+S.N+1e-6)-upA*0.5)*dt);
  S.N=Math.max(0,S.N+(nitr-upP*S.N/(S.W+S.N+1e-6)-upA*0.5)*dt);
  const nut=(S.W+S.N)/(S.W+S.N+0.3);
  // plants
  if(cfg.plants){ const g=0.18*L*2*nut*(1-S.P/180)*(cfg.light?1:0), m=0.02+(cfg.light?0:0.12); S.P=Math.max(0,S.P+(S.P*(g-m)-graze)*dt); S.D+=S.P*m*0.08*dt; }

  S.D=Math.max(0,S.D+(alive*0.012*Math.min(1.5,fedRate)-decomp-snailEatD+S.A*0.05*0.3)*dt);

/* =====================================================================
   13.2 POND FOOD CHAIN — biomass (g) in a 40 L tank of algae A, water
   fleas D, small fish F and (optionally) one big predatory fish B; days.
   Each consumer eats in proportion to how much food it meets, and only
   e = 10 % of what it eats becomes its own body (the rest is heat, work
   and waste) — so each level can carry only about a tenth of the one below.
     A' = rA(1−A/K) − aD·A·D           r 1/d, K 1000 g
     D' = e·aD·A·D − mD·D − aF·D·F     → A* 600, D* 60, F* 6 g (1 fish ≈ 1 g)
     F' = e·aF·D·F − mF·F − cF·F² − aB·F·B
     B' = e·aB·F·B − mB·B
   A tank has nowhere to hide: the big fish keeps eating until the small
   fish fall below one individual — then they are gone, and it starves.
   ===================================================================== */
const FC={r:1,K:1000,aD:0.4/60,mD:0.1,aF:0.05,mF:0.05,cF:0.25/6,aB:0.5,mB:0.02,e:0.1};
function fcNew(){ return {A:600,D:60,F:6,B:0,day:0,eatD:0,eatF:0,eatB:0,dieD:0,dieF:0}; }
function fcStep(S,dt){ const p=FC;
  const fD=p.aD*S.A*S.D, fF=p.aF*S.D*S.F, fB=p.aB*S.F*S.B;
  S.A=Math.max(0,S.A+(p.r*S.A*(1-S.A/p.K)-fD)*dt);
  S.D=Math.max(0,S.D+(p.e*fD-p.mD*S.D-fF)*dt);
  S.F=Math.max(0,S.F+(p.e*fF-p.mF*S.F-p.cF*S.F*S.F-fB)*dt);
  S.B=Math.max(0,S.B+(p.e*fB-p.mB*S.B)*dt);
  if(S.F<0.5) S.F=0; if(S.B>0&&S.B<0.3) S.B=0; if(S.D<0.5) S.D=0; if(S.A<1) S.A=0; // fewer than one individual = gone
  S.eatF+=fF*dt; S.eatB+=fB*dt; S.dieF+=(p.mF*S.F+p.cF*S.F*S.F)*dt; S.day+=dt; return S; }
if(typeof module!=='undefined') module.exports={fcNew,fcStep,FC};

/* =====================================================================
   13.4 OZONE MODEL — CFC emissions E (relative), atmospheric burden B'=E−B/τ
   (τ ≈ 62 yr, between CFC-11 and CFC-12), stratospheric chlorine = burden ≈5 yr earlier + natural
   background. Antarctic spring hole area grows with chlorine above the
   1979 level and saturates near the size of the polar vortex.
   Montreal Protocol 1987 → emissions fall to ≈2 % by 1996.
   ===================================================================== */
const OZ={tau:62,lag:5,bg:0.25};
function ozEmit(y,mp){ if(y<1950) return 0.05*Math.exp((y-1950)/10); if(y<1974) return 0.05+0.95*(Math.exp((y-1950)/8)-1)/(Math.exp(24/8)-1);
  if(y<1988||!mp) return y<1988?1:Math.min(4,Math.pow(1.03,y-1988)); return y<1996?lerp(1,0.04,(y-1988)/8):Math.max(0.01,0.04*Math.exp(-(y-1996)/15)); }
function ozSeries(mp){ const out={}; let B=0; const hist=[]; for(let y=1930;y<=2100;y+=0.25){ B+=(ozEmit(y,mp)-B/OZ.tau)*0.25; hist.push([y,B]); const yl=y-OZ.lag; const h=hist.find(p=>p[0]>=yl)||hist[0]; out[y.toFixed(2)]=h[1]+OZ.bg; } return out; }
const OZS={mp:null,no:null};
function ozCl(y,mp){ const k=mp?'mp':'no'; if(!OZS[k]) OZS[k]=ozSeries(mp); const q=Math.round(clamp(y,1930,2100)*4)/4; return OZS[k][q.toFixed(2)]; }
function ozX(y,mp){ const C0=ozCl(1979,true), Cp=ozCl(2000,true); return Math.max(0,(ozCl(y,mp)-C0)/(Cp-C0)); }
function ozArea(y,mp){ const x=ozX(y,mp); return 26*Math.pow(x,0.5); }           // million km²
function ozDU(y,mp){ return Math.max(60,300-190*Math.min(1.5,Math.pow(ozX(y,mp),0.8))); } // Antarctic October column
const OZ_OBS=[[1979,0.1],[1980,1.4],[1982,4.6],[1984,9.9],[1985,14.3],[1987,22.4],[1989,19.7],[1991,20],[1993,23],[1996,22.3],[1998,25.9],[2000,24.8],[2002,12],[2003,25.8],[2006,26.6],[2008,25.2],[2010,19.4],[2012,17.8],[2015,25.6],[2017,17.4],[2019,9.3],[2020,23.5],[2021,23.3],[2022,23.2],[2023,22.1],[2024,20]];

   13.3 PESTICIDES IN OUR FOOD — biological magnification.
   Each season the field is sprayed; rain washes a little of the soil
   residue into the pond. Every level then follows
       dCᵢ/dt = I·α·Cᵢ₋₁ − k·Cᵢ        (I food eaten per kg body per day,

   so a level settles at Cᵢ = (I·α/k)·Cᵢ₋₁. A persistent pesticide (DDT:
   soil t½ ≈ 10 yr, body t½ months–years) has k tiny → each level holds

   water 0.000003 → plankton 0.04 → small fish 0.5 → big fish 2 →
   fish-eating bird 25 ppm. A degradable pesticide (organophosphate,

/* =====================================================================

   absorbed (O₃ → O₂ + O, then O + O₂ → O₃ again: the layer soaks up UV
   as heat). High-energy UV splits O₂ → O + O, which makes new O₃.
   Chlorine from CFCs is a catalyst: Cl + O₃ → ClO + O₂, ClO + O → Cl + O₂,
   so the same Cl atom goes round again and again. Photons that miss every
   O₃ reach the ground — fewer O₃, more UV on skin. The amount of free Cl
   follows the chlorine curve of ozmodel.js for the chosen year.

    <div class="control-group"><div class="fb hidden" id="fb"></div></div>`;

/* =====================================================================
   13.5 BURY THE WASTE — a pit 40 cm deep, waste covered by 15 cm of soil.
   Each material loses mass at its own first-order rate once microbes
   have colonised it (lag):  m' = −k·Q10^((T−25)/10)·f(moisture)·m,
   k from typical half-lives in moist soil at 25 °C: vegetable peels
   ≈ 8 d, spoilt food ≈ 6 d, tea leaves ≈ 35 d, paper ≈ 30 d, cotton
   ≈ 60 d; plastic, rubber, glass and blister packs are not touched by
   microbes' enzymes at all (decades to centuries). Q10 = 2. Dry soil
   slows decomposers to ≈ 15 %.
   ===================================================================== */
const WASTE=[
  {id:'peel',n:'Vegetable peels',th:8,lag:1,bio:1},{id:'food',n:'Spoilt food',th:6,lag:1,bio:1},{id:'tea',n:'Used tea leaves',th:35,lag:3,bio:1},
  {id:'paper',n:'Waste paper',th:30,lag:5,bio:1},{id:'cloth',n:'Old cotton cloth',th:60,lag:10,bio:1},
  {id:'pack',n:'Milk packet',th:2e5,lag:0,bio:0},{id:'slip',n:'Rubber slipper',th:3e4,lag:0,bio:0},{id:'bottle',n:'Glass bottle',th:1e9,lag:0,bio:0},{id:'blister',n:'Blister pack',th:2e5,lag:0,bio:0}];
function wasteDraw(ctx,id,x,y,s,m,seed,t){ const R=rng(seed||3); const br=clamp(1-m,0,1), col=mixCol('#132a44','#8a6a3a',br*0.9), sc=0.45+0.55*Math.sqrt(Math.max(0,m));

  if(m<0.97&&WASTE.find(w=>w.id===id).bio) ctx.setLineDash([Math.max(2,14*m),Math.max(0,(1-m)*10)]);
  if(id==='peel'){ ctx.fillStyle=mixCol('#fff6d6','#d8c3a0',br); for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(k*16,-8,k*26,10); ctx.quadraticCurveTo(k*14,0,k*4,6); ctx.closePath(); ctx.fill(); ctx.stroke(); } ctx.strokeStyle=mixCol('#1f9d55','#8a6a3a',br); ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(-6,-10); ctx.stroke(); }
  else if(id==='food'){ ctx.fillStyle=mixCol('#ffffff','#e3d6bf',br); ctx.beginPath(); ctx.ellipse(0,0,22,12,0,Math.PI,0); ctx.lineTo(22,4); ctx.lineTo(-22,4); ctx.closePath(); ctx.fill(); ctx.stroke(); for(let i=0;i<9;i++) ell(ctx,lerp(-15,15,R()),lerp(-8,1,R()),2.6,1.2,R()*3), ctx.stroke(); }
  else if(id==='tea'){ for(let i=0;i<16;i++){ const a=R()*6.28, r=R()*16; ell(ctx,Math.cos(a)*r,Math.sin(a)*r*0.6,3.4,1.6,R()*3); ctx.fillStyle=mixCol('#8a6a3a','#5e4a2c',br); ctx.fill(); } }
  else if(id==='paper'){ ctx.beginPath(); ctx.moveTo(-20,-14); ctx.lineTo(6,-17); ctx.lineTo(20,-10); ctx.lineTo(18,14); ctx.lineTo(-4,16); ctx.lineTo(-20,10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); for(let i=0;i<4;i++) line(ctx,-14,-8+i*6,12,-9+i*6,mixCol('#8195ab','#b9a88c',br),1.2); }
  else if(id==='cloth'){ ctx.fillStyle=mixCol('#eaf3fb','#e3d6bf',br); ctx.beginPath(); ctx.moveTo(-22,-12); ctx.quadraticCurveTo(0,-18,22,-12); ctx.lineTo(20,12); ctx.quadraticCurveTo(0,16,-22,12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); for(let i=-18;i<=18;i+=6) line(ctx,i,-12,i,12,rgba(COL.blue,0.35*(1-br)+0.1),1); }
  else if(id==='pack'){ ctx.beginPath(); ctx.moveTo(-18,-14); ctx.quadraticCurveTo(0,-18,18,-14); ctx.quadraticCurveTo(22,0,18,14); ctx.quadraticCurveTo(0,18,-18,14); ctx.quadraticCurveTo(-22,0,-18,-14); ctx.closePath(); ctx.fill(); ctx.strokeStyle=COL.blue; ctx.stroke(); textAt(ctx,'MILK',0,4,{align:'center',size:9,weight:800,color:COL.blue}); line(ctx,-18,-14,-12,-8,COL.blue,1.2); }
  else if(id==='slip'){ ctx.beginPath(); ctx.ellipse(0,0,26,10,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.beginPath(); ctx.moveTo(4,-8); ctx.quadraticCurveTo(14,-18,18,-4); ctx.moveTo(4,-8); ctx.quadraticCurveTo(-4,-18,-8,-6); ctx.lineWidth=3; ctx.strokeStyle=COL.red; ctx.stroke(); }
  else if(id==='bottle'){ rrect(ctx,-9,-12,18,26,4); ctx.fillStyle=rgba(COL.blue,0.08); ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke(); rrect(ctx,-5,-19,10,7,2); ctx.stroke(); line(ctx,-5,-4,5,-4,COL.mid,1); }
  else if(id==='blister'){ rrect(ctx,-20,-12,40,24,3); ctx.fillStyle='#f2f5f8'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.stroke(); for(let i=0;i<4;i++) for(let j=0;j<2;j++) circ(ctx,-13+i*8.6,-5+j*10,3.2,COL.mid,'#fff',1.2); }
  ctx.restore(); }
function buildA5(){

    items=ws.map((w,i)=>({w,m:1,x:520,y:120,tx:SLOTS[i][0],ty:SLOTS[i][1],fly:-i*0.28,seed:7+i*5,rot:(i%3-1)*0.3}));

  function updLog(){ const ds=[15,30,45,60,90]; $('#lg').innerHTML=items.length?logTable(['Item'].concat(ds.map(d=>'d'+d)),items.map(it=>[it.w.n.split(' ').slice(-1)[0]].concat(ds.map(d=>{ const r=logRows.find(q=>q.d===d); if(!r) return '·'; const v=r.m[it.w.id]; return {v:Math.round(v*100),c:v<0.2?'r-ok':(v>0.97?'r-bad':'')}; })))):'<div class="hint">Bury something first.</div>'; }

   by settling. Aeration tank: bacteria eat dissolved food — removal

   River (5 m³/s, 25 °C, flows 26 km/day): Streeter–Phelps oxygen sag

   E-waste: a desktop computer comes apart into its parts. Disposal:
   • Landfill — monsoon rain soaks ≈ 1 m/yr through the soil; each metal
     moves slower than the water by its retardation R (sticks to soil):
     Cd R≈3, Hg R≈5, Pb R≈15 → front depth = 1 m/yr · years / R. The
     well draws from the water table 10 m down.
   • Open burning — plastics burn off as smoke carrying dioxins and lead
     fumes downwind; only copper is left.
   • Formal recycling — shred, magnet, separate; per tonne of phones
     ≈ 300 g gold, 3 kg silver, 130 kg copper; hazardous parts sealed.
   Plastic: sort by resin code, wash, shred, melt, make pellets. Every
   melt cuts the polymer chains (≈ 20 % shorter per pass for PET), so
   after ≈ 3 passes it is too weak and gets down-cycled. One PVC item

        for(let d=0;d<=10;d+=2) textAt(ctx,d+' m',36,GY0+d*PXM+4,{size:9.5,weight:600,color:COL.muted});

      if(disp==='burn'){ line(ctx,20,480,780,480,COL.ink,2.4); flame(ctx,300,478,90,clamp(1-yrs/12,0.1,1),t); personDraw(ctx,200,480,90,{}); textAt(ctx,'cough!',200,370,{align:'center',size:11,weight:700,color:COL.red,alpha:0.5+0.5*Math.sin(t*5)});
        for(let i=0;i<3;i++){ const x=600+i*60; ctx.save(); ctx.beginPath(); ctx.moveTo(x-20,480); ctx.lineTo(x-20,440); ctx.lineTo(x,420); ctx.lineTo(x+20,440); ctx.lineTo(x+20,480); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }

        textAt(ctx,'wind →',740,320,{align:'right',size:12,weight:700,color:COL.muted}); textAt(ctx,'dioxins · lead fumes',560,340,{size:11.5,weight:700,color:COL.red}); }
      if(disp==='rec'){ // shredder + magnet + bins
        ctx.save(); rrect(ctx,210,280,80,60,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore(); for(let k=0;k<2;k++){ const cx=235+k*30; ctx.save(); ctx.translate(cx,310); ctx.rotate((k?-1:1)*t*5); for(let j=0;j<6;j++){ ctx.rotate(Math.PI/3); line(ctx,0,0,12,0,COL.ink,2); } ctx.restore(); }
        textAt(ctx,'shredder',250,272,{align:'center',size:11,weight:700,color:COL.muted}); line(ctx,250,376,780,376,COL.ink,2.4);
        rrect(ctx,404,300,40,26,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.stroke(); textAt(ctx,'magnet',424,294,{align:'center',size:10,weight:700,color:COL.red});
        [['fe','iron',420],['pl','plastic',500],['cu','copper',580],['au','gold·silver',660],['hz','hazardous',740]].forEach(([k,l,x])=>{ ctx.save(); rrect(ctx,x-30,400,60,80,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=k==='hz'?COL.red:(k==='au'?COL.yellow:COL.ink); ctx.lineWidth=2.2; ctx.stroke(); const f=clamp(bins[k]/30,0,1); ctx.fillStyle=rgba(k==='hz'?COL.red:(k==='au'?COL.yellow:(k==='cu'?'#c9820b':COL.mid)),0.3); ctx.fillRect(x-28,478-76*f,56,76*f); ctx.restore(); textAt(ctx,l,x,496,{align:'center',size:10.5,weight:700,color:COL.muted}); if(k==='au'&&bins.au) rayBurst(ctx,x,440,10,18,8,COL.yellow,0.6,t); });
        shred.forEach(s=>{ const c={cu:'#c9820b',au:COL.yellow,fe:COL.mid,pl:COL.blue,hz:COL.red}[s.k]; ctx.save(); ctx.fillStyle=c; ctx.translate(s.x,s.y); ctx.rotate(s.x*0.1); ctx.fillRect(-3,-3,6,6); ctx.restore(); }); }
    } else {
      // plastic line: conveyor → sorter → wash tank → shredder → extruder → pellets
      line(ctx,20,166,450,166,COL.ink,2.6); for(let x=30;x<450;x+=24) circ(ctx,x,172,4,COL.mid,'#fff',1.2);
      textAt(ctx,'collected bottles',40,110,{size:11.5,weight:700,color:COL.muted});
      // sorter arm
      ctx.save(); ctx.translate(180,120); ctx.rotate(Math.sin(t*6)*0.2); line(ctx,0,0,0,30,COL.ink,3); rrect(ctx,-8,30,16,10,3); ctx.stroke(); ctx.restore(); textAt(ctx,'sort by code',180,108,{align:'center',size:11,weight:700,color:COL.ink});
      rrect(ctx,130,250,100,40,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); textAt(ctx,'other plastics',180,306,{align:'center',size:10.5,weight:700,color:COL.muted});
      // wash tank
      ctx.save(); rrect(ctx,270,176,90,60,6); ctx.fillStyle=rgba(COL.blue,0.12); ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore(); for(let k=0;k<6;k++) circ(ctx,280+k*14,226-((t*40+k*13)%46),2.4,COL.blue,null,1.2); textAt(ctx,'wash',315,250,{align:'center',size:10.5,weight:700,color:COL.blue});
      line(ctx,315,236,315,330,COL.blue,3); washMP.forEach(m=>dot(ctx,m.x,m.y,2,COL.red)); if(washMP.length) textAt(ctx,'wash water + microplastics',330,340,{size:10.5,weight:700,color:COL.red});
      // shredder
      ctx.save(); rrect(ctx,440,150,60,40,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore(); for(let k=0;k<2;k++){ ctx.save(); ctx.translate(458+k*24,170); ctx.rotate((k?-1:1)*t*6); for(let j=0;j<6;j++){ ctx.rotate(Math.PI/3); line(ctx,0,0,9,0,COL.ink,2); } ctx.restore(); } textAt(ctx,'shred',470,142,{align:'center',size:10.5,weight:700,color:COL.muted});
      // extruder: heated barrel with turning screw
      ctx.save(); rrect(ctx,540,236,200,30,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore(); ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2; ctx.beginPath(); for(let x=546;x<734;x+=2){ const y=251+Math.sin((x-t*120)*0.18)*9; x===546?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
      for(let k=0;k<5;k++) heatWave(ctx,560+k*36,232,18,-Math.PI/2,COL.red,t,0.5,2); textAt(ctx,'melt ≈ 260 °C',640,214,{align:'center',size:10.5,weight:700,color:COL.red});
      if(spoiled){ for(let k=0;k<6;k++) circ(ctx,600+k*20,200-((t*30+k*9)%40),6,COL.red,null,1.2); textAt(ctx,'HCl fumes!',690,190,{size:11,weight:800,color:COL.red}); }
      // pellets pile
      for(let k=0;k<Math.min(60,Math.floor(pellets*4));k++) circ(ctx,760+((k*7)%30)-10,300-Math.floor(k/6)*6,2.6,COL.blue,'#e8f2fc',1.2); textAt(ctx,'pellets',760,318,{align:'center',size:10.5,weight:700,color:COL.blue});
      belt.forEach(b=>{ const x=b.x, y=b.out?b.y:b.y; ctx.save(); rrect(ctx,x-9,y-28,18,28,4); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=b.c[2]; ctx.lineWidth=2; ctx.stroke(); rrect(ctx,x-4,y-34,8,6,2); ctx.stroke(); ctx.restore(); textAt(ctx,String(b.c[0]),x,y-10,{align:'center',size:10,weight:800,color:b.c[2]}); });
      flakes.forEach(f=>{ ctx.save(); ctx.fillStyle=f.pvc?COL.red:COL.blue; ctx.fillRect(f.x-2,f.y-2,4,4); ctx.restore(); });
      // lens: the polymer chains in the pellets
      lens(ctx,200,440,92,undefined,undefined,'inside a pellet: polymer chains',()=>{ const R=rng(4); const L=Math.max(3,Math.round(24*chainL)); for(let c=0;c<6;c++){ let x=120+R()*40, y=372+c*24; ctx.strokeStyle=chainL<0.55?COL.red:COL.blue; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x,y); for(let k=0;k<L;k++){ x+=6.5; y+=Math.sin(k*1.3+c+t*0.5)*3; ctx.lineTo(x,y); } ctx.stroke(); if(cyc>0) for(let k=0;k<cyc;k++) mark(ctx,x+8+k*12,y,false,0.5); } });
      textAt(ctx,'cycle '+cyc+' · chains '+Math.round(chainL*100)+' % · '+(chainL<0.55?'too weak':'strong enough'),330,450,{size:12.5,weight:700,color:chainL<0.55?COL.red:COL.green});
      // resin code legend
      [[1,'PET',COL.blue],[2,'HDPE',COL.green],[3,'PVC',COL.red],[5,'PP',COL.yellow]].forEach(([n,l,c],i)=>{ const x=330+i*110, y=500; ctx.save(); ctx.beginPath(); ctx.moveTo(x,y-14); ctx.lineTo(x+13,y+9); ctx.lineTo(x-13,y+9); ctx.closePath(); ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); textAt(ctx,String(n),x,y+5,{align:'center',size:10,weight:800,color:c}); textAt(ctx,l,x+18,y+5,{size:11,weight:700,color:c}); });
    }
    ctx.restore();
  });
  return wrap;
}

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };

  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];

  body.appendChild(a.build());
}
