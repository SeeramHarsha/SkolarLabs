<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);

}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{

}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;

.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}

.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}

.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}

.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}

.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}

.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){

}

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 2: EXPLORING SUBSTANCES: ACIDIC, BASIC, AND NEUTRAL
   Activities 2.1 – 2.7 (NCERT Curiosity, gecu102). Every activity runs a
   continuous animation loop: sliders/buttons only set a TARGET; drops
   free-fall, spots wick, plumes sink and mix, faces pucker on springs.
   Every indicator colour comes from a real pH, solved from the charge
   balance of whatever is actually in the tube or on the paper.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-2 HELPERS — virtual stage, chemistry engine, indicators,
       lab-ware (dropper, drops, test tube, tile, litmus piece) — all
       line diagrams, all animated
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}

/* =====================================================================
   CHEMISTRY ENGINE
   A mixture = { V (mL), sb (mmol strong cation: Na⁺, ½Ca²⁺ …),
                 sa (mmol strong anion: Cl⁻ …), sys:{ acid-key: mmol } }.
   Every weak acid system is stored in its fully protonated form; salts
   like NaHCO₃ = H₂CO₃ + Na⁺. pH is found from the charge balance
     [H⁺] + sb/V = [OH⁻] + sa/V + Σ C·(mean negative charge of the acid)
   by bisection — exact for any mix, so indicators never need a fake
   “if acid then red” rule: colour follows the real pH.
   ===================================================================== */
const ACID = {
  cit:[3.13,4.76,6.40],  // citric (lemon, amla, tomato)
  asc:[4.10,11.6],       // ascorbic — vitamin C (amla)
  tar:[2.98,4.34],       // tartaric (tamarind)
  ace:[4.76],            // acetic (vinegar)
  lac:[3.86],            // lactic (curd)
  oxa:[1.25,4.14],       // oxalic (tomato)
  car:[6.35,10.33],      // carbonic (baking soda, washing soda, tap water)
  fat:[8.5],             // fatty acid of soap (in micelles)
  ext:[4.5],             // plant acids in the rose extract
  lit:[6.5],             // litmus dye itself
};

  if(safe!==undefined){ const ys=bot-(bot-top-5)*(safe-T0)/(T1-T0); line(ctx,x-18,ys,x+26,ys,COL.green,2,[5,3]); }
  thermo(ctx,x,top,bot,f,COL.ink,COL.red);
  marks.forEach(m=>{ const yy=bot-(bot-top-5)*(m-T0)/(T1-T0); textAt(ctx,m+'°',x+13,yy+4,{size:11,weight:600,color:COL.muted}); });
}
/* tiny x–y chart; pts = [[x,y],...] in data coords */
function miniChart(ctx,x,y,w,h,xr,yr,series,o){
  o=o||{}; ctx.save(); rrect(ctx,x,y,w,h,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=1.2; ctx.stroke();
  const px=v=>x+34+(w-44)*(v-xr[0])/(xr[1]-xr[0]), py=v=>y+h-24-(h-36)*(v-yr[0])/(yr[1]-yr[0]);
  line(ctx,px(xr[0]),py(yr[0]),px(xr[1]),py(yr[0]),COL.mid,1.2); line(ctx,px(xr[0]),py(yr[0]),px(xr[0]),py(yr[1]),COL.mid,1.2);
  if(o.band){ ctx.fillStyle='rgba(31,157,85,0.1)'; const a=py(o.band[1]), b=py(o.band[0]); ctx.fillRect(px(xr[0]),a,px(xr[1])-px(xr[0]),b-a); }
  (o.yt||[]).forEach(v=>textAt(ctx,String(v),px(xr[0])-5,py(v)+4,{align:'right',size:10,color:COL.muted}));
  (o.xt||[]).forEach(v=>textAt(ctx,String(v),px(v),py(yr[0])+14,{align:'center',size:10,color:COL.muted}));
  if(o.xl) textAt(ctx,o.xl,px(xr[1]),py(yr[0])+14,{align:'right',size:10,weight:600,color:COL.muted});
  if(o.yl) textAt(ctx,o.yl,x+8,y+14,{size:10,weight:600,color:COL.muted});
  series.forEach(s=>{ if(s.pts.length<2) return; ctx.strokeStyle=s.col; ctx.lineWidth=s.lw||2.2; if(s.dash) ctx.setLineDash(s.dash); else ctx.setLineDash([]);
    ctx.beginPath(); s.pts.forEach((p,i)=>{ const X=px(clamp(p[0],xr[0],xr[1])), Y=py(clamp(p[1],yr[0],yr[1])); if(i) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); }); ctx.stroke(); });
  ctx.setLineDash([]); ctx.restore(); return {px,py};
}
function meterV(ctx,x,y,w,h,frac,col,label){ // vertical bar meter, y = top
  ctx.save(); rrect(ctx,x,y,w,h,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke();
  const f=clamp(frac,0,1); ctx.save(); rrect(ctx,x,y,w,h,5); ctx.clip(); ctx.fillStyle=col; ctx.globalAlpha=0.85; ctx.fillRect(x,y+h*(1-f),w,h*f); ctx.restore();
  if(label) textAt(ctx,label,x+w/2,y+h+16,{align:'center',size:12,weight:700,color:col});
  ctx.restore();
}


/* =====================================================================
   2.1 LITMUS ON A WHITE TILE  (also reused by 2.5 for turmeric paper)
   A drop is squeezed out, swells at the tip, detaches and free-falls
   (g compressed). On the paper it spreads like a wicking front
   r = R·√(1 − e^(−t/τ)) and the dye converts first-order toward the
   colour set by the REAL pH of (drop + what the paper holds):
   blue litmus carries a trace of alkali, red litmus a trace of acid —
   that is why neutral drops change neither.
   Finished pairs fly (spring) into the Group A / B / C trays = Table 2.2.
   ===================================================================== */
function paperTest(cfg){
  const n=cfg.papers.length, PW=n===2?172:190, PH=112, GAP=58;
  const x0=400-(n*PW+(n-1)*GAP)/2, PY=188;
  const home=i=>({x:x0+i*(PW+GAP), y:PY});
  const binW=(760-(cfg.bins.length-1)*10)/cfg.bins.length;
  const bins=cfg.bins.map((b,i)=>Object.assign({x:20+i*(binW+10), y:378, w:binW, h:112, items:[]},b));
  const S={ key:null, pieces:[], flying:[], queue:[], results:{}, auto:false, ring:[],
    dy:spr(-40), dyT:0, swapTo:null,
    rig:dropperRig(400,104,'lemon'),
    fresh(){ this.pieces=cfg.papers.map((p,i)=>({p, spots:[], x:spr(home(i).x-700-i*90), y:spr(PY), s:spr(1), rot:0, tx:home(i).x, ty:PY, ts:1})); },
    used(){ return this.pieces.some(pc=>pc.spots.length>0); },
    choose(key){
      if(this.rig.busy()) return;
      if(this.used()) this.retire();
      this.key=key; this.swapTo=key; this.dyT=-260;  // dropper lifts out, refills, comes back
      this.refresh&&this.refresh();
    },
    retire(){ // current pieces fly to their group tray
      const k=this.key, g=cfg.group(this.results[k]||{});
      const b=bins.find(b=>b.g===g); if(!b){ this.fresh(); return; }
      const idx=b.items.length, per=Math.max(1,Math.floor((b.w-10)/(n===2?64:52))), col=idx%per, row=Math.floor(idx/per);
      const ms=n===2?0.15:0.2, cw=n===2?64:52;
      this.pieces.forEach((pc,i)=>{ pc.tx=b.x+8+col*cw+i*(PW*ms+3); pc.ty=b.y+24+row*42; pc.ts=ms; pc.bin=b; pc.label=i===0?LIQ[k].name.split(' ')[0]:null; pc.labelCol=cfg.labelCol?cfg.labelCol(k):COL.muted; pc.lx=b.x+8+col*cw+(n*PW*ms+(n-1)*3)/2; pc.ly=b.y+24+row*42+PH*ms+11; });
      b.items.push(k); this.flying.push(...this.pieces); this.fresh();
    },
    drop(){ if(!this.key||this.rig.busy()||this.used()||this.swapTo) return false;
      this.queue=this.pieces.map((pc,i)=>i); return true; },
    reset(){ this.results={}; bins.forEach(b=>b.items=[]); this.flying=[]; this.queue=[]; this.key=null; this.fresh(); this.auto=false; this.refresh&&this.refresh(); },
    nextUntested(){ return SAMPLES.find(k=>!this.results[k]); },
    tick(dt,ctx,t){
      const rig=this.rig;
      // dropper vertical travel: lift → swap liquid → return
      springTo(this.dy,this.dyT,60,13,dt);
      if(this.swapTo && this.dy.x<-230){ rig.x.x=rig.tx=home(0).x+PW/2; rig.x.v=0; rig.key=this.swapTo; rig.fill=0.75; this.swapTo=null; this.dyT=0; }
      rig.tipY=104+this.dy.x+Math.sin(t*2.1)*2;
      if(this.queue.length && !rig.busy() && !this.swapTo && Math.abs(this.dy.x)<3){
        const i=this.queue.shift(), pc=this.pieces[i]; rig.moveTo(pc.tx+PW/2); rig.squeezeOnce(1); rig.target=i; }
      rig.onLand=(x,y)=>{ const pc=this.pieces[rig.target]; if(!pc) return;
        const pH=paperPH(pc.p.k,rig.key);
        pc.spots.push(spotNew(x-pc.x.x,PH/2+(Math.random()-0.5)*6,PH*0.36,pc.p.base,pc.p.col(pH)));
        this.ring.push({x,y,t:0}); const r=this.results[rig.key]||(this.results[rig.key]={}); r[pc.p.k]=pH; };
      rig.step(dt,x=>PY+PH/2);
      // pieces
      for(const pc of this.pieces.concat(this.flying)){ springTo(pc.x,pc.tx,34,9,dt); springTo(pc.y,pc.ty,34,9,dt); springTo(pc.s,pc.ts,34,9,dt); pc.spots.forEach(s=>spotStep(s,dt)); }
      this.ring.forEach(r=>r.t+=dt); this.ring=this.ring.filter(r=>r.t<0.6);
      const done=this.used() && this.pieces.every(pc=>pc.spots.length>0 && spotConv(pc.spots[0])>0.96) && !rig.busy();
      if(done && !this.logged){ this.logged=true; cfg.onResult&&cfg.onResult(this.key,this.results[this.key]); }
      if(!this.used()) this.logged=false;
      if(this.auto && !rig.busy() && !this.queue.length && !this.swapTo && Math.abs(this.dy.x)<3){
        if(!this.key || done){ const nx=this.nextUntested(); if(nx) this.choose(nx); else { this.auto=false; if(this.used()) this.retire(); this.key=null; this.refresh&&this.refresh(); } }
        else if(!this.used() && this.pieces.every(pc=>Math.abs(pc.x.x-pc.tx)<3)) this.drop();
      }
      // ---- draw
      tile(ctx,70,150,660,196);
      cfg.papers.forEach((p,i)=>textAt(ctx,p.name,home(i).x+PW/2,PY+PH+28,{align:'center',size:14,weight:600,color:COL.muted}));
      bins.forEach(b=>{ ctx.save(); rrect(ctx,b.x,b.y,b.w,b.h,10); ctx.fillStyle='#fbfcfe'; ctx.fill(); ctx.setLineDash([6,4]); ctx.strokeStyle=b.col; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
        textAt(ctx,b.name,b.x+10,b.y+16,{size:12.5,weight:700,color:b.col}); });
      const drawPc=pc=>{ ctx.save(); ctx.translate(pc.x.x,pc.y.x); ctx.scale(pc.s.x,pc.s.x); paperPiece(ctx,0,0,PW,PH,pc.p.base,pc.spots); ctx.restore(); };
      this.flying.forEach(pc=>{ drawPc(pc); if(pc.label && Math.abs(pc.y.x-pc.ty)<6) textAt(ctx,pc.label,pc.lx,pc.ly,{align:'center',size:10.5,weight:600,color:pc.labelCol}); });
      this.pieces.forEach(drawPc);
      this.ring.forEach(r=>{ ctx.save(); ctx.globalAlpha=1-r.t/0.6; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(r.x,r.y,8+r.t*70,(8+r.t*70)*0.4,0,0,7); ctx.stroke(); ctx.restore(); });
      rig.draw(ctx);
      if(this.key){ textAt(ctx,LIQ[rig.key].name,rig.x.x+20,rig.tipY-150,{size:14,weight:700,color:COL.yellow}); }
      else textAt(ctx,'Pick a sample →',560,80,{align:'center',size:16,weight:600,color:COL.mid});
    }
  };
  S.fresh(); S.pieces.forEach(pc=>{ pc.x.x=pc.tx; });
  return S;
}

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Sample in the dropper</label><div class="chip-wrap" id="chips"></div></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go">💧 Put a drop on each</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="all">▶ Test all</button><button class="toggle-btn" id="clr">↺ Clear tile</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Blue litmus')}${card('r2','Red litmus')}<div class="rcard wide"><div class="rlabel">Nature</div><div class="rval" id="r3">—</div></div></div></div>
    <div class="control-group"><label>Table 2.1</label><table class="log"><thead><tr><th>Sample</th><th>Blue</th><th>Red</th></tr></thead><tbody id="lg"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const word=(paper,pH)=>{ const f=baseFrac(pH,6.5,1); return paper==='blue'?(f<0.5?'→ red':'no change'):(f>0.5?'→ blue':'no change'); };
  const group=r=>{ if(r.blue===undefined) return null; const b=baseFrac(r.blue,6.5), rd=baseFrac(r.red,6.5); return b<0.5?'A':(rd>0.5?'B':'C'); };
  const natOf={A:'acidic',B:'basic',C:'neutral'};
  const S=paperTest({ papers:[{k:'blue',name:'Blue litmus',base:LIT_BLUE,col:litmusCol},{k:'red',name:'Red litmus',base:LIT_RED,col:litmusCol}],
    group, bins:[{g:'A',name:'Group A · blue → red',col:COL.red},{g:'B',name:'Group B · red → blue',col:COL.blue},{g:'C',name:'Group C · no change',col:COL.green}],
    onResult(k,r){ const g=group(r), c=NCOL[natOf[g]];
      $('#lg').insertAdjacentHTML('beforeend',`<tr><td>${LIQ[k].name}</td><td>${sw(litmusCol(r.blue))} ${word('blue',r.blue)}</td><td>${sw(litmusCol(r.red))} ${word('red',r.red)}</td></tr>`);
      setv($,'r1',word('blue',r.blue)); setv($,'r2',word('red',r.red)); const e=$('#r3'); e.textContent=natOf[g]+' · Group '+g; e.style.color=c; refresh(); } });
  function refresh(){
    $('#chips').innerHTML=SAMPLES.map(k=>{ const r=S.results[k], g=r&&r.red!==undefined?group(r):null;
      return `<button class="chip-btn${S.key===k?' active':''}" data-k="${k}"${g?` style="border-color:${NCOL[natOf[g]]}"`:''}>${LIQ[k].name}</button>`; }).join('');
    wrap.querySelectorAll('#chips .chip-btn').forEach(b=>b.onclick=()=>{ S.auto=false; S.choose(b.dataset.k); if(!S.results[b.dataset.k]){ ['r1','r2','r3'].forEach(i=>setv($,i,'—')); } });
  }
  S.refresh=refresh; refresh();
  $('#go').onclick=()=>S.drop();
  $('#all').onclick=()=>{ S.auto=true; };
  $('#clr').onclick=()=>{ S.reset(); $('#lg').innerHTML=''; ['r1','r2','r3'].forEach(i=>setv($,i,'—')); };
  let t=0;
  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h); S.tick(dt,ctx,t); ctx.restore(); });
  return wrap;
}


/* =====================================================================
   2.2 SOUR, SLIPPERY, BITTER
   Taste: a spoon travels along a curved path to the mouth; sourness
   S = clamp((5 − pH)/3, 0, 1) from the food's real pH drives the pucker
   through a spring-damper (overshoot, then a slow relax) plus a
   shiver whose amplitude decays. The same food is dropped on blue and
   red litmus so “sour” and “turns blue litmus red” are seen together.
   Karela is bitter, yet litmus shows it is not basic.
   Touch: the finger is dragged by your hand through a spring; friction
   is stick-slip (static μs, kinetic μk):  m x'' = k(x_hand − x) − F_f.
   Water: μs 0.9, μk 0.6 → jerky stick-slip.  Soap / baking soda:
   μ ≈ 0.1–0.2 → the finger glides — “slippery”.
   ===================================================================== */
const FOODS = {
  lemon:   {acid:'Citric acid'},
  amla:    {acid:'Ascorbic acid (vitamin C) + citric acid'},
  tamarind:{acid:'Tartaric acid'},
  vinegar: {acid:'Acetic acid'},
  curd:    {acid:'Lactic acid'},
  tomato:  {acid:'Citric acid + oxalic acid'},
  karela:  {acid:'No acid — bitter, but not basic', bitter:1},
};
function drawFood(ctx,k,cx,cy,s,t){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink;
  const F=c=>{ ctx.fillStyle=c; ctx.fill(); ctx.stroke(); };
  if(k==='lemon'){ ctx.beginPath(); ctx.ellipse(0,0,62,60,0,0,7); F('#fbf1a8'); ctx.beginPath(); ctx.ellipse(0,0,50,48,0,0,7); ctx.fillStyle='#fff8cc'; ctx.fill(); ctx.lineWidth=1.6; ctx.stroke();
    for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; line(ctx,0,0,Math.cos(a)*48,Math.sin(a)*46,COL.yellow,1.8); }
    circ(ctx,0,0,5,COL.yellow,'#fff',1.6); }
  else if(k==='amla'){ ctx.beginPath(); ctx.ellipse(0,0,56,54,0,0,7); F('#e3efb8'); for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(0,0,Math.abs(i)*12+2,54,0,-Math.PI/2,Math.PI/2,i<0); ctx.lineWidth=1.4; ctx.strokeStyle=COL.green; ctx.stroke(); }
    line(ctx,0,-54,6,-68,COL.ink,3); }
  else if(k==='tamarind'){ ctx.beginPath(); ctx.moveTo(-90,10); for(let i=0;i<=6;i++){ const x=-90+i*30; ctx.quadraticCurveTo(x+15,-30-6*Math.sin(i),x+30,-14+i*2); } ctx.quadraticCurveTo(100,10,90,24);
    for(let i=6;i>=0;i--){ const x=-90+i*30; ctx.quadraticCurveTo(x+15,34,x,24-i*2); } ctx.closePath(); F('#e8cfa6');
    for(let i=1;i<6;i++) line(ctx,-90+i*30,-18+i*2,-88+i*30,22-i*2,'#a0703c',1.4); }
  else if(k==='vinegar'){ ctx.beginPath(); ctx.moveTo(-34,70); ctx.lineTo(-34,-10); ctx.quadraticCurveTo(-34,-34,-12,-44); ctx.lineTo(-12,-74); ctx.lineTo(12,-74); ctx.lineTo(12,-44); ctx.quadraticCurveTo(34,-34,34,-10); ctx.lineTo(34,70); ctx.closePath(); F('#fbf8ec');
    rect(ctx,-14,-86,28,12,COL.ink,COL.yellow,2); rect(ctx,-28,4,56,40,COL.ink,'#fff',1.6); textAt(ctx,'VINEGAR',0,29,{align:'center',size:10,weight:700,color:COL.ink}); }
  else if(k==='curd'){ ctx.beginPath(); ctx.moveTo(-80,-6); ctx.quadraticCurveTo(-76,56,0,58); ctx.quadraticCurveTo(76,56,80,-6); ctx.closePath(); F('#fff');
    ctx.beginPath(); ctx.moveTo(-72,-6); ctx.bezierCurveTo(-50,-40,-10,-30,0,-44); ctx.bezierCurveTo(14,-30,52,-38,72,-6); ctx.fillStyle='#fdfdf6'; ctx.fill(); ctx.lineWidth=1.8; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-6,80,10,0,0,7); ctx.lineWidth=2.6; ctx.stroke(); }
  else if(k==='tomato'){ ctx.beginPath(); ctx.ellipse(0,4,64,54,0,0,7); F('#f6b3a2');
    ctx.beginPath(); for(let i=0;i<5;i++){ const a=-Math.PI/2+i/5*Math.PI*2; ctx.moveTo(0,-46); ctx.quadraticCurveTo(Math.cos(a)*12,-46+Math.sin(a)*8,Math.cos(a)*24,-46+Math.sin(a)*12+4); } ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.stroke(); }
  else if(k==='karela'){ ctx.beginPath(); ctx.moveTo(-110,0); ctx.bezierCurveTo(-80,-44,70,-40,110,-4); ctx.bezierCurveTo(70,36,-80,40,-110,0); F('#d8ebc0');
    const R0=rng(5); for(let i=0;i<34;i++){ const x=-90+R0()*180, y=(R0()-0.5)*44*(1-Math.abs(x)/120); ctx.beginPath(); ctx.ellipse(x,y,5,3,0.2,0,7); ctx.strokeStyle=COL.green; ctx.lineWidth=1.3; ctx.stroke(); }
    line(ctx,110,-4,124,-14,COL.ink,3); }
  ctx.restore();
}
function spoon(ctx,x,y,ang,fillCol){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.lineWidth=2.4; ctx.strokeStyle=COL.ink;
  ctx.beginPath(); ctx.ellipse(0,0,20,12,0,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
  if(fillCol){ ctx.beginPath(); ctx.ellipse(0,1,13,6,0,0,7); ctx.fillStyle=fillCol; ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(18,-3); ctx.lineTo(110,-6); ctx.lineTo(110,4); ctx.lineTo(18,3); ctx.stroke(); ctx.restore();
}
function finger(ctx,x0,x1,yc,r,dir,ph){ // capsule finger, pad facing the other finger
  ctx.save(); ctx.lineWidth=2.8; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  ctx.beginPath(); if(dir>0){ ctx.moveTo(x0,yc-r); ctx.lineTo(x1-r,yc-r); ctx.arc(x1-r,yc,r,-Math.PI/2,Math.PI/2); ctx.lineTo(x0,yc+r); }
  else { ctx.moveTo(x1,yc-r); ctx.lineTo(x0+r,yc-r); ctx.arc(x0+r,yc,r,-Math.PI/2,Math.PI/2,true); ctx.lineTo(x1,yc+r); }
  ctx.fill(); ctx.stroke();
  // nail + knuckle creases
  const tipx=dir>0?x1-r:x0+r;
  ctx.beginPath(); ctx.ellipse(tipx-dir*18,yc-(ph>0?-r*0.45:r*0.45),26,r*0.28,0,0,7); ctx.lineWidth=1.8; ctx.stroke();
  for(let i=1;i<=2;i++){ const kx=tipx-dir*(r+70*i); line(ctx,kx,yc-r*0.7,kx+dir*4,yc+r*0.7,COL.mid,1.6); }
  // fingerprint ridges on the pad
  ctx.save(); ctx.beginPath(); ctx.rect(Math.min(x0,x1)-5,ph>0?yc:yc-r,Math.abs(x1-x0)+10,r); ctx.clip();
  for(let i=1;i<6;i++){ ctx.beginPath(); ctx.ellipse(tipx-dir*48,yc+(ph>0?r:-r)*0.9,i*12,i*6,0,0,7); ctx.strokeStyle='rgba(129,149,171,0.55)'; ctx.lineWidth=1.2; ctx.stroke(); }
  ctx.restore(); ctx.restore();
}
const RUB = {

  soap: {name:'Soap solution', ms:0.12, mk:0.08, film:'#eef2f7', key:'soap', bub:1},
};
function buildA2(){

  wrap.querySelector('.lab-side').innerHTML = `

      <div class="control-group"><div class="result-cards">${card('u1','Grip (μ)')}${card('u2','Motion')}<div class="rcard wide"><div class="rlabel">Feels</div><div class="rval" id="u3">—</div></div></div></div>
    </div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');

/* =====================================================================
   2.3 MAKING RED ROSE EXTRACT — wash · crush · hot water · wait · filter
   Crushing: every pestle pass splits nearby pieces (size ÷ √2 each).
   Extraction (colour leaving the petals), t in minutes:
       dC/dt = (1 − C)/τ ,   τ = 2.5 min · (s/4 mm) · D(90°C)/D(T) · p(90)/p(T)
     D ∝ T/η(T), water viscosity η = 2.414×10⁻⁵ · 10^(247.8/(T − 140)) Pa·s
     p(T) = cell-wall leakiness, 0.15 → 1 as heat opens the cells (45–70 °C)
   The water cools by Newton’s law toward 27 °C, faster without the lid,
   so τ keeps growing while you wait. 10 minutes are shown in ~10 s.
   Filtering: the tilted tumbler empties by weir flow Q ∝ head^1.5; the
   filter cone drains ∝ its own liquid head (Darcy), dripping into the tube.

function etaW(T){ return 2.414e-5*Math.pow(10,247.8/(T+273.15-140)); }
function diffW(T){ return (T+273.15)/etaW(T); }
function leak(T){ return 0.15+0.85*smooth01(45,70,T); }
function tauExt(T,s){ return 2.5*(s/4)*(diffW(90)/diffW(T))*(leak(90)/leak(T)); }

function pArea(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[i], r=p[(i+1)%p.length]; a+=q[0]*r[1]-r[0]*q[1]; } return Math.abs(a)/2; }

          if(f.sz>2.2 && Math.random()<dt*2.2 && frags.length+add.length<240){ f.sz/=Math.SQRT2; add.push({sz:f.sz,ang:Math.random()*6.28,mx:f.mx+(Math.random()-0.5)*10,my:f.my+(Math.random()-0.5)*6,dirt:0,jx:spr(0),jy:spr(0)}); juice+=0.004; } }

      ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(230,320); ctx.bezierCurveTo(236,470,564,470,570,320); ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.ellipse(400,320,170,22,0,0,7); ctx.stroke(); ctx.restore();
      // pestle: head at (hx,hy), handle up to the right
      const top=[hx+120+Math.cos(pest)*30,120];
      ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=30; ctx.beginPath(); ctx.moveTo(hx,hy-10); ctx.lineTo(top[0],top[1]); ctx.stroke();
      ctx.strokeStyle='#fff'; ctx.lineWidth=24.5; ctx.stroke(); ctx.restore();
      circ(ctx,hx,hy-6,22,COL.ink,'#fff',3);
      ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.yellow; ctx.beginPath(); ctx.arc(top[0],top[1],16,0,7); ctx.stroke(); ctx.restore();
      if(on) for(let i=0;i<3;i++){ const a=pest-0.4-i*0.25; ctx.save(); ctx.globalAlpha=0.5-i*0.15; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(400,404,95,14,0,a-0.3,a); ctx.stroke(); ctx.restore(); }
      textAt(ctx,'Pieces: '+frags.length+'   ·   average size ≈ '+fmt(s,1)+' mm',400,490,{align:'center',size:14,weight:600,color:COL.muted});
      if(s<=9 && !done[1]){ done[1]=1; pills(); labels(); }
    }
    // ---------------- STEP 2 – 4 : tumbler
    if(step>=2){
      // pour pieces in, then hot water
      if(pourT>=0){ pourT+=dt;
        frags.forEach(f=>{ if(!f.landed){ f.vy+=1500*dt; f.fy+=f.vy*dt; if(f.fy>=f.ly){ f.fy=f.ly; f.landed=true; } } });
        if(pourT>1.4 && water<FULL){ stream=1; const add=Math.min(FULL-water,16000*dt); water+=add; Tw=water>add?(Tw*(water-add)+(Tk-4)*add)/water:Tk-4; }
        else stream=0;
        if(water>=FULL){ pourT=-1; stream=0; done[2]=1; pills(); labels(); }
      }
      // extraction + cooling (minutes)
      if(step===3 && run && !done[3]) {}
      if(step>=3 && run){ const dm=dt*1.0; tm+=dm; const k=lid&&step===3?1/35:1/12; Tw=27+(Tw-27)*Math.exp(-k*dm);
        const dC=(1-C)/tauExt(Tw,Math.max(1.2,s))*dm; C=Math.min(1,C+dC);
        if(clouds.length<40 && Math.random()<dC*300) clouds.push({x:-160+Math.random()*140,y:215,r:4,a:0.3});
        if(hist.length===0||tm-hist[hist.length-1][0]>0.1) hist.push([tm,C,Tw]);

      // filtering: move lip above the funnel, tilt, weir flow

      springTo(lip.x,target[0],30,10,dt); springTo(lip.y,target[1],30,10,dt);
      let Q=0;

        if(Q>40 && Math.random()<dt*3 && onPaper.length<9){ onPaper.push({x:FX+(Math.random()-0.5)*40,y:FT+20+Math.random()*20,sz:Math.max(3,s*0.7),ang:Math.random()*6}); const f=frags.find(f=>!f.gone&&!f.p); if(f) f.gone=true; }
      } else springTo(ang,0,12,7,dt);
      // Darcy drain through the paper
      const qf=cone*1.1; cone-=qf*dt; tubeA+=qf*dt*0.18;
      if(qf>30 && Math.random()<dt*Math.min(18,qf/60)) fdrops.push({y:FT+132,vy:40});
      fdrops.forEach(d=>{ d.vy+=1400*dt; d.y+=d.vy*dt; }); const tubeLvl=414-Math.min(78,tubeA/40); fdrops=fdrops.filter(d=>d.y<tubeLvl);
      if(step===4 && fillT>0 && water<400 && cone<200 && !done[4] && tubeA>1200){ done[4]=1; pills(); labels(); }

      // ---- draw bench
      tableTop(ctx,40,760,422,0);
      // kettle (step 2)
      if(step===2){ const tilt=stream?0.75:0.1*Math.sin(t*1.3)*0; const kx=650, ky=280;
        ctx.save(); ctx.translate(kx,ky); ctx.rotate(-tilt); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(-60,60); ctx.lineTo(-50,-40); ctx.quadraticCurveTo(0,-62,50,-40); ctx.lineTo(60,60); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-52,20); ctx.lineTo(-110,-40); ctx.lineTo(-104,-48); ctx.lineTo(-50,-4); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(40,-36); ctx.bezierCurveTo(100,-60,100,50,58,40); ctx.stroke(); circ(ctx,0,-56,7,COL.ink,'#fff',2.4); ctx.restore();
        const sp=[kx+Math.cos(-tilt)*(-107)-Math.sin(-tilt)*(-44), ky+Math.sin(-tilt)*(-107)+Math.cos(-tilt)*(-44)];
        steam(ctx,sp[0],sp[1]-6,20,(Tk-35)/60,t);
        textAt(ctx,Tk+' °C',kx+50,ky+110,{align:'center',size:15,weight:700,color:COL.red});
        if(stream){ const P=tumblerPoly(), Y=levelDown(P,water); ctx.save(); ctx.strokeStyle='rgba(47,143,224,0.6)'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sp[0],sp[1]);
          for(let k=1;k<=16;k++){ const u=k/16; ctx.lineTo(sp[0]-u*(sp[0]-395)+Math.sin(t*40+k)*0.8, sp[1]+(Y-sp[1])*u*u); } ctx.stroke(); ctx.restore(); }
      }
      // pouring mortar (start of step 2)
      if(step===2 && pourT>=0 && pourT<1.6){ const a=smooth01(0,0.4,pourT)-smooth01(1.1,1.6,pourT);
        ctx.save(); ctx.translate(250,40+60*a); ctx.rotate(0.9*a); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-70,-10); ctx.bezierCurveTo(-66,70,66,70,70,-10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      // funnel + filter + tube (step 4)
      if(step===4){
        tubeStand(ctx,540,660,356,404);
        const lv=Math.min(78,tubeA/40); testTube(ctx,FX,326,90,17,lv,mixCol('#fbe3ec',EXT_COL,0.95*C),{});
        // funnel
        const cl=Math.sqrt(Math.max(0,cone)/60);
        ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.moveTo(FX-64,FT); ctx.lineTo(FX-7,FT+90); ctx.lineTo(FX-5,FT+132); ctx.lineTo(FX+5,FT+132); ctx.lineTo(FX+7,FT+90); ctx.lineTo(FX+64,FT); ctx.stroke();
        if(cl>0.5){ ctx.beginPath(); const yy=FT+86-Math.min(70,cl*6); const hw=(FT+86-yy)*0.62; ctx.moveTo(FX-hw,yy); ctx.lineTo(FX,FT+86); ctx.lineTo(FX+hw,yy); ctx.closePath(); ctx.fillStyle=liquidCol(); ctx.fill(); }
        ctx.setLineDash([5,4]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(FX-58,FT+2); ctx.lineTo(FX,FT+86); ctx.lineTo(FX+58,FT+2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        onPaper.forEach(p=>petal(ctx,p.x,p.y,p.sz,p.ang,0,'#e7c9d5'));
        fdrops.forEach(d=>dropShape(ctx,FX,d.y,3.2,liquidCol(),1.1));
        if(Q>1){ const P=tumblerPoly(); ctx.save(); ctx.strokeStyle=liquidCol(); ctx.globalAlpha=0.95; ctx.lineWidth=clamp(Math.sqrt(Q)*0.08,2,8); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(P[1][0]+2,P[1][1]);
          for(let k=1;k<=10;k++){ const u=k/10; ctx.lineTo(P[1][0]+2+u*14,P[1][1]+u*u*(FT+40-P[1][1])); } ctx.stroke(); ctx.restore(); }
        textAt(ctx,'Red rose extract',FX,448,{align:'center',size:13,weight:700,color:tubeA>800?EXT_COL:COL.mid});
      }
      drawTumbler(ctx,liquidCol());
      // colour clouds rising from the pieces (local coords)
      ctx.save(); ctx.translate(lip.x.x,lip.y.x); ctx.rotate(ang.x); ctx.beginPath(); TUMB.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](q[0],q[1])); ctx.clip();
      clouds.forEach(c=>{ const Y=water>0?levelDown(TUMB,water):230; if(c.y<Y) return; ctx.globalAlpha=Math.max(0,c.a); ctx.fillStyle=EXT_COL; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7); ctx.fill(); }); ctx.restore();
      // lid
      springTo(lidY,(step===3&&lid)?0:-170,70,8,dt);
      if(lidY.x>-160){ const P=tumblerPoly(); ctx.save(); ctx.lineWidth=2.8; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,P[0][0]-12,P[0][1]-12+lidY.x,(P[1][0]-P[0][0])+24,12,5); ctx.fill(); ctx.stroke(); circ(ctx,(P[0][0]+P[1][0])/2,P[0][1]-18+lidY.x,6,COL.yellow,'#fff',2.4); ctx.restore(); }
      else if(step>=3 && water>2000 && Tw>45 && Math.abs(ang.x)<0.1){ const P=tumblerPoly(); steam(ctx,(P[0][0]+P[1][0])/2,P[0][1]-10,60,(Tw-45)/40,t); }
      // thermometer in the tumbler (steps 2–3)
      if(step===2||step===3){ thermoScale(ctx,215,120,380,Tw,20,100,[40,60,80,100]); }
      // clock + chart (step 3)
      if(step===3){ const cx=680, cy=330; circ(ctx,cx,cy,44,COL.ink,'#fff',2.8); for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; line(ctx,cx+Math.cos(a)*36,cy+Math.sin(a)*36,cx+Math.cos(a)*41,cy+Math.sin(a)*41,COL.ink,2); }
        const a=-Math.PI/2+tm/60*Math.PI*2; line(ctx,cx,cy,cx+Math.cos(a)*34,cy+Math.sin(a)*34,COL.yellow,3); circ(ctx,cx,cy,3,COL.ink,COL.ink,1);
        textAt(ctx,fmt(tm,1)+' min',cx,cy+64,{align:'center',size:14,weight:700,color:COL.ink});
        const ch=miniChart(ctx,520,24,270,210,[0,20],[0,100],[{pts:hist.map(p=>[p[0],p[1]*100]),col:EXT_COL,lw:2.6},{pts:hist.map(p=>[p[0],p[2]]),col:COL.red,lw:1.6,dash:[5,4]}],{xt:[0,5,10,15,20],yt:[0,50,100]});
        textAt(ctx,'— colour out %',524,18,{size:11.5,weight:700,color:EXT_COL}); textAt(ctx,'- - water °C',650,18,{size:11.5,weight:700,color:COL.red}); textAt(ctx,'minutes',655,250,{align:'center',size:11,color:COL.muted});
        line(ctx,ch.px(5),ch.py(0),ch.px(5),ch.py(100),'#dbe4f0',1); line(ctx,ch.px(10),ch.py(0),ch.px(10),ch.py(100),'#dbe4f0',1);
      }
    }
    setv($,'c1',fmt(s,1)+' mm');
    setv($,'c2',step>=2&&water>0?fmt(Tw,0)+' °C':(step===2?Tk+' °C':'—'));
    setv($,'c3',step>=3?fmt(tm,1)+' min':'—');
    setv($,'c4',step>=3?Math.round(C*100)+' %':'—');
    setv($,'tV',Tk+' °C');
  }
  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h); tick(dt,ctx); ctx.restore(); });

/* =====================================================================
   2.4 TESTING WITH RED ROSE EXTRACT — tubes A and B
   10–20 drops of extract, then 20–30 drops of a sample (1 drop = 0.05 mL).
   Each drop enters as a plume carrying its own local colour, sinks and
   hands its contents to the bulk first-order (τ = 1.6 s still, 0.25 s
   when swirled). Bulk colour = rose-anthocyanin colour at the bulk’s
   solved pH; its depth ∝ 1 − e^(−3·f_extract), so dilution pales it.
   ===================================================================== */
function roseWord(pH){ return pH<3.3?'red':(pH>7.3?'green':'no change'); }
function roseNature(pH){ return pH<3.3?'acidic':(pH>7.3?'basic':'neutral'); }
function buildA4(){
  const wrap=labShell();
  const opts=SAMPLES.map(k=>`<option value="${k}">${LIQ[k].name}</option>`).join('');
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="role-row"><span class="rdot" style="background:var(--f-yellow)"></span><span class="rname">Tube A</span><select id="sA">${opts}</select></div>
      <div class="role-row"><span class="rdot" style="background:var(--f-yellow)"></span><span class="rname">Tube B</span><select id="sB">${opts}</select></div></div>
    <div class="control-group"><label>Extract in each tube <span class="val" id="eV"></span></label><input type="range" id="eR" min="10" max="20" value="15">
      <label style="margin-top:8px">Sample drops to add <span class="val" id="dV"></span></label><input type="range" id="dR" min="20" max="30" value="25"></div>
    <div class="control-group"><button class="toggle-btn play" id="add" style="width:100%;padding:9px">💧 Add the drops</button>
      <div class="toggle-group"><button class="toggle-btn" id="sw">🌀 Swirl</button><button class="toggle-btn" id="fr">↺ Fresh tubes</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Tube A')}${card('k2','Tube B')}</div></div>
    <div class="control-group"><label>Table 2.3</label><table class="log"><thead><tr><th>Sample</th><th>Extract turns</th><th>Nature</th></tr></thead><tbody id="lg"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  $('#sA').value='lemon'; $('#sB').value='soap';
  const TOP=150, H=270, RR=32, PXML=88;
  const tubes=['A','B'].map((n,i)=>({n, x:290+i*220, mix:null, ext:0, plumes:[], added:0, want:0, key:null, rot:spr(0), content:[], logged:true,
    rig:dropperRig(290+i*220,108,i?'soap':'lemon'), dy:spr(0), dyT:0, swap:null}));
  let swirlT=0, t=0;
  function fresh(){ const e=+$('#eR').value;
    tubes.forEach(tb=>{ tb.mix=mixAdd(mixNew(),'rose',e*0.05); tb.ext=e*0.05; tb.plumes=[]; tb.added=0; tb.want=0; tb.content=[]; tb.logged=true; tb.rig.queue=0; });
    ['k1','k2'].forEach(i=>setv($,i,'—')); }
  fresh();
  function setSample(tb,key){ if(tb.rig.key===key) return; tb.swap=key; tb.dyT=-260; }
  $('#sA').onchange=()=>setSample(tubes[0],$('#sA').value);
  $('#sB').onchange=()=>setSample(tubes[1],$('#sB').value);
  $('#eR').oninput=()=>{ setv($,'eV',$('#eR').value+' drops'); if(tubes.every(tb=>tb.added===0)) fresh(); };
  $('#dR').oninput=()=>setv($,'dV',$('#dR').value+' drops');
  setv($,'eV','15 drops'); setv($,'dV','25 drops');
  $('#add').onclick=()=>{ const n=+$('#dR').value; tubes.forEach(tb=>{ if(tb.rig.busy()||tb.swap) return; tb.want+=n; tb.rig.squeezeOnce(n); tb.logged=false; if(!tb.content.includes(tb.rig.key)) tb.content.push(tb.rig.key); }); };
  $('#sw').onclick=()=>{ swirlT=2.5; };
  $('#fr').onclick=()=>fresh();
  const surfY=tb=>TOP+H-Math.min(H-20,tb.mix.V*PXML);
  tubes.forEach(tb=>{ tb.rig.onLand=(x,y,d)=>{ const dm=mixAdd(mixNew(),d.key,0.05), loc=mixAddMix(mixCopy(dm),tb.mix,0.02/Math.max(0.05,tb.mix.V));
      tb.plumes.push({x:x+(Math.random()-0.5)*6, y, vy:55, r:6, m:1, dm, col:roseCol(mixPH(loc))}); tb.added++; }; });

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    if(swirlT>0) swirlT-=dt;
    const tau=swirlT>0?0.25:1.6;
    tubeStand(ctx,190,610,250,438);
    tubes.forEach((tb,i)=>{
      // dropper lift / refill / return
      springTo(tb.dy,tb.dyT,60,13,dt);
      if(tb.swap && tb.dy.x<-230){ tb.rig.key=tb.swap; tb.rig.fill=0.8; tb.swap=null; tb.dyT=0; }
      tb.rig.tipY=108+tb.dy.x+Math.sin(t*2+i)*2;
      tb.rig.speed=2.2;
      tb.rig.step(dt,()=>surfY(tb));  // speed 2.2 → brisk squeezing, ≈ 4 drops per second
      // plumes: sink, spread, dissolve into the bulk
      tb.plumes.forEach(p=>{ const k=dt/tau, f=Math.min(p.m,p.m*k*1.0+0.0); mixAddMix(tb.mix,p.dm,f); p.m-=f;
        p.vy=approach(p.vy,swirlT>0?0:12,2,dt); p.y=Math.min(TOP+H-RR-4,p.y+p.vy*dt); p.r+=dt*(swirlT>0?60:14); p.x+=Math.sin(t*3+p.y*0.05)*dt*(swirlT>0?60:6); });
      tb.plumes=tb.plumes.filter(p=>p.m>0.02);
      // swirl = driven rocking, then a damped settle
      const drive=swirlT>0?0.16*Math.sin(t*2*Math.PI*2.2):0; springTo(tb.rot,drive,160,6,dt);
      const pH=mixPH(tb.mix), fe=tb.ext/tb.mix.V, bulk=mixCol('#ffffff',roseCol(pH),1-Math.exp(-3*fe));
      testTube(ctx,tb.x,TOP,H,RR,Math.min(H-20,tb.mix.V*PXML),bulk,{rot:tb.rot.x,wob:tb.rot.x*40,inside:()=>tb.plumes.forEach(p=>plumeDraw(ctx,{x:p.x,y:p.y,r:p.r,m:p.m,col:p.col}))});
      // drop count ticks on the tube
      textAt(ctx,tb.n,tb.x-RR-26,TOP+40,{align:'center',size:26,weight:700,color:COL.ink});
      textAt(ctx,tb.content.length?tb.content.map(k=>LIQ[k].name).join(' + '):'extract only',tb.x,466,{align:'center',size:13,weight:600,color:COL.muted});
      textAt(ctx,tb.added+' / '+tb.want+' drops',tb.x,488,{align:'center',size:12,color:COL.yellow});
      tb.rig.draw(ctx);
      textAt(ctx,LIQ[tb.rig.key].name,tb.rig.x.x+20,tb.rig.tipY-148,{size:13,weight:700,color:COL.yellow});
      // result
      const word=tb.added?roseWord(pH):'—';
      setv($,i?'k2':'k1',word);
      const settled=!tb.rig.busy() && tb.plumes.length===0 && tb.added>0 && tb.added>=tb.want;
      if(settled && !tb.logged){ tb.logged=true; const nat=roseNature(pH);
        $('#lg').insertAdjacentHTML('afterbegin',`<tr><td>${tb.content.map(k=>LIQ[k].name).join(' + ')}</td><td>${sw(roseCol(pH))} ${roseWord(pH)}</td><td style="color:${NCOL[nat]};font-weight:700">${nat}</td></tr>`); }
    });
    ctx.restore();
  });
  return wrap;
}


/* =====================================================================
   2.5 TURMERIC PAPER — make it, then test the samples of Activity 2.1
   Paste: grains swirl with the spoon (flow speed ∝ radius) and wet
   grains merge; evenness U = 1 − e^(−stir/1.2 s).
   Dip: the paste climbs the filter paper by capillarity (Washburn)
   h = √(k·t), so it races up first and slows near the top.
   Dry: moisture M falls first-order, M' = −M/τ (τ shorter in the sun);
   it drips while M is high (rate ∝ M²) and the yellow brightens.
   Test: curcumin turns red above pH ≈ 8 (fraction = 1/(1+10^(1.5(8−pH)))),
   so only bases change it — acids and neutrals both stay yellow.
   ===================================================================== */
const TUR_WET='#b87f00';
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="step-row" id="pills"></div></div>
    <div class="side-sub" id="mk">

   perceived smell ψ = 1 − e^(−n/6) of the n molecules breathed in.

    // ---- the sniff: face glides over the strip, breathes in for 1.2 s, rises
    if(face_.target!==null){ face_.sn+=dt; const s=strips[face_.target], down=face_.sn<2.2;
      springTo(face_.x,down?s.x:400,26,9,dt); springTo(face_.y,down?290:120,26,9,dt);
      face_.pull=(face_.sn>0.7&&face_.sn<1.9)?1:0;
      if(face_.sn>2.0 && face_.sn-dt<=2.0){ const psi=1-Math.exp(-face_.count/6); const k=s.n; bars[k][step>=2?1:0]=psi; face_.psi.v+=0; face_.mood=psi; setv($,face_.target?'o2':'o1',psi>0.6?'strong onion':psi>0.25?'faint onion':'no onion smell');
        if(step===1||step===3){ const idx=step>=2?1:0; if(bars.A[idx]!==null&&bars.B[idx]!==null&&!done[step]){ done[step]=1; pills(); buttons(); } } }
      if(face_.sn>3.2){ face_.target=null; face_.pull=0; } }
    else { springTo(face_.x,400,26,9,dt); springTo(face_.y,120,26,9,dt); }
    springTo(face_.psi,face_.target!==null&&face_.sn>1.9?face_.mood:0,40,7,dt);
    rigs.forEach(r=>{ r.tipY=approach(r.tipY,done[2]&&!r.busy()?-260:300,3,dt); });
    if(dropsOn){ rigs.forEach(r=>r.step(dt,()=>410)); if(rigs.every(r=>!r.busy())&&strips.every(s=>s.spots.length>=3)&&!done[2]){ done[2]=1; pills(); buttons(); } }

    // ---- draw
    tableTop(ctx,20,780,432,0);
    // jar (slides away after the night)
    if(jarX.x>-500){ ctx.save(); ctx.translate(jarX.x,0);
      ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='rgba(255,255,255,0.9)'; rrect(ctx,260,160,280,272,26); ctx.fill(); ctx.stroke(); ctx.restore();
      onionBits(ctx,400,420,240,t);
      if(out.x<0.3) [340,460].forEach(x=>{ ctx.save(); ctx.fillStyle=mixCol('#ffffff','#e9d6ef',strips[0].S); ctx.fillRect(x-12,176,24,150); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.strokeRect(x-12,176,24,150); ctx.restore(); });
      const lidUp=done[0]?-40:0; ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,250,146+lidUp,300,20,6); ctx.fill(); ctx.stroke(); ctx.restore();
      // clock
      if(!done[0]){ const cx=660, cy=240; circ(ctx,cx,cy,50,COL.ink,'#fff',2.8); const a=-Math.PI/2+hrs/12*Math.PI*2; line(ctx,cx,cy,cx+Math.cos(a)*40,cy+Math.sin(a)*40,COL.yellow,3); circ(ctx,cx,cy,3,COL.ink,COL.ink,1);
        textAt(ctx,fmt(hrs,1)+' h',cx,cy+74,{align:'center',size:15,weight:700,color:COL.ink}); textAt(ctx,night||hrs>0?'🌙':'',cx,cy-66,{align:'center',size:22}); }
      ctx.restore(); }
    // strips: fly from inside the jar to the table
    strips.forEach((s,i)=>{ const u=out.x, sx=lerp(340+i*120,s.x,clamp(u,0,1.1)), sy=lerp(250,410,clamp(u,0,1.1)), w=lerp(24,160,clamp(u,0,1)), h=lerp(150,34,clamp(u,0,1));
      if(u<0.3) return;
      ctx.save(); ctx.fillStyle=mixCol('#ffffff','#eadcf0',s.S); ctx.fillRect(sx-w/2,sy-h/2,w,h); ctx.beginPath(); ctx.rect(sx-w/2,sy-h/2,w,h); ctx.clip(); s.spots.forEach(p=>spotDraw(ctx,p)); ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.strokeRect(sx-w/2,sy-h/2,w,h); ctx.restore();
      if(u>0.9){ textAt(ctx,'Strip '+s.n,s.x,458,{align:'center',size:14,weight:700,color:COL.ink});
        if(s.key) textAt(ctx,LIQ[s.key].name,s.x,478,{align:'center',size:12,weight:600,color:NCOL[NATURE[s.key]]}); }
    });
    mols.forEach(m=>squig(ctx,m.x,m.y,m.a,clamp(m.life,0,1)*0.9));
    if(dropsOn || step===2) rigs.forEach(r=>{ if(r.tipY>-200) r.draw(ctx); });
    // the face
    if(out.x>0.6){ face(ctx,face_.x.x,face_.y.x,70,{t,sniff:face_.pull,pucker:0,bitter:face_.psi.x*0.9});
      if(face_.pull) for(let i=0;i<3;i++){ const ph=(t*3+i/3)%1; ctx.save(); ctx.globalAlpha=1-ph; ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(face_.x.x,face_.y.x+17,40*(1-ph)+6,0.2,Math.PI-0.2); ctx.stroke(); ctx.restore(); } }
    // before / after bars
    if(out.x>0.6){ const bx=640, by=40; ctx.save(); rrect(ctx,bx,by,150,150,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.stroke(); ctx.restore();
      textAt(ctx,'Smell',bx+10,by+18,{size:12,weight:700,color:COL.muted});
      [['A',0],['A',1],['B',0],['B',1]].forEach(([k,j],n)=>{ const v=bars[k][j], x=bx+18+n*32, h=100*(v||0);
        ctx.save(); ctx.fillStyle=j?(k==='A'?COL.red:COL.blue):COL.mid; ctx.globalAlpha=v===null?0:0.85; ctx.fillRect(x,by+128-h,20,h); ctx.restore();
        line(ctx,x-2,by+128,x+22,by+128,COL.ink,1.2); textAt(ctx,k+(j?'′':''),x+10,by+144,{align:'center',size:11,weight:600,color:COL.muted}); });
      textAt(ctx,'′ = after drops',bx+75,by+168,{align:'center',size:10.5,color:COL.muted}); }
    setv($,'o3','A '+Math.round(strips[0].S*100)+' %  ·  B '+Math.round(strips[1].S*100)+' %');
  }
  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h); tick(dt,ctx); ctx.restore(); });
  return wrap;
}


/* =====================================================================
   2.7 ACID MEETS BASE — neutralisation, drop by drop
   Lemon juice ≈ 0.25 M citric acid (3 acidic H each): one drop holds
   0.0375 mmol of acid. Lime water ≈ 0.02 M Ca(OH)₂ = 0.04 M OH⁻: one drop
   holds 0.002 mmol of base, so ≈ 19 drops are needed before the litmus
   flips from red to blue — “a stage comes”. The pH is solved from the
   charge balance every frame; near the end each new drop makes a blue
   flash that lingers longer before swirling hides it.
   Heat: acid + base → salt + water + heat, 55.8 kJ per mol neutralised.
     ΔT = 55.8 J/mmol × n ÷ (V mL × 4.18 J g⁻¹ K⁻¹) ≈ 0.25 °C per lemon drop,
   then Newton cooling back to 28 °C (τ = 90 s).
   ===================================================================== */
const ACID_H = {cit:3, asc:1, tar:2, ace:1, lac:1, oxa:2, car:0, fat:1, ext:1};
function acidEq(m){ let a=0; for(const k in m.sys) a+=(ACID_H[k]||0)*m.sys[k]; return a; }
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="step-row" id="pills"></div></div>
    <div class="control-group"><label>Add with the dropper</label>
      <div class="toggle-group"><button class="toggle-btn" data-k="lemon" data-n="1">🍋 Lemon · 1</button><button class="toggle-btn" data-k="water" data-n="20">💧 Water · 20</button></div>
      <div class="toggle-group"><button class="toggle-btn" data-k="bluelit" data-n="1">🔵 Blue litmus · 1</button></div>
      <div class="toggle-group"><button class="toggle-btn" data-k="lime" data-n="1">🥛 Lime water · 1</button><button class="toggle-btn" data-k="lime" data-n="5">🥛 Lime water · 5</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="sw">🌀 Swirl</button><button class="toggle-btn" id="em">↺ Wash tube</button></div></div>
    <div class="control-group"><div class="result-cards">${card('n1','Lemon drops','var(--f-red)')}${card('n2','Lime water drops','var(--f-blue)')}${card('n3','Temperature')}<div class="rcard"><div class="rlabel">Solution</div><div class="rval" id="n4">—</div></div></div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const NAMES=['1 Lemon + water','2 Blue litmus','3 Lime water','4 Lemon again'];
  const CX=310, TOP=150, H=290, RR=42, PXML=42, VMAX=6;
  let mix, plumes, cnt, T, nOld, ribbon, done, flipped, swirlT=0, rot=spr(0), t=0, jobs=[], dy=spr(0), dyT=0, swap=null;
  const rig=dropperRig(CX,112,'lemon'); rig.speed=1.3;
  function reset(){ mix=mixNew(); plumes=[]; cnt={lemon:0,water:0,bluelit:0,lime:0}; T=28; nOld=0; ribbon=[]; done=[0,0,0,0]; flipped=false; jobs=[]; rig.queue=0; pills(); }
  function pills(){ stepPills($('#pills'),NAMES,-1,done,()=>{}); }
  reset();
  const pending=()=>{ const m=mixCopy(mix); plumes.forEach(p=>mixAddMix(m,p.dm,p.m)); return m; };
  wrap.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(pending().V+ (jobs.reduce((a,j)=>a+j.n,0)+rig.queue+n)*0.05>VMAX){ fb('The tube is nearly full — wash it and start again.','warn'); return; } jobs.push({k:b.dataset.k,n}); });
  $('#sw').onclick=()=>{ swirlT=2.4; };
  $('#em').onclick=()=>reset();
  function fb(msg,cls){ const e=$('#fb'); e.className='fb '+cls; e.textContent=msg; }
  const surfY=()=>TOP+H-Math.min(H-24,Math.max(0,mix.V)*PXML);
  rig.onLand=(x,y,d)=>{ const dm=mixAdd(mixNew(),d.key,0.05);
    const loc=mixAddMix(mixCopy(dm),mix,mix.V>0?Math.min(1,0.03/mix.V):0), lit=(mix.sys.lit||0)/Math.max(0.05,mix.V);
    const col=lit>1e-6?litmusCol(mixPH(loc)):LIQ[d.key].col;
    plumes.push({x:x+(Math.random()-0.5)*8,y:Math.max(y,surfY()),vy:60,r:7,m:1,dm,col}); cnt[d.key]++;
    if((d.key==='lime'||d.key==='lemon') && (mix.sys.lit||0)+(pending().sys.lit||0)>0){ const eq=pending(); ribbon.push({col:litmusCol(mixPH(eq)),k:d.key}); if(ribbon.length>34) ribbon.shift(); } };

  animLoop(dt=>{ t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    // dropper jobs: lift & refill when the liquid changes, then squeeze n drops
    springTo(dy,dyT,60,13,dt);
    if(swap && dy.x<-230){ rig.key=swap; rig.fill=0.8; swap=null; dyT=0; }
    if(!swap && !rig.busy() && Math.abs(dy.x)<3 && jobs.length){ const j=jobs.shift(); if(j.k!==rig.key){ swap=j.k; dyT=-260; jobs.unshift(j); } else { rig.speed=j.n>=5?3:1.3; rig.squeezeOnce(j.n); } }
    rig.tipY=112+dy.x+Math.sin(t*2)*2; rig.moveTo(CX+Math.sin(rot.x)*-60*0);
    rig.step(dt,()=>surfY());
    // plumes hand their contents to the bulk
    if(swirlT>0) swirlT-=dt;
    const tau=swirlT>0?0.2:1.3;
    plumes.forEach(p=>{ const f=p.m*(1-Math.exp(-dt/tau)); mixAddMix(mix,p.dm,f); p.m-=f; p.vy=approach(p.vy,swirlT>0?0:10,2,dt); p.y=Math.min(TOP+H-RR,p.y+p.vy*dt); p.r+=dt*(swirlT>0?70:12); p.x+=Math.sin(t*3+p.y*0.05)*dt*(swirlT>0?70:5); });
    plumes=plumes.filter(p=>p.m>0.02);
    // neutralisation heat + cooling
    const nN=Math.max(0,Math.min(acidEq(mix),mix.sb-mix.sa-0.0021*0.05*cnt.bluelit)); // litmus’ own trace of alkali excluded
    if(nN>nOld && mix.V>0) T+=55.8*(nN-nOld)/(mix.V*4.18);
    nOld=Math.max(nOld,nN); T=28+(T-28)*Math.exp(-dt/90);
    // colour of the solution
    const pH=mixPH(mix), lit=(mix.sys.lit||0)/Math.max(0.05,mix.V), dye=1-Math.exp(-lit/3e-5);
    const lemonTint=mixCol('#ffffff','#f4e27a',clamp(cnt.lemon*0.05/Math.max(0.05,mix.V)*1.5,0,0.6));
    const bulk=mixCol(lemonTint,litmusCol(pH),dye*0.85);
    // swirl rocking
    springTo(rot,swirlT>0?0.14*Math.sin(t*2*Math.PI*2.2):0,160,6,dt);
    // ---- draw
    tubeStand(ctx,CX-80,CX+80,280,452);
    testTube(ctx,CX,TOP,H,RR,Math.min(H-24,mix.V*PXML),bulk,{rot:rot.x,wob:rot.x*50,inside:()=>plumes.forEach(p=>plumeDraw(ctx,p))});
    rig.draw(ctx); textAt(ctx,LIQ[rig.key].name,rig.x.x+26,rig.tipY-96,{size:14,weight:700,color:rig.key==='lemon'?COL.red:rig.key==='lime'?COL.blue:COL.yellow});
    // ribbon: colour after each lemon / lime-water drop
    const rx=470, ry=70; textAt(ctx,'Colour after each drop',rx,ry-12,{size:13,weight:700,color:COL.muted});
    ctx.save(); rrect(ctx,rx-4,ry-4,318,60,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.stroke(); ctx.restore();
    ribbon.forEach((r,i)=>{ ctx.fillStyle=r.col; ctx.fillRect(rx+i*9+1,ry+2,8,40); line(ctx,rx+i*9+1,ry+46,rx+i*9+9,ry+46,r.k==='lime'?COL.blue:COL.red,3); });
    line(ctx,rx+150,ry+68,rx+166,ry+68,COL.blue,3); textAt(ctx,'lime water',rx+170,ry+72,{size:11,weight:600,color:COL.muted}); line(ctx,rx+240,ry+68,rx+256,ry+68,COL.red,3); textAt(ctx,'lemon',rx+260,ry+72,{size:11,weight:600,color:COL.muted});
    // thermometer, magnified 28 – 29 °C
    const tx=520, tt=200, tb=420;
    thermo(ctx,tx,tt,tb,(T-28)/1,COL.ink,COL.red);
    for(let i=0;i<=5;i++){ const yy=tb-(tb-tt-5)*i/5; textAt(ctx,(28+i*0.2).toFixed(1)+'°',tx+14,yy+4,{size:11,weight:600,color:COL.muted}); }
    textAt(ctx,T.toFixed(2)+' °C',tx+72,tt+30,{size:22,weight:700,color:COL.red});
    textAt(ctx,'+'+(T-28).toFixed(2)+' °C from the reaction',tx+72,tt+52,{size:12,weight:600,color:COL.muted});
    // equation strip, lights up while acid and base react
    const react=plumes.some(p=>p.dm.sb>0.0005)&&acidEq(mix)>0;
    ctx.save(); ctx.globalAlpha=react?1:0.45; textAt(ctx,'Acid + Base → Salt + Water + Heat',600,470,{align:'center',size:15,weight:700,color:react?COL.red:COL.muted}); ctx.restore();
    // --- steps & cards
    const red=lit>1e-6 && baseFrac(pH,6.5)<0.5, blue=lit>1e-6 && baseFrac(pH,6.5)>0.5;
    if(!done[0] && cnt.lemon>=1 && cnt.water>=20){ done[0]=1; pills(); }
    if(done[0] && !done[1] && red){ done[1]=1; pills(); }
    if(done[1] && !done[2] && blue && cnt.lime>0 && plumes.length===0){ done[2]=1; flipped=true; pills(); fb('It turned blue after '+cnt.lime+' drops of lime water — the acid is used up.','ok'); }
    if(done[2] && !done[3] && red && plumes.length===0){ done[3]=1; pills(); fb('One more drop of lemon juice — red again!','warn'); }
    setv($,'n1',String(cnt.lemon)); setv($,'n2',String(cnt.lime)); setv($,'n3',T.toFixed(2)+' °C');
    const e=$('#n4'), s=lit<1e-6?'add litmus to see':(red?'acidic':(blue?'basic':'turning…'));
    if(e.textContent!==s){ e.textContent=s; e.style.color=red?COL.red:blue?COL.blue:COL.muted; }
    ctx.restore();
  });
  return wrap;
}


/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'2.1', title:'Litmus on a Tile', desc:'One drop on blue · one on red · sort into groups', build: buildA1 },
  { num:'2.2', title:'Sour, Slippery, Bitter', desc:'Taste the acids · rub the base', build: buildA2 },
  { num:'2.3', title:'Making Red Rose Extract', desc:'Wash · crush · hot water · wait · filter', build: buildA3 },
  { num:'2.4', title:'Testing with Rose Extract', desc:'Drops into tubes A and B', build: buildA4 },
  { num:'2.5', title:'Turmeric Paper', desc:'Make the paper · then test the samples', build: buildA5 },
  { num:'2.6', title:'Onion Smell Test', desc:'An indicator you smell, not see', build: buildA6 },
  { num:'2.7', title:'Acid Meets Base', desc:'Lemon + litmus · then lime water drop by drop', build: buildA7 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
