<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 · Chapter 6 — Materials Around Us | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn:disabled{opacity:.55; cursor:not-allowed;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.log td.g{color:var(--f-green);font-weight:700;} .log td.b{color:var(--f-blue);font-weight:700;} .log td.rd{color:var(--f-red);font-weight:700;}
.qa-input{width:100%; margin-top:7px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:var(--fs-sm); color:var(--text-1); background:var(--surface-1);}
.qa-input:focus{outline:none; border-color:var(--accent); background:#fff;}
.nav-item .n-num{line-height:1.15; text-align:center;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">🧱</div>
    <div>
      <div class="chip">Grade 6 · Ch 6</div>
      <h1>Materials Around Us</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you do · light</span>
      <span><i style="background:var(--f-red)"></i>Material under test · force</span>
      <span><i style="background:var(--f-blue)"></i>Water · liquid</span>
      <span><i style="background:var(--f-green)"></i>Result · group · reading</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">5.1</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>

/* =========================================================================
   GRADE 6 — CHAPTER 6: MATERIALS AROUND US
   Activities 6.1–6.8. Every scene runs on a continuous animation loop:
   sliders and buttons only set a TARGET; objects glide, hop or settle
   there on springs. Balls bounce with a real contact spring-damper
   (e = coefficient of restitution), tumblers leak through porous walls
   (Darcy flow, paper weakens as it wets), grains dissolve as shrinking
   spheres and settle by Stokes' law, sheets let light through by
   direct + scattered transmission, the balance pan is a damped spring.
   Colour rule: yellow = what you do · light, red = material under test ·
   force, blue = water · liquid, green = result · group · reading.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', navy:'#1a3a5c'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}



/* ---------------------------------------------------------------------
   0c. SHARED HELPERS — virtual stage, Q→A banner, stick figures,
       cat, cups, particles (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
/* every scene draws on an 800 × 470 virtual stage, fitted into the canvas */
const VW=800, VH=520, BANNER=46;
function stage(ctx,w,h){
  const s=Math.min(w/VW,(h-BANNER-6)/VH), ox=(w-VW*s)/2, oy=BANNER+Math.max(0,(h-BANNER-VH*s)/2);
  ctx.translate(ox,oy); ctx.scale(s,s); return s;
}
/* stick figure — feet on (x,y), height s. angles from straight-down, + = toward +x */
function stick(ctx,x,y,s,o){
  o=o||{}; const c=o.col||COL.ink, W=o.lw||Math.max(2,s*0.02);
  const th=0.25*s, sh=0.25*s, ua=0.17*s, fa=0.16*s;
  const LL=o.legL||[-0.12,-0.02], LR=o.legR||[0.12,0.02];

/* ---------------------------------------------------------------------

const MAT={

  metal:{n:'Metal',fill:'#eef2f7',tex:'gleam',lc:'#a9b8c9',shine:1},
  plastic:{n:'Plastic',fill:'#e9f3fd',tex:'gloss',lc:'#b9d3ee'},
  glass:{n:'Glass',fill:'rgba(214,236,252,0.35)',tex:'glass',lc:'#9cc7ea',shine:1},
  cloth:{n:'Cloth',fill:'#fdf0ef',tex:'weave',lc:'#e6b9b4'},
  rubber:{n:'Rubber',fill:'#f2edf8',tex:'dots',lc:'#bcaad3'},
  paper:{n:'Paper',fill:'#ffffff',tex:'rule',lc:'#c9daf0'},
  card:{n:'Cardboard',fill:'#f7eedd',tex:'flute',lc:'#d9c29b'},
  clay:{n:'Baked clay',fill:'#f8e2d3',tex:'speck',lc:'#cf9f80'},
  graphite:{n:'Graphite',fill:'#a3acb6',tex:'none',lc:'#7d8894'},
  ink:{n:'Ink',fill:'#cfe2fb',tex:'none',lc:COL.blue},
  foam:{n:'Foam',fill:'#fffbea',tex:'bubbles',lc:'#e4d79f'},
  cotton:{n:'Cotton',fill:'#ffffff',tex:'fluff',lc:'#d7dee8'},
  wool:{n:'Wool',fill:'#fdf3ea',tex:'knit',lc:'#e4c3a5'},
  stone:{n:'Stone',fill:'#eef0f2',tex:'speck',lc:'#a7b0ba'},
  wax:{n:'Wax',fill:'#fffdf2',tex:'none',lc:'#e8e2c4'},
  chalk:{n:'Chalk',fill:'#ffffff',tex:'speck',lc:'#d9dee6'},
  alu:{n:'Aluminium',fill:'#f2f5f9',tex:'gleam',lc:'#b8c5d4',shine:1},

/* fill a path with its material + texture, then outline it.

    ctx.beginPath(); ctx.strokeStyle=M.lc; ctx.lineWidth=1/k; for(let i=0;i<2;i++){ const xx=x+w*(0.62+i*0.08); ctx.moveTo(xx,y+h); ctx.lineTo(xx+h*0.5,y); } ctx.stroke(); }

  else if(T==='glass'){ ctx.lineWidth=2/k; ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.moveTo(x+w*0.18,y+h*0.12); ctx.lineTo(x+w*0.12,y+h*0.6); ctx.moveTo(x+w*0.26,y+h*0.1); ctx.lineTo(x+w*0.22,y+h*0.3); ctx.stroke();
    ctx.beginPath(); ctx.strokeStyle=M.lc; ctx.lineWidth=1/k; ctx.moveTo(x+w*0.8,y+h*0.2); ctx.lineTo(x+w*0.76,y+h*0.75); ctx.stroke(); }

/* =====================================================================
   6.2  LET US GROUP — sort the objects of Fig. 6.1 by a common property.

  S.cards=card('cP','Grouped by')+card('cG','Groups',COL.green)+card('cB','Biggest group')+card('cT','Ways tried');
  S.tail=`<div class="control-group"><label>Ways of grouping</label>${logTable('tL',['Who','Property','Groups'])}</div>`;
  let chips=[];
  const groupBy=(i,by)=>{ prop=i; who=by; const P=PROPS[i];
    const used=P.groups.filter(g=>KEYS.some(k=>P.of(k)===g)), n=used.length, W=(764-(n-1)*10)/n;
    const slot={}; P.groups.forEach(g=>slot[g]=0);

    const rowH=rowsMax>2?70:86, sz=rowsMax>2?58:70;

  S.wire=$=>{

  };
  S.tick=(dt,ctx,t,$)=>{

    /* trays */
    if(prop>=0){ const P=PROPS[prop], used=P.groups.filter(g=>KEYS.some(k=>P.of(k)===g)), n=used.length, W=(764-(n-1)*10)/n;
      used.forEach((g,gi)=>{ const x=18+gi*(W+10); ctx.save(); rrect(ctx,x,278,W,232,12); ctx.fillStyle='#f4faf6'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
        const s=fitFont(ctx,g,W-10,14,700); textAt(ctx,g,x+W/2,502,{align:'center',size:s,weight:700,color:COL.green}); }); }
    else textAt(ctx,'Choose a property → the objects hop into groups',400,400,{align:'center',size:17,weight:600,color:COL.mid});
    /* light sweep */

    ctx.save(); const g=ctx.createLinearGradient(band-60,0,band+60,0); g.addColorStop(0,'rgba(217,160,23,0)'); g.addColorStop(0.5,'rgba(217,160,23,0.10)'); g.addColorStop(1,'rgba(217,160,23,0)'); ctx.fillStyle=g; ctx.fillRect(band-60,60,120,450); ctx.restore();
    /* finger press cycle when grouped by hardness */
    const pressing=prop===1&&ob.every(o=>o.h.t>=o.h.T);
    if(pressing){ pressT+=dt; if(pressT>0.75){ pressT=0; press=(press+1)%KEYS.length; } }
    ob.forEach((o,j)=>{ hopStep(o.h,dt); o.s=approach(o.s,o.tgtS||80,5,dt);
      const pr=pressing&&j===press?Math.sin(clamp(pressT/0.75,0,1)*Math.PI):0;
      springTo(o.sq,OBJ[o.k].hard?0:-0.35*pr,300,14,dt);
      const sy=1+o.h.sq.x*0.18+o.sq.x;
      const bx=objBox(o.k), k=o.s/100, yb=o.h.y+bx[3]*k, yc=yb-(bx[3]*k)*sy;

    });
    if(prop>=0){ const P=PROPS[prop], cnt={}; KEYS.forEach(k=>cnt[P.of(k)]=(cnt[P.of(k)]||0)+1); const big=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      setv($,'cP',(who==='Friend'?'Friend: ':'')+P.n); setv($,'cG',String(Object.keys(cnt).length)); setv($,'cB',big+' ('+cnt[big]+')'); }

    const rows=Object.values(tried); setv($,'cT',String(new Set(rows.map(r=>r.p)).size));

  S.fb=()=>{ if(prop===3) return ['ok','Metal makes the spoon, coin and key — one material can make many objects.'];
    if(prop===2) return ['ok','Watch the light sweep: only the lustrous things flash.'];
    if(prop===1) return ['ok','The finger presses each one: soft things squash, hard things don’t.'];

/* =====================================================================
   6.3  LET US THINK — which materials can make a tumbler?
   A 380 mL tumbler (11 cm tall, 7.6 / 5.6 cm across) is filled from a jug. Water leaves
   through the wall by Darcy flow q = K·h: glass, steel, plastic K = 0;
   unglazed clay sweats a little; cloth K ≈ 12 mL/s per cm of water, so
   the level never rises past ≈2.5 cm; paper starts tight but wets
   (dw/dt = (1−w)/6 s), leaks as K·w² and tears when soggy and loaded.
   On a stove (×10 time) the bottom runs hotter than the water by
   ΔT = q·thickness/k: steel +8 °C boils water; glass gets a big
   hot/cold difference and cracks; plastic softens above 120 °C; paper
   and cloth char above ≈ 233–250 °C.
   ===================================================================== */
function buildA3(){ return buildScene(wrap=>{
  const S={q:'Which materials can we use to make a tumbler?'};
  const MATS=[
    {k:'glass',n:'Glass',K:0,see:1,dT:110,fail:'cracks',T:60},
    {k:'metal',n:'Steel',K:0,see:0,dT:8,fail:'',T:0},
    {k:'plastic',n:'Plastic',K:0,see:0.6,dT:300,fail:'melts',T:120},
    {k:'clay',n:'Clay',K:0,sweat:1,see:0,dT:70,fail:'',T:0},
    {k:'paper',n:'Paper',K:3.2,wet:1,see:0,dT:400,fail:'burns',T:233},
    {k:'cloth',n:'Cloth',K:12,see:0.5,dT:400,fail:'burns',T:250}];
  const PX=26, H=11, RT=3.8, RB=2.8, CX=300, BY=430;
  const r=h=>RB+(RT-RB)*h/H; /* cm */
  const VT=[0]; for(let i=1;i<=220;i++){ const h=H*i/220, h0=H*(i-1)/220; VT.push(VT[i-1]+Math.PI*Math.pow(r((h+h0)/2),2)*(h-h0)); }
  const CAP=VT[220];
  const hOf=V=>{ if(V<=0) return 0; for(let i=1;i<=220;i++) if(VT[i]>=V) return H*(i-1+(V-VT[i-1])/(VT[i]-VT[i-1]))/220; return H; };
  let m=0, V=0, pour=false, rate=30, heat=false, w=0, torn=0, Tw=25, Tb=25, broke='', spilled=0, held=0, verdict={}, drops=[], beads=[], jug=spr(0), flap=spr(0), bub=[];
  S.html=`
    <div class="control-group"><label>Tumbler made of</label>${chipList('mC',MATS.map(x=>x.n),0)}</div>
    ${slider('rS','Pour rate',10,50,5,30)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="po">🫗 Pour water</button><button class="toggle-btn" id="ht">🔥 Put on stove</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="nw">♻ New, empty tumbler</button></div></div>`;
  S.cards=card('cV','Water inside',COL.blue)+card('cL','Leaking')+card('cT','Water temp')+card('cH','Holds water?',COL.green);
  S.tail=`<div class="control-group"><label>Fig. 6.2 — your tumbler test</label>${logTable('tL',['Material','Holds water?','On a stove'])}</div>`;
  const reset=()=>{ V=0; pour=false; heat=false; w=0; torn=0; Tw=25; Tb=25; broke=''; spilled=0; held=0; drops=[]; beads=[]; bub=[]; flap.x=0; flap.v=0; };
  let $g;
  const ui=()=>{ $g('#po').textContent=pour?'⏹ Stop pouring':'🫗 Pour water'; $g('#ht').textContent=heat?'🧊 Take it off':'🔥 Put on stove'; $g('#ht').classList.toggle('active',heat); $g('#rSV').textContent=rate+' mL/s'; };
  S.wire=$=>{ $g=$;
    wireChips(wrap,'mC',i=>{ m=i; reset(); ui(); });
    $('#rS').oninput=()=>{ rate=+$('#rS').value; ui(); };
    $('#po').onclick=()=>{ pour=!pour; ui(); };
    $('#ht').onclick=()=>{ heat=!heat; if(heat) pour=false; ui(); };
    $('#nw').onclick=()=>{ reset(); ui(); };
    ui();
  };
  const wallX=(side,yCm,M)=>{ /* outer wall x (px) at height yCm; paper bows out as it soaks */
    const bow=M.wet?w*6*Math.sin(Math.PI*clamp(yCm/H,0,1))*clamp(hOf(V)/H*1.4,0,1):0;
    return CX+side*(r(yCm)*PX+bow); };
  S.tick=(dt,ctx,t,$)=>{
    const M=MATS[m], speed=heat?10:1, h=hOf(V);
    /* ---- physics (sub-stepped) ---- */
    let qOut=0;
    for(let k=0;k<4;k++){ const d=dt*speed/4;
      const qin=pour&&V<CAP*0.93?rate:0; if(pour&&V>=CAP*0.93){ pour=false; ui(); }
      if(M.wet && h>0.05) w+=(1-w)/6*d;
      let K=M.K*(M.wet?w*w:1); if(broke) K+=8;
      let q=K*hOf(V); if(torn>0) q+=110*Math.min(1,torn);
      if(M.wet && w>0.82 && hOf(V)>4 && !torn) torn=0.01;
      if(torn>0) torn=Math.min(1,torn+d*2);
      if(M.sweat && hOf(V)>0.5) q+=0.004;
      q=Math.min(q,V/d+qin);
      V=clamp(V+(qin-q)*d,0,CAP); spilled+=q*d; qOut=q;
      /* heat: bottom runs ΔT hotter than water; water warms if it holds */
      if(heat){ const tgtB=V>5?Tw+M.dT:Math.min(500,350+M.dT); Tb=approach(Tb,tgtB,0.5,d);
        if(V>5){ const P=M.k==='metal'?480:M.k==='clay'?330:M.k==='glass'?360:200; Tw=Math.min(100,Tw+P*d/(V*4.186)); }
        else Tw=approach(Tw,Tb,0.3,d);
        if(!broke&&M.fail){ if(M.k==='glass'&&Tb-Tw>M.T&&V>5) broke='cracks'; if(M.k==='plastic'&&Tb>M.T) broke='melts'; if((M.k==='paper'||M.k==='cloth')&&Tb>M.T) broke='burns'; }
      } else { Tb=approach(Tb,Tw,0.2,d); Tw=approach(Tw,25,0.004,d); }
    }
    /* verdicts */
    if(V>CAP*0.8&&!pour) held+=dt; if(qOut>0.5) held=0;
    const leakNow=qOut>0.3&&!M.sweat;
    const vd=verdict[M.n]||(verdict[M.n]={hold:'',stove:''});
    if(held>2.5&&!broke) vd.hold=M.sweat?'Yes (sweats a little)':'Yes';
    if(leakNow&&spilled>20&&!heat) vd.hold='No — leaks';
    if(heat&&broke) vd.stove='No — '+broke; else if(heat&&Tw>=99.5&&V>20) vd.stove='Yes — boils water';
    /* ---- drawing ---- */
    if(!heat) tableTop(ctx,60,620,BY,0);
    else { /* stove: grate the tumbler stands on, burner and flame below */
      rect(ctx,CX-170,BY+46,340,40,COL.ink,'#fff',2.4); line(ctx,CX-140,BY+1,CX+140,BY+1,COL.ink,4);
      for(const s of [-1,1]) line(ctx,CX+s*130,BY+1,CX+s*130,BY+46,COL.ink,4);
      rect(ctx,CX-60,BY+38,120,8,COL.ink,'#fff',2.2); flame(ctx,CX,BY+38,110,1,t); }
    /* puddle */
    if(spilled>1){ const pr=Math.min(240,Math.sqrt(spilled)*9); ctx.save(); ctx.beginPath(); ctx.ellipse(CX+30,BY+2,pr,Math.min(14,4+pr*0.05),0,0,7); ctx.fillStyle='rgba(47,143,224,0.18)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
    /* tumbler outline points */
    const N=16, L=[], R=[]; for(let i=0;i<=N;i++){ const yc=H*i/N; L.push([wallX(-1,yc,M),BY-yc*PX]); R.push([wallX(1,yc,M),BY-yc*PX]); }
    const fl=flap.x; springTo(flap,torn>0?1:0,30,4,dt);
    const tPath=(c,nb)=>{ c.beginPath(); c.moveTo(L[N][0],L[N][1]); for(let i=N;i>=0;i--) c.lineTo(L[i][0],L[i][1]); if(nb) c.moveTo(R[0][0],R[0][1]); else c.lineTo(R[0][0],R[0][1]); for(let i=0;i<=N;i++) c.lineTo(R[i][0],R[i][1]); };
    /* water inside */
    const hl=hOf(V);
    if(hl>0.02){ ctx.save(); ctx.beginPath(); const ny=Math.max(1,Math.round(hl/H*N));
      ctx.moveTo(L[0][0]+4,BY-3); for(let i=0;i<=ny;i++){ const yc=Math.min(hl,H*i/N); ctx.lineTo(wallX(-1,yc,M)+4,BY-yc*PX); }
      const sl=pour?Math.sin(t*14)*2:0; ctx.lineTo(wallX(1,hl,M)-4,BY-hl*PX+sl); for(let i=ny;i>=0;i--){ const yc=Math.min(hl,H*i/N); ctx.lineTo(wallX(1,yc,M)-4,BY-yc*PX); } ctx.closePath();
      ctx.fillStyle=heat&&Tw>60?'rgba(47,143,224,0.30)':'rgba(47,143,224,0.24)'; ctx.fill(); ctx.restore();
      const ly=BY-hl*PX; line(ctx,wallX(-1,hl,M)+4,ly,wallX(1,hl,M)-4,ly,COL.blue,2.4);
      if(heat&&Tw>80){ if(Math.random()<(Tw-80)/20*dt*30) bub.push({x:CX+(Math.random()-0.5)*r(0)*PX*1.6,y:BY-6,v:40+Math.random()*60,r:2+Math.random()*3}); }
    }
    bub.forEach(b=>{ b.y-=b.v*dt; b.v+=120*dt; b.r+=dt*2; }); bub=bub.filter(b=>b.y>BY-hl*PX+3);
    bub.forEach(b=>circ(ctx,b.x,b.y,b.r,COL.blue,null,1.4));
    if(heat&&Tw>70) steam(ctx,CX,BY-H*PX-8,r(H)*PX*1.4,(Tw-70)/30,t);

/* =====================================================================

   Each ball falls under gravity + air drag (k = ρ·Cd·A / 2m). On the
   floor it becomes a spring-damper: m·a = k·δ − c·v, released when the
   push drops to zero. k and c are set from each ball's real coefficient
   of restitution e and contact time: ζ = −ln e / √(π² + ln² e),
   ωd = π / t_contact. Bounce height ≈ e²·h:
   tennis e 0.74 (ITF: 254 cm → ≈140 cm), cricket 0.55, foam hand-
   exercise ball 0.25, rubber "bouncy" ball 0.88. Integrated every 0.2 ms.
   ===================================================================== */
function buildA4(){ return buildScene(wrap=>{
  const S={q:'Drop each ball from the same height. Which one bounces the highest?'};
  const G=9.8, RHO=1.2;
  const BALLS=[
    {n:'Tennis ball',m:0.058,r:0.033,e:0.74,tc:0.005,cd:0.55,mat:'Rubber + felt'},
    {n:'Cricket ball',m:0.160,r:0.036,e:0.55,tc:0.0012,cd:0.45,mat:'Cork + leather'},
    {n:'Hand exercise ball',m:0.045,r:0.035,e:0.25,tc:0.018,cd:0.47,mat:'Soft foam'},
    {n:'Rubber ball (any other)',m:0.050,r:0.030,e:0.88,tc:0.002,cd:0.47,mat:'Solid rubber'}];
  BALLS.forEach(b=>{ const L=Math.log(b.e), z=-L/Math.sqrt(Math.PI*Math.PI+L*L), wd=Math.PI/b.tc, wn=wd/Math.sqrt(1-z*z);
    b.w2=wn*wn; b.c2=2*z*wn; b.kd=RHO*b.cd*Math.PI*b.r*b.r/(2*b.m); });
  const FY=470, SC=185, R=17, XS=[150,270,390,510];
  let H0=1.5, sel=0, slow=false, res={};
  const st=BALLS.map(()=>({y:1.5,v:0,held:true,yv:spr(1.5),bn:0,inC:false,tC:0,tCl:0,apex:0,h1:null,dmax:0,rest:false,trail:[]}));
  S.html=`
    <div class="control-group"><label>Look closely at</label>${chipList('bC',BALLS.map(b=>b.n),0)}</div>
    ${slider('hS','Drop height',0.5,2,0.05,1.5)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="d1">🖐 Drop this ball</button><button class="toggle-btn play" id="d4">🖐 Drop all four</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="pk">🤏 Pick them up</button><button class="toggle-btn" id="sl">🐢 Slow motion</button></div></div>`;

    line(ctx,sx,FY-H0*SC,620,FY-H0*SC,COL.yellow,1.6,[6,5]); textAt(ctx,'drop height',600,FY-H0*SC-6,{align:'right',size:11,weight:700,color:COL.yellow});
    st.forEach((s,i)=>{ const b=BALLS[i], x=XS[i], X=R/(b.r*SC);

      ctx.save(); ctx.beginPath(); ctx.ellipse(x,cy,rx,ry,0,0,7); ctx.fillStyle=['#fffbe0','#fdeeee','#fffde8','#f1ecf7'][i]; ctx.fill(); ctx.strokeStyle=i===sel?COL.red:COL.ink; ctx.lineWidth=i===sel?3:2.4; ctx.stroke();

    });

/* =====================================================================
   6.6  LET US CLASSIFY — transparent, translucent or opaque?
   Light from a flower reaches your eye through a sheet. Each sheet sends
   a fraction Td straight through, scatters a fraction Ts over an angle σ,
   and stops the rest. What you see = Td × sharp picture + Ts × picture
   blurred by d·tan σ (d = flower-to-sheet distance) — so a flower touching
   frosted glass looks almost sharp, and blurs as it moves away.
   Butter paper: Td 0.05ⁿ, Ts 0.6ⁿ for n layers. Water + milk:
   Td = 0.95·e^(−0.12·drops), the rest scatters (milk fat droplets).
   Transparent: Td ≥ 0.5 · Translucent: Td + Ts ≥ 0.05 · Opaque: below.
   ===================================================================== */
function buildA6(){ return buildScene(wrap=>{
  const S={q:'Through which materials can you see clearly, unclearly, or not at all?'};
  const IT=[
    {n:'Window glass',k:'glass',Td:0.9,Ts:0.01,sg:0},
    {n:'Glass tumbler',k:'tumbler',Td:0.85,Ts:0.02,sg:0,stretch:1.25},
    {n:'Butter paper',k:'paper',Td:0.05,Ts:0.6,sg:0.55,layers:1},
    {n:'Frosted glass',k:'frost',Td:0.02,Ts:0.75,sg:0.26},
    {n:'Eraser',k:'rubber',Td:0,Ts:0,sg:0},
    {n:'Wooden board',k:'wood',Td:0,Ts:0,sg:0},
    {n:'Water (+ milk?)',k:'water',Td:0.95,Ts:0,sg:0.6}];
  let it=0, d=20, layers=1, milk=0, none=false, slide=spr(0), cls={};
  S.html=`
    <div class="control-group"><label>Hold up a sheet of</label>${chipList('iC',IT.map(x=>x.n),0)}</div>
    ${slider('dS','Flower behind the sheet',0,60,1,20)}
    <div id="gL">${slider('lS','Layers of butter paper',1,6,1,1)}</div>
    <div id="gM">${slider('mS','Drops of milk in the water',0,100,1,0)}</div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="rm">↕ Take the sheet away</button></div></div>`;
  S.cards=card('cD','Light straight through',COL.yellow)+card('cS','Light scattered')+card('cB','Blur')+card('cV','It is',COL.green);
  S.tail=`<div class="control-group"><label>Table 6.4</label>${logTable('tL',['Transparent','Translucent','Opaque'])}</div>`;
  const opt=()=>{ const I=IT[it]; let Td=I.Td, Ts=I.Ts;
    if(I.k==='paper'){ Td=Math.pow(0.05,layers); Ts=Math.pow(0.6,layers); }
    if(I.k==='water'){ Td=0.95*Math.exp(-0.12*milk); Ts=(0.95-Td)*0.85*Math.exp(-0.03*milk); }

    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.4*s; ctx.fillStyle='#eaf7ef'; ctx.beginPath(); ctx.ellipse(x-14*s,y+44*s,14*s,5*s,-0.5,0,7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x+14*s,y+54*s,14*s,5*s,0.5,0,7); ctx.fill(); ctx.stroke(); ctx.restore();
    for(let k=0;k<7;k++){ const a=k/7*6.283+Math.sin(t*0.8)*0.05; ctx.save(); ctx.translate(x+Math.cos(a)*13*s,y+Math.sin(a)*13*s); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(0,0,11*s,6.5*s,0,0,7); ctx.fillStyle='#fdecea'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.2*s; ctx.stroke(); ctx.restore(); }

      if(Ts>0.01){ ctx.globalAlpha=clamp(Ts,0.1,0.9); ctx.setLineDash([4,5]); for(let k=0;k<5;k++){ const a=Math.PI+(k-2)*0.45+Math.sin(j*3.1+k)*0.15; ctx.beginPath(); ctx.moveTo(hitX-12,hy); ctx.lineTo(hitX-12+Math.cos(a)*55,hy+Math.sin(a)*55); ctx.stroke(); } }

    const top=EY-110, bot=470, k=I.k;
    if(k==='tumbler'){ matFill(ctx,'glass',c=>{ c.beginPath(); c.rect(SX-30,EY-60,60,130); },[SX-30,EY-60,60,130],{lw:2.4}); ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(SX,EY-60,30,7,0,0,7); ctx.stroke(); ctx.restore(); }

      for(let i=0;i<Math.min(milk,40);i++){ const a=i*2.4+t*0.4, rr=(i*7)%20; circ(ctx,SX+Math.cos(a)*rr*0.9,EY-6+Math.sin(a*1.3)*60,1.3,'#c2d1e5',null,1); } }
    else { const th=k==='wood'?16:k==='rubber'?22:k==='paper'?4+layers*2:8, mk=k==='frost'?'stone':k==='paper'?'paper':k;
      if(k==='frost'){ matFill(ctx,'glass',c=>{ c.beginPath(); c.rect(SX-th/2,top,th,bot-top-30); },[SX-th/2,top,th,bot-top-30],{lw:2.2}); ctx.save(); ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.fillRect(SX-th/2+1,top+1,th-2,bot-top-32); ctx.restore(); }

    });

    { const x=spoon.x.x, y=spoon.y.x, a=spoon.a.x; ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(1.5,1.5);
      ctx.lineCap='round'; line(ctx,6,0,70,-44,COL.ink,3.4); ctx.beginPath(); ctx.ellipse(0,0,13,7,0.2,0,7); ctx.fillStyle='#eef2f7'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
      if(act==='add'&&actT<0.95){ ctx.fillStyle=s0.m.k==='sand'?'#e2c79a':s0.m.k==='saw'?'#e6c79c':s0.m.k==='oil'?'#fff3c4':'#ffffff'; ctx.beginPath(); ctx.ellipse(0,-3,10,4,0.2,Math.PI,0); ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1; ctx.stroke(); }
      ctx.restore(); }
    /* lens: what the water looks like up close */
    { springTo(lensX,s0.cx<400?620:180,40,11,dt); const s=s0, LX=lensX.x, LY=92, LR=66;
      lens(ctx,LX,LY,LR,()=>{ ctx.fillStyle='rgba(47,143,224,0.10)'; ctx.fillRect(LX-LR,LY-LR,2*LR,2*LR); const k=s.m.k, rr=rng(5);
        if(s.m.sol){ const nd=Math.round(90*s.diss); for(let i=0;i<nd;i++){ const x=LX+(rr()-0.5)*2*LR+Math.sin(t*3+i)*3, y=LY+(rr()-0.5)*2*LR+Math.cos(t*2.6+i*1.7)*3; circ(ctx,x,y,2.2,COL.red,COL.red,1); }
          const und=1-s.diss; if(s.add&&und>0.01){ const sz=36*Math.cbrt(und); rect(ctx,LX-sz/2,LY+LR-sz-6,sz,sz,COL.ink,'#fff',2); } }
        else if(k==='chalk'){ const c=turb(s); for(let i=0;i<Math.round(Math.min(60,c*30));i++){ const x=LX+(rr()-0.5)*2*LR+Math.sin(t*2+i)*2, y=LY+(rr()-0.5)*2*LR+((t*4)%20); ctx.save(); ctx.translate(x,y); ctx.rotate(i); rect(ctx,-3,-2,6,4,COL.mid,'#fff',1.2); ctx.restore(); } }
        else if(k==='sand'&&s.add){ ctx.save(); ctx.beginPath(); ctx.ellipse(LX,LY+40,60,42,0.2,0,7); ctx.fillStyle='#e2c79a'; ctx.fill(); ctx.strokeStyle='#9c7b4a'; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
        else if(k==='saw'&&s.add){ for(let i=0;i<5;i++){ const y=LY-LR+18+i*8; line(ctx,LX-50,y,LX+50,y+Math.sin(i)*4,'#a8763f',2.4); } }
        else if(k==='oil'&&s.add){ circ(ctx,LX,LY-20,40,'#c9a227','#fff6d0',2.4); }
      },COL.ink,'up close');
      const und=s.m.sol?Math.max(0,1-s.diss):0, tb=turb(s);
      setv($,'cT',s.ta>=0?(s.ta<90?Math.round(s.ta)+' s':fmt(s.ta/60,1)+' min'):'—');
      setv($,'cU',!s.add?'—':s.m.sol?(und>0.01?Math.round(und*100)+'% of the grains':'nothing'):s.m.k==='chalk'?'cloud + layer':s.m.k==='sand'?'all, at the bottom':s.m.k==='saw'?'all, floating':'a layer on top');
      setv($,'cW',!s.add?'clear':s.m.k==='chalk'?(tb>0.6?'milky':tb>0.15?'cloudy':'clearing'):'clear');
      setv($,'cO',s.obs||(s.add?'watch…':'—'));
    }
    setLog($,'tL',T.filter(s=>s.pred).map(s=>[s.m.n.replace(' (any other)',''),s.pred,s.obs?{t:s.obs,c:(s.obs==='Disappears')===(s.pred==='Will disappear')?'g':'rd'}:'…']));
  };
  S.found=()=>{ const ok=T.filter(s=>s.obs).length; return ok>=5?'Sugar and salt dissolve (soluble); chalk, sand and sawdust do not (insoluble).':''; };
  S.fb=()=>{ const s=T[sel]; if(!s.pred) return ['warn','First predict: will it disappear in water?'];
    if(!s.add) return null;
    if(s.obs) return [(s.obs==='Disappears')===(s.pred==='Will disappear')?'ok':'warn',(s.obs==='Disappears')===(s.pred==='Will disappear')?'Your prediction was right!':'Not what you predicted — that’s how we learn.'];
    if(s.m.sol) return ['ok','The grains are getting smaller — stir to make them dissolve faster.'];
    if(s.m.k==='chalk') return ['ok','Fine chalk hangs in the water, then settles slowly — try ×60.'];
    return ['ok','Stir it, then wait and watch.']; };
  return S;
}); }

/* =====================================================================
   6.8  LET US MEASURE — which cup is heavier?
   Three identical 200 mL paper cups (5 g each) filled to the same level:
   A water (1.00 g/mL), B dry sand (bulk 1.60 g/mL — grains 2.65 g/mL,
   about 40 % air between them), C pebbles (2.65 g/mL stone, but bigger
   gaps: 56–60 % stone → ≈1.5 g/mL). The digital balance pan rides on a
   stiff spring (6 Hz, ζ 0.25): it overshoots, the display chases it and
   settles. The pan balance is a rigid beam: I·θ″ = g·L·(mR − mL)·cos θ
   − M·g·d·sin θ − c·θ′, so the heavier side sinks until the low centre of
   mass balances it (stops at ±18°).
   ===================================================================== */
function buildA8(){ return buildScene(wrap=>{
  const S={q:'Water, sand, pebbles — which half-filled cup is heaviest? Which is lightest?'};
  const CUPS=[{L:'A',n:'Water',rho:1.0},{L:'B',n:'Sand',rho:1.6},{L:'C',n:'Pebbles',rho:1.52}];
  const CAP=200, CUPM=5, HOME=[90,190,290], TY=440, WT=70, WB=52, CH=86;
  let fill=0.5, mode=0, onD=-1, onL=-1, onR=-1, predH=-1, predL=-1, got={}, pan=spr(0), disp=0, th={x:0,v:0}, peb=[], seed=3;
  const cups=CUPS.map((c,i)=>({h:hopNew(HOME[i],TY)}));
  const mass=i=>CUPM+CUPS[i].rho*CAP*fill;
  const packPebbles=()=>{ /* random sequential packing of pebbles in the cup section (cup-local, y up from bottom) */
    const r=rng(seed), P=[]; for(let k=0;k<300&&P.length<70;k++){ const rr=5.5+r()*4.5, x0=(r()*2-1)*(WB/2-rr-1);
      /* drop it in: slide down until it rests on the bottom or another pebble */
      let y=rr; for(;y<CH;y+=0.5){ const wx=lerp(WB,WT,y/CH)/2-rr-1; if(Math.abs(x0)<=wx&&P.every(p=>Math.hypot(p.x-x0,p.y-y)>p.r+rr+0.3)) break; }
      if(y<CH) P.push({x:x0,y,r:rr,a:r()*6.28}); }
    P.sort((a,b)=>a.y-b.y); peb=P; CUPS[2].rho=2.65*(0.56+0.04*r()); };
  packPebbles();
  S.html=`
    <div class="control-group"><label>Predict — heaviest?</label>${chipList('hC',['A water','B sand','C pebbles'],-1)}
      <label style="margin-top:8px">Lightest?</label>${chipList('lC',['A water','B sand','C pebbles'],-1)}</div>
    <div class="control-group"><label>Balance</label>${chipList('mC',['Digital balance','Pan balance'],0)}</div>
    <div class="control-group" id="gD"><label>Put on the balance</label>${chipList('dC',['Cup A','Cup B','Cup C'],-1)}</div>
    <div class="control-group hidden" id="gP"><label>Left pan</label>${chipList('pL',['A','B','C'],-1)}<label style="margin-top:8px">Right pan</label>${chipList('pR',['A','B','C'],-1)}</div>
    ${slider('fS','Fill each cup',0.25,1,0.05,0.5)}
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="rf">🔄 Refill cup C</button></div></div>`;
  S.cards=card('cR','Balance shows',COL.green)+card('cC','On the balance')+card('cP','You predicted')+card('cK','Heaviest so far',COL.green);
  S.tail=`<div class="control-group"><label>Your readings</label>${logTable('tL',['Cup','Filled with','Mass'])}</div>`;
  let $g, chD, chL, chR;
  const slotD=()=>[560,0], pivot=[560,180], ARM=150;
  const ui=()=>{ $g('#gD').classList.toggle('hidden',mode!==0); $g('#gP').classList.toggle('hidden',mode!==1); $g('#fSV').textContent=Math.round(fill*100)+'% full'; };
  const home=i=>hopTo(cups[i].h,HOME[i],TY,0);
  const clearAll=()=>{ [0,1,2].forEach(home); onD=onL=onR=-1; setActive(chD,-1); setActive(chL,-1); setActive(chR,-1); };
  S.wire=$=>{ $g=$;
    wireChips(wrap,'hC',i=>{ predH=i; }); wireChips(wrap,'lC',i=>{ predL=i; });
    wireChips(wrap,'mC',i=>{ mode=i; clearAll(); ui(); });
    chD=wireChips(wrap,'dC',i=>{ if(onD>=0) home(onD); onD=i; hopTo(cups[i].h,560,TY-64,0); });
    chL=wireChips(wrap,'pL',i=>{ if(i===onR){ onR=-1; setActive(chR,-1); } if(onL>=0&&onL!==i) home(onL); onL=i; hopTo(cups[i].h,pivot[0]-ARM,pivot[1]-Math.sin(th.x)*ARM+150,0); });
    chR=wireChips(wrap,'pR',i=>{ if(i===onL){ onL=-1; setActive(chL,-1); } if(onR>=0&&onR!==i) home(onR); onR=i; hopTo(cups[i].h,pivot[0]+ARM,pivot[1]+Math.sin(th.x)*ARM+150,0); });
    $('#fS').oninput=()=>{ fill=+$('#fS').value; got={}; ui(); };
    $('#rf').onclick=()=>{ seed++; packPebbles(); delete got[2]; };
    ui();
  };
  const drawCup=(i,cx,by)=>{ const c=CUPS[i], f=fill, lv=CH*f;
    paperCup(ctx_,cx,by,WT,WB,CH,{label:c.L,inside:()=>{ const ctx=ctx_;
      if(i===0){ ctx.fillStyle='rgba(47,143,224,0.25)'; ctx.fillRect(cx-WT,by-lv,2*WT,lv); line(ctx,cx-WT,by-lv,cx+WT,by-lv,COL.blue,2.2); }
      else if(i===1){ ctx.fillStyle='#f1e2c4'; ctx.fillRect(cx-WT,by-lv,2*WT,lv); const r=rng(9); ctx.fillStyle='#b89662'; for(let k=0;k<lv*8;k++){ ctx.fillRect(cx+(r()-0.5)*WT,by-r()*lv,1.4,1.4); } line(ctx,cx-WT,by-lv,cx+WT,by-lv,'#9c7b4a',1.6); }
      else { peb.forEach(p=>{ if(p.y+p.r*0.3>lv) return; ctx.save(); ctx.translate(cx+p.x,by-p.y); ctx.rotate(p.a); ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.8,0,0,7); ctx.fillStyle='#e9ecef'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }); }
    }}); };
  let ctx_;
  S.tick=(dt,ctx,t,$)=>{ ctx_=ctx;
    tableTop(ctx,20,780,TY,0);
    let reading=null;
    if(mode===0){ /* digital balance: base, display, pan on a spring */
      const m=onD>=0&&cups[onD].h.t>=cups[onD].h.T?mass(onD):0;
      springTo(pan,m*0.03,1421,18.8,dt); /* 6 Hz, ζ 0.25 */
      const meas=pan.x/0.03; disp=approach(disp,meas,7,dt);
      const stable=Math.abs(pan.v)<0.4&&Math.abs(disp-meas)<0.6;
      ctx.save(); ctx.lineJoin='round'; ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(470,TY); ctx.lineTo(480,TY-46); ctx.lineTo(640,TY-46); ctx.lineTo(650,TY); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      rect(ctx,515,TY-38,90,26,COL.ink,'#eef6ee',2); textAt(ctx,Math.max(0,Math.round(disp))+' g',597,TY-19,{align:'right',size:16,weight:700,color:COL.green});
      if(stable&&m>0){ circ(ctx,524,TY-25,3,COL.green,COL.green,1); }
      const py=TY-58+pan.x; line(ctx,560,TY-46,560,py,COL.ink,4); rect(ctx,486,py-6,148,6,COL.ink,'#fff',2.4);
      if(onD>=0){ const c=cups[onD].h; if(c.t>=c.T) c.y=py-6; }
      if(stable&&m>0){ reading=Math.round(disp); got[onD]=reading; }
    } else { /* pan balance */
      const mL=onL>=0&&cups[onL].h.t>=cups[onL].h.T?mass(onL)/1000:0, mR=onR>=0&&cups[onR].h.t>=cups[onR].h.T?mass(onR)/1000:0;
      const L=0.15, Md=0.004, I=(mL+mR+0.3)*L*L+0.002, c=0.012;
      const n=8; for(let k=0;k<n;k++){ const h=dt/n, a=(9.8*L*(mR-mL)*Math.cos(th.x)-Md*9.8*Math.sin(th.x)-c*th.v)/I; th.v+=a*h; th.x+=th.v*h;
        if(th.x>0.31){ th.x=0.31; th.v*=-0.3; } if(th.x<-0.31){ th.x=-0.31; th.v*=-0.3; } }
      const [px,py]=pivot, ex=Math.cos(th.x)*ARM, ey=Math.sin(th.x)*ARM;
      line(ctx,px,TY,px,py,COL.ink,5); line(ctx,px-50,TY,px+50,TY,COL.ink,5);
      ctx.save(); ctx.translate(px,py); ctx.rotate(th.x); rect(ctx,-ARM-8,-5,2*ARM+16,10,COL.ink,'#fff',2.4); ctx.restore();
      ctx.save(); ctx.translate(px,py); ctx.rotate(th.x); line(ctx,0,0,0,70,COL.red,2.6); ctx.restore();
      circ(ctx,px,py,6,COL.ink,'#fff',2.4);
      /* scale for the pointer */
      ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(px,py,76,Math.PI/2-0.35,Math.PI/2+0.35); ctx.stroke(); ctx.restore(); line(ctx,px,py+70,px,py+84,COL.green,2.4);
      for(const s of [-1,1]){ const hx=px+s*ex, hy=py+s*ey, pY=hy+150; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(hx-54,pY); ctx.lineTo(hx-54,hy+46); ctx.lineTo(hx,hy+8); ctx.lineTo(hx+54,hy+46); ctx.lineTo(hx+54,pY); ctx.moveTo(hx,hy); ctx.lineTo(hx,hy+8); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.moveTo(hx-50,pY); ctx.quadraticCurveTo(hx,pY+18,hx+50,pY); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
        const ci=s<0?onL:onR; if(ci>=0&&cups[ci].h.t>=cups[ci].h.T){ cups[ci].h.x=hx; cups[ci].h.y=pY; cups[ci].h.x1=hx; } }
      if(onL>=0&&onR>=0&&Math.abs(th.v)<0.02){ const hv=mR>mL+0.0005?onR:mL>mR+0.0005?onL:-1; reading=hv>=0?'Cup '+CUPS[hv].L+' is heavier':'They balance'; }
    }
    /* cups */
    cups.forEach((c,i)=>{ hopStep(c.h,dt); drawCup(i,c.h.x,c.h.y); });
    /* lens: what fills the cup up close */
    { const sel=mode===0?onD:(onR>=0?onR:onL); if(sel>=0){ const LX=110, LY=150, LR=66;
      lens(ctx,LX,LY,LR,()=>{ if(sel===0){ ctx.fillStyle='rgba(47,143,224,0.2)'; ctx.fillRect(LX-LR,LY-LR,2*LR,2*LR); }
        else if(sel===1){ const r=rng(4); for(let k=0;k<60;k++){ const x=LX+(r()-0.5)*2*LR, y=LY+(r()-0.5)*2*LR; ctx.save(); ctx.translate(x,y); ctx.rotate(r()*3); ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,7); ctx.fillStyle='#f1e2c4'; ctx.fill(); ctx.strokeStyle='#9c7b4a'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); } }
        else { [[-30,-24,30],[30,-20,28],[-8,30,32],[44,40,20],[-52,34,18]].forEach(p=>{ ctx.beginPath(); ctx.ellipse(LX+p[0],LY+p[1],p[2],p[2]*0.8,0,0,7); ctx.fillStyle='#e9ecef'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); });
          textAt(ctx,'air gaps',LX+8,LY+4,{align:'center',size:12,weight:700,color:COL.blue}); }
      },COL.ink,'inside cup '+CUPS[sel].L); } }
    setv($,'cR',reading===null?(mode===0&&onD>=0?'settling…':'—'):typeof reading==='number'?reading+' g':reading);
    setv($,'cC',mode===0?(onD>=0?'Cup '+CUPS[onD].L+' ('+CUPS[onD].n.toLowerCase()+')':'nothing'):((onL>=0?CUPS[onL].L:'–')+' vs '+(onR>=0?CUPS[onR].L:'–')));
    setv($,'cP',predH>=0?'heaviest '+CUPS[predH].L+(predL>=0?', lightest '+CUPS[predL].L:''):'—');
    const ks=Object.keys(got).map(Number); const hv=ks.sort((a,b)=>got[b]-got[a])[0];
    setv($,'cK',ks.length?'Cup '+CUPS[hv].L+' — '+got[hv]+' g':'—');
    setLog($,'tL',[0,1,2].filter(i=>got[i]!==undefined).map(i=>['Cup '+CUPS[i].L,CUPS[i].n,{t:got[i]+' g',c:i===hv?'g':''}]));
  };
  S.found=()=>{ if([0,1,2].some(i=>got[i]===undefined)) return ''; const o=[0,1,2].sort((a,b)=>got[b]-got[a]);
    return 'Heaviest: '+CUPS[o[0]].n.toLowerCase()+' ('+got[o[0]]+' g), lightest: '+CUPS[o[2]].n.toLowerCase()+' ('+got[o[2]]+' g) — the heavier one has more mass.'; };
  S.fb=()=>{ if(predH<0) return ['warn','First predict which cup is heaviest and which is lightest.'];
    if([0,1,2].some(i=>got[i]===undefined)) return null;
    const o=[0,1,2].sort((a,b)=>got[b]-got[a]);
    if(o[0]===predH) return ['ok','Your prediction was right — cup '+CUPS[o[0]].L+' is the heaviest.'];
    if(predH===2&&o[0]===1) return ['warn','Pebbles feel heavy, but the big gaps between them hold only air — the sand packs closer.'];
    return ['warn','The balance says cup '+CUPS[o[0]].L+' — that’s why we measure instead of guessing.']; };
  return S;
}); }
