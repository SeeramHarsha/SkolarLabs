      const dx=TW/(NS-1), ns=Math.ceil(dt/(0.5*dx/cW)), hs=dt/ns;
      if(inW) for(let s=0;s<ns;s++){ const a=new Float64Array(NS);
        for(let i=1;i<NS-1;i++){ const x=-TW/2+i*dx, g=(x-fx)/0.8, G=Math.exp(-g*g), dG=-2*g/0.8*G;
          a[i]=cW*cW*(eta[i-1]-2*eta[i]+eta[i+1])/(dx*dx)-3*etv[i]+(fdep.x<0?1:0)*(-fvx)*dG*160; }
        for(let i=1;i<NS-1;i++){ etv[i]+=a[i]*hs; eta[i]+=etv[i]*hs; } eta[0]=eta[1]; eta[NS-1]=eta[NS-2]; }
      const pc=Math.min(w/30,h/20), X=x=>w*0.5+x*pc, Y=y=>h*0.62-y*pc;
      ground(ctx,X(-14),X(14),Y(-4.4));
      // tray
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(X(-TW/2-0.4),Y(1.2)); ctx.lineTo(X(-TW/2),Y(-4)); ctx.lineTo(X(TW/2),Y(-4)); ctx.lineTo(X(TW/2+0.4),Y(1.2)); ctx.stroke(); ctx.restore();
      const surf=i=>(inW?0:0)+eta[i];
      if(inW){ ctx.save(); ctx.beginPath(); ctx.moveTo(X(-TW/2),Y(-4)); for(let i=0;i<NS;i++) ctx.lineTo(X(-TW/2+i*dx),Y(-4+WD+1.4+surf(i))); ctx.lineTo(X(TW/2),Y(-4)); ctx.closePath(); ctx.fillStyle=WFILL2; ctx.fill();
        ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); for(let i=0;i<NS;i++) ctx[i?'lineTo':'moveTo'](X(-TW/2+i*dx),Y(-4+WD+1.4+surf(i))); ctx.stroke(); ctx.restore(); }
      else { rect(ctx,X(-TW/2+0.3),Y(0),(TW-0.6)*pc,4*pc,COL.ink,'#fff',2.4); for(let k=1;k<4;k++){ ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(X(-TW/2+0.3),Y(-k)); ctx.bezierCurveTo(X(-4),Y(-k)-4,X(4),Y(-k)+4,X(TW/2-0.3),Y(-k)); ctx.stroke(); ctx.restore(); } }
      // finger
      const tipY=(inW?-4+WD+1.4:0)+fdep.x;
      handDown(ctx,X(fx),Y(tipY),110);
      if(Math.abs(fvx)>0.5&&fdep.x<0.5) vec(ctx,X(fx),Y(tipY)-50,X(fx)+clamp(fvx*3,-45,45),Y(tipY)-50,COL.yellow,2.6);
      if(!inW&&fOn) vec(ctx,X(fx)+18,Y(tipY)-30,X(fx)+18,Y(tipY)-6,COL.yellow,2.6);
      // lens on the fingertip
      F.finger.x=0; F.finger.y=inW?clamp(-(fdep.x+0.2)*0.35-0.1,-1.4,0.4):-0.37-Math.max(0,fdep.x)*0.35;
      F.ps.forEach(p=>{ if(p!==F.finger&&inW) p.vx+=-fvx*0.004*(1-Math.min(1,Math.abs(p.y-F.finger.y))); });
      psStep(F,dt);
      const R=Math.min(w*0.2,h*0.25), cx=w-R-16, cy=R+16;
      zoomFrame(ctx,cx,cy,R,X(fx),Y(tipY),inW?'water particles move aside, then flow back':'wood particles hold their places',()=>{ if(!inW) psBonds(ctx,F,cx,cy,R,0.27,p=>p!==F.finger); else psBonds(ctx,F,cx,cy,R,0.23,p=>p!==F.finger,0.45); psDraw(ctx,F,cx,cy,R); });
      const fb=$('#fbF');
      if(!fOn){ fb.className='fb warn'; fb.textContent='Move the finger.'; }
      else if(inW){ fb.className='fb ok'; fb.textContent='The finger slips through; the water closes up behind it.'; }
      else { fb.className='fb bad'; fb.textContent='The finger cannot go in — strong attractions hold the wood together.'; }
    }
  });
  return wrap;
}

/* =====================================================================
   7.5 SMOKE IN GAS JARS
   Every smoke speck is a Langevin particle: dv = −γv·dt + √(2γT)·dW,
   i.e. it is knocked about at random by air particles, so it spreads
   with D = T/γ (≈ 8 cm²/s here — the stirring of a real jar of smoke,
   not molecular diffusion). Fresh smoke is hot and rises with a
   buoyancy that fades as it cools (τ ≈ 3 s). The walls and the glass
   plate reflect particles. Once the plate is pulled out the smoke
   fills Jar B too, heading for an even 50 : 50 split.
   The lens is a real collision simulation: one heavy smoke speck
   (mass 40×) hit by fast air particles jiggles — Brownian motion.
   ===================================================================== */
function brownianSim(n){
  const S=psNew(), r=rng(13);
  S.big=psAdd(S,{x:0,y:0,r:0.13,m:40,damp:0,k:0.8,hx:0,hy:0,col:COL.ink,fill:'#dfe5ec',lw:2});
  for(let i=0;i<n;i++){ const a=r()*6.28, d=0.3+r()*0.6; psAdd(S,{x:Math.cos(a)*d,y:Math.sin(a)*d,vx:gauss()*0.8,vy:gauss()*0.8,r:0.035,temp:0.6,damp:0.3,col:COL.green,fill:'#fff',trail:0.12,lw:1.4}); }
  S.path=[]; return S;
}
function brownianDraw(ctx,S,cx,cy,R){
  if(S.path.length>1){ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.beginPath(); S.path.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](cx+q[0]*R,cy+q[1]*R)); ctx.stroke(); ctx.restore(); }
  psDraw(ctx,S,cx,cy,R);
}
function brownianStep(S,dt,speed){ S.ps.forEach(p=>{ if(p!==S.big) p.temp=0.6*speed*speed; }); psStep(S,dt); S.path.push([S.big.x,S.big.y]); if(S.path.length>160) S.path.shift(); }

function buildA5(){
  const wrap=labShell();
  const STEPS=['Collect smoke','Cover & turn over','Put Jar B on top','Remove the plate'];
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="step-row" id="stR">${STEPS.map((s,i)=>`<div class="step-pill" data-i="${i}">${i+1}</div>`).join('')}</div>
      <div class="hint" id="stT" style="font-weight:600;color:var(--text-1);font-size:var(--fs-sm)"></div>
      <button class="toggle-btn play" id="nx" style="width:100%;padding:9px;margin-top:8px;">Next step ▶</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Smoke in A</div><div class="rval" id="r1">—</div></div>
      <div class="rcard"><div class="rlabel">Smoke in B</div><div class="rval" id="r2">—</div></div></div>
      <div class="fb" id="fb"></div>
      <button class="toggle-btn navy" id="rs">↺ Start again</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const JW=4.8, TEMP=17, GAM=2, NMAX=260;
  let step, T, ps, jA, plate, jB, t;
  const B=brownianSim(26);
  function reset(){ step=0; T=0; ps=[]; jA={cx:0,cy:18,ang:0}; plate={x:15,on:false}; jB={dy:30,on:false}; t=0; }
  reset();
  $('#nx').onclick=()=>{ if(step<3&&T>0.6){ step++; T=0;
    if(step===1){ ps=ps.filter(p=>p.in); ps.forEach(p=>{ p.lx=p.x-jA.cx; p.ly=p.y-jA.cy; }); }
    if(step===2) jB.on=true; } };
  $('#rs').onclick=reset;
  const inA=p=>p.y<16.2, count=()=>ps.filter(p=>p.in).length;

  animLoop((dt)=>{
    t+=dt; T+=dt;
    // --- choreography
    if(step===1){ plate.on=true; plate.x=lerp(15,0,smooth01(0,0.8,T)); const u=smooth01(1.0,2.4,T); jA.ang=Math.PI*u; jA.cx=0; jA.cy=lerp(18,8,u)+Math.sin(u*Math.PI)*3; }
    if(step>=2){ jB.dy=lerp(30,0,smooth01(0,1.2,step===2?T:9)); }
    if(step===3){ plate.x=lerp(0,15,smooth01(0,1.2,T)); }
    // --- smoke
    if(step===0&&count()<NMAX&&ps.length<NMAX+160){ const n=Math.random()<dt*70?1:0; for(let k=0;k<n+ (Math.random()<dt*70?1:0);k++) ps.push({x:gauss()*0.15,y:8.6,vx:gauss()*0.5,vy:4,heat:1,in:false,age:0}); }
    const turning=step===1&&T>=1.0&&T<2.4;
    ps.forEach(p=>{
      p.age+=dt;
      if(turning){ const c=Math.cos(jA.ang), s=Math.sin(jA.ang); p.x=jA.cx+p.lx*c-p.ly*s; p.y=jA.cy+p.lx*s+p.ly*c; return; }
      const sd=Math.sqrt(2*GAM*TEMP*dt); p.vx+=-GAM*p.vx*dt+sd*gauss(); p.vy+=-GAM*p.vy*dt+sd*gauss()+p.heat*14*dt; p.heat*=Math.exp(-dt/3);
      const ox=p.x, oy=p.y; p.x+=p.vx*dt; p.y+=p.vy*dt;
      const bounce=(axis,lim,sgn)=>{ if(sgn*(p[axis]-lim)>0){ p[axis]=lim-(p[axis]-lim); p['v'+axis]*=-1; } };
      if(step===0||(step===1&&T<1.0)){
        if(p.in){ bounce('x',JW,1); bounce('x',-JW,-1); bounce('y',25.8,1); if(plate.on&&plate.x<5) bounce('y',10.2,-1); if(p.y<10) p.in=false; }
        else { if(p.y>10&&Math.abs(p.x)<JW&&oy<=10) p.in=true; else if(p.y>9.6&&Math.abs(p.x)<5.6&&Math.abs(ox)>=5.6){ p.x=ox; p.vx*=-1; } }
      } else {
        const top=step>=3?32.2:15.8; bounce('x',JW,1); bounce('x',-JW,-1); bounce('y',0.3,-1); bounce('y',top,1);
        if(step>=3&&p.x>plate.x-7){ if(oy<16.2&&p.y>=16.2){ p.y=16.2-(p.y-16.2); p.vy*=-1; } else if(oy>16.2&&p.y<=16.2){ p.y=16.2+(16.2-p.y); p.vy*=-1; } }
      }
    });
    if(step===0) ps=ps.filter(p=>p.in||(p.age<5&&p.y>-1&&Math.abs(p.x)<20&&p.y<40));
    brownianStep(B,dt,1);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/30,h/37), X=x=>w*0.36+x*pc, Y=y=>h*0.95-y*pc;
    ground(ctx,X(-11),X(17),Y(0));
    // incense stick in its holder
    if(step===0||(step===1&&T<0.8)){ const a=step===0?1:1-T/0.8; ctx.save(); ctx.globalAlpha=a; rect(ctx,X(-1.2),Y(0.8),2.4*pc,0.8*pc,COL.ink,'#fff',2); line(ctx,X(0),Y(0.8),X(0),Y(8.6),COL.ink,2.4); line(ctx,X(0),Y(7.6),X(0),Y(8.6),COL.red,3); ctx.restore(); }
    // smoke
    ps.forEach(p=>{ const a=p.in?0.55:clamp(0.55*(1-p.age/5),0,0.55); ctx.save(); ctx.globalAlpha=a; dot(ctx,X(p.x),Y(p.y),0.42*pc,null,'#b8c3cf'); ctx.restore(); });
    // jars
    const jar=(j,lbl)=>{ ctx.save(); ctx.translate(X(j.cx),Y(j.cy)); ctx.rotate(-j.ang); const u=pc, hw=5*u;
      ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(-hw-4,8*u); ctx.lineTo(-hw,8*u); ctx.lineTo(-hw,-7*u); ctx.quadraticCurveTo(-hw,-8*u,-hw+u,-8*u); ctx.lineTo(hw-u,-8*u); ctx.quadraticCurveTo(hw,-8*u,hw,-7*u); ctx.lineTo(hw,8*u); ctx.lineTo(hw+4,8*u); ctx.stroke();
      line(ctx,hw-6,-6*u,hw-6,4*u,'#dbe4f0',2);
      ctx.rotate(j.ang); textAt(ctx,lbl,0,5,{align:'center',size:16,weight:700,color:COL.ink,alpha:0.8}); ctx.restore(); };
    jar(jA,'A');
    if(jB.on) jar({cx:0,cy:24.4+jB.dy,ang:0},'B');
    if(plate.on&&plate.x<14.9){ let px, py, a=0;
      if(step===1&&T<2.4){ const c=Math.cos(jA.ang), s=Math.sin(jA.ang), lx=plate.x, ly=-8.2; px=jA.cx+lx*c-ly*s; py=jA.cy+lx*s+ly*c; a=jA.ang; } else { px=plate.x; py=16.2; }
      ctx.save(); ctx.translate(X(px),Y(py)); ctx.rotate(-a); rect(ctx,-7*pc,-0.2*pc,14*pc,0.4*pc,COL.ink,'#eef2f8',2); ctx.restore();
      if(step===3&&T<1.3){ hand(ctx,X(px+7)+18,Y(py),-1,60,0); vec(ctx,X(px+7)+30,Y(py)-18,X(px+7)+70,Y(py)-18,COL.yellow,2.6); } }
    if(step===1&&T<1.0) hand(ctx,X(plate.x+7)+18,Y(10),-1,60,0);
    // lens on one smoke speck
    const R=Math.min(w*0.2,h*0.26), cx=w-R-16, cy=R+16, tgt=ps.find(p=>p.in)||ps[0];
    zoomFrame(ctx,cx,cy,R,tgt?X(tgt.x):null,tgt?Y(tgt.y):0,'smoke speck hit by air particles',()=>brownianDraw(ctx,B,cx,cy,R));

    // readouts
    wrap.querySelectorAll('.step-pill').forEach((el,i)=>{ el.classList.toggle('active',i===step); el.classList.toggle('done',i<step); });
    $('#stT').textContent=STEPS[step]; $('#nx').disabled=step>=3;
    const n=count(), nA=ps.filter(p=>p.in&&inA(p)).length;
    $('#r1').textContent=step>=1&&n?Math.round(100*nA/n)+' %':(step===0?Math.round(100*Math.min(1,n/NMAX))+' % full':'—');
    $('#r2').textContent=step>=3&&n?Math.round(100*(n-nA)/n)+' %':(jB.on?'0 %':'—');
    const fb=$('#fb');
    if(step===0){ fb.className='fb warn'; fb.textContent=n<NMAX*0.6?'Smoke rises and is trapped in Jar A.':'Jar A is full of smoke — next step.'; }
    else if(step<3){ fb.className='fb ok'; fb.textContent='The smoke fills the whole of Jar A, whatever way it is turned.'; }
    else if((n-nA)/Math.max(1,n)<0.35){ fb.className='fb warn'; fb.textContent='The smoke moves up into Jar B…'; }
    else { fb.className='fb ok'; fb.textContent='Smoke fills both jars: a gas has no fixed shape or volume.'; }
  });
  return wrap;
}

/* =====================================================================
   7.6 SQUEEZE A SYRINGE
   20 mL syringe, bore 2 cm (A = 3.14 cm²), air column 6.37 cm.
   Sealed air (Boyle, slow push → isothermal):  p = p₀·L₀/L
   Plunger (plus hand, 3 kg) obeys  m·L̈ = (p − p₀)·A − F − c·L̇,
   so it settles on a spring-damper and springs back when you let go.
   Check: F = 30 N → Δp = 30/3.14×10⁻⁴ = 95.5 kPa → V = 20×100/195.5
   = 10.2 mL.
   Sealed water: bulk modulus K = 2.2 GPa → ΔV/V = Δp/K = 0.004 %
   (0.0009 mL at 30 N) — practically incompressible.
   Open nozzle (2 mm): the contents stream out, Q = C_d·a·√(2Δp/ρ).
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Inside the syringe</label>
      <div class="toggle-group" id="flB"><button class="toggle-btn active" data-f="a">💨 Air</button><button class="toggle-btn" data-f="w">💧 Water</button></div>
      <div class="toggle-group" id="thB"><button class="toggle-btn active" data-t="1">👍 Thumb on the end</button><button class="toggle-btn" data-t="0">End open</button></div></div>
    <div class="control-group"><label>Your push <span class="val" id="fV"></span></label><input type="range" id="fR" min="0" max="60" step="1" value="0">
      <button class="toggle-btn navy" id="lg">✋ Let go</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Volume inside</div><div class="rval" id="r1">20 mL</div></div>
      <div class="rcard"><div class="rlabel">Pressure inside</div><div class="rval" id="r2" style="color:var(--f-red)">100 kPa</div></div>
      <div class="rcard wide"><div class="rlabel">Squeezed by</div><div class="rval" id="r3">0 %</div></div></div>
      <div class="fb" id="fb"></div>
      <button class="toggle-btn navy" id="rs">↺ Refill to 20 mL</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), fR=$('#fR');
  const A=3.14e-4, L0=0.0637, P0=1e5, M=3, CDMP=23, K=2.2e9, NOZ=Math.PI*1e-6, CD=0.6, RHO={a:1.2,w:1000}, FR=1.2;
  let fluid='a', sealed=true, L, Lref, v, t, parts, jet;
  function reset(){ L=L0; Lref=L0; v=0; t=0; jet=[]; fR.value=0;
    parts=[]; const r=rng(8);
    if(fluid==='a') for(let i=0;i<40;i++){ const a=r()*6.28; parts.push({x:r(),y:(r()*2-1)*0.85,vx:Math.cos(a),vy:Math.sin(a)}); }
    else for(let i=0;i<15;i++) for(let j=0;j<5;j++) parts.push({x:(i+0.5)/15,y:-0.72+j*0.36+(i%2)*0.18-0.09,ph:r()*6.28}); }
  reset();
  toggleWire([...wrap.querySelectorAll('#flB .toggle-btn')],b=>{ fluid=b.dataset.f; reset(); });
  toggleWire([...wrap.querySelectorAll('#thB .toggle-btn')],b=>{ sealed=b.dataset.t==='1'; });
  $('#lg').onclick=()=>{ fR.value=0; };
  $('#rs').onclick=reset;
  let P=P0;

  animLoop((dt)=>{
    t+=dt;
    const F=+fR.value; $('#fV').textContent=F+' N';
    const Lold=L;
    // ---- plunger physics
    if(fluid==='a'){
      const n=40, h=dt/n;
      for(let s=0;s<n;s++){
        let dp; if(sealed){ P=P0*Lref/L; dp=P-P0; }
        else { const q=Math.max(0,-v)*A/(CD*NOZ); dp=0.5*RHO.a*q*q; P=P0+dp; }
        if(!sealed) Lref=L;
        let fn=dp*A-F-CDMP*v;
        if(Math.abs(v)<1e-3&&Math.abs(fn)<FR){ v=0; continue; }
        fn-=Math.sign(v||fn)*FR;
        v+=fn/M*h; L+=v*h;
        if(L<0.004){ L=0.004; v=0; } if(L>L0+0.011){ L=L0+0.011; v=Math.min(0,v); }
        if(!sealed&&L>=Lref&&v>0){ v=0; }
      }
    } else {
      if(sealed){ P=P0+F/A; L=approach(L,Lref*(1-(F/A)/K),20,dt); v=0; }
      else { const dp=Math.max(0,F-FR)/A; P=P0+dp; v=-CD*NOZ/A*Math.sqrt(2*dp/RHO.w); L=Math.max(0.003,L+v*dt); if(L<=0.003) v=0; Lref=L; }
    }
    // ---- particles (x from 0 = nozzle end to 1 = plunger face, y in ±1)
    const Lc=L*100;
    if(fluid==='a'){
      const target=Math.max(2,Math.round(40*Lref/L0));
      while(parts.filter(p=>!p.out).length>target){ const p=parts.filter(q=>!q.out).sort((a,b)=>a.x-b.x)[0]; p.out=true; p.x=0; p.y=0; p.vx=-1; p.age=0; }
      const spd=1.2;
      parts.forEach(p=>{
        if(p.out){ p.age+=dt; p.x+=p.vx*dt*4/Math.max(1,Lc); return; }
        p.x+=p.vx*spd*dt/Math.max(0.5,Lc)*3; p.y+=p.vy*spd*dt;
        if(p.x<0.02){ p.x=0.02; p.vx=Math.abs(p.vx); } if(p.x>0.98){ p.x=0.98; p.vx=-Math.abs(p.vx); }
        if(Math.abs(p.y)>0.88){ p.y=Math.sign(p.y)*0.88; p.vy*=-1; }
        // rescale x when the plunger moves: particles are carried by the moving wall
      });
      parts=parts.filter(p=>!p.out||p.age<1.2);
    } else if(!sealed){
      const keep=Math.round(75*L/L0); let inside=parts.filter(p=>!p.out);
      while(inside.length>keep){ const p=inside.sort((a,b)=>a.x-b.x)[0]; p.out=true; p.age=0; p.vx=-(Math.sqrt(2*Math.max(0,F-FR)/A/RHO.w)); inside=parts.filter(q=>!q.out); }
      parts.forEach(p=>{ if(p.out){ p.age+=dt; } });
      parts=parts.filter(p=>!p.out||p.age<0.6);
      inside=parts.filter(p=>!p.out); const nCol=Math.max(1,Math.ceil(inside.length/5));
      inside.sort((a,b)=>a.x-b.x).forEach((p,i)=>{ const col=Math.floor(i/5); p.x=approach(p.x,(col+0.5)/nCol,10,dt); });
    }

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/16,h/8), X=x=>w*0.47+x*pc, Y=y=>h*0.5-y*pc;
    const xN=-6, face=xN+Lc, ri=1, rodEnd=face+5.5;
    const XP=u=>X(xN+u*Lc);
    // contents
    if(fluid==='w'){ const inside=parts.filter(p=>!p.out); if(inside.length){ ctx.save(); ctx.fillStyle=WFILL; ctx.fillRect(X(xN),Y(ri),Lc*pc,2*ri*pc); ctx.restore(); } }
    // barrel, nozzle, finger grips
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(X(xN-0.9),Y(0.18)); ctx.lineTo(X(xN),Y(0.18)); ctx.lineTo(X(xN),Y(ri)); ctx.lineTo(X(xN+L0*100+1.3),Y(ri)); ctx.moveTo(X(xN-0.9),Y(-0.18)); ctx.lineTo(X(xN),Y(-0.18)); ctx.lineTo(X(xN),Y(-ri)); ctx.lineTo(X(xN+L0*100+1.3),Y(-ri)); ctx.stroke();
    line(ctx,X(xN+L0*100+1.3),Y(ri+1.1),X(xN+L0*100+1.3),Y(-ri-1.1),COL.ink,3);
    for(let m=0;m<=20;m+=2){ const xx=X(xN+m/3.14), L2=m%10?5:10; line(ctx,xx,Y(ri),xx,Y(ri)-L2,COL.mid,1.1); if(m%10===0) textAt(ctx,m+' mL',xx,Y(ri)-14,{size:10,color:COL.muted,align:'center'}); }
    ctx.restore();
    // particles
    if(fluid==='a') parts.forEach(p=>{ const px=p.out?X(xN-0.9)-p.age*80:XP(p.x), py=p.out?Y(0)+Math.sin(p.age*30)*2:Y(p.y*ri*0.9); ctx.save(); ctx.globalAlpha=p.out?clamp(1-p.age,0,1):1;
      if(!p.out) line(ctx,px-p.vx*9,py+p.vy*9,px,py,COL.green,1.6); dot(ctx,px,py,4,COL.ink,'#fff',1.4); ctx.restore(); });
    else parts.forEach(p=>{ let px, py; if(p.out){ px=X(xN-0.9)+p.vx*p.age*60; py=Y(0)+0.5*981*p.age*p.age*0.5; } else { px=XP(p.x)+Math.sin(t*9+p.ph)*1.6; py=Y(p.y*ri)+Math.cos(t*8+p.ph)*1.6; }
      ctx.save(); ctx.globalAlpha=p.out?clamp(1-p.age*1.6,0,1):1; dot(ctx,px,py,Math.min(5,0.19*pc),COL.blue,'#eaf4fd',1.6); ctx.restore(); });
    if(fluid==='w'&&!sealed&&v<-1e-4){ ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.setLineDash([8,6]); ctx.lineDashOffset=t*200; ctx.beginPath(); ctx.moveTo(X(xN-0.9),Y(0)); ctx.quadraticCurveTo(X(xN-5),Y(0)+4,X(xN-8),Y(0)+14); ctx.stroke(); ctx.restore(); }
    // plunger: rubber head + rod + thumb pad
    rect(ctx,X(face),Y(ri-0.05),0.55*pc,(2*ri-0.1)*pc,COL.ink,'#fff',2.4);
    line(ctx,X(face+0.55),Y(0.35),X(rodEnd),Y(0.35),COL.ink,2.2); line(ctx,X(face+0.55),Y(-0.35),X(rodEnd),Y(-0.35),COL.ink,2.2);
    line(ctx,X(rodEnd),Y(1.3),X(rodEnd),Y(-1.3),COL.ink,3.4);
    // pressure inside pushing on the plunger (red), your push (yellow)
    const dp=P-P0;
    if(fluid==='a'&&Math.abs(dp)>500){ const Lr=clamp(dp/1000*0.5,-40,40); [-0.55,0,0.55].forEach(y=>push(ctx,X(face),Y(y),Lr>0?0:Math.PI,Math.abs(Lr),COL.red)); }
    if(fluid==='w'&&sealed&&dp>500){ const Lr=clamp(dp/1000*0.5,0,40); [-0.55,0,0.55].forEach(y=>push(ctx,X(face),Y(y),0,Lr,COL.red)); }
    if(F>0.5){ const Lf=clamp(F*0.9,6,60); vec(ctx,X(rodEnd)+Lf+14,Y(0),X(rodEnd)+14,Y(0),COL.yellow,3.2); textAt(ctx,F+' N',X(rodEnd)+14+Lf/2,Y(0)-10,{size:12,weight:700,color:COL.yellow,align:'center'}); }
    hand(ctx,X(rodEnd)+6,Y(0),-1,70,0.25);
    if(sealed){ hand(ctx,X(xN-0.9),Y(0),1,70,Math.PI*0.9); }
    // readouts
    const V=A*L*1e6;
    $('#r1').textContent=(fluid==='w'&&sealed)?fmt(V,4)+' mL':fmt(V,1)+' mL';
    $('#r2').textContent=Math.round(P/1000)+' kPa';
    const sq=(1-L/L0)*100; $('#r3').textContent=(fluid==='w'&&sealed)?fmt(sq,4)+' %':fmt(Math.max(0,sq),0)+' %';
    const fb=$('#fb');
    if(fluid==='a'&&sealed){ if(F<1&&Math.abs(L-L0)>0.002){ fb.className='fb ok'; fb.textContent='Let go — the squeezed air pushes the plunger back.'; } else if(F<1){ fb.className='fb warn'; fb.textContent='Push the plunger.'; } else { fb.className='fb ok'; fb.textContent='Air particles have big gaps, so they can be pushed closer.'; } }
    else if(fluid==='w'&&sealed){ fb.className=F<1?'fb warn':'fb bad'; fb.textContent=F<1?'Push the plunger.':'Water hardly squeezes — its particles are already close together.'; }
    else { fb.className='fb warn'; fb.textContent='The end is open — the '+(fluid==='a'?'air':'water')+' just escapes.'; }
  });
  return wrap;
}

/* =====================================================================
   7.7 WATER LEVEL A · B · C
   Glass of 6 cm bore (28.3 cm²) half filled: 150 mL → mark A.
   Solid crystals take up their own volume, m/ρ → mark B.
   Dissolved, each mole takes up only its apparent molar volume φ
   (it slips into the spaces between water particles) → mark C:
                    ρ (g/cm³)  φ (cm³/mol)   2 tsp: B→C
       sugar          1.587       211          −0.11 mL
       common salt    2.165       16.6         −2.1 mL
       glucose        1.54        112          −0.20 mL
       sand           2.65        insoluble      0
   The level lens magnifies the height scale so that these changes show.
   Crystals dissolve as dm/dt = −k·(m/m₀)^(2/3); stirring raises k ~60×.
   Clock ×10.
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  const SOL={sugar:{n:'Sugar',tsp:4.2,rho:1.587,M:342.3,phi:211.3},salt:{n:'Salt',tsp:6,rho:2.165,M:58.44,phi:16.6},glucose:{n:'Glucose',tsp:3.5,rho:1.54,M:180.16,phi:111.9},sand:{n:'Sand',tsp:5,rho:2.65,M:0,phi:0}};
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Solid</label><div class="chip-wrap" id="soB">${Object.keys(SOL).map((k,i)=>`<button class="chip-btn${i?'':' active'}" data-s="${k}">${SOL[k].n}</button>`).join('')}</div>
      <label style="margin-top:10px;">Teaspoons <span class="val" id="tV"></span></label><input type="range" id="tR" min="1" max="4" step="1" value="2">
      <button class="toggle-btn play" id="add" style="width:100%;padding:9px;margin-top:9px;">🥄 Add it · mark B</button>
      <div class="toggle-group"><button class="toggle-btn" id="stir">🥢 Stir with the glass rod</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">Level A</div><div class="rval" id="rA">—</div></div>
      <div class="rcard"><div class="rlabel">Level B</div><div class="rval" id="rB">—</div></div>
      <div class="rcard"><div class="rlabel">Level C</div><div class="rval" id="rC">—</div></div></div>
      <div class="result-cards" style="margin-top:6px"><div class="rcard wide"><div class="rlabel">From B to C</div><div class="rval" id="rD">—</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Levels shown as volume in mL. Time ×10.</div>
      <button class="toggle-btn navy" id="rs">↺ Fresh water · mark A</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), tR=$('#tR');
  const AREA=Math.PI*9, VW=150, HV=11;
  let sk='sugar', mS, mD, m0, crystals, spoon, stirring, swirl, theta, Bmark, Cmark, t;
  const S=psNew();
  function lens(){ S.ps.length=0; const r=rng(6);
    hexSites(0.22,-0.95,0.95,-0.95,0.95).forEach(([x,y])=>{ if(r()<0.72) psAdd(S,{x:x+(r()-0.5)*0.05,y,r:0.085,temp:0.2,damp:3,col:COL.blue,fill:'#eaf4fd',kind:'w'}); });
    S.ps.filter(p=>Math.hypot(p.x-0.1,p.y-0.55)<0.33).forEach(p=>S.ps.splice(S.ps.indexOf(p),1));
    hexSites(0.16,-0.2,0.4,0.3,0.8).filter(([x,y])=>Math.hypot(x-0.1,y-0.55)<0.28).forEach(([x,y])=>psAdd(S,{x,y,hx:x,hy:y,k:90,r:sk==='salt'?0.055:0.07,temp:0.01,damp:4,col:COL.ink,fill:'#fff',kind:'s',lw:1.8}));
  }
  function reset(){ mS=0; mD=0; m0=0; crystals=[]; spoon=null; stirring=false; swirl=0; theta=0; Bmark=null; Cmark=null; t=0; $('#stir').classList.remove('active'); lens(); }
  reset();
  wrap.querySelectorAll('#soB .chip-btn').forEach(b=>b.onclick=()=>{ wrap.querySelectorAll('#soB .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); sk=b.dataset.s; reset(); });
  $('#add').onclick=()=>{ if(spoon||m0>0) return; spoon={T:0,rel:0,m:+tR.value*SOL[sk].tsp}; };
  $('#stir').onclick=()=>{ stirring=!stirring; $('#stir').classList.toggle('active',stirring); };
  $('#rs').onclick=reset;
  const vol=()=>{ const s=SOL[sk]; return VW+mS/s.rho+(s.M?mD/s.M*s.phi:0); };

  animLoop((dt)=>{
    t+=dt; $('#tV').textContent=tR.value+' tsp ('+fmt(+tR.value*SOL[sk].tsp,1)+' g)';
    swirl=approach(swirl,stirring?1:0,stirring?2:0.7,dt); theta+=7*dt*(stirring?1:0.3*swirl);
    const s=SOL[sk], lvl0=vol()/AREA;
    // spoon + falling crystals (each counts towards the volume once it is under water)
    if(spoon){ spoon.T+=dt; const N=30;
      if(spoon.T>0.7&&spoon.rel<N&&spoon.T<1.6){ const k=Math.min(N,Math.floor((spoon.T-0.7)/0.9*N)); while(spoon.rel<k){ spoon.rel++; crystals.push({x:1+gauss()*0.3,y:HV+2,vx:-5+gauss()*3,vy:0,st:'fall',m:spoon.m/N,s:0.8+Math.random()*0.5,th:Math.random()*6.28,lift:Math.random(),r:0}); } }
      if(spoon.T>2.4){ m0=spoon.m; spoon=null; } }
    crystals.forEach(k=>{ if(k.st==='bed') return; const inW=k.y<lvl0;
      if(inW&&k.st==='fall'){ k.st='sink'; mS+=k.m; }
      k.vy=inW?approach(k.vy,-(sk==='sand'?12:8),120,dt):k.vy-GC*dt; if(inW) k.vx=approach(k.vx,0,20,dt);
      k.x+=k.vx*dt; k.y+=k.vy*dt; k.x=clamp(k.x,-2.7,2.7);
      if(k.y<=0.15+Math.random()*0.25){ k.st='bed'; k.bx=k.x; k.by=k.y; k.r=Math.abs(k.x)+0.3; } });
    if(m0>0&&!spoon&&Bmark===null&&crystals.every(k=>k.st==='bed')) Bmark=vol();
    // dissolving (clock ×10)
    if(s.M&&mS>1e-6&&Bmark!==null){ const dm=Math.min(mS,m0*(0.0008+0.05*swirl)*Math.pow(mS/m0,2/3)*dt*10); mS-=dm; mD+=dm; if(mS<1e-4){ mD+=mS; mS=0; } }
    if(Bmark!==null&&(swirl>0.05||mD>0)) Cmark=vol();
    // particle lens: dissolved share of solute particles let go of the crystal
    const sp=S.ps.filter(p=>p.kind==='s'), f=m0>0?mD/m0:0;
    sp.forEach((p,i)=>{ const free=i<Math.round(f*sp.length)*1; if(free&&p.k>0){ p.k=0; p.temp=0.2; p.damp=3; } });
    S.ps.forEach(p=>{ if(p.kind==='w') p.temp=0.2*(1+swirl); });
    psStep(S,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/22,h/15), X=x=>w*0.27+x*pc, Y=y=>h*0.88-y*pc;
    ground(ctx,X(-6),X(7),Y(-0.3));
    const lvl=vol()/AREA, dip=0.4*swirl, surf=x=>lvl+dip*((x/3)**2-0.5);
    ctx.save(); ctx.beginPath(); ctx.moveTo(X(-3),Y(0)); for(let k=0;k<=24;k++){ const x=-3+6*k/24; ctx.lineTo(X(x),Y(surf(x))); } ctx.lineTo(X(3),Y(0)); ctx.closePath(); ctx.fillStyle=WFILL; ctx.fill();
    ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.beginPath(); for(let k=0;k<=24;k++){ const x=-3+6*k/24; ctx[k?'lineTo':'moveTo'](X(x),Y(surf(x))); } ctx.stroke(); ctx.restore();
    // dissolved solute: faint jiggling dots
    if(mD>0){ const n=Math.round(clamp(mD/Math.max(m0,1),0,1)*90), r=rng(3); ctx.save(); ctx.fillStyle=COL.muted; for(let i=0;i<n;i++){ const x=-2.8+r()*5.6, y=0.2+r()*(lvl-0.4), ph=r()*6.28; ctx.fillRect(X(x)+Math.sin(t*5+ph)*1.5-1,Y(y)+Math.cos(t*4+ph)*1.5-1,2,2); } ctx.restore(); }
    const fac=m0>0&&s.M?Math.cbrt(Math.max(0,mS)/m0):1;
    crystals.forEach(k=>{ let x=k.x, y=k.y, sz=k.s*(k.st==='bed'?fac:1); if(sz<0.08) return;
      if(k.st==='bed'){ const Lf=smooth01(0.1,0.7,swirl); k.th+=(2+k.lift*2)*swirl*dt; x=lerp(k.bx,Math.cos(k.th)*Math.min(2.6,k.r),Lf); y=lerp(k.by,0.3+k.lift*lvl*0.7*swirl,Lf); }
      const p=Math.max(2,sz*0.2*pc); ctx.save(); ctx.translate(X(x),Y(y)); ctx.rotate(k.th); if(sk==='sand'){ ctx.beginPath(); ctx.arc(0,0,p*0.55,0,6.28); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.3; ctx.stroke(); } else { ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.3; ctx.fillRect(-p/2,-p/2,p,p); ctx.strokeRect(-p/2,-p/2,p,p); } ctx.restore(); });
    // vessel
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(X(-3.2),Y(HV)); ctx.lineTo(X(-3.2),Y(-0.3)); ctx.lineTo(X(3.2),Y(-0.3)); ctx.lineTo(X(3.2),Y(HV)); ctx.stroke(); ctx.restore();
    // marks on the glass
    const mark=(v,l,dx)=>{ if(v===null) return; const y=Y(v/AREA); line(ctx,X(3.2),y,X(3.2)+10,y,COL.ink,2); textAt(ctx,l,X(3.2)+13+dx,y+4,{size:12,weight:700}); };
    mark(VW,'A',0); mark(Bmark,'B',12); mark(Cmark,'C',24);
    // stirring rod
    if(stirring||swirl>0.05){ const tipx=Math.cos(theta)*2*Math.max(swirl,0.3); ctx.save(); ctx.lineCap='round'; line(ctx,X(tipx),Y(0.6),X(tipx*0.4+1.5),Y(HV+3),COL.ink,6); line(ctx,X(tipx),Y(0.6),X(tipx*0.4+1.5),Y(HV+3),'#fff',2.6); ctx.restore(); }
    if(spoon){ const T=spoon.T, inU=smooth01(0,0.6,T)-smooth01(1.8,2.4,T), tip=smooth01(0.6,1.1,T)-smooth01(1.5,1.8,T), sx=X(lerp(8,1,inU)), sy=Y(HV+2.6);
      ctx.save(); ctx.globalAlpha=clamp(inU*1.5,0,1); ctx.translate(sx,sy); ctx.rotate(-tip*1.1); ctx.beginPath(); ctx.ellipse(0,0,1*pc,0.45*pc,0,0,Math.PI); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); line(ctx,-pc,0,pc,0,COL.ink,2); line(ctx,0.95*pc,-1,4.5*pc,-0.8*pc,COL.ink,3); ctx.restore(); }
    // lens 1: the height scale near the marks, magnified
    const R=Math.min(w*0.2,h*0.22), cx=w-R-16, cy1=R+16, cy2=cy1+2*R+34;
    const hA=VW/AREA, hB=Bmark!==null?Bmark/AREA:hA+0.2, ZM=clamp(0.75*R/(pc*Math.max(hB-hA,0.05)),4,60), yc=(hA+hB)/2, LY=y=>cy1+(yc-y)*pc*ZM;
    zoomFrame(ctx,cx,cy1,R,X(3.2),Y(hA),'level scale ×'+Math.round(ZM),()=>{
      const wx=cx+R*0.1; ctx.save(); ctx.fillStyle=WFILL; const ly=LY(lvl); ctx.fillRect(cx-R,ly,wx-(cx-R),cy1+R-ly); ctx.restore();
      line(ctx,cx-R,LY(lvl),wx,LY(lvl),COL.blue,2.4); line(ctx,wx,cy1-R,wx,cy1+R,COL.ink,3);
      for(let mm=Math.floor((yc-R/(pc*ZM))*10);mm<=Math.ceil((yc+R/(pc*ZM))*10);mm++){ const y=LY(mm/10); if(pc*ZM/10<3) break; line(ctx,wx,y,wx+(mm%10?8:16),y,COL.mid,1.1); if(mm%10===0) textAt(ctx,mm/10+' cm',wx+20,y+4,{size:10,color:COL.muted}); }
      [[VW,'A'],[Bmark,'B'],[Cmark,'C']].forEach(([v,l],i)=>{ if(v===null) return; const y=LY(v/AREA); line(ctx,cx-R*0.45,y,wx,y,COL.ink,1.6,[4,3]); textAt(ctx,l,cx-R*0.5-i*13,y+4,{size:13,weight:700,align:'right'}); }); });
    // lens 2: particles
    zoomFrame(ctx,cx,cy2,R,X(0),Y(0.5),f>0.02?'dissolved particles fill the gaps':'particles, magnified (imagined)',()=>{ psDraw(ctx,S,cx,cy2,R); });

    $('#rA').textContent=fmt(VW,2); $('#rB').textContent=Bmark===null?'—':fmt(Bmark,2); $('#rC').textContent=Cmark===null?'—':fmt(Cmark,2);
    $('#rD').textContent=(Bmark===null||Cmark===null)?'—':(Cmark-Bmark>=0?'+':'')+fmt(Cmark-Bmark,2)+' mL';
    $('#add').disabled=m0>0||!!spoon;
    const fb=$('#fb');
    if(Bmark===null){ fb.className='fb warn'; fb.textContent=spoon?'The level rises as the solid goes under water.':'Add the solid.'; }
    else if(!s.M){ fb.className='fb warn'; fb.textContent='Sand does not dissolve — it just sits in the water, so the level stays at B.'; }
    else if(Cmark===null){ fb.className='fb warn'; fb.textContent='Level B marked. Now stir.'; }
    else if(mS>0.01*m0){ fb.className='fb ok'; fb.textContent='Dissolving… the level slips below B.'; }
    else { fb.className='fb ok'; fb.textContent='C is below B: the dissolved particles went into the spaces between water particles.'; }
  });
  return wrap;
}

/* =====================================================================
   7.8 POTASSIUM PERMANGANATE — COLD · ROOM · HOT
   Each tumbler is a 24 × 32 grid (0.25 cm cells). The pink colour
   spreads by diffusion plus the slow stirring currents in the water:
        ∂c/∂t = D·∇²c − u·∇c
   Faster particles in warmer water: Stokes–Einstein  D ∝ T/η(T)
        η = 1.52 (5 °C), 0.89 (25 °C), 0.355 (80 °C) mPa·s
        → D(5 °C) : D(25 °C) : D(80 °C) = 0.55 : 1 : 2.97
   Effective D at 25 °C = 0.02 cm²/s (colour through 8 cm of water in
   about half an hour). The grain dissolves at a rate ∝ D too.
   Clock ×120.
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  const TUB=[{n:'Ice-cold',T:5,eta:1.519,x:-9.3},{n:'Room',T:25,eta:0.89,x:-1},{n:'Hot',T:80,eta:0.355,x:7.3}];
  TUB.forEach(u=>{ u.f=((u.T+273)/298)*(0.89/u.eta); });
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><button class="toggle-btn play" id="drop" style="width:100%;padding:9px;">💜 Drop a grain in each tumbler</button></div>
    <div class="control-group"><label>Look closely at</label><div class="toggle-group" id="lkB">${TUB.map((u,i)=>`<button class="toggle-btn${i===1?' active':''}" data-i="${i}">${u.n}</button>`).join('')}</div></div>
    <div class="control-group"><div class="result-cards three">${TUB.map((u,i)=>`<div class="rcard"><div class="rlabel">${u.n} ${u.T} °C</div><div class="rval" id="s${i}">—</div></div>`).join('')}</div>
      <div class="result-cards" style="margin-top:6px"><div class="rcard wide"><div class="rlabel">Time passed</div><div class="rval" id="rt">0 min</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Share of the water already pink. Clock ×120.</div>
      <button class="toggle-btn navy" id="rs">↺ Fresh water</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const NX=24, NY=32, DX=0.25, W=NX*DX, H=NY*DX, D25=0.02, U25=0.004, TC=120, M0=1;
  let look=1, dropped, clock, t;
  const S=psNew();
  function lens(){ S.ps.length=0; const u=TUB[look], r=rng(12);
    for(let i=0;i<46;i++) psAdd(S,{x:(r()-0.5)*1.5,y:(r()-0.5)*1.2-0.2,r:0.08,temp:0.1*u.f*(u.T+273)/298,damp:2,col:COL.blue,fill:'#eaf4fd',kind:'w',trail:0.08});
    hexSites(0.13,-0.3,0.3,0.5,0.9).filter(([x,y])=>y>0.5).forEach(([x,y],i)=>psAdd(S,{x,y,hx:x,hy:y,k:120,r:0.06,temp:0.002,damp:5,col:'#9b2c6f',fill:'#f3d3e6',kind:'k',lw:1.6,rank:Math.hypot(x,y-0.8)}));
    S.ps.filter(p=>p.kind==='k').sort((a,b)=>b.rank-a.rank).forEach((p,i)=>p.ord=i); S.T0=null; }
  function reset(){ TUB.forEach(u=>{ u.c=new Float64Array(NX*NY); u.m=0; u.gy=null; u.gv=0; u.t90=null; }); dropped=false; clock=0; t=0; lens(); }
  reset();
  $('#drop').onclick=()=>{ if(dropped) return; dropped=true; TUB.forEach(u=>{ u.gy=H+2; u.gv=0; u.m=M0; }); };
  toggleWire([...wrap.querySelectorAll('#lkB .toggle-btn')],b=>{ look=+b.dataset.i; lens(); });
  $('#rs').onclick=reset;
  const I=(i,j)=>j*NX+i;
  const OFF={c:document.createElement('canvas')}; OFF.c.width=NX; OFF.c.height=NY; OFF.ctx=OFF.c.getContext('2d');
  function stepGrid(u,dtr){
    const D=D25*u.f, U=U25*u.f, ns=Math.max(1,Math.ceil(dtr/(0.2*DX*DX/D))), h=dtr/ns, c0=u.c;
    for(let s=0;s<ns;s++){
      // grain at the bottom centre releases colour
      if(u.gy!==null&&u.gy<=0.15&&u.m>0){ const dm=Math.min(u.m,0.004*u.f*h*Math.pow(u.m/M0,2/3)); u.m-=dm; const a=I(NX/2-1,0), b=I(NX/2,0); u.c[a]+=dm/2; u.c[b]+=dm/2; }
      const c=u.c, n=new Float64Array(NX*NY), k=D*h/(DX*DX);
      for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){
        const cc=c[I(i,j)], l=c[I(Math.max(0,i-1),j)], r=c[I(Math.min(NX-1,i+1),j)], d=c[I(i,Math.max(0,j-1))], up=c[I(i,Math.min(NY-1,j+1))];
        // two convection cells: ψ = U·W/π·sin(2πx/W)·sin(πy/H)
        const x=(i+0.5)/NX, y=(j+0.5)/NY, vx=U*Math.sin(2*Math.PI*x)*Math.cos(Math.PI*y)*0.5, vy=-U*Math.cos(2*Math.PI*x)*Math.sin(Math.PI*y);
        const ax=vx>0?(cc-l):(r-cc), ay=vy>0?(cc-d):(up-cc);
        n[I(i,j)]=cc+k*(l+r+d+up-4*cc)-h/DX*(vx*ax+vy*ay);
      }
      u.c=n;
    }
  }

  animLoop((dt)=>{
    t+=dt;
    if(dropped){ clock+=dt*TC;
      TUB.forEach(u=>{ if(u.gy>0.15){ u.gv=approach(u.gv,u.gy>H?-60:-5,u.gy>H?10:40,dt); u.gy=Math.max(0.15,u.gy+u.gv*dt); } stepGrid(u,dt*TC); }); }
    TUB.forEach(u=>{ const tot=u.c.reduce((a,b)=>a+b,0)+u.m; if(tot<1e-9){ u.spread=0; return; } const cu=M0/(NX*NY); let n=0; for(let q=0;q<u.c.length;q++) if(u.c[q]>=0.5*cu) n++; u.spread=n/(NX*NY); if(u.spread>=0.9&&u.t90===null) u.t90=clock; });
    // lens: water particles knock permanganate particles out of the grain
    const LU=TUB[look];
    if(dropped&&LU.gy<=0.15){ if(S.T0===null) S.T0=t; const nFree=Math.floor((t-S.T0)*1.2*LU.f); S.ps.forEach(p=>{ if(p.kind==='k'&&p.k>0&&p.ord<nFree){ p.k=0; p.temp=0.1*LU.f; p.damp=2; } }); }
    psStep(S,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/25.5,h/19), X=x=>w*0.5+(x+0.9)*pc, Y=y=>h*0.86-y*pc;
    ground(ctx,X(-13),X(11.5),Y(-0.3));
    const cu=M0/(NX*NY);
    TUB.forEach((u,ti)=>{ const x0=u.x-W/2;
      ctx.save(); ctx.fillStyle=WFILL; ctx.fillRect(X(x0),Y(H),W*pc,H*pc); ctx.restore();
      { const id=OFF.ctx.createImageData(NX,NY); for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){ const v=u.c[I(i,j)]/cu, q=((NY-1-j)*NX+i)*4; id.data[q]=176; id.data[q+1]=40; id.data[q+2]=122; id.data[q+3]=Math.round(255*clamp(v*0.55,0,0.85)); }
        OFF.ctx.putImageData(id,0,0); ctx.save(); ctx.imageSmoothingEnabled=true; ctx.drawImage(OFF.c,X(x0),Y(H),W*pc,H*pc); ctx.restore(); }
      line(ctx,X(x0),Y(H),X(x0+W),Y(H),COL.blue,2);
      if(u.gy!==null&&u.m>0.002){ const s=Math.max(2.5,Math.cbrt(u.m/M0)*0.3*pc); ctx.save(); ctx.translate(X(u.x),Y(u.gy)-s/2); ctx.rotate(0.5); ctx.fillStyle='#6d1f4f'; ctx.fillRect(-s/2,-s/2,s,s); ctx.restore(); }
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(X(x0-0.35),Y(H+1.3)); ctx.lineTo(X(x0-0.15),Y(-0.3)); ctx.lineTo(X(x0+W+0.15),Y(-0.3)); ctx.lineTo(X(x0+W+0.35),Y(H+1.3)); ctx.stroke(); ctx.restore();
      if(u.T>50) for(let k=0;k<3;k++){ const bx=X(u.x-1.5+k*1.5); ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.8; ctx.globalAlpha=0.5+0.4*Math.sin(t*2+k); ctx.beginPath(); for(let q=0;q<=12;q++){ const yy=Y(H+0.6)-q*3.5-((t*20+k*9)%12); ctx[q?'lineTo':'moveTo'](bx+Math.sin(q*0.8+t*3+k)*4,yy); } ctx.stroke(); ctx.restore(); }
      if(u.T<10) [[-1.8,0],[1.2,0.3]].forEach(([dx,rot],k)=>{ ctx.save(); ctx.translate(X(u.x+dx),Y(H-0.25)+Math.sin(t*1.5+k)*1.5); ctx.rotate(rot); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.fillStyle='#fff'; ctx.fillRect(-0.55*pc,-0.55*pc,1.1*pc,1.1*pc); ctx.strokeRect(-0.55*pc,-0.55*pc,1.1*pc,1.1*pc); ctx.restore(); });
      textAt(ctx,u.n+' · '+u.T+' °C',X(u.x),Y(-0.3)+20,{align:'center',size:12,weight:700,color:ti===look?COL.ink:COL.muted});
      // spread bar
      const bw=W*pc, by=Y(-0.3)+30; rect(ctx,X(x0),by,bw,6,COL.border||'#c2d1e5','#eef2f8',1); ctx.save(); ctx.fillStyle='#b0287a'; ctx.fillRect(X(x0),by,bw*u.spread,6); ctx.restore();
    });
    const R=Math.min(w*0.19,h*0.24), cx=w-R-16, cy=R+16;
    zoomFrame(ctx,cx,cy,R,X(LU.x),Y(0.4),LU.n+' water, magnified (imagined)',()=>psDraw(ctx,S,cx,cy,R));

    TUB.forEach((u,i)=>{ $('#s'+i).textContent=dropped?Math.round(u.spread*100)+' %':'—'; });
    $('#rt').textContent=fmt(clock/60,1)+' min'; $('#drop').disabled=dropped;
    const fb=$('#fb'), done=TUB.filter(u=>u.t90!==null);
    if(!dropped){ fb.className='fb warn'; fb.textContent='Drop the grains.'; }
    else if(!done.length){ fb.className='fb ok'; fb.textContent='Pink streaks spread out from each grain — fastest in the hot water.'; }
    else { fb.className='fb ok'; fb.textContent=done.map(u=>u.n+': '+Math.round(u.t90/60)+' min').join(' · ')+' — hotter water, faster particles.'; }
  });
  return wrap;
}

/* =====================================================================
   7.9 INCENSE IN A ROOM
   Room 5 m × 3 m (side view). Each fragrance parcel takes a random
   step every instant, knocked about by moving air particles:
        step size σ = √(2K·Δt)
   K is the room's mixing coefficient: ~0.002 m²/s in still air,
   ~0.006 with a gentle draught, ~0.025 with a fan. Spreading time grows
   as x²/K: with K = 0.006 people 1.5 / 3 / 4.5 m away smell it after
   about 4 / 15 / 23 min — "wait for a few minutes". Fresh smoke is
   hot and first rises (buoyancy fading over ~20 s).
   A person smells it once the local density passes a threshold.
   Clock ×60.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  const AIR=[{n:'Still air',K:0.002},{n:'Gentle draught',K:0.006},{n:'Fan on',K:0.025}];
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><button class="toggle-btn play" id="lit" style="width:100%;padding:9px;">🔥 Light the incense stick</button></div>
    <div class="control-group"><label>Air in the room</label><div class="toggle-group" id="airB">${AIR.map((a,i)=>`<button class="toggle-btn${i===1?' active':''}" data-i="${i}">${a.n}</button>`).join('')}</div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">1.5 m away</div><div class="rval" id="p0">—</div></div>
      <div class="rcard"><div class="rlabel">3 m away</div><div class="rval" id="p1">—</div></div>
      <div class="rcard"><div class="rlabel">4.5 m away</div><div class="rval" id="p2">—</div></div></div>
      <div class="result-cards" style="margin-top:6px"><div class="rcard wide"><div class="rlabel">Time since lighting</div><div class="rval" id="rt">—</div></div></div>
      <div class="fb" id="fb"></div><div class="hint">Clock ×60.</div>
      <button class="toggle-btn navy" id="rs">↺ Air the room out</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  const RW=5, RH=3, TC=60, CAP=1400, RATE=0.8, SX=0.35, SY=1.05, NOSE=1.55;
  const PEOPLE=[1.5,3,4.5].map(x=>({x:x+SX,t:null,glow:0}));
  let air=1, lit=false, clock=0, ps=[], emitAcc=0, t=0;
  const B=brownianSim(26);
  function reset(){ lit=false; clock=0; ps=[]; emitAcc=0; PEOPLE.forEach(p=>{ p.t=null; p.glow=0; }); }
  $('#lit').onclick=()=>{ if(!lit){ reset(); lit=true; } };
  toggleWire([...wrap.querySelectorAll('#airB .toggle-btn')],b=>{ air=+b.dataset.i; });
  $('#rs').onclick=reset;

  animLoop((dt)=>{
    t+=dt;
    const K=AIR[air].K, dtr=dt*TC;
    if(lit){ clock+=dtr; emitAcc+=RATE*dtr; while(emitAcc>=1&&ps.length<CAP){ emitAcc-=1; ps.push({x:SX+gauss()*0.02,y:SY,heat:1}); } if(ps.length>=CAP) emitAcc=0; }
    const sd=Math.sqrt(2*K*dtr);
    ps.forEach(p=>{ p.x+=gauss()*sd; p.y+=gauss()*sd+0.05*p.heat*dtr; p.heat*=Math.exp(-dtr/20);
      if(p.x<0.02) p.x=0.04-p.x; if(p.x>RW-0.02) p.x=2*(RW-0.02)-p.x; if(p.y<0.02) p.y=0.04-p.y; if(p.y>RH-0.02) p.y=2*(RH-0.02)-p.y; });
    const thr=0.25*CAP/(RW*RH)*Math.PI*0.45*0.45;
    PEOPLE.forEach(pp=>{ let n=0; ps.forEach(p=>{ const dx=p.x-pp.x, dy=p.y-NOSE; if(dx*dx+dy*dy<0.2025) n++; }); pp.n=n; if(n>=thr&&pp.t===null) pp.t=clock; pp.glow=approach(pp.glow,pp.t!==null?1:0,3,dt); });
    brownianStep(B,dt,air===2?1.3:1);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pc=Math.min(w/5.5,h/4.3), X=x=>(w-RW*pc)/2+x*pc, Y=y=>h*0.93-y*pc;
    // room
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.strokeRect(X(0),Y(RH),RW*pc,RH*pc); ctx.restore();
    ground(ctx,X(-0.1),X(RW+0.1),Y(0));
    // fan
    if(air===2){ const fx=X(RW-0.35), fy=Y(2.5); circ(ctx,fx,fy,0.28*pc,COL.ink,'#fff',2); for(let k=0;k<3;k++){ const a=t*18+k*2.094; line(ctx,fx,fy,fx+Math.cos(a)*0.25*pc,fy+Math.sin(a)*0.25*pc,COL.ink,3); } line(ctx,fx+0.28*pc,fy,X(RW),fy,COL.ink,2); }
    if(air===1){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.globalAlpha=0.6; for(let k=0;k<2;k++){ const yy=Y(2.2-k*0.9); ctx.beginPath(); for(let q=0;q<=40;q++){ const xx=X(((t*0.15+k*0.4)%1)*RW*0.6+q*0.03); ctx[q?'lineTo':'moveTo'](xx,yy+Math.sin(q*0.5+t*2)*3); } ctx.stroke(); } ctx.restore(); }
    // fragrance parcels
    ctx.save(); ctx.fillStyle='#7d6a8f'; ctx.globalAlpha=0.6; ps.forEach(p=>ctx.fillRect(X(p.x)-1.3,Y(p.y)-1.3,2.6,2.6)); ctx.restore();
    // incense on a small table
    rect(ctx,X(0.12),Y(0.72),0.5*pc,0.06*pc,COL.ink,'#fff',2); line(ctx,X(0.18),Y(0.66),X(0.18),Y(0),COL.ink,2); line(ctx,X(0.56),Y(0.66),X(0.56),Y(0),COL.ink,2);
    rect(ctx,X(SX-0.06),Y(0.78),0.12*pc,0.06*pc,COL.ink,'#fff',1.6);
    const stickTop=lit?SY-0.05*Math.min(1,clock/1800):SY; line(ctx,X(SX),Y(0.78),X(SX+0.04),Y(stickTop),COL.ink,2.2);
    if(lit&&ps.length<CAP){ dot(ctx,X(SX+0.04),Y(stickTop),2.6,COL.red,COL.red); ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.beginPath(); for(let q=0;q<=30;q++){ const yy=Y(stickTop)-q*3, xx=X(SX+0.04)+Math.sin(q*0.35-t*3)*q*0.35; ctx[q?'lineTo':'moveTo'](xx,yy); } ctx.stroke(); ctx.restore(); }
    // people
    PEOPLE.forEach((pp,i)=>{ const x=X(pp.x-0.12), col=mixCol('#132a44','#1f9d55',pp.glow), u=pc;
      circ(ctx,x,Y(1.62),0.11*u,col,'#fff',2.2); line(ctx,x-0.11*u,Y(1.6),x-0.16*u,Y(1.58),col,2);
      line(ctx,x,Y(1.51),x,Y(0.85),col,2.4); line(ctx,x,Y(0.85),x-0.12*u,Y(0),col,2.4); line(ctx,x,Y(0.85),x+0.12*u,Y(0),col,2.4); line(ctx,x,Y(1.4),x-0.15*u,Y(1.0),col,2.2); line(ctx,x,Y(1.4),x+0.15*u,Y(1.0),col,2.2);
      if(pp.glow>0.05){ ctx.save(); ctx.globalAlpha=pp.glow; ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; for(let k=0;k<2;k++){ ctx.beginPath(); for(let q=0;q<=8;q++) ctx[q?'lineTo':'moveTo'](x-0.2*u-q*3,Y(1.6+k*0.08)+Math.sin(q+t*5)*2); ctx.stroke(); } ctx.restore();
        textAt(ctx,'smells it · '+fmt(pp.t/60,1)+' min',x,Y(1.9),{align:'center',size:11,weight:700,color:COL.green,alpha:pp.glow}); }
      textAt(ctx,[1.5,3,4.5][i]+' m',x,Y(0)+16,{align:'center',size:11,color:COL.muted}); });
    // lens
    const R=Math.min(w*0.17,h*0.2), cx=w-R-14, cy=R+14, tg=ps[Math.floor(ps.length*0.5)];
    zoomFrame(ctx,cx,cy,R,tg?X(tg.x):null,tg?Y(tg.y):0,'air particles hit a fragrance particle',()=>brownianDraw(ctx,B,cx,cy,R));

    PEOPLE.forEach((pp,i)=>{ $('#p'+i).textContent=pp.t===null?'—':fmt(pp.t/60,1)+' min'; $('#p'+i).style.color=pp.t===null?'':'var(--f-green)'; });
    $('#rt').textContent=lit?fmt(clock/60,1)+' min':'—';
    $('#lit').disabled=lit;
    const fb=$('#fb'), n=PEOPLE.filter(p=>p.t!==null).length;
    if(!lit){ fb.className='fb warn'; fb.textContent='Light the incense stick in the corner.'; }
    else if(!n){ fb.className='fb warn'; fb.textContent='Fragrance near the stick only… so far.'; }
    else if(n<3){ fb.className='fb ok'; fb.textContent='Moving air particles carry the fragrance further and further.'; }
    else { fb.className='fb ok'; fb.textContent='Everyone smells it — the particles have spread through the room.'; }
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
