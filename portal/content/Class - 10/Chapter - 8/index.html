*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

}

  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;

.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}

.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}

.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}

.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}

.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}

.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}

  .topbar .legend{display:none;}

}

<script>
/* =========================================================================
   GRADE 10 — CHAPTER 8: HEREDITY
   (NCERT Science, jesc108) — Activities 8.1 – 8.2.
   Every scene runs a continuous animation loop: controls only set targets.
   Inheritance is sampled gene copy by gene copy (Mendel’s rules); pea plants
   grow node by node with real internode lengths; seeds fly on real parabolas.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

function chipsWire(root,sel,cb){ const bs=[...root.querySelectorAll(sel)]; bs.forEach(b=>b.onclick=()=>{ bs.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); }); return bs; }

/* ---------------------------------------------------------------------
   0g. CHAPTER-8 HEREDITY KIT — a line-drawn head in profile whose
       earlobe morphs free ↔ attached, a pea plant that grows node by

   --------------------------------------------------------------------- */
const SW=800, SH=560;
function stg(ctx,w,h){ const s=Math.min(w/SW,h/SH), ox=(w-SW*s)/2, oy=(h-SH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }

function ell(ctx,x,y,rx,ry,a){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(1e-4,rx),Math.max(1e-4,ry),a||0,0,Math.PI*2); }
function fbSet(el,c,h){ const cls='fb '+c; if(el.className!==cls) el.className=cls; if(el.innerHTML!==h) el.innerHTML=h; }
function speedSlider(id,label,min,max,val,unit,step){ return `<div class="control-group"><label>${label} <span class="val" id="${id}v">${val} ${unit}</span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step||1}" value="${val}"></div>`; }
function blip(f,dur,g,type){ const a=sfxCtx(); if(!a) return; try{ const o=a.createOscillator(), G=a.createGain(); o.type=type||'sine'; o.frequency.value=f;

/* allele colours: dominant = green, recessive = red */
const DOM=COL.green, REC=COL.red, POL=COL.blue;
function aCol(ch){ return ch===ch.toUpperCase()?DOM:REC; }

/* ===== EAR — local units: ear height ≈ 1, origin at the ear's centre, face to the right.
   a = 0 free lobe (hangs below where it joins the cheek), 1 attached (runs straight into the cheek) */
function earPts(a){
  const F=[[0.10,-0.40],[0.05,-0.58],[-0.28,-0.58],[-0.36,-0.25],[-0.42,0.0],[-0.32,0.18],[-0.26,0.27],[-0.24,0.44],[-0.15,0.60],[-0.03,0.60],[0.08,0.60],[0.13,0.50],[0.10,0.41],[0.13,0.33]];
  const A=[[0.10,-0.40],[0.05,-0.58],[-0.28,-0.58],[-0.36,-0.25],[-0.42,0.0],[-0.32,0.18],[-0.25,0.26],[-0.19,0.34],[-0.08,0.40],[0.02,0.42],[0.07,0.43],[0.10,0.44],[0.13,0.45],[0.17,0.53]];
  return F.map((p,i)=>[lerp(p[0],A[i][0],a),lerp(p[1],A[i][1],a)]);

function earPath(ctx,P){ ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]); for(let i=1;i+2<P.length-1;i+=3) ctx.bezierCurveTo(P[i][0],P[i][1],P[i+1][0],P[i+1][1],P[i+2][0],P[i+2][1]); ctx.lineTo(P[13][0],P[13][1]); }

function earDraw(ctx,x,y,E,a,o){ o=o||{}; const P=earPts(a); ctx.save(); ctx.translate(x,y); ctx.scale(E,E); ctx.lineJoin='round'; ctx.lineCap='round'; const k=1/E;

  ctx.beginPath(); ctx.moveTo(0.02,-0.40); ctx.bezierCurveTo(-0.22,-0.48,-0.30,-0.22,-0.26,0.06); ctx.bezierCurveTo(-0.24,0.16,-0.20,0.22,-0.16,0.26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.04,-0.30); ctx.bezierCurveTo(-0.18,-0.22,-0.20,0.02,-0.10,0.14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.06,-0.02); ctx.bezierCurveTo(-0.02,-0.10,-0.12,0.02,-0.04,0.14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.10,0.02); ctx.quadraticCurveTo(0.15,0.08,0.09,0.16); ctx.stroke(); // tragus

    ctx.bezierCurveTo(P[7][0],P[7][1],P[8][0],P[8][1],P[9][0],P[9][1]); ctx.bezierCurveTo(P[10][0],P[10][1],P[11][0],P[11][1],P[12][0],P[12][1]); ctx.stroke(); }

  ctx.restore(); return P.map(p=>[x+p[0]*E,y+p[1]*E]); }

/* ===== HEAD in profile, facing right. (x,y) = centre of the head, H = crown-to-chin px.
   o = {ear 0..1, hair 0..3, sex 'f'|'m', alpha, lobeCol, mark} ; returns the ear centre */
function headDraw(ctx,x,y,H,o){ o=o||{}; ctx.save(); ctx.globalAlpha=o.alpha===undefined?1:o.alpha; ctx.translate(x,y); ctx.scale(H,H); const k=1/H; ctx.lineJoin='round'; ctx.lineCap='round';

  ctx.beginPath(); ctx.arc(0.28,-0.05,0.016,0,Math.PI*2); ctx.fillStyle=COL.ink; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.19,-0.13); ctx.quadraticCurveTo(0.27,-0.17,0.34,-0.12); ctx.lineWidth=lw*(o.sex==='m'?1.3:0.9); ctx.stroke();
  ctx.lineWidth=lw*0.7; ctx.beginPath(); ctx.moveTo(0.40,0.12); ctx.quadraticCurveTo(0.38,0.10,0.36,0.12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.38,0.245); ctx.lineTo(0.33,0.25); ctx.stroke();

  const cap=()=>{ ctx.beginPath(); ctx.moveTo(0.31,-0.30); ctx.bezierCurveTo(0.30,-0.56,0.02,-0.66,-0.22,-0.56); ctx.bezierCurveTo(-0.50,-0.44,-0.55,-0.10,-0.44,0.14); ctx.lineTo(-0.34,0.12);
    ctx.bezierCurveTo(-0.32,-0.08,-0.20,-0.20,-0.04,-0.19); ctx.lineTo(0.02,-0.07); ctx.lineTo(0.06,-0.09); ctx.lineTo(0.06,-0.24); ctx.quadraticCurveTo(0.20,-0.30,0.31,-0.30); ctx.closePath(); };
  if(o.hair===3){ ctx.fillStyle='#e9eef5'; ctx.strokeStyle=COL.ink; ctx.lineWidth=lw; for(let i=0;i<10;i++){ const a=-3.7+i*0.29; ctx.beginPath(); ctx.arc(-0.07+Math.cos(a)*0.45,-0.10+Math.sin(a)*0.45,0.075,0,Math.PI*2); ctx.fill(); ctx.stroke(); } }

  if(o.sex==='m'&&o.beard){ ctx.beginPath(); ctx.moveTo(-0.01,0.10); ctx.bezierCurveTo(0.02,0.38,0.14,0.47,0.27,0.46); ctx.lineTo(0.36,0.40); ctx.lineTo(0.38,0.30); ctx.strokeStyle=COL.muted; ctx.setLineDash([0.02,0.02]); ctx.lineWidth=lw*0.9; ctx.stroke(); ctx.setLineDash([]); }

function SKh(ctx,lw){ ctx.fillStyle='#e9eef5'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=lw; ctx.stroke(); }

/* ===== GENES as a chromosome pair: two short rods with allele letters (h = rod length) */
function genePair(ctx,x,y,g,h,o){ o=o||{}; ctx.save(); ctx.globalAlpha=o.alpha===undefined?1:o.alpha; const w=h*0.36;
  for(let i=0;i<2;i++){ const xx=x+(i?w*0.65:-w*0.65), ch=g?g[i]:'?', c=g?aCol(ch):COL.mid;
    rrect(ctx,xx-w/2,y-h/2,w,h,w/2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); line(ctx,xx-w/2+1,y,xx+w/2-1,y,c,1.2);
    textAt(ctx,ch,xx,y-h*0.08,{align:'center',size:h*0.42,weight:800,color:c,baseline:'middle'}); }
  ctx.restore(); }

/* ===== PEA PLANT. Growth is node by node (real pea data): the seed sprouts after 6 days, a new node
   appears every 2.6 days (plastochron), each internode stretches over ≈ 5 days to its final length —
   tall (Le, active GA-making enzyme) 8.6 cm, dwarf (le) 2.0 cm — so 22 nodes give 1.9 m vs 0.44 m.
   Flowers open at nodes ≥ 13 after day 45; a pod swells over the 10 days after its flower. */
const PEA={germ:6, plast:2.6, nodes:22, Ltall:8.6, Ldwarf:2.0, flowerNode:13, flowerDay:45};
function peaNodes(age){ return clamp((age-PEA.germ)/PEA.plast,0,PEA.nodes); }
function peaHeight(age,tall){ const n=peaNodes(age), Lm=tall?PEA.Ltall:PEA.Ldwarf; let h=1.5*smooth01(PEA.germ-1,PEA.germ+2,age);
  for(let i=0;i<Math.ceil(n);i++){ const born=PEA.germ+i*PEA.plast; h+=Lm/(1+Math.exp(-(age-born-2.6)/0.9)); } return h; }
/* draws a pea plant: base (x,y), px per cm s, age days, tall bool, o = {t, sway, phase, flower:'v'|'w', leaf px, detail 0|1, pods 0..1 extra, alpha} */
function peaDraw(ctx,x,y,s,age,tall,o){ o=o||{}; if(age<PEA.germ-2) return {top:[x,y],flowers:[]}; const t=o.t||0, Lm=tall?PEA.Ltall:PEA.Ldwarf, n=peaNodes(age), lf=(o.leaf||11)*(tall?1:0.78), det=o.detail===undefined?1:o.detail;
  ctx.save(); if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.lineCap='round'; ctx.lineJoin='round';
  // sprout
  const sp=smooth01(PEA.germ-2,PEA.germ+2,age); let px=x, py=y, ang=-Math.PI/2; const pts=[[px,py]], nodesAt=[];
  const sw=(o.sway===undefined?1:o.sway)*(0.022*Math.sin(t*1.25+(o.phase||0))+0.01*Math.sin(t*2.9+(o.phase||0)*1.7));
  const L0=1.5*sp; px+=Math.cos(ang)*L0*s; py+=Math.sin(ang)*L0*s; pts.push([px,py]);
  const N=Math.ceil(n);
  for(let i=0;i<N;i++){ const born=PEA.germ+i*PEA.plast, L=Lm/(1+Math.exp(-(age-born-2.6)/0.9)); ang+=sw*(0.08+i*0.01)+(i%2?0.04:-0.04); px+=Math.cos(ang)*L*s; py+=Math.sin(ang)*L*s; pts.push([px,py]); nodesAt.push({x:px,y:py,i,ang,grow:clamp((age-born)/5,0,1)}); }
  ctx.strokeStyle=COL.green; ctx.lineWidth=Math.max(1.4,Math.min(3.2,s*1.3)); ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  const flowers=[];
  nodesAt.forEach((nd,j)=>{ const side=nd.i%2?1:-1, g=nd.grow, len=lf*g; if(len<0.6) return;
    const la=nd.ang+side*1.0; const ex=nd.x+Math.cos(la)*len*1.4, ey=nd.y+Math.sin(la)*len*1.4;
    // stipule
    if(det){ ctx.save(); ell(ctx,nd.x+side*len*0.18,nd.y+len*0.05,len*0.22,len*0.14,side*0.5); ctx.fillStyle='#eef8f1'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.1; ctx.stroke(); ctx.restore(); }
    line(ctx,nd.x,nd.y,ex,ey,COL.green,Math.max(1,len*0.11));
    // two pairs of leaflets along the petiole
    for(let q=0;q<(det?2:1);q++){ const u=0.45+q*0.45, lx=lerp(nd.x,ex,u), ly=lerp(nd.y,ey,u);
      for(const sd of [-1,1]){ const a2=la+sd*0.95, cx=lx+Math.cos(a2)*len*0.42, cy=ly+Math.sin(a2)*len*0.42; ctx.save(); ell(ctx,cx,cy,len*0.42,len*0.25,a2); ctx.fillStyle='#e9f6ee'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=Math.max(0.8,len*0.08); ctx.stroke(); ctx.restore(); } }
    // tendril curl
    if(det&&len>4){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ex,ey); for(let k=1;k<=14;k++){ const r=len*0.32*(1-k/18), th=la+k*0.55*side; ctx.lineTo(ex+Math.cos(la)*len*0.25+Math.cos(th)*r,ey+Math.sin(la)*len*0.25+Math.sin(th)*r); } ctx.stroke(); ctx.restore(); }
    // flower / pod in the axil
    if(nd.i>=PEA.flowerNode&&age>PEA.flowerDay+(nd.i-PEA.flowerNode)*1.5){ const fa=age-PEA.flowerDay-(nd.i-PEA.flowerNode)*1.5, fx=nd.x-side*lf*0.45, fy=nd.y-lf*0.2;
      flowers.push({x:fx,y:fy,age:fa,side,pod:Math.min(1,clamp((fa-4)/10,0,1)+(o.pods||0))}); }
  });
  // flowers and pods last, so leaves never hide them
  flowers.forEach((f,j)=>{ const top=flowers.length-1-j<2; // the newest flowers keep opening at the top
    if(f.age<6||f.pod<0.15||top) peaFlower(ctx,f.x,f.y,lf*0.8*(o.fl||1)*clamp(f.age/1.5,0.3,1),o.flower,f.side,top?1:1-clamp((f.age-4)/2,0,1));
    if(f.pod>0.05&&!top) podDraw(ctx,f.x,f.y+lf*0.1,lf*1.7*f.pod,Math.PI/2-f.side*0.35,f.pod); });
  // growing tip
  if(N<PEA.nodes){ const p=pts[pts.length-1]; ctx.save(); ell(ctx,p[0],p[1]-2,2.6,4,ang+Math.PI/2); ctx.fillStyle='#e9f6ee'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); }

function throwNew(x0,y0,x1,y1,T,g,delay){ g=g||1400; return {x0,y0,vx:(x1-x0)/T,vy:(y1-y0-0.5*g*T*T)/T,g,T,t:-(delay||0),x:x0,y:y0,done:false}; }
function throwStep(o,dt){ o.t+=dt; const t=clamp(o.t,0,o.T); o.x=o.x0+o.vx*t; o.y=o.y0+o.vy*t+0.5*o.g*t*t; if(o.t>=o.T) o.done=true; return o; }
function seedDraw(ctx,x,y,r,wr){ ctx.save(); ell(ctx,x,y,r,r*0.92,0.3); ctx.fillStyle='#f4f0d8'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.stroke(); if(wr){ line(ctx,x-r*0.5,y-r*0.2,x+r*0.4,y+r*0.3,COL.green,1); } dot(ctx,x+r*0.45,y-r*0.1,r*0.18,COL.ink); ctx.restore(); }
function soil(ctx,x0,x1,y,h){ ctx.save(); line(ctx,x0,y,x1,y,'#8a6a3a',2.6); ctx.fillStyle='#f6efe2'; ctx.fillRect(x0,y+1,x1-x0,h); const R=rng(7); ctx.fillStyle='#c9ad83'; for(let i=0;i<(x1-x0)*h/260;i++) dot(ctx,x0+R()*(x1-x0),y+4+R()*(h-6),1.1,'#c9ad83'); ctx.restore(); }

function peaMini(ctx,x,y,s,age,tall,o,fl){ if(age<PEA.germ-1) return; const t=o.t||0, Lm=tall?PEA.Ltall:PEA.Ldwarf, n=peaNodes(age), lf=o.leaf||4, N=Math.ceil(n);
  const sw=0.022*Math.sin(t*1.25+(o.phase||0)); let px=x, py=y-1.5*s*smooth01(PEA.germ-2,PEA.germ+2,age), ang=-Math.PI/2; ctx.moveTo(x,y); ctx.lineTo(px,py);
  const tops=[];
  for(let i=0;i<N;i++){ const born=PEA.germ+i*PEA.plast, L=Lm/(1+Math.exp(-(age-born-2.6)/0.9)); ang+=sw*(0.08+i*0.01)+(i%2?0.04:-0.04); const nx=px+Math.cos(ang)*L*s, ny=py+Math.sin(ang)*L*s;

/* =====================================================================
   8.1 FREE OR ATTACHED EARLOBES — survey the class, look at each
   student's parents, and test a rule for how the trait is inherited.
   Model: one gene, two versions — E (free lobe) and e (attached lobe).
   Each parent's two copies are drawn from the town's gene pool (share of
   e = q, Hardy–Weinberg); the child takes one copy at random from each
   parent. A single E is enough for a free lobe, so attached = ee only
   (q = 55 % → 0.55² ≈ 30 % of the class has attached lobes).
   ===================================================================== */
function buildA1(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const RULES=[
    {k:'dom', n:'Free is dominant', test:f=>!(f.mom.a&&f.dad.a&&!f.a), why:'both parents attached, child free'},
    {k:'rec', n:'Attached is dominant', test:f=>!(!f.mom.a&&!f.dad.a&&f.a), why:'both parents free, child attached'},
    {k:'mom', n:'Child copies mother', test:f=>f.a===f.mom.a, why:'child differs from mother'},
    {k:'dad', n:'Child copies father', test:f=>f.a===f.dad.a, why:'child differs from father'}];
  let N=40, q=0.55, per=1.2, playing=false, cls=[], idx=-1, done=0, tmr=0, rule=-1, t=0, focus=-1, seed=11;

  side.innerHTML=`
    <div class="control-group"><label>Students in class <span class="val" id="nv">40</span></label><input type="range" id="n" min="20" max="60" step="2" value="40">
      <label style="margin-top:6px">Attached-lobe gene in town <span class="val" id="qv">55 %</span></label><input type="range" id="q" min="10" max="90" step="5" value="55"></div>
    ${speedSlider('sp','Time per student',0.3,3,1.2,'s',0.1)}
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="pp">▶ Survey</button><button class="toggle-btn" id="nw">↺ New class</button></div></div>
    <div class="result-cards three">${card('cF','Free',COL.green)}${card('cA','Attached',COL.red)}${card('cN','Surveyed')}</div>
    <div class="control-group"><label>Parents → child</label><div id="lg"></div></div>
    <div class="control-group"><label>Suggest a rule</label><div class="chip-wrap">${RULES.map((r,i)=>`<button class="chip-btn" data-i="${i}">${r.n}</button>`).join('')}</div>
      <div class="toggle-group"><button class="toggle-btn" id="ce" disabled>Show a family that breaks it</button></div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  function person(R,sex){ const g=(R()<q?'e':'E')+(R()<q?'e':'E'); return {g:g.includes('E')?(g[0]==='E'?g:g[1]+g[0]):g, a:g==='ee'?1:0, hair:Math.floor(R()*4), sex, beard:R()<0.4}; }
  function newClass(){ const R=rng(seed++); cls=[]; for(let i=0;i<N;i++){ const mom=person(R,'f'), dad=person(R,'m'); mom.hair=[1,2,1,3][mom.hair]; dad.hair=[0,0,3,0][dad.hair];
      const g=mom.g[R()<0.5?0:1]+dad.g[R()<0.5?0:1], c={mom,dad,g,a:g==='ee'?1:0,sex:R()<0.5?'f':'m',hair:0,seen:false,flash:0}; c.hair=c.sex==='f'?[1,2,3,1][Math.floor(R()*4)]:[0,0,3][Math.floor(R()*3)]; cls.push(c); }
    idx=-1; done=0; tmr=0; focus=-1; playing=false; setBtn($('#pp'),'▶ Survey','play'); updAll(); }

      [[MOM,c.mom,'Mother'],[DAD,c.dad,'Father']].forEach(([P,p,lb])=>{ headDraw(ctx,P[0],P[1]+dy,PH,{ear:p.a,hair:p.hair,sex:p.sex,beard:p.beard,alpha:al,lobeCol:p.a?REC:DOM});

/* =====================================================================
   8.2 CONFIRMING 1 : 2 : 1 — Fig. 8.3 grown for real, then tested.
   P: pure tall TT × pure short tt (anthers removed, pollen brushed on).
   F1: every seed is Tt → all tall; peas then self-pollinate inside the
   closed flower. F2: each seed takes one copy from each Tt parent at
   random → TT ¼, Tt ½, tt ¼ (tall : short ≈ 3 : 1).
   Activity 8.2: tall TT and Tt look the same, so grow n seeds from EVERY
   tall F2 plant (self-pollinated, as Mendel did — or crossed with a
   short tt plant). A TT parent gives only tall plants; a Tt parent gives
   some short ones. A Tt parent can still fool you: all n of its seeds
   come out tall with probability (3/4)ⁿ (self) or (1/2)ⁿ (test cross).
   Plant height grows node by node (see PEA): tall internodes 8.6 cm,
   dwarf 2.0 cm — the T gene makes the enzyme for the growth hormone.
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let trait='h', stage=0, unlocked=1, spd=0.1, genes=false, t=0;
  const U=()=>trait==='h'?'T':'W', Lw=()=>trait==='h'?'t':'w';
  const dom=g=>g.includes(U()), tallOf=g=>trait==='f'||dom(g), flOf=g=>trait==='f'?(dom(g)?'v':'w'):'w';
  const word=g=>trait==='h'?(dom(g)?'tall':'short'):(dom(g)?'violet':'white');
  const pick=g=>g[Math.random()<0.5?0:1], cross=(a,b)=>{ const s=pick(a)+pick(b); return s[0]===U()||s[1]!==U()?s:s[1]+s[0]; };
  let P,F1,F2,F3,tot;
  function resetAll(){ P={phase:'ready',tau:0,day:0}; F1={plants:[],throws:[],day:0,play:false}; F2={n:24,plants:[],throws:[],day:0,play:false};
    F3={method:'self',n:8,trays:[],throws:[],day:0,play:false,stampT:0,counted:false,run:0}; tot={TT:0,Tt:0,tt:0,missed:0,runs:0}; stage=0; unlocked=1; }
  resetAll();
  side.innerHTML=`
    <div class="control-group"><div class="step-row" id="pills"></div></div>
    <div class="control-group"><label>Trait</label><div class="toggle-group"><button class="toggle-btn active" id="th">Height · T / t</button><button class="toggle-btn" id="tf">Flower · W / w</button></div></div>
    <div id="sc"></div>
    ${speedSlider('sp','1 day in',0.04,0.3,0.1,'s',0.02)}

    let tw=null; if(P.phase==='cross'&&tau<2.4){ const i=clamp(Math.floor((tau-0.45)/0.3),0,4), u=((tau-0.45)/0.3)%1, A=Gm.anth[i];
      const enter=clamp(tau/0.45,0,1), leave=clamp((tau-2.0)/0.4,0,1), off=(1-enter+leave)*LR*1.2; const r=an[i]>0&&an[i]<1?ease(an[i]):0;
      tw=[lerp(A[0],LX+1.2*FR,r)+off,lerp(A[1],LY-1.1*FR,r)-off*0.6,tau>0.45&&tau<2?(u<0.25?1-u*4:0):1]; }
    const pol=P.phase==='ready'?0:P.phase==='cross'?Math.round(14*clamp((tau-3.9)/0.6,0,1)):14, tubes=P.phase==='cross'?clamp((tau-4.6)/1.1,0,1):(P.phase==='ready'?0:1);
    let br=null; if(P.phase==='cross'&&tau>3.6&&tau<5.0){ const S=Gm.S, u=clamp((tau-3.6)/0.4,0,1)-clamp((tau-4.6)/0.4,0,1); const dab=Math.sin(clamp((tau-4.0)/0.6,0,1)*Math.PI*3)*4; br=[S[0]+(1-u)*LR+dab,S[1]-(1-u)*LR+dab,Math.round(14*(1-clamp((tau-3.9)/0.6,0,1)))]; }
    flowerZoom(ctx,LX,LY,FR,flOf(mg),an,pol,tubes,clamp(P.day/12,0,1),tw,br);
    ctx.restore(); circ(ctx,LX,LY,LR,COL.ink,null,3);
    tag(ctx,P.day>4?'pod with F1 seeds':P.phase==='cross'&&P.tau<2.2?'removing anthers':pol?'pollen on stigma':'mother’s flower',LX,LY+LR+22,P.day>4?COL.green:COL.ink,{size:12});
    // brush in the field: rest → father's flower (load) → arc → mother's flower
    let bx=310,by=120,load=0; if(P.phase==='cross'){ const tau2=P.tau, rest=[330,110];
      if(tau2<2.0){ bx=rest[0]; by=rest[1]; }
      else if(tau2<2.7){ const u=ease((tau2-2.0)/0.7); [bx,by]=bez(rest,[(rest[0]+fa.x)/2,rest[1]-40],[fa.x,fa.y],u); }
      else if(tau2<3.0){ bx=fa.x+Math.sin((tau2-2.7)*40)*3; by=fa.y; load=Math.round(14*(tau2-2.7)/0.3); }
      else if(tau2<3.8){ const u=ease((tau2-3.0)/0.8); [bx,by]=bez([fa.x,fa.y],[(fa.x+fbF.x)/2,Math.min(fa.y,fbF.y)-120],[fbF.x,fbF.y],u); load=14; }
      else if(tau2<4.6){ bx=fbF.x; by=fbF.y; load=Math.round(14*(1-clamp((tau2-3.9)/0.6,0,1))); }
      else { const u=ease(clamp((tau2-4.6)/0.8,0,1)); [bx,by]=bez([fbF.x,fbF.y],[(fbF.x+rest[0])/2,fbF.y-100],rest,u); } }
    if(P.phase!=='pod'&&P.phase!=='done') brushStage(ctx,bx,by,load);
    textAt(ctx,'×',315,G-160,{align:'center',size:30,weight:700,color:COL.mid});
    if(P.phase==='pod'||P.phase==='done') ttag(ctx,'day '+Math.floor(P.day)+' after pollination');
  }
  /* ---------------- F1 ---------------- */
  function drawF1(ctx){ soil(ctx,30,770,G1,50); textAt(ctx,'F1 seeds',52,75,{size:12,weight:700,color:COL.muted}); seedDraw(ctx,36,70,9);
    F1.plants.forEach((p,i)=>{ const th=F1.throws[i]; if(th&&!th.done){ if(th.t>0) seedDraw(ctx,th.x,th.y,6); return; }
      const r=plant(ctx,p,p.x,G1,1.55,F1.day,{leaf:13});
      if(F1.day>PEA.flowerDay+1) r.flowers.forEach((f,j)=>{ if(f.age<4) for(let k=0;k<3;k++) dot(ctx,f.x+Math.sin(t*7+k*2+j)*4,f.y-3+Math.cos(t*5+k)*3,1.8,POL); });
      if(F1.day<PEA.germ) seedDraw(ctx,p.x,G1+6,6);
      genesAt(ctx,p,p.x,G1+28,24,true); });
    if(F1.day>=70) F1.plants.forEach(p=>tag(ctx,word(p.g),p.x,G1-peaHeight(70-p.lag,tallOf(p.g))*1.55*p.k-26,DOM,{size:11.5}));
    dayLine(ctx,180,535,440,F1.day,72,'');
    ttag(ctx,'day '+Math.floor(F1.day)); }
  /* ---------------- F2 ---------------- */
  function drawF2(ctx){ soil(ctx,30,770,G2,50); textAt(ctx,'F2 seeds (from F1 pods)',52,75,{size:12,weight:700,color:COL.muted}); seedDraw(ctx,36,70,9);
    const n=F2.plants.length, lf=clamp(700/n*0.42,6,13), vis=F2.day>(trait==='h'?30:48);
    F2.plants.forEach((p,i)=>{ const th=F2.throws[i]; if(th&&!th.done){ if(th.t>0) seedDraw(ctx,th.x,th.y,5); return; }
      plant(ctx,p,p.x,G2,1.42,F2.day,{leaf:lf,detail:n>20?0:1,fl:trait==='f'?1.7:1}); if(F2.day<PEA.germ) seedDraw(ctx,p.x,G2+6,5);
      const known=vis&&!dom(p.g); genesAt(ctx,p,p.x,G2+26,Math.min(24,700/n*0.9),known);
      if(vis) line(ctx,p.x-6,G2+46,p.x+6,G2+46,dom(p.g)?DOM:REC,3); });
    dayLine(ctx,180,535,440,F2.day,72,'');
    ttag(ctx,'day '+Math.floor(F2.day)); }
  /* ---------------- F3 (Activity 8.2) ---------------- */
  function drawF3(ctx){ // the F2 field in a strip, its tall plants numbered
    line(ctx,30,150,770,150,'#8a6a3a',2); textAt(ctx,'F2 field',30,20,{size:12,weight:700,color:COL.muted});
    const n=F2.plants.length; let k=0;
    F2.plants.forEach(p=>{ const x=stripX(p.x); peaDraw(ctx,x,150,0.62*p.k,72-p.lag,tallOf(p.g),{t,phase:p.ph,flower:flOf(p.g),leaf:clamp(720/n*0.3,3,6),detail:0,fl:trait==='f'?2.2:1});
      if(dom(p.g)){ k++; textAt(ctx,String(k),x,167,{align:'center',size:10.5,weight:700,color:COL.ink}); if(genes) textAt(ctx,p.g,x,180,{align:'center',size:9.5,weight:700,color:p.g===U()+U()?DOM:COL.ink}); }
      else textAt(ctx,Lw()+Lw(),x,167,{align:'center',size:10.5,weight:700,color:REC}); });
    const end=F3END(), Hm=peaHeight(end,true);
    F3.trays.forEach(tr=>{ const {x,y,w:tw,h:th}=tr; ctx.save(); rrect(ctx,x+3,y+3,tw-6,th-6,8); ctx.fillStyle='#fbfcfe'; ctx.fill(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
      const gy=y+th-14; line(ctx,x+8,gy,x+tw-8,gy,'#8a6a3a',1.8);
      textAt(ctx,'#'+(tr.k+1),x+10,y+18,{size:11,weight:700,color:COL.ink});
      if(F3.method==='test') textAt(ctx,'× '+Lw()+Lw(),x+40,y+18,{size:9.5,weight:700,color:REC});
      const s=(th-44)/Hm;
      if(F3.day>0){ ctx.save(); rrect(ctx,x+4,y+4,tw-8,th-8,7); ctx.clip(); const fv=[], fw=[]; ctx.beginPath(); tr.kids.forEach((kd,j)=>{ const kx=x+tw*(j+0.5)/tr.kids.length; peaMini(ctx,kx,gy,s*kd.k,F3.day-kd.lag,tallOf(kd.g),{t,phase:kd.ph,leaf:clamp(tw/tr.kids.length*0.32,2.5,6),fl:trait==='f'?2.4:1},flOf(kd.g)==='v'?fv:fw); });
        ctx.strokeStyle=COL.green; ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.stroke(); [[fv,'#d9b8ec','#7b3fa0'],[fw,'#fff',COL.ink]].forEach(([L,f,c])=>{ if(!L.length) return; ctx.beginPath(); L.forEach(p=>{ ctx.moveTo(p[0]+p[2]*0.6,p[1]); ctx.arc(p[0],p[1],p[2]*0.6,0,Math.PI*2); }); ctx.fillStyle=f; ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.stroke(); }); ctx.restore(); }
      if(tr.verdict){ const sc=tr.pop.x, col=tr.verdict==='TT'?DOM:COL.ink, txt=tr.verdict==='TT'?U()+U():U()+Lw(); ctx.save(); ctx.translate(x+tw-26,y+20); ctx.scale(sc,sc); ctx.rotate(-0.12);
        rrect(ctx,-20,-11,40,22,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke(); textAt(ctx,txt,0,5,{align:'center',size:13,weight:800,color:col}); ctx.restore();
        if(genes&&tr.verdict==='TT'&&tr.par.g!==U()+U()){ ctx.save(); rrect(ctx,x+3,y+3,tw-6,th-6,8); ctx.strokeStyle=COL.red; ctx.lineWidth=3; ctx.setLineDash([6,4]); ctx.stroke(); ctx.restore(); textAt(ctx,'really '+U()+Lw()+'!',x+tw/2,y+th/2,{align:'center',size:12,weight:700,color:COL.red}); } } });
    F3.throws.forEach(o=>{ if(!o.done&&o.t>0) seedDraw(ctx,o.x,o.y,4); });
    if(!F3.trays.length) textAt(ctx,'No '+word(U())+' plants in this field',400,330,{align:'center',size:15,color:COL.mid});
    if(F3.day>0) ttag(ctx,'F3 day '+Math.floor(F3.day));
  }
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const _b=n=>(typeof window[n]==='function'?window[n]:()=>{ const d=document.createElement('div'); d.textContent='(not built yet)'; return d; });
const activities = [
  { num:'8.1', title:'Free or Attached Earlobes', desc:'Survey the class, look at each student’s parents, suggest a rule', build: ()=>_b('buildA1')() },
  { num:'8.2', title:'Confirming 1 : 2 : 1', desc:'Grow Fig. 8.3 — then test which tall F2 plants are TT and which are Tt', build: ()=>_b('buildA2')() },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
