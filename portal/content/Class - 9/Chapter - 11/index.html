<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9 · Chapter 11 — Reproduction | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand-badge">🌱</div>

  <div class="body-wrap">

    <main class="content">

        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>

</div>

<script>
/* =========================================================================
   GRADE 9 — CHAPTER 11: REPRODUCTION: HOW LIFE CONTINUES
   (NCERT Exploration, iesc111) — Activities 11.1 – 11.7.
   Every scene runs a continuous animation loop: controls only set targets.
   Plants grow, yeast buds, mould spreads and flowers set fruit by real
   rate models, compressed into a few watchable seconds.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

function debrisAdd(D,o){ D.push(Object.assign({vx:0,vy:0,w:0,rest:false},o)); }
function debrisStep(D,dt,floorFn){ D.forEach(p=>{ if(p.rest) return; const drag=p.drag||1.2; p.vy+=(p.g||900)*dt; p.vx-=p.vx*drag*dt; p.vy-=p.vy*drag*dt*(p.flutter?3:1);

/* =====================================================================
   11.1 CUTTING · GRAFTING · LAYERING
   Time: 1 day = 0.6 s. Every tool moves on springs; cut pieces fall
   under gravity with drag and spin.
   CUTTING  soil moisture M' = −0.35 M /day (reset to 1 when watered)
            cutting water W' = 0.06·M + 0.03·M·roots(cm) − 0.02·leaves
            node j (s cm from the base) roots after 9(1 + d/10)/M days,
            d = (L/2 − s)·sin θ; roots then grow 0.5 cm/day·M.
            buried leaves rot (+0.22 /day each) → rot ≥ 1 kills it.
   GRAFT    union U' = k(1 − U), k 0.12 wrapped / 0.042 bare;
            scion water S' = −0.09(1 − U)·(0.3 wrapped | 1 bare);
            S < 0.3 → scion dies. After U > 0.8 scion grows
            0.6 cm/day (×0.3 if Plant A keeps its own branches).

            10 – 15 days); cutting it free before roots → it wilts.

function buildA1(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX=8, DAYS=0.6; // 8 px per cm; seconds per day
  let mode='cut', run=false, t=0;
  side.innerHTML=`
    <div class="control-group"><label>Technique</label><div class="toggle-group">
      <button class="toggle-btn active" data-m="cut">Cutting</button><button class="toggle-btn" data-m="graft">Grafting</button><button class="toggle-btn" data-m="layer">Layering</button></div></div>
    <div class="control-group"><label>Do it step by step</label><div class="step-row" id="steps"></div></div>
    <div id="opts"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Let days pass</button><button class="toggle-btn" id="rs">↺ Start again</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Day',COL.ink)}${card('r2','—',COL.red)}${card('r3','Plant',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  function lbl(x){ const e=$('#r2').previousElementSibling; if(e.textContent!==x) e.textContent=x; }
  const fb=$('#fb'); function setFb(c,h){ const cls='fb '+c; if(fb.className!==cls) fb.className=cls; if(fb.innerHTML!==h) fb.innerHTML=h; }
  /* ================= CUTTING ================= */
  const C={};
  function cutInit(){ Object.assign(C,{ph:0, L:C.L||20, th:C.th||50, water:C.water===undefined?true:C.water, day:0, M:1, W:1, rot:0, dead:false, shoot:0,
      pose:{x:{x:0,v:0},y:{x:0,v:0},a:{x:0,v:0}}, free:null, stripped:false, sh:sprP(700,90), shOpen:1, slide:0, deb:[], nodes:[], roots:[], can:0, drop:0 });
    buildNodes(); }
  function buildNodes(){ C.nodes=[]; for(let s=1.5;s<C.L-1.5;s+=4) C.nodes.push({s, leaf:true, side:C.nodes.length%2?1:-1}); C.roots=C.nodes.map((n,i)=>({net:rootNet(31+i*7),len:0})); }
  // parent shrub branch the cutting comes from (world px)
  const PAR=[[150,440],[150,360],[170,280],[215,200],[270,140],[330,100],[395,78]];
  function cutWorldPts(){ // where the cutting lies before it's cut: last L cm of PAR from the tip back
    const Lt=polyLen(PAR), s0=Lt-C.L*PX; const a=polyAt(PAR,s0), b=polyAt(PAR,Lt); return {a,b}; }
  function cutDoStep(i){
    if(i===0&&C.ph===0){ C.ph=0.5; const {a}=cutWorldPts(); C.sh.x.x=700; C.sh.y.x=90; C.target={x:a.x,y:a.y}; C.tc=0; }
    else if(i===1&&C.ph===1){ C.stripped=true; C.nodes.forEach(n=>{ if(n.s<C.L/2&&n.leaf){ n.leaf=false; const p=cutPoint(n.s);
        debrisAdd(C.deb,{kind:'leaf',x:p.x,y:p.y,a:p.a+n.side*0.9,vx:(Math.random()-0.5)*80,vy:-60,w:(Math.random()-0.5)*6,flutter:260,drag:3,len:34}); } }); tink(1600,0.05,0.1); }
    else if(i===2&&C.ph===1){ C.ph=2; C.slide=0; }
    else if(i===3&&C.ph>=2){ C.can=1.2; C.M=1; tink(700,0.05,0.2); }
  }
  function cutPoint(s){ const P=C.pose, ca=Math.cos(P.a.x), sa=Math.sin(P.a.x); return {x:P.x.x+ca*s*PX, y:P.y.x+sa*s*PX, a:P.a.x}; }
  const SOIL=338, ENTRY=560, POTX=575;
  function cutStep(dt){
    const P=C.pose;
    if(C.ph===0||C.ph===0.5){ const {a,b}=cutWorldPts(); P.x.x=a.x; P.y.x=a.y; P.a.x=Math.atan2(b.y-a.y,b.x-a.x); P.x.v=P.y.v=P.a.v=0; }
    if(C.ph===0.5){ sprPStep(C.sh,C.target.x+4,C.target.y-2,dt,70,13); const d=Math.hypot(C.sh.x.x-C.target.x,C.sh.y.x-C.target.y);
      if(d<10){ C.shOpen=Math.max(0,C.shOpen-dt*4); if(C.shOpen===0){ C.ph=0.8; C.free={vx:-20,vy:0,w:-1.2}; tink(2200,0.08,0.12); } } }
    else if(C.ph===0.8){ // the cutting falls to the bench, then lands flat

      const tipY=P.y.x+Math.sin(P.a.x)*C.L*PX, low=Math.max(P.y.x,tipY);
      if(low>=466){ P.y.x-=low-466; C.free.vy*=-0.2; C.free.w=0; if(Math.abs(C.free.vy)<40){ C.ph=1; P.x.v=P.y.v=P.a.v=0; } }
    }
    else if(C.ph===1){ C.pose.a.x=approach(P.a.x,Math.PI,6,dt); const tx=420, ty=466; springTo(P.x,tx,40,10,dt); springTo(P.y,ty,40,10,dt); }
    else if(C.ph>=2){ // carry above the pot at the planting angle, then push in along its own axis
      const th=C.th*Math.PI/180, dx=Math.cos(-th), dy=Math.sin(-th);
      const baseIn={x:ENTRY-dx*(C.L/2)*PX, y:SOIL-dy*(C.L/2)*PX};

      C.M-=0.35*C.M*dd; const th=C.th*Math.PI/180;

  }
  function cutDraw(ctx){
    const P=C.pose; line(ctx,20,470,780,470,COL.ink,2.4);
    // parent shrub
    const Lt=polyLen(PAR), keep=C.ph===0||C.ph===0.5?Lt:Lt-C.L*PX;
    const pp=[]; for(let s=0;s<=keep;s+=6){ const q=polyAt(PAR,s); pp.push([q.x,q.y]); } tube(ctx,pp,8,COL.green);
    for(let s=60;s<keep-4;s+=32){ const q=polyAt(PAR,s); leaf(ctx,q.x,q.y,30,q.a+((s/32|0)%2?-1.1:1.1),COL.green,0); }
    [[150,330,-2.3],[168,262,-0.5]].forEach(([x,y,a])=>{ tube(ctx,[[x,y],[x+Math.cos(a)*50,y+Math.sin(a)*50]],6,COL.green); leaf(ctx,x+Math.cos(a)*50,y+Math.sin(a)*50,26,a,COL.green,0); });

    // pot
    const soilTop=potDraw(ctx,POTX,470,260,150,C.M*0.8+0.1,11);
    // cutting
    const ca=Math.cos(P.a.x), sa=Math.sin(P.a.x), X=s=>P.x.x+ca*s*PX, Y=s=>P.y.x+sa*s*PX;
    const planted=C.ph===3; const dead=C.dead, stemCol=dead?COL.mid:COL.green;
    // roots (under the soil, drawn first)
    if(planted) C.nodes.forEach((n,i)=>{ const r=C.roots[i]; if(r.len>0) rootDraw(ctx,r.net,X(n.s),Y(n.s),Math.PI/2+0.35*(i%2?1:-1),r.len*PX,COL.red,1.5); });
    if(C.ph!==0&&C.ph!==0.5){ tube(ctx,[[X(0),Y(0)],[X(C.L),Y(C.L)]],8,stemCol);
      line(ctx,X(0)-sa*5,Y(0)+ca*5,X(0)+sa*5,Y(0)-ca*5,COL.ink,2); }
    const wilt=dead?1:clamp((0.75-C.W)/0.4,0,1);
    C.nodes.forEach(n=>{ const x=X(n.s), y=Y(n.s); line(ctx,x-sa*5,y+ca*5,x+sa*5,y-ca*5,COL.ink,1.6);
      if(n.leaf&&C.ph!==0&&C.ph!==0.5){ const buried=planted&&n.s<C.L/2; leaf(ctx,x,y,30,P.a.x+n.side*1.0,buried?(C.rot>0.3?COL.mid:COL.green):(dead?COL.mid:COL.green),buried?0.2:wilt,buried&&C.rot>0.3?'#eee7dc':null); } });
    if(C.ph!==0&&C.ph!==0.5){ const tx=X(C.L), ty=Y(C.L);
      leaf(ctx,tx,ty,24,P.a.x-0.6,dead?COL.mid:COL.green,wilt); leaf(ctx,tx,ty,24,P.a.x+0.6,dead?COL.mid:COL.green,wilt);

        for(let k=1;k<=Math.floor(C.shoot/1.5);k++){ const f=k*1.5/C.shoot; leaf(ctx,lerp(tx,sx,f),lerp(ty,sy,f),Math.min(22,6+(C.shoot-k*1.5)*6),up+(k%2?1:-1)*1.0,COL.red,0); } }

  }
  function cutStatus(){ const tot=C.roots.reduce((s,r)=>s+r.len,0); setv($,'r1',C.ph===3?'Day '+Math.floor(C.day):'—'); lbl('Roots');
    setv($,'r2',tot>0.05?fmt(tot,1)+' cm':'none'); setv($,'r3',C.dead?'Dead':C.shoot>0.3?'Growing':C.W<0.6?'Wilting':'Alive');

    else if(C.ph===1) setFb('warn',C.stripped?'Lower leaves off. Now <b>3 Plant</b> it at an angle.':'Strip the lower leaves first (<b>2</b>) — or plant as it is and see.');

    else if(C.dead) setFb('bad',C.why==='rot'?'The buried leaves rotted and the rot spread up the stem.':'The soil dried out before any roots formed — the cutting dried up.');
    else if(C.shoot>0.3) setFb('ok',`New roots from the buried <b>nodes</b>, new leaves at the top — a new plant from one parent.`);

  function cutOpts(){ return `<div class="control-group"><label>Length of the cutting <span class="val" id="lV"></span></label><input type="range" id="lR" min="10" max="30" step="1" value="${C.L}">
      <label style="margin-top:8px">Angle from the soil <span class="val" id="aV"></span></label><input type="range" id="aR" min="30" max="90" step="5" value="${C.th}"></div>
    <div class="control-group"><label>Water it every day</label><div class="toggle-group"><button class="toggle-btn${C.water?' active':''}" data-w="1">Yes</button><button class="toggle-btn${C.water?'':' active'}" data-w="0">No</button></div></div>`; }
  function cutWire(){ $('#lR').oninput=()=>{ if(C.ph===0){ C.L=+$('#lR').value; buildNodes(); } else $('#lR').value=C.L; };
    $('#aR').oninput=()=>{ if(C.ph<3){ C.th=+$('#aR').value; } else $('#aR').value=C.th; }; chipsWire(side,'[data-w]',b=>{ C.water=b.dataset.w==='1'; }); }
  /* ================= GRAFTING ================= */
  const Gf={};
  const ROSE={yellow:{n:'Yellow rose',c:COL.yellow}, pink:{n:'Pink rose',c:mixCol(COL.red,'#ffffff',0.35)}};
  function grInit(){ Object.assign(Gf,{ph:0, v:Gf.v||'yellow', day:0, U:0, S:1, grow:0, dead:false, wrapped:0, pruned:false, slit:{x:0,v:0}, kn:sprP(720,120), knT:null,

  // Plant A: main stem + 3 twigs (T1 left, T2 graft twig right, T3 top)
  const AX=300, AB=470;
  const TW={ T1:[[AX,330],[AX-60,270],[AX-110,230]], T2:[[AX,300],[AX+70,240],[AX+110,190]], T3:[[AX,250],[AX+10,160],[AX-10,110]] };
  function grDoStep(i){ const S=Gf.seq; if(seqBusy(S)) return;
    const top=TW.T2[2];
    if(i===0&&Gf.ph===0){ const dA=Math.atan2(top[1]-TW.T2[1][1],top[0]-TW.T2[1][0]), ux=Math.cos(dA), uy=Math.sin(dA);
      seqAdd(S,0.7,null,null,()=>{ Gf.knT={x:top[0]+ux*30,y:top[1]+uy*30}; });
      seqAdd(S,0.8,u=>{ Gf.knT={x:top[0]+ux*(30-56*u),y:top[1]+uy*(30-56*u)}; Gf.slit.x=u; },()=>{ Gf.ph=1; tink(1800,0.05,0.12); });
      seqAdd(S,0.5,null,()=>{ Gf.knT={x:720,y:120}; }); }
    else if(i===1&&Gf.ph===1){ Gf.ph=1.5; }
    else if(i===2&&Gf.ph===2&&!Gf.wrapped){ Gf.wrapT=0; }
    else if(i===3&&Gf.ph>=2&&!Gf.pruned){ const tips=[TW.T1,TW.T3];

        seqAdd(S,0.25,u=>{ Gf.shOpen=1-u; },()=>{ Gf.cuts.push(k); const c=Gf.shT; tink(2300,0.07,0.1);
          const pts=tw.map(p=>[p[0]-c.x,p[1]-c.y]); debrisAdd(Gf.deb,{kind:'twig',x:c.x,y:c.y,a:0,pts,vx:(k?30:-40),vy:-40,w:k?1.4:-1.6,drag:0.6,flat:k?Math.PI/2:-Math.PI/2}); });

  function grStep(dt){ const S=Gf.seq; seqStep(S,dt);

      if(Gf.scSlide>0||(Math.hypot(Gf.sc.x.x-hover.x,Gf.sc.y.x-hover.y)<3&&Math.abs(Gf.scA.x-dirA)<0.03)){ Gf.scA.x=dirA; Gf.scSlide=Math.min(1,Gf.scSlide+dt*1.1);

    else if(Gf.ph>=2){ Gf.sc.x.x=top[0]+Math.cos(dirA)*4; Gf.sc.y.x=top[1]+Math.sin(dirA)*4; Gf.scA.x=dirA; }

/* =====================================================================
   11.4 BEADS AND GAMETES — MEIOSIS SORTS THE PAIRS
   Each pair lines up at the cell's equator with a random side (a fair
   coin per pair), spindle fibres pull the two members to opposite poles,
   the cell pinches in two. One bead from each pair ends up in a gamete.
   n pairs → 2ⁿ different gametes (3 → 8, 23 → 8 388 608).
   Chromosomes move on spring-dampers toward targets; the membrane is a
   pinching two-lobe curve. One division = 3 s (×6 when fast).
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PC=[COL.green,COL.blue,COL.red], TRAIT=[['blonde hair','black hair'],['straight hair','curly hair'],['brown eyes','black eyes']];
  const CX=230, CY=255, CR=165;
  let n=3, t=0, u=-1, speed=1, queue=0, made=0, found=new Map(), last=null, chroms=[], flying=[], R=rng(9), pinch=0, fresh=1, hist=[];
  side.innerHTML=`
    <div class="control-group"><label>Chromosome pairs <span class="val" id="nV"></span></label><input type="range" id="nR" min="1" max="23" step="1" value="3"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="one">Make a gamete</button><button class="toggle-btn" id="many">×20 fast</button></div>
      <button class="toggle-btn navy" id="rs">↺ Start again</button></div>
    <div class="control-group"><div class="result-cards">${card('r1','Gametes made',COL.ink)}${card('r2','Different ones',COL.red)}${card('r3','Possible',COL.green)}${card('r4','Last gamete',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb'); function setFb(c,h){ const cls='fb '+c; if(fb.className!==cls) fb.className=cls; if(fb.innerHTML!==h) fb.innerHTML=h; }
  const pcol=i=>i<3?PC[i]:COL.mid, light=c=>mixCol(c,'#ffffff',0.55), dark=c=>mixCol(c,'#000000',0.2);
  function setup(){ chroms=[]; const r=rng(4+n); for(let i=0;i<n;i++) for(let k=0;k<2;k++){ const a=r()*6.28, rr=Math.sqrt(r())*CR*0.62;
      chroms.push({pair:i,dark:k,x:{x:CX+Math.cos(a)*rr,v:0},y:{x:CY+Math.sin(a)*rr,v:0},a:{x:r()*3,v:0},home:[CX+Math.cos(a)*rr,CY+Math.sin(a)*rr,r()*3],side:0}); } }
  function reset(){ hist=[[0,0]]; made=0; found=new Map(); last=null; u=-1; queue=0; flying=[]; pinch=0; setup(); }
  reset();
  $('#nR').oninput=()=>{ n=+$('#nR').value; reset(); };
  $('#rs').onclick=reset;
  $('#one').onclick=()=>{ speed=1; if(u<0) start(); else queue++; };
  $('#many').onclick=()=>{ speed=6; queue+=u<0?19:20; if(u<0) start(); };
  function start(){ u=0; for(let i=0;i<n;i++){ const s=R()<0.5?-1:1; chroms.forEach(c=>{ if(c.pair===i) c.side=c.dark?s:-s; }); } }
  function slotPos(key){ const cols=2, rows=Math.ceil((1<<Math.min(n,3))/cols), W=300, H=Math.min(100,420/rows); const i=parseInt(key,2);
    return {x:470+(i%cols)*(W/cols)+10, y:40+Math.floor(i/cols)*H, w:W/cols-20, h:H-10}; }
  function finish(){ // the left daughter is our gamete: read one bead from each pair
    const key=Array.from({length:n},(_,i)=>{ const c=chroms.find(q=>q.pair===i&&q.side<0); return c.dark?'1':'0'; }).join('');
    made++; found.set(key,(found.get(key)||0)+1); last=key; hist.push([made,found.size]);
    if(n<=3){ const sp=slotPos(key); chroms.filter(c=>c.side<0).forEach((c,j)=>flying.push({x:c.x.x,y:c.y.x,tx:sp.x+18+c.pair*22,ty:sp.y+sp.h/2,col:pcol(c.pair),dark:c.dark,k:0})); }
    tink(1200+found.size*60,0.05,0.12); }

    circ(ctx,x,y,s,COL.ink,'#fff',1.8);
    ctx.save(); ctx.strokeStyle=hair; ctx.lineWidth=2; for(let i=-4;i<=4;i++){ const a=-Math.PI/2+i*0.3, x0=x+Math.cos(a)*s, y0=y+Math.sin(a)*s; ctx.beginPath(); ctx.moveTo(x0,y0);
      if(curly){ for(let k=1;k<=6;k++){ const r=s+k*1.6; ctx.lineTo(x+Math.cos(a)*r+Math.sin(k*2.2)*2.5,y+Math.sin(a)*r+Math.cos(k*2.2)*2.5); } } else ctx.lineTo(x+Math.cos(a)*(s+9),y+Math.sin(a)*(s+9)); ctx.stroke(); } ctx.restore();
    dot(ctx,x-s*0.35,y-s*0.05,s*0.13,eye); dot(ctx,x+s*0.35,y-s*0.05,s*0.13,eye);

  function chromDraw(ctx,c,L){ const col=pcol(c.pair), a=c.a.x, dx=Math.cos(a)*L/2, dy=Math.sin(a)*L/2;
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=col; ctx.lineWidth=Math.max(3,L*0.22); ctx.beginPath(); ctx.moveTo(c.x.x-dx,c.y.x-dy); ctx.lineTo(c.x.x+dx,c.y.x+dy); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,L*0.22-3.4); ctx.stroke(); ctx.restore();

  animLoop(dt=>{ t+=dt;
    const L=clamp(360/n,12,64), sp=Math.min(L+26,300/n);

      const k=90*speed*speed, d=14*speed; springTo(c.x,tx,k,d,dt); springTo(c.y,ty,k,d,dt); springTo(c.a,ta,k,d,dt); });
    flying.forEach(f=>{ f.k=Math.min(1,f.k+dt*1.6*speed); }); flying=flying.filter(f=>f.k<1);
    // ---- UI ----
    setv($,'nV',n+(n===1?' pair':' pairs')); setv($,'r1',String(made)); setv($,'r2',String(found.size)); setv($,'r3',(2**n).toLocaleString('en-IN'));
    setv($,'r4',last?(n<=3?last.split('').map((b,i)=>(b==='1'?'dark ':'light ')+['green','blue','red'][i]).join(', '):last.slice(0,12)+(n>12?'…':'')):'—');
    if(made===0) setFb('warn','Make a gamete — each pair lines up and splits at random.');
    else if(n<=3&&found.size===2**n) setFb('ok',`All <b>${2**n}</b> combinations found. With 23 pairs there are 83,88,608.`);
    else if(n>10) setFb('ok',`${found.size} of ${made} gametes are all different — a repeat is 1 chance in ${(2**n).toLocaleString('en-IN')}.`);
    else setFb('warn',`${found.size} of ${2**n} combinations so far — keep going.`);
    // ---- draw ----
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    ctx.save(); ctx.globalAlpha=fresh;
    // membrane: two lobes that pinch together
    const e=smooth01(0.5,0.9,ph<0?0:ph), sep=e*CR*0.55, waist=CR*(1-0.92*pinch);
    ctx.save(); ctx.beginPath(); const N=90; for(let i=0;i<=N;i++){ const a=i/N*Math.PI*2, cx=Math.cos(a), sy=Math.sin(a);
      const x=CX+cx*(CR+sep*Math.abs(cx)), yy=CY+sy*CR*lerp(1,lerp(1,waist/CR,Math.exp(-cx*cx*8)),1); i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }
    ctx.closePath(); ctx.fillStyle='#fbfcfe'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    // spindle fibres from the two poles
    if(ph>=0.25&&ph<0.95){ const a=smooth01(0.25,0.4,ph)*(1-smooth01(0.85,0.95,ph)); const P1=CX-CR-sep*0.8+20, P2=CX+CR+sep*0.8-20;
      ctx.save(); ctx.globalAlpha=a; chroms.forEach(c=>{ const px=c.side<0?P1:P2; line(ctx,px,CY,c.x.x,c.y.x,COL.mid,1); }); ctx.restore();
      [P1,P2].forEach(px=>{ ctx.save(); ctx.globalAlpha=a; for(let i=0;i<6;i++){ const an=i/6*Math.PI*2+t; line(ctx,px,CY,px+Math.cos(an)*9,CY+Math.sin(an)*9,COL.ink,1.4); } ctx.restore(); }); }
    if(ph>=0.08&&ph<0.5){ ctx.save(); ctx.setLineDash([5,5]); line(ctx,CX,CY-CR+20,CX,CY+CR-20,COL.mid,1.2); ctx.restore(); }

    const lab=ph<0?'parent cell · '+(2*n)+' chromosomes':ph<0.25?'pairs line up':ph<0.6?'each pair splits':'two gametes · '+n+' each';
    textAt(ctx,lab,CX,CY+CR+34,{align:'center',size:13,weight:700,color:COL.muted});
    if(ph>0.85){ const g=smooth01(0.85,1,ph); ctx.save(); ctx.globalAlpha=g; tag(ctx,'your gamete',CX-CR*0.62-sep*0.5,CY-CR*0.75,COL.red,{size:12}); ctx.restore(); }
    ctx.restore();
    // collected gametes

/* =====================================================================
   11.6 PEA FLOWERS IN MUSLIN BAGS — IS POLLEN NEEDED FOR FRUIT?
   Pea pollinates itself inside the closed flower: the anthers shed
   pollen onto the stigma about a day before the flower opens. So:
     bud (with stamens)      → pollinated at day 1 inside the bag
     bud, stamens removed    → never pollinated
     open flowers (3, 4, 5)  → already pollinated before opening.
   Pollen tube reaches the ovules in ≈ 1 day → fertilisation.
   Petals wither and drop 3 – 4 days later; the pod grows by a logistic
   curve L = 1 + 7/(1 + e^−(d − d_f − 7)/1.6) cm (≈ 8 cm, 5 – 6 seeds).
   An unfertilised bud yellows from day 5 and drops at day 7 (abscission).
   Falling parts: gravity + air drag, caught by the bag. 1 day = 0.8 s.
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const DS=0.8, S=1.55, FY=205, BAGB=400;
  const TR=[{n:'Bud',bud:true,rm:false,bag:true},{n:'Bud, stamens out',bud:true,rm:true,bag:true},{n:'Flower, stamens out',bud:false,rm:true,bag:true},{n:'Flower',bud:false,rm:false,bag:true},{n:'Flower, no bag',bud:false,rm:false,bag:false}];
  const X=i=>80+i*150;
  let t=0, day=0, run=false, ph=0, F=[], deb=[], fx=sprP(700,40), fxOpen=1, seq=seqNew(), bee={x:760,y:80,vx:0,vy:0,tgt:4,land:0,pol:false}, table=null;
  side.innerHTML=`
    <div class="control-group"><label>Do it step by step</label><div class="step-row" id="steps"></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">▶ Let days pass</button><button class="toggle-btn" id="rs">↺ Start again</button></div></div>
    <div class="control-group"><label>Table 11.2 · fruit formed?</label><div id="tbl"></div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb'); function setFb(c,h){ const cls='fb '+c; if(fb.className!==cls) fb.className=cls; if(fb.innerHTML!==h) fb.innerHTML=h; }
  function reset(){ day=0; run=false; ph=0; deb=[]; seq=seqNew(); table=null; pk='';
    F=TR.map((tr,i)=>({tr, stam:true, bag:{x:-1,v:0}, bagT:-1, tp:tr.bud?Infinity:-1, pollen:tr.bud?0:6, tube:tr.bud?0:1, petals:true, drop:false, fall:null, pod:0, open:{x:tr.bud?0:1,v:0}})); }
  let pk=''; reset();
  $('#rs').onclick=reset;
  $('#go').onclick=()=>{ if(ph>=2) run=!run; };
  function doStep(i){ if(seqBusy(seq)) return;
    if(i===0&&ph===0){ [1,2].forEach(k=>{ const f=F[k], x=X(k)+18*S, y=FY+8*S;
        seqAdd(seq,0.8,null,null,()=>{ fx.T={x,y:y-40}; }); seqAdd(seq,0.4,null,null,()=>{ fx.T={x,y}; });
        seqAdd(seq,0.2,u=>{ fxOpen=1-u; }); seqAdd(seq,0.5,null,()=>{ f.stam=false; debrisAdd(deb,{kind:'stamen',x:fx.x.x,y:fx.y.x,a:0.3,vx:30,vy:-30,w:3,drag:1.5}); fxOpen=1; },()=>{ fx.T={x:x+40,y:y-70}; }); });
      seqAdd(seq,0.6,null,()=>{ ph=1; fx.T={x:760,y:30}; }); }
    else if(i===1&&ph===1){ F.forEach((f,k)=>{ if(f.tr.bag) seqAdd(seq,0.35,null,null,()=>{ f.bagT=0; }); }); seqAdd(seq,1,null,()=>{ ph=2; }); }
    else if(i===2&&ph>=2) run=!run;
    else if(i===3&&ph===2&&day>=12){ run=false; F.forEach(f=>{ if(f.tr.bag) f.bagT=-1.2; }); deb.forEach(p=>{ p.rest=false; p.bag=false; }); ph=3; table=F.map(f=>f.pod>0.3); }

      const done=j===0?si:Math.round(si*0.6); FLO.forEach((f,i)=>{ const x=s.x+Math.cos(f.th)*f.r*s.r*0.93, y=s.y+Math.sin(f.th)*f.r*s.r*0.93, rr=s.r*0.028;
        if(i<done) circ(ctx,x,y,rr*1.4,COL.red,'#fff4f1',1); else dot(ctx,x,y,rr,COL.mid); }); });
    textAt(ctx,'1 floret drawn = 4 real florets',600,470,{align:'center',size:11,weight:600,color:COL.mid});
    bees.forEach(b=>drawBee(ctx,b.x,b.y,24,b.vx>=0?1:-1,t,{pollen:b.pol}));
    fly.forEach(f=>{ const k=ease(f.k); dot(ctx,lerp(f.x,f.tx,k),lerp(f.y,f.ty,k),2.4,COL.yellow); });
    if(tau>0.02){ if(Sw>=1) tag(ctx,IN(Pw*tau/Sw)+' pollen : 1 seed',200,56,COL.yellow,{size:12.5}); if(Si>=1) tag(ctx,IN(Pi*tau/Si)+' pollen : 1 seed',600,56,COL.yellow,{size:12.5}); }
    ctx.restore(); });
  return wrap;
}
