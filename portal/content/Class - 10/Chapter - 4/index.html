    textAt(ctx,L.n,TX,TB+48,{align:'center',size:13,weight:700,color:COL.muted});
    if(sp>1) timeTagPx(ctx,SW-10,sp+'× speed');
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.7 ACETIC ACID vs HYDROCHLORIC ACID — LITMUS AND UNIVERSAL INDICATOR
   pH from the charge-balance engine (Ch 2): HCl ionises completely;
   CH₃COOH is weak, pKa 4.76 → at 0.1 M, pH 2.88 vs 1.0 for HCl, i.e.
   only 1.3 % of the molecules give up H⁺ ([H⁺] 76× lower).
   Blue litmus turns red with BOTH (both below pH 4.6) — litmus only says
   "acid". Universal indicator shows how much H⁺: orange-red vs deep red.
   The lenses show 36 acid units: every HCl is split into H⁺ + Cl⁻, but
   only α = [H⁺]/C of the acetic acid molecules are.
   ===================================================================== */
function buildA7(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const B=[{x:150,n:'CH₃COOH',sp:'CH3COOH',lab:'A  dilute acetic acid'},{x:390,n:'HCl',sp:'HCl',lab:'B  dilute hydrochloric acid'}];
  const TOP=250, BOT=420, BW=150, CH={x:30,y:478,w:510,h:26}, L=120;
  let C=0.1, mode=null, t=0; const D=B.map(b=>dipNew(b.x+30,70));
  const lensP=B.map((b,j)=>{ const R=rng(11+j), P=[]; for(let i=0;i<36;i++) P.push({x:(R()-0.5)*150,y:(R()-0.5)*150,vx:(R()-0.5)*40,vy:(R()-0.5)*40,ang:R()*6,sep:0,ion:false}); return P; });
  side.innerHTML=`
    <div class="control-group"><label>Strength of both acids <span class="val" id="cv">0.10 M</span></label><input type="range" id="c" min="-2" max="0" step="0.1" value="-1"></div>
    <div class="control-group"><label>Test both with</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="lit">Blue litmus</button><button class="toggle-btn play" id="uni">Universal indicator</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','pH of A (acetic)',COL.red)}${card('r2','pH of B (HCl)',COL.red)}${card('r3','Molecules ionised in A',COL.green)}${card('r4','H⁺ in B vs A',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb'); const pH=()=>B.map(b=>phOf(b.sp,C));
  const test=m=>{ mode=m; const p=pH(); D.forEach((d,j)=>{ d.p=sprP(B[j].x+30,70); dipStart(d,p[j],m==='lit'?blueLitmus:uniCol,m==='lit'?LIT_B:'#f1ead2'); }); fb.className='fb hidden'; };
  $('#lit').onclick=()=>test('lit'); $('#uni').onclick=()=>test('uni');
  $('#c').oninput=e=>{ C=Math.pow(10,+e.target.value); setv($,'cv',fmt(C,C<0.1?3:2)+' M'); D.forEach(d=>{ d.phase='rest'; d.wet=0; }); mode=null; fb.className='fb hidden'; };
  animLoop(dt=>{
    t+=dt; const p=pH(), alpha=Math.pow(10,-p[0])/C;
    D.forEach((d,j)=>dipStep(d,dt,{x:B[j].x,y:TOP+60},mode==='uni'?(ph=>({x:CH.x+(clamp(ph,0,14)+0.5)*CH.w/15+(j?8:-8),y:CH.y-L-14})):null,L));
    setMany($,{r1:fmt(p[0],2), r2:fmt(p[1],2), r3:alpha>0.2?Math.round(alpha*100)+' %':'1 in '+Math.round(1/alpha), r4:Math.round(Math.pow(10,p[0]-p[1]))+'×'});
    if(D.every(d=>d.phase==='done')){ if(mode==='lit') fbSet(fb,'warn','Both turn blue litmus red — litmus only tells you that both are acids.');
      else fbSet(fb,'ok',`Universal indicator: HCl pH ${fmt(p[1],1)}, acetic acid pH ${fmt(p[0],1)} — acetic acid is a much weaker acid.`); }
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    line(ctx,20,BOT+2,560,BOT+2,COL.ink,2.6);
    B.forEach((b,j)=>{ const bk=beakerDraw(ctx,b.x,TOP,BOT,BW,{grad:{n:5}}); const lv=TOP+60; ctx.save(); ctx.fillStyle='rgba(217,67,43,0.07)'; ctx.fillRect(bk.x0+1.5,lv,BW-3,BOT-lv-1.5); ctx.restore(); line(ctx,bk.x0+2,lv,bk.x1-2,lv,COL.red,2);
      textAt(ctx,b.lab,b.x,TOP-26,{align:'center',size:12.5,weight:700,color:COL.ink}); textAt(ctx,fmt(C,C<0.1?3:2)+' M '+b.n,b.x,TOP-10,{align:'center',size:12,weight:700,color:COL.red}); });
    if(mode==='uni') phChart(ctx,CH.x,CH.y,CH.w,CH.h,[]);
    D.forEach(d=>{ if(d.phase!=='rest') dipDraw(ctx,d,L,24); });
    // lenses: what the acid is made of
    B.forEach((b,j)=>{ const cx=680, cy=j?400:160, R=100, P=lensP[j]; const nIon=j?36:Math.max(alpha*36>0.5?1:0,Math.round(alpha*36));
      P.forEach((q,i)=>{ q.ion=i<nIon; q.vx+=(Math.random()-0.5)*90*dt; q.vy+=(Math.random()-0.5)*90*dt; q.vx*=Math.exp(-0.5*dt); q.vy*=Math.exp(-0.5*dt); q.x+=q.vx*dt; q.y+=q.vy*dt; q.ang+=dt*(q.vx*0.02);
        const r=Math.hypot(q.x,q.y); if(r>R-14){ q.x*=(R-14)/r; q.y*=(R-14)/r; q.vx*=-0.8; q.vy*=-0.8; } q.sep=approach(q.sep,q.ion?16:0,3,dt); });
      lensView(ctx,cx,cy,R,b.x-40,TOP+100,()=>{ ctx.fillStyle='rgba(47,143,224,0.06)'; ctx.fillRect(cx-R,cy-R,2*R,2*R);
        P.forEach(q=>{ const x=cx+q.x, y=cy+q.y, ox=Math.cos(q.ang)*q.sep, oy=Math.sin(q.ang)*q.sep;
          if(j){ circ(ctx,x-ox,y-oy,6.5,COL.blue,'#fff',1.6); textAt(ctx,'Cl',x-ox,y-oy+3,{align:'center',size:7,weight:800,color:COL.blue}); }
          else { if(q.sep<6) bondDraw(ctx,x,y,x+ox+Math.cos(q.ang)*6,y+oy+Math.sin(q.ang)*6,COL.mid,1); circ(ctx,x-ox*0.3,y-oy*0.3,7,COL.ink,'#fff',1.6); textAt(ctx,'Ac',x-ox*0.3,y-oy*0.3+3,{align:'center',size:7,weight:800,color:COL.ink}); }
          const hx=x+ox+Math.cos(q.ang)*7, hy=y+oy+Math.sin(q.ang)*7; circ(ctx,hx,hy,4.2,COL.red,q.ion?rgba(COL.red,0.9):'#fff',1.6); }); },{label:j?'HCl: every molecule → H⁺ + Cl⁻':'CH₃COOH: few give H⁺',col:j?COL.red:COL.ink}); });
    textAt(ctx,'● H⁺',588,548,{size:11.5,weight:800,color:COL.red}); textAt(ctx,'Ac = CH₃COO   Cl = chloride',630,548,{size:11.5,weight:700,color:COL.muted});
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.8 ESTERIFICATION — ETHANOL + ETHANOIC ACID (acid catalyst)
   1 mL ethanol = 17.1 mmol, 1 mL glacial acetic acid = 17.5 mmol.
   CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O,  K = 4 → at most ≈ 66 % ester.
   Rate = k(T)·(drops of conc. H₂SO₄)·([acid][alcohol] − [ester][water]/K)
   k = 2.6×10⁻⁴ L/(mol·s) per drop at 60 °C (3 drops → half-way in
   ≈ 2.5 min), Ea 60 kJ/mol (13× slower at room temperature); with no
   catalyst it is ≈ 250× slower still — nothing forms in 5 min.
   Time runs 30× faster. Poured into 30 mL water, the ester (ρ 0.90)
   dissolves (8 g/100 mL) and its sweet fruity smell spreads; left-over
   acid smells of vinegar.
   ===================================================================== */
function buildA8(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const CX=210, BTOP=270, BBOT=420, TW=40, TH=190, SPEED=30, PX=TW*40; // px² per mL in the tube
  const BX=560, BB=500, BWW=170;
  let t=0, Tbath=60, heat=true; const S={};
  const reset=()=>Object.assign(S,{A:17.5,E0:17.1,Al:17.1,Es:0,W:0.1,cat:0,tm:0,V:2,phase:'bath',tube:{x:spr(CX),y:spr(BBOT-12),a:spr(0)},ml:2,bml:30,poured:0,wisp:[],nose:sprP(880,230),sniff:false,hist:[],drops:[],sq:spr(0),acc:0});
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Conc. sulphuric acid (catalyst)</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="h">+ 1 drop</button><button class="toggle-btn" id="rs">↺ Fresh mixture</button></div></div>
    <div class="control-group"><label>Water bath <span class="val" id="tv">60 °C</span></label><input type="range" id="tb" min="25" max="75" step="1" value="60"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn navy" id="pour">Pour into water</button><button class="toggle-btn" id="smell">👃 Smell it</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Warming time',COL.yellow)}${card('r2','Ester formed',COL.green)}${card('r3','Acid drops',COL.yellow)}${card('r4','Smell',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  $('#h').onclick=()=>{ if(S.phase==='bath') S.acc++; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  $('#tb').oninput=e=>{ Tbath=+e.target.value; setv($,'tv',Tbath+' °C'); };
  $('#pour').onclick=()=>{ if(S.phase==='bath'){ S.phase='lift'; S.pt=0; } };
  $('#smell').onclick=()=>{ S.sniff=!S.sniff; };
  let T=60, nd=0;
  animLoop(dt=>{
    t+=dt; T=approach(T,Tbath,0.6,dt); setv($,'tv',Math.round(Tbath)+' °C');
    /* dropper */
    nd-=dt; if(S.acc>0&&nd<=0){ S.acc--; nd=0.5; S.sq.v+=9; S.drops.push({x:CX,y:BTOP-95,vy:0,r:3.6}); }
    springTo(S.sq,0,120,10,dt);
    /* kinetics in the tube (only while it is in the bath) */
    if(S.phase==='bath'){ const dts=dt*SPEED; S.tm+=dts; const k=2.6e-4*Math.exp(-60000/8.314*(1/(T+273)-1/333))*(S.cat+0.004);
      const V=S.V/1000, a=S.A/1000/V, b=S.Al/1000/V, e=S.Es/1000/V, wv=S.W/1000/V; const r=k*(a*b-e*wv/4)*V*1000; // mmol/s
      const d=clamp(r*dts,-S.Es,Math.min(S.A,S.Al)); S.A-=d; S.Al-=d; S.Es+=d; S.W+=d;
      if(S.hist.length===0||S.tm-S.hist[S.hist.length-1].t>6) S.hist.push({t:S.tm,x:S.Es/S.E0}); }
    /* pouring: lift, carry over the beaker, tip, empty, put down */
    const tb=S.tube; let tx=CX, ty=BBOT-12, ta=0;
    if(S.phase!=='bath'){ S.pt+=dt; tx=BX-110; ty=BB-230; ta=S.pt>1.2?Math.min(2.3,(S.pt-1.2)*1.6):0; if(S.phase==='lift'&&S.ml<0.02&&S.pt>3){ S.phase='done'; S.pt2=0; } }
    if(S.phase==='done'){ S.pt2+=dt; ta=Math.max(0,2.3-S.pt2*2); tx=BX-140; ty=BB+16; }
    springTo(tb.x,tx,40,11,dt); springTo(tb.y,ty,40,11,dt); springTo(tb.a,ta,40,11,dt);
    const P=tubeAt(TW,TH,tb.x.x,tb.y.x,tb.a.x), lr=fillLow(P,S.ml*PX);
    let flow=0; if(S.ml*PX>lr.cap+0.5){ flow=Math.min((S.ml*PX-lr.cap)/PX,1.2*dt); S.ml-=flow; S.bml+=flow; S.poured+=flow; }
    const fE=S.poured/2*S.Es, fA=S.poured/2*S.A; // mmol now in the beaker
    const eAmt=S.phase==='bath'?S.Es*0.08:fE, aAmt=S.phase==='bath'?S.A*0.08:fA;
    if(Math.random()<clamp(eAmt*0.5,0,3)*dt*4) wispAdd(S.wisp,(S.phase==='bath'?CX:BX)+(Math.random()-0.5)*30,(S.phase==='bath'?BBOT-12-TH:BB-120),(Math.random()-0.5)*20,-40,COL.green);
    if(Math.random()<clamp(aAmt*0.08,0,3)*dt*4) wispAdd(S.wisp,(S.phase==='bath'?CX:BX)+(Math.random()-0.5)*30,(S.phase==='bath'?BBOT-12-TH:BB-120),(Math.random()-0.5)*20,-40,COL.red);
    sprPStep(S.nose,S.sniff?BX+150:880,S.sniff?BB-190:230,dt,30,10);
    wispStep(S.wisp,dt,S.sniff?S.nose.x.x-10:undefined,S.sniff?S.nose.y.x-30:undefined);
    const xE=S.Es/S.E0, smellStr=S.phase==='bath'?'(in the tube)':fE>1.5?'sweet, fruity':fA>1?'vinegar':'—';
    setMany($,{r1:fmt(S.tm/60,1)+' min', r2:Math.round(xE*100)+' %', r3:String(S.cat), r4:S.sniff||S.phase!=='bath'?smellStr:'—'});
    if(S.poured>1.5&&fE>1.5) fbSet(fb,'ok','A sweet-smelling ester (ethyl ethanoate) has formed — esters are used in perfumes and flavours.');
    else if(S.phase==='bath'&&S.cat===0&&S.tm>300) fbSet(fb,'warn','5 minutes and almost no ester — without the acid catalyst the reaction is far too slow.');
    else if(S.phase==='bath'&&xE>0.6) fbSet(fb,'ok','Equilibrium: about two-thirds of the acid has become ester; the rest stays as acid + alcohol.');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,520);
    ctx.save(); ctx.beginPath(); ctx.rect(0,432,SW,200); ctx.clip(); spiritLamp(ctx,CX,520,t,Tbath>35); ctx.restore();
    tripod(ctx,CX,428,520,160); gauze(ctx,CX,426,200);
    waterBath(ctx,CX,BTOP,BBOT+2,180,T,t); labThermo(ctx,CX+58,BTOP-50,BBOT-40,T,0,100,{step:10});
    // water beaker on the right
    const bk=beakerDraw(ctx,BX,BB-150,BB,BWW,{grad:{n:5}}); const lvl=BB-2-S.bml*2.6; ctx.save(); ctx.fillStyle=rgba(COL.blue,0.12); ctx.fillRect(bk.x0+1.5,lvl,BWW-3,BB-lvl-1.5); ctx.restore(); line(ctx,bk.x0+2,lvl,bk.x1-2,lvl,COL.blue,2);
    if(S.poured>0.2&&fE>0.5){ const R=rng(3); for(let i=0;i<Math.min(14,fE);i++){ const x=bk.x0+14+R()*(BWW-28), y=lvl+10+R()*(BB-lvl-20)+Math.sin(t*1.5+i)*3; circ(ctx,x,y,2.2+R()*2,COL.green,'#fff',1.2); } }
    textAt(ctx,'30 mL water',BX,BB+20,{align:'center',size:12,weight:700,color:COL.blue});
    // tube + contents
    if(lr.poly&&lr.poly.length>2){ polyFill(ctx,lr.poly,rgba(COL.green,0.08+0.15*xE)); const sl=surfLine(lr.poly,lr.L); if(sl) line(ctx,sl[0],lr.L,sl[1],lr.L,COL.red,1.8); }
    if(flow>0) stream(ctx,lr.lip[0],lr.lip[1],-30,lvl,rgba(COL.green,0.6),2.6);
    glassDraw(ctx,P,2.6);
    if(S.phase==='bath'&&S.cat>0){ const R=rng(9); for(let i=0;i<6;i++) if(xE>0.02){ const y=BBOT-20-((t*18+i*22)%(lr.L>0?BBOT-20-lr.L:40)); circ(ctx,CX+(R()-0.5)*20,y,1.6,COL.green,null,1); } }
    S.drops=S.drops.filter(d=>{ const hit=dropStep(d,dt,lr.L); if(hit){ S.cat++; S.V+=0.05; drip(); } else dropDraw(ctx,d,'#f3e6b0'); return !hit; });
    if(S.phase==='bath') dropperDraw(ctx,CX,BTOP-100,clamp(S.sq.x*0.12,0,1),0.6,'rgba(243,230,176,0.9)');
    if(S.phase==='bath') textAt(ctx,'conc. H₂SO₄',CX+20,BTOP-160,{size:12.5,weight:800,color:COL.yellow});
    if(S.phase==='bath'){ line(ctx,tb.x.x-TW/2+4,tb.y.x-40,96,BTOP-70,COL.red,1.3); textAt(ctx,'1 mL ethanol +',20,BTOP-92,{size:12.5,weight:700,color:COL.red}); textAt(ctx,'1 mL acetic acid',20,BTOP-76,{size:12.5,weight:700,color:COL.red}); }
    wispDraw(ctx,S.wisp);
    noseProfile(ctx,S.nose.x.x,S.nose.y.x,1.3,COL.ink);
    // graph: ester vs time
    const gx=470, gy=70, gw=290, gh=130; rect(ctx,gx,gy,gw,gh,COL.ink,'#fff',1.6); const Y=v=>gy+gh-v*gh;
    line(ctx,gx,Y(0.667),gx+gw,Y(0.667),COL.mid,1.2,[5,4]); textAt(ctx,'equilibrium ≈ 67 %',gx+gw-4,Y(0.667)-5,{align:'right',size:10.5,weight:600,color:COL.muted});
    textAt(ctx,'ester formed',gx,gy-8,{size:12,weight:700,color:COL.green}); textAt(ctx,'0 → 10 min',gx+gw,gy+gh+15,{align:'right',size:10.5,weight:600,color:COL.muted});
    if(S.hist.length>1){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.4; ctx.beginPath(); S.hist.forEach((q,i)=>{ const x=gx+Math.min(1,q.t/600)*gw, y=Y(q.x); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore(); }
    eqStrip(ctx,[{t:'CH₃COOH + C₂H₅OH ',col:COL.red},{t:'⇌ '},{t:'CH₃COOC₂H₅',col:COL.green},{t:' + H₂O'}],300,30,1,13);
    timeTagPx(ctx,SW-10,SPEED+'× speed');
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.9 ETHANOIC ACID + CARBONATE / HYDROGENCARBONATE → CO₂ → LIME WATER
   A: a spatula (0.25 g) of Na₂CO₃ = 2.36 mmol; B: 0.25 g NaHCO₃ = 2.98 mmol.
   2 mL of dilute (2 M) ethanoic acid = 4 mmol CH₃COOH per portion, run
   in through a thistle funnel. The acid first turns CO₃²⁻ into HCO₃⁻
   (no gas); then HCO₃⁻ + CH₃COOH → CH₃COO⁻ + H₂O + CO₂ at
   r = 0.05·a·b/(b + 1) mmol/s — slower than with HCl (weak acid).
   2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂
   CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂
   Headspace + tube (25 mL) of air is pushed out first. Lime water:
   20 mL saturated Ca(OH)₂ = 0.40 mmol, 15 % of the CO₂ absorbed.
   First 0.40 mmol → CaCO₃ (milky); the next 0.40 → Ca(HCO₃)₂ (clears).
   ===================================================================== */
function buildA9(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const BENCH=500, TW=58, TH=210, LW=58, LH=220, MLR=2600/2, MLL=1000/2; // px² per mL
  const U=[{x:110,lx:285,lab:'A',f:'Na₂CO₃',co3:2.36,hco3:0},{x:470,lx:645,lab:'B',f:'NaHCO₃',co3:0,hco3:2.98}];
  let t=0; const S={};
  function reset(){ S.u=U.map(u=>({c:u.co3, b:u.hco3, h:0, acidIn:0, funnel:0, V:0, co2:0, x:0, abs:0, bub:[], acc:0, lb:[], lacc:0, milk:0, grains:[], foam:0})); }
  reset();
  side.innerHTML=`
    <div class="control-group"><label>Dilute ethanoic acid (2 mL each time)</label><div class="toggle-group"><button class="toggle-btn play" id="both">▶ Into A and B</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="a">+ A only</button><button class="toggle-btn" id="b">+ B only</button><button class="toggle-btn" id="rs">↺ Fresh</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','CO₂ from A',COL.green)}${card('r2','CO₂ from B',COL.green)}${card('r3','Lime water A',COL.ink)}${card('r4','Lime water B',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const add=i=>{ const s=S.u[i]; if(s.funnel>0.2||s.acidIn>=8) return; s.funnel=2; };
  $('#both').onclick=()=>{ add(0); add(1); }; $('#a').onclick=()=>add(0); $('#b').onclick=()=>add(1);
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  const milkWord=s=>s.abs<0.02?'clear':s.abs<0.4?'milky':s.abs<0.75?'clearing':'clear again';
  animLoop(dt=>{
    t+=dt;
    S.u.forEach((s,i)=>{ const u=U[i];
      /* acid drains from the funnel (≈ 1.3 s per 2 mL) */
      if(s.funnel>0){ const q=Math.min(s.funnel,1.5*dt); s.funnel-=q; s.V+=q; s.h+=q*2; s.acidIn+=q; }
      const x0=Math.min(s.h,s.c); s.c-=x0; s.b+=x0; s.h-=x0;
      const r=0.05*s.h*s.b/(s.b+1), dn=Math.min(r*dt,s.h,s.b); s.h-=dn; s.b-=dn; s.co2+=dn;
      const q=dn*24.5; s.x+=q*(1-s.x)/25; s.foam=approach(s.foam,clamp(r*1.2,0,1),4,dt);
      s.acc+=clamp(r*60,0,80)*dt; while(s.acc>1){ s.acc-=1; s.bub.push({x:u.x+(Math.random()-0.5)*TW*0.6,y:BENCH-14,vy:-20,vx:0,r:1.6+Math.random()*1.5,ph:Math.random()*6}); }
      if(r>0.05&&Math.random()<r*dt*6) fizzTick();
      /* gas leaves through the lime water */
      s.abs+=0.15*dn*s.x; s.lacc+=q*6; while(s.lacc>1){ s.lacc-=1; s.lb.push({x:u.lx+(Math.random()-0.5)*6,y:BENCH-40,vy:-30,vx:0,r:2.4+Math.random()*1.6,ph:Math.random()*6}); }
      const caco3=s.abs<0.4?s.abs:Math.max(0,0.8-s.abs); s.milk=approach(s.milk,caco3/0.4,2.5,dt);
      const want=Math.round(s.milk*260); while(s.grains.length<want) s.grains.push({x:(Math.random()-0.5)*LW*0.8,y:30+Math.random()*120,ph:Math.random()*6}); if(s.grains.length>want) s.grains.length=want; });
    setMany($,{r1:fmt(S.u[0].co2*24.5,0)+' mL', r2:fmt(S.u[1].co2*24.5,0)+' mL', r3:milkWord(S.u[0]), r4:milkWord(S.u[1])});
    if(S.u[0].acidIn>1.9&&S.u[0].c<=0&&S.u[0].co2<1.2&&S.u[1].co2>1.8&&fb.className.includes('hidden')) fbSet(fb,'warn','A fizzes less: the first acid only turns CO₃²⁻ into HCO₃⁻. Add more acid to A.');
    if(S.u.some(s=>s.abs>0.12)) fbSet(fb,'ok','Lime water turns milky — the gas is carbon dioxide. (Excess CO₂ turns CaCO₃ into soluble Ca(HCO₃)₂.)');
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    benchTop(ctx,BENCH);
    S.u.forEach((s,i)=>{ const u=U[i];
      // navy card behind the lime water so the milkiness shows
      ctx.save(); rrect(ctx,u.lx-60,BENCH-250,120,230,10); ctx.fillStyle='#1d3557'; ctx.fill(); ctx.restore();
      rackDraw(ctx,u.x-60,u.lx+60,BENCH-80,BENCH);
      // reaction tube: powder + liquid
      const P=tubeAt(TW,TH,u.x,BENCH-6,0);
      const liqA=Math.max(0,s.V)*MLR, pw=(s.c+s.b)/(u.co3+u.hco3); const pr=fillLow(P,380*clamp(pw,0,1)+1);
      if(s.V>0.01){ const r=fillLow(P,liqA+380*clamp(pw,0,1)*0.4); polyFill(ctx,r.poly,'rgba(217,67,43,0.10)'); const sl=surfLine(r.poly,r.L); if(sl) line(ctx,sl[0],r.L,sl[1],r.L,COL.red,1.8);
        if(s.foam>0.05){ ctx.save(); ctx.globalAlpha=s.foam; for(let k=0;k<9;k++) circ(ctx,u.x-TW/2+6+k*5.6,r.L-3-Math.abs(Math.sin(t*9+k))*4*s.foam,3+s.foam*2,COL.green,'#fff',1.3); ctx.restore(); } }
      if(pw>0.01) polyFill(ctx,pr.poly,'#f4f6f9'), (()=>{ const sl=surfLine(pr.poly,pr.L); if(sl){ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.beginPath(); for(let k=0;k<=10;k++){ const xx=lerp(sl[0],sl[1],k/10), yy=pr.L+Math.sin(k*1.7)*1.5; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore(); } })();
      bubbleStep(s.bub,dt,()=>BENCH-14-s.V*MLR/TW-10); bubbleDraw(ctx,s.bub,COL.green);
      glassDraw(ctx,P,2.6);
      // cork + thistle funnel + delivery tube
      const top=BENCH-6-TH; rect(ctx,u.x-TW/2-4,top-10,TW+8,26,COL.ink,'#fff',2.4);
      const fx=u.x-12; line(ctx,fx,top+10,fx,top-110,COL.ink,6); line(ctx,fx,top+10,fx,top-110,'#fff',2.4);
      ctx.save(); ctx.lineJoin='round'; ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(fx-3,top-110); ctx.quadraticCurveTo(fx-26,top-120,fx-26,top-150); ctx.arc(fx,top-150,26,Math.PI,0); ctx.quadraticCurveTo(fx+26,top-120,fx+3,top-110); ctx.fill(); ctx.stroke(); ctx.restore();
      if(s.funnel>0.02){ const lv=top-150+26-s.funnel*14; ctx.save(); ctx.beginPath(); ctx.arc(fx,top-150,24,0,Math.PI*2); ctx.clip(); ctx.fillStyle='rgba(217,67,43,0.25)'; ctx.fillRect(fx-26,lv,52,60); ctx.restore(); line(ctx,fx,top-110,fx,top+10+ (BENCH-top)*0.4,'rgba(217,67,43,0.6)',2.4); }
      textAt(ctx,'CH₃COOH',fx,top-186,{align:'center',size:13,weight:800,color:COL.yellow});
      const dx=u.x+12, ty=150; ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(dx,top+10); ctx.lineTo(dx,ty); ctx.lineTo(u.lx,ty); ctx.lineTo(u.lx,BENCH-40); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke();
      if(s.co2>0&&s.foam>0.03){ ctx.setLineDash([5,20]); ctx.lineDashOffset=-t*80; ctx.strokeStyle=COL.green; ctx.lineWidth=2.6; ctx.stroke(); } ctx.restore();
      // lime-water tube
      const L=tubeAt(LW,LH,u.lx,BENCH-6,0), lr=fillLow(L,20*MLL);
      polyFill(ctx,lr.poly,'rgba(120,170,230,0.28)'); ctx.save(); ctx.globalAlpha=0.9*s.milk; polyFill(ctx,lr.poly,'#ffffff'); ctx.restore();
      polyClipFill(ctx,lr.poly,()=>{ ctx.fillStyle='#ffffff'; s.grains.forEach(g=>{ const yy=BENCH-6-g.y+Math.sin(t*1.2+g.ph)*3; ctx.fillRect(u.lx+g.x+Math.sin(t+g.ph)*2-1.2,yy-1.2,2.4,2.4); }); });
      bubbleStep(s.lb,dt,()=>lr.L); bubbleDraw(ctx,s.lb,COL.green);
      ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineJoin='round'; ctx.beginPath(); L.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); glassDraw(ctx,L,2.6); line(ctx,u.lx-LW/2+3,lr.L,u.lx+LW/2-3,lr.L,COL.blue,1.8);
      textAt(ctx,'lime water',u.lx,BENCH-262,{align:'center',size:12,weight:700,color:COL.blue});
      textAt(ctx,u.lab,u.x,BENCH+30,{align:'center',size:20,weight:800,color:COL.ink}); textAt(ctx,u.f,u.x,BENCH+50,{align:'center',size:13,weight:700,color:COL.muted});
      // equation strip for this side
      if(s.co2>0.2) eqStrip(ctx,i?[{t:'CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + '},{t:'CO₂↑',col:COL.green}]:[{t:'2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + '},{t:'CO₂↑',col:COL.green}],i?590:210,30,clamp(s.co2,0,1),12);
    });
    if(S.u.some(s=>s.abs>0.05)) eqStrip(ctx,[{t:'Ca(OH)₂ + CO₂ → '},{t:'CaCO₃↓',col:COL.ink},{t:' + H₂O'}],400,70,1,12);
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.10 OIL + WATER, WITH AND WITHOUT SOAP — WHICH SEPARATES FIRST?
   10 mL water + a little oil (0.5 mL, so the layer can be seen) in A and B;
   soap drops go into B. Shaking breaks the oil into droplets whose size
   follows the Hinze law d ∝ (σ/ρ)^0.6·ε^−0.4: plain oil/water σ = 25 mN/m
   → ≈ 240 µm drops; soap lowers σ to ≈ 5 mN/m → ≈ 90 µm drops.
   Drops rise by Stokes' law v = 2Δρ g r²/9μ (Δρ 80 kg/m³, μ 1 mPa·s):
   r 120 µm → 2.5 mm/s, r 45 µm → 0.35 mm/s.
   In A drops that touch merge (bigger → faster) and the layer comes back
   within seconds; in B each drop is wrapped in soap (micelle: oily tails
   in, ionic heads out) and the heads repel — no merging, it stays cloudy.
   1 cm = 40 px; time runs 4× faster.
   ===================================================================== */
function buildA10(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PV={x:260,y:92}, TL=330, TW=60, HW=228, SPEED=4, PXMM=4, N=150; // HW = water column px (10 mL)
  const XS=[-70,70];
  let t=0, soap=3, shakeT=0, since=null; const SH=shakeNew();
  const tubes=XS.map((x,j)=>({x, layer:1, P:[], mic:[], cloudy:0}));
  const sig=j=>j===1?0.025/(1+4*Math.min(soap,3)/3):0.025;          // N/m
  const dBreak=j=>240*Math.pow(sig(j)/0.025,0.6);                      // µm diameter
  const reset=()=>{ tubes.forEach(T=>{ T.layer=1; T.P=[]; }); since=null; };
  side.innerHTML=`
    <div class="control-group"><label>Soap solution in tube B <span class="val" id="sv">3 drops</span></label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn" id="s0">− drop</button><button class="toggle-btn play" id="s1">+ drop</button></div></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="shake">↔ Shake both (5 s)</button><button class="toggle-btn" id="rs">↺ Let them settle fully</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Time since shaking',COL.yellow)}${card('r2','Drop size A · B',COL.red)}${card('r3','Oil layer back — A',COL.green)}${card('r4','Oil layer back — B',COL.green)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const setS=v=>{ soap=clamp(v,0,5); setv($,'sv',soap+' drop'+(soap===1?'':'s')); };
  $('#s0').onclick=()=>setS(soap-1); $('#s1').onclick=()=>setS(soap+1);
  $('#shake').onclick=()=>{ shakeT=5; since=null; fb.className='fb hidden'; };
  $('#rs').onclick=()=>{ reset(); fb.className='fb hidden'; };
  animLoop(dt=>{
    t+=dt; const shaking=shakeT>0; if(shaking){ shakeT-=dt; if(shakeT<=0) since=0; } else if(since!==null) since+=dt*SPEED;
    const amp=shakeStep(SH,dt,shaking,1);
    tubes.forEach((T,j)=>{ const dB=dBreak(j), merge=j===1?Math.exp(-1.6*soap):1;
      /* shaking: the layer is torn into parcels, parcels are broken toward the Hinze size */
      if(shaking){ const take=Math.min(T.layer,dt*0.9); T.layer-=take; let n=Math.round(take*N); while(n-->0) T.P.push({x:(Math.random()-0.5)*(TW-10),y:-Math.random()*HW,d:dB*2,v:1});
        T.P.forEach(p=>{ p.d=approach(p.d,dB*(0.7+Math.random()*0.6),3,dt); p.x=clamp(p.x+(Math.random()-0.5)*600*dt*amp,-TW/2+5,TW/2-5); p.y=clamp(p.y+(Math.random()-0.5)*900*dt*amp,-HW+3,-4); }); }
      else { T.P.forEach(p=>{ const r=p.d/2*1e-6, v=2*80*9.81*r*r/(9*1e-3)*1000; p.y-=v*PXMM*SPEED*dt; p.x+=Math.sin(t*1.3+p.d)*2*dt; });
        /* coalescence of touching drops in A (and in B only if too little soap) */
        for(let i=0;i<T.P.length;i++){ const a=T.P[i]; for(let k=i+1;k<T.P.length;k++){ const b=T.P[k]; const ra=Math.max(2,a.d/40), rb=Math.max(2,b.d/40); if(Math.abs(a.y-b.y)<ra+rb&&Math.abs(a.x-b.x)<ra+rb&&Math.random()<merge*dt*20){ a.d=Math.cbrt(a.d**3+b.d**3); a.v+=b.v; a.x=(a.x+b.x)/2; a.y=(a.y+b.y)/2; T.P.splice(k,1); k--; } } } }
      const top=-HW+2; for(let i=T.P.length-1;i>=0;i--){ const p=T.P[i]; if(p.y<=top+Math.max(2,p.d/40)&&!shaking){ T.layer+=p.v/N; T.P.splice(i,1); } }
      T.layer=Math.min(1,T.layer); T.cloudy=clamp(T.P.length/N,0,1); });
    const back=tubes.map(T=>T.layer);
    setMany($,{r1:since===null?(shaking?'shaking…':'—'):fmt(since,0)+' s', r2:Math.round(dBreak(0))+' · '+Math.round(dBreak(1))+' µm', r3:Math.round(back[0]*100)+' %', r4:Math.round(back[1]*100)+' %'});
    if(since!==null&&back[0]>0.9&&back[1]<0.6) fbSet(fb,'ok',`A has separated again after ${fmt(since,0)} s; B is still cloudy — soap keeps the oil drops apart (an emulsion).`);
    else if(since!==null&&back[0]>0.9&&back[1]>0.9) fbSet(fb,'warn','Both have separated'+(soap?' — B took longer.':' — with no soap, B behaves just like A.'));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    ctx.save(); ctx.translate(PV.x,PV.y+SH.y.x); ctx.rotate(SH.a.x);
    tubes.forEach((T,j)=>{ ctx.save(); ctx.translate(T.x,TL); const P=tubeLocal(TW,TL-20), lr=liquidIn(P,MOUTH(P),TW*HW);
      polyFill(ctx,lr.poly,rgba(COL.blue,0.10+0.12*T.cloudy));
      if(T.cloudy>0.02){ ctx.save(); ctx.globalAlpha=0.5*T.cloudy*(j===1?1:0.5); polyFill(ctx,lr.poly,'#f7efe0'); ctx.restore(); }
      const lh=T.layer*9; if(lh>0.3){ ctx.fillStyle=rgba('#e0a31f',0.55); ctx.fillRect(-TW/2+2,-HW-lh,TW-4,lh); line(ctx,-TW/2+2,-HW-lh,TW/2-2,-HW-lh,COL.red,2); }
      line(ctx,-TW/2+2,-HW,TW/2-2,-HW,COL.blue,1.6);
      T.P.forEach(p=>{ const r=Math.max(1.3,p.d/40); circ(ctx,p.x,p.y,r,COL.red,'rgba(224,163,31,0.5)',1.1); if(j===1&&soap>0&&r>2.2) circ(ctx,p.x,p.y,r+1.6,COL.blue,null,0.8); });
      glassDraw(ctx,P,2.6); textAt(ctx,j?'B':'A',0,26,{align:'center',size:20,weight:800,color:COL.ink});
      ctx.restore(); });
    // hand holding both tubes at the top
    rect(ctx,-110,-6,220,22,COL.ink,'#fff',2.4); for(let k=0;k<4;k++) line(ctx,-60+k*40,-6,-60+k*40,16,COL.mid,1.4);
    handDraw(ctx,-150,6,0,1.1,0.9,COL.yellow);
    ctx.restore();
    if(amp>0.05) for(let k=-1;k<=1;k+=2){ ctx.save(); ctx.globalAlpha=amp; vec(ctx,PV.x+k*130,PV.y+240,PV.x+k*175,PV.y+240,COL.yellow,3); ctx.restore(); }
    textAt(ctx,'water + oil',PV.x-70,PV.y+TL+56,{align:'center',size:12,weight:700,color:COL.muted}); textAt(ctx,'water + oil + soap',PV.x+70,PV.y+TL+56,{align:'center',size:12,weight:700,color:COL.blue});
    // lens: an oil drop in B, with soap molecules forming a micelle
    const nm=soap?Math.round(8+soap*5):0; const B=tubes[1];
    while(B.mic.length<nm) B.mic.push({a:Math.random()*6.28,r:120+Math.random()*30,f:0}); B.mic.length=nm;
    lensView(ctx,610,280,150,PV.x+70,PV.y+200,()=>{ ctx.fillStyle='rgba(47,143,224,0.08)'; ctx.fillRect(460,130,300,300);
      const R0=46+6*Math.sin(t*0.8); circ(ctx,610,280,R0,COL.red,'rgba(224,163,31,0.45)',2.4); textAt(ctx,'oil',610,285,{align:'center',size:14,weight:800,color:COL.red});
      B.mic.forEach((m,i)=>{ const tgt=i/Math.max(1,nm)*Math.PI*2; m.a+=angDiff(tgt,m.a)*Math.min(1,dt*1.5)+dt*0.15; m.r=approach(m.r,R0+14,1.2,dt); const x=610+Math.cos(m.a)*m.r, y=280+Math.sin(m.a)*m.r; soapMol(ctx,x,y,m.a+Math.PI,20,1); });
      if(!nm) textAt(ctx,'no soap',610,380,{align:'center',size:13,weight:700,color:COL.muted}); },{label:'micelle: tails in the oil, heads in water'});
    timeTagPx(ctx,SW-10,SPEED+'× speed');
    ctx.restore();
  });
  return wrap;
}

/* =====================================================================
   4.11 SOAP IN DISTILLED vs HARD WATER   ·   4.12 SOAP vs DETERGENT
   Hard water from a tube-well: 300 ppm (as CaCO₃) = 3 mM Ca²⁺ →
   10 mL holds 0.030 mmol Ca²⁺.
   Soap solution (5 % sodium stearate, M 306): one drop (0.05 mL)
   = 0.0082 mmol soap anions. Ca²⁺ + 2 C₁₇H₃₅COO⁻ → (C₁₇H₃₅COO)₂Ca↓
   (white curdy scum), so 10 mL of hard water eats 0.060 mmol = 7.3
   drops before ANY soap is left to foam.
   Detergent (5 % sodium alkylbenzene sulphonate, M 348): 0.0072 mmol per
   drop; its calcium salt is soluble → no scum, all of it foams.
   Foam when shaken: H = 60 px · (1 − e^(−c/0.8 mM)) · shaking, where c
   is the free (un-precipitated) surfactant; it drains away afterwards
   with a half-life ≈ 25 s (4× faster on screen).
   The lens shows a tiny volume with 6 Ca²⁺ at 300 ppm: each soap anion
   that meets a Ca²⁺ sticks; a Ca²⁺ with two soap tails becomes scum.
   ===================================================================== */
function buildSoap(cfg){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PV={x:250,y:92}, TL=330, TW=62, HW=190, SPEED=4;
  const SOAP=0.0082, DET=0.0072;
  let t=0, shakeT=0, hard=300; const SH=shakeNew();
  const T=cfg.tubes.map((c,j)=>({...c, x:(j?70:-70), drops:0, foam:0, scum:0, flecks:[], free:0}));
  const L=T.map(()=>({ca:[],mol:[],acc:0,seed:1}));
  const ppm=tb=>tb.hard?hard:0;
  const lensReset=j=>{ const n=Math.round(6*ppm(T[j])/300); const R=rng(7+j); L[j]={ca:[],mol:[],acc:0}; for(let i=0;i<n;i++) L[j].ca.push({x:(R()-0.5)*170,y:(R()-0.5)*170,vx:0,vy:0,b:[]}); };
  T.forEach((_,j)=>lensReset(j));
  side.innerHTML=`
    <div class="control-group"><label>${cfg.addLabel}</label><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="d1">+ 1 drop each</button><button class="toggle-btn" id="d5">+ 5 drops each</button></div></div>
    <div class="control-group"><label>Hardness of the hard water <span class="val" id="hv">300 ppm</span></label><input type="range" id="hd" min="50" max="600" step="10" value="300"></div>
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="shake">↔ Shake both (4 s)</button><button class="toggle-btn" id="rs">↺ Fresh tubes</button></div></div>
    <div class="control-group"><div class="result-cards">${card('r1','Drops in each',COL.yellow)}${card('r2','Foam — '+cfg.tubes[0].short,COL.green)}${card('r3','Foam — '+cfg.tubes[1].short,COL.green)}${card('r4','Scum (curdy solid)',COL.ink)}</div><div class="fb hidden" id="fb"></div></div>`;
  const fb=$('#fb');
  const add=n=>{ T.forEach(tb=>tb.drops+=n); fb.className='fb hidden'; };
  $('#d1').onclick=()=>add(1); $('#d5').onclick=()=>add(5);
  $('#hd').oninput=e=>{ hard=+e.target.value; setv($,'hv',hard+' ppm'); T.forEach((tb,j)=>{ if(tb.hard) lensReset(j); }); };
  $('#shake').onclick=()=>{ shakeT=4; };
  $('#rs').onclick=()=>{ T.forEach((tb,j)=>{ tb.drops=0; tb.foam=0; tb.flecks=[]; lensReset(j); }); fb.className='fb hidden'; };
  animLoop(dt=>{
    t+=dt; const shaking=shakeT>0; if(shaking) shakeT-=dt; const amp=shakeStep(SH,dt,shaking,1);
    T.forEach((tb,j)=>{ const per=tb.agent==='det'?DET:SOAP, tot=tb.drops*per, ca=ppm(tb)/100*0.01; // mmol Ca²⁺ in 10 mL
      const prec=tb.agent==='det'?0:Math.min(tot,2*ca); tb.scum=prec/2; tb.free=(tot-prec)/0.01; // mM
      const H=60*(1-Math.exp(-tb.free/0.8));
      tb.foam=shaking?approach(tb.foam,H*clamp(amp*1.4,0,1),1.2,dt):tb.foam*Math.pow(0.5,dt*SPEED/25);
      const want=Math.round(tb.scum/0.03*70); while(tb.flecks.length<want) tb.flecks.push({x:(Math.random()-0.5)*(TW-12),y:-Math.random()*HW,vy:0,s:1.5+Math.random()*2.5,rest:false}); tb.flecks.length=Math.min(tb.flecks.length,want);
      tb.flecks.forEach(f=>{ if(shaking){ f.x=clamp(f.x+(Math.random()-0.5)*500*dt*amp,-TW/2+6,TW/2-6); f.y=clamp(f.y+(Math.random()-0.5)*700*dt*amp,-HW+2,-4); f.rest=false; }
        else if(!f.rest){ f.y-=30*dt; if(f.y<=-HW+3+f.s){ f.y=-HW+3+f.s; f.rest=true; } } }); });
    setMany($,{r1:String(T[0].drops), r2:T[0].foam>30?'lots':T[0].foam>6?'some':T[0].foam>1?'a little':'none', r3:T[1].foam>30?'lots':T[1].foam>6?'some':T[1].foam>1?'a little':'none',
      r4:T.map(tb=>tb.scum>0.001?tb.short:null).filter(Boolean).join(' · ')||'none'});
    const need=Math.ceil(2*hard/100*0.01/SOAP);
    if(!shaking&&T[0].drops>0&&SH.a.x<0.05&&T.some(tb=>tb.foam>2)) fbSet(fb,cfg.okCls(T),cfg.msg(T,need));
    /* ---------------- draw ---------------- */
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stg(ctx,w,h);
    ctx.save(); ctx.translate(PV.x,PV.y+SH.y.x); ctx.rotate(SH.a.x);
    T.forEach((tb,j)=>{ ctx.save(); ctx.translate(tb.x,TL); const P=tubeLocal(TW,TL-20), lr=liquidIn(P,MOUTH(P),TW*HW);
      polyFill(ctx,lr.poly,tb.hard?'rgba(129,149,171,0.14)':rgba(COL.blue,0.10)); line(ctx,-TW/2+2,-HW,TW/2-2,-HW,COL.blue,1.6);
      if(tb.scum>0.001){ ctx.save(); ctx.globalAlpha=clamp(tb.scum/0.03,0,1)*0.25; polyFill(ctx,lr.poly,'#ffffff'); ctx.restore(); }
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.1; ctx.fillStyle='#fdfdfd'; tb.flecks.forEach(f=>{ ctx.beginPath(); ctx.ellipse(f.x,f.y,f.s*1.5,f.s,0.4,0,Math.PI*2); ctx.fill(); ctx.stroke(); }); ctx.restore();
      foamDraw(ctx,-TW/2+2,TW/2-2,-HW,tb.foam,t,j+3);
      glassDraw(ctx,P,2.6); textAt(ctx,tb.lab,0,26,{align:'center',size:13,weight:800,color:tb.hard?COL.ink:COL.blue});
      ctx.restore(); });
    rect(ctx,-110,-6,220,22,COL.ink,'#fff',2.4); for(let k=0;k<4;k++) line(ctx,-60+k*40,-6,-60+k*40,16,COL.mid,1.4);
    handDraw(ctx,-150,6,0,1.1,0.9,COL.yellow);
    ctx.restore();
    if(amp>0.05) for(let k=-1;k<=1;k+=2){ ctx.save(); ctx.globalAlpha=amp; vec(ctx,PV.x+k*130,PV.y+240,PV.x+k*175,PV.y+240,COL.yellow,3); ctx.restore(); }
    T.forEach((tb,j)=>textAt(ctx,tb.sub,PV.x+tb.x,PV.y+TL+50,{align:'center',size:11.5,weight:700,color:tb.agent==='det'?COL.green:COL.muted}));
    // lenses: what happens to the soap / detergent molecules
    const lj=cfg.lens; T.forEach((tb,j)=>{ if(!lj.includes(j)) return; const cx=640, cy=lj.length>1?(j?400:150):280, R=lj.length>1?110:150, S=L[j];
      const wantMol=Math.round(tb.drops*(tb.agent==='det'?DET:SOAP)/0.0082*1.64); while(S.mol.length<Math.min(wantMol,40)){ const a=Math.random()*6.28, rr=Math.random()*(R-20); S.mol.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,ang:Math.random()*6.28,ca:null}); }
      if(wantMol<S.mol.length){ S.mol.length=wantMol; S.ca.forEach(c=>c.b=c.b.filter(m=>S.mol.includes(m))); }
      const k=R/110;
      S.mol.forEach(m=>{ if(m.ca){ const c=m.ca, i=c.b.indexOf(m); const a=(i?Math.PI:0)+t*0.3; m.x=c.x*k+Math.cos(a)*16*k; m.y=c.y*k+Math.sin(a)*16*k; m.ang=a; return; }
        m.vx+=(Math.random()-0.5)*60*dt; m.vy+=(Math.random()-0.5)*60*dt;
        if(tb.agent!=='det'){ let best=null, bd=1e9; S.ca.forEach(c=>{ if(c.b.length<2){ const d=Math.hypot(c.x*k-m.x,c.y*k-m.y); if(d<bd){ bd=d; best=c; } } }); if(best&&bd<90*k){ m.vx+=(best.x*k-m.x)/bd*70*dt; m.vy+=(best.y*k-m.y)/bd*70*dt; } } /* head attracted to Ca²⁺ */ m.vx*=Math.exp(-1.2*dt); m.vy*=Math.exp(-1.2*dt); m.x+=m.vx*dt; m.y+=m.vy*dt; m.ang+=dt*0.8;
        const r=Math.hypot(m.x,m.y); if(r>R-18){ m.x*=(R-18)/r; m.y*=(R-18)/r; m.vx*=-1; m.vy*=-1; }
        if(tb.agent!=='det') S.ca.forEach(c=>{ if(!m.ca&&c.b.length<2&&Math.hypot(c.x*k-m.x,c.y*k-m.y)<18*k){ m.ca=c; c.b.push(m); } }); });
      S.ca.forEach(c=>{ const done=c.b.length>=2; c.vx+=(Math.random()-0.5)*40*dt; c.vy+=(Math.random()-0.5)*40*dt+(done?-20*dt:0); c.vx*=Math.exp(-0.8*dt); c.vy*=Math.exp(-0.8*dt); c.x+=c.vx*dt; c.y+=c.vy*dt; const r=Math.hypot(c.x,c.y); if(r>(R-24)/k){ c.x*=(R-24)/k/r; c.y*=(R-24)/k/r; c.vx*=-0.5; c.vy*=-0.5; } });
      lensView(ctx,cx,cy,R,PV.x+tb.x,PV.y+TL-120,()=>{ ctx.fillStyle=tb.hard?'rgba(129,149,171,0.08)':'rgba(47,143,224,0.06)'; ctx.fillRect(cx-R,cy-R,2*R,2*R);
        S.ca.forEach(c=>{ const x=cx+c.x*k, y=cy+c.y*k, done=c.b.length>=2; if(done){ ctx.save(); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.ellipse(x,y,34*k,16*k,t*0.3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.restore(); }
          circ(ctx,x,y,9*k,COL.ink,'#fff',2); textAt(ctx,'Ca',x,y+3.5*k,{align:'center',size:8.5*k,weight:800,color:COL.ink}); });
        S.mol.forEach(m=>{ const x=cx+m.x, y=cy+m.y; if(tb.agent==='det'){ soapMol(ctx,x,y,m.ang,20*k,1,COL.green); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.strokeRect(x-4.5,y-4.5,9,9); ctx.restore(); } else soapMol(ctx,x,y,m.ang,20*k,1); });
        if(!S.mol.length) textAt(ctx,'add drops',cx,cy+4,{align:'center',size:12,weight:700,color:COL.muted}); },{label:tb.lensLab,col:tb.agent==='det'?COL.green:COL.ink}); });
    ctx.restore();
  });
  return wrap;
}
function buildA11(){ return buildSoap({ addLabel:'Soap solution', lens:[0,1],
  tubes:[{lab:'Distilled',short:'distilled',sub:'rain water',hard:false,agent:'soap',lensLab:'distilled: soap stays free'},{lab:'Hard',short:'hard',sub:'hand-pump water',hard:true,agent:'soap',lensLab:'hard: Ca²⁺ grabs 2 soap → scum'}],
  okCls:T=>T[0].foam>T[1].foam+3?'ok':'warn',
  msg:(T,need)=>T[0].foam>T[1].foam+3?`More foam in distilled water. In hard water the soap first reacts with Ca²⁺/Mg²⁺ to form white curdy scum — here it needs ≈ ${need} drops before any foam appears.`:
    `Enough soap has been added to use up all the Ca²⁺ (≈ ${need} drops) — now hard water foams too, but a lot of soap was wasted as scum.` }); }
function buildA12(){ return buildSoap({ addLabel:'Soap in one tube, detergent in the other', lens:[0,1],
  tubes:[{lab:'Soap',short:'soap',sub:'hard water + soap',hard:true,agent:'soap',lensLab:'soap: Ca²⁺ salt is insoluble → scum'},{lab:'Detergent',short:'detergent',sub:'hard water + detergent',hard:true,agent:'det',lensLab:'detergent: Ca²⁺ salt stays dissolved'}],
  okCls:T=>'ok',
  msg:(T,need)=>T[1].foam>T[0].foam+3?`The detergent foams in hard water and forms no scum; the soap gives curdy scum (it needs ≈ ${need} drops before foaming).`:'Both foam now — but only because the soap tube got enough extra soap to use up all the Ca²⁺.' }); }

const _b=n=>(typeof window[n]==='function'?window[n]:()=>{ const d=document.createElement('div'); d.textContent='(not built yet)'; return d; });
const activities = [

  { num:'4.5', title:'Oxidation of Ethanol', desc:'Alkaline KMnO₄ drop by drop into warm ethanol', build: ()=>_b('buildA5')() },

  { num:'4.10', title:'Oil, Water and Soap', desc:'Shake two tubes — which one separates first?', build: ()=>_b('buildA10')() },

];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
