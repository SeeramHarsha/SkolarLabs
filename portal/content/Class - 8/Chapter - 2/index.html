<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 · Chapter 2 — The Invisible Living World | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">🔬</div>
    <div>
      <div class="chip">Grade 8 · Ch 2</div>
      <h1>The Invisible Living World</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you change</span>
      <span><i style="background:var(--f-blue)"></i>Measured · Nucleus</span>
      <span><i style="background:var(--f-green)"></i>Chlorophyll · Cell wall</span>
      <span><i style="background:var(--f-red)"></i>Stain · Heat · Light</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">2.1</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 2: THE INVISIBLE LIVING WORLD — BEYOND OUR NAKED EYE
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Living things are always moving — cilia beat, amoebae
   crawl, yeast buds, bacteria divide — never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-2 HELPERS — seeded random, eyepiece field, microscope,
       living organisms (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }

/* circular field of view. blur = optical defocus in px */
function eyepiece(ctx,cx,cy,R,blur,draw,dark){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#f9fbfd'; ctx.fill(); ctx.clip();
  if(blur>0.3) ctx.filter='blur('+Math.min(14,blur).toFixed(1)+'px)';
  draw();
  ctx.filter='none';
  if(dark>0){ ctx.fillStyle='rgba(15,38,64,'+(0.92*dark).toFixed(3)+')'; ctx.fillRect(cx-R,cy-R,2*R,2*R); }
  ctx.restore();
  ctx.save(); const g=ctx.createRadialGradient(cx,cy,R*0.72,cx,cy,R); g.addColorStop(0,'rgba(19,42,68,0)'); g.addColorStop(1,'rgba(19,42,68,0.22)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill(); ctx.restore();
  circ(ctx,cx,cy,R+4,COL.ink,null,6);
}
function scaleBar(ctx,x,y,pxPerUm){
  const nice=[0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000];
  let L=nice[0]; for(const n of nice){ if(n*pxPerUm<=100) L=n; }
  const px=L*pxPerUm;
  line(ctx,x-px/2,y,x+px/2,y,COL.ink,2.4); line(ctx,x-px/2,y-5,x-px/2,y+5,COL.ink,2); line(ctx,x+px/2,y-5,x+px/2,y+5,COL.ink,2);
  textAt(ctx,(L>=1000?(L/1000)+' mm':L+' µm'),x,y-8,{align:'center',size:11,weight:700,color:COL.ink});
}
/* leader-line label outside a field */
function tag(ctx,px,py,tx,ty,txt,col){
  const W=ctx.canvas._w||800;
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const right=tx>px; let bx=right?tx+4:tx-tw-12;
  if(bx+tw+10>W-4) bx=W-tw-14;
  line(ctx,px,py,right?bx:bx+tw+8,ty,col,1.6); circ(ctx,px,py,3,col,col,1);

  rrect(ctx,X(8),Y(122),40*s,8*s,2*s); ctx.fill(); ctx.stroke();
  const sx=st.stage||0;

/* bread mould: branching hyphae + sporangia. g = growth 0→1 */
function mouldNet(seed){
  const R=rng(seed), seg=[];
  function grow(x,y,a,len,d,t0){ const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len; seg.push({x,y,x2,y2,t0,t1:t0+0.18,d});
    if(d<4){ grow(x2,y2,a+(R()-0.5)*0.9,len*(0.75+R()*0.3),d+1,t0+0.18); if(R()<0.75) grow(x2,y2,a+(R()<0.5?-1:1)*(0.5+R()*0.6),len*0.7,d+1,t0+0.22); } }
  for(let i=0;i<5;i++) grow((R()-0.5)*80,(R()-0.5)*80,i/5*Math.PI*2+R(),70,0,R()*0.1);
  return seg;
}
function orgMould(ctx,seg,x,y,k,g,t){
  ctx.save(); ctx.translate(x,y); ctx.lineCap='round';
  seg.forEach(s=>{ const u=clamp((g-s.t0)/(s.t1-s.t0),0,1); if(u<=0) return;
    const ex=lerp(s.x,s.x2,u), ey=lerp(s.y,s.y2,u);
    ctx.strokeStyle=COL.ink; ctx.lineWidth=Math.max(1.4,5*k); ctx.beginPath(); ctx.moveTo(s.x*k,s.y*k); ctx.lineTo(ex*k,ey*k); ctx.stroke();
    ctx.strokeStyle='#fdfefe'; ctx.lineWidth=Math.max(0.4,5*k-2.4); ctx.stroke();
    if(s.d===4 && u>=1){ // sporangiophore + sporangium
      const sg=clamp((g-s.t1)/0.15,0,1); if(sg<=0) return;
      const r=14*k*sg; circ(ctx,s.x2*k,s.y2*k,r,COL.ink,'#e3e8ef',lw(k,3));
      for(let j=0;j<7;j++){ const aa=j*0.9+t*0.2; circ(ctx,s.x2*k+Math.cos(aa)*r*0.5,s.y2*k+Math.sin(aa)*r*0.5,Math.max(0.6,1.8*k*sg),COL.ink,COL.ink,1); }
    }
  });
  ctx.restore();
}
/* keep a swimmer inside an ellipse; heading random-walks */
function swim(o,dt,sp,turn,rx,ry){
  o.a+=gauss()*turn*Math.sqrt(dt);
  o.x+=Math.cos(o.a)*sp*dt; o.y+=Math.sin(o.a)*sp*dt;
  const e=(o.x*o.x)/(rx*rx)+(o.y*o.y)/(ry*ry);
  if(e>1){ const f=1/Math.sqrt(e); o.x*=f; o.y*=f; o.a=Math.atan2(-o.y,-o.x)+gauss()*0.6; }
}

/* =====================================================================
   2.1 THE MAGNIFYING LENS
   Thin-lens formula (Cartesian):  1/v − 1/u = 1/f,  m = v/u
   With d = lens-to-object distance:  v = f·d/(d − f),  m = f/(f − d)
   Textbook check: f = 5 cm, d = 4 cm → m = 5 (upright, virtual).
   A water-filled round flask is a ball lens: f ≈ n·r / 2(n − 1) ≈ 2r.
   ===================================================================== */
function drawAnt(ctx,x,y,L,t,ang,walk){

    for(const s of [-1,1]){

      const kx=ax+(i-1)*L*0.12+sw*0.4, ky=s*L*0.2, fx=ax+(i-1)*L*0.26+sw, fy=s*L*(0.36-0.03*Math.max(0,Math.cos(phase)));
      line(ctx,ax,0,kx,ky,COL.ink,w); line(ctx,kx,ky,fx,fy,COL.ink,w);
      if(L>160) for(let q=1;q<4;q++){ const hx=lerp(kx,fx,q/4), hy=lerp(ky,fy,q/4); line(ctx,hx,hy,hx+L*0.015,hy+s*L*0.012,COL.mid,1); }
    }
  }
  ctx.lineWidth=w*1.3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-L*0.3,0,L*0.2,L*0.13,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-L*0.08,0,L*0.035,L*0.035,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(L*0.05,0,L*0.11,L*0.06,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(L*0.26,0,L*0.09,L*0.08,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  if(L>90){ // detail only visible when magnified: gaster bands, hairs, compound eye, mandibles

    for(let q=0;q<10;q++){ const aa=Math.PI*0.6+q*0.18; const hx=-L*0.3+Math.cos(aa)*L*0.2, hy=Math.sin(aa)*L*0.13; line(ctx,hx,hy,hx+Math.cos(aa)*L*0.03,hy+Math.sin(aa)*L*0.03,COL.mid,1); line(ctx,hx,-hy,hx+Math.cos(aa)*L*0.03,-hy-Math.sin(aa)*L*0.03,COL.mid,1); }

const PAPER=(()=>{ const R=rng(7), a=[]; for(let i=0;i<120;i++){ const x=(R()-0.5)*60, y=(R()-0.5)*60, an=R()*Math.PI; a.push([x,y,x+Math.cos(an)*(1+R()*3),y+Math.sin(an)*(1+R()*3)]); } return a; })();

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Lens</label>
      <div class="toggle-group" id="lensB"><button class="toggle-btn active" data-f="5">Hand lens</button><button class="toggle-btn" data-f="8">Water flask</button></div>
      <div class="hint" id="fH">f = 5 cm</div></div>
    <div class="control-group"><label>Lens → object <span class="val" id="dV"></span></label><input type="range" id="dR" min="1" max="14" step="0.1" value="3"></div>
    <div class="control-group"><label style="margin-bottom:6px;">Look at</label>
      <div class="toggle-group" id="spB"><button class="toggle-btn active" data-s="ant">Ant</button><button class="toggle-btn" data-s="leaf">Leaf</button><button class="toggle-btn" data-s="print">Print</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Magnification</div><div class="rval" id="mV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Image</div><div class="rval" id="iV">—</div></div></div>
      <p class="hint">m = f ÷ (f − d)</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), dR=$('#dR');
  let f=5, flask=false, spec='ant', t=0;
  const D={x:3,v:0}, F={x:5,v:0}, cam={x:0,y:0};
  toggleWire(wrap.querySelectorAll('#lensB button'),b=>{ f=+b.dataset.f; flask=f===8; $('#fH').textContent=flask?'r = 4 cm → f ≈ 2r = 8 cm':'f = 5 cm'; });
  toggleWire(wrap.querySelectorAll('#spB button'),b=>spec=b.dataset.s);

  function antPos(tt){ return {x:13*Math.sin(tt*0.22), y:8*Math.sin(tt*0.44)}; }
  function drawSpec(ctx,cx,cy,sc,cx0,cy0,inv){
    const X=wx=>cx+(wx-cx0)*sc, Y=wy=>cy+(wy-cy0)*sc;
    ctx.save(); if(inv){ ctx.translate(cx,cy); ctx.rotate(Math.PI); ctx.translate(-cx,-cy); }
    ctx.strokeStyle='#dde5ee'; ctx.lineWidth=Math.max(0.6,sc*0.12); ctx.beginPath();
    PAPER.forEach(p=>{ ctx.moveTo(X(p[0]),Y(p[1])); ctx.lineTo(X(p[2]),Y(p[3])); }); ctx.stroke();
    if(spec==='ant'){
      const p=antPos(t), q=antPos(t+0.05);
      drawAnt(ctx,X(p.x),Y(p.y),5*sc,t,Math.atan2(q.y-p.y,q.x-p.x));
    } else if(spec==='leaf'){
      ctx.save(); ctx.beginPath(); ctx.ellipse(X(0),Y(0),30*sc,19*sc,0,0,Math.PI*2); ctx.fillStyle='#f3fbf5'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=Math.max(1.4,0.5*sc); ctx.stroke(); ctx.clip();
      line(ctx,X(-30),Y(0),X(30),Y(0),COL.green,Math.max(1.6,0.7*sc));
      LEAFV.a.forEach(v=>{ for(const s of [-1,1]) line(ctx,X(v.x0),Y(0),X(v.x0+Math.cos(v.ang)*v.len*0.6*s*-1),Y(s*Math.abs(Math.sin(v.ang))*v.len),COL.green,Math.max(1,0.35*sc)); });
      if(sc>9){ ctx.strokeStyle=COL.green; ctx.lineWidth=Math.max(0.8,0.12*sc); ctx.beginPath(); LEAFV.net.forEach(p=>{ ctx.moveTo(X(p[0]),Y(p[1])); ctx.lineTo(X(p[2]),Y(p[3])); }); ctx.stroke(); }
      ctx.restore();
    } else {
      const fs=2.6*sc; ctx.save(); ctx.font='600 '+fs+'px Georgia, serif'; ctx.fillStyle=COL.ink; ctx.textAlign='center';
      ['The invisible living','world around us is','full of tiny life.'].forEach((s,i)=>ctx.fillText(s,X(0),Y(-4+i*4.4)));
      ctx.restore();
      if(sc>8){ const R=rng(3); ctx.fillStyle='rgba(19,42,68,0.35)'; for(let i=0;i<220;i++){ const x=(R()-0.5)*40, y=(R()-0.5)*14-0.5; ctx.fillRect(X(x),Y(y),Math.max(1,0.08*sc),Math.max(1,0.08*sc)); } }
    }
    ctx.restore();
  }

  animLoop((dt)=>{
    t+=dt;
    const dT=parseFloat(dR.value); $('#dV').textContent=fmt(dT,1)+' cm';
    springTo(D,dT,40,11,dt); springTo(F,f,30,10,dt);
    const d=Math.max(0.4,D.x), ff=F.x, near=Math.abs(d-ff)<0.12;
    const m=near?Infinity:ff/(ff-d), v=near?Infinity:ff*d/(d-ff);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---- ray diagram ---- */
    const ay=h*0.26, Lx=w*0.6, pc=(Lx-w*0.05)/15, hO=Math.min(34,h*0.07), lh=Math.min(h*0.26,170);
    line(ctx,w*0.02,ay,w*0.985,ay,COL.mid,1.2,[6,5]);
    if(flask){
      const r=Math.min(4*pc,lh*0.45);
      ctx.save(); ctx.beginPath(); ctx.arc(Lx,ay,r,0,Math.PI*2); ctx.fillStyle='rgba(47,143,224,0.1)'; ctx.fill(); ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(Lx,ay,r,-Math.PI/2+0.25,-Math.PI/2-0.25+Math.PI*2); ctx.stroke();
      const nx=Math.sin(0.25)*r; ctx.beginPath(); ctx.moveTo(Lx-nx,ay-Math.cos(0.25)*r); ctx.lineTo(Lx-nx,ay-r-26); ctx.moveTo(Lx+nx,ay-Math.cos(0.25)*r); ctx.lineTo(Lx+nx,ay-r-26); ctx.stroke(); ctx.restore();

    } else {
      const th=12;
      ctx.save(); ctx.beginPath(); ctx.moveTo(Lx,ay-lh/2); ctx.quadraticCurveTo(Lx+th*2,ay,Lx,ay+lh/2); ctx.quadraticCurveTo(Lx-th*2,ay,Lx,ay-lh/2);
      ctx.fillStyle='rgba(47,143,224,0.1)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.lineCap='round'; line(ctx,Lx,ay+lh/2,Lx,ay+lh/2+18,COL.ink,9); line(ctx,Lx,ay+lh/2+2,Lx,ay+lh/2+18,'#fff',4); ctx.restore();
    }
    [-1,1].forEach(sg=>{ const fx=Lx+sg*ff*pc; circ(ctx,fx,ay,3.2,COL.ink,COL.ink,1); textAt(ctx,'F',fx,ay+17,{align:'center',size:12,weight:700}); });
    const ox=Lx-d*pc, tipY=ay-hO;
    // object (yellow — you move it)
    vec(ctx,ox,ay,ox,tipY,COL.yellow,3);
    drawAnt(ctx,ox,tipY-10,18,t,0,false);
    // ray 1: parallel → through far focus (red); ray 2: through the centre (blue)
    const far=w*1.02;
    line(ctx,ox,tipY,Lx,tipY,COL.red,2); arrowHead(ctx,(ox+Lx)/2,tipY,0,COL.red,7);
    const d1x=ff*pc, d1y=hO, s1=(far-Lx)/d1x; line(ctx,Lx,tipY,Lx+d1x*s1,tipY+d1y*s1,COL.red,2);
    const d2x=Lx-ox, d2y=hO, s2=(far-ox)/d2x; line(ctx,ox,tipY,ox+d2x*s2,tipY+d2y*s2,COL.blue,2);
    if(!near){
      const ix=clamp(Lx+v*pc,-4000,4000), ih=clamp(m*hO,-3000,3000);
      if(v<0){
        line(ctx,Lx,tipY,ix,ay-ih,COL.red,1.4,[5,4]); line(ctx,ox,tipY,ix,ay-ih,COL.blue,1.4,[5,4]);
        line(ctx,ix,ay,ix,ay-ih,COL.blue,3,[8,4]); arrowHead(ctx,ix,ay-ih,-Math.PI/2,COL.blue,9);
        if(ix>w*0.03) textAt(ctx,'image',ix+6,ay-ih/2,{size:11,weight:700,color:COL.blue});
      } else {
        vec(ctx,ix,ay,ix,ay-ih,COL.blue,3);
        if(ix<w*0.97) textAt(ctx,'image',ix+6,ay-ih/2,{size:11,weight:700,color:COL.blue});
      }
    }
    // eye
    const ex=w*0.955, ey=ay;
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(ex+22,ey); ctx.quadraticCurveTo(ex,ey-18,ex-16,ey); ctx.quadraticCurveTo(ex,ey+18,ex+22,ey); ctx.stroke(); ctx.restore();
    circ(ctx,ex-4,ey,6,COL.ink,'#fff',2); circ(ctx,ex-6,ey,2.4,COL.ink,COL.ink,1);
    // distance dimension (yellow)
    const dy=ay+lh/2+34;
    line(ctx,ox,dy,Lx,dy,COL.yellow,1.6); arrowHead(ctx,ox,dy,Math.PI,COL.yellow,6); arrowHead(ctx,Lx,dy,0,COL.yellow,6);
    textAt(ctx,'d = '+fmt(d,1)+' cm',(ox+Lx)/2,dy-6,{align:'center',size:12,weight:700,color:COL.yellow});

    /* ---- what the eye sees ---- */
    const R2=Math.min(h*0.2,w*0.19), R1=R2*0.78, vy=h-R2-30;
    const c1x=w*0.17, c2x=w*0.6;
    const s0=R1/17;
    const p=spec==='ant'?antPos(t):{x:10*Math.sin(t*0.18),y:5*Math.sin(t*0.3)};
    cam.x=approach(cam.x,p.x,spec==='ant'?3:6,dt); cam.y=approach(cam.y,p.y,spec==='ant'?3:6,dt);
    const mag=near?25:clamp(Math.abs(m),0.2,25), sL=s0*mag;
    const blur=near?9:(m<0?clamp((d-ff)*1.3+1.5,0,9):0);
    eyepiece(ctx,c1x,vy,R1,0,()=>{
      drawSpec(ctx,c1x,vy,s0,0,0,false);
      circ(ctx,c1x+cam.x*s0,vy+cam.y*s0,R2/sL*s0,COL.blue,null,1.6);
    });
    textAt(ctx,'Naked eye  ×1',c1x,vy+R2+20,{align:'center',size:12,weight:700,color:COL.ink});
    eyepiece(ctx,c2x,vy,R2,blur,()=>drawSpec(ctx,c2x,vy,sL,cam.x,cam.y,m<0));
    line(ctx,c1x+R1+14,vy,c2x-R2-18,vy,COL.blue,1.6,[5,4]); arrowHead(ctx,c2x-R2-14,vy,0,COL.blue,7);
    textAt(ctx,'Through lens  '+(near?'no clear image':(m<0?'upside-down, blurred':'×'+fmt(Math.abs(m),1))),c2x,vy+R2+20,{align:'center',size:12,weight:700,color:COL.blue});

    $('#mV').textContent=near?'∞':'×'+fmt(Math.abs(m),1);
    $('#iV').textContent=near?'None':(m>0?'Upright':'Inverted');
  });
  return wrap;
}

function stepperSide(names){
  return `<div class="control-group"><div class="step-row" id="steps">${names.map((s,i)=>`<button class="step-pill${i?'':' active'}" data-s="${i}">${i+1} ${s}</button>`).join('')}</div>
    <button class="toggle-btn play" id="act" style="width:100%;margin-top:9px;padding:9px;">▶</button></div>`;
}
function stepper(wrap,names,acts,onGo){
  const st={i:0,done:names.map(()=>false),run:false,t:0};
  const pills=[...wrap.querySelectorAll('#steps .step-pill')], act=wrap.querySelector('#act');
  function paint(){
    pills.forEach((p,i)=>{ p.classList.toggle('active',i===st.i); p.classList.toggle('done',st.done[i]); p.textContent=(st.done[i]?'✓ ':(i+1)+' ')+names[i]; });
    const last=st.i===names.length-1;
    act.disabled=st.run||(last&&st.done[st.i]);
    act.textContent= st.run? '⏳ '+acts[st.i]+'…' : st.done[st.i]? (last?'✓ Done':'Next step →') : '▶ '+acts[st.i];
    wrap.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('hidden', !el.dataset.step.split(',').includes(String(st.i))));
  }
  pills.forEach((p,i)=>p.onclick=()=>{ st.i=i; st.run=false; st.t=0; paint(); if(onGo) onGo(i,false); });
  act.onclick=()=>{
    if(st.run) return;
    if(st.done[st.i]){ if(st.i<names.length-1){ st.i++; st.t=0; paint(); if(onGo) onGo(st.i,false); } return; }
    st.run=true; st.t=0; paint(); if(onGo) onGo(st.i,true);
  };
  st.finish=()=>{ st.run=false; st.done[st.i]=true; paint(); };
  st.paint=paint; paint();
  return st;
}
function watchGlass(ctx,cx,y,W,liquid,surf,t){
  const D=W*0.16;
  ctx.save(); ctx.beginPath(); ctx.moveTo(cx-W/2,y); ctx.quadraticCurveTo(cx,y+2*D,cx+W/2,y); ctx.closePath(); ctx.clip();
  ctx.fillStyle=liquid; ctx.fillRect(cx-W/2,y+D*0.25,W,D*2); ctx.restore();
  ctx.save(); ctx.strokeStyle=surf; ctx.lineWidth=1.8; ctx.beginPath();
  for(let x=cx-W*0.43;x<=cx+W*0.43;x+=4){ const yy=y+D*0.25+Math.sin(x*0.05+t*3)*1.2; x===cx-W*0.43?ctx.moveTo(x,yy):ctx.lineTo(x,yy); } ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(cx-W/2,y); ctx.quadraticCurveTo(cx,y+2*D,cx+W/2,y); ctx.stroke(); ctx.restore();
  line(ctx,cx-W*0.52,y,cx+W*0.52,y,'#e6edf5',1);
  return y+D*0.25;
}
function peelShape(ctx,x,y,W,fill,stroke,t,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.beginPath();
  const n=18; for(let i=0;i<=n;i++){ const u=i/n; ctx.lineTo(-W/2+u*W, -3+Math.sin(u*6+t*2)*2); }
  for(let i=n;i>=0;i--){ const u=i/n; ctx.lineTo(-W/2+u*W, 3+Math.sin(u*6+t*2+0.5)*2); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
}
function forceps(ctx,tx,ty,open){
  const bx=tx+70, by=ty-110, g=open?5:1.2;
  ctx.save(); ctx.lineCap='round';
  line(ctx,bx,by,tx-g,ty,COL.ink,3.4); line(ctx,bx+8,by+3,tx+g,ty+1,COL.ink,3.4);
  line(ctx,bx,by,bx+8,by+3,COL.ink,5); ctx.restore();
}
/* coverslip lowering: hinge on the left edge, gravity torque α = g·cosθ.

function bubblesFor(a0){ return a0<30? Math.round((30-a0)/5)+1 : a0>70? Math.round((a0-70)/7)+1 : 0; }

function mountScene(ctx,w,h,M,st,dt,a0,liqCol,specCol,specStroke,t){

  if(st.run){ st.t+=dt; }
  const T=st.t, running=st.run, done=st.done[st.i];
  // glass slide (side view)
  rect(ctx,sx0,y0,sx1-sx0,9,COL.blue,'#eef6fe',2);
  line(ctx,sx0-20,y0+9,sx1+20,y0+9,COL.ink,2.6);

  const dropperY=running&&T<1.2||!done&&!running? dropTop : dropTop-lerp(0,h*0.25,smooth01(1.2,1.8,T));

    rect(ctx,dropX-6,dropperY-60,12,58,COL.ink,'#fff',2);
    ctx.save(); ctx.beginPath(); ctx.ellipse(dropX,dropperY-70,11,15,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();

  const lowered=1-th/(a0*Math.PI/180||1);
  if(M.phase>=1){ const fx=hx+len*clamp(lowered,0,1); ctx.save(); ctx.fillStyle=liqCol; ctx.fillRect(hx,y0-7,Math.max(0,fx-hx),7); ctx.restore(); }
  line(ctx,hx,y0-8,ex,ey,COL.blue,3.2);

  // angle arc (yellow = what you set)
  if(M.phase<2){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,y0-8,40,-th,0); ctx.stroke(); ctx.restore();
    textAt(ctx,Math.round(th*180/Math.PI)+'°',hx+46,y0-16,{size:12,weight:700,color:COL.yellow}); }

  const Rb=rng(11); for(let i=0;i<nb;i++){ const bx=cx+(Rb()-0.5)*cs*1.7, by=ty+(Rb()-0.5)*cs*0.7, br=4+Rb()*5; circ(ctx,bx,by,br,COL.ink,'#fff',2.4); circ(ctx,bx-br*0.3,by-br*0.3,br*0.25,COL.mid,null,1); if(M.phase===2) circ(ctx,lerp(hx,ex,0.3+i*0.12),y0-4,2.5,COL.ink,'#fff',1.4); }
  textAt(ctx,'top view',tx,ty-44,{size:11,color:COL.muted});
  if(running && M.phase===2 && T>2.6){ st.finish(); }

}
/* onion epidermis: brick-like cells (µm). returns list */
function onionCells(){
  const R=rng(5), cells=[];
  for(let r=-14;r<=14;r++){ const off=(r%2?130:0)+(R()-0.5)*60; for(let c=-6;c<=6;c++){
    const x0=c*260+off+(R()-0.5)*14, x1=x0+250+(R()-0.5)*30, y0=r*72, y1=y0+70;
    cells.push({x0,x1,y0,y1,nx:lerp(x0+40,x1-40,R()),ny:lerp(y0+22,y1-22,R()),g:R()*6}); } }
  return cells;
}
function onionField(ctx,cx,cy,k,stain,rinsed,t,cells,R){
  const wallC=mixCol('#aebccb','#a4331c',clamp(stain*1.1,0,1)), nucF=mixCol('#eef2f6','#b8321f',stain), nucS=mixCol('#8195ab','#7a1d0e',stain);
  const bg=clamp((stain-0.85)*4,0,0.7)*(rinsed?0.45:1)+(rinsed?0:stain*0.25);
  if(bg>0.01){ ctx.save(); ctx.fillStyle='rgba(217,67,43,'+(bg*0.5).toFixed(3)+')'; ctx.fillRect(cx-R,cy-R,2*R,2*R); ctx.restore(); }
  cells.forEach(c=>{
    const X0=cx+c.x0*k, X1=cx+c.x1*k, Y0=cy+c.y0*k, Y1=cy+c.y1*k;
    if(X1<cx-R||X0>cx+R||Y1<cy-R||Y0>cy+R) return;
    ctx.save(); ctx.strokeStyle=wallC; ctx.lineWidth=Math.max(1,3*k); ctx.strokeRect(X0,Y0,X1-X0,Y1-Y0);
    if(k>0.7){ ctx.lineWidth=1; ctx.strokeStyle=COL.yellow; ctx.strokeRect(X0+4*k,Y0+4*k,X1-X0-8*k,Y1-Y0-8*k); }
    ctx.restore();
    circ(ctx,cx+c.nx*k,cy+c.ny*k,11*k,nucS,nucF,Math.max(1,1.6*k));
    if(k>0.6) circ(ctx,cx+c.nx*k+3*k,cy+c.ny*k-2*k,3*k,nucS,nucS,1);
    // cytoplasmic streaming — granules circulate round the cell edge
    if(k>0.4) for(let j=0;j<4;j++){ const u=(t*0.03+j/4+c.g)%1, per=2*((c.x1-c.x0)+(c.y1-c.y0))-40, s=u*per; let gx,gy; const W=c.x1-c.x0-20, H=c.y1-c.y0-20;
      if(s<W){gx=c.x0+10+s; gy=c.y0+10;} else if(s<W+H){gx=c.x1-10; gy=c.y0+10+(s-W);} else if(s<2*W+H){gx=c.x1-10-(s-W-H); gy=c.y1-10;} else {gx=c.x0+10; gy=c.y1-10-(s-2*W-H);}
      circ(ctx,cx+gx*k,cy+gy*k,Math.max(0.8,2*k),COL.mid,COL.mid,1); }
  });
}
function bubbleField(ctx,cx,cy,k,n){
  const R=rng(17); for(let i=0;i<n;i++){ const bx=(R()-0.5)*1300, by=(R()-0.5)*900, br=70+R()*110;
    circ(ctx,cx+bx*k,cy+by*k,br*k,COL.ink,'rgba(255,255,255,0.85)',Math.max(2,br*k*0.16)); circ(ctx,cx+bx*k-br*k*0.3,cy+by*k-br*k*0.3,br*k*0.2,COL.mid,null,1.4); }
}
/* the "Look" step shared by 2.2 and 2.3 */
function scopeState(){ return {nose:{x:0,v:0}, tube:{x:0,v:0}, logk:Math.log(0.14), light:0}; }
function scopeStep(ctx,w,h,dt,t,SC,obj40,focus,lightOn,fieldFn,cx,cy,R,showScope){
  springTo(SC.nose,obj40?1:0,40,10,dt);
  springTo(SC.tube,(focus-50)*0.55,60,13,dt);
  SC.light=approach(SC.light,lightOn?1:0,4,dt);
  const k=R/((obj40?450:1800)/2);
  SC.logk=approach(SC.logk,Math.log(k),5,dt);
  const kk=Math.exp(SC.logk);
  if(showScope!==false) drawMicroscope(ctx,w*0.15,h*0.92,Math.min(h*0.74,w*0.5),{nose:SC.nose.x,tube:SC.tube.x,knob:focus*0.12,stage:0,light:SC.light,slideCol:'rgba(217,67,43,0.5)'},t);
  const blur=Math.abs(focus-60)*(obj40?0.22:0.09)+Math.abs(SC.nose.x-(obj40?1:0))*10;
  eyepiece(ctx,cx,cy,R,blur,()=>fieldFn(kk),1-SC.light);
  if(SC.light>0.5) scaleBar(ctx,cx,cy+R*0.8,kk);
  return {k:kk,blur};
}

/* =====================================================================
   2.2 ONION PEEL CELLS
   Stain uptake:  c(t) = 1 − e^(−t/τ),  τ = 0.8 min  (1 min ↔ 1 s)
   Rinsing removes loose dye; bound dye stays in walls & nuclei.
   Field of view: 10× objective ≈ 1.8 mm across, 40× ≈ 0.45 mm.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  const NAMES=['Peel','Stain','Rinse','Mount','Look'], ACTS=['Peel','Dip in safranin','Rinse in water','Mount','Light on'];
  wrap.querySelector('.lab-side').innerHTML = stepperSide(NAMES)+`
    <div class="control-group" data-step="1"><label>Stain time <span class="val" id="stV"></span></label><input type="range" id="stR" min="0.3" max="6" step="0.1" value="1.5"></div>
    <div class="control-group" data-step="3"><label>Coverslip angle <span class="val" id="anV"></span></label><input type="range" id="anR" min="5" max="90" step="1" value="45"></div>
    <div class="control-group" data-step="4"><label style="margin-bottom:6px;">Objective</label>
      <div class="toggle-group" id="obB"><button class="toggle-btn active" data-o="10">10×</button><button class="toggle-btn" data-o="40">40×</button></div>
      <label style="margin-top:10px;">Focus knob <span class="val" id="foV"></span></label><input type="range" id="foR" min="0" max="100" value="20">
      <label style="margin-top:10px;">Labels</label>
      <div class="toggle-group" id="lbB"><button class="toggle-btn active" data-l="0">Off</button><button class="toggle-btn" data-l="1">On</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Stain taken up</div><div class="rval" id="r1" style="color:var(--f-red)">0%</div></div>
      <div class="rcard"><div class="rlabel">Air bubbles</div><div class="rval" id="r2">—</div></div>
      <div class="rcard"><div class="rlabel">Magnification</div><div class="rval" id="r3">—</div></div>
      <div class="rcard"><div class="rlabel">Image</div><div class="rval" id="r4" style="color:var(--f-blue)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), stR=$('#stR'), anR=$('#anR'), foR=$('#foR');
  let obj40=false, labels=false, t=0;
  toggleWire(wrap.querySelectorAll('#obB button'),b=>obj40=b.dataset.o==='40');
  toggleWire(wrap.querySelectorAll('#lbB button'),b=>labels=b.dataset.l==='1');
  const S={peel:0, stain:0, rinsed:false, loose:0, bubbles:0, dip:{x:0,v:0}, dye:[], M:mountState(), SC:scopeState()};
  const cells=onionCells();
  const st=stepper(wrap,NAMES,ACTS,(i,run)=>{

  function scenePeel(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>3.4) st.finish(); }

    ctx.fillStyle='#fbf7fb'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    for(let i=1;i<4;i++){ ctx.save(); ctx.beginPath(); ctx.arc(Cx,Cy,Ri+T*i/4,a1+0.03,a0-0.03); ctx.strokeStyle='#e3d7e6'; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); }
    const ad=lerp(a0,a1,p), pc='#b17aa0';
    ctx.save(); ctx.beginPath(); ctx.arc(Cx,Cy,Ri-1.5,a1,ad); ctx.strokeStyle=pc; ctx.lineWidth=3.2; ctx.stroke(); ctx.restore();
    const Px=Cx+Math.cos(ad)*(Ri-1.5), Py=Cy+Math.sin(ad)*(Ri-1.5);
    const Lx0=Cx+Math.cos(a0)*(Ri-1.5), Ly0=Cy+Math.sin(a0)*(Ri-1.5);
    let fx,fy;
    if(!st.run && !st.done[0]){ fx=Lx0+30; fy=Ly0-70+Math.sin(t*2)*6; }
    else if(st.run && st.t<0.7){ const u=smooth01(0,0.7,st.t); fx=lerp(Lx0+30,Lx0,u); fy=lerp(Ly0-70,Ly0-2,u); }
    else { fx=lerp(Lx0,Cx-Ro*0.05,p); fy=lerp(Ly0-2,h*0.22,p)+(p>=1?Math.sin(t*2.2)*4:0); fx+=p>=1?Math.sin(t*1.6)*6:0; }
    if(p>0){ ctx.save(); ctx.beginPath(); ctx.moveTo(Px,Py); ctx.quadraticCurveTo((Px+fx)/2-10,Math.max(Py,fy)+30*(1-p*0.5),fx,fy); ctx.strokeStyle=pc; ctx.lineWidth=3.2; ctx.stroke(); ctx.restore(); }
    forceps(ctx,fx,fy,!(st.run&&st.t>0.6)&&!st.done[0]);
    textAt(ctx,'onion scale leaf',Cx,Cy+Ro+22,{align:'center',size:12,color:COL.muted});
    textAt(ctx,'thin peel',Px+14,Py-14,{size:12,weight:700,color:pc,alpha:p>0.1?1:0});
  }
  function sceneDish(ctx,w,h,dt,red){
    const stainMin=parseFloat(stR.value);
    const dur=red? 0.8+stainMin : 3.2;
    if(st.run){ st.t+=dt; if(st.t>dur+0.9) st.finish(); }
    const cx=w*0.46, y=h*0.56, W=Math.min(w*0.5,440);

    S.dye=S.dye.filter(d=>{ d.life+=dt; if(d.in){ d.x=lerp(d.x,d.tx+(Math.random()-0.5)*40,dt*2.5); d.y=lerp(d.y,d.ty,dt*2.5); if(d.life>1.2) return false; }
      else { d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.98; if(d.life>2.5) return false; }

    const col=mixCol('#f3e8ef','#b8321f',red?S.stain:clamp(S.stain*0.75+S.loose*0.25,0,1));
    peelShape(ctx,px,py,W*0.34,col,'#8e2a18',t,Math.sin(t*1.3)*0.03);
    forceps(ctx,px+W*0.17-4,py-2,false);
    // timer ring (sim minutes)
    if(st.run && red){ const rx=cx+W/2+40, ry=h*0.2, u=clamp((st.t-0.3)/stainMin,0,1);
      circ(ctx,rx,ry,18,'#e6edf5',null,4); ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(rx,ry,18,-Math.PI/2,-Math.PI/2+Math.PI*2*u); ctx.stroke(); ctx.restore();
      textAt(ctx,fmt(u*stainMin,1)+' min',rx,ry+4,{align:'center',size:10,weight:700}); }
    textAt(ctx,red?'safranin':'water',cx,y+W*0.34+14,{align:'center',size:12,weight:700,color:red?COL.red:COL.blue});
  }
  function sceneLook(ctx,w,h,dt){
    if(st.run){ st.t+=dt; if(st.t>0.8) st.finish(); }

    else if(st.i===2){ sceneDish(ctx,w,h,dt,false); if(st.done[2]) S.rinsed=true; }

/* =====================================================================
   2.3 CHEEK CELLS
   Methylene blue binds the nucleus: c(t) = 1 − e^(−t/τ), τ = 0.4 min.
   Drop spreads on glass: r(t) = r₀·√(1 + t/τs).
   ===================================================================== */
function cheekCells(){
  const R=rng(31), a=[];
  for(let i=0;i<34;i++){ const n=7+Math.floor(R()*3), pts=[]; const r0=28+R()*8;
    for(let j=0;j<n;j++){ const th=j/n*Math.PI*2+R()*0.3; pts.push([Math.cos(th)*r0*(0.8+R()*0.35), Math.sin(th)*r0*(0.8+R()*0.35)]); }
    a.push({x:(R()-0.5)*1500,y:(R()-0.5)*1100,rot:R()*6,pts,nx:(R()-0.5)*8,ny:(R()-0.5)*8,fold:R()<0.3}); }
  for(let i=0;i<60;i++){ const n=7, pts=[]; const r0=30; for(let j=0;j<n;j++){ const th=j/n*Math.PI*2+R()*0.3; pts.push([Math.cos(th)*r0*(0.8+R()*0.35), Math.sin(th)*r0*(0.8+R()*0.35)]); }
    const c=a[Math.floor(R()*20)]; a.push({x:c.x+(R()-0.5)*260,y:c.y+(R()-0.5)*200,rot:R()*6,pts,nx:(R()-0.5)*8,ny:(R()-0.5)*8,fold:R()<0.3}); }
  return a;
}
function cheekField(ctx,cx,cy,k,stain,t,cells){
  cells.forEach((c,i)=>{
    const dx=Math.sin(t*0.3+i)*4, dy=Math.cos(t*0.23+i*1.7)*4;   // gentle drift in the liquid
    const X=cx+(c.x+dx)*k, Y=cy+(c.y+dy)*k;
    ctx.save(); ctx.translate(X,Y); ctx.rotate(c.rot+Math.sin(t*0.1+i)*0.05); ctx.beginPath();
    c.pts.forEach((p,j)=>{ const q=c.pts[(j+1)%c.pts.length]; const mx=(p[0]+q[0])/2*k, my=(p[1]+q[1])/2*k; j?ctx.quadraticCurveTo(p[0]*k,p[1]*k,mx,my):ctx.moveTo(mx,my); });
    ctx.closePath(); ctx.fillStyle=mixCol('#fbfdff','#e1eefb',stain); ctx.fill(); ctx.strokeStyle=mixCol('#b6c3d1',COL.yellow,0.55); ctx.lineWidth=Math.max(1,1.6*k); ctx.stroke();
    if(c.fold){ ctx.beginPath(); ctx.moveTo(c.pts[0][0]*k*0.7,c.pts[0][1]*k*0.7); ctx.quadraticCurveTo(0,0,c.pts[3][0]*k*0.7,c.pts[3][1]*k*0.7); ctx.strokeStyle='#c9d3de'; ctx.lineWidth=1; ctx.stroke(); }
    circ(ctx,c.nx*k,c.ny*k,6*k,mixCol('#aebccb','#1d5fa0',stain),mixCol('#eef2f6','#5d9fe0',stain),Math.max(1,1.4*k));
    ctx.restore();
  });
}
function buildA3(){
  const wrap=labShell();
  const NAMES=['Scrape','Smear','Stain','Mount','Look'], ACTS=['Scrape cheek','Smear on slide','Add methylene blue','Mount','Light on'];
  wrap.querySelector('.lab-side').innerHTML = stepperSide(NAMES)+`
    <div class="control-group" data-step="3"><label>Coverslip angle <span class="val" id="anV"></span></label><input type="range" id="anR" min="5" max="90" step="1" value="45"></div>
    <div class="control-group" data-step="4"><label style="margin-bottom:6px;">View</label>
      <div class="toggle-group" id="vwB"><button class="toggle-btn active" data-v="cheek">Cheek</button><button class="toggle-btn" data-v="both">Cheek vs Onion</button></div>
      <label style="margin-top:10px;">Objective</label>

      <label style="margin-top:10px;">Focus knob <span class="val" id="foV"></span></label><input type="range" id="foR" min="0" max="100" value="25"></div>
    <div class="control-group" data-step="4"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Cell wall</div><div class="rval" id="c1">—</div></div>
      <div class="rcard"><div class="rlabel">Shape</div><div class="rval" id="c2">—</div></div></div></div>
    <div class="control-group"><div class="result-cards">

      <div class="rcard"><div class="rlabel">Nucleus stain</div><div class="rval" id="r2" style="color:var(--f-blue)">0%</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
