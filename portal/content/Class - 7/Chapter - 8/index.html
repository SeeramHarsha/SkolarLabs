<style>

  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;

  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);

}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);

}
.topbar .brand-badge{

  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}

  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}

.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}

.step-pill.done{border-color:var(--f-green); color:var(--f-green);}

.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}

.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}

.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){

}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 8: MEASUREMENT OF TIME AND MOTION
   Activities 8.1 – 8.4 (NCERT Curiosity, gecu108). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS. Water
   drips from a pin hole by Torricelli's law (so the minute marks crowd
   together), a pendulum swings by the full θ″ = −(g/L)·sinθ equation with
   air drag, a quartz second hand steps and rings once a second, and a
   train accelerates, cruises and brakes between two stations.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

/* =====================================================================
   8.1 LET US CONSTRUCT — a water clock from a 1 L bottle cut in two

   → 5 cm of straight wall; filled to 12 cm above the pin hole (362 mL).
   Torricelli:  Q = Cd·a·√(2gh),  dh/dt = −Q / A(h),  Cd = 0.62.
   A 1 mm hole empties it in ≈ 11 min; the lower half (r 4 cm) rises

   ===================================================================== */
function buildA1(){

    <div class="control-group"><label>Watch speed</label><div class="toggle-group" id="spd">
      <button class="toggle-btn" data-k="1">×1</button><button class="toggle-btn active" data-k="10">×10</button><button class="toggle-btn" data-k="30">×30</button></div></div>
    <div class="control-group"><label>Use your clock</label>
      <div class="toggle-group"><button class="toggle-btn" id="back" disabled>↶ Pour water back</button><button class="toggle-btn" id="clr">↺ Start over</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Watch',COL.green)}${card('k2','Minutes marked',COL.yellow)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','Flow now',COL.blue)}${card('k4','Your clock reads',COL.green)}</div>
      <div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX=18, TABLE=478, g=981, GP=981*16, Cd=0.62, H0=12, LR=4, LH=17, LA=Math.PI*LR*LR;
  const rOf=h=>h<2?1.4:(h<8?1.4+(h-2)/6*2.6:4);
  const VT=[0]; for(let i=1;i<=1300;i++){ const y=(i-0.5)/100; VT.push(VT[i-1]+Math.PI*rOf(y)**2*0.01); }
  const Vof=h=>{ const x=clamp(h*100,0,1299.999), i=Math.floor(x); return VT[i]+(VT[i+1]-VT[i])*(x-i); };

function buildA2(){

      <label style="margin-top:8px">Bob</label><div class="toggle-group" id="bob">

    <div class="control-group"><label>Pull aside by <span class="val" id="av">10°</span></label><input type="range" id="amp" min="4" max="30" step="1" value="10">
      <div class="toggle-group"><button class="toggle-btn play" id="rel">✋ Pull aside &amp; release</button></div>

    line(ctx,P.x,P.y,P.x,P.y+len+br+18,rgba(COL.mid,0.6),1.2,[3,5]);

    textAt(ctx,'O',P.x,P.y+len+br+32,{align:'center',size:13,weight:700,color:COL.muted});
    // length dimension (yellow: what you set)
    const dx=P.x-Math.max(60,Math.sin(curAmp)*len+br+26); dimArrow(ctx,dx,P.y,P.y+L,COL.yellow);
    textAt(ctx,Lcm+' cm',dx-8,P.y+L/2+4,{align:'right',size:13,weight:700,color:mixCol(COL.yellow,COL.ink,0.2)});
    // string + bob
    const bx=P.x+Math.sin(th)*len, by=P.y+Math.cos(th)*len;
    line(ctx,P.x,P.y,P.x+Math.sin(th)*(len-br),P.y+Math.cos(th)*(len-br),COL.ink,1.8); circ(ctx,P.x,P.y,3.5,COL.ink,'#fff',2);
    ctx.save(); ctx.translate(bx,by); ctx.rotate(-th);
    circ(ctx,0,0,br,COL.red,b.rho<1000?'#fff6ea':'#fff',2.8);
    if(b.rho<1000){ for(let k=1;k<=3;k++) circ(ctx,br*0.15,br*0.1,br*k/4.2,rgba(COL.red,0.35),null,1); }
    else { ctx.save(); ctx.strokeStyle=rgba(COL.red,0.5); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,br*0.62,Math.PI*1.1,Math.PI*1.45); ctx.stroke(); ctx.restore(); }
    line(ctx,0,-br,0,-br-5,COL.ink,2); ctx.restore();
    textAt(ctx,Math.round(b.m*1000)+' g',bx+(th>0?br+8:-br-8),by-br-2,{align:th>0?'left':'right',size:11,weight:700,color:COL.red,alpha:0.85});
    // motion trail (velocity arrow, green)
    if(phase==='swing'&&Math.abs(om)>0.05){ const v=om*len*0.35, tx=Math.cos(th), ty=-Math.sin(th); vec(ctx,bx,by,bx+tx*v,by+ty*v,COL.green,2.4); }
    // hand
    pinchHand(ctx,bx+br*0.6,by,0,hand.a,1);
    // ---------- stopwatch + counter ----------
    const shownT=tm.state==='run'?tm.t+tm.e1*0:(tm.state==='done'?tm.shown:0);

    if(tm.state==='run'||tm.state==='done'){ for(let k=0;k<10;k++){ const x=578+k*16, on=k<tm.n; circ(ctx,x,250,5.5,on?COL.green:COL.mid,on?COL.green:'#fff',1.6); } }
    // T vs length graph

    ctx.save(); ctx.strokeStyle=rgba(COL.blue,0.8); ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.beginPath(); for(let l=2;l<=150;l+=2){ const T=2*Math.PI*Math.sqrt((l/100+0.02)/g); l===2?ctx.moveTo(A.X(l),A.Y(T)):ctx.lineTo(A.X(l),A.Y(T)); } ctx.stroke(); ctx.restore();
    rows.forEach(r=>{ const hv=r.b.startsWith('Wood'); if(hv) circ(ctx,A.X(r.L),A.Y(r.T),4.5,COL.green,'#fff',2); else circ(ctx,A.X(r.L),A.Y(r.T),4,COL.green,COL.green,1); });
    const lx=A.X(Lcm); line(ctx,lx,A.Y(0),lx,A.Y(3),rgba(COL.yellow,0.7),1.4,[3,3]);

    let msg=''; const same=rows.filter(r=>r.L===Lcm);
    if(same.length>=2){ const ts=same.map(r=>r.T), sp=Math.max(...ts)-Math.min(...ts), masses=new Set(same.map(r=>r.b));
      msg=masses.size>1?'ok|Same length, different bobs — the time period hardly changes.':'ok|Time period at '+Lcm+' cm is almost the same every time (±'+sp.toFixed(2)+' s).'; }
    const Ls2=new Set(rows.map(r=>r.L)); if(Ls2.size>=2&&!msg) msg='ok|Longer string → longer time period.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}

/* =====================================================================
   8.3 LET US IDENTIFY — the smallest interval a wall clock can measure
   A quartz wall clock's second hand is kicked forward 6° once every
   second by a stepper motor; the thin hand then rings on its spring
   (f ≈ 14 Hz, ζ ≈ 0.22) — visible in slow motion. Minute and hour hands
   creep with it (0.1° and 1/120° per step). Anything shorter than one
   step falls between two marks: a ball dropped from 1.2 m lands in
   t = √(2h/g) = 0.49 s, so the wall clock sees 0 or 1 tick, while a
   stopwatch reads 0.49 s.  A 1 m pendulum takes ≈ 2 s per oscillation.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Slow motion</label><div class="toggle-group" id="slow">
      <button class="toggle-btn active" data-k="1">1×</button><button class="toggle-btn" data-k="0.25">¼×</button><button class="toggle-btn" data-k="0.05">1/20×</button></div>
      <div class="toggle-group"><button class="toggle-btn active" id="lens">🔍 Magnify the tip</button></div></div>
    <div class="control-group"><label>Time a short event</label><div class="toggle-group" id="ev">
      <button class="toggle-btn active" data-e="0">Ball falls 1.2 m</button><button class="toggle-btn" data-e="1">1 m pendulum · 1 swing</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Go</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Wall clock saw',COL.blue)}${card('k2','Stopwatch reads',COL.green)}</div>
      <div class="result-cards" style="margin-top:6px">${card('k3','One step of the hand',COL.red)}${card('k4','Smallest interval',COL.green)}</div>
      <div id="tbl" style="margin-top:6px"></div>
      <div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const C={x:265,y:255}, R=210, W0=2*Math.PI*14, ZETA=0.22;
  const now=new Date(); let Tc=now.getHours()*3600+now.getMinutes()*60+now.getSeconds()+now.getMilliseconds()/1000;
  let slow=1, lens=true, ev=0, t=0, obsMsg='';
  const sh={x:Math.floor(Tc),v:0};  // second hand, in "steps" (1 step = 6°)
  let lastStep=Math.floor(Tc), stepFlash=0;
  const E={state:'idle',t:0,y:0,v:0,th:0,om:0,ticks:0,res:null,bounces:0,hand:1}; const trials=[];
  chipsWire(wrap,'#slow .toggle-btn',b=>{ slow=+b.dataset.k; });
  chipsWire(wrap,'#ev .toggle-btn',b=>{ ev=+b.dataset.e; resetEv(); });
  $('#lens').onclick=e=>{ lens=!lens; e.target.classList.toggle('active',lens); };
  $('#go').onclick=()=>{ resetEv(); E.state='run'; E.t=0; E.ticks=0; };
  function resetEv(){ E.state='idle'; E.t=0; E.y=0; E.v=0; E.th=0.2094; E.om=0; E.ticks=0; E.bounces=0; E.prevOm=0; E.cross=0; }
  resetEv();
  const HB=1.2, SC=190, FLOOR=478, TOP=FLOOR-HB*SC, PIV={x:640,y:262}, PL=1.0;
  function drawDial(ctx,hands){
    circ(ctx,C.x,C.y,R+10,COL.ink,'#fff',6); circ(ctx,C.x,C.y,R,COL.mid,null,1);
    for(let i=0;i<60;i++){ const a=i/60*Math.PI*2-Math.PI/2, big=i%5===0; line(ctx,C.x+Math.cos(a)*(R-(big?20:10)),C.y+Math.sin(a)*(R-(big?20:10)),C.x+Math.cos(a)*(R-3),C.y+Math.sin(a)*(R-3),COL.ink,big?3.4:1.6); }
    for(let k=1;k<=12;k++){ const a=k/12*Math.PI*2-Math.PI/2; textAt(ctx,String(k),C.x+Math.cos(a)*(R-44),C.y+Math.sin(a)*(R-44)+9,{align:'center',size:26,weight:600,color:COL.ink}); }
    textAt(ctx,'QUARTZ',C.x,C.y+R*0.42,{align:'center',size:11,weight:700,color:COL.mid});
    if(!hands) return;
    const sec=sh.x, hA=(sec/43200)*Math.PI*2-Math.PI/2, mA=(sec/3600)*Math.PI*2-Math.PI/2, sA=sec/60*Math.PI*2-Math.PI/2;
    // hour + minute hands creep with every step of the motor
    const hs=Math.floor(Tc);
    const hA2=(hs/43200)*Math.PI*2-Math.PI/2, mA2=(hs/3600)*Math.PI*2-Math.PI/2;
    ctx.save(); ctx.lineCap='round';
    line(ctx,C.x-Math.cos(hA2)*18,C.y-Math.sin(hA2)*18,C.x+Math.cos(hA2)*R*0.5,C.y+Math.sin(hA2)*R*0.5,COL.ink,9);
    line(ctx,C.x-Math.cos(mA2)*22,C.y-Math.sin(mA2)*22,C.x+Math.cos(mA2)*R*0.78,C.y+Math.sin(mA2)*R*0.78,COL.ink,6);
    line(ctx,C.x-Math.cos(sA)*50,C.y-Math.sin(sA)*50,C.x+Math.cos(sA)*(R-8),C.y+Math.sin(sA)*(R-8),COL.red,2.6);
    circ(ctx,C.x-Math.cos(sA)*42,C.y-Math.sin(sA)*42,7,COL.red,'#fff',2.4);
    circ(ctx,C.x,C.y,8,COL.red,COL.red,1); circ(ctx,C.x,C.y,3,'#fff','#fff',1); ctx.restore();
    return {tip:{x:C.x+Math.cos(sA)*(R-12),y:C.y+Math.sin(sA)*(R-12)}, sA};
  }
  animLoop(dt=>{ t+=dt; const sdt=dt*slow; Tc+=sdt;
    // stepper: target jumps by one step each whole second; hand rings on its spring
    const tgt=Math.floor(Tc); if(tgt!==lastStep){ lastStep=tgt; stepFlash=1; if(slow>=0.25) tink(3200,0.035,0.03); else tink(2400,0.05,0.08); if(E.state==='run') E.ticks++; }
    const n=Math.max(1,Math.ceil(sdt/0.0008)), hh=sdt/n; for(let i=0;i<n;i++){ const a=W0*W0*(tgt-sh.x)-2*ZETA*W0*sh.v; sh.v+=a*hh; sh.x+=sh.v*hh; }
    stepFlash=Math.max(0,stepFlash-dt*3);
    // the event, in the same (possibly slowed) time
    if(E.state==='run'){ E.t+=sdt;
      if(ev===0){ E.v+=9.81*sdt; E.y+=E.v*sdt; if(E.y>=HB){ const over=(E.y-HB)/Math.max(E.v,1e-6); E.y=HB; if(E.bounces===0){ E.res=E.t-over; E.state='bounce'; finish(); } E.v=-E.v*0.55; E.bounces++; } }
      else { const a=-(9.81/PL)*Math.sin(E.th); E.om+=a*sdt; E.th+=E.om*sdt; if(E.prevOm>0&&E.om<=0&&E.t>0.3){ E.res=E.t; E.state='bounce'; finish(); } E.prevOm=E.om; } }
    else if(E.state==='bounce'){ const d2=sdt;
      if(ev===0){ E.v+=9.81*d2; E.y+=E.v*d2; if(E.y>=HB){ E.y=HB; E.v=-E.v*0.55; if(Math.abs(E.v)<0.3) E.v=0; } }
      else { const a=-(9.81/PL)*Math.sin(E.th)-0.05*E.om; E.om+=a*d2; E.th+=E.om*d2; } }
    E.hand=approach(E.hand,E.state==='idle'?1:0,6,dt);
    function finish(){ trials.push({e:ev,ticks:E.ticks,t:E.res}); if(trials.length>6) trials.shift();
      $('#tbl').innerHTML=logTable(['Event','Wall clock','Stopwatch'],trials.map(r=>[r.e?'Swing':'Ball',{v:r.ticks+' tick'+(r.ticks===1?'':'s'),c:'r-warn'},{v:r.t.toFixed(2)+' s',c:'r-ok'}])); }
    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,500]);
    const H=drawDial(ctx,true);
    glow(ctx,H.tip.x,H.tip.y,26,COL.red,stepFlash*0.6);
    if(lens){ const L={x:672,y:106,R:88};
      lensView(ctx,L.x,L.y,L.R,H.tip.x,H.tip.y,()=>{ ctx.translate(L.x,L.y); ctx.scale(2.3,2.3); ctx.translate(-H.tip.x,-H.tip.y); drawDial(ctx,true);
        const k=Math.floor(Tc)%60, a0=k/60*Math.PI*2-Math.PI/2, a1=(k+1)/60*Math.PI*2-Math.PI/2, rr=R-24;
        ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(C.x,C.y,rr,a0,a1); ctx.stroke(); ctx.restore();
        arrowHead(ctx,C.x+Math.cos(a1)*rr,C.y+Math.sin(a1)*rr,a1+Math.PI/2,COL.green,3); arrowHead(ctx,C.x+Math.cos(a0)*rr,C.y+Math.sin(a0)*rr,a0-Math.PI/2,COL.green,3);
        const am=(a0+a1)/2; textAt(ctx,'1 s',C.x+Math.cos(am)*(rr-10),C.y+Math.sin(am)*(rr-10)+3,{align:'center',size:7,weight:700,color:COL.green}); },{label:'one step = 1 s',col:COL.green}); }
    // ---- event area ----
    line(ctx,520,FLOOR,790,FLOOR,COL.ink,3);
    if(ev===0){ const sx=580; line(ctx,sx-40,FLOOR,sx-40,TOP-26,COL.ink,4); line(ctx,sx-40,TOP-26,sx+10,TOP-26,COL.ink,3);
      for(let y=TOP;y<=FLOOR;y+=SC*0.1){ const big=Math.round((FLOOR-y)/(SC*0.1))%5===0; line(ctx,sx-40,y,sx-(big?28:33),y,COL.ink,1.2); }
      textAt(ctx,'1.2 m',sx-46,TOP+4,{align:'right',size:11,weight:700,color:COL.muted});
      const by=TOP+E.y*SC, br=12; circ(ctx,sx+12,by-br,br,COL.red,'#fff',2.6);
      if(E.state!=='idle'&&E.v>0.3) for(let k=1;k<=3;k++) circ(ctx,sx+12,by-br-k*E.v*SC*0.012,br,rgba(COL.red,0.25-k*0.06),null,1.2);
      pinchHand(ctx,sx+24,TOP-br,0,E.hand,0.8); }
    else { rect(ctx,PIV.x-40,PIV.y-8,80,8,COL.ink,'#fff',2); const l=PL*170, bx=PIV.x+Math.sin(E.th)*l, by=PIV.y+Math.cos(E.th)*l;
      ctx.save(); ctx.strokeStyle=rgba(COL.mid,0.6); ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(PIV.x,PIV.y,l,Math.PI/2-0.21,Math.PI/2+0.21); ctx.stroke(); ctx.restore();
      line(ctx,PIV.x,PIV.y,bx,by,COL.ink,1.6); circ(ctx,bx,by,11,COL.red,'#fff',2.6); pinchHand(ctx,bx+8,by,0,E.hand,0.8); }
    // event stopwatch (0.01 s) and tick counter
    const st=E.state==='run'?E.t:(E.res||0);
    stopwatchDraw(ctx,735,330,48,st,{digital:true,running:E.state==='run'});
    const tk=E.state==='idle'?0:E.ticks; for(let k=0;k<Math.max(3,tk);k++){ const x=700+k*18; circ(ctx,x,400,6,k<tk?COL.blue:COL.mid,k<tk?COL.blue:'#fff',1.6); }
    textAt(ctx,'wall-clock ticks',700-7,425,{size:10.5,weight:600,color:COL.muted});
    ctx.restore();
    // ---------- readouts ----------
    const last=trials[trials.length-1];
    setv($,'k1',last?last.ticks+' tick'+(last.ticks===1?'':'s'):'—'); setv($,'k2',last?last.t.toFixed(2)+' s':'—'); setv($,'k3','6° = 1 s'); setv($,'k4','1 second');
    let msg=''; const balls=trials.filter(r=>r.e===0);
    if(balls.length&&balls.some(r=>r.ticks===0)&&balls.some(r=>r.ticks>=1)) msg='ok|Same fall, 0 or 1 tick: the wall clock cannot measure less than one second.';
    else if(last&&last.e===0) msg='warn|The ball lands in less than one step of the second hand.';
    else if(last) msg='ok|About 2 ticks — ≈ 2 s. The wall clock reads whole seconds only.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}

/* =====================================================================
   8.4 LET US CALCULATE — speed of trains between two stations
   Each train really runs: accelerate at a (A→B), hold its top speed
   (B→C, uniform linear motion), brake at b to stop exactly at the next
   station (C→D).  Braking starts when the distance left = v²/2b.
   The timetable is made from that run (arrival rounded up to the minute),
   and speed = distance ÷ time taken, as in Example 8.1
   (3.6 km in 15 min → 4 m/s). The route map runs 12× – several
   hundred × faster than real time; the close-up shows the train at its
   real speed (14 px = 1 m).
   ===================================================================== */
function buildA4(){
  const TR=[{n:'Passenger',vmax:50,a:0.25,b:0.35,D:14,dep:7*60+40},{n:'Express',vmax:80,a:0.3,b:0.4,D:46,dep:9*60+15},{n:'Superfast',vmax:110,a:0.35,b:0.5,D:128,dep:13*60+5}];
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Train</label><div class="toggle-group" id="tr">
      ${TR.map((r,i)=>`<button class="toggle-btn small${i===1?' active':''}" data-t="${i}">${r.n}</button>`).join('')}</div>
      <label style="margin-top:8px">Distance to next station <span class="val" id="dv">46 km</span></label><input type="range" id="dist" min="5" max="150" step="1" value="46">
      <div id="tt" style="margin-top:6px"></div>
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Depart</button></div></div>
    <div class="control-group"><label>Table 8.2 <span class="val" id="clr" style="cursor:pointer">clear</span></label><div id="tbl"><div class="hint">Run a train to fill a row.</div></div>
      <div class="fb" id="obs" style="display:none"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PXM=14, FX=560, GY=352, KE=12;
  let ti=1, D=46, s=0, v=0, tj=0, phase='wait', k=KE, sc=0, brake=null, sB=null, sC=null, dots=[], trace=[], rows=[], obsMsg='', t=0, arrived=false;
  const needle=spr(0);
  const hm=m=>{ m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
  function runTime(tr,Dm){ const V=tr.vmax/3.6, da=V*V/(2*tr.a), db=V*V/(2*tr.b); if(da+db<=Dm) return V/tr.a+V/tr.b+(Dm-da-db)/V; const vp=Math.sqrt(2*Dm*tr.a*tr.b/(tr.a+tr.b)); return vp/tr.a+vp/tr.b; }
  const sched=()=>{ const tr=TR[ti], mins=Math.ceil(runTime(tr,D*1000)/60); return {dep:tr.dep,arr:tr.dep+mins,mins}; };
  function showTT(){ const S=sched(); $('#tt').innerHTML=logTable(['Train','Departs','Arrives','km'],[[TR[ti].n,hm(S.dep),hm(S.arr),D]]); }
  function reset(){ s=0; v=0; tj=0; phase='wait'; sc=0; brake=null; sB=null; sC=null; dots=[]; trace=[]; arrived=false; k=KE; }
  chipsWire(wrap,'#tr .toggle-btn',b=>{ ti=+b.dataset.t; D=TR[ti].D; $('#dist').value=D; $('#dv').textContent=D+' km'; reset(); showTT(); });
  $('#dist').oninput=e=>{ D=+e.target.value; $('#dv').textContent=D+' km'; reset(); showTT(); };
  $('#go').onclick=()=>{ if(phase==='run') return; reset(); phase='run'; };
  $('#clr').onclick=()=>{ rows=[]; drawRows(); };
  function drawRows(){ if(!rows.length){ $('#tbl').innerHTML='<div class="hint">Run a train to fill a row.</div>'; return; } const mx=Math.max(...rows.map(r=>r.sp));
    $('#tbl').innerHTML=logTable(['Train','km','Time (h)','km/h'],rows.map(r=>[r.n,r.D,r.h.toFixed(2),{v:r.sp.toFixed(0),c:r.sp===mx&&rows.length>1?'r-ok':''}])); }
  showTT();
  const stepT=()=>{ const T=sched().mins; return [1,2,3,5,10,15].find(x=>T/x<=16)||20; };
  animLoop(dt=>{ t+=dt; const tr=TR[ti], Dm=D*1000, V=tr.vmax/3.6;
    if(phase==='run'){
      const rem=Dm-s, stopDist=v*v/(2*tr.b), kc=Math.max(KE,(Dm/V)/7);
      const kt=v>0.97*V?clamp((rem-stopDist)/(v*0.8),KE,kc):KE; k=kt<k?kt:approach(k,kt,4,dt);
      let left=dt*k; const vPrev=v;
      while(left>1e-6){ const h=Math.min(0.5,left); left-=h; const r=Dm-s;
        let acc; if(r<=v*v/(2*tr.b)+0.01){ acc=r>0.05?-v*v/(2*r):-v/h; if(!brake){ brake={sc:sc,rem:r}; sC=s; } } else if(v<V){ acc=Math.min(tr.a,(V-v)/h); } else acc=0;
        if(sB===null&&v>=V*0.999) sB=s;
        v=Math.max(0,v+acc*h); s=Math.min(Dm,s+v*h); tj+=h;
        const st=stepT()*60; if(Math.floor(tj/st)>dots.length-1||dots.length===0){ while(dots.length<=Math.floor(tj/st)) dots.push(s); }
        if(r<=0.05||(v<=0&&brake)||(brake&&Dm-s<1.5&&v<0.8)){ v=0; s=Dm; phase='done'; break; } }
      trace.push({t:tj,s});
      // close-up: real-time motion; while braking it is pinned so the train halts at the platform
      if(brake){ const r=Dm-s; sc=brake.sc+(brake.rem-r)/KE; } else sc+=(vPrev+v)/2*dt;
      if(phase==='done'&&!arrived){ arrived=true; const S=sched(), hr=S.mins/60; if(sB===null) sB=sC; rows.push({n:tr.n,D,h:hr,sp:D/hr}); if(rows.length>6) rows.shift(); drawRows(); tink(1300,0.08,0.4); } }
    springTo(needle,v*3.6,40,11,dt);
    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,505]);
    // ===== route map =====
    const MX0=70, MX1=730, MY=62, mx=x=>MX0+(MX1-MX0)*x/Dm;
    line(ctx,MX0,MY,MX1,MY,COL.ink,3); for(let x=MX0;x<MX1;x+=10) line(ctx,x,MY-3,x,MY+3,rgba(COL.ink,0.4),1);
    [[MX0,'A · your station'],[MX1,'D · next station']].forEach(([x,n],i)=>{ rect(ctx,x-18,MY-16,36,10,COL.ink,'#fff',1.8); textAt(ctx,n,x,MY-24,{align:i?'right':'left',size:11.5,weight:700,color:COL.ink}); });
    textAt(ctx,D+' km',(MX0+MX1)/2,MY-24,{align:'center',size:12,weight:700,color:COL.green});
    const st=stepT();
    dots.forEach((d,i)=>{ const x=mx(d); circ(ctx,x,MY+14,3.6,COL.red,COL.red,1); if(i%2===0&&i>0&&dots.length<18) textAt(ctx,i*st+'′',x,MY+30,{align:'center',size:9,color:COL.mid}); });
    textAt(ctx,'● every '+st+' min',MX1,MY+44,{align:'right',size:10,weight:600,color:COL.red});
    if(phase!=='wait'){ const seg=[[0,sB===null?s:sB,'speeding up'],[sB,sC===null?s:sC,'steady speed'],[sC,s,'slowing down']];
      seg.forEach(([a,b,lb],i)=>{ if(a===null||b===null||b-a<Dm*0.01) return; const x0=mx(a)+2, x1=mx(b)-2, y=MY+50+(i===1?0:0);
        line(ctx,x0,y,x1,y,i===1?COL.green:COL.yellow,2.4); line(ctx,x0,y-4,x0,y+4,i===1?COL.green:COL.yellow,2); line(ctx,x1,y-4,x1,y+4,i===1?COL.green:COL.yellow,2);
        if(x1-x0>60) textAt(ctx,lb,(x0+x1)/2,y+14,{align:'center',size:10,weight:600,color:i===1?COL.green:mixCol(COL.yellow,COL.ink,0.3)}); });
      [[sB,'B'],[sC,'C']].forEach(([q,l])=>{ if(q!==null&&q>Dm*0.005&&q<Dm*0.995) textAt(ctx,l,mx(q),MY-6,{align:'center',size:10.5,weight:700,color:COL.muted}); }); }
    // train marker
    const tx=mx(s); ctx.save(); ctx.translate(tx,MY); rrect(ctx,-22,-9,24,9,2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(8,-2); ctx.lineTo(8,0); ctx.lineTo(2,0); ctx.stroke(); ctx.restore();
    if(phase==='run') textAt(ctx,'map ×'+Math.round(k),MX0,MY+44,{size:10,weight:600,color:COL.mid});
    // ===== close-up (real speed) =====
    const CY0=128, CY1=390; ctx.save(); rrect(ctx,20,CY0,760,CY1-CY0,10); ctx.strokeStyle=rgba(COL.mid,0.5); ctx.lineWidth=1.2; ctx.stroke(); ctx.clip();
    const X=m=>FX+(m-sc)*PXM;
    // far hills (parallax)
    ctx.save(); ctx.strokeStyle=rgba(COL.mid,0.55); ctx.lineWidth=1.6; ctx.beginPath(); for(let x=20;x<=780;x+=6){ const u=x/PXM+sc*0.08; const y=222-18*Math.sin(u*0.05)-10*Math.sin(u*0.13+1); x===20?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    // platforms
    const plats=[[-272,12,'A']]; if(brake){ const end=brake.sc+brake.rem/KE+12; plats.push([Math.max(end-272,brake.sc+(780-FX)/PXM),end,'D']); }
    if(phase==='done'&&!brake) plats.push([sc-260,sc+12,'D']);
    plats.forEach(([a,b,n])=>{ const x0=X(a), x1=X(b); if(x1<20||x0>780) return; rect(ctx,x0,GY-14,x1-x0,14,COL.ink,'#fff',2); for(let x=x0+8;x<x1;x+=16) line(ctx,x,GY-14,x-6,GY,rgba(COL.mid,0.5),1);
      const bx=X(b-6); if(bx>20&&bx<780){ line(ctx,bx-14,GY-14,bx-14,GY-78,COL.ink,2); line(ctx,bx+14,GY-14,bx+14,GY-78,COL.ink,2); rect(ctx,bx-30,GY-100,60,24,COL.ink,'#fff',2); textAt(ctx,n,bx,GY-82,{align:'center',size:14,weight:700,color:COL.ink}); } });
    // masts + overhead wire
    const WY=GY-5.6*PXM; line(ctx,20,WY,780,WY,COL.ink,1.4);
    for(let m=Math.floor((sc-FX/PXM)/60)*60; X(m)<800; m+=60){ const x=X(m); if(x<0) continue; line(ctx,x,GY,x,WY-26,COL.ink,3); line(ctx,x,WY-20,x+22,WY-20,COL.ink,2); line(ctx,x+22,WY-20,x+22,WY,COL.ink,1.2); }
    // rail + sleepers
    line(ctx,20,GY+3,780,GY+3,COL.ink,3); for(let m=Math.floor((sc-FX/PXM)/2.6)*2.6; X(m)<790; m+=2.6){ const x=X(m); line(ctx,x-6,GY+9,x+6,GY+9,COL.mid,3); }
    line(ctx,20,GY+16,780,GY+16,rgba(COL.mid,0.5),1);
    // the train: engine + coaches (front at FX)
    const wa=sc/0.55;
    const car=(x0,L,eng)=>{ const x1=x0+L*PXM, top=GY-4.1*PXM, bot=GY-1.1*PXM; ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(x0,bot); ctx.lineTo(x0,top+6); ctx.quadraticCurveTo(x0,top,x0+6,top); if(eng){ ctx.lineTo(x1-40,top); ctx.quadraticCurveTo(x1-8,top+6,x1,top+26); ctx.lineTo(x1,bot); } else { ctx.lineTo(x1-6,top); ctx.quadraticCurveTo(x1,top,x1,top+6); ctx.lineTo(x1,bot); } ctx.closePath(); ctx.fill(); ctx.stroke();
      if(eng){ ctx.beginPath(); ctx.moveTo(x1-34,top+6); ctx.quadraticCurveTo(x1-12,top+10,x1-6,top+26); ctx.lineTo(x1-34,top+26); ctx.closePath(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.stroke();
        const px=x0+L*PXM*0.3, py=top; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(px-14,py); ctx.lineTo(px,py-12); ctx.lineTo(px-10,WY); ctx.moveTo(px-20,WY); ctx.lineTo(px,WY); ctx.stroke();
        line(ctx,x0+12,top+34,x1-48,top+34,rgba(COL.red,0.6),2); circ(ctx,x1-4,bot-8,3.4,COL.yellow,v>0.1?COL.yellow:'#fff',1.4); }
      else { for(let wx=x0+18;wx<x1-26;wx+=24){ rrect(ctx,wx,top+8,15,12,2); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.stroke(); } line(ctx,x0+6,bot-8,x1-6,bot-8,rgba(COL.red,0.5),1.6); }
      ctx.restore();
      [0.18,0.82].forEach(f=>{ const bx=x0+L*PXM*f; rect(ctx,bx-26,bot,52,8,COL.ink,'#fff',1.8); [-14,14].forEach(o=>{ const cx=bx+o, cy=GY-0.55*PXM+3; circ(ctx,cx,cy,0.55*PXM,COL.ink,'#fff',2);
        for(let q=0;q<3;q++){ const a=wa+q*Math.PI/3*2; line(ctx,cx-Math.cos(a)*6,cy-Math.sin(a)*6,cx+Math.cos(a)*6,cy+Math.sin(a)*6,COL.ink,1.2); } }); }); };
    car(FX-20*PXM,20,true); car(FX-20*PXM-1.2*PXM-23*PXM,23,false); car(FX-20*PXM-2.4*PXM-46*PXM,23,false);
    textAt(ctx,'close-up · real speed',32,CY0+18,{size:10.5,weight:600,color:COL.mid});
    ctx.restore();
    // ===== instruments =====
    gaugeDraw(ctx,92,452,44,needle.x,140,20,'',COL.green);
    textAt(ctx,'speedometer · km/h',92,500,{align:'center',size:9.5,weight:600,color:COL.muted});
    const odo=(s/1000).toFixed(1).padStart(5,'0'); rrect(ctx,160,414,110,30,5); ctx.fillStyle='#f4f7fb'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke();
    textAt(ctx,odo+' km',215,435,{align:'center',size:15,weight:700,color:COL.green}); textAt(ctx,'odometer',215,458,{align:'center',size:9.5,weight:600,color:COL.muted});
    const clk=TR[ti].dep+tj/60; rrect(ctx,160,466,110,26,5); ctx.fillStyle='#f4f7fb'; ctx.fill(); ctx.stroke(); textAt(ctx,'🕒 '+hm(Math.floor(clk)),215,484,{align:'center',size:13.5,weight:700,color:COL.blue});
    // distance–time graph
    const T=Math.max(sched().mins,1); const A=axesBox(ctx,330,412,430,58,'time (min)','distance (km)',T,D,{xt:[0,Math.round(T/2),T],yt:[0,D]});
    ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.2; ctx.beginPath(); trace.forEach((p,i)=>{ const x=A.X(p.t/60), y=A.Y(p.s/1000); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore();
    if(phase==='done') line(ctx,A.X(0),A.Y(0),A.X(T),A.Y(D),rgba(COL.green,0.7),1.4,[4,4]);
    ctx.restore();
    // ---------- side ----------
    setBtn($('#go'),phase==='run'?'Running…':(phase==='done'?'↺ Run again':'▶ Depart'),'play');
    let msg=''; if(phase==='done'){ const S=sched(); msg='ok|Speed = '+D+' km ÷ '+(S.mins/60).toFixed(2)+' h = '+(D/(S.mins/60)).toFixed(0)+' km/h'; }
    else if(phase==='run'&&sB!==null&&sC===null) msg='ok|Steady speed: equal distances in equal times (uniform).';
    else if(phase==='run') msg='warn|Speed changing: unequal distances in equal times.';
    const ob=$('#obs'); if(msg!==obsMsg){ obsMsg=msg; ob.style.display=msg?'block':'none'; if(msg){ const [c,tx]=msg.split('|'); ob.className='fb '+c; ob.textContent=tx; } }
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'8.1', title:'A Simple Water Clock', desc:'Bottle clock · mark the level every minute', build: buildA1 },
  { num:'8.2', title:'A Simple Pendulum', desc:'Table 8.1 · time for 10 oscillations', build: buildA2 },
  { num:'8.3', title:'Smallest Interval on a Wall Clock', desc:'Fig. 8.9 · how short a time can it measure?', build: buildA3 },
  { num:'8.4', title:'Speed of Trains', desc:'Table 8.2 · speed = distance ÷ time', build: buildA4 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
