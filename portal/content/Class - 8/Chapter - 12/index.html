<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 · Chapter 12 — How Nature Works in Harmony | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">🌿</div>
    <div>
      <div class="chip">Grade 8 · Ch 12</div>
      <h1>How Nature Works in Harmony</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you change · Sun</span>
      <span><i style="background:var(--f-green)"></i>Plants · living</span>
      <span><i style="background:var(--f-red)"></i>Eats → · animals affected</span>
      <span><i style="background:var(--f-blue)"></i>Water · non-living</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">12.1</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 12: HOW NATURE WORKS IN HARMONY
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; populations follow real rate equations (logistic growth,
   predator–prey, first-order relaxation) and every animal on screen
   moves with a gait, a flap, a hop or a swim — never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-12 HELPERS — line-drawn living things. Every organism is
       drawn in local units (body ≈ 1 long, facing +x, feet at y = 0) and
       is animated by t / a gait phase, so nothing ever stands frozen.
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function tag(ctx,px,py,tx,ty,txt,col){
  const W=ctx.canvas._w||800;
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const right=tx>px; let bx=right?tx+4:tx-tw-12;
  if(bx+tw+10>W-4) bx=W-tw-14; if(bx<4) bx=4;
  line(ctx,px,py,right?bx:bx+tw+8,ty,col,1.6); circ(ctx,px,py,3,col,col,1);
  ctx.save(); rrect(ctx,bx,ty-10,tw+10,20,6); ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,ty+4,{size:12,weight:700,color:col});
}
function pill(ctx,txt,x,y,col,opts){ opts=opts||{};
  ctx.save(); ctx.font='700 '+(opts.size||12)+'px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const bw=tw+14, bh=(opts.size||12)+10;
  ctx.save(); if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha; rrect(ctx,x-bw/2,y-bh/2,bw,bh,bh/2); ctx.fillStyle=opts.fill||'rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,x,y+(opts.size||12)*0.36,{align:'center',size:opts.size||12,weight:700,color:opts.tcol||col,alpha:opts.alpha});
  return bw;
}
/* curved arrow a→b with bend; returns the curve for pulses */
function curveArrow(ctx,ax,ay,bx,by,bend,col,lw,dash,shrinkA,shrinkB){
  const mx=(ax+bx)/2, my=(ay+by)/2, dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
  const cx=mx-dy/L*bend, cy=my+dx/L*bend;
  const pt=u=>[(1-u)*(1-u)*ax+2*(1-u)*u*cx+u*u*bx,(1-u)*(1-u)*ay+2*(1-u)*u*cy+u*u*by];
  const u0=(shrinkA||0)/L, u1=1-(shrinkB||0)/L;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2.2; if(dash) ctx.setLineDash(dash);

/* st: phase (gait, rad), move 0..1, graze 0..1, stretch 0..1 (leap), chew
   Legs are jointed: front = shoulder→elbow→knee→hoof, hind = hip→stifle
   →hock (bends backwards)→hoof. A leg lifts only in its swing phase
   (cos φ > 0), so stance feet stay planted on the ground. */
function drawQuad(ctx,x,y,s,dir,t,sp,st){ st=st||{}; const c=st.col||sp.col;
  G(ctx,x,y,s,dir,u=>{
    const L=sp.L, H=sp.leg, bh=sp.bh, ph=st.phase||0, mv=st.move||0, ex=st.stretch||0;
    const bob=mv*Math.abs(Math.sin(ph))*0.015*H/0.3, by=-H-bh*0.55+bob-ex*0.05;
    const lwd=Math.max(3*u,sp.lw||L*0.055);
    function leg(hx,hy,front,p,col){
      let a=Math.sin(p)*0.42*mv, lift=Math.max(0,Math.cos(p))*mv;
      if(ex>0){ a=front?0.95*ex:-0.95*ex; lift=0.3*ex; }
      const th=front?[a*0.8-0.08, a-lift*1.2, a-lift*1.2+0.3]:[a+0.55+lift*0.2, a-0.5-lift*0.5, a+0.08+lift*0.9];
      const ws=front?[0.38,0.45,0.17]:[0.34,0.36,0.3];
      const rest=front?[-0.08,0,0.3]:[0.55,-0.5,0.08]; let vs=0; for(let i=0;i<3;i++) vs+=ws[i]*Math.cos(rest[i]);
      const k=(-hy)/vs; let px=hx, py=hy; const pts=[[px,py]];
      for(let i=0;i<3;i++){ px+=Math.sin(th[i])*ws[i]*k; py+=Math.cos(th[i])*ws[i]*k; pts.push([px,py]); }
      const dy=Math.max(0,py); pts.forEach(p=>p[1]-=dy*0); if(pts[3][1]>0) pts[3][1]=0;

    else if(sp.tail==='thin'){ ctx.beginPath(); ctx.moveTo(-L*0.48,by-bh*0.3); ctx.quadraticCurveTo(-L*0.8,by-bh*0.2+tw,-L*1.05,by+bh*0.6-tw); SK(ctx,c,1.6*u); }
    else if(sp.tail==='up'){ ctx.beginPath(); ctx.moveTo(-L*0.42,by+bh*0.3); ctx.quadraticCurveTo(-L*1.0,by-0.05,-L*0.75+tw,by-0.4); ctx.quadraticCurveTo(-L*0.5,by-0.5,-L*0.55,by-0.25); ctx.quadraticCurveTo(-L*0.7,by-0.1,-L*0.4,by-bh*0.2); SK(ctx,c,1.8*u,'#fff'); }
    else if(sp.tail==='puff'){ ell(ctx,-L*0.5,by-bh*0.3,0.06,0.06); SK(ctx,c,1.6*u,'#fff'); }
    else { ctx.beginPath(); ctx.moveTo(-L*0.47,by-bh*0.7); ctx.quadraticCurveTo(-L*0.56,by-bh*0.6+tw,-L*0.55,by-bh*0.1+tw); SK(ctx,c,2.2*u); }

    const g=st.graze||0, chew=st.chew?Math.sin(t*10)*0.012:0;

    // body
    if(sp.round){ ctx.beginPath(); ctx.moveTo(-L*0.5,by+bh*0.6); ctx.quadraticCurveTo(-L*0.55,by-bh*1.5,L*0.1,by-bh*1.1); ctx.quadraticCurveTo(L*0.5,by-bh*0.8,L*0.5,by+bh*0.4); ctx.quadraticCurveTo(0,by+bh*1.1,-L*0.5,by+bh*0.6); ctx.closePath(); }
    else { ctx.beginPath(); ctx.moveTo(-L*0.5,by-bh*0.2);
      ctx.quadraticCurveTo(-L*0.48,by-bh*1.0,-L*0.3,by-bh*0.95); ctx.quadraticCurveTo(0,by-bh*0.8,L*0.25,by-bh*1.05);

    if(sp.neck>0.1){ ctx.save(); ctx.beginPath(); ctx.moveTo(L*0.2,by-bh*0.8); ctx.lineTo(L*0.45,by+bh*0.2); ctx.strokeStyle='#fff'; ctx.lineWidth=5*u; ctx.restore(); }
    leg(shX,jy,true,ph+0.9,c); leg(hipX,jy,false,ph+Math.PI,c);

    if(sp.snout){ ctx.beginPath(); ctx.moveTo(-hl*0.45,-hl*0.38); ctx.quadraticCurveTo(hl*0.3,-hl*0.3,hl*0.95,-hl*0.02); ctx.lineTo(hl*0.95,hl*0.06); ctx.quadraticCurveTo(hl*0.2,hl*0.35,-hl*0.45,hl*0.3); ctx.closePath(); SK(ctx,c,2*u,'#fff'); dot(ctx,hl*0.95,0.01,0.022,COL.ink); }
    else if(sp.round){ ell(ctx,hl*0.2,0,hl*0.62,hl*0.45); SK(ctx,c,2*u,'#fff'); dot(ctx,hl*0.8,0.01,0.018,COL.ink); }
    else { ctx.beginPath(); ctx.moveTo(-hl*0.4,-hl*0.3); ctx.quadraticCurveTo(0,-hl*0.45,hl*0.35,-hl*0.2); ctx.quadraticCurveTo(hl*0.85,-hl*0.12,hl*0.95,hl*0.08); ctx.quadraticCurveTo(hl*0.8,hl*0.26,hl*0.35,hl*0.22); ctx.quadraticCurveTo(-hl*0.1,hl*0.35,-hl*0.4,hl*0.2); ctx.closePath(); SK(ctx,c,2*u,'#fff'); dot(ctx,hl*0.9,0.02,0.02,COL.ink); }
    dot(ctx,hl*0.08,-hl*0.12,0.022,COL.ink);
    const ea=sp.ear>0.2?-2.2+Math.sin(t*2)*0.08:-2.0+Math.sin(t*1.3)*0.1;
    ctx.save(); ctx.translate(-hl*0.28,-hl*0.25); ctx.rotate(ea); ell(ctx,sp.ear*0.5,0,sp.ear*0.5,sp.round?sp.ear*0.3:sp.ear*0.22); ctx.restore(); SK(ctx,c,1.8*u,'#fff');
    if(sp.antler){ segs(ctx,[[-hl*0.1,-hl*0.35],[-hl*0.3,-hl*1.3],[-hl*0.75,-hl*1.85]]); SK(ctx,c,2*u); segs(ctx,[[-hl*0.26,-hl*1.0],[hl*0.25,-hl*1.45]]); SK(ctx,c,2*u); segs(ctx,[[-hl*0.47,-hl*1.52],[-hl*0.15,-hl*2.0]]); SK(ctx,c,2*u); }
    if(sp.horn){ ctx.beginPath(); ctx.moveTo(-hl*0.2,-hl*0.35); ctx.quadraticCurveTo(-hl*0.1,-hl*0.8,hl*0.2,-hl*0.8); SK(ctx,c,2.2*u); }
    if(sp.round && sp.L<0.6){ for(let q=-1;q<=1;q++){ segs(ctx,[[hl*0.75,0.01],[hl*1.25,q*0.05+0.01]]); SK(ctx,COL.mid,1*u); } }
    ctx.restore();
  });
}

    const hx=0.05*dir; ell(ctx,hx,-0.12,0.07,0.065); SK(ctx,c,1.8*u,'#fff'); dot(ctx,hx+0.03*dir,-0.13,0.016,COL.ink);
    ctx.beginPath(); ctx.moveTo(hx+0.06*dir,-0.13); ctx.quadraticCurveTo(hx+0.12*dir,-0.12,hx+0.09*dir,-0.07); SK(ctx,c,1.6*u);
    if(sp.bare){ ctx.beginPath(); ctx.arc(0,-0.04,0.08,Math.PI*1.1,Math.PI*1.9); SK(ctx,c,1.4*u); }
  });
}


/* =====================================================================
   12.1 LET US EXPLORE — two habitats, living vs non-living
   The Sun follows its daily arc: elevation e = sin(π·(hour − 6)/12).
   Shadow length of a tree of height H: s = H / tan(e) (real geometry).
   Air temperature relaxes toward 18 + 16·e °C with a 1.5-hour lag
   (first-order: dT/dt = (T_eq − T)/τ). Wind sets sway and ripples.
   The survey lens springs from item to item (k = 26, c = 9) and tracks
   moving animals while it looks.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Habitat</label>
      <div class="toggle-group" id="habB"><button class="toggle-btn active" data-h="pond">Pond</button><button class="toggle-btn" data-h="forest">Forest</button><button class="toggle-btn" data-h="farm">Farm</button><button class="toggle-btn" data-h="banyan">Banyan tree</button></div></div>
    <div class="control-group"><label>Time of day <span class="val" id="hV"></span></label><input type="range" id="hR" min="6.5" max="17.5" step="0.1" value="10"></div>
    <div class="control-group"><label>Wind <span class="val" id="wV"></span></label><input type="range" id="wR" min="0" max="10" step="0.5" value="3"></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;">🔍 Survey</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Reset</button></div>
    <div class="control-group"><label>Table 12.1 <span class="val" id="nV">0 / 0</span></label>
      <table class="log"><thead><tr><th style="color:var(--f-green)">Living</th><th style="color:var(--f-blue)">Non-living</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR'), wR=$('#wR');
  let hab='pond', t=0, run=false, idx=0, dwell=0, Tair=24;
  const lens={x:{x:0,v:0},y:{x:0,v:0},r:{x:0,v:0}};
  let found={};           // name → true
  let items=[];           // [{name,living,x,y}] rebuilt every frame by the scene
  const ORDER={pond:['Sunlight','Water','Fish','Lotus','Frog','Air','Duck','Soil','Dragonfly','Stone','Snail','Grass','Temperature'],
    forest:['Sunlight','Tree','Deer','Soil','Bird','Air','Grass','Mushroom','Stone','Hare','Water','Temperature'],
    farm:['Sunlight','Millet crop','Soil','Cow','Water','Earthworm','Air','Grasshopper','Sparrow','Farmer','Temperature'],
    banyan:['Sunlight','Banyan tree','Squirrel','Owl','Soil','Myna','Ants','Air','Stone','Temperature']};
  function reset(){ found={}; idx=0; dwell=0; run=false; table(); $('#go').textContent='🔍 Survey'; }
  toggleWire(wrap.querySelectorAll('#habB button'),b=>{ hab=b.dataset.h; reset(); });
  $('#go').onclick=()=>{ if(idx>=ORDER[hab].length) reset(); run=!run; $('#go').textContent=run?'⏸ Pause':'🔍 Survey'; };
  $('#rs').onclick=reset;
  function table(){
    const L=ORDER[hab].filter(n=>found[n]&&items.find(i=>i.name===n&&i.living)), N=ORDER[hab].filter(n=>found[n]&&!L.includes(n));
    let html=''; for(let i=0;i<Math.max(L.length,N.length,1);i++) html+=`<tr><td class="r-ok">${L[i]||''}</td><td style="color:var(--f-blue);font-weight:700">${N[i]||''}</td></tr>`;
    $('#tb').innerHTML=html; $('#nV').textContent=Object.keys(found).length+' / '+ORDER[hab].length;
  }
  const add=(name,living,x,y)=>{ if(!items.find(i=>i.name===name)) items.push({name,living,x,y}); };

  /* ---------- scene painters: pure functions of (t, wind, sun) ---------- */
  function sky(ctx,w,h,S,sun,wind,rec){
    const e=sun.e;
    if(e>0){ const g=ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,S*3); g.addColorStop(0,'rgba(217,160,23,0.16)'); g.addColorStop(1,'rgba(217,160,23,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); }
    
    // sunbeams (yellow) reaching the ground
    ctx.save(); ctx.globalAlpha=0.35*e; for(let i=0;i<3;i++) line(ctx,sun.x,sun.y,sun.x+(w*0.5-sun.x)*0.7+(i-1)*S*1.4,h*0.64,COL.yellow,1.4,[4,8]); ctx.restore();
    for(let i=0;i<2;i++){ const cx=((i*0.47+t*0.004*(1+wind))%1.2-0.1)*w; drawCloud(ctx,cx,h*(0.1+i*0.07),S*(0.9+i*0.3)); }
    drawSun(ctx,sun.x,sun.y,S*0.3,t);
    // air — wind streaks drift at a speed set by the slider
    const ax=w*0.3, ay=h*0.2;
    for(let i=0;i<3;i++){ const ph=((t*0.12*(0.4+wind)+i*0.33)%1); const x0=ax-S*1.2+ph*S*2.4, y0=ay+i*S*0.25;
      ctx.save(); ctx.globalAlpha=Math.sin(ph*Math.PI)*(0.3+0.07*wind); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.bezierCurveTo(x0+S*0.3,y0-S*0.1,x0+S*0.5,y0+S*0.1,x0+S*0.8,y0); ctx.stroke(); ctx.restore(); }
    if(rec){ add('Sunlight',false,sun.x,sun.y); add('Air',false,ax,ay+S*0.25); }
  }
  function thermoItem(ctx,x,y,S,rec){
    thermo(ctx,x,y-S*1.1,y-S*0.25,(Tair-10)/30,COL.ink,COL.red);
    textAt(ctx,fmt(Tair,0)+' °C',x,y-S*1.25,{align:'center',size:12,weight:700,color:COL.red});
    if(rec) add('Temperature',false,x,y-S*0.6);
  }
  function stone(ctx,x,y,S,rec,nm){ ctx.save(); ctx.beginPath(); ctx.moveTo(x-S*0.35,y); ctx.quadraticCurveTo(x-S*0.32,y-S*0.3,x,y-S*0.28); ctx.quadraticCurveTo(x+S*0.35,y-S*0.25,x+S*0.38,y); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
    line(ctx,x-S*0.1,y-S*0.2,x+S*0.05,y-S*0.12,COL.mid,1.2); if(rec) add(nm||'Stone',false,x,y-S*0.15); }
  function shadow(ctx,x,gy,H,sun,dirX){ if(sun.e<0.05) return; const L=clamp(H/Math.tan(Math.asin(sun.e)),0,H*5);
    ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.ellipse(x+dirX*L/2,gy+3,L/2,4,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }

  function scene(ctx,w,h,rec){
    const S=Math.min(w/7.5,h/5.2), wind=+wR.value/10, gy=hab==='pond'?h*0.6:h*0.74;
    const hr=+hR.value, ph=(hr-6)/12, e=Math.sin(Math.PI*ph);
    const sun={x:w*(0.06+0.88*ph), y:gy-S*0.6-e*(gy-S*1.3), e};
    const sdx=sun.x<w/2?1:-1;
    sky(ctx,w,h,S,sun,wind,rec);
    if(hab==='pond'){
      const x0=w*0.2, x1=w*0.82, bot=h*0.97, sl=gy;
      // basin + water
      ctx.save(); ctx.beginPath(); ctx.moveTo(x0,gy); ctx.bezierCurveTo(x0+S*0.6,bot,x1-S*0.6,bot,x1,gy); ctx.closePath(); ctx.fillStyle='#eef6fe'; ctx.fill(); ctx.restore();
      soilDots(ctx,0,x0,gy+6,h,3,'#c9b89b',40); soilDots(ctx,x1,w,gy+6,h,4,'#c9b89b',40);
      ctx.save(); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(x0,gy); ctx.bezierCurveTo(x0+S*0.6,bot,x1-S*0.6,bot,x1,gy); ctx.lineTo(w,gy); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
      const amp=1+wind*4;
      waterSurface(ctx,x0+4,x1-4,sl,amp,t,0.045);
      if(rec){ add('Water',false,w*0.5,h*0.84); add('Soil',false,w*0.08,gy+S*0.5); }
      // fish
      for(let i=0;i<3;i++){ const cx=w*(0.38+i*0.12), A=S*(0.9-i*0.2), om=0.35+i*0.12, x=cx+A*Math.sin(t*om+i*2), dir=Math.cos(t*om+i*2)>=0?1:-1, y=h*(0.71+i*0.06)+Math.sin(t*1.3+i)*6;
        drawFish(ctx,x,y,S*0.8,dir,t); if(rec&&i===1) add('Fish',true,x,y); }
      // lotus, lily pad + frog, duck
      const sy=v=>sl+Math.sin(v*0.045-t*2.6)*amp;
      drawLotus(ctx,w*0.66,sy(w*0.66),S*0.8,t); if(rec) add('Lotus',true,w*0.66,sy(w*0.66)-S*0.15);
      const fx=w*0.3; ell(ctx,fx,sy(fx)+2,S*0.4,S*0.08); SK(ctx,COL.green,1.8,'#f1faf4');
      const hop=Math.max(0,Math.sin(t*0.5))>0.985?1:0;
      drawFrog(ctx,fx,sy(fx),S*0.7,1,t,{tongue:Math.max(0,Math.sin(t*2.4))>0.93?0.6:0,tAng:-0.6});
      if(rec) add('Frog',true,fx,sy(fx)-S*0.12);
      const dx=w*0.5+Math.sin(t*0.18)*w*0.13, ddir=Math.cos(t*0.18)>=0?1:-1;
      drawBird(ctx,dx,sy(dx)-S*0.12,S*0.85,ddir,t,BIRD.duck,{perch:true,peck:Math.sin(t*0.7)>0.6});
      if(rec) add('Duck',true,dx,sy(dx)-S*0.2);
      const dfx=w*0.5+Math.sin(t*0.9)*S*1.5, dfy=gy-S*1.2+Math.sin(t*1.8)*S*0.3;
      drawDragonfly(ctx,dfx,dfy,S*0.7,Math.cos(t*0.9)>=0?1:-1,t); if(rec) add('Dragonfly',true,dfx,dfy);
      stone(ctx,w*0.9,gy,S,rec);
      const snx=w*0.86+Math.sin(t*0.1)*S*0.2; drawSnail(ctx,snx,gy,S*0.5,1,t); if(rec) add('Snail',true,snx,gy-S*0.1);
      for(let i=0;i<5;i++) drawGrass(ctx,w*(0.03+i*0.035),gy,S*0.45,t,wind);
      if(rec) add('Grass',true,w*0.1,gy-S*0.2);
      thermoItem(ctx,w*0.95,gy-S*0.3,S,rec);
    }
    else if(hab==='forest'){
      soilDots(ctx,0,w,gy+6,h,5,'#c9b89b',90); groundLine(ctx,0,w,gy);
      [[0.1,2.3],[0.28,1.8],[0.84,2.4]].forEach(([fx,sc],i)=>{ shadow(ctx,w*fx,gy,S*sc*1.2,sun,-sdx); drawTree(ctx,w*fx,gy,S*sc,t,wind*1.5); if(rec&&i===0) add('Tree',true,w*fx,gy-S*sc*0.9); });
      for(let i=0;i<14;i++) drawGrass(ctx,w*(0.04+i*0.07),gy,S*0.4,t,wind); if(rec) add('Grass',true,w*0.46,gy-S*0.15);
      // deer walks, stops, grazes
      const cyc=(t*0.06)%1; let dxp,ddir,walking,gz=0;
      if(cyc<0.35){ dxp=smooth01(0,0.35,cyc); ddir=1; walking=true; }
      else if(cyc<0.5){ dxp=1; ddir=1; walking=false; gz=Math.sin((cyc-0.35)/0.15*Math.PI); }
      else if(cyc<0.85){ dxp=1-smooth01(0.5,0.85,cyc); ddir=-1; walking=true; }
      else { dxp=0; ddir=-1; walking=false; gz=Math.sin((cyc-0.85)/0.15*Math.PI); }
      const dxx=w*(0.36+0.16*dxp);
      drawQuad(ctx,dxx,gy,S*1.15,ddir,t,QUAD.deer,{phase:ddir*dxx/(S*0.5),move:walking?1:0,graze:gz,chew:gz>0.6});
      if(rec) add('Deer',true,dxx,gy-S*0.7);
      const hq=(t*0.6)%1, hx=w*0.64+Math.sin(t*0.12)*S*0.8, hy=gy-Math.sin(hq*Math.PI)*S*0.25;
      drawQuad(ctx,hx,hy,S*0.6,Math.cos(t*0.12)>=0?1:-1,t,QUAD.hare,{stretch:Math.sin(hq*Math.PI)});
      if(rec) add('Hare',true,hx,hy-S*0.15);
      for(let i=0;i<2;i++){ const bx=((t*0.05+i*0.45)%1.2-0.1)*w, by=h*(0.18+i*0.1)+Math.sin(t+i)*8; drawBird(ctx,bx,by,S*0.45,1,t+i,BIRD.small,{flap:t*12+i}); if(rec&&i===0) add('Bird',true,bx,by); }
      // fallen log + mushroom growing
      const lx=w*0.52; ell(ctx,lx,gy-S*0.12,S*0.6,S*0.12); SK(ctx,COL.ink,2.2,'#fff'); ell(ctx,lx+S*0.58,gy-S*0.12,S*0.05,S*0.11); SK(ctx,COL.ink,1.6,'#fff');
      drawMushroom(ctx,lx-S*0.2,gy-S*0.22,S*0.4,t,1); drawMushroom(ctx,lx+S*0.1,gy-S*0.22,S*0.3,t,1);
      if(rec) add('Mushroom',true,lx-S*0.2,gy-S*0.45);
      stone(ctx,w*0.7,gy,S,rec);
      const px=w*0.94; ell(ctx,px,gy+S*0.1,S*0.35,S*0.08); SK(ctx,COL.blue,2,'#eef6fe'); waterSurface(ctx,px-S*0.3,px+S*0.3,gy+S*0.08,0.6+wind,t,0.2);
      if(rec){ add('Water',false,px,gy+S*0.08); add('Soil',false,w*0.25,gy+S*0.6); }
      thermoItem(ctx,w*0.03+10,gy-S*0.2,S,rec);
    }
    else if(hab==='farm'){
      // soil cut-away shows an earthworm working
      soilDots(ctx,0,w,gy+6,h,6,'#c9b89b',110); groundLine(ctx,0,w,gy);
      const ch=w*0.32; ctx.save(); ctx.fillStyle='#eef6fe'; ctx.fillRect(ch-S*0.25,gy,S*0.5,S*0.22); ctx.restore(); line(ctx,ch-S*0.25,gy,ch-S*0.25,gy+S*0.22,COL.ink,2); line(ctx,ch+S*0.25,gy,ch+S*0.25,gy+S*0.22,COL.ink,2); line(ctx,ch-S*0.25,gy+S*0.22,ch+S*0.25,gy+S*0.22,COL.ink,2);
      waterSurface(ctx,ch-S*0.23,ch+S*0.23,gy+S*0.05,0.5+wind*0.5,t,0.3);
      if(rec) add('Water',false,ch,gy+S*0.1);
      const wx=w*0.18+Math.sin(t*0.3)*S*0.4; drawWorm(ctx,wx,gy+S*0.75,S*0.6,Math.cos(t*0.3)>=0?1:-1,t); if(rec) add('Earthworm',true,wx,gy+S*0.75);
      if(rec) add('Soil',false,w*0.6,gy+S*0.7);
      for(let r=0;r<2;r++) for(let i=0;i<9;i++){ const mx=w*(0.42+i*0.062)+r*S*0.2; drawMillet(ctx,mx,gy-r*3,S*(1.05-r*0.15),t,wind*1.4); }
      if(rec) add('Millet crop',true,w*0.6,gy-S*0.8);
      drawQuad(ctx,w*0.17,gy,S*0.95,1,t,QUAD.cow,{graze:0.5+0.5*Math.sin(t*0.6),chew:true}); if(rec) add('Cow',true,w*0.17,gy-S*0.45);
      const gq=(t*0.5)%1, gxx=w*0.5+((t*0.08)%1)*w*0.4, gyy=gy-S*0.9-Math.sin(gq*Math.PI)*S*0.4;
      drawGrasshopper(ctx,gxx,gyy,S*0.55,1,t,{leap:Math.sin(gq*Math.PI)}); if(rec) add('Grasshopper',true,gxx,gyy);
      const spx=w*0.38; drawBird(ctx,spx,gy-S*0.28,S*0.4,-1,t,BIRD.small,{perch:true,peck:true}); if(rec) add('Sparrow',true,spx,gy-S*0.3);
      const fpx=w*0.93-S*0.9*(0.5-0.5*Math.cos(t*0.25)), fdir=Math.sin(t*0.25)>0?-1:1;
      drawPerson(ctx,fpx,gy,S*1.2,fdir,t,{phase:fdir*fpx/(S*0.3),move:clamp(Math.abs(Math.sin(t*0.25))*3,0,1),arm:0.9}); if(rec) add('Farmer',true,fpx,gy-S*0.7);
      thermoItem(ctx,w*0.3,gy-S*0.4,S,rec);
    }
    else { // banyan
      soilDots(ctx,0,w,gy+6,h,7,'#c9b89b',90); groundLine(ctx,0,w,gy);
      const bx=w*0.48, H=S*2.4;
      shadow(ctx,bx,gy,H*0.9,sun,-sdx);
      drawTree(ctx,bx,gy,H,t,wind*0.7,{blobs:[[0,-0.9,0.36],[-0.45,-0.78,0.3],[0.45,-0.78,0.3],[-0.8,-0.68,0.22],[0.8,-0.68,0.22],[-0.2,-1.12,0.26],[0.22,-1.1,0.26]],fruit:[[-0.5,-0.6],[0.3,-0.62],[0.62,-0.58],[-0.1,-0.7],[0.75,-0.52]]});
      // prop roots hang from the branches
      for(let i=0;i<7;i++){ const rx=bx+(i-3)*H*0.24; const sw=Math.sin(t*1.2+i)*wind*3; line(ctx,rx,gy-H*0.55,rx+sw,i%3===0?gy:gy-H*0.2,COL.ink,1.4); }
      if(rec) add('Banyan tree',true,bx-H*0.05,gy-H*0.35);
      const mx=bx+H*0.3, my=gy-H*0.62; drawBird(ctx,mx,my,S*0.45,-1,t,BIRD.small,{perch:true,peck:true}); if(rec) add('Myna',true,mx,my);
      drawBird(ctx,bx-H*0.02,gy-H*0.5,S*0.5,1,t,BIRD.owl,{perch:true}); if(rec) add('Owl',true,bx,gy-H*0.54);
      // squirrel runs up and down the trunk
      const sq=(Math.sin(t*0.5)+1)/2, sqy=gy-S*0.1-sq*H*0.35, up=Math.cos(t*0.5)>0;
      ctx.save(); ctx.translate(bx+H*0.07,sqy); ctx.rotate(up?-Math.PI/2:Math.PI/2); drawQuad(ctx,0,0,S*0.8,1,t,QUAD.squirrel,{phase:t*14,move:1}); ctx.restore();
      if(rec) add('Squirrel',true,bx+H*0.07,sqy);
      for(let i=0;i<8;i++){ const q=((t*0.08+i/8)%1); const ax=bx-H*0.06-q*S*0.05, ay=gy-q*H*0.4; drawInsect(ctx,ax,ay,S*0.12,1,t); }
      if(rec) add('Ants',true,bx-H*0.07,gy-H*0.2);
      stone(ctx,w*0.82,gy,S,rec); if(rec) add('Soil',false,w*0.2,gy+S*0.6);
      thermoItem(ctx,w*0.95,gy-S*0.2,S,rec);
    }
  }

  animLoop((dt)=>{
    t+=dt;
    const hr=+hR.value; $('#hV').textContent=Math.floor(hr)+':'+String(Math.round((hr%1)*60)).padStart(2,'0'); $('#wV').textContent=wR.value;
    const e=Math.sin(Math.PI*(hr-6)/12); Tair+=((18+16*e)-Tair)*(1-Math.exp(-dt*0.8/1.5));
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    items=[]; scene(ctx,w,h,true);
    const ord=ORDER[hab];
    // survey lens
    const S=Math.min(w/7.5,h/5.2), R=S*0.95;
    if(!lens.init){ lens.x.x=w*0.5; lens.y.x=-R*2; lens.init=1; }
    let tgt=null;
    if(idx<ord.length) tgt=items.find(i=>i.name===ord[idx]);
    if(run && tgt){
      springTo(lens.x,tgt.x,26,9,dt); springTo(lens.y,tgt.y,26,9,dt); springTo(lens.r,1,30,8,dt);
      const d=Math.hypot(lens.x.x-tgt.x,lens.y.x-tgt.y);
      if(d<S*0.3) dwell+=dt;
      if(dwell>0.9){ found[tgt.name]=true; dwell=0; idx++; table(); if(idx>=ord.length){ run=false; $('#go').textContent='✓ Done · again'; } }
    } else springTo(lens.r,run?1:0,30,8,dt);
    // tags for found items (green = living, blue = non-living)
    items.forEach(it=>{ if(!found[it.name]) return; const col=it.living?COL.green:COL.blue; tag(ctx,it.x,it.y,it.x+(it.x<w*0.5?S*0.55:-S*0.55),it.y-S*0.45,it.name,col); });
    const lr=R*clamp(lens.r.x,0,1.2);
    if(lr>2){
      const lx=lens.x.x, ly=lens.y.x;
      ctx.save(); ctx.beginPath(); ctx.arc(lx,ly,lr,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
      ctx.translate(lx,ly); ctx.scale(2,2); ctx.translate(-lx,-ly); scene(ctx,w,h,false); ctx.restore();
      circ(ctx,lx,ly,lr,COL.ink,null,5);
      const hx=lx+lr*0.72, hy=ly+lr*0.72; ctx.save(); ctx.lineCap='round'; line(ctx,hx,hy,hx+lr*0.55,hy+lr*0.55,COL.ink,10); line(ctx,hx+2,hy+2,hx+lr*0.53,hy+lr*0.53,'#fff',4); ctx.restore();
      if(tgt && run){ const prog=clamp(dwell/0.9,0,1); ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(lx,ly,lr+6,-Math.PI/2,-Math.PI/2+prog*Math.PI*2); ctx.stroke(); ctx.restore(); }
    }
  });
  return wrap;
}


/* =====================================================================
   12.2 LET US RECORD — a 1 m × 1 m quadrat in the school garden
   Plan view, true scale (px per metre fixed by the canvas).
   Organisms are scattered by a patchy density field
   ρ(x,y) = ρ̄·(0.35 + Σ patches), so each throw samples a different count.
   Mean densities: doob grass 20 /m², marigold 5 /m² (the textbook's
   Plant 1 = 20, Plant 2 = 05), ants 8 /m², snails 3 /m².
   The frame is thrown on a real arc: z(τ) = 4H·τ(1 − τ), H = 1.2 m,
   seen from above as growth + a shadow offset; it lands with a
   restitution-0.3 bounce and a spring-settled spin.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Aim across <span class="val" id="axV"></span></label><input type="range" id="axR" min="0" max="100" step="1" value="40">
      <label style="margin-top:8px">Aim down <span class="val" id="ayV"></span></label><input type="range" id="ayR" min="0" max="100" step="1" value="45"></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="th" style="padding:10px;">🎯 Throw</button><button class="toggle-btn" id="rnd" style="padding:10px;">🎲 Random</button></div>
    <button class="toggle-btn navy" id="ct" style="margin-top:0;padding:10px;">🔢 Count inside</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Plant 1 · Doob grass</div><div class="rval" id="c0" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Plant 2 · Marigold</div><div class="rval" id="c1" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Animal 1 · Ants</div><div class="rval" id="c2" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Animal 2 · Snails</div><div class="rval" id="c3" style="color:var(--f-red)">—</div></div></div></div>
    <div class="control-group"><label>Table 12.2 <span class="val">per 1 m²</span></label>
      <table class="log"><thead><tr><th>Group</th><th>Grass</th><th>Marigold</th><th>Ants</th><th>Snails</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), axR=$('#axR'), ayR=$('#ayR');
  const GW=4.4, GH=3.2;                     // garden, metres
  const R=rng(1207);
  const patches=[0,1,2,3].map(()=>Array.from({length:4},()=>({x:R()*GW,y:R()*GH,s:0.35+R()*0.5,a:0.6+R()*1.4})));
  // marigolds grow in a loose bed, snails near the damp corner
  patches[1]=[{x:1.2,y:0.8,s:0.55,a:2.4},{x:3.3,y:2.3,s:0.6,a:2},{x:2.4,y:1.3,s:0.4,a:1.2}];
  patches[3]=[{x:3.6,y:0.7,s:0.6,a:3},{x:0.9,y:2.5,s:0.5,a:1.6}];
  const MEAN=[20,5,8,3], NAMES=['Doob grass','Marigold','Ants','Snails'];
  function dens(k,x,y){ let v=0.35; patches[k].forEach(p=>v+=p.a*Math.exp(-((x-p.x)**2+(y-p.y)**2)/(2*p.s*p.s))); return v; }
  const org=[];
  for(let k=0;k<4;k++){ let mx=0; for(let i=0;i<400;i++) mx=Math.max(mx,dens(k,R()*GW,R()*GH));
    const n=Math.round(MEAN[k]*GW*GH); let c=0, guard=0;
    // normalise so the garden-wide mean equals MEAN[k]
    while(c<n && guard++<20000){ const x=0.05+R()*(GW-0.1), y=0.05+R()*(GH-0.1); if(R()*mx<dens(k,x,y)){ org.push({k,x,y,a:R()*6.28,ph:R()*6,sp:k===2?0.09+R()*0.05:k===3?0.006:0,sz:k===0?0.07+R()*0.03:k===1?0.09+R()*0.03:0}); c++; } } }
  let t=0, group=0;
  const Q={x:GW*0.4,y:GH*0.45,landed:true,rot:{x:0,v:0},z:0,phase:'idle',tau:0,x0:0,y0:0,x1:0,y1:0};
  let counting=false, cell=0, cellT=0, marks=new Set(), tally=[0,0,0,0], shown=[0,0,0,0], rows=[];
  function aim(){ return {x:0.5+ (GW-1)*(+axR.value/100), y:0.5+(GH-1)*(+ayR.value/100)}; }
  function throwIt(){ if(Q.phase==='fly'||Q.phase==='bounce'||counting) return; const a=aim();
    Q.x0=GW/2; Q.y0=GH+0.9; Q.x1=a.x; Q.y1=a.y; Q.phase='fly'; Q.tau=0; pend=false; Q.rot.v=9+Math.random()*4; Q.rot.x=0; marks.clear(); tally=[0,0,0,0]; shown=[0,0,0,0]; for(let i=0;i<4;i++) $('#c'+i).textContent='—'; }
  $('#th').onclick=throwIt;
  $('#rnd').onclick=()=>{ axR.value=Math.round(Math.random()*100); ayR.value=Math.round(Math.random()*100); throwIt(); };
  let pend=false; $('#ct').onclick=()=>{ if(counting) return; if(Q.phase!=='idle'){ pend=true; return; } counting=true; cell=0; cellT=0; marks.clear(); tally=[0,0,0,0]; shown=[0,0,0,0]; };
  function inside(o,cx,cy){ return Math.abs(o.x-cx)<=0.5 && Math.abs(o.y-cy)<=0.5; }
  function table(){ let html=rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('');
    if(rows.length>1){ const avg=[0,1,2,3].map(k=>fmt(rows.reduce((s,r)=>s+r[k],0)/rows.length,1)); html+=`<tr><td class="r-ok">Avg</td>${avg.map(v=>`<td class="r-ok">${v}</td>`).join('')}</tr>`; }
    $('#tb').innerHTML=html; }

  /* plan-view organisms */
  function grassTop(ctx,x,y,r,tt){ ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i*0.785+Math.sin(tt*1.5+i)*0.08; ctx.moveTo(x,y); ctx.quadraticCurveTo(x+Math.cos(a+0.3)*r*0.6,y+Math.sin(a+0.3)*r*0.6,x+Math.cos(a)*r,y+Math.sin(a)*r); } ctx.stroke(); ctx.restore(); }
  function marigoldTop(ctx,x,y,r,tt){
    for(let i=0;i<4;i++){ const a=i*1.57+0.4; ell(ctx,x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*0.9,r*0.5,r*0.2,a); SK(ctx,COL.green,1.4,'#f1faf4'); }
    for(let i=0;i<10;i++){ const a=i*0.628+Math.sin(tt*0.8)*0.05; ell(ctx,x+Math.cos(a)*r*0.45,y+Math.sin(a)*r*0.45,r*0.28,r*0.16,a); SK(ctx,COL.ink,1.2,'#fff4c9'); }
    circ(ctx,x,y,r*0.22,COL.ink,'#fff',1.4); }
  function antTop(ctx,x,y,a,r,tt){ ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    for(let i=-1;i<=1;i++) for(const sd of [-1,1]){ const sw=Math.sin(tt*18+i*2+(sd>0?Math.PI:0))*r*0.25; line(ctx,i*r*0.3,0,i*r*0.4+sw,sd*r*0.7,COL.ink,1.1); }
    circ(ctx,-r*0.6,0,r*0.35,COL.ink,COL.ink,1); circ(ctx,0,0,r*0.2,COL.ink,COL.ink,1); circ(ctx,r*0.45,0,r*0.25,COL.ink,COL.ink,1);
    line(ctx,r*0.6,0,r*0.95,-r*0.35,COL.ink,1); line(ctx,r*0.6,0,r*0.95,r*0.35,COL.ink,1); ctx.restore(); }
  function snailTop(ctx,x,y,a,r,tt){ ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ell(ctx,r*0.25,0,r*0.95,r*0.32); SK(ctx,COL.ink,1.4,'#fff');
    line(ctx,r*1.1,-r*0.1,r*1.4+Math.sin(tt*2)*r*0.05,-r*0.35,COL.ink,1.2); line(ctx,r*1.1,r*0.1,r*1.4,r*0.35,COL.ink,1.2);
    circ(ctx,-r*0.05,0,r*0.62,COL.ink,'#fff',1.6);
    ctx.beginPath(); for(let i=0;i<=40;i++){ const q=i/40*Math.PI*4, rr=r*0.55*(1-i/46); const px=-r*0.05+Math.cos(q)*rr, py=Math.sin(q)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.strokeStyle=COL.ink; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); }

  animLoop((dt)=>{
    t+=dt; $('#axV').textContent=fmt(+axR.value/100*(GW-1)+0.5,1)+' m'; $('#ayV').textContent=fmt(+ayR.value/100*(GH-1)+0.5,1)+' m';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pm=Math.min((w-30)/GW,(h-30)/GH), ox=(w-GW*pm)/2, oy=(h-GH*pm)/2;
    const X=x=>ox+x*pm, Y=y=>oy+y*pm;
    // garden bed
    ctx.save(); rrect(ctx,ox,oy,GW*pm,GH*pm,12); ctx.fillStyle='#fbfaf6'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    soilDots(ctx,ox+6,ox+GW*pm-6,oy+6,oy+GH*pm-6,12,'#dcd0bb',260);
    // damp corner (snails like it)
    ctx.save(); ctx.globalAlpha=0.5; ell(ctx,X(3.6),Y(0.7),pm*0.55,pm*0.35); ctx.fillStyle='#eef6fe'; ctx.fill(); ctx.restore();
    // animals move: ants random-walk with persistence, snails creep
    org.forEach(o=>{ if(!o.sp) return; o.a+=gauss()*(o.k===2?2.2:0.5)*Math.sqrt(dt); o.x+=Math.cos(o.a)*o.sp*dt; o.y+=Math.sin(o.a)*o.sp*dt;
      if(o.x<0.05||o.x>GW-0.05||o.y<0.05||o.y>GH-0.05){ o.a+=Math.PI; o.x=clamp(o.x,0.05,GW-0.05); o.y=clamp(o.y,0.05,GH-0.05); } });
    org.forEach(o=>{ const x=X(o.x), y=Y(o.y);
      if(o.k===0) grassTop(ctx,x,y,o.sz*pm,t+o.ph); else if(o.k===1) marigoldTop(ctx,x,y,o.sz*pm,t+o.ph);
      else if(o.k===2) antTop(ctx,x,y,o.a,0.022*pm,t+o.ph); else snailTop(ctx,x,y,o.a,0.035*pm,t+o.ph); });
    // metre scale
    line(ctx,ox+12,oy+GH*pm-14,ox+12+pm,oy+GH*pm-14,COL.ink,2.4); line(ctx,ox+12,oy+GH*pm-20,ox+12,oy+GH*pm-8,COL.ink,2); line(ctx,ox+12+pm,oy+GH*pm-20,ox+12+pm,oy+GH*pm-8,COL.ink,2);
    textAt(ctx,'1 m',ox+12+pm/2,oy+GH*pm-20,{align:'center',size:12,weight:700});

    // aim marker
    const a=aim();
    if(Q.phase==='idle'&&!counting){ ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6; ctx.strokeRect(X(a.x-0.5),Y(a.y-0.5),pm,pm); ctx.restore(); }

    // quadrat flight
    if(Q.phase==='fly'){ Q.tau+=dt/1.1; const u=Math.min(1,Q.tau); Q.x=lerp(Q.x0,Q.x1,u); Q.y=lerp(Q.y0,Q.y1,u); Q.z=4*1.2*u*(1-u);
      Q.rot.x+=Q.rot.v*dt; if(u>=1){ Q.phase='bounce'; Q.tau=0; Q.z=0; } }
    else if(Q.phase==='bounce'){ Q.tau+=dt/0.32; const u=Math.min(1,Q.tau); Q.z=4*0.12*u*(1-u); Q.rot.v*=Math.exp(-dt*6); Q.rot.x+=Q.rot.v*dt; if(u>=1){ Q.phase='settle'; Q.z=0; Q.rot.x=((Q.rot.x+Math.PI/4)%(Math.PI/2)+Math.PI/2)%(Math.PI/2)-Math.PI/4; } }
    else if(Q.phase==='settle'){ springTo(Q.rot,0,60,9,dt); if(Math.abs(Q.rot.x)<0.002&&Math.abs(Q.rot.v)<0.02){ Q.rot.x=0; Q.phase='idle'; } }
    const onGarden=Q.y<GH+0.4;
    const sc=1+Q.z*0.4, cx=X(Q.x), cy=Y(Q.y), half=pm*0.5*sc;
    // shadow (sun from upper-left): offset grows with height
    if(Q.z>0.01){ ctx.save(); ctx.globalAlpha=0.18; ctx.translate(cx+Q.z*pm*0.25,cy+Q.z*pm*0.3); ctx.rotate(Q.rot.x); ctx.fillStyle=COL.ink; ctx.fillRect(-pm/2,-pm/2,pm,pm); ctx.restore(); }
    if(onGarden||Q.phase==='fly'){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Q.rot.x);
      ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.2; ctx.beginPath(); for(let i=1;i<4;i++){ ctx.moveTo(-half+i*half/2,-half); ctx.lineTo(-half+i*half/2,half); ctx.moveTo(-half,-half+i*half/2); ctx.lineTo(half,-half+i*half/2); } ctx.stroke();
      ctx.lineWidth=5*sc; ctx.strokeStyle=COL.yellow; ctx.strokeRect(-half,-half,2*half,2*half);
      ctx.lineWidth=1.4; ctx.strokeStyle=COL.ink; ctx.strokeRect(-half-2.5*sc,-half-2.5*sc,2*half+5*sc,2*half+5*sc);
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{ ctx.beginPath(); ctx.arc(sx*half,sy*half,4*sc,0,Math.PI*2); ctx.fillStyle=COL.ink; ctx.fill(); });
      ctx.restore();
    }

    // counting: sweep 16 sub-cells, ring each organism found
    if(counting){ cellT+=dt;
      const cs=0.25, ci=cell%4, cj=Math.floor(cell/4), cx0=Q.x-0.5+ci*cs, cy0=Q.y-0.5+cj*cs;
      ctx.save(); ctx.fillStyle='rgba(217,160,23,0.14)'; ctx.fillRect(X(cx0),Y(cy0),cs*pm,cs*pm); ctx.restore();
      if(cellT>=0.32){ org.forEach((o,i)=>{ if(!marks.has(i) && o.x>=cx0&&o.x<cx0+cs&&o.y>=cy0&&o.y<cy0+cs){ marks.add(i); tally[o.k]++; o.pop=0; } }); cellT=0; cell++;
        if(cell>=16){ counting=false; rows.push(tally.slice()); if(rows.length>6) rows.shift(); group++; table(); } }
    }
    marks.forEach(i=>{ const o=org[i]; o.pop=(o.pop||0)+dt; const pr=1+0.6*Math.exp(-o.pop*6)*Math.sin(o.pop*30);
      circ(ctx,X(o.x),Y(o.y),(o.k<2?o.sz*pm*0.9:0.05*pm)*pr,o.k<2?COL.green:COL.red,null,2.2); });
    for(let k=0;k<4;k++){ if(shown[k]<tally[k]) shown[k]=Math.min(tally[k],shown[k]+dt*30); if(counting||rows.length) $('#c'+k).textContent=Math.floor(shown[k]); }
    if(pend&&Q.phase==='idle'){ pend=false; $('#ct').onclick(); }
    $('#ct').textContent=counting?'⏳ Counting…':'🔢 Count inside';
  });
  return wrap;
}


/* =====================================================================
   12.3 LET US READ — Pond A (fish) vs Pond B (no fish)
   Food-chain rate model (time in weeks, one 20-week season → 14 s):
     larvae      dL/dt = 1.0·D·(1 − L/60) − 0.35·L − 0.12·F·L
     dragonflies dD/dt = 0.2·L − 0.25·D
     pollinators dP/dt = 0.5·P·(1 − P/30) − 0.035·D·P + 0.3
     seeds       dS/dt = 2·P
   Check (textbook claim): F = 6 → D ≈ 2, P ≈ 26, seeds ≈ 810;
                           F = 0 → D ≈ 22, P ≈ 2,  seeds ≈ 330.
   Every change in a count is shown as an event: a fish darts and eats a
   larva, a larva climbs out as a dragonfly, a dragonfly catches a bee.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Fish in Pond A <span class="val" id="fV"></span></label><input type="range" id="fR" min="0" max="8" step="1" value="6">
      <div class="hint">Pond B has no fish</div></div>
    <div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;">▶ Run a season</button><button class="toggle-btn" id="rs" style="padding:10px;">↺ Reset</button></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">&nbsp;</div><div class="rval" style="font-size:11px">Pond A<br>Pond B</div></div>
      <div class="rcard"><div class="rlabel">Dragonflies</div><div class="rval" id="rD" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Bees · butterflies</div><div class="rval" id="rP">—</div></div>
      <div class="rcard wide"><div class="rlabel">Seeds made by the flowers</div><div class="rval" id="rS" style="color:var(--f-green)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), fR=$('#fR');
  let t=0, week=0, run=false;
  const P0={L:10,D:6,P:10,S:0};
  const ponds=[0,1].map(i=>({i, st:Object.assign({},P0), fish:[], larvae:[], flies:[], bees:[], splash:[]}));
  function reset(){ week=0; run=false; ponds.forEach(p=>{ p.st=Object.assign({},P0); }); $('#go').textContent='▶ Run a season'; }
  $('#go').onclick=()=>{ if(week>=20) reset(); run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Run a season'; };
  $('#rs').onclick=reset;
  function deriv(s,F){ return {L:1.0*s.D*(1-s.L/60)-0.35*s.L-0.12*F*s.L, D:0.2*s.L-0.25*s.D, P:0.5*s.P*(1-s.P/30)-0.035*s.D*s.P+0.3, S:2*s.P}; }
  const rnd=(a,b)=>a+Math.random()*(b-a);

  animLoop((dt)=>{
    t+=dt; const F=+fR.value; $('#fV').textContent=F;
    if(run){ const dw=dt*20/14; for(let k=0;k<10;k++) ponds.forEach(p=>{ const d=deriv(p.st,p.i?0:F); for(const key in d) p.st[key]=Math.max(0,p.st[key]+d[key]*dw/10); });
      week+=dw; if(week>=20){ week=20; run=false; $('#go').textContent='✓ Season over · again'; } }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const top=h*0.2, gy=h*0.56, bot=h*0.96, half=w/2;
    const S=Math.min(half/5,h/7);

    ponds.forEach(p=>{
      const x0=p.i*half, cx=x0+half/2, px0=x0+half*0.2, px1=x0+half*0.8;
      const inW=(x,y)=>{ const u=(x-px0)/(px1-px0); if(u<0||u>1) return false; return y>gy+6 && y<gy+(bot-gy)*Math.sin(u*Math.PI)*0.95-8; };
      // bank + water
      ctx.save(); ctx.beginPath(); ctx.moveTo(px0,gy); ctx.bezierCurveTo(px0+half*0.05,bot,px1-half*0.05,bot,px1,gy); ctx.closePath(); ctx.fillStyle='#eef6fe'; ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.moveTo(x0+8,gy); ctx.lineTo(px0,gy); ctx.bezierCurveTo(px0+half*0.05,bot,px1-half*0.05,bot,px1,gy); ctx.lineTo(x0+half-8,gy); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      waterSurface(ctx,px0+3,px1-3,gy+2,1.5,t+p.i,0.06);
      soilDots(ctx,x0+6,px0-4,gy+8,bot,20+p.i,'#c9b89b',25); soilDots(ctx,px1+4,x0+half-6,gy+8,bot,30+p.i,'#c9b89b',25);
      const bottomY=u=>gy+(bot-gy)*Math.sin(clamp(u,0,1)*Math.PI)*0.75;
      // flowers on both banks — seed pods fill as seeds accumulate
      const fl=[]; for(let j=0;j<6;j++){ const fx=j<3?x0+half*(0.03+j*0.055):x0+half*(0.84+(j-3)*0.055); fl.push({x:fx,y:gy-S*1.1+Math.sin(j*2.1)*S*0.1}); }
      const seedsPer=p.st.S/6/12;
      fl.forEach((f,j)=>{ drawFlower(ctx,f.x,gy,S*1.1,t,0.3,{h:(gy-f.y)/(S*1.1),bloom:1});
        const pods=Math.min(20,Math.floor(seedsPer)); if(pods>0){ const R=rng(j+p.i*9); for(let q=0;q<pods;q++){ const a=R()*6.28, r=Math.sqrt(R())*S*0.13; dot(ctx,f.x+Math.cos(a)*r*0.6+S*0.02,gy-S*0.45-Math.abs(Math.sin(a))*r,2.3,COL.green); } } });

      /* --- sync agents to the model --- */
      const want={fish:p.i?0:F, larvae:Math.min(16,Math.round(p.st.L/2)), flies:Math.min(14,Math.round(p.st.D/1.4)), bees:Math.min(20,Math.round(p.st.P/1.4))};
      const live=a=>a.filter(o=>!o.doom);
      // fish
      while(live(p.fish).length<want.fish){ p.fish.push({x:rnd(px0+half*0.15,px1-half*0.15),y:gy+S*0.2,vx:0,vy:60,a:0,drop:1}); p.splash.push({x:p.fish[p.fish.length-1].x,t:0}); }
      if(live(p.fish).length>want.fish){ const f=live(p.fish)[0]; f.doom=1; f.leap=0; f.lx=f.x; f.ly=f.y; }
      // larvae
      while(live(p.larvae).length<want.larvae){ const u=rnd(0.15,0.85), lx=lerp(px0,px1,u); p.larvae.push({u,x:lx,y:gy+6,sink:1,ph:Math.random()*6}); }
      if(live(p.larvae).length>want.larvae){ const l=live(p.larvae)[0]; l.doom=1;
        const hunter=live(p.fish).filter(f=>!f.target)[0]; if(hunter){ hunter.target=l; l.hunted=1; } else l.emerge=1; }
      // dragonflies
      while(live(p.flies).length<want.flies){ const em=p.larvae.find(l=>l.emerge&&l.done&&!l.used); const x=em?em.x:rnd(px0,px1); if(em) em.used=1; p.flies.push({x,y:gy-4,tx:x,ty:gy-S*1.5,ph:Math.random()*6,retarget:0}); }
      if(live(p.flies).length>want.flies){ const d=live(p.flies)[0]; d.doom=1; d.tx=x0+(Math.random()<0.5?-40:half+40); d.ty=top-20; }
      // pollinators
      while(live(p.bees).length<want.bees){ p.bees.push({x:x0+(Math.random()<0.5?4:half-4),y:rnd(top+S*0.5,gy-S*1.4),fl:Math.floor(Math.random()*6),hover:0,kind:Math.random()<0.6?'bee':'bfly',ph:Math.random()*6,pollen:0}); }
      if(live(p.bees).length>want.bees){ const b=live(p.bees)[0]; b.doom=1; const hunter=live(p.flies).filter(d=>!d.prey)[0]; if(hunter){ hunter.prey=b; b.hunted=1; } else { b.leave=1; } }

      /* --- move + draw: larvae --- */
      p.larvae=p.larvae.filter(l=>{
        if(l.sink){ l.y+=40*dt; const by=bottomY(l.u)-6; if(l.y>=by){ l.y=by; l.sink=0; } }
        else if(l.emerge){ l.y-=S*0.5*dt; if(l.y<=gy+4){ l.done=1; if(!l.fade) l.fade=0; l.fade+=dt; if(l.fade>0.6) return !l.used&&l.fade<3?true:false; } }
        else if(!l.hunted){ l.u=clamp(l.u+Math.sin(t*0.4+l.ph)*0.01*dt,0.1,0.9); l.x=lerp(px0,px1,l.u); l.y=bottomY(l.u)-6; }
        if(l.eaten) return false;
        if(!l.done) drawLarva(ctx,l.x,l.y,S*0.34,Math.sin(t*0.4+l.ph)>0?1:-1,t+l.ph);
        return true; });
      /* fish swim, or dart at a larva */
      p.fish=p.fish.filter(f=>{
        if(f.doom){ f.leap+=dt/1.1; const u=f.leap; f.x=f.lx+u*S*1.4; f.y=lerp(f.ly,top+S*0.4,u)-4*S*1.2*u*(1-u); if(u>=1) return false;
          ctx.save(); ctx.globalAlpha=1-smooth01(0.7,1,u); drawFish(ctx,f.x,f.y,S*0.75,1,t,{fast:1}); ctx.restore();
          line(ctx,f.x,f.y-S*0.1,f.x,top-10,COL.mid,1.2); return true; }
        let tx,ty,spd;
        if(f.target){ tx=f.target.x; ty=f.target.y; spd=S*3; if(Math.hypot(tx-f.x,ty-f.y)<S*0.25){ f.target.eaten=1; f.target=null; f.gulp=0.4; } }
        else { f.a=(f.a||0)+gauss()*1.2*Math.sqrt(dt); tx=f.x+Math.cos(f.a)*40; ty=f.y+Math.sin(f.a)*20; spd=S*0.6; }
        const d=Math.hypot(tx-f.x,ty-f.y)||1; f.vx=approach(f.vx,(tx-f.x)/d*spd,4,dt); f.vy=approach(f.vy,(ty-f.y)/d*spd*0.7,4,dt);
        f.x+=f.vx*dt; f.y+=f.vy*dt;
        if(!inW(f.x,f.y)){ const u=clamp((f.x-px0)/(px1-px0),0.12,0.88); f.x=lerp(f.x,lerp(px0,px1,u),0.2); f.y=clamp(f.y,gy+S*0.25,bottomY(u)-S*0.25); f.a=Math.atan2((gy+bot)/2-f.y,cx-f.x); }
        drawFish(ctx,f.x,f.y,S*0.75,f.vx>=0?1:-1,t,{fast:!!f.target});
        if(f.gulp>0){ f.gulp-=dt; circ(ctx,f.x+(f.vx>=0?1:-1)*S*0.4,f.y,S*0.12*(1-f.gulp/0.4)+2,COL.red,null,2); }
        return true; });
      /* dragonflies patrol, or chase a bee */
      p.flies=p.flies.filter(d=>{
        if(d.prey){ if(d.prey.gone){ d.prey=null; } else { d.tx=d.prey.x; d.ty=d.prey.y; if(Math.hypot(d.tx-d.x,d.ty-d.y)<S*0.2){ d.prey.gone=1; d.prey=null; d.bite=0.5; } } }
        else if(!d.doom){ d.retarget-=dt; if(d.retarget<=0){ d.tx=rnd(px0-half*0.1,px1+half*0.1); d.ty=rnd(top+S*0.3,gy-S*0.5); d.retarget=rnd(0.6,1.6); } }
        const k=d.prey?7:3.2; d.x=approach(d.x,d.tx,k,dt); d.y=approach(d.y,d.ty,k,dt);
        if(d.doom && (d.x<x0-30||d.x>x0+half+30||d.y<top)) return false;
        drawDragonfly(ctx,d.x,d.y+Math.sin(t*9+d.ph)*2,S*0.6,d.tx>=d.x?1:-1,t+d.ph);
        if(d.bite>0){ d.bite-=dt; circ(ctx,d.x,d.y,S*0.3*(1-d.bite/0.5)+2,COL.red,null,2); }
        return true; });
      /* bees + butterflies: fly flower to flower on arcs, hover, carry pollen */
      p.bees=p.bees.filter(b=>{
        if(b.gone) return false;
        if(b.leave){ b.x+=(b.x<cx?-1:1)*S*1.5*dt; b.y-=S*0.3*dt; if(b.x<x0-20||b.x>x0+half+20) return false; }
        else if(!b.hunted || true){ const f=fl[b.fl], fx=f.x, fy=f.y-S*0.12;
          if(b.hover>0){ b.hover-=dt; b.x=fx+Math.sin(t*6+b.ph)*3; b.y=fy+Math.cos(t*5+b.ph)*2; if(b.hover<=0){ b.fl=(b.fl+1+Math.floor(Math.random()*5))%6; b.pollen=1; } }
          else { b.x=approach(b.x,fx,2.2,dt); b.y=approach(b.y,fy-Math.abs(b.x-fx)*0.25,2.2,dt); if(Math.hypot(b.x-fx,b.y-fy)<6) b.hover=rnd(0.7,1.4); } }
        if(b.kind==='bee') drawBee(ctx,b.x,b.y,S*0.3,1,t+b.ph,{pollen:b.pollen}); else drawButterfly(ctx,b.x,b.y,S*0.42,1,t+b.ph);
        return true; });
      // splashes
      p.splash=p.splash.filter(s=>{ s.t+=dt; for(let q=0;q<3;q++){ ctx.save(); ctx.globalAlpha=1-s.t; ctx.beginPath(); ctx.ellipse(s.x,gy+2,S*0.2*(1+s.t*3)*(1+q*0.4),4,0,0,Math.PI*2); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); } return s.t<1; });

      // seed tray: one dot per 20 seeds
      const ns=Math.floor(p.st.S/20), trx=x0+half*0.08, try_=top+S*0.35; textAt(ctx,'Seeds '+Math.round(p.st.S),trx,try_-8,{size:12,weight:700,color:COL.green});
      for(let q=0;q<ns;q++){ dot(ctx,trx+(q%24)*S*0.14,try_+Math.floor(q/24)*S*0.14,S*0.045,COL.green); }
      pill(ctx,p.i?'Pond B · no fish':'Pond A · '+F+' fish',cx,gy+S*0.05-(-(bot-gy)*0.82),p.i?COL.ink:COL.blue,{size:13});
    });
    line(ctx,half,top+10,half,h-6,COL.border||'#dbe4f0',1.4,[5,5]);

    /* Fig 12.4 — the chain, with live pulses (red = direct, green = indirect) */
    const sA=ponds[0].st, Fn=F;
    const nodes=[{n:'Fish',x:0.1},{n:'Larvae',x:0.3},{n:'Dragonfly',x:0.5},{n:'Bees',x:0.7},{n:'Seeds',x:0.9}];
    const ny=top*0.52, nr=Math.min(top*0.28,26);
    const flux=[0.12*Fn*sA.L/6, 0.2*sA.L/4, 0.035*sA.D*sA.P/3, 2*sA.P/20];
    const sgn=['−','+','−','+'];
    for(let i=0;i<4;i++){ const ax=w*nodes[i].x+nr+6, bx=w*nodes[i+1].x-nr-6; vec(ctx,ax,ny,bx,ny,COL.red,2.2);
      textAt(ctx,sgn[i],(ax+bx)/2,ny-8,{align:'center',size:16,weight:700,color:COL.red});
      const n=3; for(let q=0;q<n;q++){ const u=((t*clamp(flux[i],0.05,2)*0.8+q/n)%1); dot(ctx,lerp(ax,bx-8,u),ny,3,COL.red); } }
    curveArrow(ctx,w*0.1,ny+nr+4,w*0.9,ny+nr+4,top*0.5,COL.green,1.8,[6,5]);
    textAt(ctx,'+ indirect effect',w*0.5,ny+nr+top*0.2,{align:'center',size:12,weight:700,color:COL.green});
    nodes.forEach((nd,i)=>{ const x=w*nd.x; circ(ctx,x,ny,nr,COL.ink,'#fff',2);
      if(i===0) drawFish(ctx,x,ny,nr*1.3,1,t); else if(i===1) drawLarva(ctx,x,ny,nr*1.2,1,t); else if(i===2) drawDragonfly(ctx,x,ny,nr*1.5,1,t); else if(i===3) drawBee(ctx,x,ny,nr*0.9,1,t);
      else { for(let q=0;q<7;q++) dot(ctx,x+Math.cos(q*0.9)*nr*0.45*(q%2?1:0.5),ny+Math.sin(q*0.9)*nr*0.45*(q%2?1:0.5),3,COL.green); }
      textAt(ctx,nd.n,x,ny-nr-6,{align:'center',size:11,weight:700,color:COL.muted}); });

    // week clock
    textAt(ctx,'Week '+Math.floor(week)+' / 20',w-10,h-10,{align:'right',size:13,weight:700,color:COL.ink});
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(w*0.02,h-6); ctx.lineTo(w*0.02+(w*0.75)*week/20,h-6); ctx.stroke(); ctx.restore();
    $('#rD').innerHTML=Math.round(ponds[0].st.D)+'<br>'+Math.round(ponds[1].st.D);
    $('#rP').innerHTML=Math.round(ponds[0].st.P)+'<br>'+Math.round(ponds[1].st.P);
    $('#rS').textContent='A: '+Math.round(ponds[0].st.S)+'   ·   B: '+Math.round(ponds[1].st.S);
  });
  return wrap;
}


/* =====================================================================
   12.4 LET US RELATE AND IDENTIFY — interactions in a pond habitat
   Abiotic links are driven by real relations:
     air temperature   dT/dt = (20 + 16·sun − T)/τ,  τ = 2 s
     evaporation rate  E ∝ sun·(1 + 0.04·(T − 20)) + 0.25·wind
     wave amplitude    a ∝ wind²   (wind-sea grows with U²), capped
     wet-soil band     width ∝ 1/(1 + sun) near the water's edge
   Biotic links (frog eats insects, snake eats fish, fish lay eggs,
   frog and fish compete for larvae) run as looping behaviours.
   The camera springs to each interaction; you sort it into
   Criterion 1 (living↔non-living), 2 (non-living↔non-living) or
   3 (living↔living).  Link colours: green = 1, blue = 2, red = 3.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Sunlight <span class="val" id="sV"></span></label><input type="range" id="sR" min="0" max="100" step="1" value="70"></div>
    <div class="control-group"><label>Wind <span class="val" id="wV"></span></label><input type="range" id="wR" min="0" max="10" step="0.5" value="3"></div>
    <button class="toggle-btn play" id="nx" style="padding:10px;margin-top:0">▶ Next interaction</button>
    <div class="control-group"><label style="margin-bottom:4px;">This is…</label>
      <button class="opt-btn" data-c="1"><b style="color:var(--f-green)">1</b> · Living ↔ non-living</button>
      <button class="opt-btn" data-c="2"><b style="color:var(--f-blue)">2</b> · Non-living ↔ non-living</button>
      <button class="opt-btn" data-c="3"><b style="color:var(--f-red)">3</b> · Living ↔ living</button>
      <div id="fb"></div></div>
    <div class="control-group"><label>Table 12.3 <span class="val" id="nV">0 / 10</span></label>
      <table class="log"><thead><tr><th style="color:var(--f-green)">1</th><th style="color:var(--f-blue)">2</th><th style="color:var(--f-red)">3</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), sR=$('#sR'), wR=$('#wR');
  const IA=[
    {txt:'Earthworms live in moist soil',c:1,short:'Worm · moist soil',f:'worm'},
    {txt:'Many microbes live in the pond water',c:1,short:'Microbes · water',f:'mic'},
    {txt:'A fish lays eggs in water',c:1,short:'Fish eggs · water',f:'eggs'},
    {txt:'Bright sunlight makes the day hot',c:2,short:'Sun · temperature',f:'sun'},
    {txt:'Sunlight makes water evaporate fast',c:2,short:'Sun · evaporation',f:'evap'},
    {txt:'Wind blowing on water makes waves',c:2,short:'Wind · waves',f:'wave'},
    {txt:'Soil near the pond is moist',c:2,short:'Water · soil',f:'bank'},
    {txt:'A frog eats insects',c:3,short:'Frog eats insect',f:'frog'},
    {txt:'A water snake eats fish',c:3,short:'Snake eats fish',f:'snake'},
    {txt:'Frogs and fish compete for insect larvae',c:3,short:'Frog vs fish · larvae',f:'comp'},
  ];
  let cur=-1, answered={}, t=0, T=28, fbT=0;
  const cam={x:{x:0.5,v:0},y:{x:0.5,v:0},z:{x:1,v:0}};
  $('#nx').onclick=()=>{ const left=IA.map((_,i)=>i).filter(i=>!answered[i]); if(!left.length){ answered={}; table(); cur=-1; $('#nx').textContent='▶ Next interaction'; return; }
    cur=left[(left.indexOf(cur)+1)%left.length]; if(answered[cur]) cur=left[0]; $('#fb').innerHTML=''; wrap.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active')); };
  wrap.querySelectorAll('.opt-btn').forEach(b=>b.onclick=()=>{ if(cur<0) return; wrap.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const ok=+b.dataset.c===IA[cur].c;
    $('#fb').innerHTML=ok?'<div class="fb ok">✓ Criterion '+IA[cur].c+'</div>':'<div class="fb bad">✗ Look at what is living in it</div>';
    if(ok){ answered[cur]=true; table(); fbT=1.2; } });
  function table(){ const cols=[1,2,3].map(c=>IA.filter((x,i)=>x.c===c&&answered[i]).map(x=>x.short)); let html='';
    for(let r=0;r<4;r++){ if(!cols.some(c=>c[r])) continue; html+='<tr>'+cols.map(c=>`<td>${c[r]||''}</td>`).join('')+'</tr>'; }
    $('#tb').innerHTML=html; $('#nV').textContent=Object.keys(answered).length+' / 10'; }
  const CC={1:COL.green,2:COL.blue,3:COL.red};

  // living actors
  const insects=Array.from({length:4},(_,i)=>({x:0.3+i*0.03,y:0.4,ph:i*1.7,eaten:0}));
  const fishes=Array.from({length:3},(_,i)=>({x:0.62+i*0.1,y:0.72+i*0.05,a:Math.random()*6,vx:0,vy:0,alive:1,resp:0}));
  const eggs=[], wisps=[];
  let frogT=0, frogTgt=null, frogDir=1, snakeT=0, snakeX=0.6, compT=0;
  const larva={x:0.58,y:0.62,ph:0};

  animLoop((dt)=>{
    t+=dt; const sun=+sR.value/100, wind=+wR.value; $('#sV').textContent=sR.value+'%'; $('#wV').textContent=wR.value;
    T+=((20+16*sun)-T)*(1-Math.exp(-dt/2));
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const S=Math.min(w/7,h/5);
    const WX=u=>u*w, WY=v=>v*h;
    const gy=0.55, px0=0.46, px1=0.98;
    const F={worm:[0.2,0.78,2.2],mic:[0.8,0.84,2.4],eggs:[0.56,0.7,2.2],sun:[0.2,0.2,1.6],evap:[0.72,0.45,2],wave:[0.72,0.55,2.4],bank:[0.4,0.62,2.2],frog:[0.34,0.45,2.2],snake:[0.75,0.56,2],comp:[0.55,0.58,2]};
    const f=cur>=0?F[IA[cur].f]:[0.5,0.5,1];
    springTo(cam.x,f[0],18,8,dt); springTo(cam.y,f[1],18,8,dt); springTo(cam.z,f[2],18,8,dt);
    const z=cam.z.x, cx=clamp(cam.x.x,0.5/z,1-0.5/z), cy=clamp(cam.y.x,0.5/z,1-0.5/z);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(z,z); ctx.translate(-cx*w,-cy*h);

    /* --- sky: sun (yellow), rays, air currents --- */
    const sx=WX(0.12), sy=WY(0.16);
    ctx.save(); ctx.globalAlpha=0.3+0.7*sun; drawSun(ctx,sx,sy,S*(0.22+0.12*sun),t); ctx.restore();
    for(let i=0;i<Math.round(sun*6);i++){ const u=((t*0.35+i/6)%1); const ex=WX(0.25+i*0.1), ey=WY(gy); line(ctx,lerp(sx,ex,u),lerp(sy,ey,u),lerp(sx,ex,Math.min(1,u+0.08)),lerp(sy,ey,Math.min(1,u+0.08)),COL.yellow,2); }
    for(let i=0;i<3;i++){ const ph=((t*0.1*(0.5+wind*0.4)+i*0.33)%1); const x0=WX(0.45+ph*0.5), y0=WY(0.3+i*0.05); ctx.save(); ctx.globalAlpha=Math.sin(ph*Math.PI)*Math.min(1,0.15+wind/8); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.bezierCurveTo(x0+S*0.3,y0-S*0.1,x0+S*0.5,y0+S*0.1,x0+S*0.8,y0); ctx.stroke(); ctx.restore(); }
    // thermometer
    const thx=WX(0.3), thy=WY(0.08);
    thermo(ctx,thx,thy,thy+S*0.8,(T-10)/30,COL.ink,COL.red); textAt(ctx,fmt(T,0)+' °C',thx+14,thy+S*0.3,{size:12,weight:700,color:COL.red});

    /* --- ground, moist bank, soil --- */
    const wetW=0.14/(1+sun);
    ctx.save(); ctx.beginPath(); ctx.rect(0,WY(gy),WX(px0+0.05),h); ctx.clip(); const g=ctx.createRadialGradient(WX(px0),WY(gy),0,WX(px0),WY(gy),WX(wetW)*2); g.addColorStop(0,'rgba(47,143,224,0.3)'); g.addColorStop(1,'rgba(47,143,224,0)'); ctx.fillStyle=g; ctx.fillRect(0,WY(gy),WX(px0+0.05),h); ctx.restore();
    soilDots(ctx,0,WX(px0),WY(gy)+6,h,41,'#c9b89b',120);
    // pond basin
    const bot=0.97;
    ctx.save(); ctx.beginPath(); ctx.moveTo(WX(px0),WY(gy)); ctx.bezierCurveTo(WX(px0+0.06),WY(bot),WX(px1-0.02),WY(bot),WX(px1),WY(gy)); ctx.lineTo(WX(px1),WY(gy)); ctx.closePath(); ctx.fillStyle='#eef6fe'; ctx.fill(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.moveTo(0,WY(gy)); ctx.lineTo(WX(px0),WY(gy)); ctx.bezierCurveTo(WX(px0+0.06),WY(bot),WX(px1-0.02),WY(bot),WX(px1),WY(gy)); ctx.lineTo(w,WY(gy)); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    const amp=Math.min(9,0.5+0.09*wind*wind), kk=0.08-0.004*wind;
    waterSurface(ctx,WX(px0)+3,WX(px1)-3,WY(gy),amp,t*(0.6+wind*0.12),kk);
    // reeds (vegetation) where fish hide eggs
    for(let i=0;i<5;i++){ const rx=WX(0.52+i*0.02); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(rx,WY(0.8)); ctx.quadraticCurveTo(rx+Math.sin(t+i)*3,WY(0.6),rx+Math.sin(t*1.3+i)*6+wind,WY(0.47)); ctx.stroke(); ctx.restore(); }
    for(let i=0;i<6;i++) drawGrass(ctx,WX(0.02+i*0.06),WY(gy),S*0.45,t,0.2+wind*0.06);

    /* --- evaporation: vapour wisps rise, drift with wind --- */
    const E=sun*(1+0.04*(T-20))+0.25*wind/10;
    if(Math.random()<E*dt*7) wisps.push({x:lerp(px0+0.04,px1-0.04,Math.random()),y:gy-0.01,age:0});
    wisps.forEach(p=>{ p.age+=dt; p.y-=0.05*dt; p.x+=0.004*wind*dt; });
    for(let i=wisps.length-1;i>=0;i--) if(wisps[i].age>3) wisps.splice(i,1);
    wisps.forEach(p=>{ ctx.save(); ctx.globalAlpha=Math.sin(p.age/3*Math.PI)*0.7; ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); for(let q=0;q<=8;q++){ const yy=WY(p.y)-q*3, xx=WX(p.x)+Math.sin(q*0.9+p.age*4)*3; q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore(); });

    /* --- earthworm in moist soil (moves toward the wet band) --- */
    const wmx=WX(clamp(0.2+0.05*Math.sin(t*0.3),0.05,0.4)), wmy=WY(0.75+0.05*sun+0.02*Math.sin(t*0.5));
    drawWorm(ctx,wmx,wmy,S*0.8,Math.cos(t*0.3)>=0?1:-1,t,{bend:0.1});
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.setLineDash([3,4]); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(wmx-S*0.5,wmy+2); ctx.quadraticCurveTo(wmx-S,wmy-S*0.3,wmx-S*1.3,WY(gy)); ctx.stroke(); ctx.restore();

    /* --- frog on the bank snaps at flying insects --- */
    const fx=WX(0.34), fy=WY(gy);
    insects.forEach(q=>{ if(q.eaten>0){ q.eaten-=dt; return; } q.x=0.34+0.08*Math.sin(t*0.9+q.ph); q.y=0.4+0.05*Math.sin(t*1.7+q.ph*2); });
    frogT+=dt; let tongue=0, tAng=0;
    if(frogT>2.6){ const cand=insects.filter(q=>q.eaten<=0).sort((a,b)=>Math.hypot(WX(a.x)-fx,WY(a.y)-fy)-Math.hypot(WX(b.x)-fx,WY(b.y)-fy))[0];
      if(cand){ frogTgt=cand; const u=(frogT-2.6)/0.35; const tx=WX(cand.x), ty=WY(cand.y); frogDir=tx<fx?-1:1; const mouthX=fx+frogDir*S*0.3, mouthY=fy-S*0.17; tAng=Math.atan2(ty-mouthY,(tx-mouthX)*frogDir); tongue=Math.sin(Math.min(1,u)*Math.PI)*Math.hypot(tx-mouthX,ty-mouthY)/(S*0.7);
        if(u>=0.5 && !cand.hit){ cand.hit=1; } if(u>=1){ cand.eaten=3; cand.hit=0; frogT=0; } } else frogT=0; }
    drawFrog(ctx,fx,fy,S*0.7,frogDir,t,{tongue,tAng});
    insects.forEach(q=>{ if(q.eaten>0) return; drawInsect(ctx,WX(q.x),WY(q.y),S*0.16,Math.cos(t*0.9+q.ph)>0?1:-1,t+q.ph,{fly:1}); });

    /* --- fish swim; one lays eggs by the reeds --- */
    fishes.forEach((q,i)=>{
      if(!q.alive){ q.resp-=dt; if(q.resp<=0){ q.alive=1; q.x=px1-0.03; q.y=0.8; } return; }
      let tx=0.72+0.15*Math.sin(t*0.25+i*2), ty=0.72+0.08*Math.sin(t*0.4+i);
      if(i===0){ tx=0.555+0.02*Math.sin(t*0.8); ty=0.7; }
      if(i===1 && compT>3.5) { tx=larva.x; ty=larva.y; }
      q.vx=approach(q.vx,(tx-q.x)*1.2,3,dt); q.vy=approach(q.vy,(ty-q.y)*1.2,3,dt); q.x+=q.vx*dt; q.y+=q.vy*dt;
      drawFish(ctx,WX(q.x),WY(q.y),S*0.6,q.vx>=0?1:-1,t+i);
      if(i===0 && Math.random()<dt*1.5) eggs.push({x:q.x-0.012,y:q.y,vy:0.02,stuck:0,age:0});
    });
    eggs.forEach(e=>{ e.age+=dt; if(!e.stuck){ e.y+=e.vy*dt; e.x+=(0.53+((e.age*7)%1)*0.08-e.x)*dt*0.8; if(e.y>0.74) e.stuck=1; } });
    for(let i=eggs.length-1;i>=0;i--) if(eggs[i].age>9) eggs.splice(i,1);
    eggs.forEach(e=>circ(ctx,WX(e.x),WY(e.y),3,COL.ink,'#fff',1.2));

    /* --- competition: a larva wriggles; the frog leaps, the fish rushes --- */
    compT+=dt; if(compT>6) compT=0;
    larva.y=0.6+0.01*Math.sin(t*3);
    if(compT<5) drawLarva(ctx,WX(larva.x),WY(larva.y),S*0.3,1,t);
    if(compT>3.5 && compT<5){ const u=(compT-3.5)/1.5; ctx.save(); ctx.setLineDash([4,4]); line(ctx,fx+S*0.3,fy-S*0.2,WX(larva.x),WY(larva.y),COL.red,1.6,[4,4]); ctx.restore(); }

    /* --- water snake swims at the surface and strikes a fish --- */
    snakeT+=dt; snakeX=0.64+0.12*Math.sin(t*0.2);
    const sxp=WX(snakeX), syp=WY(gy)+2; const strike=snakeT>5?Math.sin(Math.min(1,(snakeT-5)/0.5)*Math.PI):0;
    drawSnake(ctx,sxp,syp+strike*S*0.35,S*1.2,Math.cos(t*0.2)>=0?1:-1,t,{strike});
    if(snakeT>5.5){ snakeT=0; const v=fishes[2]; if(v.alive){ v.alive=0; v.resp=4; } }

    /* --- microbes: magnified view inside the pond --- */
    const mx=WX(0.8), my=WY(0.84), mR=S*0.42;
    ctx.save(); ctx.beginPath(); ctx.arc(mx,my,mR,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.clip();
    for(let i=0;i<9;i++){ const a=t*0.3+i*0.7, r=mR*0.55*Math.abs(Math.sin(i*1.3+t*0.2)); const qx=mx+Math.cos(a+i)*r, qy=my+Math.sin(a*1.2+i)*r;
      if(i%3===0){ ell(ctx,qx,qy,mR*0.22,mR*0.09,a); SK(ctx,COL.ink,1.4,'#fff'); ell(ctx,qx,qy,mR*0.06,mR*0.05); SK(ctx,COL.blue,1.2); }
      else if(i%3===1){ ctx.save(); ctx.translate(qx,qy); ctx.rotate(a*2); rrect(ctx,-mR*0.1,-mR*0.035,mR*0.2,mR*0.07,mR*0.035); ctx.restore(); SK(ctx,COL.ink,1.2,'#fff'); }
      else { circ(ctx,qx,qy,mR*0.05,COL.green,'#f1faf4',1.2); } }
    ctx.restore(); circ(ctx,mx,my,mR,COL.ink,null,3); textAt(ctx,'× 400',mx,my+mR+14,{align:'center',size:11,weight:700,color:COL.mid});

    /* --- the current interaction: double-headed link, coloured by criterion --- */
    if(cur>=0){ const it=IA[cur], col=answered[cur]?CC[it.c]:COL.yellow;
      const P={worm:[[wmx,wmy],[WX(0.3),WY(0.68)]],mic:[[mx,my-mR*0.5],[WX(0.86),WY(0.62)]],eggs:[[WX(fishes[0].x),WY(fishes[0].y)],[WX(0.54),WY(0.76)]],
        sun:[[sx,sy],[thx,thy+S*0.4]],evap:[[sx+S*0.3,sy+S*0.2],[WX(0.72),WY(0.46)]],wave:[[WX(0.62),WY(0.33)],[WX(0.72),WY(gy)]],bank:[[WX(0.5),WY(0.6)],[WX(0.4),WY(0.65)]],
        frog:[[fx+frogDir*S*0.2,fy-S*0.3],[WX((frogTgt||insects[0]).x),WY((frogTgt||insects[0]).y)]],snake:[[sxp,syp],[WX(fishes[2].x),WY(fishes[2].y)]],comp:[[fx,fy-S*0.3],[WX(fishes[1].x),WY(fishes[1].y)]]}[it.f];
      const [a,b]=P; line(ctx,a[0],a[1],b[0],b[1],col,3/z*1.4,[8/z,5/z]); circ(ctx,a[0],a[1],5/z*1.5,col,col,1); circ(ctx,b[0],b[1],5/z*1.5,col,col,1);
    }
    ctx.restore();
    // caption (screen space)
    if(cur>=0){ const it=IA[cur]; pill(ctx,it.txt,w/2,26,answered[cur]?CC[it.c]:COL.ink,{size:14}); }
    else pill(ctx,'Press ▶ Next interaction',w/2,26,COL.ink,{size:13});
    if(fbT>0){ fbT-=dt; if(fbT<=0 && Object.keys(answered).length<10) $('#nx').onclick(); }
    $('#nx').textContent=Object.keys(answered).length===10?'↺ Start again':'▶ Next interaction';
  });
  return wrap;
}


/* =====================================================================
   12.5 LET US CLASSIFY — eating habits (Table 12.4)
   Each organism walks, hops, glides or grows on stage and then feeds
   in a loop (graze, pounce, dive, peck, decompose, photosynthesise).
   Walkers move at constant speed with the gait phase locked to the
   distance covered (φ = x / stride · 2π) so the feet never slide.
   A correct answer sends it on a parabolic arc into its group:
   y(u) = lerp(y0, y1, u) − 4·H·u(1 − u).
   ===================================================================== */
function buildA5(){
  const ORG=[
    {id:'deer',n:'Deer',g:1},{id:'hare',n:'Hare',g:1},{id:'vulture',n:'Vulture',g:2},{id:'fox',n:'Bengal fox',g:3},{id:'shikra',n:'Shikra',g:2},
    {id:'squirrel',n:'Squirrel',g:3},{id:'mouse',n:'Mouse',g:3},{id:'mushroom',n:'Mushroom',g:4},{id:'tree',n:'Tree',g:0}];
  const GR=['Makes own food','Plants only','Animals only','Plants + animals','Dead matter'];
  const GC=[COL.green,COL.green,COL.red,COL.yellow,COL.mid];
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:2px;">Organism</label><div class="chip-wrap" id="orgs">${ORG.map((o,i)=>`<button class="chip-btn${i?'':' active'}" data-i="${i}">${o.n}</button>`).join('')}</div></div>
    <div class="control-group"><label style="margin-bottom:2px;">It feeds on…</label>
      ${GR.map((g,i)=>`<button class="opt-btn" data-g="${i}">${['☀️','🌿','🍖','🌿🍖','🍂'][i]}  ${g}</button>`).join('')}
      <div id="fb"></div></div>
    <div class="control-group"><label>Table 12.4 <span class="val" id="nV">0 / 9</span></label>
      <table class="log"><tbody id="tb"></tbody></table></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let t=0, sel=0, placed={}, order=[];
  const st={x:-0.3, ft:0, mode:'enter', shake:{x:0,v:0}, grow:{x:0,v:0}};
  function pick(i){ sel=i; st.x=-0.25; st.ft=0; st.mode='enter'; st.grow={x:0,v:0}; st.shake={x:0,v:0};
    wrap.querySelectorAll('#orgs .chip-btn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i)); $('#fb').innerHTML=''; }
