<style>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 11: LIGHT: SHADOWS AND REFLECTIONS
   Activities 11.1 – 11.10 (NCERT Curiosity, gecu111). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS that the
   objects spring towards. Light is traced as real straight lines: rays are
   sampled from a finite source through holes, pipes and slits, shadows are
   rendered pixel by pixel from how much of the torch each point can see,
   mirrors obey angle of incidence = angle of reflection, and pinhole images
   are built from the actual u, v and hole size.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }

    ctx.moveTo(hc.x-r*1.05,hc.y-r*0.1); ctx.quadraticCurveTo(hc.x-r*1.25,hc.y+r*1.6,hc.x-r*0.7,hc.y+r*2.0); ctx.lineTo(hc.x+r*0.7,hc.y+r*2.0);
    ctx.quadraticCurveTo(hc.x+r*1.25,hc.y+r*1.6,hc.x+r*1.05,hc.y-r*0.1); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }

  limb(ctx,[hipR,{x:hipR.x+LR.kx,y:hipY+LR.ky},{x:hipR.x+LR.fx,y:hipY+LR.fy}],wd*1.12,col);
  const foot=(hx,L,s)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(hx+L.fx+s*H*0.022,hipY+L.fy-wd*0.3,H*0.04,wd*0.42,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); };

  ctx.beginPath(); ctx.moveTo(sc.x-px.x*nk,sc.y-px.y*nk-2); ctx.quadraticCurveTo(shL.x-up.x*0,shL.y-2,shL.x-px.x*wd*0.3+(-up.x)*dn,shL.y+(-up.y)*dn);

/* ---------------------------------------------------------------------
   0h. CHAPTER-11 HELPERS — light. A torch, screens on stands, an eye,

const WARM='#fff4c4', DARKROOM='#1d2a3c', SHADE='#3a4658';
/* torch pointing along angle ang; (x,y) = centre of the glass; s = scale.
   br 0…1 = how bright. Returns the glass centre and half-height. */
function torchDraw(ctx,x,y,ang,br,s){
  s=s||1; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s); ctx.lineJoin='round';
  ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(-34,-15); ctx.lineTo(-120,-15); ctx.quadraticCurveTo(-128,-15,-128,-7); ctx.lineTo(-128,7); ctx.quadraticCurveTo(-128,15,-120,15); ctx.lineTo(-34,15); ctx.lineTo(0,24); ctx.closePath(); ctx.fill(); ctx.stroke();
  for(let k=0;k<5;k++) line(ctx,-108+k*9,-15,-108+k*9,15,COL.mid,1.2);
  rrect(ctx,-70,-21,16,7,3); ctx.fillStyle=br>0.05?COL.yellow:'#fff'; ctx.fill(); ctx.stroke();       // switch
  line(ctx,-34,-15,-34,15,COL.ink,1.6);
  ctx.beginPath(); ctx.moveTo(-3,-22); ctx.quadraticCurveTo(-26,0,-3,22); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke();   // reflector
  circ(ctx,-14,0,4.5,COL.ink,br>0.05?mixCol('#ffffff',COL.yellow,0.6):'#fff',1.6);                      // bulb
  line(ctx,0,-24,0,24,br>0.05?COL.yellow:COL.ink,3.4);                                                // glass
  ctx.restore();
  if(br>0.02) glow(ctx,x,y,34*s,COL.yellow,0.55*br);
  return {x,y,R:22*s};
}
/* a card screen standing on a foot (side view); x = its face */
function screenSide(ctx,x,top,bot,o){ o=o||{}; ctx.save(); ctx.lineJoin='round';
  rect(ctx,x,top,7,bot-top,COL.ink,'#fff',2.2); line(ctx,x+3.5,bot,x+3.5,bot+(o.leg||14),COL.ink,3); line(ctx,x-18,bot+(o.leg||14),x+26,bot+(o.leg||14),COL.ink,3.2);
  if(o.label) textAt(ctx,o.label,x+3,top-10,{align:'center',size:12,weight:700,color:o.col||COL.green});
  ctx.restore(); }
/* a line-drawn eye looking along ang (side view) */
function eyeSide(ctx,x,y,ang,s,col){ s=s||1; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,Math.cos(ang)<-0.01?-s:s); ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-16,0); ctx.quadraticCurveTo(-2,-14,12,-3); ctx.quadraticCurveTo(14,0,12,3); ctx.quadraticCurveTo(-2,14,-16,0); ctx.closePath();
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=2.2; ctx.stroke();
  circ(ctx,5,0,5.2,col||COL.green,'#fff',2); circ(ctx,7,0,2.4,COL.ink,COL.ink,1);
  ctx.beginPath(); ctx.moveTo(-18,-6); ctx.quadraticCurveTo(-4,-20,12,-9); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }
/* a plane mirror from a→b; the silvered back (hatched) is on the side of `back` (±1 along the normal) */
function mirrorSeg(ctx,ax,ay,bx,by,back,o){ o=o||{}; const L=Math.hypot(bx-ax,by-ay)||1, tx=(bx-ax)/L, ty=(by-ay)/L, nx=-ty*back, ny=tx*back, th=o.th||6;
  ctx.save(); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(bx+nx*th,by+ny*th); ctx.lineTo(ax+nx*th,ay+ny*th); ctx.closePath(); ctx.fillStyle=o.steel?'#eef2f7':'#e3f0fb'; ctx.fill();
  ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke();
  ctx.save(); ctx.clip(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1; for(let s=-th;s<L+th;s+=7){ ctx.beginPath(); ctx.moveTo(ax+tx*s,ay+ty*s); ctx.lineTo(ax+tx*(s+th)+nx*th,ay+ty*(s+th)+ny*th); ctx.stroke(); } ctx.restore();
  line(ctx,ax,ay,bx,by,o.col||COL.blue,o.w||3.4); ctx.restore(); }
/* reflect direction d about unit normal n */
function reflect(dx,dy,nx,ny){ const k=2*(dx*nx+dy*ny); return {x:dx-k*nx, y:dy-k*ny}; }
/* ray (px,py)+t(dx,dy) against segment a–b → {t,u} or null */
function raySeg(px,py,dx,dy,ax,ay,bx,by){ const ex=bx-ax, ey=by-ay, den=dx*ey-dy*ex; if(Math.abs(den)<1e-9) return null;

function fillPoly(ctx,pts,fill,stroke,lw){ ctx.save(); ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.5; ctx.stroke(); } ctx.restore(); }
/* horizontal ruler with ticks every `step` units, px per unit k */
function rulerH(ctx,x0,y,len,k,step,lab,col){ ctx.save(); rect(ctx,x0,y,len*k,16,col||COL.ink,'#fff',1.6);
  for(let v=0;v<=len+1e-9;v+=step/2){ const X=x0+v*k, big=Math.abs(v/step-Math.round(v/step))<1e-6; line(ctx,X,y,X,y+(big?9:5),col||COL.ink,1.1); if(big&&lab) textAt(ctx,lab(v),X,y+15,{align:'center',size:9,weight:600,color:COL.muted}); }
  ctx.restore(); }
/* dimension line with arrows at both ends and a label in the middle */
function dimH(ctx,x0,x1,y,txt,col){ if(Math.abs(x1-x0)<4) return; line(ctx,x0,y,x1,y,col,1.6); const s=Math.sign(x1-x0); arrowHead(ctx,x0,y,s>0?Math.PI:0,col,6); arrowHead(ctx,x1,y,s>0?0:Math.PI,col,6);
  line(ctx,x0,y-6,x0,y+6,col,1.4); line(ctx,x1,y-6,x1,y+6,col,1.4); if(txt) tag(ctx,txt,(x0+x1)/2,y-12,col,{size:11}); }
function dimV(ctx,x,y0,y1,txt,col,side){ if(Math.abs(y1-y0)<4) return; line(ctx,x,y0,x,y1,col,1.6); const s=Math.sign(y1-y0); arrowHead(ctx,x,y0,s>0?-Math.PI/2:Math.PI/2,col,6); arrowHead(ctx,x,y1,s>0?Math.PI/2:-Math.PI/2,col,6);
  if(txt) tag(ctx,txt,x+(side||1)*30,(y0+y1)/2,col,{size:11}); }
/* a clamp stand holding a thin card / object at height y, standing on floor fy */
function standPost(ctx,x,y,fy){ ctx.save(); line(ctx,x,y,x,fy,COL.ink,3); line(ctx,x-20,fy,x+20,fy,COL.ink,3.4); ctx.restore(); }
/* a panel frame with a title strip */
function panelFrame(ctx,x,y,w,h,title,col,dark){ ctx.save(); rrect(ctx,x,y,w,h,10); ctx.fillStyle=dark?DARKROOM:'#fff'; ctx.fill(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=2; ctx.stroke();
  if(title) tag(ctx,title,x+w/2,y,col||COL.ink,{size:11}); ctx.restore(); }
/* spring helper for a whole object of named fields */
function sprStep(S,T,k,c,dt){ for(const key in T){ const v=S['v_'+key]||0, a=(T[key]-S[key])*k-v*c; S['v_'+key]=v+a*dt; S[key]+=S['v_'+key]*dt; } }
function sprRest(S,T,eps){ for(const key in T){ if(Math.abs(T[key]-S[key])>(eps||0.01)||Math.abs(S['v_'+key]||0)>(eps||0.01)*4) return false; } return true; }
/* a small candle on the table (flame via lab.js) */
function candleSmall(ctx,x,base,h,t,lit,lean){ return candleDraw(ctx,x,base,24,h,{lit,f:lit?1:0,t,lean:lean||0,fh:46,fw:17,wickH:10}); }

/* =====================================================================
   11.1 LET US INVESTIGATE — light through three holes in a line
   Real geometry in millimetres (all straight lines): torch glass = disc of radius 10 mm at
   x = 0, matchbox holes (radius 2.2 mm) at x = 150, 300, 450 mm, screen at
   x = 600 mm. Straight lines are sampled through random points of hole 1 and hole 2
   (equal measure each), kept only if they start on the torch glass and
   clear hole 3. Spot brightness = kept lines ÷ kept lines when all three
   holes are exactly in line. Drawn rays run glass → hole 1 and stop on the
   first box face they hit outside a hole. Boxes slide on a spring (k 40, c 7).
   Drawn in a cabinet projection: x along the bench, z (sideways) recedes
   up-left, transverse sizes ×2.6 so a 2 mm shift is visible.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Move a matchbox</label>
      <div class="toggle-group"><button class="toggle-btn" id="b0">Box 1</button><button class="toggle-btn active" id="b1">Box 2</button><button class="toggle-btn" id="b2">Box 3</button></div>
      <label style="margin-top:9px">Up / down <span class="val" id="dyv">0 mm</span></label><input type="range" id="dy" min="-6" max="6" step="0.5" value="0">
      <label style="margin-top:6px">Sideways <span class="val" id="dzv">0 mm</span></label><input type="range" id="dz" min="-6" max="6" step="0.5" value="0">
      <div class="toggle-group"><button class="toggle-btn" id="line">↔ Put all holes in line</button><button class="toggle-btn" id="nudge">✋ Nudge a box</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Spot on screen',COL.green)}${card('k2','Worst hole off the line',COL.red)}${card('k3','Box 1 · 2 · 3 height',COL.red)}${card('k4','Box 1 · 2 · 3 sideways',COL.red)}</div>
      <div class="fb" id="obs"></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn" id="torch">🔦 Torch off</button></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const XB=[150,300,450], XS=600, RH=2.2, RS=10, N=2400, kx=0.85, kt=2.6, OX=205, OY=352;
  const B=[{y:0,z:0,vy:0,vz:0},{y:5,z:0,vy:0,vz:0},{y:0,z:0,vy:0,vz:0}], T=[{y:0,z:0},{y:5,z:0},{y:0,z:0}];
  let sel=1, t=0, on=true, bright=0, frac=0, hits=[], ends=[];
  // fixed sample set: (source point, point in hole 1) as unit-disc offsets
  const R=rng(11), S=[]; const disc=()=>{ let a,b; do{ a=R()*2-1; b=R()*2-1; }while(a*a+b*b>1); return [a,b]; };
  for(let i=0;i<N;i++){ const s=disc(), h=disc(); S.push([s[0]*RS,s[1]*RS,h[0]*RH,h[1]*RH]); }
  // visual lines: torch glass → hole 1, followed until they stop
  function trace(P){ const out=[];
    for(let i=0;i<N;i+=40){ const q=S[i], sy=q[0], sz=q[1], hy=P[0].y+q[2], hz=P[0].z+q[3];
      const my=(hy-sy)/XB[0], mz=(hz-sz)/XB[0]; let stop=-1;
      for(let k=1;k<3;k++){ const y=sy+my*XB[k], z=sz+mz*XB[k]; const dy=y-P[k].y, dz=z-P[k].z; if(dy*dy+dz*dz>RH*RH && Math.abs(dy)<18 && Math.abs(dz)<26){ stop=k; break; } }
      const X=stop<0?XS:XB[stop]; out.push({x:X,stop,hy,hz,sy,sz}); }
    // brightness: every straight line through hole 1 and hole 2 (equal measure), kept if it comes from the glass and clears hole 3
    let pass=0; const hs=[];
    for(let i=0;i<N;i++){ const q=S[i], ay=P[0].y+q[2], az=P[0].z+q[3], by=P[1].y+q[0]*RH/RS, bz=P[1].z+q[1]*RH/RS;
      const my=(by-ay)/(XB[1]-XB[0]), mz=(bz-az)/(XB[1]-XB[0]), y0=ay-my*XB[0], z0=az-mz*XB[0]; if(y0*y0+z0*z0>RS*RS) continue;
      const y3=ay+my*(XB[2]-XB[0])-P[2].y, z3=az+mz*(XB[2]-XB[0])-P[2].z; if(y3*y3+z3*z3>RH*RH) continue;
      pass++; hs.push([ay+my*(XS-XB[0]),az+mz*(XS-XB[0])]); }
    return {pass,hs,out}; }
  const full=trace([{y:0,z:0},{y:0,z:0},{y:0,z:0}]).pass;
  const pj=(x,y,z)=>({x:OX+x*kx-z*kt*0.5, y:OY-y*kt+z*kt*0.3});
  function setSel(i){ sel=i; ['#b0','#b1','#b2'].forEach((q,j)=>$(q).classList.toggle('active',j===i)); $('#dy').value=T[i].y; $('#dz').value=T[i].z; showV(); }
  function showV(){ $('#dyv').textContent=fmt(T[sel].y,1)+' mm'; $('#dzv').textContent=fmt(T[sel].z,1)+' mm'; }

    const inset=[pj(x+2.5,y1,z0+2.5),pj(x+D-2.5,y1,z0+2.5),pj(x+D-2.5,y1,z1-2.5),pj(x+2.5,y1,z1-2.5)]; fillPoly(ctx,inset,'#fff',COL.red,1);

  function holeAt(k,fill){ const b=B[k]; ctx.save(); ctx.beginPath(); for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, p=pj(XB[k],b.y+Math.sin(a)*RH,b.z+Math.cos(a)*RH); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }

    ctx.closePath(); ctx.fillStyle=rgba(COL.yellow,0.45); ctx.fill(); ctx.restore(); }
  let ctx;

  animLoop(dt=>{ t+=dt;
    B.forEach((b,i)=>{ b.vy+=((T[i].y-b.y)*40-b.vy*7)*dt; b.vz+=((T[i].z-b.z)*40-b.vz*7)*dt; b.y+=b.vy*dt; b.z+=b.vz*dt; });

    // ---------- draw ----------

    // table
    fillPoly(ctx,[pj(-150,-40,-70),pj(640,-40,-70),pj(640,-40,70),pj(-150,-40,70)],'#fff',COL.ink,2);
    // screen (farthest) with the spot
    const sc=[pj(XS,-40,-45),pj(XS,50,-45),pj(XS,50,45),pj(XS,-40,45)];
    fillPoly(ctx,[pj(XS,-40,-45),pj(XS+6,-40,-45),pj(XS+6,50,-45),pj(XS,50,-45)],'#fff',COL.green,2);
    fillPoly(ctx,sc,'#fff',COL.green,2.6);
    if(bright>0.01){ ctx.save(); ctx.beginPath(); sc.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.clip();
      const n=Math.min(hits.length,500); ctx.globalAlpha=Math.min(1,0.08+0.9*bright)*Math.min(1,40/Math.max(1,n)*3);
      for(let i=0;i<n;i++){ const q=hits[i*Math.floor(hits.length/n)], p=pj(XS,q[0],q[1]); glow(ctx,p.x,p.y,7,COL.yellow,0.5); } ctx.restore(); }
    textAt(ctx,'Screen',pj(XS,50,0).x,pj(XS,50,0).y-12,{align:'center',size:13,weight:700,color:COL.green});
    // boxes back-to-front, with the light lines between them
    const segs=k=>ends.forEach(e=>{ if(!on) return; const x0=XB[k], x1=Math.min(e.x,k<2?XB[k+1]:XS); if(e.stop>=0&&e.stop<=k) return;
        const ya=e.sy+(e.hy-e.sy)*x0/XB[0], za=e.sz+(e.hz-e.sz)*x0/XB[0], yb=e.sy+(e.hy-e.sy)*x1/XB[0], zb=e.sz+(e.hz-e.sz)*x1/XB[0];
        const a=pj(x0,ya,za), b=pj(x1,yb,zb); rayPath(ctx,[a,b],COL.yellow,t,0.35,1.1,{arrows:false,dashes:[6,10],speed:90});
        if(e.stop===k+1){ glow(ctx,b.x,b.y,6,COL.yellow,0.9); } });
    for(let k=2;k>=0;k--){ segs(k); drawBox(k);
      if(on&&k===0) patch(XB[0],0,0,RS+XB[0]*0.05,0.9);
      holeAt(k, on && (k===0 || ends.some(e=>e.stop<0||e.stop>k)) ? '#fff3b8' : '#2b3a4f');
      const lp=pj(XB[k]+8,B[k].y+30,B[k].z); textAt(ctx,String(k+1),lp.x,lp.y,{align:'center',size:14,weight:800,color:COL.red});
    }
    // torch cone to box 1
    if(on){ const tip=pj(0,0,0), e1=pj(XB[0],RS+XB[0]*0.05,0), e2=pj(XB[0],-(RS+XB[0]*0.05),0); fillPoly(ctx,[pj(0,RS,0),e1,e2,pj(0,-RS,0)],rgba(COL.yellow,0.18));
      rayPath(ctx,[tip,pj(XB[0],0,0)],COL.yellow,t,0.8,1.6,{arrows:false,dashes:[6,10],speed:90}); }
    const tp=pj(0,0,0); line(ctx,tp.x-60,pj(0,-40,0).y,tp.x-60,tp.y+16,COL.ink,3); rect(ctx,tp.x-110,pj(0,-40,0).y-2,100,4,COL.ink,COL.ink,1);
    torchDraw(ctx,tp.x,tp.y,0,lamp,1.05);
    // selected box marker
    const sb=pj(XB[sel]+8,B[sel].y-26,B[sel].z-26); tag(ctx,'moving',sb.x,sb.y+18,COL.red,{size:10.5});

    // ---------- inset 1: looking along the line of holes ----------
    panelFrame(ctx,20,24,170,170,'Look along the holes',COL.ink); const cx=105, cy=110, sc2=15;
    ctx.save(); rrect(ctx,20,24,170,170,10); ctx.clip();
    ctx.fillStyle=DARKROOM; ctx.fillRect(20,24,170,170);
    // intersection of the three holes = the only straight path
    ctx.save(); B.forEach(b=>{ ctx.beginPath(); ctx.arc(cx-b.z*sc2,cy-b.y*sc2,RH*sc2,0,Math.PI*2); ctx.clip(); }); ctx.fillStyle=on?'#ffe58a':'#556'; ctx.fillRect(20,24,170,170); ctx.restore();
    B.forEach((b,i)=>{ ctx.save(); ctx.setLineDash(i===0?[]:i===1?[6,4]:[2,4]); circ(ctx,cx-b.z*sc2,cy-b.y*sc2,RH*sc2,i===sel?'#ffffff':'#ffb4a6',null,2); ctx.restore();
      textAt(ctx,String(i+1),cx-b.z*sc2+RH*sc2*0.8,cy-b.y*sc2-RH*sc2*0.8,{size:11,weight:800,color:'#ffb4a6'}); });
    ctx.restore();
    // ---------- inset 2: the screen, face on ----------
    panelFrame(ctx,610,24,170,170,'Screen',COL.green); ctx.save(); rrect(ctx,610,24,170,170,10); ctx.clip(); ctx.fillStyle='#e9edf3'; ctx.fillRect(610,24,170,170);
    if(bright>0.005){ const n=Math.min(hits.length,700); ctx.globalCompositeOperation='source-over';
      for(let i=0;i<n;i++){ const q=hits[Math.floor(i*hits.length/n)]; glow(ctx,695-q[1]*4.2,109-q[0]*4.2,9,COL.yellow,Math.min(0.9,bright*12/Math.sqrt(n+1))); } }

    setv($,'k2',fmt(Math.max(...B.map(b=>Math.hypot(b.y,b.z))),1)+' mm');
    setv($,'k3',B.map(b=>fmt(b.y,1)).join(' · ')+' mm'); setv($,'k4',B.map(b=>fmt(b.z,1)).join(' · ')+' mm');
    const o=$('#obs'), msg=!on?['warn','Switch the torch on.']:frac>0.6?['ok','All three holes in one straight line → a bright spot on the screen.']:frac>0.02?['warn','Holes only partly in line → a dim spot. Only straight lines that pass all three holes reach the screen.']:['bad','A hole is out of line → no spot. Light stops on the face of the box — it cannot bend round to the next hole.'];
    if(o.textContent!==msg[1]){ o.textContent=msg[1]; o.className='fb '+msg[0]; }
  });
  return wrap;
}

/* =====================================================================
   11.2 LET US EXPLORE — candle flame through a straight and a bent pipe
   The flexible pipe keeps its length (440 px): straight part 180, a bend
   of radius 90 through angle β, then the rest. Its inner radius is 12 px.
   Light = straight lines from random points of the flame into the mouth
   of the pipe. Each line is marched through the pipe; a line whose
   distance from the pipe's centre line exceeds the inner radius has hit
   the dull inside wall and is absorbed. "Light reaching the eye" = lines
   that leave the far end and enter the pupil ÷ the same for a straight
   pipe. β moves on a spring (k 30, c 6), so the pipe flexes and settles.
   Photons are drawn slowed down enormously so the path can be followed.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Bend the pipe <span class="val" id="bv">0°</span></label><input type="range" id="bend" min="0" max="90" step="1" value="0">
      <div class="toggle-group"><button class="toggle-btn active" id="st">Straight pipe (a)</button><button class="toggle-btn" id="bt">Bent pipe (b)</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Light reaching your eye',COL.green)}${card('k2','Can you see the flame?',COL.green)}${card('k3','Bend angle',COL.red)}${card('k4','Stopped by the wall',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>
    <div class="control-group"><label>Show</label><div class="toggle-group"><button class="toggle-btn active" id="sl">Sight line</button><button class="toggle-btn active" id="ph">Light particles</button></div>
      <div class="hint">⚠ Light the candle only with an adult.</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const X0=210, Y0=292, L1=180, RB=90, LP=440, RI=12, TY=430, FX=120, FY=292;
  let t=0, beta={x:0,v:0}, bT=0, showSight=true, showPh=true, eyeFrac=1, full=1, lastB=-1, stopped=0, ph=[], acc=0;
  $('#bend').oninput=e=>{ bT=+e.target.value*Math.PI/180; $('#bv').textContent=e.target.value+'°'; $('#st').classList.toggle('active',bT<0.01); $('#bt').classList.toggle('active',bT>=0.01); };
  $('#st').onclick=()=>{ $('#bend').value=0; $('#bend').oninput({target:$('#bend')}); };
  $('#bt').onclick=()=>{ $('#bend').value=60; $('#bend').oninput({target:$('#bend')}); };
  $('#sl').onclick=()=>{ showSight=!showSight; $('#sl').classList.toggle('active',showSight); };
  $('#ph').onclick=()=>{ showPh=!showPh; $('#ph').classList.toggle('active',showPh); };
  // centre line: straight → arc (bending upward) → straight
  function geom(b){ const arc=RB*b, L2=LP-L1-arc, cx=X0+L1, cy=Y0-RB;              // arc centre above the pipe
    const ex={x:cx+RB*Math.sin(b), y:cy+RB*Math.cos(b)}, u={x:Math.cos(b), y:-Math.sin(b)};
    return {b,cx,cy,L2,ex,u,end:{x:ex.x+u.x*L2,y:ex.y+u.y*L2}}; }
  function at(G,s){ if(s<=L1) return {x:X0+s,y:Y0,a:0}; const arc=RB*G.b; if(s<=L1+arc){ const f=(s-L1)/RB; return {x:G.cx+RB*Math.sin(f),y:G.cy+RB*Math.cos(f),a:-f}; }
    const q=s-L1-arc; return {x:G.ex.x+G.u.x*q,y:G.ex.y+G.u.y*q,a:-G.b}; }
  function dist(G,x,y){ // distance to the centre line and whether we are past the far end
    let d=Infinity;
    if(x<=X0+L1) d=Math.abs(y-Y0); else d=Math.hypot(x-(X0+L1),y-Y0);
    const ang=Math.atan2(x-G.cx,y-G.cy); if(ang>=0&&ang<=G.b) d=Math.min(d,Math.abs(Math.hypot(x-G.cx,y-G.cy)-RB));
    const px=x-G.ex.x, py=y-G.ex.y, s=px*G.u.x+py*G.u.y; if(s>=0&&s<=G.L2) d=Math.min(d,Math.abs(px*G.u.y-py*G.u.x)); else if(s>G.L2) return {d,past:true};
    return {d,past:false}; }
  function eyePos(G){ return {x:G.end.x+G.u.x*46,y:G.end.y+G.u.y*46}; }
  // straight lines from the flame into the mouth; how many reach the pupil?
  const R=rng(5), LS=[]; for(let i=0;i<700;i++) LS.push([ (R()-0.5)*14, -R()*38, (R()*2-1)*RI ]);
  function flameLines(G){ let ok=0; const E=eyePos(G);
    for(const q of LS){ const sx=FX+q[0], sy=FY+q[1], ey=Y0+q[2], dx=X0-sx, dy=ey-sy, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
      let x=X0, y=ey, hit=false, out=false; for(let k=0;k<260;k++){ x+=ux*3; y+=uy*3; const D=dist(G,x,y); if(D.past){ out=true; break; } if(D.d>RI){ hit=true; break; } }
      if(out&&!hit){ const px=E.x-x, py=E.y-y; if(Math.abs(px*uy-py*ux)<10&&px*ux+py*uy>0) ok++; } }
    return ok; }
  full=flameLines(geom(0));

  animLoop(dt=>{ t+=dt;
    beta.v+=((bT-beta.x)*30-beta.v*6)*dt; beta.x+=beta.v*dt; const G=geom(Math.max(0,beta.x));
    if(Math.abs(G.b-lastB)>0.003){ eyeFrac=flameLines(G)/full; lastB=G.b; }
    // photons (slowed down) — straight lines from the flame
    acc+=dt*70; while(acc>=1){ acc-=1; const sx=FX+(Math.random()-0.5)*14, sy=FY-Math.random()*38, into=Math.random()<0.75;
      const tx=into?X0:FX+Math.cos(Math.random()*6.28)*300, ty=into?Y0+(Math.random()*2-1)*RI:FY+Math.sin(Math.random()*6.28)*300, L=Math.hypot(tx-sx,ty-sy);
      ph.push({x:sx,y:sy,vx:(tx-sx)/L*330,vy:(ty-sy)/L*330,life:0,dead:0,inP:false}); }
    ph.forEach(p=>{ if(p.dead){ p.dead+=dt; return; } p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.x>=X0){ const D=dist(G,p.x,p.y);
        if(D.past) p.inP=false;
        else if(p.inP){ if(D.d>RI){ p.dead=0.001; stopped++; } }
        else if(D.d<=RI&&p.x<X0+8) p.inP=true;
        else if(D.d<=RI+6) p.dead=0.001; } });
    ph=ph.filter(p=>p.dead<0.5&&p.life<3&&p.x<820&&p.x>-20&&p.y>-20&&p.y<520);

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,20,800,500]);
    tableTop(ctx,20,780,TY,0);
    const cd=candleSmall(ctx,FX,TY,96,t,true,0);
    // pipe: outer skin + inner channel
    const n=80, P=[]; for(let i=0;i<=n;i++) P.push(at(G,LP*i/n));
    // stands
    const s1=at(G,60); standPost(ctx,s1.x,s1.y+RI+6,TY); const s2=at(G,LP-40); line(ctx,s2.x,s2.y+RI+6,s2.x,TY,COL.ink,3); line(ctx,s2.x-20,TY,s2.x+20,TY,COL.ink,3.4);
    const side=(off)=>P.map(p=>({x:p.x-Math.sin(p.a)*off, y:p.y+Math.cos(p.a)*off}));
    const oT=side(-RI-6), oB=side(RI+6), iT=side(-RI), iB=side(RI);
    fillPoly(ctx,oT.concat(oB.slice().reverse()),'#dfe5ee'); fillPoly(ctx,iT.concat(iB.slice().reverse()),'#fbfcfe');
    [oT,oB].forEach(S=>{ ctx.save(); ctx.beginPath(); S.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore(); });
    [iT,iB].forEach(S=>{ ctx.save(); ctx.beginPath(); S.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore(); });
    [0,LP].forEach(s=>{ const p=at(G,s); line(ctx,p.x-Math.sin(p.a)*(-RI-6),p.y+Math.cos(p.a)*(-RI-6),p.x-Math.sin(p.a)*(RI+6),p.y+Math.cos(p.a)*(RI+6),COL.ink,2.6); });
    // ribs so the flex is visible
    for(let s=20;s<LP;s+=20){ const p=at(G,s); line(ctx,p.x-Math.sin(p.a)*(-RI-6),p.y+Math.cos(p.a)*(-RI-6),p.x-Math.sin(p.a)*(-RI),p.y+Math.cos(p.a)*(-RI),COL.mid,1); line(ctx,p.x-Math.sin(p.a)*(RI),p.y+Math.cos(p.a)*(RI),p.x-Math.sin(p.a)*(RI+6),p.y+Math.cos(p.a)*(RI+6),COL.mid,1); }
    // photons
    if(showPh) ph.forEach(p=>{ const a=p.dead?1-p.dead*2:1; if(a<=0) return; if(p.dead){ circ(ctx,p.x,p.y,2.4+p.dead*8,COL.red,null,1.4); } else { ctx.save(); ctx.globalAlpha=a; line(ctx,p.x-p.vx*0.02,p.y-p.vy*0.02,p.x,p.y,COL.yellow,2.4); circ(ctx,p.x,p.y,2.2,COL.yellow,COL.yellow,1); ctx.restore(); } });
    // eye at the far end + sight line straight back
    const E=eyePos(G);
    if(showSight){ let x=G.end.x, y=G.end.y, hit=null; const ux=-G.u.x, uy=-G.u.y; for(let k=0;k<200;k++){ x+=ux*3; y+=uy*3; const D=dist(G,x,y); if(x<X0){ break; } if(D.d>RI){ hit={x,y}; break; } }
      const endP=hit||{x:FX,y:FY-18}; ctx.save(); ctx.setLineDash([7,6]); line(ctx,E.x,E.y,endP.x,endP.y,COL.green,2); ctx.restore(); if(hit){ mark(ctx,hit.x,hit.y-14,false,1); } }
    eyeSide(ctx,E.x,E.y,Math.atan2(-G.u.y,-G.u.x),1.4,COL.ink);
    if(eyeFrac>0.05) glow(ctx,E.x,E.y,26,COL.yellow,eyeFrac*0.5);
    // inset: what the eye sees
    const ix=110, iy=110, IR=68; panelFrame(ctx,ix-IR-12,iy-IR-18,IR*2+24,IR*2+36,'What your eye sees',COL.green,true);
    ctx.save(); ctx.beginPath(); ctx.arc(ix,iy+6,IR,0,Math.PI*2); ctx.clip(); ctx.fillStyle='#0d1522'; ctx.fillRect(ix-IR,iy-IR,IR*2,IR*2+12);
    for(let k=5;k>=1;k--){ const off=G.b*k*9; circ(ctx,ix+0,iy+6-off*0.2,IR*k/5,'#3c4a5e',k===5?'#232f40':null,1.5); }
    const fa=clamp(eyeFrac,0,1); if(fa>0.01){ ctx.save(); ctx.globalAlpha=fa; circ(ctx,ix,iy+6,IR*0.24,'#5a4a20','#2a2410',1.5); flameOne(ctx,ix,iy+22,12,34,t,COL.yellow,COL.blue); ctx.restore(); }
    ctx.restore();
    ctx.restore();

    // ---------- side ----------
    setv($,'k1',Math.round(eyeFrac*100)+' %'); setc($,'k1',eyeFrac>0.05?COL.green:COL.red);
    setv($,'k2',eyeFrac>0.2?'Yes':eyeFrac>0.02?'Barely':'No'); setc($,'k2',eyeFrac>0.2?COL.green:COL.red);
    setv($,'k3',Math.round(Math.max(0,beta.x)*180/Math.PI)+'°'); setv($,'k4',String(stopped));

/* =====================================================================
   11.3 LET US EXPERIMENT — transparent, translucent, opaque (Table 11.1)
   Each material splits the light that falls on it into three parts:
   passes straight through (Td), passes but is scattered (Ts) and is
   absorbed or reflected (the rest). Approximate values for a thin sheet:
     glass 0.90 / 0.02 · clear plastic 0.85 / 0.05 · tracing paper 0.04 / 0.55
     notebook paper 0 / 0.25 · thick cloth 0 / 0.015 · cardboard 0 / 0
     steel plate 0 / 0 (but reflects 0.6 back)
   Screen picture = sharp spot × Td + a wide glow (Gaussian, σ = half the
   sheet-to-screen distance, same energy) × Ts, shown through an exposure
   curve 1 − e^(−3I). "Passes fully" if Td + Ts ≥ 0.7, "partially" if
   ≥ 0.05, else "not at all". Photons (slowed down) take each path at
   random with those same odds. The sheet is lowered on a spring.
   ===================================================================== */
function buildA3(){
  const MAT=[
    {n:'Glass',td:0.90,ts:0.02,rf:0.06,col:'#8cc6ee',look:'glass'},
    {n:'Clear plastic',td:0.85,ts:0.05,rf:0.05,col:'#9ad0f0',look:'glass'},
    {n:'Tracing paper',td:0.04,ts:0.55,rf:0.2,col:'#d9dde6',look:'paper'},
    {n:'Notebook paper',td:0,ts:0.25,rf:0.5,col:'#eef0f4',look:'paper'},
    {n:'Thick cloth',td:0,ts:0.015,rf:0.2,col:'#b04a3a',look:'cloth'},
    {n:'Cardboard',td:0,ts:0,rf:0.3,col:'#c9a26b',look:'card'},
    {n:'Steel plate',td:0,ts:0,rf:0.6,col:'#aab4c2',look:'steel',mirror:true}];
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>1 · Pick an object</label><div class="chip-wrap" id="mats">${MAT.map((m,i)=>`<button class="chip-btn${i?'':' active'}" data-i="${i}">${m.n}</button>`).join('')}</div></div>
    <div class="control-group"><label>2 · Predict: light will pass…</label><div class="toggle-group" id="pred"><button class="toggle-btn small" data-p="2">Fully</button><button class="toggle-btn small" data-p="1">Partially</button><button class="toggle-btn small" data-p="0">Not at all</button></div>
      <div class="toggle-group"><button class="toggle-btn play" id="place">3 · Place it in the beam</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Light getting through',COL.green)}${card('k2','Passes',COL.green)}</div><div class="fb" id="obs" style="display:none"></div></div>
    <div class="control-group"><label>Table 11.1</label><div id="tab"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const TX=96, TY=262, SX=560, HX=330, TABLE=430, HALF=Math.tan(7*Math.PI/180);
  let t=0, mi=0, cur=0, pred=-1, drop={x:0,v:0}, want=0, ph=[], acc=0, meas=0, settle=0, rows=[], logged=false;
  const face=document.createElement('canvas'); face.width=100; face.height=100; const fctx=face.getContext('2d'), img=fctx.createImageData(100,100);
  wrap.querySelectorAll('#mats .chip-btn').forEach(b=>b.onclick=()=>{ wrap.querySelectorAll('#mats .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); mi=+b.dataset.i; pred=-1; paintPred(); want=0; logged=false; });
  wrap.querySelectorAll('#pred .toggle-btn').forEach(b=>b.onclick=()=>{ pred=+b.dataset.p; paintPred(); });

  $('#place').onclick=()=>{ if(want&&cur===mi){ want=0; return; } want=1; logged=false; };
  const cls=v=>v>=0.7?2:v>=0.05?1:0, WORD=['Not at all','Partially','Fully'], TYPE=['Opaque','Translucent','Transparent'];
  function paintTab(){ $('#tab').innerHTML=rows.length?logTable(['Material','Predicted','Observed','Type'],rows.map(r=>[r.n,r.p<0?'—':WORD[r.p],{v:WORD[r.o],c:r.p<0?'':r.p===r.o?'r-ok':'r-bad'},TYPE[r.o]])):'<div class="hint">Predict, then place each object. Rows appear here.</div>'; }

    // swap the sheet only while it is up out of the beam
    const tgt=(want&&cur===mi)?1:0; if(drop.x<0.03&&cur!==mi) cur=mi;

    const M=MAT[cur], inB=clamp(drop.x,0,1.2), cover=smooth01(0.55,0.98,inB);          // how much of the beam the sheet covers

        rows=rows.filter(r=>r.n!==M.n); rows.push({n:M.n,p:pred,o}); paintTab(); const ob=$('#obs'); ob.style.display='';
        ob.textContent=M.n+': light passes '+WORD[o].toLowerCase()+' → '+TYPE[o].toLowerCase()+'.'+(pred<0?'':pred===o?' Your prediction was right.':' Different from your prediction.'); ob.className='fb '+(pred<0||pred===o?'ok':'warn'); } } else settle=0;
    // photons
    acc+=dt*120; while(acc>=1){ acc-=1; const a=(Math.random()*2-1)*7*Math.PI/180, y0=TY+(Math.random()*2-1)*18; ph.push({x:TX,y:y0,vx:Math.cos(a)*430,vy:Math.sin(a)*430,st:0,d:0}); }
    const sy0=TY-86+(1-inB)*-300, sy1=TY+86+(1-inB)*-300;       // sheet top / bottom
    ph.forEach(p=>{ if(p.d){ p.d+=dt; return; } const nx=p.x+p.vx*dt;
      if(p.st===0&&p.x<HX&&nx>=HX&&p.y>sy0&&p.y<sy1){ const r=Math.random();
        if(r<M.td) p.st=1; else if(r<M.td+M.ts){ p.st=2; const a=gauss()*0.45, sp=430; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp; }
        else if(M.mirror||r<M.td+M.ts+M.rf*0.3){ p.st=3; p.vx=-p.vx; }
        else { p.d=0.001; p.x=HX; return; } }

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[-40,60,800,470]);

    if(M.mirror&&cover>0.1){ fillPoly(ctx,[{x:HX,y:TY-beamR(HX)},{x:TX-80,y:TY-beamR(HX)-(HX-TX+80)*HALF},{x:TX-80,y:TY+beamR(HX)+(HX-TX+80)*HALF},{x:HX,y:TY+beamR(HX)}],rgba(COL.blue,0.1*cover)); }
    // screen (side)
    screenSide(ctx,SX,TY-150,TABLE-14,{label:'Screen',leg:14});
    const scrLit=clamp(meas,0,1); if(scrLit>0.02) line(ctx,SX,TY-R2*(td>0.3?1:1.6),SX,TY+R2*(td>0.3?1:1.6),COL.yellow,4*scrLit+0.5);
    // holder + sheet (lowered from above)
    const off=(1-inB)*-300; standPost(ctx,HX+26,TY+100+Math.min(0,off)*0,TABLE); line(ctx,HX+26,TY-110+off,HX+26,TY+100,COL.ink,3);
    line(ctx,HX+26,TY-110+off,HX+6,TY-110+off,COL.ink,3); rect(ctx,HX-6,TY-118+off,14,14,COL.ink,'#fff',2);                         // clip
    ctx.save(); const sh=[HX-4,TY-86+off,8,172]; rrect(ctx,...sh,2); ctx.fillStyle=M.look==='glass'?rgba(M.col,0.35):M.col; ctx.fill(); ctx.strokeStyle=M.look==='glass'?COL.blue:COL.red; ctx.lineWidth=2.2; ctx.stroke();
    if(M.look==='cloth'){ ctx.clip(); for(let y=sh[1];y<sh[1]+172;y+=5) line(ctx,sh[0],y,sh[0]+8,y+3,'#7a2e24',1); }
    if(M.look==='steel'){ line(ctx,HX-4,sh[1]+2,HX-4,sh[1]+170,COL.blue,2.6); }
    ctx.restore();
    if(ts>0.05&&cover>0.5) glow(ctx,HX,TY,40,COL.yellow,ts*0.9);                                        // translucent sheet glows
    textAt(ctx,M.n,HX,TY-128+off,{align:'center',size:13,weight:700,color:COL.red});
    // photons
    ph.forEach(p=>{ const a=p.d?1-p.d/0.35:1; ctx.save(); ctx.globalAlpha=a*0.9; const c=p.st===3?COL.blue:COL.yellow;
      if(p.d) circ(ctx,p.x,p.y,1.5+p.d*10,p.x>=SX-1?COL.yellow:COL.red,null,1.2); else { line(ctx,p.x-p.vx*0.018,p.y-p.vy*0.018,p.x,p.y,c,2.2); } ctx.restore(); });

    ctx.save(); rrect(ctx,618,134,166,166,8); ctx.clip(); ctx.imageSmoothingEnabled=true; ctx.drawImage(face,618,134,166,166); ctx.restore();

  });

}

/* =====================================================================
   11.4 LET US EXPLORE — shadows (Table 11.2)
   3-D model in mm: torch glass = disc, radius 14 mm, at x = 0; screen at
   x = 600 mm; object on a rod at distance d. Every pixel of the screen
   (72 × 72, 5 mm each) asks: of 37 points spread over the torch glass, how many can I see past the object? That fraction × the torch's beam
   pattern is the brightness — so the dark core (umbra) and the grey rim
   (penumbra) come out on their own. Cards tilt about a horizontal axis
   (real ray–plane intersection); a ball is a true sphere. Side view shows
   the same thing in section: edge rays from the top and bottom of the
   glass past the object's edges. d, tilt, lift and screen position all
   move on springs.
   ===================================================================== */
function buildA4(){
  const SH={ ball:{n:'Ball'}, square:{n:'Square card'}, star:{n:'Star cut-out'}, tri:{n:'Triangle card'} };
  const CL={red:COL.red,blue:COL.blue,green:COL.green,yellow:COL.yellow};

    <div class="control-group"><label>Object</label><div class="chip-wrap" id="shp">${Object.keys(SH).map((k,i)=>`<button class="chip-btn${i===1?' active':''}" data-k="${k}">${SH[k].n}</button>`).join('')}</div>

    <div class="control-group"><label>Object position <span class="val" id="dv">300 mm from torch</span></label><input type="range" id="d" min="120" max="540" step="5" value="300">
      <div class="hint" style="display:flex;justify-content:space-between;margin-top:2px"><span>← closer to torch</span><span>closer to screen →</span></div>
      <label style="margin-top:6px">Tilt the object <span class="val" id="tv">0°</span></label><input type="range" id="tilt" min="0" max="70" step="1" value="0"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn active" id="tOn">🔦 Torch on</button><button class="toggle-btn active" id="sIn">Screen in</button><button class="toggle-btn active" id="oIn">Object in</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Shadow height',COL.green)}${card('k2','Object height',COL.red)}${card('k3','Blurred rim',COL.green)}${card('k4','Shadow colour',COL.green)}</div></div>
    <div class="control-group"><label>Table 11.2</label><div id="tab"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const RS=14, L=600, G=72, PX=5, K=0.9, X0=30, Y0=235, FLOOR=440;
  const SRC=[[0,0]]; [6,12,18].forEach((n,ri)=>{ const r=RS*[0.33,0.64,0.92][ri]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+ri*0.26; SRC.push([Math.cos(a)*r,Math.sin(a)*r]); } });
  const star=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?21:52; star.push([Math.cos(a)*r,-Math.sin(a)*r]); }
  const tri=[[0,48],[-46,-34],[46,-34]];
  const inPoly=(P,u,v)=>{ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i],b=P[j]; if((a[1]>v)!==(b[1]>v)&&u<(b[0]-a[0])*(v-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; };
  const inShape=(k,u,v)=>k==='square'?(Math.abs(u)<40&&Math.abs(v)<40):k==='star'?inPoly(star,u,v):inPoly(tri,u,v);

  let t=0, shape='square', colr='red', S={d:300,tilt:0,lift:0,sz:0,br:1}, T={d:300,tilt:0,lift:0,sz:0,br:1}, key='', res={}, done={}, d0=300, col0='red';
  const face=document.createElement('canvas'); face.width=G; face.height=G; const fctx=face.getContext('2d'), img=fctx.createImageData(G,G);
  wrap.querySelectorAll('#shp .chip-btn').forEach(b=>b.onclick=()=>{ wrap.querySelectorAll('#shp .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); shape=b.dataset.k; });
  chipsWire(wrap,'#clr .toggle-btn',b=>{ colr=b.dataset.c; if(colr!==col0&&S.lift<5&&S.br>0.5) log(3,'Still a dark grey shadow — the colour of the object does not colour the shadow.'); });
  $('#d').oninput=e=>{ T.d=+e.target.value; $('#dv').textContent=e.target.value+' mm from torch'; };

  const tg=(id,on,a,b)=>{ const x=$(id); x.classList.toggle('active',on); x.textContent=on?a:b; };
  $('#tOn').onclick=()=>{ T.br=T.br>0.5?0:1; tg('#tOn',T.br>0.5,'🔦 Torch on','🔦 Torch off'); };
  $('#sIn').onclick=()=>{ T.sz=T.sz>1?0:420; tg('#sIn',T.sz<1,'Screen in','Screen out'); };
  $('#oIn').onclick=()=>{ T.lift=T.lift>1?0:320; tg('#oIn',T.lift<1,'Object in','Object out'); };
  function log(i,txt){ done[i]=txt; paintTab(); }
  function paintTab(){ $('#tab').innerHTML=logTable(['Action','Shadow'],ROWS.map((r,i)=>[r,done[i]?{v:done[i],c:'r-ok'}:'—'])); }
  paintTab();
  // one straight line from a torch point to a screen point: is it blocked?
  function blocked(sy,sz,py,pz){ const ox=S.d, oy=S.lift, th=S.tilt;
    if(shape==='ball'){ const dx=L, dy=py-sy, dz=pz-sz, cx=ox, cy=oy-sy, cz=-sz, tt=(cx*dx+cy*dy+cz*dz)/(dx*dx+dy*dy+dz*dz);
      const ex=cx-tt*dx, ey=cy-tt*dy, ez=cz-tt*dz; return ex*ex+ey*ey+ez*ez<1600; }
    const nx=Math.cos(th), ny=Math.sin(th); const dx=L, dy=py-sy, dz=pz-sz, den=nx*dx+ny*dy; if(Math.abs(den)<1e-6) return false;
    const tt=(nx*ox+ny*(oy-sy))/den; if(tt<=0||tt>=1) return false; const X=tt*dx, Y=sy+tt*dy-oy, Z=sz+tt*dz; const rx=X-ox;

    const at=(sy,P)=>sy+(P.y-sy)*L/P.x; return {Tp,Bp,uTop:at(RS,Tp),uBot:at(-RS,Bp),pTop:at(-RS,Tp),pBot:at(RS,Bp)}; }

  animLoop(dt=>{ t+=dt;
    sprStep(S,{d:T.d,tilt:T.tilt,lift:T.lift,sz:T.sz},22,6.5,dt); S.br=approach(S.br,T.br,8,dt);
    const k2=[shape,colr,S.d.toFixed(1),S.tilt.toFixed(3),S.lift.toFixed(1),S.sz.toFixed(1),S.br.toFixed(3)].join('|'); if(k2!==key){ key=k2; shade(); }
    const E=edges(); const shH=((E.pTop+E.uTop)/2-(E.pBot+E.uBot)/2), rim=Math.max(0,E.pTop-E.uTop), obH=vRange[shape][1]-vRange[shape][0];
    // table 11.2 observations, once the object has settled
    const still=Math.abs(S.v_d||0)<3&&Math.abs(S.v_tilt||0)<0.05;
    if(S.sz>380) log(0,'No shadow — there is nothing for it to fall on.');
    if(S.lift>280) log(1,'No shadow — light reaches the whole screen.');
    if(S.br<0.05) log(2,'No shadow — no light at all.');
    if(still&&S.lift<5&&S.br>0.9&&S.sz<5){ if(S.d-d0>=60){ log(4,'Smaller ('+Math.round(shH)+' mm) and sharper edge.'); d0=S.d; } else if(d0-S.d>=60){ log(5,'Bigger ('+Math.round(shH)+' mm) and more blurred edge.'); d0=S.d; }
      if(S.tilt>0.4) log(6,shape==='ball'?'A ball looks the same from every side — still round.':'Shape changes — squashed to '+Math.round(Math.cos(S.tilt)*100)+' % of its height.'); }
    col0=colr;

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[-120,30,800,470]);
    line(ctx,-120,FLOOR,590,FLOOR,COL.ink,2.4);
    const b=S.br, sA=clamp(1-S.sz/420,0,1);

    // ---------- screen face ----------

/* =====================================================================
   11.5 LET US INVESTIGATE — send sunlight onto a wall the Sun can't reach
   Sunlight = parallel rays at the Sun's height α. The mirror (15 cm,
   drawn 60 px) is a line at angle ψ in the hand; each ray reflects with
   r = d − 2(d·n)n (angle of incidence = angle of reflection) and is
   followed to the first thing it meets: the back wall of the verandah,
   the roof, the ground, or the sky. Turning sideways by β moves the spot
   sideways by (distance to wall)·tan 2β. Steel reflects ≈ 55 % and
   slightly unevenly (spot a little blurred); cardboard reflects in all
   directions, so no spot forms. The hand is never perfectly still: the
   mirror angle is a spring (k 18, c 5) with a small tremor, so the spot
   quivers and overshoots the way a real one does.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Tilt the mirror up / down <span class="val" id="pv">0°</span></label><input type="range" id="psi" min="-85" max="30" step="1" value="-20">
      <label style="margin-top:6px">Turn it left / right <span class="val" id="yv">0°</span></label><input type="range" id="yaw" min="-15" max="15" step="1" value="6">
      <label style="margin-top:6px">Height of the Sun <span class="val" id="av">45°</span></label><input type="range" id="alpha" min="25" max="70" step="1" value="45"></div>
    <div class="control-group"><label>Held in the hand</label><div class="toggle-group" id="mat"><button class="toggle-btn small active" data-m="0">Plane mirror</button><button class="toggle-btn small" data-m="1">Steel plate</button><button class="toggle-btn small" data-m="2">Cardboard</button></div>
      <div class="toggle-group"><button class="toggle-btn" id="steady">✋ Steady hand</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Spot lands on',COL.blue)}${card('k2','Calendar lit?',COL.green)}${card('k3','Mirror tilt',COL.blue)}${card('k4','Spot brightness',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const GY=440, RX0=470, RY=172, WX=760, MLEN=62;
  let t=0, psi={x:-10*Math.PI/180,v:0}, psiT=-20*Math.PI/180, yaw={x:0,v:0}, yawT=6*Math.PI/180, alpha=45*Math.PI/180, mat=0, steady=false, spot=null, bright=0, hitC=0;
  const pin=(id,v,f)=>{ $('#'+id).oninput=e=>{ f(+e.target.value); $('#'+v).textContent=e.target.value+'°'; }; $('#'+id).oninput({target:$('#'+id)}); };
  pin('psi','pv',v=>psiT=v*Math.PI/180); pin('yaw','yv',v=>yawT=v*Math.PI/180); pin('alpha','av',v=>alpha=v*Math.PI/180);
  chipsWire(wrap,'#mat .toggle-btn',b=>mat=+b.dataset.m);
  $('#steady').onclick=()=>{ steady=!steady; $('#steady').classList.toggle('active',steady); };
  function firstHit(px,py,rx,ry){ let best={s:1e9,what:'sky'}; const tryS=(s,what,ok)=>{ if(s>0.5&&s<best.s&&ok) best={s,what}; };
    if(rx>0){ const s=(WX-px)/rx, y=py+s*ry; tryS(s,'wall',y>=RY&&y<=GY); }
    if(ry<0){ const s=(RY-py)/ry, x=px+s*rx; tryS(s,'roof',x>=RX0&&x<=WX); const s2=(RY-12-py)/ry, x2=px+s2*rx; tryS(s2,'roof top',x2>=RX0&&x2<=WX+30); }
    if(ry>0){ const s=(GY-py)/ry; tryS(s,'ground',true); }
    return {x:px+best.s*rx,y:py+best.s*ry,what:best.what,s:best.s}; }

  animLoop(dt=>{ t+=dt;
    const tremor=steady?0:(Math.sin(t*7.1)*0.6+Math.sin(t*11.3+1)*0.4)*0.004;
    psi.v+=((psiT+tremor-psi.x)*18-psi.v*5)*dt; psi.x+=psi.v*dt; yaw.v+=((yawT+tremor*0.7-yaw.x)*18-yaw.v*5)*dt; yaw.x+=yaw.v*dt;
    const d={x:Math.cos(alpha),y:Math.sin(alpha)};                       // sunlight direction (down-right)

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,470]);
    ctx.fillStyle='#eef6fd'; ctx.fillRect(0,0,800,GY);
    // Sun and general sunlight
    const sun={x:300-Math.cos(alpha)*330,y:300-Math.sin(alpha)*330}; sunDraw(ctx,clamp(sun.x,34,700),clamp(sun.y,34,400),22,t,1);
    // verandah shade: where the roof blocks the Sun
    const sg=(GY-RY)/d.y, xg=RX0+sg*d.x;
    fillPoly(ctx,xg<=WX?[{x:RX0,y:RY},{x:xg,y:GY},{x:WX,y:GY},{x:WX,y:RY}]:[{x:RX0,y:RY},{x:WX,y:RY+(WX-RX0)*d.y/d.x},{x:WX,y:RY}],'rgba(58,70,88,0.16)');
    for(let k=0;k<7;k++){ const x0=-60+k*110, y0=0; rayPath(ctx,[{x:x0,y:y0},{x:x0+d.x*140,y:y0+d.y*140}],COL.yellow,t,0.35,1.4,{dashes:[8,10]}); }
    // ground, house
    line(ctx,0,GY,800,GY,COL.ink,2.6); for(let x=6;x<800;x+=18) line(ctx,x,GY,x-8,GY+10,COL.mid,1);
    rect(ctx,WX,RY-12,40,GY-RY+12,COL.ink,'#fff',2.6); rect(ctx,RX0-10,RY-14,WX-RX0+50,14,COL.ink,'#fff',2.6);
    line(ctx,RX0+6,RY,RX0+6,GY,COL.ink,4); textAt(ctx,'verandah (in shade)',RX0+140,RY+24,{align:'center',size:12,weight:600,color:COL.muted});
    // calendar on the wall (side view: a thin board)
    rect(ctx,WX-5,262,5,70,COL.green,'#fff',2);
    // the student and the mirror
    const px=250, T=teen(ctx,px,GY,190,{sex:'g',m:0.6,pose:{sR:1.35,eR:-0.25,sL:-0.15,eL:0.1},mood:0.6});
    const Hn=T.hand[1]; const M={x:Hn.x+16,y:Hn.y-4}, ang=Math.PI/2+psi.x, mx=Math.cos(ang)*MLEN/2, my=Math.sin(ang)*MLEN/2;
    const A={x:M.x-mx,y:M.y-my}, B={x:M.x+mx,y:M.y+my};
    let n={x:Math.sin(ang),y:-Math.cos(ang)}; if(n.x*d.x+n.y*d.y>0) n={x:-n.x,y:-n.y};               // face that meets the Sun
    const r=reflect(d.x,d.y,n.x,n.y), refl=[1,0.55,0][mat], faces=(n.x*d.x+n.y*d.y)<-0.02;
    // incoming and reflected rays across the mirror
    const hits=[]; for(let k=0;k<5;k++){ const u=(k+0.5)/5, P={x:lerp(A.x,B.x,u),y:lerp(A.y,B.y,u)};
      rayPath(ctx,[{x:P.x-d.x*260,y:P.y-d.y*260},P],COL.yellow,t,0.85,1.8,{at:0.7});
      if(faces&&refl>0){ const Hh=firstHit(P.x,P.y,r.x,r.y); hits.push(Hh); rayPath(ctx,[P,Hh],COL.blue,t,refl*0.9,1.8,{at:0.35}); }
      else if(mat===2&&faces){ for(let q=0;q<3;q++){ const a=Math.atan2(n.y,n.x)+(q-1)*0.7; line(ctx,P.x,P.y,P.x+Math.cos(a)*26,P.y+Math.sin(a)*26,rgba(COL.blue,0.5),1.2); } } }
    mirrorSeg(ctx,A.x,A.y,B.x,B.y,(n.x*Math.sin(ang)-n.y*Math.cos(ang))>0?1:-1,{steel:mat===1,col:mat===2?'#c9a26b':COL.blue,w:mat===2?5:3.4});
    if(faces&&refl>0) line(ctx,M.x,M.y,M.x+n.x*44,M.y+n.y*44,COL.green,1.4,[5,4]);
    // the spot where the reflected beam lands
    let what='—'; spot=null; if(hits.length){ what=hits[2].what; const h0=hits[0], h4=hits[4]; spot={what,y0:Math.min(h0.y,h4.y),y1:Math.max(h0.y,h4.y),x0:Math.min(h0.x,h4.x),x1:Math.max(h0.x,h4.x),dist:hits[2].s};
      if(what==='wall'){ line(ctx,WX,spot.y0,WX,spot.y1,COL.yellow,6); glow(ctx,WX,(spot.y0+spot.y1)/2,40,COL.yellow,0.6*refl); }
      else if(what==='ground'){ line(ctx,spot.x0,GY,spot.x1,GY,COL.yellow,6); }
      else if(what==='roof'){ line(ctx,spot.x0,RY,spot.x1,RY,COL.yellow,6); } }
    bright=approach(bright,hits.length?refl:0,6,dt);
    // ---------- the wall, seen from the front ----------
    const ix=560, iy=22, iw=226, ih=126; panelFrame(ctx,ix,iy,iw,ih,'The shaded wall, face on',COL.green);
    ctx.save(); rrect(ctx,ix,iy,iw,ih,10); ctx.clip(); ctx.fillStyle='#dfe3ea'; ctx.fillRect(ix,iy,iw,ih);
    const k=ih/(GY-RY), wy=y=>iy+(y-RY)*k, cx=ix+iw/2;
    rect(ctx,cx-26,wy(262),52,70*k,COL.green,'#fff',2); for(let q=0;q<3;q++) line(ctx,cx-18,wy(262)+10+q*9,cx+18,wy(262)+10+q*9,COL.mid,1); textAt(ctx,'CALENDAR',cx,wy(262)+8,{align:'center',size:7.5,weight:700,color:COL.green});
    let lit=false;
    if(spot&&what==='wall'){ const sx=cx+Math.tan(2*yaw.x)*spot.dist*k*1.0, sy=wy((spot.y0+spot.y1)/2), rw=MLEN*0.5*k*1.1, rh=Math.max(4,(spot.y1-spot.y0)/2*k);
      ctx.save(); if(mat===1) ctx.filter='blur(2px)'; ctx.beginPath(); ctx.ellipse(sx,sy,rw,rh,0,0,Math.PI*2); ctx.fillStyle=rgba('#ffe066',0.35+0.6*bright); ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.ellipse(sx,sy,rw,rh,0,0,Math.PI*2); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
      lit=Math.abs(sx-cx)<26+rw*0.5&&sy>wy(262)&&sy<wy(332); }
    ctx.restore();
    hitC=approach(hitC,lit?1:0,5,dt); if(hitC>0.5) mark(ctx,ix+iw-22,iy+ih-20,true,hitC);

    // ---------- side ----------

    setv($,'k3',Math.round(psi.x*180/Math.PI)+'°'); setv($,'k4',Math.round(bright*100)+' %');
    const o=$('#obs'), m=mat===2?['bad','Cardboard sends light every way — no spot on the wall. Only a shiny surface redirects it.']:lit?['ok','The mirror changed the direction of the sunlight — the calendar in the shade is lit!']:what==='wall'?['warn','The spot is on the wall. Turn left/right or tilt to move it onto the calendar.']:['warn','Tilt the mirror: the spot moves twice as fast as you turn it.'];

  });

/* =====================================================================
   11.6 LET US EXPERIMENT — a thin beam through one slit of a comb
   Top view of the white sheet. The torch's glowing part is 5 px wide; the
   comb slits are 4 px wide, 190 px in front of it, so each beam spreads a
   little: its edges are the straight lines from one side of the glow
   through the opposite side of the slit. Every edge / centre line is
   traced as a straight line; when it meets the mirror it turns with
   r = d − 2(d·n)n, i.e. angle of incidence = angle of reflection, both
   measured from the normal. The mirror slides in on a spring and its
   angle and the torch's aim are springs too, so the beam swings smoothly.
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Comb</label><div class="toggle-group" id="mode"><button class="toggle-btn small active" data-m="1">One slit open</button><button class="toggle-btn small" data-m="3">Three slits</button><button class="toggle-btn small" data-m="0">No black paper</button></div>
      <label style="margin-top:8px">Aim the torch <span class="val" id="av">0°</span></label><input type="range" id="aim" min="-12" max="12" step="1" value="-4"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="put">Place the mirror in the beam</button></div>
      <label style="margin-top:8px">Turn the mirror <span class="val" id="mv">30°</span></label><input type="range" id="mang" min="-55" max="55" step="1" value="30">
      <div class="toggle-group"><button class="toggle-btn active" id="nrm">Show normal & angles</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Angle of incidence',COL.yellow)}${card('k2','Angle of reflection',COL.blue)}${card('k3','Beam turned by',COL.green)}${card('k4','Beams on the paper',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX0=40, PX1=770, PY0=40, PY1=470, CX=250, CY=262, SRC=2.5, SLIT=2, MX=560, MLEN=190;
  let t=0, mode=1, aim={x:-4*Math.PI/180,v:0}, aimT=-4*Math.PI/180, mang={x:30*Math.PI/180,v:0}, mangT=30*Math.PI/180, my={x:560,v:0}, myT=560, put=false, showN=true, info=null;
  chipsWire(wrap,'#mode .toggle-btn',b=>mode=+b.dataset.m);
  $('#aim').oninput=e=>{ aimT=+e.target.value*Math.PI/180; $('#av').textContent=e.target.value+'°'; };
  $('#mang').oninput=e=>{ mangT=+e.target.value*Math.PI/180; $('#mv').textContent=e.target.value+'°'; };
  $('#put').onclick=()=>{ put=!put; myT=put?CY:560; };
  $('#nrm').onclick=()=>{ showN=!showN; $('#nrm').classList.toggle('active',showN); };
  const TX=60;
  function slits(){ const all=[]; for(let k=-7;k<=7;k++) all.push(k); return mode===0?all:mode===1?[0]:[-3,0,3]; }
  function mirror(){ const a=Math.PI/2+mang.x, c={x:MX,y:my.x}; return {a,c,A:{x:c.x-Math.cos(a)*MLEN/2,y:c.y-Math.sin(a)*MLEN/2},B:{x:c.x+Math.cos(a)*MLEN/2,y:c.y+Math.sin(a)*MLEN/2}}; }
  function toEdge(p,d){ let s=1e9; if(d.x>0) s=Math.min(s,(PX1-p.x)/d.x); if(d.x<0) s=Math.min(s,(PX0-p.x)/d.x); if(d.y>0) s=Math.min(s,(PY1-p.y)/d.y); if(d.y<0) s=Math.min(s,(PY0-p.y)/d.y); return {x:p.x+d.x*s,y:p.y+d.y*s}; }
  function trace(p,d,M){ const pts=[p]; let hit=null;
    if(M){ const q=raySeg(p.x,p.y,d.x,d.y,M.A.x,M.A.y,M.B.x,M.B.y); if(q){ const P={x:p.x+d.x*q.t,y:p.y+d.y*q.t}; let n={x:Math.sin(M.a),y:-Math.cos(M.a)}; if(n.x*d.x+n.y*d.y>0) n={x:-n.x,y:-n.y};
        const r=reflect(d.x,d.y,n.x,n.y); pts.push(P); pts.push(toEdge(P,r)); hit={P,n,d,r}; return {pts,hit}; } }
    pts.push(toEdge(p,d)); return {pts,hit}; }

  animLoop(dt=>{ t+=dt;
    aim.v+=((aimT-aim.x)*20-aim.v*6)*dt; aim.x+=aim.v*dt; mang.v+=((mangT-mang.x)*20-mang.v*6)*dt; mang.x+=mang.v*dt; my.v+=((myT-my.x)*16-my.v*5.5)*dt; my.x+=my.v*dt;
    const T={x:TX,y:CY}, ax={x:Math.cos(aim.x),y:Math.sin(aim.x)}, pp={x:-ax.y,y:ax.x};
    const M=mirror(), onPaper=my.x<PY1+40;

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#dfe4ec'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[-60,20,800,490]);
    ctx.save(); ctx.shadowColor='rgba(19,42,68,0.18)'; ctx.shadowBlur=10; rect(ctx,PX0,PY0,PX1-PX0,PY1-PY0,COL.mid,'#fff',1.2); ctx.restore();
    textAt(ctx,'white sheet of paper (top view)',PX1-8,PY1-10,{align:'right',size:11,weight:600,color:COL.mid});
    // torch light falling on the comb (a soft cone)
    const cone=20*Math.PI/180; fillPoly(ctx,[{x:T.x+pp.x*12,y:T.y+pp.y*12},{x:CX,y:T.y+(CX-T.x)*Math.tan(aim.x+cone)},{x:CX,y:T.y+(CX-T.x)*Math.tan(aim.x-cone)},{x:T.x-pp.x*12,y:T.y-pp.y*12}],rgba(COL.yellow,0.12));
    // beams through each open slit
    let nb=0; info=null; const ks=slits();
    ks.forEach(k=>{ const ys=CY+k*14, sl={x:CX,y:ys}; const dc={x:sl.x-T.x,y:sl.y-T.y}, Lc=Math.hypot(dc.x,dc.y); const off=Math.abs(Math.atan2(dc.y,dc.x)-aim.x); if(off>cone) return; const I=1-off/cone*0.6; nb++;
      const edge=(sy,ey)=>{ const a={x:T.x+pp.x*sy,y:T.y+pp.y*sy}, b={x:CX,y:ys+ey}, L=Math.hypot(b.x-a.x,b.y-a.y); return trace(b,{x:(b.x-a.x)/L,y:(b.y-a.y)/L},onPaper?M:null); };
      const e1=edge(SRC,-SLIT), e2=edge(-SRC,SLIT), c=trace(sl,{x:dc.x/Lc,y:dc.y/Lc},onPaper?M:null);
      // light on the paper

/* =====================================================================
   11.7 LET US EXPERIMENT — the image of a pen in a plane mirror
   Side view, 10 px = 1 cm. The pen stands in a lump of clay. Every point
   of the pen sends light to the mirror; the ray that reaches the eye

   mirror, so a screen there stays dark.
