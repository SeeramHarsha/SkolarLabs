<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Grade 7 · Chapter 12 — Earth, Moon, and the Sun | Botclub Labs</title>
<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">
  <div class="topbar">

</div>

<script>
/* =========================================================================
   GRADE 7 — CHAPTER 12: EARTH, MOON, AND THE SUN
   Activities 12.1 – 12.4 (NCERT Curiosity, gecu112). Every activity runs a
   continuous animation loop: buttons and sliders only set TARGETS that the
   objects move towards with real inertia. The merry-go-round coasts down
   on bearing friction, the globe is a true 3-D sphere lit by the torch,
   the night sky over Pune uses real star positions and sidereal time,
   and apparent sizes come from size ÷ distance.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;
}
function tableTop(ctx,x0,x1,y,legs){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,x0,y,x1-x0,12,3); ctx.fill(); ctx.stroke();

/* Greenwich mean sidereal time (degrees) at Julian date jd */

/* Sun's position (low-precision almanac, good to ~0.01°) → RA, dec in degrees */
function sunRaDec(jd){ const n=jd-2451545.0, L=wrap360(280.46+0.9856474*n), g=wrap360(357.528+0.9856003*n)*D2R;

function dms(d,m,s){ return Math.sign(d||1)*(Math.abs(d)+m/60+(s||0)/3600); }

function drawPhase(ctx,x,y,r,psi,k,o){

/* a small 3-D rotation kit: vectors are [x,y,z] */
function v3(x,y,z){ return [x,y,z]; }

/* top-down rider: shoulders across the facing direction, head forward */
function personTop(ctx,x,y,face,s,col,o){ o=o||{}; ctx.save(); ctx.translate(x,y); ctx.rotate(-face); ctx.lineJoin='round'; ctx.lineCap='round';
  const sw=0.22*s;

  ctx.beginPath(); ctx.ellipse(0,0,0.11*s,sw,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.stroke();

/* =====================================================================
   12.1 LET US EXPLORE — riding a merry-go-round
   Top view in metres (19 px = 1 m). The platform is a rigid disc,
   I = 300 kg·m² with its rider. A friend runs beside the rail and pushes
   with up to 70 N at r = 2 m until the chosen speed is reached (he can't
   run faster than 4.5 m/s). Once you let go, only the bearing slows it:
   dry friction 10 N·m + air/viscous 6·ω N·m·s, so 6 rpm coasts for ≈14 s.
   You sit facing outward. What you see is a real 100° view drawn from
   your seat: every object's bearing relative to where your face points,
   size ∝ 1/distance. "Fix your gaze" turns your head (spring, neck limit
   ±80°) to follow the tree until it slips out on the right.
   "Riding with you" rotates the camera with the platform (−θ), so the
   platform stays still and the park turns the other way.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Your friend pushes the merry-go-round</label>
      <div class="toggle-group"><button class="toggle-btn active" id="acw">↺ Anti-clockwise</button><button class="toggle-btn" id="cw">↻ Clockwise</button></div>
      <label style="margin-top:9px">Push up to <span class="val" id="sv">4 rpm</span></label><input type="range" id="spd" min="1" max="8" step="0.5" value="4">
      <div class="toggle-group"><button class="toggle-btn play" id="push">✋ Push</button><button class="toggle-btn" id="go">Let go</button><button class="toggle-btn" id="brake">Brake</button></div></div>
    <div class="control-group"><label>While you ride</label>
      <div class="toggle-group"><button class="toggle-btn" id="gaze">👀 Fix your gaze on the tree</button></div>
      <label style="margin-top:8px">Watch from</label><div class="toggle-group"><button class="toggle-btn small active" id="vG">The ground</button><button class="toggle-btn small" id="vR">Riding with you</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Merry-go-round turns',COL.blue)}${card('k2','Speed',COL.blue)}${card('k3','Things around you seem to turn',COL.green)}${card('k4','Tree in your view?',COL.green)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const PX=23, CX=250, CY=250, RD=2.0, RS=1.45, I=300, FMAX=40, VRUN=4.5;
  const OBJ=[ {k:'tree',a:62,r:7.4,n:'Tree'}, {k:'school',a:148,r:8.4,n:'School'}, {k:'bush',a:108,r:6.2}, {k:'house',a:222,r:7.8,n:'House'},
    {k:'lamp',a:292,r:5.8,n:'Lamp post'}, {k:'swing',a:352,r:7.2,n:'Swing'}, {k:'bush',a:262,r:8.8}, {k:'tree2',a:188,r:5.4} ];
  OBJ.forEach(o=>{ o.x=Math.cos(o.a*D2R)*o.r; o.y=Math.sin(o.a*D2R)*o.r; });
  let t=0, th=200*D2R, om=0, dir=1, wT=4*2*Math.PI/60, pushing=false, braking=false, gaze=false, view=0, camB=0;
  let head={x:0,v:0}, fr={a:th-0.5, run:0, ph:0, hands:0}, trailG=[], trailT=[], turns=0, lastTh=th, treeIn=false, appDir=0;
  const setAct=(ids,on)=>ids.forEach((id,i)=>$(id).classList.toggle('active',i===on));
  $('#acw').onclick=()=>{ dir=1; setAct(['#acw','#cw'],0); };
  $('#cw').onclick=()=>{ dir=-1; setAct(['#acw','#cw'],1); };
  $('#spd').oninput=e=>{ wT=+e.target.value*2*Math.PI/60; $('#sv').textContent=e.target.value+' rpm'; };
  const pb=i=>['#push','#go','#brake'].forEach((q,j)=>$(q).classList.toggle('active',j===i));
  $('#push').onclick=()=>{ pushing=true; braking=false; pb(0); };
  $('#go').onclick=()=>{ pushing=false; braking=false; pb(1); };
  $('#brake').onclick=()=>{ pushing=false; braking=true; pb(2); };
  $('#gaze').onclick=()=>{ gaze=!gaze; $('#gaze').classList.toggle('active',gaze); };
  $('#vG').onclick=()=>{ view=0; setAct(['#vG','#vR'],0); };
  $('#vR').onclick=()=>{ view=1; setAct(['#vG','#vR'],1); };

  /* top-view scenery */
  function objTop(ctx,o,p){ const q={x:CX+o.x*PX,y:CY-o.y*PX};
    if(o.k==='tree'||o.k==='tree2'){ const R=o.k==='tree'?34:24; ctx.save(); ctx.beginPath(); for(let i=0;i<=12;i++){ const a=i/12*Math.PI*2, rr=R*(0.86+0.14*Math.cos(i*2.3)); ctx.lineTo(q.x+Math.cos(a)*rr,q.y+Math.sin(a)*rr); }
      ctx.closePath(); ctx.fillStyle=o.k==='tree'&&gaze?'rgba(31,157,85,0.18)':'rgba(31,157,85,0.07)'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=o.k==='tree'?2.6:1.8; ctx.stroke(); circ(ctx,q.x,q.y,5,COL.ink,'#fff',1.8); ctx.restore(); }
    else if(o.k==='bush'){ circ(ctx,q.x-6,q.y,9,COL.green,'rgba(31,157,85,0.06)',1.6); circ(ctx,q.x+7,q.y+2,8,COL.green,'rgba(31,157,85,0.06)',1.6); }
    else if(o.k==='school'||o.k==='house'){ const w=o.k==='school'?92:58, h=o.k==='school'?46:44; ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(-(o.a*D2R)+Math.PI/2);
      rect(ctx,-w/2,-h/2,w,h,COL.ink,'#fff',2.2); line(ctx,-w/2,0,w/2,0,COL.mid,1.2); if(o.k==='school'){ for(let i=1;i<4;i++) line(ctx,-w/2+i*w/4,-h/2,-w/2+i*w/4,h/2,COL.mid,0.8); } else { line(ctx,-w/2,-h/2,0,0,COL.mid,1); line(ctx,w/2,-h/2,0,0,COL.mid,1); line(ctx,-w/2,h/2,0,0,COL.mid,1); line(ctx,w/2,h/2,0,0,COL.mid,1); } ctx.restore(); }
    else if(o.k==='lamp'){ circ(ctx,q.x,q.y,5,COL.ink,'#fff',2); circ(ctx,q.x,q.y,12,COL.yellow,null,1.2); }
    else if(o.k==='swing'){ ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(-(o.a*D2R)); rect(ctx,-6,-30,12,60,COL.ink,null,1.8); line(ctx,-14,-30,14,-30,COL.ink,2.4); line(ctx,-14,30,14,30,COL.ink,2.4); rect(ctx,-4,-12,8,10,COL.ink,'#fff',1.4); rect(ctx,-4,4,8,10,COL.ink,'#fff',1.4); ctx.restore(); }
    if(o.n){ textAt(ctx,o.n,q.x,q.y+(o.k==='tree'?50:o.k==='school'?52:34)*(p?1:1),{align:'center',size:12.5,weight:700,color:o.k==='tree'?COL.green:COL.muted}); } }

  /* what you see: front-view drawings of the same objects */
  function objFront(ctx,o,x,base,s){ ctx.save(); ctx.lineJoin='round';
    if(o.k==='tree'||o.k==='tree2'){ const H=(o.k==='tree'?6:4.5)*s; rect(ctx,x-0.18*s,base-H*0.45,0.36*s,H*0.45,COL.ink,'#fff',Math.max(1,s*0.06));
      ctx.beginPath(); ctx.ellipse(x,base-H*0.66,H*0.36,H*0.3,0,0,Math.PI*2); ctx.fillStyle=o.k==='tree'&&gaze?'rgba(31,157,85,0.2)':'rgba(31,157,85,0.08)'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=Math.max(1.4,s*0.09); ctx.stroke(); }
    else if(o.k==='bush'){ ctx.beginPath(); ctx.ellipse(x,base-0.4*s,0.9*s,0.45*s,0,Math.PI,0); ctx.closePath(); ctx.fillStyle='rgba(31,157,85,0.07)'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=1.5; ctx.stroke(); }
    else if(o.k==='school'){ const W=5*s, H=3.4*s; rect(ctx,x-W/2,base-H,W,H,COL.ink,'#fff',Math.max(1.2,s*0.07)); for(let i=0;i<4;i++) for(let j=0;j<2;j++) rect(ctx,x-W/2+W*(0.08+i*0.24),base-H*(0.85-j*0.42),W*0.12,H*0.22,COL.blue,null,1); rect(ctx,x-0.35*s,base-1.2*s,0.7*s,1.2*s,COL.ink,null,1.2); }
    else if(o.k==='house'){ const W=3*s, H=2.2*s; rect(ctx,x-W/2,base-H,W,H,COL.ink,'#fff',Math.max(1.2,s*0.07)); ctx.beginPath(); ctx.moveTo(x-W/2-0.3*s,base-H); ctx.lineTo(x,base-H-1.3*s); ctx.lineTo(x+W/2+0.3*s,base-H); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=Math.max(1.2,s*0.07); ctx.stroke(); rect(ctx,x-0.3*s,base-1.1*s,0.6*s,1.1*s,COL.ink,null,1.2); }
    else if(o.k==='lamp'){ line(ctx,x,base,x,base-4*s,COL.ink,Math.max(1.4,s*0.08)); circ(ctx,x,base-4.15*s,0.22*s,COL.ink,'#fff8d8',1.4); }
    else if(o.k==='swing'){ const H=2.6*s; line(ctx,x-1.2*s,base,x-0.8*s,base-H,COL.ink,1.8); line(ctx,x+1.2*s,base,x+0.8*s,base-H,COL.ink,1.8); line(ctx,x-0.8*s,base-H,x+0.8*s,base-H,COL.ink,2.2);
      const sw=Math.sin(t*2)*0.25*s; line(ctx,x-0.3*s,base-H,x-0.3*s+sw,base-0.7*s,COL.mid,1.2); line(ctx,x+0.3*s,base-H,x+0.3*s+sw,base-0.7*s,COL.mid,1.2); line(ctx,x-0.4*s+sw,base-0.7*s,x+0.4*s+sw,base-0.7*s,COL.ink,2.2); }
    ctx.restore(); }

  animLoop(dt=>{ t+=dt;
    // ---- physics of the platform ----
    let tau=0; const vr=om*RD, Cd=braking?60:10;
    if(pushing){ const want=dir*wT, err=want-om; tau=clamp(err*1400,-FMAX,FMAX)*RD; if(Math.abs(vr)>VRUN&&Math.sign(tau)===Math.sign(om)) tau=0; }
    if(!(om===0&&Math.abs(tau)<=Cd)){ const sg=om!==0?Math.sign(om):Math.sign(tau), nom=om+(tau-Cd*sg-6*om)/I*dt;
      om=(om!==0&&Math.sign(nom)!==Math.sign(om)&&Math.abs(tau)<=Cd)?0:nom; }
    th+=om*dt;
    if(Math.abs(th-lastTh)>=2*Math.PI){ turns++; lastTh=th; }
    // friend: runs alongside while pushing (hands on the rail), then slows to a stop
    const fa=th-dir*0.5, fv=pushing?om:0; if(pushing){ fr.a+=angDiff(fa,fr.a)*(1-Math.exp(-6*dt)); fr.run+=Math.abs(om)*(RD+0.4)*dt*5; fr.hands=approach(fr.hands,1,6,dt); }
    else { fr.run+=0; fr.hands=approach(fr.hands,0,4,dt); }
    // your head (gaze): bearing of the tree relative to your face

    const hT=gaze&&Math.abs(bT)<80*D2R+0.05?clamp(bT,-80*D2R,80*D2R):0; head.v+=((hT-head.x)*40-head.v*10)*dt; head.x+=head.v*dt;
    // trails: your path on the ground; the tree's path as seen from your seat
    if(Math.abs(om)>0.01){ if(!trailG.length||Math.hypot(trailG[trailG.length-1].x-gx,trailG[trailG.length-1].y-gy)>0.12) trailG.push({x:gx,y:gy});
      const c=Math.cos(-th), s=Math.sin(-th), rx=tr.x*c-tr.y*s, ry=tr.x*s+tr.y*c; if(!trailT.length||Math.hypot(trailT[trailT.length-1].x-rx,trailT[trailT.length-1].y-ry)>0.25) trailT.push({x:rx,y:ry});
      if(trailG.length>90) trailG.shift(); if(trailT.length>120) trailT.shift(); }
    camB=approach(camB,view,3,dt);
    const vis=[]; const HF=50*D2R;
    OBJ.forEach(o=>{ const b=angDiff(Math.atan2(o.y-gy,o.x-gx),face+head.x), d=Math.hypot(o.x-gx,o.y-gy); if(Math.abs(b)<HF+0.35) vis.push({o,b,d}); });
    const bTree=angDiff(Math.atan2(tr.y-gy,tr.x-gx),face+head.x); treeIn=Math.abs(bTree)<HF;
    appDir=Math.abs(om)<0.01?0:-Math.sign(om);

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#f3f5f9'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,500]);
    // ground disc (park)
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,244,0,Math.PI*2); ctx.fillStyle='#fbfcf7'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.setLineDash([4,6]); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,244,0,Math.PI*2); ctx.clip();
    // rotating camera for "riding with you": turn the whole scene by −θ (+ keep you pointing up)
    const camA=camB*(-(th-Math.PI/2)); ctx.translate(CX,CY); ctx.rotate(-camA); ctx.translate(-CX,-CY);
    for(let i=0;i<60;i++){ const a=i*2.39996, r=40+((i*53)%190); const x=CX+Math.cos(a)*r, y=CY+Math.sin(a)*r; line(ctx,x-3,y,x,y-6,'rgba(31,157,85,0.35)',1); line(ctx,x,y-6,x+3,y,'rgba(31,157,85,0.35)',1); }
    OBJ.forEach(o=>objTop(ctx,o));
    // your path on the ground (ground view)
    if(trailG.length>1){ ctx.save(); ctx.globalAlpha=0.7*(1-camB); ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.setLineDash([5,5]); ctx.beginPath(); trailG.forEach((p,i)=>i?ctx.lineTo(CX+p.x*PX,CY-p.y*PX):ctx.moveTo(CX+p.x*PX,CY-p.y*PX)); ctx.stroke(); ctx.restore(); }
    // platform
    const PR=RD*PX;
    circ(ctx,CX,CY,PR+6,COL.ink,'#fff',2.4); circ(ctx,CX,CY,PR,COL.blue,null,2);
    for(let k=0;k<6;k++){ const a=th+k*Math.PI/3; line(ctx,CX,CY,CX+Math.cos(a)*PR,CY-Math.sin(a)*PR,COL.blue,1.8); }
    circ(ctx,CX,CY,PR*0.45,COL.blue,null,1.6); circ(ctx,CX,CY,6,COL.ink,'#fff',2);
    for(let k=0;k<6;k++){ const a=th+k*Math.PI/3+Math.PI/6; circ(ctx,CX+Math.cos(a)*PR*0.86,CY-Math.sin(a)*PR*0.86,3,COL.blue,'#fff',1.4); }
    // you (sitting, facing outward) and your sight cone
    const yx=CX+gx*PX, yy=CY-gy*PX, fa2=face+head.x;
    ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle=COL.green; ctx.beginPath(); ctx.moveTo(yx,yy); ctx.arc(yx,yy,230,-(fa2+HF),-(fa2-HF)); ctx.closePath(); ctx.fill(); ctx.restore();
    line(ctx,yx,yy,yx+Math.cos(fa2+HF)*230,yy-Math.sin(fa2+HF)*230,COL.green,1.2,[4,5]); line(ctx,yx,yy,yx+Math.cos(fa2-HF)*230,yy-Math.sin(fa2-HF)*230,COL.green,1.2,[4,5]);
    if(gaze&&treeIn) line(ctx,yx,yy,CX+tr.x*PX,CY-tr.y*PX,COL.green,2.2);
    personTop(ctx,yx,yy,face,PX*2.3,COL.red,{legs:true,head:head.x,arms:[[-0.05,0.34],[-0.05,-0.34]]});
    // friend pushing at the rail

   14° above). The torch 1.5 m away lights exactly the half facing it
   (terminator drawn as the lit part of a sphere). The globe has inertia:
   your hand sets a target spin rate and the globe eases to it.
   Local solar time at a place = 12 h + (its angle past the torch's
   meridian) ÷ 15°/h; clock time (IST) = solar − 4 min per degree east
   of 82.5° E. Day length = 2·acos(−tanφ·tanδ) ÷ 15° with δ = the torch's

    ctx.save(); ctx.setLineDash([6,5]); line(ctx,ax1.x,ax1.y,np.x,np.y,COL.blue,2); ctx.restore(); if(np.z>0) circ(ctx,np.x,np.y,4,COL.blue,COL.blue,1);

      const a=1.9*sg-2.2, a0=a-0.12*sg, q1=vadd(vadd(vsc(N,0.98),E1,0.42*Math.cos(a)),E2,0.42*Math.sin(a)), q0=vadd(vadd(vsc(N,0.98),E1,0.42*Math.cos(a0)),E2,0.42*Math.sin(a0));

    pops.forEach(p=>{ const a=1-p.t/2.2; tag(ctx,p.up?'☀ sunrise':'sunset',sp.x,sp.y-26-p.t*14,p.up?COL.yellow:COL.muted,{alpha:a,size:12}); if(p.up) rayBurst(ctx,sp.x,sp.y,12,22+p.t*8,10,COL.yellow,a,t); });

    // ---------- inset 1: seen from above the North Pole ----------
    const IX=110, IY=132, IR=76; panelFrame(ctx,IX-104,IY-106,208,214,'From above the North Pole',COL.blue,dark);
    ctx.save(); ctx.beginPath(); ctx.arc(IX,IY,IR,0,Math.PI*2); ctx.fillStyle=dark?'#243349':'#c7d0dc'; ctx.fill();
    if(torch){ ctx.beginPath(); ctx.arc(IX,IY,IR,-Math.PI/2,Math.PI/2); ctx.closePath(); ctx.fillStyle='#fbf3d2'; ctx.fill(); }
    circ(ctx,IX,IY,IR,COL.blue,null,2.2); ctx.restore();

    const decN=sol.dec, H0=pl.lat? Math.acos(clamp(-Math.tan(pl.lat*D2R)*Math.tan(decN),-1,1)):Math.PI/2, rr=IR*Math.cos(pl.lat*D2R)*0.98;
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.yellow; ctx.beginPath(); ctx.arc(IX,IY,rr,-H0,H0); ctx.stroke(); ctx.restore();   // lit part of the sticker's circle
    const Hs=(sol.solarH-12)*15*D2R, ang=Hs; const bx=IX+Math.cos(ang)*rr, by=IY-Math.sin(ang)*rr;

    if(Math.abs(rate)>0.05){ const sg=Math.sign(rate); ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(IX,IY,IR+10,-0.5,-0.5-sg*1.0,sg>0); ctx.stroke(); ctx.restore();
      const e=0.5+sg*1.0; arrowHead(ctx,IX+Math.cos(e)*(IR+10),IY-Math.sin(e)*(IR+10),-(e+sg*Math.PI/2),COL.blue,9); }
    textAt(ctx,'NP',IX,IY+16,{align:'center',size:10.5,weight:700,color:COL.blue});
    // ---------- inset 2: 24-hour dial at the sticker ----------
    const CX2=110, CY2=372, CR=64; panelFrame(ctx,CX2-104,CY2-92,208,190,PLACES[place].n+' — 24 hours',COL.red,dark);
    const DL=dayLen(pl.lat,sol.dec), sr=(12-DL/2)-(pl.lon-82.5)/15, ss=(12+DL/2)-(pl.lon-82.5)/15, hA=hh=>-Math.PI/2+hh/24*Math.PI*2;
    ctx.save(); ctx.lineWidth=12; ctx.strokeStyle=dark?'#3a4a64':'#c7d0dc'; ctx.beginPath(); ctx.arc(CX2,CY2,CR,0,Math.PI*2); ctx.stroke();
    if(DL>0){ ctx.strokeStyle=COL.yellow; ctx.beginPath(); ctx.arc(CX2,CY2,CR,hA(sr),hA(ss)); ctx.stroke(); } ctx.restore();
    for(let k=0;k<24;k++){ const a=hA(k); line(ctx,CX2+Math.cos(a)*(CR-10),CY2+Math.sin(a)*(CR-10),CX2+Math.cos(a)*(CR-(k%6?14:18)),CY2+Math.sin(a)*(CR-(k%6?14:18)),dark?'#9fb0c6':COL.muted,1.2); }
    [['12 AM',0],['6 AM',6],['12 PM',12],['6 PM',18]].forEach(([s,k])=>{ const a=hA(k); textAt(ctx,s,CX2+Math.cos(a)*(CR-32),CY2+Math.sin(a)*(CR-32)+4,{align:'center',size:9.5,weight:600,color:dark?'#c9d6e6':COL.muted}); });
    const ha=hA(sol.ist); vec(ctx,CX2,CY2,CX2+Math.cos(ha)*(CR-6),CY2+Math.sin(ha)*(CR-6),COL.red,3); circ(ctx,CX2,CY2,4,COL.red,COL.red,1);

    // ---------- side ----------
    const isDay=torch&&aNow>0;
    setv($,'k1',hm(sol.ist)); setv($,'k2',!torch?'— (torch off)':isDay?'Day ☀':'Night'); setc($,'k2',isDay?COL.yellow:COL.muted);
    setv($,'k3',fmt(DL,1)+' h'); setv($,'k4',firstLog?`${firstLog.who}, ${Math.round(firstLog.dh*60)} min earlier`:'Turn and watch'); setv($,'k5',String(Math.abs(turns)));
    const o=$('#obs'), m=!torch?['warn','Switch the torch on: it plays the Sun.']
      :Math.abs(rate)<0.05?['warn','Turn the globe. Watch the sticker move into the light, then into the dark.']
      :firstLog&&firstLog.who==='Guwahati'&&dirn>0?['ok','Turning West → East, eastern India (Guwahati) gets the light first. That’s the Earth’s real direction.']

  });
  return wrap;
}

/* =====================================================================
   12.3 LET US EXPLORE — the Big Dipper (Saptarishi) around the Pole Star
   The real sky over Pune (18.52° N, 73.86° E) on the night of 1–2 April
   2026. Star positions are J2000 catalogue RA/Dec; local sidereal time
   comes from GMST(JD) + longitude, so every star turns about the celestial
   pole at 15.04° per hour of clock time. The Sun's altitude (almanac
   formula) sets twilight: stars fade in by brightness as the sky darkens.
   Looking north, drawn with a stereographic projection (shapes stay true).
   Time is a spring (k 3, critically damped): "Wait 2 hours" speeds the
   sky up and slows it down again; otherwise the sky creeps on in real
   time ×60. Check: 7 PM → NE, ~11 PM → high in the north, 5 AM → NW,
   as in Fig. 12.7.
   ===================================================================== */
function buildA3(){
  const LAT=18.52, LON=73.86, JD0=2461131.5+13.5/24, AZ0=0, ALT0=34, SC=370, CXs=400, CYs=238, TEND=630;

  const POLE={n:'Polaris',ra:hms(2,31,49),dec:dms(89,15,51),m:2.0};
  const LINES=[[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]];
  const EXTRA=[['Kochab',14,50,42,74,9,20,2.1],['Pherkad',15,20,44,71,50,2,3.0],['Capella',5,16,41,45,59,53,0.1],['Vega',18,36,56,38,47,1,0.0],['Deneb',20,41,26,45,16,49,1.3],['Castor',7,34,36,31,53,18,1.6],['Pollux',7,45,19,28,1,34,1.2],['Arcturus',14,15,40,19,10,57,0.0],['Muscida',8,30,16,60,43,5,3.4],['Talitha',8,59,12,48,2,30,3.1],['Tania Aus.',10,22,20,41,29,58,3.1],['Alula',11,18,11,31,31,45,3.5],['Thuban',14,4,23,64,22,33,3.7],['Eltanin',17,56,36,51,29,20,2.2],['Rastaban',17,30,26,52,18,5,2.8],['Schedar',0,40,30,56,32,14,2.2],['Caph',0,9,11,59,8,59,2.3],['Menkalinan',5,59,32,44,56,51,1.9]].map(s=>({n:s[0],ra:hms(s[1],s[2],s[3]),dec:dms(s[4],s[5],s[6]),m:s[7]}));
  const R=rng(1204), FIELD=[]; for(let i=0;i<520;i++){ const dec=Math.asin(R()*1.3-0.3)/D2R, ra=R()*360, m=2.9+3.2*Math.pow(R(),0.45); FIELD.push({ra,dec,m,tw:R()*6.28}); }

    <div class="control-group"><label>Night of 1–2 April · Pune · looking North</label>
      <label style="margin-top:6px">Time <span class="val" id="tv">7:00 PM</span></label><input type="range" id="tm" min="0" max="${TEND}" step="10" value="0">
      <div class="toggle-group"><button class="toggle-btn play" id="w2">⏩ Wait 2 hours</button><button class="toggle-btn" id="rst">↺ 7 PM</button></div></div>
    <div class="control-group"><label>Your notebook</label>
      <div class="toggle-group"><button class="toggle-btn play" id="sk">✏ Sketch the Big Dipper now</button><button class="toggle-btn" id="clr">Clear</button></div>
      <div id="log" style="margin-top:8px"></div></div>
    <div class="control-group"><label>Show</label><div class="toggle-group"><button class="toggle-btn small active" id="pole">Pole Star visible</button><button class="toggle-btn small" id="trail">Star trails</button><button class="toggle-btn small" id="axis">Earth’s axis</button></div></div>
    <div class="control-group"><div class="result-cards">${card('k1','Big Dipper is in the',COL.green)}${card('k2','Turned round the Pole Star',COL.green)}${card('k3','Pole Star moved',COL.blue)}${card('k4','Sky',COL.yellow)}</div>
      <div class="fb" id="obs"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const T={x:0,v:0}; let tT=0, t=0, showPole=true, trails=false, trT0=0, axis=false, sketches=[];
  $('#tm').oninput=e=>{ tT=+e.target.value; };
  $('#w2').onclick=()=>{ tT=Math.min(TEND,Math.round((Math.max(tT,T.x)+120)/10)*10); $('#tm').value=tT; };
  $('#rst').onclick=()=>{ tT=0; $('#tm').value=0; };
  $('#sk').onclick=()=>{ const m=Math.round(T.x); if(!sketches.some(s=>Math.abs(s.m-m)<20)) sketches.push({m}); drawLog(); };
  $('#clr').onclick=()=>{ sketches=[]; drawLog(); };
  $('#pole').onclick=()=>{ showPole=!showPole; $('#pole').classList.toggle('active',showPole); $('#pole').textContent=showPole?'Pole Star visible':'Hazy: use a tree'; };
  $('#trail').onclick=()=>{ trails=!trails; trT0=T.x; $('#trail').classList.toggle('active',trails); };
  $('#axis').onclick=()=>{ axis=!axis; $('#axis').classList.toggle('active',axis); };
  const clk=m=>clockStr12(19*60+m);
  function drawLog(){ $('#log').innerHTML=sketches.length?logTable(['Time','Big Dipper in','Turned'],sketches.slice().sort((a,b)=>a.m-b.m).map((s,i,arr)=>[clk(s.m),dirName(s.m),i?Math.round((s.m-arr[0].m)/60*15.04)+'°':'start'])):''; }
  // sky geometry
  const lst=m=>gmstDeg(JD0+m/1440)+LON;

  const Fv=[Math.sin(AZ0*D2R)*Math.cos(ALT0*D2R),Math.cos(AZ0*D2R)*Math.cos(ALT0*D2R),Math.sin(ALT0*D2R)], Rv=[Math.cos(AZ0*D2R),-Math.sin(AZ0*D2R),0], Uv=vcross(Rv,Fv);
  function proj(a){ const h=a.alt*D2R, A=a.az*D2R, p=[Math.cos(h)*Math.sin(A),Math.cos(h)*Math.cos(A),Math.sin(h)];

  // horizon silhouettes (az, kind, size)
  const SIL=[[-58,'bld',1.2],[-40,'tree',1.1],[-24,'tree',0.8],[-6,'bld2',0.9],[3,'tree',1.25],[20,'house',0.9],[36,'tree',0.9],[52,'bld',1],[62,'tree',0.8]];
  function silhouette(ctx,x,y,k,s){ ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle='#8fa3bd'; ctx.fillStyle='#101a28'; ctx.lineWidth=1.8;
    if(k==='tree'){ ctx.beginPath(); ctx.moveTo(x-4*s,y); ctx.lineTo(x-4*s,y-26*s); ctx.lineTo(x+4*s,y-26*s); ctx.lineTo(x+4*s,y); ctx.fill(); ctx.stroke();
      ctx.beginPath(); for(let i=0;i<=14;i++){ const a=Math.PI+i/14*Math.PI*2, r=(30+6*Math.cos(i*2.7))*s; ctx.lineTo(x+Math.cos(a)*r,y-54*s+Math.sin(a)*r*0.85); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else if(k==='bld'||k==='bld2'){ const W=(k==='bld'?70:50)*s, H=(k==='bld'?70:95)*s; ctx.beginPath(); ctx.rect(x-W/2,y-H,W,H); ctx.fill(); ctx.stroke(); ctx.fillStyle='#d9a01766';
      for(let i=0;i<3;i++) for(let j=0;j<(k==='bld'?3:5);j++) if((i*7+j*3)%4) ctx.fillRect(x-W/2+W*(0.12+i*0.3),y-H+H*(0.1+j*(k==='bld'?0.28:0.18)),W*0.14,H*0.08); }
    else { const W=60*s, H=34*s; ctx.beginPath(); ctx.rect(x-W/2,y-H,W,H); ctx.moveTo(x-W/2-6,y-H); ctx.lineTo(x,y-H-28*s); ctx.lineTo(x+W/2+6,y-H); ctx.fill(); ctx.stroke(); }
    ctx.restore(); }

  animLoop(dt=>{ t+=dt;
    const d=tT-T.x; if(Math.abs(d)<0.3&&Math.abs(T.v)<0.3){ if(T.x<TEND){ T.x+=dt; tT=T.x; } T.v=0; } else springTo(T,tT,3,3.46,dt);
    T.x=clamp(T.x,0,TEND); const m=T.x;
    if(Math.abs(+$('#tm').value-tT)>=10) $('#tm').value=tT;
    const sA=sunAlt(m), dark=smooth01(0,-14,sA), limMag=lerp(2.9,5.8,dark);

    // ---------- draw ----------
    const {ctx,w,h}=fitCanvas(canvas); ctx.fillStyle='#0c1522'; ctx.fillRect(0,0,w,h); ctx.save(); camFit(ctx,w,h,[0,0,800,500]);
    // sky: twilight glow in the west in the evening, east at dawn

    const tw=1-dark; if(tw>0.02){ const west=m<300; glow(ctx,west?-40:840,470,420,west?'#f0a060':'#f5c080',0.55*tw); }
    // alt/az grid, faint

    FIELD.forEach(s=>{ if(s.m>limMag) return; const a=hor(s,m); if(a.alt<0) return; const p=proj(a); if(p.x<-10||p.x>810||p.y<-10) return;
      starDot(ctx,p.x,p.y,Math.max(0.5,2.6-0.42*s.m),'#e8eef8',(0.35+0.65*smooth01(limMag,limMag-1.2,s.m))*(0.85+0.15*Math.sin(t*3+s.tw))); });
    EXTRA.forEach(s=>{ if(s.m>limMag) return; const a=hor(s,m); if(a.alt<0) return; const p=proj(a); if(p.x<-10||p.x>810) return; starDot(ctx,p.x,p.y,Math.max(1,3.2-0.55*s.m),'#f2f5fb',smooth01(limMag,limMag-1,s.m)); });

        for(let q=trT0;q<=m;q+=Math.max(2,(m-trT0)/50)){ const a=hor(s,q); if(a.alt<0){ on=false; continue; } const p=proj(a); on?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); on=true; }
        ctx.strokeStyle=DIP.includes(s)?'rgba(31,157,85,0.8)':'rgba(201,214,230,0.45)'; ctx.stroke(); }); ctx.restore(); }
    // notebook sketches (green) — drawn on the sky where the Dipper was at that time
    sketches.forEach(sk=>{ const P=DIP.map(s=>proj(hor(s,sk.m))); if(P.every(p=>p.alt<0)) return; ctx.save(); ctx.globalAlpha=0.9; ctx.setLineDash([5,4]);
      LINES.forEach(([a,b])=>line(ctx,P[a].x,P[a].y,P[b].x,P[b].y,COL.green,1.8)); ctx.setLineDash([]); P.forEach(p=>circ(ctx,p.x,p.y,2.6,COL.green,COL.green,1));
      const c=P[3]; tag(ctx,clk(sk.m),c.x,c.y-34,COL.green,{size:11.5}); ctx.restore(); });
    // the Big Dipper now
    const P=DIP.map(s=>({...proj(hor(s,m)),m:s.m}));
    if(dark>0.05){ ctx.save(); ctx.globalAlpha=0.55*smooth01(0.05,0.5,dark); LINES.forEach(([a,b])=>{ if(P[a].alt>0&&P[b].alt>0) line(ctx,P[a].x,P[a].y,P[b].x,P[b].y,'#9fc2ea',1.6); }); ctx.restore(); }
    P.forEach((p,i)=>{ if(p.alt>0) starDot(ctx,p.x,p.y,3.6-0.5*p.m,'#fffbe8',smooth01(limMag,limMag-0.8,p.m)*(0.9+0.1*Math.sin(t*4+i))); });
    const cen=P[3]; if(cen.alt>0) textAt(ctx,'Saptarishi',cen.x,cen.y+30,{align:'center',size:12.5,weight:700,color:'#cfe0f5',alpha:0.5+0.5*dark});
    // Pole Star + Earth's axis
    const pp=proj(hor(POLE,m));
    if(axis){ const gnd=proj({alt:0,az:0}); ctx.save(); ctx.setLineDash([7,6]); ctx.lineDashOffset=-t*20; line(ctx,gnd.x,gnd.y+10,pp.x,pp.y,COL.blue,2.2); ctx.restore();
      textAt(ctx,'Earth’s axis points here',pp.x-16,pp.y+4,{align:'right',size:12,weight:700,color:'#7fb8f0'}); }
    if(showPole){ starDot(ctx,pp.x,pp.y,2.6,'#fffbe8',smooth01(limMag,limMag-0.8,2.0)); circ(ctx,pp.x,pp.y,11,'#7fb8f0',null,1.6);
      textAt(ctx,'Pole Star (Dhruva Tara)',pp.x+16,pp.y+4,{size:12,weight:700,color:'#cfe0f5'});
      if(dark>0.5&&P[0].alt>0){ ctx.save(); ctx.globalAlpha=0.35; ctx.setLineDash([2,5]); line(ctx,P[1].x,P[1].y,pp.x,pp.y,'#cfe0f5',1.2); ctx.restore(); } }
    else { ctx.save(); ctx.globalAlpha=0.28; ctx.fillStyle='#b8c4d4'; ctx.fillRect(-2000,-2000,4800,4480); ctx.restore(); }
    // ground and silhouettes
    ctx.save(); ctx.beginPath(); for(let az=-90;az<=90;az+=3){ const p=proj({alt:0,az}); az>-90?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); } ctx.lineTo(2800,2400); ctx.lineTo(-2000,2400); ctx.closePath(); ctx.fillStyle='#0e1826'; ctx.fill(); ctx.strokeStyle='#8fa3bd'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    SIL.forEach(([az,k,s])=>{ const p=proj({alt:0,az}); silhouette(ctx,p.x,p.y+2,k,s*(k==='tree'&&az===3&&!showPole?1.1:1)); });
    if(!showPole){ const p=proj({alt:0,az:3}); tag(ctx,'your fixed tree',p.x,p.y-120,COL.red,{size:11.5}); }
    [['Northwest',-45],['North',0],['Northeast',45]].forEach(([n,az])=>{ const p=proj({alt:0,az}); textAt(ctx,n,p.x,Math.min(492,p.y+22),{align:'center',size:13,weight:700,color:'#d6e2f0'}); });
    // clock
    tag(ctx,clk(m)+(m>=300?' · 2 April':' · 1 April'),110,26,COL.yellow,{size:13});
    ctx.restore();

      const rS=aS/2*K, rF=aF/2*K, fx=cx+mx*rS*2.3, fy=cy+mx*rS*0.25, ov=overlap(rS,rF,Math.hypot(fx-cx,fy-cy))/(Math.PI*rS*rS), lit=1-ov;
      const dk=smooth01(0.9,1,ov);
      ctx.save(); rrect(ctx,VX,VY,VW,VH,10); ctx.fillStyle=mixCol('#bcd8f2','#0f1a2b',smooth01(0.6,1,ov)); ctx.fill(); ctx.clip();
      if(dk>0.3){ const R=rng(7); for(let i=0;i<60;i++) starDot(ctx,VX+R()*VW,VY+R()*VH,1+R()*1.2,'#fff',(dk-0.3)*1.4); }
      if(ov>0.97&&rF>=rS){ glow(ctx,cx,cy,rS*2.6,'#fff7d6',0.7*dk); for(let i=0;i<14;i++){ const a=i/14*Math.PI*2+0.3; ctx.save(); ctx.globalAlpha=0.35*dk; line(ctx,cx+Math.cos(a)*rS,cy+Math.sin(a)*rS,cx+Math.cos(a)*rS*(1.6+0.5*Math.sin(i*2.1)),cy+Math.sin(a)*rS*(1.6+0.5*Math.sin(i*2.1)),'#fff7d6',1.4); ctx.restore(); } }
      else glow(ctx,cx,cy,rS*2.2,COL.yellow,0.5*lit+0.1);
      circ(ctx,cx,cy,rS,COL.yellow,'#fff4c4',2.4);
      circ(ctx,fx,fy,rF,fg==='moon'?'#2a3a52':COL.ink,fg==='moon'?'#1d2a3c':COL.ink,1.5);
      // diamond ring at 2nd/3rd contact
      if(rF>=rS&&ov>0.985&&ov<0.9995){ const a=Math.atan2(cy-fy,cx-fx); rayBurst(ctx,cx+Math.cos(a)*rS,cy+Math.sin(a)*rS,3,26,8,'#fffbe8',0.9,t); glow(ctx,cx+Math.cos(a)*rS,cy+Math.sin(a)*rS,24,'#ffffff',0.9); }
      ctx.restore(); ctx.save(); rrect(ctx,VX,VY,VW,VH,10); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); tag(ctx,'The sky, seen safely through eclipse goggles',VX+VW/2,VY,COL.green,{size:11});
      const dd=Math.hypot(fx-cx,fy-cy), view=fg==='venus'?(ov>0?'Transit of Venus — a tiny dot':'Sun only'):(rF>=rS&&dd+rS<=rF)?'Total eclipse':(rF<rS&&dd+rF<=rS)?'Ring of the Sun':ov>0.005?'Partial eclipse':'No eclipse';
      tag(ctx,view,cx,VY+VH-22,view==='Total eclipse'||view==='Ring of the Sun'?COL.green:COL.ink,{size:12.5});
      setv($,'m1',fmt(aS,2)+'°'); setv($,'m2',fmt(aF,fg==='moon'?2:3)+'°'); setc($,'m2',COL.red); setv($,'m3',Math.round(ov*100)+' %'); setv($,'m4',view);
      const o=$('#obsM'), m=fg==='venus'?['warn','Venus is far bigger than the Moon, but much farther away. It covers only a tiny dot of the Sun.']
        :rF>=rS?['ok','The Moon is 400× smaller than the Sun and about 400× closer. So they look the same size, and the Moon can hide the whole Sun.']
        :['warn','This far away, the Moon looks a little smaller than the Sun, so a thin ring of the Sun still shows.'];
      if(o.textContent!==m[1]){ o.textContent=m[1]; o.className='fb '+m[0]; }
    }
    ctx.restore();
  });
  return wrap;
}

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
const activities = [
  { num:'12.1', title:'Riding a Merry-Go-Round', desc:'You turn one way · everything around you seems to turn the other way', build: buildA1 },
  { num:'12.2', title:'Globe, Sticker and Torch', desc:'Turn the globe West → East · day, night and who sees sunrise first', build: buildA2 },
  { num:'12.3', title:'Big Dipper and the Pole Star', desc:'Sketch Saptarishi every 2 hours · Pune, night of 1–2 April', build: buildA3 },
  { num:'12.4', title:'Thumb over a Friend’s Head', desc:'Apparent size · why the small Moon can hide the big Sun', build: buildA4 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
