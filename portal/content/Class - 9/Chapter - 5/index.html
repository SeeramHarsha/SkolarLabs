<style>

  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;

  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }

  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;

}

  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}

}

  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;

.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}

.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}

.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){

}

<script>
/* =========================================================================
   GRADE 9 — CHAPTER 5: EXPLORING MIXTURES AND THEIR SEPARATION
   (NCERT Exploration, iesc105) — Activities 5.1–5.9.
   Every activity runs a continuous animation loop: buttons and sliders only
   set targets. Particles settle at their Stokes speed, crystals nucleate and
   grow from real supersaturation, solvent climbs paper by Washburn's law,
   liquids drain by Torricelli's law, camphor sublimes by Clausius–Clapeyron.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ if(window.__errs) __errs.push(String(e&&e.stack||e).slice(0,300)); else console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}


/* ---------------------------------------------------------------------
   0c. CHAPTER-6 HELPERS — virtual stage, labels, a jointed line-drawn
       teenager whose body really changes with age, sound, cameras
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function ease(x){ x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function spr(x){ return {x:x||0,v:0}; }
function setv($,id,v){ const e=$('#'+id); if(e&&e.textContent!==v) e.textContent=v; }
function setc($,id,c){ const e=$('#'+id); if(e&&e.style.color!==c) e.style.color=c; }
function card(id,l,col){ return `<div class="rcard"><div class="rlabel">${l}</div><div class="rval" id="${id}"${col?` style="color:${col}"`:''}>—</div></div>`; }
/* every scene draws on an 800 × 500 virtual stage, fitted into the canvas */
const VW=800, VH=500;
function stage(ctx,w,h){ const s=Math.min(w/VW,h/VH), ox=(w-VW*s)/2, oy=(h-VH*s)/2; ctx.translate(ox,oy); ctx.scale(s,s); return s; }
function stepPills(el,names,cur,done,onPick){
  el.innerHTML=names.map((n,i)=>`<button class="step-pill${i===cur?' active':''}${done[i]?' done':''}" data-i="${i}">${n}</button>`).join('');
  el.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
}
function hexRgb(h){ if(h[0]!=='#') return h.match(/[\d.]+/g).slice(0,3).map(Number); const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function fitFont(ctx,txt,maxW,size,weight){
  let s=size; ctx.font=weight+' '+s+'px Poppins, sans-serif';
  while(s>9 && ctx.measureText(txt).width>maxW){ s-=0.5; ctx.font=weight+' '+s+'px Poppins, sans-serif'; }
  return s;

/* add the dose: particles appear at the surface point (x,z) */
function mixDose(M,x0){ const K=M.K, R=M.R; M.dose+=1;

/* Hm = liquid depth (m); call with dt ≤ 0.1 s (sub-step for time-lapse) */
function mixStep(M,dt,Hm,stir){
  const K=M.K; M.t+=dt;

  M.w+= (stir?(9-M.w)*2.5:-M.w/6)*dt;

    if(K.dissolve&&p.m>0) p.m=Math.max(0,p.m-dt*(0.02+0.25*turb)*Math.pow(p.m,1/3)*(350/p.d));
    if(p.bed){ if(!K.dissolve) bed+=p.d*p.d*p.d; if(turb>0.35&&M.R()<turb*dt*3){ p.bed=0; p.z=0.9; } return; }

/* haze (0..1 opacity) in 16 depth bins, from suspended cross-section d² */
function mixHaze(M){

/* draw the liquid + particles inside box {x0,x1,top(=liquid top y),bot} */
function mixDraw(ctx,M,box,o){ o=o||{}; const K=M.K, bins=mixHaze(M), H=box.bot-box.top, W=box.x1-box.x0;
  ctx.save(); ctx.beginPath(); ctx.rect(box.x0,box.top,W,H); ctx.clip();

/* laser beam through a mixture box at stage height y; returns transmitted fraction */
function beamThrough(ctx,M,box,y,xIn,xOut,t,col){
  col=col||COL.green; const H=box.bot-box.top, z=(y-box.top)/H, Wcm=5.2;

/* ---- tilting vessel: liquid stays level, spills over the lip (weir flow) ----

function polyArea(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; }
function clipBelow(P,L){ const out=[]; for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length], pin=p[1]>=L, qin=q[1]>=L;
  if(pin) out.push(p); if(pin!==qin){ const u=(L-p[1])/(q[1]-p[1]); out.push([p[0]+(q[0]-p[0])*u,L]); } } return out; }
function vesselWorld(px,py,ang,w,h){ const c=Math.cos(ang), s=Math.sin(ang); return [[-w,0],[0,0],[0,h],[-w,h]].map(([x,y])=>[px+x*c-y*s, py+x*s+y*c]); }

function vesselLevel(px,py,ang,w,h,A){ const P=vesselWorld(px,py,ang,w,h); const lipY=Math.max(P[0][1],P[1][1]);
  const cap=polyArea(clipBelow(P,lipY)); A=Math.min(A,cap); let lo=Math.min(...P.map(p=>p[1])), hi=Math.max(...P.map(p=>p[1]));
  for(let k=0;k<26;k++){ const m=(lo+hi)/2; if(polyArea(clipBelow(P,m))>A) lo=m; else hi=m; }

/* draw a tilted beaker with liquid of area A; fillFn(poly) paints the liquid clip */
function vesselDraw(ctx,px,py,ang,w,h,A,liq,edge){ const V=vesselLevel(px,py,ang,w,h,A), P=V.poly;

/* a falling stream from (x0,y0) with horizontal speed vx (px/s) down to yEnd: parabola */
function stream(ctx,x0,y0,vx,yEnd,col,wid){ if(wid<=0.2) return; const g=1400; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=wid; ctx.lineCap='round'; ctx.beginPath();

function streamX(x0,y0,vx,yEnd){ const t=Math.sqrt(Math.max(0,2*(yEnd-y0)/1400)); return x0+vx*t; }
function lumpPoly(seed,R,n,flat){ const r=rng(seed), out=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, rr=R*(0.75+0.35*r()); out.push({x:Math.cos(a)*rr*1.25, y:Math.sin(a)*rr*(flat||0.7)}); } return out; }
function polyPath(ctx,pts,x,y){ ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(x+q.x,y+q.y):ctx.moveTo(x+q.x,y+q.y)); ctx.closePath(); }

/* ---- filtration rig: beaker lifts, tilts over a glass rod into a filter funnel; flask below ----

/* =====================================================================

    a.grains.forEach(g=>{ if(g.drop) { ctx.beginPath(); ctx.ellipse(g.x,g.y,3.2,4.2,0,0,Math.PI*2); ctx.fillStyle='#fffdf5'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.stroke(); } else { ctx.fillStyle=COL.red; ctx.fillRect(g.x-1.3,g.y-1.3,2.6,2.6); } });
    if(a.kind!=='milk'){ const u=ease(clamp(a.t/1.0,0,1)), back=ease(clamp((a.t-1.9)/0.7,0,1));
      const x=lerp(cx+170,cx+10,u)+back*170, y=lerp(40,194,u)-back*150, tip=a.t>1.05&&a.t<1.9?-0.95:-0.45;
      if(back<1) spatula(ctx,x,y,tip,a.t<1.1?1:clamp(1-(a.t-1.1)/0.6,0,1),'#fff'); }
    else { const u=ease(clamp(a.t/0.9,0,1)), back=ease(clamp((a.t-1.2-a.drops*0.22)/0.6,0,1)); const sq=a.t>1&&back===0?0.5+0.5*Math.sin(a.t*28):0;
      if(back<1) dropper(ctx,cx+4,lerp(60,184,u)-back*190,'#fffdf5',sq); }
    if(a.t>1.9&&a.t<7){ const into=ease(clamp((a.t-1.9)/0.5,0,1))*(1-ease(clamp((a.t-6.4)/0.6,0,1))); const ph=a.t*9;
      const bx=cx+Math.cos(ph)*42, by=lerp(200,410,into)+Math.sin(ph)*5; glassRod(ctx,bx,by,cx+32+Math.cos(ph)*16,by-230); } }

  animLoop(dt=>{
    t+=dt; const dr=+$('#dR').value, lap=Math.round(Math.pow(10,+$('#sR').value)), bh=+$('#hR').value;
    setv($,'dV',dr+' drops'); setv($,'sV',lap+'×'); setv($,'hV',bh+' % down');
    // physics: sub-step so time-lapse stays stable
    const simDt=waiting?dt*lap:dt, n=Math.max(1,Math.ceil(simDt/0.08));
    for(let k=0;k<n;k++) M.forEach((m,i)=>mixStep(m,simDt/n,HM,stirring(i)));
    if(waiting) simT+=simDt; if(act.some(a=>a)) simT=0;
    [0,1,2].forEach(i=>stepAct(i,dt));
    // observations
    if(mixed()&&!act.some(a=>a)){ M.forEach((m,i)=>{ if(!obs.vis[i]&&(m.K.kind!=='solution'||m.dissolvedFrac>0.97)){ obs.vis[i]=m.K.kind==='suspension'?'Yes':'No'; paint(); } }); }
    if(simT>300&&!obs.settle[0]){ obs.settle=M.map(m=>m.K.kind==='suspension'?'Yes':'No'); paint(); }
    springTo(lasX,lasK>=0?CX[lasK]-BW/2-14:CX[0]-BW/2-14,60,13,dt); lasOn.x=approach(lasOn.x,lasK>=0?1:0,8,dt); springTo(lensR,lensK>=0&&mixed()?1:0,90,12,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    line(ctx,0,432,800,432,COL.ink,2.4);
    let beamOut=null;
    CX.forEach((cx,i)=>{ const m=M[i], box={x0:cx-BW/2+3,x1:cx+BW/2-3,top:LT,bot:BOT};
      if(F){ if(filterRigDraw(ctx,F[i],m,cx,dt,NM[i])&&!obs.res[i]){ obs.res[i]=F[i].res>0.05?'Yes':'No'; paint(); } return; }
      mixDraw(ctx,m,box); beakerDraw(ctx,cx,215,432,BW,{grad:{n:4,lab:k=>(k*20)+''}});
      tag(ctx,NM[i],cx,196,COL.ink,{size:13});
      textAt(ctx,['salt','chalk','milk'][i],cx,458,{align:'center',size:12.5,weight:700,color:COL.muted});
      if(lasK===i&&lasOn.x>0.6&&mixed()){ const y=lerp(LT+4,BOT-4,bh/100); beamOut=beamThrough(ctx,m,box,y,lasX.x,cx+BW/2+26,t,COL.green); rect(ctx,cx+BW/2+26,y-22,6,44,COL.ink,'#fff',1.6);
        if(beamOut>0.02) glow(ctx,cx+BW/2+26,y,10+8*beamOut,COL.green,beamOut);
        beamSeen[i]+=dt; if(beamSeen[i]>1&&!obs.beam[i]){ obs.beam[i]=m.K.kind==='solution'?'No':'Yes'; paint(); } }
      drawAct(ctx,i); });
    if(!F&&lasOn.x>0.02){ const y=lerp(LT+4,BOT-4,bh/100); ctx.save(); ctx.globalAlpha=lasOn.x; laserPen(ctx,lasX.x,y,lasOn.x>0.6&&mixed(),COL.green); ctx.restore(); }
    // lens
    if(!F&&lensR.x>0.03&&lensK>=0){ const i=lensK, cx=CX[i]; ctx.save(); ctx.globalAlpha=clamp(lensR.x,0,1);
      lensView(ctx,cx,112,84*clamp(lensR.x,0.3,1.05),cx,LT+55,()=>lensScene(ctx,cx,112,84,M[i],t),{label:'field 200 µm'}); ctx.restore(); }
    if(!F&&(waiting||simT>0)){ tag(ctx,'⏱ '+mmss(simT)+(waiting?' · '+lap+'×':''),740,24,COL.ink,{size:12}); }
    if(!mixed()&&!act.some(a=>a)) textAt(ctx,'Press “Add & stir”',400,300,{align:'center',size:15,weight:700,color:COL.mid});
    ctx.restore();
    setv($,'r1',F?'—':mmss(simT)); setv($,'r2',beamOut===null?'—':Math.round(beamOut*100)+' %');
    setv($,'r3',F?F.map((f,i)=>f.res>0.02?NM[i]:'').filter(Boolean).join(', ')||'none yet':'—');
  });
  /* magnified view: grains at true scale (0.84 px per µm) */
  const LG=(()=>{ const R=rng(5), L=[]; for(let i=0;i<46;i++){ const d=clamp(logn(R,7,0.75),1.5,60); L.push({x:R()*200-100,y:R()*200-100,d,s:R()*6,sh:lumpPoly(i*13+2,1,7,0.85)}); } return L; })();
  const LM=(()=>{ const R=rng(9), L=[]; for(let i=0;i<260;i++) L.push({x:R()*200-100,y:R()*200-100,d:clamp(logn(R,0.6,0.6),0.1,3)}); return L; })();
  function lensScene(ctx,cx,cy,R,m,t){ const k=R/100; ctx.fillStyle=rgba(COL.blue,0.08); ctx.fillRect(cx-R,cy-R,2*R,2*R);
    if(m.K.kind==='suspension'){ const sus=m.P.length?m.P.filter(p=>!p.bed&&p.z>0.4&&p.z<0.7).length/Math.max(1,m.P.length*0.3):0;
      LG.forEach((g,j)=>{ if(j/LG.length>sus) return; const v=stokesV(g.d,2.7)*1e6*k*0.6; const y=((g.y+100+t*v)%200+200)%200-100, x=g.x+Math.sin(t*1.3+g.s)*1.5/Math.sqrt(g.d);
        ctx.save(); polyPath(ctx,g.sh.map(q=>({x:q.x*g.d*k*0.5,y:q.y*g.d*k*0.5})),cx+x*k,cy+y*k); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.muted; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }); }
    else if(m.K.kind==='colloid'){ const n=Math.round(LM.length*clamp(m.drops/20,0,1)); for(let j=0;j<n;j++){ const g=LM[j]; const x=g.x+Math.sin(t*7+j)*1.2+Math.sin(t*3.1+j*2)*0.8, y=g.y+Math.cos(t*6.3+j*1.3)*1.2;
        ctx.beginPath(); ctx.arc(cx+x*k,cy+y*k,Math.max(0.7,g.d*k*0.6),0,Math.PI*2); ctx.fillStyle=COL.mid; ctx.fill(); }
      textAt(ctx,'tiny · jiggling · never settle',cx,cy+R-12,{align:'center',size:10.5,weight:600,color:COL.muted}); }
    else { const left=m.P.filter(p=>p.m>0.02); left.slice(0,3).forEach((p,j)=>crystal(ctx,cx-30+j*30,cy+20,90*Math.cbrt(p.m)*k,0.2*j,COL.red,'cube'));
      textAt(ctx,left.length?'dissolving…':'nothing to see — particles < 1 nm',cx,cy+R-14,{align:'center',size:10.5,weight:600,color:COL.muted}); }
    line(ctx,cx-R*0.6,cy-R*0.72,cx-R*0.6+10*k,cy-R*0.72,COL.ink,3); textAt(ctx,'10 µm',cx-R*0.6+14*k,cy-R*0.72+4,{size:10,weight:700}); }
  return wrap;
}

/* =====================================================================
   5.2 LET US REPRESENT SOLUBILITY GRAPHICALLY
   B = sucrose — reproduces the book's 241 g (40 °C) and 287 g (60 °C).
   A = a salt with a flat curve (potassium chloride data).
   100 g water on a stirred hot plate. Water temperature relaxes to the
   dial (τ 12 s, compressed). Undissolved solid dissolves at
   dm/dt = −k·m^⅔·(S−c)/S; if the solution is over-saturated (cooling),
   solid grows back at the same law — so a 60 °C saturated B cooled to
   40 °C drops 287 − 241 = 46 g of crystals, as in Section 5.3.1.
   The liquid level rises as solute dissolves (density ≈ 1 + 0.0045·w%).
   ===================================================================== */
const SOLU={
  A:{name:'A',tab:[[0,28],[10,31.2],[20,34.2],[30,37.2],[40,40.1],[50,42.6],[60,45.8],[70,48.3],[80,51.3]],col:COL.red,rhoS:1.98,dk:0.0065,kind:'cube'},
  B:{name:'B',tab:[[0,179],[10,190],[20,204],[30,220],[40,241],[50,262],[60,287],[70,320],[80,362]],col:COL.blue,rhoS:1.59,dk:0.0045,kind:'rhomb'},
};
function solS(k,T){ return interpS(SOLU[k].tab,T); }
function hotPlate(ctx,x,y,W,heat,t){
  ctx.save(); ctx.lineJoin='round'; rrect(ctx,x-W/2,y-40,W,40,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
  rect(ctx,x-W/2+10,y-50,W-20,10,COL.ink,mixCol('#ffffff','#ffd9a8',heat),2);
  if(heat>0.02){ ctx.save(); ctx.globalAlpha=clamp(heat,0,1); for(let i=0;i<6;i++){ const xx=x-W/2+24+i*(W-48)/5; heatWave(ctx,xx,y-54,16,-Math.PI/2,COL.yellow,t+i,0.5*heat,2.5); } ctx.restore(); }
  circ(ctx,x-W/2+28,y-20,9,COL.ink,'#fff',2); line(ctx,x-W/2+28,y-20,x-W/2+28+Math.cos(-2.4+heat*3.6)*7,y-20+Math.sin(-2.4+heat*3.6)*7,COL.yellow,2.4);
  circ(ctx,x+W/2-28,y-20,9,COL.ink,'#fff',2); ctx.restore();
}
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Solute</label><div class="toggle-group" id="sol"><button class="toggle-btn active" data-k="A">Compound A</button><button class="toggle-btn" data-k="B">Compound B</button></div></div>
    <div class="control-group"><label>Hot plate <span class="val" id="tV"></span></label><input type="range" id="tR" min="10" max="80" step="1" value="20">
      <div class="toggle-group" style="margin-top:10px"><button class="toggle-btn" id="add10">＋ 10 g</button><button class="toggle-btn" id="add50">＋ 50 g</button><button class="toggle-btn small" id="rst">↺</button></div></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="mark">● Mark point</button><button class="toggle-btn" id="book">Book curves</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Water temp.',COL.ink)}${card('r2','Dissolved',COL.red)}${card('r3','Solid left',COL.muted)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  let k='A', T=20, md=0, ms=0, t=0, book=false, pts=[], acts=[], grains=[], shimmer=0, stir=0;

  $('#mark').onclick=()=>{ const S=solS(k,T), sat=ms>0.3&&Math.abs(md-S)/S<0.02;
    if(!sat){ fb.className='fb warn'; fb.innerHTML='Not saturated yet — solid must be left over. Add more.'; return; }
    pts.push({k,T,S:md}); pts=pts.slice(-16); fb.className='fb ok'; fb.innerHTML=`Saturated: <b>${fmt(md,0)} g</b> of ${k} per 100 g water at <b>${fmt(T,0)} °C</b>.`; paint(); };
  function paint(){ const rows=pts.slice(-6).map(p=>[{v:p.k,c:''},fmt(p.T,0)+' °C',fmt(p.S,0)+' g']); $('#lg').innerHTML=rows.length?logTable(['','Temp.','Solubility'],rows):''; }
  animLoop(dt=>{
    t+=dt; const Tset=+$('#tR').value; setv($,'tV',Tset+' °C');
    T+= (Tset-T)*(1-Math.exp(-dt/12)); stir+=dt*18;
    const S=solS(k,T), Sp=SOLU[k];
    // dissolve / crystallise
    if(ms>0||md>S){ const drive=(S-md)/S; let r=1.6*Math.pow(Math.max(ms,1.5),2/3)*drive*dt; if(r>0) r=Math.min(r,ms); else r=Math.max(r,-(md-S)*0.5); ms-=r; md+=r; shimmer=approach(shimmer,r>0.001?1:0,4,dt);
    }
    else shimmer=approach(shimmer,0,4,dt);
    // spatula actors
    acts.forEach(a=>{ a.t+=dt; if(a.t>1.0&&a.left>0) for(let q=0;q<3;q++){ const m=Math.min(a.left,a.g/60); a.left-=m; grains.push({x:210+(Math.random()-0.5)*16,y:112,vy:40*Math.random(),g:m}); } });
    acts=acts.filter(a=>a.t<2.4);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); ctx.save(); stage(ctx,w,h);
    // beaker on hot plate
    const cx=200, bot=392, BW=210, top=120;
    const wPct=md/(100+md)*100, rho=1+Sp.dk*wPct, Vml=(100+md)/rho + ms/Sp.rhoS*0.6;   // mL
    const lvY=bot-(bot-top)*Vml/500;
    grains.forEach(g=>{ g.vy+=900*dt; g.y+=g.vy*dt; if(g.y>=lvY) g.vy=Math.min(g.vy,170); if(g.y>=bot-6){ g.dead=true; ms+=g.g; } }); grains=grains.filter(g=>!g.dead);
    ctx.save(); ctx.beginPath(); ctx.rect(cx-BW/2+2,lvY,BW-4,bot-lvY); ctx.clip(); ctx.fillStyle=rgba(COL.blue,0.12); ctx.fillRect(cx-BW/2,lvY,BW,bot-lvY);
    // dissolved solute shown as a faint red stipple whose density = concentration
    const Rr=rng(3); const nD=Math.round(md/(k==='A'?0.9:5)); for(let i=0;i<Math.min(nD,160);i++){ const x=cx-BW/2+6+Rr()*(BW-12), y=lvY+4+Rr()*(bot-lvY-8); const jx=Math.sin(t*3+i)*1.2; ctx.fillStyle=rgba(COL.red,0.55); ctx.fillRect(x+jx,y,1.8,1.8); }
    // heap
    const hH=Math.min(70,Math.sqrt(ms/Sp.rhoS)*6), hW=Math.min(BW/2-6,16+Math.sqrt(ms)*6);
    if(ms>0.05){ ctx.beginPath(); ctx.moveTo(cx-hW,bot-2); ctx.quadraticCurveTo(cx-hW*0.4,bot-hH*1.1,cx,bot-hH); ctx.quadraticCurveTo(cx+hW*0.4,bot-hH*1.1,cx+hW,bot-2); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.stroke();
      const R2=rng(8); for(let i=0;i<Math.min(40,ms*1.5);i++){ const u=R2()*2-1, yy=bot-4-R2()*hH*(1-Math.abs(u))*0.9; crystal(ctx,cx+u*hW*0.8,yy,4+R2()*3,R2()*3,COL.red,Sp.kind==='cube'?'cube':'rhomb'); } }
    if(shimmer>0.02){ ctx.save(); ctx.globalAlpha=shimmer*0.7; for(let i=0;i<5;i++){ const x0=cx-hW*0.6+i*hW*0.3; ctx.beginPath(); for(let yy=bot-hH;yy>lvY+10;yy-=4){ const xx=x0+Math.sin(yy*0.12+t*5+i)*4+(bot-hH-yy)*0.08*(i-2); yy===bot-hH?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); } ctx.strokeStyle=COL.red; ctx.lineWidth=1.2; ctx.stroke(); } ctx.restore(); }
    // stirrer bar spinning
    const sa=stir%Math.PI; const sl=30*Math.abs(Math.cos(stir)); rrect(ctx,cx-sl/2-4,bot-9,sl+8,7,3.5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke();
    ctx.restore();
    line(ctx,cx-BW/2+2,lvY,cx+BW/2-2,lvY,COL.blue,2.2);
    beakerDraw(ctx,cx,top,bot,BW,{grad:{n:4,lab:i=>i*100+' mL'}});
    hotPlate(ctx,cx,bot+44,BW+40,clamp((Tset-15)/65,0,1)*(T<Tset+0.5?1:0.3),t);
    labThermo(ctx,cx+BW/2-30,70,bot-44,T,0,100,{step:10,fs:9});
    acts.forEach(a=>{ const u=ease(clamp(a.t/0.9,0,1)), back=ease(clamp((a.t-1.6)/0.7,0,1)); spatula(ctx,lerp(360,212,u)+back*160,lerp(30,112,u)-back*80,a.t>0.95&&a.t<1.6?-0.9:-0.4,a.t<1?1:clamp(1-(a.t-1)/0.5,0,1),'#fff'); textAt(ctx,'+'+a.g+' g',lerp(360,212,u)+back*160+40,lerp(30,112,u)-back*80-14,{size:12,weight:700,color:COL.yellow}); });
    grains.forEach(g=>{ ctx.fillStyle=COL.red; ctx.fillRect(g.x-1.4,g.y-1.4,2.8,2.8); });
    textAt(ctx,'100 g water + '+k,cx,bot+64,{align:'center',size:12.5,weight:700,color:COL.muted});
    // graph
    const G2=graphFrame(ctx,470,60,770,410,[0,80],[0,400],{xs:10,ys:50,xt:'Temperature (°C)',yt:'Solubility (g per 100 g water)'});
    ['A','B'].forEach(kk=>{ const P=SOLU[kk]; const show=book||pts.some(p=>p.k===kk);
      ctx.save(); ctx.strokeStyle=P.col; ctx.lineWidth=2.4; ctx.globalAlpha=book?1:0.25; if(!book) ctx.setLineDash([5,5]);

      if(book) textAt(ctx,'Compound '+kk,G2.X(62),G2.Y(solS(kk,62))-10,{size:11.5,weight:700,color:P.col}); });
    if(book){ [[40,241],[60,287]].forEach(([x,y])=>{ line(ctx,G2.X(x),G2.Y(y),G2.X(x),G2.Y(0),COL.mid,1,[3,3]); line(ctx,G2.X(0),G2.Y(y),G2.X(x),G2.Y(y),COL.mid,1,[3,3]); textAt(ctx,String(y),G2.X(0)+4,G2.Y(y)-3,{size:10,weight:700,color:COL.blue}); }); }

    tag(ctx,satd?'saturated':md>S*1.02?'over-saturated':ms>0.3?'dissolving…':'unsaturated',lx,ly-18,satd?COL.green:COL.muted,{size:11});
    ctx.restore();

  });

/* =====================================================================
   5.3 LET US PREPARE — copper sulfate crystals (Fig. 5.8 a→d)
   Solubility of CuSO₄·5H₂O (g per 100 g water): 20 °C 32, 40 44.6,
   60 61.8, 80 83.8.  25 mL water saturated at 60 °C holds 15.5 g; cooled to
   27 °C it can hold only 9.1 g → ≈ 6.4 g of crystals.
   Cooling: T → T_room with τ (slow 40 min under a watch glass, fast 3 min
   in ice).  Supersaturation σ = (c − s)/s.  New crystals appear at
   B = 3·10⁴ (σ − 0.03)⁷ per s; every crystal grows dL/dt = 0.08 σ mm/s;
   mass 1.14·10⁻³ L³ g comes out of the solution.  Slow cooling keeps σ low
   → ~20 big crystals (~6 mm); ice keeps σ high → ~2000 tiny ones.
   Glass plate: 1.5 mL evaporates; crystals form at the drying rim.
   ===================================================================== */
const CUSO4=[[0,23.1],[20,32],[40,44.6],[60,61.8],[80,83.8],[100,114]];
const CU_BLUE='#2f8fe0';
function cuSol(T){ return interpS(CUSO4,T); }
function cuCol(c){ return mixCol('#eef6fd','#2f7fd0',clamp(c/70,0,1)); }   // c = g per 100 g water
function watchGlassTop(ctx,cx,y,W){ ctx.save(); ctx.beginPath(); ctx.ellipse(cx,y,W/2,10,0,Math.PI,0,false); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><div class="step-row" id="steps"></div></div>
    <div class="control-group" id="g0"><label>Water bath <span class="val" id="bV"></span></label><input type="range" id="bR" min="30" max="90" step="1" value="60">

function buildA4(){
  const wrap=labShell();

    <div class="control-group"><label>Sunshine <span class="val" id="sunV"></span></label><input type="range" id="sunR" min="0.2" max="1" step="0.01" value="0.9">

    <div class="control-group"><div class="result-cards three">${card('r1','Day',COL.ink)}${card('r2','Salt in brine',COL.red)}${card('r3','Salt crystals',COL.green)}</div>
      <div class="fb hidden" id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), fb=$('#fb');
  const RH=0.65, SOL=0.359;
  let t=0, run=false, day=0, Wk=0, Sd=0, Sx=0, fillT=-1, heap=0, rain=null, rake=null, stage3=0, vap=[], bob=spr(0);
  $('#fill').onclick=()=>{ if(fillT>=0&&fillT<3) return; Wk=0; Sd=0; Sx=0; day=0; fillT=0; run=false; setBtn($('#run'),'▶ Days pass',''); $('#run').disabled=true; $('#rake').disabled=true; fb.className='fb hidden'; stage3=0; };

    for(let x=190;x<800;x+=26){ if(x>px0-6&&x<px1+6) continue; line(ctx,x,452,x+10,444,rgba(COL.ink,0.25),1); }
    // sluice pipe + gate
    line(ctx,172,404,px0,404,COL.ink,2); line(ctx,172,416,px0,416,COL.ink,2); const gate=fillT>=0&&fillT<3?1:0; rect(ctx,200,386-gate*16,8,30,COL.ink,'#fff',2);
    if(gate){ for(let k=0;k<4;k++){ const x=176+((t*120+k*16)%54); vec(ctx,x,410,x+10,410,COL.blue,2); } }
    // brine
    const depth=Wk/1000+(Sd/2160)*0.5, ly=bot-depth*dpx, col=mixCol('#d9ecfb','#9ec4e8',clamp(w/26,0,1));
    if(depth>0.0005){ ctx.save(); ctx.fillStyle=col; ctx.globalAlpha=0.8; ctx.fillRect(px0+2,ly,px1-px0-4,bot-ly); ctx.restore(); ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.beginPath(); for(let x=px0+2;x<=px1-2;x+=5){ const y=ly+Math.sin(x*0.05+t*3)*Math.min(1.5,wind*0.25); x===px0+2?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore(); }
    // dissolved salt shown as red specks (density ∝ concentration)
    if(depth>0.002){ const R=rng(12), nD=Math.round(w*6); for(let i=0;i<nD;i++){ const x=px0+6+R()*(px1-px0-12), y=ly+3+R()*(bot-ly-6); ctx.fillStyle=rgba(COL.red,0.5); ctx.fillRect(x+Math.sin(t*2+i)*1.5,y,2,2); } }

    // Baumé hydrometer in a sample cylinder on the bank: it floats higher in denser brine
    { const cx=640+0, cb=top, ct=150, lvl=172; const has=Wk+Sd>0.5; ctx.save(); if(has){ ctx.fillStyle=col; ctx.fillRect(cx-15,lvl,30,cb-lvl-2); } ctx.restore(); if(has) line(ctx,cx-15,lvl,cx+15,lvl,COL.blue,1.8);

/* =====================================================================
   5.5 LET US INVESTIGATE — paper chromatography
   Solvent climbs the paper by capillarity (Washburn): h² = D·t, slowed by
   evaporation from the wet paper: dh/dt = D/(2h) − e·h.
   D: water 0.15, 2 % salt 0.14, alcohol 0.09 cm²/s (water rises ≈10 cm in
   ~11 min).  Each dye travels at its own fraction Rf of the solvent's path
   above the spot, and its band widens ∝ √(distance).  Colours overlap by
   multiplication (subtractive), so the start spot of 4 dyes looks black.
   Spinach pigments do not dissolve in water (Rf 0) — they need alcohol.
   If the solvent is above the spot, the ink dissolves into the pool.
   ===================================================================== */
const DYES={
  ink:[{n:'yellow',c:'#f2c21b',rf:{w:0.92,s:0.86,a:0.62}},{n:'blue',c:'#2f8fe0',rf:{w:0.74,s:0.6,a:0.5}},{n:'red',c:'#e0406a',rf:{w:0.52,s:0.44,a:0.36}},{n:'violet',c:'#6a3fb8',rf:{w:0.28,s:0.22,a:0.18}}],
  green:[{n:'yellow',c:'#f2c21b',rf:{w:0.9,s:0.84,a:0.58}},{n:'blue',c:'#2f8fe0',rf:{w:0.68,s:0.52,a:0.44}}],
  leaf:[{n:'carotene',c:'#f09a1b',rf:{w:0,s:0,a:0.95}},{n:'xanthophyll',c:'#e8d21c',rf:{w:0,s:0,a:0.72}},{n:'chlorophyll a',c:'#2e8f6a',rf:{w:0,s:0,a:0.55}},{n:'chlorophyll b',c:'#7fa82e',rf:{w:0,s:0,a:0.4}}],
};
const SOLV={w:{n:'Water',D:0.15},s:{n:'2 % salt',D:0.14},a:{n:'Alcohol',D:0.09}};
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label>Sample spot</label><div class="toggle-group" id="smp"><button class="toggle-btn small active" data-k="ink">Black ink</button><button class="toggle-btn small" data-k="green">Green food colour</button><button class="toggle-btn small" data-k="leaf">Spinach extract</button></div>
      <label style="margin-top:8px">Solvent</label><div class="toggle-group" id="sol"><button class="toggle-btn small active" data-k="w">Water</button><button class="toggle-btn small" data-k="s">2 % salt</button><button class="toggle-btn small" data-k="a">Alcohol</button></div>
      <label style="margin-top:8px">Solvent depth <span class="val" id="dV"></span></label><input type="range" id="dR" min="0.5" max="3.5" step="0.1" value="1.2"></div>
    <div class="control-group"><label>Time-lapse <span class="val" id="sV"></span></label><input type="range" id="sR" min="0" max="1.7" step="0.05" value="1.3">
      <div class="toggle-group" style="margin-top:10px"><button class="toggle-btn play" id="dip">⤓ Dip the strip</button><button class="toggle-btn" id="out" disabled>Take out &amp; dry</button><button class="toggle-btn small" id="rst">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">${card('r1','Time',COL.ink)}${card('r2','Solvent front',COL.blue)}${card('r3','Colours',COL.green)}</div>
      <div class="fb hidden" id="fb"></div><div id="lg" style="margin-top:8px"></div></div>`;

  let smp='ink', sol='w', t=0, st;

      mixDraw(ctx,m,box); beakerDraw(ctx,cx,215,432,BW);
      textAt(ctx,NM[i],cx,458,{align:'center',size:12.5,weight:700,color:COL.muted});
      if(test===5){ const y=372, on=tt>0.4; laserPen(ctx,box.x0-12,y,on,COL.green); if(on){ const I=beamThrough(ctx,m,box,y,box.x0-12,cx+BW/2+14,t,COL.green); } }
      if(test===2){ const ex=cx-BW/2-26, ey=372; eyeIcon(ctx,ex,ey,1.1,COL.ink); const see=m.K.kind==='suspension'; line(ctx,ex+16,ey,cx+30,ey,see?COL.green:COL.mid,1.4,[4,4]); if(see){ const R=rng(i*3+1); for(let k=0;k<6;k++) circ(ctx,cx-40+R()*80,LT+14+R()*90,5,COL.green,null,1.4); }
        if(tt>1) tag(ctx,see?'grains visible':'nothing visible',cx,196,see?COL.green:COL.muted,{size:11.5}); }
      if(test===0){ // top & bottom drops, then a microscope view of one drop
        const u=ease(clamp(tt/1.4,0,1)); const drop=(y0,dy,zc)=>{ const R=rng(i*7+(zc>0.5?3:1)); const yy=lerp(y0,dy,u); ctx.save(); ctx.beginPath(); ctx.arc(cx+(zc>0.5?30:-30),yy,20,0,Math.PI*2); ctx.fillStyle=rgba(COL.blue,0.1); ctx.fill();
            const bins=mixHaze(m); const hz=bins[Math.min(15,Math.floor(zc*16))]; if(hz>0.01){ ctx.fillStyle=rgba(m.K.haze||'#fff',Math.min(0.9,hz)); ctx.fill(); }
            if(m.K.kind==='suspension'){ const cnt=m.P.filter(p=>!p.bed&&Math.abs(p.z-zc)<0.12&&p.d>10).length; for(let k=0;k<Math.min(40,cnt);k++){ ctx.fillStyle=m.K.edge; ctx.fillRect(cx+(zc>0.5?30:-30)+(R()-0.5)*28,yy+(R()-0.5)*28,2,2); } }
            ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); textAt(ctx,zc>0.5?'bottom':'top',cx+(zc>0.5?30:-30),yy+34,{align:'center',size:10.5,weight:600,color:COL.muted}); };
        drop(LT+10,120,0.1); drop(BOT-10,120,0.9);
        if(tt>1.6){ const a=clamp((tt-1.6)/0.6,0,1); ctx.save(); ctx.globalAlpha=a; const R=rng(i+40); circ(ctx,cx,260,40,COL.ink,'#fff',2.4);
          ctx.save(); ctx.beginPath(); ctx.arc(cx,260,38,0,Math.PI*2); ctx.clip(); ctx.fillStyle=rgba(COL.blue,0.08); ctx.fillRect(cx-40,220,80,80);
          if(m.K.kind==='colloid') for(let k=0;k<70;k++){ circ(ctx,cx+(R()-0.5)*76+Math.sin(t*6+k)*1.2,260+(R()-0.5)*76+Math.cos(t*5+k)*1.2,1.6,COL.mid,COL.mid,1); }
          if(m.K.kind==='suspension') for(let k=0;k<9;k++){ const x=cx+(R()-0.5)*70, y=260+(R()-0.5)*70; polyPath(ctx,lumpPoly(k+i*9,6+R()*9,7,0.8),x,y); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=m.K.edge; ctx.lineWidth=1.4; ctx.stroke(); }
          ctx.restore(); textAt(ctx,'×1000',cx+44,232,{size:10.5,weight:700,color:COL.muted}); ctx.restore(); } }
      if(test===4) tag(ctx,m.K.kind==='suspension'?(simT>600?'settled':'settling…'):'unchanged',cx,196,m.K.kind==='suspension'?COL.red:COL.muted,{size:11.5});
    });
    if(test===1){ // log scale of particle diameter, 0.1 nm → 100 µm
      const x0=80, x1=740, y=120, X=nm=>x0+(Math.log10(nm)+1)/6*(x1-x0);
      ctx.save(); rrect(ctx,x0-30,50,x1-x0+60,120,12); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
      line(ctx,x0,y,x1,y,COL.ink,2.4); [0.1,1,10,100,1000,1e4,1e5].forEach(v=>{ line(ctx,X(v),y-6,X(v),y+6,COL.ink,1.6); textAt(ctx,v>=1000?(v/1000)+' µm':v+' nm',X(v),y+22,{align:'center',size:10.5,weight:600,color:COL.muted}); });
      [[0.1,1,COL.blue,'solution'],[1,1000,COL.green,'colloid'],[1000,1e5,COL.red,'suspension']].forEach(([a,b,c,l],k)=>{ const g=clamp((tt-0.3-k*0.4)/0.6,0,1); if(g<=0) return; ctx.save(); ctx.globalAlpha=g; ctx.fillStyle=rgba(c,0.14); ctx.fillRect(X(a),y-34,X(b)-X(a),28); ctx.restore(); textAt(ctx,l,(X(a)+X(b))/2,y-15,{align:'center',size:11.5,weight:700,color:c,alpha:g}); });
      const tgt=[0.3,5e3,200]; CX.forEach((cx,i)=>{ springTo(sz[i],tt>0.2?Math.log10(tgt[i]):-1,30,8,dt); const xx=X(Math.pow(10,sz[i].x)); line(ctx,cx,215,xx,y+30,COL.mid,1.2,[4,4]); circ(ctx,xx,y+30,5,[COL.blue,COL.red,COL.green][i],'#fff',2.4); });
    }
    if(test===5&&tt>1.2) CX.forEach((cx,i)=>tag(ctx,M[i].K.kind==='solution'?'beam path invisible':'beam path visible',cx,196,M[i].K.kind==='solution'?COL.muted:COL.green,{size:11.5}));
    if(test===4) tag(ctx,'⏱ '+mmss(simT)+' · 120×',720,24,COL.ink,{size:12});
    if(test<0) textAt(ctx,'Pick a test on the right',400,120,{align:'center',size:15,weight:700,color:COL.mid});
    ctx.restore();
    const need=[3,2.5,1.2,0,12,1.5][test]; if(test>=0&&test!==3&&tt>need) fill(test);
  });
  return wrap;
}

const activities = [
  { num:'5.1', title:'Salt, Chalk and Milk in Water', desc:'Mix, look closely, shine a laser, wait, then filter', build: buildA1 },
  { num:'5.2', title:'Solubility Curves', desc:'Heat 100 g of water and dissolve A or B until no more dissolves', build: buildA2 },
  { num:'5.3', title:'Growing Copper Sulfate Crystals', desc:'Saturate hot, filter, cool slowly (or fast), collect', build: buildA3 },
  { num:'5.4', title:'Salt from Seawater', desc:'Sun and wind turn seawater into a saturated brine, then salt', build: buildA4 },
  { num:'5.5', title:'Paper Chromatography', desc:'Let the solvent climb the strip and pull the colours apart', build: buildA5 },
  { num:'5.6', title:'Separating Funnel', desc:'Let oil and water settle, then drain the layers one by one', build: buildA6 },
  { num:'5.7', title:'Sublimation of Camphor', desc:'Heat gently — camphor leaves the sand and deposits on the funnel', build: buildA7 },

];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
